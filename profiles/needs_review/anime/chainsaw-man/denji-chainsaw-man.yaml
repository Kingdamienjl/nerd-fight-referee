- id: claim-weaknesses-0b0ddde3
  section: weaknesses
  axis: weakness
  text: 'Possesses all general weaknesses possessed by Hybrids. As abilities such
    as his innate regeneration and transformation are linked to the amount of blood
    he has in his body,Chainsaw Man Chapter 64 if he''s running low on blood, he will
    be unable to regenerate or maintain his transformation. This isn''t helped by
    the fact that just his transformation will cause him lose a lot of blood due to
    cutting himself with his chainsaws to the point where he''ll get incredibly faint
    and can even pass out after a long battle when reverted back to human form. Likewise,
    his trigger-based regeneration requires him to pull on the cord on his chest in
    order for it to work. Can be manipulated to do favours by money or sexual favours
    from women he finds prettyChainsaw Man Chapter 104Chainsaw Man Chapter 5 even
    if they''re actively trying to kill himChainsaw Man Chapter 47 or he himself knows
    that it''s a honey trap. Furthermore, will actively attempt to save pretty women
