  section: abilities
  axis: hax
  text: '100th Loop= *Superhuman Physical Characteristics *Genius Intelligence *Acausality
    (Type 1 - Negators still remember the past unchanged from the alterations that
    Umas do to the past. See Seal for more information) *Acrobatics *Preparation (Under
    has a multitude of artifacts and Umas to take into battle like Burn) *Enhanced
    Hearing & Smell (Echolocation - While being blindUndead Unluck: Chapter 81, Billy
    was still able to fight Andy and know exactly where he was in battle based off
    sound alone. Billy''s hearing can displayUndead Unluck: Chapter 119 the objects
    with accuracy showing the depth and distance the object is from him. Can also
    tell the difference in heightUndead Unluck: Chapter 214 of those around. He also
    has a keen sense of smellUndead Unluck: Chapter 148 being able to smell Tella''s
    conditioner within a forest) *Limited Subjective Reality & Accelerated Development
    (Training - Battle - Abilities - Andy states "In the end, it''s all a matter of
    how we perceive the rules. So long as we believe in that concept, our abilities
    will develop as much as we wantUndead Unluck: Chapter 45" what this means for
    all Negators is that their own perception of their ability''s use and limits can
    be developed which allowed Andy to develop his Undead ability. Victor also is
    stated that by consciously changing the interpretation of death allows him a multifaceted
    use of his regeneration. This is also something Billy says is "logicUndead Unluck:
    Chapter 82" meaning he too accepts this line of thinking) *Analytical Prediction
    (Superior to Shen who as a fighter is constantly assessing which actions would
    be beneficial to reverse as he considers how his opponent will strike nextUndead
    Unluck: Chapter 59 and reading their strikes trajectoryUndead Unluck: Chapter
    16 but being unable to predict people like Juiz, Andy, and Nico as well) *Quick
    Draw Expert, Revolver User (Billy''s skill in revolvers allows him the ability
    to ricochet bullets and hit his targets to the point it was believed he was using
    a negationUndead Unluck: Chapter 32 to do so) **Limited Danmaku (Billy can ricochetUndead
    Unluck: Chapter 31Undead Unluck: Chapter 17 his bullets off of objects creating
    a harder to read pattern for the bullets) *Law Negation of Fairness, Conceptual
    Manipulation (Type 2 - All negators either negate their own rule or negate the
    rule of othersUndead Unluck: Chapter 3. Billy''s negation is Unfair, this allows
    him to copy the opponents ability based off them viewing him as a threatUndead
    Unluck: Chapter 119. His abilities copied have the same attributes as the real
    thing, meaning all copied abilities also negate the rulesUndead Unluck: Chapter
    32, such as Causality Manipulation, Regeneration, Morality Manipulation, Physics
    Manipulation and others. These rules are considered fundamental or necessary and
    removal of them causes what they rule over to be removed from the world such as
    insects being removed when Uma Insect was killed, this is shown with others as
    well. For a more in depth detailing refer to Uma pages like Seal) **Unconventional
    Soul Manipulation (Unfair can interact with the soul; as negations are stated
    to "dwell within the soul"Undead Unluck: Chapter 159, Negations can also interact
    with one''s soul. To support this more, we know that even when Fuuko is a soul
    her Unluck directs its stroke of unluck not at Andy, but at Andy''s soul as their
    souls touchedUndead Unluck: Chapter 96, meaning Negation abilities can target
    the soul and not just the person. Though this is meant mainly for those who have
    awareness/experience of the soul like Fuuko. In Billy''s case his Negation fundamentally
    interacts with one''s soul even if he is not knowledgeable on souls) **Immortality
