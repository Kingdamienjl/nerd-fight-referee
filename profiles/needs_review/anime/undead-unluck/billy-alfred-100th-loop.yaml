    has a keen sense of smellUndead Unluck: Chapter 148 being able to smell Tella''s
    conditioner within a forest) *Limited Subjective Reality & Accelerated Development
    (Training - Battle - Abilities - Andy states "In the end, it''s all a matter of
    how we perceive the rules. So long as we believe in that concept, our abilities
    will develop as much as we wantUndead Unluck: Chapter 45" what this means for
    all Negators is that their own perception of their ability''s use and limits can
    be developed which allowed Andy to develop his Undead ability. Victor also is
    stated that by consciously changing the interpretation of death allows him a multifaceted
    use of his regeneration. This is also something Billy says is "logicUndead Unluck:
    Chapter 82" meaning he too accepts this line of thinking) *Analytical Prediction
    (Superior to Shen who as a fighter is constantly assessing which actions would
