- id: claim-powers-and-abilities-7dd5b5a0
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Immortality (Type
    1 - Those tasked with going through the loop don''t grow oldUndead Unluck: Chapter
    122) *Acausality (Type 1 - Negators still remember the past unchanged from the
    alterations that Umas do to the past. See Seal for more information) *Acrobatics
    *Cyborgization (Partial - After her fight with Billy, her arm was blown off and
    replaced with a mechanical arm) *Preparation (Has access to the Union''s supply
    of weapons and the Umas they keep around like Spoil) **Rebellion (A superior artifact
    capable of possessing the user or weapons to increase their power) **Aegis Shield
    (A superior artifact capable of withstanding attacks from God) **Spoil *Social
    Influencing (Leadership - Juiz has been leading hundreds of people for her cause
    of defeating God over and over again in every loop. She has mislead and lied to
    people to accomplish her plans) *Space Survival (Was able to stay in spaceUndead
    Unluck, Chapter 101) *Dimensional Travel & BFR (Able to call on Move to transport
    her away to somewhere elseUndead Unluck: chapter 20. She can also command Move
    to bring people to other placesUndead Unluck: Chapter 8) *Limited Subjective Reality
    & Accelerated Development (Training - Battle - Abilities - Andy states "In the
    end, it''s all a matter of how we perceive the rules. So long as we believe in
    that concept, our abilities will develop as much as we want" what this means for
    all Negators is that their own perception of their ability''s use and limits can
    be developed which allowed Andy to develop his Undead ability. Victor also is
    stated that by consciously changing the interpretation of death allows him a multifaceted
    use of his regeneration. This is also something Billy says is "sound logic" meaning
    he too accepts this line of thinkingUndead Unluck: Chapter 82Undead Unluck: Chapter
    45) *Enhanced Senses (Soul Vision - Can see souls) *Limited Fire Manipulation
    & Regeneration Hinderance (The Burn sword can hinder people''s regeneration with
    a weakness for fireUndead Unluck: Chapter 17. It''s burning attribute should be
    comparable to Burn as he made it and he can melt stone and metalUndead Unluck:
    Chapter 32) *Analytical Prediction (Superior to Shen who as a fighter is constantly
    assessing which actions would be beneficial to reverse as he considers how his
    opponent will strike nextUndead Unluck: Chapter 59 and reading their strikes trajectoryUndead
    Unluck: Chapter 16 but being unable to predict people like Juiz, Andy, and Nico
    as well) *Sword Mastery (Can combat Victor in swordplay and scales above Andy
    who is a mastered swordsman) *Master Martial Artist (Able to fight against people
    like Shen and Victor who are masters in Taijutsu and other styles of combat) *Law
    Negation of Self Justice, Conceptual Manipulation (Type 2 - All negators either
    negate their own rule or negate the rule of othersUndead Unluck: Chapter 3. Juiz
    can negate people''s vision of justice forcing them to go against itUndead Unluck:
    Chapter 20 with this working on the fleet of aliens. On different occasions it
    can be from simply causing the fighter to stop fighting to outright trying to
    kill themselves or those around themUndead Unluck: Chapter 32. These rules are
    considered fundamental or necessary and removal of them causes what they rule
    over to be removed from the world such as insects being removed when Uma Insect
    was killed, this is shown with others as well. For a more in depth detailing refer
    to Uma pages like Seal) |-|Resistances= *Cosmic Radiation (Was unaffected in spaceUndead
    Unluck: Chapter 101) *Analytical Prediction (Stated that she and people like Andy
    are able to penetrate Shen''s UntruthUndead Unluck: Chapter 59) *Unconventional
    Soul Manipulation, Power Nullification (Negations are stated to "dwell within
    the soul"Undead Unluck: Chapter 159. Andy states "Unluck dwells in the soul"Undead
    Unluck: Chapter 45. Furthermore removal of one''s soul also is required to nullify
    the effects of their negation as wellUndead Unluck: Chapter 141. So in order to
    interact with one''s negation, a character would also need to have the ability
    to interact with their soul) *Disease Manipulation (Is unaffected by Uma Sick''s
    rule as the body structure is different as a first seat) *Corrosion Inducement
    (Juiz is fineUndead Unluck: Chapter 55 being near Spoil even though Spoil generates
    a spoil fieldUndead Unluck: Chapter 15, this field not being deactivated even
    when Shen uses Untruth on him which specifically targets conscious thoughtsUndead
    Unluck: Chapter 15) *Memory Manipulation & Information Manipulation (Type 1 -
    Negators are excluded from a new Rule''s knowledge such as when Galaxy was added
    and the Negators needed to be informed on its detailsUndead Unluck: Chapter 20.
    Negators also are able to remember removed Rules like Thirst, Insect, Gravity
    and Magma, and we see Victor still remembers the concepts from Galaxy''s introduction
    to the world from the previous loopUndead Unluck: Chapter 16. N'
