- id: claim-weaknesses-6e53e02b
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: {| class="wikitable mw-collapsible
    mw-collapsed" !Notable Attacks/Techniques: |- | *Unjustice: Unjustice allows for
    Juiz to negate other''s vision of justice which forces them to act out any action
    that would be injustice to their justice. The ability also works to certain degrees
    depending on how absolute or dear a vision of justice is to the character. If
    the vision is dear to the character, it may make them commit suicide. Another
    part of the ability is also that outside forces can negate one''s view of justice:
    Against the alien race, Juiz used her ability and it resulted in the alien race
    attacking their own fleet, against Andy and Tatiana, they both went and attempted
    to attack someone who they consider to be a part of their justice or the very
    thing they view as Justice. This is Juiz''s vision of justiceUndead Unluck: Chapter
    21. *Burn Sword: Has a sword crafted from Uma Burn which is a flaming sword. *Uma
    Move: Uma Move is an Uma that can move across space through cracks in space. *Rebellion:
    An artifact that can possess weapons and people greatly enhancing their power
    and granting additional abilities. |} ==Notable Matchups== Victories= |-| Losses=
    |-| Inconclusive= ==References== {{scroll box|content={{reflist|2}}}} ==Notes/Explanations==
