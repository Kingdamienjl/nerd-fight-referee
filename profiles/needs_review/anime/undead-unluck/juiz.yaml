        *Space Survival (Was able to stay in spaceUndead Unluck, Chapter 101) *Dimensional
        Travel & BFR (Able to call on Move to transport her away to somewhere elseUndead
        Unluck: chapter 20. She can also command Move to bring people to other placesUndead
        Unluck: Chapter 8) *Limited Subjective Reality & Accelerated Development (Training
        - Battle - Abilities - Andy states "In the end, it''s all a matter of how
        we perceive the rules. So long as we believe in that concept, our abilities
        will develop as much as we want" what this means for all Negators is that
        their own perception of their ability''s use and limits can be developed which
        allowed Andy to develop his Undead ability. Victor also is stated that by
        consciously changing the interpretation of death allows him a multifaceted
        use of his regeneration. This is also something Billy says is "sound logic"
        meaning he too accepts this line of thinkingUndead Unluck: Chapter 82Undead
        Unluck: Chapter 45) *Enhanced Senses (Soul Vision - Can see souls) *Limited
        Fire Manipulation & Regeneration Hinderance (The Burn sword can hinder people''s
        regeneration with a weakness for fireUndead Unluck: Chapter 17. It''s burning
        attribute should be comparable to Burn as he made it and he can melt stone
        and metalUndead Unluck: Chapter 32) *Analytical Prediction (Superior to Shen
        who as a fighter is constantly assessing which actions would be beneficial
        to reverse as he considers how his opponent will strike nextUndead Unluck:
        Chapter 59 and reading their strikes trajectoryUndead Unluck: Chapter 16 but
        being unable to predict people like Juiz, Andy, and Nico as well) *Sword Mastery
        (Can combat Victor in swordplay and scales above Andy who is a mastered swordsman)
        *Master Martial Artist (Able to fight against people like Shen and Victor
        who are masters in Taijutsu and other styles of combat) *Law Negation of Self
        Justice, Conceptual Manipulation (Type 2 - All negators either negate their
        own rule or negate the rule of othersUndead Unluck: Chapter 3. Juiz can negate
