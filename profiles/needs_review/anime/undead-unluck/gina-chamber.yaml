        \ (Type 2 - All negators either negate their own rule or negate the rule of\
        \ others.Undead Unluck: Chapter 3 Gina's negation negates the change in form\
        \ of anything she touches allowing her to control anything she is in contact\
        \ with. She is also stated to ignore physics.These rules are considered fundamental\
        \ or necessary and removal of them causes what they rule over to be removed\
        \ from the world such as insects being removed when Uma Insect was killed,\
        \ this is shown with others as well. For a more in depth detailing refer to\
        \ Uma pages like Seal), Matter Manipulation (Sub-Atomic - With Unchange Gina\
        \ is able to control things such as air, water and other physical objects\
        \ from having their form changedUndead Unluck: Chapter 81), Forcefield Creation\
        \ (Unchange can also create a barrier of air that can block out any force\
        \ as the barrier is unable to change from impactUndead Unluck: Chapter 8),\
        \ Limited Invisibility (Air arms are invisibleUndead Unluck: Chapter 6), Non-Physical\
        \ Interaction with Unchange (Should be able to pin down shadows as Billy couldUndead\
        \ Unluck: chapter 120), Limited Subjective Reality & Accelerated Development\
        \ (Andy states \"In the end, it's all a matter of how we perceive the rules.\
        \ So long as we believe in that concept, our abilities will develop as much\
        \ as we want\" what this means for all Negators is that their own perception\
        \ of their ability's use and limits can be developed which allowed Andy to\
        \ develop his Undead ability. Victor also is stated that by consciously changing\
        \ the interpretation of death allows him a multifaceted use of his regeneration.\
        \ This is also something Billy says is \"sound logic\" meaning he too accepts\
        \ this line of thinkingUndead Unluck: Chapter 82Undead Unluck: Chapter 45),\
        \ Free Movement (Gina's Unchange makes it possible to walk on air and waterUndead\
        \ Unluck: Chapter 6), Limited Statistics Amplification (Matter can be made\
        \ to unchange, increasing its power and durability like Billy unchanging Andy's\
        \ sword to cut through SpringUndead Unluck: Chapter 91) Resistances:, Unconventional\
        \ Soul Manipulation, Power Nullification (Negations are stated to \"dwell\
        \ within the soul\".Undead Unluck: Chapter 159 Andy states \"Unluck dwells\
        \ in the soul\".Undead Unluck: Chapter 45 Furthermore removal of one's soul\
        \ also is required to nullify the effects of their negation as well.Undead\
        \ Unluck: Chapter 141 So in order to interact with one's negation you would\
        \ also need to have the ability to interact with their soul), Memory Manipulation\
        \ & Information Manipulation (Type 1 - Negators are excluded from a new Rule's\
        \ knowledge such as when Galaxy was added and the Negators needed to be informed\
        \ on its details.Undead Unluck: Chapter 20 Negators also are able to remember\
        \ removed Rules like Thirst, Insect, Gravity and Magma, and we see Victor\
        \ still remembers the concepts from Galaxy's introduction to the world from\
        \ the previous loop.Undead Unluck: Chapter 16 Negators also still hold information\
        \ from things gone like Shen still knowing the Chinese languageUndead Unluck:\
        \ Chapter 57), Madness Manipulation (Type 2 - Apocalypse is able to flood\
        \ one's brain with immense amounts of memories from the past to make F\u016B\
        ko go out of her mind and she recovers shortly after.Undead Unluck: Chapter\
        \ 35 F\u016Bko had previously also withstood the flood of memories from the\
        \ revolver artifact with her seeing God.Undead Unluck: Chapter 29 God's presence\
        \ is described as overwhelming by Billy who also held artifacts.Undead Unluck:\
        \ Chapter 120 Mui, a normal human can also handle using numerous artifacts\
        \ which normally will destroy the mind.Undead Unluck: Chapter 57 Others should\
        \ be capable of this as they have also handle artifacts like Feng, Shen, Billy)"
