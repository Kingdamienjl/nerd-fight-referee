    - field: intelligence
      value: "100t Loop= Average (She is, for the most part, a normal girl with little\
        \ experience in combat and academics) |-| 101st Loop= Genius (Has become an\
        \ exceptional fighter even being able to outperform Feng in combat. She as\
        \ well has lived for over two centuries gaining a large amount of knowledge\
        \ on the world, Umas, and combat overall to the point she's able to create\
        \ strategies on the fly with the Union members. F\u016Bko's own personal knowledge\
        \ on her negation and souls as well has increased immensely to the point she's\
        \ developed her negation beyond it's initial means and able to implement its\
        \ many facets into combat such as utilizing her hair, the environment, timing\
        \ and those around to bring out more of its potential. Her knowledge on souls\
        \ as well has been progressed to the point she can understand ways in which\
        \ soul use can benefit or counter negations such as figuring out that astral\
        \ projection can stop one's negation from physically effecting them or how\
        \ negations target one's soul. As a leader F\u016Bko is impressive in her\
        \ ability to command, communicate, and understand the needs and advantages\
        \ one's negation has. F\u016Bko is also an intelligent scientist as she is\
        \ able to create numerous devices and machines for a lab for Nico to use.Undead\
        \ Unluck: Chapter 135 The artifacts have also given an abundance of information\
        \ throughout history that she can use as well)"
      source_id: vsbattles-fuuko-izumo-undead-unluck
