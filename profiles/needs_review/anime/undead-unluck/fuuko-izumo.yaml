    - field: weaknesses
      value: "F\u016Bko's Unluck is heavily dependent on her degree of affection to\
        \ a person, for those she absolutely hates it will be inactive, for those\
        \ she has slight like for small strokes of bad luck will occur. Due to this,\
        \ F\u016Bko usually has to come to like her target to some degree. This weakness\
        \ is mainly for her physical touch and not for her bullets. {| class=\"wikitable\
        \ mw-collapsible mw-collapsed\" !Notable Attacks/Techniques: |- | *Shin Hakkyoku\
        \ Style: Is a marital arts style created and developed by Feng. Shin Hakkyoku\
        \ incorporates elbow and shoulder strikes as well punches and kicks, focusing\
        \ on powerful, close-range single hit strikes. **Mountain Strike(Hakkai Zanko):\
        \ An ability Fuuko was taught by Shen. Fuuko dashes at the enemy delivering\
        \ a powerful body blow with her upper back and or shoulder. **Lashing Step\
        \ Cannon(Zesshou Hohou): Fuuko dashes forwards at high speeds and delivers\
        \ a powerful punch anywhere on the body. This ability was fast enough to break\
        \ through Void's guard and allowed Fuuko to deliver a strong blow to his face.\
        \ **One Inch Punch: Fuuko uses a form of Kenpo to deliver a powerful short\
        \ range body blow. Its noted that Nico was unable to eat for three days after\
        \ being hit with this ability. **Fuha Renkei - Air Break Multi Burst: Can\
        \ launch three attacks in quick succession against several targets, sending\
        \ them flying into the air. *Bad Arts: A style of fighting that Fuko created\
        \ where she wraps her long hair around her arms to utilize the hair as a means\
        \ to extend her reach and increase Unluck's contact requirement. **Unluck\
        \ Whip: Using her hair to whip at her target, causing Unluck to unfold. **Unluck\
        \ Whip - Dempsey Bad Roll: Similar to Unluck Whip, but combines it with weaving\
        \ and punching in a sideways eight pattern. *Bad Bullets: An ability Fuko\
        \ has developed over the course of the 101st Loop, allowing her to imbue Unluck\
        \ into objects but mainly using it in bullets she's kept close to her for\
        \ centuries to increase the potency of Unluck. This ability can also be fired\
        \ from her soul, firing out a bullet of her soul at people. |} ==Notable Matchups==\
