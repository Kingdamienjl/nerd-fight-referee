    - field: powers_and_abilities
      value: "100th Loop= *Acausality (Type 1 - Negators still remember the past unchanged\
        \ from the alterations that Umas do to the past. See Seal for more information)\
        \ *Preparation *Limited Subjective Reality & Accelerated Development (Andy\
        \ states \"In the end, it's all a matter of how we perceive the rules. So\
        \ long as we believe in that concept, our abilities will develop as much as\
        \ we want what this means for all Negators is that their own perception of\
        \ their abilities use and limits can be developed which allowed Andy to develop\
        \ his Undead ability. This is also something Billy says is \"sound logic\"\
        \ meaning he too accepts this line of thinking. Anno-Un is also privy to this\
        \ line of thinking prior to Andy's discovery of it hereUndead Unluck, Chapter\
        \ 45Undead Unluck, Chapter 39Undead Unluck, Chapter 82) *Law Negation of Luck,\
        \ Conceptual Manipulation (Type 2 - All negators either negate their own rule\
        \ or negate the rule of others.Undead Unluck: Chapter 3 F\u016Bko's negation\
        \ negates one's luck causing unlucky events to occur. This is activated through\
        \ touching a target imbuing them with misfortune. The other aspect of this\
        \ ability is that her fondness/affection for the person will decide the size\
        \ and scale of the unluck.Undead Unluck: Chapter 136 The following are things\
        \ that can occur from her unluck: Devices or vehicles can malfunction,Undead\
        \ Unluck: Chapter 1 lightning randomly strikingUndead Unluck: Chapter 1 her\
        \ target can happen. Things randomly falling out the sky can occur. The ground\
        \ beneath the target can break,Undead Unluck: Chapter 1 crack openUndead Unluck:\
        \ Chapter 15 causing them to fall in, ceilings can breakUndead Unluck: Chapter\
        \ 1 and fall onto you. Meteors can rain down from the sky to attack her opponent.\
        \ She also is able to imagine an unluck that would be \"death\" for someone\
        \ like she did with Andy.Undead Unluck: Chapter 46 These rules are considered\
        \ fundamental or necessary and removal of them causes what they rule over\
        \ to be removed from the world such as insects being removed when Uma Insect\
        \ was killed, this is shown with others as well. For a more in depth detailing\
        \ refer to Uma pages like Seal) **Durability Negation (Her strokes of unluck\
        \ will damage people regardless of what's used such as Andy being damaged\
        \ by a trainUndead Unluck: Chapter 1 hitting him, a box falling on him,Undead\
        \ Unluck: Chapter 1 her uncle getting sprained anklesUndead Unluck: Chapter\
        \ 2) **Summoning (Her Unluck as well can summon stuff that is useful against\
        \ the target as it does for VictorUndead Unluck: Chapter 46) **Unconventional\
        \ Soul Manipulation (Unluck can interact with the soul; as negations are stated\
        \ to \"dwell within the soul\",Undead Unluck: Chapter 159 negations can also\
        \ interact with one's soul. To support this more, we know that even when Fuuko\
        \ is a soul her Unluck directs its stroke of unluck not at Andy, but at Andy's\
        \ soul as their souls touched,Undead Unluck: Chapter 96 meaning negation abilities\
        \ can target the soul and not just the person. Though this is meant mainly\
        \ for those who have awareness/experience of the soul like Fuuko) Resistances:\
        \ *Unconventional Soul Manipulation, Power Nullification (Negations are stated\
        \ to \"dwell within the soul\".Undead Unluck: Chapter 159 Andy states \"Unluck\
        \ dwells in the soul\".Undead Unluck: Chapter 45 Furthermore removal of one's\
        \ soul also is required to nullify the effects of their negation as well.Undead\
        \ Unluck: Chapter 141 So in order to interact with one's negation you would\
        \ also need to have the ability to interact with their soul) *Memory Manipulation\
        \ & Information Manipulation (Type 1 - Negators are excluded from a new Rule's\
        \ knowledge such as when Galaxy was added and the Negators needed to be informed\
        \ on its details.Undead Unluck: Chapter 20 Negators also are able to remember\
        \ removed Rules like Thirst, Insect, Gravity and Magma, and we see Victor\
        \ still remembers the concepts from Galaxy's introduction to the world from\
        \ the previous loop.Undead Unluck: Chapter 16 Negators also still hold information\
        \ from things gone like Shen still knowing the Chinese language.Undead Unluck:\
        \ Chapter 57 One's memories, experiencesUndead Unluck: Chapter 196 are etched\
        \ into ones soul, thus interacting with them would require interacting with\
        \ the soul) *Madness Manipulation (Type 2 - Apocalypse is able to flood one's\
        \ brain with immense amounts of memories from the past to make F\u016Bko go\
        \ out of her mind and she recovers shortly after.Undead Unluck: Chapter 35\
        \ F\u016Bko had previously also withstood the flood of memories from the revolver\
        \ artifact with her seeing God.Undead Unluck: Chapter 29 God's presence is\
        \ described as overwhelming by Billy who also held artifacts.Undead Unluck:\
        \ Chapter 120 Mui, a normal human can also handle using numerous artifacts\
        \ which normally will destroy the mind.Undead Unluck: Chapter 57 Others should\
        \ be capable of this as they have also handle artifacts like Feng, Shen, Billy)\
        \ |-|101st Loop= All previous abilities plus: *Superhuman Physical Characteristics\
        \ *Dimensional Trav"
