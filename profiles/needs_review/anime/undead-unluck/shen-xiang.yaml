    - field: weaknesses
      value: "His Untruth ability only works on people he is fond of, considering\
        \ he takes a liking to strong people, this shouldn't be much of a weakness\
        \ but it should still be mentioned. Untruth's use also becomes less effective\
        \ against those such as Juiz, a fast thinking opponent. {| class=\"wikitable\
        \ mw-collapsible mw-collapsed\" !Notable Attacks/Techniques: |- | *{{Nihongo|Untruth|{{Ruby|\u4E0D\
        \u771F\u5B9F|\u30A2\u30F3\u30C8\u30A5\u30EB\u30FC\u30B9}}|Antur\u016Bsu}}\
        \ - Shen can negate any conscious thought his target has, causing them to\
        \ do the opposite. However, to activate his ability he must become subconsciously\
        \ fond of his target. His ability activates by eye contact and as long as\
        \ he can see his opponent, he can keep the ability activated, thus breaking\
        \ free from his field of vision, would break the target free from Untruth.\
        \ *Master Martial Artist: Shen is a great martial artist being shown as very\
        \ skilled in hand-to-hand combat managing to fight Andy for a while during\
        \ his first confrontation and exchange a few blows with Victor before the\
        \ rest of the Union appears to stop him. when even goes on to create his own\
        \ style of martial arts, Shin Hakkyoku. **Parry: Shen takes up a stance that\
        \ leaves one side of his body heavily guarded and another side vulnerable\
        \ to attacks. When his opponent goes to attack that area he uses Untruth to\
        \ make them attack the other side of his body. He then uses his hands to parry\
        \ the attack. **Mountain Strike(Hakkai Zanko): Shen dashes at high speed towards\
        \ the enemy delivering a powerful body blow, he can use the force of impact\
        \ to knock his opponents into the air. **Gofukusei-Five Point Unsin Star:\
        \ Shen dashes at the enemy almost instantaneously before simultaneously striking\
        \ the head, knee, shoulders, and remaining knee in that order, incapacitating\
        \ them and breaking the bones in the targeted areas. Shen crafted this Shin\
        \ Hakkyoku-Style Secret Technique after thinking of the icon of a star after\
        \ UMA Galaxy's arrival. **Ryusuijin-Drunken Dragon Formation: Shen takes a\
        \ drunken like stance in a relaxed state, and goes into a full counter once\
        \ his opponent hits him, increasing his speed allowing him to deliver a faster\
        \ attack after. **Ryubenda-Dragon Whiplash: Spins in the air and slams down\
        \ on his opponent from above. He used this attack in tandem with Drunk Dragon\
        \ Formation. **Mei No Kyoku-Extremity of Life: A state where one activates\
        \ and joins the eight extremities of life to unlock the ninth extremity of\
        \ life boosting ones power but also shortening their life if used. This form\
        \ easily knocked Feng far and bruised his chest greatly. **Meikaijin-Life-Destruction\
        \ Formation: A stance Shen takes while in Extremity of Life. |} ==Notable\
        \ Matchups == Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}\
