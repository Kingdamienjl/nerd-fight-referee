    - field: weaknesses
      value: 'Zero is reckless, short-tempered, easily provoked and impatient. Dragons
        are the antithesis of The Flower and its byproducts, the Intoners. The regeneration
        of Zero can be permanently disabled if she is harmed by a dragon and she can
        be permanently be killed as well through attacks from dragons or weapons created
        out of them. The resurrection function of The Flower takes a few seconds to
        generate a new body for Zero, and can be temporarily halted should The Flower
        get stabbed when it is in the middle of generating a new body. The Intoner
        Mode is directly proportional to the amount of blood smearing the body of
        an Intoner, and lasts only 15 seconds at most with maximum Blood Gauge. When
        an Intoner uses the Power of Song, their sexual drive skyrockets to unbearable
        degrees. The Power of Song can be countered by either another Power of Song
        of the same magnitude or a voice of the same magnitude released. Notable Attacks/Techniques:
        *Power of Song: The default ability of an Intoner. It allows an Intoner to
        draw on energy from parallel universes in the multiverse for offensive and
        defensive purposes. This power can range from strengthening themselves and
        others, create forcefields, manipulating minds, reanimating the dead, firing
        off blasts of energy, creating living beings from nothing, manipulating animate
        and inanimate objects telekinetically, and more. At higher powers, Intoners
        can summon Watchers, beings of immense power to assist them, and even use
        the Power of Song to mutate dragons to daemons to increase their strength
        at the cost of rational thought of the dragon, where they can only obey the
        Intoner that mutated them. *Intoner Mode: A unique magical ability exclusive
        to the users of the Power of Song. It manifests as a glowing color hue on
        its user. This mode gives its user increased physical characteristics and
        invulnerability at the cost of using their equipped weapon, but substitutes
        the lacking of weapon with the ability to release slashes using nothing but
        claw motions. When in this state, only an Intoner in Intoner Mode can harm
        the user of said state. The only drawback is that Intoner Mode depends on
        the amount of blood the user accumulated on their body, and at maximum Blood
        Gauge, the Intoner Mode lasts for 15 seconds. *Pact: Described as the "The
        most severe forbidden Magic of the Old", Residents of Midgard can use the
        power of the Pact, a contract system between 2 sides (Mostly between a human
        and a non-human). It works through merging the souls of the 2 sides together.
        The human (Or humanoid side) gains immense power in correspondence to the
        entity that they are contracted to, but at the cost of losing something in
        return that is the most valuable to them, where the more powerful the beast,
        the higher the price of the Pact. For Zero, it costed her her adulthood, reverting
        her to a child when she forged the Pact with Mikhail on both Branch B & the
        Story Side, as Zero had the desire to be a reliable adult figure to Mikhail
        due to how much she cared about him, so her adult appearance was the most
        precious thing to her. A common side-effect of the Pact is that if 1 side
        of the Pact-partner gets injured, the other side will share the same pain
        and injuries, and if 1 side dies, the other side will also die and get erased
        from existence, since their souls are merged and bound together, forcing them
        to share the same fate. |-|Sword Skills= *Maximum Spinslash: A powerful 3-hit
        ground combo that is easily cancelled. *Great Spinslash: The heavy sword version
        of Maximum Spinslash. *Sigil Wave: Zero enters a crouched position with her
        sword behind her and charges up, releasing a shockwave directly to her front,
        sending enemies around her flying. *Rising Spinslash: Zero stabs the blade
        into the ground, then jumps up into the air, damaging enemies around her while
        knocking them into the air. This ability is very strong against large groups
        of slow enemies or large boss creatures, due to its high stagger rate. *Sigil
        Burst: Zero stabs the blade into the ground, then shoves it deeper and causes
        many pink sigils to rise around her. Hits surrounding enemies 3 times. *Forward
        Spinslash: Zero swings her blade around her clockwise twice while moving forward
        a few steps. *Sigil Strike: Zero''s blade extends with a massive pink sigil
        as she rears up like swinging a baseball bat, then she slams it horizontally
        into an enemy. *Aerial Assault: Zero performs a short air dash while swinging
        her blade, causing a vertical and horizontal shockwave to extend from her.
        This move is incredibly versatile, being able to damage enemies at a longer
        range than normally possible while moving. *Helmcrusher: Zero abruptly drops
        out of the air, spinning wildly and damaging enemies underneath her. |-|Spear
        Skills= *Forward Charge: Zero pulls the spear up to her side, then runs forward
        with it extended, damaging enemies in her path. When released, Zero thrusts
        forward then arcs backwards with the spear, doing heavy damage in a wide arc'
