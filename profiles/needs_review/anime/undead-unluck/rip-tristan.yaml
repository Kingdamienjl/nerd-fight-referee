- id: claim-powers-and-abilities-38c9cff1
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Acausality (Type 1 - Negators still\
    \ remember the past unchanged from the alterations that Umas do to the past. See\
    \ Seal for more information) *Cyborgization (Partial - Rip's replaced his arm,\
    \ and legs with the Blade Runner artifacts, artifacts used for combat) **Speed\
    \ Enhancement (Can enhance his speed with blade runner) **Flight (Via Blade Runner)\
    \ **Creation (Able to create blades with Blade Runner) **Danmaku **Limited Telekinesis\
    \ (Able to control scalpels telekinetically) *Law Negation of Repair, Conceptual\
    \ Manipulation (Concept Type 2 - Type 3 Negation - At least Mid-High - All negators\
    \ either negate their own rule or negate the rule of others.Undead Unluck: Chapter\
    \ 3 Rip's ability is the negation of repair which negates any and all healing\
    \ techniques applied to wounds he inflicts, working on Ruin's UnruinUndead Unluck:\
    \ Chapter 107 and Andy. This ability will not stop until he is deadUndead Unluck,\
    \ Chapter 23. Furthermore, gaining a better understanding of Unrepair causes any\
    \ new learned ways to heal get negated as wellUndead Unluck: Chapter 109. These\
    \ rules are considered fundamental or necessary and removal of them causes what\
    \ they rule over to be removed from the world such as insects being removed when\
    \ Uma Insect was killed, this is shown with others as well. For a more in depth\
    \ detailing refer to Uma pages like Seal) *Limited Subjective Reality & Accelerated\
    \ Development (Training - Battle - Abilities - Andy states \"In the end, it's\
    \ all a matter of how we perceive the rules. So long as we believe in that concept,\
    \ our abilities will develop as much as we want\" what this means for all Negators\
    \ is that their own perception of their ability's use and limits can be developed\
    \ which allowed Andy to develop his Undead ability. Victor also is stated that\
    \ by consciously changing the interpretation of death allows him a multifaceted\
    \ use of his regeneration. This is also something Billy says is \"sound logic\"\
    \ meaning he too accepts this line of thinkingUndead Unluck: Chapter 82Undead\
    \ Unluck: Chapter 45) *Analytical Prediction (Superior to Shen who as a fighter\
    \ is constantly assessing which actions would be beneficial to reverse as he considers\
    \ how his opponent will strike nextUndead Unluck: Chapter 59 and reading their\
    \ strikes trajectoryUndead Unluck: Chapter 16 but being unable to predict people\
    \ like Juiz, Andy, and Nico as well) *Surgical Expert (His talentUndead Unluck:\
    \ Chapter 175 in being a doctor has shown that he can identify the site of a hemorrhage\
    \ from a mere glance and do a laparotomy in ten minutes, something which can be\
    \ hard to determine sometimes requiring x-ray scans and can take up to an hour\
    \ to do the surgery) Resistances: *Analytical Prediction (Stated that people like\
    \ Andy are able to penetrate Shen's UntruthUndead Unluck, Chapter 59) *Unconventional\
    \ Soul Manipulation, Power Nullification (Negations are stated to \"dwell within\
    \ the soul\"Undead Unluck: Chapter 159. Andy states \"Unluck dwells in the soul\"\
    Undead Unluck: Chapter 45. Furthermore removal of one's soul also is required\
    \ to nullify the effects of their negation as wellUndead Unluck: Chapter 141.\
    \ So in order to interact with one's negation you would also need to have the\
    \ ability to interact with their soul) *Memory Manipulation & Information Manipulation\
    \ (Type 1 - Negators are excluded from a new Rule's knowledge such as when Galaxy\
    \ was added and the Negators needed to be informed on its detailsUndead Unluck:\
    \ Chapter 20. Negators also are able to remember removed Rules like Thirst, Insect,\
    \ Gravity and Magma, and we see Victor still remembers the concepts from Galaxy's\
    \ introduction to the world from the previous loopUndead Unluck: Chapter 16. Negators\
    \ also still hold information from things gone like Shen still knowing the Chinese\
    \ languageUndead Unluck: Chapter 57. One's memories, experiencesUndead Unluck:\
    \ Chapter 196 are etched into ones soul, thus interacting with them would require\
    \ interacting with the soul) *Madness Manipulation (Type 2 - Apocalypse is able\
    \ to flood one's brain with immense amounts of memories from the past to make\
    \ F\u016Bko go out of her mind and she recovers shortly afterUndead Unluck: Chapter\
    \ 35. F\u016Bko had previously also withstood the flood of memories from the revolver\
    \ artifact with her seeing GodUndead Unluck: Chapter 29. God's presence is described\
    \ as overwhelming by Billy who also held artifactsUndead Unluck: Chapter 120.\
    \ Mui, a normal human can also handle using numerous artifacts which normally\
    \ will destroy the mindUndead Unluck: Chapter 57. Others should be capable of\
    \ this as they have also handle artifacts like Feng, Shen, Billy)"
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
