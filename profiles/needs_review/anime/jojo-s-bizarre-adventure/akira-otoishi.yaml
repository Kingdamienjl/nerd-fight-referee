- id: claim-weaknesses-f7a1c305
  section: weaknesses
  axis: weakness
  text: Akira is somewhat overconfident and can slip up due to his pride. Any damage
    taken by Red Hot Chili Pepper will be reflected onto Akira, and his Stand must
    constantly have a supply of electricity to stay alive. The farther Red Hot Chili
    Pepper is from a power source, the faster its power will drain. A thick enough
    insulator, such as rubber, can be used to contain Red Hot Chili Pepper, while
    a vast conductor, such as the ocean, will forcibly disperse it throughout, severely
    damaging it and Akira. This is not lethal for either, however.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
