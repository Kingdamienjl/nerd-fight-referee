power_scale:
  tier:
    text: 10-A, Varies, 8-C with Red Hot Chili Pepper, High 8-C with enough electricity
    source_ids: &id002
    - mediawiki-39742
    confidence: 0.8
  attack_potency:
    text: Athlete level. Varies, at least Building level with Red Hot Chili Pepper
      (When charged up, it could dismember The Hand and fight against Crazy Diamond.
      While not as strong, after slowly powering up for nearly a month, he thought
      he was encroaching Jotaro Kujo's power though admitted to not being quite strong
      enough yet and being confirmed to still be not as strong elsewhere), up to Large
      Building level+ with enough electricity (When charged up on Morioh's electricity,
      Red Hot Chili Pepper overpowered Crazy Diamond)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Varies (Speed is directly proportional to how much energy he has absorbed,
      increasing or decreasing relative to the amount he has drained), at least Relativistic+
      up to Speed of Light (Can travel through wires at the speed of light and is
      completely conscious while doing so, being able to pick and choose where he
      emerges from even at short distances), FTL with enough electricity (His speed
      increases proportional to the amount he absorbs, with enough making him demonstrably
      faster, blitzed The Hand)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Unknown
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Athlete level. Varies, at least Building level, up to Large Building level+
      with enough electricity with Red Hot Chili Pepper
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Athlete level. Varies, at least Small Building level (While weakened, it
      could take numerous blows from The Hand. It can take blows from Crazy Diamond
      who is comparable to it with a moderate charge), up to Large Building level+
      with Red Hot Chili Pepper
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Even after Red Hot Chili Pepper was seemingly destroyed by being
      dispersed throughout the ocean, Akira was able to stay standing, and then infiltrate
      Joseph's boat to carry out his assassination. He was also able to forcibly reset
      his pinky after Josuke broke it, and then use it to play a guitar solo)
    source_ids: *id002
    confidence: 0.8
  range:
    text: 'Standard Melee Range physically. Red Hot Chili Pepper has an effective
      manifestation range of Tens of Kilometers (Can appear all over the town of MoriohJoJo''s
      Bizarre Adventure: Diamond is Unbreakable Chapter 42 and is capable of traveling
      12.5 kilometers away from AkiraJoJo''s Bizarre Adventure: Diamond is Unbreakable
      Chapter 47)'
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Above Average (Akira is a clever and devious fighter who makes intelligent
      use of his Stand, being sure to confront his opponents in areas where electrical
      lines are available to attack them from all sides and so that he has a source
      of power. Besides this, he is an exceptional guitarist and lives up to his boasting
      on that front)
    source_ids: *id002
    confidence: 0.8
