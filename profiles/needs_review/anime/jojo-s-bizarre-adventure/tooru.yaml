        for 30-90 days out of the year, the length of a hibernation and how long between
        each hibernation can vary between individuals. While "pursuing" the Head Doctor
        will activate the ability automatically, if the Stand/User is made to come
        to the target instead, the ability won''t activate,JoJo''s Bizarre Adventure:
        JoJolion Chapter 92 stated multiple times (Though actions that the target
        performs upon their arrival that can be classified as "pursuing" will still
        activate the ability). Abilities that can transcend the logic of the calamities,
        such as the SpinJoJo''s Bizarre Adventure: JoJolion Wonder of U Arc can ignore
        his defenses and can harm him if not outright kill him (Though the characters
        attempting to use them will still be subjugated to the Calamity, making inflicting
        damage still quite dangerous and difficult). The flow of the Calamity can
        be temporarily disrupted if Toru takes heavy damage somehow,JoJo''s Bizarre
        Adventure: JoJolion Chapter 108 though only briefly. Those who know of the
        Stand''s true nature will see its true form, not that of its adopted appearance.JoJo''s
        Bizarre Adventure: JoJolion Chapter 101 Actions that don''t count as "Pursuing"
