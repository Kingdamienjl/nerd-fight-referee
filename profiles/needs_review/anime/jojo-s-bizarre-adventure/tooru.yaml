power_scale:
  tier:
    text: '{{10-A}}, {{Unknown}}, likely {{8-C}} with Wonder of U Name: Toru, also
      known as "Satoru Akefu" Origin: JoJo''s Bizarre Adventure: JoJolion Gender:
      Male Age: Unknown, appears physically 17 to 19, although he is at least 87 years
      old. His alias is stated to be 89 years old. Classification: Rock Human, Stand
      User, Head Doctor & Part-Time Medical Student and Calamity given form.'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Athlete level. Unknown, likely Building level with Wonder of U (Managed
      to block Josuke''s Spin attacks. Doesn''t physically fight, though he attempted
      to strangle KaatoJoJo''s Bizarre Adventure: JoJolion Chapter 108), its primary
      ability ignores conventional durability'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Athletic Human. At least Average Human (Has been shown and stated to walk
      at the speed one would expect of an 89 year old man when in view of someone),
      likely much higher (Has moved like a blur when out of sight,JoJo''s Bizarre
      Adventure: JoJolion Chapter 96 seemingly even blitzing his targets) with Relativistic+
      combat speed and reactions with Wonder of U (Could avoid a point blank attack
      rushJoJo''s Bizarre Adventure: JoJolion Chapter 84 from Soft & Wet, twice,JoJo''s
      Bizarre Adventure: JoJolion Chapter 89 has consistently reactedJoJo''s Bizarre
      Adventure: JoJolion Chapter 105 to Josuke''s attacks with little issue, only
      ever being taken aback when distracted)'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
