    - field: intelligence
      value: "Genius (\xDCbel is a First-Class Mage with incredible talent, such that\
        \ the Great Mage Serie, whose instincts are always correct, passed her as\
        \ a First-Class Mage after a single glance at her, before she had even said\
        \ anything. \xDCbel is a genius who possesses a superhuman visual imagination,\
        \ which allows her to abuse the rules of magic which allow the actualization\
        \ of anything a mage can perfectly visualize. She is somehow able to disregard\
        \ any objective logic that intelligent beings should be unable to escape from\
        \ by acting with her intuition rather than her mind. She is a mage who uses\
        \ magic without actually understanding the principles behind it, allowing\
        \ her to copy and effectively utilize practically any kind of magic if she\
        \ empathizes with a user of said magic. Her ignorance of logic extends to\
        \ the degree that she can ignore regular causal relationships, allowing her\
        \ to perform impossible feats such as cutting a magic rope which was nullifying\
        \ her magic by using the magic which was nullified) Standard Tactics: \xDC\
        bel is an intelligent and calm mage, yet incredibly bloodthirsty given the\
        \ opportunity, lacking any remorse when killing other people. During battle\
        \ she is needlessly cruel, employing strategies such as opting to maim people\
        \ when she kills them rather than just killing them as efficiently as possible,\
        \ or stealing a potentially life-saving item so that her foe dies helplessly.\
        \ Her lack of care extends to beyond just her opponent, as she won't hesitate\
        \ to drag innocent bystanders into battle if it gives her an edge. When fighting\
        \ other mages she tends to start with Sorganeil to seal their ability to fight\
        \ back, but if it isn't an option then her go-to strategy is to close the\
        \ distance and overwhelm her opponent with Reelseiden. She rarely uses ordinary\
        \ offense or defense magics, preferring more specialized offense spells and\
        \ simply avoiding or countering when responding to her opponent."
      source_id: vsbattles-wirbel-frieren-beyond-journey-s-end
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "She finds it difficult to imagine cutting things which are purely meant\
        \ to block magic, such as Ordinary Defense Magic. She is weak to magic that\
        \ has no form as it is difficult to distort it with her imagination. Notable\
        \ Attacks/Techniques: *Superhuman Imagination: \xDCbel's mindset when it comes\
        \ to magic disregards all logical causal relationships and factual reality,\
        \ being described as sheer insanity by the greatest living mages, allowing\
        \ her to perform impossible feats of magic: easily cutting through a magic\
        \ cloak which no spell could ever penetrate; slicing apart magic hair which\
        \ was denser than Offense Magic and more resistant than Defense Magic; and\
        \ shredding magic rope despite it nullifying her magic. *Spell That Slashes\
        \ Almost Anything: Reelseiden: A simple spell that is hard to track, it simply\
        \ cuts anything the caster can truly visualize cutting, and cannot scratch\
        \ anything the caster cannot visualize cutting. This spell is only limited\
        \ to what the caster can visualize, and has a range of several meters to several\
        \ tens of meters. With \xDCbel's superhuman imagination, this spell is the\
        \ ultimate offensive magic. *Spell of Binding: Sorganeil: A powerful binding\
        \ spell, which seals the movements of anything in the caster's direct line\
        \ of sight. Additionally, the target will be unable to control their mana.\
        \ The spell requires the target's full body, including hair, to be in the\
        \ caster's sight. It originally belonged to First-Class Mage Wirbel. *Killing\
        \ Magic: Zoltraak: The first piercing magic in history which was developed\
        \ by a Great Demon who served the Demon King's Army\u2014 Elder Sage of Corruption,\
        \ Qual. It is a magic that can pierce all of mankind's Defensive Magic, including\
        \ equipment imbued with magic resistance, directly eradicating a person's\
        \ body. After Qual was sealed, Zoltraak was heavily studied and analyzed.\
        \ Ultimately, Zoltraak was incorporated into mankind's Magic System to the\
        \ point that today, it is simply considered as Ordinary Offensive Magic. *Ordinary\
        \ Defensive Magic: To counter Zoltraak, this Defense Magic was developed.\
        \ Mages can create hexagonal barriers that possess great resistance against\
        \ magic. However, this spell's defense against physical attacks has hardly\
        \ changed unlike its magical resistance, making it possible to overwhelm the\
        \ spell with sheer mass and force. ==Notable Matchups== Victories: *Satoru\
        \ Gojo (Jujutsu Kaisen) Gojo's profile (Gojo uses the key Present against\
        \ \xDCbel. They start with a distance of 50 meters between them, and both\
        \ have equal speed) Losses: *Boa Hancock (One Piece) Boa's Profile (Speed\
        \ was Equalized.) Inconclusive: ==Notes & References== Category:Characters\
        \ Category:Female Characters Category:Anime Characters Category:Manga Characters\
