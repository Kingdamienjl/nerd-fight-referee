- id: claim-powers-and-abilities-ee5cef25
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Sword Master, Martial Arts (Skilled H2H
    fighter), Surface Scaling (Crawls on the walls of the treehouse and casually scales
    towers without any rocks or bricks to climb. Can hang off of icicles in the Ice
    Kingdom), Acrobatics (Hypermobility, Self-Momentum, and Surface Running; Parkours
    throughout the City of Thieves. Capable of doing triple flips out of his house
    and over people. Can do flips from one handed hand-stands and does large backflips
    across fields alongside Fern. Does several flips off of the Jigglers' noodly arms.
    Can run up vertical surfaces with enough speed), Master Swordsman (Trained by
    Rattleballs), Non-Physical Interaction (Is one with the Grass Sword, which killed
    the manifestation of Finn's fear. Finn was able to make contact with, fight, and
    kill Gladiator Ghosts. Can make contact with Wendy, Booboo, and Georgy), Weapon
    Creation, Size Manipulation, Inorganic Physiology (Is made out of grass), Limited
    Water and Light Manipulation (Uses Water and Light to create his own food via
    photosynthesis, since he can't eat), Self-Sustenance (Type 1; Doesn't need to
    breathe), Body Control (Can grow and stretch his arms), Statistics Amplification
    (His strength increases with his increased size), Transformation (Limited), Plant
    Manipulation (Limited to himself), Regeneration (Low-Mid. Can regrow limbs), Statistics
    Amplification (Can grow into a larger arm that can assist Fern in lifting, striking,
    and more), Non-Physical Interaction, Telepathy (Telepathically speaks to the Ancient
    Psychic Tandem War Elephant), Sound Manipulation, Portal Creation and BFR (Can
    make a portal to the Nightosphere, and can create it under people to force them
    there), Memory Manipulation (For memories that Fern cannot handle, he can lock
    them inside of his mental vault), Imagination Powers provide Finn and Fern with
    Reality Warping, Teleportation, Life Manipulation, Limited Mind Manipulation,
    Pocket Reality Manipulation, Biological Manipulation, Telekinesis, and Probability
    Manipulation. Resistance to Mind Manipulation and Perception Manipulation, Acid
    Manipulation and Electricity Manipulation, Sleep Manipulation, Minor Transmutation,
    Cold Manipulation, Soul Manipulation
  source_ids: *id003
  decisive: true
