    - field: powers_and_abilities
      value: '*Magic *Extraordinary Genius Intelligence *Longevity, possibly Immortality
        (Type 1; Elves lifespans are close to infinite) *Mana Manipulation (Can focus
        mana in specific parts of her body to increase her durability in those areas)
        *Extrasensory Perception (via Mana detection. Can sense curse magic which
        is normally imperceptible and invisible. Can sense the killing intent within
        mana) *Healing (At least Low, Although she can''t use advanced healing, she
        can use some priest magic) *Limited Enhanced Senses (Has magic which grants
        limited x-ray vision) *Information Analysis (Can use magic to diagnose illnesses
        and use her knowledge of said illness to treat it. Can likely use Autopsy
        Magic to discover one''s cause of death. Can decipher the mechanics behind
        magic instantly just by looking at it) *Transmutation (Commoner Magic) *Plant
        Manipulation (Via Flower Beds Magic) *Purification (Type 1 & Type 3; purified
        polluted water. Can restore herself and even entire cities from being transmuted
        into gold) *Stealth Mastery/Invisibility (Passively suppress her magic to
        appear as weak. Can suppress her magic to the point of not being sensed anymore,
        Can use attacks which cannot be perceived by even seasoned mages as magic)
        *Power Mimicry (Copied Mana Strike) *Sealing (Sealed the demon Qual, and removed
        the seal after 80 years. Can cast powerful seals that won''t be undone until
        she perishes) *Ice Magic, Lightning Magic, Fire Magic *Power Nullification
        (Can cast a powerful Anti-Magic spell) *Pocket Reality Manipulation (Via Her
        Suitcase) *Stronger Resistance Negation, Deconstruction/Durability Negation
        (Specifically against demons. Even her normal Soul Track is far superior to
        Standard Offense Magic. She can make it even stronger by increasing the density
        of her magic. Can also use Mana Strike which can even break through Frieren''s
        own magical defenses) *Limited Mind Manipulation and Memory Manipulation (Although
        she isn''t particularly strong with mental magic, she is confirmed to have
        it and be able to use memory magic) *Subjective Reality *Mind Manipulation,
        Memory Manipulation, Paralysis Inducement (Restraint Magic is ineffective
        on Frieren due to her immense magic power and Hypnosis Magic can''t break
        through her mental defense) *Sleep Manipulation (Resisted the effects of a
        curse which put Stark to sleep within a few minutes, for hours) *Limited Transmutation
        (Could think and act when turned into gold, which wasn''t the case for anyone
        else)'
