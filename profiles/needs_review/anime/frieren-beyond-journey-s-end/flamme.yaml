    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: Magic (also known as Spell)\
        \ is the supernatural ability realized through the consumption of onemage's\
        \ mana. Described as a world of visualization, meaning, its manifestation,\
        \ effectiveness, and efficiency depend on the user's ability to visualize.\
        \ If the user can visualize their magic strongly enough, it will manifest\
        \ accordingly; conversely, a lack of visualization can impact its effectiveness.\
        \ And as a mage who has pretty much every grimoire or spell ever known, Serie\
