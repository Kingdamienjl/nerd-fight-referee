    - field: weaknesses
      value: "Shouldn't entirely rely on her Blessing of Sunlight (She still takes\
        \ damage even as her meter increases for each hit.), may be immodest towards\
        \ Rescana, the Headmaster of the Order of Leksheim, & Rank #1. Feats: The\
        \ 3rd Hightest Ranked Member of The Order of Lekseim, Can even use her Magic\
        \ to aid her allies by restoring magical power of her allies, recovering ability\
        \ boost by strengthening magical power & strengthening healing power. Notable\
        \ Attacks/Techniques: *Schock Flamme: Translated from German as Shock Frame.\
        \ Rosalice's Original Ability. Requires 50% Meter. It makes her already powerful\
        \ Hammer Swings even more powerful by engraving Thermal Magic into another's\
        \ magic, & attack from the inside out. *Protection of Sunlight: When Rosalice\
        \ Takes damage, she gains meter as an additional way to do it. However, it's\
        \ harder for her to gain Counter Gauge Blocks for techniques like Fatal Switch\
        \ (Basically a shield that tanks a hit. Requires 2/6 Blocks), Moment Attack\
        \ (Capable of invulnerability that can also counterattack. Requires 3/6 Blocks.),\
        \ & Force Revival (A hard to time counter that counts as a wide backdash.\
        \ Requires 5/6 Blocks.) *Wahrheit: Translated from German as Truth. Rosalice\
        \ uses G\xF6ttin Faust's head to slam into an opponent, & does one of the\
        \ following... *Tugend: Translated from German as Virtue. A Followup Move\
        \ from Wahrheit. Rosalice spins G\xF6ttin Faust, & Slams another shot at her\
        \ opponent. *Stolz: Translated from German as Pride. A Followup Move from\
        \ Wahrheit. Rosalice spins G\xF6ttin Faust, & makes a HUGE swing, sending\
        \ enemies flying. *Streich: Translated from German as Prank. A Followup Move\
        \ from Wahrheit. Rosalice spins G\xF6ttin Faust, & scrapes the ground as she\
        \ Swings as a result. *Seele Granz: Translated from German as Soul Glory.\
        \ As Rosalice Swings horizonally, if she chains with Schock Flamme, she creates\
        \ four orbs of light that shoots in the following order: Top Left. Bottom\
        \ Left. Top Right. Bottom Right. *Himmelfahrt: Translated from German as Ascension.\
        \ Rosalice uses her cloth to throw an opponent into the air as she swings\
        \ G\xF6ttin Faust & impacts excruciatingly hard. *Zermalmen: Translated from\
        \ German as Crush. Air Only. Rosalice makes an impact from above using the\
        \ weight of G\xF6ttin Faust. It's powerful enough to get someone off their\
        \ feet. *Verbrennen: Translated from German as Burn. Rosalice makes a pillar\
        \ of light that can be used afar. She can use this from two differing ranges,\
        \ with the other option being somewhat closer. *Lichtstrafe: Translated from\
        \ German as Light Punishment. Rosalice's Finish Skill. She stops time to transform\
        \ G\xF6ttin Faust into a Powerful Spear of light that gets potentially stronger\
        \ as a result of how close one is to the center of the attack when the opponent\
        \ is hit. Normally it would cause damage on cross range; but in that rare\
        \ case, can overwhelm the opponent in pure holy light & truly annihilates\
