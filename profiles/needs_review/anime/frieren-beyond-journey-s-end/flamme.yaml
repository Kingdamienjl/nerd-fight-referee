    - field: weaknesses
      value: "When casting a spell Frieren's mana detection is interrupted for a fraction\
        \ of a second. Notable Attacks/Techniques: *The Height of Magic: A powerful\
        \ and undetectable telekinetic shockwave that can grip and pin opponents without\
        \ a visible trigger. *Dispelling Magic: Can adapt powerful dispelling magic\
        \ to any witnessed magic Frieren observes. *Human Killing Magic: Zoltraak:\
        \ The first piercing magic in history, developed by Qual, one of the Seven\
        \ Sages of Destruction under the Demon King. It is a piercing attack which\
        \ can negate the protections provided by equipment and defensive magic which\
        \ have resistance to magic attacks. After Qual was sealed, Zoltraak was heavily\
        \ studied and analyzed. Ultimately, Zoltraak was incorporated into mankind's\
        \ magic system to the point that today, it is simply considered as basic offensive\
        \ magic which any competent mage could use. **Demon Killing Magic: Zoltraak:\
        \ Zoltraak was greatly improved by Frieren in a way that's specialized in\
        \ killing demons, making it far more lethal to demons and bypassing their\
        \ resistances to a standard Zoltraak or offensive magic. *Defence Magic: To\
        \ counter Zoltraak, this defensive magic was developed. Mages can create hexagons\
        \ that possess great resistance against magic. However, such complexity proves\
        \ inefficient at blocking strikes from physical matter, but this weakness\
        \ only applies to the controlling of the physical and not the conjuring of\
        \ the physical through magic. *Black Hole Spell: A spell that generates a\
        \ small black hole with an associated accretion disk and gravitational pull.\
        \ *Destructive Lightning Magic: Judradjirum *Hellfire Summoning Magic: Vollzanbel\
        \ *Mana Strike: A dangerous yet simple spell than efficiently concentrates\
        \ mana into a piercing blast. *Spatial Shattering Spell: A wide-ranging esoteric\
        \ spell that appears to shatter space around it. *Puppet Golem Spell: A spell\
        \ that assembles large rock golems that can transmit powerful spells. *Sealing\
        \ Magic: A powerful sealing spell that can seal away opponents as rock for\
        \ 80 years. *Barrier Magic: A spell that forms a lasting magical barrier.\
        \ *Binding Spell: A spell that generates a near-unbreakable mana-infused golden\
        \ rope to bind opponents. *Sacrificial Locking Spell: A binding spell of the\
        \ highest class that won't disappear until the caster perishes. *Diagoldze\
        \ Protection Spell: A spell that protects the target from the effects of Diagoldze.\
        \ **Treasure Chest Analysis Magic: Mik'heit: A spell that can analyze treasure\
        \ chests to see if they are fakes filled with traps or real treasure chests\
        \ full of treasures. **Poison Identification Spell: A spell used to diagnose\
        \ poisons. **Illness Identification Spell: A spell used to diagnose illnesses.\
        \ **Memory Transfer Spell: A spell that can transfer even a century\u2019\
        s worth of memories from one person to another. **Nail Polishing Spell: A\
        \ spell that polishes nails until they shine. **Bronze Statue De-Rusting Spell:\
        \ A spell that polishes and removes rust from bronze statues. **Mold-Killing\
        \ Spell **Handstand Spell: A spell that allows the caster to perform a handstand.\
        \ **Shaved Ice Spell: A spell that allows the caster to generate shaved ice.\
        \ **Tea Warming Spell **Souring Grapes Spell: A spell that turns sweet grapes\
        \ sour. **Lost Item Seeking Spell: Spell that allows the user to seek out\
        \ lost accessoires. **Clothes Transparency Spell: Spell that makes clothes\
        \ transparent. **Swamp Escape Spell: A spell that can remove someone from\
        \ a bottomless swamp. **Stain Removal Spell: A spell that removes stubborn\
        \ old stains. **Bird Capture Spell: A magic that can capture any bird-like\
        \ creature. It has a range of 50 centimetres. ==Notes== ==Statistics== Category:Epyriel"
