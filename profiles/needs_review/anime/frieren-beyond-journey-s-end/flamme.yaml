        \ one of the Seven Sages of Destruction under the Demon King. It is a piercing\
        \ attack which can negate the protections provided by equipment and defensive\
        \ magic which have resistance to magic attacks. After Qual was sealed, Zoltraak\
        \ was heavily studied and analyzed. Ultimately, Zoltraak was incorporated\
        \ into mankind's magic system to the point that today, it is simply considered\
        \ as basic offensive magic which any competent mage could use. **Demon Killing\
        \ Magic: Zoltraak: Zoltraak was greatly improved by Frieren in a way that's\
        \ specialized in killing demons, making it far more lethal to demons and bypassing\
        \ their resistances to a standard Zoltraak or offensive magic. *Defence Magic:\
        \ To counter Zoltraak, this defensive magic was developed. Mages can create\
        \ hexagons that possess great resistance against magic. However, such complexity\
        \ proves inefficient at blocking strikes from physical matter, but this weakness\
        \ only applies to the controlling of the physical and not the conjuring of\
        \ the physical through magic. *Black Hole Spell: A spell that generates a\
        \ small black hole with an associated accretion disk and gravitational pull.\
        \ *Destructive Lightning Magic: Judradjirum *Hellfire Summoning Magic: Vollzanbel\
        \ *Mana Strike: A dangerous yet simple spell than efficiently concentrates\
        \ mana into a piercing blast. *Spatial Shattering Spell: A wide-ranging esoteric\
        \ spell that appears to shatter space around it. *Puppet Golem Spell: A spell\
        \ that assembles large rock golems that can transmit powerful spells. *Sealing\
        \ Magic: A powerful sealing spell that can seal away opponents as rock for\
        \ 80 years. *Barrier Magic: A spell that forms a lasting magical barrier.\
