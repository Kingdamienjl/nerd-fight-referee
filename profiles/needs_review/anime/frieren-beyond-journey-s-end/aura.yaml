        \ the presence of someone using Perfect Unknowable), Statistics Amplification,\
        \ Teleportation (The Ring of Ainz Ooal Gown lets one teleport around Nazarick),\
        \ Magic, Dimensional Storage, Information Analysis (Can roughly determine\
        \ the stats of others), Non-Physical Interaction (Can cause damage to intangible\
        \ and incorporeal targets), Summoning (Can summon various beasts under her\
        \ command), Animal Manipulation (Can tame beasts using Beast Tamer Skills),\
        \ Petrification, Poison Manipulation (Via her Basilisk. Even weak Basilisks\
        \ have poison and a petrifying gaze), Sound Manipulation (Has a necklace that\
