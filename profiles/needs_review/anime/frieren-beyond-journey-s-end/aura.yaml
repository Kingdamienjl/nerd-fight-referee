    - field: weaknesses
      value: "It is out of character for Aura to use most magical abilities outside\
        \ of her signature ability. Notable Attacks/Techniques: |-|Aura's primary\
        \ magic= *Scales of Obedience: Aura\u2019s magic makes her enemies her subordinates.\
        \ She places her and her target\u2019s souls on her scale and weighs the mana,\
        \ whoever has the lesser mana is turned into a puppet by the one with higher\
        \ mana. Their body serves for eternity until they turn to dust, able to serve\
        \ long after they themselves have perished. **Undead Army: As a result of\
        \ her using her magic so much over so many years, Aura has acquired army of\
        \ undead warriors to fight for her. |-|Defensive magic= *Defense Magic: To\
        \ counter Soul Track, this defense magic was developed. Mages can create hexagones\
        \ that possess great resistance against magic. However, they don't have additional\
        \ defense against physical attacks, making it weak against attacks that overwhelm\
        \ with sheer mass. |-|Offensive magic= *Human Killing Magic: Soul Track: The\
        \ first piercing magic in history, developed by Qual, one of the Seven Sages\
        \ of Destruction under the Demon King. It is a magic that can pierce all of\
        \ mankind's defense magics but also equipment imbued with magic resistance,\
        \ directly eradicating a person's body. After Qual was sealed, Soul Track\
        \ was heavily studied and analyzed. Ultimately, Soul Track was incorporated\
        \ into mankind's magic system to the point that today, it is simply considered\
        \ as ordinary offense magic. |-|Magic Visualization= *Magic Visualization:\
        \ Magic as a concept is freeform and allows for anything that the user truly\
        \ believes in and visualizes to be realized. So if a mage believes their magic\
        \ barrier or mana itself is enough to protect them from a magic spell, then\
        \ it will protect them. Mages often times lose or gain powers and abilities\
        \ based on their feelings and beliefs. So if a mage has resistance to ice\
        \ magic, but then suffers from a change in terrain which might help an ice\
        \ magic user, they could lose that resistance in that moment, because of their\
        \ waning confidence. They also momentarily gain powers in much the same way,\
        \ and if they believe they can penetrate or break through something, they\
        \ often times will. ==Notable Matchups== Victories: Losses: Inconclusive:\
        \ {{Discussions|Aura Frieren Beyond Journey27s End|Aura (Frieren: Beyond Journey's\
