    - field: weaknesses
      value: 'One of the weaker guardians when it comes to 1v1 matchups, however she
        can overcome this through summoning beasts. If one escapes Depiction of Nature
        and Society through one of the escape routes, they acquire ownership of the
        World Item. Notable Attacks/Techniques: ===Beasts=== *Amphisbaena: A level
        76 monster. *Avaricious Frog: A level 58 frog monster, nicknamed Gagarpur.
        *Basilisk: A level 74 monster. *Dragonkin: Level 55 wingless, bipedal draconic
        humanoid monsters. *Fenrir: The holy beast, a giant black wolf with bright
        fur and crimson eyes. Affectionately nicknamed Fenny. *Hejinmal: A fat, juvenile
        frost dragon. Hejinmal officially became Aura''s pet after she displayed intimidation
        towards him, making him submit to her. *Hound of the Wild Hunt: A level 77
        monster. *Itzamna: A giant, six legged chameleon-iguana hybrid. Affectionately
        nicknamed Quadracile. *Iris Tyrannus Basileus: A level 71 creature that resembles
        Godzilla. Nicknamed Iris. *Kirin: A level 76, likely equine monster. ===Skills===
        *Unnamed Breath Control Ability: The breath Aura exhales is capable of controlling
        the emotions of anyone who inhales it, such as inducing terror. The composition
        of breath she chooses decides its effect. When combined with her ranger abilities,
        Aura is able to invoke her breath effects on a single target up to two kilometers
        away accurately. *Unnamed Presence Erasure Ability: Makes the user effectively
        undetectable. *Galactic Shot *Immovable Binding Force *Rain Arrow: Fires a
        downpour of arrows on an area. *Shadow-piercing Arrow: An arrow combined with
