  intelligence:
    text: "Genius (\xDCbel is a First-Class Mage with incredible talent, such that\
      \ the Great Mage Serie, whose instincts are always correct, passed her as a\
      \ First-Class Mage after a single glance at her, before she had even said anything.\
      \ \xDCbel is a genius who possesses a superhuman visual imagination, which allows\
      \ her to abuse the rules of magic which allow the actualization of anything\
      \ a mage can perfectly visualize. She is somehow able to disregard any objective\
      \ logic that intelligent beings should be unable to escape from by acting with\
      \ her intuition rather than her mind. She is a mage who uses magic without actually\
      \ understanding the principles behind it, allowing her to copy and effectively\
      \ utilize practically any kind of magic if she empathizes with a user of said\
      \ magic. Her ignorance of logic extends to the degree that she can ignore regular\
      \ causal relationships, allowing her to perform impossible feats such as cutting\
      \ a magic rope which was nullifying her magic by using the magic which was nullified)\
      \ Standard Tactics: \xDCbel is an intelligent and calm mage, yet incredibly\
      \ bloodthirsty given the opportunity, lacking any remorse when killing other\
      \ people. During battle she is needlessly cruel, employing strategies such as\
      \ opting to maim people when she kills them rather than just killing them as\
      \ efficiently as possible, or stealing a potentially life-saving item so that\
      \ her foe dies helplessly. Her lack of care extends to beyond just her opponent,\
      \ as she won't hesitate to drag innocent bystanders into battle if it gives\
      \ her an edge. When fighting other mages she tends to start with Sorganeil to\
      \ seal their ability to fight back, but if it isn't an option then her go-to\
      \ strategy is to close the distance and overwhelm her opponent with Reelseiden.\
      \ She rarely uses ordinary offense or defense magics, preferring more specialized\
      \ offense spells and simply avoiding or countering when responding to her opponent."
    source_ids:
    - vsbattles-ubel-frieren-beyond-journey-s-end
    confidence: 0.6
    notes: auto_repair source extraction
