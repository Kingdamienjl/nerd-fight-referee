    - field: intelligence
      value: "Gifted (Fern is a prodigious mage who impressed Frieren with her exceptional\
        \ control over her mana from the young age of 9. She quickly rose to prominence,\
        \ becoming the youngest ever mage to achieve the highest-possible score on\
        \ the Third-Class Mage exam.Sousou no Frieren, Chapter 37 Under Frieren\u2019\
        s tutelage, Fern rapidly improved through both field experience against monsters\
        \ and demons, and continuous intensive training, leading to her thriving in\
        \ the First-Class Mage Exam. It was in the third test of the First-Class Mage\
        \ Exam that Fern was recognized as a prodigy by the Great Mage Serie, as Fern\
        \ could see through Serie's unstable mana, a feat that not even Lernen, who\
        \ could perceive Frieren's unstable mana, could achieve. This caused Serie\
        \ to ask Fern to be her apprentice, promising to take her to the apex of magic\
        \ that no mage has reached before, and then pass her as a First-Class Mage\
        \ anywaySousou no Frieren, Chapter 58 even when Fern refused. Fern\u2019s\
        \ combat prowess is notable as well: due to her training she only uses the\
        \ most basic of offensive and defensive spells, which has led her to developing\
        \ skills in rapid casting, controlling a multitude of offense spells simultaneously,\
        \ and ultra-long-range shooting undetectable by demons, and she could increase\
        \ the density of Zoltraak with no reduction in speed. Her skills in mana detection,\
        \ long-range sniping, and magical quick-draws even allowed her to pick out\
        \ a specific persons mana out of countless sources and then intentionally\
        \ shoot them in a non-fatal spot from hundreds of meters away. Fern has also\
        \ learned Frieren\u2019s strategy of catching demons off guard by constantly\
        \ suppressing her mana, leading them to underestimate her power\u2014 a skill\
        \ which she learned in under a decade despite it normally requiring over 2\
        \ centuries to master\u2014 and she has arguably mastered part of this skill\
        \ beyond her mentor's capabilities as she can uniquely move while entirely\
        \ suppressing her mana, despite Frieren having suppressed her mana for a millenium,\
        \ although Frieren is superior in concealing the fact that her mana is suppressed.\
        \ Frieren believes that Fern will become an even more famous mage than her,\
        \ despite being the mage who defeated the Demon King) Standard Tactics: Fern\
        \ prefers to fight at a distance where she can fire off spells without putting\
        \ herself in danger, which her flying magic is particularly helpful for. Fern\
        \ has been taught to exclusively use Ordinary Offensive Magic and Ordinary\
        \ Defensive Magic in combat, her fighting style lacks character and shows\
        \ no openings. Her strategy is generally to overwhelm her opponent with a\
        \ saturation attack of multiple high-speed Zoltraaks, making blocking them\
        \ all impossible. If she is outclassed, she may instead fly outside of the\
        \ range of mana detection and snipe her target with an extremely long-ranged\
        \ Zoltraak."
      source_id: vsbattles-heiter
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Like other mages, Fern could be defeated by a skilled warrior that gets
        close enough to her. Notable Attacks/Techniques: *Mana Concealment: Fern has
        been trained to constantly suppress her mana by Frieren for the purpose of
        fooling demons, which are mana-sensitive creatures. Fern''s natural talents
        for mana control mean that in just a few short years, her mana is so stable
        that demons generally cannot see through her facade, with only Great Demons
        managing to do so. Additionally, Fern can completely conceal her own mana
        to make herself undetectable and move while doing so, a feat even Frieren
        cannot replicate. *Demon Killing MagicZoltraak: A spell that was developed
        by the Great Demon Qual as the world''s first piercing magic. The spell fires
        a beam of magical energy that bypasses the magical defenses of spells and
        equipment, making it impossible to guard against. After Qual was sealed, Zoltraak
        was heavily studied by humanity to create counters, and was incorporated into
        humanity''s magic system. Today it is known as "Ordinary Offensive Magic".
        Fern has been taught a specific varient of Zoltraak which specializes in killing
        demons. *Ordinary Defensive Magic: A spell invented to counter the piercing
        properties of Zoltraak, this spell produces a complex barrier that disperses
        magical power. The spell consumes mana very quickly, and therefore cannot
        be maintained over an large area for an extended period of time. As the spell
        is specialized in blocking magic, the spell can be overcome with great physical
        mass. *Flying Magic: A spell that allows the caster to freely fly. This spell
        is inherent to Demons, however within the last several decades it has been
        incorporated into humanity''s magic system and is now standard in basic mage
        training. The spell has a limit on flight speed and altitude.Sousou no Frieren,
        Chapter 27Sousou no Frieren, Chapter 30 *Spell to make clothes clean and spotless:
        A legendary-level spell from the Mythical Era, it causes clothing it is cast
        on to become clean and smell vaguely floral. Fern received this spell as her
        chosen privilege from the Great Mage Serie in order to make laundry a breeze.
        *Spell to Analyze Treasure ChestsMikheit: A spell which informs the caster
        if a treasure chest is a Mimic. The spell is 99% accurate. *Spell that starts
        a fire: A spell that produces a flame for starting a fire. *Spell to remove
        rust from bronze statues: A folk spell that removes the rust from bronze statues.
        *Spell that captures a bird: A powerful folk spell for binding birds. It works
        on anything that broadly resembles a bird, and has a range of 50 centimeters.
        *Spell to map a dungeon: A spell which summons a holographic top-down map
        of a dungeon that the caster is in. The caster can only fill in the map by
        exploring the dungeon. *Spell to make things float: A basic spell that allows
        the caster to make objects float and control them. Anything larger than a
        person can only be made to float for a short period of time.Sousou no Frieren,
        Chapter 6 *Spell that creates mana butterflies: A spell that creates butterflies
        made of mana. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
