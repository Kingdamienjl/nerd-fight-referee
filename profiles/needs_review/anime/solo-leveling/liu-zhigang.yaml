    - field: weaknesses
      value: 'Jeet Kune Do: JKD is a hybrid philosophy of martial arts that teaches
        its practitioners to fight with the moves performed with minimal effort, maximum
        effect, and high speed. It also teaches in its "using no way as way" and "having
        no limitation as limitation" concepts that fighters can use any style they
        can to maximize their effect in fights. Liu Kang follows this teaching in
        battle, and has chosen other styles that suit him including boxing., Wing
        Chun: A Chinese kung fu that is well known for its quick and powerful attacks
        from relaxed stances, much like a calm bamboo stick that is stretched and
        released. This is one of the many fighting styles that inspired the creation
        of JKD., Muay Thai: A Thai martial art that focuses on standing strikes (much
        like Western boxing) and clinches as well as strikes done with the knees and
        shins., Nunchaku: Liu Kang wields a nunchaku as his primary weapon. It is
        a short-range weapon that can be used as a club, a whip and even a strangling
        weapon. Fire Manipulation:, Damage Boost: Liu Kang can enhance his attacks
        with flame, adding the burning heat of his flames to his already powerful
        melee strikes. Combined with his lightning-fast fighting style, he can destroy
        most opponents as he whittles them down with his fire and fists., Teleportation:
        In a burst of flames, Liu Kang disappears from sight before reappearing in
        a chosen location. In his fighting style, teleportation allows him to perform
        surprise attacks from different angles and instantly reposition himself during
        battle. Arguably his most mysterious ability since little to no explanation
        or lore exists to describe it in detail. Still, details about this power can
        be made from his usage of the Dualist variation, which focuses on switching
        between Light and Dark forms to heal or harm. These two are also erroneously
        named Yin and Yang respectively., Light Metamorphosis: In his Light form,
        Liu Kang can shoot damaging orbs of searing light or channel light energy
        (along with an incantation) while in a stance to heal himself. A good representation
        of the taijitu symbol, since his Light form is positive in the form of healing
        but has its opposite effect within it, case in point his damaging Solar Flare
        attack, which is negative., Dark Metamorphosis: In his Dark form, Liu Kang
        can shoot dark fireballs or enter a stance that adds damage to these fireballs.
        Yet another good representation of the taijitu symbol, since his Dark form
        is negative in the form of damaging attacks but has its opposite effect within
        it, case in point his Yang stance that adds damage to these fireballs, which
        is positive. After being killed by Raiden during Outworld''s invasion on Earthrealm,
        Liu Kang''s soul was claimed by the sorcerer Quan Chi and was subsequently
        turned into a revenant: an evil, undead version of a person whose thoughts
        are still their own, but they''ll only serve the Brotherhood of Shadow''s
        leaders: Shinnok and Quan Chi. They resemble their human form and still retain
        their powers, but their skin is pale or grey and there are cracks on it that
        glow with a yellow or reddish glow., Revenants do not appear to age. Even
        after 25+ years, they still resemble their younger selves on the day they
        were killed., As seen in Aftermath, their inner physiology is also affected.
        Just like a rotten corpse, their inner flesh is discolored and the internal
        organs are withered and inactive, indicating the lack of blood and its flow
        in their bodies. Soul Absorption: At some point in his life as a revenant,
        he was able to master Shinnok''s sorcery. With it he was able to absorb his
        past self''s soul and use it to increase his strength. Talisman of the Kafallah
        Warlocks: A talisman as mysterious as its true owners. Liu Kang''s revenant
        used it to unleash a volley of hellish tendrils that wrapped itself around
