    - field: weaknesses
      value: Aside from normal human weaknesses, he is very headstrong and willing
        to place himself in danger., Due to the way his stamina functions, he will
        become slower and weaker as his stamina decreases. All of his active skills
        require mana/MP to activate, and his Stealth skill is especially costly to
        use for longer than a few seconds. When someone approaches him with murderous
        intent, he will be forced into a quest that demands him to kill the person,
        with the penalty for failing or avoiding it being death. Healing potions can
        not be used if the subject is below 10% HP., If he runs out of mana, his soldiers
        will be unable to regenerate. The amount of soldiers he can store is less
        than the amount he can control. His Shadow Exchange has a cooldown of 2 hours.,
