- id: claim-weaknesses-9a7dd05f
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Beru''s attacks *Bam Bam Bam: (Blunt)
    "Hit one bad with club many time." *Kick Kick: (Agile) "Kick one bad with foot."
    *Sing Heal: (Spirit) "Heal HP all friend with woo woo big cheer." As well as healing
    nearby allies, removes limitations to allies'' arm and leg techniques and has
    a chance of temporarily increasing their attack. *Sing Hurt: (Hurt) "Hurt many
    bad with good sing." Beru inflicts great damage by singing, and can also temporarily
    affect foes with Vertigo. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{discussions}} Category:Live a Live Category:Female Characters Category:Club
    Users Category:Cavemen Category:Game Characters Category:Characters Category:Video
    Game Characters Category:Role-playing Characters Category:Bola Users Category:Weapon
    Masters Category:Healers Category:Thieves Category:Accelerated Development Users
    Category:Sound Users Category:Status Effect Users Category:Enhanced Senses Users
    Category:Paralysis Users Category:Animal Users Category:Electricity Users Category:Purification
    Users Category:Statistics Amplification Users Category:Information Analysis Users'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-86653090
  section: abilities
  axis: hax
  text: 'Beru= Superhuman Physical Characteristics, Weapon Mastery (Capable of using
    bola with accuracy), Healing (Can heal allies by cheering on them with Sing Heal),
    Accelerated Development (Shows much greater growth under battle than most playable
    characters in LIVE A LIVE: Mimic Mammet, Hasshe, Uranus, Matsu and Beru all get
    significantly less stats by leveling than him while Pre-training Earthen Heart
    Inheritors, Hasshe, The Prisoner and Matsu cannot develop new moves. Comparable
    in development speed to Oboromaru, Masaru Takahara and the Earthen Heart Inheritor
    who have all showcased feats of superhuman learning speed or prowess), Sound Manipulation
    and Status Effect Inducement (Can inflict great damage to foes with Sing Hurt,
    as well as afflict them with Vertigo), Enhanced Senses (All cavemen in the Prehistoric
    chapter share Pogo''s incredible sense of smell), Resistance to Life Absorption,
    Sense Manipulation, Mind Manipulation (Naturally resists Spirit elemental attacks
    which includes health-draining attacks such as Bloodlust, telepathic attacks such
    as many of Akira''s, Cube''s Packet Loss which attacks the target''s sense of
    hearing and other status effect moves. Note that this only reduces damage suffered
    from these attacks and doesn''t lessen the odds of being afflicted by the statuses
    themselves), Holy Manipulation and Sound Manipulation (Naturally resists Divine
    elemental attacks which also includes sound-based ones such as Pogo''s Big Shout
    or her own Sing Hurt) |-|Items= Sound Manipulation (Thump Drum can harm enemies
    with a painful noise), Electricity Manipulation and Paralysis Inducement (The
    Prickly Stones item electrifies the ground and can paralyze foes), Healing, Purification
    and Statistics Amplification (Fertility Charm can be used to cast healing spells
    that remove status and increase all statistics), Information Analysis (Rock of
    Rocks allows one to scan enemies), Animal Manipulation (The Cola Bottle shoots
    out lizards that deal incredible damage), Resistance to Unholy Manipulation, Darkness
    Manipulation and Sleep Manipulation (The Laughing Mask provides resistance to
    Demonic elemental attacks which includes attacks related to Odio, such as Archon''s
    Mark, as well as general darkness attacks such as Akira''s fear-based attacks
    and Streibough''s Black Abyss, as well as the Sleep status)'
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
