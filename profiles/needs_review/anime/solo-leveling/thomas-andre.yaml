        \ to use for longer than a few seconds. When someone approaches him with murderous\
        \ intent, he will be forced into a quest that demands him to kill the person,\
        \ with the penalty for failing or avoiding it being death. Healing potions\
        \ can not be used if the subject is below 10% HP. | If he runs out of mana,\
        \ his soldiers will be unable to regenerate. The amount of soldiers he can\
