        attacks by perceiving every minute movement his opponents make in slow motion
        and read the trajectory of every attack used against him. Against armies or
        hoards of opponents, he will resurrect those that fall using ''Shadow Extraction''
        to turn them into his soldiers, turning the tides against the enemy. |-|Black
