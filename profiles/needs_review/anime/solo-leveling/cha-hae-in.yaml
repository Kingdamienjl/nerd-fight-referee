        a powerful enemy, if warranted, he will use his control over darkness and
        enter his ''Spiritual Body Manifestation'' form to overwhelm them. This form
        is extremely massive and far more powerful than his normal form, however it
        drains his mana very fast, thus it is used a last resort option. Same as before.
