  speed:
    text: Jinwoo is unfathomably fast and can move at speeds so great that most opponents
      are unable to track his movements. As a testament to this, he was agile enough
      to keep up with Sillad's attacks during their second confrontation and upon
      obtaining his true power, was able to strike at Rakan with such speed that the
      latter didn't even realize that he'd been attacked until after Jinwoo cut off
      one of his legs. * Immense
    source_ids:
    - fandom-solo-leveling-sung-jinwoo
    confidence: 0.75
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: 'Jinwoo is incredibly resilient to physical damage. He was virtually unharmed
      when the Ant King punched him in the face, only sustaining a small cut on his
      lip, and was physically unscathed after Baran smashed him into the ground with
      great force. *Combat Mastery: Jinwoo is a master of melee-based combat and his
      fighting skills are so refined that he can hold his own against enemies with
      far more combat experience than he does with little trouble. This was first
      demonstrated during his battle with Kandiaru in the Double Dungeon; despite
      the fact that his opponent had been alive for hundreds of years and fought against
      numerous opponents in his time, Jinwoo was still able to match him in battle
      and eventually overpower him altogether. Later on, Jinwoo was also able to keep
      up and defend from Sillad''s attacks, despite the fact that the latter had his
      Spiritual Body Manifestation activated and eons of fighting experience under
      his belt, and probably would''ve been able to land a killing blow had Rakan
      not ambushed him from behind. *Agelessne'
    source_ids:
    - fandom-solo-leveling-sung-jinwoo
    confidence: 0.75
