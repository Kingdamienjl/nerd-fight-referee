- id: claim-powers-and-abilities-6845d33a
  section: abilities
  axis: hax
  text: 'Soul Physiology, Fullbringer Physiology, Shinigami Physiology and Hollow
    Physiology (Soul: High-Tier/Fullbringer: High-Tier/Shinigami: High-Tier/Hollow:
    High-Tier), Expert Swordsmanship (Ginjo is an expert in physical combat, allowing
    him to fight relative towards swordsman on the caliber of Ichigo Kurosaki), Enhanced
    Energy Manipulation and Enhanced Energy Projection (Ginjo''s Fullbring, Cross
    of Scaffold can generate and release large blast of condensed spiritual energy
    from its bladeBleach: Chapter 446), Power Absorption and Limited Power Bestowal
    (Cross of Scaffold''s main ability is the absorption and redistribution of power.
    After stabbing someone with his blade, Ginjo can absorb the person''s power and
    abilities, adding them to his own.Bleach: Chapter 459, granting him all the inherent
    abilities from his target, while alongside also giving Ginjo that person''s previous
    Reiryoku as wellBleach: Chapter 470, Ginjo can also redistribute this absorbed
    power to other Fullbringers, granting them increased powersBleach: Chapter 462
    and new abilities for their Fullbring), Limited Empowerment (Ginjo''s emotions
    can drastically increase the attack potency of one of his Getsuga Tensho''s but
    this is something that''s a heavily dependent on the emotional state of Ginjo
    and such isn''t something that''s common to happen within a fightCan''t Fear Your
    Own World: Vol 3: Chapter 23), Cosmic Awareness (Interdimensional; Ginjo can sense
    the ReiryokuBleach: Chapter 473 and Reiatsu of Tsukishima whilst inside a separate
    pocket dimension created by YukioBleach: Chapter 464), Limited Power Nullification
    (Reiryoku can null the abilities and techniques of those massively weaker than
    Ginjo), Limited Resistance to Extrasensory Perception when using Bringer Light
    ( 2 Layers; Using Bringer Light makes the user harder to sense via Reikaku, due
    to the fact it disturbs the surrounding reiatsu and reishi to a minimal degreeBleach:
    Chapter 432, Can''t Fear Your Own World: Vol 3: Chapter 239)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
