- id: claim-powers-and-abilities-fb3efa2a
  section: abilities
  axis: hax
  text: '*Soul Physiology and Fullbringer Physiology (Soul: High Tier/Fullbringer:
    High Tier) *Expert Swordsman (Tsukishima''s proficiency with melee combat is surprisingly
    deep, being able to fight on par with other expert swordsman likeBleach: Chapter
    472 Byakuya Kuchiki before he inserted himself into Byakuya''s past, this level
    increases depending on the opponent Tsukishima''s fighting, if Tsukishima is fighting
    someone whose more skilled than him in melee combat he can insert himself into
    their past and make it so he trained alongside the opponent, causing him to gain
    equal level of skill as that opponent) *Past Manipulation (Tsukishima''s Fullbring,
    Book Of The End''s main ability is the insertion and manipulation of something''s
    past, this extends to organicBleach: Chapter 456 and inorganicBleach: Chapter
    468 objects, such as humans and stone structures, this insertion allows Tsukishima
    to go into the past of these things and manipulate them, causing different effects
    and outcomes to happen within the present depending on what he does in the past,
    such as inserting himself into the past of people, he can create false memories
    of him being a friend, lover or family member of that personBleach: Chapter 454,
    causing those people to see Tsukishima as those things while in the present, with
    inorganic objects he can do stuff like inserting himself into the past of that
    object and manipulate the size, structure and layout of the object, allowing him
    to do things like create barriers to block attacks instantaneously in the present)
    *Memory Manipulation, Mind Manipulation and Madness Manipulation (Type 2 - Tsukishima
    can create false memories and manipulate pre-existing memories of those he has
    cut with Book of The End, He can do this to the point of complete mental destruction
    through implantingBleach: Chapter 462 too many false memories inside his opponent''s
    head) *Retrocognition and Clairvoyance (Tsukishima can glean the "thickness" of
    someone''s past through eyesight alone with Book of The EndCan''t Fear You Own
    World: Vol 2: Chapter 14 while he can fully see and understand the past of someone
    through cutting them with Book of The End) *Limited Reactive Power Level (Tsukishima
    can instantly make himself as strong and skilled as his opponent through cutting
    them and inserting himself into their past with Book of The End) *Information
    Analysis (Tsukishima can uncover all the weaknessesBleach: Chapter 469 And powers
    of his opponent through cutting them and inserting himself into their past with
    Book of The End) *Power Nullification (Tsukishima can negate abilities that affect
    him in the present through inserting himself into its past and making it so that
    he wasn''t affected by it in the first place Can''t Fear Your Own World: Vol 2:
    Chapter 15) *Resistance to Extrasensory Perception when using Bringer Light (2
    Layers; Using Bringer Light makes the user harder to sense via Reikaku, due to
    the fact it disturbs the surrounding reiatsu and reishi to a minimal degreeBleach
    Chapter 432, Bleach Can''t Fear Your Own World Chapter 9)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
