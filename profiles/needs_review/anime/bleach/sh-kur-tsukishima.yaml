      value: "Superhuman Physical Characteristics, Enhanced Senses / Extrasensory\
        \ Perception (Everyone who uses Reiatsu can see/sense souls and their Reiatsu),\
        \ Sword Mastery (Very proficient in melee combat), Soul Manipulation / Non-Physical\
        \ Interaction / Matter Manipulation / Statistics Amplification / Surface Scaling\
        \ / Physics Manipulation with Fullbring (The basic ability of a Fullbring\
        \ is the manipulation of souls that reside within objects, which allows them\
        \ to do various things, like use increase their speed, control and move on\
        \ water, alter characteristics of objects like their size, and in some cases\
        \ even change the laws of physics), Causality Manipulation / Memory Manipulation\
        \ / Mind Manipulation / Madness Manipulation / Reactive Power Level / Clairvoyance\
        \ / Information Analysis with Book of the End (Book of the End's ability is\
        \ the insertion and manipulation of something's past, being able to affect\
        \ both people and objects, which allows Tsukishima to go into the past of\
        \ these things and manipulate it to his liking, causing different effects\
        \ and outcomes to happen in the present depending on what he does in the past.\
        \ When he inserts himself into the past of people, he can create false memories\
        \ of him having been a friend, lover or family member of said person, causing\
        \ them to see Tsukishima as those things in the present, as well as being\
        \ able to induce complete mental destruction through implanting too many false\
        \ memories inside his opponent's head. When used with inorganic objects, he\
        \ can insert himself into the past of that object to manipulate its size,\
        \ structure and layout, allowing him to do things like create barriers to\
        \ block attacks instantaneously in the present. In addition, Tsukishima can\
        \ also insert himself into his enemy\u2019s past to make it so he trained\
        \ alongside them and thus gain all training they had undergone, which allows\
        \ him to fully learn all their weaknesses and powers by understanding their\
        \ entire past. Other uses include being able to glean the \"thickness\" of\
        \ someone's past through eyesight alone as long as he holds Book of the End\
        \ and negate abilities that affect the present by inserting himself into their\
        \ past to make it so that effect didn\u2019t happen in the first place which\
        \ allowed him to overwrite Yhwach\u2019s Almighty), Pain Tolerance (After\
        \ losing his arm, he only showed moderate pain while staying calm. Even after\
        \ Byakuya blew a hole in his chest, he hardly reacted to the damage, and he\
        \ still was able to make a surprise attack on Ichigo and wander the forest\
        \ for 10 minutes with the hole), Resistance to Extrasensory Perception (A\
        \ Fullbringer\u2019s power can\u2019t be detected due to their lack of spiritual\
        \ particle fluctuation), Corruption (Type 2) / Death Manipulation / Poison\
        \ Manipulation / Statistics Reduction (Due to not being a Quincy, he should\
