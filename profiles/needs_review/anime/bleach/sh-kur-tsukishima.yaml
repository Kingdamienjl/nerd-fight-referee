        \ of him having been a friend, lover or family member of said person, causing\
        \ them to see Tsukishima as those things in the present, as well as being\
        \ able to induce complete mental destruction through implanting too many false\
        \ memories inside his opponent's head. When used with inorganic objects, he\
        \ can insert himself into the past of that object to manipulate its size,\
        \ structure and layout, allowing him to do things like create barriers to\
        \ block attacks instantaneously in the present. In addition, Tsukishima can\
        \ also insert himself into his enemy\u2019s past to make it so he trained\
