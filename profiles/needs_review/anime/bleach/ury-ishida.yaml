    - field: powers_and_abilities
      value: "Soul Physiology & Quincy Physiology (Soul: High-Tier/Quincy: Sternritter-Tier),\
        \ Master Archer & Expert Swordsman (Uryu's an extremely skilled and experienced\
        \ archer, he's capable of preciously destroying multiple, small, flying objects\
        \ at the same time from a far away distance. He's also shown himself a capable\
        \ swordsman, he's able to clash with on equal footing against other expert\
        \ swordsman like Cirucci Sanderwicci), Danmaku (With Licht Regen; Uryu can\
        \ release hundreds of Heilig Pfeil's from his Heilig Bogen with this technique),\
        \ Sealing (With Gritz; After reciting a motto, Uryu's capable of sealing someone\
        \ within a Reishi-constructed barrier with this technique), Homing Attack\
        \ (Uryu's Heilig Pfeil's are capable of homing onto their target), Explosion\
        \ Manipulation & Instinctive Reactions with Anti-Arrancar Mine (Uryu has access\
        \ to Anti-Arrancar Mines, explosives created by Mayuri Kurotsuchi that automatically\
        \ activate after they've sensed an Arrancar's Reiatsu), Healing with Styptic\
        \ (Uryu can inject himself with a Styptic to stop blood flow to a specific\
        \ damaged area of the body), Statistics Amplification, Absorption, Matter\
        \ Manipulation (Macro-Quantum), Damage Boost, Transformation, Aura (Explosive)\
        \ & Fire Manipulation with Letz Stile (After releasing his Sanrei Glove, Uryu\
        \ activates \"Letz Stile\", a state of power that transform's Uryu's physical\
        \ attire, its main function is to push a Quincy's ability to deconstruct,\
        \ manipulate and absorb Reishi to its utmost limit, while in this form Uryu's\
        \ active manipulation of Reishi becomes passive to him, causing everything\
        \ Reishi around him to deconstruct and be absorbed into Uryu. This is then\
        \ condensed into pure Reishi which is constantly ejected from Uryu's shoulder.\
        \ Because of the increase amount of Reishi Uryu can absorb and manipulate,\
        \ his physical stats are greatly increased), Durability Negation, Vibration\
        \ Manipulation & Limited Size Manipulation with Seele Schneider (Uryu has\
        \ access to Seele Schneider's, weapons which act similarly to chainsaws, vibrating\
        \ at a staggering 3,000,000 rotations per second, because of this level of\
        \ rotation it causes the bonds between Reishi to loosen, making it easier\
        \ for Uryu to absorb and manipulate that Reishi. He's also capable of absorbing\
        \ Reishi into Seele Schneider, increasing the length and attack power of the\
        \ weapon tremendously), Limited Power Nullification with Still Silver Arrow\
        \ (The Still Silver Arrow allows Uryu to momentarily nullify the abilities\
        \ of those who used the Aushwahlen to create the material the arrow is made\
        \ of, which he used on Yhwach), Causality Manipulation, Damage Transferral,\
        \ Attack Reflection, Enhanced Healing & Durability Negation with \"A\" - The\
        \ Antithesis (Uryu's capable of completely reversing anything which has \"\
        already happened.\", for instance, he's capable of \"reversing\" the \"damage\"\
        \ he has taken and applying it onto another object, causing that object to\
        \ retain the damage Uryu previously had while Uryu gains the previous \"state\"\
        \ of that object. Uryu can indirectly heal himself if he \"reverses\" the\
        \ \"damage\" on his body onto another object which is undamaged, can bandage\
        \ wounds with his attire), Resistance to Absolute Zero (Far superior to \xC4\
        s N\xF6dt who resisted Rukia's Shikai with Blut Vene), Paralysis Inducement\
        \ (Ranso Tengai allows Quincy to freely manipulate their bodies using spirit\
        \ energy if their bodies would be inflicted with great physical harm or paralysis),\
        \ Power Absorption & Life Manipulation (Is the only Quincy to not only survive\
        \ Ausw\xE4hlen, but also retain all of his powers. Auswahlen kills and takes\
        \ the powers of the target)"
      source_id: character-stats-profiles-ury-ishida-bleach
