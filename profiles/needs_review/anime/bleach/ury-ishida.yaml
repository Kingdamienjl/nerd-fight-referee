  intelligence:
    text: Genius (Uryu is well-trained in both body and mind, having substantial athletic
      abilities and a genius intellect. He uses his intelligence to find weak points
      in his opponents, even overcoming the disadvantages he has through thinking
      on his feet. Due to keeping his physical abilities at their peak, Uryu can easily
      hold out against all but the most resilient opponents during a battle. He can
      deduce Ichigo's spiritual level, that Ichigo acquired his Soul Reaper powers
      in mid-May and Rukia Kuchiki's real identity.)
    source_ids: *id002
    confidence: 0.8
