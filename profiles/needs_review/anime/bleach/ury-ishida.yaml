        \ on the likes of Zaraki's power, as he makes the eyepatches, so Letz Stil\
        \ may potentially surpass Zaraki), at most Large Country level (Uryu can make\
        \ his arrows 3x stronger, which are capable of simultaneously piercing through\
        \ Mayuri and his Bankai) | At least Large Country level (Stronger than before\
        \ after regaining his powers), higher with Seeleschneider and Anti-Arrancar\
        \ Mines (Uryu with Seeleschneider dominates and defeats Resurreccion Cirucci,\
        \ who could render Uryu's arrows useless. He burnt Yammy severally with the\
        \ Anti-Arrancar Mines when his arrow barely pierced Yammy), at least Continent\
        \ level with Sprengen (Sprengen combines the energy of five Seeleschneider\
        \ into a single explosion that would have critically wounded Szayelapporo\
        \ had he not diffused the blast) | At least Moon level (Uryu's arrows are\
        \ stronger than Quilge's. Yhwach has faith in Uryu's power being impressive\
        \ to the Sternritter. Uryu's arrows pierced a casual True Shikai Ichigo while\
        \ none of the Bambis able to harm that Ichigo), higher with Blut Arterie (Blut\
        \ provides a Bankai level increase which is 5x) | At least Multi-Solar System\
        \ level (After Yhwach reawakens his eyes, Uryu got a significant power boost\
        \ and was able to overcome Senjumaru's Bankai, eventually killed her with\
        \ single arrow), up to Multi-Galaxy level with Vollst\xE4ndig (Stronger than\
        \ Vollstandig Liltotto. Was able to clashes with True Shikai Ichigo, physically\
        \ kept up with Ichigo and landed several damages to the point Uryu eventually\
        \ blowed a hole at Ichigo's body and forced Ichigo to be healed by Orihime,\
        \ albeit if this Ichigo was holding back or not), higher with Sklaverei"
