power_scale:
  tier:
    text: At most 7-B physically, at most 6-B with Heilig Pfeil, higher with Letz
      Stile, at most High 6-B with Strongest Attacks
    source_ids: &id002
    - mediawiki-34193
    confidence: 0.8
  attack_potency:
    text: 'At most City level+ physically (Uryu and the others contributed roughly
      equal portions of their ReiryokuBleach, Chapter 80: "The Shooting Star Project"into
      the ReishukakuBleach, Chapter 84: "The Shooting Star Project 2 (Tattoo on the
      Sky)" enabling them to survive the shaking of the entire Seireitei, albeit Ichigo
      is implied to have contributed somewhat more than UryuBleach, Chapter 85: "INTRUDERZ
      (Breakthrough the Roof Mix)"56.26742 Megatons), at most Country level with Heilig
      Pfeil (Able to pierce and destroy Mayuri''s handBleach, Chapter 121: "In Sane
      We Trust"38.94478 Teratons), higher with Letz Stile (Letz Stile drastically
      amplifies Uryu''s stats, and he was able to take Mayuri''s arm off with a single
      arrow. Mayuri claims he''s never seen spiritual pressure like it, and Mayuri
      should be informed on the likes of Zaraki''s power, as he makes the eyepatches,
      so Letz Stile may potentially surpass Zaraki), at most Large Country level with
      Strongest Attacks (He can make his Heilig Pfiel 3x stronger, which are capable
      of simultaneously piercing through Mayuri and his BankaiBleach Official Character
      Book SoulsBleach, Chapter 126: "The Last of a Void War" with ease116.83436 Teratons)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Hypersonic (Comparable to Chad, outsped 4th seat Jirobo and moved
      faster then Orihime could perceiveBleach Chapter 89Bleach Chapter 91Mach 7.4139
      or 2542.961 m/s), higher with Hirenkyaku (Hirenkyaku is considered a high speed
      technique, implying a speed increase when usedBleach Chapter 122Bleach Chapter
      243), far higher with Letz Stile (Blitzed Mayuri Kurotsuchi multiple timesBleach
      Chapter 125)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Above Average Human (Stronger than your average human)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At most City level+ (Comparable to his Attack Potency)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: 'At most Country level (Should be comparable to his Attack Potency, Mayuri
      felt the need to use cheap tricks to harm himBleach, Chapter 122: "Don''t Lose
      Your Grip"), higher with Letz Stile'
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (He can fight even when wounded seriously)
    source_ids: *id002
    confidence: 0.8
  range:
