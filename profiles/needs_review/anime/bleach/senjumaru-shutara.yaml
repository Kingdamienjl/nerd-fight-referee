        in technology even compared to him.Bleach: Thousand-Year Blood War, Episode
        8: "The Shooting Star Project (ZERO MIX)" Her sewing prowess is shown in her
        creation of the Shihakusho, which was how she was accepted into Squad 0Klub
        Outside Q&A #389, and the creation of Oken clothing, which allows one to breach
        the layers of the Soul Shield Membrane.Bleach: Thousand-Year Blood War, Episode
        21: "The Headless Star" She can also create perfect illusions with her cloths
        and make lifelike dolls, in addition to sewing tools such as umbrellas mid-battle.
