    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Extraordinary Genius (Long before the Gotei 13 had founded it''s research
      and development unit, Senjumaru was the leader of a group of scientists, and
      was the superior of Mayuri Kurotsuchi.Klub Outside Q&A 548 She completely breached
      the security of the Research and Development center and lambasts Mayuri''s security
      systems while stating hers was better, showing her superiority in technology
      even compared to him.Bleach: Thousand-Year Blood War, Episode 8: "The Shooting
      Star Project (ZERO MIX)" Her sewing prowess is shown in her creation of the
      Shihakusho, which was how she was accepted into Squad 0Klub Outside Q&A #389,
      and the creation of Oken clothing, which allows one to breach the layers of
      the Soul Shield Membrane.Bleach: Thousand-Year Blood War, Episode 21: "The Headless
      Star" She can also create perfect illusions with her cloths and make lifelike
      dolls, in addition to sewing tools such as umbrellas mid-battle. She can trap
      and stitch opponents with ease while operating at speeds so fast the enemy cannot
      even perceive them, such as when she immobilized Gerard Valkyrie, and when she
      sewed on a special outfit onto Nianzol Weizol that impaled him with spikes,
      killing the Stern Ritter with ease. Her expertise in technology is nothing short
      of magnificent, such as making pod attachments for her arms for transport and
      being stated by Mayuri to have countermeasures made to prevent the Royal Palace
      from warping.Bleach: Can''t Fear Your Own World, Chapter 17 She is stated to
      be one of the only 3 people in the Bleach verse to create their own version
      of Hikone Ubuginu, a Soul King Candidate and one of the most powerful characters
      in the series,Bleach: Can''t Fear Your Own World, Chapter 15 Showing her immense
      intellectual capability as she is directly compared to Urahara and Mayuri, surpassing
      the latter.)'
    source_ids: *id002
    confidence: 0.8
