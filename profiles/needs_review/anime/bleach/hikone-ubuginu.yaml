    \ attacks and make proper countermeasures against themBleach: Can't Fear Your\
    \ Own World Chapter 21), Accelerated Development and Reactive Power Level (From\
    \ being likened to Toshiro initially and being noted to grow stronger, Hikone's\
    \ strength grew to the point where they can fight with ZarakiBleach: Can't Fear\
    \ Your Own World Chapter 5, 20, 21), Summoning (Hikone can summon Ikomikidomoe\
    \ by calling out his nameBleach: Can't Fear Your Own World Chapter 11), Regeneration\
    \ (Mid-Low; Hikone was able to regenerate their skin back together despite having\
    \ their skin exploded by BambiettaBleach: Can't Fear Your Own World Chapter 21),\
    \ Likely Resistance to Conceptual Manipulation (Type 2 - Is made up of Soul King\
    \ fragmentsBleach: Can't Fear Your Own World Chapter 15, and Ikomikidomoe was\
    \ able to negate Ichibe's ability, escape his seal and restore his original name\
    \ by consuming a single fragmentBleach: Can't Fear Your Own World Chapter 24),\
    \ Resistance to Extrasensory Perception when using Son\xEDdo and Bringer Light\
    \ (Using Bringer Light makes the user harder to sense, due to the fact it disturbs\
    \ the surrounding reiatsu to a minimal degreeBleach Chapter 432, Bleach: Can't\
    \ Fear Your Own World Chapter 9) Soul Physiology and Hollow Physiology (Soul:\
    \ High-Tier/Hollow: High-Tier), Large Size in Second Release (Type 2 [Around 150m\
    \ to 300m] - Several times larger than a Menos Grande and comparable to a small\
    \ mountainBleach: Can't Fear Your Own World Chapter 14), Healing, Immortality,\
    \ Deconstruction and Matter Absorption (Type 3 and 8 - Macro-Quantum - Ikomikidomoe\
    \ can regenerate by absorbing the surrounding reishi to heal the wounds he was\
    \ inflicted withBleach: Can't Fear Your Own World Chapter 21), Sound Manipulation\
    \ and Air Manipulation (Ikomikidomoe can release a roar so loud that it can shake\
    \ the atmosphere and create many aggressive tornadoesBleach: Can't Fear Your Own\
    \ World Chapter 14), Absorption (Energy - Ikomikidomoe can absorb a Cero fired\
    \ from Grimmjow), Energy Projection (Ikomikidomoe can fire Ceros in all directionsBleach:\
    \ Can't Fear Your Own World Chapter 20), Summoning and Duplication (Ikomikidomoe\
    \ can spawn tens of thousands of hollow like creatures which can multiply indefinitely\
    \ as long as there is reishi to absorbBleach: Can't Fear Your Own World Chapter\
    \ 18)"
  source_ids: *id003
