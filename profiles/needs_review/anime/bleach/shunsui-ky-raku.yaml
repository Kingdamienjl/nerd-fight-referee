    - field: intelligence
      value: Genius, Despite his laid-back attitude, Shunsui has repeatedly shown
        himself to be a perceptive and insightful man. According to Yamamoto, even
        when he was younger, Shunsui has always had an eye for seeing the true character
        of anyone he meets. He was also one of the few people to suspect that Aizen
        was hiding something. In battle, Shunsui has proven to be very adept at noticing
        and understanding details in an opponent's skills or attack patterns. During
        his battle against Chad, he quickly determined the basics behind Chad's Reiryoku
        blasts, warning him about those kinds of techniques, and even explaining that
        his energy blasts would eventually use up his life energy. Shunsui has also
        proven himself very persuasive. Shortly after becoming Captain-Commander,
        he was able to convince Central 46 to agree to all his new requests.
      source_id: mediawiki-36782
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "Kageokuri thumb, 250px, Katen Ky\u014Dkotsu in its Shikai, : Katen Kyokotsu\
        \ has the power to make children's games a reality, she forces all within\
        \ it's area of influence to abide by the rules of the game of choice including\
        \ Shunsui himself or die., : A game based around a spinning top, Shunsui unleashes\
        \ a whirling blast of wind strong enough to buffet even Starrk and distract\
        \ him long enough to set up Taka Oni., {: A game where whoever is highest,\
        \ 'wins'. Shunsui leaps high in the air to initiate this game but its effects\
        \ are never seen due to being interrupted by Stark., : In this game, the rules\
        \ are simple, Whoever get's their shadows stepped on \"loses\". The game allows\
        \ the contestants to manipulate shadows. Shunsui has showcased various techniques\
        \ in this game such as completely hiding his presence within the shadows,\
        \ attacks the shadows an opponent is standing on therefore transferring the\
        \ game to said opponent. In addition to this Shunsui is capable of creating\
        \ multiple \"shadow clones\" to aid him in combat., : In this color based\
        \ game, you must call out the name of the color you wish to attack. Attacking\
        \ anything else that isn't the color shouted cause the attacks to be ineffective.\
        \ If the color that is called doesn't exist on the target the damage is reduced.\
        \ By calling out a color that you yourself is wearing, the damage you deal\
        \ becomes proportional to the amount of color on you so it's wise to call\
        \ out the color you have on the most., : This is one of most complex games\
        \ Katen Kyokotsu has shown, it is based around the idea that whenever one's\
        \ back is turned or they aren't focusing on their opponents. Said opponent\
        \ has free rein to blitz along the nearest reiatsu path to their opponent\
        \ and attack them from behind. It is similar to red-light green-light with\
        \ one person's back being turned and intermittently attempting to catch the\
        \ players moving. It allows Shunsui to blitz opponents standing right in front\
        \ of him if they drop their focus for the briefest moment due to Kageokuri's\
        \ illusory duplication ability, and seemingly will always put him in position\
        \ behind his opponent for a sneak attack., : A game whereby staring hard enough\
        \ at an opponents shadow, Shunsui or his opponent can project illusory afterimages\
        \ in a different location completely indiscernible from his real self if the\
        \ opponent were to take his eye off of him for a single moment. Shunsui is\
        \ skilled enough in this game he can create several duplicates of himself\
        \ the moment the enemy were to take their eyes off of him., : A game which\
        \ punishes you for lying. If you lie to each other, your fingers get paralyzed\
        \ on the first lie, your whole body feels like it is getting crushed by a\
        \ fist on the second lie and finally, on the third lie, you feel unimaginable\
        \ pain as if your viscera were being stabbed from the inside. It was a technique\
        \ meant to extract information from the kind of opponent who lies during battle,\
        \ but it worked on people 'other than one's own self'. This game had one single\
        \ disadvantage. As long as the game is activated, Final Act: Itokikiribasami\
        \ Chizome no Nodobue, : Upon release, an aura covers a large area around Shunsui.\
        \ This aura changes others' perception of the surrounding environment, making\
        \ them perceive it as darkened, bleak and gloomy, and causes others to feel\
        \ varying levels of melancholy and despair., : Shunsui activates this ability\
        \ and immediately all his wounds appear on his opponent's body, bypassing\
        \ even intangibility, with any and all wounds being shared and further, being\
        \ unable to outright kill from the mutual wound sharing., : Shunsui activates\
        \ this ability after his First Dan, opening numerous bloody sores upon his\
        \ opponent's body that weep blood profusely and without end., : Shunsui summons\
        \ an immense watery prison that encapsulates himself and his opponent and\
        \ slowly drains their Reiryoku whilst freezing them both in the water until\
        \ one runs out of Reiryoku and dies. This watery hell is literally inescapable\
        \ and seemingly reverts direction upon attempting to be fled somehow, as well\
        \ as forcibly begins to freeze one's resolve as well as their body., : Shunsui\
        \ summons a thread of Reiatsu that he wraps about his opponent's neck, then\
        \ pulls it taut to slice open their neck, causing their neck to forcibly explode\
        \ and decapitates them outright."
      source_id: mediawiki-36782
