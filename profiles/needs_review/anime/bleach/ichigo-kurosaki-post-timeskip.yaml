    blood vessels, reinforcing either their strength or durability to exceptional
    levels. There exists a defensive and offensive form of Blut, but only one can
    be used at a time; Ichigo seems to make subconscious use of these. **: Blut''s
    defensive form, which makes its use clear in the form of a glowing trail that
    traces the user''s blood vessels, which appears only when the enhanced area is
    struck. When consciously maintained at full power, Blut Vene can even negate the
    attacks of a Bankai user. It can also be used to stop the user''s blood flow if
    they are badly injured, preventing them from bleeding out. Ichigo''s Blut Vene.gif|Blut
