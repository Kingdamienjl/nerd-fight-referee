    - field: weaknesses
      value: "Ichigo is brash and can rush into fights without thinking, and he can\
        \ also be too merciful or have his powers limited by his lack of fighting\
        \ spirit. Notable Attacks and Techniques: Fullbring: Ichigo's Fullbring is\
        \ dependent on his Substitute Shinigami Badge, it covers him in black reiatsu\
        \ and gives him a simple, black blade. Once completed, Ichigo's Fullbring\
        \ covers him in white, bone-like armor and a black bodysuit, one in the shape\
        \ of his original Shikai and a hollow portion, more akin to a knife. The larger\
        \ blade represents his inner Hollow, the larger blade turns white., Getsuga\
        \ Tensh\u014D: Ichigo's signature attack, a highly condensed blast of spiritual\
        \ pressure released from the tip of either blade with a slash, taking the\
        \ form of a crescent as it rushes forwards, or even an omnidirectional burst.\
        \ Though Ichigo uses this ability several times before finding out its name,\
        \ once he does, its power is greatly enhanced., Ichigo brings both the blades\
        \ of his Zanpakut\u014D together, with the smaller blade occupying the hollow\
        \ inside of the larger. Yhwach regarded Ichigo's bankai as too powerful and\
        \ destroyed it instantly before we could see its godly power. After Yhwach\
        \ absorbs Ichigo's powers, the exterior of the blade shatters to reveal the\
        \ True Zangetsu., Ichigo bifurcated him with the force of the blast and would\
        \ have killed him were it not for The Almighty allowing Yhwach to reverse\
        \ his death., True Zangetsu: Ichigo shatters the white outer shell of Tensa\
        \ Zangetsu to strike with the True Zangetsu. Merged Hollow"
