- id: claim-weaknesses-fbd8de16
  section: weaknesses
  axis: weakness
  text: "He suffers from high levels of unjustified arrogance. His Bankai is particularly\
    \ affected by skills like the Shikai of Yumichika or the most basic ability to\
    \ absorb or collect Reishi like the Quincy's, and from this Azashiro can receive\
    \ a lot of damage. It takes one year to merge with the Seireitei once he breaks\
    \ his Polymerization. While in Bankai, Azashiro is incapable of physical progression.\
    \ Fusing with living beings can be dangerous for Azashiro due to the fact they\
    \ have a \u201Cself\u201D and can reject him. Azashiro loses his ability to fuse\
    \ when using his Reishi Spear. Urozakuro is a highly talkative person who may\
    \ reveal secrets about her abilities."
  source_ids: *id003
  decisive: false
