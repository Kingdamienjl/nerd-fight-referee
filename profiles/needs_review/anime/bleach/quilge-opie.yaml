- id: claim-weaknesses-24e0e2d1
  section: weaknesses
  axis: weakness
  text: "Quilge is highly arrogant, Blut Vene and Blut Arterie use two different Reishi\
    \ systems, so they cannot be used at the same time, his Jail cannot entrap fellow\
    \ Quincies. When using medallion, its user need to be sufficient powerful to wield\
    \ it and the power stolen by medallion is weaker than the original unless the\
    \ Quincy in question takes the time and effort to master it. Quincy are unable\
    \ to activate their Vollst\xE4ndig after they stole power with medallion. {| class=\"\
    mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\"\
    \ cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align: left;\
    \ |Notable Attacks and Techniques: |- | The Jail Anime.gif|The Jail File:Kirge%27s\
    \ Spirit Weapon.png|Quilge's Spirit Weapon Ransotengai Anime.gif|Ranso Tengai\
    \ *: Quilge's Schrift that enables him to create a prison of Reishi that is inescapable\
    \ to anyone at all except for Quincy. It is implied heavily that such a prison\
    \ will hold whomever it targets until death occurs. Further, it also is capable\
    \ of outright sealing off dimensional travel, closing the dimension, used by Garganta\
    \ to travel between worlds, on both sides. To use it, Quilge launches a blast\
    \ of Reishi which creates a large cage that is impervious to any and all harm\
    \ and escape attempts, surviving the full brunt of Ichigo's fury with ease. *:\
    \ Essentially the Quincy version of the Shinigami Flash Step and Arrancar Sonido.\
    \ The Quincy creates platforms of Reishi under their feet to swiftly move around\
    \ the battlefield. *: An advanced Quincy technique which grants one inhuman defensive\
    \ and offensive capabilities, however it can't boost both offensive and defensive\
    \ simultaneously. **: The defensive form of Blut, which grants the user a boost\
    \ in defense by strengthening their skin in a similar fashion to an Arrancar's\
    \ Hierro. Additionally, Blut Vene can be used to stop blood loss due to injury.\
    \ **: The offensive form of Blut which grants the user inhuman attack power. This\
    \ technique is the only thing capable of ensuring a Quincy's attacks can significantly\
    \ damage a Bankai-wielding Shinigami. *: An advanced Quincy technique created\
    \ for injured/old Quincy in order to control their limbs with strings of Reishi\
    \ like a puppet. Broken bones and severed tendons mean nothing to this as the\
    \ strings will control the limbs until the body/limb is entirely destroyed. *:\
    \ A teleportation ability used by members of the Wandenreich, this technique can\
    \ be used by manifesting the user's shadows in front of them, creating a portal\
    \ that acts as a gate between the Schatten Bereich and other dimensions. The size\
    \ of these portals can be extended to allow many others to pass through. *: A\
    \ Quincy weapon that can be used to fire Reishi-built arrows to fire upon the\
    \ target. Quilge Vollstandig.gif|Quincy: Vollst\xE4ndig, Piskiel Sklaverai.gif|Quilge's\
    \ Sklaverei *: The Wandenreich's improvement on the Letz Stile, with all the advancements\
    \ and none of the drawbacks. It allows the user to absorb Reishi from their environment\
    \ at a rate beyond their limits. This can be used for more powerful attacks, wings\
    \ for faster flight, enhancing the effects of Schrift (including access to Schrift\
    \ abilities) and a near endless supply of fuel for abilities like Blut, Hirenkyaku\
    \ and Heilig Pfeil. In this state, Quilge can fly and can absorb the surrounding\
    \ environment as reishi to fuel his attacks. **: Vollst\xE4ndig's basic Reishi\
    \ Absorption ability pushed to the absolute limit. This allows the user to absorb\
    \ the Reishi that composes spiritual and living beings, an absolute subordination\
    \ of Reishi. Destroying the Stern Ritter's Halo is the only way to stop it. |}"
