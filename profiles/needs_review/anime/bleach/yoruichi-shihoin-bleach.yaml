    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: Shunpo: A Shinigami movement\
        \ technique which allows the user to move faster than the eye can follow.\
        \ As speed is the main factor of the technique, the method is best characterized\
        \ by how fast one can get from point A to point B in the least number of steps.\
        \ *Utsusemi: This technique allows the user to move at great speed to avoid\
        \ an attack, creating an afterimage to substitute the damage. File:Yoruichi_Goddess_Of_Flash.gif|Yoruichi's\
        \ Shunpo File:Utsusemi.gif|Utsusemi *Takigoi:: The practitioner utilizes this\
        \ technique to create an opening in their opponent's defense. *Taketonbo::\
        \ A technique in which the user violently flips the opponent on their backs.\
        \ *Rai\u014Dken:: A technique pummeling the opponent with multiple high-speed\
        \ punches. File:Takigoi.gif|Takigoi File:Taketonbo.gif|Taketonbo File:Rai\u014D\
        ken.gif|Rai\u014Dken thumb|250px|Shunk\u014D Shunk\u014D (Lightning):: An\
        \ advanced technique which combines Hakuda with Kid\u014D. This technique\
        \ enhances Yoruichi by wrapping her body with compressed Kido, Yoruichi, in\
        \ particular, having the element of lightning. Yoruichi can fire off this\
        \ Kido to create explosions and neutralize enemy movement with her reiatsu.\
        \ *Shunk\u014D: Raijin Senkei: The lightning emitted from Yoruichi's back\
        \ creates a circle of electrical energy in the shape of Raijin's drums behind\
        \ her as Yoruichi unleashes a giant column of concentrated electrical energy\
        \ to engulf her opponent. *Shunk\u014D: Raiju Senkei: Shunry\u016B Kokuby\u014D\
        \ Senkei: After being enveloped in a column of lightning, Yoruichi develops\
        \ a form that is a cross between her feline and human forms. Aside from her\
        \ abilities enhancing dramatically, her reiatsu signature changes 48 times\
        \ per second in response to her mood. It also makes her extremely fickle like\
        \ a cat as a side effect. File:Yoruichi_Shunko.png|Yoruichi's new Shunk\u014D\
        \ File:Shunko_Raijin_Senkei1.png|Raijin Senkei ===Kid\u014D=== thumb|230px|Unknown\
        \ Barrier Kid\u014D: Spells cast by Shinigami with strong enough Reiryoku\
        \ and Reiryoku control. Kid\u014D is divided into mainly three categories:\
        \ Had\u014D for attacks, Bakud\u014D for battle support and Kaid\u014D for\
        \ healing. The spells are ranking from 1-99 with 1 being the weaker and easier\
        \ spells to cast and 99 being the most powerful and difficult to cast. Skilled\
        \ users can cast Kid\u014D without the need of an incantation; however, casting\
        \ without incantation does reduce the Kid\u014D's effectiveness to less than\
        \ a third of its full potential. *Hanki: This technique is used by Yoruichi\
        \ during Shunk\u014D. It can be used to cancel enemy attacks. File:Hanki.gif|Hanki\
