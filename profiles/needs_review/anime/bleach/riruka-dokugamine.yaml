power_scale:
  tier:
    text: 10-B
    source_ids: &id002
    - mediawiki-4909719
    confidence: 0.8
  attack_potency:
    text: Human level (Despite receiving enhancements from Ichigo's Fullbring, it
      still remains unknown how strong Riruka actually is. From what we can assume
      without issue is that she should at least be as strong as your average teenage
      girl)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Below Average level (Riruka is stated by Rukia Kuchiki to move very slow,
      with her being outran by Rukia even while she was trapped inside of a rabbit
      plushieBleach, Chapter 470: Pages 7), High Hypersonic attack speed with Addiction
      Shot (With this technique, Riruka was able to tag Rukia KuchikiBleach, Chapter
      469: Pages 17-18), higher with Bringer Light (Bringer Light is the high-speed
      movement technique of Fullbringers, allowing them to keep up in speed with the
      speed techniques of Quincy, Hollow, and ShinigamiBleach, Chapter 443: Page 18)'
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Human level (Similar to her attack potency, Riruka is depicted as a dainty
      teenage girl)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Human level (By virtue of her attack potency coming from her body, she physically
      produces force equal with it)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Human level (Riruka has never demonstrated to possess durability beyond
      what she would normally have as a teenage girl)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Average (Riruka's stamina is ultimately undetermined given her lack of feats,
      but it should still be equal with your average teenage girl as she is one)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Varies with Dollhouse (It depends on what she is shrinking
      down and what object is acting as the container)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Above Average (Despite her appearance and bratty attitude, Riruka is a pretty
      intelligence person, especially given her age. Riruka is able to conceptualize
      and understand herself and her companions reasons why they entered into Xcution,
      realizing all of them came from broken places and required companionship to
      slowly heal themselves overtimeBleach, Chapter 471)
    source_ids: *id002
    confidence: 0.8
