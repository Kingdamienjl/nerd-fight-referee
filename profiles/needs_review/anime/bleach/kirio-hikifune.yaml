- id: claim-powers-and-abilities-81634a45
  section: abilities
  axis: hax
  text: 'Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier),
    Master Swordswoman and Expert Hand-to-Hand Combatant (Hikifune as a member of
    the Royal Guard and former captain of squad 12 is a highly trained combatant and
    swordswoman), Genius Intelligence, Immortality (Types 1, 2, 3, 4 & 8; The life
    essence of each Royal Guard member is linked to the Reimyaku of the Soul King
    Palace and therefore they are able to be revived by calling their name as long
    as the Soul King Palace itself continues to exist.Bleach: Can''t Fear Your Own
    World, Prologue 1 The Royal Guard can survive fatal injuries without initially
    regeneratingBleach, Chapter 611: "Reio''s Death") Regeneration (Mid; The Royal
    Guard can regenerate from the utter destruction of their torsos and being decapitated,
    though they need someone to call their name to do this,Bleach: Chapter 611 possibly
    Mid-Godly; As stated above, Squad Zero can be revived as long as their castles
    in the Royal Palace are intact. Because of this, it is possible they could regenerate
    from the complete destruction of their body and soul, which would also result
    in their mind being destroyed) Resurrection (Squad Zero can be revived as long
    as their castles remain intact, though they need someone else to call their names
    to revive them) Transformation (Hikifune change her body size by through cooking
    as it uses up most of her Reiatsu),Bleach: Chapter 521 Plant Manipulation (Hikifune
    can manipulate the Cage of Life for defensive purposes to defend an area from
    attack or allow it to sprout from her body),Bleach: Chapter 600 Energy Absorption
    (The Cage of Life can absorb energy from attacks within it),Bleach: Chapter 600
    Resistance to Mind Manipulation and Empathic Manipulation (Possesses an Oken,
    which allows those who possess it to resist Pepe''s Love Schrift)Bleach: Chapter
    595'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
