      \ is scared by Yammy's CeroBleach Chapter 194 and Masked implies it could be\
      \ lethal to herBleach Official Character Book 2 Masked, and once White interfered\
      \ Yammy beat down Ichigo, albeit Ichigo is weaker than random Hollows at times\
      \ when White interferesBleach Chapter 193Bleach Chapter 196. The power of the\
      \ Espada make the Fraccion's pale in comparisonBleach Chapter 20938.9448 Teratons),\
      \ higher with Stored Power (Annihilates Loly and MenolyBleach Chapter 343, and\
