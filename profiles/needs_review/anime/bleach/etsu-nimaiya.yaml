- id: claim-powers-and-abilities-de26ff11
  section: abilities
  axis: hax
  text: 'Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier),
    Master Swordsman and Master Martial Artist (Nimaiya is a highly skilled member
    of the Royal Guard particularly notable for his masterful sword skill. His skill
    with a blade was enough to completely overwhelm the Schutzstaffel, who are highly
    skilled soldiers in their own right, in close combatBleach: Chapter 600-605),
    Genius Intelligence, Immortality (Types 1, 2, 3, 4 & 8; The life essence of each
    Royal Guard member is linked to the Reimyaku of the Soul King Palace and therefore
    they are able to be revived by calling their name as long as the Soul King Palace
    itself continues to existBleach: Can''t Fear Your Own World, Prologue 1. The Royal
    Guard can survive fatal injuries without initially regeneratingBleach, Chapter
    611: "Reio''s Death") Regeneration (Mid; The Royal Guard can regenerate from the
    utter destruction of their torsos and being decapitated, though they need someone
    to call their name to do thisBleach: Chapter 611, possibly Mid-Godly; As stated
    above, Squad Zero can be revived as long as their castles in the Royal Palace
    are intact. Because of this, it is possible they could regenerate from the complete
    destruction of their body and soul, which would also result in their mind being
    destroyed) Resurrection (Squad Zero can be revived as long as their castles remain
    intact, though they need someone else to call their names to revive them) Limited
    Cosmic Awareness (As the creator of the Zanpakuto, Nimaiya knows the locations
    of all Zanpakuto no matter how they came aboutBleach: Chapter 529), Energy Projection,
    Portal Creation and BFR (Nimaiya can open a portal to the world of the living
    and fire two blasts of energy from his fingers to push someone throughBleach:
    Chapter 527), Sealing (Capable of sealing souls within bladesCan''t Fear Your
    Own World Volume 3 Page 318 - 319), Resistance to Mind Manipulation and Empathic
    Manipulation (Possesses an Oken, which allows those who possess it to resist Pepe''s
    Love SchriftBleach: Chapter 595)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
