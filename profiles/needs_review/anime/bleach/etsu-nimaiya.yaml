  intelligence:
    text: 'Extraordinary Genius (Oetsu possesses the title of "The God of The Sword"
      attributing to the creation of the Zanpakuto itself, a massive contribution
      to the Soul Society and the parameter of his promotion to Squad 0.Bleach Chapter
      521: A PIGGY PARTY His creation of the Asauchi revolutionized Shinigami warfare,
      being able to shape themselves in relation to their user through training and
      experience,Bleach Chapter 529: Everything But The Rain pt. 2: The Rudiments
      allowing for the awakening of innate abilities, leading to also having created
      Shikai and Bankai.Klub Outside Q&A #522 These Asauchi can give birth to a Zanpakuto,
      in which their abilities can warp reality and fate itself, as shown with Shunsui
      Kyoraku and Senjumaru Shutara''s Zanpakutos. Oetsu''s craftmanship with normal
      blades aside from abilities reaches levels of sublime, making blades that are
      so sharp that they can cut a traditional sheath, necessitating him to design
      a special container to hold the sword.Bleach Chapter 601: VERGE ON VERMILLION
      He is also aware of every Zanpakuto in existence, knowing the names and powers
      of every single one. As the God of The Sword and member of the most powerful
      Squad in the Gotei 13Bleach TYBW Episode 27: A, he possesses Zanjutsu skills
      far beyond the likes of any other shinigami, surpassing masters of the blade
      such as Unohana and Yamamoto as well as succeeding beyond their complete and
      total mastery of 8000 different styles of swordsmanship. He is also bilingual,
      being proficient in both his native language Japanese, and English.Bleach Chapter
      522: Love It)'
    source_ids:
    - vsbattles-etsu-nimaiya-bleach
    confidence: 0.6
    notes: auto_repair source extraction
