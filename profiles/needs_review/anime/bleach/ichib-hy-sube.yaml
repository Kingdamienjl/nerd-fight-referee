      Ichimonji (Ichimonji is capable of affecting the future of the realms)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Nigh-Omniscient (Ichibe''s greatest ability beyond his power is his vast
      wisdom and knowledge, which Yhwach acknowledged and placed him as a special
      threat for.Bleach, Chapter 662: "God of Thunder 3" He had existed before the
