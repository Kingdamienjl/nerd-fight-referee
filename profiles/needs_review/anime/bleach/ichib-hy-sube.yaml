      25Bleach Chapter 608, as Yhwach was getting closer and closer to regaining his
      full power. The true power of Squad 0 far surpasses the combined strength of
      the Gotei 13, and can casually shake the heaven and earth of the 3 realms of
      existence1.2267 YottaFoe), higher with Secret Hado (Completely shattered Yhwach''s
      Blut Vene AnhabenBleach Chapter 607), far higher with Futen Taisatsuryo (Ichibe
      further amplified his attack by stealing "black" from the futureBleach TYBW
      Episode 27: 15:06-16:24), can ignore conventional durability with Ichimonji.'
    source_ids: *id002
    confidence: 0.8
