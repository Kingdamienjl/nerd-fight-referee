      He has named and influenced each and every phenomenon in existence since the
      birth of the three worlds with his dominion over true namesBleach Thousand Year
      Blood War Episode 27: A and has overseen the universe, being known as "Manako
      Osho" or "The Monk Who Calls The Real Name".Bleach Chapter 564: Red Bristled
      Kings Ichibei also possesses Kido skills beyond the likes of anyone in Bleach,
      being able to use secret Kido.Bleach Chapter 607 He is an extraordinary combatant,
      capable of fighting the likes of Yhwach in armed combat, a warrior possessing
      the memories and skills of potentially 10 trillion souls and who was previously
      a match in battle for Shigekuni Yamamoto Genryusai, a master of all Soul Reaper
      artsBleach Official Character Book Souls and unparalleled in mastery among the
      Gotei 13 as none dared to rival him for 1000 years.Bleach Chapter 394 As the
      leader of Squad 0, which does things on a whole different level than the Gotei
      13, he is unfathomably superior in all Soul Reaper arts to Yamamoto.)'
    source_ids: *id002
