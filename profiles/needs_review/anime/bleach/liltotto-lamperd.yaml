- id: claim-weaknesses-5fb15241
  section: weaknesses
  axis: weakness
  text: "Blut Vene and Blut Arterie use two different reishi systems, so they cannot\
    \ be used at the same time. Her ability leaves Liltotto in a constant state of\
    \ hunger. When using the Medallion, its user needs to be sufficiently powerful\
    \ to wield it and the power stolen by the Medallion is weaker than the original\
    \ unless the Quincy in question takes the time and effort to master it. Quincy\
    \ are unable to activate their Vollst\xE4ndig after they steal power with the\
    \ Medallion. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
