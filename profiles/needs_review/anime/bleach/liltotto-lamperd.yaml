- id: claim-powers-and-abilities-e64dc837
  section: abilities
  axis: hax
  text: '*Soul Physiology & Quincy Physiology (Soul: High-Tier/Quincy: Sternritter-Tier)
    *Expert Archery (As a Sternritter, Liltotto is a highly skilled archer and combatant)
    *The Glutton: **Elasticity, Body Control, Energy Absorption, Power Mimicry & Limited
    Information Analysis (Liltotto''s Schrift allows her to control her jaw to make
    it elastic and stretch from her body, allowing her to devour enemiesBleach Chapter
    505. She can use this to eat thousands of soldiers at onceBleach: Can''t For Your
    Own World, Chapter 3. The Glutton can absorb the Reiryoku and mimic the abilities
    of those it has consumed, it also grants the user of it the ability to instinctively
    understand every faucet of the mimicked abilitiesBleach: Can''t For Your Own World)
    ***Poison Manipulation & Corrosion Inducement (Mimicked Loly''s poison which dissolves
    things away like Rudbornn''s Calaveras and Arbol''s branchesBleach: Can''t For
    Your Own World) ***Empathic Manipulation, Paralysis Inducement, Durability Negation
    & Mind Manipulation (ConsumedBleach Chapter 597 PePe, and is shown to use his
    Schrift.Bleach: Can''t For Your Own World, Chapter 3 Liltotto can launch a heart-shaped
    projectile and anyone hit by this heart will fall in love with her, obeying every
    command she gives them.Bleach Chapter 594 Liltotto, like Pepe, can also immobilize
    those hit with her Heilig Pfeil''s with The LoveBleach Chapter 595) Resistance
    to: *Paralysis Inducement (Ranso Tengai allows Quincy to freely manipulate their
    bodies using spirit energy if their bodies would be inflicted with great physical
    harm or paralysis) Limited Resistance to: *Life Manipulation, Death Manipulation,
    and Power Absorption (Resisted Yhwach''s Auswahlen along with the other Bambies,
    which was in part due to her youth and high level abilities compared to the old
    and weakened Quincies that were killed by itKlub Outside QnA #573, however, she
    still had her power "reduced" and cannot use her Vollstandig after the factBleach
    Chapter 630: The Twinned Twilight)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
