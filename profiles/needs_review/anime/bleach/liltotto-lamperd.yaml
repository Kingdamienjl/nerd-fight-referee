  attack_potency:
    text: "At least Multi-Continent level (Kubo confirms that Liltotto has superior\
      \ striking strength to BambiettaKlub Outside Q&A 525, Liltotto believes she\
      \ is superior to Candice, NaNaNa, and RobertBleach TYBW Episode 23, and Liltotto\
      \ took out MeninasBleach TYBW Episode 2519.4724 Petatons), higher with Blut\
      \ Arterie (Blut provides a Bankai level increaseBleach TYBW Episode 7, which\
      \ is 10x for users of Vollst\xE4ndig and Sklaverei, as they are far more talented\
      \ in Quincy abilities and Blut Arterie amplifies attack powerBleach TYBW Episode\
      \ 4194.7239 Petatons), at least Multi-Continent level with Vollst\xE4ndig (Stronger\
      \ than Bambietta, killedBleach TYBW Episode 25 and ateBleach TYBW Episode 23\
      \ PePe), higher with Vollst\xE4ndig and Blut Arterie (Blut Arterie amplifies\
      \ her power by 10x1.9472 Exatons), at least Multi-Continent level with Sklaverei\
      \ (She can use Sklaverei to further amplify her VollstandigBleach TYBW Episode\
      \ 21, and since Vollstandig is superior to Letzt StilBleach TYBW Episode 3,\
      \ it's ability to amplify one's power via reishi subjugation would be superior\
      \ to Letz Stile which can amplify one's power 3xBleach Chapter 125. Liltotto\
      \ bloodied GiselleBleach TYBW Episode 21, albeit she seemed to be surprised\
      \ to be hit by the attack584.1718 Petatons), higher with Sklaverei and Blut\
      \ Arterie (10x more powerful5.8417 Exatons)"
