    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "At least Multi-Continent level (Kubo confirms that Candice has superior\
      \ striking strength to BambiettaKlub Outside Q&A 525), higher with Blut Arterie\
      \ (Blut provides a Bankai level increaseBleach TYBW Episode 7 which is 10x for\
      \ users of Vollst\xE4ndig and Sklaverei, as they are far more talented in Quincy\
      \ abilities and Blut Arterie amplifies attack powerBleach TYBW Episode 4), at\
      \ least Multi-Continent level with Vollst\xE4ndig (Stronger than Bambietta),\
      \ higher with Vollst\xE4ndig and Blut Arterie (Blut Arterie amplifies her power\
      \ 10x, and while desperately fighting for Yhwach's favor had Byakuya on the\
      \ back foot briefly before running out of Vollst\xE4ndig and being defeatedBleach\
      \ TYBW Episode 23), at least Multi-Continent level with Sklaverei (She can use\
      \ Sklaverei to further amplify her powersBleach TYBW Episode 21, and since Vollst\xE4\
      ndig is superior to Letzt StilBleach TYBW Episode 3, it's ability to amplify\
      \ one's power via Reishi subjugation would be superior to Letzt Stil which can\
      \ amplify one's power 3xBleach Chapter 125584.1718 Petatons), higher with Sklaverei\
      \ and Blut Arterie (10x more powerful5.8417 Exatons)"
