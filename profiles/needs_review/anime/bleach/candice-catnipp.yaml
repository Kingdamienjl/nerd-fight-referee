- id: claim-weaknesses-10538a55
  section: weaknesses
  axis: weakness
  text: "Blut Vene and Blut Arterie use two different reishi systems, so they cannot\
    \ be used at the same time. Candice is short-tempered and will fly into a rage\
    \ if her appearance is ruined in a battle. When using medallion, its user need\
    \ to be suficiente powerful to wield it and the power stolen by medallion is weaker\
    \ than the original unless the Quincy in question takes the time and effort to\
    \ master it. Quincy are unable to activate their Vollst\xE4ndig after they stole\
    \ power with medallion. {| class=\"wikitable mw-collapsible mw-collapsed\" !Notable\
    \ Attacks and Techniques: |- | *: Candice's Schrift, which, as the name implies,\
    \ allows her to control electricity, mostly in the form of lightning bolts, which\
    \ she can fire at her targets with high power. She can even generate these bolts\
    \ from the sky to strike down at her opponents. **Lightning Jump: Candice can\
    \ rapidly travel by transforming into a bolt of electricity, allowing her to dodge\
    \ attacks and reposition herself. Reishi Manipulation: As a Quincy, Candice can\
    \ manipulate and shape Reishi by absorbing it from the atmosphere and combining\
    \ it with her own stock of spiritual energy. It is easier to collect this energy\
    \ in locations with higher concentrations of Reishi, such as the Soul Society\
    \ and Hueco Mundo. *: An advanced Quincy technique that works by pumping Reishi\
    \ into the user's blood vessels, reinforcing either their strength or durability\
    \ to exceptional levels. There exists a defensive and offensive form of Blut,\
    \ but only one can be used at a time. **: Blut's offensive form, the technique\
    \ that allows Quincies to physically match and injure Bankai users. **: Blut's\
    \ defensive form, which makes its use clear in the form of a glowing trail that\
    \ traces the user's blood vessels, which appears only when the enhanced area is\
    \ struck. When consciously maintained at full power, Blut Vene can even negate\
    \ the attacks of a Bankai user. It can also be used to stop the user's blood flow\
    \ in the event that they are badly injured, preventing them from bleeding out.\
    \ Candice's bow.png|Candice's Heilig Bogen File:Galvano Blast Anime.gif|Candice\
    \ using Galvano Blast *: Candice's Spirit Weapon, a bow with arms shaped like\
    \ lightning bolts. **: The primary form of attack for Quincies, spiritual energy\
    \ manifested as arrows and fired from the Heilig Bogen. Candice's take the forms\
    \ of bolts of lightning thanks to her ability. She can also use a more powerful\
    \ Galvano Blast, which has 5 gigajoules of energy and can reduce an opponent to\
    \ dust. *: A high-speed Quincy movement technique that functions by riding on\
    \ a flow of Reishi underneath their feet. thumb|200px|Candice's Sklaverei-enhanced\
    \ Vollst\xE4ndig: Barbarriel *: An advanced Quincy technique created for injured/old\
    \ Quincy in order to control their limbs with strings of Reishi like a puppet.\
    \ Broken bones and severed tendons mean nothing to this as the strings will control\
    \ the limbs until the body/limb is entirely destroyed. *: A teleportation ability\
    \ used by members of the Wandenreich, this technique can be used by manifesting\
    \ the user's shadows in front of them, creating a portal that acts as a gate between\
    \ the Schatten Bereich and other dimensions. The size of these portals can be\
    \ extended to allow many others to pass through. *: A device possessed by select\
    \ members of the Wandenreich military, including all Sternritter which allows\
    \ one to steal a Shinigami's Bankai or any power that is fundamentally similar\
    \ to a Shinigami's Bankai. *: The evolved form of the outdated Quincy technique\
    \ Letzt Stil, a far superior ability that allows them to draw in Reishi beyond\
    \ their regular limits, greatly boosting their physical capabilities. Unlike Letzt\
    \ Stil, which can only be used once at the cost of the user's Quincy powers, Vollst\xE4\
    ndig can be used multiple times in a single day. Candice's Vollst\xE4ndig grants\
    \ her six lightning bolt-shaped wings, a crackling Heiligenschein, and a constant\
    \ field of electricity crackling around her. **: Vollst\xE4ndig's basic Reishi\
    \ Absorption ability pushed to the absolute limit. This allows the user to absorb\
    \ the Reishi that composes spiritual and living beings, an absolute subordination\
    \ of Reishi. Destroying the Stern Ritter's Halo is the only way to stop it. **Lightning\
    \ Swords: Candice can pull her wings individually to use them as swords in close\
    \ quarters, wielding two at once if necessary. She can return to long-range combat\
    \ by throwing one of them at her opponents, a technique known as Galvano Javelin.\
    \ **: Candice throws one of her swords as a javelin for long-range combat. **:\
    \ Candice raises her arm, causing a huge burst of electricity to surge around\
    \ her before she throws it at her opponent in a single, powerful burst. File:Balbarriel.gif|Candice's\
    \ Quincy, Vollst\xE4ndig: Barbarriel File:Lightning Swords Anime.gif|Candice using\
    \ her Lightning Swords against Ichigo File:Galvano Javelin Anime.gif|Candice throwing\
    \ Galvano Javelin File:Electrocution Anime.gif|Candice using Electrocution |}"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-615121ae
  section: abilities
  axis: hax
  text: '*Soul Physiology & Quincy Physiology (Soul: High-Tier/Quincy: Sternritter-Tier)
    **Expert Markswoman & Swordswoman (Candice can utilize her expert markswoman skills
    to increase her effectiveness in combat and with her Schrift) *The Thunderbolt:
    **Electricity Manipulation, Paralysis Inducement & Statistics Amplification (Candice
    can create powerful lighting-strikes that causes muscles to cramp up, she can
    also use the lightning to increase her speed as wellBleach Chapter 580) Resistance
    to: *Paralysis Inducement (Ranso Tengai allows Quincy to freely manipulate their
    bodies using spirit energy if their bodies would be inflicted with great physical
    harm or paralysisBleach Chapter 124) Limited Resistance to: *Life Manipulation,
    Death Manipulation, and Power Absorption (Should scale to Bazz-B along with the
    other Bambies while healthy, who resisted Yhwach''s Auswahlen, which was in part
    due to her youth and high level abilities compared to the old and weakened Quincies
    that were killed by itKlub Outside QnA #573, however, she still had her power
    "reduced" and cannot use her Vollstandig after the factBleach Chapter 630: The
    Twinned Twilight.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
