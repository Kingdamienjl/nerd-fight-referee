- id: claim-weaknesses-9b0e354f
  section: weaknesses
  axis: weakness
  text: "Yumichika refuses to use his true Shikai in the presence of the Gotei 13\
    \ members due to the nature of its powers. He is also extremely vain and takes\
    \ slights to his appearance personally. {| class=\"mw-collapsible mw-collapsed\"\
    \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks and Techniques: |-\
    \ | *: A Shinigami movement technique which allows the user to move faster than\
    \ the eye can follow. As speed is the main factor of the technique, the method\
    \ is best characterized by how fast one can get from point A to point B in the\
    \ least number of steps. File:FujiKujaku.jpg|Fuji Kujaku File:Ruri%27iro_Kujaku.gif|Ruri'iro\
    \ Kujaku File:Daichi Teny\u014D.gif|Had\u014D #57: Daichi Ten'y\u014D *: **: Yumichika's\
    \ Zanpakut\u014D splits into four Sickle like blades connected to the hilt. **:\
    \ His Zanpakut\u014D's True Form, Yumichika can use the Vines produced to restrict\
    \ a target; siphoning their Reiatsu in the process until death. Yumichika can\
    \ also heal himself by eating the reiatsu-filled flowers budding on the Vines\
    \ as a result of this process. *Kid\u014D: Spells cast by Shinigami with strong\
    \ enough Reiryoku and Reiryoku control. Kid\u014D is divided into mainly three\
    \ categories: Had\u014D for attacks, Bakud\u014D for battle support, and Kaid\u014D\
    \ for healing. The spells rank from 1 to 99, with 1 being the weaker and easier\
    \ ones to cast and 99 being the most powerful and challenging to release. Skilled\
    \ users can cast Kid\u014D without the need of an incantation; however, doing\
    \ so will reduce the Kid\u014D's effectiveness to less than a third of its full\
    \ potential. **: The caster levitates nearby objects that they can then launch\
    \ towards their target. |}"
  source_ids: *id003
  decisive: false
