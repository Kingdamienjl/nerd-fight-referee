        and Hakudo, this level of swordsmanship allows Yamamoto to fight on par with
        and even beat people like Retsu Unohana with pure skill alone, this same Unohana
        has mastered over 8,000 different types of sword stylesBleach: Chapter 523
        and can even casually outskill other master swordsmanBleach: Chapter 524in
        the series like Zaraki Kenpachi, Yamamoto''s hand to hand combative skill
        is also extremely high, being able to completely outskill the likes ofBleach:
        Chapter 395 Wonderweiss Margela), Fire Manipulation, Shockwave Generation
        and Space-Time Manipulation (Itto Kaso is a fire-based Kido that creates a
        massive blade of fire to attack an opponent that overtakes several buildings
        and can create a large shockwave that has the range and power to level several
        buildings. Itto Kaso is also capable of tearing holes in space timeSpirits
        Are Forever With You: Chapter 18Bleach: Chapter 395), Enhanced Fire Manipulation,
        Limited Heat Manipulation, Barrier Creation and Possibly Limited Power Nullification
        (Yamamoto''s Zanpakuto, Ryujin Jakka''s main ability is the creation and manipulation
        of fireBleach: Chapter 156, this fire is so hot that it can instantly skeletonize
        opponentsBleach: Chapter 504, this has many application such as the ability
        create massive walls of flames around someoneBleach: Chapter 316 that even
        the likes of Sosuke Aizen couldn''t leave from despite the fact Aizen has
        dimensional travel capabilities, while in Bankai the level of Ryujin Jakka''s
        heat dramatically increases, reaching the monstrous temperature of 15,000,000
        Degree Celsius, making it equal in heat to the core of the sunBleach: Chapter
        507), Self-Sealing, Existence Erasure, Durability Negation and Necromancy
        (Zanka no Tachi possess multiple unique abilities which are dependent on what
        "cardinal direction" Yamamoto "chooses", with East Yamamoto condenses all
        of the flames of Zanka no Tachi into the tip of his blade, doing so causes
        anything that''s hit by it to be "blown away without a trace", with West Yamamoto
        dawns a fiery cape of flames which passively exert heats that are equal to
        the core of the sun, with South Yamamoto can summon the dead of those he has
        slayed, these number proportally reach into the trillionsBleach: Chapter 508
        and finally with North Yama condenses all of the flames of Zanka no Tachi
        into the blade of his sword and delivers a devastating slashBleach: Chapter
        509), Sleep Manipulation (Able to put others toBleach: Chapter 224 sleep with
        kido), Resistance to High Temperatures (Able to withstand the temperature
        of his own Zanka no Tachi, Nishi which reaches 15,000,000 degrees) and Space-Time
        Manipulation (Survived the after-effects of his own Itto Kaso, which can tear
        holes in space timeSpirits Are Forever With You: Chapter 18)'
