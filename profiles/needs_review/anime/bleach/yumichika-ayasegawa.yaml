      value: He has lost his left arm, his physical strength has diminished with age
        (although he is still formidable in hand-to-hand combat and swordsmanship).
        He is rather arrogant and prefers to avoid stepping onto the battlefield unless
        he has to (which led to many of the Lieutenant-class Shinigami to sustain
        heavy injuries in combat when he could have wiped out most of Aizen's army
        with ease). He is also stubborn about his opinions and will not heed advice
        that goes against them unless he sees it with his own eyes (such as Mayuri's
        warning about the Wandenreich).
