        \ based on the famous Schr\xF6dinger's cat paradox. With this, Schr\xF6dinger\
        \ is unable to be killed conventionally, being able to survive many major\
        \ lethal wounds, and appear anywhere else he chooses without a scratch. He\
        \ is used as a messenger and a spy with this ability, being able to instantly\
        \ teleport wherever he chooses as long as he is not being observed even for\
        \ a split second. He has shown to be able to enter mindscapes with ease, such\
        \ as when he entered the mindscape of Seras Victoria to deliver a message\
        \ to Zorin. It was because of this ability that Schr\xF6dinger was the most\
        \ essential part in The Major's plan of killing Alucard, who gained this ability\
        \ when Schr\xF6dinger\u2019s soul was unknowingly absorbed during Level 0,\
        \ and would \u2018lose himself\u2019 among the many other souls reaped by\
        \ Alucard. It is possible however for Schr\xF6dinger to gain awareness of\
        \ his existence back from nothing if there is no clutter of souls or anything\
        \ for him to be lost in. ==Notable Matchups== Victories: Losses: Inconclusive:\
