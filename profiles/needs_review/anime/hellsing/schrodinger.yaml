    - field: weaknesses
      value: 'Normal human weaknesses, his talent only extends to possible results
        and thus will not help him against a much stronger opponent Notable Attacks/Techniques:
        thumb|404x404px|Schrodinger explains his talent *Returner: As a Perfect Returner,
        Schrodinger is always in his transformed state, and is referred to by other
        Returners by the name of his previous life. Like other Returners, Schrodinger''s
        throat releases several petals while his power is active. As a Great-type
        Returner, Schrodinger''s returned talent comes from a hero or someone who
        could truly be called Great. In his case, his returned talent "The Cat Chooser"
        comes from the Nobel prize-winning Austrian physicist, known for his development
        of quantum theory and his famous thought experiment involving a cat. **The
        Cat Chooser: By using his talent Schrodinger is freely able to manipulate
        probability. By concentrating he can see every probability. He also has the
        ability to choose any possible result of an action involving him. For example,
        if he''s shot and killed by a gun he can choose the result of him not being
        killed by the gun, and thus survive as if nothing had happened. Similarly,
        when faced with a huge number of attacks such as multiple bullets he can choose
        the result of him avoiding them all to remain unscathed despite putting no
        effort in dodging them. He also compensates for the low-power ability of his
        weapon (9mm handgun) and his worthless shooting skills by choosing the result
        of him killing the enemy with one shot. However, his ability only extends
        to possible results. If he''s faced with actually impossible odds where he
        cannot win/survive/run, his ability cannot save him, as he cannot choose if
        there are no other options to choose from. ==Notable Matchups== Victories:
        Losses: Inconclusive: {{Discussions|Erwin Schrodinger Petals of Reincarnation|Erwin
        Schrodinger (Petals of Reincarnation)}} Category:Characters Category:Male
        Characters Category:Petals of Reincarnation Category:Manga Characters Category:Humans
        Category:Gun Users Category:Probability Users'
