    - field: intelligence
      value: 'Gifted (The Captain is far more cunning than he lets himself appear.
        Being an agent of Schicksal that directly reports to the Overseer, he is highly
        qualified in an official capacity. He displays the ability to quickly see
        through acts and lies from individuals that would be incredibly intelligent
        in their own right, discern minute details in order to find the truth in various
        mysteries across the worlds he finds himself in, utilize his time and dimension
        traveling abilities to set up opportunities for his past selves, as well as
        deduce the answers to the complex mysteries in Rosemary Floriograph) Standard
        Tactics: None notable | The Captain tends to only leave Hyperion through Consciousness
        Mappings, and with his ability to set the criteria for mapping termination,
        he can automatically return to Hyperion the moment he is threatened, otherwise
        incapacitated or even killed. He makes sure to map his consciousness to safe
        points in time and space, to allow himself time to regain his full memories
        and mitigate his sole weakness, and will even map himself into existing people
        if he believes that the actions of those people would be beneficial to his
        goals. Furthermore, he has shown the ability to take items and even people
        from other universes for personal use, such as Ether Anchors, Yae Kasumi,
        and what are implied to be Herrscher cores. It is also fully within his character
        to endlessly throw himself at a problem in an attempt to fix it, mapping his
        consciousness back in time over and over again as he gains more information
        in order to complete his objective - and continuing to do so even after he
        realizes that an abstract and unknowable force is keeping him from succeeding.'
