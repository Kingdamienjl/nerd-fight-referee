        his place, extending his life in the process. However, simply damaging Alucard
        such as cutting his arms or destroying his head will not have Alucard use
        his souls, instead just activating his standard regeneration without any use
        of them. If Alucard has no souls left to use, a single fatal strike to his
        heart will instantly kill him. This may also be true of if his head is destroyed
