    - field: intelligence
      value: Gifted. As a former Master Vampire Hunter, Walter is extremely well-versed
        in the supernatural and can tear his way through the undead with ease despite
        his aging body. He is privy to all of Hellsing's secrets and is a skilled
        actor and liar, orchestrating the attack on the Hellsing household and masking
        his betrayal until the moment he blatantly admitted it to his master and Alucard
        himself. In addition, he is also a skilled gunsmith, crafting custom firearms
        that became the preferred weapons of both Alucard and Seras Victoria, each
        fine-tuned to match their wielder's attributes perfectly. After being rejuvenated,
        he showed even more proficiency with his wires, forming shields durable enough
        to stop Alucard's bullets, dragging Luke Valentine and the Hound of the Baskervilles
        around like a marionette, and slowing his descent by digging his wires into
        the surrounding infrastructure. With these techniques he gave Alucard a great
        deal of trouble despite his body's rapidly deteriorating condition.
      source_id: vsbattles-walter-c-dornez-anime
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'While his own stamina is above average, both of Walter''s forms have
        some limitation on his combat readiness; his elderly human form was aging
        and weakened, while his vampiric form was unstable and constantly deteriorating.
        Walter is rather overconfident when he has the upper hand. When as a vampire,
        he should be vulnerable to sunlight, silver and blessed weapons. Notable Attacks/Techniques:
