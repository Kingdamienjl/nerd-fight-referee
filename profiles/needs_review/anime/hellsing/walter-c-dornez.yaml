- id: claim-weaknesses-43063997
  section: weaknesses
  axis: weakness
  text: 'While his own stamina is above average, both of Walter''s forms have some
    limitation on his combat readiness; his elderly human form was aging and weakened,
    while his vampiric form was unstable and constantly deteriorating. Walter is rather
    overconfident when he has the upper hand. When as a vampire, he should be vulnerable
    to sunlight, silver and blessed weapons. Notable Attacks/Techniques: WireShield.gif|Wire
    Shield WireMarionette.gif|Wire Marionette * Wire Shield: Walter forms a mesh net
    of wires that is sturdy enough to completely nullify the rounds from Alucard''s
    Casull. * Wire Marionette: Walter inserts his wires into another living being,
    allowing him to control their bodies like a puppet to use them against his main
    target. ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==
