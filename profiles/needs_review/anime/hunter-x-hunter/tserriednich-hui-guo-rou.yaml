- id: claim-intelligence-5db7cedd
  section: power_scale
  axis: battle_iq
  text: Genius. Tserriednich is extremely brilliant, as well as knowledgeable about
    many topics, including particle physics, stem cells, sports, philosophy, psychology,
    mathematics, music, history, mythology, geography and politics. According to Theta,
    his ability to consider multiple scenarios exceeds her own. He is known to have
    astounding visualization and concentration abilities. A Nen genius of prodigious
    talent, learning the four basic principles in a week, which took Gon and Killua,
    also considered prodigies, at least twice as long to do. Opened his aura nodes
    in seconds, which, in comparison, taking 5-7 days to do this is considered fast.
    Learned Gyo in half a day. With this skill, he managed to gather enough aura around
    his hands to perform Water Divination, which revealed him as a Specialist. According
    to Theta, the manifestation of his aura during the test is indicative of an extremely
    sinister nature. Over the next few days, he managed to reach such proficiency
    in Ten and Ren that Theta had him perform advanced exercises.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-5724240a
  section: weaknesses
  axis: weakness
  text: Since his Guardian Spirit Beast is a parasitic-type ability, Tserriednich
    has no control over it and is unable to perceive it himself. The Guardian Spirits
    cannot physically attack each other and cannot directly attack a host of another
    one. Zetsu involves keeping one's aura exclusively in the body, it makes a Nen
    user more vulnerable to physical and Nen attacks, because one doesn't have any
    aura on the outside of one's body to protect oneself, however, this weakness is
    circumvented by his Nen ability, as it is triggered by entering Zetsu.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-cc933a5c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Social Influencing
    (Puts up a facade of being an extremely charismatic man when in reality he is
    a sociopathic and inhumane monster), Nen Manipulation (Specialist; proficient
    in all the four basic techniques and various advanced techniques, his Ren is noted
    to be especially sinister and powerful. The greatest human Nen prodigy seen in
    the series so far), Precognition (When he closes his eyes and enters Zetsu, Tserriednich
    can see ten seconds into the future. No time passes when he receives the vision,
    and it is instant), Fate Manipulation and Alternate Future Display with Zetsu
    (The moment Tserriednich opens his eyes, an "illusion" of those ten seconds he
    foresaw plays out for everybody. During this illusion that others are seeing,
    Tserriednich can act freely and is separate from the illusion. People will not
    see him act. He can change his actions and used this ability to subvert his death),
    Summoning (Tserriednich can summon a Guardian Spirit Beast and another Nen Beast
    passively created out of his Ren) Nen Manipulation (Unknown), Body Control (It
    can stretch its neck several meters), Incorporeality (Likened to ghosts, Guardian
    Spirit Beasts have no true physical forms and are shaped by the host), Invisibility
    (All Guardian Spirit Beasts are invisible to the host and any non-Nen users),
    Intangibility (It can phase through walls), Curse Manipulation (Its ability is
    triggered if a victim lies to Tserriednich and a sore begins to spread where the
    barbed tongue pierced the victim. It has stated that the next time a victim lies
    to Tserriednich, they will "cease to exist as a human"), Sleep Manipulation (Upon
    issuing its first warning, the Spirit Beast puts the victim to sleep)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
