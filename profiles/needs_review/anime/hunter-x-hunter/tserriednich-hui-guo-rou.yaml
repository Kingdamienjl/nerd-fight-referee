  intelligence:
    text: Genius. Tserriednich is extremely brilliant, as well as knowledgeable about
      many topics, including particle physics, stem cells, sports, philosophy, psychology,
      mathematics, music, history, mythology, geography and politics. According to
      Theta, his ability to consider multiple scenarios exceeds her own. He is known
      to have astounding visualization and concentration abilities. A Nen genius of
      prodigious talent, learning the four basic principles in a week, which took
      Gon and Killua, also considered prodigies, at least twice as long to do. Opened
      his aura nodes in seconds, which, in comparison, taking 5-7 days to do this
      is considered fast. Learned Gyo in half a day. With this skill, he managed to
      gather enough aura around his hands to perform Water Divination, which revealed
      him as a Specialist. According to Theta, the manifestation of his aura during
      the test is indicative of an extremely sinister nature. Over the next few days,
      he managed to reach such proficiency in Ten and Ren that Theta had him perform
      advanced exercises.
    source_ids: *id002
    confidence: 0.95
