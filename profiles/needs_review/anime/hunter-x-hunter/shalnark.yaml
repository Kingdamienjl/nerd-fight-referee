        him to stick the antenna into a target. They serve as the medium of both his
        Nen abilities and are connected to his cell phone), used to activate his Nen
        ability and to control his targets.
      source_id: mediawiki-3576100
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted in general. Genius in combat. Shalnark is among the smartest members
        of the Troupe, as well as seemingly the most knowledgeable. He can calculate
        accurate odds in the midst of a fight and in mere seconds and his predictions
        are usually exact. He is adept at finding an enemy's weak spots and exploit
        them. From a handful of clues, he was able to deduce that Greed Island exists
        in the real world, as well as to pinpoint its location by analyzing its minerals
        and cross-referencing the data with nautical and geographical archives. Shalnark
        also appears to be the most tech-savvy of the Troupe. With his informatic
        skills, he is one of the Phantom troupe's information gatherers, and they
        often rely on his advice and research. His eclectic know-how, which ranges
        from how to get rid of spotted leeches to piloting a hot-air balloon, makes
        him a valuable asset to the group.
      source_id: mediawiki-3576100
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Zetsu involves keeping one's aura exclusively in the body, it makes a
        Nen user more vulnerable to physical and Nen attacks, because one doesn't
        have any aura on the outside of one's body to protect oneself. Once Shalnark
        has entered Autopilot, he cannot withdraw from it until the task he instructed
        himself has been accomplished. After leaving Autopilot, Shalnark experiences
        intense muscle pain for two or three days and is completely unaware of what
        he has done.
      source_id: mediawiki-3576100
      provider_id: vsbattles
      authority: high
