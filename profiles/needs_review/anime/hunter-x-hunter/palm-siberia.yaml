      source_id: mediawiki-466549
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. Under her emotional instability and psychosis, Palm is
        actually surprisingly intelligent. The disappearance of her psychosis enabled
        Palm to reason more coolly. She corrected Killua when the latter objected
        that there was no point to being able to see Shaiapouf's core, pointing out
        she would be able to tell him apart from his clones and that they could squash
        him if they found him. She managed to figure out the nature of the discordant
        actions of the Royal Guards concerning Komugi and that the introduction of
        human DNA in the Chimera Ant Queen's diet was at the origin of their stronger
        sense of self. She took matters into her own hands when only Ikalgo and her
        remained.
      source_id: mediawiki-466549
      provider_id: vsbattles
      authority: high
      confidence: 0.75
