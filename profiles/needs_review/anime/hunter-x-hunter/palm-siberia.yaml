    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Nen Manipulation (Enhancer; It is
        unknown how skilled Palm is when it comes to Nen but she should at least know
        the 4 basic principles), Weapon Mastery (Is able to use sharp kitchen knives,
        however is useless against trained assassins such as Killua), Berserk Mode
        (She is prone to violent outbursts, and if angered enough, will fly into a
        rage), Limited Clairvoyance (Merman Clairvoyance allowed her to observe her
        target through a crystal ball) All previous abilities on a much higher level.
        Enhanced Nen Manipulation (As a Chimera Ant, she is far more skilled with
        Nen and can presumably use all of the advanced techniques as well), Limited
        Immortality (Type 2, Chimera Ants can survive for a day after being decapitatedHunter
        x Hunter Chapter 193), Clairvoyance (With Wink Blue, Palm is able to see the
        last three people her right eye gazed upon at the same time. If she looks
        at someone else with her right eye, it displaces the oldest target), Skilled
        Hand-to-Hand Combatant (Can fight with Killua Zoldyck), Hair Manipulation
        and Statistics Amplification (Black Widow wraps her entire body with her hair
        to form what seems to be a dress with a wide brim hat. This "outfit", which
        changes shape according to her emotions, can efficiently protect her body
        from attacks, enabling her to concentrate all of her aura on attacking using
        Ko instead of splitting it between offense and defense)
      source_id: mediawiki-466549
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: City Block level (Should be somewhat comparable to Greed Island Arc Gon
        and Killua, but she is not much of a fighter, shown when Killua effortlessly
        dodged her attack and stated he could dodge it in his sleep. Still, she was
        a candidate to help with the Chimera Ants, so she should be considerably strong)
        | Multi-City Block level (Is far stronger as a Chimera Ant. Can hurt Killua
        with her strikes. Killua stated that she was stronger than him in terms of
        raw power), up to Small Town level with Ryu and Ko (Can hurt Killua while
