- id: claim-intelligence-8cebfd3b
  section: power_scale
  axis: battle_iq
  text: Above Average. Under her emotional instability and psychosis, Palm is actually
    surprisingly intelligent. The disappearance of her psychosis enabled Palm to reason
    more coolly. She corrected Killua when the latter objected that there was no point
    to being able to see Shaiapouf's core, pointing out she would be able to tell
    him apart from his clones and that they could squash him if they found him. She
    managed to figure out the nature of the discordant actions of the Royal Guards
    concerning Komugi and that the introduction of human DNA in the Chimera Ant Queen's
    diet was at the origin of their stronger sense of self. She took matters into
    her own hands when only Ikalgo and her remained.
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-4f413272
  section: weaknesses
  axis: weakness
  text: Is highly unstable emotionally and is prone to violent angry outbursts which
    greatly hindered her rational thought process. Zetsu involves keeping one's aura
    exclusively in the body, it makes a Nen user more vulnerable to physical and Nen
    attacks, because one doesn't have any aura on the outside of one's body to protect
    oneself. She is required to feed her own blood to the crystal ball if she wishes
    to use Clairvoyance. | Due to being in complete control of her emotions as a Chimera
    Ant, Palm is no longer unstable and is shown to be very level-headed, mature,
    and intelligent. As she can now utilize Wink Blue, Palm no longer needs to feed
    her blood to use it however she still must have seen the target at least once.
    Zetsu involves keeping one's aura exclusively in the body, it makes a Nen user
    more vulnerable to physical and Nen attacks, because one doesn't have any aura
    on the outside of one's body to protect oneself.
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e035ce24
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulation (Enhancer; It is unknown
    how skilled Palm is when it comes to Nen but she should at least know the 4 basic
    principles), Weapon Mastery (Is able to use sharp kitchen knives, however is useless
    against trained assassins such as Killua), Berserk Mode (She is prone to violent
    outbursts, and if angered enough, will fly into a rage), Limited Clairvoyance
    (Merman Clairvoyance allowed her to observe her target through a crystal ball)
    All previous abilities on a much higher level. Enhanced Nen Manipulation (As a
    Chimera Ant, she is far more skilled with Nen and can presumably use all of the
    advanced techniques as well), Limited Immortality (Type 2, Chimera Ants can survive
    for a day after being decapitatedHunter x Hunter Chapter 193), Clairvoyance (With
    Wink Blue, Palm is able to see the last three people her right eye gazed upon
    at the same time. If she looks at someone else with her right eye, it displaces
    the oldest target), Skilled Hand-to-Hand Combatant (Can fight with Killua Zoldyck),
    Hair Manipulation and Statistics Amplification (Black Widow wraps her entire body
    with her hair to form what seems to be a dress with a wide brim hat. This "outfit",
    which changes shape according to her emotions, can efficiently protect her body
    from attacks, enabling her to concentrate all of her aura on attacking using Ko
    instead of splitting it between offense and defense)
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
