        to describe him a moment before. Since Palm was not mentioned, it seems he
        had even predicted she would not take part in the assault. Upon reaching NGL,
        he implied he had already considered the possibility of Nen users being "assimilated"
        by the enemy. If Netero can correctly anticipate other people''s actions,
        he has, on the contrary, proven time and time again to be completely unpredictable.
