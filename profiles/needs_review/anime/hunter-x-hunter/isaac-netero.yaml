    source_ids: *id002
    confidence: 0.8
  durability:
    text: Multi-City Block level+, up to Small Town level+ with Ryu and Ko
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Can continue fighting even when he lost his left arm and right
      leg, losing them without flinching. When he was younger, he could complete a
      series of 10,000 punches in under an hour without collapsing from fatigue. Unfathomably
      superior to anyone who can pass the Hunter Exam, which involves highly strenuous
      tests such as running 80 kilometers across different terrains)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range, Kilometers with Nen Techniques, Tens of Kilometers
      with Rose Bomb
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Genius (Netero''s seemingly nonsensical, whimsical behavior belies an astounding
      intellect. When preparing to exterminate the Chimera Ants, he had already made
      way for Gon and Killua to participate before meeting them; indeed, he had previously
      predicted the two of them and Palm Siberia would join the mission. He confirmed
      it later on when he sent Morel a text that included instructions for the boys,
      while also using the same words Morel had used to describe him a moment before.
      Since Palm was not mentioned, it seems he had even predicted she would not take
      part in the assault. Upon reaching NGL, he implied he had already considered
      the possibility of Nen users being "assimilated" by the enemy. If Netero can
      correctly anticipate other people''s actions, he has, on the contrary, proven
      time and time again to be completely unpredictable. Zeno Zoldyck described him
      as having the mind of a plant. In spite of his position, he was able to hide
      the existence of a son even to the Zodiacs, seemingly with the sole exception
      of Pariston. However, it is in battle that he shows his full mental prowess:
      also thanks to his experience, his battle instincts are so honed that Meruem
      described his selection of offensive moves as "flawless", and specified that
      it is only through having acquired a pattern-recognition ability similar to
      foresight that he managed to slip through Netero''s attacks)'
    source_ids: *id002
    confidence: 0.8
