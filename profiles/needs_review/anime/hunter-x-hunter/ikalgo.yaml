- id: claim-powers-and-abilities-dc202b90
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Limited Immortality (Type 2) (Chimera
    Ants can survive for an entire day after being decapitated), Nen Manipulation
    (Enhancer;Exhibition: Togashi Yoshihiro -Puzzle- Ikago is also adept at Conjuration),
    Body Puppetry (He can control corpses), Limited Telepathy (Ikalgo can use telepathy
    with other Chimera Ants), Power Absorption (He can use the former abilities of
    the corpses he controls), Body Control (He can turn two of his tentacles into
    a rifle), Surface Scaling, Underwater Breathing (Type 2; As an Octopus hybrid,
    Ikalgo is capable of breathing underwater), Master Marksman (He was able to tag
    Killua from tens of kilometres away without even seeing him just from getting
    his coordinates), Stealth Mastery (Ikalgo is a skilled infiltrator and his Nen
    ability allows him to disguise himself), Poison Manipulation (He can conjure huge
    fleas with anticoagulant properties, an overdoes of this can be poisonous and
    even Killua wasn''t immune to it), High Pain Tolerance (Cutting off his tentacles
    does not seem to cause Ikalgo pain)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
