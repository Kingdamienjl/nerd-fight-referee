claims:
- id: claim-powers-and-abilities-816f4be5
  section: abilities
  axis: hax
  text: Users of Nen have various abilities through the different techniques Ten -
    Aura, Longevity (Prevents aura leaking away from the body which reduces aging
    significantly), Extrasensory Perception/Extra-Senses (Nen Users can see the otherwise
    invisible and intangible Nen, they can also sense emotions projected in Nen to
    know how one is feeling, they can also predict attacks through reading the flow
    of one's Nen), Invisible and Intangible Nen attacks (To those who can't use Gyo
    or can't see aura, Nen attacks are invisible. In general, Nen attacks are entirely
    made of aura. The only exception would be for Conjurer who is a Nen User who can
    materialize objects that sometimes even non-Nen users can see and touch, but even
    then all conjurers should be able to use others Nen types that have invisible
    and intangible properties), Non-Physical Interaction (Nen Users can interact with
    intangible Nen), Limited Forcefield Creation (Ten acts as a barrier against malicious
    nen attacks which are intangible) Zetsu - Stealth Mastery and Limited Body Control
    (Zetsu shuts off all aura nodes in the body, effectively concealing a user's presence,
    it can conceal from even other Nen Users. Ordinary people are unable to sense
    them even if they're in direct line of sight. Zetsu also relieves fatigue as aura
    is forced to stay inside) Ren - Fear Manipulation and Paralysis Inducement (It
    has been stated that without Ten, a Nen User is capable of inducing fear as a
    bluffing to panic the enemyHunter x Hunter Chapter 46, paralysing the opponentHunter
    x Hunter Chapter 101. The good usage of such can make impossible for the enemy
    to get nearHunter x Hunter Chapter 47, where the effort alone migh kill the target
    before overcoming the auraHunter x Hunter Chapter 47), Madness Manipulation (Type
    3) and limited Age Manipulation (Some superior users, such as the Royal Guards,
    have shown to break the spirt of even great huntersHunter x Hunter Chapter 252
    and make them comit suicideHunter x Hunter Chapter 294 due to the fear of a fate
    worse than deathHunter x Hunter Chapter 251, physically aging the targetHunter
    x Hunter Chapter 313Hunter x Hunter Chapter 290), Statistics Amplification (Ren
    also enhances physical characteristics) Hatsu - Energy Manipulation (Hatsu is
    ones personal expression of aura and allows them to manipulate Nen normally in
    terms of five different categories with the sixth being rare among Nen Users),
    Energy Projection (Hatsu is used to project ones aura) and Self-Imposed Law Manipulation
    (Nen Users can place limitations, activation requirements, conditions on their
    abilities or create contracts and vows to elevate their power. A prime example
    is Shizuku who can infinitely suck up objects, but with the condition that it
    cannot suck up living things and things made out of Nen; A forte of Conjurers
    is being able to place laws on limited spaces) Ten, Ren, Ko, Ken, Shu, and Ryu
    all enhance physical characteristics with Ko putting all aura into one place,
    Ken being a prolonged use of Ren, Shu extends aura onto physical objects which
    enhances them physically and Ryu being dividing aura into different places at
    different ratios, at the same time. Also grants enhanced agility and mobility
    (jumping much higher and further etc.) Gyo - Enhances Extrasensory Perception/Extra-Senses
    and can see through In In - Making Nen invisible to the 5 senses or Extrasensory
    Perception that isn't amplified by Gyo, an example being when Kurapika used In
    on his chains Uvogin could no longer see, hear, feel or smell them even though
    his entire body was encased in them for a majority of the fight. En - Psychometry
    (En creates a barrier which allows users to feel the shape and movement of anything
    in the radius). Lastly, Nen Users have Empowerment through extreme emotions such
    as joy, fear, sadness, hatred - in rare cases. This enables something beyond 100%
    proficiency, going beyond the limits of Nen. However, using power beyond ones
    capacity in other words what affinities they were born with is almost always never
    a good thing because it becomes a strain and it could be inconsistent. It should
    be noted that although Nen Users can use all Nen categories (except Specialisation
    which only a select few can use) they have varying proficiency, levels and efficiency.
    Therefore whilst a Conjurer can potentially use Emitter techniques they will only
    be able to reach Level 4 (40% proficiency) and their efficiency will pale in comparison
    to an actual Emitter who uses that same Level 4 technique. This is due to "Effectiveness"
    and "Power" being limited because of a lower proficiency. This rule applies to
    all aura types with the possible exemption of Specialisation.
  source_ids:
  - mediawiki-3901541
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
