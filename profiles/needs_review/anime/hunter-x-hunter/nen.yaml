    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Animal Manipulation (Gon is good\
        \ with community with animals. Gon was able to tamed and raises a foxbear.\
        \ Before Gon left whale island to go pass the hunter exam, tons of animals\
        \ came out to say their goodbyes to Gon.), Enhanced Senses (Can smell better\
        \ than a dog and can smell chemicals across the island.), Regeneration (Stated\
        \ that Gon's broken arm would've taken about ___ days to fully heal up, but\
        \ instead it took about ___ days to fully heal up.), Sound Manipulation (Can\
        \ scream really loud that it can make a person feel dizzy), Vibration Manipulation\
        \ (Gon with a tree can swing hard enough to make a shockwave), Nen Manipulation\
        \ (Credit to vs wiki), Four Basic Principles, Ten (, Ten; \"Point\"): Focus\
        \ the mind, reflect upon the self and determine the goal. Ten (, Ten; \"Envelop\"\
        /\"Shroud\") is the ability to prevent aura from leaking away from the body\
        \ once the aura nodes are opened and rather, contains it within and around\
        \ the body. When one masters Ten they feel a viscous, lukewarm sensation which\
        \ is their emanation of aura around the body, like \"wearing weightless clothes\"\
        . Every living thing emanates a little aura overtime however Ten prevents\
        \ aura from leaving the body which allows one to maintain a youthful vigour\
        \ and age at a much slower rate. It also acts as a defence to physical attacks\
        \ and emotional Nen attacks filled with malice., Zetsu (, Zetsu; \"Tongue\"\
        ): Put it into words. Zetsu (, Zetsu; \"Suppress\"/\"Null\") stops the flow\
        \ of aura from their body altogether by closing all of their aura nodes. This\
        \ makes them harder or even impossible to perceive or sense. However this\
        \ means ones defence to any Nen attack, Ten, is taken away making it a big\
        \ risk to use. Zetsu can also relieve fatigue because it stops the use of\
        \ aura., Ren (, Ren; \"Temper\"): Intensify your will. Ren (, Ren; \"Refine\"\
        /\"Enhance\") focuses on outputting a larger amount of aura than Ten and projecting\
        \ it outwards violently. The user emanates a large amount of aura which enhances\
        \ all of their physical capabilities such as strength and durability. By projecting\
        \ malice into Ren, also called \"bloodlust\" by Nen Users. A prolonged experience\
        \ of this can cause paralysis, intense fear, in some cases madness and without\
        \ a Ten as a defence, death. It's used to intimidate other Nen Users allowing\
        \ them to see the difference in power. Without malice, the pressure of Ren\
        \ cannot be felt by non-users and only by extremely attentive living beings\
        \ with high potential in regards to Nen., Hatsu (, Hatsu; \"Release\"): Put\
        \ it to action. Hatsu (, Hatsu; \"Release\"/\"Act\") is ones personal expression\
        \ of Nen. They project their will into their aura and can create special abilities.\
        \ Ones Hatsu highly depends on the individuality of the said person. Normally,\
        \ people are born with affinities to certain Nen categories which affects\
        \ how well one can manipulate Nen in the sense of one of the categories.,\
        \ Advanced Techniques, Gyo (, Gy\u014D; \"Focus\") is an advanced application\
        \ of Ren by which a Nen User concentrates a large portion of their aura into\
        \ one specific body part. It increases the strength of that one body part,\
        \ but leaves the rest of the body more vulnerable as it's a trade off lesser\
        \ protection but higher amplification in a certain place. It is generally\
        \ used to enhance ones perception to see Nen structures hidden through the\
        \ use of In., Shu (, Sh\u016B; \"Enfold\") is an advanced application of Ten\
        \ and it shrouds objects in aura allowing them to use it as an extension of\
        \ the user's body., Ken (, Ken; \"Fortify\") is an advanced application of\
        \ Ten and Ren. It is primarily a defensive technique through the use of prolonged\
        \ Ren. Ken defends the whole body equally. It can also be used as a miniature\
        \ En., Ryu (, Ry\u016B; \"Flow\") is the use of Gyo from Ken within active\
        \ combat, designating percentages of aura to different parts of the body when\
        \ needed., Ko (, K\u014D; \"Temper\") is a combination of Ten, and Gyo to\
        \ concentrate the users aura into one particular body part. Ten maintains\
        \ the aura around the place. Zetsu stops the flow of aura everywhere else.\
        \ Ren exponentially increases the amount of aura in the place. However, aura\
        \ around the body is dispelled leaving the user vulnerable., Resistance to\
        \ Poison Manipulation (After Gon got struck by poison that paralyzed a person\
        \ for 10 days and Gon was stand up in short amount of time, but struggles\
        \ to walk around.) * Resistance to Pain Manipulation (Gon can take multiple\
        \ beatings for an entire day without showing any pain reacting and even withstand\
        \ pain when his hand is blown off.) *Preview Nen abilities but on far higher\
        \ levels *Law Manipulation, Transformation, Statistics Amplification, Air\
        \ Manipulation (Limited Transformation: Limited transformation where Gon become\
        \ so blood thirsty that Gon makes a condition where he sacrifice all of his\
        \ Nen he will ever gain in his life just to become transforms into his prime\
        \ state that is powerful enough to rival base Meruem.)"
