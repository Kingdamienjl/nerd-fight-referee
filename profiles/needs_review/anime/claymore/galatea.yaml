    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) *Superhuman Athleticism (Leapt over Pa Kent''s head
        from a standing position, and her legs should be capable of producing literally
        billions of times more downward force than those of Batman or Batgirl) *Solar
        Energy Absorption and Empowerment (Derives her powers from yellow solar radiation)
        *Flight (Can fly faster than the speed of sound) *Longevity (Kryptonians (and
        thus their counterparts on Argo) age slower than normal people, as shown with
        Superman in the Beyond Era) *Heat Manipulation, Energy Projection, and Durability
        Negation (with Heat Vision, which can lobotomize its target and is hot enough
        to totally vaporize the metal Cosmic Boy restrained her with - she can also
        use it for super-precision work, such as vaporizing individual plant seeds
        from a distance as well as use an omnidirectional attack, emitting a huge
        shockwave of heat) *Air Manipulation, Breath Attack, and Attack Reflection
        (with Super-Breath - her Super-Breath being powerful enough to cancel out
        Volcana''s flame blasts) *Enhanced Senses (Kryptonians/Argoans possess Super-Hearing,
        X-Ray Vision, Telescopic Vision, and Microscopic Vision) *Hand-to-Hand Combat
        Skills (Was trained personally by Green Lantern to the point where he eventually
        claimed he had nothing left to teach her. Even prior to this training, she
        could 1v3 the Female Furies, tricking Lashina into electrocuting her teammates
        and contending skill-wise with Lashina herself) *Air Manipulation (Can create
        powerful winds by spinning, enough to force Parademons into a fire pit) *Spin
        Attack (Used a spin attack to rip apart Poison Ivy''s plants) *Acrobatics
        (Flipped backward to avoid an attack from Lashina) *Enhanced Swimming (This
        scene, from "Legacy," implies that like her cousin, she can essentially fly
        underwater, allowing super high-speed underwater movement) *Weapon Mastery
        (Used a sword proficiently whilst in Skartaris) *Resistance to Extreme Heat
        (Shrugged off Volcana''s flame directly to her body. Endured Brimstone''s
        body heat, which would have "fried" Captain Atom. Withstood a beam of flame
        from Wildfire. Was unaffected by a huge, fiery explosion) *Resistance to Extreme
        Cold (Was unaffected by swimming through glacial waters) *Limited Resistance
        to Electricity Manipulation (Though weaker to it than she is to physical blows,
        she can still cope with powerful electric shocks. Kept fighting immediately
        after being electrocuted by Lashina. Withstood a blast from Lightning Lad)
        *Considering she''s stated in official merchandise to have all of Kal''s superpowers,
        she also boasts the following: Self-Sustenance (Type 2), Regeneration (Low),
        Vocal Mimicry via Body Control, and Resistance to Radiation Manipulation,
        Mind Manipulation, Durability Negation, and possibly Spatial Manipulation.'
      source_id: character-stats-profiles-galatea
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Large Planet Level (Upscaling from 1.03 Ronnatons - Incapacitated Validus\
        \ in a single hit. Despite this iteration of Validus not necessarily scaling\
        \ to DCAU Superman (as he does in JL v FF, as Supergirl\u2019s destruction\
        \ of his body in Far From Home would likely have forced the FF to create a\
        \ new, possibly stronger body for him as of some point prior to JL v FF),\
        \ he could break through Brainiac 5\u2019s force field to harm him, with said\
        \ force field being durable enough to take a blast from the Emerald Eye of\
        \ Ekron, which easily overpowered Green Lantern\u2019s ring blast. Though\
        \ slightly weaker, she could fight and damage Galatea. Galatea could easily\
        \ bash apart Steel\u2019s armor - in contrast, Metallo (who is shown to be\
        \ comparable in strength to Martian Manhunter) couldn\u2019t even dent the\
        \ armor after several killing-intent blows. Steel's armor also was completely\
        \ unaffected by an attack that incapacitated Wonder Woman. Hurt and ragdolled\
        \ Green Lantern even with his energy aura activated, with GL only gaining\
        \ the upper hand in their battle after Kara had become fatigued by being dogpiled\
        \ by almost the entire Legion of Super-Heroes. With just her super-breath,\
        \ canceled out blasts from Volcana - Volcana\u2019s blasts were shown to beam\
        \ struggle with Green Lantern\u2019s blasts. Green Arrow claiming GL is more\
        \ powerful than Supergirl can be dismissed for two reasons - one, it doesn't\
        \ seem particularly plausible that Green Arrow would somehow be an authority\
        \ on the comparative power levels of characters literally billions of times\
        \ more powerful than him, and two, the feats contradict such a claim. Harmed\
        \ and held her own against the Female Furies, who could beat up Granny Goodness\
        \ offscreen - Granny Goodness is strong enough to fight Kalibak. Oneshotted\
        \ a clone of Long Shadow, who has connective scaling to Wonder Woman. Nearly\
        \ solo\u2019d most of the Legion of Superheroes, a group that has repeatedly\
        \ fought and defeated the Fatal Five, during \"Far From Home.\" Fought and\
        \ overwhelmed Lashina, the most powerful Female Fury - Stompa, another Fury,\
        \ could cause a notable earthquake with a single stomp. Flew through a huge\
        \ structure of metal pipes. See here for my reasoning as to why DCAU Superman\
        \ is not Low Complex Multiversal)"
      source_id: character-stats-profiles-galatea
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: "At least Relativistic+ combat speed and reactions (Upscaling from 0.53c\
        \ - Easily outmanuevered and attacked Green Lantern too quickly for him to\
        \ even turn his body to avoid her attack, and fought the likes of Volcana.\
        \ Fought and kept up with Lashina and Mad Harriet, with the two of them (alongside\
        \ Stompa) being capable of tagging Granny Goodness in order to \u201Cpunish\u201D\
        \ her by beating her to a pulp offscreen - with Granny Goodness being fast\
        \ enough to compete in battle with Kalibak. Overwhelmed Chameleon Boy with\
        \ her speed, landing a punch on him, with Chameleon Boy being capable of competing\
        \ combat-speed-wise with Mano), with Massively Hypersonic+ flight speed (Mach\
        \ 1,283 - Shown to fly at the same speed as AMAZO within an atmosphere, wherein\
        \ his flight speed should be at least equal to Superman's, considering Superman\
        \ makes up a portion of his powers - AMAZO shouldn't have been holding back\
        \ his flight speed at the time, as he was trying to find Luthor as quickly\
        \ as possible. Flew fast enough to create a sonic boom visible from the ground)\
        \ and at least Subsonic running speed (Ran from the Bus Stop to the Kent Farm,\
        \ with such speed that she kicked up huge clouds of dust)"
      source_id: character-stats-profiles-galatea
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Large Planet Level (Upscaling from 1.03 Ronnatons -Should be capable
        of withstanding her own physical power. Took attacks from Galatea, who is
        slightly stronger than her. Took a punch from a clone of Long Shadow and was
        entirely unharmed. Shook off blasts from Volcana. Took a blast from Granny
        Goodness' Mega Rod directly to her hand and pushed back against it, sending
        it back into the Mega Rod - these blasts have knocked out Granny Goodness,
        who is strong enough to fight Kalibak. No-sold the explosion of a massive
        Apokolyptian machine)
      source_id: character-stats-profiles-galatea
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Kryptonite weakens her massively and can even prove lethal upon sufficient
        exposure. Light or Radiation from a red sun deprives her of her powers over
        time. Is susceptible to electricity and magic moreso than physical blows.
        Note: Bruce Timm has stated that the original DCAU tie-in comics are not canon,
        with the only tie in comics that have statements to the contrary (other than
        Batman: The Adventures Continue, which has so many continuity issues that
        it''s essentially impossible to argue it''s canon) being Justice League Infinity,
        the Batman and Harley Quinn tie in comics, and specifically the first annual
        of Batman Adventures. Ergo, I only consider those three comics canon. Category:Goulden1998
        Category:Tier 5'
      source_id: character-stats-profiles-galatea
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
