        Users Category:Regeneration Users Category:Statistics Amplification Users
        Category:Weapon Masters Category:Power Mimicry Users Category:Afterimage Users
        Category:Social Influencers Category:Precognition Users'
      source_id: vsbattles-galatea-claymore
