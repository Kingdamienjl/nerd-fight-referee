    - field: weaknesses
      value: 'Seemingly needs to sleep and eat. Extremely attached to her plant creations,
        to the point where killing them may cause her to become distraught and lose
        her composure. Her plant beasts have short lifespans, and seem to be weak
        to electricity. Note: Both Batman and Harley Quinn (evidence compiled here)
        and its tie in comic (stated here, is "in the world of BTAS") are canon to
        the DCAU, despite their tonal differences from many of the other properties
        within the DCAU. Note 2: Bruce Timm has stated that the original DCAU tie-in
        comics are not canon, with the only tie in comics that have statements to
        the contrary (other than Batman: The Adventures Continue, which has so many
        continuity issues that it''s essentially impossible to argue it''s canon)
        being Justice League Infinity, the Batman and Harley Quinn tie in comics,
        and specifically the first annual of Batman Adventures. Ergo, I only consider
        those three comics canon. Category:Goulden1998 Category:Tier 9'
