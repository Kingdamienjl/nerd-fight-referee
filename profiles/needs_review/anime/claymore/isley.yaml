  name: 400px ==Summary== Isley is a male Awakened being and the former no. 1 of the
    Organizations' first generation of warriors. When in his transformed state, he
    resembles a sleek, black centaur whose right arm can act as a lance or axe and
    the left as a bow or shield. He fires homing arrows with great skill. Isley initiated
    the Northern campaign to kill Luciela and take over the south and become an unrivaled
    power by destroying the possibility of an alliance between Riful and Luciela against
    him and Priscilla. Isley sacrificed his followers to distract the organization
    and Riful while he went south to confront Luciela. During the North campaign,
    he finds Raki and takes him in. Later, when Raki compliments him on his skills
    with a sword, Isley agrees to become Raki's teacher and begins to instruct him
    in swordsmanship. In the next seven years after he sent the awakened beings to
    the west and east, it is discovered that Isley emerged victorious against Luciela
    in which both contestants nearly died. Isley remained quiet for the next seven
    years, and later, he is seen being hunted by Abyss feeders. In the aftermath,
    Isley finally falls after been slowly eaten away. ==Powers and Stats
