- id: claim-weaknesses-9adff7dd
  section: weaknesses
  axis: weakness
  text: 'Because Clare was created from the flesh and blood of Teresa, who was already
    a half-human, half-Yoma warrior, the Yoma blood within Clare is diluted. As a
    result, her physical abilities were originally inferior to those of an average
    warrior, and early in the story she had little talent besides Yoki sensing. Excessive
    Yoki use risks awakening, causing her to lose her humanity and transform into
    a monster. Like other warriors of the Organization, she has a permanent midline
    incision that must be regularly sutured. Her Quicksword originally had inferior
    power, speed, duration, and responsiveness compared to Irene''s due to Clare''s
    weaker base ability and temperament being unsuited to the technique. If used with
    her left arm, its power and speed decline even further. After the Northern Campaign,
    Clare suppresses her Yoki so completely that techniques requiring Yoki release,
    such as Quicksword, become forbidden techniques for her unless she breaks that
    restriction. Notable Attacks/Techniques: *Yoki (Demon Energy): The aura or life-force
    of Yoma-derived beings. It originates from the artificial monster biology created
    by the Organization through Asarakam-derived tissue, rather than from literal
    demonic power. By releasing controlled amounts of Yoki, Claymores can enhance
    their physical abilities, senses, and regeneration. However, excessive Yoki release
    risks awakening and transforming the warrior into an Awakened Being. *Yoki Sensing:
    Clare''s greatest natural talent. Although inferior to Teresa, Clare has exceptional
    sensitivity to the flow of Yoki. Since warriors and Awakened Beings use Yoki to
    control their bodies, Clare can read an opponent''s Yoki flow to predict their
    movements before they occur. This allows her to evade faster opponents and counterattack
    with precise timing. *Yoki Suppression: Clare has learned to hide one''s Yoki
    aura while retaining Yoki sensing and fighting ability. *Quicksword: Irene''s
    signature technique, performed by releasing Yoki into one arm to produce extremely
    rapid sword strikes. Clare uses it through Irene''s transplanted right arm, but
    her version is initially inferior to Irene''s in power, sword speed, duration,
    and responsiveness because Clare''s base ability is lower and her temperament
    is poorly suited to the technique. When used with her left arm, its power and
    speed are even lower. However, Clare later combines Quicksword with her superior
    Yoki sensing, creating a version that can target or avoid specific opponents and
    overcoming the technique''s usual weakness of being unable to choose its targets.
    After seven years of training, her improved physical ability allows her to unleash
    a Quicksword equal to Irene''s during her battle with Cassandra. *Windcutter:
    A refined sword technique based on speed, timing, and precision rather than raw
    Yoki output. Unlike Quicksword, which partially awakens the arm for overwhelming
    speed and power, Windcutter relies on skillful sword-drawing and controlled slashes,
    making it more stable and less dependent on monster power. *Voice Change: Clare
    can impersonate a male voice and other types of voices. *Rafaela''s Fighting Style:
    After inheriting Rafaela''s memories and emotions, Clare becomes capable of using
    Rafaela''s combat style. By spreading a membrane of Yoki around her body, she
    can accurately sense movement even outside her field of vision. She also becomes
    capable of combining swordsmanship with physical techniques such as kicks. *Partial
    Awakening: Clare can partially transform into a monstrous form. Her eyes become
    golden with slit pupils, her body distorts, her legs become hock-jointed for greater
    speed, blades emerge from her right arm, and her left arm grows larger and claw-like.
    Clare later reverts to normal with help, but due to regret, she becomes unable
    to access this form again. *Soul Link: A unique ability inherited through Rafaela
    that allows Clare to form a deep spiritual connection with another being. Through
    this link, Clare gains Rafaela''s memories and summons Teresa''s spirit from within
    herself. It also allows Teresa to use Clare''s experience and abilities, amplified
    by Teresa''s superior Yoki, intellect, and combat instincts. Because Clare acts
    as Teresa''s spiritual anchor, Teresa can fully awaken without losing her humanity.
    Note: Not to be confused with the similarly - named character from Baccano ==Notable
    Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Claymore Category:Adults Category:Anime Characters Category:Berserkers
    Category:Demons Category:Energy Users Category:Female Characters Category:Good
    Characters Category:Heroes Category:Humans Category:Hybrids Category:Manga Characters
    Category:Martial Artists Category:Orphans Category:Precognition Users Category:Primary
    Protagonists Category:Protagonists Category:Regeneration Users Category:Soul Users
    Category:Statistics Amplification Users Category:Sword Users Category:Transformation
    Users Category:Warriors Category:Blade Users'
