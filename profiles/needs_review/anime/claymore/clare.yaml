    - field: weaknesses
      value: 'Gumball is egotistical, lazy, cowardly and cocky, being very prone to
        making ignorant decisions. He doesn''t have a lot of combat experience and
        will often run from his opponent instead of directly confronting them in a
        fight. Rarely takes things seriously at first and is vulnerable to underestimating
        his opponents. As a cat, Gumball is highly afraid of water and his aquaphobia
        makes him think he cannot swim. Building up his toxicity takes a lot of time
        and drastically weakens him. Gumball is usually unaware of his protagonist
        status, so he''s unlikely to utilize it to its full potential. | Same as before.
        The Universal Remote is as fragile as an actual TV remote, rendering it capable
        of easily being destroyed, and it can also run out of batteries. The Magic
        Notebook has a limited amount of pages and erasing a passage reverses any
        changes; it can also easily be ripped from his possession and destroyed. If
        The Console is defeated, the game will end. Usage of The Console will also
        backfire on Gumball, as he will be sucked into the game with his opponent,
        and The Console itself came to life and turned against him, being more than
        willing to nearly kill him. Note 1: While Gumball is constantly potrayed as
        a loser or a coward, it doesn''t necessary mean he is a weak character, especially
        when he has showed feats contradict to how he is supposed to be. Typically,
        in The Faith, Gumball fought and defeated a hoard of boyscout armed with basic
        weapons, which are later implied to be sharp enough to decapitate/amputate
        someone in The Pact, using his fisticuffs whilst Darwin still needed a bat
        to be able to deal with them. He further demolished stronger characters like
        Tina and Ocho in The Gift, with them could only survive because of the off-screen
        regeneration, since Sarah had got melted by Darwin shinning the sunlight into
        but then she later looked completely fine when getting to the store with other
        students. Interestingly, Gumball secretly seems to be a formidable invidual
        in his school as in The Bus, other students showed an obvious fear of him
        when he popped Alan for not agreeing with his suggestions hence no one dared
        to go against him afterwards. During The Knights, Gumball shows how much fear
        he can put into everyone in his family, especially his mother Nicole, and
        easily took Richard sign down his position once overwent some changes in personality
        as seen during The Name. Logically, when not holding back, he should be drastically
        stronger than his younger sister Anais, who force Tina to shed her tail and
        ran away out of scariness, alongside with Hector to pretend to be dead as
        a method to protect himself. Note 2: While being shown as a fool, in which
        he''s admitted to failing middle school several times or easily to get tricked
        due to his naive demeanor, Gumball isn''t exactly underdeveloped, since there
        are plenty of hints that he is actually pretending and this is partly stem
        from his cynicism towards society. In The Saint, Gumball showed his poor common
        sense when he could barely use fire extinguisher and just slamming it repeatedly
        into the burning computer. But earlier in The Phone, he''s showm to use one
        properly to put out the fire, proving for his pseudo-idioticity. It is also
        quite clear that Gumball is limiting his own capabilities for some reason
        when he could perform a back flip in The Robot and furthermore complex aerobatics
        movements in The Romantic while dodging Bobert''s laser, but future episodes
        potray him to be a terrible athlete that is not even able to climb through
        a swivelling chair. Gumball gets F to F- grades for music though he can sing
        well and play some instruments such as ukulele and clarinet. ==Gallery== GumballWatterson-Season1.png|Gumball''s
