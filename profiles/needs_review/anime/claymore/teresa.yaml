    - field: weaknesses
      value: 'Teresa lost her ruthlessness and showed excessive compassion for her
        opponents after she met and bonded with Clare. In the final battle, Teresa
        had only come back to the living world to answer Clare''s call and wrap up
        her business there; once that was done, she would be gone for good. Notable
        Attacks/Techniques: *Personal Skill: **Acute Yoki Sensing: Teresa''s greatest
        specialty. She could sense the minute flow of Yoki inside an opponent''s body
        and predict their next movements from it. This ability was so refined that,
        combined with her physical ability and swordsmanship, she could defeat most
        enemies without any visible change in fighting style. **Teresa of the Faint
        Smile: Teresa''s title came from her habit of slaying enemies while wearing
        the same faint smile. Because she rarely needed to release Yoki and had no
        flashy signature style in ordinary combat, her calm expression became the
        most recognizable feature of her fighting. **Controlled Awakening: During
        the final battle, Teresa awakened under Clare''s control. Because Clare acted
        as the anchor to Teresa''s heart and humanity, Teresa was able to assume an
        awakened form without losing herself. In this state, she took on a form reminiscent
        of mythological twin goddesses and ended the battle with Priscilla. *Mimicry:
        Teresa can mimic techniques and abilities she and Clare have witnessed or
        learned. **Quicksword: Irene''s signature technique and Clare''s trump card.
        The technique releases Yoki into one arm to unleash extremely rapid sword
        strikes while the rest of the body remains controlled. Teresa brought out
        the technique''s full potential, using it to shred many of Priscilla''s bodies
        in less than a second. **Dust Eater: Cassandra''s signature fighting style.
        It involves planting both feet firmly and swinging the head and upper body
        like a pendulum, using awkward low-angle movement and centrifugal force to
        attack from unexpected directions. Teresa saw through the technique despite
        its unusual nature. **Rafaela''s Fighting Style: A combat style inherited
        by Clare through Rafaela''s memories. It involves spreading a membrane of
        Yoki around the body to sense movements outside one''s field of vision, while
        combining swordsmanship with kicks and other physical techniques. **Drill
        Sword: Jean''s powerful drill-like attack, performed by twisting the arm at
        high speed to create a piercing rotational strike. **Rippling Sword: Ophelia''s
        signature technique. It uses the flexibility of the user''s arm and sword
        to make the blade undulate, creating a rippling illusion that makes the attack
        difficult to read. **Phantom Mirage: Miria''s movement technique, which uses
        bursts of Yoki to create high-speed afterimages. Teresa''s speed was so great
        that even casual movement could produce a similar phantom-like effect. **Windcutter:
        Flora''s sword technique. It is a blindingly fast slashing technique based
        more on skill, timing, and sword-drawing speed than Yoki release. Though slower
        and less powerful than Quicksword, it is easier to control. Teresa used it
        together with Helen''s limb extension to greatly increase the reach of her
        slashes. ==Gallery== Teresa1.png Teresa.jpg ==Notable Matchups== Victories:
