    - field: weaknesses
      value: 'The body of each warrior from the Organization has an incurable midline
        incision which needs to be stitched regularly to prevent their internal organs
        from spilling out. Miria''s Phantom Mirage requires large amounts of Yoki,
        this technique is hindered by limited safe usage due to the exhausting mental
        and physical toll it takes on the user. The fastest version of The Phantom
        Mirage puts the user at risk of a full Awakening and only allows for movement
        in straight lines. Notable Attacks/Techniques * Mirage (Pre-Time Skip): By
        increasing the Yoki in her legs she can achieve burst-like speeds that last
        only for an instant. Her speed is so fast that she can escape the sight of
        even Awakened Beings that previously blitzed the party and leave afterimages
        behind. Its downside is that the technique drains her energy and she cannot
        use it for more than 20-30 times. * Mirage (Post-Time Skip): After the 7 year
        time skip Miria came back with a new kind of Mirage. Instead of relying on
        Yoki she improved her base speed to casually create afterimages with sheer
        speed and her movements became much more precise. She was shown to keep up
        with Clare''s Wind Cutter and moving faster than even single digits Claymores
        can see. She hadn''t lost her true Mirage technique though and by releasing
        her Yoki Miria can reach even higher levels of speed. * Phantom "Exceed":
        A technique that exceeds the normal phantom. Whereas Miria describes the phantom
        as raising her Yoki to its limits from a normal state, the new technique exceeds
        those limits to a state of momentarily Awakening. She was able to use this
        technique to fight evenly with Hysteria. However, what it gives in raw speed,
        it lacks in precision, and as such, she was unable to use it to avoid the
        blows of Hysteria while fighting her. ==Notable Matchups== Victories: Losses:
