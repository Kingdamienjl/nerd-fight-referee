    - field: weaknesses
      value: "A lingering remnant of Priscilla's humanity subconsciously sought her\
        \ own death, which held her back from killing young girls \u2014 sparing them\
        \ in the hope that one might someday grow into a warrior strong enough to\
        \ end her. She also frequently goes easy on her opponents. She must regularly\
        \ consume human flesh, or that of similar monsters, to maintain her overall\
        \ condition and reconstitute her form (she degenerated into a small child\
        \ and was considerably weakened after starving herself for seven years). After\
        \ years of living together, Priscilla appeared to develop feelings for Raki\
        \ and was reluctant to kill him, using only her human-level strength when\
        \ fighting him. Her ultimate form cannot regenerate from complete pulverization.\
        \ Notable Attacks/Techniques: *Yoki (Demon Energy) Release: Priscilla channels\
        \ Yoki to amplify her strength, speed, regeneration, and other physical abilities,\
        \ which enables her to fight with overwhelming power. Her Yoki is so vast\
        \ that she can regenerate almost limitlessly, survive decapitation, resist\
        \ parasitic possession and life force absorption. *Yoki Control (\u5996\u6C17\
        \u5236\u5FA1, Y\u014Dki seigyo): Priscilla can regulate Yoki production at\
        \ the source, adjusting her output anywhere from 0\u2013100%. This is often\
        \ confused with Yoki Suppression, which conceals existing energy rather than\
        \ regulating its production. Her Yoki aura can vanish completely while she\
        \ retains full Yoki-sensing and fighting ability, making it impossible for\
        \ opponents who fight by reading Yoki to perceive her at all. In Priscilla's\
        \ case, this ability is also assumed to stem from a protective instinct that\
        \ keeps her from being overwhelmed or consumed by her own immense latent power.Claymore,\
        \ Fragments of Silver Omnibus 1, Yoma War Record I: Test Subject list, p.\
        \ 510 *Finger/Arm Tendrils: Executed by piercing an opponent with her fingers\
        \ or arm. Her fingers or portions of her arms extend into tendril-like protrusions\
        \ (shown to be bladed on one occasion, when she obliterated a giant spike\
        \ fired by the Destroyer) that penetrate and shred the target from the inside\
        \ out before tearing it apart. Usable in both her human and awakened forms.\
        \ *Extendable Limbs: Priscilla can rapidly grow and extend her wings, fingers,\
        \ horn, and arms, and can sprout multiple tentacles to attack and pulverize\
        \ her enemies. *Awakened"
      source_id: vsbattles-priscilla-claymore
      provider_id: vsbattles
      authority: high
