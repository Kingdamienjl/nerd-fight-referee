    - field: weaknesses
      value: 'Her Yang Sword consumes a lot of mana, and becomes dull without the
        sun Notable Attacks/Techniques: *Divine Protection of the Sun: Makes Priscilla
        stronger during the day and boosts the effects of buffs. *Extraordinary Luck:
        Priscilla has unique luck, which she mentions makes "the world in her own
        favor", granting her extremely high luck in her daily life and in fights.
        She also has great intuition, which allowed to guess the right and safest
        path towards the lost Schult during their stay in Priestella. She claims that
        it doesn''t matter what choice she makes, since she''ll always be right, and
        it will always be positive for her. *Soul Marriage: a long-lost secret technique
        of the old world that has been forgotten by most people. By dividing her own
        Od and bestowing it onto someone of her choosing, Priscilla imbues them with
        power more or less reflective of her own, and she greatly boosts their healing
        capabilities to the point someone acting under her Soul Marriage can receive
        multiple fatal wounds and be healed completely in a few short moments. However,
        in order for Soul Marriage to work, Priscilla must not only love the receiver
        of this ability, but she must also be loved by that person in return. If this
        condition isn''t met, Soul Marriage will not work. During the Flying Dragon
        Cataclysm in Guaral, Priscilla used this ability to protect Schult from being
        harmed by ensuring that he''d be healed against any attack towards him. Additionally,
        she can use Soul Marriage on objects gifted to her with love, allowing her
        to transfer fatal blows into things like the jewellery she wears. *Sun Disk:
        Allows her to remain uncontrolled by Sirius during the battle against Wrath.
        In addition to that, the ability was also capable of protecting other people,
        like Liliana Masquerade, for example. It is unknown whether this is the power
        of being a powerful Yang Magic user, or another source of power. *Beloved
        Articles: As a user of Soul Marriage, gifts that are loved by Priscilla and
        were given with love become viable substitutes for lethal damage. Some jewellery
        Priscilla wears has met these criteria. ==Notable Matchups== Victories: *Akame
        (Akame ga Kill!) Akame''s Profile (Both were 7-A. Speed was equalized) *Makima
