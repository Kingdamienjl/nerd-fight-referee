        engaged in skirmishes for many years. With her cunning, which almost seemed
        like magic, Priscilla had managed to make the most of this unfavorable situation,
        bringing the faltering and anxious regional power holders onto her side all
        at once, pacified the empire, and proceeded to vigorously revitalize impoverished
        villages and otherwise strengthen her landsVolume 16, Chapter 2. Was considered
