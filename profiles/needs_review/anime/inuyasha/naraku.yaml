  speed:
    text: "Naraku could move faster than the eye could see, both in the air and on\
      \ the ground. He managed to fight against Inuyasha and his group many times\
      \ through his natural speed, though he usually retreated after a short time.\
      \ * Superhuman vitality and regeneration: Naraku's supernatural vitality coupled\
      \ with his immense regenerative capabilities made him a difficult foe to physically\
      \ combat. Even if beheaded or got his body entirely shattered, he will not die.\
      \ If he is attacked without spiritual power, he will not take any damage.Zusetsutaizan\
      \ \u014Cgikaiden, page 191. He can break apart and reassemble his body at will.\
      \ He suffers no damage from physical attacks such as being slashed with swords\
      \ or stabbed with spears.Zusetsutaizan \u014Cgikaiden, page 192. At Mount Hakurei,\
      \ he even used Sessh\u014Dmaru to test out his new body's capabilities and emerged\
      \ unfazed.{{Cite anime|1|124}} * {{Translation|Transformation|\u5909\u5316,\
      \ \u3078\u3093\u3052|Henge}}: Naraku could take the form of anyone or anything\
      \ that he chose, usually a humanoid, and change his voice along with his physical\
      \ appearance. He possessed the young lord, Kagewaki, and remained in that standard\
      \ form for the rest of the series. We're told by Miroku that every time his\
      \ grandfather battled Naraku, the demon appeared in a different form, being\
      \ defeated when Naraku took the form of a beautiful young woman. The most important\
      \ instance of his shapeshifting would be the time that Naraku had disguised\
      \ himself as Kiky\u014D and Inuyasha and made them hate one another. As his\
      \ scent didn't change with his form, Naraku ceased using this ability as Inuyasha\
      \ and K\u014Dga could smell his scent. * Demonic magic: Naraku knew many different\
      \ spells and curses. More often than not Naraku utilizes the power of demonic\
      \ spells and other magic when combating Inuyasha and his group directly. An\
      \ example being the Illusionary Death, which was used to distract Inuyasha's\
      \ group when they tried to rescue Kiky\u014D from him. However while Naraku\
      \ is proficient in the use dark spells and curses, it's not his primary power\
      \ to use and thus he required the dark priestess, Tsubaki's help to curse Kagome\
      \ with an advanced curse. ** Kazaana: Naraku's most famous curse that he used\
      \ to inflict upon Miyatsu and his male descendants to eventually destroy his\
      \ bloodline. The Wind Tunnel is curse that that forms a void within the right\
      \ palm of the males born in Miyatsu's bloodline that forever swallows anything\
      \ in its path in a violent wind turret like a black hole. While early the size\
      \ the Wind Tunnel is small but with time grows larger until it devours the bearer\
      \ themselves. ** Spell of illusory death: A demon art by which people's souls\
      \ are eaten when they come into contact with the enweaved tentacles. Once victims\
      \ fall prey to it, they die in despair, seeing illusions of the negative aspects\
      \ of their hearts. If a person has a strong will to live, the illusion can be\
      \ broken.Zusetsutaizan \u014Cgikaiden, page 195. ** Art of demon puppets: When\
      \ Naraku is in a dormant state and cannot move, or when he makes contact with\
      \ someone that may be dangerous to him, he uses demon puppets in place of his\
      \ real body. They were mostly made of mud and soil, and were able to spring\
      \ roots in order to attack opponents. They would only disappear if their heart\
      \ was destroyed, which was a golem with a piece of Naraku's hair that was wrapped\
      \ around it. Following Mount Hakurei, Naraku no longer employed the usage of\
      \ demonic puppetry as he could survive attacks that would have killed him in\
      \ the past. Although they are puppets, their senses are connected to his. He\
      \ use them at will and their strength in battle is comparable to his. * Absorption:\
      \ Naraku was able to absorb other demons into his body, adding their powers\
      \ and their bodies to his own. This was primarily how he gained strength, by\
      \ seeking out and absorbing strong demons, and giving him access to their powers.\
      \ Naraku obtained valuable abilities such as the Kong\u014Ds\u014Dha through\
      \ this ability. The process dissolves and kills the demons he absorbs, as specified\
      \ when he tries to absorb K\u014Dga. He could even absorb other demons like\
      \ him from the inside. Naraku could also expel weaker body parts in order to\
      \ rid himself of them. ** Demon parts: As he was made up of multiple demons\
      \ in one body, Naraku was able to manipulate their body parts at will in order\
      \ to restructure and strengthen his body, and even if he had a body part cut\
      \ off, Naraku could reabsorb it. He could use these parts to attack his enemies\
      \ by extending one of his body parts like a weapon. The method of attack depended\
      \ on the situation, but basically stabbing, striking and enlargement were most\
      \ common. His possible true form before reconstruction contains many tentacles\
      \ and demon parts. In his reconstructed form, he primarily attacks by extending\
      \ the various spikes on his body, and can also manifest teeth on his tails and\
      \ stretch them to try to bite his opponents. ** Incarnation creation: Naraku\
      \ could make incarnations out of his own body to do his dirty work f"
