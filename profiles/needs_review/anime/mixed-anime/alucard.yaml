    - field: weaknesses
      value: "Very holy objects such as blessed weaponry can still hamper him or greatly\
        \ annoy him, could have lost most of his power due to killing all his familiars\
        \ except Schr\xF6dinger. He cannot cross water by himself. He believes he\
        \ should be slain in combat by a human, and may hold back and accept his fate\
        \ if challenged by one - conversely, he is disgusted by enemies that attempt\
        \ to leave their humanity behind, stating that only a man can kill a monster.\
        \ Notable attacks/techniques: *Immortality: This ability is rather ambiguous,\
        \ as Alucard himself has stated that immortality is a myth. However, what\
        \ it most likely refers to is the human souls inside Alucard; it has been\
        \ speculated that, when damaged by blows that would have killed or incapacitated\
        \ him such as exceedingly holy weapons, the damage is instead directed to\
        \ his reservoir of souls. Because this ability does not really grant him true\
        \ immortality, it can be considered as pseudo-immortality. However, after\
        \ \"Monster of God\" Anderson destroyed the rest of Level 0, Alucard was still\
        \ able to regenerate on par with him. (This was on par with Alucard before\
        \ releasing Level 0). However, the \"soul count\" is just a fan theory, and\
        \ has never been definitively proven, although there is some evidence in the\
        \ series to support it. When he is struck by holy weapons some of the souls\
        \ spontaneously die even though they were unscathed. Also, at the end of the\
        \ series, Alucard stated he returns by killing all the souls inside him but\
        \ one. It was even speculated by Anderson, an experienced vampire hunter/expert,\
        \ that this was the reason for his not being able to kill Alucard. *Ultimate\
        \ Regeneration: Alucard's ability to regenerate is considerably greater than\
        \ any other vampire's in the entire series. He has regenerated from a pool\
        \ of blood and from being decapitated, blown to shreds by gunfire, incinerated\
        \ completely, etc. When damaged to an extreme extent, his body simply turns\
        \ into a shadow-like substance and reconstitutes. Exceedingly holy weapons\
        \ have been shown to incapacitate him for a time, but even Anderson, augmented\
        \ with Helena's Nail, could do no lasting harm to him. While regenerating\
        \ against Anderson, he became a shadow entity at one point. *Superhuman Accuracy:\
        \ Alucard has been known to hit targets at great range using handguns while\
        \ looking the other way. He does this by using his so-called 'third eye'.\
        \ *Superhuman Agility: The ability to defy gravity to an uncertain limit.\
        \ He is also seen leaping impossible distances and can walk up vertical surfaces.\
        \ *Intangibility: The ability to pass through solid objects. *Incorporeality:\
        \ Alucard's true form is a shadow-like non-physical entity. All physical and\
        \ even supernatural attacks phase right through him and it is extremely difficult\
        \ to damage his true form. *Shadow Manipulation: Manipulation of shadows into\
        \ physical form, which he can then use however he wishes. *Blood Manipulation:\
        \ The ability to control blood with the mind, as demonstrated when he absorbed\
        \ the blood of London's dead in volume 10. *Shapeshifting: Alucard can transform\
        \ himself or parts of himself into bats, insects, snakes, hellhounds, other\
        \ human forms including a little girl, an amorphous mass of darkness, and\
        \ many other forms. Alucard has four known human forms, each with different\
        \ characteristics and weapons. He also states that his form means nothing\
        \ and that he can take any form that he chooses. *Weather Control: The ability\
        \ to control the weather to an unknown limit, as demonstrated by the fog created\
        \ when he returned to London aboard the H.M.S Eagle. *Smoke Manipulation:\
        \ The ability to control smoke to an unknown extent. *Teleportation: The ability\
        \ to disappear and reappear somewhere else. He also has the ability to levitate.\
        \ *Telekinesis: In the manga, Alucard uses telekinesis to close a door on\
        \ a fleeing SWAT officer. He also launched six SWAT officers into the air\
        \ and guided them to flag poles where they were impaled. Alucard is later\
        \ seen moving a broken down aircraft carrier from the Gulf of Italy to the\
        \ Dover of London all in a little less than 40 minutes. *Telepathy: Alucard\
        \ can speak telepathically to his fledgling, Seras Victoria. *Mind Reading:\
        \ He is able to listen to what the others are thinking of. *Hypnosis: Alucard\
        \ was able to hypnotize a hotel receptionist who objected to the size of his\
        \ luggage (his coffin), when he travelled to Brazil in order to investigate\
        \ leads on Millennium (fans sometimes call it the \"Love Beam\" after a remark\
        \ from Pip). *Precognition: As a standard for a vampire, he has precognition,\
        \ the ability to see into the immediate future, which allows him to predict\
        \ the movements of the opponents he fights. According to Pip, a vampire can\
        \ easily dodge a bullet with their ability to predict human movements. *Familiar\
        \ Summoning: The ability to summon familiars, the souls of those whose blood\
        \ he has sucked in a variety of forms that either sprout from his body or\
        \ swarm around him as an army numbering in the millions. T"
