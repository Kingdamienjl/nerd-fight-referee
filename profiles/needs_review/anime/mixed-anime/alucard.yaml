    - field: standard_equipment
      value: "| |-|Base=400px|center *The Hellsing ARMS .454 Casull Auto (usually\
        \ referred to simply as \"Casull\") is a semi-automatic magnum pistol, based\
        \ on two pre-WW1 handgun designs by Colt: the M1903 and M1905 pistols (the\
        \ early versions of the M1911). The gun weighs approximately 6 kg unloaded\
        \ and has a magazine capacity of six .454 Casull cartridges. Its appearance\
        \ is also similar to the AMT Automag III. The gun fires custom-made explosive\
        \ .454 Casull rounds, with the steel bullets bearing a core made from the\
        \ melted silver Christian cross from Manchester Cathedral. They are used in\
        \ a six round single-stack magazine 400px|center *The Hellsing ARMS 13 mm\
        \ Auto Anti-Freak Combat Pistol, Jackal (usually referred to as \"The Jackal\"\
        ) is a massive pistol made especially for Alucard, and one of the most powerful\
        \ handheld weapons in the Hellsing series. It has a length of 39cm (16 in),\
        \ a weight of 16kg (35lbs), and a black gunmetal construction, and uses massive\
        \ 13mm explosive rounds. The words \"Jesus Christ is in Heaven now\" are engraved\
        \ upon it, in mockery of a similar statement on Alexander Anderson's gloves.\
        \ The Jackal was the result of Alucard's request to Walter for \"something\
        \ bigger\" after his Casull proved largely useless against Alexander Anderson.\
        \ The butler delivered in full with the creation of the Jackal; in fact, the\
        \ inscription on its side implies that it was meant especially to end Anderson's\
        \ life. Alucard would repeatedly express his satisfaction with the new firearm,\
        \ declaring that it was \"perfect\". |-|Level 1=center *Baskerville (\u30D0\
        \u30B9\u30AB\u30F4\u30A3\u30EB, Basukaviru?), known as the Black Dog (\u9ED2\
        \u72AC\u7363, Burakku Doggu?), is one of Alucard's many familiars in the Hellsing\
        \ series. Its form varies, but it usually appears as a large dog with shaggy\
        \ black fur, multiple red eyes, and a large, fang filled mouth. It typically\
        \ emerges from either one of his arms, almost serving as some sort of extension\
        \ for his selected limb. Baskerville appears to be one of Alucard's favorite\
        \ familiars, since he tends to use it against opponents that he considers\
        \ challenging. It is also one of the only familiars within Alucard to survive\
        \ Anderson's destruction of Alucard's familiars. |}"
