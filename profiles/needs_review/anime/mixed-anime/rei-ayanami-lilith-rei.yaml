- id: claim-powers-and-abilities-97ea29c1
  section: abilities
  axis: hax
  text: "All from previous *Self-Sustenance (Type 2 and 3, the S\xB2 Engine grants\
    \ limitless motion energy) *Shockwave Generation *Durability Negation *Soul Manipulation\
    \ *Mind Manipulation and Matter Manipulation (Using an Anti-A.T. Field, Adam could\
    \ break down A.T. Fields, the fields that separate living beings from one another\
    \ and maintain their individuality, turning their physical bodies into LCL and\
    \ freeing their souls) *Spatial Manipulation (Unit-01's Anti-A.T. Field inverted\
    \ dimensional values. Furthermore, as his A.T. Field is superior to Leliel, it\
    \ should be capable of supporting space just like the angel) and Deconstruction\
    \ (Adam's Anti-A.T. Field was reducing everything around him to quarks) *Shapeshifting\
    \ (Replicated Kaworu Nagisa's appearance to calm down Shinji) *Body Control (Can\
    \ manifest wings, create holes in her palms, and form a vagina on her forehead)\
    \ *Energy Projection *Intangibility *Size Enhancement *Large Size (Type 4) *Telepathy\
    \ *Power Negation Field (Her A.T Field should be comparable or outright superior\
    \ to Tabris's, which can block out and nullify virtually all forms of energy and\
    \ matter, including incoming light, electromagnetism and sub-atomic particles,\
    \ within a certain radius) *Limited Resistance to Information Analysis (Numerical\
    \ expression and measurement of Anti-A.T. Fields is impossible) *Resistance to\
    \ Extreme Cold and Cosmic Radiations"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
