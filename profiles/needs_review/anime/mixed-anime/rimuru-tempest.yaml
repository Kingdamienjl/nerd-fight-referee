    - field: powers_and_abilities
      value: 'Slime= Resistance to: Poison Manipulation (Has a resistance to poisons)
        Physical Damage (Via Resist Melee) Disease Manipulation, Status Effect Inducement
        & Biological Manipulation (Via Inorganic Physiology; Can resist Disease) Magic,
        Law Manipulation, Reality Warping, Subjective Reality & Conceptual Manipulation
        (Type 1; Higher-level magic-born have intrinsic resistance to magic and further
        improves his resistance with Resist Magic. Magicians have high magical resistance)
        Possession (Deviant allows one to separate something including someone possessing
        Rimuru. Possessing Rimuru is very hard since Great Sage is a conceptual intelligence
        that is a part of Rimuru''s soul and also the one handling database of all
        of Rimuru''s memories. It would intervene if someone tries to possess Rimuru)
        Fear Manipulation, Confusion Inducement & Sleep Manipulation (Can resist Coercion,
        which causes targets to run away, induce confusion, faint and soil themselves.
        Even basic users can use this on a scale of 210 people) Paralysis Inducement
        (Resisted Gazel''s Heroic Aura, which is a higher-level version of Coercion
        that ignores resistance to paralysis because it''s actively maintained and
        if the Aura Restraint is gone, the restraint effect will be gone too) Empathic
        Manipulation (Resisted Gazel''s Heroic Aura, making those with weak resistance
        submit to him or view him in a positive light) Power Reading (Can hide his
        Aura if he wears the Anti-Magic Mask) Holy Manipulation & Statistics Reduction
        (Can move in the Holy Field which prevents monsters below A rank from taking
        action. This field weakens monsters both physically and spiritually that also
        prevents them from using of any skills) Electricity Manipulation Fire Manipulation
        Ice Manipulation Corrosion Inducement Heat Manipulation (with Resist Temperature
        later evolved to Cancel Temperature further improving the resistance) Soul
        Manipulation (Unique skills are the shape of the mind itself and require a
        strong soul to possess them. Their soul is strong enough to withstand the
        stress of the summoning process that drags the person from another world in
        a different universe across the realms. At the same time, Rimuru is a Transmigrant
        from another world that retains all of his memories which showcase how strong
        his soul is considering that a regular soul, by itself, would have no hope
        surviving a journey across the realm since it would dissolve midway, taking
        its memories with it. If the soul somehow survive the journey, they either
        lost their memories or retain some of their memories at best if they are lucky.
        Rimuru is superior to Glutton who was unaffected by Hinata''s Astral Bind
        that binds the astral body, the vessel of the soul, instead of the material
        one) Memory Manipulation (Transmigrant are those who retain their memory of
        their past lives since their memories of their past lives are burned into
        their souls due to their powerful will. Transmigrant people sometimes retain
        their memory of their past lives but a Transmigrant from another world is
        uncommon and a regular soul, by itself, would have no hope surviving a journey
        across the realm since it would dissolve midway, taking its memories with
        it. Transmigrant people from another world would retain half of their memories
        at best if they''re lucky while Rimuru is a Transmigrant from another world
        but he retains all of his memories which showcase how strong his willpower)
        Pain Manipulation (With Cancel Pain) Spatial Manipulation (Analyzed the cause
        of Hakurou''s wounds that was struck by Kyoya''s space severing attack which
        in turn gained the ability to resist and counteract with spatial element)
        Information Manipulation (Magic Senses overloads the brain with so much information
        it would have killed a normal human, but can be used casually) Data Manipulation
        (The information from Magic Sense is turned into data, which overloads the
        human brain, but can be used casually) Death Manipulation & Radiation Manipulation
        (As a monster above A-Rank, Rimuru can resist Veldora''s aura which causes
        the death of humans) Sense Manipulation (Stronger than Ranga, who can resist
        Confusion, a spell which distorts senses of smell) Corruption (Type 2; Can
        resist the effect monster''s magical aura that can turn organic life into
        monsters) Empathic Manipulation & Madness Manipulation (Type 2; On a scale
        of 200,000, Scaling to Geld II who is the only one among the Orcs to still
        have "clear eyes" and the only Orc who was sane and not affected by Demon
        Lord Geld''s Unique Skill "Starved" during the Orc Lord arc) Law Manipulation
        (1 Layer), Conceptual Manipulation (Type 1, 1 Layer), Reality Warping, Subjective
        Reality (2 Layers) & Power Nullification (Can resist the Anti-Magic Area with
