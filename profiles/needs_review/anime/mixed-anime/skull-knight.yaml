- id: claim-powers-and-abilities-8849de17
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= |-|Sword of Thorns=
    *Superhuman Physical Characteristics *Master Swordsman (Is a highly experienced
    sword user. He has swift swordsmanshipBerserk - Chapter 158 and can outdo Zodd
    in combat,Berserk - Chapter 88 who is known as the God of the Battlefield and
    has three hundred years of experience.Berserk - Chapter 128 The Skull Knight himself
    has a thousand years of battle experienceBerserk - Chapter 53) *Immortality (Types
    1 & 7; The Skull Knight is already dead as his life was consumed by the use of
    the Berserker Armor, thus becoming a wraith.Berserk - Chapter 362 He cannot die
    from old ageBerserk - Chapter 237) *Surface Scaling (His horse can ride on vertical
    surfaces) *Acrobatics (Can jump off of walls and quickly jump out of a collapsing
    cave.Berserk - Chapter 160 His horse can also perform great leapsBerserk - Chapter
    88Berserk - Chapter 156) *Non-Physical Interaction (Soul; The Skull Knight''s
    sword allowed Guts to cut through the dead spirits haunting himBerserk - Chapter
    90) *Limited Cosmic Awareness, Information Analysis & Precognition (The Skull
    Knight has vast oversight on the world and the flow of Causality, which grants
    him knowledge on people''s abilities and past, as well as on events that will
    happen in the future. Such was the case with Guts'' Acausality and backstory,
    the Eclipse, the God Hand''s powers, the Reincarnation Ceremony,Berserk - Chapter
    142 Casca being healed, etc. He also knows when Temporal Junction Points will
    happen, which allows him to fight the God Hand) **Preparation (Has knowledge on
    when Temporal Junction Points will happen, which he uses to prepare attacks on
    the God Hand, such as when he created the Sword of Actuation in preparation for
    attacking Griffith) *Limited Weapon Creation & Fusionism (Created the Sword of
    Actuation by fusing together a large amount of Behelits inside of himself.Berserk
    - Chapter 221 Although this ability is not combat applicable due to being done
    over time) *Enhanced Senses & Extrasensory Perception (Can perceive dead spirits
    which lack any physical form, as well as other Astral creatures, which can''t
    be perceived by normal peopleBerserk - Chapter 123) *Fear Manipulation (The Skull
    Knight''s presence disoriented Guts, who was unable to correctly read his presence
    and felt like he was being attacked right from behind. His presence also left
    Guts with a weird surreal feeling of blood-thirst, which was compared to the one
    inflicted by Zodd,Berserk - Chapter 37 who left Guts shivering in fear in their
    first encounterBerserk - Chapter 3Berserk - Chapter 4) Resistance to: *Fear Manipulation
    (Can fight Zodd and other apostles without being affected by their fear-inducing
    nature) Limited Resistance to: *Fate Manipulation, Causality Manipulation & Probability
    Manipulation (Targets the God Hand at "Temporal Junction Points",Berserk - Chapter
    304 these are moments in which the flow of causality can be somewhat disruptedBerserk
    - Chapter 142) |-|Sword of Actuation= All previous abilities plus: *Non-Physical
    Interaction (2 Layers Soul, Abstract; Due to cutting through space and dimensions,
    the Skull Knight''s Sword of Actuation is able to reach into the depths of the
    Astral World, the Abyss. Such power allows him to affect even the God Hand) *Spatial
    Manipulation (The Sword of Actuation''s main ability is to cut through spaceBerserk
    - Chapter 303) **Teleportation, Portal Creation & Dimensional Travel (Can create
    portals by cutting holes through space and travel through them. With these portals
    he can travel through dimensions, such as when he escaped from the astral region
    of Qliphoth to the Physical World. These portals can even reach the depths of
    the Astral World, the Abyss) **BFR & Sealing (Intends to teleport the God Hand
    into the Abyss in order to entomb them there. The Skull Knight can also entomb
    people by opening a portal to the Abyss which then pulls and drags in everything
    surrounding itBerserk - Chapter 221) ***Limited Void Manipulation, Soul Manipulation,
    Fusionism & Soul Absorption (Once in the Abyss, the spirits of people are whisked
    in by the Abyssal Chain of Souls and they shall wander for all eternity until
    eventually all that is left of them is their blurred negative feelings, forming
    a common consciousness as they revert to nothingnessBerserk - Chapter 83Berserk
    - Prologue Chapter 8) ***Summoning (Can summon the Abyssal Chain of Souls by opening
    a portal to the AbyssBerserk - Chapter 221) **Durability Negation (Can cut through
    space, thus negating durability by opening holes in space that tear apart the
    enemyBerserk - Chapter 304) }}'
