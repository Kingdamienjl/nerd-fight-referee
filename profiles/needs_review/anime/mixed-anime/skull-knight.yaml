    - field: standard_equipment
      value: '| *Sword of Thorns: The Skull Knight''s basic sword, which is kept in
        a sheathe attached to his shield. The blade of the sword extends out of a
        rose decoration at the center of the curving thorns. There are also thorns
        on the handle, injuring anybody who attempts to use it without an armored
        hand. SwordOfThorns.jpg|Sword of Thorns *Sword of Actuation: By letting the
        Sword of Thorns'' blade pass down his throat, he coats it in the Behelits
        that he previously collected and fused together. This sword''s main ability
        is cutting through space, this allows him to open portals which can even reach
        through dimensions into the Astral World. The most powerful use of this weapon
        involves opening a portal into the Abyss, which then sucks in and rips apart
        anything surrounding it. The Skull Knight intends to use this sword to entomb
        the God Hand in said Abyss. The sword''s Behelit coating is something that
        can be placed and removed at will. SwordOfActuation.jpg|Sword of Actuation
        *Skull Armor & Shield: In addition to serving as the Skull Knight''s protection,
        his armor also serves as a makeshift supply of throwing knives, as seen when
        the Skull Knight breaks off a protrusion from his armor and throws it to release
        Slan''s grip on one of Guts'' arms in Qliphoth. With his shield the Skull
        Knight could block his own attack when reflected by Void. SkAp.jpg|The Skull
        Knight uses a spike from his armor as a throwing knife *Horse: His horse offers
        him high mobility due to its ability to run up walls and also perform leaps
        so big and fast it appears to practically fly. The Skull Knight can call his
        horse to make it come to him. SkHorse.jpg|The Skull Knight rides his horse
        into the Eclipse |}'
