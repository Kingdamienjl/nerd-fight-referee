    - field: standard_equipment
      value: "right|thumb|Interface Headset *Plugsuit 01: Form-fitting full body suits\
        \ resembling a diver's wet suit, worn by Eva pilots together with their Interface\
        \ Headsets in order to increase their synchronization with the Evangelions.\
        \ The legs and half the torso are in the standard blue color for the male\
        \ plug suits, while the top is white. Although helpful, plugsuits do not appear\
        \ to be essential to pilot an Eva, as there have a few occasions when Shinji\
        \ piloted without one. It is stated, however, that a plugsuit increases the\
        \ pilot's synchronization ratio by cutting down on interference. *Interface\
        \ Headset: A small device, worn when piloting an Evangelion unit. Pk01-progknife.gif|Progressive\
        \ Knife Pallet Gun (NGE).png|Pallet Rifle NGE positron rifle composite.jpg|Positron\
