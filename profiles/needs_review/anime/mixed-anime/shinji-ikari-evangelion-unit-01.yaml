    confidence: 0.8
  attack_potency:
    text: Mountain level (Overpowered and stabbed through Unit-02's head when Kaworu
      was controlling it. Easily destroyed Bardiel when piloted by the Dummy System),
      Large Mountain level with A.T. Field (A.T. Fields can be used offensively to
      bypass those of others), Higher with Positron Sniper Rifle and Preparation (Pierced
      Ramiel's A.T. Field, but it needed all electricity in Tokyo and several minutes
      to charge)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Supersonic travel speed (Moved this fast) with Hypersonic+ combat speed
      and Relativistic reactions (Able to keep pace with Angels, who are capable of
      dodging Mach 14+ rounds from the Pallet Gun, in addition to scaling to Unit
      02, which reacted to and blocked a replica of the Spear of Longinus)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class G with A.T. Field (Was able to match the mass of a descending Sahaquiel
      reinforced by an A.T. Field for at least 1 minuteEpisode:12 - A Miracle's Worth
      18:57)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Mountain level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Mountain level (Tanked Israfel's self-destructionEpisode:09 - Mind, Matching,
      Moment 20:55), Large Mountain Level with A.T. Field (Her A.T. Fields should
      be compable to Unit-00's, which survived a direct N2 explosive detonation)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: "Essentially Infinite when it has its Umbilical Cable connected, has a 5-minute\
      \ internal battery otherwise and longer with extra battery packs, Infinite with\
      \ S\xB2 Engine"
    source_ids: *id002
    confidence: 0.8
  range:
    text: null
    source_ids: []
    confidence: 0.0
  intelligence:
    text: Shinji uses the Pallet Rifle for most of Unit-01's long ranged attacks.
      In certain scenarios where a one-handed firearm is preferred, such as when he
      was using a building as cover against Leliel, he will opt for using his handgun
      instead, and even attempted to use point-blank shots when the aforementioned
      Angel had gotten too close. In melee encounters, Unit-01 will take advantage
      of the Progressive Knife along with its excellent agility to utilize close-quarters
      combat. The A.T. Field is used for defensive and long-ranged offensive options.
      |-
    source_ids: *id002
    confidence: 0.8
