  axis: hax
  text: "{{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical Characteristics\
    \ *Self-Sustenance (Type 1; [Angels have shown repeatedly to not require oxygen,\
    \ the Evas should be the same because of being artificial angels]. Types 2 & 3;\
    \ with S\xB2 Engine [Grants limitless motion energy]) *Forcefield Creation, Vibration\
    \ Manipulation, & Energy Projection (A.T. Fields can be used both defensively\
    \ and offensively, such as in the form of shockwaves and optic blasts) *Self-Matter\
    \ Manipulation (A person's ego boundary is what forms their shape and keeps it\
    \ from breaking down. Also, as shown by Shinji and other Lilin as a whole they\
    \ are able to reform their bodies after being turned into a quantum state/pure\
    \ LCL.) *Large Size (Types 1 & 2; Portrayed inconsistently, going from 40 meters\
    \ to 200) *Immortality (Type 1; https://imgur.com/a/9qWt9Tf The Eva will exist\
    \ long after humanity is gone, even after 5 billion years when the sun is gone\
    \ the Eva will still exist, and is called eternal & Type 3) *Regeneration (Mid-Low;\
    \ regenerated a broken arm. Likely Low-High over time; Like an angel, an Evangelion\
    \ should be able to regenerate from its core alone given enough time) *Enhanced\
    \ Senses *Accelerated Development (Angels have been shown to reach an adult state\
    \ seconds after hatching. Eva Units should be able of the same) *Acrobatics (Despite\
    \ the large size of Evangelion Units, they are incredibly agile, easily performing\
    \ a number of acrobatic maneuvers) *Martial Arts (Unit-01 utilizes close-quarters\
    \ combat) *Gamma Ray Photons (with Positron Cannon) *Weapon Mastery (Unit-01 efficiently\
    \ wields knives and firearms) *Resistance to: **Heat, Magma, & High-Pressure (Saved\
    \ Asuka thousands of meters deep into an active volcano) **Mind Manipulation &\
    \ Soul Manipulation (The A.T Field is the ego boundary that keeps a being's individuality\
    \ and that protects the heart/soul from outside influence) }} |-"
