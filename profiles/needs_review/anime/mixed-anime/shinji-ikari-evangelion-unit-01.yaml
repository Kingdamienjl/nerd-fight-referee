        \ packs Eva 01 devouring S\xB2 Engine.png|S\xB2 Engine *Progressive Knife:\
        \ A combat knife contained inside the left shoulder pylon of an Evangelion\
        \ who uses it, and is one of the Evas' basic weapons. The blade of the knife\
        \ vibrates at an extremely high frequency, increasing its cutting sharpness\
        \ to the point that it can cut through the target at a molecular level. It\
        \ is strong enough to pierce an Angel's core with little trouble. Unit-01's\
