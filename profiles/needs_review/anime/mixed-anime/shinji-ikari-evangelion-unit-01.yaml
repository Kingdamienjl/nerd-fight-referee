    - field: weaknesses
      value: 'Shinji is extremely avoidant and sometimes his justification for fleeing
        from piloting is to avoid hurting others. He shows a great fear of emotional
        pain and of being hated or left behind. In general, Shinji is shown to be
        introverted and disconnected from physical reality due to having little to
        no meaningful contact with others. In social party situations, he is shown
        to be quite uncomfortable, and he often has difficulty controlling his emotions
        around others due to his hard time letting go of the past. He is shown to
        the extreme of this, forsaking many lives (even his own) to save one person.
        Due to Shinji''s high nostalgia and fragile emotional state, he chooses to
        shut out the world, as evidenced by the headphones he wears rather often,
        plugged into an SDAT music player. Through all this, he may have overcome
        some of these by the end of the series when he wishes for another chance to
        find that joy by being with people | An Eva pilot feels everything their Evangelion
        feels when synchronized with the Eva, experiencing the pain of injuries the
        Eva sustains. It appears that if an Evangelion is severely damaged enough
        (even if the Entry Plug containing the pilot is not directly damaged itself),
