      about it.Chapter 21 Learned how to start fires and get food in a wild island
      when he was still a child.Chapter 22) Standard Tactics: Due to their shared
      training, Alphonse''s fighting style is a lot like Ed''s, although he does not
      use weapons as much as Ed does, often preferring hand to hand combat. Alphonse
      typically uses his Alchemy in combat by making structures to assist himself,
      whether for defense,Chapter 39 offenseChapter 27 or mobility, often in fairly
      creative ways.Chapter 47 As he has witnessed Truth''s gate, he can perform Alchemy
      without a circle, simply with a clap of his hands. Alphonse is a pacifist, and
      would rather avoid combat and violence if possible.'
