- id: claim-weaknesses-b37f2e78
  section: weaknesses
  axis: weakness
  text: "Arrogant sometimes, using the Dragon of the Darkness Flame causes Hiei to\
    \ hibernate for a couple of hours, albeit after the fight has ended, and this\
    \ seems to no longer be the case after the DT saga. His binding technique gets\
    \ cancelled if he closes his eyes. {| class=\"mw-collapsible mw-collapsed\" align=\"\
    center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques: |- |\
    \ *{{Nihongo|Jagan|{{Ruby|\u90AA\u773C|\u3058\u3083\u304C\u3093}}}}: With his\
    \ surgically implanted third eye, Hiei can telekinetically move objects, erase\
    \ memories, and control weaker minds: demons and humans. It also allows him to\
    \ transform into his green skinned Jaganshi form with eyes all over his body.\
    \ In this form, the power of his Jagan is greatly increased, allowing him to bind\
    \ his foes. center|thumb|300px|Dragon of the Darkness Flame *{{Nihongo|Dragon\
    \ of the Darkness Flame|{{Ruby|\u90AA\u738B\u708E\u6BBA\u9ED2|\u3058\u3083\u304A\
    \u3046\u3048\u3093\u3055\u3064\u3053\u304F}}{{Ruby|\u9F8D|\u308A\u3085\u3046}}{{Ruby|\u6CE2\
    |\u306F}}|Ja\u014D Ensatsu Kokury\u016Bha}}: Hiei uses his yoki to summon a dragon\
    \ made from the flames of demon world. Initially, it would damage his arm to use\
    \ the technique, but Hiei later perfected the technique. **Dragon Absorption:\
    \ The dragon is not only a projectile, it can be used as a nutritional supplement\
    \ to amplify one's yoki, massively increasing their statistics. *{{Nihongo|Purgatory\
    \ Scorch|{{Ruby|\u90AA\u738B\u708E\u6BBA\u7149\u7344|\u3058\u3083\u304A\u3046\u3048\
    \u3093\u3055\u3064\u308C\u3093\u3054\u304F}}{{Ruby|\u7126|\u3057\u3087\u3046}}|Ja\u014D\
    \ Ensatsu Rengokush\u014D}}: Hiei can channel the flames from Human World into\
    \ one or both of his fists. He uses this technique to enhance his hand-to-hand\
    \ combat abilities. *Flamethrower: Hiei blasts human world flames from his mouth\
    \ and uses it as a long ranged attack. *{{Nihongo|Sword of the Darkness Flame|{{Ruby|\u90AA\
