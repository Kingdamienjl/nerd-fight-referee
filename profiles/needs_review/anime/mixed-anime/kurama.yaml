    - field: weaknesses
      value: "Kurama was always angry and easy to provoke, although after being sealed\
        \ inside Naruto, this weakness seems to have disappeared. It is vulnerable\
        \ to sufficient, high-level mind-controlling and sealing techniques. While\
        \ sealed in a host (Jinch\u016Briki), it will die if the host does. Like all\
        \ Tailed Beasts, it can't correctly focus its power without a Jinch\u016B\
        riki's aid, thus throwing around its power randomly. The Baryon Mode is dangerous\
        \ due to the extreme chakra consumption and resulted in Kurama's true death.\
        \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
        1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
        \ left; |Notable Attacks/Techniques: |- | Tailed Beast Ball Firing.gif|Tailed\
        \ Beast Bomb Firing Tailed Beast Ball Effect.gif|Effects Kurama Tailed Beast\
        \ Beam.gif|Beam Continuous Tailed Beast Bombs.gif|Tailed Beast Bomb Barrage\
        \ *{{Nihongo|Tailed Beast Bomb|{{Ruby|\u5C3E|\u3073}}{{Ruby|\u7363|\u3058\u3085\
        \u3046}}{{Ruby|\u7389|\u3060\u307E}}|Bij\u016Bdama}}: The signature attack\
        \ of the Tailed Beasts, Kurama mixes appropriate proportions of positive black\
        \ chakra and negative white chakra to form a ball of energy that he can fire\
        \ at his target, obliterating large swathes of land in an instant on impact.\
        \ Alternatively, Kurama can swallow it to compress its energy into a beam\
        \ that could only be stopped by another being as powerful as a Tailed Beast\
        \ like the Eight-Tails. **{{Nihongo|Tailed Beast Bomb Barrage|{{Ruby|\u9023\
        \u7D9A|\u308C\u3093\u305E\u304F}}{{Ruby|\u5C3E|\u3073}}{{Ruby|\u7363|\u3058\
        \u3085\u3046}}{{Ruby|\u7389|\u3060\u307E}}|Renzoku Bij\u016Bdama}}: Kurama\
        \ fires several uncompressed Tailed Beast Bombs in rapid succession to quickly\
        \ decimate an area. *{{Nihongo|Great Roar|{{Ruby|\u5927\u5486\u54EE|\u3060\
        \u3044\u307B\u3046\u3053\u3046}}|Daih\u014Dk\u014D}} Kurama uses his massive\
        \ chakra reserves to empower his roars and movements, dispersing oncoming\
        \ attacks as powerful as Naruto's Massive Rasengan and sending other Tailed\
        \ Beasts flying backward. *Negative Emotions Sensing: Kurama can sense negative\
        \ emotions such as hatred and murderous intent of any individual around it.\
        \ *{{Nihongo|Senjutsu|{{Ruby|\u4ED9|\u305B\u3093}}{{Ruby|\u8853|\u3058\u3085\
        \u3064}}}} Kurama can draw the natural energy around him, blending it with\
        \ his and Naruto's chakra. **{{Nihongo|Six Paths: Massive Rasenshuriken|{{Ruby|\u516D\
        \u9053|\u308A\u304F\u3069\u3046}}\u30FB{{Ruby|\u8D85|\u3061\u3087\u3046}}{{Ruby|\u5927\
