        \u3044\u307B\u3046\u3053\u3046}}|Daih\u014Dk\u014D}} Kurama uses his massive\
        \ chakra reserves to empower his roars and movements, dispersing oncoming\
        \ attacks as powerful as Naruto's Massive Rasengan and sending other Tailed\
