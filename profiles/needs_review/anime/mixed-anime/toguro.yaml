    - field: weaknesses
      value: 'Yusuke acts unintelligently outside of actual battles. Notable Attack/Techniques:
        *Spirit-Gun: Yusuke''s signature move; he harnesses his spirit energy and
        fires it in a strait line from his right index finger. The Spirit gun can
        vary in size depending on how much energy Yusuke puts into it, and the technique
        can be rapid fired in later chapters. *Demon-Gun: Same as the spirit gun,
        but makes use of his demonic energy. *Spirit Shotgun: An upgraded variant
        of the Spirit Gun. While not as power as its parent move, it fires multiple
        smaller shots that scatter in multiple directions enabling it to strike multiple
        targets. *Spirit Punch: Yusuke is able to use his spirit energy to enhance
        the strikes of his punches while simultaneously form a barrier around his
        fists to block attacks. *Spirit Wave: Yusuke covers his entire body in his
        own spirit energy thus using himself as a substitute for a spirit gun. This
        requires heavy amounts of concentration and may deplete him of his energy,
        but is very powerful and also grants him healing properties in turn. *Mazoku/Demon
        transformation: Upon his awakening as a reincarnation of the Mazoku, Yusuke
        has once received a possession from his ancestor, Raizen. In this form, Yusuke
        looses all self control and has his grandfather control him instead, but his
        power, speed, and endurance all skyrocket to great proportions. Has never
        shown this ability again after the fight with Sensui, and likely never will
        again given Raizen''s death *'
