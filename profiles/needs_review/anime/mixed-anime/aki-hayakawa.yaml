- id: claim-weaknesses-b1b5ecbe
  section: weaknesses
  axis: weakness
  text: "Aki's single-minded obsession with killing the Gun Devil has led him to make\
    \ several costly contracts with Devils, significantly reducing his lifespan. His\
    \ contract with the Curse Devil for instance, requires him to stab his opponent\
    \ four times, and using it has already shortened his lifespan to just two years.Chainsaw\
    \ Man Chapter 29 | Has replaced the Cursed Sword and his mindset slowly changes\
    \ to a goal of keeping Denji & Power safe | None notable. Notable Attacks/Techniques:\
    \ |-|Pre-Ambush= * Fox Devil Contract: Aki originally had a contract with the\
    \ Fox Devil. In exchange for feeding him part of his body, Aki could use his power\
    \ in combat by raising a hand and saying the word \"Kon\" (\u30B3\u30F3), causing\
    \ the Fox Devil's head to appear to instantly bite down on the target's body,\
    \ swallowing him whole or tearing him apart. Aki lost the ability to summon him\
    \ after he used the Fox Devil recklessly against the Katana Man. File:Aki Summoning\
    \ Fox Devil.gif|Summoning the Fox Devil * Curse Devil Contract: Aki had a contract\
    \ with the Curse Devil which granted him a nail-like sword. In order for the contract\
    \ to work properly, Aki must point the nail anywhere on his target's body; then\
    \ saying the word \"fire\", the hand of the Curse Devil will appear and flicks\
    \ the back end of the nail to inflict damage. By stabbing his enemy three times\
    \ with the nail, Aki could summon the Curse Devil to seize the enemy and inflict\
    \ massive damage upon them, potentially killing them in the process. In order\
    \ to use it, Aki's life would be significantly shortened. File:Curse Devil.gif|Curse\
    \ Devil kills Katana Man |-|Post-Ambush= * Future Devil Contract: After losing\
    \ favor with the Fox Devil, Aki was taken to the Future Devil that is held prisoner\
    \ by Public Safety and managed to gain a contract to use its abilities in exchange\
    \ for letting the Future Devil live inside his right eye. **Precognition: Aki\
    \ had the ability to see a few seconds into the future. He used this to predict\
    \ his opponent's oncoming attacks and plan accordingly. **Summoning: Due to his\
    \ contract, Aki could summon Future Devil by calling him. While the Devil says\
    \ that Aki must say \"The Future Rules\" to make him come, this was not an actual\
    \ requirement. File:AkiDodge.gif|Precognition in action * Control Devil Contract:\
    \ Aki made a contract with the Control Devil, in exchange for his entire being\
    \ he gained her power, however, as he was completely under her control, he was\
    \ unable to use it. ==Gallery== {{Scroll box|content= Aki Cover 1.png|Vol 4 Cover\
    \ page Aki Cover 2.png|Vol 9 Cover page CSMChapter31aki.png|Chapter 31 Art CSMChapter3aki.png|Chapter\
    \ 3 Art CSMChapter3aki-2.png|Chapter 3 Art CSMChapter10.png|Chapter 10 Art CSMChapter10aki.png|Chapter\
    \ 10 Art CSMChapter13aki.png|Chapter 13 Art CSMChapter15aki.png|Chapter 15 Art\
    \ CSMChapter24katanaman.png|Chapter 24 Art CSMChapter24katanaman-2.png|Chapter\
    \ 24 Art }} ==Notable Matchups== Victories: *Denji (Chainsaw Man) Denji's Profile\
    \ (SBA was used; Battle took in Tokyo; \"Pre-Training\" Denji and \"Pre-Ambush\"\
    \ Aki were used.) Losses: *Megumi Fushiguro (Jujutsu Kaisen) Megumi's Profile\
    \ (Gun Fiend Aki and Shibuya Incident Arc Megumi keys were used. Speed was equalized\
    \ and starting distance was 50 meters) *Roy Mustang (Fullmetal Alchemist) Roy's\
    \ Profile (Human Aki with optional equipment was used. Roy had prior knowledge\
    \ and starting distance was 15 meters) *Zhu Yuan (Zenless Zone Zero) Zhu Yuan's\
    \ Profile (The fight took place in the Shibuya subway and they start 20 meters\
    \ apart with direct line of sight. Unequal Speed. SBA for the rest. Aki was in\
    \ his Post-Ambush Key. Zhu Yuan had prior knowledge of Aki's precognition.) Inconclusive:\
    \ ==References== {{scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{scroll\
    \ box|content=}} {{Discussions|Aki Hayakawa|Aki Hayakawa}} Category:Characters\
    \ Category:Chainsaw Man Category:Anime Characters Category:Boxers Category:Smokers\
    \ Category:Male Characters Category:Manga Characters Category:Precognition Users\
    \ Category:Summoners Category:Sword Users Category:Variable Tier Category:Gun\
    \ Users Category:Stealth Masters Category:Weapon Masters Category:Weapon Users\
    \ Category:Non-Physical Interaction Users Category:Damage Reduction Users Category:Curse\
    \ Users Category:Death Users Category:Power Bestowal Users Category:Transformation\
    \ Users Category:Fusionism Users Category:Resurrection Users Category:Information\
    \ Analysis Users Category:Smoke Users Category:Weapon Creation Users Category:Explosion\
    \ Users Category:Katana Users Category:Contract Users"
