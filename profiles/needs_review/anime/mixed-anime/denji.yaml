    - field: intelligence
      value: 'Gifted. Even before his proper training, Denji has shown to be an extremely
        practical fighter thanks to [https://imgur.com/a/sB2nvrx being in the devil-hunting
        business ever since he was still a child]. another hunter that''s skilled
        enough to be regarded to be able to [https://imgur.com/a/vzl2Nl8 win against
        anyone else in the world in a pure bare-knuckle fighting]. Through his training,
        Denji has learnt and later practically applied lessons such as: [https://imgur.com/a/rw60Ebx
        to always keep a cool head while in battle, be perspective if the environment
        around him can be exploited against an opponent] Through Denji may appear
        naive and dense sometimes, his quick-thinking and outright luscious ingenuity
        in battle has let him overcome insurmountable situations (examples shown below
        in ''Feats - Intelligence''). Moreover, he''s also able to formulate complex
        plans that utilises the knowledge he''s gained about his opponent with resources
        he has access to when push comes to shove, as seen in the final battle of
        the Public Safety Arc, where he managed to take Makima [https://imgur.com/a/qZ2eRyg
        by surprise] and [https://imgur.com/a/mTliO77 successfully outsmart her].
        While Denji does get [https://imgur.com/a/QrJIsTL "battle high"] from combat,
        he still has shown to be perfectly able to adapt to his opponent and strategise
        against them mid-fight.'
