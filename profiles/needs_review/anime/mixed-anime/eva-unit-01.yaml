      value: "traditionally possessed by only Adam and its progeny, the Angels. This\
        \ \"engine\" organ is responsible for the perpetual energy supply that the\
        \ Angels can utilize, along with the vast majority of their exotic physiological\
        \ powers (including levitation, regeneration and energy-projection). Appears\
        \ to be the key to inverting \"A.T. Fields\" and projecting an \"Anti A.T.\
        \ Field\" also, as well as accessing the \"Dirac sea\", A.T. Field: The intangible\
        \ light of the soul in the physical world, A.T. Fields are possessed by all\
        \ living beings on NGE-Earth and are one of the major aspects of the human\
        \ psyche that defines someone as \"individual\" and \"protect\" them from\
        \ the intrusion of another's feelings. However, the Evangelion Units and the\
        \ Angels are unique in the ability to generate A.T. Fields that are corporeal\
        \ and occasionally visible to the naked eye, possibly due to a large amount\
        \ of innate energy contained in their souls. Their A.T. Fields mostly function\
        \ as a physical defence: a forcefield consisting of concentric octagonal yellow\
        \ lines. The barrier is almost perfect, only being temporarily disrupted from\
        \ its active state by incredibly energetic weapons (such as military-grade\
        \ positron beams and \"N\xB2 Weapons\") or erosion by another corporeal A.T.\
        \ Field that is superior in strength. If left alone after initial disruption,\
        \ the A.T. Field will revive its durability almost instantly as long as the\
        \ user is still alive, making it a regenerative barrier. The transition from\
        \ a dormant A.T. Field to an active Field is indicated by a slight atmospheric\
        \ blurring. Adam should possess all of the heightened capabilities of Tabris,\
        \ given that its salvaged soul is the reason behind Kaworu's incredibly powerful\
        \ \"A.T. Field\" in the first place., Anti-A.T. Field: Evangelion Units with\
        \ the possession of a \"S\xB2 Engine\" and sufficiently intelligent Angels\
        \ are capable of inverting the dimensional values of their own \"A.T. Field\"\
        , triggering a tremendous explosion of energy entering well into the gigaton\
        \ range even for the weakest users. An \"Anti A.T. Field\" projection also\
        \ has the added ability of dematerializing all \"A.T. Fields\" (intangible\
        \ or corporeal) within its area-of-effect, resulting in the dissolution of\
        \ regular organic matter into LCL fluid (affectionally referred to as orange\
        \ tang) and the mass removal of souls from the physical form. Beings composed\
        \ of an alternative type of matter (such as synthetics or the elusive particle-wave\
        \ matter seen in the NGE-verse) are unaffected by the dissolution/soul-removal\
        \ half of an \"Anti A.T. Field\" projection., Regeneration: Angels possess\
        \ a healing factor, able to regenerate from relatively large wounds thanks\
        \ to the S\xB2 Engine in their cores and as long as it is intact they can\
        \ hypothetically regenerate from complete bodily destruction. Their regeneration\
        \ has a limit however, since as previously mentioned, the S\xB2 Engine is\
        \ responsible for regeneration, if this organ is significantly damaged, it\
        \ will cancel the regeneration"
