    - field: weaknesses
      value: "Shinji is extremely avoidant and sometimes his justification for fleeing\
        \ from piloting is to avoid hurting others. He shows a great fear of emotional\
        \ pain and of being hated or left behind. In general, Shinji is shown to be\
        \ introverted and disconnected from physical reality due to having little\
        \ to no meaningful contact with others. In social party situations, he is\
        \ shown to be quite uncomfortable, and he often has difficulty controlling\
        \ his emotions around others due to his hard time letting go of the past.\
        \ He is shown to the extreme of this, forsaking many lives (even his own)\
        \ to save one person. Due to Shinji's high nostalgia and fragile emotional\
        \ state, he chooses to shut out the world, as evidenced by the headphones\
        \ he wears rather often, plugged into an SDAT music player. Through all this,\
        \ he may have overcome some of these by the end of the series when he wishes\
        \ for another chance to find that joy by being with people, An Eva pilot feels\
        \ everything their Evangelion feels when synchronized with the Eva, experiencing\
        \ the pain of injuries the Eva sustains. It appears that if an Evangelion\
        \ is severely damaged enough (even if the Entry Plug containing the pilot\
        \ is not directly damaged itself), the pilot can indeed die from physical\
        \ shock. And at an abnormally high synchronization ratio, it appears that\
        \ pilots will really suffer injuries an Eva suffers. Unit-01 can be easily\
        \ separated from its Umbilical Cord and only has 5 minutes of internal battery\
        \ (can somewhat be remedied with extra battery packs). Many of the pilot's\
        \ function can be overridden by NERV command center. When Berserk, Unit-01\
        \ is uncontrollably destructive, A.T. Field (A.T. = Absolute Terror): The\
        \ intangible light of the soul in the physical world, A.T. Fields are possessed\
        \ by all living beings on NGE-Earth and are one of the major aspects of the\
        \ human psyche that defines someone as \"individual\" and \"protect\" them\
        \ from the intrusion of another's feelings. However, the Evangelion Units\
        \ and the Angels are unique in the ability to generate A.T. Fields that are\
        \ corporeal and occasionally visible to the naked eye, possibly due to a large\
        \ amount of innate energy contained in their souls. Their A.T. Fields mostly\
        \ function as a physical defense: a forcefield consisting of concentric octagonal\
        \ yellow lines. The barrier is almost perfect, only being temporarily disrupted\
        \ from its active state by incredibly energetic weapons (such as military-grade\
        \ positron beams and \"N\xB2 Weapons\") or erosion by another corporeal \"\
        A.T. Field\" that is superior in strength. If left alone after initial disruption,\
        \ the A.T. Field will revive its durability almost instantly as long as the\
        \ user is still alive, making it a regenerative barrier. The transition from\
        \ a dormant A.T. Field to an active Field is indicated by a slight atmospheric\
        \ blurring., Anti-A.T. Field: Upon reaching godhood, the EVA is able to neutralize\
        \ the A.T. Fields of other beings, even single-celled organisms, turning them\
        \ into LCL so their souls can be brought into the Black Moon., Berserk Mode:\
        \ Refers to a state an Evangelion can enter, in which it has gone beyond humanity's\
        \ ability to control. While in this state, they display a savage, nearly animalistic\
        \ battle frenzy in which their strength and capabilities dramatically increase.\
        \ Some units that possess jaws bolted shut will typically force them open\
        \ to let out a frightening howl., Wings of Light: During Third Impact, Evangelion\
        \ Unit-01 produces white Wings of Light. Although the true purpose of the\
        \ Wings of Light is unknown, it occurs during an event where souls are involved.\
        \ It is speculated that the wings are a form of overcharged A.T. Field, since\
        \ the Mass Production Evangelions are able to physically grab onto Unit-01's\
        \ Wings of Light during the Third Impact"
      source_id: character-stats-profiles-eva-unit-01-mixed-anime
