    - field: powers_and_abilities
      value: "Piloting (As the Third Child, Shinji is a trained and skilled Evangelion\
        \ pilot), A.T. Fields (While the Lilin's souls are not strong enough to physically\
        \ manifest them, they still possess them), Self-Matter Manipulation (A person's\
        \ ego boundary is what forms their shape and keeps it from breaking down.\
        \ Also, as shown by Shinji and other Lilin as a whole they are able to reform\
        \ their bodies after being turned into a quantum state/pure LCL), Resistance\
        \ to Mind Manipulation & Soul Manipulation (The A.T. Field is the ego boundary\
        \ that keeps a being's individuality and that protects the heart/soul from\
        \ outside influence), Heat Manipulation with the Plugsuit (While wearing a\
        \ Plugsuit, Shinji could open a super-heated Entry Plug hatch without suffering\
        \ large burns, unlike his father who performed the same action with his bare\
        \ hands) Superhuman Physical Characteristics, Self-Sustenance (Type 1; [Angels\
        \ have shown repeatedly to not require oxygen, the Evas should be the same\
        \ because of being artificial angels]. Types 2 & 3; with S\xB2 Engine [Grants\
        \ limitless motion energy]), Forcefield Creation, Vibration Manipulation,\
        \ & Energy Projection (A.T. Fields can be used both defensively and offensively,\
        \ such as in the form of shockwaves and optic blasts), Self-Matter Manipulation\
        \ (A person's ego boundary is what forms their shape and keeps it from breaking\
        \ down. Also, as shown by Shinji and other Lilin as a whole they are able\
        \ to reform their bodies after being turned into a quantum state/pure LCL.),\
        \ Large Size (Types 1 & 2; Portrayed inconsistently, going from 40 meters\
        \ to 200), Immortality (Type 1; https://imgur.com/a/9qWt9Tf The Eva will exist\
        \ long after humanity is gone, even after 5 billion years when the sun is\
        \ gone the Eva will still exist, and is called eternal & Type 3), Regeneration\
        \ (Mid-Low; regenerated a broken arm. Likely Low-High over time; Like an angel,\
        \ an Evangelion should be able to regenerate from its core alone given enough\
        \ time), Enhanced Senses, Accelerated Development (Angels have been shown\
        \ to reach an adult state seconds after hatching. Eva Units should be able\
        \ of the same), Acrobatics (Despite the large size of Evangelion Units, they\
        \ are incredibly agile, easily performing a number of acrobatic maneuvers),\
        \ Martial Arts (Unit-01 utilizes close-quarters combat), Gamma Ray Photons\
        \ (with Positron Cannon), Weapon Mastery (Unit-01 efficiently wields knives\
        \ and firearms), Berserk Mode, Bodily Weaponry (Unit-01 can use its large\
        \ teeth bite into and consume opponents), Spatial Manipulation (Broke through\
        \ and destroyed Leliel's body, which is an imaginary numbers space), Resistance\
        \ to Heat, Magma, & High-Pressure (Saved Asuka thousands of meters deep into\
        \ an active volcano), Mind Manipulation & Soul Manipulation (The A.T Field\
        \ is the ego boundary that keeps a being's individuality and that protects\
        \ the heart/soul from outside influence) Shockwave Generation, Durability\
        \ Negation, Soul Manipulation, Mind Manipulation and Matter Manipulation (Using\
        \ an Anti-A.T. Field, he can break down A.T. Fields, the fields that separate\
        \ living beings from one another and maintain their individuality, turning\
        \ their physical bodies into LCL and freeing their souls), Spatial Manipulation\
        \ (Unit-01's Anti-A.T. Field inverted dimensional values. Furthermore, as\
        \ his A.T. Field is superior to Leliel, it should be capable of supporting\
        \ space just like the angel) & Deconstruction (Adam's Anti-Anti Field was\
        \ reducing everything around him to quarks), A.T. Field Wing Manifestation,\
        \ Flight, Energy Projection (with Spear of Longinus), Power Negation Field\
        \ (It's A.T Field should be comparable or outright superior to Tabris's, which\
        \ can block out and nullify virtually all forms of energy and matter, including\
        \ incoming light, electromagnetism and sub-atomic particles, within a certain\
        \ radius),Resistance to Cosmic Radiations (Remained undeterred by the vacuum\
        \ of space), Limited Resistance to Information Analysis (Numerical expression\
        \ and measurement of Anti-A.T. Fields is impossible) * Reality Warping and\
        \ Existence Erasure (When the Spear of Longinus and the Spear of Cassius merged,\
        \ they brought Evangelion Imaginary to the real world, with Evangelion Imaginary\
        \ being stated to be not real. With the Spear of Gaius, Shinji removed all\
        \ Evangelion Units from existence)"
