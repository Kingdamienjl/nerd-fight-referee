- id: claim-standard-equipment-ef7dbb88
  section: equipment
  axis: equipment
  text: "Shinji= right|thumb|Interface Headset *Plugsuit 01: Form-fitting full body\
    \ suits resembling a diver's wet suit, worn by Eva pilots together with their\
    \ Interface Headsets in order to increase their synchronization with the Evangelions.\
    \ The legs and half the torso are in the standard blue color for the male plug\
    \ suits, while the top is white. Although helpful, plugsuits do not appear to\
    \ be essential to pilot an Eva, as there have a few occasions when Shinji piloted\
    \ without one. It is stated, however, that a plugsuit increases the pilot's synchronization\
    \ ratio by cutting down on interference. *Interface Headset: A small device, worn\
    \ when piloting an Evangelion unit. |-|Evangelion Unit-01= Pk01-progknife.gif|Progressive\
    \ Knife Pallet Gun (NGE).png|Pallet Rifle NGE positron rifle composite.jpg|Positron\
    \ Sniper Rifle 03 C003 big.jpg|Umbilical Cable Ep11 eva battery packs.jpg|Battery\
    \ packs Eva 01 devouring S\xB2 Engine.png|S\xB2 Engine *Progressive Knife: A combat\
    \ knife contained inside the left shoulder pylon of an Evangelion who uses it,\
    \ and is one of the Evas' basic weapons. The blade of the knife vibrates at an\
    \ extremely high frequency, increasing its cutting sharpness to the point that\
    \ it can cut through the target at a molecular level. It is strong enough to pierce\
    \ an Angel's core with little trouble. Unit-01's Progressive Knife is in the form\
    \ of a simple Bowie knife. *Pallet Rifle: Sometimes alternatively called Pallet\
    \ Gun, it is the standard-issue rifle used by Evangelion units. It resembles a\
    \ Steyr ACR. This giant automatic rifle is proportionately sized to match the\
    \ Evas, so an Eva can wield the rifle just as a human would use a conventional\
    \ assault rifle. *Handgun: Resembles a Desert Eagle Mark XIX. Used by Unit-01\
    \ against Leliel in Episode 16, but was ineffective due to the Angel's non-physical\
    \ nature. *Positron Sniper Rifle: An upgraded, modified, or Eva-specific version\
    \ of the prototype, originally requisitioned from the JSSDF's R&D labs, where\
