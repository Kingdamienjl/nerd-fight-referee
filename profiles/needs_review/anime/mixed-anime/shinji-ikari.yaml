- id: claim-weaknesses-4e41bc44
  section: weaknesses
  axis: weakness
  text: 'Shinji is extremely avoidant and sometimes his justification for fleeing
    from piloting is to avoid hurting others. He shows a great fear of emotional pain
    and of being hated or left behind. In general, Shinji is shown to be introverted
    and disconnected from physical reality due to having little to no meaningful contact
    with others. In social party situations, he is shown to be quite uncomfortable,
    and he often has difficulty controlling his emotions around others due to his
    hard time letting go of the past. He is shown to the extreme of this, forsaking
    many lives (even his own) to save one person. Due to Shinji''s high nostalgia
    and fragile emotional state, he chooses to shut out the world, as evidenced by
    the headphones he wears rather often, plugged into an SDAT music player. Through
    all this, he may have overcome some of these by the end of the series when he
    wishes for another chance to find that joy by being with people | An Eva pilot
    feels everything their Evangelion feels when synchronized with the Eva, experiencing
    the pain of injuries the Eva sustains. It appears that if an Evangelion is severely
    damaged enough (even if the Entry Plug containing the pilot is not directly damaged
    itself), the pilot can indeed die from physical shock. And at an abnormally high
    synchronization ratio, it appears that pilots will really suffer injuries an Eva
    suffers. Unit-01 can be easily separated from its Umbilical Cord and only has
    5 minutes of internal battery (can somewhat be remedied with extra battery packs).
    Many of the pilot''s function can be overridden by NERV command center | When
    Berserk, Unit-01 is uncontrollably destructive | None notable Feats: The Eva''s
    strength will also change depending on it''s synchronization ratio with it''s
    pilot, which increases further as the series goes on, at times the Eva will go
    Berserk causing a spike in sync ratio and changing to a more animalistic and fierce
    fighting style, these feats will be marked with [Berserk]. Physical Strength *[Berserk]
    Broke Sachiel''s arms and tackled it and a building a long distance.Episode:02
    - Unfamiliar Ceilings 19:35 *[Berserk] Teared off a spike from Sachiel''s body
    and used it to crack it''s core.Episode:02 - Unfamiliar Ceilings 19:53 *In combination
    with Unit 02, kicked Israfel up a mountain and destroyed it''s core.Episode:09
    - Mind, Matching, Moment 20:36 *[Berserk] Burst free of Leliel after falling into
    its body.Episode:16 - The sickness unto death, and then... 11:01 *Leliel''s body
    was stated to likely be a portal directed into an imaginary space connected to
    another universe.Episode:16 - The sickness unto death, and then... 11:01 *Snapped
    Unit-03''s neck by strangling it.Episode:18 - Life and Death Decisions 18:26 *Smashed
    Unit 03''s head with a punch.Episode:18 - Life and Death Decisions 18:46 *[Berserk]
    Ruined Zeruel''s arm just by holding up it''s own hand, then teared off Zeruel''s
    arm by holding onto it and kicking Zeruel.Episode:19 - A Man''s Battle 19:31 *[Berserk]
    Broke free of its own restraints with sheer strength.Episode:19 - A Man''s Battle
    21:20 *Burst out of the Giant Rei''s eye.The End of Evangelion - Part 2 32:12
    *This Giant Rei was extremely large with her body reaching well into outer space.The
    End of Evangelion - Part 2 20:44 AT Field The AT Field is the barrier of the mind
    and soul in Evangelion all living beings possess AT Fields but Angels and Evangelions
    are capable of manifesting their AT Fields in physical form, primarily to defend
    from attacks neutralize other AT Fields, and on a few occasions use the AT Field
    itself as a weapon. *[Berserk] Unit 01''s AT Field forcibly eroded Sachiels''.Episode:02
    - Unfamiliar Ceilings 19:07 *Sachiel was capable of blocking an N2 mine''s massive
    explosion with it''s AT Field, albeit sustaining some damage.Episode:01 - Angel
    Attack 05:27 *Using 100% of his AT Field as a barrier temporarily halted the falling
    Angel Sahaquiel.Episode:12 - A Miracle''s Worth 18:57 *Sahaquiel crashing down
    would have fused all five Fuji lakes with the Pacific.Episode:12 - A Miracle''s
    Worth 10:38 *[Berserk] Sliced through Zeruel''s AT Field and body using a projected
    AT Field.Episode:19 - A Man''s Battle 20:13 *Zeruel after having it''s AT Field
    eroded was completely unharmed by the point blank detonation of an N2 Mine.Episode:19
    - A Man''s Battle 15:10 *Created a very tall explosion after activating, blowing
    off the top of Nerv headquarters.The End of Evangelion - Part 1 41:03 *Created
    projected wings which allow to fly up into the air.The End of Evangelion - Part
    1 41:23 *After resonating its S2 Engine along with the Mass Production Evas, they
    created an Anti AT Field, the shock wave of which created a massive explosion.The
    End of Evangelion - Part 2 03:13 *After bonding with the Lance of Longinus and
    becoming the Tree of Life, fused with the Giant Rei, projecting an Anti AT Field
    which wiped out all life on Earth.The End of Evangelion - Part 2 20:26 *[NSFW]
    While still using the power of the Lance of Longinus, Unit'
