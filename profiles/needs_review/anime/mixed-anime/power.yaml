        them out of her own blood, such as hammers, spears, knifes, and scythes. Weapons
        created from her blood are shown to be capable of disrupting the regenerative
        abilities of other Devils, due to Power''s blood constantly ripping the body
        apart internally) *Blood Empowerment & Statistics Amplification (After drinking
        large amounts of blood, she becomes stronger and will continue to grow even
        stronger, scarier, and haughtier with the more blood she consumes if it isn''t
        drained periodically) *Enhanced Smell (Is able to smell, track, and identify
        others from a distance by the specific scent of their blood) *Fear Empowerment
        (The more feared the concept or name a Devil embodies, the more powerful they
        become. This also includes fear of mental ideas relating to a concept, such
