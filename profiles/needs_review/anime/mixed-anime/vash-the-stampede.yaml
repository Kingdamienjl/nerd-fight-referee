        six-shot double-action with a top break reloading mechanism that fires bullets
        which can reach orbit in seconds. *Angel Arm: An extremely powerful weapon
        able to put a giant crater in the moon and could wipe the life off the Earth.
        Vash never chooses to use this though unless it is for non-attacking reasons.
        *Cybernetic Machinegun Arm: A very powerful machine gun able to punch through
        solid steel with ease. It is a part of Vash''s arm. *Angel Wings: Automatic
        wings that react to attacks towards Vash. *Black Hole Bullets: One of Vash''s
        strongest attacks. These black holes can cover up to 300 feet, they bypass
        durability and move at such speeds that even Knives had a hard time comprehending
