- id: claim-powers-and-abilities-827a00e5
  section: abilities
  axis: hax
  text: 'Base= Plant Physiology (Independent Plant), Master Marksman, Acrobatics (Vash
    has shownTrigun: Chapter 8 to be extremely acrobatic, he''s even stated to be
    an acrobat by those around him), Limited Body Control (Vash has great control
    over his bodily functions, being capable of completely blocking out sensory paralysis
    throughTrigun: Chapter 20 directing all of his senses to the pain of his wounded
    right finger), Limited Information Analysis (Vash can deduce the mechanics behind
    his opponent''s abilities over a short period of time), Analytical Prediction
    (Can predict the trajectory of attacks and can predict attacks while deprived
    of his sensesTrigun: Chapter 5. Can predict attacks from foes who are capable
    of blitzing him), Supernatural Willpower (Was tortured by Legato for 8 months
    straight, powering through it with his willpower aloneTrigun: Chapter 90), Attack
    Reflection (Can change the trajectory of incoming projectiles back at the attackerTrigun:
    Chapter 76 and away from himTrigun: Chapter 2), Reactive Evolution (Vash awakening
    of his Gate allowed him to instantly close the gap between him and Ark KnivesTrigun:
    Chapter 75) |-|Angel Arm= Absorption (Biological), Black Hole Creation, Spatial
    Manipulation, Durability Negation, Regeneration and Immortality Negation (Type
    3 and 8 - At least Low-Godly, likely Mid-Godly, possibly far higher - Vash''s
    special Angel Arm ability is the ability to generate large black hole-like blast
    of energy which contorts space around it and sucks up everything remotely close
    to itTrigun: Chapter 30. This effect can be greatly enhancedTrigun: Chapter 69
    after Vash has infused his Plant powers into bullets, creating Black Hole Bullets
    in the processTrigun: Chapter 77. These bullets are powerful enough to completely
    overpower the black holes of Knives, they can even kill Knives if he''s directly
    hit by one despite the fact he can regenerate almost instantaneously after having
    his physical body destroyedTrigun: Chapter 96), Power Nullification (Vash''s Black
    Hole Bullets can suck up and erase attacks, even those from Knives''s Angel Arm),
    BFR and Sealing (With Subspace Bullets - Vash can forcefully remove his opponent
    from his current dimension and seal them away in a sub-spaceTrigun: Lost Plant,
    with said sub-spaces being large enough to hold entire universes inside them)
    |-|Resistances= Body Control, Biological Manipulation and Paralysis Inducement
    (Completely resisted Legato''s attempts to control his body with his threads),
    Unconventional Absorption (Biological - Vash has a unique resistance to those
    who try to absorb him into themselves, rather then being absorbed his Angel Arm
    counteracts thisTrigun: Chapter 45 and starts absorbing them into Vash, completely
    overpowering their absorption in the process), Limited Low Temperatures (Vash''s
    equipment is cold-resistantTrigun: Chapter 4)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
