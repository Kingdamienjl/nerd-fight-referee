    - field: intelligence
      value: At least Extraordinary Genius. Comparable to, if not smarter than, Knives.
        Vash has spent over 100+ years honing his marksmanship to an unmatched level.
        Vash has spent the last 100 years being hunted by humanity's best bounty hunters
        and Assassins. Vash consistently outskills skilled opponents whilst using
        non lethal force, Vash was hunted by Eye of Michael members and the Gun-Ho-Guns
        and the members all analyze and predict every aspect of their opponents including
        body movement, skills, habits and breathing patterns. Vash easily dispatches
        members of these organizations as if they were nothing can instantly deduce
        abilities and see through illusions spread throughout Ten Kilometers made
        by nigh invisible wire using the weight of the water to severe the puppeteers
        fingers. counts the number of shots multiple bounty hunters gunshots, knowing
        all but one has ammo left. can figure out the mechanics of sensory hypnosis
        after seeing it once and bypass it. Vash can shoot thousands of rounds all
        through the same bullet hole and never miss, while avoid hitting anything
        vital. has shot the fuses of dozens of sticks of dynamite before they can
        hit the ground. Vash can change the incoming trajectory of long ranged attacks
        back at the opponent or change the direction of an attack Inches away from
        him. Can disarm 4 men so quickly with 4 gunshots that it sounded like only
        one. Can block omnidirectional attacks at the same time from point blank range.
        can dodge attacks from FTE opponents while under Hypnosis and having his senses
        paralyzed. Vash can parry attacks with AoE of Kilometers. Vash can fight without
        the usage of his eyesight, in under a hundredth of a second Vash was able
        to perform much more calculations than the 200+ year old Plant. Plants are
        much superior to the Humans of Trigun, who are able to create ships capable
        of space-time and intergalactic communication systems. Plants can understand
        the mechanisms of Causality which even the advanced civilizations of Trigun
        cannot comprehend. Plants are also smart enough to understand the quantum
        mechanics and the mechanics of the creation and destruction of universality
        space-Time structures. Vash can turn ordinary bullets into black hole bullets
        with some time.
