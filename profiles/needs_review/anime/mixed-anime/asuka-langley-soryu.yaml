    - field: standard_equipment
      value: 'right, thumb, Interface Headset, Plugsuit 02: Form-fitting full bodysuits
        resembling a diver''s wetsuit, worn by Eva pilots together with their Interface
        Headsets in order to increase their synchronization with the Evangelions.
        02 Follows the standard single color scheme for the female plug suit and is
        red with a lime green patch on the chest. Although helpful, plugsuits do not
        appear to be essential to pilot an Eva, as there have a few occasions when
        Shinji piloted without one. It is stated, however, that a plugsuit increases
        the pilot''s synchronization ratio by cutting down on interference., Interface
        Headset: A small device, Umbilical Cable, Progressive Knife: A combat knife
        contained inside the left shoulder pylon of an Evangelion who uses it, and
        is one of the Evas'' basic weapons. The blade of the knife vibrates at an
        extremely high frequency, increasing its cutting sharpness to the point that
        it can cut through the target at a molecular level. It is strong enough to
        pierce an Angel''s core with little trouble., Pallet Rifle: Sometimes alternatively
        called Pallet Gun, it is the standard-issue rifle used by Evangelion units.
        It resembles a Steyr ACR. This giant automatic rifle is proportionately sized
        to match the Evas, so an Eva can wield the rifle just as a human would use
        a conventional assault rifle., Sonic Glaive: A spear-like weapon used to slice
        Israfel in half in Episode 09. It also appears in Episode 19, but isn''t used.
        In real life, a glaive is a spear shaft containing a knife at the end rather
        than a spearhead. This may mean it''s based on the same engineering as a Progressive
        Knife, but with an extended range., Smash Hawk: An axe-like weapon, being
        able to be held with either one or two hands. Unit-02 sortied with it in Episode
        16, but doesn''t use it in combat against an Angel. Also maybe based on the
        Progressive Knife engineering, utilizing sonic vibrations to strengthen the
        sharpness of the blade with it being of a shorter length than the "Sonic Glaive"
        spear, but containing a wider blade for greater damage., Bazooka: Unit-02
        sortied with, not used., Hand Bazooka: Also called "Launcher Gun", used against
        Zeruel, dual-wielded, ineffective., Positron Rifle (Prototype 20 with toroidal
        accelerator): Shoulder-mounted (the shoulder pylon of the equipped arm is
        extracted). Can fire rounds into low Earth-orbit, though the power of the
        shots lowers to being ineffective from a long range. Not a very mobile weapon
