      value: "Strictly follows the good Shinobi code, Cataclysmic Force is a mode\
        \ so powerful that it constantly damages her body, Frantic Mode highly reduces\
        \ her durability Notable Attacks/Techniques: *Dual Slash: Asuka sheathes both\
        \ of her swords, slowly leans forward, then quickly draws both of them at\
        \ once and dashes forward; slicing through any and all that are in her path.\
        \ This move is sometimes done with the aide of rocks depending on the game.\
        \ *Hanz\u014D-Style Full Bloom: Asuka takes a stance as her two swords become\
        \ coated in a greenish glow. She then dashes forward and unleashes a barrage\
        \ of slashes on to her enemies. Asuka would then slam both of her swords down,\
        \ causing sharp rocks to rise up from the ground. The direction can be changed\
        \ as she is slashing, making it easier to follow after straying enemies that\
        \ are nearby. *Hanz\u014D-Style Storm Kick: While in th air, Asuka sheathes\
        \ both of her swords, then sticks her leg out and begins to spin around, creating\
        \ a whirlwind to attack enemies in the surrounding area as she descends. *Hanz\u014D\
        -Style Blooming Slash: While airborne, Asuka takes both her swords and extends\
        \ them outwardly to the sides. She then spins rapidly in place, creating a\
        \ vortex of wind that envelopes her body. This wind carries her through the\
        \ air as she ascends in the direction of her enemies, scooping them up and\
        \ sending them flying all in one swift motion. Afterwards, she stops and descends\
        \ back to the ground. *Toad Summon: Asuka makes a series of hand signs, attempting\
        \ to summon a large toad; which she is later successful. Once summoned, she\
        \ celebrates and jumps onto the toad's back. However, the toad ignores her\
        \ commands and acts on its own The toad then leaps into the air with Asuka\
        \ still holding on for dear life and makes a dive for the opponent(s). Once\
        \ it lands, it begins to slash wildly with it's tongue, as Asuka flails about\
        \ trying to keep hold. *Shinobi Transformation: A physical technique that\
        \ uses the Atrribute of Yang, in where the fundamental essence of the shinobi\
        \ is used as a battle tool by releasing the body's internal spiritual energy\
        \ in all six chakras simultaneously. *Frantic Mode: A technique that uses\
        \ the Attribute of Yin, performed by stripping off one's clothing, resulting\
        \ in a considerable enhancement in speed and attack power by absorbing blood\
        \ spilled within the shinobi barrier. However, it is a double-edged sword,\
        \ as it also incurs a significant penalty to defense *Ultimate Form/Deep Shadow:\
