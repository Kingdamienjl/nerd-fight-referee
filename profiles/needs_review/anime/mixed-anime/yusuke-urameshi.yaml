      value: 'Yusuke acts unintelligently outside of actual battles. Notable Attack/Techniques:
        * Spirit-Gun: Yusuke''s signature move; he harnesses his spirit energy and
        fires it in a straight line from his right index finger. The Spirit gun can
        vary in size depending on how much energy Yusuke puts into it, and the technique
        can be rapid-fired in later chapters. * Demon-Gun: Same as the spirit gun,
        but makes use of his demonic energy. * Spirit Shotgun: An upgraded variant
        of the Spirit Gun. While not as powerful as its parent move, it fires multiple
        smaller shots that scatter in multiple directions, enabling it to strike multiple
        targets. * Spirit Punch: Yusuke can use his spirit energy to enhance the strikes
        of his punches while simultaneously forming a barrier around his fists to
        block attacks. * Spirit Wave: Yusuke covers his entire body in his own spirit
        energy, thus using himself as a substitute for a spirit gun. This requires
        heavy amounts of concentration and may deplete him of his energy, but it is
        very powerful and also grants him healing properties in turn. *Mazoku/Demon
        transformation: Upon his awakening as a reincarnation of the Mazoku, Yusuke
        has once received a possession from his ancestor, Raizen. In this form, Yusuke
        loses all self-control and has his grandfather control him instead, but his
        power, speed, and endurance all skyrocket to great proportions. Has never
