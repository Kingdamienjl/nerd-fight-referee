  name: 'Resistance to: **Mind Manipulation & Soul Manipulation (The A.T Field is
    the ego boundary that keeps a being''s individua'
  description: "Resistance to: **Mind Manipulation & Soul Manipulation (The A.T Field\
    \ is the ego boundary that keeps a being's individuality and that protects the\
    \ heart/soul from outside influence) **Heat Manipulation with the Plugsuit (While\
    \ wearing a Plugsuit, Shinji could open a super-heated Entry Plug hatch without\
    \ suffering large burns, unlike his father who performed the same action with\
    \ his bare hands) All previous abilities * Force Field Penetration * Regeneration\
    \ (Low-Mid) * Immortality (Type 3) * Levitation * Absorption (Absorbed Adam and\
    \ Gendo Ikari's hand) * Fusionism (Merged with Lilith) *Superhuman Physical Characteristics\
    \ *Self-Sustenance (Type 1 [Angels have shown repeatedly to not require oxygen,\
    \ the Evas should be the same because of being artificial angels.]) *Forcefield\
    \ Creation (A.T. Fields can be used both defensively and offensively, such as\
    \ in the form of optic blasts) *Self-Matter Manipulation (A person's ego boundary\
    \ is what forms their shape and keeps it from breaking down. Also, as shown by\
    \ Shinji and other Lilin as a whole they are able to reform their bodies after\
    \ being turned into a quantum state/pure LCL.) *Large Size (Type 1-2, Portrayed\
    \ inconsistently, going from 40 meters to 200) *Immortality (Type 1 https://imgur.com/a/9qWt9Tf\
    \ The Eva will exist long after humanity is gone, even after 5 billion years when\
    \ the sun is gone the Eva will still exist, and is called eternal & 3) *Regeneration\
    \ (Mid-Low; Unit-01 regenerated a broken arm, likely Low-High over time; like\
    \ an angel, an Evangelion should be able to regenerate from its core alone given\
    \ enough time) *Enhanced Senses *Weapon Mastery *Explosion Manipulation (with\
    \ N\xB2 bomb) *Force Field Penetration (with Spear of Longinus) *Self-Destruction\
    \ *Close Quarter Combat *Acrobatics *Berserk Mode *Resistance to Heat Magma and\
    \ High-Pressure (Comparable to Unit-01, which could withstand both the heat of\
    \ magma and nuclear explosions) *Resistance to Mind Manipulation and Soul Manipulation\
    \ (The A.T Field is the ego boundary that keeps a being's individuality and that\
    \ protects the heart/soul from outside influence) All from previous *Self-Sustenance\
    \ (Type 2 and 3, the S\xB2 Engine grants limitless motion energy) *Shockwave Generation\
    \ *Durability Negation *Soul Manipulation *Mind Manipulation and Matter Manipulation\
    \ (Using an Anti-A.T. Field, Adam could break down A.T. Fields, the fields that\
    \ separate living beings from one another and maintain their individuality, turning\
    \ their physical bodies into LCL and freeing their souls) *Spatial Manipulation\
    \ (Unit-01's Anti-A.T. Field inverted dimensional values. Furthermore, as his\
    \ A.T. Field is superior to Leliel, it should be capable of supporting space just\
    \ like the angel) and Deconstruction (Adam's Anti-A.T. Field was reducing everything\
    \ around him to quarks) *Shapeshifting (Replicated Kaworu Nagisa's appearance\
    \ to calm down Shinji) *Body Control (Can manifest wings, create holes in her\
    \ palms, and form a vagina on her forehead) *Energy Projection *Intangibility\
    \ *Size Enhancement *Large Size (Type 4) *Telepathy *Power Negation Field (Her\
    \ A.T Field should be comparable or outright superior to Tabris's, which can block\
    \ out and nullify virtually all forms of energy and matter, including incoming\
    \ light, electromagnetism and sub-atomic particles, within a certain radius) *Limited\
    \ Resistance to Information Analysis (Numerical expression and measurement of\
    \ Anti-A.T. Fields is impossible) *Resistance to Extreme Cold and Cosmic Radiations"
