    - field: standard_equipment
      value: 'right|thumb|Interface Headset * Plugsuit 00: Form-fitting full body
        suits resembling a diver''s wet suit, worn by Eva pilots together with their
        Interface Headsets in order to increase their synchronization with the Evangelions.
        00 is distinctive in its white coloring with orange patches at the shoulders.
        Although helpful, plugsuits do not appear to be essential to pilot an Eva,
        as there have a few occasions when Shinji piloted without one. It is stated,
        however, that a plugsuit increases the pilot''s synchronization ratio by cutting
        down on interference. * Interface Headset: A small device, worn when piloting
        an Evangelion unit. 12 C273c.jpg|Progressive Knife Pallet Gun (NGE).png|Pallet
        Rifle 16 unit-00 sniper rifle.jpg|Sniper Rifle NGE positron rifle composite
        3.jpg|Positron Sniper Rifle Lance of Longinus.png|Spear of Longinus * Progressive
        Knife: A combat knife contained inside the left shoulder pylon of an Evangelion
        who uses it, and is one of the Evas'' basic weapons. The blade of the knife
        vibrates at an extremely high frequency, increasing its cutting sharpness
        to the point that it can cut through the target at a molecular level. It is
        strong enough to pierce an Angel''s core with little trouble. * Pallet Rifle:
        Sometimes alternatively called Pallet Gun, it is the standard-issue rifle
        used by Evangelion units. It resembles a Steyr ACR. This giant automatic rifle
        is proportionately sized to match the Evas, so an Eva can wield the rifle
        just as a human would use a conventional assault rifle. * Sniper Rifle: Unit-00''s
        weapon of choice, modeled on the Accuracy International Arctic Warfare Magnum.
        * Positron Sniper Rifle: An upgraded, modified, or Eva-specific version of
        the prototype, originally requisitioned from the JSSDF''s R&D labs, where
        it was known as the SDF''s Automated Positron Rifle. * B-Type'
