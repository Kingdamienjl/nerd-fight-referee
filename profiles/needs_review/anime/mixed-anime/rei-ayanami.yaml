    - field: weaknesses
      value: "Standard human weaknesses | An Eva pilot feels everything their Evangelion\
        \ feels when synchronized with the Eva, experiencing the pain of injuries\
        \ the Eva sustains. It appears that if an Evangelion is severely damaged enough\
        \ (even if the Entry Plug containing the pilot is not directly damaged itself),\
        \ the pilot can indeed die from physical shock. And at an abnormally high\
        \ synchronization ratio, it appears that pilots will really suffer injuries\
        \ an Eva suffers. Unit-00 can be easily separated from its Umbilical Cord\
        \ and only has 5 minutes of internal battery (can somewhat be remedied with\
        \ extra battery packs). When Berserk, Unit-00 is uncontrollably destructive\
        \ | If Shinji rejects instrumentality, she will decay and deteriorate Feats:\
        \ Rei's Prototype Evangelion, originally orange in colour before being repainted\
        \ blue. AT Field The AT Field is the barrier of the mind and soul in Evangelion\
        \ all living beings possess AT Fields but Angels and Evangelions are capable\
        \ of using their AT Field to both defend from attacks and neutralize other\
        \ AT Fields. * Together with the other Eva Units, halted Sahaquiel's fall\
        \ and pushed it back.Episode:12 - A Miracle's Worth 19:20 * Inverted its own\
        \ AT Field to both contain Armisael and overload its own core causing it to\
        \ self-destruct destroying all of Tokyo-3.Episode:23 - Tears Director's Cut\
        \ 11:45 Strength * Cut through Sahaquiel's AT Field and forced it open.Episode:12\
        \ - A Miracle's Worth 19:25 * Sahaquiel's AT Field was unharmed by many N2\
        \ Mines detonated on top of itEpisode:12 - A Miracle's Worth 10:30. * Threw\
        \ the Spear of Longinus into the upper atmosphere, through an AT Field and\
        \ Arael itself completely obliterating the Angel before traveling into outer\
        \ space.Episode:22 - Staying Human Director's Cut 25:15 * The spear was thrown\
        \ hard enough to reach lunar orbit, it is also noted to be heavy enough that\
        \ it would be impossible to retrieve. Speed * Intercepted Ramiel's Particle\
        \ Cannon, albeit from outside of its normal firing range.Episode:06 - Showdown\
        \ in Tokyo-3 19:29 Durability * Blocked a sustained blast from Ramiel using\
        \ a shield.Episode:06 - Showdown in Tokyo-3 19:37 * Survived Sahaquiel self-destructing\
        \ right on top of her and the other two Eva Units.Episode:12 - A Miracle's\
        \ Worth 19:40 * Detonated an N2 mine at point blank range and remained intact.Episode:19\
        \ - A Man's Battle 15:10 After being resurrected following her self-sacrifice\
        \ to defeat an Angel, Rei gains access to abilities stemming from her AT Field\
        \ without the use of an Eva. * Produced an AT Field without her Eva and penetrated\
        \ Kaworu's AT Field.Episode:24 - The Last Cometh Director's Cut 20:03 * According\
        \ to the text displayed during this sequence, Rei's AT Field has the highest\
        \ energy reading ever recorded. * Absorbed Gendo's arm and Adam along with\
        \ it, then regenerated her own arm.The End of Evangelion - Part 2 05:23 *\
        \ Has the ability to levitate.The End of Evangelion - Part 2 05:36 After absorbing\
        \ Adam into her body before combining with the form of Lilith, Rei enters\
        \ this godlike state, and is the most powerful being in the series. * Possessed\
        \ intangibility, passed through NERV HQ.The End of Evangelion - Part 2 07:00\
        \ * Grew large enough that clouds are below her waist.The End of Evangelion\
        \ - Part 2 08:00 * After merging with Unit 01 and the Spear of Longinus she\
        \ increased massively in sizeThe End of Evangelion - Part 2 20:13 she's large\
        \ enough to almost reach the moonThe End of Evangelion - Part 2 20:44. * Created\
        \ projections that separate people's bodies and souls on contact, she did\
        \ this all over the planet.The End of Evangelion - Part 2 20:59 * Her projections\
        \ can physically interact with people.The End of Evangelion - Part 2 22:44\
        \ * By combining with Unit 01, who had absorbed the Spear of Longinus and\
        \ become the Tree of Life, projected a worldwide Anti-AT Field which caused\
        \ the souls of all living things to become separate from their physical forms.The\
        \ End of Evangelion - Part 2 20:26 Notable Attacks/Techniques: *A.T. Field\
        \ (A.T. = Absolute Terror): The intangible light of the soul in the physical\
        \ world, A.T. Fields are possessed by all living beings on NGE-Earth and are\
        \ one of the major aspects of the human psyche that defines someone as \"\
        individual\" and \"protect\" them from the intrusion of another's feelings.\
        \ However, the Evangelion Units and the Angels are unique in the ability to\
        \ generate A.T. Fields that are corporeal and occasionally visible to the\
        \ naked eye, possibly due to a large amount of innate energy contained in\
        \ their souls. Their A.T. Fields mostly function as a physical defense: a\
        \ forcefield consisting of concentric octagonal yellow lines. The barrier\
        \ is almost perfect, only being temporarily disrupted from its active state\
        \ by incredibly energetic weapons (such as military-grade positron beams and\
        \ \"N\xB2 Weapons\") or erosion by another corporeal \"A.T. Field\" that is\
        \ superior in strength. If left alone after initial disruption, the A.T. Field\
        \ will revive its durability almost instantly"
