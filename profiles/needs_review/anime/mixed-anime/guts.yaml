    - field: intelligence
      value: 'Gifted (Guts is an infamously skilled swordsman, being able to take
        on most Apostles and humans with his casual swings alone thanks to the enormous
        heft of the Dragon Slayer. Guts is a capable thinker and a pragmatic fighter,
        a fact he proves by solving problems with his wits when brute force doesn''t
        work, such as when he used an enemy as bait by disguising them with his cloak,
        played dead to get close enough to fire a point-blank Hand Cannon, and adapting
        to exceedingly unfavorable situations. Contrary to popular belief Guts is
        quite clever, as shown when he uses his scientific knowledge, such as utilizing
        Dragon Slayer against lightning and puncturing the Sea God''s stomach to take
        advantage of the difference in air pressure to get vacuumed within another
        part of its body) Standard Tactics: Constant state of Bloodlust with Berserker
        Armor'
      source_id: mediawiki-16852
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Bloodthirsty and sadistic to a fault at times. Suffers from PTSD that
        makes him fear to be touched intimately | Is cursed by the Brand of Sacrifice
