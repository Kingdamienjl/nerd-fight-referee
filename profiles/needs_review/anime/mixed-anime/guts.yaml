      value: Superhuman Physical Characteristics, Master Swordsman (Guts has carved
        his own effective sword style that mainly utilizes greatswords), Expert Hand-to-Hand
        Combatant, Enhanced Senses (Defended himself and several others from a professional
        assassin sniping them in near-total darkness, fights unimpeded despite lacking
        an eye post-Eclipse, could keep up with Rosine while being deafened by her
        sonic booms), Air Manipulation, Regeneration (low), Non-Physical Interaction
        (Can harm Ghosts), Soul Manipulation (Can Damage the Soul), Limited Regeneration
        Negation (Severe wounds caused on the Astral Plane/dealt to the soul do not
        heal properly, reopening even after being healed, magically or otherwise),
        Explosion Manipulation, Limited Immortality (Type 2, He can take far more
        punishment than before, but will still die from total blood loss, destruction
        or stoppage of the heart, and/or a cease to critical brain functions. The
        armour essentially "holds him together"), Passive Probability Manipulation
        (Due to the circumstances of his birth, he has the supernatural ability to
        evade certain death), Pressure Points (Easily knocked out Farnese by lightly
        hitting her in the back of the neck, leaving her basically unharmed), Self-Healing
        with Elf Dust (Up to Low-Mid; Due to his elf companion Puck stowing away inside
        his travel bags, he has a supply of Elf Dust that he can use to heal wounds,
        such as from extreme torture and having his neck pierced by the mandibles
        of a man-sized praying mantis), Minor Explosion Manipulation (Via miniature
        bombs), Resistance to Possession (Was able to expel multiple spirits attempting
        to possess him), Heat/Fire and Electricity (He has repeatedly tanked building
        and forest fires and other high-heat hazards and attacks. Withstood lightning
