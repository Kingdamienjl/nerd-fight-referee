        poison) and Soul Manipulation (Has ignored severe wounds on his astral body),
        Empathic Manipulation (Is not under the influence of Femto's supernatural
        aura that can induce fear and obedience, and could attack him even while on
        the brink of death), Limited Resistance to Causality Manipulation and Fate
        Manipulation (Skull Knight states that due to Guts inhabiting the Interstice
