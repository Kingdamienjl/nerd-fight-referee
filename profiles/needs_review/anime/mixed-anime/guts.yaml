      value: 'Is absurdly reckless, The Berserk Armour doesn''t heal Guts it just
        snaps his body back into a workable condition Notable Attacks/Techniques:
        * Dragonslayer: Dragonslayer is Guts'' main weapon. It is an enormous sword
        that was made to slay dragons, as the name implies, however, nobody could
        wield it due to its size, except for Guts. The Dragonslayer is also special
        because it has bathed in so much demonic blood that it exists in both the
        physical and astral plane of existences meaning that Guts can harm any type
        of ghost or demon. * Prosthetic Arm: After Guts lost his arm, he replaced
        it with a prosthetic arm. This prosthetic arm has a crossbow, a flamethrower
        and a single shot cannon. * Berserker Armour: The Berserker Armour is a full
        set of armour that Guts wears. It naturally increases his strength and speed,
        it nullifies any pain he might feel and if he takes any damage then the armour
        will put his body back together, this doesn''t heal Guts so if Guts broke
        his arm then the armour would snap his arm back into place. Note: This profile
