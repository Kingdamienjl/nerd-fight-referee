      heft of the Dragon Slayer. Guts is a capable thinker and a pragmatic fighter,
      a fact he proves by solving problems with his wits when brute force doesn''t
      work, such as when he used an enemy as bait by disguising them with his cloak,
      played dead to get close enough to fire a point-blank Hand Cannon, and adapting
      to exceedingly unfavorable situations. Contrary to popular belief Guts is quite
      clever, as shown when he uses his scientific knowledge, such as utilizing Dragon
      Slayer against lightning and puncturing the Sea God''s stomach to take advantage
      of the difference in air pressure to get vacuumed within another part of its
