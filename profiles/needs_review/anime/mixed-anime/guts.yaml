    - field: standard_equipment
      value: '98-987516 guts-berserk-guts-golden-age-manga.jpg|One of the Great Broadsword
        Guts used Berserk 41 001.jpg|Leather Armor *Great Broadsword: Large broadsword
        that was made to suit Guts'' way of fighting his enemies, with as much power
        and durability it can muster. Even then Guts needed to replace several of
        these swords due to Guts putting them through much pressure but these swords
        should not be underestimated because these are still able to cut heavily armored
        men with ease and withstand blows from a person who was as strong as Guts.
        *Leather Armor: Light and effective armor used by Guts as a mercenary, it
        brings relative protection from arrows and sword slashes but is quite easily
        shredded by powerful opponents such as trained knights, assassins and apostles.
        Berserk 134 006.jpg|The Dragon Slayer 23231124141241231231412313124123124123123124123124123123412341231.jpg|Showcase
        for the Armor, Dagger, Throwing Knives, and the Hand Cannon. Berserk v19 p118
        B.jpg|Miniature Bombs *Dragon Slayer: This weapon was built with the singular
        purpose of being able to slay a dragon. Its creator, Godot, made it oversized
        and crude, as a means of criticizing and mocking the ridiculous demand of
        its commission, and put it in his shed to rust after it was rejected in disgust
        by the king who ordered it. Years later, it would be found by Guts, who, to
        Godot''s shock, could wield it just as he could any other sword. And ironically
        enough, the weapon has come close to fulfilling its "purpose", Guts having
        used the weapon to defeat, albeit not kill, the Dragon Apostle, Grunbeld.
        Aside from it absurd size and its subsequent ability to deal equally absurd
        damage, what makes the Dragon Slayer special is that due to it being tempered
        in the blood and malice of thousands of the monsters and malicious spirits
        inhabiting the Interstice, it has gained the ability to attack the ethereal
        body. *Hand Cannon: One of the few long-range weapons Guts has. It can be
        morphed out of Guts'' right hand and is quite powerful, being able to blast
        through Apostles with little effort. Guts also uses the Hand Cannon''s recoil
        to propel himself forward whilst swinging the Dragon Slayer, enhancing his
        velocity. In turn the hand cannon can also turn into a brutal melee weapon
        -- due to its sledgehammer-like weight and sturdiness, Guts, even after being
        pushed to the point of collapse from a gauntlet of ruthless fights just a
        couple hours prior, effortlessly killed a fully-armored knight with a single
        punch. *Repeater Crossbow: A crossbow mountable to Guts'' prosthetic arm,
        capable of firing arrows rapidly. It''s mainly used for fighting a horde of
        enemies. *Dagger: Used by Guts for usually cutting meat of animals but it
        is also used as an effective side arm that Guts can use in blink of an eye
        when the Dragon Slayer isn''t necessary. *Throwing Knives: Guts has a really
        accurate throwing capability with knives so he opted for the wide leaf-shaped
        daggers that can easily penetrate even armored opponents. *Miniature Bombs:
        While seemingly underwhelming at first glance these miniature bombs are not
        to be underestimated, they can easily blow up armor and severely damage pseudo-apostles.
        *Black Swordsman Armor: Really durable armor that is resistant to blunt and
        slash damage and specially for the former as Guts has survived being crushed
        several times due to the help of the armor. The armor provides relative protection
        to the legs and the shoulders as he can shrug off most arrow strikes and sword
        slashes. Berserka Armor.png|Guts'' variation of the Berserker Armor, manifesting
        a mad, bloodthirsty wolf Aec5fdf46c64f807cf868f7513c22bc1.png|Skull Knight''s
        variation of the Berserker Armor, before it''s manifestation suiting Guts
        *Berserker Armor: A cursed suit of incredibly durable armor that removes the
        body''s subconscious limiters, allowing the wearer to achieve incredible feats
        of strength, speed and agility that are far beyond what they''re normally
        capable of, at the cost of causing heavy strain and damage to the body in
        the process. It also keeps wounds from slowing Guts down, forcibly relocating
        joints, reinforcing broken bones, and binding flesh to the bone with barbs.
        However, it does not mend wounds, meaning that Guts will still be bleeding
        out from particularly severe wounds. Additionally, it strips the user of whatever
        sanity they once had put them into a constant state of bloodlust. The bloodlust
        is so powerful that Schierke was unable to possess him in this state.'
      source_id: vsbattles-guts-mixed-anime
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Gifted (Guts is an infamously skilled swordsman, being able to take
        on most Apostles and humans with his casual swings alone thanks to the enormous
        heft of the Dragon Slayer. Guts is a capable thinker and a pragmatic fighter,
        a fact he proves by solving problems with his wits when brute force doesn''t
        work, such as when he used an enemy as bait by disguising them with his cloak,
        played dead to get close enough to fire a point-blank Hand Cannon, and adapting
        to exceedingly unfavorable situations. Contrary to popular belief Guts is
        quite clever, as shown when he uses his scientific knowledge, such as utilizing
        Dragon Slayer against lightning and puncturing the Sea God''s stomach to take
        advantage of the difference in air pressure to get vacuumed within another
        part of its body) Standard Tactics: Constant state of Bloodlust with Berserker
        Armor'
      source_id: vsbattles-guts-mixed-anime
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Bloodthirsty and sadistic to a fault at times. Suffers from PTSD that
        makes him fear to be touched intimately | Is cursed by the Brand of Sacrifice
        and will be attacked by Tidal Wave of Darkness during the night. Can''t swim
        with his steel arm | The Berserker Armor does not heal wounds, only delaying
        the effects of damage taken. The Berserker Armor also removes his subconscious
        limiters, causing his body to harm and eventually destroy itself. Now suffers
        from even more severe PTSD Notes: *While there are claims that Dragon Slayer
        negates durability by attacking the soul, this is not true, nor are claims
        it outright possesses a busted degree of regeneration negation (this argument
        commonly phrased as something to the effect of "Dragon Slayer kills with a
        scratch"). Its power is more along the lines of creating wounds that will
        never fully recover, and even if healed or regenerated, they will open up
        again. This isn''t full-blown regeneration negation but will function as such
        when it comes to more debilitating injuries. *Guts'' Probability Manipulation
        is likely not quite as effective in a VS match as it is in-story, as many
        of the times he''s survived were due to outside help. While still otherwise
        applicable and even potentially highly effective, this does limit his potential
        options for a bailout with luck hax. *It is advised for the OP to choose between
        Guts during Griffith''s retrieval and Post-Eclipse Guts when making matches
        with his second key. The former version of Guts is already 9-B, but the latter
        is even stronger with the Dragon Slayer and his hand-cannon. If it''s not
        specified, by SBA Guts is at his strongest, therefore at the Post-Eclipse
        state. ==Gallery== 297929-Berserk-Guts-manga.jpg 168-1687742 berserk-hd-wallpaper-berserk-manga.jpg
