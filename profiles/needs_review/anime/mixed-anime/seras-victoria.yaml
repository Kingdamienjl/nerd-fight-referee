- id: claim-powers-and-abilities-2e3171e6
  section: abilities
  axis: hax
  text: Incomplete Vampire= *Superhuman Physical Characteristics *Immortality (Type
    1, 2, 3 and 7; Vampires can live foreverHELLSING; Volume 1; Chapter 3 Murder Club,
    survive getting hit by a barrage of bulletsHELLSING; Volume 2; Chapter 4 Deadzone
    4, and are undeadHELLSING; Volume 1; Chapter 1 Vampire Hunter) *Bodily Weaponry
    (Conventional; Vampires possess fangs or claws which can be used to rip apart
    their victims and drink their blood) *Extrasensory Perception (Upon activating
    her third eye, Seras was able to dispel the Illusions caused by Zorin, and run
    to an area where she will be able to shoot her, other Vampires such as Luke was
    able to sense Alucard's powerful chi) *Regeneration (High-Low; Can regenerate
    from multiple stab wounds in her torso) *Weapon Mastery (Marksmanship; Able to
    shoot a target from over 600 meters away right in the heart and at night time
    through the usage of her third eye. Equipped with a 30mm anti-midian cannon, harkonnen,
    has armor piercing) *Enhanced Senses (Vampires have heightened perceptionHELLSING;
    Volume 1; Chapter 2 Master of Monster) *Blood Absorption (Vampires are able to
    suck the blood from humans which acts as both their sustenance, and as a way to
    heal or resurrect themselvesHELLSING; Volume 4) **Soul Manipulation (Absorbing
    the blood of a person also absorbs their soulHELLSING, Volume 8; Chapter 1 Wizardry
    2) *Corruption (Can turn humans into ghouls after draining their bloodHELLSING;
    Volume 2; Chapter 1 Deadzone 1) *Martial Arts (Due to being trained as a police
    girl, she is able to pull grapple techniques to subdue her opponent) *Analytical
    Prediction (Vampires can precisely calculate and predetermine their opponents'
    moves to react accordinglyHELLSING; Volume 6; Chapter 8 Soldier of Fortune 1)
    *Corruption/Power Bestowal (Vampires can turn humans either into a Vampire or
    a Ghoul after draining their blood) With Harkonnen I *Explosion Manipulation (Has
    Explosive Ammunition that can blow up a tank) Resistance to *Illusion Creation
    and Perception Manipulation via Third Eye (Upon activating her Third Eye, Seras
    was able to resist and overcome the illusions cast by Zorin.HELLSING; Volume 6;
    Chapter 9 Soldier of Fortune 2) |-|True Vampire= All previous abilities plus *Regeneration
    (Low-Mid; Can regenerate limbs) *Darkness Manipulation & Shapeshifting (Shapeshifted
    a pair of shadow wings, and turned into a streak of shadow as she flew away) *Darkness
    Manipulation (Her shadow can casually cover an entire building) **Flight (Flew
    away as a streak of shadow.) *Blood Manipulation (Can manipulate her blood to
    spike up from the ground and stab through enemies) *Social Influencing (Instigating
    Fear; Was able to make Veteran Waffen SS, Vampires who dominated battlefields
    and rush towards artillery fire, terrified by the sight of her.HELLSING; Volume
    7; Chapter 7 The Man I Love) *Multiple Selves (Type 2; After absorbing Pip, his
    soul started blending with Seras'HELLSING; Volume 7; Chapter 8 Ogre Battle) *Summoning
    (Summoned Pip to come out of her arm.HELLSING; Volume 10; Chapter 1 Wolf Fang
    1) Resistance to *Holy Manipulation (Capable of grabbing Alexander's Bayonet)
    Limited Resistance to *Mind Reading, Mind Manipulation & Memory Manipulation (Zorin
    was unable to read and look at Seras' memories due to Pip's memories and spirit
    blending with her's.HELLSING; Volume 7; Chapter 6 Yaksa)
