    - field: weaknesses
      value: 'Is against killing (unless left without a choice or bloodlusted). Continuous
        use of a Plants powers and abilities will slowly cause their hair to darken
        and eventually die. Notable Attacks/Techniques: *.45 Long Colt: Vash habitually
        carries a custom made .45 caliber silver or nickel-plated revolver, a classic
        six-shot double-action with a top break reloading mechanism that fires bullets
        which can reach orbit in seconds. *Angel Arm: An extremely powerful weapon
        able to put a giant crater in the moon and could wipe the life off the Earth.
        Vash never chooses to use this though unless it is for non-attacking reasons.
        *Cybernetic Machinegun Arm: A very powerful machine gun able to punch through
        solid steel with ease. It is a part of Vash''s arm. *Angel Wings: Automatic
        wings that react to attacks towards Vash. *Black Hole Bullets: One of Vash''s
        strongest attacks. These black holes can cover up to 300 feet, they bypass
        durability and move at such speeds that even Knives had a hard time comprehending
        them. *Sub-Space Bullets: Another type of Ammunition Vash has at his disposal,
        these Sub-Space Bullet''s provide Vash with a non-lethal alternative to his
        Black-Hole Bullets. These Bullets can grow large enough to BFR the roof of
        a massive building away, these Bullets send the opponent into a separate Space-Time
        Sub-Space, these Bullets have allowed Vash to BFR a self destructive Black-Hole
        that would destroy and create another universe into a separate Universe where
        it proceeded to destroy and recreate another universe. ==Notable Matchups==
