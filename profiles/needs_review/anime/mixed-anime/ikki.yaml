    - field: weaknesses
      value: "At first Takedda was weak to leg kicks, which slow his movements. However\
        \ after his underground training this is no longer the case. At the beginning\
        \ of the series his left arm is paralyzed, but was later fixed. Notable Attacks/Techniques:\
        \ *Sei Ki: Ikki uses Sei Ki, a style which allows him to fight with a calm\
        \ and peaceful spirit instead of with rage and anger. During the fight Takeda\
        \ was able to release his Sei ki on his own and completely overwhelmed Lugh.\
        \ Despite having just learned how to use it, he was already skilled enough\
        \ to perform Ki feints, which served as the basis for his Warp Punch. Ikki\
        \ is the only person in the shinpaku alliance who has unlocked his Sei ki,\
        \ and one of the only two people in the alliance who has been shown unlocking\
        \ their Ki (the other being Miu Furinji). A Sei-type martial artist hides\
        \ his intention to fight, instead focusing on sensing his/her environment,\
        \ then releases it quickly in response to danger. According to the manga,\
        \ it actually means that this type of martial artist fights not with power\
        \ or anger, but with talent, skills, and wit. There are some Sei fighters\
        \ who move onto the Asura path. Akira Hong\u014D has mastered the art of Sei\
        \ to it's highest level. These traits are evident in Kensei, Akisame, Hayato,\
        \ and Kenichi. This principle requires a state of calmness and a clarity of\
        \ mind. Ry\u016Bto Asamiya also seems to usually be a fighter of the Sei class,\
        \ but due to an experiment conducted by his master Ogata, he tried to embody\
        \ the ki of both Sei and Dou styles at the same time, with severe consequences\
        \ to his body. **Warp Punch: A technique with the basis of fighting against\
        \ weapons. Takeda came up with this move in his second fight with Lugh. It\
        \ involves closing the distance with your opponent and releasing the Ki at\
        \ the tip of the punch to confuse an opponent that sense Ki very well and\
        \ finally coming back to deliver a powerful blow to the body. The name \"\
        Warp Punch\" seems to be temporary. *Auto Rhythm: Explanation here. *All Range\
        \ Punch: A punch that can hit from multiple angles at once. *Bolo Rabbit Punch:\
        \ **Meteor Straight *Neko Megaeru Punch: Puts his entire body strength into\
        \ his legs and jumps upward and twists his fists to amplify the strength of\
        \ his attack) *Clinch *Illusionary Left Straight *Anti-Weapons Technique:\
        \ The secret technique of James Shiba, a way of fighting made for high level\
        \ ki users who can predict ki and ki movements at a expert level. This technique\
        \ is all instinct, not using thought but just using \"feel\" which makes it\
        \ harder for even the highest level martial artist who rely on their senses\
        \ be at a disadvantage. \"The greater your opponent can sense the more it\
        \ comes back to bite\". **Dog Fight Blow: ==Notable Matchups== Victories:\
        \ Losses: Inconclusive: ==References== {{Reflist}} {{discussions}} Category:Characters\
        \ Category:Boxers Category:History's Strongest Disciple Kenichi Category:Brawlers\
