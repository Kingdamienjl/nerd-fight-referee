    - field: intelligence
      value: 'Average. Genius in martial Arts. Despite never having a Master from
        the beginning, Takeda was a gifted rookie boxer with a promising potential
        future in the pro league. His high aptitude for boxing, combined with his
        great ambition and even higher tenacity for winning made him able to at least
        hold his own against seemingly any disciple-level opponent. He has a jab that
        is compared to top-class pro''s. As he changed his ways from a delinquent,
        he trained to increase his strength and skill to a point where he has nearly
        caught up with both Kenichi and Natsu in a short amount of time. Takeda is
        a Sei-type martial artist. This means he hides his intention to fight, instead
        focusing on sensing his/her environment, then releases it quickly in response
        to danger. According to the manga, it actually means that this type of martial
        artist fights not with power or anger, but with talent, skills, and wit. There
        are some Sei fighters who move onto the Asura path. He can also be seen as
        an opposite of Kenichi, as he focuses more on speed and agility than power
        and versatility. His extensive growth after gaining a true master to train
        him was revealed during his rematch with Kenichi, where he overwhelmed the
        younger opponent before being barely defeated. His performance even earned
        praise from Akisame, despite his own disciple battling Takeda in a bet. As
        noted by Lugh, a highly perceptive fighter, Takeda will undoubtedly become
        a master-class in the future. His progress has reached a point where he can
        fight on par with a YOMI. Takeda fought Lugh, one of the strongest members
        of YOMI (but strongest in terms of KI) evenly and ultimately defeat him, something
        that even Ogata was surprised at. Using his skilled fists, his record remains
        undefeated in the underground martial arts arena. With Lugh on his back, he
        used All Range Punch to free himself. Standard Tactics: When Takeda had one
        arm he heavily utilized his jab due to his limited usage of his arms. After
        his arm is fixed he uses his speed to create openings. Takeda is a Sei-type
        martial artist. This means he hides his intention to fight, instead focusing
        on sensing his/her environment, then releases it quickly in response to danger.
        According to the manga, it actually means that this type of martial artist
        fights not with power or anger, but with talent, skills, and wit. There are
        some Sei fighters who move onto the Asura path. He can also be seen as an
        opposite of Kenichi, as he focuses more on speed and agility than power and
        versatility. His extensive growth after gaining a true master to train him
        when fighting. He was later trained by the great Shiba and made him fight
        wearing a weighted contraption on his body. He later removes it during his
        fights and this increases his speed significantly. Shown here too. He later
        uses a heavier weighted vest after further progressing in his training)'
