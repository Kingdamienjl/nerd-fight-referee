        from their feet, and an ability to fly. This ability was first accidentally
        used during the battle with the Rez Boa Dogs, and Ikki was able to use it
        at will upon his battle with Ringo. When coupled with the Wind Regalia, Bagram,
        Ikki was able to utilize the full extent of this trick, being able to ride
        on surfaces normally impossible with normal ATs. *Wheel Spin Drop: Ikki accelerates
        his AT while standing in a stationary position and uses the rip start as momentum
        to attack his opponent with a high speed dropkick to the face. *Ikki 1800
        Wall Ride: This technique is basically Ikki''s version of Buccha''s Overbank
        1800. Ikki puts his own style to the move by alternating skating backwards
        while traveling up the wall at a wider arc. *Upper Soul 23 Roll: A move combining
        the momentum from a wall jump and executing a "Soul Grind" on any vertical
        rail surface nearby, Ikki uses so much forward momentum that he literally
        corkscrews up the entire rail. He uses this move on the school flagpole during
        the challenge against Buccha. Considered a S class move by Spitfire. *Method
        Air to Spin That Grab "Moonride": A move in which the rider jumps at full
        strength and applies power to his rotational axis, shifting his center of
        gravity back allowing the rider to jump farther than normal. A side effect
        of this trick is that it rapidly increases the surrounding air pressure, causing
        wind to kick up around the area used. Ikki used this move in the battle with
        Sable Tiger leader Natsumi Iriya. He used this trick again as he raced down
        the tower. *Twin-Cam: A double team move used by Ikki and Agito. Ikki executes
        a 360 degree spin while holding Agito and then Agito executes a flying hook
        kick using the force from the spin. It was used in the fight against Udou
        Akira of the Behemoth. *Air Line: A grind along a power line that creates
        an electric discharge that reveals Rising Road''s illusions. First used against
        Nue''s team Black Crow. *Pile Tornado:- Ikki gathers the wind in his hands
        and then turns them in a circular motion making something that looks like
        a small tornado, he then kicks the air with his A-Ts sending a powerful, horizontal
        tornado. He used this move in his fight against Kazu. This is one of Ikki''s
        Infinity Atmosphere tricks. [https://vignette.wikia.nocookie.net/vsbattles/images/e/ea/3_%281%29.png/revision/latest?cb=20150225184757]Pile
        Tornado *Limited Express: Ikki uses Pile Tornado and then jumps into the tornado
        after he has created it. After this he rides the inner walls of the tornado
        giving him an extreme burst of speed. This move was used against Kazu and
