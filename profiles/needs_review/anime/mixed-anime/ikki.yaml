        that flies alongside the rider and is capable of penetrating sheet metal due
        to its speed. By the end of the story he regains the ability to use this Trick
        despite lacking the Wind Regalia. *Null Wind: Ikki''s first Hurricane Road
        technique. It utilizes the "ultimate wave" principle, involving conditions
        similar to a hurricane (a calm center surrounded by destruction). By using
        the reverberations caused by Kazu and Agito''sGrand Fang Firebird striking
        Buccha''s reflective wall, Ikki expands the "ultimate wave" to create a massive
        circular storm, the center of which has no wind blowing within it. This attack
        was created to counter Sora Takeuchi''s Wing Road. This is technique is somewhat
        of a double-edged sword as people who follow the Wing Road as well as the
        Hurricane Road, won''t be able to use their Infinity Atmosphere Tricks (i.e.
        Pile Tornado). This trick is a combination of the Wind and Rumble Roads. *Kuu
        Missile: Ikki shoots Kuu out of his head like a cannon *Moon Drop Missile:
        Ikki uses the final principle of the Wing Road to interface with the air and
