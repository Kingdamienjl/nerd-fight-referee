        \ Perception Users Category:Awakened Power Users Category:Criminals Category:Delinquents\
        \ Category:Gangsters Category:Acrobats Category:Instinctive Action Users Category:Probability\
        \ Users Category:Supernatural Luck Users Category:Supernatural Willpower Users\
        \ Category:Humans"
