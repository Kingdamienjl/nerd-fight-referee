      value: Gifted. Can easily mislead and deceive people with his way of speaking
        and body actions. He has never lost an argument against an adult until recent
        times. He has constantly hidden his inability to exorcise ghosts and somehow
        always leaves his customers satisfied, with or without Mob's help. He was
        one of the few who were able to identify Mogami's tricks and lies during the
        Exorcism Arc. He can also come up with plans on the fly, as shown when he
        rid himself of the spirit Rusty-sama by having another spirit consume it.
