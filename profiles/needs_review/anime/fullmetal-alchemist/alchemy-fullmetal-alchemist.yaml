r-39-or-even-cast-by-circular-shadowschapter-105-or-mere-gestureschapter-23-finally-alchemy-must-draw-from-a-greater-energy-for-alchemists-that-come-from-the-eastern-country-of-xing-it-is-the-dragon-pulse-a-power-that-flows-through-the-ground-while-for-those-from-amestris-the-country-in-which-most-of-the-events-of-fullmetal-alchemist-take-place-it-is-a-sea-of-souls-trapped-underneath-the-crust-of-the-earthchapter-67-abilities-inherent-to-alchemy-include-matter-manipulation-transmutation-energy-manipulation-and-elemental-manipulation-minor-air-manipulation-light-manipulation-and-vibration-manipulation-transmutation-can-cause-strong-gusts-of-wind-bright-flashes-of-lightchapter-11-and-even-shockwaves-strong-enough-to-destroy-clothing-all-as-a-side-effect-of-the-transmutation-itself-deconstruction-the-second-key-step-of-alchemy-is-to-break-down-the-matter-that-is-to-be-transmuted-and-the-process-can-be-halted-at-that-point-to-destroy-whatever-the-alchemist-wants
  name: 'The matter transmuted by alchemists will no longer exist in its original
    state, and to create structures the ground from underneath them will be made thinnerChapter
    21, but it can take on a more metaphysical meaning: Alchemists can draw upon their
    own life force to perform impossible featsChapter 77, or even their own ability
    to perform Alchemy. There are two laws that descend from this one, The Laws of
    Conservation of Mass and Natural Providence, which state, respectively, that nothing
    can be truly created or destroyed but simply transformed, and that objects can
    only be transmuted into ones with a similar atomic makeup. In other words, something
    like water can only be transmuted into things composed of hydrogen and oxygen.
    There are three main steps to AlchemyChapter 7: *Analysis: The Alchemist must
    have a deep understanding of whatever they''re attempting transmutation onChapter
    79, including its composition, as an attempted Transmutation will fail if they
    have the wrong material in mindChapter 45. A transmutation failure can even cause
    a "ReboundChapter 53", where the failed transmutation is reflected back to the
    one who attempted it, potentially to terrible results. *Deconstruction: Alchemy
    then proceeds to break down the matter on the atomic level. The process can be
    halted at this point, to destroy whatever the Alchemist wishesChapter 6, a tactic
    most commonly but not exclusivelyChapter 92 by Scar. *Reconstruction: The alchemist
    finally reconstructs the matter into whatever they wish to make. To perform Alchemy,
    most Alchemists also need to use specific circles with runes and specific shapes
    inscribed in them, Transmutation Circles. These can be simplified to the point
    of being drawn rapidly for the sake of combatChapter 8, and Alchemists who expect
    to find themselves in battle often draw them upon their equipment, as seen with
    Roy Mustang''s glovesChapter 5 and Solf J. Kimblee''s very own palmsChapter 74.
    Transmutation Circles do not need to be drawn: They can also be etched in one''s
    fleshChapter 39 or even cast by circular shadowsChapter 105 or mere gesturesChapter
    23. Finally, Alchemy must draw from a greater energy: For Alchemists that come
    from the Eastern country of Xing, it is the Dragon Pulse, a power that flows through
    the ground, while for those from Amestris, the country in which most of the events
    of Fullmetal Alchemist take place, it is a sea of souls trapped underneath the
    crust of the EarthChapter 67. Abilities inherent to alchemy include: *Matter Manipulation,
    Transmutation, Energy Manipulation and Elemental Manipulation *Minor Air Manipulation,
    Light Manipulation and Vibration Manipulation (Transmutation can cause strong
    gusts of wind, bright flashes of lightChapter 11 and even shockwaves strong enough
    to destroy clothing, all as a side effect of the Transmutation itself) *Deconstruction
    (The second key step of alchemy is to break down the matter that is to be transmuted,
    and the process can be halted at that point to destroy whatever the alchemist
    wants)'
