- id: claim-powers-and-abilities-04cd4152
  section: abilities
  axis: hax
  text: "Small Size (Type 1), Genius Intelligence, limited Alchemy (Is very knowledgeable\
    \ on Alchemy, but is unable to perform it himself due to his lack of hands), Intangibility\
    \ (Appears to be gaseous in nature), Body Control (Can make his eye and mouth\
    \ appear or disappearChapter 74), Social Influencing and Preparation (Talked the\
    \ King of Xerxes into building a country-wide Transmutation circle in hopes of\
    \ achieving immortalityChapter 75, while keeping him, Van Hohenheim and everyone\
    \ else oblivious to his real plans of taking that power for himself and Hohenheim),\
    \ Limited Flight (Appears to be floating inside his small flask) Father \u25BE\
    = Superhuman Physical Characteristics, Alchemy (Father effectively has access\
    \ to a much more powerful Philosopher's Stone through his own body, while also\
    \ having the physiology of a Homunculus), Regeneration (Low-High. Can regenerate\
    \ from his Philosopher's Stone just like the Homunculi, but like Van Hohenheim,\
    \ his Philosopher's Stone exists as a liquidChapter 52), Enhanced Senses (Could\
    \ tell that his chimeras had been roused from deeper within his lairReference\
    \ text), Healing (Instantly healed Edward's broken bonesChapter 54), Limited Power\
    \ Nullification (Can negate alchemy), Body Control (Can open eyes on his body\
    \ to produce Philosopher's Stones), Density Manipulation (Liquefied the ground\
    \ under himChapter 96), Empathic Manipulation (Removed his own emotions and sinful\
    \ thoughts), Absorption (Drained part of Hohenheim's Philosopher Stone), Transformation\
    \ (Can transform into his \"evolved\" form at any time by leaving his human-like\
    \ body behindChapter 97), Resistance to Deconstruction (Shrugged off Scar's attempt\
    \ at deconstructing himChapter 55) \"Evolved\"= All of his Base abilities, Vibration\
    \ Manipulation (Blasted May Chang at point blank with a shockwaveChapter 103),\
    \ Body Control and limited Intangibility (Father can control his gelatinous body\
    \ as he pleasesChapter 104, twisting it to avoid attacks and restrain enemies,\
    \ and normal attacks just sink through him without inflicting damage) Soul Manipulation\
    \ (Liquefied Greed back into a philosopher's stoneChapter 31), Possession (Father\
    \ can use Philosopher Stones to make the spirits of his homunculi take over human\
    \ bodiesChapter 53), Soul Manipulation and Absorption (Back in the times of Xerxes,\
    \ Father's great plan led to all of the souls in that country being absorbed by\
    \ him and Von Hohenheim, a plan which he managed to temporarily recreate to Amestris\
    \ in modern times), Organic Manipulation (That country-wide transmutation made\
    \ a giant eye temporarily appear over Xerxes), Empowerment (By absorbing the human\
    \ souls in Amestris and then the Earth's Gate of Truth, Father turned himself\
    \ into a god-like being) All of the Depowered key's powers, Radiation Manipulation\
    \ (Created a sun through nuclear fusionChapter 105), Large Size and Size Manipulation\
    \ (Type 4. Became as big as the country of Amestris) All pre-Gates abilities,\
    \ Energy Projection (Shot some form of energy at Hohenheim), Weather Manipulation\
    \ (Can create tornadoes and storms), Minor Acrobatics (Can do front flipsChapter\
    \ 106), Soul Manipulation (Can absorb souls with a gesture), Forcefield Creation\
    \ (Is protected by forcefields), Life Manipulation (Can give life to the souls\
    \ inside him), Attack Reflection and Telekinesis (Can stop attacks and turn them\
    \ against their wieldersChapter 107), Vibration Manipulation (Can cause huge shockwaves)"
  source_ids: *id003
