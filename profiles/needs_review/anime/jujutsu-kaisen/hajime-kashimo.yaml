      value: "Hollow Wicker Basket can't nullify cursed techniques directly, making\
        \ it ineffective against incomplete or non-lethal domains. In water, Kashimo's\
        \ cursed energy loses its electrical property. Also, when using his innate\
        \ technique, Mythical Beast Amber, Kashimo's body disintegrates after its\
        \ completion. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
        1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
        2\" style=\"text-align: left; |Notable Attacks/Techniques: |- | *{{Nihongo|Binding\
        \ Vow|{{Ruby|\u7E1B|\u3057\u3070}}\u308A|Shibari}}: Binding Vows are contracts\
        \ created through cursed energy that an individual can make with one's self\
        \ or another person. The act of abiding by the rules and restrictions agreed\
        \ upon in these contracts can result in a greater power or the achievement\
        \ of a goal, but breaking a binding vow has uncanny repercussions. Hajime\
        \ made a pact with Kenjaku that he would participate in the Culling Game if\
        \ he had a chance to fight Sukuna. *{{Nihongo|Esoteric Technique: Hollow Wicker\
        \ Basket|{{Ruby|\u5965|\u304A\u3046}}{{Ruby|\u7FA9|\u304E}}\u300C{{Ruby|\u5F4C\
        |\u3044\u3084}}{{Ruby|\u865A|\u3053}}{{Ruby|\u845B\u7C60|\u3064\u3065\u3089\
        }}\u300D|\u014Cgi\u30FBIyako Tsuzura}}: An anti-domain technique and predecessor\
        \ to Simple Domain. It neutralizes a domain's barrier imbued with a cursed\
        \ technique to nullify its guaranteed hit. *Electrified Cursed Energy: Hajime's\
        \ cursed energy has the properties of an electric current, putting his body\
        \ in a constant state of electrification. This makes his cursed energy-reinforced\
        \ physical attacks impossible to defend against, as his hits shock the opponent\
        \ upon impact. *Lightning Discharge: Manipulating the characteristics of his\
        \ cursed energy allows Hajime to freely separate its electric charges. By\
        \ applying the positive charge to his target immediately, Hajime can discharge\
        \ the negative charge without losing any electricity to the ground. This results\
        \ in a powerful lightning strike that rends the air and is guaranteed to hit\
        \ without the need for domain expansion. After discharging this attack, Kashimo\
        \ needs time to recharge before he can fire it again. *{{Nihongo|Mythical\
