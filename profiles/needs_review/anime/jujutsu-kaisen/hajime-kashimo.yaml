    - field: intelligence
      value: Gifted in Combat (Hajime's exceptional intelligence becomes evident in
        combat, where he swiftly comprehends the intricacies of his opponents' abilities.
        Whether deciphering internal damage from a single strike or strategically
        outmaneuvering adversaries like Panda, Hajime demonstrates a keen ability
        to analyze and exploit weaknesses. Against Hakari. Rather than opting for
        a straightforward victory, he learns about Hakari's abilities and plans to
        outlast the bonus round. Despite having a definitive plan to win, Hajime challenges
        himself by attempting clever tactics during Hakari's unkillable mode. Using
        advanced jujutsu knowledge, he aims for Hakari's head and employs deceptive
        techniques like pre-accumulating electrical charge. When faced with Hakari's
        luck, Hajime adapts, trying poison and orchestrating an underwater steam explosion,
        showcasing his resourcefulness and tactical brilliance)
      source_id: mediawiki-4850278
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Hollow Wicker Basket can't nullify cursed techniques directly, making\
        \ it ineffective against incomplete or non-lethal domains. In water, Kashimo's\
        \ cursed energy loses its electrical property. Also, when using his innate\
        \ technique, Mythical Beast Amber, Kashimo's body disintegrates after its\
        \ completion. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
        1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
        2\" style=\"text-align: left; |Notable Attacks/Techniques: |- | *{{Nihongo|Binding\
        \ Vow|{{Ruby|\u7E1B|\u3057\u3070}}\u308A|Shibari}}: Binding Vows are contracts\
        \ created through cursed energy that an individual can make with one's self\
        \ or another person. The act of abiding by the rules and restrictions agreed\
        \ upon in these contracts can result in a greater power or the achievement\
        \ of a goal, but breaking a binding vow has uncanny repercussions. Hajime\
        \ made a pact with Kenjaku that he would participate in the Culling Game if\
        \ he had a chance to fight Sukuna. *{{Nihongo|Esoteric Technique: Hollow Wicker\
        \ Basket|{{Ruby|\u5965|\u304A\u3046}}{{Ruby|\u7FA9|\u304E}}\u300C{{Ruby|\u5F4C\
        |\u3044\u3084}}{{Ruby|\u865A|\u3053}}{{Ruby|\u845B\u7C60|\u3064\u3065\u3089\
        }}\u300D|\u014Cgi\u30FBIyako Tsuzura}}: An anti-domain technique and predecessor\
        \ to Simple Domain. It neutralizes a domain's barrier imbued with a cursed\
        \ technique to nullify its guaranteed hit. *Electrified Cursed Energy: Hajime's\
        \ cursed energy has the properties of an electric current, putting his body\
        \ in a constant state of electrification. This makes his cursed energy-reinforced\
        \ physical attacks impossible to defend against, as his hits shock the opponent\
        \ upon impact. *Lightning Discharge: Manipulating the characteristics of his\
        \ cursed energy allows Hajime to freely separate its electric charges. By\
        \ applying the positive charge to his target immediately, Hajime can discharge\
        \ the negative charge without losing any electricity to the ground. This results\
        \ in a powerful lightning strike that rends the air and is guaranteed to hit\
        \ without the need for domain expansion. After discharging this attack, Kashimo\
        \ needs time to recharge before he can fire it again. *{{Nihongo|Mythical\
        \ Beast Amber|{{Ruby|\u5E7B|\u3052\u3093}}{{Ruby|\u7363|\u3058\u3085\u3046\
        }}{{Ruby|\u7425|\u3053}}{{Ruby|\u73C0|\u306F\u304F}}|Genj\u016B Kohaku}}:\
        \ Hajime's innate technique reconstructs flesh in order to manifest phenomena\
        \ that he converts from cursed energy. Kashimo's body far surpasses the human\
        \ realm when using his technique, so it can only be used once before his flesh\
        \ collapses. **Agility: The enhanced agility derived from increased brain\
        \ signal activity granted him swift and precise movements, allowing him to\
        \ evade attacks and position himself effectively. **Sound Waves: The emission\
        \ of sound waves optimized to match natural frequencies of materials served\
        \ as a potent offensive tool, causing damage to his opponent by exploiting\
        \ vulnerabilities in their structure. **Electro Magnetic Waves: The generation\
        \ of electromagnetic waves capable of vaporizing irradiated objects. **X-Ray\
        \ Vision: Hajime's third eye, with X-ray vision, gave him a clear view of\
        \ Sukuna's strengths and weaknesses. It also offered a glimpse into Sukuna's\
        \ past achievements. |} Note: \"Healing\" and \"Transformation\" abilities\
        \ are not applicable in combat for anyone except Sukuna and Angel, as they\
        \ have already utilized these powers once. This capability can only be employed\
        \ once on the vessel. ==Notable Matchups== Victories: *Ryu Ishigori (Jujutsu\
        \ Kaisen) Ryu's Profile (Mythic Beast Amber was restricted, speed was equalized)\
        \ *Kurourushi (Jujutsu Kaisen) Kurourushi's Profile (Speed was equalized)\
        \ *Takako Uro (Jujutsu Kaisen) Uro's Profile (Both were in-character and fought\
        \ each other where Uro fought Yuta) *Suguru Geto (Jujutsu Kaisen) Geto's Profile\
        \ (SBA was used; \"Adult\" Geto were used; Both in-character; Distance is\
        \ 30m; Batlle took in random city from Japan.) *Yuta Okkotsu (Jujutsu Kaisen)\
        \ Yuta's Profile (Shinjuku Showdown Key was used. Kashimo started in MBA and\
        \ Yuta started with Rika) Losses: * Yuta Okkotsu (Jujutsu Kaisen) Yuta's Profile\
        \ (Culling Games Key was used) * Zenitsu Agatsuma (Demon Slayer: Kimetsu no\
