- id: claim-weaknesses-eced6d7d
  section: weaknesses
  axis: weakness
  text: "Like all sorcerers, his control of curse energy comes from his gutJujutsu\
    \ Kaisen: Chapter 37 thus targeting his gut or brainJujutsu Kaisen: Chapter 188\
    \ can stop him from using cursed energy and reverse cursed technique. One can\
    \ target the neck to stop applicationJujutsu Kaisen: Chapter 239 of reversed cursed\
    \ technique from the neck down also. After Domain Expansion one's cursed technique\
    \ is burntJujutsu Kaisen: Chapter 130 and requires a short duration to come back.\
    \ Using domain amplification and one's cursed technique can't be used at the same\
    \ timeJujutsu Kaisen: Chapter 85. {| class=\"mw-collapsible mw-collapsed\" align=\"\
    center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques: |- |\
    \ Kenjaku uses his technique against Itadori.webp|Kenjaku using a curse Kenjaku\
    \ using Gravity to negates.webp|Antigravity System Womb Profusion.webp|Domain\
    \ Expansion: Womb Profusion Kenjaku using Reverse Cursed Technique .webp|Kenjaku\
    \ using Reverse Cursed Technique *{{Nihongo|Cursed Spirit Manipulation|{{Ruby|\u546A\
    \u970A\u64CD|\u3058\u3085\u308C\u3044\u305D\u3046}}{{Ruby|\u8853|\u3058\u3085\u3064\
    }}|Jurei S\u014Djutsu}}: A technique where the user can summon and control naturally\
    \ formed cursed spirits for a desired purpose. Due to gaining Geto's body, Kenjaku\
    \ can utilize this technique as if it is his own innate technique. Thanks to this\
    \ technique, Kenjaku was shown to have acquired numerous Cursed Spirit's as his\
    \ personal familiars. He has deployed them to fight off multiple opponents and\
    \ bombard them with a variety of different Cursed Technique that each spirit possesses.\
    \ **{{Nihongo|Maximum: Uzumaki|{{Ruby|\u6975|\u3054\u304F}}{{Ruby|\u30CE|\u306E\
    }}{{Ruby|\u756A|\u3070\u3093}}\u300C\u3046\u305A\u307E\u304D\u300D|Gokunoban\u30FB\
    Uzumaki}}: The maximum technique of Curse Spirit Manipulation combines a massive\
    \ number of collected curses into one powerful attack. Nevertheless, Uzumaki can\
    \ extract their innate cursed technique when used on cursed spirits of semi-grade\
    \ 1 ranking or higher, allowing the user to keep the techniques for one-time uses.\
    \ *{{Nihongo|Anti-Gravity System|{{Ruby|\u53CD\u91CD\u529B\u6A5F\u69CB|\u30A2\u30F3\
    \u30C1\u30B0\u30E9\u30D3\u30C6\u30A3\u30B7\u30B9\u30C6\u30E0}}|Anchigurabiti Shisutemu}}:\
    \ A cursed technique that negates gravity when used. Kenjaku primarily uses a\
    \ cursed technique reversal of this ability, allowing him to intensify the gravitational\
    \ pull around him. This technique originally belonged to Kaori Itadori. The exact\
    \ function of activating Antigravity System through lapse is still fully unexplored.\
    \ As the name implies, the technique has the ability to counteract gravitational\
    \ forces, such as the immense gravity of a black hole, to some degree. Activating\
    \ Antigravity System using reversal greatly intensifies the gravity two to three\
    \ meters around the caster for approximately six seconds. *{{Nihongo|Domain Expansion:\
    \ Womb Profusion|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF\u5C55\u958B|\u3044\
    \u304D\u3066\u3093\u304B\u3044}}\u300C{{Ruby|\u80CE\u8535\u904D|\u305F\u3044\u305E\
    \u3046\u3078\u3093}}{{Ruby|\u91CE|\u3084}}\u300D|Ry\u014Diki Tenkai\u30FBTaiz\u014D\
    \ Hen'ya}}: Kenjaku's Domain Expansion takes the form of a giant pillar made up\
    \ of cursed spirits. It is an open barrier type domain, similar to Malevolent\
    \ Shrine. The effect of this domain is unclear. Capitalizing on Yuki Tsukumo's\
    \ hesitance to open her domain, Kenjaku was the first to use domain expansion\
    \ in their fight. Kenjaku expanded his domain without closing the barrier imbued\
    \ with his cursed technique. *{{Nihongo|Reversed Cursed Technique|{{Ruby|\u53CD\
    \u8EE2|\u306F\u3093\u3066\u3093}}{{Ruby|\u8853|\u3058\u3085\u3064}}{{Ruby|\u5F0F\
    |\u3057\u304D}}|Hanten Jutsushiki}}: Is a special type of cursed technique that\
    \ takes cursed energy and reverses it into positive energy. It is a very complex\
    \ technique and is mainly used to heal human bodies. Kenjaku uses the Reverse\
    \ Cursed Technique to heal Suguru Geto's body after transplanted his brain into\
    \ the body. He is also able to use reverse cursed energy to fuel a Cursed Technique\
    \ Reversal. |} ==Notable Matchups== Victories: Losses: *Yuta Okkotsu (Jujutsu\
