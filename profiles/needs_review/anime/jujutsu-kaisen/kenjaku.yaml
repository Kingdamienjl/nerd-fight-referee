        \ can extract their innate cursed technique when used on cursed spirits of\
        \ semi-grade 1 ranking or higher, allowing the user to keep the techniques\
        \ for one-time uses. *{{Nihongo|Anti-Gravity System|{{Ruby|\u53CD\u91CD\u529B\
        \u6A5F\u69CB|\u30A2\u30F3\u30C1\u30B0\u30E9\u30D3\u30C6\u30A3\u30B7\u30B9\u30C6\
        \u30E0}}|Anchigurabiti Shisutemu}}: A cursed technique that negates gravity\
        \ when used. Kenjaku primarily uses a cursed technique reversal of this ability,\
        \ allowing him to intensify the gravitational pull around him. This technique\
        \ originally belonged to Kaori Itadori. The exact function of activating Antigravity\
        \ System through lapse is still fully unexplored. As the name implies, the\
        \ technique has the ability to counteract gravitational forces, such as the\
        \ immense gravity of a black hole, to some degree. Activating Antigravity\
        \ System using reversal greatly intensifies the gravity two to three meters\
        \ around the caster for approximately six seconds. *{{Nihongo|Domain Expansion:\
        \ Womb Profusion|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF\u5C55\u958B\
        |\u3044\u304D\u3066\u3093\u304B\u3044}}\u300C{{Ruby|\u80CE\u8535\u904D|\u305F\
        \u3044\u305E\u3046\u3078\u3093}}{{Ruby|\u91CE|\u3084}}\u300D|Ry\u014Diki Tenkai\u30FB\
        Taiz\u014D Hen'ya}}: Kenjaku's Domain Expansion takes the form of a giant\
        \ pillar made up of cursed spirits. It is an open barrier type domain, similar\
        \ to Malevolent Shrine. The effect of this domain is unclear. Capitalizing\
        \ on Yuki Tsukumo's hesitance to open her domain, Kenjaku was the first to\
        \ use domain expansion in their fight. Kenjaku expanded his domain without\
        \ closing the barrier imbued with his cursed technique. *{{Nihongo|Reversed\
        \ Cursed Technique|{{Ruby|\u53CD\u8EE2|\u306F\u3093\u3066\u3093}}{{Ruby|\u8853\
        |\u3058\u3085\u3064}}{{Ruby|\u5F0F|\u3057\u304D}}|Hanten Jutsushiki}}: Is\
