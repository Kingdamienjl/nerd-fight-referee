        out her cursed technique doesn''t increase her durabilityJujutsu Kaisen: Chapter
        207, and countering Choso''s surprise attack by applying boxing tactics to
        deflect the attack.) |-| Sorcery Knowledge=Extraordinary Genius (His knowledge
        is far beyond any sorcerer, even having known soul splitting before Ryomen
        Sukuna, with him copyingJujutsu Kaisen: Chapter 228 it from Kenjaku. He''s
        one of the most capable sorcerers in terms of barrier techniques being the
        second strongest at itJujutsu Kaisen: Chapter 145, with even sorcerers like
        Sukuna who can do barrier-less Domains, Kenjaku can as well. Barrier-less
        Domains are regarded as a divine techniqueJujutsu Kaisen: Chapter 119 and
        supporting the superiority one needs to do them. Kenjaku''s also an exceptional
        planner as he planned and succeeded in the sealing of Gojo, the strongest
        modern sorcerer during the Shibuya Incident. He also has good reversed cursed
        technique, a usage of cursed energy to create positive energy, something which
        required understanding the core of energyJujutsu Kaisen: Chapter 74 to accomplish.)'
