- id: claim-weaknesses-2d64ad90
  section: weaknesses
  axis: weakness
  text: "His physical body is frail and sensitive. His Ultimate Mechamaru Mode: Absolute\
    \ eats away a lot of energy so he cant use it for very long. Notable Attacks and\
    \ Techniques: * Sword Option (S\u014Ddo Opushon): An offensive mode that shift's\
    \ Mechamaru's forearms into different forms with spikes and blades protruding\
    \ from it. * Ultra Spin ( Urutora Supin): Mechamaru's forearm rotates rapidly\
    \ while Sword Option is active to create a drill effect. With Boost On, Ultra\
    \ Spin is capable of easily destroying a full grown tree * Ultra Shield ( Urutora\
    \ Sh\u012Brudo): A defensive mode that creates several spikes to shield Mechamaru's\
    \ forearm. * Boost On ( B\u016Bsuto On): Elbow-mounted jet boosters that grant\
    \ Mechamaru a quick burst of speed. * Ultra Cannon ( Urutora Kyanon): Mechamaru's\
    \ signature attack. A concentrated beam of cursed energy fired from its palm.\
    \ * Mode: Albatross ( M\u014Ddo Arubatorosu): Switches Mechamaru to an offensive\
    \ mode that reveals a gun barrel hidden within it's mouth. While in Mode: Albatross,\
    \ Mechamaru can unleash high reserves of cursed energy, enough to fuel its Ultimate\
    \ Cannon. * Ultimate Cannon: A technique that uses Mechamarus own life span to\
    \ increase the power of his attacks * Ultimate Cannon ( Arutimetto Kyanon): Mechamaru's\
    \ finishing move. A high output massive beam of cursed energy fired from the Mode:\
    \ Albatross cannon barrel. * : It begins after Mechimaru assumes the proper stance,\
    \ creating a circle with a 2.21 meter radius around Kokichi. Anything that enters\
    \ this space can instantly be intercepted by Kokichi's attack. If both of his\
    \ feet leave the position where his stance began, the technique is dispelled."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
