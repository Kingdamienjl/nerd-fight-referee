    - field: standard_equipment
      value: '*: Geto Absorbed Toji''s Inventory cursed spirit that can store many
        different objects within its body. The following tools are stored within it:
        ** **: A chain that is capable of extending indefinitely provided one of its
        ends cannot be seen. **: A swarm of weak insect-like cursed spirits that can
        be released en masse to create a sort of smokescreen effect. **: A Special
        Grade Cursed tool, this three-section staff connected by chains is the only
        known Special Grade Cursed tool not imbued with a Cursed Technique. Instead,
        it possesses a large amount of raw and distilled power, relying on the strength
        and skill of its user for devastating blows. **Conventional weaponry, including
        a katana, combat knife and handgun.'
      source_id: vsbattles-suguru-geto-jujutsu-kaisen
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (He is a sorcerer with lots of battle experience fighting various
        kinds of curses with various abilities, easily understood a curse user was
        trying to bait him into close combat within seconds and used that to surprise
        him when he got close. In his fight with Toji Fushiguro, Suguru managed to
        surprise the Sorcerer Killer for just a moment. He moved behind Toji knowing
        his over-confidence would keep his guard down and nearly absorbed the inventory
        curse as a means to get rid of Toji's weapons supply. However, this ultimately
        backfired due to circumstances Suguru could not have for seen. Soon after
        becoming a curse user, Suguru was able to take over the remnants of the Time
        Vessel Association and similar religious groups. Doing so created a legitimate
        base of operations for cursed humans to come to seek exorcisms, allowing Suguru
        to absorb their curses or exploit them for money. Suguru was able to collect
        thousands of curses over that time using this method. Accurately able to calculate
        in seconds his chances of victory in percentages and see all available options
        to win and lose when he was considering taking Rika from Yuta)
      source_id: vsbattles-suguru-geto-jujutsu-kaisen
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Cannot take control of a cursed spirit that already has a master. The
        extracted techniques of cursed spirits can only be used once. {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; |Notable Attacks/Techniques: |- | *:
        A type of barrier that is cast over a large area to hide everything within
        it from the outside world. Suguru can cast curtains capable of trapping sorcerers
        inside of it and can do so over another weaker sorcerer''s barrier as well.
        : Suguru''s technique enables him to control vagabond cursed spirits, absorbing
        them into small black orbs that he must ingest orally to utilize. If the grade
        difference is no more than two levels, he can absorb curses without consequences.
        Additionally, he can absorb other sorcerers'' curses by killing the master
        first. center|thumb|475x475px *Hookworm Curse: Suguru employs a formidable
        curse resembling a giant man-eating hookworm with sharp teeth and a large
        innard capable of capturing or swallowing other curses. He strategically uses
        it indoors, filling hallways to keep distance in fights. Suguru can summon
        it suddenly for surprise attacks or to create blind spots, exploiting false
        opportunities to outmaneuver opponents. *Unknown Cursed Spirit: He absorbed
        a cursed spirit that can trap its targets within its barriers. Time flows
        differently inside the barriers than outside: 30 minutes inside is equivalent
        to 2 days outside. The cursed spirit creates a looping environment inside
        the barriers to keep the target sealed off. *Sting-Ray Curse: A flying curse
        with an appearance similar to an aquatic sting-ray. It is capable of levitating
        and has enough size to support Suguru and one other person. *Kiss Curse: A
        tall curse with a fungus base and several heads atop it capable of capturing
        Suguru''s targets. Upon doing so the largest head on the curse will attempt
        to kiss whoever is captive. *Docile Curse: A docile curse with two eyes, eight
        legs and horns big enough to support and carry a full grown human. *Surveillance
        Curse: Surveillance curses with multiple eyes each that can be used to observe
        a large area. However, Suguru cannot share their vision like Mei Mei can with
        her birds. He must check in every so often to learn of their status. *Decoy
        Curses: Two small single-eyed curses that act as decoys for Suguru while standing
        off with opponents. *One-Eyed Giant Curse: A giant single-eyed curse with
        a humanoid body who wears black pants and a necklace consisting of human heads.
        It was summoned by Suguru to launch Toji Fushiguro into the air during their
        battle, and was later used by Suguru to threaten the lives of the first-year
        students, allowing him to safely leave Tokyo Jujutsu High after declaring
        war. *: It is a large Eastern dragon-like cursed spirit with the toughest
        skin among all Suguru''s curses. It is a powerful curse capable of attacking
        with great and brute force to crush Suguru''s target. *: It is an Imaginary
        Vengeful Spirit from the popular yokai legend. It is capable of trapping Suguru''s
        targets within a Innate Domain with a Binding Vow that can''t be dispelled
        until the target answers the question. If the answer isn''t to her liking,
        the spirit can instantly create scissors from thin air as soon as the domain
        disappears. They appear close to the target''s limbs, ready to snip them off
        at any moment. *Daruma Doll Curse: A large blue daruma doll cursed spirit
        that was summoned by Suguru to crush Shigeru Sonoda to death in order to threaten
        the Time Vessel Association into cooperation. *Unknown Curse Spirit 1: A cursed
        spirit equivalent in strength to a semi-grade 1 curse that first appeared
        and fought Toge Inumaki and Yuta Okkotsu at the Hapina Shopping Center. It
        can fire destructive pillars of light down on a target by pointing its index
        and middle finger on either hand upwards. *Unknown Curse Spirit 2: A group
        of grade 3 or lower cursed spirits that work together to suck a person''s
        flesh apart. Suguru used them to dispose of Kanemori after the latter stopped
        donating money to his organization. * A huge white pelican-like curse with
        four feathery wings. It is used by Suguru to transport himself and other people
        through the air, either by riding it or having it hold them in its mouth.
        *: Multiple red centipede-like cursed spirits that Suguru summoned to battle
        Maki Zenin. He summoned countless of these cursed spirits later during his
        battle with Yuta Okkotsu, *: It can store many different objects within its
        body despite its size. *: It is a special grade imaginary vengeful cursed
        spirit summoned by Suguru during his showdown against Yuta as he prepared
        to unleash Maximum: Uzumaki on the young sorcerer. Its capabilities are unknown.
        *: The maximum technique of Cursed Spirit Manipulation combines a massive
        number of collected curses into one powerful attack. Suguru used over four
        thousand curses in his maximum technique during the climax of his battle with'
      source_id: vsbattles-suguru-geto-jujutsu-kaisen
