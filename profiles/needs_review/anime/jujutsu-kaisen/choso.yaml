        \ osmotic pressure will cause him to lose control of it. Hardening the blood\
        \ inside his body develops the risk of sudden thrombosis. {| class=\"wikitable\
        \ mw-collapsible mw-collapsed\" !Notable Attacks and Techniques: |- | *{{Nihongo|Blood\
