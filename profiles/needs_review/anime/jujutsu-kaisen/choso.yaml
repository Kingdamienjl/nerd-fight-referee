- id: claim-powers-and-abilities-2d7452f0
  section: abilities
  axis: hax
  text: 'Shibuya Incident Arc & Itadori''s Extermination Arc= *Cursed Energy Manipulation
    (Both Cursed SpiritJujutsu Kaisen, Chapter 142 and Advanced Sorcerer AbilitiesJujutsu
    Kaisen, Chapter 203) *Expert Hand to Hand Combatant (Is able to box with YujiJujutsu
    Kaisen, Chapter 105) *Blood Manipulation & Statistics Amplification (Can control
    the blood flowing through his body beyond its form or motion, his abilities with
    the blood is changing of body temperature, pulse rate, the number of blood cells
    and blood compositionJujutsu Kaisen, Chapter 43) **Limited Temperature Manipulation
    (Flowing Red Scale allows user to change the temperature of their bodyJujutsu
