- id: claim-weaknesses-a4eecc50
  section: weaknesses
  axis: weakness
  text: "His blood outside of his body being controlled by Blood Manipulation dissolves\
    \ in water more easily due to the halting of coagulation and the osmotic pressure\
    \ will cause him to lose control of it. Hardening the blood inside his body develops\
    \ the risk of sudden thrombosis. {| class=\"wikitable mw-collapsible mw-collapsed\"\
    \ !Notable Attacks and Techniques: |- | *{{Nihongo|Blood Manipulation|{{Ruby|\u8D6B\
    |\u305B\u3063}}{{Ruby|\u8840|\u3051\u3064}}{{Ruby|\u64CD|\u305D\u3046}}{{Ruby|\u8853\
    |\u3058\u3085\u3064}}|Sekketsu S\u014Djutsu}}: The Kamo ancestor controlled by\
    \ Kenjaku mixed his blood with the human and cursed spirit that resulted in the\
    \ Death Painting Wombs. This allowed Choso to inherit Blood Manipulation and train\
    \ it to its fullest extent. Choso is a master constantly using this technique\
    \ to manipulate his own blood and utilizes it in nearly every facet of his combat\
    \ arsenal. **{{Nihongo|Convergence|{{Ruby|\u767E|\u3073\u3083\u304F}}{{Ruby|\u6582\
    |\u308C\u3093}}|Byakuren}}: A technique that compresses and condenses blood to\
    \ its very limit. ***{{Nihongo|Piercing Blood|{{Ruby|\u7A7F|\u305B\u3093}}{{Ruby|\u8840\
    |\u3051\u3064}}|Senketsu}}: The blood condensed by Convergence is shot through\
    \ a single point, and said blood is now reinforced by Cursed Energy to such an\
    \ extent that the speed of this technique exceeds the speed of sound. **{{Nihongo|Supernova|{{Ruby|\u8D85\
    |\u3061\u3087\u3046}}{{Ruby|\u65B0|\u3057\u3093}}{{Ruby|\u661F|\u305B\u3044}}|Ch\u014D\
    shinsei}}: The compressed and condensed blood by Convergence is released and shot\
    \ out in every single direction like a buckshot. **{{Nihongo|Flowing Red Scale|{{Ruby|\u8D6B\
    |\u305B\u304D}}{{Ruby|\u71D0|\u308A\u3093}}{{Ruby|\u8E8D|\u3084\u304F}}{{Ruby|\u52D5\
    |\u3069\u3046}}|Sekirin Yakud\u014D}} By manipulating the blood in his body, including\
    \ the temperature, pulse rate, the number of red blood cells, and its composition,\
    \ he can increase his body's speed and power. ***{{Nihongo|Flowing Red Scale:\
    \ Stack|{{Ruby|\u8D6B|\u305B\u304D}}{{Ruby|\u71D0|\u308A\u3093}}{{Ruby|\u8E8D\
    |\u3084\u304F}}{{Ruby|\u52D5|\u3069\u3046}}\u30FB{{Ruby|\u8F09|\u3055\u3044}}|Sekirin\
    \ Yakud\u014D - Sai}}: Stacks Flowing Red Scale which greatly increases power\
    \ and speed even more. *{{Nihongo|Blood Meteorite|{{Ruby|\u8840|\u3051\u3063}}{{Ruby|\u661F\
    |\u305B\u3044}}{{Ruby|\u78CA|\u305B\u304D}}|Kesseiseki}}: The compressed and condensed\
    \ blood is hardened and then shot at a target. *{{Nihongo|Blood Edge|{{Ruby|\u8840\
    |\u3051\u3064}}{{Ruby|\u5203|\u3058\u3093}}|Ketsujin}}: Is a process that involves\
    \ shaping and then strengthening the blood's lethality by rotating it at high\
    \ speeds. *{{Nihongo|Slicing Exorcism|{{Ruby|\u82C5|\u304B\u308A}}{{Ruby|\u7953\
    |\u3070\u3089\u3044}}|Karibarai}}: Choso releases a stream of blood capable of\
    \ easily slicing through humans. *{{Nihongo|Maximum: Wing King|{{Ruby|\u6975|\u3054\
    \u304F}}{{Ruby|\u30CE|\u306E}}{{Ruby|\u756A|\u3070\u3093}}\u300C{{Ruby|\u7FC5\
    |\u3057}}{{Ruby|\u738B|\u304A\u3046}}\u300D|Gokunoban\u30FBShi\u014D}}: A technique\
    \ that imitates Eso's Maximum: Wing King by creating a halo of blood that sprouts\
    \ four wasp-like wings albeit smaller than original technique. These wings are\
    \ medium to create vector lines of blood which can be used offensively. Choso\
    \ utilized this technique as a distraction to surround his target with compressed\
    \ blood spheres in preparation of a stronger attack. |} ==Notable Matchups== Victories:\
