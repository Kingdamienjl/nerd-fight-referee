        \ The Kamo ancestor controlled by Kenjaku mixed his blood with the human and\
        \ cursed spirit that resulted in the Death Painting Wombs. This allowed Choso\
        \ to inherit Blood Manipulation and train it to its fullest extent. Choso\
        \ is a master constantly using this technique to manipulate his own blood\
        \ and utilizes it in nearly every facet of his combat arsenal. **{{Nihongo|Convergence|{{Ruby|\u767E\
        |\u3073\u3083\u304F}}{{Ruby|\u6582|\u308C\u3093}}|Byakuren}}: A technique\
