  section: weaknesses
  axis: weakness
  text: "The entity is most susceptible prior to the first turn of the wheel. Defeating\
    \ it requires a 'one-shot' strategy\u2014a maximum-output attack capable of obliterating\
    \ Mahoraga before its defense mechanism activates. Failure to achieve this instant\
    \ kill initiates the countdown to immunity. The speed of this adaptation is dictated\
    \ by the frequency of engagement: receiving the same attack repeatedly acts as\
    \ a catalyst, forcing the adaptation to complete rapidly. However, a lack of follow-up\
    \ attacks does not halt the process; it merely lengthens the duration required\
    \ for Mahoraga to fully decode and nullify the technique."
  source_ids: *id003
