    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Instinctual Savant (Mahoraga operates on a binary of feral aggression and
      calculated adaptation. In its untamed state, it attacks with the indiscriminate
      ferocity of a wild beast, lacking any discernable higher thought beyond destruction.
      Yet, this savagery masks a sophisticated analytical engine capable of decoding
      the fundamental logic of any phenomena it faces. Under the control of a sorcerer,
      this duality shifts: Mahoraga transitions from a mindless berserker to a highly
      intuitive guardian, displaying enough situational awareness to intercept threats
      and cover its user''s blind spots apparently on its own initiative)'
    source_ids: *id002
    confidence: 0.8
