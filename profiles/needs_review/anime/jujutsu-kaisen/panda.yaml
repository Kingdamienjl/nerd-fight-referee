    - field: intelligence
      value: 'Average. Standard Tactics: Panda''s standard tactics in Jujutsu Kaisen
        involve leveraging his immense physical strength and durability as an Abrupt-Mutated
        Cursed Corpse. His core strategy relies on intelligent, close-quarters combat
        and surprising opponents with his ability to switch between his unique cores
        to change his form and abilities.'
      source_id: vsbattles-panda-jujutsu-kaisen
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Panda''s main weakness is his slow speed, which makes him easy to zone
        out and struggle against faster opponents, and he can be defeated by destroying
        his three cores. Notable Attacks/Techniques: *Gorilla Mode: By switching to
        his "brother''s" core, Panda can transform into a muscular gorilla that retains
        his normal color scheme. Panda is much stronger and faster in this form but
        at the cost of rapidly draining his cursed energy. **While in Gorilla Mode,
        any strike Panda lands will resonate through the targets body using the "Unblockable
        Drumming Beat". The impact of the hit sends a shockwave through the user''s
        guard, so they feel the damage even if they defend. *Triceratops Mode: By
        switching to his "sister''s" core, Panda can transform into a bipedal Triceratops
        form. The appearance of Panda''s body becomes more slender and feminine while
        his head takes on a wide Triceratops shape. Panda claims his sister''s form
        destroys everyone who looks at her because of her shyness, but this form''s
        abilities have not been displayed and its capabilities are unknown. == Notable
        Matchups == Victories: Losses: Inconclusive: == Notes/Explanations == {{Discussions}}
