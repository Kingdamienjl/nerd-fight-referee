    - field: speed
      value: '* Low Tiers: Pretty much most of the cast are rated with Subsonic to
        some being rated as Subsonic+ speed due to various bullet dodging feats. They
        are however below the benchmark of Mach 0.80 as it is the speed of an attack,
        namely "Piercing Blood", that most of these characters are not capable of
        reacting fully. * Mid Tiers: A few characters reach those sonic to supersonic
        speeds. The most notable one being Human Naoya Zenin who has a top speed of
        Mach 1 or Transonic. A few characters are capable of reacting and firing attacks
        at Supersonic speeds, namely the "Piercing Blood" attack from Choso which
        consistantly exceeds the speed of sound. The absolute peak of this category
        is Supersonic+ with Curse Noya''s top speed of Mach 3. There are however two
        outsiders within that category, being [[Satoru Gojo (Canon)/KaaydoManic|[Teenager]
