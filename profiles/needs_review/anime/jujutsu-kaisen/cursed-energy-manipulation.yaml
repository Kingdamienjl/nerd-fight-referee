    field_candidates:
    - field: weaknesses
      value: There are only a few weaknesses regarding Domain Expansions. A Domain
        Expansion can typically be stopped if the individual is able to break into
        or out of the domain, allowing for escape. A domain's Barrier is weaker on
        the outside than the inside as they are designed to trap opponents inside
        (although the conditions of a Domain Expansion can be altered to reverse this
        effect). A Domain can also be neutralized by another more refined Domain Expansion.
        A Domain Expansion's sure-hit effect can be canceled by a Simple Domain (a
        Barrier Technique that is designed for neutralizing a Cursed Technique in
        a set area of space) or Domain Amplification (an Anti-Domain Technique that
        cloaks the user in a thin aura of their own Domain). Barrier TechniquesJujutsu
        Kaisen, Chapter 198 also treat those with no curse energy as "buildings" as
        they possess no curse energy to recognize them and Domain Expansion's sure
        hits are unable to recognize them as well.
