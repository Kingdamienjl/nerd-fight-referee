- id: claim-weaknesses-d23e12b8
  section: weaknesses
  axis: weakness
  text: "Nobara can sometimes display overconfidence in her abilities, which may lead\
    \ to underestimating her opponents or taking unnecessary risks during battle.\
    \ Notable Attacks/Techniques: *{{Nihongo|Straw Doll Technique|{{Ruby|\u82BB\u970A\
    \u546A\u6CD5|\u3059\u3046\u308C\u3044\u3058\u3085\u307B\u3046}}|S\u016Brei Juh\u014D\
    }} Nobara's Innate Technique allows her to use a straw doll to attack the opponent\
    \ from a distance. She can also use charm weapons to perform her Technique. She\
    \ does this by \"shooting\" the nails from a distance when hitting them with her\
    \ hammer. Upon hitting a Curse, her Cursed Energy surrounds and enlarges around\
    \ the nails, exorcising it. **{{Nihongo|Resonance|{{Ruby|\u5171|\u3068\u3082}}{{Ruby|\u9CF4\
    |\u306A}}\u308A|Tomonari}}: Using a straw doll, she was able to establish a connection\
    \ between the doll and a Cursed Spirit. Whatever she did to the doll, the connected\
    \ Cursed Spirit would also experience the same thing. **{{Nihongo|Hairpin|{{Ruby|\u7C2A\
    |\u304B\u3093\u3056\u3057}}|Kanzashi}} Nobara scatters the nails on solid objects\
    \ such as trees or a body and destroys the things or body to control the environment.\
    \ *{{Nihongo|Black Flash|{{Ruby|\u9ED2\u9583|\u3053\u304F\u305B\u3093}}|Kokusen}}:\
    \ A Technique that creates spatial distortion when a user connects with an impact\
    \ of Cursed Energy within 0.000001 seconds of a physical hit. The phenomenon causes\
    \ Cursed Energy to flash black, creating an attack that is equal to a normal hit\
    \ to the power of 2.5. Note: Even though it is stated several times that the Black\
    \ Flash multiplies the attack by ^2.5, this is not consistent with the verse as\
    \ several attacks would be Solar System Level. Many times several characters are\
    \ able to resist a Black Flash, even if in theory the attack is ^2.5 stronger.\
    \ ==Notable Matchups== Victories: Losses: *The Governor (The Walking Dead) The\
    \ Governor Profile (First key Nobara was used, starting Distance was 10 Meters,\
    \ both had their standard equipment, battle took place inside a prison) Inconclusive:\
    \ ==References== {{Scroll box|content=}} ==Statistics Values== {{Scroll box|content=}}\
    \ {{Discussions}} Category:Characters Category:Jujutsu Kaisen Category:Anime Characters\
    \ Category:Body Puppetry Users Category:Damage Transferal Users Category:Doll\
    \ Users Category:Energy Users Category:Enhanced Senses Users Category:Female Characters\
    \ Category:Hammer Users Category:Humans Category:Manga Characters Category:Non-Physical\
    \ Interaction Users Category:Protagonists Category:Sorcerers Category:Soul Users\
    \ Category:Statistics Amplification Users Category:Teenagers Category:Weapon Masters"
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c059f1dc
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= *Cursed Energy Manipulation
    (Basic Sorcerer) **Body Puppetry & Damage Transferal (Anything that happens to
    the doll (after it''s linked to a target will affect such target. Can use herself
    as the doll and any damage she takes will be given to the target as long as she''s
    connected to them via an active Technique) ***Soul Manipulation (Her Resonance
    was capable of directly affecting Mahito''s soul) **Black Flash (Experienced Black
    Flash alongside Yuji against the Cursed Paintings) *Weapon Mastery (Skilled with
    her hammer and nails) }}'
  source_ids: *id004
