      measurement of the sorcerer grading system. Despite holding back, killed Dura,Jujutsu
      Kaisen: Modulo; Chapter 9 one of the strongest Simurians, with the outcome being
      clear the moment he appeared. Caused immense backlash to Usami''s cursed speech
      despite him being a Grade 1 sorcerer), higher with Light (Capable of tearing
      through Mahoraga with his light), up to Island level at his limits/while accelerating
      (Completely obliterated Mahoraga''s body except for the wheel and a small bit
      of flesh and destroyed a large portion of the city around them. Pushed his body
      to its limits to move at sub-light speed. Shattered Mahoraga''s Sword of Extermination);
      higher while using Domain Expansion (Domain ExpansionJujutsu Kaisen Official
      Fanbook increases the stats of the userJujutsu Kaisen, Chapter 15: "Domain")'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Hypersonic with Sub-Relativistic+ reactions normally (Capable of
      reacting to Mahoraga's attacks. Destroyed Yakumaru's arm before Usami could
      active cursed speech), up to Speed of Light at his limits/while accelerating
      (Pushed his body's physical speed to sub-light speed, moving closer and closer
      to the speed of light), Speed of Light with Light (Dabura's light travels at
      the speed of light); higher while using Domain Expansion
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class G normally (Should be comparable to Ryomen Sukuna and Satoru Gojo),
