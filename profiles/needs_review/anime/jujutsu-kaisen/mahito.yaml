  description: 'immune to Idle Transfiguration. Thus, Mahito cannot use it and his
    Domain Expansion against Yuji since the latter contains Sukuna within him. Mahito''s
    also especially vulnerable to those who can harm his soul directly. Mahito has
    a limited stock of transfigured humans, and can run out of them without any nearby
    humans to replenish his stock. {| class="mw-collapsible mw-collapsed" align="center"
    | colspan="2" style="text-align: left; |Notable Attacks/Techniques: |- | *: Mahito''s
    Cursed Technique grants him the ability to reshape souls. Doing so allows him
    to disfigure his victims'' bodies, heal his own wounds, transform his appendages
    into weapons, and a limitless variety of other possible transformations. Additionally,
    he can change the target''s soul''s shape to turn them into monster-like creatures
    that obey his orders and change their size. **: Mahito uses his Cursed Technique
    to merge two or more souls, which causes a reaction due to the merge''s rejection.
    ***: By using the effect of Soul Multiplicity and increasing the soul''s Energy,
    Mahito directs the overwhelming output toward an opponent. ***: Using Soul Multiplicity,
    Mahito can form the souls with weak rejection into one body. The result is a Transfigured
    Human that can attack Mahito''s opponents independently. A Polymorphic Soul Isomer
    is more stable than a regular Transfigured Human, as it doesn''t seem capable
    of randomly dying mid-battle. A result of expending so many souls at once is the
    explosive power behind the Isomer''s attacks, as they''re strong enough to send
    a powerful Sorcerer, like Aoi Todo, flying. However, the trade-off is the low
    durability of these Transfigured Humans, which was shown when Todo managed to
    take them down in just one punch for each. **: When Mahito found the true essence
    of his soul, he unlocked a new, more muscular, and monstrous body. This body is
    also highly durable, as shown when Yuji''s punches had no effect on him. To activate
    this form, Mahito has to rip his human face off. **: Mahito''s Domain Expansion
    creates an environment where he is automatically connected with the souls of anyone
    inside and can transfigure them at will. With this power, Mahito doesn''t need
    to touch the target directly to affect their soul, as the target''s soul is essentially
    already in the palm of his hand when inside this Domain. *: A cursed technique
    that separates an area from the rest of space. Sorcerers used it to hide their
    activities by making the inside of the area invisible to the outside, obscuring
    any action to prevent unwanted witnesses or interruptions. *: A technique that
    creates spatial distortion when a user connects with an impact of Cursed Energy
    within 0.000001 seconds of a physical hit causing it to flash black and greatly
    amplify the power of the attack. |} ==Notable Matchups== Victories: Losses: *Nagato
