    - field: intelligence
      value: 'Genius (Born recently, Mahito shows incredible understanding of humans,
        down to the way they think, their behavior, and the philosophies which guide
        them. Being born from humans'' hatred of one another, knowledge on them comes
        natural to him. His capacity for concepts in Jujutsu like Domain Expansion
        are also gained shortly, developing to Jogo''s level. And he has a great understanding
        of souls, allowing him the ability to perceive how Nanami could block his
        soul attacks and understandJujutsu Kaisen, Chapter 27: "What If" how Yuji
        was able to harm his soul. Is an exceptional combatant, utilizing his soul
        manipulation to fight off a Grade 1 like Nanami, having already practiced
        a lot in using it. He also learns quickly from experiencing new tactics, abilities,
        or being put into a dangerous situation which can allow him to gain new abilities
        such as Domain Expansion. Mahito will also on the fly come up with ways to
        transfigure his soul into better ways of killing at a fast rate. Nanami acknowledged
        him to be growing at a fast rate and was worried about it. Along with Suguru
        Geto, Mahito often acts as the brains of his faction''s operation as well)'
      source_id: mediawiki-4651171
      provider_id: vsbattles
      authority: high
      confidence: 0.75
