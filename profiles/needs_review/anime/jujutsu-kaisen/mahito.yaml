    - field: intelligence
      value: 'Genius (Born recently, Mahito shows incredible understanding of humans,
        down to the way they think, their behavior, and the philosophies which guide
        them. Being born from humans'' hatred of one another, knowledge on them comes
        natural to him. His capacity for concepts in Jujutsu like Domain Expansion
        are also gained shortly, developing to Jogo''s level. And he has a great understanding
        of souls, allowing him the ability to perceive how Nanami could block his
        soul attacks and understandJujutsu Kaisen, Chapter 27: "What If" how Yuji
        was able to harm his soul. Is an exceptional combatant, utilizing his soul
        manipulation to fight off a Grade 1 like Nanami, having already practiced
        a lot in using it. He also learns quickly from experiencing new tactics, abilities,
        or being put into a dangerous situation which can allow him to gain new abilities
        such as Domain Expansion. Mahito will also on the fly come up with ways to
        transfigure his soul into better ways of killing at a fast rate. Nanami acknowledged
        him to be growing at a fast rate and was worried about it. Along with Suguru
        Geto, Mahito often acts as the brains of his faction''s operation as well)'
      source_id: vsbattles-mahito-jujutsu-kaisen
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "If the shape of his transformation is too big, its maneuverability and\
        \ power will decline. For Idle Transfiguration to work, requires direct touch,\
        \ and a cursed technique may also protect the victims. Sukuna appears immune\
        \ to Idle Transfiguration. Thus, Mahito cannot use it and his Domain Expansion\
        \ against Yuji since the latter contains Sukuna within him. Mahito's also\
        \ especially vulnerable to those who can harm his soul directly. Mahito has\
        \ a limited stock of transfigured humans, and can run out of them without\
        \ any nearby humans to replenish his stock. {| class=\"mw-collapsible mw-collapsed\"\
        \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"\
        width:100%\" | colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques:\
        \ |- | *{{Nihongo|Idle Transfiguration|{{Ruby|\u7121\u70BA|\u3080\u3044}}{{Ruby|\u8EE2\
        \u5909|\u3066\u3093\u307A\u3093}}|Mui Tenpen}}: Mahito's Cursed Technique\
        \ grants him the ability to reshape souls. Doing so allows him to disfigure\
        \ his victims' bodies, heal his own wounds, transform his appendages into\
        \ weapons, and a limitless variety of other possible transformations. Additionally,\
        \ he can change the target's soul's shape to turn them into monster-like creatures\
        \ that obey his orders and change their size. **{{Nihongo|Soul Multiplicity|{{Ruby|\u591A\
        |\u305F}}{{Ruby|\u91CD|\u3058\u3085\u3046}}{{Ruby|\u9B42|\u3053\u3093}}|Taj\u016B\
        kon}}: Mahito uses his Cursed Technique to merge two or more souls, which\
        \ causes a reaction due to the merge's rejection. ***{{Nihongo|Body Repel|{{Ruby|\u64A5\
        |\u3070\u3063}}{{Ruby|\u4F53|\u305F\u3044}}|Battai}}: By using the effect\
        \ of Soul Multiplicity and increasing the soul's Energy, Mahito directs the\
        \ overwhelming output toward an opponent. ***{{Nihongo|Polymorphic Soul Isomer|{{Ruby|\u5E7E\
        |\u304D}}{{Ruby|\u9B42|\u3053\u3093}}{{Ruby|\u7570|\u3044}}{{Ruby|\u6027\u4F53\
        |\u305B\u3044\u305F\u3044}}|Kikon Iseitai}}: Using Soul Multiplicity, Mahito\
        \ can form the souls with weak rejection into one body. The result is a Transfigured\
        \ Human that can attack Mahito's opponents independently. A Polymorphic Soul\
        \ Isomer is more stable than a regular Transfigured Human, as it doesn't seem\
        \ capable of randomly dying mid-battle. A result of expending so many souls\
        \ at once is the explosive power behind the Isomer's attacks, as they're strong\
        \ enough to send a powerful Sorcerer, like Aoi Todo, flying. However, the\
        \ trade-off is the low durability of these Transfigured Humans, which was\
        \ shown when Todo managed to take them down in just one punch for each. **{{Nihongo|Instant\
        \ Spirit Body of Distorted Killing|{{Ruby|\u904D\u6BBA\u5373\u970A\u4F53|\u3078\
        \u3093\u305B\u3064\u305D\u304F\u308C\u3044\u305F\u3044}}|Hensetsu Sokureitai}}:\
        \ When Mahito found the true essence of his soul, he unlocked a new, more\
        \ muscular, and monstrous body. This body is also highly durable, as shown\
        \ when Yuji's punches had no effect on him. To activate this form, Mahito\
        \ has to rip his human face off. **{{Nihongo|Domain Expansion: Self-Embodiment\
        \ of Perfection|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF\u5C55\u958B\
        |\u3044\u304D\u3066\u3093\u304B\u3044}}\u300C{{Ruby|\u81EA|\u3058}}{{Ruby|\u9589\
        \u5186\u920D|\u3078\u3044\u3048\u3093\u3069\u3093}}{{Ruby|\u5316|\u304B}}\u300D\
        |Ry\u014Diki Tenkai\u30FBJihei Endonka}}: Mahito's Domain Expansion creates\
        \ an environment where he is automatically connected with the souls of anyone\
        \ inside and can transfigure them at will. With this power, Mahito doesn't\
        \ need to touch the target directly to affect their soul, as the target's\
        \ soul is essentially already in the palm of his hand when inside this Domain.\
        \ *{{Nihongo|Curtain|{{Ruby|\u5E33|\u3068\u3070\u308A}}|Tobari}}: A cursed\
        \ technique that separates an area from the rest of space. Sorcerers used\
        \ it to hide their activities by making the inside of the area invisible to\
        \ the outside, obscuring any action to prevent unwanted witnesses or interruptions.\
        \ *{{Nihongo|Black Flash|{{Ruby|\u9ED2\u9583|\u3053\u304F\u305B\u3093}}|Kokusen}}:\
