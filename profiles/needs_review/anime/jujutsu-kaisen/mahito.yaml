        \ Mahito and Culling Games Higuruma were used) *Asriel Dreemurr (Undertale)\
        \ Flowey's Profile (Base Shibuya Incident Mahito and Flowey were used. Battle\
        \ took place in Waterfall) *Toji Fushiguro (Jujutsu Kaisen) Toji's Profile\
        \ (Fight was in Tel'Aviv, starting distance was of 200 meters and Mahito had\
        \ Jogo by his side) *Capella Emerada Lugnica (Re:Zero kara Hajimeru Isekai\
        \ Seikatsu) Capella's Profile (Shibuya Incident Mahito was used. Speed was\
