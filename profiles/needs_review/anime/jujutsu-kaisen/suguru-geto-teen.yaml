- id: claim-weaknesses-8332cbf5
  section: weaknesses
  axis: weakness
  text: "*Hookworm Curse: Suguru employs a formidable curse resembling a giant man-eating\
    \ hookworm with sharp teeth and a large innard capable of capturing or swallowing\
    \ other curses. He strategically uses it indoors, filling hallways to keep distance\
    \ in fights. Suguru can summon it suddenly for surprise attacks or to create blind\
    \ spots, exploiting false opportunities to outmaneuver opponents. *Unknown Cursed\
    \ Spirit: He absorbed a cursed spirit that can trap its targets within its barriers.\
    \ Time flows differently inside the barriers than outside: 30 minutes inside is\
    \ equivalent to 2 days outside. The cursed spirit creates a looping environment\
    \ inside the barriers to keep the target sealed off. *Sting-Ray Curse: A flying\
    \ curse with an appearance similar to an aquatic sting-ray. It is capable of levitating\
    \ and has enough size to support Suguru and one other person. *Kiss Curse: A tall\
    \ curse with a fungus base and several heads atop it capable of capturing Suguru's\
    \ targets. Upon doing so the largest head on the curse will attempt to kiss whoever\
    \ is captive. *Docile Curse: A docile curse with two eyes, eight legs and horns\
    \ big enough to support and carry a full grown human. *Surveillance Curse: Surveillance\
    \ curses with multiple eyes each that can be used to observe a large area. However,\
    \ Suguru cannot share their vision like Mei Mei can with her birds. He must check\
    \ in every so often to learn of their status. *Decoy Curses: Two small single-eyed\
    \ curses that act as decoys for Suguru while standing off with opponents. *One-Eyed\
    \ Giant Curse: A giant single-eyed curse with a humanoid body who wears black\
    \ pants and a necklace consisting of human heads. It was summoned by Suguru to\
    \ launch Toji Fushiguro into the air during their battle, and was later used by\
    \ Suguru to threaten the lives of the first-year students, allowing him to safely\
    \ leave Tokyo Jujutsu High after declaring war. *{{Nihongo|Rainbow Dragon|{{Ruby|\u8679\
    |\u3053\u3046}}{{Ruby|\u9F8D|\u308A\u3085\u3046}}|K\u014Dry\u016B}}: It is a large\
    \ Eastern dragon-like cursed spirit with the toughest skin among all Suguru's\
    \ curses. It is a powerful curse capable of attacking with great and brute force\
    \ to crush Suguru's target. *{{Nihongo|Kuchisake-Onna|{{Ruby|\u53E3|\u304F\u3061\
    }}{{Ruby|\u88C2|\u3055}}\u3051{{Ruby|\u5973|\u304A\u3093\u306A}}|Kuchisake-onna}}:\
    \ It is an Imaginary Vengeful Spirit from the popular yokai legend. It is capable\
    \ of trapping Suguru's targets within a Innate Domain with a Binding Vow that\
    \ can't be dispelled until the target answers the question. If the answer isn't\
    \ to her liking, the spirit can instantly create scissors from thin air as soon\
    \ as the domain disappears. They appear close to the target's limbs, ready to\
    \ snip them off at any moment. |-"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-74fc36f0
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=No|Content= *Cursed Energy Manipulation (Advanced
    Sorcerer; Is at the pinnacle of a Grade 1 SorcererJujutsu Kaisen: Chapter 73)
    **Absorption & Summoning (Cursed Spirit Manipulation involves absorbing conquered
    cursed spirits into a black sphere instead of exorcising them. Users can also
    absorb curses from others who control them by killing the master.Jujutsu Kaisen
    0: Chapter 03 Oral consumption of the curse''s orb grants complete dominance,
    enabling users to summon the spirits at will. Limited Soul Absorption; Kenjaku
    used the same technique to absorb Mahito.Jujutsu Kaisen: Chapter 133 It was stated
    that he is capable of absorbing Tengen''s soul because he is currently an evolved
    soul, which is closer to a cursed spiritJujutsu Kaisen: Chapter 145) **Clairvoyance
    (Surveillance curses possess multiple eyes, each capable of observing a large
    areaJujutsu Kaisen: Chapter 67) **Domain Expansion (Type 1), Law Manipulation
    & Weapon Creation (Kuchisake-Onna, an Imaginary Vengeful Spirit from Japanese
    yokai legend, possesses the ability to ensnare her targets within a Innate Domain,
    compelling them to adhere to a binding vow of non-violence until they answer her
    question. If the answer displeases her, she can conjure scissors around the target,
    poised to sever limbs upon the domain''s dissolutionJujutsu Kaisen: Chapter 73)
    **Bodily Weaponry (Suguru employs a formidable curse resembling a giant man-eating
    hookworm with sharp teeth and a large innard capable of capturing or swallowing
    other cursesJujutsu Kaisen: Chapter 71) **Sealing, Space-Time Manipulation & Pocket
    Reality Manipulation (He absorbed a cursed spirit that can trap its targets within
    its barriers. Time flows differently inside the barriers than outside: 30 minutes
    inside is equivalent to 2 days outside. The cursed spirit creates a looping environment
    inside the barriers to keep the target sealed offJujutsu Kaisen: Chapter 65) **Flight
    (Suguru possesses a flying curse resembling an aquatic stingray, capable of levitation
    and with sufficient size to support him and one other personJujutsu Kaisen: Chapter
    67) *Martial Arts, Weapon Mastery & Acrobatics (Hypermobility; Suguru''s hand-to-hand
    combat skills are formidable, as he efficiently incapacitates armed curse users
    with a combination of punches, palm strikes, and hard chops, capable of causing
    severe injury.Jujutsu Kaisen: Chapter 68 Even skilled fighters like Panda are
    outmatched by Suguru''s prowess in close-quarters combat.Jujutsu Kaisen 0: Chapter
    03 Suguru can defend against both Yuta''s sword strikes and Rika''s physical attacks
    simultaneously, while also attacking, utilizing Playful Cloud with masterful skill
    in close combat. He can also perform acrobaticsJujutsu Kaisen 0: Chapter 04) }}
    |-'
  source_ids: *id003
  decisive: true
