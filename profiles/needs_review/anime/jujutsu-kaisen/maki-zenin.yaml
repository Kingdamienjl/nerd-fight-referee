        can change thanks to the slightest of events. |-|Complete Heavenly Restriction=
        All previous abilities but massively enhanced, as Maki is equal to Toji, she
        has in addition: Passive: * Acausality [Type 2]: having zero Cursed Energy
        makes you escape fate. * Instinctive Soul Manipulation Negation: Equal to
        Toji who''s body naturally overwrite any souls that doesn''t belong to its
        original body. Skills: * Statistics Amplification: By revealing the functioning
        of her Heavenly Restriction, she can increase its power. * Acrobatics [All
        Types]: can grab to strings of space; can dodge in mid air. * Enhanced Senses,
        Extrasensory Perception: should be comparable to Toji who with his enhanced
        five senses can perceive Cursed Spirits, is able to see the contour of soul
        as well as the distortions of space. As she can "feel everything" about herself
        and her opponent based on the distortions of the air, she can predict her
        opponents'' movements. * Stealth Mastery: Because she has zero Cursed Energy,
        no one can sense her presence besides the Six Eyes and effectively becomes
        "invisible". * Shockwave Creation: Can send a shockwave through materials,
        to hit those on the other side precisely. * Information Analysis: After getting
        rid of her mental limitations, she extended her perception range vastly beyond
        her bodies'' natural range to sense through her entire environment which resulted
        in an ability of "seeing the souls of inanimate objects". * Regeneration [Low]:
        Can heal internal damages in five minutes. Resistances: * Limited Homing Attack
        & Forcefield Creation: due to having no Cursed energy, closed-barrier domains
        treat Maki as a building allowing her to ignore their homing capability and
        also makes it so she''s able to move in and out of a domain''s barrier. *
        Possession * Limited Analytical Prediction & Extrasensory Perception: Maki
        has zero cursed energy similar to Toji, therefore making it harder to read
        her moves in combat as it shown with Gojo against Toji.'
