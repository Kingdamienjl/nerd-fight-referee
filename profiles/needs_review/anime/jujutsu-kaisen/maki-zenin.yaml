      Kaisen, Chapter 108 Matched blows with Ogi then cut his sword apart), at least
      City Block level+ with Playful Cloud (A single strike allowed her to destroy
      part of Hanami''s arm and send him flying, which dealt more damage to him than
      Megumi''s Divine Dog: Totality. Its power was complemented by Hanami afterwards,
      though later on it was stated Hanami was intentionally holding back.Jujutsu
      Kaisen, Chapter 47 Took off a part of Dagon''s arm and sent him flying with
      a single strike, and warded off his Shikigami.Jujutsu Kaisen, Chapter 109: "The
