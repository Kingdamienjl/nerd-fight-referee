      Kaisen Official Fanbook Yuji said that she''s strong and a tough fighter. Rookies
      like Nobara and Megumi are weak in close combat compared to her, and had to
      train them.Jujutsu Kaisen, Chapter 12 Easily out-skilled Miwa, with Miwa saying
      that Maki was crazy strong and that she would''ve killed her twice if her blade
      was exposed.Jujutsu Kaisen, Chapter 40 Against Mai, she cut apart her bullets,
      then harmed her with a physical strike and caught a bullet with her bare hands.Jujutsu
      Kaisen, Chapter 42 Was one of the 5 students recommended for Grade 1.Jujutsu
