  intelligence:
    text: Gifted (Is by far the most diverse and adaptable fighter in close quarters
      amongst the students, being able to change up her style with several weapons
      such as three-section staff, polearms, and swords, and hand to hand. Maki is
      a good sorcerer, being basically Semi-Grade 1, having been recommendedJujutsu
      Kaisen, Chapter 63 for Grade 1 by Aoi Todo and Mei Mei, as well as Gojo agreeingJujutsu
      Kaisen, Chapter 40 she should be Grade 2 already. Is praisedJujutsu Kaisen,
      Chapter 40 for her skill by Miwa, stating she could be a Grade 2 without problem.
      Is recognized by Nobara and Yuji as a tough fighter, who can tell by her poise
      and the way she walks she's something else.Jujutsu Kaisen, Chapter 42 Maki was
      also a sorcerer raised and trained in the Kukuru Unit, a unit of the Zen'in
      clan consisting of non-wielding cursed technique Sorcerers, who undergo grueling
      martial arts training day and night, a unit she later defeated, and then killed
      the Hei while injured shortly after. Will use decoysJujutsu Kaisen, Chapter
      40 to close the gap, and can disarm sword users, being skilled in Aikido. She
      later shows to be knowledgable in Shiranui Gata,Jujutsu Kaisen, Chapter 151
      using it in her fight with Naoya. After her Full Realization development from
      training with Miyo, Maki is noted to have broken out of her shellJujutsu Kaisen,
      Chapter 197 and "changed entirely."Jujutsu Kaisen, Chapter 197 This development
      manifested in her an absurd degree of perception within the world, to the point
      her skill has improved allowing her to singlehandedly fight Sukuna, driving
      him to try much harder than with his prior opponentsJujutsu Kaisen, Chapter
      253)
    source_ids:
    - vsbattles-maki-zenin-jujutsu-kaisen
    confidence: 0.6
    notes: auto_repair source extraction
