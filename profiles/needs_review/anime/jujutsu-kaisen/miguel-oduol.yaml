  intelligence:
    text: Gifted in Combat (Miguel, a highly skilled Jujutsu sorcerer from a sorcerer
      family in Africa, stands out for his proficiency in combat, demonstrated by
      his ability to hold his own against Satoru Gojo, the strongest sorcerer of the
      Modern Era. In a notable encounter, Miguel effectively used the Black Rope to
      disrupt Satoru's Infinity, a feat few achieve. Surviving an encounter with a
      Six Eyes user, Miguel's exceptional performance during the Night Parade of a
      Hundred Demons earned him the title of "MVP" on December 24, 2017. Recognizing
      his prowess, Satoru recruited Miguel to train his prized pupil, Yuta Okkotsu,
      resulting in a significant enhancement of Yuta's cursed energy control upon
      his return from Africa. Miguel's training likely played a crucial role in Yuta's
      development and increased power)
    source_ids: *id002
