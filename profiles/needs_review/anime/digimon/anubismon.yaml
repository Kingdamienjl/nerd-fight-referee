    * Attack Reflection * Forcefield Creation * Life Manipulation (Can absorb one''s
    Life Force to heal itself) * Possession * Madness Manipulation (Type 2) * Absolute
    Zero * Sword Mastery * Illusion Creation & Fear Manipulation via Terror Illusion
    * Memory Manipulation * Duplication (Can duplicate itself thousands of times in
    mere moments. These duplicates have lesser abilities however) * Electricity Manipulation
    * Paralysis Inducement Resistance to * Death Manipulation * Sleep Manipulation
    * Statistics Reduction * Status Effect Inducement (Stunning)'
