    into nothingness) * Curse Manipulation & Sleep Manipulation via Cursed Slash *
    Chaos Manipulation * Ice Manipulation * Sleep Manipulation & Dream Manipulation
    via Nightmare Syndrome * Fire Manipulation * Teleportation * Poison Manipulation
    * Plant Manipulation * Empathic Manipulation * Martial Arts * Durability Negation
    via Savage Emperor, Dark Crusher, Atomic Burst and Mikafutsu-no-kami * Regeneration
