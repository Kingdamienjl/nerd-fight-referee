  axis: hax
  text: '* Digimon Physiology (Mid Tier, Undead-Type & Dark Digimon) & Data Manipulation
    (11 Layers) * Flight * Shapeshifting (Can disguise itself as a humanDigimon Ghost
    Game; Episode 25 ""The Crimson Banquet") * Darkness Manipulation (Via various
    Dark-based skills) * Animal Manipulation (Can create and control Familiar Bats)
    * Sense Manipulation (Its Familiar Bats can rob the opponent of their sightDigimon
    Adventure V-Tamer 01: Chapter 13 "Wake Up! Combination") * Durability Negation
    (Via Night Raid and Pit Crusher) * Energy Projection (Via Bloody Stream) * Madness
    Manipulation (Type 2; Via Nightmare Wave) * Paralysis Inducement (Via Dead Scream)
    * Electricity Manipulation (Via Electric Chute and Electric Cloud) * Statistics
    Amplification (Via Tailwind) * Sound Manipulation (Via War Cry) * Aura (Via Fighting
    Spirit) * Empathic Manipulation (War Cry and Nightmare can inflict rage on the
    opponent) * Limited Damage Boost (Its passive skills Nightmare Soldiers increases
    damage of Dark skills by 15%Digimon Story: Cyber Sleuth; Vamdemon while Dark Noble
    raises Dark-based attacks by two ranksDigimon Survive; Vamdemon) Resistance to
    * Darkness Manipulation (Dark Breath 4 significantly increases resistance to dark-based
    attacksDigimon Story: Sunburst & Moonlight; Vamdemon while Dark Noble raises its
    dark resistance by one rank) * Poison Manipulation (Poison Guard increases resistance
    to poisonDigimon Story: Lost Evolution; Vamdemon) * Mind Manipulation (Dark Noble
    makes it less likely to get the confused statusDigimon Survive; Vamdemon) X-Antibody=All
    previous abilities amplified; plus * Digimon Physiology (X-Antibody Carrier) &
    Data Manipulation (12 Layers) * Transmutation (Via Vampire Theory) All previous
    abilities amplified; plus * Digimon Physiology (High Tier) & Data Manipulation
    (14 Layers) * Bodily Weaponry (Conventional; Claws) * Large Size (Type 0 to 1)
    * Statistics Amplification & Healing (Via "Number of the Beast" and "Six Actions,
    Six Boosts"/"Raise the Roof"; Can use "Number of the Beast" to boost all its stats.
    "Six Actions, Six Boosts" will cause "Raise the Roof" to automatically activate
    every six actions, healing it and boosting all its stats with each activationDigimon
    Story: Cyber Sleuth Hacker''s Memory; VenomMyotismon Boss) * Energy Projection,
    Existence Erasure & Durability Negation (Via Venom Infuse; attacks that destroys
    configuration data erases the target''s existenceDigimon Cardass - NANOMON) *
    Chaos Manipulation (Via Chaos Blast) * Fire Manipulation (Via Geo Magma Napalm)
    * Poison Manipulation & Smoke Manipulation (Via Venom Disaster) * Attack Reflection
    (Via Dark Counter) * Statistics Reduction (Via Guard Break Field) * Limited Death
    Manipulation (Destruction has a 10% chance to inflict death) Higher Resistance
    to * Darkness Manipulation (Dark Veil greatly increases resistance to dark-based
    attacksDigimon Story: Sunburst & Moonlight; Venom Vamdemon) * Poison Manipulation
    (Poison Barrier gives complete resistance to poisonDigimon Story: Lost Evolution;
    Venom Vamdemon) All previous abilities amplified; plus * Hellfire Manipulation
    (Via Pandemonium Flame) * Mind Manipulation (Via Mind Illusion) * Corrosion Inducement
    (Via Melting Blood) Resistance to * Death Manipulation, Paralysis Inducement,
    Mind Manipulation & Sleep Manipulation (Healthy significantly increases resistance
    to death, paralysis, confusion and sleepDigimon Story: Lost Evolution; Belial
    Vamdemon)'
