      value: Genius. As Keramon it possessed an cheerful personality, thinking of
        fighting and destructive actions to be the same as playing. Despite this it
        does not seem to underestimate its enemies as it attempts to prevent them
        from either keeping or gaining an advantage as shown when it warp digivolved
        into Infermon to overwhelm the chosen children's champion level digimon and
        attacked them while they were in the process of digivolving to leave them
        incapacitated. This is again shown when it digivolved into Diaboromon to fight
        Wargreymon and MetalGarurumon and immediately incapacitated both Patamon and
        Tentomon before they could join the fight. As Diaboromon it retaliated against
        the chosen children by hacking into the defense networks of various military
        to launch several missiles to kill them. In revenge of Diaboromon it planned
        for its own defeat and sent a countless number of Kuramon to the real world
        to form Armageddemon.
