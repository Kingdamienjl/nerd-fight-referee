- id: claim-weaknesses-45e03ffe
  section: weaknesses
  axis: weakness
  text: 'He is destined to be defeated by Ryo due to being his fated partner and is
    thus weakened in his presence. Notable Attacks/Techniques *Freeze Fang: Bites
    an enemy with icy fangs.St-234 *Touch of Evil/Death Claw: He can stick his arm
    into the ground and have it appear from behind the opponent, grabbing them and
    allowing Devimon to brainwash them. He can also simply extend his arm and pierce
    the opponent to brainwash them. This skill can also paralyze the opponent. Finally
    this attacks can also be used to drain his opponent''s life force.Digimon Reference
    Book; Devimon *Mega Flame/Nova Blast: Fires a gigantic ball of flame from its
    mouth at the opponent.Digimon Reference Book; Greymon *infinity Cannon: Fires
    Mugendramon''s Infinity Cannon.Digimon Adventure 2020; Episode 50 *Heat Viper:
    Shoots heat rays from its mouth or four hands. Even if an opponent tried to dodge
    this, the shock-waves of this attack would knock them to the side.Digimon Reference
    Book; Chimairamon/Kimeramon *Time Unlimited: Forms a black orb in its mouth that,
    when fired, creates another timeline in which the time is compressed, sealing
    the target inside for all eternity on contact.Digimon Reference Book; Millenniummon
    *Dimension Destroyer: After trapping an opponent with Time Unlimited, he collapses
    the entire dimension he created to destroy them.Digimon Reference Book; Millenniummon
    *Touch of Evil: He can stick his arm into the ground and have it appear from behind
    the opponent, grabbing them and brainwash them.Digimon Reference Book; Devimon
    *Clown Trick: This attack has been used to cover several attacksBo-203: **He throws
    a giant tablecloth at the opponent. If it touches the opponent it transforms them
    into a key chain.Digimon Adventure; Episode 52 **Conjures a ring of fire to attack
    opponents. Digimon Adventure; Episode 52 **Creates a large ball and has it come
    out of the ground beneath the opponent to trip them up.Digimon Adventure; Episode
    52 ** Disguises himself (made himself look like a normal clownDigimon Adventure;
    Episode 40) **Reflects an opponent''s attack backDigimon Adventure; Episode 51.
    * Darkness Zone: Generates a dark dimension that extends between both his hands
    infinitely, and erases everything in his path from existence.Bo-3j *Grand Death
    Big Bang: Produces a Big Bang capable of destroying Real and Digital Worlds.Digimon
    Reference Book; Apacalymon *Death Evolution: He confines the enemy within the
    tips of his tentacles and degenerates it.St-261 *Nullifying'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
