  intelligence:
    text: Impmon is a mischievous opponent and a skilled combatant able to trouble
      the likes of Renamon. He is not afraid to fight dirty and trusts no one but
      himself, leading him to be a constant nuisance for the DigiDestined. Upon becoming
      Beelzemon he becomes a far more dangerous fighter, easily killing the likes
      of Leomon and batting aside all of the DigiDestined until Guilmon became Megidramon
      from Takato's misery and rage. Even then he came out on top after absorbing
      Makuramon. He is skilled in both ranged and melee combat in this form, overwhelming
      Takato and Guilmon after they Bio-Merged to become Gallantmon at first, and
      later managed to replicate Leomon's techniques while rescuing Jeri from the
      D-Reaper.
    source_ids:
    - vsbattles-impmon-ai-and-mako-digimon
    confidence: 0.6
    notes: auto_repair source extraction
