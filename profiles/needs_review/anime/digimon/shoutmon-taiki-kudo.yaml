  intelligence:
    text: Hot-blooded, aggressive, and prone to impulsiveness, Shoutmon is not always
      the sharpest knife in the drawer and gets himself into troublesome situations
      all the time as a result. However, he is an expert in melee combat using his
      mic as a medium, battling Champion-level foes despite his small size and later
      shows his proficiency in hand-to-hand combat as OmegaShoutmon. He is also bold
      and charismatic, drawing many Digimon under his banner in hopes of being able
      to rule them benevolently as the Digimon King, granting him a great number of
      allies and allowing him to pull through in the direst of situations with the
      help of Taiki's strategic mind, who despite his young age is capable of leading
      Shoutmon's armies to victory against greater foes through guerrilla tactics
      and exploiting their foes' arrogance and flaws.
    source_ids:
    - mediawiki-83071
    confidence: 0.6
    notes: auto_repair source extraction
