  intelligence:
    text: As a member of the Olympos XII, Dianamon is an immensely skilled combatant
      on par with the Royal Knights, honing her skills by defeating the many challengers
      who attempt to usurp her position as part of the Iliad Server's ruling body.
      Graceful and elegant in combat, she mercilessly tears apart her foes with her
      scythe, the Goodnight Sisters and obliterates enemies from afar with her Arrow
      of Artemis. She is also pragmatic, driving her opponents insane with her Crescent
      Harken and making them carve themselves to pieces.
    source_ids:
    - vsbattles-dianamon-digimon
    confidence: 0.6
