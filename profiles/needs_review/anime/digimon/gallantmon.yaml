    Mode for a long duration, since his Crimson Mode has a limited duration and leaves
    him exhausted after use. Notable Attacks/Techniques: Overwrite: All Digimon can
    rewrite their data, so that they are able to react to various situations that
    were once problematic for it. This usually causes a gigantic increase in power
    and sometimes new skills and resistances are gained. However, the more emotional
    the Digimon is, the more violent the overwrite becomes. Base and Gallantmon X
    *Final Elysion/Final Execution/Shield of the Just: Concentrates an immense amount
    of light energy into his holy shield Aegis, which is fired in a devastating blast
    that destroys and purifies everything in its path. This removes any statistics
    debuffs from Gallantmon as well. *Royal Saber/Lightning Joust: Another powerful
    lighting blast that is fired from his holy lance. *Sky Gram Slash: Gallantmon
    executes a deadly aerial combo. *Screw Saber/ Spiral Saver: Gallantmon executes
