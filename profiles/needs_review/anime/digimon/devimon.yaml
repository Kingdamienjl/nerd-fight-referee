    \ *Evil Wing: Devimon can absorb the countless digital data with his wings that\
    \ he can rip up in the arena. *Hell's Contract: Sends a cloud of cursed Digimoji\
    \ at the enemy or summons up a cursed contract to confuse them. *Touch of Evil/Death\
    \ Claw: He can stick his arm into the ground and have it appear from behind the\
