        \ with themselves and the minds and souls of the beings of the lower worlds.\
        \ They can even interact and harm those from a higher plane of existence,\
        \ like Eaters, which come from a world beyond the Digital World. *Reality\
        \ Warping, Law Manipulation, Quantum Manipulation and Pocket Reality Manipulation\
        \ (With Hacking and Information Manipulation): Reality is viewed by the Digimon,\
        \ and other digital beings, as a computer program, so they are able to rewrite\
        \ the structure of reality changing the laws of the world to whatever form\
        \ they want. Additionally, Digimon contains Inner Worlds within their Digicore.\
        \ In particular, Digimon are considered as the best hacking programs in-universe.\
        \ This can be used to create and reshape pocket realities Digimon Story: Cyber\
        \ Sleuth - Hacker's Memory. Data is considered to be the equivalent to quantum\
        \ particles with Digimon being able to effect data in various ways; **Can\
        \ disable Forcefields: Using hacking, Digimon is able to disable Firewalls,\
        \ even if they are recognized as impenetrable by humans; **Invisibility: They\
        \ are able to mask their presence as if they \"sealed\" themselves, making\
        \ them inaccessible to others; **Remove seals: Analyze data that is sealed\
        \ and locked and is able to remove such a seal; **Duplication: They are able\
        \ to temporarily copy a target data and then paste it elsewhere. **Electricity\
        \ Manipulation: Are able to turn the power of a system on or off; **Extrasensory\
