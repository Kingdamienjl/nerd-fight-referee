        \ *Immersion *Higher-Dimensional Physiology: Digimon are primordial souls\
        \ native to a world that\u2019s superior to the Physical World transcending\
        \ conventional reality on many levels of spacetime. *Non-Corporeal: The composition\
        \ of the given Digimon is a metaphysical substance and its existence is actually\
        \ equivalent to primordial souls being naturally untouchable by those who\
