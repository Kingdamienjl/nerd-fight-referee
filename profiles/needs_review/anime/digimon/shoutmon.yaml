- id: claim-weaknesses-c2a93706
  section: weaknesses
  axis: weakness
  text: "Shoutmon is obsessed with Digibytes (A food often found in the Digital World).\
    \ Losing its mic means losing its passion. Somewhat arrogant and is prone to destruction.\
    \ It needs Taiki's Xros Loader (And by extension Taiki) to perform Xros Fusion\
    \ forms or to evolve into OmegaShoutmon | None Notable | If he takes too much\
    \ damage he'll revert back to his component Digimon | None Notable Notable Attacks/Techniques:\
    \ Shoutmon *Fiery Fastball (\u30ED\u30C3\u30AF\u30C0\u30DE\u30B7\u30FC Rokku Damash\u012B\
    ?, lit. \"Rock Soul\"): Forms a ball of energy in the shape of an eighth note\
    \ and throws it at the opponent. *Bellow Blaster (Soul Crusher): Uses its mic\
    \ to amplify the energy of the heated emotions blazing within its chest, then\
    \ bashes the opponent. Because passion is the very source of the attack, it will\
    \ definitely inflict damage no matter the target. *Rock and Roller (Rowdy Rocker):\
    \ Wields its mic as a bo staff. OmegaShoutmon *Flame Cannon (Heavy Metal Vulcan):\
    \ Converts the passion of its overflowing friendship into firepower as a hail\
    \ of shots that it fires from its chest as both an attack and an impregnable wall\
    \ that keeps its opponents away from its comrades. *Victorize Banking: Effuses\
    \ its passion to justice from the \"V\" on its head and assaults the opponent\
    \ while shining greater than the sun, eradicating them. *Twin Fireball Strike\
    \ (\u30CF\u30FC\u30C9\u30ED\u30C3\u30AF\u30C0\u30DE\u30B7\u30FC H\u0101do Rokku\
    \ Damash\u012B?, lit. \"Hard Rock Soul\"): Changes the passion of its courage\
    \ into flames that surge in its fists, with which it strikes the opponent when\
    \ at close range, and hurls when at a distance. *Doom Drillpress (Beat Slash):\
    \ Changes its feet into blades by filling them with the passion of its fighting\
    \ spirit, then uses them to kick and cut apart the opponent. *Omni Core Fusion\
    \ (Omega the Fusion): Draws the power of the Omega inForce from its whole body,\
    \ concentrates it into an Omnimon-shaped aura, then shoots it at the opponent,\
    \ blowing away even the morale of those who witness it. *Omega InForce: OmegaShoutmon\
    \ and his Fusions have been granted this ability by Omegamon, providing him with\
    \ virtually limitless combat endurance and allowing him to destroy his foe's morale\
    \ just by attacking. Shoutmon DX *Brave Beat Rock Double Xros: Fuses OmegaShoutmon's\
    \ red flames with ZekeGreymon's blue flames, then clothes its body in flame and\
    \ assaults the enemy like a meteor. *Electric Buster Xros: Fires spheres of electricity\
    \ from its bayonets. *Trident JusFang: Slashes the opponent wildly and bravely\
    \ with the blade which it carries on its right arm. *Hyper Rock Magnum: Fires\
    \ homing bullets of flame from its Electric Buster Xros. *Victorize Complete:\
    \ Charges its forehead with awesome power coming from its soul and fires tons\
    \ of V-shaped energy beams. *Zeke Flame: Spews the flames of hell (Dark Area)\
    \ from its mouth to burn a large army of opponents to nothing. Shoutmon X7 *Fusion\
    \ Flamethrower (Xros Burning Rocker): Uses its passionate soul to light its mic\
    \ in hellfire, then grandly swings it down. *Double Flare Blaster (Double Flare\
    \ Buster): Shoots all of its energy from the Zanahoria. *Final Victory Blade (Seven\
    \ Victorize): Concentrates its entire golden-hot aura in its chest, then fires\
    \ it from its \"V\". *Seven Victorize (Seven Victorize Maximum): Expands its Seven\
    \ Victorize into seven beams. *All Omega The Fusion: Shoots an Omegamon-shaped\
    \ aura more powerful than \"Omega the Fusion\", blowing away his opponent's morale\
    \ and dealing even more damage. *Heavy Speaker: Emits a low tone from the speaker\
    \ in its belly and shatters the opponent. Shoutmon X7F Superior Mode *Final Xros\
    \ Blade: Extends its mic into a shining blade. *Double Flare Buster: Shoots all\
    \ of its energy from his mic, the Zanahoria. Shoutmon X7 Superior Mode has too\
    \ many moves to list, however he has the abilities of all these Digimon. ==Notable\
    \ Matchups== Victories: Losses: Inconclusive: Category:Fire Users Category:Digimon\
    \ Category:Anime Characters Category:Characters Category:Male Characters Category:Unknown\
