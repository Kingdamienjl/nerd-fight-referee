    - field: intelligence
      value: Hot-blooded, aggressive, and prone to impulsiveness, Shoutmon is not
        always the sharpest knife in the drawer and gets himself into troublesome
        situations all the time as a result. However, he is an expert in melee combat
        using his mic as a medium, battling Champion-level foes despite his small
        size and later shows his proficiency in hand-to-hand combat as OmegaShoutmon.
        He is also bold and charismatic, drawing many Digimon under his banner in
        hopes of being able to rule them benevolently as the Digimon King, granting
        him a great number of allies and allowing him to pull through in the direst
        of situations with the help of Taiki's strategic mind, who despite his young
        age is capable of leading Shoutmon's armies to victory against greater foes
        through guerrilla tactics and exploiting their foes' arrogance and flaws.
      source_id: vsbattles-shoutmon-digimon
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Shoutmon is obsessed with Digibytes (A food often found in the Digital\
        \ World). Losing its mic means losing its passion. Somewhat arrogant and is\
        \ prone to destruction. It needs Taiki's Xros Loader (And by extension Taiki)\
        \ to perform Xros Fusion forms or to evolve into OmegaShoutmon | None Notable\
        \ | If he takes too much damage he'll revert back to his component Digimon\
        \ | None Notable Notable Attacks/Techniques: Shoutmon *Fiery Fastball (\u30ED\
        \u30C3\u30AF\u30C0\u30DE\u30B7\u30FC Rokku Damash\u012B?, lit. \"Rock Soul\"\
        ): Forms a ball of energy in the shape of an eighth note and throws it at\
        \ the opponent. *Bellow Blaster (Soul Crusher): Uses its mic to amplify the\
        \ energy of the heated emotions blazing within its chest, then bashes the\
        \ opponent. Because passion is the very source of the attack, it will definitely\
        \ inflict damage no matter the target. *Rock and Roller (Rowdy Rocker): Wields\
        \ its mic as a bo staff. OmegaShoutmon *Flame Cannon (Heavy Metal Vulcan):\
        \ Converts the passion of its overflowing friendship into firepower as a hail\
        \ of shots that it fires from its chest as both an attack and an impregnable\
        \ wall that keeps its opponents away from its comrades. *Victorize Banking:\
        \ Effuses its passion to justice from the \"V\" on its head and assaults the\
        \ opponent while shining greater than the sun, eradicating them. *Twin Fireball\
        \ Strike (\u30CF\u30FC\u30C9\u30ED\u30C3\u30AF\u30C0\u30DE\u30B7\u30FC H\u0101\
        do Rokku Damash\u012B?, lit. \"Hard Rock Soul\"): Changes the passion of its\
        \ courage into flames that surge in its fists, with which it strikes the opponent\
        \ when at close range, and hurls when at a distance. *Doom Drillpress (Beat\
        \ Slash): Changes its feet into blades by filling them with the passion of\
        \ its fighting spirit, then uses them to kick and cut apart the opponent.\
        \ *Omni Core Fusion (Omega the Fusion): Draws the power of the Omega inForce\
        \ from its whole body, concentrates it into an Omnimon-shaped aura, then shoots\
        \ it at the opponent, blowing away even the morale of those who witness it.\
        \ *Omega InForce: OmegaShoutmon and his Fusions have been granted this ability\
        \ by Omegamon, providing him with virtually limitless combat endurance and\
        \ allowing him to destroy his foe's morale just by attacking. Shoutmon DX\
        \ *Brave Beat Rock Double Xros: Fuses OmegaShoutmon's red flames with ZekeGreymon's\
