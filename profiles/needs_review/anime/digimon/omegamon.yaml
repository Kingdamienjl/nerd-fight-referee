- id: claim-weaknesses-35d45ac1
  section: weaknesses
  axis: weakness
  text: "Nothing notable Notable Attacks and Techniques: Overwrite: All Digimon can\
    \ rewrite their data, so that they are able to react to various situations that\
    \ were once problematic for it. This usually causes a gigantic increase in power\
    \ and sometimes new skills and resistances are gained. However, the more emotional\
    \ the Digimon is, the more violent the overwrite becomes. Base *Supreme Cannon\
    \ (Garuru Cannon): Blasts the opponent with projectiles that approach absolute\
    \ zero from the cannon attached to its right arm. It also used incendiary blasts\
    \ in the movie to kill well over a million Diaboromon (a Mega-level Digimon powerful\
    \ enough to easily defeat both WarGreymon and MetalGarurumon, albeit weakened\
    \ by creating so many clones) in four shots. *Transcendent Sword (Grey Sword):\
    \ Slashes with the invincible Grey Sword with incredible force. A single swipe\
    \ is powerful enough to reflect an omnidirectional attack from Diaboromon, a Mega\
    \ level Digimon who dominated both WarGreymon and MetalGarurumon. *Double Shot\
    \ / Double Breath: Fires waves of fire and ice (the ice is most likely absolute\
    \ zero if scaled from its Jogress component, MetalGarurumon). *Blaster Blade:\
    \ Launches forward and impales the enemy with his sword. *Royal Slash: Fills its\
    \ blade with holy power and slashes the opponent. *Ultimate Uppercut: Uses the\
    \ Grey Sword to send the enemy in the air then repeatedly blasts them with the\
    \ Garuru Cannon. *Sword of Ruin: Creates a ring of energy around himself which\
    \ causes a large explosion. *Omega Blast: Gathers light in the Grey Sword and\
    \ swings it in the enemy's direction, engulfing them in a huge explosion or Fires\
    \ simultaneous blasts of fiery and icy energy from its arms. *Fatal Cannon: Fires\
    \ large and powerful balls of purifying holy energy at the opponent. *Royal Blizzard:\
    \ Freezes the opponent and the area by summoning a severe ice storm. *'Royal Cannon:\
    \ Fires 5 destructive balls of light. *Acceleration Boost: Doubles the power of\
    \ his next attack. *Omega Inforce: It's Omegamon's exclusive innate Override Sequence\
    \ that grants him great power and lets him see the immediate future. It also lends\
    \ him unlimited stamina, allowing him to fight at peak capacity no matter what.\
    \ This ability allows him to always stay one step ahead of the opponent. It is\
    \ this ability that makes Omegamon a theoretically insurmountable opponent. *All\
    \ Delete: Taps into the Omega Inforce to raise the power of the Grey Sword to\
    \ the limit. According to the reference book, opponents attacked in this way are\
    \ not slashed, but instead erased by the blow, thus ignoring durability and erasing\
    \ the existence of those destroyed by this attack. This attack is also powerful\
    \ enough to erase entire Digital World. *Power Null: A thought that nullifies\
    \ the opponents' special abilities. Merciful Mode *Gu-Rei Tou: With the Grey Sword\
    \ transformed into the katana on the left arm, perform a multi-hit and long-range\
    \ attack. *Holy Flame: Strikes the opponent with the light energy of all justice,\
    \ instantaneously erasing their form. *Apocalypse: Calls down energy bolts from\
    \ the heavens to strike opponents. *Hermit Fog: Sprays forth a cold mist that\
    \ corrodes anything it touches. *Starlight Explosion: Causes it to rain golden\
    \ grains that are said to purify all of the wickedness of those who suffer this\
    \ technique or causes an explosion of light. *Life Force: Generates a wonderful\
    \ energy that absorbs the enemy's life force. *Shadow Wing: Unleashes a vacuum\
    \ blade at super-speed, chopping up the opponent. Because of the speed of the\
    \ Wing Blade's residue, its true shape cannot be confirmed, and it can only be\
    \ seen as a silhouette shaped like a black bird. Or launches a large mass of fire\
    \ shaped like a bird. *Arctic Blizzard: Momentarily brings the surrounding atmosphere\
    \ to absolute zero, then smashes the frozen enemy. *Forbidden Temptation: Beautifully\
    \ destroys the opponent's data in a shower of innumerable rose petals. *Thorn\
    \ Whipping (Thorn Whip): Tames a Digimon, no matter how frenzied, with a thorned\
    \ whip charged with electricity. Those who suffer this technique become Rosemon's\
    \ slave in body and soul. *Final Aura: Greatly heals all allies. *Rosy Cradle:\
    \ Summons a storm of sleep-inducing rose petals. *Fascination: Enthralls an opponent\
    \ and steals its life-force. *Giga Blaster: A lightwave explosion that is an enhanced\
    \ version of \"Electro Shocker\" which will annihilate anyone it hits. *Heaven's\
    \ Gate: Opens a gate to a sealed dimension from which there is no escape, consigning\
    \ his foe to oblivion. *Strike of the Seven Stars: Creates seven superheated balls\
    \ of light at the opponent to annihilate them. *Testament: Uses the deepest mystery\
    \ to convert its mortal life into a new Big Bang. *Darkness Wave/Bat Blitz: Unleashes\
    \ a wave of dark red bats with purple cyclone or fire bats that burn opponent\
    \ to a crisp. This move burns the body and soul directly. *Poison: This skill\
    \ includes multiple attack modes\uFF1ASummons a magic circle, Attacks with energy\
    \ breath, Release a heart-shaped"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
