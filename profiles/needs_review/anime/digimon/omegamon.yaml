    - field: weaknesses
      value: "Nothing notable Notable Attacks and Techniques: Overwrite: All Digimon\
        \ can rewrite their data, the more emotional the Digimon is, the more violent\
        \ the overwrite becomes. Base, Supreme Cannon (Garuru Cannon): Blasts the\
        \ opponent with projectiles that approach absolute zero from the cannon attached\
        \ to its right arm. It also used incendiary blasts in the movie to kill well\
        \ over a million Diaboromon (a Mega-level Digimon powerful enough to easily\
        \ defeat both WarGreymon and MetalGarurumon, albeit weakened by creating so\
        \ many clones) in four shots., Transcendent Sword (Grey Sword): Slashes with\
        \ the invincible Grey Sword with incredible force. A single swipe is powerful\
        \ enough to reflect an omnidirectional attack from Diaboromon, a Mega level\
        \ Digimon who dominated both WarGreymon and MetalGarurumon., Blaster Blade:\
        \ Launches forward and impales the enemy with his sword., Royal Slash: Fills\
        \ its blade with holy power and slashes the opponent., Ultimate Uppercut:\
        \ Uses the Grey Sword to send the enemy in the air then repeatedly blasts\
        \ them with the Garuru Cannon., Omega Blast: Gathers light in the Grey Sword\
        \ and swings it in the enemy's direction, Royal Blizzard: Freezes the opponent\
        \ and the area by summoning a severe ice storm., 'Royal Cannon: Fires 5 destructive\
        \ balls of light., Acceleration Boost: Doubles the power of his next attack.,\
        \ Omega Inforce: It's Omegamon's exclusive innate Override Sequence that grants\
        \ him great power and lets him see the immediate future. It also lends him\
        \ unlimited stamina, allowing him to fight at peak capacity no matter what.\
        \ This ability allows him to always stay one step ahead of the opponent. It\
        \ is this ability that makes Omegamon a theoretically insurmountable opponent.,\
        \ All Delete: Taps into the Omega Inforce to raise the power of the Grey Sword\
        \ to the limit. According to the reference book, opponents attacked in this\
        \ way are not slashed, thus ignoring durability and erasing the existence\
        \ of those destroyed by this attack. This attack is also powerful enough to\
        \ erase entire Digital World., Power Null: A thought that nullifies the opponents'\
        \ special abilities. Merciful Mode, perform a multi-hit and long-range attack.,\
        \ Holy Flame: Strikes the opponent with the light energy of all justice, instantaneously\
        \ erasing their form., Apocalypse: Calls down energy bolts from the heavens\
        \ to strike opponents., Hermit Fog: Sprays forth a cold mist that corrodes\
        \ anything it touches., Starlight Explosion: Causes it to rain golden grains\
        \ that are said to purify all of the wickedness of those who suffer this technique\
        \ or causes an explosion of light., Shadow Wing: Unleashes a vacuum blade\
        \ at super-speed, its true shape cannot be confirmed, and it can only be seen\
