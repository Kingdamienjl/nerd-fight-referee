        \ shaped like a bird., Arctic Blizzard: Momentarily brings the surrounding\
        \ atmosphere to absolute zero, then smashes the frozen enemy., Forbidden Temptation:\
        \ Beautifully destroys the opponent's data in a shower of innumerable rose\
        \ petals., Thorn Whipping (Thorn Whip): Tames a Digimon, no matter how frenzied,\
        \ Final Aura: Greatly heals all allies., Rosy Cradle: Summons a storm of sleep-inducing\
        \ rose petals., Fascination: Enthralls an opponent and steals its life-force.,\
