- id: claim-powers-and-abilities-2d89602d
  section: abilities
  axis: hax
  text: '*Digimon Physiology (High Tier) & Data Manipulation (17 Layers) *Flight *Precognition
    (Can work on those with Type 4 Acausality) *Fire Manipulation *Ice Manipulation
    (Can shoot out frigid rounds at a temperature of Absolute Zero from the Garuru
    Cannon) *Enhanced Senses (able to track people across the world and other dimensions)
