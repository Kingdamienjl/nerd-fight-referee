    - field: intelligence
      value: Even while having been driven insane, Chocomon is a skilled combatant,
        easily defeating flamedramon and later casually fighting three DigiDestined
        and Wallace's Gargomon simultaneously. He's proficient at both melee and ranged
        combat, and dodges attacks with various acrobatic maneuvers. He also proved
        to be cunning, using his regeneration and teleportation ability to outmaneuver
        Magnamon and Rapidmon, appearing behind the two and swallowing them both.
        However, his corruption has left him in a tortured state, leading him to want
        to die to find freedom from his torment.
