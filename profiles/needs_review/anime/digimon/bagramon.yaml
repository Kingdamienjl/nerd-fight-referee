    - field: intelligence
      value: 'High, orchestrated the events of the entire show and stumped Leopardmon,
        the Royal Knights'' Chief Tactician, by manipulating the fight in order to
        create ZeedMilleniummon who absorbed several members of the Royal Knights.
        In addition, he forced the hand of the heroes so that they would be unable
        to defeat him without DigiXrossing/Digifusing into one being. Finally, it''s
        virtually impossible to hide from or deceive him, as his Ruby Eye allows him
        to view anyone he wishes. He also managed the events of the sequel series,
        calling in heroes from previous shows in the franchise to lend much needed
        assistance. Notable Attacks and Techniques: Overwrite: All Digimon can rewrite
        their data so that they are able to react to various situations that were
        once problematic for it. This usually causes a gigantic increase in power
        and sometimes new skills and resistances are gained. However, the more emotional
        the Digimon is, the more violent the overwrite becomes. Bagramon * Astral
        Snatcher: Bagramon rips his living opponent''s soul from its body, allowing
        Bagramon to manipulate it as he pleases, sending it to Heaven or Hell or even
        implanting it in another being. * Super-Dimensional Storm: Generates a dimensional
        storm anywhere within the Digital World through which it stretches its right
        arm to attack the opponent. DarknessBagramon * God of Death Snatcher: A more
        powerful version of Astral Snatcher that also allows him to tear the opponent''s
        soul from their body, be they alive or dead. * Bale-Fire Eyes: Unleashes its
        fathomless power from its eyes to reduce his surroundings to nothingness.
        * Eternal Darkmare: Flaps his wings to instantly destroy his opponent''s data,
        preventing reincarnation or regeneration. * Terra Infusion: Absorbs the surrounding
        land and space-time to strengthen himself. *Chrono Breaker:: Wears away its
        foe''s bodies by stopping time or erasing it. This has shown to work on 6-Dimensional
        Immeasurable beings. *Idle Bubble: Launches a bubble that puts the foe to
        sleep immediately. *Cog Crusher/Darkness Gear: Shoots out black cogs that
        can control opponents they''re embedded in. *Command Input: Releases a stream
        of data. *Crash Device: Explodes or runs into the enemy to electrocute them.
        *Dark Fire: Sends a ball of fire made from the flames of the abyss (Dark Area)
        at the opponent.'
      source_id: mediawiki-281847
      provider_id: vsbattles
      authority: high
      confidence: 0.75
