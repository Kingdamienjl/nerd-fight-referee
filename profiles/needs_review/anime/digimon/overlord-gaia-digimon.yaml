- id: claim-powers-and-abilities-d78f71cc
  section: abilities
  axis: hax
  text: '* Digimon Physiology (High Tier) & Data Manipulation (13 Layers) * Energy
    Projection * Enhanced Reactive Evolution (Overlord Gaia and its summons react
    accordingly to their environment as they did with the cyberspace, Gaia''s evolutionary
    program makes him the ultimate being of thought and allows him to react and evolve
    to nearly every scenario. Designed to superior to Digimon who can perform the
    Overwrite) * Power Nullification (Existing in the cyberspace nullifies your capability
    to escape it and potentially other abilities. Can conceptually sever your capability
    of using powers along with bonds) * BFR (Capable of trapping the tamers in the
    cyberspace where they are only capable of existing with the help of the matrix.
    Without the matrix, they would cease existence in that realm and be trapped forever)
    * Subjective Reality (They are no longer their "real selves" and are now literally
    an existence in a dream) * Creation (Created the cyberspace and its environment,
    superior to the Guardians who created Digimon types) * Fusionism (Capable of fusing
    himself with the opponent to become the ultimate being and have full control)
    * Statistics Reduction (Of others; The Infant Ray is capable of lowering the attacking
    capabilities of others, and the Destabilizer Ray drastically reduces one''s defenses)
    * Information Analysis * Madness Manipulation & Empathic Manipulation (Overlord
    Gaia existing drove the Digimon in the cyberspace completely wild and had to be
    destroyed for them to go back to normal) * Summoning (Of the Chaos Generals and
    Chaos Lord), Power Bestowal * Acausality (Type 1; Had Overlord Gaia''s data bugs
    not been fixed, he would''ve been unnaffected by the cyberspace being reset by
    the backup file) * Danmaku * Conceptual Manipulation (Type 1) (Superior to and
    governs the reality of the Guardians, who are capable of creating the very concept
    of certain Digimon types and being in charge of them, manipulating them and their
    properties to their will. The Guardians have such control over these concepts
    that they are responsible for the ability of taming and fighting along these Digimon
    even managing to exist) * Self-Destruction'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
