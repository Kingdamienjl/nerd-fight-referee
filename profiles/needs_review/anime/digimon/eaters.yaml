- id: claim-weaknesses-32e99726
  section: weaknesses
  axis: weakness
  text: Despite being powerful, the Eaters have certain weaknesses that are exploited
    during the Cyber Sleuth narrative that limit them. Most important is the original
    nature of the Eaters, they are harmless beings. All the bad things they did in
    the games were the result of corruption from the human soul and if it weren't
    for that they wouldn't have done any of it. And at the end of Cyber Sleuth they
    are reformatted to return to their harmless state, which means that nowadays the
    Eaters pose no real danger. Not only that, but even during their corruption they
    were being neutralized by Yuugo, which prevented them from causing great damage,
    for example the destruction of the world, though in time he would lose control
    over it. In this way Eaters, while retaining their assimilation functions, do
    not evolve into something more dangerous while retaining their original, albeit
    distorted, functions. In addition to these natural weaknesses of the Eaters, there
    are also the weaknesses of those that the Eaters absorb. Naturally, the power
    and potential of the Eaters is limitless, and those who hold their power (Like
    Human-fused Eaters) could do anything, but humans reject the infinite power of
    the Eaters to an instinctive level, which limits their capabilities.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
