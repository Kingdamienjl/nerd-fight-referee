    - field: weaknesses
      value: 'Desperado Blasters: Paildramon fires energy bullets from both blasters
        like a machine gun., Cable Catcher: Paildramon fires off his claws with wires
        attached to them to repeatedly stab them at a distance or to bind them with
        the cables., Elemental Bolt/Electric Bolt: Paildramon launches a lightning
        bolt as his enemy., Sting Strike: Paildramon extends the spikes on his arms
        into lances before attempting to thrust them at his opponent., Spiking Finish:
        Skewers the opponent with the spikes on both his arms, or hits them with a
        powerful flying kick. This attack bypasses Physical defenses., Hell Squeeze:
        Uses his antennae to absorb the enemy''s energy, or summons winds to attack
        the enemy, or unleashes a flurry of kicks., Sticky Net: Shoots a net of webbing
        to trap the foe.Digimon Reference Book: Wormmon, Silk Thread: Shoots a strand
        of needle-like silk thread.Digimon Reference Book: Wormmon, Pincone: Throws
        a hard, pinecone-shaped object at the enemy.Digimon Reference Book: Minomon,
        Vee Laser: Shoots an intense laser beam in the shape of an X from its chest
        towards the adversary.Digimon Reference Book: ExVeemon, Vee Headbutt: Attacks
        with an intense headbutt.Digimon Reference Book: Veemon, Bunbun Punch: Swings
        both of his arms in circles, striking the opponent.Digimon Reference Book:
        Veemon, Positron Laser: Fires a huge blast of positronic energy from the Positron
        Laser on his back to annihilate the target., Splendor Blade: Slashes at his
        enemies with blades of energy made within the "spikes" on his arm armor.,
        Mega Death: Fires concentrated dark matter from its mouth or cannon that has
        an amazing blast radius swallowing everything in a dark space. This technique
        is a terrifying ability that is stated to erase everything within range, Giga
        Death: The Positron Laser either extends from his chest-mouth and fires white
        spheres of dark matter, or is held in its hands and fires a more powerful
        blast. It has ten times the blast radius and power of Mega Death., Ion Blaster:
        Releases an emitter from his chest that charges a bolt of energy that explodes.,
        Hyper Prominence: Launches a huge ball of black electricity from its chest
        and explodes on contact with its enemy, upgraded form of the Ion Blaster.,
        Omega Blade: Imperialdramon cleaves the opponent in half with the Omni Sword,
        completely resetting and clearing their configuration data, effectively wiping
        out their material being, and soul in addition to ignoring the target''s durability.
        This technique is also used to manipulate one''s characteristics and wiping
        the opponent clean of any resistances or powers. Essentially wiping the opponent
        clean. It can be used in more lenient ways as well, dissolving Armageddemon
        into the millions of Kuramon that formed it to be absorbed back into the Digital
        World through the cell phones of those present. It also has a chance of turning
        an opponent into a 8-bit sprite and nullifying their powers.'
