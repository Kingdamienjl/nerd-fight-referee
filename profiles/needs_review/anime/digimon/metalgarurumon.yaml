- id: claim-weaknesses-198eaf05
  section: weaknesses
  axis: weakness
  text: 'Wind based Skills and is extremely inexperienced | Fire and Water Based Skills,
    Virus Digimon | Data Digimon | Wind based skills for WereGarurumon | Plant based
    skills as MetalGarurumon Notable Attacks/Techniques *Frothy Spit: Spits out slightly
    accidic bubbles at the opponent. *Heavy Tackle: Charges at the opponent with a
    full body tackle. *Comet Hammer I: Drops large boulders on top of the opponent
    in order to damage them. *Petit Fire/Blue Blaster: Shoots a stream of blue flame
    out of its mouth. *Little Horn: Rams the horn on its head into the foe. *Machine
    Gun Jab: Continual throws punches at the foe. *Drill Horn Special: Jumps into
    the air and attacks with horn by spinning over a long distance. *Burst Flame I:
    Blasts the foe with a burst of fire magic. *Anti-Stun: Heals the Stun status for
    an ally and heals them a little. Can be used to heal its own injuries as well.
    *Sharp CLaw: Slashes the foe with its claws. *Feral Pulse: Passively increases
    speed by 15%. *Saint Knuckle I: Punches the foes with a fist of holy power. *Wolkenapalm:
    Spawns a flame eruption from under the opponent. *Giga Breath: Unleashes a big
    fire ball to burn the foe. *Petit Fire Hook: Punches with its right hand covered
    in Petit Fire. *Howling Blaster: Fires blue, high-temperature flames from its
    mouth. *Subzero Ice Fang: Bites an enemy with icy fangs. *Ice Wall: Breathes out
    a wall of ice to repel attacks. *Speed Charge: Boost his speed by 10%. This can
    stack. *Ice Cannon: Fires balls of ice from its mouth. *Wolf Cry: Howls a powerful
    shockwave. *Grand Rock II: Uses earth magic to encase the foe in stone and cause
    it to explode. *Mega Napalm: Launches fireballs that create pillars of fire. *Nightmare
    Syndrome: Sends out its true form as a black ghost or an orb of darkness. When
    suffering these attacks, opponents have their vital functions brought to a halt.
    Or spits out a cloud of undigested nightmares, drowning the opponent in terror
    or manipulating them. *Raging Beast: An attack that utilizes the power of the
    beast and the earth to damage the opponent and lowering their resistance to earth
    based skills. *Sparkling Thunder: Shoots a powerful bolt of lightning. *Ripping
    Net: An electric attack that paralyzes the target. *Crazy Giggle: Fires a shot
    of pre-eminent light with destructive power from its mouth while laughing. *Fool
    Out: Emits an unbearable discord. *Crazy Smoke: Blows out poisonous smoke. *Crazy
    Turn: Attacks by extending its arms and spinning around. *Destroyer: A passive
    ability that give all its attacks a 10% chance of instantly killing the opponent.
    *Crazy Turn: Attacks by extending its arms and spinning around. *Duplication:
    Can make countless clones of itself to aid it in battle. These clones have weaker
    powers. *Dark Crusher: Uses an arrow of Darkness to destroy any data it touches.
    *Guard Break: Lowers the opponent''s durability by 15%. *Dark Claw: Attacks the
    opponent with claws of darkness. Those hit can be poisoned by the skill. *Androit
    Wisdom: Passively increases the power of magic attacks by 15%. *Sesshouseki: Transforms
    into a stone and releases a poisonous gas. *Koyousetsu: Fires a barrage of sharpened
    leaves at the opponent. *Kohenkyo: This move has many different applications.
    **Copies the opponent''s appearance and all of their abilities. **Switches places
    with them in a whirl of leaves. **Teleports to the enemy and kick them before
    disappearing. **Uses a glowing hand to summon two phantom clones of itself to
    attack the enemy. *Gaia Element I: Blasts the foe with a burst of wood/plant elemental
    magic. *Anti-Panic: A healing technique that not only restores a bit of health,
    but cures mental based confusion. *Small Tornado: Causes a small AoE typhoon to
    damage the opponent. *Grand Cross: Slashes the foe in a cross shape with holy
    power in order to administer justice. This is a weaker version of the signature
    move of Lucemon. *Light Coat: Uses the power of light to raise it and its ally''s
    resistance to holy and light based powers. *Miracle Power: Uses the power of miracles
    for itself. This can be used to increase its attack power as well. *Androit Wisdom:
    A passive ability that increases the power of its magic and resilience to it by
    15%. *Trait-Speed 2: Passively boosts its speed. *Trait-Quick: Passively boosts
    its ability to evade attacks. *Demi Darts: Throws syringes filled with viruses
    at the enemy. This attack also drains life force to heal Garurumon. *Akuma no
    Sasayaki (Evil Whisper): Emits hypnotic waves from its eyes. *Attack Break: Lowers
    the opponent''s Attack Potency by 10%. Can stack. *Panic Wisp: A fire magic attack
    that confuses the opponent. *Nightmare Soldiers: A passive ability that strengthens
    darkness based skills by 15%. *Kaiser Nail: Slashes at the opponent with its powerful
    claws. *Baldy Blow: Punches the enemy with its spiked brass knuckles. *Engetsugeri:
    A powerful kick that can fire a blade of energy at the opponent. *Meteor Fall
    I: Summons a large meteor to crush the enemy and burn'
