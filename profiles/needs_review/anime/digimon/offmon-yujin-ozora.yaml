    Analysis (Is able to hack his opponents and with this can analyze their data structure
    and get information about them) * Durability Negation via Vanquish Claw All previous
    abilities; plus * Digimon Physiology (Mid Tier) & Data Manipulation (10 Layers)
    * Blade Mastery * Power Nullification (Can forcibly terminate the activity of
    those cut with its scissors) * Time Travel, Time Manipulation & Age Manipulation
    (Able to return his opponent''s bodies to the past or advance them in the future.
    Essentially aging or de-aging them. Can arrest his opponents and alter their temporal
    flow thus preventing their movement) * Causality Manipulation (Able to save and
    create backups of data. It is even capable of returning the target back to a previous
    state as long as a backup from that state exists. Capable of stopping, speeding
    up, or even reversing the flow of time of an opponent it has punched) * Memory
    Manipulation (Can see the minds of his opponents as well as their past. Can also
    make them remember their past as well.) Resistance to * Time-Space Manipulation
    All previous abilities; plus * Digimon Physiology (High Tier) & Data Manipulation
    (13 Layers) * Causality Manipulation (Can reset his opponents actions and any
    damage he had taken) * Creation (Can create objects out of nothing as long as
    he has it''s blueprints stored in it''s memory) * Elemental Manipulation * Information
    Analysis (Can analyze his opponents to get information about them and even learn
    their weaknesses) * Can reverse Power Nullification Resistance to * Power Nullification'
  source_ids: *id003
