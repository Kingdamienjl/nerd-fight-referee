- id: claim-weaknesses-6e7b4e6c
  section: weaknesses
  axis: weakness
  text: 'Rika needs to be nearby the battle, which can make her an easy target. When
    Kyubimon or Taomon get seriously hurt, Rika feels the pain. These two weaknesses
    are no longer in effect once Renamon digivolves into Sakuyamon Feats: * Crossed
    several City-Blocks in a matter of a few minutes * Trades blows with Allomon,
    an Armor level (on par with Champions) Digimon * Holds back Guilmon * Defeats
    two Armor level Digimon with ease * Is skillful at Axe fighting * Takes a concrete
    shattering blast point-blank * Beam struggles with Allomon * Survives a blow from
    Megadramon * Tanks at least three lightning bolts at once * Casually wallruns
    * Moves so fast it appears like teleporting * Runs up a skyscraper in no time
    * Can hear Rikas screams for help through a forest * Causes a sizable explosion
    with her Diamond Storm attack * Impeccable Aim * Knocks Beelzemon off of Behemoth
    * She can shoot multiple, powerful fireballs at once * Can temporarily become
    a giant flying dragon made of fire * Can deflect Vajramon''s sword swings with
    utter ease * Can hover and fly * Her force-field can keep Planet busting Digimon
    at bay * Her brush can do this * It can also dispel many negative things * She
    can create a large floating platform w/shield * Her Shield can take a lot of damage,
    also notice how calm she is * Her shield can easily tank an onslaught of Zhuqiaomon''s
    fire * She can keep pace with Zhuqiaomon while in her shield, too, so it doesn''t
    impede her movement * She can also fire countless small bombs, they''re pretty
    weak though * Dodges a storm of enemy attacks * She shows great dexterity * Caused
    great harm to the REAPER * To show how much stronger than Taomon she is, she was
    able to defeat three ADR-03 in a single shot, a single ADR-03 was able to defeat
    Taomon, Rapidmon and Wargrowlmon at once! * Creates a barrier even stronger than
    that of Taomon''s * She can make it large enough to fit Megagargomon, too'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
