    evolutions usually retain the noble personality and intellect of their Champion
    form while furth maturing mentally, with Heavy Leomon, despite brimming with passionate
    fighting spirit, being noted to act with composure while analyzing its enemies
    or carrying out rescue operationsDigimon Reference Book; Heavy Leomon.) **Mad
    Leomon: Instinctive to Average (The species is known to be berserks that, through
    repeated modification, lost its intelligence while enhancing its combat instinct.
    Having lost their consciousness, they are known to just be puppets that defeat
    those standing before it as commanded and will act heedless of traps or gadgetsDigimon
    Reference Book; Mad Leomon. Their further modified form, Armed Mode, is known
    to be even more of a berserker due to the modifications causing constant intense
    pain, being unable to stand still and seeing anything as a enemyDigimon Reference
    Book; Mad Leomon: Armed Mode. Some individuals can retain their intelligence and
    consciousness like some SkullGreymon and Skull Baluchimon.) *Elecmon: Although
    the species doesn''t have a notable combat prowess, their capable fighters that
    rely on their abilities, generally electricity-based techniques being their go-to
    in battle, to overwhelm the enemies. **Leomon to Dinotigermon: The species are
    notably capable warriors, being adept at both swordsmanship and close combat.
    They are the rival of the Ogremon speciesDigimon Reference Book; Leomon, fighting
    evenly with the highly intelligent Digimon that are known to fight and defeat
    more powerful opponents then themselvesDigimon Reference Book; Ogremon. As Leomon
    X, they''ve mastered swordsmanship to defeat more fiendish enemies to enforce
    their justiceDigimon Reference Book; Leomon X. Panjyamon are a matured form of
    Leomon, being stated to have mastered the way of the warrior on the battlefieldDigital
    Monster Card Game - Booster 16~The True Super-Fusion Warriors (THE MAJESTIC HYBRID
    WARRIOR)~; Bo-769. As Panjyamon X, it is adept at using its axe and is known to
    unparalleled in their ruthlessness toward evilDigimon Reference Book; Panjyamon
    X. **Mad Leomon: Those that have lost their sense of selves no longer have the
    intellect and combat skills from Leomon, being known for a meager and primitive
    fighting style, such as hitting and kicking, and recklessly attacking the opponentDigimon
    Reference Book; Mad Leomon. Individuals that retain their consciousness can better
    put their enhanced combat instincts and form to better use, likely being more
    fierce fighters than the regular Leomon. **Grappu Leomon to Heavy Leomon: Grappu
    Leomon is an evolution formed from Leomon enduring countless battles and absorbing
    data from various fighting games, giving rise to this grappler who has discovered
    various secret techniquesDigimon Jintrix Set 3; 3-009. Heavy Leomon are known
    to analyze the opponent and act with composure despite brimming with fighting
    spirit, it achieves victory steadily with tactics that leave no openings by skillfully
    using the weaponry on its body to cover long, mid, and close-range combatDigimon
    Reference Book; Heavy Leomon.'
