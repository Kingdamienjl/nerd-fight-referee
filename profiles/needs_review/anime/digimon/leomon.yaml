        the noble personality and intellect of their Champion form while furth maturing
        mentally, with Heavy Leomon, despite brimming with passionate fighting spirit,
        being noted to act with composure while analyzing its enemies or carrying
        out rescue operationsDigimon Reference Book; Heavy Leomon.) **Mad Leomon:
        Instinctive to Average (The species is known to be berserks that, through
        repeated modification, lost its intelligence while enhancing its combat instinct.
        Having lost their consciousness, they are known to just be puppets that defeat
        those standing before it as commanded and will act heedless of traps or gadgetsDigimon
        Reference Book; Mad Leomon. Their further modified form, Armed Mode, is known
        to be even more of a berserker due to the modifications causing constant intense
        pain, being unable to stand still and seeing anything as a enemyDigimon Reference
        Book; Mad Leomon: Armed Mode. Some individuals can retain their intelligence
        and consciousness like some SkullGreymon and Skull Baluchimon.) *Elecmon:
