- id: claim-weaknesses-7b32d9a6
  section: weaknesses
  axis: weakness
  text: 'Darkness based skills. Data Digimon Notable Attacks/Techniques: * Heaven''s
    Knuckle: Gathers holy power in its fist and shoots a beam of holy light from it.
    * God Typhoon: Spins its Holy Rod or both itself and the Holy Rod to create a
    tornado. * Holy Shot: Fires a bullet of holy energy from its spinning rod. *Shining
    Laser: Summons large pillars of holy light from below the opponent to deal damage.
    *X-Heal: Heals himself or an ally. *Celestial Cross: Slashes the foes with Holy
    Power in order to administer justice. *Nightmare Syndrome: Sends out its true
    form as a black ghost or an orb of darkness. When suffering these attacks, opponents
    have their vital functions brought to a halt. Or spits out a cloud of undigested
    nightmares, drowning the opponent in terror or manipulating them. *Purification:
    Heals itself and allies as well as getting rid of any status effects. *Attack
    Break: Lowers the opponent''s Attack Potency by 10%. Can stack. *Panic Wisp: A
    fire magic attack that confuses the opponent. *Demi Darts: Throws syringes filled
    with viruses at the enemy. This attack also drains life force to heal Angemon.
    *Akuma no Sasayaki: Emits hypnotic waves from its eyes. *Night of Fire: Shoots
    flames of darkness from its hand. *Dash Night of Fire: Shoots flames of darkness
    while running. *Dark Fire: Sends a ball of fire made from darkness at the opponent.
    *Kuuchuu Night of Fire: Shoots flames of darkness while jumping through the air.
    *Machine Gun Kick: Strikes with small continuous mid-air kicks. *Dark Song: Screams
    to lure the enemy to death or release darkness that stuns them. *Pillar of Fire:
    Creates a wall of flames. *Night of Blizzard: Attacks the enemy using a dark blizzard
    or shards of ice. *Summon: Summons spirits of fire and/or ice, sometimes combining
    them to create a ball of ice and fire or a sphere of darkness to shoot at the
    enemy. *Idle Bubble: A magic water attack that puts the foe to sleep. *Nightmare:
    Blast the foe with Dark Energy. *Flash Ray: Unleashes a flash of light that causes
    confusion. *Sonic Void: Blasts the foe with a burst of wind. *Comet Hammer: Drops
    a bunch of boulders on top of the opponent in order to crush them. *Venom Trap:
    A plant based attack that instantly poisons the opponent, draining their life
    with every movement until they die. * Heaven''s Gate: Opens a portal to another
    dimension that sucks in the enemy and seals them away, or blasts the enemy with
    light from the gate. * Excalibur: Extends its energy sword on its right arm and
    attacks. * Heaven''s Heal: Heals injuries to self and allies. * Holy Desinfection:
    Cures cursed status ailments on allies. * Soul Banish: Glows with holy energy
    before either firing one or more energy blades or unleashing a powerful kick.
    * Judgment Slash: A single sword strike that destroys evil. * Flying Sword of
    Justice:Rushes forward through the air to stab with its outstretched Excalibur.
    * Shield Counter: Blocks an incoming attack with its beam shield, following up
    with a sword slash. * Holy Jump: Uses holy power to launch straight up into the
    sky. * Excaliburst: Powers up the Excalibur and then slices the enemy. * Shield
    Strike: Rams the opponent with its beam shield. *Chrono Breaker:: Wears away its
    foe''s bodies by stopping time or erasing it. *Cog Crusher: Shoots out black cogs
    that can control opponents they''re embedded in. *Hell''s Hand: Drags the enemy
    all the way to the Dark Area. *Death Charm: Casts an evil spell of darkness that
    washes over the enemy and saps away its life. *Nightmare Wave: Emits a dark wave
    that hypnotizes the enemy, amplifying their doubts and driving them mad. *Poison
    Breath: Blows out a poisonous smoke. *Dark Crusher: Releases an arrow of darkness
    that instantly destroys any data it hits. *Blue Flare Breath:Breathes searing
    sapphiric flames that decomposes the data it hits. *Shooting Star: Creates a void
    of space and sends down shooting stars. *Thunder Cloud: Summons a thunder cloud,
    which unleashes an intense lightning strike. *Thunder Ball: Throws an electric
    ball from its hand. *Magic Game: Releases blue lightning or turns itself invisible.
    *Terror Illusion: Exploits the enemy''s fears. *Blink Breeze: Creates a blast
    of wind. *Cat''s Eye Hypnotism: Hypnotizes the enemy with mysterious power from
    its eyes, causing them to attack themselves. *Atomic Burst: Wraps its body in
    light, like a barrier and then charges into the opponent. Those who suffer this
    technique are disassembled into digital data composed of "0"s and "1"s, the smallest
    units of data, and never return to their original state. *Miracle Creation: Due
    to the properties of the Digi-Egg of Miracles, Crowmon has a miraculous ability
    to overcome any predicament placed before it, thus enacting a "miracle" as the
    origin its power implies. As a result, a series of coincidences will occur that
    will guarantee Peacockmon''s victory no matter what odds it faces. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== Category:Characters Category:Digimon
    Ca'
