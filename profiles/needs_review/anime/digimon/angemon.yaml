        and sends down shooting stars. *Thunder Cloud: Summons a thunder cloud, which
        unleashes an intense lightning strike. *Thunder Ball: Throws an electric ball
        from its hand. *Magic Game: Releases blue lightning or turns itself invisible.
        *Terror Illusion: Exploits the enemy''s fears. *Blink Breeze: Creates a blast
        of wind. *Cat''s Eye Hypnotism: Hypnotizes the enemy with mysterious power
        from its eyes, causing them to attack themselves. *Atomic Burst: Wraps its
