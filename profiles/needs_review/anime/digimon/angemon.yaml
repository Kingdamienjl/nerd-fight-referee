    the forms of time stop and destruction) * Metal Manipulation * Spatial Manipulation
    * Water Manipulation * Memory Manipulation * Invisibility * Duplication (Inherited
    from Keramon. Can create countless clones of itself in mere moments, although
    their abilities are weaker than the original) * Probability Manipulation (Those
    who acquire the power of the Digimental of Miracles, no matter what kind of predicament
