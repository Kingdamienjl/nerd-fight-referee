        the foes with Holy Power in order to administer justice. *Nightmare Syndrome:
        Sends out its true form as a black ghost or an orb of darkness. When suffering
        these attacks, opponents have their vital functions brought to a halt. Or
        spits out a cloud of undigested nightmares, drowning the opponent in terror
        or manipulating them. *Purification: Heals itself and allies as well as getting
        rid of any status effects. *Attack Break: Lowers the opponent''s Attack Potency
        by 10%. Can stack. *Panic Wisp: A fire magic attack that confuses the opponent.
        *Demi Darts: Throws syringes filled with viruses at the enemy. This attack
        also drains life force to heal Angemon. *Akuma no Sasayaki: Emits hypnotic
        waves from its eyes. *Night of Fire: Shoots flames of darkness from its hand.
        *Dash Night of Fire: Shoots flames of darkness while running. *Dark Fire:
        Sends a ball of fire made from darkness at the opponent. *Kuuchuu Night of
        Fire: Shoots flames of darkness while jumping through the air. *Machine Gun
        Kick: Strikes with small continuous mid-air kicks. *Dark Song: Screams to
        lure the enemy to death or release darkness that stuns them. *Pillar of Fire:
        Creates a wall of flames. *Night of Blizzard: Attacks the enemy using a dark
        blizzard or shards of ice. *Summon: Summons spirits of fire and/or ice, sometimes
        combining them to create a ball of ice and fire or a sphere of darkness to
        shoot at the enemy. *Idle Bubble: A magic water attack that puts the foe to
        sleep. *Nightmare: Blast the foe with Dark Energy. *Flash Ray: Unleashes a
        flash of light that causes confusion. *Sonic Void: Blasts the foe with a burst
        of wind. *Comet Hammer: Drops a bunch of boulders on top of the opponent in
        order to crush them. *Venom Trap: A plant based attack that instantly poisons
        the opponent, draining their life with every movement until they die. * Heaven''s
        Gate: Opens a portal to another dimension that sucks in the enemy and seals
        them away, or blasts the enemy with light from the gate. * Excalibur: Extends
        its energy sword on its right arm and attacks. * Heaven''s Heal: Heals injuries
        to self and allies. * Holy Desinfection: Cures cursed status ailments on allies.
        * Soul Banish: Glows with holy energy before either firing one or more energy
        blades or unleashing a powerful kick. * Judgment Slash: A single sword strike
        that destroys evil. * Flying Sword of Justice:Rushes forward through the air
        to stab with its outstretched Excalibur. * Shield Counter: Blocks an incoming
        attack with its beam shield, following up with a sword slash. * Holy Jump:
        Uses holy power to launch straight up into the sky. * Excaliburst: Powers
        up the Excalibur and then slices the enemy. * Shield Strike: Rams the opponent
        with its beam shield. *Chrono Breaker:: Wears away its foe''s bodies by stopping
        time or erasing it. *Cog Crusher: Shoots out black cogs that can control opponents
        they''re embedded in. *Hell''s Hand: Drags the enemy all the way to the Dark
        Area. *Death Charm: Casts an evil spell of darkness that washes over the enemy
        and saps away its life. *Nightmare Wave: Emits a dark wave that hypnotizes
        the enemy, amplifying their doubts and driving them mad. *Poison Breath: Blows
        out a poisonous smoke. *Dark Crusher: Releases an arrow of darkness that instantly
        destroys any data it hits. *Blue Flare Breath:Breathes searing sapphiric flames
