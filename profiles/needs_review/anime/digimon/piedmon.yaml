    - field: intelligence
      value: True to his nature as a clown, Piedmon is a trickster by nature. He fights
        pragmatically, attempting to steal the Crests before the DigiDestined could
        use them and teleporting around his opponents before turning them into helpless
        keychains. He is also skilled in close-combat, easily fighting WarGreymon
        and MetalGarurumon on even ground. However, due to his nature as a sadist,
        he becomes overconfident when he has the upper hand and becomes sloppy, allowing
        T.K. to get the Crest of Hope to Digivolve Patamon into MagnaAngemon.
      source_id: vsbattles-piedmon-anime
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Something of a sadist and like to fool around with his opponents due
        to his nature as a clown, somewhat overconfident when he has the upper hand.
        Vaccine Digimon. It is possible to deceive Piedmon in Masks Square if you
        register false commands in your mind. Piedmon is heavily weak against Holy
        powers. Notable Attacks/Techniques: *Clown Trick: This attack has been used
        to cover several attacks: **He throws a giant tablecloth at the opponent.
        If it touches the opponent it transforms them into a key chain. **Conjures
        a ring of fire to attack opponents **Creates a large ball and has it come
        out of the ground beneath the opponent to trip them up. **Disguises himself
        (made himself look like a normal clown in Episode 40) **Reflects an opponent''s
        attack back. *Ending Snipe: Emits electricity from both hands to electrocute
        his opponents. *Final Spell: Generates a massive explosion wide enough to
        cover several city blocks *Mask''s Square: Creates a field in which all communications
        can be read by Piedmon and allows it to teleport itself and its attacks anywhere
        at will. Piedmon''s Reality Warping is heavily strengthened in this realm
        and he has complete control over the realm. Masks Square also allows him to
        read his opponent''s mind as well as listen to every conversation. He can
        also control his opponent''s body, preventing them from even attacking. *Trump
        Sword: Piedmon flings his four swords at his opponent to skewer them. When
        he gets serious he creates illusionary swords to distract foes from the real
        ones before teleporting them into the target directly. *Toy Wonderness: Creates
        powerful gusts of wind with a swipe of his hand. *Texture Blow: Forcefully
        turns the opponent into a sprite while nullifying their abilities. *Destruction:
        A darkness based attack that has a chance of instantly killing the opponent.
        Note: For more detailed information on Masks Square see this blog ==Notable
