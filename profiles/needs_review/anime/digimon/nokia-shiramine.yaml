  intelligence:
    text: Nokia unfortunately comes off as air-headed, ditzy and dumb to most people
      she meets. However, for those who look deeper, or have known her for long enough,
      they know that this isn't exactly the case. She has proven herself to be a great
      leader, who truly inspires people. She is also a fantastic tactician, being
      arguably superior to even Takumi due to defeating the Self-Proclaimed legend
      (someone who Takumi couldn't even touch). As for her partner Digimon, Agumon
      and Gabumon, they are also fairly smart. While they're childishly naive and
      no next to nothing about humans, they're not dumb. As they grow and digivolve,
      their experience improves dramatically. By the end game, they're capable warriors.
    source_ids:
    - vsbattles-nokia-shiramine-digimon
    confidence: 0.6
    notes: auto_repair source extraction
