  intelligence:
    text: Above Average. Jou has a strong sense of responsibility, in addition to
      being the oldest of the group. He acts as the voice of reason and tries, often
      without success, to steer the other Chosen Children away from danger and find
      a safer way. Joe has practical knowledge of first aid and astronomy. He came
      up with a plan to weaken a powerful Bakemon with by chanting a sutra, successfully
      weakening the Ghost Digimon to the point Ikkakumon and Birdramon could defeat
      it. After his adventure in the Digital World he dedicated himself to studying
      to become a doctor, succeeding in becoming a doctor for Digimon as an adult.
      | Average, Above Average in Combat and with evolution. While Gomamon is childlike,
      he shown to be innately capable fighter that upon evolution into Rookie worked
      with his allies to fight a Kuwagamon. His intellect and combat ability is improved
      with each evolution. He is an more fierce fighter as Ikkakumon and even more
      so as Zudomon, the later of which is skilled with a hammer. As Vikemon he is
      at his peak in maturity and battle capability, being of a species known for
      leading armies of Digimon and governing frozen lands.
    source_ids:
    - vsbattles-gomamon-jou-kido-digimon
    confidence: 0.6
    notes: auto_repair source extraction
