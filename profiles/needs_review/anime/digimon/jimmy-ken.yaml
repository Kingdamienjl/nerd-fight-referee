    - field: attack_potency
      value: Wall level (Can pulverize a marble column with only a few punches. Defeated
        Russell Northrop, who tanked an explosion strong enough to level a metal gate.
        Faced off against an entire football team of jocks, all of which should be
        comparable if not superior to Dan Wilson (who survived a firecracker explosion),
        and came out on top. Traded blows with enemies capable of harming him. His
        battle with Gary destroyed several metal platforms. Can severely mess up cars,
        dent metal, and smash large windows to pieces with his strikes. Stronger than
        Hal and Norton, who can both tip large trees over, and Norton in particular
        can swing a massive hammer around to smash Jimmy through a wall of wooden
        planks, which generates this much energy. Can rip off metal doors and lead
        pipes from walls. Collapsed a small, fragile house-like structure by repeatedly
        punching it. Can send people flying with his strikes), Higher with weaponry
        (Does far more damage. Firecrackers and Spud Guns can pulverize a marble column
        in one hit instead of requiring two strong punches. His Super Slingshot can
        knock out police officers within four headshots, and prefects with two, with
        both groups normally being capable of one-shotting students and surviving
        many hits from Jimmy's weapons. A single headshot from his Spud Gun can also
        one-shot prefects)
