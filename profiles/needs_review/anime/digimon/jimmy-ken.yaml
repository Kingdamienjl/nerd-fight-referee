      value: Superhuman Physical Characteristics, Genius Intelligence, Accelerated
        Development (In just the span of 1 class session, Jimmy instantly developed
        useful skills, such as charming people, defusing aggressive situations, improving
        his weapon accuracy, buffing his strength by boxing people, building the best
        bike, and tracking down the locations of collectibles. He taught himself how
        to box simply by entering a tournament and defeating all of his opponents,
        in spite of them having a huge advantage by having years of experience. And
        even early on when he wasn't using any of his weapons on a daily basis, he
        quickly learned how to use a slingshot by knocking out the football team,
        despite all of them wearing protective headgear), Martial Arts (Skilled in
        close quarters combat. Knows "real classified" martial arts techniques from
        a Korean War veteran. Defeated the Preps in boxing, who have far more years
        worth of training than him. Learned some wrestling moves. Capable of disarming
        his opponents), Weapon (Proficient at utilizing all the weapons in the game,
        which ranges from simple baseball bats to even bottle rocket launchers and
        potato guns. So skilled with the Super Slingshot that he used it to knock
        out Greasers during a high-speed bike chase across town while getting explosives
        tossed at him), Vehicular (Expert at riding a bike, moped and go-kart. Won
        in a bike race against Johnny Vincent and other Greasers), and Stealth Mastery
        (Sneaked into a mental asylum on two occasions without getting detected and
        with no prior planning; was also able to disguise himself as an orderly in
