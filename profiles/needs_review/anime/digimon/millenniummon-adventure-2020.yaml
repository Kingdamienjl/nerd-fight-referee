- id: claim-weaknesses-62d03d41
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Freeze Fang: Bites an enemy with
    icy fangs.St-234 *Touch of Evil/Death Claw: He can stick his arm into the ground
    and have it appear from behind the opponent, grabbing them and allowing Devimon
    to brainwash them. He can also simply extend his arm and pierce the opponent to
    brainwash them. This skill can also paralyze the opponent. Finally this attacks
    can also be used to drain his opponent''s life force.Digimon Reference Book; Devimon
    *Mega Flame/Nova Blast: Fires a gigantic ball of flame from its mouth at the opponent.Digimon
    Reference Book; Greymon *Heat Viper: Shoots heat rays from its mouth or four hands.
    Even if an opponent tried to dodge this, the shock-waves of this attack would
    knock them to the side.Digimon Reference Book; Chimairamon/Kimeramon *infinity
    Cannon: Fires Mugendramon''s Infinity Cannon.Digimon Adventure 2020; Episode 50
    *Time Unlimited: Forms a black orb in its mouth that, when fired, creates another
    dimension in which the time is compressed, sealing the target inside for all eternity
    on contact.Digimon Adventure 2020; Episode 49 *Dimension Destroyer: After trapping
    an opponent with Time Unlimited, he collapses the entire dimension he created
    via biting it with his fangs to destroy them.Digimon Adventure 2020; Episode 50
    *Black Lighting: Generates lightings of darkness that can make Digimon go berserk
    or controls them.Digimon Adventure 2020; Episode 28 *Death Crystal: Tears his
    enemy''s soul to pieces with an incorporeal attack, making it impossible to defend
    against.Digimon Reference Book; MoonMillenniummon *Time Destroyer: Consigns hostile
    opponents to oblivion across space and time. So far, no one who has been brushed
    off by this technique has returned alive from space and time.Digimon Reference
    Book; Zeed Millenniummon *Chrono Paradox: Fires two atomic rays from his mouths
    that destroy everything in their pathDigimon Adventure 2020; Episode 50. This
    technique can inflict Death on the opponentDigimon Story Super Xros Wars Red and
    Blue *Reincarnation: Due to the nature of its existence, if its physical body
    should somehow be destroyed it will simply return to being Moon=Milleniummon,
    allowing it to restore its body across time and space and return to being ZeedMillenniummon.Digimon
    Reference Book; MoonMillenniummonDigimon Adventure 2020; Episode 31'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
