  intelligence:
    text: 'Varies among the species. (Meicoomon as an Champion level Digimon should
      possess higher combat skill over Rookie level Digimon. Meicrackmon is noted
      to be a cautious that prefers to avoid conflict, hiding and observing those
      who draw near to see if they are friendly or an enemy. As a fight it should
      possess higher combat skill over Champion level Digimon and based on its techniques
      is a tricky opponent that will likely overwhelm or confuse its enemies with
      copies of itself or incapacitate them with its stinger. Vicious Mode uses its
      exceptional perception and phenomenal feral instincts to not let up until its
      enemies are dead. Nigh-Omniscience via the Kernel as Rasielmon, its connection
      with the Kernel allows it to know all about events throughout the Digital World
      and it has gained a divine amount of knowledge with that powerDigimon Reference
      Book: Rasielmon. When Rasielmon sees a upcoming great disaster it cannot stop
      on its own, it searches and informs those who can, whether directly and indirectly,
      play a role in overcoming the threatDigimon ReArise: Clash Battle! Imperialdramon
      Paladin ModeDigimon ReArise; [SDQ] "Tales of the Little Goblin and Its Friend".
      Raguelmon is a highly skilled fighter that has the role of observer, observing
      other angel Digimon and striking them down should they begin to fall.)'
    source_ids:
    - vsbattles-meicoomon-digimon
    confidence: 0.6
    notes: auto_repair source extraction
