  text: '* Digimon Physiology (Low Tier & Appmon) & Data Manipulation (4 Layers) *
    Expert Hand-to-Hand Combatant * Information Analysis (Can analyze his opponents
    to get information about them and even learn their weaknesses) All previous abilities
    amplified; plus * Data Manipulation (7 Layers) * Energy Manipulation * Sword Mastery
    * Homing Attack * Flight (+Raidramon) All previous abilities amplified; plus *
    Digimon Physiology (Mid Tier) & Data Manipulation (10 Layers) * Extrasensory Perception
    & Precognition (With its ability to locate and process data at high speed Globemon
    is able to predict the near future) * Time Travel, Time Manipulation & Age Manipulation
    (Able to return his opponent''s bodies to the past or advance them in the future,
    essentially aging or de-aging them. Capable of stopping, speeding up, or even
    reversing the flow of time of an opponent it has punched. Can arrest his opponents
    and alter their temporal flow thus preventing their movement) * Causality Manipulation
    (Able to save and create backups of data. It is even capable of returning the
    target back to a previous state as long as a backup from that state exists) *
    Memory Manipulation (Can see the minds of his opponents as well as their past.
    Can also make them remember their past as well) Resistance to * Time-Space Manipulation
    (Naturally has the rare ability to transcend the flow of both time and space)
    All previous abilities amplified; plus * Digimon Physiology (High Tier) & Data
    Manipulation (13 Layers) * Life Manipulation, Creation & Matter Manipulation (Can
    create both organic and inorganic matter) * Mind Manipulation (It has the ability
    to brainwash the target with its skillful speaking, and manipulate them at will)
    * Absorption * Possibly Nigh-Omniscience (Gained wisdom of the entire world) *
    Forcefield Creation'
  source_ids: *id003
  decisive: true
  status: unverified
