    text: Varies among the species. Kudamon as a species is noted for its calm, cool,
      and collected personality, conducting a precise assessment of the situation
      even in combat, and attaining the advantage in battle. Reppamon is a highly
      skilled fighter that prefers to fight within forests, it skillfully employing
      its claws and tail to easily climb trees. While Tyilinmon is noted to be compassionate
      being that detests conflict, it is stated it will inflict merciless punishment
      on those who commit senseless killings. Sleipmon should possess the highest
      wisdom of the evolution line. It is a highly skilled crossbow user that relies
