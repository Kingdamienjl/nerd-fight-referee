- id: claim-powers-and-abilities-cbcd33d8
  section: abilities
  axis: hax
  text: 'Tier: , up to 6-C | 6-C | 6-C | At least 4-C, Possibly Low 1-C | Low 1-C
    | At least Low 1-C Keys: Bakemon | Lord Bakemon | Soulmon | Phantomon | MetalPhantomon
    | Gokumon Name: Bakemon | Lord Bakemon | Soulmon | Phantomon/Fantomon | MetalPhantomon/MetalFantomon
    | Gokumon/Reapermon Origin: Digimon Gender: Genderless Age: Varies Classification:
    Champion level Virus Attribute Ghost Digimon | Champion level Virus Attribute
    Ghost Digimon | Champion level Virus Attribute Ghost Digimon | Ultimate level
    Virus Attribute Ghost Digimon | Ultimate level Virus Attribute Cyborg Digimon,
    X-Antibody Digimon | Mega level Virus Attribute Cyborg Digimon Powers and Abilities:
    * Digimon Physiology (Low Tier & Dark Digimon) & Data Manipulation (8 Layers)
    * Flight * Dimensional Travel, Dimensional BFR & Existence Erasure (With Hell''s
    Hand; Can drag the opponents to the Dark Area where they are erased from existence)
    * Madness Manipulation (Type 2; via Nightmare Wave) * Paralysis Inducement (Via
    Touch of Evil), Death Manipulation (Via Death Charm), Poison Manipulation (Via
    Poison Breath), Mind Manipulation (Via Touch of Evil) * Resistance Negation (Via
    Raging Darkness) * Possession * Fire Manipulation (Via Night of Fire) * Summoning
    (Via Summon, can summon elements of fire, ice and darkness) * Ice Manipulation
    (Via Night of Blizzard) * Water Manipulation & Sleep Manipulation (Via Idle Bubble)
    * Darkness Manipulation (Via Summon) * Teleportation (Via Magic Circle) * Blood
    Absorption (Via Pico Darts) * Mind Manipulation (Via Akuma no Sasayaki) All previous
    abilities amplified; plus * Soul Manipulation & Necromancy (Via Necro Magic) *
    Absorption (Can absorb opponent''s energy via Energy Drain) All previous abilities
    amplified; plus * Digimon Physiology (X-Antibody Carrier) & Data Manipulation
    (12 Layers) * Life Manipulation & Dream Manipulation (MetalFantomon puts his opponents
    to sleep and shows them a nightmare of bottomless despair as he sucks away the
    vitality of their hearts) * Power Bestowal & Telekinesis ([https://imgur.com/a/yPAAxG6
    Metal Fantomon gave Masuken some of his powers and with that he was able to control
    stones with his mind]) * Illusion Creation ([https://imgur.com/a/qvdkZ9T Created
    a false Teru using illusory powers]) * Sound Manipulation (Via Grave Scream) All
    previous abilities except X-Antibody; plus * Digimon Physiology (High Tier) &
    Data Manipulation (14 Layers) * Fire Manipulation * Energy Projection Resistance
    to * Power Nullification (Resists nullification of its special abilities) Attack
    Potency: Unknown, up to Island level (Normally considered to have weak offensive
    power compared to other Champion level Digimon and often loses against Rookie
    Digimon; however stronger individuals of the species can harm Champion Digimon)
    | Island level (Overwhelmed both Birdramon and Ikkakumon) | Island level (It''s
    magic power is noted to be devastatingly strong for Champion level so should be
    equal to if not superior to Meramon. When Devimon first split File Island, he
    was still weaker than 6 Champion Digimon combined and working together) | At least
    Star level (Comparable to Vademon who [https://i.imgur.com/VQszqdV.png had destroyed
    stars], shouldn''t be any weaker than DarkSuperstarmon and Gerbemon who uses supernova
    explosion and [https://imgur.com/a/9pJ1Tmo real black holes] [https://imgur.com/a/QDYciMS
    as attacks]), Possibly Low Complex Multiverse level (Possibly comparable to SkullGreymon
    and Megadramon who can destroy the Digital World, Etemon Chaos who could perform
    the same feat, Paildramon who stopped an explosion that could''ve destroy the
    Digital World, Dagomon who can swallow all dimensions in its deep fog, Canoweissmon
    whose light can reach Digital Worlds of other dimensions and AtlurKabuterimon
    who destroyed Vademon''s mysterious universe. Shouldn''t be weaker than Angemon
    amped by Power of Hope who destroyed WaruMonzaemon''s Inner World and Devimon
    who could make everything in the Digital World dwell into darkness) | Low Complex
    Multiverse level (As a powerful Ultimate, it should be comparable to Megadramon,
    SkullGreymon and Etemon Chaos) | At least Low Complex Multiverse level ([https://digimon.net/profile/report011/
    Mega Digimon] should be [https://imgur.com/a/YegpPrL far superior to Ultimate
    levels] such as SkullGreymon, Megadramon and Etemon Chaos. [https://imgur.com/pa6f6eX
    It is up to Mega Digimon to] bring the Digital World to danger or to bring peace)
    Speed: Massively Hypersonic+ (Should be able to keep up with Rookie Digimon such
    as Elecmon), up to Relativistic reactions (Stronger individuals of the species
    should be able to react to Wizardmon) | Massively Hypersonic+ with Relativistic
    reactions (Kept up with Birdramon and Ikkakumon) | Massively Hypersonic+ with
    Relativistic reactions (Comparable to it''s previous form) | FTL (Ultimate Digimon
    should be at least comparable to if not faster than Champion level Peckmon who
    could dodge Sunflowmon''s Sunshine Beam from a close distance), with Massively
    FTL+'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
