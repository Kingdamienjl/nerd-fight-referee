- id: claim-weaknesses-64fa00c1
  section: weaknesses
  axis: weakness
  text: 'Vaccine Digimon. Holy Light Based Skills Notable Attacks/Techniques *Hell''s
    Hand: Extends a giant decaying hand from underneath its cloak to attack the enemy
    and pulls the captured enemy all the way to hell.Digimon Reference Book; Bakemon.
    *Death Charm: Casts an evil spell of darkness that washes over the enemy and saps
    away its life.Digimon Reference Book; Bakemon *Nightmare Wave: Emits a dark wave
    that hypnotizes the enemy, amplifying their doubts and driving them mad.Digimon
    Adventure V-Tamer 01; Chapter 11 *Poison Breath: Blows out a poisonous smoke.Digimon
    Savers Another Mission *Dark Claw: Slashes the opponent with claws of darkness
    that can poison them.Digimon Story; Sunburst and Moonlight *Raging Darkness: A
    blast of darkness that lowers the foe''s resistance to Darkside power.Digimon
    Story; Sunburst and Moonlight *Touch of Evil/Death Claw: He can stick his arm
    into the ground and have it appear from behind the opponent, grabbing them and
    allowing Devimon to brainwash them. He can also simply extend his arm and pierce
    the opponent to brainwash them. This skill can also paralyze the opponent. Finally
    this attacks can also be used to drain his opponent''s life force.Digimon Reference
    Book; DevimonDigimon Story; Sunburst and Moonlight *Nightmare II: Blasts the foe
    with darkness.Digimon Story; Cyber Sleuth *Strange Dance: A passive ability that
    gives all attacks a 10% chance to confuse the opponent.Digimon Story; Cyber Sleuth
    *Night of Fire: Shoots flames of darkness from its hand.Digimon Reference Book;
    Impmon *Night of Blizzard: Attacks the enemy using a dark blizzard or shards of
    ice.Digimon Savers Another Mission *Summon: Summons spirits of fire and/or ice,
    sometimes combining them to create a ball of ice and fire or a sphere of darkness
    to shoot at the enemy.Digimon Reference Book; Impmon *Idle Bubble: A magic water
    attack that puts the foe to sleep.Digimon Story; Cyber Sleuth *Nightmare I: Blast
    the foe with darkness.Digimon Story; Cyber Sleuth *Magic Circle: A spell that
    teleports the enemy to Impmon before dealing them repeated damage.Digimon All-Star
    Rumble *Ice Blast: Launches an arrow of ice at the opponent.Digimon Story; Sunburst
    and Moonlight *Pico Darts: Throws a gigantic syringe at the opponent, draining
    their blood.Digimon Reference Book; PicoDevimon *Akuma no Sasayaki: Emits hypnotic
    waves from its eyes.St-42 *Necro Magic: Hurls the souls of the dead at the enemy
    as a stream of glowing particles, a swarm of bats, darkness, or a monstrous ghostly
    hand.Digimon Reference Book; Soulmon *End Trance: Drops a huge skull on the opponent.Bo-179
    *Energy Drain: Drains the enemy''s energy by striking them or inhaling.Digimon
    World: Digital Card Battle *Ghost Chop: Karate chops the enemy.Digimon Savers
    Another Mission *Soul Chopper: Swings at the opponent with its scythe. Those who
    suffer this technique have their souls completely annihilated.Digimon Reference
    Book; Phantomon *Shi no Senkoku: Instantly Kills an opponent with a word of death
    or summons a magic circle of dark power that releases a skull, which itself shoots
    a dark fog at the enemy.Bo-39 *Chaos Slash: Slashes with the power of chaos that
    can cause confusion.Digimon Story; Sunburst and Moonlight *Black Coat: Raise resistance
    to darkness with power of darkness.Digimon Story; Sunburst and Moonlight *Dark
    Counter: Give a countering effect to allies with darkness.Digimon Story; Sunburst
    and Moonlight *Thunder Cloud: Summons a thunder cloud, which unleashes an intense
    lightning strike.Digimon Reference Book; Wizardmon *Thunder Ball: Throws an electric
    ball.Digimon Story; Sunburst and Moonlight *Magic Game: The initial effect of
    this attack would seem to be that user releases blue lightning from its staff;
    however, the effect of this attack seems to vary. user can also turn itself invisible.St-44
    *Terror Illusion: Creates and illusion that exploits the enemy''s fears.St-876
    *Blink Breeze: Creates a blast of wind from its staff.Digimon Xros Wars (manga);
    Chapter 19 *Shock Net: Attack its opponents with an electrified net.Digimon Story;
    Sunburst and Moonlight *Dark Knowledge: Uses its knowledge of darkness to raise
    the power of its magic.Digimon Story; Sunburst and Moonlight *Mega Napalm: Creates
    3 fire pillars with fireballs.Digimon Story; Sunburst and Moonlight *Sonic Void
    II: Blasts the foe with intermediate wind magic.Digimon Story; Cyber Sleuth *Hell
    Crusher I: Creates a ball of darkness that releases dark shockwaves to damage
    the foe.Digimon Story; Cyber Sleuth *Soul Predator: Enlarges its energy scythe
    and either slashes the enemy with it or fires a barrage of energy blades from
    it.Digimon Reference Book; MetalPhantomon *Grave Scream: Emits a screaming sound
    from its scythe that puts enemies to sleep so it can use nightmares to devour
    their souls. This can also just reap the opponent''s souls directly.Digimon Reference
    Book; MetalPhantomon *Dokuro Ranbu: Grabs the opponent with the Guilty Chain and
    decapitates them with the Judgment Sickle, o'
