  attack_potency:
    text: Large Building level+ (As a well-trained Rookie Digimon Agumon should not
      be weaker than a newborn Guilmon who can do this) | Island level (Fought other
      Champion level Digimon such as Tyrannomon and Kuwagamon) | Low Complex Multiverse
      level (Said to be able to destroy the Digital World. As a strong Ultimate, should
      be comparable if not superior to Megadramon who can destroy the Digital World,
      Paildramon who stopped an explosion that could've destroy the Digital World,
      Dagomon who can swallow all dimensions in its deep fog, Etemon Chaos who could
      warp the Digital World, Canoweissmon whose light can reach Digital Worlds of
      other dimensions and AtlurKabuterimon who destroyed Vademon's mysterious universe.
      Shouldn't be weaker than Angemon amped by Power of Hope who destroyed WaruMonzaemon's
      Inner World and Devimon who could make everything in the Digital World dwell
      into darkness). Is considered comparable to MetalGreymon by Gennai although
      lacks intelligence and runs on instinct) | Low Complex Multiverse level (Comparable
      to SkullGreymon. Defeated Etemon Chaos) | Complex Multiverse level (Can keep
      up with Piemon and Apocalymon. Later kept up with Diaboromon. Should be comparable
      to HolyDramon), higher (With the Power of God, WarGreymon gained the power to
      defeat Machinedramon) | Complex Multiverse level (Used the power of Azulongmon
      to evolve. Managed to fight BlackWarGreymon on even grounds)
    source_ids:
    - vsbattles-agumon-taichi-yagami-digimon
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively Hypersonic+ (Via this calc) | Massively Hypersonic+, with Relativistic
      reactions (Equal to other Champion Digimon such as Meramon) | FTL (Ultimate
      Digimon should be at least comparable to if not faster than Champion level Peckmon
      who could dodge Sunflowmon's Sunshine Beam from a close distanceDigimon Savers;
      Episode 14), with Massively FTL+ (Should be at least comparable to Garudamon
      and MegaKabuterimon, who dodged Vademon's beamsDigimon Adventure:; Episode 49,
      and should be able to react to MegaKabuterimon's attacks that quickly destroyed
      Vademon's dimensionDigimon Adventure; Episode 24), Up to Infinite Reactions
      and Combat speed (Ultimate level Digimon should be able to react to Canoweissmon's
      light that can reach reach Digital Worlds of other dimensions, should be able
      to react to attacks from Megadramon and SkullGreymon that can destroy the Digital
      World) | FTL , with Massively FTL+, Up to Infinite Reactions and Combat speed
      (Comparable to SkullGreymon) | Immeasurable (Can keep up with Piemon and Apocalymon.
      Later kept up with Diaboromon. Should be comparable to HolyDramon), higher (With
      the Power of God, blitzed Machinedramon) | Immeasurable (Comparable to Azulongmon)
    source_ids:
