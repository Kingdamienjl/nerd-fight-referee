        \ (Digimon are primordial souls native to a world that\u2019s superior to\
        \ the Physical World, transcending conventional reality), Non-Coporeal (The\
        \ composition of all Digimon is a metaphysical substance and its existence\
        \ is actually equivalent to primordial souls that exist on a higher plane\
        \ of reality following an emanationism cosmology being naturally untouchable\
        \ by those who exist in lower worlds. Interactions with the Digimon that occur\
        \ in the franchise are so because of specific events that either create manifestation\
        \ bodies for the Digimon or turn humans into digital entities), Non-Physical\
        \ Interaction (Digimon are able to interact with themselves, each other, and\
        \ their Digicores [which are the very essence of the Digimon], as well as\
        \ the minds and souls of the beings of the lower worlds, such as humans and\
        \ animals. They can even interact and harm those from a higher plane of existence,\
        \ like Eaters, which come from a world beyond the Digital World), Magic (All\
        \ Digimon are able to utilize magic to varying degrees. Magic in Digimon is\
        \ just high level programming knowledge), Size (Digimon can freely change\
        \ their size), Electricity (Using hacking, Digimon are able to turn the power\
        \ of a system on or off), Information, Law, Quantum, Pocket Reality, Reality\
        \ Warping, and Hacking (Digimon are considered as the best hacking tools around\
        \ the world, replacing almost entirely by any conventional hacking program\
        \ prior to their discoveries and yet the best way to combat the Digimon is\
        \ DIgimon themselves. In fact, in Digimon hacking is the correspondent of\
        \ Reality Warping in the digital worlds, and they are able to manipulate reality\
        \ itself when necessary. Reality is viewed by the Digimon, and other digital\
        \ beings, as a computer program, so they are able to rewrite the structure\
        \ of reality changing the laws of the world to whatever form they want. This\
        \ can be used to create and reshape pocket realities. Data is considered to\
