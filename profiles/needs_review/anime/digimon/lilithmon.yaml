    text: As the Demon Lord representing Lust, Lilithmon can be cold, calculating,
      and manipulative, as showcased when she created illusions with the Ice Mirror
      to trick Akari Hinomoto into stealing Lake Zone's Code Crown. She is also responsible
      for manipulating the presidential election of Sky Zone by sending a spy (Lucemon)
      in order to take the Zone's Code Crown. However, she is prone to explosive emotional
      outbursts when her plans begin to fail, and will violently lash out at those
      who dare to spite her
