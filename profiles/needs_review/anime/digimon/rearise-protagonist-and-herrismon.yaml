  intelligence:
    text: 'Average | Average, Above Average in Combat. It has shown to be an innately
      capable fighter as upon evolving into rookie he would aid in the defeat of multiple
      groups of spirals in a single day. It went on to receive training from multiple
      Mega level Digimon (WarGreymonDigimon ReArise: Clash Battle! WarGreymon, MetalGarurumonDigimon
      ReArise: Clash Battle! MetalGarurumon, ShineGreymonDigimon ReArise: Clash Battle!
      ShineGreymon and MirageGaogamonDigimon ReArise: Clash Battle! MirageGaogamon)
      before even gaining the ability to evolve past Rookie and would continue to
      grow with each evolutions. As Stefilmon it''s skills as fighter were praised
      by Royal Knights such as OmegamonDigimon ReArise: Clash Battle! Omegamon and
      DynasmonDigimon ReArise: Clash Battle! Dynasmon. Its intelligence and battle
      skill is lower as Rasenmon: Fury Mode due to being controlled by the Spirals,
      their hatred making it go berserk. As Rasenmon both its intelligence and combat
      skill are at their peak.'
