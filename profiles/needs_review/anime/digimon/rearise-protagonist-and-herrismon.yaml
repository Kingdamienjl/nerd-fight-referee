    - field: weaknesses
      value: 'Incredibly lazy and generally doesn''t plan. (Base CPU Neptune and likely
        Neptune GT only, not a known issue for Dimension Traveler Neptune nor is it
        an issue for Purple Heart) Her Goddess Powers are powered by the Share Energy
        of her nation she rules: Planeptune. So if her Share Energy were to be drained
        (or her connection is cut off) then her transformation will be canceled out.
        She also hates Eggplants to an astounding degree where one time when she was
        being attacked by flying eggplants, she immediately stopped her transformation
        and ran away. However, if the eggplant is modified in some way so it no longer
        resembles an eggplant (like being extremely enlarged) or is some emotion is
        winning over dislike (such as rage or determination), Neptune won''t be phased
        by it. No known weaknesses for Dimension Traveler Neptune'
