  intelligence:
    text: Kouji is arguably the most level-headed member of the DigiDestined, being
      cold, tactical, and taciturn most of the time. He sizes up his opponent and
      formulating a plan before attacking, seeking to ends his foe as quickly and
      efficiently as possible. This makes him an especially able combatant in his
      Digimon forms, quickly mastering all of his transformations, particularly the
      troublesome Beast form, which every other one of his friends had trouble controlling
      at first. In his Digimon forms he is an expert swordsman and marksman, quickly
      dispatching most foes with swift swordplay and powerful laser bursts.
    source_ids:
