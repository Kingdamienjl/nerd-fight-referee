      authority: high
      confidence: 0.75
    - field: intelligence
      value: Jesmon is battle-hardened and was trained to the limits of its capability
        in mind, body, and spirit by Gankoomon. He is a master swordsman who was capable
        of taking on Ultimate-level digimon in his Rookie form, Hackmon, and is noted
        to be mature and well-versed in coordinating with his fellow Digimon, a trait
        that is lacking even amongst the Royal Knights. He is well aware of his limits
        and is noted to lack overconfidence, a trait shared by many of his peers amongst
        the Royal Knights. Atho, Por, and Rene are capable of following advanced instructions
        despite their young age and are skilled in combat, defending their master
        when necessary, seeking targets when asked, and rescuing Digimon in need.
      source_id: vsbattles-jesmon-digimon
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Judgment of the Blade: Jesmon carves the opponent to pieces with the\
        \ blades on its arms while moving at high speed., Schwertgeist: Uses an omnidirectional\
        \ counter technique alongside \"Atho\", unhinging himself from the laws of\
        \ the Digital World (which are mainly the laws of physics and reincarnation),\
        \ placing him in a state akin to the indestructible walls or invisible boundaries\
        \ in a video game. Unless one is able to perform feats outside of the laws\
        \ of physics (i.e. Reality Warping or being an entire dimensional tier above)\
        \ he becomes utterly impossible to harm since it is a physical law that he\
        \ can't be harmed. On the opposite end of things, Weltgeist: Nullifies all\
        \ received damage and then counterattacks when receiving physical or magic\
        \ attacks., Fif Slash: Cuts the opponent to pieces with its sturdy claws.,\
        \ Heal: Heals himself with a green aura., Battle Sense: Grants a 50% boost\
        \ in AP once he gets near death., Rage: Skewers through the enemy from a flying\
        \ kick posture with the blades on its feet., Trident Saber: Assaults the enemy\
        \ with the three red blades equipped to its tail and arms, relentlessly cleaving\
        \ them apart whether they're swathed in Chrome Digizoid or not. Jesmon X,\
        \ Tekken Danzai: Pummels the opponent with an iron fist by shooting out its\
        \ Tactical Arms., Schwert Fl\xFCgel: Fires off the swords and continuously\
        \ slashes at the opponent with its two great-swords., Kyuukyoku Senjin Seibaken:\
        \ Pulls out its Ultimate-War-Blade Seibaken from the Digicore in its chest,\
        \ then destroys the fighting spirit of any opponent it cuts."
      source_id: vsbattles-jesmon-digimon
      provider_id: vsbattles
      authority: high
      confidence: 0.75
