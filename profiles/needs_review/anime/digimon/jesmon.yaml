- id: claim-weaknesses-2b75bfd2
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks and Techniques: Jesmon * Judgment of the Blade:\
    \ Jesmon carves the opponent to pieces with the blades on its arms while moving\
    \ at high speed. *Schwertgeist: Uses an omnidirectional counter technique alongside\
    \ \"Atho\", \"Ren\xE9\", and \"Por\" that meets every enemy attack with their\
    \ nine blades. *OS Generics: Jesmon is able to use a form of Reality Warping targeted\
    \ at himself, unhinging himself from the laws of the Digital World (which are\
    \ mainly the laws of physics and reincarnation), placing him in a state akin to\
    \ the indestructible walls or invisible boundaries in a video game. Unless one\
    \ is able to perform feats outside of the laws of physics (i.e. Reality Warping\
    \ or being an entire dimensional tier above) he becomes utterly impossible to\
    \ harm since it is a physical law that he can't be harmed. On the opposite end\
    \ of things, he is able to set his damage output to \"100% of the target's health\"\
    \ to fell a target in a single blow. *Weltgeist: Nullifies all received damage\
    \ and then counterattacks when receiving physical or magic attacks. *Fif Slash:\
    \ Cuts the opponent to pieces with its sturdy claws. *Heal: Heals himself with\
    \ a green aura. *Battle Sense: Grants a 50% boost in AP once he gets near death.\
    \ *Rage: Skewers through the enemy from a flying kick posture with the blades\
    \ on its feet. *Meteor Flame: Rapid-fires fire shots from its mouth like a machine\
    \ gun, burning the enemy to cinders. *Trident Saber: Assaults the enemy with the\
    \ three red blades equipped to its tail and arms, relentlessly cleaving them apart\
    \ whether they're swathed in Chrome Digizoid or not. Jesmon X *Tekken Danzai:\
    \ Pummels the opponent with an iron fist by shooting out its Tactical Arms. *Schwert\
    \ Fl\xFCgel: Fires off the swords and continuously slashes at the opponent with\
    \ its two great-swords. *Kyuukyoku Senjin Seibaken: Pulls out its Ultimate-War-Blade\
    \ Seibaken from the Digicore in its chest, then destroys the fighting spirit of\
    \ any opponent it cuts."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
