    text: Varies among the species. Kotemon is noted to be a reptile Digimon aiming
      to become a top-class swordsman, it is hardworking and diligently undergoes
      training. Gladimon is a novice Warrior Digimon that is active on the front lines
      of the battlefield, quickly moving as cut its way into enemy lines as a scout.
      Noted to specialize in tactics where it creates formations in collaboration
      with its comrades, so its combat ability as a platoon is high. Knightmon are
      considered to be some of the most skilled warriors among Digimon. They are usually
      used as army men for the Royal Knights, more specifically Crusadermon.
