- id: claim-weaknesses-0cda79c1
  section: weaknesses
  axis: weakness
  text: 'Aegiomon is something of a pacifist and doesn''t like to fight, only bringing
    its full power to bear when someone he cares about is in danger, Attract Echo
    only works for as long as Aegiomon is able to play it | Somewhat arrogant as Jupitermon
    and has an animosity with Plutomon Notable Attacks and Techniques: Overwrite:
    All Digimon can rewrite their data, so that they are able to react to various
    situations that were once problematic for it. This usually causes a gigantic increase
    in power and sometimes new skills and resistances are gained. However, the more
    emotional the Digimon is, the more violent the overwrite becomes. Aegiomon *Attract
    Echo: Aegiomon plays a special tune that captures the attention of all who hear
    it, eventually eliminating their sense of self and forcing them to focus on Aegiomon
    alone, providing opportunities for other Digimon to pursue or escape the target(s).
    *Iron Thrust: Aegiomon hurls a sharp, backwards kick with the goat legs he prides
    himself upon. *Stun Beat Blow: Charges his fists with the electricity circulating
    within his body, attacking the nervous system to numb and slow down opponents.
    Aegiochusmon *Lightning Pile: Forms a pile out of lightning before throwing it
    down on his foe from above to pin them to the ground. Should they be struck by
    even one of these piles, all subsequently piles will strike without fail no matter
    where they''re thrown from. *Bolt Break Knockdown: Rushes in and attacks with
    its fists shrouded in lightning from its horn. *Charging Strike: Uses its leg
    strength for a high speed charge that stabs the opponent''s head with its horn.
    Aegiochusmon Blue *Peneto Laser: Fires a beam from the fingertips of its Mechanization
    Powered Arm. *Wing Cutter: Slashes the opponent with the wings on its back while
    flying. *Powered Ignition: Gathers energy in the palm of the Mechanization Powered
    Arm while its attached, then releases it in a charge. Aegiochusmon Green *Bramble
    Bite: Changes the thorns at the end of its Buster into an evil spirit that bites
    the enemy. *Plant Zone Cradle: Fires thorns from all over its body in all directions.
    *Charging Strike: Uses its powerful legs for a high speed charge that stabs its
    horn into the opponent''s head. Aegiochusmon Dark *Triangler: Cuts with the three
    sickles. *Plasma-madness: Strikes with the electrified darkness gathered in both
    hands. *Death Dinner: Preys on the opponent after predicting their every move.
    Aegiochusmon Holy *Lightning Shower: Strikes the enemy by causing countless daggers
    to rain down upon them from above. *Thunder Slash: Combines its daggers with lightning
    to create a whip-like trail, which it uses to slice enemies apart. *Circlet Defense:
    Expands its impregnable defensive walls to counter the opponent''s attacks by
    deflecting them, while adding electric sparks to the deflected attacks. Jupitermon
    *Mabolt: Jupitermon''s clashes with his opponents automatically generate tiny
    thunderclouds with each blow, automatically striking foes Jupitermon deems evil
    or interrupt its arbitration. *Punish Judge: Jupitermon engraves a seal onto a
    target, granting temporary respite from his wrath unless he decides to deem them
    evil, smiting them with an immense electric current. *Wide Plasment: Converts
    its body into extremely high-voltage plasma, inflicting divine punishment all
    around itself so that all those who are touched by it are completely disintegrated.
    *Power Null: A thought that nullifies the opponent''s special abilities.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
