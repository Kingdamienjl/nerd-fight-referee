- id: claim-weaknesses-8cf36181
  section: weaknesses
  axis: weakness
  text: Koh himself is a normal human and comes with all the weaknesses of one, and
    thus makes an easy target. As a result, his Digimon will often be forced to take
    attacks for him in order to protect him, making him a liability should the enemy
    be aware of this. Regardless, this is somewhat lessened by the fact that his willpower
    is strong enough to resist mental attacks (such as those of Grimmon) along with
    the fact that he carries a multitude of healing items to keep his Digimon in top
    form.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
