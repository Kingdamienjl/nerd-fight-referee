    text: Low Complex Multiverse level (As a strong Deva, should be at least comparable
      to SkullGreymon and Megadramon who can destroy the Digital World, Paildramon
      who stopped an explosion that could've destroy the Digital World, Dagomon who
      can swallow all dimensions in its deep fog, Etemon Chaos who could warp the
      Digital World, Canoweissmon whose light can reach Digital Worlds of other dimensions
      and AtlurKabuterimon who destroyed Vademon's mysterious universe. Shouldn't
      be weaker than Angemon amped by Power of Hope who destroyed WaruMonzaemon's
      Inner World and Devimon who could make everything in the Digital World dwell
      into darkness)
    source_ids:
