        based on the individual.) **Skull Knightmon: Above Average (Skull Knightmon
        is an crafty knight that excels in cunning, its general behavior is based
        on its policy, "Those who are knights must fight. Even more importantly than
        fighting, they must win," and it places great importance on attaining a victorious
        outcome at any rate. In order to achieve that, it will unabashedly use all
        means, no matter how underhandedDigimon Reference Book; Skull Knightmon.)
        **Deadly Axemon: Average (An Demon Beast Digimon that has exchanged cups of
        brotherhood with Skull Knightmon, it obeys its elder brother orders and battles
        with faith that they will obtain victoryDigimon Reference Book; Deadly Axemon.)
        **Dark Knightmon: Above Average (Dark Knightmon, who brings the older brother''s
        ingenuity together with the younger brother''s mobility, is an become a first-class
        warriorDigimon Reference Book; Dark Knightmon.) *Skull Knightmon: (An Digimon
        that has lost its pride as a knight and unabashedly use all means, no matter
        how underhanded, to achieve victory. It specializes in combat that capitalizes
        on the small size of its body and adept with its dual spearsDigimon Reference
        Book; Skull Knightmon, naginata and bow.) **Deadly Axemon: (Deadly Axemon
        on its own is a brawny fighter that relies on its impressive speed to overwhelm
        the opponent. It follows it''s sworn brothers lead faithfully, displaying
