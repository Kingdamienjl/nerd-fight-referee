- id: claim-weaknesses-2dbec8d7
  section: weaknesses
  axis: weakness
  text: 'He is sometimes somewhat overconfident, and is extremely obedient to Yggdrasil
    and thus will follow its orders to the letter. Notable Attacks and Techniques:
    Base * Extinction Wave/Aussterben: (Deu: Extinction) Flings a wave of energy from
    the Sword of Annihilation. * Black Aura Blast/Ernste Welle: (Deu: Gravity Wave):
    Releases an explosive burst of energy from the Sword of Destruction. * Support
    End: Negates and cancels out all forms of support skills. * Speed Break Field:
    Lowers the opponent(s) speed. Leopard Mode * Wolkenkratzer: (Deu: Skyscraper)
    Causes pillars of bedrock to appear from the ground to fling the opponent across
    long distances. * Blockade: Flies past his opponent multiple times, slashing his
    opponent to pieces. * Eroberung: (Deu: Conquest) Creates energy mines from the
    tip of its tale which surround his opponent and restricts their movements, triggering
    powerful explosions on contact. Leopardmon X * Eine Billion (Deu: One Trillion):
    Skillfully strikes its target over a trillion times in a single second.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
