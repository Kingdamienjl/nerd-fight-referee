    text: 'GranDracmon is a master manipulator who can seduce even angel Digimon who
      comes to subdue him into falling down and join the darkness and a very charming
      demeanor which can catch even skeptical visitors off-guard. It is also said
      that he knows the truth behind some of the most mysterious aspects of the Digitial
      World , "Death-X"Digimon Reference Book; GranDracmon. In Digimon World: Dawn/Dusk
      GranDracmon is also a master hacker who could warp and lock-down CITYDigimon
      World Dawn/Dusk. Dracmon seems to be more of a tricky fighter who relies on
      his mind control to gain the upperhandDigimon Reference Book; Dracmon. Sangloupmon
      is an extremely skilled and talented hunterDigimon Reference Book; Sangloupmon.
      Matadormon is an extremely skilled martial artist who uses elegant dance moves
      to overpower the opponentDigimon Reference Book; Matadormon.'
