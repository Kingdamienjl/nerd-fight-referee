  attack_potency:
    text: 'Attacks with its horn. *Machine Gun Jab: Continual throws punches at the
      foe. *Drill Horn: Jumps into the air and attacks with horn. *Drill Horn Special:
      Jumps into the air and attacks with horn by spinning over a long distance. *Crush
      Nail: Unleashes a combo attack with its claws. *Skull Cracker: Drops straight
      down horn-first. *Blue Cyclone: Spins around while spitting out blue fire from
      its mouth. *Fox Fire/Howling Blaster: Fires blue, high-temperature flames from
      its mouth. *Body Blow: Rams the enemy with its body. *Freeze Fang: Bites an
      enemy with icy fangs. *Ice Wall: Breathes out a wall of ice to repel attacks.
      *Garuru Thrust: Attacks with its claws. *Slamming'
