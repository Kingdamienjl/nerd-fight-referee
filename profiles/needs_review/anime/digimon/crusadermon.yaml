  intelligence:
    text: LordKnightmon immensely skilled combatant with countless years of combat
      experience as a member of the Royal Knights, LordKnightmon is notable for leading
      every Knightmon. In his first appearances in Digimon Frontier, he was able to
      easily overpower both EmperorGreymon and MagnaGarurumon with the help of Dynasmon,
      deftly and gracefully deflecting their attacks before punishing them with powerful
      counter attacks. However, he is insufferably arrogant and confident in himself,
      and he rules through fear rather than compassion, having no respect for the
      weak and being a firm believer of the "might makes right" ideology.
