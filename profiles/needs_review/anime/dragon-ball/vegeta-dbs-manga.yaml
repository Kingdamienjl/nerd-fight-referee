  stamina:
    text: Superhuman (Vegeta can train for days with minimal rest while constantly
      pushing himself to his limits, getting up again and again to train more despite
      the severe damage he deals to himself in the process. In combat, Vegeta's endurance
      is famous, allowing him to continue fighting against the Goku and the other
      Z-Fighters despite his steadily worsening condition. Even after being launched
      into the sky by a Kaio-ken x4 Kamehameha, losing his tail, and being hit by
      a Spirit Bomb, Vegeta was able to stubbornly keep on fighting, refusing to die
      or give up. He withstood an extended, brutal beatdown in his fight with Kid
      Buu despite the massive difference in their power. Can engage in combat in low
      oxygen environments), Below Average with incomplete Super Saiyan Blue (Even
      using 10% of Super Saiyan Blue takes a significant amount of stamina to use,
      forcing him to switch to Super Saiyan God in rapid succession) higher with Ultra
      Ego (Withstood and endured multiple attacks from Granolah, and could still keep
      fighting)
    source_ids: *id002
    confidence: 0.8
  range:
