      value: Average generally. Genius combatant (Although he lacks knowledge when
        it comes to things that aren't related to fighting, Goku is a master of prodigal
        skill when it comes to martial arts, with years of experience fighting against
        powerful opponents with a plethora of abilities. His skill when it comes to
        combat and the usage of ki allows him to replicate other ki-based techniques
        after seeing them once, and he was the first to realize how much energy the
        Super Saiyan transformations unnecessarily drained. Despite this drawback,
        he was the first to master the Super Saiyan state, making it highly efficient.
        He is capable of devising new applications of his techniques on the fly, such
        as using Kamehameha with his feet. Additionally, in comparison to his canon
        counterpart, he has significantly more experience in terms of combat)
