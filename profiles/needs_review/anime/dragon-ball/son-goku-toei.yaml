- id: claim-standard-equipment-d713188c
  section: equipment
  axis: equipment
  text: 'GokuToeiEquip4.png|Power Pole GokuToeiEquip5.png|Flying Nimbus GokuToeiEquip6.png|Senzu
    Beans *: A magical, length-changing staff that is owned and wielded by Goku for
    most of the original Dragon Ball series. Before Master Roshi gave the Power Pole
    to Grandpa Gohan (who later gave it to Goku prior to the start of Dragon Ball),
    it was owned by Korin. Although Goku uses it primarily as a weapon, its true purpose
    is to use its size-changing ability to travel from Korin Tower to The Lookout.
    However the only time Goku as utilized the staff during the Z era was in the film
    Dead Zone. *: A magical, yellow cloud that serves as a way of transportation.
    Goku obtains the Nimbus from Master Roshi as compensation for saving Turtle. It
    served Goku and his sons well throughout Dragon Ball and Dragon Ball Z, by acting
    as a way for them to fly around at high speeds without using up any energy. *
    When eaten, a person''s physical condition is near-instantly restored to its natural
    peak. This property makes them immensely useful to carry in battle. As such, since
    Korin allied himself with Goku and his friends, Korin usually assists them by
    providing the Dragon Team with a bag of Senzu Beans. However, the supply is limited,
    as it takes a long time to grow even a single Senzu Bean. Optional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
