    - field: attack_potency
      value: Large Planet level (Fought Raditz alongside Piccolo, the latter of whom
        could blow up the moon with a ki blast). Higher after King Kai's training
        (Easily humiliated Nappa before he calmed down), Dwarf Star level+ with Kaio-ken
        (Overpowered Vegeta with Kaio-ken x3, and then matched his Galick Gun with
        a Kamehameha, overwhelming him when he went Kaio-ken x4. Even as a child,
        Vegeta surpassed his father, who could do this) | Small Star level (Stomped
        Jeice, Burter, and Reccoome with ease. With Kaio-ken x2, exceeded Captain
        Ginyu in power. Goku's power that he can use in short bursts [Kaio-ken x10]
        at this point far surpasses that of Kaio-ken x2). Solar System level after
        healing (Stronger than Vegeta and Piccolo, and fought against a very casual
        Frieza in his final form. Frieza's final form is massively superior to his
        previous forms, and his first form casually destroyed Planet Vegeta without
        even powering up. Planet Vegeta is a massive planet with two suns orbiting
        around it). Multi-Solar System level with Kaioken x20 and Super Saiyan (With
        Kaio-ken x20, overpowered 50% Final Form Frieza, who destroyed Namek). As
        a Super Saiyan, dominated 50% Final Form Frieza and overpowered his 100% form)
        | Solar System level. Galaxy level as a Super Saiyan (Stronger than Super
        Saiyan Trunks casually while in Super Saiyan, who was capable of one-shotting
        King Cold and Mecha Frieza, who are both stronger than Final Form Frieza.
        Mecha Frieza's Death Ball was 10x stronger than the energy he used to destroy
        Namek). Solar System level after Time Chamber training (His base form should
        be far stronger than it was before). Galaxy level (Full Power Super Saiyan
        is implied to surpass all previous grades of Super Saiyan in terms of both
        energy control and raw power. In that form, he managed to fight with a suppressed
        Perfect Cell, who was using more power than he did against Super Saiyan Grade
        3 Trunks), likely High Universe level with Full Power Super Saiyan (When Cell
        became Perfect Cell, his Ki was felt across the universe, and Elder Moori
        said he would destroy the universe. Cell was stated to be a God of Destruction
        with infinite power. Cell said he would bring the end of everything, multiple
        times, turning it all to the "darkness of space with no traces remaining".
        Stated to be roughly equal to Shin, who only involves himself in mortal affairs
        when the fate of the universe is on the line, and he presumably created all
        of the infinite planets that occupy the universe. The universe is stated to
        be infinite, multiple times) | Galaxy level (In base, surpassed weighted Pikkon.
        Pikkon w/weights on casually two-shotted Super Perfect Cell. Can raise his
        power by likely 2,000 times by using his Mastered Super Saiyan Form), likely
        High Universe level (Along with the other evidence of Cell being this powerful,
        Super Perfect Cell is roughly equal to a suppressed Dabura, who is arguably
        stronger than Babidi, who almost destroyed the universe) | Galaxy level, likely
        High Universe level. High Universe level as Super Saiyan 3 (Capable of defeating
        Innocent Buu, who is stated to be able to destroy the universe, while in his
        Super Saiyan 3 transformation), High Universe level with Super Saiyan forms
        post-Vegito (After defusing, Super Saiyan Goku and Vegeta were able to fight
        on even grounds with exact copies of Potential Unleashed Gohan and SS3 Gotenks
        inside Super Buu. Goku is also capable of fighting somewhat against Kid Buu
        as a Super Saiyan 2 and 3, who is stronger than Buuhan, who is Super Buu,
        a form of Buu stronger than Innocent Buu, with Piccolo, Goten, Trunks, and
        Potential Unleashed Gohan, with Gohan being far stronger than the initial
        Super Saiyan 3 Goku who had fought Innocent Buu. Kid Buu was also stated to
        be able to destroy the universe, multiple times) | High Universe level (Can
        fight against Uub and General Rilldo, both of whom are stronger than Kid Buu).
        Higher with Super Saiyan (is many times stronger than before, and fought evenly
        with Meta-Rilldo. Even more powerful with higher transformations) | High Universe
        level (Stronger than before. Was able to fight on par with Super Saiyan Baby
        Gohan and Super Saiyan Baby Goten. The former never stopped training, and
        thus should likely far exceed his Ultimate self in the Buu arc). Higher with
        Super Saiyan forms. Universe level+ with Super Saiyan 4 (Should at least rival,
