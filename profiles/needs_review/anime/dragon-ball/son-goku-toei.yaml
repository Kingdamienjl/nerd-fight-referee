  axis: weakness
  text: 'Has a phobia of needles. | Same as before, Kaioken strains his body, causing
    him intense pain and exhaustion if he overuses it. His Spirit Bomb requires a
    long charge-up period, during which time he is vulnerable. | Same as before, though
    he can endure Kaioken much more (10x, and even momentarily 100x after being given
    energy by Piccolo against Lord Slug). | Same as before, except Kaioken only strains
    his body a bit even with x20. | Same as before. | Same as before. | Same as before,
    but given he can use Super Kaioken, it is unlikely that most of the lesser levels
    of Kaioken would do any extensive damage as it did before. | Same as before, Super
    Saiyan 3 drains his ki rapidly and will exhaust him within minutes, however, when
    dead, the issue seems to be mitigated. | Same as before, however Super Saiyan
    3 no longer drains his energy substantially). Feats: *In the Otherworld Tournament,
    Goku managed to train enough to be able to compete with Pikkon in his base form,
    the warrior who also managed to beat an off-guard Toei Super Perfect Cell in 2
