        \ at full power and let opponents reach their most powerful states to get\
        \ one. When outmatched, Cell will begin to panic and fly into a rage, fighting\
        \ irrationally. He cannot absorb mechanical beings by puncturing them with\
        \ his tail, and powerful enough strikes to his body can cause him to regurgitate\
        \ whoever he absorbed by engulfing them with his tail, causing him to devolve\
        \ if he regurgitates one of the androids. He needs to locate a ki signature\
        \ to teleport using Instant Transmission. {| class=\"mw-collapsible mw-collapsed\"\
        \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"\
        width:100%\" | colspan=\"2\" style=\"text-align: left; \" |Notable Attacks/Techniques:\
        \ |- | |-|Ki Attacks=The fighting power and life force of a martial artist,\
