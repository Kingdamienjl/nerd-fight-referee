        \ Transmission|{{Ruby|\u77AC|\u3057\u3085\u3093}}{{Ruby|\u9593|\u304B\u3093\
        }}{{Ruby|\u79FB|\u3044}}{{Ruby|\u52D5|\u3069\u3046}}|Shunkan Id\u014D}}: After\
        \ being teleported to King Kai's planet by Goku, Cell learned this technique,\
        \ which allows him to lock onto the ki signatures of others and teleport to\
        \ their locations. Its use takes some concentration, which is aided by Cell\
        \ putting his index and middle fingers to his foreheads, and he needs a ki\
        \ signature to teleport to, otherwise he cannot perform the technique. It\
        \ can be used to teleport others as well, as long as they are in physical\
        \ contact with Cell. *{{Nihongo|Spirit Bomb|{{Ruby|\u5143|\u3052\u3093}}{{Ruby|\u6C17\
        |\u304D}}{{Ruby|\u7389|\u3060\u307E}}|Genkidama}}: Goku's ultimate attack,\
        \ taught to him by King Kai, and which Cell claims to know how to be able\
        \ to perform due to possessing Goku's DNA. It is utilized by gathering a vast\
