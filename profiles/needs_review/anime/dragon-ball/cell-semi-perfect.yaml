        \ be used in a number of ways, such as to surpass the limits of one's body\
        \ to greatly increase in strength, and it can be fired as blasts of energy\
        \ or used to create defensive barriers. Ki is a large part of Cell's superhuman\
        \ abilities, alongside his unusual composition and the varied DNA he possesses.\
        \ Due to his nature as a hybrid created from the DNA of many fighters, Cell\
        \ possesses many of their techniques. *{{Nihongo|Death Beam|\u30C7\u30B9{{Nihongo|\u5149\
        \u7DDA|\u3053\u3046\u305B\u3093}}|Desu K\u014Dsen}}: A technique gained from\
        \ Frieza's DNA that takes the form of a small, highly concentrated beam of\
        \ ki fired from the fingertip with enough force to punch straight through\
        \ an opponent's body. *{{Nihongo|Kamehameha|\u304B\u3081\u306F\u3081{{Ruby|\u6CE2\
        |\u306F}}}}: The closest thing that Cell has to a signature attack, gained\
        \ from Goku's DNA. After charging up the attack in his hands and at his side,\
        \ Cell fires the beam as a massive, blue burst of ki that is powerful enough\
        \ to destroy planets, and, as Super Perfect Cell, can destroy the entire solar\
