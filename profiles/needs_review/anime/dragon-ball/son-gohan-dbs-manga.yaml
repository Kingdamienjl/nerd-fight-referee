  section: weaknesses
  axis: weakness
  text: 'Gohan has an explosive temper that can flare up suddenly and cause him to
    act irrationally, but besides this, he is typically a pacifist who avoids fighting
    and dislikes killing opponents. Due to this, he often keeps his true power restrained
    so as to avoid harming others. He had not continued his training and as a result,
    was not even sure if he could turn into a Super Saiyan in the Resurrection F saga.
