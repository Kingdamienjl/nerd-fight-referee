- id: claim-weaknesses-f36a5a14
  section: weaknesses
  axis: weakness
  text: Majin Buu's energy can be worn out if he fights another Buu or a copy of himself.
    In addition, if he is battling against stronger opponents, he may also get psychologically
    weakened over time. Innocent and Kid Buu are both fairly unintelligent and prone
    to fooling around in fights, taunting and mocking opponents rather than going
    all out and destroying them immediately. Buu has a short temper and is easily
    angered. Buu is influenced by the personalities of those he absorbs; as he absorbs
    more heroic individuals, he will become less villainous and more good-natured.
    Buu is not immune to his own magic, as when Evil Buu reflected his transfiguration
    beam back at him, it turned him into chocolate as well.
