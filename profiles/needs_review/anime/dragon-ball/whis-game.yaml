    - field: weaknesses
      value: 'Standard Trophy Fighter weaknesses. Notable Attacks/Techniques: File:G&W-Neutral
        B.gif|Chef: Mr. Game and Watch''s neutral special File:G&W-Side-B.gif|Judge:
        Mr. Game and Watch''s side special File:G&W-Up-B.gif|Fire: Mr. Game and Watch''s
        up special File:G&W-Oil-Panic.gif|Oil Panic: Mr. Game and Watch''s down special
        File:Octopus-Smash-Bros.gif|Octopus: Mr. Game and Watch''s final smash * Shadow
        Bugs: Mr. Game & Watch''s body is composed out of a mysterious matter called
        Shadow Bugs. This matter has the property of being able to be produced from
        Mr. Game & Watch''s body endlessly and of taking the shape of anything it
        desires. It was used to create most members of the Subspace Army, but also
        to create clones from nearly every fighters. As Mr. Game & Watch himself is
        made out of Shadow Bugs, he can clone himself at will or reform his own body
        into another form (such as Duon). * Chef: Mr. Game & Watch flips a few pieces
        of food from his frying pan into the air. It can be flipped faster if the
        player taps the button * Judge: This move allows Mr. Game & Watch to draw
        a random number between 1 and 9. The higher the number, the stronger the attack.
        Various elemental-based attacks can be achieved through uses of this move,
        as well as the potential to instantly knock out an opponent if the attack
        is a 9. Mr. Game and Watch is most likely to try his luck with this move when
        he''s in a tight pinch. * Fire: Mr. Game and Watch uses a trampoline to be
        launched into the air, Mr. Game and Watch then deploys a parachute which he
        can use to float back onto the stage. Him being launched in the air hits any
        enemies on contact, and the trampoline damages any enemy on contact * Oil
        Panic: He can absorb energy-based attacks like fire, lasers, explosions, etc.
        and then reflect them at 3x the power * Octopus: His final smash, he can turn
        into an octopus for a limited amount of time, and can grab the player or knock
        them around. In Ultimate, Mr. Game & Watch dashes across the stage grabbing
        opponents in it''s tentacles and causes them to be KO''d by being dragged
        across the blast line ===Custom Moves=== * XXL Chef: Mr. Game & Watch flips
        one large piece of food from the frying pan, while it deals more damage, it
        takes longer to flip and travels slower * Short-Order Chef: Mr. Game & Watch
        flips multiple pieces of food horizontally, the food travels faster, but it
        is weaker than normal. * Extreme Judge: Mr. Game & Watch will only choose
        between 1 & 9, with 1 dealing more damage and 9 dealing less. * Chain Judge:
        The number displayed results in the amount of hits that can occur, with larger
        numbers resulting in a larger combo and ultimately more damage. However, the
        individual effects are not present in this attack * Heavy Trampoline: Mr.
        Game & Watch''s trampoline deals more damage but will result in less height
        * Trampoline Launch: Mr. Game & Watch''s trampoline gives more height and
        greater damage, but grants no parachute * Efficient Panic: Mr. Game & Watch''s
        oil bucket can be filled much quicker than before, but it deals less damage
        and has less range * Panic Overload: The oil from the bucket has a larger
        range, but the radius of absorption is smaller, and it deals less damage Note:
        Although Super Smash Bros. treats Mr. Game & Watch as a two-dimensional character,
        his many feats contradict his status as so, such as constantly fighting against
        three-dimensional characters. This means that Mr. Game & Watch cannot be rated
