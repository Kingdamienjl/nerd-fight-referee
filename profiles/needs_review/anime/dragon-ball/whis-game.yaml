    - field: weaknesses
      value: "If the Universe 7's God of Destruction is dead, Whis will be inactive\
        \ until a new god takes their place. Notable Attacks/Techniques: * Afterimage\
        \ Technique: Whis moves so quickly that he leaves an image of himself behind.\
        \ Used to avoid Goku and Vegeta's attacks while sparring with them. *Kiai:\
        \ An invisible blast of ki from the palm, used by Whis against Goku in Resurrection\
        \ \u2018F\u2019. *Warp: A transportation technique used by Whis to allow himself\
        \ and Beerus to travel between realms, and also through time. Using this technique\
        \ Whis can move faster than anyone else in the universe. * I Won't Let You!:\
        \ Whis uses Pressure Point Attacks to render his opponents unconscious. He\
        \ uses this when he karate chops Beerus at the end of the movie. Named in\
        \ Battle of Z. ** Strike of Revelation: Whis rushes at the opponent with Rapid\
        \ Movement before appearing behind them to instantly incapacitate them for\
        \ brief moment through a karate chop to the neck. * Mastery of Self-Movement:\
        \ In this state, Whis's body is capable of subconsciously avoiding attacks,\
        \ disregarding his own capability to react, allowing him to effectively multitask,\
        \ thinking up strategies while his body fights for him, fully maximizing his\
        \ offensive and defensive capabilities. As he doesn't need to think to fight,\
        \ it also makes illusory techniques useless. However, as it doesn't increase\
        \ his speed, much faster opponents would still be able to bypass it. Category:Paleomario66\
        \ Category:Tier 2"
      source_id: character-stats-profiles-whis-game-dragon-ball
      provider_id: character_stats_profiles
