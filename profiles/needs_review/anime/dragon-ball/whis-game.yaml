      value: Multiverse level (He can casually one-shot Beerus, Goku first obtained
        a Low 2-C feat during the Universe 6 Tournament, and since then, has received
        enormous Zenkais and has applied Kaioken of varying levels. Even with such
        amazing power boosts, current SSJB Goku is unable to match Beerus at all,
        and tied with Golden Frieza, who struggled with Sidra's Energy of Destruction,
        but Beerus casually blew it away. Whis also stated that comparing Beerus'
        power to Goku and Vegeta's [The two having just obtained God ki] was like
        comparing a castle to a tree. Not to mention that, while Arale matched SSJB
        Goku, Beerus nearly killed her with two fingers. All Gods of Destruction are
        massively above these characters, and the Angels are an equally massive portion
        above Gods of Destruction, which, due to sheer multipliers, should put him
        at the low-ends of this tier)
