    - field: weaknesses
      value: "Vegeta is arrogant and prideful, and if overpowered by someone he considers\
        \ below him, he can lose his temper. He also seeks strong opponents, and will\
        \ therefore allow his opponents to reach their full power for the sake of\
        \ a good fight {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
        1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
        2\" style=\"text-align: left; \" |Notable Attacks/Techniques: |- | |-|Ki Attacks=\
        \ The fighting power and life force of a martial artist, a tangible energy\
        \ derived from the user's vigor, courage, and mind. It can be used in a number\
        \ of ways, such as to surpass the limits of one's body to greatly increase\
        \ in strength, and it can be fired as blasts of energy or used to create defensive\
        \ barriers. Along with his Saiyan blood, Ki acts as the source of Vegeta's\
        \ incredible power and abilities. Born with an abnormally high power level,\
        \ even at a young age it was believed that Vegeta would certainly surpass\
        \ his father, and for many years he remained as the strongest Saiyan in the\
        \ universe. In combat, Vegeta often makes use of high amounts of ki blasts,\
        \ firing them in large amounts and in rapid succession to overwhelm his opponents.\
        \ As opposed to other Dragon Ball characters, Vegeta has a host of signature\
        \ attacks. *{{Nihongo|Big Bang Attack|\u30D3\u30C3\u30B0\u30D0\u30F3\u30A2\
        \u30BF\u30C3\u30AF|Biggu Ban Atakku}}: After extending his arm and opening\
        \ up his palm, Vegeta creates a massive sphere of energy, which he then fires\
        \ at his opponent, causing a massive explosion. center|250px *{{Nihongo|Dirty\
        \ Fireworks|{{Ruby|\u6C5A|\u304D\u305F\u306A}}\u3044{{Ruby|\u82B1|\u306F\u306A\
        }}{{Ruby|\u706B|\u3073}}|Kitanai Hanabi}}: By pointing his index and middle\
        \ fingers at his opponent, Vegeta causes them to be engulfed by a massive\
        \ explosion that destroys them from the inside out, killing most opponents\
        \ instantly. center|250px *{{Nihongo|Final Explosion|\u30D5\u30A1\u30A4\u30CA\
        \u30EB\u30FB\u30A8\u30AF\u30B9\u30D7\u30ED\u30FC\u30B8\u30E7\u30F3|Fainaru\
        \ Ekusupur\u014Djon}}: The suicidal technique that Vegeta ultimately uses\
        \ in an attempt to destroy Majin Buu, converting all of his life force into\
        \ energy and causing a massive explosion that levels his surroundings and\
        \ reduces Vegeta to a crumbling stone statue. After his Super Saiyan Blue\
        \ Super Evolution, Vegeta became powerful enough to use this technique without\
        \ dying. center|250px *{{Nihongo|Final Flash|\u30D5\u30A1\u30A4\u30CA\u30EB\
        \u30FB\u30D5\u30E9\u30C3\u30B7\u30E5|Fainaru Furasshu}}: One of Vegeta's most\
        \ famous attacks. After spending some time gathering the massive amounts of\
        \ energy needed for the technique, Vegeta releases it all as a massive, high-power\
        \ beam of ki that can completely engulf and incinerate a foe. center|250px\
        \ *{{Nihongo|Galick Gun|\u30AE\u30E3\u30EA\u30C3\u30AF{{Ruby|\u7832|\u307B\
        \u3046}}|Gyarikku H\u014D}}: Vegeta's most famous signature technique. Pulling\
        \ both of his hands to his chest, he gathers ki before firing the beam straight\
        \ at his opponent. center|250px *{{Nihongo|Destructo Disc|{{Ruby|\u6C17|\u304D\
        }}{{Ruby|\u5186\u65AC|\u3048\u3093\u3056\u3093}}|Kienzan}}: Krillin's signature\
        \ technique, which Vegeta presumably copied from him. Raising his hand above\
        \ his head, Vegeta creates a razor-sharp disc of ki with incredible cutting\
        \ power, and then throws it at his opponent. It should be noted that the Destructo\
        \ Disc can cut through opponents that are several times stronger and more\
        \ durable. center|250px |-|Saiyan Physiology= The physiology of a Saiyan,\
        \ an aggressive warrior race of conquerors. Saiyans have the natural ability\
        \ to control Ki and to fly. While his lifespan is comparable to that of a\
        \ human, Vegeta will remain at his peak strength for much longer. One of the\
        \ most powerful abilities of a Saiyan is their ability to grow stronger and\
        \ stronger through combat, allowing Vegeta to constantly push his own limits\
        \ during a fight and rise to higher and higher peaks in power. This ability\
