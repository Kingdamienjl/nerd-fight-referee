  text: 'Goku seeks strong opponents and therefore will allow his opponents to reach
    their full power for the sake of a good fight. Kaioken strains his body, causing
    him intense pain and exhaustion if he overuses it. His Spirit Bomb requires a
    long charge-up period, during which time he is vulnerable. Incapable of using
    Instant Transmission beyond a few meters due to his Child Body without amplification.
    Super Saiyan 3 drains his ki rapidly, and his weaker, child body makes it even
    more difficult to use, limiting its use to only a few seconds at a time. | All
    the same weaknesses as before, except now with the return of his tail he no longer
    has strain within any Super Saiyan form, and can access his Adult Body, allowing
    flawless use of Instant Tranmission. | All the same weaknesses, except he''s in
    his Adult Body all the time, now, and thus can always use flawless Instant Transmission.
