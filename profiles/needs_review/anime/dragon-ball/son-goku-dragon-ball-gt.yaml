        offensive ones., Instant Transmission: A technique learned by the Yardrat
        people that allow the user to teleport., Kaio-Ken: The Kamehameha consists
        in concentrating its energy in a point and to leave it in ray of energy.,
        Six-Arm Fist: The technique involves Son Goku moving their arms fast enough
        that they seemingly have six of them, allowing him to attack and defend themselves
        much more efficiently., Solar Flare: Solar Flare is a technique of the Crane
        School used by Ten Shin Han and is later learned by Son Goku which consists
        of generating light with Ki., Quintessence: Quintessence consists of copying
        a world''s dimensions and planes and absorbing those into a singularity that
