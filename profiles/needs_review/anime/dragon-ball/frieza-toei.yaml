  stamina:
    text: Superhuman (Frieza's endurance is extraordinary, as demonstrated in his
      long, painful battle with Goku. Even after taking a Spirit Bomb head-on, Frieza
      still had enough stamina to keep on going and fight against Goku as a Super
      Saiyan, powering up to 100% and matching him in power. However, due to Frieza's
      inexperience with the form, at 100%, Frieza's ki is rapidly drained. Even so,
      he can endure being severely injured during his fight with Goku and ultimately
      even being cut in half and blasted into Namek after being completely drained
