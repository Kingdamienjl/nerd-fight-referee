  intelligence:
    text: Gifted (As the dictatorial of the Universe, Frieza is a clever and crafty
      commander who kept his iron grip on his territory by terror and strategic military
      deployment. In combat, he is an extremely skilled hand-to-hand combatant capable
      of fighting on par with the likes of Goku, even when playing around. He is well-versed
      in using ki, replicating and improving upon Krillin's Destructo Disc with his
      own homing variant. However, for all of his skill, Frieza is quite overconfident
      and isn't fond of utilizing his full power)
