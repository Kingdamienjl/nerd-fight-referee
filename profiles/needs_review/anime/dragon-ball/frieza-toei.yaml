  attack_potency:
    text: At least Large Star level ([https://imgur.com/a/H8cz09b Half the power of
      his Second Form]. Casually destroyed Planet Vegeta), higher in his Second Form
      (Superior to a hypothetical Kaioken x10 Namek Saga Goku), even higher in his
      Third Form (Should be at least x2 stronger than his Second Form, [https://imgur.com/a/orsc6pa
      due to each of his forms increasing his power many times]. Easily stomped Piccolo,
      who had previously matched him in his second form), Multi-Solar System level+
      in his Final Form (Destroyed Namek while holding back, causing even countless
      stars behind the planet to be blown away. Stopped a Kamehameha from a Goku using
      Kaioken x20 [https://www.youtube.com/watch?v=zzDuws7UlMM&t=101s with a single
      hand]. [https://imgur.com/a/w6OpG7q A vague perception of his ki was enough
      to scare] Post-Garlic Jr. Krillin and Gohan, with the former not knowing about
      the other forms of Frieza due to him being killed from the Final Form), Galaxy
      level with 100% of his power (Twice as strong as his Final Form) | Galaxy level
      (Stronger than before. [https://i.imgur.com/oCqTbpX.png Created a Supernova
      with 10x the energy he used to destroy Namek]) | High Universe level (Managed
      to somewhat compete with Cell Saga Future Trunks, who is superior to a Restrained
      Super Saiyan Broly) | Low Multiverse level (Powered up after training in Hell
      for many years and confidently challenged Goku even after having witnessed him
      fight Kid Buu)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Comparable in speed to Vegeta after his Zenkai boosts),
      higher in his Second Form (Superior to a hypothetical Kaioken x10 Namek Saga
      Goku; Kept up with Piccolo), far higher in his Third Form (Easily toyed with
      and blitzed Piccolo), even higher in his Final Form, much higher with 100% of
      his power (At 50% of his power, Frieza is comparable to Goku with Kaioken x20.
      At 100% of his power, he is much faster than before, and can keep up with Super
      Saiyan Goku) | Massively FTL+ | Infinite (Could keep up with Cell Saga Future
      Trunks in combat. Faster than a Restricted Super Saiyan Broly) | Infinite (Much
      faster than before)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class P, likely far higher (Vastly far superior to Dead Zone Gohan)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Large Star level, higher in his Second Form, even higher in Third
