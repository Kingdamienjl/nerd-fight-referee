        Mimicry (Copied Krillin''s Destructo Disc), Accelerated Development (With
        Training), Shockwave Creation and Invisibility (Frieza can create Kiais with
        his Ki, which are invisible to the eye), Afterimage Creation, Air Manipulation
        (Can create huge whirpools with his Ki), Water Manipulation (Can telekinetically
        control water), Magma Manipulation (Can telekinetically control lava), Non-Physical
        Interaction (Can reflect Ki blastes with his hands. Ki can also affect ghosts
        and souls), Breath Attack (Seen here), Homing Attack (Ki users can redirect
        their attacks to follow their foe, and Frieza can use his Death Saucers to
        follow his foes), Chi Manipulation (Mastered), Energy Projection and Manipulation
        (With his Ki), Light Manipulation (Ki generates light), Heat Manipulation
        (Ki can generate heat), Flight, BFR (Ki can send opponents far away), Electricity
        Manipulation (Ki can generate electricity around it, with auras creating a
        sort of electromagnetic field), Healing (Ki can heal beings), Instinctive
        Reactions (By clearing ones mind, Ki users can react without the need for
        conscious thought, and can sense disturbances even when they aren''t exhibiting
        energy), Damage Boost and Statistics Amplification (Ki users can not only
        make themselves stronger by increasing their Ki, but can also make their attacks
        much stronger by focusing on a single point), Absorption and Power Bestowal
        (Ki users can give and borrow energy from others), Weapon Creation, Social
        Influencing and Fear Manipulation (Ki users can passively induce fear and
        insecurity into opponents that can sense their presence through the power
        of their auras, bigger when the user has malicious ki, forcing an sensation
        of being crushed and paralyzed), Weather Manipulation (Ki users can change
        the weather by powering up), Forcefield Creation (Can create a barrier around
        himself to slam into opponents), Limited Telepathy (Via Image Training), Empowerment
        (Ki users can empower themselves by being encouraged by others and by themselves),
        Earth Manipulation, Stealth Mastery (Ki users can hide their presence, even
        erasing them completely), Resistance to Extreme Cold and Cosmic Radiations,
