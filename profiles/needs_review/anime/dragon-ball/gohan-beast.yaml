        of following Lavender's movements even after being blinded and use his Ki
        as a radar. As a scholar, tutored throughout his entire life, Gohan is highly
        intelligent and knowledgeable as well, having an in-depth understanding of
        the metaphysical mechanics of Ki itself. Due to his intelligence and skill,
        Goku appointed him as the Captain of Team Universe 7)
