    - field: weaknesses
      value: 'Gohan has an explosive temper that can flare up suddenly and cause him
        to act irrationally, but besides this, he is typically a pacifist who avoids
        fighting and dislikes killing opponents. Due to this, he often keeps his true
        power restrained so as to avoid harming others. As a Super Saiyan 2 and after
        first getting his potential unlocked, Gohan was prone to overconfidence, even
        dipping into sadism during his battle with Cell and seeking to prolong his
        suffering as retaliation for his crimes. Needs a moon in order to transform
        and loses control of himself as an Oozaru and as he never trained the weakness
        away, his tail is a vulnerable point and grabbing or removing it will cause
        him intense pain. | None Notable (By the ToP he has since lost his Overconfidence
        and has a handle on his rage) Notable Attacks/Techniques: Ki: The fighting
        power and life force of a martial artist, a tangible energy derived from the
        user''s vigor, courage, and mind. It can be used in a number of ways, such
        as to surpass the limits of one''s body to greatly increase in strength, and
        it can be fired as blasts of energy or used to create defensive barriers.
        Along with his Saiyan blood, Ki acts as the source of Gohan''s incredible
        power and abilities. Even as a child, Gohan possessed an exceptionally high
        dormant potential that allows him to show the true depths of his power whenever
        his rage shows through and grow in strength quickly. Even after getting his
        potential unlocked twice, Gohan still had room to grow further and further
        in power. *Masenko: Gohan''s original signature technique, which he learned
        from Piccolo. After placing both of his hands above his head with his palms
        facing towards his opponents, he fires a powerful blast of ki. By charging
        it longer, he can also throw it as an explosive sphere of energy. *Kamehameha:
        Goku''s signature technique, which Gohan learned from his father during their
        training in the Hyperbolic Time Chamber. Gohan''s most powerful and famous
        use of this technique is the Father-Son Kamehameha, utilized alongside his
        father''s spirit to finally destroy Cell. *Kiai: The ability to project an
        invisible burst of force with ki, which Gohan can perform with his hands.
        Saiyan Physiology: The physiology of a Saiyan, an aggressive warrior race
        of conquerors. Saiyans have the natural ability to control ki and to fly.
        While his lifespan is comparable to that of a human, Gohan will remain at
        his peak strength for much longer. One of the most powerful abilities of a
        Saiyan is their ability to grow stronger and stronger through combat, allowing
        Gohan to constantly push his own limits during a fight and rise to higher
        and higher peaks in power. This ability grants a substantial boost in power
        when Gohan is badly injured, allowing him to reach a whole new level of power
        once he recovers. *Oozaru: When exposed to the light of the full moon, as
        long as he still has his tail, Gohan will undergo a transformation into the
        Oozaru, a massive, gigantic monkey with far greater power. However, this comes
        at the expense of his skill, turning him into a violent, mindless monster
        who cannot differentiate between friend and foe. *Super Saiyan: The famous,
        legendary transformation of a Saiyan that allows them to greatly surpass their
        limits and reach the fabled state that is Super Saiyan. Gohan achieved this
        state during his training with his father in the Hyperbolic Time Chamber.
        These transformations can be reached through extensive training, but are more
        often unlocked in moments of intense emotional turmoil and need, and due to
        the natural aggressiveness of Saiyans, they cause the user to become more
        aggressive and malicious, and though Gohan has managed to make these things
        effectively a non-issue through training, his first transformation into a
        Super Saiyan 2 caused him to become extremely sadistic. While immensely powerful,
        Super Saiyan transformations drain a lot of energy, and the first was very
        inefficient before Gohan mastered the state and became a "Full Power Super
        Saiyan", allowing him to maintain the form effectively indefinitely without
        issue. While the original Super Saiyan state is eclipsed in power by Super
        Saiyan 2, the higher forms become increasingly inefficient. Potential Unleashed:
        The ultimate form that Gohan gains after having his potential unlocked by
        Old Kai''s lengthy ritual, greatly increasing his power by unlocking his extremely
        high dormant strength. While this state must be maintained by steady, regular
        training, while Gohan has access to it, he can tap into its power by powering
        up just as he would to go Super Saiyan. Its power eclipses that of his Super
        Saiyan forms by a significant margin, and in this state, Gohan is often known
        as Mystic Gohan or Ultimate Gohan. Notes: The statement regarding Cell Max,
        stating if he was complete, he would be unable to be stopped by Broly. Is
        referring to the mind control that was meant to be implemented in him. As
        Toriyama notes, without it Cell Max is a brainless'
