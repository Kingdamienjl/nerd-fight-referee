- id: claim-weaknesses-cacd2c62
  section: weaknesses
  axis: weakness
  text: 'Baby is arrogant, short-tempered, and destructive. Once he invades a large
    body, once it shrinks if he cannot keep up with it''s size decrease speed he must
    flee lest he be crushed. Those with incredible body control or strange physiology
    on the level of Majin Buu can simply ignore and spit out Baby''s eggs without
    being affected. Whilst his slaves act according to his Will at all times, he can
    and often will command them to stop doing so to his own detriment, such as when
    (Infected) Gohan was going to finish off Pan, when the (Infected) Saiyans were
    going to Infect Goku, or when they defended him from Majuub. Furthermore, due
    to his self-destructive nature, he can and will harm his own slaves, especially
    as a Golden Oozaru, where his power has nearly driven him mad. His fixation on
    the Saiyans gives him great power, will, and hatred, which also unfortunately
    leads to him making poor decisions when pitted against them, as it overwhelms
    his rational thinking. When against the Oozaru, the sufferings and memories of
    his people will manifest and force him into fear and terror, even causing him
    to freeze as he reels in fright, though he will continue to fight despite this.
    {| class="mw-collapsible mw-collapsed" align="center" border="1" cellpadding="1"
    cellspacing="1" style="width:100%" | colspan="2" style="text-align: left'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
