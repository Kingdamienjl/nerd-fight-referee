  section: abilities
  axis: hax
  text: "Without a Host \u25BE= Resistance to: Nothing Notable Possessing Vegeta \u25BE\
    = All previous abilities enhanced plus: *Superhuman Physical Characteristics *Master\
    \ Martial Artist (Vegeta has consistently matched Goku in martial arts skill ever\
    \ since his first appearance back in the Saiyan Saga, and continued to do so into\
    \ the present day) **Afterimage Creation (Shown hereDragon Ball GT - Episode 61)\
    \ **Pressure Point Strikes (Shown hereDragon Ball Z - Episode 237) **Acrobatics\
    \ *Ki Manipulation (Master Level) (Can be used defensively and offensively, to\
    \ strengthen his skin or to fire ki blasts or create constructs, which he can\
    \ control telekinetically to home in on targets, and form defensive barriers that\
    \ render absorption ineffective, or use his Aura to keep out attacks and foreign\
    \ substances, can also redirect, suppress and nullify others' ki blasts, can alter\
    \ the weather by powering up, and those who try to use their senses on practioners\
    \ have their perception manipulated. Additionally, using Ki requires a totally\
    \ relaxed state that is cleared even beyond stillness as well as emptying the\
    \ mind, and despite this to use totally effectively also be capable of feeling\
    \ various emotions capable of complex thought for strategies in the midst of combat)\
    \ **Ki Transferance & Healing (Should scale to Goku, who gave Frieza his Ki to\
    \ float and survive and brought a bird back from the brink of death through granting\
    \ it Ki in Cooler's Revenge, should scale above the rest of the Son Family and\
    \ Trunks, who was able to gift Ki and 'Saiya Power' to Goku. Scales above the\
    \ Z-Fighters, who have given Piccolo their Ki against Frieza, as well as given\
    \ Ki to Goku to beat both Broly and Lord Slug in their respective films) **Ki\
    \ Sensing (Can locate others by simply reading their ki, can track others movement\
    \ via maintaining a tight grasp on their Ki, as well as their precise movements\
    \ via disturbances in their own energy as well as the world around them, detect\
    \ malicious intent, difference in power levels, and beings in different dimensions.\
    \ This works even on those who suppress their Ki, as even basic movements release\
    \ energy to be noted, and those who have gone beyond that and detects those who\
    \ are capable of total energy suppression, which usually totally cloaks your presence,\
    \ hiding you from perception and removes even those tiny releases of Ki) *Limited\
    \ Longevity (Known intergalactically as the \"warrior race of the universe\",\
    \ Saiyans have evolved to remain in their physical prime for a long period of\
    \ time. They age slowly after reaching their primeToriyama Thought of It Like\
    \ This\u201D Special, Part 2 \u2014 Super Exciting Guide: Character Volume, Chapter\
    \ 11, Page 9 in order to remain young and battle-ready for decades;Daizenshuu\
    \ 4: World Guide \u2014 Racial Groups (Characteristics) after reaching a certain\
    \ age, however, they rapidly grow frail. Additionally, Saiyans have a longer lifespanAkira\
    \ Toriyama-sensei Super Q&A!! than humans) *Limited Perception Manipulation &\
    \ Stealth Mastery (Those who try to observe practioners of Ki cannot observe the\
    \ truth of their actions. When mastering Ki Suppression to the utmost extent,\
    \ you erase your presence from others. With his sharpened spirit,Dragon Ball -\
    \ Chapter 165 Goku mastered the ability of \"[crouching as quiet as the sky and\
