      toyed with and dominated Super Buu after he absorbed Gohan and could kill him
      any timeDragon Ball Z - Chapter 3101.053 GigaFoe)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Massively Hypersonic+ flight speed (Far superior to GotenksMach
      5,197.52), at least FTL+, likely far higher combat speed (As a Potara fusion
      of Goku and Vegeta, Vegito is vastly superior to them both>27 c), far higher
      as a Super Saiyan (Casually blitzed Super Buu several timesDragon Ball Z - Chapter
      310)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class G (Far stronger than Frieza Arc Goku>3,002,361.41 Tons),
      far higher as a Super Saiyan (Increases a Saiyan's lifting capabilitiesDragon
      Ball Z - Chapter 234)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Solar System level, far higher as a Super Saiyan
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Solar System level, far higher as a Super Saiyan (Nothing Buu could
      do harmed him in the slightest)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (As a fusion of Vegeta and Goku, Vegito should have comparable
      stamina. He never tired in his "fight" against Buu, and his fusees have withstood
      extreme punishment and kept on fighting. However, given that his fusion can
      only last for an hour at most, his stamina is irrelevant as he will eventually
      defuse. As a jawbreaker, his stamina should be the same if not even higher due
      to Inorganic Physiology)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Extended Melee Range to Hundreds of Meters with Ki
      Blade/Spirit Sword; Interplanetary with ki blasts and attacks; Low Multiversal
      with Instant Transmission. Below Standard Melee Range as a jawbreaker
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Extraordinary Genius (With a combination of Vegeta's cunning and Goku's
      prodigal skill, Vegito is an extremely intelligent individual when it comes
      to combat, with skill that is matched only by the greatest of opponents. He
      should possess Goku's mastery of ki and understanding of the Super Saiyan transformations
      and their costs and his ability to effortlessly replicate other ki-based techniques,
      along with Vegeta's cunning and skill at reading his opponents' movements. He
      feigned arrogance in his fight with Super Buu, smugly toying with him to bait
      him into trying to absorb him so that he could rescue all those he had absorbed)
    source_ids: *id002
    confidence: 0.8
