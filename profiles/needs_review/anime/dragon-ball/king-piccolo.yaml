- id: claim-weaknesses-cc302dd5
  section: weaknesses
  axis: weakness
  text: 'Overconfident. Due to his prior imprisonment, he is terrified of The Evil
    Containment Wave,Dragon Ball - Chapter 146 and will freak out if he sees any attack
    that vaguely resembles it. Fighting at full power puts immense strain on his body
    as it shortens his lifespan every time he uses it. His regeneration is also stamina-based
    and cannot regenerate if his brain is destroyed. {| class="mw-collapsible mw-collapsed"
    align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%" |
    colspan="2" style="text-align: left; " |Notable Attacks and Techniques: |- | The
    fighting power and life force of a martial artist, a tangible energy derived from
    the user''s vigor, courage, and mind. It can be used in a number of ways, such
    as to surpass the limits of one''s body to greatly increase in strength, and it
    can be fired as blasts of energy or used to create defensive barriers. Along with
    his Namekian heritage and Dragon Clan status, this is the source of Piccolo''s
    superhuman capabilities and power. He is incredibly skilled in the art of ki control.
    He often fires powerful blasts of ki from his mouth. *: King Piccolo fires a very
    powerful energy wave shot from a single hand, with the other arm supporting the
    one that is firing the attack. **: King Piccolo fires two energy waves one after
    another. The first to distract the opponent and the second to actually hit them
    head on. *: King Piccolo can shoots laser-like beams from both eyes. *: King Piccolo
    manipulates his ki to create a massive explosion with a swift upwards motion of
    the hand, that has the potential to cause a massive crater in the desired area.
    *: King Piccolo holds out their index finger and releases an energy beam from
    their fingertip. Whilst not inherently distinct from a regular Ki blast many of
    these techniques are intended to be released as precise, focused beams, and often
    have drilling or other penetrative properties as opposed to the explosive effects
    of most Ki blasts. As a member of the Dragon Clan, Piccolo has several magical
    abilities. *: King Piccolo can manipulate objects and other people with the power
    of one''s mind. *: King Piccolo can create objects and clothing, seemingly out
    of thin air, often using this to create his weighted clothing whenever he has
    a need for it. Piccolo is a Namekian, a long-lived race of slug-like aliens with
    exceptional hearing. This grants him several abilities, most notably the power
    to regrow lost limbs and destroyed organs as long as his head remains intact.
    He can also extend his arms to great lengths to attack and grab opponents from
    a distance, and he can even use his regenerative powers to greatly increase his
    body''s volume, growing significantly in size as a result. *: Like many Namekians,
    King Piccolo has the ability to fuse with other Namekians to get stronger. *:
    King Piccolo can stretches their arms by expanding and contracting the cells in
    their body through willpower . *: King Piccolo can communicate with others using
    one''s mind. Piccolo can also read the minds of the ones they communicate with,
    similar to telepathic eavesdropping. *: King Piccolo''s version that creates the
    Mutated Namekians. King Piccolo capable of creating Demon Clan members by laying
    eggs from his mouth, making the technique a corrupted version of the Dragon Clan''s
    natural egg-laying ability. *: As a Namekian, King Piccolo''s rapid healing powers
    and regeneration capabilities allow him to regenerate any lost limb or damaged
    body part (apart from a destroyed brain) within moments. With the accumulated
    energy from the Namekian race absorbed into him, Piccolo possesses vast reserves
    of stamina and Ki, practically making his regenerative powers unlimited. |}'
