    text: "Above Average in general, Genius Combatant (King Piccolo is a cold and\
      \ cunning leader. He already posed an immense threat to Earth upon his birth,\
      \ so much so that Master Mutaito, who was one of the most skilled and powerful\
      \ fighters at the time, saw no other choice but to seal him away.Dragon Ball\
      \ - Chapter 135 He's a highly formidable combatant even when old and weak. He\
      \ quickly stomped Goku in their first fight, who had already fought and surpassed\
      \ seasoned martial arts veterans like Master Roshi, Tao Pai Pai, and Korin.\
      \ He's also a decent strategist, as he orchestrated a planet-wide slaughter\
      \ of every martial artist who participated in the Tenka'ichi Bud\u014Dkai, so\
      \ that no one could challenge his rule.Dragon Ball - Chapter 136 He also killed\
      \ Shenron, knowing that it would cause the Dragon Balls to remain as stones\
      \ indefinitely and couldn't be used by his opponents to wish for his demise.\
      \ In his second fight with Goku, Piccolo was able to get him to stand down by\
      \ taking Tien as a hostage. He's a skilled manipulator, as he successfully misled\
      \ Lord Pilaf and his minions into briefing him about the Dragon Balls under\
      \ the false promise that he'd give them a spot of land to rule once he got his\
      \ wish granted. He then cast them aside once he no longer found use for them.Dragon\
      \ Ball - Chapter 148 He also knows how to utilize fear and intimidation to get\
      \ what he wants, as evidenced when he successfully got the King of the world\
      \ to abdicate his throne by razing a city right before his very eyes.)"
