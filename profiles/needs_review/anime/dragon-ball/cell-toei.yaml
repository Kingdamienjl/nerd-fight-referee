- id: claim-weaknesses-013ec475
  section: weaknesses
  axis: weakness
  text: 'Cell is extremely overconfident, and due to his Saiyan blood, he relishes
    a good challenge and will avoid fighting at full power and let opponents reach
    their most powerful states to get one. When outmatched, Cell will begin to panic
    and fly into a rage, fighting irrationally. He cannot absorb mechanical beings
    by puncturing them with his tail, and powerful enough strikes to his stomach can
    cause him to regurgitate whoever he absorbed by engulfing them with his tail,
    causing him to devolve if he regurgitates one of the androids. He needs to locate
    a ki signature to teleport using Instant Transmission {| class="mw-collapsible
    mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
