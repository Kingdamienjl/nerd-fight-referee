    - field: weaknesses
      value: 'Cell is extremely overconfident and desires a good fight above all else
        due to his Saiyan blood, Cell will begin to panic and fly into a rage, fighting
        irrationally. He cannot absorb mechanical beings by puncturing them with his
        tail, and powerful enough strikes to his stomach can cause him to regurgitate
        whoever he absorbed by engulfing them with his tail, causing him to devolve
        if he regurgitates one of the androids. He needs to locate a ki signature
        to teleport using Instant Transmission. Notable Attacks and Techniques:, Death
        Beam: A technique gained from Frieza''s DNA that takes the form of a small,
        Kamehameha: The closest thing that Cell has to a signature attack, gained
        from Goku''s DNA. After charging up the attack in his hands and at his side,
        blue burst of ki that is powerful enough to destroy planets, can destroy the
        entire solar system., Cell charges up an aura before expelling it as a protective,
        expanding barrier that can block attacks and damage opponents who are caught
        in it., Cell learned this technique, which allows him to lock onto the ki
        signatures of others and teleport to their locations. Its use takes some concentration,
        and he needs a ki signature to teleport to, otherwise he cannot perform the
        technique. It can be used to teleport others as well, Spirit Bomb: Goku''s
        ultimate attack, taught to him by King Kai, it takes a very long time to charge
        and is therefore very difficult to use, though the charge time can be sped
        up by gathering energy from those who willingly and knowingly provide it.
        Given that Cell is a monster, there are few who would be willing to give him
        the ki for a Spirit Bomb.'
