      planet in the Otherworld to Earth) | Standard Melee Range. Low Multiversal with
      ki-based attacks and Instant Transmission
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius in combat (Despite his young age and technical lack of experience,
      Cell has inherited the knowledge and skill of those he was created from. His
      combat skill and knowledge of ki allows him to immediately and easily see through
      the weaknesses of Trunks' new transformation, and in combat, he easily matched
      Goku. He was able to outmaneuver and escape Piccolo and the other's attempts
      to hunt him down while constantly feeding on new humans in the process, and
      due to his knowledge on the techniques and personalities of the Z-Fighters,
      he is capable of easily manipulating them and playing to their differing desires.
      However, Cell is immensely overconfident and desires a good fight above all
      else. Additionally, in comparison to his canon counterpart, he has significantly
      more experience in terms of combat)
    source_ids: *id002
    confidence: 0.8
