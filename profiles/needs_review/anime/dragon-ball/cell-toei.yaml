  tier:
    text: "3-C, becomes higher from absorbing more people, , up to far higher with\
      \ Kamehameha, Galick Gun and Makank\u014Dsapp\u014D | 3-C, , up to far higher\
      \ with Kamehameha, Galick Gun and Makank\u014Dsapp\u014D, High 3-A with Self-Destruction\
      \ | High 3-A, , up to far higher with Kamehameha, Galick Gun and Makank\u014D\
      sapp\u014D | High 3-A, , up to far higher with Kamehameha, Galick Gun and Makank\u014D\
      sapp\u014D | 2-C, , up to far higher with Kamehameha, Galick Gun and Makank\u014D\
      sapp\u014D"
    source_ids: &id002
    - mediawiki-4766874
    confidence: 0.8
  attack_potency:
    text: "Galaxy level (Significantly stronger than Cooler. Cell was easily able\
      \ to kill the Future Trunks of his timeline and [https://imgur.com/a/BRcZ4Ok\
      \ managed to keep up] with Piccolo after he fused with Kami), becomes higher\
      \ from absorbing more people (After absorbing hundreds of thousands of humans,\
      \ he [https://imgur.com/a/ZUp02tY casually overwhelmed Android 17] and Piccolo,\
      \ even withstanding the latter's most powerful attack without any visible damage\
      \ before matching Android 16), Varies (The Kamehameha works by condensing one's\
      \ Ki into a single point, the power of the move proportionally varying depending\
      \ on how much power is condensed), up to far higher with Kamehameha (His Kamehameha\
      \ made Piccolo terrified and forced him to dodge, despite Piccolo being shown\
      \ as largely superior to Cell prior. The Kamehameha can get strong enough to\
      \ completely annihilate beings far superior to the user), Galick Gun (Is comparable\
      \ to, if not superior to the Kamehameha as shown by Vegeta) and Makank\u014D\
      sapp\u014D (Is shown to outright be superior to the Kamehameha in terms of sheer\
      \ power output as shown by Piccolo) | Galaxy level (Added 17's power to his\
      \ own. Casually stomped Android 16, who had previously matched him in his Imperfect\
      \ form), Varies, up to far higher with Kamehameha, Galick Gun and Makank\u014D\
      sapp\u014D, High Universe level with Self-Destruction (His Self-Destruction\
      \ killed Super Saiyan Goku) | High Universe level (Far stronger than before,\
      \ with [https://imgur.com/a/wPGBVp6 Elder Moori speculating that he was powerful\
      \ enough to threaten the entire] Living Universe. After reaching his Perfect\
      \ Form, Cell was [https://gyazo.com/f15e6f76d2dd43ef2805484eafb44e0b stated\
      \ by the narrator to have Infinity Battle Power]. While holding back, [https://imgur.com/a/qvdqEyw\
      \ he manhandled Full Power Super Saiyan Goku in their warm-up session], whose\
      \ Base Form is capable of fighting and harming Restrained Super Saiyan Broly.\
      \ At full power, Cell is much stronger than Goku or any other Z-Fighter other\
      \ than Super Saiyan 2 Gohan), Varies, up to far higher with Kamehameha, Galick\
      \ Gun and Makank\u014Dsapp\u014D | High Universe level (After his Zenkai, he\
      \ became far stronger than before, managing to reach Super Saiyan 2 Gohan's\
      \ level and breaking his arm with a single ki blast. Disposed of Piccolo and\
      \ the other Z-Fighers [https://imgur.com/dnkaYML with his] [https://imgur.com/bjGE2Pm\
      \ aura alone]), Varies, up to far higher with Kamehameha (In this state, Cell's\
      \ Kamehameha is said to be strong enough to wipe out the entire Solar System),\
      \ Galick Gun and Makank\u014Dsapp\u014D | Low Multiverse level (Powered up after\
      \ training in Hell for many years and confidently challenged Goku even after\
      \ having witnessed him fight Kid Buu), Varies, up to far higher with Kamehameha,\
      \ Galick Gun and Makank\u014Dsapp\u014D"
    source_ids: *id002
    confidence: 0.8
  speed:
