    \ level of powerDaizenshuu 7 \u2013 Dragon Ball Encyclopedia: Special Attack Dictionary\
    \ he can create dimensional rifts and destroy space-time and pocket dimensionsDragon\
    \ Ball Z Kai - Episode 146 with his energy.Dragon Ball Z - Chapter 299 Capable\
    \ of destroying Hit's pocket dimensionsDragon Ball Super - Episode 111) **Enhanced\
    \ Ki Sensing (; Can locate others by reading their Ki,Dragon Ball - Chapter 152\
    \ detect malicious intent,Dragon Ball Z Kai - Episode 57 differences in power\
    \ levels,Dragon Ball Z Kai - Episode 1 and beings in different dimensions.Dragon\
    \ Ball Super - Episode 111 Also allows movement tracking without relying on visual\
    \ detection by sensing Ki movements.Dragon Ball Z Kai - Episode 9Dragon Ball Z\
    \ Kai - Episode 153 Even can sense God Ki, which cannot be sensed by beings lesser\
    \ than a \"God\"Dragon Ball Super - Episode 125) *Rage Power (Derives strength\
    \ from his conviction in his own powerDragon Ball Super - Episode 130) *Attack\
    \ Reflection (Can reflect attacks from opponents with his barrierDragon Ball Super\
    \ - Episode 130) *Paralysis Inducement & Explosion Manipulation (Can trap opponents\
    \ within his sphere of Ki and make the sphere explode afterwardDragon Ball Super\
    \ - Episode 122) *Enhanced Danmaku (Was capable of launching an attack that combined\
    \ shockwaves from his fists with a barrage of super rapid-fire punches, releasing\
    \ them on an enormous scale to both overwhelm and defend against attacksDragon\
    \ Ball Super - Episode 129) *Greater Analytical Prediction (Analyzed the movement\
    \ of the fast-moving Kachi Katchin and determined that there was no need to dodge.Dragon\
    \ Ball Super - Episode 96 Can predict Hit's movements while using Time-Skip, which\
    \ can skip and stop time freely to mislead opponents.Dragon Ball Super - Episode\
    \ 111 Even after observing Goku and Kefla's battle, was able to predict Goku's\
    \ every move in Ultra Instinct -Sign-Dragon Ball Super - Episode 129) Resistance\
    \ to: *Time Stop & Time Travel (Broke through Hit's Time Cage, which is \"Time\
    \ Skip in Reverse\"Dragon Ball Super - Episode 111Due to the vast amount of inconsistencies\
    \ between various feats, statements, and information given about Time Skip, such\
    \ as the mechanics explained by Vados and Whis, (that it is merely limited Time\
    \ Travel that stores time) being directly contradicted on multiple occasions,\
    \ including feats like freezing Goku in time (twice), Hit's own words, and Word\
    \ of God, or what even qualifies as Time Skip, as Tides of Time (Hit's Dimension-Shift)\
    \ was initially stated not to be, but this was contradicted later in the Tournament\
    \ of Power, or regarding how Time Skip has a reliant Dimension connected to it\
    \ for Time Storage contradicts Hit's testimony regarding how he never made Time\
    \ Skip do more than its initial basic function before, (and the basic mechanics,\
    \ as he needs to skip time first to then store it, contradicting even that description),\
    \ etc. has created a patchwork of incoherence. Due to this, and how the Time Freezing\
    \ and Travelling related parts of the ability must both be simultaneously true\
    \ for the plot of the Dragon Ball Super Anime to make sense (as Vados/Whis explanation\
    \ is the sole reason he has his greater Time Dimension abilities thoughout the\
    \ Assassination Arc and the Tournament of Power, and he needs the abilities to\
    \ also specifically be Time Stop for certain major plot sequences, like Time Cage,\
    \ {a Time Stop ability which is explicitly described as \"Time Skip in Reverse\"\
    } to affect Jiren), as well as the fact they are used interchangeably at several\
    \ points, our community has decided to index the ability as both Time Travel and\
    \ Time Stop, and to simply reconcile the best we can by ignoring these glaring\
    \ contradictions to get the most accurate listing of Hit's ability. As such, Jiren's\
    \ ability to get around these abilities will be indexed as they would be if this\
    \ inconsistency did not exist. This includes resisting both time travel and stop.)\
    \ *Empathic Manipulation (Was unaffected by Ribrianne's Light of Love, which causes\
