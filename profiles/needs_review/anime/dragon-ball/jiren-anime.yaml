resistances:
- id: powers-and-abilities-resistance-to-time-stop-time-travel-broke-through-hit-s-tim
  name: 'Resistance to: *Time Stop & Time Travel (Broke through Hit''s Time Cage,
    which is "Time Skip in Reverse"Dragon Ball Super'
  description: 'Resistance to: *Time Stop & Time Travel (Broke through Hit''s Time
    Cage, which is "Time Skip in Reverse"Dragon Ball Super - Episode 111Due to the
    vast amount of inconsistencies between various feats, statements, and information
    given about Time Skip, such as the mechanics explained by Vados and Whis, (that
    it is merely limited Time Travel that stores time) being directly contradicted
    on multiple occasions, including feats like freezing Goku in time (twice), Hit''s
    own words, and Word of God, or what even qualifies as Time Skip, as Tides of Time
    (Hit''s Dimension-Shift) was initially stated not to be, but this was contradicted
    later in the Tournament of Power, or regarding how Time Skip has a reliant Dimension
    connected to it for Time Storage contradicts Hit''s testimony regarding how he
    never made Time Skip do more than its initial basic function before, (and the
    basic mechanics, as he needs to skip time first to then store it, contradicting
    even that description), etc. has created a patchwork of incoherence. Due to this,
    and how the Time Freezing and Travelling related parts of the ability must both
    be simultaneously true for the plot of the Dragon Ball Super Anime to make sense
    (as Vados/Whis explanation is the sole reason he has his greater Time Dimension
    abilities thoughout the Assassination Arc and the Tournament of Power, and he
    needs the abilities to also specifically be Time Stop for certain major plot sequences,
    like Time Cage, {a Time Stop ability which is explicitly described as "Time Skip
    in Reverse"} to affect Jiren), as well as the fact they are used interchangeably
    at several points, our community has decided to index the ability as both Time
    Travel and Time Stop, and to simply reconcile the best we can by ignoring these
    glaring contradictions to get the most accurate listing of Hit''s ability. As
    such, Jiren''s ability to get around these abilities will be indexed as they would
    be if this inconsistency did not exist. This includes resisting both time travel
    and stop.) *Empathic Manipulation (Was unaffected by Ribrianne''s Light of Love,
    which causes anyone who smells the aroma released by the attack to become infatuated
    with her and the other Kamikaze FireballsDragon Ball Super - Episode 102) *Existence
    Erasure, Soul Destruction, Void Manipulation & Space-Time Erasure (History; Stated
    to be able to best ToppoDragon Ball Super - Episode 109'
  source_ids: *id002
