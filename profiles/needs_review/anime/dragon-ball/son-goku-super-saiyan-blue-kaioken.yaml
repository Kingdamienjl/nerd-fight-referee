        completely unstoppable, even as Hit was constantly improving said technique
        in battle. [https://www.dailymotion.com/video/x56p9bs Immediately figured
        out how to use a Ki blast to resurrect himself after he was killed by Hit].
        Goku mastered Ultra Instinct, a technique even the Gods of Destruction have
        deemed a difficult task, with none of them stating to have mastered it, including
        Beerus, despite being hundreds of millions of years older with experience
        as a God of Destruction. He also had performed such a feat in less than 48
