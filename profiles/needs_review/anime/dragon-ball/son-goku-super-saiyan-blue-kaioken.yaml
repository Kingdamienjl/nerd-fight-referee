    - field: weaknesses
      value: Goku often seeks to fight opponents at their best and will allow them
        to reach their full power so he can have a good fight. Kaio-ken strains his
        body and causes intense pain. It could horribly damage or even kill him if
        he doesn't use it sparingly. He has a tendency to be so overconfident that
        he drops his guard, lowering his durability. He needs a long charge time to
        prepare his Spirit Bomb, leaving him open to attack. In order to use Instant
        Transmission, he needs to sense a ki signature to teleport to. Using Super
        Saiyan 3 drains a lot of stamina and he cannot use it for more than a few
        minutes. Is unable to survive in the vacuum of space.
