- id: claim-weaknesses-9e33e4d8
  section: weaknesses
  axis: weakness
  text: 'Shenron can only grant one wish per summoning and cannot grant the same wish
    more than once, such as resurrecting people a second time.Dragon Ball - Chapter
    198Dragon Ball - Chapter 218Dragon Ball - Chapter 321Dragon Ball - Chapter 417
    He cannot grant a wish that surpasses the power of his creator, such as affecting
    stronger individualsDragon Ball - Chapter 212Dragon Ball - Chapter 417 and extremely
    powerful natural disasters.Dragon Ball - Chapter 243 If his creator dies, Shenron
    will disappear as well.Dragon Ball - Chapter 194Dragon Ball - Chapter 355 He cannot
    resurrect those who have died of natural causes such as old age or diseases.Dragon
    Ball - Chapter 321 A person''s body must be preserved in optimal conditions (such
    as keeping it from rotting or maintaining physical integrity) in order to achieve
    proper resurrection, for Shenron cannot restore one''s body and resurrect them
    in a single wish;Dragon Ball - Chapter 137Dragon Ball - Chapter 193 this was exemplified
    when he brought Frieza back in the form of separate pieces, for he could not recreate
    his body. Should share Porunga''s limitation of only reviving people in the place
    where either they have been killed or their physical body lies, thus requiring
    to first summon their souls elsewhere with another wish.Dragon Ball - Chapter
    328Dragon Ball - Chapter 329 When resurrecting multiple people, he cannot resurrect
    anyone who has been dead for over a year. Shenron''s powers are limited to his
    home universe, for he was unable to detect the last Super Dragon Ball, which was
    located in Universe 6.Dragon Ball Super - Episode 29 Shenron cannot stay out in
    the world for too long, otherwise his body will fade and he will be forcibly returned
    within the Dragon Balls. As stated by Degesu, Shenron would not accept a "black"
    wish involving the death of other beings, for his powers are based on white magicDragon
    Ball Daima - Episode 1 Upon having been restored by Dende, Shenron became able
    to grant up to three wishes. If a wish requires great power, such as bringing
    back a large amount of people, or even a whole planet''s population, it will consume
    two wishes.Dragon Ball - Chapter 394 After this new upgrade, Shenron has seemingly
    become able to resurrect people regardless of the time that has passed since their
    death, as Goku attempted to wish back to life King Kai, Bubbles and Gregory, who
    at that point had been dead for many years. Shenron refuses to grant more than
    one wish to people who have not already summoned him in the past.Dragon Ball Daima
    - Episode 1 Note: Shenron was originally implied to be able to kill people through
    his powers, as Chaotzu attempted to wish for the destruction of King PiccoloDragon
    Ball - Chapter 417 and Kami thought of using the Dragon Balls to obliterate Vegeta
    and Nappa, with his only doubt being their greater strength,Dragon Ball - Chapter
    205 a notion later confirmed by Shenron himself. However, the most recent developments
    regarding the nature of his magic are considered to have priority.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
