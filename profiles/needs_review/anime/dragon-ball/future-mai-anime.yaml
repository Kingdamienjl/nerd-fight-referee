  axis: equipment
  text: 'Future Mai.webp|Future Mai''s shotgun DB Legends Trunks - Mai 2929 Strike
    for the Future 26 Mai side by side% 29.webp|Future Mai''s twin pistols Mai DBS
    Ep 63 002.webp|Future Mai''s sniper rifle *Firearms: Various guns that Mai carries
    around her. **Shotgun: A sawn-off Remington 870 that fires rounds of singular
    bolts of energy. It is also capable of functioning as a grenade launcher for Mai''s
    many grenades. **Twin automatic pistols: Two H&K USPs that have been modified
    to be fully automatic. **Sniper rifle *Motor Scooter: Her source of transportation,
    allowing her to quickly cover ground, and to rescue an ally. *Rocket Launchers:
    Large bazookas that shoot miniature rockets. Mai and her soldiers attempted to
    fire them at Goku Black. However, he made them detonate before they could hit
    him. *Flash Grenades and Tear Gas: A bomb that sets off an extremely bright light,
    temporarily blinding the target it is thrown at. Similar to the "Solar Flare"
    attack that many ki users in Dragon Ball possess. Mai used this as a brief distraction
    to get Trunks away from Goku Black to safety. *Poison Bombs: Small, capsule-shaped
    weapons that release a highly toxic and poisonous gas. Works much like the flash
    grenade as a brief distraction tool. However, poison bombs can cause far greater
    damage if a target is exposed to it for long enough. *Bulma''s Parting Gift: An
    advanced bullet made and given to Mai by Future Bulma. It''s described as having
    kinetic energy several times stronger than a standard issue round.'
  source_ids: *id003
