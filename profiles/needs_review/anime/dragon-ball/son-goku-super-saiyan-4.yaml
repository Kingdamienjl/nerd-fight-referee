        Flash and exploited it to take advantage of an opening, Frieza''s inability
        to sense Ki to create openings in his defenses, or Cell''s perfected combat
        to lure and lead the four fighters into a means of which he can defeat all
        at once. Identified that it wasn''t Haze'
