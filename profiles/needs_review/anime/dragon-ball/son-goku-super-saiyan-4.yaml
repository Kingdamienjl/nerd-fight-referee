    - field: weaknesses
      value: "Goku seeks strong opponents and therefore will allow his opponents to\
        \ reach their full power for the sake of a good fight. Kaioken strains his\
        \ body, causing him intense pain and exhaustion if he overuses it. His Spirit\
        \ Bomb requires a long charge-up period, during which time he is vulnerable.\
        \ Incapable of using Instant Transmission beyond a few meters due to his Child\
        \ Body without amplification. Super Saiyan 3 drains his ki rapidly, and his\
        \ weaker, child body makes it even more difficult to use, limiting its use\
        \ to only a few seconds at a time. | All the same weaknesses as before, except\
        \ now with the return of his tail he no longer has strain within any Super\
        \ Saiyan form, and can access his Adult Body, allowing flawless use of Instant\
        \ Tranmission. | All the same weaknesses, except he's in his Adult Body all\
        \ the time, now, and thus can always use flawless Instant Transmission. {|\
        \ class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
        1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
        \ left; \" |Notable Attacks/Techniques: |- | |-|Ki Attacks= The fighting power\
        \ and life force of a martial artist, a tangible energy derived from the user's\
        \ vigor, courage, and mind. It can be used in a number of ways, such as to\
        \ surpass the limits of one's body to greatly increase in strength, and it\
        \ can be fired as blasts of energy or used to create defensive barriers. Along\
        \ with his Saiyan blood, Ki acts as the source of Goku's incredible power\
        \ and abilities. Goku's prodigal skill in combat and the use of ki allows\
        \ him to replicate the ki techniques of others after seeing them only once.\
        \ *{{Nihongo|Kamehameha|\u304B\u3081\u306F\u3081{{Ruby|\u6CE2|\u306F}}}}:\
        \ Goku's famous signature technique, which he learned after witnessing Master\
        \ Roshi use it to extinguish the flames on Fire Mountain, successfully replicating\
        \ it not long later on his first try. As his signature technique, it is something\
        \ that Goku has used on many occasions, and he has created a number of variations\
        \ over the course of his fighting experience, such as firing it from his feet,\
        \ using it to propel himself into the air, and bending it mid-flight to catch\
        \ opponents by surprise. Perhaps the most useful variation is the Instant\
        \ Kamehameha, in which Goku uses Instant Transmission to teleport just before\
        \ firing the attack, appearing right in front of his opponents and giving\
        \ them no time to dodge. As a Super Saiyan 4, Goku can use the 10x Kamehameha,\
        \ a much more powerful variant, tinged crimson by the power of Super Saiyan\
        \ 4. *{{Nihongo|Dragon Fist|{{Ruby|\u9F8D|\u308A\u3085\u3046}}{{Ruby|\u62F3\
        |\u3051\u3093}}|Ry\u016Bken}}: One of Goku's most powerful techniques, used\
        \ to destroy opponents much more powerful than himself. To use it, Goku charges\
        \ at his opponent, rearing his fist back for a powerful punch, and then rips\
        \ through them with it, manifesting his ki in the form of a massive golden\
        \ dragon, and causing an explosion of force. He can combine this with the\
        \ 10x Kamehameha to first blast his opponent before lunging straight through\
        \ his own attack to punch through his target. *{{Nihongo|Kaioken|{{Ruby|\u754C\
        \u738B\u62F3|\u304B\u3044\u304A\u3046\u3051\u3093}}|Kai\u014Dken}} A technique\
        \ developed by King Kai and taught to Goku during his time training on his\
        \ planet. It greatly increases Goku's ki for just a moment, boosting his strength\
        \ and speed significantly for that time. However, this heavily strains his\
        \ body, and if he overuses it, it will leave him in intense pain all over\
        \ his body, leaving him incapable of moving without causing himself further\
        \ pain. Initially, the strongest Kaioken Goku can utilize is x4, but by the\
        \ time of the Frieza Saga, he has mastered its use, allowing him to push it\
        \ to his maximum of x20. Goku is able to combine this with his Super Saiyan\
        \ transformations to boost his power even further, though it puts him under\
        \ considerable strain. *{{Nihongo|Spirit Bomb|{{Ruby|\u5143|\u3052\u3093}}{{Ruby|\u6C17\
        |\u304D}}{{Ruby|\u7389|\u3060\u307E}}|Genkidama}} Goku's ultimate attack,\
        \ taught to him by King Kai, performed by gathering a vast amount of energy\
        \ from all the lifeforms in his surroundings to create a massive, incredibly\
        \ destructive sphere of ki. To use it, one must have a pure heart, and so\
