  intelligence:
    text: 'Average generally. Extraordinary Genius in Combat: Although he lacks knowledge
      when it comes to things that aren''t related to fighting, Goku is a master of
      prodigal skill when it comes to martial arts, with years of experience fighting
      against powerful opponents with a plethora of abilities. As a child, he was
      able to beat martial artists on such a level as Grandpa Gohan, who was stated
      to be an [https://imgur.com/a/zF95ZiQ unparalleled master in all martial arts
      on Earth], with [https://imgur.com/a/Cpemp6s martial arts in Dragon Ball exceeding
      real life towards Dan/Level 30] where there is only 10. In his battle with Master
      Roshi, [https://imgur.com/a/NtmkZMu was able to copy and improve upon a technique
      on sight], later in that same battle once faced against the Sui-Ken, [https://imgur.com/a/XgVkuRH
      a martial art he couldn''t copy because he had never experienced inebriation],
      Goku [http://web.archive.org/web/20111104071908/http://kanzentai.com/trans-daiz04.php?m=05&id=attacks#link:~:text=As%20you%20can%20see%20from%20the%20Suiken%2C%20one%20attacks%20through%20irregular%20movements.%20Using%20the%20Suiken%20as%20a%20reference%2C%20Goku%20thinks%20up%20the%20Saruken.
      generated and created his own style known as the "Crazy Fist" in response to
      perfectly counter it off the top of his head], with these styles even [http://web.archive.org/web/20111103182002/http://kanzentai.com/trans-daiz07.php?m=04&id=attack_j-l#kyouken:~:text=p.106)-,Kyouken,-%5Bkyou%2Dken
      specifically noted to be a variation of Kenpo]. At this point should be so skilled
      he''s beyond 22nd World Tournament Roshi and Tien, [https://imgur.com/a/Cpemp6s
      the former of which having such mastery his movements, energy, and breathing
      have no ineffiency, and the latter being able to detect this merely via observation
      of scant attacks whilst his future foe was suppressed.] Learned [https://imgur.com/a/ZCPsliV
      predictive movements and enemy reading] in merely three days and was able to
      immediately apply it in combat. His skill when it comes to [https://imgur.com/a/tOgSabH
      combat and the usage of Ki allows him to replicate other Ki-based techniques
      after seeing them once], and learned the training of the mind within a day,
      which takes battles that are dead [https://imgur.com/a/rqJoLUz even in all physical]
