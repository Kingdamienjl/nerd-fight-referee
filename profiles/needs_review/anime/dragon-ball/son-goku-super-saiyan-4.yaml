        \ nature. While it is incredibly powerful and can prove capable of completely\
        \ destroying an opponent when used with sufficient power, it takes a very\
        \ long time to charge and is therefore very difficult to use, though the charge\
        \ time can be sped up by gathering energy from those who willingly and knowingly\
        \ provide it. *{{Nihongo|Kiai|{{Ruby|\u6C17\u5408|\u304D\u3042}}\u3044}}:\
