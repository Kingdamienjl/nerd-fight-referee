        with Master Roshi, he copied his Drunken Fist style to adapt to it and created
        his own style known as the "Crazy Fist" in response. His skill when it comes
        to combat and the usage of Ki allows him to replicate other Ki-based techniques
        after seeing them once, and he was the first to realize how much energy the
        Super Saiyan transformations unnecessarily drained. Despite this drawback,
