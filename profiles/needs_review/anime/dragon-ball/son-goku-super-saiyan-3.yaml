        System level as a Super Saiyan 3 (Easily overpowered Innocent Buu as a Super
        Saiyan 3) | At Least Large Star Level. Solar System Level as a Super Saiyan
        (Far more powerful than his previous self, as he can fight kid Buu with his
        stronger forms, who is stronger than Super Buu), Galaxy Level, Possibly Multi-Galaxy
        Level with Super Saiyan 2 & 3 (Held his own against Kid Buu until his Stamina
        started to drain. The fight between him and Kid Buu caused extensive damage
        to the Kaioshin Realm, and Supreme Kai was worried about it being destroyed,
        which is this powerful. Which is consistent with Elder Kai implying Kid Buu
        is stronger than a younger Beerus, who can destroy the Kaioshin Realm)
