power_scale:
  tier:
    text: 5-C, Higher after King Kai's training, 5-B with Kaio-ken | Likely 5-A, Higher
      with Kaio-ken. Low 4-C post-Zenkai, 4-C with Kaioken x20 High 4-C with the Spirit
      Bomb, and as a Super Saiyan | 4-C, High 4-C as a Super Saiyan. High 4-C, 4-B
      as a Full Power Super Saiyan | High 4-C. 4-B as a Full Power Super Saiyan. Higher
      as a Super Saiyan 2, 4-A as a Super Saiyan 3 | At Least High 4-C. 4-B as a Super
      Saiyan, 3-C, possibly 3-B with Super Saiyan 2 & 3
    source_ids:
