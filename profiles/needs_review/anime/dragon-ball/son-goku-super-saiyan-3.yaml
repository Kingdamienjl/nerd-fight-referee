    notes: auto_repair source extraction
  attack_potency:
    text: Moon level (Comparable to Piccolo). Small Planet level+ after King Kai's
      training (Easily humiliated Nappa before he calmed down), Planet level with
      Kaio-ken (Overpowered Vegeta with Kaio-ken x3, and matched his Earth Busting
      Galik Gun with a Kamehameha) | Likely Large Planet level (Easily defeated Recoome,
      who had just humiliated a Post-Zenkai Vegeta. Who himself was far above his
      saiyan saga self in power. Jeice also grows concerned at the mention of a power
      level of 60,000. Which implies that this level of power is far above what the
      rest of the force, aside from Ginyu, are capable of combating), Higher with
      Kaio-ken (Surpassed Ginyu in power). Small Star level Post-Zenkai (Several times
      stronger than 1st Form Freeza, who is this powerful), Star level with Kaioken
      x20 (Bruised Freeza in his final form), Large Star Level with the Spirit Bomb
      (Harmed Frieza at 50% power), and as a Super Saiyan (Matched Freeza's full power
      and ultimately defeated him) | Star level, Large Star level as a Super Saiyan
      (Much stronger than before, easily blocked Trunks' slashes with his finger before
      becoming stronger for the confrontation with the androids). Large Star level,
      Solar System Level as a Full Power Super Saiyan (Fought against a suppressed
      Perfect Cell and nearly killed him with his Instant Kamehameha, was also implied
      to be superior to Super Vegeta even at half power. Is comparable to Shin) |
      Large Star level, Solar System level as a Full Power Super Saiyan (Threatened
      to kill Shin, who can create celestial bodies, including Stars. Should also
      not be too much weaker than his Super Saiyan 2 form), Higher as a Super Saiyan
      2 (Superior to Cell Saga Gohan as a Super Saiyan 2, who defeated Cell and overpowered
      his Kamhameha), Multi-Solar System level as a Super Saiyan 3 (Easily overpowered
      Innocent Buu as a Super Saiyan 3) | At Least Large Star Level. Solar System
      Level as a Super Saiyan (Far more powerful than his previous self, as he can
      fight kid Buu with his stronger forms, who is stronger than Super Buu), Galaxy
      Level, Possibly Multi-Galaxy Level with Super Saiyan 2 & 3 (Held his own against
      Kid Buu until his Stamina started to drain. The fight between him and Kid Buu
      caused extensive damage to the Kaioshin Realm, and Supreme Kai was worried about
      it being destroyed, which is this powerful. Which is consistent with Elder Kai
      implying Kid Buu is stronger than a younger Beerus, who can destroy the Kaioshin
      Realm)
    source_ids:
    - character-stats-profiles-son-goku-super-saiyan-3
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic (kept up with Raditz, who could outpace Goku's Kamehameha,
