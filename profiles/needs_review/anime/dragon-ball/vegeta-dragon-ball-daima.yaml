      pushing himself to his limits, getting up again and again to train more despite
      the severe damage he deals to himself in the process. In combat, Vegeta's endurance
      is famous, allowing him to continue fighting against the Goku and the other
      Z-Fighters despite his steadily worsening condition. Even after being launched
