  range:
    text: Standard Melee Range; Planetary with ki blasts
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (Skilled in hand-to-hand combat, having easily overwhelmed the likes
      of Kami in battle, casually dispatched of Krillin,Dragon Ball Z - Episode 112
      and would certainly boast greater combative prowess in comparison to the Spice
      Boys. Can control and summon the Dead Zone, something even vastly more powerful
      beings cannot do due to lack of knowledge of it even existing let alone how
      to control it. Led his own groups of henchmen in both of his appearances. He
      is one of only two antagonists in the series to ever be successful in achieving
      immortality. Infiltrated the Lookout and used the Black Water Mist to enslave
      everyone on Earth while also keeping Kami and Popo alive so he could use them
      as hostages, however, he can be reckless, forgetful, prone to making bad decisions
      and failing to learn from his mistakes. For example, he attempted to kill Piccolo
      and Kami before using the Dragon Balls, forgetting that doing so would render
      the balls inert. Tried to use the Dead Zone to defeat the heroes when, given
      his immortality, he could have simply outlasted them through attrition)
    source_ids: *id002
    confidence: 0.8
