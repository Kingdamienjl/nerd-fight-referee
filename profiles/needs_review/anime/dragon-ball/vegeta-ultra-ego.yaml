        \ can be fired as blasts and beams of energy, projecting them from the hands,\
        \ fingers or even the whole body. It can also be used to create defensive\
        \ barriers, aura shockwaves and explosions; Vegeta can also create a sword-like\
        \ construct. Along with his Saiyan blood, Ki acts as the source of Vegeta's\
        \ incredible power and abilities. Born with an abnormally high power level,\
        \ even at a young age it was believed that Vegeta would certainly surpass\
        \ his father, and for many years he remained as the strongest Saiyan in the\
        \ universe. In combat, Vegeta often makes use of high amounts of ki blasts,\
        \ firing them in large amounts and in rapid succession to overwhelm his opponents.\
        \ As opposed to other Dragon Ball characters, Vegeta has a host of signature\
        \ attacks. *{{Nihongo|Destructo Disc|{{Ruby|\u6C17|\u304D}}{{Ruby|\u5186\u65AC\
        |\u3048\u3093\u3056\u3093}}|Kienzan}}: Krillin's signature technique, which\
        \ Vegeta presumably copied from him. Raising his hand above his head, Vegeta\
        \ creates a razor-sharp disc of ki with incredible cutting power, and then\
