      value: Vegeta is arrogant and prideful, and if overpowered by someone he considers
        below him, he can lose his temper. He also seeks strong opponents, a tangible
        energy derived from the user's vigor, and mind. It can be used in a number
        of ways, such as to surpass the limits of one's body to greatly increase in
        strength, and it can be fired as blasts of energy or used to create defensive
        barriers. Along with his Saiyan blood, Ki acts as the source of Vegeta's incredible
        power and abilities. Born with an abnormally high power level, even at a young
        age it was believed that Vegeta would certainly surpass his father, and for
        many years he remained as the strongest Saiyan in the universe. In combat,
        Vegeta often makes use of high amounts of ki blasts, firing them in large
        amounts and in rapid succession to overwhelm his opponents. As opposed to
        other Dragon Ball characters, Vegeta has a host of signature attacks., Big
