        keep a low profile and outmaneuver Frieza's forces, leaving them scrambling
        to find him while he gathered all of the Dragon Balls. In the Cell Arc, destroying
        Android 19, he feigned confidence and strength to scare Gero into fleeing,
        which was greatly beneficial given how much energy 19 had drained. Finally,
        during his fight with Cell, he was able to exploit his overconfidence for
        a chance at a free blow with his Final Flash. He is skilled at reading his
        opponent's movements and constantly thinks out his strategies and motions
        in combat, to the point that Whis says he overthinks things. He was able to
        learn Spirit Control faster than Goku, as well as master the Super Saiyan
        God-Blue switch against Goku Black to a level that amazed Goku. He is able
        to utilize Ultra Ego, a polar opposite to Ultra Instinct but on the same level.)
