  section: weaknesses
  axis: weakness
  text: "Goku seeks strong opponents and therefore will allow his opponents to reach\
    \ their full power for the sake of a good fight. Kai\u014Dken strains his body,\
    \ causing him intense pain and exhaustion if he overuses it. He often drops his\
    \ guard and leaves openings for his opponents whenever he gets distracted, lowering\
    \ his durability. His Spirit Bomb requires a long charge-up period, during which\
    \ time he is vulnerable. He cannot survive in the vacuum of space and needs to\
    \ locate a ki signature to teleport using Instant Transmission. Super Saiyan 3\
    \ drains his ki rapidly and will exhaust him within only a few minutes. Initially\
    \ had to get used to using his smaller body, having trouble flying and utilizing\
    \ ki, has a shorter physical range and his power has lessened from when he was\
    \ an adult. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
    1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"\
