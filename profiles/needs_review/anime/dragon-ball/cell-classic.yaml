      value: Superhuman Physical Characteristics, Partial Inorganic Physiology (Bones
        are mostly inorganic), Immortality (Type 7), Expert Swordsman, Martial Arts
        (Employs a variety of kicks in combat), Fire Manipulation (Via Soul Sword,
        Flame Sword, Searing Skull and Soul Drain), Teleportation (Via Skeleport),
        Absorption (Via Power Devour and Soul Drain), Bone Creation (Via Power Devour),
        Weapon Control (Via Shield Stab), Electricity Manipulation (Via No Mercy III),
        Summoning and BFR (Via Skeleton Grab and No Mercy IV), Telekinesis (Via No
        Mercy V), limited Transformation and Power Mimicry (Can copy the appearance,
        powers and abilities of his opponent during a combo), possibly Broadway Force
        (Via Humiliation), possibly Non-Physical Interaction (Able to harm Jago's
