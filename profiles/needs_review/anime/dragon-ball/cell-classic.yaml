        Skull *Soul Sword: Spinal swings his cutlass imbued with fire. With the Shadow
        version, he performs the move twice in a row. *Sliding Kick: Spinal slides
        and kicks the opponent. *Bone Shaker: Spinal rushes forward to bash the opponent
        with his shield. *Skeleport: Spinal touches the ground with the grip of his
        sword and teleports to another location, usually behind or right in front
        of the opponent. With an alternate version, he spins on himself, sinks through
        the ground and emerges in another location. *Power Devour: Spinal rises his
        shield while it glows in energy. While active, the shield can absorb projectiles
        and physical blows. The absorbed attacks are then converted into skulls that
        start floating around Spinal, who can use them to perform stronger versions
        of his techniques. Spinal can also sacrifice some of his own energy (not health)
        to summon up to 5 skulls. *Searing Skull: Spinal imbues one of his skulls
        with flames and shoots it at the opponent. With the Super version, Spinal
        shoots a stronger skull, marked by a long, fiery trail. With the Shadow version,
        he fires two skulls in a row. *Flame Blade: Spinal delivers a rising slash
        with his cutlass imbued with fire. With the Super version, Spinal keeps swinging
        the sword several times with a rotatory motion. The combo ends with a Searing
        Skull that knocks the opponent down. *SkeleSkewer: Spinal lunges forward with
        his cutlass. *Skull Scrape: Spinal crouches and slides forward, targeting
        the opponent''s legs with his flaming cutlass. With the Super version, he
        drives the sword against the opponent several times. *Dive Kick: Spinal leaps
        in the air and falls on the opponent leg-first, delivering a diving kick.
        *Soul Drain: Spinal shoots several rings of fire from his shield. These rings
        will deplete the opponent''s energy and give it to Spinal. The amount of stolen
        energy depends on how many rings hit the opponent. *Grim Reaper: A Super move.
        Spinal imbues his cutlass with fire and jumps towards the opponent, attacking
        them with a diving slash. *Stunning Skull: A Super move. Spinal shoots out
        a blue skull that damages and stuns the opponent. |-|Finishers= *Shield Stab:
        Spinal delivers two frontal slashes with his cutlass, then brings his shield
        forward and extends the spike at its center, stabbing the opponent three times
