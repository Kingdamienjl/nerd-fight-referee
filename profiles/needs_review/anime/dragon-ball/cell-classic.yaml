    - field: weaknesses
      value: 'Due to his advanced age, he began to develop arthritis, but he can use
        Finka''s nanobots to counteract the effects. Notable Attack/Techniques:, Stealth
        Master: Excluding characters with perfect invisibility or supernatural powers,
        Sam Fisher is arguably one of the greatest stealth artists in all of fiction.
        He makes use of blending into the shadows and silent movement in order to
        appear invisible to his enemies. His ability in stealth is so great that it
        is possible for him to be a foot away from his enemy and still appear completely
        invisible. He also has several pieces of equipment that help to further enhance
        his stealth ability, for example he has multiple EMP devices to disable lights
        creating more shadows, his tactical operations suit is lined with a material
        named Gore-Tex that suppresses his heat signature making him invisible to
        various sensors and has several devices to help him detect his enemies before
        they can detect him. Fisher''s knowledge of stealth tactics and environmental
        awareness enables him to sneak around most opponents and to subdue them quickly
        using either lethal or non-lethal means., Athletic ability and Parkour skills:
        Fisher is extremely agile and is capable of performing various advanced and
        difficult acrobatic manoeuvres, where Fisher suspends himself in mid-air by
        performing a split leg manoeuvre between two closely spaced walls. He seems
        to use a stealthy variation of the French gymnastic art of Parkour, which
        he uses to scales buildings and structures rapidly, but also quietly. In the
        novel, Fisher is also shown to be capable of using both furniture and human
        beings in order to escape from certain environments, Hand to Hand Combatant:
        Fisher is an expert in various forms of hand to hand combat. His main style
        of choice is Krav Maga, a style developed and used by the Israeli military,
        which focuses on fast brutal counter-attacks and the use of reflexive responses
        to threatening situations. In Blacklist he has also shown proficiency in several
        other forms of unarmed combat including: Russian Systema, Filipino Kali and
        Jujitsu. Fisher is also an expert knife fighter having first been trained
        by the Navy SEALs, as such he prefers a Fairbairn Sykes commando dagger in
        combat (the knife issued to him during SEAL training). Other bladed weapons
        of choice include the Karambit knife or "Panther claw", which he learned to
        use while training abroad. Combined with his stealth skills this makes Fisher
        truly deadly in close quarters, able to subdue an entire squadron of men without
        them suspecting anything., Master Marksman: Fisher possesses extensive knowledge
        of all forms of firearms and he can use them with near flawless accuracy.
        He is even capable of successfully landing four headshots against four targets
        in multiple directions in less than 4 seconds. More impressive is that Fisher
        can do this regardless of his own location at the time'
      source_id: character-stats-profiles-cell-classic
