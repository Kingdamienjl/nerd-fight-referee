- id: claim-weaknesses-65a2a73b
  section: weaknesses
  axis: weakness
  text: 'Piccolo''s regeneration is stamina based and he cannot regenerate if his
    brain is destroyed. {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks and Techniques: |- | The fighting power and life force
    of a martial artist, a tangible energy derived from the user''s vigor, courage,
    and mind. It can be used in a number of ways, such as to surpass the limits of
    one''s body to greatly increase in strength, and it can be fired as blasts of
    energy or used to create defensive barriers. Along with his Namekian heritage
    and Dragon Clan status, this is the source of Piccolo''s superhuman capabilities
    and power. He is incredibly skilled in the art of ki control. He often fires powerful
    blasts of ki from his mouth. *: Inherited from his father, this is one of Piccolo''s
    signature techniques. Supporting his leading arm with the other, he fires a powerful
    wave of ki straight forwards. **: Weaker variation of Explosive Demon Wave used
    by Piccolo. Piccolo fires the two waves together to create a larger and deadlier
    one. **: Variation of Explosive Demon Wave used by Piccolo, a powerful and fast
    blast of ki that rapidly homes in on Piccolo''s target. **: Variation of Explosive
    Demon Wave used by Piccolo, which creates a massive explosion with himself as
    the nexus. Piccolo crosses their arms to gather ki and flings them upward to unleash
    a large explosion which destroys everything around it. *: One of Piccolo''s signature
    attacks. After bringing his index and middle fingers to his forehead, Piccolo
    charges up and fires a spiraling laser that can drill through most opponents.
    **: The user performs the technique in a manner reminiscent of the Makosen though
    a Special Beam Cannon is fired instead, thus it is basically a two-handed version
    of the Special Beam Cannon though with less charging time than the original one-handed
    version. *: First, Piccolo swings his arms apart and charges an energy sphere
    in each hand. Then, he yells "Scatter Shot!" as he fires multiple energy spheres
    against the opponent, inflicting a huge amount of damage. **: One of Piccolo''s
    most powerful techniques. Piccolo charges up and fires several energy spheres
    randomly in the opponent''s direction, disregarding accuracy and with no intent
    on actually hitting the enemy. With efficient ki control, the multiple energy
    spheres are suspended in the air, completely surrounding them. Finally, Piccolo
    commands the energy spheres, to rapidly spin around the opponent and inevitably
    rain down on them with a vicious onslaught from every direction, filling the sky
    with a blinding light and inflicting a massive amount of damage. *: Piccolo can
    shoots laser-like beams from both eyes. *: Piccolo can fire arcs of electricity
    from his antennae. *: After bringing his hands together, Piccolo charges up and
    fires a high-power sphere of energy straight at his opponent, causing a massive
    explosion. *: The attack is performed by the user placing both hands above the
    head with the palms facing the target and one hand in front of the other with
    the fingers going in opposite directions. As a member of the Dragon Clan, Piccolo
    has several magical abilities. *: Piccolo can manipulate objects and other people
    with the power of one''s mind. *: Piccolo can create objects and clothing, seemingly
    out of thin air, often using this to create his weighted clothing whenever he
    has a need for it. *: The Mafuba is a mystic sealing technique designed to seal
    evil away by sucking them into a special container with a "demon seal" ofuda on
    it. Not only does Piccolo know how to use the Mafuba itself, but he also has knowledge
    of its counter, which allows him to reflect it when it''s used against him. Piccolo
    is a Namekian, a long-lived race of slug-like aliens with exceptional hearing.
    This grants him several abilities, most notably the power to regrow lost limbs
    and destroyed organs as long as his head remains intact. He can also extend his
    arms to great lengths to attack and grab opponents from a distance, and he can
    even use his regenerative powers to greatly increase his body''s volume, growing
    significantly in size as a result. *: Like many Namekians, Piccolo has the ability
    to fuse with other Namekians to get stronger. *: Piccolo can stretch his arms
    by expanding and contracting the cells in his body through willpower. *: Piccolo
    can communicate with others using one''s mind. Piccolo can also read the minds
    of the ones they communicate with, similar to telepathic eavesdropping. *: As
    a Namekian, Piccolo''s rapid healing powers and regeneration capabilities allow
    him to regenerate any lost limb or damaged body part (apart from a destroyed brain)
    within moments. With the accumulated energy from the Namekian race absorbed into
    him, Piccolo possesses vast reserves of stamina and Ki, practically making his
    regenerative powers unlimited. |}'
