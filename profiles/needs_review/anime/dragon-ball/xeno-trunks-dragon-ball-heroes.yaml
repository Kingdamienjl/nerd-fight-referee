  attack_potency:
    text: Complex Multiverse level (7-D; Defeated the Masked Saiyan at the beginning
      of God Mission. Fought on par with Super Mira alongside Xeno Bardock. Later
      grew [https://imgur.com/a/xeno-trunks-fights-super-saiyan-4-full-power-broly-OnfcFX9
      stronger and defeated] God Mission SS4FP Broly. Grew even stronger and [https://imgur.com/a/8uaRira
      fought against Time Breaker Vegeta] and [https://imgur.com/a/demigra-stuff-8ZrQXFT
      defeated both] Wizard and Demon God Demigra simultaneously, with the [https://imgur.com/a/past-demigra-absorbs-toki-toki-god-mission-7-8zW2o1t
      former even having absorbed the power of] Tokitoki, making him superior to Chronoa.
      Stronger with his transformations) | Complex Multiverse level (7-D; Stronger
      than before. Massively stronger as Super Saiyan God, he defeated Ultimate Evolution
      Fin and the rest of the Demon Gods at the same time. [https://imgur.com/a/ssg-trunks-defeats-ultimate-fin-fights-dark-king-mechikabura-YzVxsyz
      Could match] Dark King Mechikabura as a Super Saiyan God) | Complex Multiverse
      level (7-D; Much stronger than before. Comparable to the CC cast who [https://imgur.com/a/Rh0uuSc
      were stated to be strongest warriors] at the time of Universe Mission/Prison
      Planet Saga, making him superior to even Time Power Unleashed Mechikabura. Grew
      even stronger and [https://imgur.com/a/bi6TTBn destroyed the arms of Time Power
      Unleashed Mechikabura] that were conjured by Fu's stronger Dark Factor, making
      him at least comparable to SFPS4LB Vegito at that point and damaged [https://imgur.com/a/JNR9u9e
      Transcended Demon God] Xeno Omega Shenron) | Complex Multiverse level (7-D;
      Stronger than before. Could [https://imgur.com/a/FJqwBma damage and keep up
      with Ozotto's clones])
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Immeasurable (Faster than Mira and Bardock. Later grew faster and kept up
      with God Mission SS4FP Broly who scales to the Evil Dragon Mission Shadow Dragons
      [https://imgur.com/a/dbh-shadow-dragon-immeasurable-speed-hPmJD0h who can fly
      beyond time into different eras]. Became even faster and defeated Wizard Demigra
      with Tokitoki absorbed and Demon God Demigra) | Immeasurable (After [https://imgur.com/kxWhwvK
      training half a year] with Xeno Goku, his power and speed was elevated to a
      new level. [https://imgur.com/a/1o1bXBx Flew beyond space-time] like the Dark
      Dragon Balls and the Demon Gods. Superior to base Chronoa who can react to the
      Chaos Ball. Flew through time along with Chronoa and Xeno Vegeta, then [https://imgur.com/pwXkyHu
      immediately reacted to and blocked] Demon God Xeno Buu's attack, before he could
      strike Xeno Goku. Later he also [https://imgur.com/a/k3et1JJ flew through time
      to chase] after Final Form Mira and Dark Broly, as both of them also flew through
      time to chase and escape from each other. Massively faster as Super Saiyan God
      and is superior to Ultimate Evolution Fin and comparable to Dark King Mechikabura)
