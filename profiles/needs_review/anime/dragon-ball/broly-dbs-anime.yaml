- id: claim-standard-equipment-9479b2b8
  section: equipment
  axis: equipment
  text: '*Battle Armour: Combat attire commonly worn by Frieza Force members. It boasts
    advanced flexibility that allows it to be stretched to the wearer''s liking, while
    also having the durability to account for drastic size alterations. Broly''s particular
    armor is the latest variant. *Shock Collar: A device attached to Broly''s neck
    by his father, Paragus, as a means to keep him in control. However, the controller
    would later be stolen and destroyed by Cheelai, with the collar itself going on
    to be destroyed during Broly''s time on Earth.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-d3e7f933
  section: power_scale
  axis: battle_iq
  text: Average (Although Broly lacks knowledge when it comes to subjects that are
    not related to fighting, he is by no means unintelligent. As a toddler, he was
    capable enough to prioritize his survival Vampa in spite of the isolated planet's
    harsh environment and lack of resources) Genius (Broly is an incredibly competent
    fighter. He learns very quickly as he fights, despite only having partaken in
    training matches against his father, who is vastly weaker and less skilled than
    him. This talent of his allowed him to continuously keep up with, and get the
    upper-hand against both Vegeta and Goku, the latter of which was very impressed
    with Broly's ability to go toe-to-toe with the Saiyan Prince so early into their
    battle. Additionally, he was able to tap into the power granted by the Great Ape
    without having to transform, albeit with a lack of control over the state)
  source_ids: *id003
  decisive: false
