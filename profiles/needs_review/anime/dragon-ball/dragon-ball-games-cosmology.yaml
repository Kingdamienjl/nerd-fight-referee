    - field: powers_and_abilities
      value: The power of Dragon Ball video games are extremely powerful, as a verse
        that composited all Dragon Ball materials, its power scales from both the
        original manga and the anime adaption. Early sagas of the verse are somewhat
        similar to both Canon and Toei continuity characters, reaching to Galaxy level
        at the start of Cell Saga and finally High Universe level at the end. At Majin
        Buu Saga which was considered as middle sagas, the power reached to Low Multiverse
        level. Dragon Ball GT's storyline and Super's storyline was also introduced
        into the game, making the power of the verse even stronger. On the higher
        end with games such as Dragon Ball Heroes and Dragon Ball Xenoverse, the power
        reaches Complex Multiverse level (6-D) with feats of affecting and destroying
        Hypertimelines, later with High and Top tiers all boasting infinite Complex
        Multiverse level (6-D) with feats like shaking, destroying or absorbing the
        entire infinite multiverse and through scaling of several feats and statements,
        finally the god tiers reach Complex Multiverse level (7-D) with feats like
        creating, threatening to destroy or controlling all of existence/space-time.
        This makes the Dragon Ball Games an extremely formidable verse.
      source_id: vsbattles-dragon-ball-games-cosmology-anime
      provider_id: vsbattles
      authority: high
