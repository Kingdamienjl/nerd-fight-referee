  name: 'Independency == Negative Energy has evidence for being completely independent
    from physical reality, and so does Dark Ki: # There are many instances of the
    entire multiverseSDBH Arcade Mission 7 Dark Empire Saga distorted,Dragon Ball
    Heroes: Ultimate Mission X destroyed by people such as Dark Shenron, Demigra,
    Mechikabura, yet Dark Ki and Negative Energy are completely unaffected. Dark Factor,
    a superior form of Dark Ki is also similar, where it is completely unaffected
    when Mechikabura himself distorted the entire multiverseSDBH Arcade Universe Mission
    3SDBH Promotional Anime Dark Demon Realm Special Episode: Decisive Battle! Time
    Patrol vs. The Dark King (Dark Demon Realm Arc Backstory) # Negative Energy and
    Dark Ki are stated to be similar in natureDragon Ball Heroes: Ultimate Mission
    X so they scale to each other Dark Ki itself also predates "reality", as it exist
    before and responsibleSDBH Dark Demon Realm Mission Manga Chapter 1 for the creationDragon
    Ball Heroes God Mission 7 PV of Demon Realm. Dark Factor, a superior form of Dark
    Ki is also similar, it was usedSDBH Arcade Big Bang Mission 5SDBH Big Bang Mission
    Manga Chapter 5SDBH Big Bang Mission Manga Chapter 6 as energySDBH BBM Promotional
    Anime Episode 10 for Universe Tree so it could finish the creation of its fruit
    - a space-time universeSDBH Big Bang Mission Manga Chapter 4SDBH Big Bang Mission
    Manga Chapter 6SDBH BBM Promotional Anime Episode 11 This means that Negative
    Energy in the DBH Multiverse qualifies for Conceptual Manipulation (Type 1), Dark
    Ki & Positive Energy also qualify as well, as the former is similar to Negative
    Energy in nature, Positive Energy is opposite of Negative Energy, and Demon God
    Power & Dark Factor also qualify for being a superior form of Dark Ki We also
    have the Time Scroll, this object records all of history, existence, everything
    which of course also includes and , Dark Ki, Janemba''s Evil Energy, etc.....
    *Both the Supreme Kai of Time Chronoa (Dragon Ball Heroes) and the Former 1st
    Time Patroller Sealas stated that in order to completely destroy/erase all of
    existence with truly nothing left and to reshape them in Sealas''s image, he needed
    to burn down the Time Scrolls,Super Dragon Ball Heroes: World Mission as simply
    nuking everything won''t work. Even though Sealas himself was capable of creating
    an entirely new reality/timelineSuper Dragon Ball Heroes: World Mission which
    was stated by Chronoa to be accurate down to the last blade of grass,Super Dragon
    Ball Heroes: World Mission he still deduced that the scrolls needed to be destroyed
    in order to fulfill his goal. *Despite Demigra (Dragon Ball Xenoverse) destroying
    the entire multiverse, a Time Scroll was still capable of recording that event.Dragon
    Ball Xenoverse Similarly, the erased Future Trunks timeline could still be contained
    and recorded in a Time Scroll,Dragon Ball Xenoverse 2 despite its complete erasure.
    While altering what Scroll contain directly affects the timeline/history the said
    scroll represented *The former Supreme Kai of Time Aeos who wants to destroy almost
    all of existence and reduce everything down to only a single history/timeline,
    still decides to destroy the scrolls to completely erase history/timelines despite
    she and her subordinates having the sheer brute force to just blast away all of
    existence. *This means that the Time Scrolls and the data/information are completely
    independent from the reality they defined, shaped and governed. The destruction
    of all reality does nothing to the scrolls and their data/information while manipulating
    them immediately affects history and reality itself This show that Time Scrolls
    are completely independent of the entire cosmology, which also includes and ,
    Dark Ki, Evil Energy/Power, etc.....'
