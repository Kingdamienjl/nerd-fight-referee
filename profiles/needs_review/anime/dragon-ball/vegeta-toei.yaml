      and Piccolo with Super Saiyan. Managed to delay Kid Buu as a Super Saiyan 2.
      Significantly stronger after the Buu Saga, and [https://imgur.com/a/WKvUp4h
      was able to form a barrier] that stopped one of Hirudegarn's attacks), Varies,
      up to far higher with charged attacks
