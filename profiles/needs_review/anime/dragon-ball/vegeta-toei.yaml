    \ increasing in strength whenever they are mortally injured,Dragon Ball Z: Episode\
    \ 49 - The Prince Fights Back and even upon being revived from the deadDragon\
    \ Ball Z: Episode 102 \u2014 Duel on a Vanishing Planet)"
