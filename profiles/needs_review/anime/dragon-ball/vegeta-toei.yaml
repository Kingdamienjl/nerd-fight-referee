    text: Small Star level+ (Easily defeated several Toeiverse Saibamen all alone
      and he himself states that he had surpassed his father), Large Star level as
      a Great Ape ([https://www.youtube.com/watch?v=K2hbmsXi2j8&t=46s Multiplies his
      power tenfold]) | Star level (Casually destroyed Arlia and its moon), Varies
      ([https://imgur.com/a/YnwURCr The Galick Gun is Vegeta's version of the Kamehameha].
      It works by condensing one's Ki into a single point, the power of the move proportionally
      varying depending on how much power is condensed), up to far higher with Galick
      Gun (Threatened to destroy Earth. Matched Goku's Kaioken x3 Kamehameha until
      he used Kaioken x4. The Galick Gun can get strong enough to completely annihilate
      beings far superior to the user), Large Star level as a Great Ape | At least
      Star level (Easily defeated Cui, Dodoria, and Zarbon), Star level+ after his
      second Zenkai (Easily defeated Monster Zarbon and caused some minor damage to
      Recoome), Varies, up to far higher with Galick Gun | Large Star level (Fought
      on par with the full power of First Form Frieza, who casually destroyed Planet
      Vegeta without even powering up), higher after his fourth Zenkai (Surpassed
      both Piccolo and Third Form Frieza in power, but ultimately proved no match
      for Frieza in his final form), Varies, up to far higher with Galick Gun | Galaxy
      level (His power had greatly increased after being revived. Grew much stronger
      after years of training to face the Androids. He became even stronger and kept
      in a fight against Android 15), far higher as a Super Saiyan (Effortlessly destroyed
      Android 19. Piccolo noted that Super Saiyan Vegeta may have surpassed Super
      Saiyan Goku. He was later able to dominate Android 15), Varies, up to far higher
      with Galick Gun, even higher with Big Bang Attack ([https://imgur.com/a/LQ17nRv
      Greatly exceeded the Galick Gun and was his strongest attack at the time]. Destroyed
      Android 15) | At least Galaxy level, far higher as a Super Saiyan, even higher
      as a Super Saiyan Grade 2 (Effortlessly toyed with Semi-Perfect Cell), Varies,
      up to far higher with Galick Gun, even higher with Big Bang Attack, much higher
      with Final Flash ([https://imgur.com/a/q4QVfOD Is too powerful to be fired in
      a regular state of Super Saiyan placing it above the Big Bang Attack]. Managed
      to destroy a decent portion of supressed Perfect Cell's body) | High Universe
      level, far higher as a Super Saiyan (Held his own against a Cell Jr. after training
      again in the Hyperbolic Time Chamber. Superior to Base Goku, who fought and
      harmed Restricted Super Saiyan Broly), Varies, up to far higher with charged
      attacks ([https://www.youtube.com/watch?v=n8nKlMDVRdE&t=62s His Big Bang Attack
      forced Base Goku to dodge from being hit by its explosion despite Goku not being
      his target]) | High Universe level, higher with Super Saiyan transformations
      (Matched Super Saiyan 2 Goku with his Majin power-up. Piccolo noted that Majin
