  intelligence:
    text: Average in general. Genius in combat (Although he lacks knowledge when it
      comes to things that aren't related to fighting, Goku is a master of prodigal
      skill when it comes to martial arts, with years of experience fighting against
      powerful opponents with a plethora of abilities. As a child, he was able to
      beat martial artists on such a level as Grandpa Gohan, who was stated to be
      an unparalleled master in all martial arts. In his battle with Master Roshi,
      he copied his Drunken Fist style to adapt to it and created his own style known
      as the "Crazy Fist" in response. His skill when it comes to combat and the usage
      of Ki allows him to replicate other Ki-based techniques after seeing them once,
      and he was the first to realize how much energy the Super Saiyan transformations
      unnecessarily drained. Despite this drawback, he was the first to master the
      Super Saiyan state, making it highly efficient and subsidizing the need to reach
      a higher grade, which decreases speed as a side effect. He is a genius in combat
      and is capable of devising new applications of his techniques on the fly, such
      as using Kamehameha with his feet. Was able to go toe to toe with Cell, a being
      created by the genius scientist Dr. Gero to be the ultimate warrior, spending
      20 years taking the DNA and footage of every fighter on earth and on Namek,
      copying their techniques, their mannerisms, and their skills to create him,
      including Goku himself, also having knowledge on how he approaches battle as
      well. His skill when it comes to combat and the usage of ki allows him to replicate
      other ki-based techniques after seeing them once, and he was the first to realize
      how much energy the Super Saiyan transformations unnecessarily drained. Despite
      this drawback, he was the first to master the Super Saiyan state, making it
      highly efficient. He is a genius in combat and is capable of devising new applications
      of his techniques on the fly, such as using Kamehameha with his feet)
    source_ids:
    - mediawiki-vegeta-classic
    confidence: 0.6
    notes: auto_repair source extraction
