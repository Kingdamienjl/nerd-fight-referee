    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: At least Above Average generally. Extraordinary Genius combatant (With a
      combination of Vegeta's cunning and Goku's prodigal skill, Vegito is an extremely
      intelligent individual when it comes to combat, with skill that is matched only
      by the greatest of opponents. He should possess Goku's mastery of ki and understanding
      of the Super Saiyan transformations and their costs and his ability to effortlessly
      replicate other ki-based techniques, along with Vegeta's cunning and skill at
      reading his opponents' movements. He feigned arrogance in his fight with Super
      Buu, smugly toying with him to bait him into trying to absorb him so that he
      could rescue all those he had absorbed, and when he went on to fight Zamasu
      years later, he discarded this overconfident persona and fought fully seriously)
    source_ids: *id002
    confidence: 0.8
