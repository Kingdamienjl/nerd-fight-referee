    - field: weaknesses
      value: "Goku seeks strong opponents and will, therefore allowing his opponents\
        \ to reach their full power for the sake of a good fight. Kaioken strains\
        \ his body, causing him intense pain and exhaustion if he overuses it. He\
        \ often drops his guard and leaves openings for his opponents whenever he\
        \ gets distracted, lowering his durability. His Spirit Bomb requires a long\
        \ charge up period, during which time he is vulnerable. He cannot survive\
        \ in the vacuum of space and needs to locate a Ki signature to teleport using\
        \ Instant Transmission, initially he couldn't transform into a Super Saiyan\
        \ God without the ritual, however this is no longer a problem after training\
        \ with Whis | The Evil Containment Wave requires a suitable container to seal\
        \ the target into | Ultra Instinct Omen is initially only temporary, and he\
        \ cannot willingly enter the state, only entering it in response to being\
        \ pushed to his limits. Once Goku exits the form, he is left exhausted. Goku's\
        \ Ultra Instinct was initially imperfect, so it was harder for him to use\
        \ it offensively, as he still held himself back by thinking out the best method\
        \ of attack instead of intuiting what to do. In prolonged encounters, Goku's\
        \ mastered Ultra Instinct form can spontaneously deactivate, draining Goku\
        \ of most of his power. {| class=\"mw-collapsible mw-collapsed\" align=\"\
        center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
        \ | colspan=\"2\" style=\"text-align: left; \" |Notable Attacks/Techniques:\
        \ |- | |-|Ki Attacks= The fighting power and life force of a martial artist,\
        \ a tangible energy derived from the user's vigor, courage, and mind. It can\
        \ be used in several ways, such as to surpass the limits of one's body to\
        \ greatly increase in strength, and it can be fired as blasts of energy or\
        \ used to create defensive barriers. Along with his Saiyan blood, Ki acts\
        \ as the source of Goku's incredible power and abilities. Goku's prodigal\
        \ skill in combat and the use of Ki allows him to replicate the Ki techniques\
        \ of others after seeing them only once. After becoming a Super Saiyan God,\
        \ Goku gained divine Ki, which can only be sensed by other gods. *{{Nihongo|Kamehameha|\u304B\
        \u3081\u306F\u3081}}: Goku's famous signature technique, which he learned\
        \ after witnessing Master Roshi use it to extinguish the flames on Fire Mountain,\
        \ successfully replicating it not long later on his first try. As his signature\
        \ technique, it is something that Goku has used on many occasions, and he\
        \ has created several variations throughout his fighting experience, such\
        \ as firing it from his feet, using it to propel himself into the air, and\
        \ bending it mid-flight to catch opponents by surprise. Perhaps the most useful\
        \ variation is the Instant Kamehameha, in which Goku uses Instant Transmission\
        \ to teleport just before firing the attack, appearing right in front of his\
        \ opponents and giving them no time to dodge. As for the Tournament of Power,\
        \ Goku has once again used this technique in a new way, as a barrier against\
        \ other attacks. GokuKamehamehaDBSAnime.gif GokuTransmission.gif *{{Nihongo|Kaioken||Kai\u014D\
        ken}}: A technique developed by King Kai and taught to Goku during his time\
        \ training on his planet. It greatly increases Goku's Ki for just a moment,\
        \ boosting his strength and speed significantly for that time. However, this\
        \ heavily strains his body, and if he overuses it, it will leave him in intense\
        \ pain all over his body, leaving him incapable of moving without causing\
        \ himself further pain. Initially, the strongest Kaioken Goku can utilize\
        \ is x4, but by the time of the Frieza Saga, he has mastered its use, allowing\
        \ him to push it to his maximum of x20. After mastering Super Saiyan Blue,\
        \ which required perfect Ki control and a calm mind, Goku became capable of\
        \ using Kaioken alongside this transformation, first pushing it to x10, and\
        \ then x20. center|250px *{{Nihongo|Spirit Bomb||Genkidama}}: Goku's ultimate\
        \ attack, taught to him by King Kai, performed by gathering a vast amount\
        \ of energy from all the lifeforms in his surroundings to create a massive,\
        \ incredibly destructive sphere of Ki. To use it, one must have a pure heart\
        \ so Goku is the perfect individual for the technique due to his obliviously\
        \ innocent nature. While it is incredibly powerful and can prove capable of\
        \ destroying an opponent when used with sufficient power, it takes a very\
        \ long time to charge and is therefore very difficult to use, though the charge\
        \ time can be sped up by gathering energy from those who willingly and knowingly\
        \ provide it. center|250px *{{Nihongo|Kiai|\u3044}} The ability to project\
        \ an invisible burst of force with Ki, which Goku can perform with his hands\
        \ and even with a glare. center|250px *{{Nihongo|Destructo Disc||Kienzan}}:\
        \ Krillin's signature technique, which Goku presumably copied from him. Raising\
        \ his hand above his head, Goku creates a razor-sharp disc of ki with incredible\
        \ cutting power and then throws it at his opponent. During the Tournament\
        \ of Power, Goku utilizes a variation on the technique, the Kienzan Hexa Blade,\
        \ a Destructo Disc"
