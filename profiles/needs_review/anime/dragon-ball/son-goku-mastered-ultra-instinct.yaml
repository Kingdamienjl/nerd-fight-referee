        to Kid Buu as a Super Saiyan alone). Universe Level+ with Super Saiyan God
        (His battle with Beerus threatened to destroy the entire Macrocosm, including
        the Afterlife. In every media, the afterlife is shown to be the size of the
        living realm, if not larger and has its own time space. However, due to no
        definitive timeframe, he would not scale to 2-C). | Universe Level+ (Goku
        should be as strong as his god form in BoG. This was stated in Dragon Ball
        Z: Battle of Gods, which was mentioned in an author''s note by Akira Toriyama.
        In the Resurrection of F manga, Goku can use the "Saiyan Beyond God" state,
        this image also implies he absorbed SSG into base), Far Higher with Transformation
        (Far stronger than before, with Perfected SSB, Goku could fight Merged Zamasu,
        who while weakened, threatened to destroy the Mortal Realm) | Universe Level+
        (Stonger than before. Should be above the level of his BoG self in his base
        form, as was shown during the Black arc, Base Vegito can blitz and harm Fusion
        Zamasu, who was keeping pace with a Perfected Super Saiyan Blue Goku. This
        should confirm Goku being comparable to his BoG self in base. Or at least
        very close to that level), Low Multiverse Level with Perfected Super Saiyan
        Blue (When Vegeta fought Beerus shortly before the Tournament of Power, he
        notes that Vegeta could be a GoD in a different Universe. With most GoD''s
        being comparable to Beerus and Champa. Who can destroy Universe 7. Vegeta
