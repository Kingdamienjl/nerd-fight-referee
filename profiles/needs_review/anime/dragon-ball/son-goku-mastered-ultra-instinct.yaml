        Level with Ultra Instinct (Even stronger than before, MUI dominated Jiren
        and he only lost due to poor stamina) | Universe Level+, At Least Low Multiverse
        Level with Perfected Super Saiyan Blue, Higher with Kaioken Blue (Stronger
        than his previous self, His Blue Kaioken Kamehameha blew off Moro-73''s arm.
