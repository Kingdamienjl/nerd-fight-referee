    - field: weaknesses
      value: Goku seeks strong opponents and therefore will allow his opponents to
        reach their full power for the sake of a good fight. He often drops his guard
        and leaves openings for his opponents whenever he gets distracted, lowering
        his durability. His Spirit Bomb requires a long charge-up period, during which
        time he is vulnerable. He cannot survive in the vacuum of space and needs
        to locate a ki signature to teleport using Instant Transmission. The Mafuba
        requires a suitable container to seal the target into and drains a large amount
        of ki, the latter of which could kill him if he lacks sufficient ki | Mastered
        Super Saiyan Blue heavily strains his body, resulting in him exploding, though
        he has trained this away. His Power Stressed Form is essentially a weaker
        counterpart to the Kaio-ken, offering significantly more damage to his body
        from use | Ultra Instinct originally lasted seconds before reverting to his
        base form. After training with Merus, Goku can keep up his Ultra Instinct
        for much longer but it drains his stamina rapidly
