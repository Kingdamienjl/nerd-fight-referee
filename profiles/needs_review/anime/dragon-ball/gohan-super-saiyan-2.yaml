    - field: weaknesses
      value: 'Gohan has an explosive temper that can flare up suddenly and cause him
        to act irrationally, but he is generally a pacifist who despises fighting.
        Due to this, he often keeps his true power restrained to avoid harming others.
        As a Super Saiyan 2 and after first getting his potential unlocked, Gohan
        was prone to arrogance, even dipping into ruthlessness during his battle with
        Cell and seeking to prolong his suffering as retaliation for his crimes. He
        needs a moon to transform and loses control of himself as an Oozaru. He never
        trained the weakness away; his tail is a vulnerable point and grabbing or
        removing it will cause him intense pain. Notable Attacks/Techniques: Ki: The
        martial artist''s fighting power and life force, substantial energy derived
        from the user''s vigor, courage, and mind. Along with his Saiyan blood, Ki
        acts as the source of Gohan''s incredible power and abilities. It can be used
        in several ways, such as to surpass the limits of one''s body to increase
        strength immensely. It can be fired as blasts of energy or create defensive
        barriers. Gohan also had tremendous latent potential that could be unleashed
        whenever he felt intense anger. Even after getting his potential unlocked
        twice, Gohan still had room to grow further in power. *Masenko: Gohan''s original
        signature technique, which he learned from Piccolo. After placing both hands
        above his head with his palms facing his opponents, he fires a powerful ki
        blast. He can also throw it as an explosive energy sphere by charging it longer.
        *Kamehameha: Goku''s signature technique, which Gohan learned from his father
        during their training in the Hyperbolic Time Chamber. Gohan''s most powerful
        and famous use of this technique is the Father-Son Kamehameha, utilized alongside
        his father''s spirit to destroy Cell for good. *Kiai: The ability to project
        an invisible burst of force with ki, which Gohan can perform with his hands.
        Saiyan Physiology: The physiology of an aggressive warrior race of conquerors.
        Aside of their immense combat talent, Saiyans have the natural ability to
        control ki and to fly. While his lifespan is comparable to that of a human,
        Gohan will remain at his peak strength for much longer. A Saiyan''s propensity
        to get stronger via battle allows Gohan to push his limitations continuously
        and reach new heights of strength. When Gohan recovers from a severe injury,
        this trait will significantly increase his power. *Oozaru: When exposed to
        the light of the full moon, as long as he still has his tail, Gohan will transform
        the Oozaru, a massive, gigantic monkey with far greater power. However, this
        comes at the expense of his skill, turning him into a violent, mindless monster
        who cannot differentiate between friend and foe. *Super Saiyan: The mythical
        transformation of a Saiyan that enables them to dramatically exceed their
        limitations and attain the fabled state of a Super Saiyan. Gohan attained
        this form while practicing in the Hyperbolic Time Chamber with his father.
        These transformations are possible only after experiencing and regulating
        great emotional upheaval. They cause the user to become more violent and vicious
        due to Saiyans'' inherent aggression. Though Gohan''s human side and training
        enable him to transcend this nature, his first transformation into a Super
        Saiyan 2 resulted in him developing a cruel streak due to profoundly intense
        anger. While super Saiyan transformations are powerful, they use great energy.
        The first was inefficient until Gohan attained mastery of the condition and
        became a "Full Power Super Saiyan," enabling him to sustain it passively.
        Potential Unleashed: Gohan''s ultimate form gained after having his final
        potential unlocked by Old Kai''s lengthy ritual. It vastly increases his power
        by opening his dormant strength. This state surpasses the strength of Super
        Saiyan 3 Goku from the start of the Majin Buu Saga and even Gotenks. In this
        form, Gohan is often known as Mystic Gohan or Ultimate Gohan. ==Others== Notable
        Victories: Notable Losses: Inconclusive Matches: == References == category:Ednaxel2'
