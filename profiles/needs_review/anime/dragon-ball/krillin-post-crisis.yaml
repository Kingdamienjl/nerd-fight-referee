        Super Saiyan transformations unnecessarily drained. Despite this drawback,
        he was the first to master the Super Saiyan state, making it highly efficient
        and subsidizing the need to reach a higher grade, which decreases speed as
        a side effect. He is a genius in combat and is capable of devising new applications
        of his techniques on the fly, such as using Kamehameha with his feet. Was
        able to go toe to toe with Cell, a being created by the genius scientist Dr.
        Gero to be the ultimate warrior, spending 20 years taking the DNA and footage
        of every fighter on earth and on Namek, copying their techniques, their mannerisms,
        and their skills to create him, including Goku himself, also having knowledge
        on how he approaches battle as well. Capable of analyzing and copying Beerus'
        fighting style, allowing him to match Beerus' attacks and cancel out the shockwaves
        that threatened the universe. Later in Super, before adapting to Hit's Time-Skip,
        he was able to predict the movements he'd make in the 0.1 seconds of skipped
        time and react properly, beating a technique that for over 1000 years was
        completely unstoppable, even as Hit was constantly improving said technique
        in battle. Immediately figured out how to use a Ki blast to resurrect himself
        after he was killed by Hit. Goku mastered Ultra Instinct, a technique even
