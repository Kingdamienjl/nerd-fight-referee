power_scale:
  tier:
    text: High 4-C, becomes higher from absorbing more people, , up to far higher
      with Kamehameha, Galick Gun and Special Beam Cannon | High 4-C, far higher with
      Self-Destruction, , up to far higher with Kamehameha, Galick Gun and Special
      Beam Cannon | 4-B, higher with Power-Stressed Form, , up to far higher with
      Kamehameha, Galick Gun and Special Beam Cannon | 4-B, , up to far higher with
      Kamehameha, Galick Gun and Special Beam Cannon
    source_ids: &id002
    - mediawiki-2557
    confidence: 0.8
  attack_potency:
    text: Large Star level (Far stronger than Super Saiyan Vegeta. At least comparable
      to Future Cell, who surpasses Future Android 17 [who in turn overwhelmed Future
      Gohan at half power], as he managed to consume the population of Ginger Town),
      becomes higher from absorbing more people (After absorbing hundreds of thousands
      of humans, he casually overwhelmed Piccolo and Android 17 before matching Android
      165.92986 KiloQuettatons), Varies (The Kamehameha works by condensing one's
      Ki into a single point, the power of the move proportionally varying depending
      on how much power is condensed), up to far higher with Kamehameha (His Kamehameha
      made Piccolo terrified and forced him to dodge, despite Piccolo being shown
      as largely superior to Cell prior. The Kamehameha can get strong enough to completely
      annihilate beings far superior to the user), Galick Gun (Is comparable to, if
      not superior to the Kamehameha as shown by Vegeta) and Special Beam Cannon (Is
      shown to outright be superior to the Kamehameha in terms of sheer power output
      as shown by Piccolo)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Hypersonic+ flight speed (Faster than Krillin>Mach 21.69), at least
      FTL+ combat speed (Faster than both Android 17 and Piccolo after absorbing hundreds
      of humansDragon Ball Z - Chapter 176>27 c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class G (Far stronger than Frieza Arc Goku. Restrained Piccolo
      in a reverse bearhug. Later, after absorbing more people, he easily overpowered
      Android 17>3,002,361.41 Tons)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Large Star level (Far superior to Super Saiyan Vegeta), becomes higher from
      absorbing more people (Casually broke Piccolo's neck with a single punch)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Large Star level (Withstood attacks from Piccolo), becomes higher from absorbing
      more people (After absorbing hundreds of thousands of humans, he tanked Piccolo's
      Light Grenade without any injuries and survived Android 16's most powerful attack)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Cell is an incredibly powerful fighter who can battle against
      opponents for long periods of time, easily keeping up with Goku throughout their
      fight and eventually outlasting him. However, though he has absorbed both Androids
      17 and 18, he lacks their limitless stamina and can still be worn down over
      time)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; at least Planetary with ki blasts and attacks
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius (Despite his young age and technical lack of experience, Cell has
      inherited the knowledge and skill of those he was created from. His combat skill
      and knowledge of ki allows him to immediately and easily see through the weaknesses
      of Trunks' new transformation, and in combat, he easily matched Goku. He was
      able to outmaneuver and escape Piccolo and the other's attempts to hunt him
      down while constantly feeding on new humans in the process, and due to his knowledge
      on the techniques and personalities of the Z-Fighters, he is capable of easily
      manipulating them and playing to their differing desires)
    source_ids: *id002
    confidence: 0.8
