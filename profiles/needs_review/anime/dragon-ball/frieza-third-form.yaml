    - field: intelligence
      value: Gifted (As the dictatorial ruler of much of Universe 7, Frieza is a clever
        and crafty commander who kept his iron grip on his territory by terror and
        strategic military deployment. In combat, he is an extremely skilled hand-to-hand
        combatant capable of fighting on par with the likes of Goku, even when playing
        around. He is well-versed in using ki, replicating and improving upon Krillin's
        Kienzan with his own homing variant. However, for all of his skill, Frieza
        is quite overconfident and isn't fond of utilizing his full power)
      source_id: vsbattles-frieza-third-form-dragon-ball
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Frieza is arrogant and sadistic, preferring to prolong an opponent's\
        \ suffering rather than killing them right away, even when it is entirely\
        \ feasible for him to do so. Frieza's ki rapidly drains in his 100% power\
        \ state due to his lack of experience with it, and he cannot fight for long\
        \ in this condition. Feats: * Destroyed Planet Vegeta with ease in his first\
        \ form * Destroyed Namek with ease in his final form * Survived the Namek\
        \ explosion while cut in half and dying. {| class=\"mw-collapsible mw-collapsed\"\
        \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"\
        width:100%\" | colspan=\"2\" style=\"text-align: left; \" |Notable Attacks/Techniques:\
        \ |- | |-|Ki Attacks= *{{Nihongo|Ki|{{Ruby|\u6C17|\u304D}}}}: The fighting\
        \ power and life force of a martial artist, a tangible energy derived from\
        \ the user's vigor, courage, and mind. It can be used in several ways, such\
        \ as to surpass the limits of one's body to dramatically increase strength.\
        \ It can also be fired as blasts of energy or create defensive barriers. Possessing\
        \ such ridiculous strength at birth that few could match him, Frieza is a\
        \ mighty mutant hybrid of his race whose power is so great that to properly\
        \ control it, he had to create lesser, weaker forms to restrain his strength.\
        \ He is incredibly skilled in using ki, though his ignorance of its spiritual\
        \ side meant he didn't know how to sense ki at first. *{{Nihongo|Death Ball|\u30C7\
        \u30B9{{Ruby|\u6C17|\u304D}}{{Ruby|\u7389|\u3060\u307E}}|Desu-kidama}}: After\
        \ gathering ki in the shape of a sphere with a single fingertip, Frieza creates\
        \ a giant energy sphere that can easily destroy planets. His expertise in\
        \ the technique allows him to restrain it to instead put a planet on a timer\
        \ towards destruction if he so pleases. Its most powerful variant is the Supernova,\
        \ a massive, sun-like sphere of energy that takes some time to charge but\
        \ has immense power. Golden Frieza upgrades this technique into the even more\
        \ powerful Golden Death Ball. 8f729a89-1766-4d86-87df-deb1a573e722.jpeg 862976a3-97ac-4562-998e-5ef6daa8e68b.jpeg\
        \ 563479828994388784693784.webp *{{Nihongo|Death Beam|\u30C7\u30B9{{Ruby|\u5149\
        \u7DDA|\u3053\u3046\u305B\u3093}}|Desu-k\u014Dsen}}: Frieza's favored finishing\
        \ technique, a small, highly concentrated beam of ki fired from the fingertip\
        \ with enough force to easily punch through an opponent's body. Frieza often\
        \ uses this technique to torture his opponents before finishing them off,\
        \ and uses it with great precision. He can fire many of them rapidly, overwhelming\
        \ his opponents with a barrage of high-power attacks. After his mental training\
        \ in Hell, Frieza gained such control over his ki that his Death Beams can\
        \ home in on opponents. b2318590a9c835558ca7bf8e7fd37326.jpg e34a4d65-352c-4781-a5fd-b0eb3a16ef9d.jpeg\
        \ 40d7fc4f-7a1c-439a-a095-6c44d15db2d3.jpeg *{{Nihongo|Death Psycho Bomb|{{Ruby|\u8D85\
        |\u3061\u3087\u3046}}{{Ruby|\u5927\u5FF5\u7206|\u3060\u3044\u306D\u3093\u3070\
        \u304F}}|Ch\u014Ddai Nenbaku}}: By launching a small, invisible sphere of\
        \ ki into his opponent, Frieza can force them to rise into the air as the\
        \ sphere expands within them, ultimately exploding and destroying them from\
        \ the inside. *{{Nihongo|Death Saucer|{{Ruby|\u8FFD\u8DE1|\u3064\u3044\u305B\
        \u304D}}{{Ruby|\u6C17|\u304D}}{{Ruby|\u5186\u65AC|\u3048\u3093\u3056\u3093\
        }}|Tsuiseki Kienzan}}: A technique similar to Krillin's Kienzan, though Frieza\
        \ can make two of these discs at once and throw them at opponents. They home\
        \ in on targets, making them difficult to escape. Still, Frieza's overconfidence\
        \ makes it very possible that he will lose track of them and end up cutting\
        \ himself in half accidentally. It should be noted that it can cut through\
        \ opponents several times stronger and more durable. *{{Nihongo|Death Wave|{{Ruby|\u5927\
        |\u3060\u3044}}{{Ruby|\u5730|\u3061}}{{Ruby|\u88C2\u65AC|\u308C\u3064\u3056\
        \u3093}}|Daichi Retsuzan}}: Frieza can gather ki in his fingertips before\
        \ releasing it with a sweep of his arm, slicing through his surroundings with\
        \ a thin, razor-sharp blade of energy. *{{Nihongo|Imprisonment Ball|{{Ruby|\u61F2\
        |\u3061\u3087\u3046}}{{Ruby|\u5F79\u7389|\u3048\u304D\u3060\u307E}}|Ch\u014D\
