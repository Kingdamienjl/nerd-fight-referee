        \ the user's vigor, courage, and mind. It can be used in several ways, such\
        \ as to surpass the limits of one's body to dramatically increase strength.\
        \ It can also be fired as blasts of energy or create defensive barriers. Possessing\
        \ such ridiculous strength at birth that few could match him, Frieza is a\
        \ mighty mutant hybrid of his race whose power is so great that to properly\
        \ control it, he had to create lesser, weaker forms to restrain his strength.\
        \ He is incredibly skilled in using ki, though his ignorance of its spiritual\
        \ side meant he didn't know how to sense ki at first. *{{Nihongo|Death Ball|\u30C7\
        \u30B9{{Ruby|\u6C17|\u304D}}{{Ruby|\u7389|\u3060\u307E}}|Desu-kidama}}: After\
        \ gathering ki in the shape of a sphere with a single fingertip, Frieza creates\
        \ a giant energy sphere that can easily destroy planets. His expertise in\
        \ the technique allows him to restrain it to instead put a planet on a timer\
        \ towards destruction if he so pleases. Its most powerful variant is the Supernova,\
        \ a massive, sun-like sphere of energy that takes some time to charge but\
        \ has immense power. Golden Frieza upgrades this technique into the even more\
        \ powerful Golden Death Ball. 8f729a89-1766-4d86-87df-deb1a573e722.jpeg 862976a3-97ac-4562-998e-5ef6daa8e68b.jpeg\
        \ 563479828994388784693784.webp *{{Nihongo|Death Beam|\u30C7\u30B9{{Ruby|\u5149\
        \u7DDA|\u3053\u3046\u305B\u3093}}|Desu-k\u014Dsen}}: Frieza's favored finishing\
        \ technique, a small, highly concentrated beam of ki fired from the fingertip\
        \ with enough force to easily punch through an opponent's body. Frieza often\
        \ uses this technique to torture his opponents before finishing them off,\
        \ and uses it with great precision. He can fire many of them rapidly, overwhelming\
        \ his opponents with a barrage of high-power attacks. After his mental training\
        \ in Hell, Frieza gained such control over his ki that his Death Beams can\
        \ home in on opponents. b2318590a9c835558ca7bf8e7fd37326.jpg e34a4d65-352c-4781-a5fd-b0eb3a16ef9d.jpeg\
        \ 40d7fc4f-7a1c-439a-a095-6c44d15db2d3.jpeg *{{Nihongo|Death Psycho Bomb|{{Ruby|\u8D85\
        |\u3061\u3087\u3046}}{{Ruby|\u5927\u5FF5\u7206|\u3060\u3044\u306D\u3093\u3070\
