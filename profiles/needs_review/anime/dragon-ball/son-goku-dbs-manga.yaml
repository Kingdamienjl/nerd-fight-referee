- id: claim-weaknesses-aa492200
  section: weaknesses
  axis: weakness
  text: 'Goku seeks strong opponents and therefore will allow his opponents to reach
    their full power for the sake of a good fight. He often drops his guard and leaves
    openings for his opponents whenever he gets distracted, lowering his durability.
    His Spirit Bomb requires a long charge-up period, during which time he is vulnerable.
    He cannot survive in the vacuum of space and needs to locate a Ki signature to
    teleport using Instant Transmission. The Evil Containment Wave requires a suitable
    container to seal the target into and drains a large amount of Ki, the latter
    of which could kill him if he lacks sufficient Ki. In Battle of Gods, he can''t
    transform into Super Saiyan God by himself and requires a ritual to achieve the
    form but later he can transform into both Super Saiyan God and Blue by himself
    | Lacks mastery over Hakai, needs time to charge up and executing the technique,
    and the effect is slow, which allowed Zamasu to recover from panicking and react
    to it. However, this is somewhat addressed in the Moro Arc, where he can deconstruct
    a boulder instantly in Perfected Ultra Instinct. Completed Super Saiyan Blue heavily
    strains his body at first but he eventually trained this weakness out of his body.
    In Blue Kaio-Ken he suffers similar downsides to the Kaio-Ken such as damaging
    his body with prolonged use, can''t transform into Ultra Instinct -Sign- and Perfected
    Ultra Instinct at will. Ultra Instinct first lasted only seconds before reverting
    to his base form before later lasting in a longer battle against Jiren | After
    training with Merus, Goku can transform and keep up his Ultra Instinct -Sign-
    for much longer, but it still drains his stamina rapidly. Later he can transform
    into Perfected Ultra Instinct, although it still requires great effort | Can now
    willingly transform into Perfected Ultra Instinct much easier, but the accuracy
    decreases over time, as stated by Granolah. {| class="mw-collapsible mw-collapsed"
    align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%" |
    colspan="2" style="text-align: left; "'
