    \ Ball Super - Chapter 54) **Limited Longevity (Known intergalactically as the\
    \ \"warrior race of the universe\", Saiyans have evolved to remain in their physical\
    \ prime for a long period of time. Their bodies remain child-like for several\
    \ years before rapidly growing into their adult bodies,Jaco the Galactic Patrolman\
    \ - Chapter 11 and they age slowly after reaching their primeDragon Ball: Super\
    \ Exciting Guide - Character Volume : \"The Truth About the Dragon Ball Manga\
    \ - Toriyama Thought of It Like This: Special Part 2\" in order to remain young\
    \ and battle-ready for decades;Daizenshuu 4 \u2013 World Guide: Racial Groups\
    \ after reaching a certain age, however, they rapidly grow frail. Additionally,\
    \ Saiyans have a longer lifespan than humansDragon Ball: Episode of Bardock -\
    \ Super Kanzenban: \"Special Project - Akira Toriyama-sensei Super Q&A!!\") **More\
    \ Transformation (Can transform into various normal Super Saiyan form, increasing\
    \ his capabilities drastically as well as Super Saiyan God) ***Limited Light Manipulation\
    \ (Super Saiyan forms can glow in pitch-black conditionsDragon Ball Z - Chapter\
    \ 256) ***Minor Electricity Generation (As a Super Saiyan 2 and 3, he releases\
    \ electric bolts around his bodyDragon Ball Super - Chapter 51) ***Body Control\
    \ (Basic Functions; The Super Saiyan form can enhance the user's eyesight,Dragon\
    \ Ball Super - Chapter 94 to the point that visual impairments are alleviated\
