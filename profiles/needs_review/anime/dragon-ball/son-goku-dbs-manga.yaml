    \ Zero - Character Encyclopedia As a Super Saiyan Grade 2 and 3,Dragon Ball Z\
    \ - Chapter 193 every nerve is concentrated to channel Ki throughout the body\
    \ and inflate the muscles to increase power and speed,Daizenshuu 7 \u2013 Dragon\
    \ Ball Encyclopedia: Special Attack DictionaryWeekly Jump comic: The History Of\
    \ Trunks - Super Saiyan Guide but when pushed further the increase in strength\
    \ comes at the cost of speedDaizenshuu 7 \u2013 Dragon Ball Encyclopedia: Special\
    \ Attack DictionaryWeekly Jump comic: The History Of Trunks - Super Saiyan Guide)\
    \ **Enhanced Senses ***Smell, Hearing, Touch, & Awareness (Saiyans possess exceptional\
    \ senses, allowing them to locate small, distant objectsDragon Ball - Chapter\
    \ 29 by tracking their smell,Dragon Ball - Chapter 29 overhear and understand\
    \ conversations from a distance,Dragon Ball - Chapter 175 and sense people throughout\
    \ a village even when they are hiding.Dragon Ball - Chapter 5 After training with\
