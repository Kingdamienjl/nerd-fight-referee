      value: Gifted (While Gohan is not as skilled in combat as his father, he is
        still a highly skilled martial artist and an intelligent tactician. Trained
        in combat and schooled throughout his entire life since the earliest years
        of his childhood, Gohan is a clever fighter capable of creatively utilizing
        his abilities. By using his highly tuned senses and skill alone, he was capable
        of following Lavender's movements even after being blinded and use his Ki
        as a radar. As a scholar, tutored throughout his entire life, Gohan is highly
        intelligent and knowledgeable as well, having an in-depth understanding of
        the metaphysical mechanics of Ki itself. Due to his intelligence and skill,
        Goku appointed him as the Captain of Team Universe 7)
