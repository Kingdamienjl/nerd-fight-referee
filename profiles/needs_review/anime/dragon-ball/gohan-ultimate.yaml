    - field: weaknesses
      value: "Gohan has an explosive temper that can flare up suddenly and cause him\
        \ to act irrationally, but besides this, he is typically a pacifist who avoids\
        \ fighting and dislikes killing opponents. Due to this, he often keeps his\
        \ true power restrained so as to avoid harming others. He had not continued\
        \ his training and as a result, was not even sure if he could turn into a\
        \ Super Saiyan in the Resurrection F saga. In Super Hero, Gohan cannot see\
        \ well in his base form without his glasses, though his transformations fix\
        \ his eyesight for as long as he uses them. {| class=\"mw-collapsible mw-collapsed\"\
        \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"\
        width:100%\" | colspan=\"2\" style=\"text-align: left; \" |Notable Attacks/Techniques:\
        \ |- | |-|Ki Attacks= The fighting power and life force of a martial artist,\
        \ a tangible energy derived from the user's vigor, courage, and mind. It can\
        \ be used in a number of ways, such as to surpass the limits of one's body\
        \ to greatly increase in strength, and it can be fired as blasts of energy\
        \ or used to create defensive barriers. Along with his Saiyan blood, Ki acts\
        \ as the source of Gohan's incredible power and abilities. Even as a child,\
        \ Gohan possessed an exceptionally high dormant potential that allows him\
        \ to show the true depths of his power whenever his rage shows through and\
        \ grow in strength quickly. Even after getting his potential unlocked twice,\
        \ Gohan still had room to grow further and further in power. *{{Nihongo|Kamehameha|\u304B\
        \u3081\u306F\u3081}}: Goku's signature technique, which Gohan learned from\
        \ his father during their training in the Hyperbolic Time Chamber. Gohan's\
        \ most powerful and famous use of this technique is the Father-Son Kamehameha,\
        \ utilized alongside his father's spirit to finally destroy Cell. center|250px\
        \ *{{Nihongo|Masenko||Masenk\u014D}}: Gohan's original signature technique,\
        \ which he learned from Piccolo. After placing both of his hands above his\
        \ head with his palms facing towards his opponents, he fires a powerful blast\
        \ of ki. By charging it longer, he can also throw it as an explosive sphere\
        \ of energy. GohanAbility1.jpeg Gohanability2.jpeg *{{Nihongo|Kiai|\u3044\
        }}: The ability to project an invisible burst of force with ki, which Gohan\
        \ can perform with his hands. center|250px *{{Nihongo|Special Beam Cannon||Makank\u014D\
        sapp\u014D}}: One of Piccolo's signature attacks Gohan learned in secret.\
        \ After bringing his index and middle fingers to his forehead, Gohan charges\
        \ up and fires a spiraling laser that can drill through most opponents. center|250px\
        \ |-|Saiyan Physiology= The physiology of a Saiyan, an aggressive warrior\
        \ race of conquerors. Saiyans have the natural ability to control ki and to\
        \ fly. While his lifespan is comparable to that of a human, Gohan will remain\
        \ at his peak strength for much longer. One of the most powerful abilities\
        \ of a Saiyan is their ability to grow stronger and stronger through combat,\
        \ allowing Gohan to constantly push his own limits during a fight and rise\
        \ to higher and higher peaks in power. This ability grants a substantial boost\
        \ in power when Gohan is badly injured, allowing him to reach a whole new\
        \ level of power once he recovers. {{Nihongo|Super Saiyan|\u30B5\u30A4\u30E4\
        |S\u016Bp\u0101 Saiyajin}}: The famous, legendary transformation of a Saiyan\
        \ that allows them to greatly surpass their limits and reach the fabled state\
        \ that is Super Saiyan. Gohan achieved this state during his training with\
        \ his father in the Hyperbolic Time Chamber. These transformations can be\
        \ reached through extensive training, but are more often unlocked in moments\
        \ of intense emotional turmoil and need, and due to the natural aggressiveness\
        \ of Saiyans, they cause the user to become more aggressive and malicious,\
        \ and though Gohan has managed to make these things effectively a non-issue\
        \ through training, his first transformation into a Super Saiyan 2 caused\
        \ him to become extremely sadistic. While immensely powerful, Super Saiyan\
        \ transformations drain a lot of energy, and the first was very inefficient\
        \ before Gohan mastered the state and became a \"Full Power Super Saiyan\"\
        , allowing him to maintain the form effectively indefinitely without issue.\
        \ While the original Super Saiyan state is eclipsed in power by Super Saiyan\
        \ 2, the higher forms become increasingly inefficient. GohanSSJ.gif GohanSSJ2.gif\
        \ |-|Potential Unleashed"
