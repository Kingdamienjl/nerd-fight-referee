    - field: attack_potency
      value: 'At least Athlete level, likely higher (Subaru is noted to be fit and
        athletic due to him training every day and has gotten stronger since.), Solar
        System level with fighting spirit amp (Subaru at times of need or when in
        desperate situations can unlock a power that makes him far stronger than normal,
        though this is rare. With this he punched Petelgeuse so hard his head snapped
        back and managed to kill him. Petelgeuse is somewhat relative to Elsa, who
        could kill Emilia whose suppressed power should be comparable to Omega''s
        casual power, who performed this feat and potentially scales to Emilia''s
        full power which is above Beatrice''s, who can create Black Holes this powerful.
        Elsa also had a battle to the death with Garfiel who should scale comparable
        to if not above Emilia''s full power.), potentially Outerverse level with
        RBD''s penalty (If Subaru forces himself to tell someone about RBD, Satella
        can appear and kill the person. Satella''s power transcends all possible dimensions
        and she scales above Regulus, who transcends all concepts, and who cannot
        be harmed by those bound by concepts, implying Satella''s power is not bound
        by concepts. She also scales above the Fiend sword, which has the power to
        destroy what defines any concept [which would include the concepts of space
        and dimensions, as all things, including concepts, have a core that defines
        it].) | At least Athlete level, likely higher (Got far stronger than before.),
        Solar System level with fighting spirit amps (While at tip top shape he managed
        to brawl with a weakened Garfiel.), higher with Invisible Providence (Invisible
        Providence sent Base Garfiel flying.), Varies from Island level to Solar System
        level with Beatrice (Subaru is contracted with Beatrice by the end of arc
