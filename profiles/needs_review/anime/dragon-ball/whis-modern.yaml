    - field: weaknesses
      value: 'After overexerting his magic gate, Subaru''s magic gate got shattered
        to the point where he can use Shamac once or twice in a day before his body
        breaks apart, and his body might sustain mana poisoning due to massive mana
        accumulation inside his body (No longer the case after having Beatrice). In
        his contract with Beatrice, certain conditions must be fulfilled (Subaru cannot
        make contracts with other spirits other than Beatrice, Beatrice cannot absorb
        mana from the atmosphere, and can only drain mana from Subaru). Cannot use
        Magic without Beatrice. His fighting spirit amp does not last that long. Feats:
        Subaru''s best feats come from how cunning, manipulative and smart he can
        be; *Lead the strategy on the imperial capital *Convincing the Shudraq to
        respect him via the Lifeblood Ritual *Todd who considered Subaru a "child
        of war" and proved to be one of his greatest enemies could not see through
        his Nastumi Schwarz siege There are many more intellectual feats Subaru has
        performed throughout the novel that can''t be explained in one profile. |-|Subaru=
        *Return By Death: An ability that is given to Subaru by Satella, the Witch
        of Envy. This ability allows Subaru to return to an uncontrollable past point
        of time upon his death. There is no lag between both of the time of death
        and the time of resurrection. According to Subaru, from his own perspective,
        it is similar to the feeling of someone or something switching camera angles
        inside his head. This ability was given to Subaru because of his desire to
        protect his loved 1s, but from Satella''s own view, she gave it to him in
        order to make him overcome the situations that resulted in his death. In addition,
        the ability does not have a limit to how much it is used, and there are penalties
        if Subaru had the slightest of thought to reveal it to anyone or speak it
        out loud. If he spoke it out, the Witch''s Hand would grip his heart and harm
        him, and at times, kills him. Also, should Subaru speaks out of it, and persists
        and ignores the previous ability, Satella would direct the Witch''s Hand to
        those who heard about the ability and kill them. If someone managed to know
        the ability, Satella herself will appear to rectify it. Note that simply knowing
        that Subaru can rewind time around the world through means unknown will not
        trigger the penalities. In addition to this, every time Subaru uses Return
        By Death, or even speaks of it, the Witch''s Miasma, which attracts Mabeasts
        surrounds him, and increases the more he uses this ability. Echidna who has
        knowledge of Reinhard and Satella, stated Return by Death is the strongest
        technique. *Shamac: A Yin magic ability that allows the user to release a
        dark mist that effects all the senses of the opponent, sans the sense of touch.
        *Dragon Blood: After being infected with Capella''s Dragon Blood, Subaru gained
        a healing factor that allows him to regenerate lost limbs, like the time where
        his wrist got sliced off and it healed back as if it never happened, or when
        his leg got completely shattered, and shortly afterwards it got completely
        healed back. *Authority: Subaru is currently in possession of two Authorities,
        Sloth and Greed: **Invisible Providence: The Authority of Sloth, formerly
        called the Unseen Hand, gives Subaru the ability to create an invisible force
        field in the shape of a hand. He acquired this ability from Petelgeuse. However,
        he is only able to control one hand, and it sports from his chest as opposed
        to from his back. **Cor Leonis: An inverse form of Regulus Corneas'' "Lion
        Heart" which Subaru obtained in Arc 6. As such, it works inversely to how
        the Small King does, in which Subaru takes on the burdens of others, either
        physical or mental, and transfers them to himself temporarily in exchange
        for an increase in his combat abilities. It seems that it only works on people
        who Subaru has a strong emotional connection, whom he can perceive through
        points of light when the Authority is active. Subaru can use it to derive
        the relative location of other people and their emotional states. Another
        version of it, which is completely similar to Small King, allows Subaru to
        transfer the pain he experiences, either physical or emotional, to those that
        he holds a strong emotional connection to. |-|Beatrice= *El Shamac: The target
        becomes unable to control their bodies while under its effects. *Ul Shamac:
        Covers the area in darkness making the opponent unable to tell anything while
        under its effect, such as where they are sitting or standing, whether or not
        they are conscious, whether they are breathing in or out, dead or alive, whether
        they still retained human shape, how to move their arms, who they are etc.
        Those affected by it can be snapped out of its effects by being hit really
        hard. *Al Shamac: Capable of sending its target to a different dimension.
        *Door Crossing: Door Crossing connects its space to the interior of a single
        building, otherwise to the place Beatrice most recently knew. It can''t connect
        over especially long ra'
