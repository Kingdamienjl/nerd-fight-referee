    - field: weaknesses
      value: 'If the connection to the Crow Guardian is severed, he loses his superhuman
        abilities, becoming a simple man. Note: Thunder''s arcade biographyKiller
        Instinct (2013) Arcade Mode - Thunder sets his age as 47; however, it was
        written when the game was supposed to be a sequel to the previous Killer Instinct
        games. Because of further expansions of the plot and lore, many retcons to
        the overall backstory have been made, and the references to Thunder''s age
        and the time which has passed point at him being younger. Combat Traits: |-|Notable
        Attacks/Techniques= {{#tag:tabber| {{!}}-{{!}}Command Attacks= *Horn Breaker:
        Thunder lunges forward and swings his tomahawks downward twice. *Call of the
        Sky: Thunder summons a lightning from the sky absorbs it in his body. His
        next dash will be faster, and Thunder''s body will become one with darkness,
        while crows and black feathers emerge from him. This move allows him to pass
        through the opponent and their attacks without being neither harmed nor stopped.
        ThunderHornBreaker.gif|Horn Breaker CallOfTheSky.gif|Call of the Sky {{!}}-{{!}}Throws=
        Thunder has access to two specific throws. With the first, he sweeps the opponent''s
        foot with one of his tomahawks and tackles them shoulder-first while they
        fall. With the second one, Thunder suddenly grabs the opponent and switches
        side with them, leaving them vulnerable for a brief moment. ThunderThrow.gif
        ThunderBackThrow.gif {{!}}-{{!}}Special Moves= *Sammamish: Known to be the
        most devastating technique of Thunder''s tribe, it is a flying headbutt delivered
        while Thunder''s body surges with electricity. Shadow Energy increases the
        strength of this attack. The initial jump can also lead to three different
        techniques. **Skyfall: Upon reaching peak height, Thunder spins on himself
        and falls down at high speed, stomping the opponent and knocking them down.
        **Rainmaker: A knee delivered while Thunder rises in the air. **Downpour:
        A flying dropkick performed in mid-air. Sammamish2013.gif|Sammamish ShadowSammamish.gif|Shadow
        Sammamish Skyfall.gif|Skyfall SurpriseKnee.gif|Rainmaker ThunderDropkick.gif|Downpour
        *Triplax: Thunder advances while spinning on himself and slashing the opponent.
        With the heavy version, Thunder attacks thrice and each blow is powered by
        electricity. Shadow Energy makes it stronger and allows Thunder to power through
        an attack and keep going. Triplax2013.gif|Triplax HeavyTriplax.gif|Triplax
        (Heavy) ShadowTriplax.gif|Shadow Triplax *Call of the Earth: Thunder stabs
        the opponent''s flanks with both his tomahawks, lifts them up and slams them
        on the other side. Once they are down, he violently stomps their face, while
        a ligthning comes down onto them to build up damage. With the Shadow version,
        Thunder stomps them twice, then drives his tomahawks in their chest and flips
        them over. Each of these additional motions is followed by a lightning that
        electrocutes the victim. CallOfTheEarth.gif|Call of the Earth ShadowCallOfTheEarth.gif|Shadow
        Call of the Earth *Ankle Slicer: Thunder chops the opponent''s ankle with
        a large swing of his tomahawk. Shadow Energy makes the technique stronger.
        AnkleSlicer.gif|Ankle Slicer ShadowAnkleSlicer.gif|Shadow Ankle Slicer {{!}}-{{!}}Instinct=
        *Murder of Crows: Thunder summons multiple lightnings, channeling them through
        his tomahawks and absorbing them into his body, which turns black and surges
        with electricity. For a limited time, he will become faster and intangible
        while dashing, with flocks of crows emerging from his body. This can effectively
        be considered an advance version of Call of the Sky. MoC.gif MoC2.gif MoC3.gif
        {{!}}-{{!}}Ultimate= Thunder''s most powerful technique. He channels lightnings
        into his tomahawks, then lunges forward and vanishes, while a large flock
