    - field: powers_and_abilities
      value: "Arc 1-3=Superhuman Physical Characteristics via Statistics Amplification\
        \ (In random moments Subaru can unlock a hidden power that makes him far stronger\
        \ than normal, pushing him beyond his limits.), Magic, Enhanced Senses (Having\
        \ experienced death repeatedly since arriving in the Re:Zero world, Subaru\
        \ has an acute nose for danger. Can see the Unseen Hands which are invisible),\
        \ Conceptual Manipulation, Resurrection, Immortality (Types 4 and 8; Subaru\
        \ has an authority which he calls \"Return by Death\", which allows him to\
        \ return to certain points after his death. This power will keep bringing\
        \ him back as long as Satella loves Subaru. Authorities are abilities that\
        \ defy the concepts of the world and are the anthesis of Od Laguna, a conceptual\
        \ existence that is the essentially the root of the world itself.), Acausality\
        \ (Type 1; Can remember events even when time has been rewound, for example\
        \ he could remember Rem despite her being erased from the world and from the\
        \ memories of everyone else, to the point she never existed in the first place.),\
        \ Pressure Point Striking, Martial Arts (Despite never fighting before Subaru\
        \ was shown to punch, click and slam random street thugs with ease.), Social\
        \ Influencing (Got an entire village to follow Emilia even though she is hated/is\
        \ resented by most people. Convinced an army of people to join in a battle\
        \ against the White Whale, a creature that has been searched for a very long\
        \ time with no success, even getting people like Wilhem Van Astrea involved\
        \ after he had lost hope in getting revenge for his wife. Julius who not to\
        \ long ago hated Subaru's guts and beat him, ended up believing him to be\
        \ his true friend, gaining his and many other powerful characters help to\
        \ defeat the witch cultists and Petelgeuse, leading the plan despite everyone\
        \ knowing he is the weakest there.), Supernatural Willpower (Initially having\
        \ a weak resolve, Subaru gained extraordinary willpower throughout the story,\
        \ experiencing multiple deaths over and over again yet still having the resolve\
        \ to go and fight Elsa. Was tortured by Petelgeuse and saw people he loved\
        \ die on repeat but later on he banded everyone together to defeat him and\
        \ the witch cultists.), Status Effect Inducement, Mind Manipulation, Perception\
        \ Manipulation (Shamac is a magic that forcibly breaks the mind\u2019s contact\
        \ with surroundings. Shamac can deceive the perception of enemies, including,\
        \ but not limited to Mabeasts. Dark element magic is magic which does things\
        \ such as obstructing an opponent\u2019s vision, severing them from sound,\
        \ slowing their movements etc), Fragrance Manipulation (Subaru has the Witch's\
        \ scent around him which attracts Demon Beasts to him and every time he Returns\
        \ by Death or tries to speak about it the scent grows stronger), Limited Summoning\
