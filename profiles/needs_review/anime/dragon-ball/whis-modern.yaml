    - field: intelligence
      value: "Above Average (A fervent scholar of the traditions of his tribe, the\
        \ Nez Perce, which granted him knowledge of various fields. He studied their\
        \ language, folklore and traditional medicine, his goal to become a teacher\
        \ at the local Indian college. Is an expert combatant, whose style mixes martial\
        \ arts, tomahawk fighting and superpowers. Participated and survived the Killer\
        \ Instinct tournament, which puts the world\u2019s best fighters and deadly\
        \ creatures against one another in death matches. During the war against Gargos,\
        \ he partook in many different missions around the world, with many of them\
        \ being about battling Mimics, Omens and other creatures from the Astral Plane,\
        \ as well as rescuing civilians caught up in the disorders. Possesses several\
        \ additional skills, such as knowledge of advanced first aid and performing\
        \ mystic rituals)"
      source_id: mediawiki-whis-modern
