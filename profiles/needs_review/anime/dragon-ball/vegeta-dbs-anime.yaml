      \ Goku as a Super Saiyan 2) | Low Multiverse level (Became much stronger than\
      \ before and completely overpowered Super Saiyan Ros\xE9 Goku Black after training\
      \ in the Room of Spirit and Time. His Father-Son Galick Gun with Future Trunks\
      \ could overpower Fusion Zamasu's Holy Wrath, albeit he is weaker than the fusion\
      \ by himself. Evenly matched Toppo as a Super Saiyan Blue, who was strong enough\
      \ to force Goku to use Super Saiyan Blue Kaioken to fight him with a fight between\
      \ two Gods of Destruction being [https://www.youtube.com/watch?v=vU13f79Ca3I&t=151s\
      \ taboo] since it will result in the [https://imgur.com/a/fPOwj5M destruction\
      \ of two universes] [each consisting of six space-time continuums]. Vegeta eventually\
      \ overpowered and defeated Toppo through the utilization of his Final Explosion,\
      \ which he survived due to his power having increased astronomically from when\
      \ he attempted it the first time) | Low Multiverse level, far higher with God\
      \ Transformations (After the Tournament of Power, he is seen fighting with Super\
      \ Saiyan Blue Goku in the Bulma's cruise liner and in the same wasteland where\
      \ they had their first fight many years ago) | Massively FTL+ (Much faster than\
      \ before, should be comparable to Super Saiyan Blue Goku and Toppo. Outpaced\
      \ Super Saiyan Ros\xE9 Goku Black) | Massively FTL+ (Evaded Jiren\u2019s attacks\
      \ and kept pace with him. Blitzed GoD Toppo after powering up) | At least Class\
