power_scale:
  tier:
    text: 2-C | 2-C
    source_ids: &id002
    - mediawiki-5040465
    confidence: 0.8
  attack_potency:
    text: Low Multiverse level (Overpowered SSJB Vegeta with ease, who was later revealed
      to be weakened due to the form's stamina issue.Dragon Ball Super - Chapter 13
      Fought SSJ Goku all without breaking a sweat while Goku was getting more tired.
      Comparable to his durability. Performed all his previous feats while masking
      his true power, which afterwards forced Goku into using Full Power SSJB in order
      to overcome him. Goku assumed Hit could have been a more troublesome opponent
      if his killing techniques weren't restricted per tournament rules3 Universes)
      | Low Multiverse level (Has grown ever since the previous tournament concluded.Dragon
      Ball Super - Chapter 33 Fought a suppressed Jiren who was also fighting SSJB
      Goku, and seemingly performed better individually after taking his cloak off
      leaving both Champa and Goku shocked by his improved strengthDragon Ball Super
      - Chapter 35)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least FTL+, likely far higher (Can keep up with SSJ Goku without any
      issue, and reacted to attacks from SSJG Goku, all while masking his true power.
      After revealing his full power he managed to just about dodge a Kamehameha from
      SSJB Goku>27 c) | Massively FTL+ (Fought alongside SSJB Goku against a suppressed
      Jiren>42,929,150,727.4 c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class G, likely far higher (Far stronger than Frieza Arc Goku>3,002,361.41
      Tons) | At least Class G, likely far higher (Stronger than before)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Low Multiverse level (Easily took down a weakened Vegeta. While suppressed
      his strikes could match with SSJ Goku) | Low Multiverse level (Stronger than
      before)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Low Multiverse level (Took many attacks from SSJG Goku while masking his
      true power) | Low Multiverse level (Comparable to SSJB Goku)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Fought multiple opponents, constantly enduring Jiren's vastly
      superior strikes and still keep continuing. When using his full power he believed
      he wouldn't last longer than a minute, though it seems as if he resolved this
      issue by the time of the Tournament of Power)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Low Multiversal with Ki-based attacks | Standard Melee
      Range; Low Multiversal with Ki-based attacks
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Above Average overall, Gifted in combat strategy (Universe 6's renowned
