  stamina:
    text: Superhuman (Vegeta can train for days with minimal rest while constantly
      pushing himself to his limits, getting up again and again to train more despite
      the severe damage he deals to himself in the process. In combat, Vegeta's endurance
      is famous, allowing him to continue fighting against the Goku and the other
      Z-Fighters despite his steadily worsening condition. Even after being launched
      into the sky by a Kaioken x4 Kamehameha, losing his tail, and being hit by a
      Spirit Bomb, Vegeta was able to stubbornly keep on fighting, refusing to die
      or give up. He withstood an extended, brutal beatdown in his fight with Kid
      Buu despite the massive difference in their power)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Stellar to Interplanetary with Ki blasts and attacks
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius combatant (Vegeta is a cunning and skilled warrior whose refined
      technique shocked Goku during their first fight, leaving such a lasting impression
      that Goku wished for him to stay alive so that he could surpass him. While he
      often relies on his sheer power and fighting ability to win his battles, his
      intelligence is not to be underestimated. During the events of the Namek Saga,
      Vegeta was able to keep a low profile and outmaneuver Frieza's forces, leaving
      them scrambling to find him while he gathered all of the Dragon Balls. In the
      Cell saga, destroying Android 19, he feigned confidence and strength to scare
      Gero into fleeing, which was greatly beneficial given how much energy 19 had
      drained. Finally, during his fight with Cell, he was able to exploit his overconfidence
      for a chance at a free blow with his Final Flash)
    source_ids: *id002
    confidence: 0.8
