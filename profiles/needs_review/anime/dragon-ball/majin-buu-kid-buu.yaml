    - field: weaknesses
      value: 'Majin Buu''s energy can be worn out if he fights another Buu or a copy
        of himself. Innocent and Kid Buu are both fairly unintelligent and prone to
        fooling around in fights, taunting and mocking opponents rather than going
        all out and destroying them immediately. In all of his forms, Buu has a short
        temper and is easily angered. Buu is influenced by the personalities of those
        he absorbs, a tangible energy derived from the user''s vigor, and mind. It
        can be used in several ways, such as to surpass the limits of one''s body
        to greatly increase in strength, and it can be fired as blasts of energy or
        used to create defensive barriers. Buu possesses an immeasurable, unfathomable
        power that makes it extremely difficult to discern his true power, as it is
        never clear just how serious he''s being or how much energy he is using. His
        skill in the use of ki allows him to easily replicate other techniques after
        seeing them once, copying Goku''s Kamehameha and Kibito Kai''s Kai Kai in
        this manner., Kai Kai: The teleportation technique utilized by Kai that allows
        them to teleport to anywhere within or outside of the universe instantly,
        without needing a ki signature to lock onto. After observing this technique
        being used by Kibito Kai, Kamehameha: Goku''s famous signature technique,
        which Buu copied from him after seeing it once. Unlike Goku''s blue Kamehameha,
        Buu''s is pink in coloration., Planet Burst: Kid Buu''s most powerful attack,
        an immensely powerful sphere of ki that he creates and shapes in his hand
        before throwing it down at the planet beneath him, destroying it. It has more
        than enough power to destroy the Earth ten times over., Vanishing Beam: Buu''s
        primary offensive attack, a pink wave of ki fired from his hand at high power.
        Magic: Buu knows several magical abilities that allow him to heal others and
        even turn them into sweets and other foods. He can heal any wounds so long
        as the person he is healing is not dead, even healing Babidi after he was
        cut in half and curing a boy of his blindness., Chocolate Beam: Buu''s signature
        technique, a beam fired from his antennae or hand that can turn whatever it
        hits into whatever he desires. Due to his childish nature, he near exclusively
        uses it to turn others into food, such as transforming Dabura into a cookie,
        countless innocents into chocolate, and Chi-Chi into an egg. Majin Physiology:
        Buu has unusual, amorphous physiology that he can manipulate as he pleases,
        allowing him to stretch his limbs to extreme lengths, shape his body into
        bodies mimicking others, rip off chunks and use them to encircle and trap
        others, and even liquefy his own body before forcing himself into an opponent''s
        orifices and expand, destroying them from the inside. His amorphous body is
        highly, resistant to injury and can even split into various other bodies through
        fission. Of the many unique abilities that Buu''s body gives him, one of the
        most useful and powerful is his immense regenerative power. Even if he is
        blown to bits or reduced to vapor, Buu can regenerate rapidly, reforming his
        body from chunks of his body or even just pink gas. While this regeneration
        makes it incredibly hard to kill Buu, as he is worn down over time in combat,
        it becomes less effective and takes more time to fully trigger. *Absorption:
        By engulfing opponents within his amorphous body, Buu can absorb them, trapping
        them within his body as it solidifies around them, before fully absorbing
        them. This grants Buu their abilities and knowledge and changes his personality
        in the process, not always for the better. While it provides a boost in power
        proportional to the absorbed''s power, Buu also inherits their traits, causing
        Kid Buu to become oblivious and have a sliver of good within him after he
        absorbed the Dai Kaioshin. However, the abilities and power this gives outweigh
        any weaknesses.'
      source_id: character-stats-profiles-majin-buu-dragon-ball-kid-buu
