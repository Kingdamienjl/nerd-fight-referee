    - field: weaknesses
      value: 'If he opens the Dead Zone, he can be sucked in and trapped by his own
        attack if he loses his balance from being attacked or is distracted. Piccolo
        believed that complete physical destruction might kill him. The destruction
        of the Makyo Star will render him powerless. Notable Attacks/Techniques: |-|Makyan
        Physiology= Garlic Jr. is a Makyan, the demonic native race of the Makyo Star,
        an ominous evil red rogue planet. While their features vary, their most defining
        characteristics are pointed ears and fangs. *Makyo Star Empowerment: Due to
        its natural Dark Energy, The Makyo Star acts as the Makyan''s race source
        of power. It empowers the demonic Makyans and heals their injuries. **Gigantification:
        A technique where their dormant power is raised many tens of times through
        Planet Makyo''s influence. Most Makyans can only take this form when the Makyo
        Star is nearby, but some possess the capability to use it by themselves. This
        form can only be maintained so long as the Makyo Star is still in existence,
        as shortly after Gohan destroyed the Makyo Star, Garlic Jr. ended up shriveling
        to a decrepit form before being sucked back in the Dead Zone. LOOOOSER.gif|Ginger,
        Nicky, and Sansho Gigantification Garlic-Jr-Musle.gif|Garlic Jr. Gigantification
        COPYTHATTONE.gif|Spice and Vinegar Gigantification |-|Ki Techniques= The fighting
        power and life force of a martial artist, a tangible energy derived from the
        user''s vigor, courage, and mind. It can be used in several ways, such as
        to surpass the limits of one''s body to greatly increase in strength, and
        it can be fired as blasts of energy or used to create defensive barriers.
        It acts as the source of Garlic Jr.''s incredible power and abilities. *Darkness
        Eye Beam: Garlic Jr can shoot heat-like beams out of his eyes. The potency
        of the Eye Beam technique varies, but the majority of them are extremely quick,
        able to nullify weak attacks, as well as cripple opponents and damage other
        objects. HardlyaBlessing.gif|Garlic Jr. fires a Darkness Eye Beam at Piccolo
        Betterhmmmm.gif|Garlic Jr. fires another Darkness Eye Beam at Piccolo Won
        t-go-back-to-my-stage.gif|Garlic Jr.''s Darkness Eye Beam destroys part of
        the Lookout *Death Impact: A large energy wave that Garlic Jr. fires from
        his hand at the opponent. **Belly Blast: A variation of the Death Impact used
        by Garlic Jr. in his transformed state. He thrusts his chest forward and releases
        a massive beam from his torso. Death Impac.gif|Garlic Jr.''s Death Impact
        WATCHOUTKARMAISWHATYOUMAKE.gif|Super Garlic Jr.''s Death Impact BELLYUBLAST.gif|Super
        Garlic Jr.''s Belly Blast *Sealed Light Beam: Garlic Jr. puts his hands out
        and fires rings of energy that can paralyze and shrink an opponent before
        capturing them in small energy spheres. If the spheres are broken by another
        opponent, the person will be freed and regain their size and power. However,
        Garlic Jr. himself can kill whoever is trapped by destroying it. BALLPOPO.gif|Garlic
        Jr. captures Mr. Popo LolSmallGreen.gif|Garlic Jr. captures Kami *Dead Zone:
        Garlic Jr. can open a large pseudo-black hole attack that will suck anything
        in its path into oblivion. However, if he is distracted or attacked, he can
        be sucked into his own attack. This was the cause of Garlic Jr.''s downfall
        in both of his appearances. DADEADZONE.gif|Super Garlic Jr. generates a Dead
        Zone Garlic opens another one.gif|Super Garlic Jr. generates another Dead
        Zone Notes: *The statistics of Dragon Ball GT/Movie characters are clearly
        part of a separate continuity, and as such tend to differ greatly from the
        current canon. *Garlic Jr. himself did not actually get stronger in the Garlic
        Jr. Saga. His increase in power came specifically from the Makyo Star. The
        closer it gets to him, the more powerful he becomes. ==Notable Matchups==
