    - field: weaknesses
      value: 'Cell is extremely overconfident and desires a good fight above all else
        due to his Saiyan blood, he relishes a good challenge and will avoid fighting
        at full power and let opponents reach their most powerful states to get one.
        When outmatched, Cell will begin to panic and fly into a rage, fighting irrationally.
        He cannot absorb mechanical beings by puncturing them with his tail, and powerful
        enough strikes to his body can cause him to regurgitate whoever he absorbed
        by engulfing them with his tail, causing him to devolve if he regurgitates
        one of the androids. He needs to locate a ki signature to teleport using Instant
        Transmission. {| class="mw-collapsible mw-collapsed" align="center" border="1"
        cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
        left; " |Notable Attacks/Techniques: |- | The fighting power and life force
        of a martial artist, a tangible energy derived from the user''s vigor, courage,
        and mind. It can be used in a number of ways, such as to surpass the limits
        of one''s body to greatly increase in strength, and it can be fired as blasts
        of energy or used to create defensive barriers. Ki is a large part of Cell''s
        superhuman abilities, alongside his unusual composition and the varied DNA
        he possesses. Due to his nature as a hybrid created from the DNA of many fighters,
        Cell possesses many of their techniques. *: A technique gained from Frieza''s
        DNA that takes the form of a small, highly concentrated beam of ki fired from
        the fingertip with enough force to punch straight through an opponent''s body.
        *: The closest thing that Cell has to a signature attack, gained from Goku''s
        DNA. After charging up the attack in his hands and at his side, Cell fires
        the beam as a massive, blue burst of ki that is powerful enough to destroy
        planets, and, as Super Perfect Cell, can destroy the entire solar system.
        * Bringing his arms and legs to his chest, Cell charges up an aura before
        expelling it as a protective, expanding barrier that can block attacks and
        damage opponents who are caught in it. *: After being teleported to King Kai''s
        planet by Goku, Cell learned this technique, which allows him to lock onto
        the ki signatures of others and teleport to their locations. Its use takes
        some concentration, which is aided by Cell putting his index and middle fingers
        to his foreheads, and he needs a ki signature to teleport to, otherwise he
        cannot perform the technique. It can be used to teleport others as well, as
        long as they are in physical contact with Cell. *: Goku''s ultimate attack,
        taught to him by King Kai, and which Cell claims to know how to be able to
        perform due to possessing Goku''s DNA. It is utilized by gathering a vast
        amount of energy from all the lifeforms in his surroundings to create a massive,
        incredibly destructive sphere of ki. While one must have a pure heart to utilize
        it, it is possible that Cell is able to use it due to being pure evil, if
        he is even capable of using it at all. While it is incredibly powerful and
        can prove capable of completely destroying an opponent when used with sufficient
        power, it takes a very long time to charge and is therefore very difficult
        to use, though the charge time can be sped up by gathering energy from those
        who willingly and knowingly provide it. Given that Cell is a monster, however,
        there are few who would be willing to give him the ki for a Spirit Bomb. Cell
        is Doctor Gero''s greatest creation, a "perfect warrior" created from the
        cells of the greatest warriors to ever visit Earth, containing the DNA of
        Son Goku, Vegeta, Piccolo, Frieza, and King Cold. Due to this combination
        of genes, Cell possesses numerous favorable traits and special abilities.
        Like Frieza''s race, he can survive the gravest of injuries and live in the
        vacuum of space, remaining alive even after destroying most of his body with
        his self-destruction, and he has the regenerative capabilities of a Namekian.
        However, his have been greatly enhanced, allowing him to regenerate as long
        as the special core nucleus contained within his head still remains. Even
        having the top half of his body vaporized or blowing himself to pieces is
        little more than a delay, and due to his Saiyan DNA, this will actually make
        him stronger. Cell grows more powerful over the course of combat, allowing
