- id: claim-weaknesses-49d7ad8c
  section: weaknesses
  axis: weakness
  text: 'Goku seeks strong opponents and therefore will allow his opponents to reach
    their full power for the sake of a good fight. Kaioken strains his body, causing
    him intense pain and exhaustion if he overuses it. He often drops his guard and
    leaves openings for his opponents whenever he gets distracted, lowering his durability.
    His Spirit Bomb requires a long charge-up period, during which time he is vulnerable.
    He cannot survive in the vacuum of space and needs to locate a ki signature to
    teleport using Instant Transmission. Super Saiyan 3 drains his ki rapidly and
    will exhaust him within only a few minutes. {| class="mw-collapsible mw-collapsed"
