  text: "Border|||Content= *Superhuman Physical Characteristics **Limited Longevity\
    \ (Known intergalactically as the \"warrior race of the universe\", Saiyans have\
    \ evolved to remain in their physical prime for a long period of time. Their bodies\
    \ remain child-like for several years before rapidly growing into their adult\
    \ bodies,Jaco the Galactic Patrolman - Chapter 11 and they age slowly after reaching\
    \ their primeDragon Ball: Super Exciting Guide - Character Volume : \"The Truth\
    \ About the Dragon Ball Manga - Toriyama Thought of It Like This: Special Part\
    \ 2\" in order to remain young and battle-ready for decades;Daizenshuu 4 \u2013\
    \ World Guide: Racial Groups after reaching a certain age, however, they rapidly\
    \ grow frail. Additionally, Saiyans have a longer lifespan than humansDragon Ball:\
    \ Episode of Bardock - Super Kanzenban: \"Special Project - Akira Toriyama-sensei\
    \ Super Q&A!!\") **Enhanced Senses ***Smell, Hearing, Touch, & Awareness (Saiyans\
    \ possess exceptional senses, allowing them to locate small, distant objectsDragon\
    \ Ball - Chapter 29 by tracking their smell,Dragon Ball - Chapter 29 overhear\
    \ and understand conversations from a distance,Dragon Ball - Chapter 175 and sense\
    \ people throughout a village even when they are hiding.Dragon Ball - Chapter\
    \ 5 After training with Mr. Popo, capable of tracking the movements of others\
    \ even in pitch-black conditions by feeling vibrations in the airDragon Ball -\
    \ Chapter 164Dragon Ball - Chapter 179Dragon Ball Z - Chapter 256) ***Vision ****Soul\
    \ Vision (Witnessed Kami-sama's soul/spiritDragon Ball - Chapter 182 come out\
    \ of Shen's bodyDragon Ball - Chapter 181Dragon Ball - Chapter 175 right before\
    \ Piccolo attempted to seal him with the Evil Containment WaveDragon Ball - Chapter\
    \ 181) ****Telescopic Vision (Saiyans have exceptional senses, allowing them to\
    \ see clearly over long distances.Dragon Ball - Chapter 3 Learning to evade bees\
    \ in close proximityDragon Ball - Chapter 31 is designed to sharpen the eyesDragon\
    \ Ball - Chapter 32 and the reflexes,Dragon Ball Landmark \u2013 Chapter 2: \"\
    Landmarks of the Dragon Ball World - Landmark 2: Training\" developing one's dynamic\
    \ visionDragon Ball: Super Exciting Guide - Story Volume: \"Section 3 - Training\"\
    ) *Master Martial Artist (The fundamentals of the Turtle School are basic, yet\
    \ rigorous exercises to instill heightened abilities within its students,Dragon\
    \ Ball - Chapter 28 mastering and shaping the body and the mindDragon Ball - Chapter\
    \ 30 through concentration,Dragon Ball - Chapter 29 cardiovascular fitness, reflex\
    \ training, and repetitive, drill-like disciplines wearing 20kg and 40kg weights,\
    \ daily for eight months from as early as 4:30 AM, strengthening the back and\
    \ legs, the hands and waist, and the entire body beyond the limits of normal humans,\
    \ thus allowing its studentsDragon Ball - Chapter 33 to effortlessly dominateDragon\
    \ Ball - Chapter 33 even the finest of martial artists,Dragon Ball - Chapter 34\
    \ including the likes of Nam,Dragon Ball - Chapter 44 even without proper combat\
    \ trainingDragon Ball - Chapter 33) **Pressure Point Strikes (Can easily target\
    \ and strike his opponent's pressure points to knock them outDragon Ball - Chapter\
    \ 167) **Instinctive Action (By entering a tranquil state,Dragon Ball \u2013 Super\
    \ Exciting Guide: \"Story\" he learned how to eliminate unnecessary thoughts,Dragon\
    \ Ball - Chapter 164 which erases his KiDragon Ball - Chapter 184 and enables\
    \ unconscious sensing of vital informationDragon Ball - Chapter 164) **Enhanced\
    \ Afterimage Creation (Could use Jackie Chun\u2019s afterimage technique,Dragon\
    \ Ball - Chapter 44 eventually make an even better version of Jackie Chun\u2019\
    s afterimage technique.Dragon Ball - Chapter 48Dragon Ball - Chapter 89 Dragon\
    \ Ball - Chapter 130 Utilized the Eight-Arm Fist technique,Dragon Ball - Chapter\
    \ 115 which he copied from King Chappa during the preliminaries,Dragon Ball -\
    \ Chapter 115 to trick Tien Shinhan\u2019s third eye and counter his Four Witches\
    \ TechniqueDragon Ball - Chapter 123 Dragon Ball - Chapter 132) **Stealth Mastery\
    \ & Limited Perception Manipulation (With his sharpened spirit,Dragon Ball - Chapter\
    \ 165 Goku mastered the ability of \"[crouching as quiet as the sky and [striking]\
    \ quick than lightning\"],Dragon Ball - Chapter 164 dampening his presence completely\
    \ including scant air movementsDragon Ball - Chapter 176 and his footstepsDragon\
    \ Ball - Chapter 184 and erasing his own Ki; thus, allowing him to optimize his\
    \ movements and elude the senses of opponents completelyDaizenshuu 7 \u2013 Dragon\
    \ Ball Encyclopedia: Human Racial Dictionary) **Acrobatics (All-Terrain Mobility,\
    \ Hypermobility & Self-Momentum; By strengthening the waist and legs jogging,\
    \ delivering milk to areas only accessible by helicopter, including across trees,\
    \ quicksand, and rivers and away from tyrannosaurus rexes, and engaging in civil\
    \ engineering, whilst wearing 20kg and 40kg weights, students of the Turtle School\
    \ develop the strength and agility required to leap \"higher than the clouds\"\
    \ with minimal effort,Dragon Ball - Chapter 45 move arou"
