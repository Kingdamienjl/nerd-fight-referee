    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Enhanced Senses, Acrobatics, Martial
        Arts (Goku surpassed Master Roshi, the greatest martial artist in the world
        who trained Grandpa Gohan, a master of all martial arts with martial arts
        in Dragon Ball being greater than real life. Defeated Tien with the two using
        new techniques and adapting to each other during the course of their fight.),
        Ki Manipulation, Damage Boost (By focusing his ki on a single point, he can
        make his attacks stronger.), Empowerment (Ki users can get stronger by staying
        true to themselves, their own acts of emotion, and by remaining calm in battle.),
        Light Manipulation (Ki blasts are beams of light. The Kamehameha can beat
        those weak to light. The Solar Flare technique blinds the opponent with a
        flash of light.), Air Manipulation, Shockwave Generation (Kiais are invisible
        blasts that are produced by the emission of ki or rapid hand movement to crush
        the enemy with raw energy.), Limited Matter Manipulation (Ki blasts are described
        as "materializing the body''s internal energy outside the body" and are described
        as chemical projectiles), Aura (Ki users can increase the strength of their
        own attacks with ki. The size of the fighters'' ki and their control over
        it is the biggest deciding factor in the outcome of a battle. Stronger ki
        can induce fear to those weaker than them, making them unable to move.), Accelerated
        Development (Goku has an incredible development rate. Finished Korin''s training
        in 3 days, which took Master Roshi 3 years.), Limited Longevity (Saiyans have
        a longer lifespan than humans.), Limited Self-Sustenance (Type 1; As a Saiyan,
        he can for a limited time, breathe in space.), Reactive Power Level (Saiyans
        get stronger in the midst of battle and gain a power boost after recovering
        from near fatal injuries.), Power Mimicry (Goku can copy even the most difficult
        techniques near instantly. During the midst of battles he can memorize difficult
        fighting techniques and replicate them.), Afterimage Creation (Can create
        afterimages.), Breath Attack, High-Pain Tolerance, Indomitable Will (Goku
        drank the Super Sacred Water, which is a great poison that would most likely
        kill him, and withstood its effects while yelling in immense pain for 6 hours,
        refusing to spit it out despite Yajirobe telling him to. Due to having a pure
        heart, Goku ignored the Devilmite Beam, which targets the darkness in a persons
        heart and makes it explode.), Extrasensory Perception (Can sense how strong
        someone is. Detecting their intentions and if they have any malicious and
        differences in power. Can follow someone without any visual needs. After training
        with Popo he should be able to sense movements made behind him. By quieting
        his own ki he can sense things even with his eyes closed.), Forcefield Creation
        (Can create shields made of ki), Flight (Goku can fly), Telepathy (Ki users
        can fight in a mental plane, visualizing battles with others to train themselves
        which makes them stronger in the real world as well.), Pressure Point Strikes
        (Goku can knock out great martial artists by striking their pressure points.),
        Stealth Mastery, Limited Perception Manipulation (In his training with Kami
        and Mr. Popo, Goku sharpened his spirit, mastering the ability of crouching
        as quiet as the sky and striking quicker than lightning, dampening his presence-
        including scant movement, and his footsteps, even erasing his own ki, allowing
        him to optimize his movements and elude the senses of his opponents.), Shockwave
        Generation (Can create shockwaves), Limited Instinctive Reactions (By stilling
        his spirit, his body moves naturally on its own), Resistance to Electricity
        Manipulation (Resisted Roshi''s Lightning Surprise attack), Heat Manipulation
        (Withstood flames multiple times), Limited Gravity Manipulation, Harsh Temperatures
        (As a teenager he trained in the ROSAT for a month, where temperatures fluctuate
        between 50 degrees to -50 degrees Celcius and has 10x the gravity of Earth.
        Withstood the temperatures of a mountain which can freeze even missiles and
        fire), Poisons (Resisted the super sacred water, a great poison that kills
        those without great strength, vitality and mind.), Illusion Creation (Can
        see through illusions with his minds eye), Limited Extrasensory Perception
        (Can erase his presence, even making their power go down to zero.) | All previous
        abilities along with: Statistics Amplification (Learned the Kaioken which
        allows him to amplify all his stats by up to 4x), Telekinesis (After fighting
        with Vegeta, Goku could lift a pyramid while injured.), Resistance to Sleep
        Manipulation (Resisted sleep inducing foods), Heat Manipulation (Bathed in
        a pool that should burn men alive.), Radiation Manipulation (As a Saiyan he
        should be able to resist 17 million Blutz Waves that transform Saiyans into
        Great Apes. Should scale to his father who can fight in the upper atmosphere.)
        | All previous abilities along with: Greater Statistics Amplification (Can
        use the Kaioken up to 20x now.), T'
