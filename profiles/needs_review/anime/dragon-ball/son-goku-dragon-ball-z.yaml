  attack_potency:
    text: At least Small Planet level ([https://imgur.com/BWqugHR Stronger than 1/20th
      of the strength of his strength after training with King Kai]. Fought Raditz
      alongside Piccolo), Varies (The Kamehameha works by condensing one's Ki into
      a single point, the power of the move proportionally varying depending on how
      much power is condensed), up to far higher with Kamehameha ([https://imgur.com/a/2TmoNdh
      Scared Raditz enough to force him to dodge and put effort into blocking] his
      Kamehameha, [https://imgur.com/a/cizaall despite his older brother showing to
      be overwhelmingly superior] to both Goku and Piccolo at the same time. The Kamehameha
      can get strong enough to completely annihilate beings far superior to the user)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Subsonic travel speed (Required six months to traverse Snake Way), Supersonic+
      flight speed with Flying Nimbus ([https://imgur.com/a/U9xu9xd Can keep up with
      and outright out-speed Red Ribbon Army jets]), Relativistic+ combat speed (Comparable
      to Raditz)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class 1 (While he struggled, he was [https://imgur.com/Q5o04Hw
      still able to move around and jump under 10G])
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Small Planet level), higher, up to Planet level with Kaioken (With Kaioken
      he broke Nappa's back with a single attack. Kaioken was stated to [https://imgur.com/a/GKElYBN
      double the base power of the user], which would put Goku on this level. Overpowered
      Vegeta with Kaioken x3, and can even go up to Kaioken x4), Varies, up to far
      higher with Kamehameha ([https://imgur.com/a/SUWgABu Matched Vegeta's Galick
      Gun with a Kaioken x3 Kamehameha], [https://imgur.com/a/Ikb3mYh overwhelming
      him when he went Kaioken x4])
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Solar System level, far higher with Super Saiyan transformations
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Goku can train for days with minimal rest and can fight through
      his long, arduous fights with the likes of Vegeta and Frieza, continuing to
      fight against Vegeta even after overexerting himself with Kaioken x4, and ultimately
      outlasting the latter even after being effortlessly beaten around, pushing himself
      to his limits with Kaioken, and exhausting himself with his Spirit Bomb. When
      he was younger, he managed to pull through and defeat Piccolo even after all
      of his limbs were broken and he was mortally injured. However, his stamina drops
      greatly as a Super Saiyan 3, which he can only maintain for a couple of minutes,
      making it effectively useless against opponents on his level)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Interplanetary with ki blasts and attacks; Universal
      with Instant Transmission; Interdimensional with telepathy.
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Average in general. Genius in combat (Although he lacks knowledge when it
      comes to things that aren't related to fighting, Goku is a master of prodigal
      skill when it comes to martial arts, with years of experience fighting against
      powerful opponents with a plethora of abilities. As a child, he was able to
      beat martial artists on such a level as Grandpa Gohan, [https://imgur.com/a/G623UT8#UJqkysA
      who was stated to be an unparalleled master in all martial arts]. In his battle
      with Master Roshi, he copied his Drunken Fist style to adapt to it and created
      his own style known as the "Crazy Fist" in response. His skill when it comes
      to combat and the usage of Ki allows him to replicate other Ki-based techniques
      after seeing them once, and he was the first to realize how much energy the
      Super Saiyan transformations unnecessarily drained. Despite this drawback, he
      was the first to master the Super Saiyan state, making it highly efficient and
      subsidizing the need to reach a higher grade, which decreases speed as a side
      effect. He is a genius in combat and is capable of devising new applications
      of his techniques on the fly, such as using Kamehameha with his feet. Was able
      to go toe to toe with Cell, a being created by the genius scientist Dr. Gero
      to be the ultimate warrior, spending 20 years taking the DNA and footage of
      every fighter on earth and on Namek, copying their techniques, their mannerisms,
      and their skills to create him, including Goku himself, also having knowledge
      on how he approaches battle as well. His skill when it comes to combat and the
      usage of ki allows him to replicate other ki-based techniques after seeing them
      once, and he was the first to realize how much energy the Super Saiyan transformations
      unnecessarily drained. Despite this drawback, he was the first to master the
      Super Saiyan state, making it highly efficient. He is a genius in combat and
      is capable of devising new applications of his techniques on the fly, such as
      using Kamehameha with his feet)
    source_ids: *id002
    confidence: 0.8
