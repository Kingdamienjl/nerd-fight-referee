  attack_potency:
    text: Bardock and the Future Warrior fly to different eras === * EvidenceDragon
      Ball Xenoverse 2 In Xenoverse 2, the Future Warrior chases Time Breaker Bardock
      by trying to grab hold of him but Bardock manages to prevent that by keeping
      his distance and we see both characters travel into Age 778. This was also done
      via Rapid Movement, which is physical movement so fast that it may be seen as
      teleportation but is in fact physical travel from one place to another, and
      not teleportation as the Future Warrior as far as we know does not possess any
      teleportation abilities like Instant Transmission Or Kai-Kai at this point in
      time which would also require him to physically touch Bardock for both of them
      to have traveled to Age 778. And while Bardock does possess Dark Ki, this method
      of travel in the feat does not align with the typical visuals of dark colors
      related to travel via Dark Ki like black,Dragon Ball Xenoverse 2 purpleDragon
      Ball Xenoverse 2 andDragon Ball Xenoverse 2 red.Dragon Ball Xenoverse 2 Additionally,
      it obviously wouldn't make any sense for Bardock to take the Future Warrior
      with him when he's explicitly trying to flee from him, so this feat having been
      performed through Rapid Movement is the most logical explanation.
    source_ids: &id002
    - mediawiki-4782824
    confidence: 0.65
  speed:
    text: "Dark Dragon Balls=== *Evidence 1SDBH Dark Demon Realm Mission Manga Chapter\
      \ 2SDBH Dark Demon Realm Mission Manga Chapter 6SDBH Dark Demon Realm Mission\
      \ Manga Chapter 7SDBH 9th Anniversary GuidebookSuper Dragon Ball Heroes InterviewSDBH\
      \ Special Episode (Dark Demon Realm Arc Backstory) *Evidence 2SDBH Arcade Big\
      \ Bang Mission *Evidence 3SDBH 8th Anniversary Super Guide *Evidence 4SDBH Arcade\
      \ Dark Empire Saga Carddass *Evidence 5SDBH 8th Anniversary Super Guide 1. The\
      \ first explanation is in the scan itself, Mechikabura himself stated that the\
      \ Dark Dragon Balls have flown beyond space-time, the word \"flown\" meaning\
      \ they used physical flight, as they flew beyond space-time itself physically\
      \ to different eras of time. Even Mira has stated that they flew away, solidifying\
      \ Mechikabura's statement. Guidebooks also support these statements. 2. Towa\
      \ (Dragon Ball Heroes) herself was frustrated about the Dark Dragon Balls flying\
      \ away, but Mechikabura reassured her and said that he will grant her Demon\
      \ God Power. Demon God Power is just Dark Ki belonging to a Demon who has reached\
      \ a Godly state, which increases their Ki/Power. What this means is that Towa\
      \ required a power-up to go after Dark Dragon Balls, and we all know that power-ups\
      \ in Dragon Ball increase bothTranslations Archive: Dragon Ball Ch\u014Dzensh\u016B\
      \ 1: Story & World Guide - We Ask Akira Toriyama! (2013) powerDragon Ball Z\
      \ Manga Chapter 32 - \"The Mystery of the Kaio-ken\" andDragon Ball Official\
      \ Website ~Learn Cool Kanji with Dragon Ball!~ Lesson #4 speed,Daizenshuu 7:\
      \ Dragon Ball Large Encyclopedia - Special Attack Dictionary which means she\
      \ needed to boost her speed to the point where she could fly beyond space-time\
      \ to go after the Dark Dragon Balls. 3. Dragon Balls themselves always use physical\
      \ flight as showcased with pretty much every set of Dragon BallsDragon Ball\
      \ Z Episode 101Dragon Ball GT Episode 48Dragon Ball Super Episode 9Dragon Ball\
      \ Super Episode 41 in the verse. The Dark Dragon Balls are just Dragon Balls\
      \ that got pumpedSDBH Dark Demon Realm Mission Manga Chapter 11 with Dark Ki,\
      \ turning them into the Dark Dragon Balls. After getting Dark Ki which boosted\
      \ their power and speed, they were now capable of flying beyond space-time.\
      \ This was also shown in the short animated PVSDBH Short Animated PV 1 for the\
      \ game, which also showed a Dark Dragon Ball landing in the Namek saga's era\
      \ like in the manga scan album above. The Dark Dragon Balls are clearly visibly\
      \ shown to have physically flown away to different eras. 4. Dark Shenron, who\
      \ is the amalgamation of the Dark Dragon Balls, his Dark Ki spread across the\
      \ multiverse and all past, present and future, affecting them all simultaneously\
      \ with the same Dark Ki that boosted the Dark Dragon Balls and their hosts'\
      \ power and speed, allowing them to fly beyond space-time."
    source_ids: *id002
