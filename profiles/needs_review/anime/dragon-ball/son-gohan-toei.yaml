  axis: hax
  text: "Border|||Content= *Superhuman Physical Characteristics **Bodily Weaponry\
    \ (Conventional; Via Saiyan TailDragon Ball: Episode 34 \u2014 Cruel General Red)\
    \ **Limited Space Survival (Saiyans are capable of surviving and fighting in the\
    \ depths of space,Dragon Ball Z: Episode 11 \u2014 Terror on ArliaDragon Ball\
    \ Z: Bardock \u2014 The Father of GokuDragon Ball Z: Episode 111 \u2014 Fight\
    \ With PiccoloDragon Ball Z: Broly \u2014 The Legendary Super Saiyan though not\
    \ indefinitelyDragon Ball Z: Episode 105 \u2014 Mighty Blast of Rage) **Limited\
    \ Longevity (Known intergalactically as the \"warrior race of the universe\",\
    \ Saiyans have evolved to remain young and battle-ready for decadesDaizenshuu\
    \ 4 \u2014 World Guide: Racial Groups) ** Enhanced Senses (Awareness, Telescopic\
    \ Vision & Smell; Saiyans have exceptional senses, allowing them to locate small,\
    \ distant objects by tracking their smell and see clearly over long distances.Dragon\
    \ Ball: Episode 16 \u2014 Find That Stone!Dragon Ball: Episode 3 \u2014 The Nimbus\
    \ Cloud of Roshi Saiyans can sense people throughout a village, even when they\
    \ are hidingDragon Ball: Episode 4 \u2014 Oolong the Terrible) ** Radiation Absorption\
    \ & Empowerment (Saiyans can absorb Blutz Waves into their bodies, which not only\
    \ allows them to transform into the Great Ape and Golden Great Ape for power boosts,\
    \ spontaneously transforming without their Tails, but also acts as literal energy\
    \ for them to siphon and be empowered byDragon Ball GT: Episode 35 \u2014 Goku's\
    \ Ascension) **Transformation (Can transform into a Great Ape under the full Moon,\
    \ giving him more abilities) ***Breath Attack ***Large Size (Type 1) *Martial\
    \ Arts **Acrobatics **Afterimage Creation *Ki Manipulation (Advanced to Master\
    \ Level; Advanced Level during Dead Zone, and Master Level by the Frieza Saga)\
    \ **Enhanced Ki Sensing & Instinctive Action (Gohan knows how to clear his mind\
    \ and be relaxed when utilizing Ki energy.Dragon Ball: Episode 207 \u2014 Take\
    \ Flight, Videl By clearing ones mind, Gohan can react without the need for conscious\
    \ thought, and can sense disturbances even when they aren't exhibiting energyDragon\
    \ Ball: Episode 127 \u2014 Quicker Than LightningDragon Ball: Episode 130 \u2014\
    \ Goku's DollDragon Ball: Episode 131 \u2014 Walking Their Own WaysDragon Ball:\
    \ Episode 132 \u2014 Hotter Than Lava) **Flight **Shockwaves Generation **Explosion\
    \ Manipulation (Capable of detonating Ki attacks) *Accelerated Development (Battle;\
    \ Physical Stats, Abilities & Other - Saiyans grow more powerful every time they\
    \ fight and can become stronger in the midst of combat, vastly increasing in strength\
    \ whenever they are mortally injured,Dragon Ball Z: Episode 49 - The Prince Fights\
    \ Back and even upon being revived from the deadDragon Ball Z: Episode 102 \u2014\
    \ Duel on a Vanishing Planet) *Rage Power (Gohan's true potential shows through\
    \ whenever he grows enraged, granting him brief bursts of immense strength)"
