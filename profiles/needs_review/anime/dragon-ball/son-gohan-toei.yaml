  attack_potency:
    text: Below Average Human level (Is a 4 year old) to Small Star level (When enraged
      he overpowered Super Garlic Jr. and damaged Raditz, [https://imgur.com/a/3yfMHJY
      is three times as strong as Goku]), Small Star level+ as a Great Ape (Grows
      ten times stronger) | Small Star level+ (He became the second strongest of the
      Z-Fighters present, behind only Piccolo himself. When angry, he was capable
      of somewhat hurting a casual Nappa), Star level+ as a Great Ape (Grows ten times
      stronger) | Star level (Initially stronger than before. After getting his potential
      unlocked, he grew steadily stronger, approaching Vegeta's power during the Saiyan
      Saga and surpassing him after getting a Zenkai, becoming increasingly powerful.
      Saiyan Saga Vegeta was capable of destroying Arlia and it's moon. [https://imgur.com/a/Afln41G
      Later on he fought on par with Ginyu in Goku's body who had a power level of
      23,000]) to Large Star level (During his rages, he was able to injure Frieza
      in his Second Form. After another Zenkai, he was able to briefly overwhelm his
      Third Form) | Large Star level to Multi-Solar System level (Increased in power
      enough to overpower Super Garlic Jr. once again, with Super Garlic Jr. being
      capable of destroying the Lookout with the Dead Zone, which contains two realms
      containing starry skies) | High Universe level (Superior to Base Goku, who was
      [https://youtu.be/byPmJw3t6ww?si=Q15Svr13JIAnUH61&t=23m55s capable of fighting
      and injuring] Restricted Super Saiyan Broly), far higher as a Full Power Super
      Saiyan (Superior to FPSSJ Goku. Became stronger after his battle with Cell.
      [https://youtu.be/gy_o5t9iCuU?si=Hk3KlD0tlaQKruPA&t=13m52s He was able to momentarily
      fight against Bojack and his gang]), even higher as a Super Saiyan 2 (At least
      twice as strong as his Super Saiyan self. Casually stomped Perfect Cell, easily
      overpowering his most powerful Kamehameha from a standing position and at the
      last second. Matched and defeated Super Perfect Cell. He was later able to defeat
      Full Power Bojack without difficulty), Varies (The Kamehameha works by condensing
      one's Ki into a single point, the power of the move proportionally varying depending
      on how much power is condensed), up to far higher with Kamehameha (His Kamehameha
      matched Super Perfect Cell's, and then overpowered and completely annihilate
      his body on a cellular level, despite Cell being utterly superior to Gohan prior,
      being able to break his arm effortlessly with a simple Ki blast while "fooling
      around". The Kamehameha can get strong enough to completely annihilate beings
      far superior to the user) | High Universe level ([https://imgur.com/a/z3HVJMc
      Stronger than before]. [https://youtu.be/hyivmODpxdQ?si=ES5usy8zajZwYih1&t=162
      Deflected] a Super Saiyan Broly's Ki Blast and formed a barrier to protect himself
      from the explosion), far higher with Super Saiyan transformations (As a Super
      Saiyan 2, he [https://www.youtube.com/watch?v=2gMSAy2thMw was able to contend
      with Legendary Super Saiyan Full Power Broly and even visibly injured him]),
      Varies, up to far higher with Kamehameha ([https://www.youtube.com/watch?v=-jes_p0L90A&t=196s
      Using the Family Kamehameha alongside Super Saiyan Goten and Full Power Super
      Saiyan Goku, they were able to overpower and kill Broly in an energy clash])
      | High Universe level, far higher with Super Saiyan transformations (Comparable
      to Pre-Vegito Division Goku after training with the Z sword), Low Multiverse
      level with his Ultimate form (Was easily overpowering Super Buu, and a clone
      of him with the [https://imgur.com/a/ccsWGd6#uo71ycQ exact same] [https://imgur.com/a/JAFaI9L#PjryOCJ
      strength] had the edge against Post-Vegito Division Base Goku, forcing him to
      transform into Super Saiyan in order to defeat the clone), Varies, up to far
      higher with Kamehameha
    source_ids: *id002
