  intelligence:
    text: Gifted (Despite being a mere low-class warrior, Bardock is an incredibly
      skilled warrior. He stood as one of the Saiyans best in his time, easily taking
      over planets alongside his crew, an activity that he took great pride and enjoyment
      from. Bardock and his team were capable of taking over Kanassa in a few days,
      a planet that had taken months without success to be taken over, with Dodoria
      noting to Frieza that the latter's elite warriors to could not have accomplished
      a feat of this magnitude so effortlessly. Singlehandedly stomped and outskilled
      Dordoria's elites, who had just killed Bardock's team and only ever dealt attacks
      to leader as a result of the Saiyan's future visions interrupting him. Against
      the elites, he displayed clever tactics, such as tricking one of the henchmen
      into killing another one, or flipping over an enemy restraining him so an oncoming
      attack would hit them instead. Easily took on several of Frieza's soldiers at
      once, dodging their attacks and dispatching of them while continuing to fly
      towards a spaceship)
    source_ids:
    - vsbattles-bardock-toei-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
