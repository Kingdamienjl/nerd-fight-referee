    them into fusion into Gotenks, and then proceeded to absorb them along with Piccolo,
    the latter of which is one of the most intelligent characters in the series. He
    becomes much more skilled after he absorbs Gotenks and especially Piccolo, gaining
    their knowledge and skills. Recognized Gohan''s attempt to stall out the fusion
    immediately and attempted to kill Dende after he healed him. Made sure Goku and
    Gohan couldn''t fuse while he was fighting the former. Took advantage of Gohan''s
    lack of situational awareness by laying a clever trap with his head tentacle,
    leading to Gohan being absorbed. *Standard Tactics: Super Buu is very pragmatic
    in battle and will not hesitate to kill, eat, or absorb anyone who stands in his
    way. He will only drag out a battle in order to identify his opponents'' weaknesses,
    and once he does, he will use them to devastating effect. This is demonstrated
    in his fight with Gohan, where he used his inability to defend Piccolo and Gotenks
    to mentally torture him. If backed into a corner, Super Buu would likely attempt
    to destroy the planet. Super Buu has other unique hax, such as transmutation,
    but might only use these abilities as a last resort in battle. Kid Buu is essentially
    a mindless machine of destruction, but he can sense energy and use his peculiar
    body better than any other Buu form. At the same time, his assaults are erratic
    and unpredictable, which actually makes him the most troublesome form of Buu to
    fight. There''s also the matter that he can still instantly copy the techniques
    he sees and execute them off without a hitch. Plus, unlike his canon counterpart,
    this Kid Buu is smart enough to use an immobilized Vegeta as leverage to prevent
    Goku from launching the Spirit Bomb.Dragon Ball Z - Episode 286 *Standard Tactics:
    Kid Buu fights like a monstrous, wild animal that has no formal training, only
    pure strength. His unpredictable and adaptable combat style heavily utilizes his
    amorphous nature, including extending his blows, spreading out like a parachute
    to slow down his momentum from being knocked back, and morphing to allow energy
    blasts to flow through him when possible. Since he abuses his physiology the most
    out of all the forms, Kid Buu never makes any real attempt to defend himself.'
