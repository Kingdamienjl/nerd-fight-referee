    - field: weaknesses
      value: 'Frieza is extremely overconfident and sadistic, preferring to drag out
        an opponent''s suffering over time and humiliate them rather than kill them
        instantly, even when such a thing is fully possible for him. Due to his inexperience
        with the form, at 100% power, Frieza rapidly drains his ki and cannot fight
        in this form for long, and his Golden form has the same weakness. If the Destron
        Gas Machine is destroyed, he will be permanently defeated. Notable Attacks/Techniques:
        * Ki: The fighting power and life force of a martial artist, a tangible energy
        derived from the user''s vigor, courage, and mind. It can be used in a number
        of ways, such as to surpass the limits of one''s body to greatly increase
        in strength, and it can be fired as blasts of energy or used to create defensive
        barriers. Possessing such ridiculous strength at birth that there were few
        who could match him, Frieza is a horrifically powerful mutant hybrid of his
        race whose power is so great that to properly control it, he had to create
        lesser, weaker forms to restrain himself and his power. He is incredibly skilled
        in the use of ki, though his ignorance to its spiritual side meant that he
        didn''t know how to sense ki at first. ** Death Ball: After gathering ki in
        the shape of a sphere with a single fingertip, Frieza creates a large and
        extremely powerful energy sphere that can easily destroy planets. His expertise
        in the technique allows him to restrain it to instead put a planet on a timer
        towards destruction if he so pleases. Its most powerful variant is the Supernova,
        a massive, sun-like sphere of energy that takes some time to charge but that
        has immense power. As Golden Frieza, he upgrades this technique into the even
        more powerful Golden Death Ball. ** Death Beam: Frieza''s favored finishing
        technique, a small, highly concentrated beam of ki fired from the fingertip
        with enough force to easily punch through an opponent''s body. Frieza often
        uses this technique to torture his opponents before finishing them off, and
        can use it with great precision. He can fire many of them in quick succession,
        overwhelming his opponents with a barrage of high power attacks. After his
        mental training in Hell, Frieza gained such control over his ki that his Death
        Beams can home in on opponents. ** Death Psycho Bomb: By launching a small,
        invisible sphere of ki into his opponent, Frieza can force them to rise into
        the air as the sphere expands within them, ultimately exploding and destroying
        them from the inside. ** Death Saucer: A technique similar to Krillin''s Kienzan,
        though Frieza can make two of these discs at once and throw them at opponents.
        They home in on targets, making them difficult to escape, but Frieza''s overconfidence
        makes it very possible that he will lose track of them and end up cutting
        himself in half by accident. It should be noted that it can cut through opponents
        that are several times stronger and more durable. ** Death Wave: Frieza is
        able to gather ki in his fingertips before releasing it with a sweep of his
        arm, slicing through his surroundings with a thin, razor-sharp blade of energy.
        ** Imprisonment Ball: Frieza can trap his opponent within a sphere of ki,
        preventing them from escaping, and while they''re trapped within, he can toy
        with them, kicking them around like a ball before ultimately kicking them
        into the ground, causing a massive explosion. This explosion is so powerful
        that it creates a vacuum, sucking everything nearby to its center. ** Nova
        Strike: After surrounding himself in a sphere of ki, Frieza launches himself
        at his opponent and slams into them with devastating force. ** Cage of Light:
        Golden Frieza fires many Death Beams from his fingers in several directions
        in order to form a cage. The beams act as bars, limiting his opponent''s movements,
        but Frieza cannot maintain this for long. * Mutant Hybrid Physiology: Among
        his race - known only as Frieza Race - Frieza possesses a phenomenally high
        level of power and cruelty unseen even in his father, King Cold, due to his
        extreme mutations. His power is such that even without any training, he is
        on the same level of power as his father and could easily overpower any who
        dared oppose him. However, in his true, final form, Frieza lacks much control
        over his power, and thus to restrain himself and keep his power under control,
        he created a set of three lower transformations, each weaker than the last.
        As he transforms, more and more of his power shows through, until he reaches
        his final form, regenerating minor wounds in the process, and unleashing the
        full, terrifying force of his power. Due to his general lack of experience,
        however, he cannot properly control himself at 100% of his power, lacking
        stamina and control, and thus cannot maintain the form for long. Frieza''s
        most striking trait, however, is his ridiculous survivability, which even
        the other members of his family lack. He is able to survive being bisected
        by his own attack and being blasted into Namek, which explode'
