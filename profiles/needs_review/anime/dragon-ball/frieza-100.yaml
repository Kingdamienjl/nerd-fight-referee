    - field: weaknesses
      value: 'Frieza is arrogant and sadistic, preferring to prolong an opponent''s
        suffering rather than killing them right away, even when it is entirely feasible
        for him to do so. Frieza''s ki rapidly drains in his 100% power state due
        to his lack of experience with it, and he cannot fight for long in this condition.
        Notable Attacks and Techniques: Ki: The martial artist''s fighting power and
        life force, a tangible energy derived from the user''s vigor, courage, and
        mind. It can be used in several ways, such as to surpass the limits of one''s
        body to dramatically increase strength. It can also be fired as blasts of
        energy or create defensive barriers. Frieza is a mighty mutant hybrid of his
        race with such ridiculous strength at birth that few could match him. He had
        to develop lesser, weaker forms to restrain his strength to better control
        his power. He is incredibly skilled in using ki, though his ignorance of its
        spiritual side meant he didn''t know how to sense ki at first. *Death Ball:
        After gathering ki in the shape of a sphere with a single fingertip, Frieza
        creates a giant energy sphere that can easily destroy planets. His expertise
        in the technique allows him to restrain it to instead put a planet on a timer
        towards destruction if he so pleases. Its most powerful variant is the Supernova,
        a massive, sun-like sphere of energy that takes some time to charge but has
        immense power. Golden Frieza upgrades this technique into the even more powerful
        Golden Death Ball. *Death Beam: Frieza''s favored finishing technique, a small,
        highly concentrated beam of ki fired from the fingertip with enough force
        to easily punch through an opponent''s body. Frieza often uses this technique
        to torture his opponents before finishing them off and uses it with great
        precision. He can fire many of them rapidly, overwhelming his opponents with
        a barrage of high-power attacks. After his mental training in Hell, Frieza
        gained such control over his ki that his Death Beams could home in on opponents.
        *Death Psycho Bomb: By launching a small, invisible sphere of ki into his
        opponent, Frieza can force them to rise into the air as the sphere expands
        within them, ultimately exploding and destroying them from the inside. *Death
        Saucer: A technique similar to Krillin''s Kienzan, though Frieza can make
        two of these discs at once and throw them at opponents. They home in on targets,
        making them difficult to escape. Still, Frieza''s overconfidence makes it
        possible to lose track of them and cut himself in half by accident. It should
        be noted that it can cut through opponents several times stronger and more
        durable. *Death Wave: Frieza can gather ki in his fingertips before releasing
        it with a sweep of his arm, slicing through his surroundings with a thin,
        razor-sharp blade of energy. *Imprisonment Ball: Frieza can trap his opponent
        within a sphere of ki, preventing them from escaping, and while they''re trapped
        within, he can toy with them, kicking them around like a ball before ultimately
        kicking them into the ground, causing a massive explosion. This explosion
        is so powerful that it creates a vacuum, sucking everything nearby to its
        center. *Nova Strike: After surrounding himself in a sphere of ki, Frieza
        launches himself at his opponent and slams into them with devastating force.
        ==Notes== Both the Manga and Anime of Dragon Ball are canon, however, Toei
        Animation has its own continuity of Dragon Ball and, therefore, what is in
        the Anime does not apply to the main canon which is the Manga, with the Anime
        having different scales and tiers than the Manga. An example of this is that
        in the Manga the strongest Majin Buu is indisputably Super Buu with Gohan
        absorbed, while in the Anime it is repeatedly said to be Kid Buu. This profile
        is made based exclusively on information from the original Manga only. To
        see the anime version click here. Frieza''s Power level: Fake Power levels
        have made it a rule that Frieza''s forms double his power. Although in the
        manga he says that he gets stronger with each transformation, only in his
        second form does he mention that surpass 1 million, which implies that he
        doubled his first form which has 530,000 Power level, which is collaborated
        by El Manga Legendary. However, when transforming into his third and fourth
        form, Frieza does not say any specific multiplier. But, considering that his
        transformations serve to contain his 100% which is 120,000,000 Power level,
        this means that in his fourth form and with 1% he would only have 1,200,000
        Power level. *Correct power levels: With that out of the way, his mathematically
        correct power levels are: 530,000 (First Form); 1,060,000 (Second Form); 1,130,000
        (Third Form) and 1,200,000 (Fourth form 1%). With this clarified we can powerscale:
        Frieza First form (14.8 Quettatons, Small Star level); Frieza Second form
        (29.6 Quettatons, Small Star level); Frieza Third form (31.5 Quettatons, Small
        Star level); Frieza Fourth form 1% (33.4 Quettatons, Small Star level), Frieza
        Fourth form 50% (167'
