  axis: hax
  text: 'Should have all of Yamcha''s original abilities, like Superhuman Physical
    Characteristics, Accelerated Development (Training; Physical Stats, Abilities),
    Acrobatics, Martial Arts Mastery, Weapon Mastery, Afterimage Creation, Flight,
    Ki Manipulation (Advanced Level - Can be used defensively and offensively, to
    strengthen his skin or to fire ki blasts, which can home in on targets, and form
    defensive barriers), Shockwaves Generation and Ki Sensing (Can locate others by
    reading their ki). Additionally, he has access to Healing via Senzu Beans, Fusionism
    via the Metamo-Ring, Sealing via the Mafuba, and likely Resurrection and Time
    Manipulation (Oushou claims to have gone through his reincarnation several times,
