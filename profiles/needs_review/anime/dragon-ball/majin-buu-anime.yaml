    - field: intelligence
      value: 'Varies (Innocent Buu is childishly oblivious and lacks practical knowledge
        and thus fails the qualification exam for the tournament between Universes
        6 and 7. Despite this, he is incredibly skilled in combat. He has a knack
        for mimicking ki techniques, even after only seeing them once. Kid Buu is
        monstrous and almost animalistic in intelligence but retains his skill in
        combat and techniques mimicry. Super Buu is the most intelligent of Buu''s
        many forms despite his apparent brutishness. From Kami''s Lookout, he could
        count the remaining humans and estimate an hour''s length by counting the
        sand particles in an hourglass. After being easily defeated, he even came
        up with an intricate plan to defeat Gohan, even accounting for Gotenks'' time
        limit after absorbing him. After absorbing Gohan and Piccolo, he became even
        more intelligent, gaining their knowledge and skills) Standard Tactics: Kid
        Buu is naturally bloodlusted'
      source_id: vsbattles-majin-buu-anime-dragon-ball
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Majin Buu''s energy can be worn out if he fights another Buu or a copy
        of himself. In addition, if he is battling against stronger opponents, he
        may also get psychologically weakened over time. Innocent and Kid Buu are
        both fairly unintelligent and prone to fooling around in fights, taunting
        and mocking opponents rather than going all out and destroying them immediately.
        Buu has a short temper and is easily angered. Buu is influenced by the personalities
        of those he absorbs; as he absorbs more heroic individuals, he will become
        less villainous and more good-natured. Buu is not immune to his own magic,
        as when Evil Buu reflected his transfiguration beam back at him, it turned
        him into chocolate as well. Notable Attacks/Techniques: |-|Ki Attacks= The
        fighting power and life force of a martial artist, a tangible energy derived
        from the user''s vigour, courage, and mind. It can be used in several ways,
        such as to surpass the limits of one''s body to greatly increase strength.
        It can be fired as blasts of energy or used to create defensive barriers.
        His skill in using ki allows him to easily replicate other techniques after
        seeing them once, copying Goku''s Kamehameha and Kibito Kai''s Kai Kai in
        this manner. *Human Extinction'
      source_id: vsbattles-majin-buu-anime-dragon-ball
      provider_id: vsbattles
      authority: high
