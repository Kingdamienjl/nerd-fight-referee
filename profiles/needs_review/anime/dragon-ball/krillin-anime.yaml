    - field: weaknesses
      value: "None notable Notable Attacks and Techniques: Ki: The fighting power\
        \ and life force of a martial artist, a tangible energy derived from the user's\
        \ vigor, courage, and mind. It can be used in a number of ways, such as to\
        \ surpass the limits of one's body to greatly increase in strength, and it\
        \ can be fired as blasts of energy or used to create defensive barriers. Learning\
        \ how to use ki at an early age, Krillin is now very skilled in its use, and\
        \ has been called the strongest human on Earth, something that doubtlessly\
        \ stems from his training under many martial artists and the potential he\
        \ had unlocked by Grand Elder Guru. *{{Nihongo|Double Tsuibikidan|\u30C0\u30D6\
        \u30EB{{Ruby|\u8FFD|\u3064\u3044}}{{Ruby|\u5C3E|\u3073}}{{Ruby|\u6C17|\u304D\
        }}{{Ruby|\u5F3E|\u3060\u3093}}|Daburu Tsuibikidan}}: Krillin fires two reddish-orange\
        \ waves of ki from his hands, which can follow his opponent like homing missiles,\
        \ making them difficult to evade, especially when Krillin attacks alongside\
        \ them. *{{Nihongo|Kamehameha|\u304B\u3081\u306F\u3081{{Ruby|\u6CE2|\u306F\
        }}|Kamehameha}}: The signature technique of the Turtle School, which Krillin\
        \ learned from Master Roshi. Charged and fired with both hands, it is a simple\
        \ but powerful technique. *{{Nihongo|Destructo Disc|{{Ruby|\u6C17|\u304D}}{{Ruby|\u5186\
        |\u3048\u3093}}{{Ruby|\u65AC|\u3056\u3093}}|Kienzan}}: Krillin's signature\
        \ technique, a razor sharp blade of ki that he creates by holding his hand\
        \ above his head. Possessing incredible cutting power, it's even powerful\
        \ enough to cut cleanly through Frieza's tail in his second form. *{{Nihongo|Scattering\
        \ Bullet|{{Ruby|\u62E1|\u304B\u304F}}{{Ruby|\u6563|\u3055\u3093}}{{Ruby|\u5F3E\
        |\u3060\u3093}}|Kakusandan}}: Krillin charges up and fires a small large energy\
        \ sphere that slowly flies into the air, where it explodes, splitting into\
        \ many smaller, faster ki blasts that rain down upon his foe. *{{Nihongo|Solar\
        \ Flare|{{Ruby|\u592A|\u305F\u3044}}{{Ruby|\u967D|\u3088\u3046}}{{Ruby|\u62F3\
        |\u3051\u3093}}|Taiyoken}}: One of Tien Shinhan's signature techniques, which\
        \ Krillin copied from him at some point. Bringing his hands up to his face,\
        \ Krillin can create a bright flash of light that can blind opponents. Note:\
        \ ==Notable Matchups== Victories: Losses: Caesar Anthonio Zeppeli (JoJo's\
        \ Bizarre Adventure) Caesar's Profile (22nd Budokai Krillin and Post-Training\
