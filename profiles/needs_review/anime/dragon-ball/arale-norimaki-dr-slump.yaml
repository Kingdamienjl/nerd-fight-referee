- id: claim-powers-and-abilities-c51eeb37
  section: abilities
  axis: hax
  text: Early Dr. Slump= *Superhuman Physical Characteristics *Inorganic Physiology
    (Type 2) (Arale's nature is that of a robotDr. Slump manga chapter 1) *Regeneration
    (Up to High-Mid) & Immortality (Type 1, 2, 3, & 8) (Cannot age nor die of old
    age due to being a robot.Dr. Slump manga chapter 9 Arale can survive as a head.Dr.
    Slump manga chapter 15 In the story it was stated multiple times that characters
    cant die, due to being gag characters and because the characters are not bound
    by a storyline, any and all events that would lead to death do not occur.Dr. Slump
    manga chapter 69 This has also caused multiple characters to regenerate from attacks,
    as well as survive and instantly recover from lethal injuries.Dr. Slump manga
    chapter 194 One of the effects of gag immortality had a character regenerate from
    being blown to bitsDr. Slump manga chapter 204) *Self-Sustenance (Type 1 & Limited
    Type 3) (Due to her being a robot, Arale does not require air to breathe and can
    survive in space indefinitely.Dr. Slump manga chapter 51 Arale does not require
    rest or sleep, however, she can stop functioning when she runs out of battery.
    On top of that, she sleeps regularly because she often likes mimicking human behaviorDr.
    Slump manga chapter 10) *Body Control & Elasticity (Due to the Dr. Slump cast's
    nature as gag characters, they have showcased numerous feats of elasticity. Such
    as Arale's body bending when hit.Dr. Slump 1997 episode 12 She can be flatten
    and survive, as well.Dr. Slump Arale-chan episode 234 Arale can detach her arms
    and shoot it akin to a rocket.Dr. Slump manga chapter 48 etc.) **Additional Limbs
    & Flight (Via Body Control; She can grow wingsDr. Slump manga chapter 57) **Limited
    Multilocation (Type 1) (Via Body Control; Arale's body and head can be controlled
    on their own, without the other being attached. Arale's A.I. is capable of inhabiting
    multiple vessels at onceDr. Slump manga chapter 39) **Limited Shapeshifting (Via
    Body Control; Arale has changed her figure to look more akin to a adultDr. Slump
    Arale-chan episode 56) **Limited Possession (Via Body Control; Arale's head can
    possess and control other vehicular objects as substitute bodies. She has access
    to other substitute bodies she can freely useDr. Slump manga chapter 39) **Limited
    Organic Manipulation (Via Body Control; Arale has the ability to produce organic
    matter, such as boogersDr. Slump manga chapter 66 and snot bubbles, despite being
    an inorganic robotDr. Slump Arale-chan episode 3) *Limited Acausality (Type 1)
    (Arale is able to recall the original events that occurred in history, even after
    those events have been altered by time travelDr. Slump manga chapter 75Dr. Slump
    manga chapter 76) *Abstract Existence (Type 2) (Dr. Slump characters are manifestations
    of the concepts and ideas from the author. These ideas have been described as
    what gives birth to characters, being responsible for shaping, forming, and manipulating
    the fundamentality for the designs and aspects of charactersAkira Toriyama's Lame
    Manga Laboratories) *Genius Intelligence *Street Brawler (Arale has shown rudimentary
    fighting prowessDr. Slump manga chapter 34) *Acrobatics/Self-Momentum (Arale has
    displayed great agility, dexterity, and coordination.Dr. Slump Arale-chan episode
    74 She can perform hypermobile movements with her body, such as when she uses
