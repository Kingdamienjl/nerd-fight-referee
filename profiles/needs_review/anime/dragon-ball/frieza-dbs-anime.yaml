    - field: weaknesses
      value: 'Frieza is arrogant and sadistic, even when it is entirely feasible for
        him to do so. Frieza''s ki rapidly drains in his 100% power state due to his
        lack of experience with it, and he cannot fight for long in this condition.
        Notable Attacks and Techniques: Ki: The martial artist''s fighting power and
        life force, a tangible energy derived from the user''s vigor, such as to surpass
        the limits of one''s body to dramatically increase strength. It can also be
        fired as blasts of energy or create defensive barriers. Frieza is a mighty
        mutant hybrid of his race with such ridiculous strength at birth that few
        could match him. He had to develop lesser, weaker forms to restrain his strength
        to better control his power. He is incredibly skilled in using ki, sun-like
        sphere of energy that takes some time to charge but has immense power. Golden
        Frieza upgrades this technique into the even more powerful Golden Death Ball.,
        Death Beam: Frieza''s favored finishing technique, overwhelming his opponents
        with a barrage of high-power attacks. After his mental training in Hell, Frieza
        gained such control over his ki that his Death Beams could home in on opponents.,
        invisible sphere of ki into his opponent, Frieza can force them to rise into
        the air as the sphere expands within them, Death Saucer: A technique similar
        to Krillin''s Kienzan, though Frieza can make two of these discs at once and
        throw them at opponents. They home in on targets, Frieza''s overconfidence
        makes it possible to lose track of them and cut himself in half by accident.
        It should be noted that it can cut through opponents several times stronger
        and more durable., Death Wave: Frieza can gather ki in his fingertips before
        releasing it with a sweep of his arm, razor-sharp blade of energy., Imprisonment
        Ball: Frieza can trap his opponent within a sphere of ki, he can toy with
        them, Frieza launches himself at his opponent and slams into them with devastating
        force.'
      source_id: character-stats-profiles-frieza-dbs-anime
      provider_id: character_stats_profiles
      authority: high
