power_scale:
  tier:
    text: At least 4-A, 2-C in Final Form, higher as Golden Frieza | 2-C, higher as
      Golden Frieza | 2-C, higher as Golden Frieza
    source_ids: &id002
    - mediawiki-4841409
    confidence: 0.8
  attack_potency:
    text: At least Multi-Solar System level (Far stronger than Tagoma, and easily
      defeated Super Saiyan Gohan with a barrage of Death Beams340 ExaFoe), Low Multiverse
      level in Final Form (Clashed with Base Goku3 Universes), higher as Golden Frieza
      (Slightly stronger than Super Saiyan Blue Goku, and managed to gradually overpower
      him before his stamina dropped) | Low Multiverse level (Eliminated Final Form
      Frost and easily overpowered the likes of Jimizu. Fought and matched Base Dyspo),
      higher as Golden Frieza (Equal to Super Saiyan Blue Goku at the start of the
      Tournament of Power. Fought Base Toppo alongside Android 17. Managed to eliminate
      Super Maximum Light Speed Dyspo with the help of Gohan and harmed them with
      his laser cage) | Low Multiverse level (Confirmed to have gotten much stronger
      since the Tournament of Power), higher as Golden Frieza (Somewhat fought and
      held his own against Super Saiyan Broly for an hour, and his attacks were sometimes
      staggering Broly and occasionally forcing him to dodge, which makes him far
      stronger than Super Saiyan Blue Goku and Super Saiyan Blue Vegeta, who with
      a combined surprise attack couldn't do any damage to Broly6 Universes)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Faster than Super Saiyan Gohan10,868,317.708 c), far higher
      in Final Form (Can keep up with Base GokuUpscales from 1.4726 Quintillion c),
      even higher as Golden Frieza (Kept up with Super Saiyan Blue GokuUpscales from
      73.63 Quintillion c) | Massively FTL+ (Became even faster after his training
      in Hell and is equal to Super Saiyan Blue Goku at the start of the Tournament
      of Power as Golden Frieza. Kept up with Base Dyspo in his own base, although
      this is due to the linear nature of the Dyspo's movements, which made them easy
      to read. Overwhelmed Base Dyspo with Golden Frieza, but was badly outsped by
      Dyspo's Super Maximum Light Speed Mode) | Massively FTL+ (Became even faster
      after the Tournament of Power and could somewhat keep up with Super Saiyan Broly
      as Golden Frieza)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class G, likely far higher (Comparable to Gohan. Far stronger than
      Frieza Arc Goku>3,002,361.41 Tons), far higher with Transformations | Class
      T (Comparable to Tournament of Power Goku, who endured Pretty Black Hole's gravitational
      pull1.55339 Billion Metric Tons) | At least Class T (Stronger than before)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Multi-Solar System level, Low Multiverse level in Final Form (Traded
      blows with Base Goku), higher as Golden Frieza (Overpowered Super Saiyan Blue
      Goku) | Low Multiverse level, higher as Golden Frieza (Eliminated Final Form
      Frost with a single hit in his own Final Form. Clashed with Super Saiyan Blue
      Goku and harmed Base Toppo. Harmed Gohan and Dyspo with his laser cage) | Low
      Multiverse level, higher as Golden Frieza (Although inferior to Super Saiyan
      Broly, Frieza could at least stagger Broly with his blows)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Multi-Solar System level, Low Multiverse level in Final Form (Withstood
      attacks from Base Goku), higher as Golden Frieza (Took hits from Super Saiyan
      Blue Goku) | Low Multiverse level (Tanked multiple attacks from Dyspo with little
      injury. Survived a brutal beatdown from God of Destruction Toppo), higher as
      Golden Frieza (Survived God of Destruction Candidate Toppo's Hakai and casual
      blows from a serious base Jiren, but both badly injured him) | Low Multiverse
      level (More durable than before. Survived part of Super Saiyan Broly's beatdown,
      but was badly damaged), higher with forcefields (Shielded himself from Wrathful
      Broly's planet buster, which was too strong for Broly-Saga Super Saiyan Blue
      Goku to push back), even higher as Golden Frieza (Survived getting beaten around
      by Super Saiyan Broly for an entire hour)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Frieza's endurance is extraordinary, as demonstrated in his
      long, painful battle with Goku. Even after taking a Spirit Bomb head-on, Frieza
      still had enough stamina to keep on going and fight against Goku as a Super
      Saiyan, powering up to 100% and matching him in power. However, due to Frieza's
      inexperience with the form, at 100%, Frieza's Ki is rapidly drained. Even so,
      he can endure being severely injured during his fight with Goku and ultimately
      even being cut in half and blasted into Namek after being completely drained
      of Ki, going on to survive its explosion. After first gaining the form, Golden
      Frieza drains stamina rapidly and thus cannot be maintained for long. Still,
      he eventually grows to master the form and overcome this weakness)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Stellar with Ki-based attacks; Low Multiversal as
      a Golden Frieza | Standard Melee Range; Low Multiversal with Ki-based attacks
      | Standard Melee Range; Low Multiversal with Ki-based attacks; Low Complex Multiversal,
      Interdimensional & Extradimensional as a Golden Frieza (5-D; Can affect two
      respective universes which have a Neutral Space between them)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (Frieza, as the dictatorial ruler of much of Universe 7, is a clever
      and crafty commander who kept his iron grip on his territory by terror and strategic
      military deployment. In combat, he is an extremely skilled hand-to-hand combatant
      capable of fighting on par with the likes of Goku, even when playing around.
      He is well-versed in using Ki, replicating and improving upon Krillin's Kienzan
      with his own homing variant. However, for all of his skill, Frieza is quite
      overconfident and isn't fond of utilizing his full power. Due to his arrogance
      and obsession with vengeance, he rushed to fight Goku as soon as he achieved
      his Golden Form, skipping the training process to optimize its ridiculous energy
      expenditure)
    source_ids: *id002
    confidence: 0.8
