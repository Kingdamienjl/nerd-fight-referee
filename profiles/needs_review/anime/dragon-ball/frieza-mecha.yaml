        \ |- | *: The fighting power and life force of a martial artist, a tangible\
        \ energy derived from the user's vigor, courage, and mind. It can be used\
        \ in several ways, such as to surpass the limits of one's body to dramatically\
        \ increase strength. It can also be fired as blasts of energy or create defensive\
        \ barriers. Possessing such ridiculous strength at birth that few could match\
        \ him, Frieza is a mighty mutant hybrid of his race whose power is so great\
        \ that to properly control it, he had to create lesser, weaker forms to restrain\
        \ his strength. He is incredibly skilled in using ki, though his ignorance\
        \ of its spiritual side meant he didn't know how to sense ki at first. *:\
        \ After gathering ki in the shape of a sphere with a single fingertip, Frieza\
        \ creates a giant energy sphere that can easily destroy planets. His expertise\
        \ in the technique allows him to restrain it to instead put a planet on a\
        \ timer towards destruction if he so pleases. Its most powerful variant is\
        \ the Supernova, a massive, sun-like sphere of energy that takes some time\
        \ to charge but has immense power. Golden Frieza upgrades this technique into\
        \ the even more powerful Golden Death Ball. 8f729a89-1766-4d86-87df-deb1a573e722.jpeg\
        \ 862976a3-97ac-4562-998e-5ef6daa8e68b.jpeg 563479828994388784693784.webp\
        \ *: Frieza's favored finishing technique, a small, highly concentrated beam\
        \ of ki fired from the fingertip with enough force to easily punch through\
        \ an opponent's body. Frieza often uses this technique to torture his opponents\
        \ before finishing them off, and uses it with great precision. He can fire\
        \ many of them rapidly, overwhelming his opponents with a barrage of high-power\
        \ attacks. After his mental training in Hell, Frieza gained such control over\
