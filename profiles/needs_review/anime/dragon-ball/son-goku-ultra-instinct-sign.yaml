    - field: weaknesses
      value: Goku seeks strong opponents and therefore will allow his opponents to
        reach their full power for the sake of a good fight. He often drops his guard
        and leaves openings for his opponents whenever he gets distracted, lowering
        his durability. His Spirit Bomb requires a long charge-up period, during which
        time he is vulnerable. He cannot survive in the vacuum of space and needs
        to locate a ki signature to teleport using Instant Transmission. The Mafuba
        requires a suitable container to seal the target into and drains a large amount
        of ki, the latter of which could kill him if he lacks sufficient ki. In Battle
        of Gods, he can't transform into Super Saiyan God by himself, requires a ritual
        to achives the form, Lacks mastery over Hakai, needs time to charge up and
        excuting the technique, which allowed Zamasu to recover from panicking and
        react. However, this partially goes away in the Moro arc, where he can deconstruct
        a border instantly in Perfect UI. Completed Super Saiyan Blue heavily strains
        his body at first, but later he has trained this away. His Power Stressed
        Form is essentially a weaker counterpart to the Kaio-ken, can't transform
        into Ultra Instinct -Sign- and Ultra Instinct at will. Ultra Instinct originally
        lasted seconds before reverting to his base form., but it still drains his
        stamina rapidly. Later he can transform into Ultra Instinct, although it still
        requires great effort., Can now willingly transform into Ultra Instinct much
        easier
