  attack_potency:
    text: "Solar System level (Comparable to his Dragon Ball Z self, if not much stronger),\
      \ higher with Super Saiyan forms | Universe level (Fought with a suppressed\
      \ Beerus, and their clash both shook and was about to destroy the universe from\
      \ its edge. Absorbed Super Saiyan God's power and became even stronger. Managed\
      \ to overcome Beerus' energy nullification as a Super Saiyan, which easily nullified\
      \ energy capable of destroying the universe. Destroyed a superior amount of\
      \ energy that was going to destroy the universe with a single punch in his base\
      \ form) | Universe level (Absorbed the Super Saiyan God form into his base,\
      \ and became just as strong in the form without the need to transform into it.\
      \ Trained with Whis to become stronger), higher with Super Saiyan Blue (Super\
      \ Saiyan Blue has directly been compared to a Super Saiyan level increase on\
      \ top of SSG. This means SSB is at least fifty times stronger than he is in\
      \ his base currently) | At least Universe level (Far stronger than before. Managed\
      \ to defeat Hit, Universe 6's strongest warrior at that time) | At least Universe\
      \ level (Comparable to Vegeta at this time, who managed to dominate Super Saiyan\
      \ Ros\xE9 Goku Black after training extensively. Stalemated a stronger Hit with\
      \ just Super Saiyan Blue, without using Kaio-ken. Also capable of maintaining\
      \ Super Saiyan Blue Kaio-ken x20) | Likely Low Multiverse level (Traded blows\
      \ with a heavily suppressed Jiren, and shook the whole World of Void with his\
      \ Ki alone. While Jiren was holding back, he was repeatedly described as the\
      \ strongest enemy that Universe 7 had ever faced, and thus superior to Infinite\
      \ Zamasu) | At least Universe level+ (After breaking his limits by achieving\
      \ Ultra Instinct -Sign- a second time, and after defeating Anilaza, he managed\
      \ to fight against Jiren, who was finally showing a hint of his full power)\
      \ | Likely Low Multiverse level (Fought on equal footing with a fully-powered\
      \ Jiren, and was stated by Vegeta to \u201Cstep over the state of the Gods\u201D\
      . In a clash between Beerus and Champa, they threatened to destroy both Universe\
      \ 6 and 7 in their battle. Thus, Goku \"stepping over the state of the gods\"\
      \ should scale to this clash at least somewhat) | Low Multiverse level (Fought\
      \ Jiren at full power even after Jiren broke his limits, and managed to defeat\
      \ him after becoming enraged)"
