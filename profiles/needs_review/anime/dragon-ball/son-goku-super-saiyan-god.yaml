        as a God of Destruction. He also had performed such a feat in less than 48
        minutes and is the only mortal in all 12 universes to have mastered the technique.
        He can rely purely on his muscle memory and something "beyond" instinct to
        fight, no longer needing to consciously think to do so while being more serious
        in this form. In all of Universe 7, he is among the most skilled warriors
        to exist, superior to master martial artists such as Master Roshi, Piccolo,
        the Kais, and only rivaled by Vegeta, being labeled as one of the only few
        who can entertain Beerus, the God of Destruction of Universe 7. Among all
