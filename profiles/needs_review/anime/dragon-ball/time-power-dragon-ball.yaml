  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=No|Content= *Energy Manipulation (Its nature
    is an energy-based power) which can do the following: **Energy Projection (As
    an energy-based power, its users can project temporal energy to [https://imgur.com/BL0uVdQ
    attack]) **Explosion Manipulation (As an energy-based power, its energy attacks
    [https://imgur.com/pQ3OPm0 can generate explosions] with the aura made from the
    very [https://imgur.com/IVPQkEO Time Energy itself], passively affecting anyone
    who makes contact with the energy with its power & abilities. The power itself
    also can [https://imgur.com/a/time-power-passive-ee-FX19Fve passively affect others]
    without the need of spreading its energy and touching the opponents) *Fire Manipulation
    & Electricity Manipulation (Users can generate the power/temporal energy in the
    [https://imgur.com/RJFGzPf form] of a [https://imgur.com/H2sNvkC burning flame]
    [https://www.youtube.com/watch?v=WYdnzjqbBdo&t=2196s or] [https://imgur.com/a/time-powers-temporal-judgement-PhGbQOQ
    intense thunder]) *Attack Reflection (Can [https://imgur.com/ZspMO0T return attacks
    and abilities] back to the opponents either by [https://imgur.com/a/e0JkwNN reversing
    time] ability) *Magic (Aside from using energy mixed with special abilities to
    attack, Time Power''s users can also unleash those abilities directly [https://imgur.com/a/kyxfiqS
    in the form of magic/spells] and [https://imgur.com/a/0QCBz76 bless] others simply
    by transferring/giving Time Energy to a person they bestowed it upon. Can bestow
    their power to turn the [https://imgur.com/DRyD8YG Dormant Keysword] or even a
    [https://imgur.com/a/time-power-turns-trunks-normal-sword-into-awakened-keysword-4dyQl1G
    regular sword into] the Keysword) **Statistics Amplification ([https://imgur.com/a/nJyj0xG
    Time Power] is an energy-based power, thus it can amplify it user''s [https://imgur.com/1TRQsWA
    overall power] which in turn [https://imgur.com/7SPy0oF boosts] [https://imgur.com/c6QeFVa
    their] [https://imgur.com/a/NOxRlmT overall strength]. Acquiring more temporal
    energy means the user gains even greater power, speed, durability etc. similarly
    to normal Ki. Users can also use space-time techniques to [https://imgur.com/a/TF29FJP
    control the energy of others, fusing and amplifying] the [https://imgur.com/qQZ1ZIL
    powers of others]. Time Power''s power & abilities'' potency is parallel with
    the amount of Time Energy users have in them, [https://imgur.com/a/more-time-power-stronger-moves-2wrgjKf
    thus more Time Power equals greater power & abilities'' potency] As a power that
    creates, controls and encompasses Time, the entire multiverse and all histories/space-time/timelines,
    Time Power should be able to interact with everything including Infinite Zamasu
    [Game] who became [https://imgur.com/a/NjCxi7u the very will, thoughts, ideas
    of justice and merged with the fabric of the universe]. Ki is also [https://imgur.com/a/yGhTLKM
    ] and [https://imgur.com/MQs7KKc is a part of Time Energy]. and [https://imgur.com/a/time-stop-ryUD156
    consciousness]) **Memory (Can interact with, attack and wipe out others'' memories.
    Users can put memories into the attack) **Law, Chaos ( is a part of , thus the
    power can interact with . Can [https://imgur.com/bxedmmL create time ] thus can
    interact with . Superior to & which also are also [https://imgur.com/a/positive-negative-energy-are-parts-of-time-power-energy-WIJNFWj
    parts of ]) **Causality, Probability & Fate (Time Power control Time which holds
    causality, fate and luck within itself, thus Time Power can interact with them)
    **Data & Information (Type 2; Scales to Dragon Ball Heroes Multiverse''s Ki which
    is also an energy-type power like Time Power, which [https://imgur.com/a/ziku-world-8LZe6ul
    can interact] with the Ziku World which is a digital space-time comprised purely
    from WiFi Network Data and Information. Time Power is stated to be able to control
    and erase all space-times, the entire multiverse which includes the Ziku World
    itself which is also a space-time within the multiverse. Can affect recorded data
    and information of history in the Time Scrolls, these Time Scrolls themselves
    are also just a manifestation of Time Power) **Concept (Type 1; Upscales to Dragon
    Ball Heroes Multiverse''s Ki which is also an energy-type power like Time Power,
    which can interact with ; thus Time Power is able to interact with these as well
    and manipulate, influences them. Time Power is also a itself. Time Scroll - the
    extension of Time Power, recorded and written everything in existence including
    all such as Evil itself, which was stated by Sealas that [https://imgur.com/Xvmk4HC
    Evil] [https://imgur.com/a/sealas-realized-world-evil-would-have-no-longer-existed-couldnt-proliferate-any-more-uUNwo3k
    always exists] and [https://imgur.com/a/GO21W7I in order for him to truly eradicate
    it and make a new world without Evil, he need to destroy the Time Scroll which
    in turn erase all of existence], despite Sealas has the power & abilities to destroy
    everything'
