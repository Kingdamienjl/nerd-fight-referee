    - field: weaknesses
      value: 'Goku seeks strong opponents and therefore will allow his opponents to
        reach their full power for the sake of a good fight. Kaio-ken strains his
        body, causing him intense pain and exhaustion if he overuses it. He often
        drops his guard and leaves openings for his opponents whenever he gets distracted,
        lowering his durability. His Spirit Bomb requires a long charge-up period,
        during which time he is vulnerable. He cannot survive in the vacuum of space
        and needs to locate a ki signature to teleport using Instant Transmission.
        Super Saiyan 3 drains his ki rapidly and will exhaust him within only a few
        minutes. Notable Attacks/Techniques: |-|Ki Attacks= *Ki: The fighting power
        and life force of a martial artist, a tangible energy derived from the user''s
        vigor, courage, and mind. It can be used in a number of ways, such as to surpass
        the limits of one''s body to greatly increase in strength, and it can be fired
        as blasts of energy or used to create defensive barriers. Along with his Saiyan
        blood, Ki acts as the source of Goku''s incredible power and abilities. Goku''s
        prodigal skill in combat and the use of ki allows him to replicate the ki
        techniques of others after seeing them only once. *Kamehameha: Goku''s famous
        signature technique, which he learned after witnessing Master Roshi use it
        to extinguish the flames on Fire Mountain, successfully replicating it not
        long later on his first try. As his signature technique, it is something that
        Goku has used on many occasions, and he has created a number of variations
        over the course of his fighting experience, such as firing it from his feet,
        using it to propel himself into the air, and bending it mid-flight to catch
        opponents by surprise. Perhaps the most useful variation is the Instant Kamehameha,
        in which Goku uses Instant Transmission to teleport just before firing the
        attack, appearing right in front of his opponents and giving them no time
        to dodge. *Kaioken: A technique developed by King Kai and taught to Goku during
        his time training on his planet. It greatly increases Goku''s ki for just
        a moment, boosting his strength and speed significantly for that time. However,
        this heavily strains his body, and if he overuses it, it will leave him in
        intense pain all over his body, leaving him incapable of moving without causing
        himself further pain. Initially, the strongest Kaioken Goku can utilize is
        x4, but by the time of the Frieza Saga, he has mastered its use, allowing
        him to push it to his maximum of x20. During Dragon Ball Z, it is impossible
        for Goku to utilize it alongside Super Saiyan, as the intense emotions caused
        by the Super Saiyan transformation makes it difficult to properly control
        one''s ki, making the combination incredibly risky at best and lethal at worst.
        *Spirit Bomb: Goku''s ultimate attack, taught to him by King Kai, performed
        by gathering a vast amount of energy from all the lifeforms in his surroundings
        to create a massive, incredibly destructive sphere of ki. To use it, one must
        have a pure heart, and so Goku is a perfect user of the technique due to his
        obliviously innocent nature. While it is incredibly powerful and can prove
        capable of completely destroying an opponent when used with sufficient power,
        it takes a very long time to charge and is therefore very difficult to use,
        though the charge time can be sped up by gathering energy from those who willingly
        and knowingly provide it. *Kiai: The ability to project an invisible burst
        of force with ki, which Goku can perform with his hands and even with a glare.
        *Kienzan: Krillin''s signature technique, which Goku presumably copied from
        him. Raising his hand above his head, Goku creates a razor-sharp disc of ki
        with incredible cutting power, and then throws it at his opponent. It should
        be noted that the Kienzan can cut through opponents that are several times
        stronger and more durable. *Solar Flare: One of Tien Shinhan''s signature
        techniques, which Goku copied from him during their match in the World Tournament.
        Bringing his hands up to his face, Goku can create a bright flash of light
        that can blind opponents. |-|Other Techniques= *Telepathy: Goku has the ability
        to telepathically communicate with others, presumably learned from King Kai
        during his time in the afterlife, and during the Frieza Saga, he shows the
        ability to read Krillin''s mind by putting his hand to his forehead. *Instant
        Transmission: A teleportation technique that Goku learned between the Frieza
        and Cell Sagas on the planet Yardrat, which allows him to lock onto the ki
        signatures of others and teleport to their locations. Its use takes some concentration,
        which is aided by Goku putting his index and middle fingers to his forehead
        (He has also shown to teleport without placing his fingers), and he needs
        a ki signature to teleport to, otherwise he cannot perform the technique.
        It can be used to teleport others as well, as long as they are in physical
        contact with Goku. *Fusion Dance: A special dance created on planet Metamor,
        learnt'
