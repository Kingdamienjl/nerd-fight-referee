    - field: intelligence
      value: Average in general. Genius in combat (Although he lacks knowledge when
        it comes to things that aren't related to fighting, Goku is a master of prodigal
        skill when it comes to martial arts, with years of experience fighting against
        powerful opponents with a plethora of abilities. As a child, he was able to
        beat martial artists on such a level as Grandpa Gohan, who was stated to be
        an unparalleled master in all martial arts. In his battle with Master Roshi,
        he copied his Drunken Fist style to adapt to it and created his own style
        known as the "Crazy Fist" in response. His skill when it comes to combat and
        the usage of Ki allows him to replicate other Ki-based techniques after seeing
        them once, and he was the first to realize how much energy the Super Saiyan
        transformations unnecessarily drained. Despite this drawback, he was the first
        to master the Super Saiyan state, making it highly efficient and subsidizing
        the need to reach a higher grade, which decreases speed as a side effect.
        He is a genius in combat and is capable of devising new applications of his
        techniques on the fly, such as using Kamehameha with his feet. Was able to
        go toe to toe with Cell, a being created by the genius scientist Dr. Gero
        to be the ultimate warrior, spending 20 years taking the DNA and footage of
        every fighter on earth and on Namek, copying their techniques, their mannerisms,
        and their skills to create him, including Goku himself, also having knowledge
        on how he approaches battle as well. His skill when it comes to combat and
        the usage of ki allows him to replicate other ki-based techniques after seeing
        them once, and he was the first to realize how much energy the Super Saiyan
        transformations unnecessarily drained. Despite this drawback, he was the first
        to master the Super Saiyan state, making it highly efficient. He is a genius
        in combat and is capable of devising new applications of his techniques on
        the fly, such as using Kamehameha with his feet)
      source_id: vsbattles-son-goku-kaioken-dragon-ball
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Goku seeks strong opponents and therefore will allow his opponents to\
        \ reach their full power for the sake of a good fight. Kaioken strains his\
        \ body, causing him intense pain and exhaustion if he overuses it. He often\
        \ drops his guard and leaves openings for his opponents whenever he gets distracted,\
        \ lowering his durability. His Spirit Bomb requires a long charge-up period,\
        \ during which time he is vulnerable. He cannot survive in the vacuum of space\
        \ and needs to locate a ki signature to teleport using Instant Transmission.\
        \ Super Saiyan 3 drains his ki rapidly and will exhaust him within only a\
        \ few minutes. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
        1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
        2\" style=\"text-align: left; \" |Notable Attacks/Techniques: |- | |-|Ki Attacks=The\
        \ fighting power and life force of a martial artist, a tangible energy derived\
        \ from the user's vigor, courage, and mind. It can be used in a number of\
        \ ways, such as to surpass the limits of one's body to greatly increase in\
        \ strength, and it can be fired as blasts of energy or used to create defensive\
        \ barriers. Along with his Saiyan blood, Ki acts as the source of Goku's incredible\
        \ power and abilities. Goku's prodigal skill in combat and the use of ki allows\
        \ him to replicate the ki techniques of others after seeing them only once.\
        \ *{{Nihongo|Kamehameha|\u304B\u3081\u306F\u3081{{Ruby|\u6CE2|\u306F}}}}:\
        \ Goku's famous signature technique, which he learned after witnessing Master\
        \ Roshi use it to extinguish the flames on Fire Mountain, successfully replicating\
        \ it not long later on his first try. As his signature technique, it is something\
        \ that Goku has used on many occasions, and he has created a number of variations\
        \ over the course of his fighting experience, such as firing it from his feet,\
        \ using it to propel himself into the air, and bending it mid-flight to catch\
        \ opponents by surprise. Perhaps the most useful variation is the Instant\
        \ Kamehameha, in which Goku uses Instant Transmission to teleport just before\
        \ firing the attack, appearing right in front of his opponents and giving\
        \ them no time to dodge. GokuKamehameha1.jpeg GokuKamehameha2.jpeg GokuKamehame3.jpeg\
        \ GokuInstantTransmissionKamehame1.jpeg GokuInstantTransmissionKamehameha2.jpeg\
        \ GokuInstantTransmissionKamehameha3.jpeg *{{Nihongo|Kaioken|{{Ruby|\u754C\
        \u738B\u62F3|\u304B\u3044\u304A\u3046\u3051\u3093}}|Kai\u014Dken}}: A technique\
        \ developed by King Kai and taught to Goku during his time training on his\
        \ planet. It greatly increases Goku's ki for just a moment, boosting his strength\
        \ and speed significantly for that time. However, this heavily strains his\
        \ body, and if he overuses it, it will leave him in intense pain all over\
        \ his body, leaving him incapable of moving without causing himself further\
        \ pain. Initially, the strongest Kaioken Goku can utilize is x4, but by the\
        \ time of the Frieza Saga, he has mastered its use, allowing him to push it\
        \ to his maximum of x20. During Dragon Ball Z, it is impossible for Goku to\
        \ utilize it alongside Super Saiyan, as the intense emotions caused by the\
        \ Super Saiyan transformation makes it difficult to properly control one's\
        \ ki, making the combination incredibly risky at best and lethal at worst.\
        \ GokuKaio-ken1.jpeg GokuKaio-ken2.jpeg GokuKaio-ken3.jpeg *{{Nihongo|Spirit\
        \ Bomb|{{Ruby|\u5143|\u3052\u3093}}{{Ruby|\u6C17|\u304D}}{{Ruby|\u7389|\u3060\
        \u307E}}|Genkidama}}: Goku's ultimate attack, taught to him by King Kai, performed\
        \ by gathering a vast amount of energy from all the lifeforms in his surroundings\
        \ to create a massive, incredibly destructive sphere of ki. To use it, one\
        \ must have a pure heart, and so Goku is a perfect user of the technique due\
        \ to his obliviously innocent nature. While it is incredibly powerful and\
        \ can prove capable of completely destroying an opponent when used with sufficient\
        \ power, it takes a very long time to charge and is therefore very difficult\
        \ to use, though the charge time can be sped up by gathering energy from those\
        \ who willingly and knowingly provide it. GokuSpiritBomb1.jpeg GokuSpiritBomb2.jpeg\
        \ GokuSpiritBomb3.jpeg *{{Nihongo|Kiai|{{Ruby|\u6C17\u5408|\u304D\u3042}}\u3044\
