        \ ways, such as to surpass the limits of one's body to greatly increase in\
        \ strength, and it can be fired as blasts of energy or used to create defensive\
        \ barriers. Along with his Saiyan blood, Ki acts as the source of Goku's incredible\
        \ power and abilities. Goku's prodigal skill in combat and the use of ki allows\
        \ him to replicate the ki techniques of others after seeing them only once.\
        \ *{{Nihongo|Kamehameha|\u304B\u3081\u306F\u3081{{Ruby|\u6CE2|\u306F}}}}:\
        \ Goku's famous signature technique, which he learned after witnessing Master\
        \ Roshi use it to extinguish the flames on Fire Mountain, successfully replicating\
        \ it not long later on his first try. As his signature technique, it is something\
        \ that Goku has used on many occasions, and he has created a number of variations\
        \ over the course of his fighting experience, such as firing it from his feet,\
        \ using it to propel himself into the air, and bending it mid-flight to catch\
        \ opponents by surprise. Perhaps the most useful variation is the Instant\
