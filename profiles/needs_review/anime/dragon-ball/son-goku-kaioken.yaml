  tier:
    text: 4-A, possibly High 3-A. High 3-A as Super Saiyan 2 and 3. 2-C as Super Saiyan
      God | 2-C. 2-B with transformations | 2-C. 2-B with transformations | 2-C. 2-B
      with transformations. 2-B via Kaioken | 2-B | 2-B | 2-B | 2-B
    source_ids:
    - character-stats-profiles-son-goku-kaioken-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Multi-Solar System level, possibly High Universe level (Should be stronger\
      \ than his Buu arc self). High Universe level as Super Saiyan 2 and 3. Multi-Universe\
      \ level as Super Saiyan God (Goku and Beerus were going to turn the universe\
      \ into an empty void, extending beyond the Macrocosm, even affecting the Kaioshin\
      \ Realm. This means it would've turned roughly 122 space-time continua into\
      \ a void of nothing. Goku later absorbed the power of Super Saiyan God and made\
      \ it his own, retaining the state of Super Saiyan God, stating he didn't feel\
      \ any weaker than he was before, and still demonstrating the capability of fighting\
      \ against a suppressed Beerus. In base form, Goku was even able to destroy a\
      \ massive attack from Beerus in a single punch which his Super Saiyan form struggled\
      \ to push back. This implies he absorbed and surpassed the power of Super Saiyan\
      \ God in his base form, and his new base is often referred to as \"Saiyan beyond\
      \ God\") | Multi-Universe level (After training with Whis for several months,\
      \ Goku had gotten far stronger than he previously was). Multiverse level with\
      \ transformations (Even if he were to simply use the Kaioken times 20, he would\
      \ be this tier through multipliers. He is capable of massively stronger than\
      \ his normal Super Saiyan forms with his Super Saiyan Blue state) | Multi-Universe\
      \ level (Trained for 3 years with Vegeta in the Hyperbolic Time Chamber, making\
      \ him stronger than his base in the Golden Frieza arc). Multiverse level with\
      \ transformations (As a Super Saiyan, overpowered Final Form Frost and would\
      \ have won against him if he had not been poisoned. As Super Saiyan Blue, he\
      \ managed to fight on par with Hit and even overwhelm him before the latter\
      \ improved his Time Skip. After using Kaio-ken x10 on top of Super Saiyan Blue,\
      \ completely overpowered Hit to the point where his Time Skip had no effect\
      \ on Goku) | Multi-Universe level. Multiverse level with transformations (Significantly\
      \ stronger than before. After getting angry, beat up Future Zamasu and Goku\
      \ Black, the latter in his Super Saiyan Ros\xE9 form. Following being beaten\
      \ up by Fusion Zamasu, Goku and Vegeta became strong enough to break through\
      \ his Lightning of Absolution [likely surpassing Goku Black's power from episode\
      \ 64] With a full power Kamehameha, SSB Goku could even put up a fight against\
      \ Fusion Zamasu, though after putting in all of that power, his arms were broken).\
      \ Multiverse level via Kaioken (Managed to escape the grip of Fusion Zamasu\
      \ and knock him down with a powerful kick) | Multiverse level (Post-Future Trunks\
      \ arc SSB Goku could fight evenly with an improved and serious Hit, while he\
      \ had been forced to use Kaioken against a less serious and weaker Hit in the\
      \ Universe 6 Saga. Because of this, Goku's base should also be this tier. As\
      \ a Super Saiyan God in the Tournament of Power, he was implied to be comparable\
      \ to Hit and he caused Jiren to block his blows with a finger, whereas SS and\
      \ SS2 Goku didn't even make Jiren flinch, and the latter only barely moved Jiren's\
      \ neck. By the Tournament of Power, Goku could use Kaio-ken x20 on top of Super\
      \ Saiyan Blue. Goku's Spirit Bomb pushed Jiren to actually exert himself somewhat.\
      \ The Spirit Bomb's power even had Belmod worried for a bit. As Ultra Instinct\
      \ -Sign-, Goku pushed Jiren back and slightly damaged him, when not even SSJBKKx20\
      \ could so much as scratch him. He was also making the Gods of Destruction panic,\
      \ though this may not have been due to Goku's sheer power and instead due to\
      \ him being able to use Ultra Instinct) | Multiverse level (In base [while fatigued],\
      \ was able to somewhat hold his own against SS2 Caulifla, mainly through fighting\
      \ skills, though he could still hurt her and clash with her a few times, so\
      \ he shouldn't be too far behind her in terms of power. As a Super Saiyan 2,\
      \ he overwhelmed both Super Saiyan 2 Caulifla and Super Saiyan Kale with some\
      \ trouble. As a Super Saiyan God, he was far above Caulifla and Kale, the latter\
      \ of whom was in a mastered version of her berserk form. Goku was so far above\
      \ Kale that he took one of her blasts with no damage. While he was beaten up\
      \ by base Kefla in his God form, as Super Saiyan Blue, he fought with Super\
      \ Saiyan Kefla rather evenly before eventually using Kaioken and overpowering\
      \ her. Kefla's power was stated by Whis to rival that of Goku's Spirit Bomb\
      \ that he used against Jiren. As Ultra Instinct -Sign-, he was far superior\
      \ to Super Saiyan 2 Kefla, who had surpassed Goku's level of power that he used\
      \ against Jiren, and managed to defeat her even after she surpassed him by attempting\
      \ to release all of her energy at once) | Multiverse level (As Super Saiyan\
      \ Blue Kaio-ken x20, along with Super Saiyan Blue Evolution Vegeta, managed\
      \ to fight with Jiren, who had started to show a hint of his true power. In\
      \ Ultra Instinct -Sign-, he was stated to have possibly surpassed Beerus. Was\
      \ able to inflict serious damage on Jiren, which nobody else could do before.\
      \ Jiren was confirmed to be the mortal who surpasses a God of"
    source_ids:
    - character-stats-profiles-son-goku-kaioken-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+. Massively FTL+ as Super Saiyan God (Could keep up with Beerus,
      when the latter was holding back) | Massively FTL+ (Faster in base form than
      he was as a Super Saiyan God in the previous Arc. Can increase his speed by
      a massive amount using Super Saiyan Blue.) | Massively FTL+ (Faster than before.
      Can increase his speed up to 10x with the Kaio-ken) | Massively FTL+ (He went
      from being slower than SSR Goku Black to being able to keep up with a suppressed,
      yet faster Merged Zamasu) | Massively FTL+ (As Super Saiyan Blue, became superior
      to Vegito Blue from the Future Trunks Saga. Keeps up in speed with a faster
      Hit later in the Tournament of Power in his Super Saiyan God state). Inaccessible
      as Ultra Instinct -Sign- (Comparable to a suppressed Jiren. Even suppressed
      Jiren massively exceeds Merged Zamasu in all forms) | Massively FTL+ (Fought
      a stronger Kale and Caulifla at the same time a Super Saiyan 2 and dominated
      them as Super Saiyan God). Inaccessible as Ultra Instinct -Sign- | Massively
      FTL+. Likely Inaccessible as Super Saiyan Blue. Inaccessible with Kaioken (Could
      keep up with Jiren, who was showing a hint of his true power, meaning he should
      be stronger and faster than when he broke through Hit's Time Cage). Inaccessible
      as Ultra Instinct -Sign- (Gave almost full-power Jiren serious trouble). Inaccessible
      as Mastered Ultra Instinct (After achieving the true Ultra Instinct, he was
      shown to be able to blitz Jiren, something which previously seemed impossible)
      | Inaccessible (Even his base form is at least around Android 17's level)
