        \ GokuKaio-ken1.jpeg GokuKaio-ken2.jpeg GokuKaio-ken3.jpeg *{{Nihongo|Spirit\
        \ Bomb|{{Ruby|\u5143|\u3052\u3093}}{{Ruby|\u6C17|\u304D}}{{Ruby|\u7389|\u3060\
        \u307E}}|Genkidama}}: Goku's ultimate attack, taught to him by King Kai, performed\
        \ by gathering a vast amount of energy from all the lifeforms in his surroundings\
