        \ Disc|{{Ruby|\u6C17|\u304D}}{{Ruby|\u5186\u65AC|\u3048\u3093\u3056\u3093\
        }}|Kienzan}}: Krillin's signature technique, which Goku presumably copied\
        \ from him. Raising his hand above his head, Goku creates a razor-sharp disc\
