    - field: intelligence
      value: High. With time Nero managed to dominate and master his highly dangerous
        powers despite the overall secrecy about stagnated Lifestream worldwide, and
        also managed to become a skilled and powerful enough warrior to emerge as
        one of the unquestioned strongest of Deepground, earning him his title of
        Colored Tsviet. When Weiss went missing, after the fall of the Restrictors,
        Weiss effectively led Deepground in his stead and managed to collaborate with
        Hojo to successfully stage Omega's revival. Additionally, Nero is surprisingly
        pragmatic and will dispatch enemies quickly with his more lethal abilities,
        such as his darkness, if he can't defeat them fast enough in combat.
      source_id: mediawiki-gohan-rebirth
