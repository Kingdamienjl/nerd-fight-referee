        *Dual Handguns: A pair of guns Nero uses when he has to resort to straight-up
        combat. Given Nero has his hands tied to keep his darkness under control unless
        he plans to use it, the guns are attached to the machine on his back. However,
        Nero is still able to use them with masterful precision and timing. *Mechanical
        Wings: A peculiar device Nero has on his back. The wings aren''t capable of
        flight by themselves, as that is an ability of Nero, but are rather used as
        an extra pair of limbs for combat, maneuvering or to hold his guns. *Arachnero:
