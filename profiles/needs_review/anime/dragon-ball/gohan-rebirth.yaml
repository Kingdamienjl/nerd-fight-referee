    - field: weaknesses
      value: 'As Arachnero, Nero''s mobility suffers quite a bit, and is nowhere near
        as agile as in his human form, having to rely on shields and projectiles to
        control the pace of the fight. Notable Attacks/Techniques: |-|Nero the Sable=
        *Stagnated Lifestream: Nero''s "darkness". This is Lifestream that is related
        to Chaos, implied to have attained its corrupted state due to an accumulation
        of negative emotions which may cause the Lifestream to reject the spirit of
        people from properly rejoining it in the cycle of life and rebirth, despite
        disseminating their memories and individuality. Nero''s darkness only needs
        to briefly touch a person to reach their soul and bring back painful memories
        and an overload of negative emotions. *Consume: Another use of Nero''s darkness.
        Nero can "devour" people with accumulations of his darkness and send them
        to a realm of shadows where they are exposed to all sorts of negative emotions
        and knowledge which would overload and kill them. This process is like a darker
        turn, and a smaller-scale version of the Mako Poisoning contact with the Lifestream
        can cause. Nero can also expel whatever he has consumed whenever he wants.
        *Teleportation: Nero can open portals of darkness to travel to different places
        and transport other people as well. *Dark Rain: Nero shapes two spheres of
        darkness and throws them at his enemy. These aren''t very quick but are quite
        powerful and home on the target. *Doppelgangers: Nero can materialize two
        duplicates of himself made of tainted Lifestream. |-|Arachnero= *Barrier:
        Arachnero protects himself with an energy barrier powered by the Phalanxspheres.
        With enough force, the barrier can be broken, but the Phalanxspheres will
        rebuild it. Similarly, destroying the drones will deactivate the barrier,
        but then Nero will materialize four more. *Laser Beam: The Phalanxspheres
        will fly around Nero and aim with an energy shot at the enemy, assisting in
        combat. *Fire Ball: Arachnero will conjure several fireballs to fall from
        the sky, resembling small meteorites. *Flame Streak: Arachnero will jump from
        above the fire void in the arena rising a barrage of fire shots that will
        slightly follow his target. ==Gallery== DOCLE_NerotheSable.png|Nero in Dirge
