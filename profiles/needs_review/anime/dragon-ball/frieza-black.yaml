        \ with a single fingertip, Frieza creates a giant energy sphere that can easily\
        \ destroy planets. His expertise in the technique allows him to restrain it\
        \ to instead put a planet on a timer towards destruction if he so pleases.\
        \ Its most powerful variant is the Supernova, a massive, sun-like sphere of\
        \ energy that takes some time to charge but has immense power. Golden Frieza\
        \ upgrades this technique into the even more powerful Golden Death Ball. 8f729a89-1766-4d86-87df-deb1a573e722.jpeg\
