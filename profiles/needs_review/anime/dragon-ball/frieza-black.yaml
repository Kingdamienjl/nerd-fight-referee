        \ energy derived from the user's vigor, courage, and mind. It can be used\
        \ in several ways, such as to surpass one's physical limits and dramatically\
        \ increase strength. It can also be fired as blasts of energy or create defensive\
        \ barriers. Frieza is a mighty mutant hybrid of his race, born with such ridiculous\
        \ strength that few could match him. He had to develop weaker forms of his\
        \ power to control it better. He is incredibly skilled with ki, though his\
        \ ignorance of its spiritual side meant he didn't know how to sense it at\
        \ first. *{{Nihongo|Death Ball|\u30C7\u30B9{{Ruby|\u6C17|\u304D}}{{Ruby|\u7389\
