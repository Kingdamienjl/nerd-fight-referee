    - field: intelligence
      value: Gifted (Frieza, as the dictatorial ruler of much of Universe 7, is a
        clever and crafty commander who kept his iron grip on his territory by terror
        and strategic military deployment. In combat, he is an extremely skilled hand-to-hand
        combatant capable of fighting on par with the likes of Goku, even when playing
        around. He is well-versed in using ki, replicating and improving upon Krillin's
        Destructo Disc with his own homing variant. However, for all of his skills,
        Frieza is quite overconfident and not fond of utilizing his full power. Due
        to his arrogance and obsession with vengeance, he rushed to fight Goku as
        soon as he achieved his Golden Form, skipping the training process to optimize
        its ridiculous energy expenditure)
