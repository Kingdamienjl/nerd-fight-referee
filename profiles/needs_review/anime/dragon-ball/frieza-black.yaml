        \ 862976a3-97ac-4562-998e-5ef6daa8e68b.jpeg 563479828994388784693784.webp\
        \ *{{Nihongo|Death Beam|\u30C7\u30B9{{Ruby|\u5149\u7DDA|\u3053\u3046\u305B\
