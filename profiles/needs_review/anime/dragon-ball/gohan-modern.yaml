    - field: weaknesses
      value: 'Solo is often blinded by his rage and anger, making him act irrationally.
        Is easily agitated and will blindly attack anyone who has stolen a Murian
        Artifact. Notable Attacks/Techniques: *Super Armor: Rogue is able to shrug
        off most attacks while in the midst of a charge, making it nearly impossible
        to interrupt his attacks unless he is countered just as he begins his attacks.
        *Mu Rejection Barrier: Rogue constantly produces Mu Rejection Barriers while
        in combat, blocking a single attack before shattering. However, these shields
        will shatter in the face of any attack comparable to Rogue''s durability (but
        will completely nullify it in the process). As a result, they can be dispelled
        by hitting them with a rapid-fire attack before closing in with a stronger
        weapon. However, these quickly regenerate, leaving very few windows for attack.
        In addition, Rogue is completely immune to targeting systems while these barriers
        are active. *Rogue Fist: Dashing in front of his opponent, he quickly nails
        them with a rapid barrage of punches and kicks. The longer he is allowed to
        use this attack, the more powerful it becomes. * Rogue Wave: By using the
        power of the Darklight Harvester ingrained in his Indie Proof, Rogue sends
        out numerous shockwaves with an uppercut to cut off his foe''s path of escape.
        * Rogue Knuckle: Rogue uses the power of darkness to unleash a barrage of
        flaming fist-shaped projectiles to attack his opponent from all sides. These
        projectiles disorient and confuse the opponent with a direct hit, leaving
        them open to additional attacks. He frequently follows a successful use of
        this attack with a wide-reaching blade of compressed energy referred to as
        a "sonic boom" or with a simple flurry of slashing attacks. *Laplace Blade:
        With Laplace equipped, Rogue dashes to an opponent before cleaving them with
        a wide horizontal slash that''s difficult to dodge but can be blocked. This
        attack paralyzes foes with a direct hit, leaving them open to additional attacks
        such as his Rogue Wave or Rogue Fist attacks. *Spin Blade: Rogue throws Laplace
        like a boomerang, attacking his target repeatedly from different angles before
        returning to him. *Rogue Break: His signature move, Rogue jumps into the air
        before quickly coming down on his opponent with a resounding crash, smashing
        the surrounding area with powerful dark flames and dealing great damage. This
        move is so powerful that Mega Man''s shield is unable to withstand it, forcing
        him to dodge. *Blade Wrath: Rogue''s strongest attack, consisting of two Spin
        Blades from opposite directions before descending on the opponent with an
        even more powerful version of his Rogue Break. The armor-penetrating power
        of the physical attacks along with the dark flames emitted by the attacks
        render the attack nearly impossible to block and extremely difficult to dodge.
        ==Notable Matchups== Victories: Gohan (Dragon Ball) Gohan''s Profile (Both
        were 4-B, Ultimate Gohan was used, and speed was equalized) Losses: Inconclusive
