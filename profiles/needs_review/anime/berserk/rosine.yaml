power_scale:
  tier:
    text: 8-A, far higher with Apostle Form
    source_ids: &id002
    - mediawiki-4659055
    confidence: 0.8
  attack_potency:
    text: Multi-City Block level (Stabbed Black Swordsman Guts and blocked his throwing
      knives119.07 Tons of TNT), far higher with Apostle Form (When flying at top
      speed, Rosine smacked Guts around and sent him flying, leaving him unable to
      do anything. Guts even stated that her just streaking by was enough to nearly
      obliterate him. After stabbing and carrying Guts around, Rosine was going to
      tear Guts to shreds by flying at top speed)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Subsonic+ (Dodged an attack from Black Swordsman Guts and blocked his throwing\
      \ knives. Faster than her elves. Can quickly fly up past the clouds and travel\
      \ to the Misty Valley which is 3 mountains awayUpscales from 200.58 m/s), At\
      \ least Supersonic with Apostle Form (Rosine boasts the highest speed in the\
      \ entire world. When flying at top speed, she caused thunderous sonic booms\
      \ and she completely outsped Guts to the point he couldn\u2019t even see her\
      \ and just got smacked around. Even after Rosine reduced her speed considerably,\
      \ Guts was still massively outsped and needed to prepare for it, as to not need\
      \ to react, as well as get hurt just so that he could land a hit on her)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Unknown (Lacks feats), Class 50 with Apostle Form (Knocked Guts off of her.
      Stopped a falling treeBerserk - Chapter 11432.32 Tons of force)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Multi-City Block level (Comparable to her Attack Potency), far higher with
      Apostle Form (Comparable to her Attack Potency. Would have killed Guts at once
      if she had managed to stab into his head)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Multi-City Block level (Blocked Guts' throwing knives), far higher with
      Apostle Form (Comparable to her Attack Potency. Rosine suffers no damage from
      smashing into Guts or through trees while flying at top speed)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Continued to fight even after Guts had shot her with his canon
      and had stabbed through her body, with her guts spilling out)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range with proboscis and poison (Got into Guts's range to
      attack him), Several Meters with her sonic booms and proboscis in Apostle Form
      (Her proboscis increases in size when in Apostle Form. Her sonic booms can blow
      away multiple trees around her)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Average (As a child, could fend for herself in the woods and catch animals)
    source_ids: *id002
    confidence: 0.8
