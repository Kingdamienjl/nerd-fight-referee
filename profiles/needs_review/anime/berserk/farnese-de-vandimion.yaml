power_scale:
  tier:
    text: At least 9-C, likely far higher. with the Formation of the Four; up to High
      7-A
    source_ids: &id002
    - mediawiki-4658879
    confidence: 0.8
  attack_potency:
    text: At least Street level, likely far higher (Using thorn snakes or silver weapons,
      she is capable of harming Pishacha tigersBerserk - Chapter 259 which can casually
      slash off human heads and are far stronger than real life tigers due to beings
      infused with magicBerserk - Chapter 239). Varies with the Formation of the Four
      (The spell is effective against ethereal bodies, but is only half as effective
      against physical beingsBerserk - Chapter 321 and has no effect on physical objects);
      from Large Mountain level up to Large Mountain level+ (The barrier of light
      is powerful enough to stop an entire horde of Sea Slugs and it vaporized a large
      part of the Wave of Darkness,Berserk - Chapter 369 which caused an earthquake
      that destroyed Elfhelm.Berserk - Chapter 367 to 369 Daiba even stated that it
      would be possible to challenge Griffith with this light.Berserk - Chapter 380
      The light is the power of the Four Kings of the World, deep astral beings labeled
      as guardian angels, with which the ethereal bodies of mere humans cannot even
      compare.Berserk - Chapter 201 The spell parted the clouds when it came downBerserk
      - Chapter 379Varies; from 1.465 Gigatons of TNT up to 2.93 Gigatons of TNT)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Peak Human (Could strike a pishaca tiger and cut trolls, which are stated
      to be far stronger than humansBerserk - Chapter 207), Superhuman with thorn
      snakes (Stopped a pishaca Tiger as it lunged at Roderick), Speed of Light attack
      speed with the Formation of the Four (The spell comes down from the sky at this
      speed)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Average Human (Pushed a coffin uphill)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
