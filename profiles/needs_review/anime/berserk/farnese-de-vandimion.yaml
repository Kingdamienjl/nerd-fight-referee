    source_ids: *id002
    confidence: 0.8
  durability:
    text: Human level
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Athletic (Traversed large distances as a Holy Iron Chain Knight. Went through
      a long and harsh journey inside Casca's mindBerserk - Chapter 349Berserk - Chapter
      351Berserk - Chapter 355)
    source_ids: *id002
    confidence: 0.8
  range:
    text: 'Standard Melee Range with silver dagger, Extended Melee Range with rapier,
