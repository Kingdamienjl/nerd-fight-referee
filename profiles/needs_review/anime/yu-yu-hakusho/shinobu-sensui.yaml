- id: claim-weaknesses-20a8ac7a
  section: weaknesses
  axis: weakness
  text: 'Suffers from a terminal illness with limited time left to live, otherwise
    nothing notable. Notable Attacks/Techniques: *Resshuken: Used mainly in his Minoru
    personality, an elegant fighting style that is said to be only available to users
    that master all forms of martial arts, which focuses on blocking all enemy attacks
    with the arms and using the legs to counterattack the opponent. *Reikoresshuken:
    Sensui gathers up a ball of spirit energy and then kicks it and it spreads out
    into multiple balls of energy heading toward the opponent. *Gun Arm: As his Kazuya
    personality, he can use a gun arm which fires powerful energy blasts. *Sacred/Holy
    Energy: The strongest form of energy that can only be attained through decades
    of training (It was shortened to a couple of years with Sensui since he had multiple
    personalities). It appears as a glowing golden aura around him that he can manipulate
    and construct into an gold armor that augments his defense or into a blue armor
    that can augment his offensive strength. *Reppa Fuujin Ken: Sensui raises his
    arm and summons a tornado in the process that envelopes its opponent. If the opponent''s
    caught then he/she will be caught multiple times. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{Discussions}} Category:Characters Category:Yu Yu Hakusho
    Category:Acrobats Category:Adults Category:Air Users Category:Anime Characters
    Category:Antagonists Category:Armor Users Category:Aura Users Category:Body Control
    Users Category:Chi Users Category:Creation Users Category:Earth Users Category:Energy
    Users Category:Enhanced Senses Users Category:Extrasensory Perception Users Category:Flight
    Users Category:Humans Category:Male Characters Category:Manga Characters Category:Martial
    Artists Category:Primary Antagonists Category:Psychopaths Category:Villains Category:Multiple
    Selves Users'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-cd68990c
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= *Superhuman Physical\
    \ Characteristics *Acrobatics *Flight *Ki Manipulation *Reiki Manipulation *Sacred\
    \ Energy Manipulation *Air Manipulation *Earthquakes Generation *Multiple Selves\
    \ (Types 1 & 2; Has 7 consciousnesses and souls in the same body, each with different\
    \ strength and abilities) *Body Control (Kazuya personality can form a gun from\
    \ his arm that shoots spirit energy) *Master of the Reshuken martial art style\
    \ (Apparently mastered all other martial arts as well, combined with sacred energy\
