    \ (Noted that the power of Kurama, Hiei and Kuwabara has increased) *Instinctive\
    \ Action (Honed his instincts to automatically kick in) *Holy Manipulation (Sensui\
    \ possesses sacred energy which is referred to as holy multiple time. While possessing\
    \ it he\u2019s been shown to be able to bypass the forcefield to the demon plane\
    \ which blocks all evil and Sensui states that holy chi harmonizes with nature\
