        3: the End of Hope''s Peak; Despair Arc; Episode 7; The Biggest, Most Atrocious
        Incident in Hope''s Peak High School''s History and actingDanganronpa: Trigger
        Happy Havoc; Chapter 6: Ultimate Pain, Ultimate Suffering, Ultimate Despair,
        Ultimate Execution, Ultimate Death); extremely skilled in battle (Mukuro is
        a military specialist trained in every weapon type imaginable and a highly
        proficient user of firearms. Displaying interest in the military, she won
        a survival game tournament when she was only in elementary school and began
        writing military magazines. Before entering middle school, she joined an elite
        mercenary group called Fenrir, where she was trained for battle, a mercenary
        group notorious for its battle-crazed warmongers who always complete their
        missions. She fought many battles and was never once wounded in battleDanganronpa:
        Trigger Happy Havoc; Chapter 5: 100 Mile Dash; Pain of a Junk Food Junkie
        until she fought Sakura. She''s also able to keep up with both the Ultimate
        Swordswoman Peko Pekoyama and the Ultimate Martial Artist Sakura Ogami. Was
        mentioned to have a lot of experience in killing people, as a member of Fenrir
        and as well as the Ultimate Despair, had experiences in taking care of hand
        grenades in which their pins had already been pulled, and had experiences
        of parachuting down the while the sky was being bombarded with anti-air fire.
        It was also stated that she is so experienced in terms of combat and violence,
        that her heart had never been shaken even once on the battlefield before.
        While in the Battle Trance, she was stated to have been ascending to the level
        of violence incarnate, breaking the boundaries of humanity, and surpassing
        the level of "Ultimates")'
      source_id: mediawiki-5030000
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Junko Enoshima, Mukuro is out of touch with her emotions and only knew
        how to follow her sister. This loyalty eventually caused her downfall as she
        believed her sister wouldn''t betray her (which she did). When in Battle Trance,
        her immense concentration can be broken by her sister. She is also emotionally
        awkward. Her skills are only limited to purely engaging in combat, and she
        is not very good at war planning/strategies and negotiation. Notable Attacks/Techniques:
        *Battle Trance Mode: If Mukuro is pushed to a certain limit, she would enter
        some sort of Trance, where time seems to slow for Mukuro. In this state, Mukuro''s
        speed and reflexes increase to an astounding degree. Note: Mukuro is dead
        in the canon storyline of Danganronpa, so more of her stats come from the
        Spinoff Novels such as Danganronpa Zero and IF. ==Notable Matchups== Victories:
        Losses: Inconclusive: Kamen Rider Ouja (Kamen Rider Ryuki) Ouja''s Profile
        (High 7-C Ouja and Battle Trance Mukuro were used, speed was equalized, Mukuro
        has limited prior knowledge regarding Mirror World, and Mukuro was armed with:
        Wired Baseball Bat, Katana, Combat Knives, Brass Knuckles, Pair of Karambit,
        AK-47, Browning M2, M61 Vulcan Cannon/Mini-Gun, Colt Python, Mauser C96, RPG,
        SMAW, Pfeifer Zeliska Revolver, Shotguns (Sawn-off and Mossberg 500), Thompson
        Submachine Gun, Sako TRG Sniper Rifle, Magnum Researcher BFR, Bow, Crossbow,
        Grenades (Explosion, Flame, Flashbang, StealHand Type), Flamethrower, Throwing
        Darts (Normal and Poison), and C4 Bomb. Mukuro has a combat vehicles such
        as: Lenco Bearcat G2, Military Modificated Mitsubishi Jeep J59, ILSV, Type
        19 155 mm Wheeled Self-propelled Howitzer, and M270 MLRS. Battle took in Casablanca
        Tunnel, Indonesia) ==References== {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations==
