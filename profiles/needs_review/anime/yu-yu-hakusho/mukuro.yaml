    - field: weaknesses
      value: 'Junko Enoshima, Mukuro is out of touch with her emotions and only knew
        how to follow her sister. This loyalty eventually caused her downfall as she
        believed her sister wouldn''t betray her (which she did). When in Battle Trance,
        her immense concentration can be broken by her sister. She is also emotionally
        awkward. Her skills are only limited to purely engaging in combat, and she
        is not very good at war planning/strategies and negotiation. Notable Attacks/Techniques:
        *Battle Trance Mode: If Mukuro is pushed to a certain limit, she would enter
        some sort of Trance, where time seems to slow for Mukuro. In this state, Mukuro''s
        speed and reflexes increase to an astounding degree. Note: Mukuro is dead
        in the canon storyline of Danganronpa, so more of her stats come from the
        Spinoff Novels such as Danganronpa Zero and IF. ==Notable Matchups== Victories:
        Losses: Inconclusive: Kamen Rider Ouja (Kamen Rider Ryuki) Ouja''s Profile
