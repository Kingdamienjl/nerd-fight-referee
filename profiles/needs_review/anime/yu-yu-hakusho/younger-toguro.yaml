        *Finger Bullets: Toguro can flick his thumb so rapidly that it creates fast
        and powerful air bullets like those from a machine gun, as a result of a tiny
        vacuum erupting from the action. *Soul Absorption: In order to fuel his 100%
        power boost, Toguro can absorb the souls of significantly weaker humans and
        demons around him through two openings on his shoulders. *Deadly Arm Sweep:
