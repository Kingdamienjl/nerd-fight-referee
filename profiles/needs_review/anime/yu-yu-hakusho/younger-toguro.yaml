- id: claim-weaknesses-ef0a712f
  section: weaknesses
  axis: weakness
  text: 'Toguro cannot fly, and is heavily lacking in truly powerful ranged attacks
    other than his Finger Bullets and Deadly Arm Sweep. Notable Attacks/Techniques:
    *Muscle Transformation: Toguro can alter the concentration of demonic ki in his
    muscles, and control it so he can choose to use a specific percentage of his strength,
    such as 20%, 30%, etc. He can even go into an overload mode of 100%, which gives
    him an even greater boost to strength, speed, and durability. *Finger Bullets:
    Toguro can flick his thumb so rapidly that it creates fast and powerful air bullets
    like those from a machine gun, as a result of a tiny vacuum erupting from the
    action. *Soul Absorption: In order to fuel his 100% power boost, Toguro can absorb
    the souls of significantly weaker humans and demons around him through two openings
    on his shoulders. *Deadly Arm Sweep: Toguro simply charges energy into his arm
    before lashing out with a backhanded sweeping gesture. This is enough to release
    a cutting energy wave, powerful enough to instantly kill any lower-class demon
    it contacts, or create an oblong shaped energy ball which can cause huge explosions
    on contact with objects in its path. This power can also be used by simply extending
    his arm and firing an energy blast from it, as he demonstrated against Genkai
    before killing her. Another possible demonstration of this power is the red energy
    waves that Toguro can produce while punching, one of which he used to casually
    destroy the entire Dark Tournament fighting ring. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{Discussions}} Category:Characters Category:Yu Yu Hakusho
    Category:Antagonists Category:Anime Characters Category:Manga Characters Category:Primary
    Antagonists Category:Demons Category:Martial Artists Category:Male Characters
    Category:Regeneration Users Category:Soul Users Category:Energy Users Category:Chi
    Users Category:Evil Characters Category:Villains Category:Weapon Masters Category:Sword
    Users Category:Shield Users Category:Aura Users Category:Absorption Users Category:Statistics
    Amplification Users Category:Leaders Category:Body Control Users Category:Extrasensory
    Perception Users Category:Enhanced Senses Users Category:Sound Users Category:Vibration
    Users Category:Acrobats'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
