- id: claim-weaknesses-77c7fd2d
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Kiai Cannon: Genkai releases an
    invisible blast of Spirit Energy from her body and directs her enemies launching
    them at great distances. *Spirit Gun: Like Yusuke, Genkai also possessed the ability
    to perform the Spirit Gun. She channels a wave of spirit energy through her right
    index finger *Spirit Shotgun: Scatters a barrage of weaker Spirit Guns to attack
    in multiple directions; used for striking multiple targets. *Spirit Healing: Genkai
    can help a wounded individual heal wounds at a much faster rate even when several
    bones are broken. Like she did to Kuwabara who was badly damaged from fighting
    Rando. *Paralyzing Touch: Can paralyze someone just by touching them. *Reihado-ken:
    An ancient technique that has been mastered by only a few people. Users of reihado-ken
    have the ability to manipulate their cells when they exert full power. In this
    regard, their bodies return to the point when they were the strongest, at their
    prime state of power. Or for that matter, speed them up to their prime state of
    power. For Genkai, the technique transformed her into her 20 year old self *Spirit
    Wave: Differs greatly from Yusuke''s technique from the same name. She strikes
    her opponents in an attempt to purify them. And cannot kill entities with a pure
    heart, but it prurges them from corruption or demonic possessions. It can prove
    fatal against those with evil hearts and uses up great concentrations and energy
    to perform. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
    Category:Characters Category:Yu Yu Hakusho Category:Female Characters Category:Anime
    Characters Category:Manga Characters Category:Humans Category:Chi Users Category:Energy
    Users Category:Good Characters Category:Martial Artists Category:Teachers Category:Wise
    Characters Category:Healers Category:Regeneration Users Category:Power Bestowal
    Users Category:Age Users Category:Aura Users Category:Psychics Category:Elders
    Category:Extrasensory Perception Users Category:Enhanced Senses Users Category:Soul
    Users Category:Attack Reflection Users Category:Acrobats Category:Purification
    Users Category:Sound Users Category:Vibration Users'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ff65e4a5
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Aura, Acrobatics, Energy Manipulation\
    \ (Ability to fire destructive blasts of Reiki), Skilled Martial Artist, Power\
    \ Bestowal (Can pass on her own spiritual powers to a successor), Can return her\
