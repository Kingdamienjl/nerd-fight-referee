  intelligence:
    text: Gifted (As the chosen Saint of the god-slaying Pegasus Cloth, Seiya possessed
      great potential from an early age. Having been subjected to the brutal militaristic
      regimen of Sanctuary from the age of six, Seiya became an expert in hand-to-hand
      combat. He can instinctively analyse his opponent's strengths, weaknesses, and
      techniques, being able to pick apart and nullify nearly any technique he's seen
      once. His skills grew exponentially throughout his adventures, going toe-to-toe
      with the Gold Saints after a relatively short period. He would even go on to
      battle the gods, who had spent millennia perfecting their grasp of Cosmo and
      fighting ability. However, due to being sheltered in Sanctuary for so long,
      Seiya can be impatient, reckless, and immature. Also, he never received formal
      education and is thus lacking in academic matters. On the other hand, his training
      has also given him in-depth knowledge of astronomy and mythology as well as
      a working knowledge of human biology to utilize against his foes)
    source_ids:
    - vsbattles-pegasus-seiya-saint-seiya
