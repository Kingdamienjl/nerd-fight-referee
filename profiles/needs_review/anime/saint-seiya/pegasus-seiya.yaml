- id: claim-weaknesses-cacbfc61
  section: weaknesses
  axis: weakness
  text: 'Seiya cannot survive in space for very long. Impulsive and brash at times
    | None Notable {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; |Feats: |- | |-|Pre-Sanctuary Arcs= Feats pertaining to Seiya before he
    fought the Gold Saints and unlocked Seventh Sense. ====Strength==== * Punched
    the ground so hard, it created a massive crater and was compared to a meteor crash.
    * Embarrassed the massively larger Cassios, cutting off his ear and generally
    beating him down. * Sent the massively larger Cassios flying with a kick, shattering
    the pillar he is knocked into. * Created an even larger massive crater. * Did
    a punch catch on Cassios. * Defeated Cassios with the first Pegasus Ryuseiken
    of the Series. * Without bothering to use Cosmo, overpowered the 2nd Dan black
    belt Tatsumi Tokumaru. * A casual dust-up between Seiya and Jab caused this much
    damage. * A casual jump kick registered 1375 KGW and would have ruptured all the
    organs of an average human. * Had a grip strength of 4000 KGW and shattered Bear
    Geki''s cloth. Bear Geki could strangle bears. * Defeated Dragon Shiryu who can
    punch away the bottom floor of a tower and reverse the Lushan waterfall with a
    kick. * Oneshot a bunch of Black Saints while clothless. * Killed the Black Pegasus
    with a Pegasus Ryuseiken. * While Clothless, cracked Phoenix Ikki''s cloth and
    sent him flying. * Sent Ikki flying and shattered his cloth before proceeding
    to beat him down. * Pushed back the Silver Saint Lizard Misty''s Marble Tripper
    and killed him (yes, that''s a dude, despite the name and face) with a Pegasus
    Rolling Crush. For comparison, Lizard Misty''s first use of Marble Tripper shook
    the entire Mount Fuji volcanic chain and collapsed the inside of it. * Sent the
    Silver Saint, Whale Moses, flying with a single punch and cracked his cloth. *
    Cracked Whale Moses'' cloth and broke his hand with a kick, then shattered it
    with a Pegasus Ryuseiken before killing him with a Pegasus Rolling Crush. * While
    wearing a gold cloth, sent Gold Saint Leo Aoilia flying hard enough to shatter
    concrete and actually hurt him. * Killed Silver Saint Sagitta Ptolemy with a Pegasus
    Ryuseiken.'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
