        times | None Notable|Suffers from what appears to be strokes and heart attacks,
        he also can''t properly burn his Cosmos|None notable Notable Attacks/Techniques
        : *Pegasus Ryusei Ken: (Pegasus Meteor Fist) Pegasus Seiya elevates and burns
        his Cosmos, tracing the Stars of the Pegasus Constellation with his hands,
        his fiery aura growing and flowing around him. Upon reaching the peak of his
        power, said aura manifests as the image of a Pegasus. Focusing his Cosmos
        within his right fist, he releases a great quantity of his power in the form
        of many Beams of Cosmic Energy. Originally, when Seiya was only capable of
        reaching speeds of Mach 1, he was capable of releasing merely 100 Meteors.
        However, as his control of Cosmos and speed increased, so did the number of
        Meteors / Shooting Stars, being around 100 Million to 1 Billion at Faster
        than Light Speeds, and likely Hundreds of Trillions in his most powerful forms.
        *Pegasus Rolling Crush: Rushing towards his opponent, Pegasus Seiya grapples
        his foe from behind to immoblize them. Then, burning his Cosmos to it''s limit,
        both Seiya and his enemy are surrounded by a massive aura, which eventually
        propels both Seiya and his enemy towards the skies above at insane speeds.
        Finally, they descend to the Earth again at the same speed, eventually crashing
        into the ground, dealing great damage. *Pegasus Suisei Ken: (Pegasus Comet
        Fist) Pegasus Seiya''s most powerful attack. He burns his Cosmos to it''s
        limits, heavily focusing his energy in his right fist. Then, instead of releasing
        said energy in the form of his Pegasus Meteor Fist, Seiya combines each of
        his Meteors into one massive, extremely powerful Comet of Cosmo Energy, which
        he fires towards his opponent.'
