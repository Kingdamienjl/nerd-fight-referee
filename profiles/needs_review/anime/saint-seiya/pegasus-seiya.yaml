    - field: weaknesses
      value: 'Seiya is known for being impassive and brash in fights and rarely plans
        Notable Attacks/Techniques: * Cosmo: Cosmo is the mythical universal energy
        that originates from the Big Bang that all Saints are able to use which allows
        them to perform superhuman feats. Those who can use Cosmo can manipulate it
        and launch it out towards an opponent and destroy them at the atomic level
        or use Cosmo to charge up their own body to make their bodies burn at high
        temperatures and make the Saint far stronger. :* Pegasus Meteor Fist: Pegasus
        Seiya''s signature technique is the Pegasus Meteor Fist where he unleashes
        waves of energy punches. At the beginning of the series, he could unleash
        100 punches at around Mach 1 speed but as he used the technique it became
        stronger to the point that he could unleash hundreds of trillions of punches
        at speeds that were billions of times the speed of light ::* Pegasus Comet
        Fist: By concentrating all of his Pegasus Meteor Fist punches into one spot,
        it turns into the Pegasus Comet Fist which is as strong as all of the punches
        combined into one attack. :* Pegasus Rolling Crush: The Pegasus Rolling Crush
        is a technique where Pegasus Seiya gets behind his opponent before grabbing
        them and jumping into the air before slamming them back down with all of his
        Cosmo energy. ::* Sixth Sense: After going through his training to become
        a Saint, Seiya managed to unlock the Sixth Sense after years of training.
        :::* Cosmo Manipulation: Upon gaining the Sixth Sense, Seiya became able to
        use his internal Cosmo as a weapon to fight against his opponents. Seiya mostly
        uses his Cosmo to launch out projectiles from his hands to overwhelm an opponent
        and break down their body at the atomic level. :::* Reactive Evolution: Thanks
        to his usage of Cosmo, Seiya is able to instantly gain resistance to any attack
        he has been attacked by, allowing him to tank attacks even if they are strong
        enough that they would normally almost kill him as well as negating any negative
        effects the attack may have had. ::* Seventh Sense: During his battles against
        the Gold Saints, Seiya managed to unlock the Seventh Sense to battle against
        the Gold Saint. :::* Miracles: ::* Eighth Sense: Before jumping into his the
        Underworld, Seiya managed to unlock the Eighth Sense by unleashing all of
        his Cosmo while entering the Underworld in the attempt to try and stay in
        the Underworld whilst still alive.'
      source_id: character-stats-profiles-pegasus-seiya
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
