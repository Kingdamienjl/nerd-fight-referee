- id: claim-weaknesses-a9a3b40c
  section: weaknesses
  axis: weakness
  text: "The Phoenix is willing to die peacefully if his opponents could change their\
    \ form to Esmeralda, Ikki's deceased lover. Notable Attacks/Techniques: thumb|right|250px|H\u014D\
    yoku Tensh\u014D *H\u014Dyoku Tensh\u014D (\u9CF3\u7FFC\u5929\u7FD4, Soaring Phoenix\
    \ Wings): Ikki concentrates his Cosmos, the aura that surrounds his assuming the\
    \ shape of a fiery phoenix. Then, he pushes his palms forwards, producing a tremendous\
    \ whirlwind and releasing his cosmos as a burning wave that engulfs his opponent.\
    \ * H\u014D\u014D Genmaken (\u9CF3\u51F0\u5E7B\u9B54\u62F3, Phoenix Illusion Demonic\
    \ Fist): A mental attack. Ikki focuses his Cosmos and pierces the opponent's mind\
    \ with a swift punch. While the external pain is insignificant, comparable to\
    \ a mosquito's bite, the internal pain is unbearable. Ikki's opponent is trapped\
    \ in hellish illusions, where he is exposed to his deepest fears and constant\
    \ torturous death. At a minimum, the attack will leave its victim dazed and incapable\
    \ of reacting; at worst, it will literally destroy their minds. ==Gallery== File:Saint-seiya-phoenix-ikki-img.jpg\
