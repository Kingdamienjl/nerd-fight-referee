    - field: weaknesses
      value: "His signature move leaves his heart exposed for a millisecond, allowing\
        \ fast-enough characters to land lethal blows as he's defenseless. Notable\
        \ Attacks/Techniques: *Rozan Sh\u014D Ry\u016B Ha: (\u5EEC\u5C71\u6607\u9F8D\
        \u8987; Rising Dragon Punch): Shiryu intensifies his cosmos and gives an upward\
        \ blow be it punch or kick. The upward release of energy is comparable to\
        \ the image of a majestic dragon rising towards the sky. A breath and drag\
        \ violently hitting the opponent rose into the air with the image of a dragon\
        \ devouring the opponent; Sometimes the attack is not completely vertical\
        \ as when it slightly rotates around its prey. Unlike the techniques of the\
        \ other Bronze Saints, however, Shiryu's Rozan Rising Dragon Force does have\
        \ one weakness\u2014while performing the move, his heart will be left open\
        \ for a millisecond. Only three people in the series have noted this: his\
        \ master Libra Dohko, Bronze Saint Pegasus Seiya, and Gold Saint Capricorn\
        \ Shura. When fighting Shura, Shiryu used this weakness as a decoy to lure\
        \ Shura to hew his heart, then Shiryu was able to hurt Shura successfully.\
        \ *Rozan Ry\u016B Hi Sh\u014D: (\u5EEC\u5C71\u9F8D\u98DB\u7FD4; Soaring Mountain\
        \ Dragon): An attack similar to Rozan Sho Ryu Ha, but in a horizontal forward\
        \ rather than upward. *Rozan Hyaku Ry\u016B Ha: (\u5EEC\u5C71\u767E\u9F8D\u8987\
        ; One Hundred Rising Dragons): Shiryu learned it from watching his master\
        \ Dokho's battle, even though he was blind at that moment. Dokho told Shiryu\
        \ that his kindness was his disadvantage but at the same time his advantage.\
        \ As well as removing any regret, Shiryu transcended the heart weakness of\
        \ Rozan Rising Dragon Force. Standing with legs apart and the palms of his\
        \ hands facing the opponent, he erupts his cosmos as intensely as possible\
        \ while throwing a horde of 100 Dragons towards the enemy who is destroyed\
        \ by the devouring dragons. *Rozan K\u014D Ry\u016B Ha: (\u5EEC\u5C71\u4EA2\
        \u9F8D\u8987; Enraged Dragon Force): Shiryu burns his Cosmos to the limit\
        \ before capturing his opponent from behind and pushing the limit of Rozan\
        \ Sh\u014D Ry\u016B Ha creating the Rozan K\u014D Ry\u016B Ha, the upward\
        \ force launching Shiryu, carrying his target, into the skies. The two continue\
        \ to climb until their bodies are incinerated and pulverized by the friction\
        \ caused by the speed. A suicide move intending to take the user's opponent\
        \ with them to death, the Rozan Ko Ryu Ha is known as a forbidden technique\
        \ to Shiryu. It was stated by his master Dohko to be the most powerful existing\
        \ attack, which not even he could survive once Shiryu mastered it. *Excalibur:\
        \ (\u8056\u5263, Ekusukarib\u0101): After defeating Capricorn Shura, Shiryu\
        \ is entrusted with the Gold Saint's legendary technique Excalibur. Rather\
        \ than a physical blade, Excalibur is a deadly Cosmo focused with precise\
        \ sharpness on Shiryu's right arm. Although Shiryu's version of the sword\
        \ was not as defined as Shura's (Shiryu's Excalibur lies only in his right\
        \ arm, while Shura's can be unleashed from any of his limbs), the Dragon later\
        \ refined it to the point of rivaling Shura's and used it to cut the unbreakable\
        \ golden spear of Chrysaor Krishna, the powerful Mariner General, during the\
        \ Poseidon Chapter. Excalibur has also shown to negate regeneration, as he\
        \ was able to use it to stop the regeneration of the Dragon Faceless in Episode\
        \ G Assassin. ==Gallery== File:Setshiryu017.jpg File:Shiryu.jpg ==Notable\
