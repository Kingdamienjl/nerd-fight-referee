    - field: weaknesses
      value: 'Dislikes Fighting and tends to hold back to prevent himself from grievously
        injuring his opponent. Notable Attacks/Techniques: NebulaChain.gif|Nebula
        Chain NebulaChainThunderWave.gif|Nebula Chain: Thunder Wave CircularChain.gif|Rolling
        Defense NebulaStream.gif|Nebula Stream NebulaStorm.gif|Nebula Storm *Nebula
        Chain: The Andromeda Saint''s signature technique which allows him to manipulate
        the chains of his Cloth however he pleases. At the most basic, the Nebula
        Chain is a straight-forward attack where the chains rapidly slice and wrap
        themselves around the enemy. This attack can be improved by using the Thunder
        Wave of the chain., which in Shun''s words, "will cross time and space to
        prevent your escape, no matter how many thousands of light years you run."
        *Rolling Defense: A simple defensive technique that utilizes Shun''s chains
        in one of two ways: he will either twirl the chains around himself to create
        a barrier or set them on the ground to mimic a circular web; this was later
        named the Circle Defense. In web mode, the chains erect a special field that
        will shock enemies or summon chains to slice them should they attempt to enter
        it. *Great Capture: A technique that twists the chains to paralyze, capture,
        or immobilize foes. Shun also uses other ways of capturing opponents with
        Boomerang Shoot, Spiral Duct, etc. *Nebula Stream: A defensive attack that
        links directly to Shun''s Cosmo. It entangles the foe with streams of the
        Andromeda cosmos in an attempt to paralyze them. As Shun becomes more determined
        to use his true power, the stream will eventually transfigure into the Nebula
        Storm technique. **Nebula Storm: When Shun''s Cloth and Chain are destroyed,
        (or if he expels them voluntarily) he gains full access to his Cosmos, allowing
        him to concentrate all of it into a single powerful burst of spiraling energy.
        Because of its extremely destructive nature, Shun will only use it as a last
        resort. ==Gallery == File:Setshun014.jpg File:C3d841d38ad42fc68902403c72953539.jpg
