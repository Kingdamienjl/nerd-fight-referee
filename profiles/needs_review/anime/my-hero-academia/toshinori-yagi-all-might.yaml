        Nomu's Shock Absorption had a limit and overpowering it through repeated blows.
        Through his early career, he obtained enough experience to rival All For One's
        century worth of experience and ultimately defeat him. He personally designed
        the specifications for his Armored All Might suit with the sole purpose of
        fighting All For One, devising creative ways to employ its systems in combat.
