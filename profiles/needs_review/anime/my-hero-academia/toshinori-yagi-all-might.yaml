power_scale:
  tier:
    text: High 6-A, higher with Plus Ultra | High 6-B, higher with Plus Ultra | High
      6-B, higher with Equipment, far higher with Self-Destruction
    source_ids: &id002
    - mediawiki-47276
    confidence: 0.8
  attack_potency:
    text: 'Multi-Continent level (Stated that over 300 punches in his weakened state
      are on par with 5 punches in his prime, making him 60 times strongerMy Hero
      Academia Vol. 3 Chapter 1915 Petatons of TNT), higher with Plus Ultra (Was able
      to punch Prime All For One''s head off after having his guts ripped outMy Hero
      Academia Vol. 40 Chapter 408) | Large Country level (Stronger than Deku when
      he instantly blasted away a hole through a thunderstorm of unprecedented scale
      while on his last legsMy Hero Academia Vol. 42 Chapter 423We''re scaling Weakened
      All Might to Deku''s Smash because it was intercepted by Kurogiri, who is slower
      than Weakened All Might. Since One For All cannot enhance speed and power separately,
      if Deku was slower than Weakened All Might at this moment, that means he was
      weaker than him as well. Note that Deku wasn''t using 100% when performing this
      feat because he was heavily tired and injured, and was said to be on his last
      legs.250 Teratons of TNT), higher with Plus Ultra (Can go beyond 100% of his
      power to surpass his enemies. Overpowered All For One with his United States
      of SmashMy Hero Academia Vol. 11 Chapter 94) | Large Country level (Can easily
      pierce through Rewind All For One''s muscles using "Blackwhip", harm him using
      "Shoot Style Smash", and stab through his abdomen with "Superacid Injection:
      Pinky". All For One in a younger and more fragile state could survive blasts
      from Dynamight''s Awakened ClusterMy Hero Academia Vol. 40 Chapter 406), higher
      with Equipment (His "Can''t Stop Twinkling" laser beam held All For One in place
      and requires far more energy than any of his other weapons), far higher with
      Self-Destruction (All Might believed this would be enough to revert All For
      One into a kindergartner, whereas it took numerous Cluster explosions from Dynamight
      to revert him into a babyMy Hero Academia Vol. 40 Chapter 409), Can ignore conventional
      durability (Can inject an acid so corrosive it was dissolving away All For One''s
      body. Can shoot a laser powerful enough to nearly burn All For One to nothing)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: FTL (All For One considered All Might's weakened state to be far too slow
      compared to his prime. Deku compared his Faux 100%, which overwhelmingly blitzed
      Lady Nagant's fastest bullet, to All Might in his heyday.My Hero Academia Vol.
      32 Chapter 315 His speed was stated to be on par with Complete ShigarakiMy Hero
      Academia Vol. 35 Chapter 3461.68c) | Relativistic+ (Faster than Endeavor, who
      was able to somewhat compete against Incomplete ShigarakiMy Hero Academia Vol.
      28 Chapter 2740.77c) | FTL reactions and combat speed (Managed to keep up with
      Rewind All For One, whose speed was fast enough to blitz the X-66s that could
      avoid light-speed radio wavesMy Hero Academia Vol. 40 Chapter 403), FTL with
      Equipment (Can use different equipment to boost his speed. Was able to dodge
      a laser with his full power thrusters), Speed of Light with Can't Stop Twinkling
      (Can shoot a real laser that travels at the speed of light1c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: 'Class P (Vastly stronger than Star and Stripe, who could generate this
      much force by jumpingMy Hero Academia Vol. 34 Chapter 330368.66 Trillion Metric
      Tons) | Class P (Capable of pushing back against a force of over a hundred trillion
      tonsMy Hero Academia: Two Heroes165.96 Trillion Metric Tons) | Class P (Could
      momentarily stop Rewind All For One''s charge with "Blackwhip" and "Cellophane"),
      higher with Equipment (Capable of completely restraining Rewind All For One
      with "Tentacole". Can hold All For One in place with "Binding Rounds: Grape
      Juice")'
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Multi-Continent level, higher with Plus Ultra | Large Country level, higher
      with Plus Ultra | Large Country level (Can punch through a younger All For One's
      throat), higher with Equipment (Can enhance the power of his strikes with "Sugarman")
    source_ids: *id002
    confidence: 0.8
  durability:
    text: 'Multi-Continent level (Can withstand the recoil of his own punches, often
      relying on his immense durability to push through virtually any enemy attack)
      | Large Country level (More durable than Endeavor, who got pierced by Rivet
      Stab while All Might was not) | Large Country level (Can endure attacks from
      Rewind All For One, but they greatly damage his armor and body), Large Country
      level+ with Equipment (His "Red Riot" shield took Rewind All For One''s Impure
      Beam head-on, surviving the attack but depleting 66% of its durability. His
      "Utility Cape Auto-Guard: Tsukuyomi" armor managed to protect him from Rewind
      All For One''s Impure Beam, which was boosted by several other Quirks430 Teratons
      of TNT)'
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Has proven on numerous occasions to have the ability to break
      his limits. In his prime, All Might was able to perform hero work for more than
      72 consecutive hours straight at top conditions, and has never been shown to
      get tired even when fighting against multiple villains. Defeated prime All For
      One while having his guts ripped out of his body) | Superhuman (Can only fight
      for about three hours a day, which is later decreased to fifty minutes after
      his fight with the U.S.J. Nomu. However, he is capable of forcing himself to
      last longer than this through sheer willpower) | Superhuman (Despite having
      a fragile body and not even holding One For All's embers, his willpower and
      motivation are so unbelievably powerful that he can keep fighting for over 20
      minutes even while having multiple fractured ribs, full body contusions, respiratory
      malfunction, and comminuted fractures in his clavicle and left humerus, all
      while suffering through unimaginable pain)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, up to Tens of Kilometers with One For All (Stronger
      than his weakened form) | Standard Melee Range, up to Tens of Kilometers with
      One For All (Changed the weather with the mere shock wave of a Detroit Smash.
      Comparable to 100% Deku, who was able to destroy a storm with an enormous shock
      wave) | Standard Melee Range, up to Hundreds of Meters with Equipment (His "Can't
      Stop Twinkling" laser could reach from far above buildings to the ground)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (All Might was the top-ranked hero in Japan due to his countless
      acts of heroism, having led multiple operations against massive villain organizations
      and saved innumerable lives during large-scale disasters. He is an expert in
      hand-to-hand combat with intelligence to match his strength, deducing that Nomu's
      Shock Absorption had a limit and overpowering it through repeated blows. Through
      his early career, he obtained enough experience to rival All For One's century
      worth of experience and ultimately defeat him. He personally designed the specifications
      for his Armored All Might suit with the sole purpose of fighting All For One,
      devising creative ways to employ its systems in combat. He was also able to
      successfully provoke All For One into fighting him, despite the villain fully
      knowing the manipulation and how counterproductive it was to his plans)
    source_ids: *id002
    confidence: 0.8
