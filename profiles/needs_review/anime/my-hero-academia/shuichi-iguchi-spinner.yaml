power_scale:
  tier:
    text: 8-A | 7-C, higher with Body Bulk and Scalemail
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Multi-City Block level (Traded several blows against Mandalay) | Town level
      (Has been training with Gigantomachia alongside his companions for a month and
      a half, making him much stronger than before. Capable of harming those that
      can harm himself, like those in the Liberation Army), higher with Body Bulk
      and Scalemail (Capable of fighting on par with Tentacole with Body Bulk, and
      was able to overpower him with Scalemail)
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic reactions and combat speed (Managed to intercept Magne with a
      knife when she was about to attack a 5% Deku enhanced by adrenaline) | Hypersonic
      reactions and combat speed (Should be faster than before), Hypersonic+ with
      Body Bulk and Scalemail (Could keep up with Tentacole with Body Bulk and outpaced
      him with Scalemail)
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class 50 (Can easily swing around his Makeshift Sword, which is made of
      numerous knives and blades taped together and is more than half the size of
      his body) | Class 50, Class K with Body Bulk and Scalemail (Overpowered Tentacole)
    source_ids: &id002
    - mediawiki-2729450
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level | Town level, higher with Body Bulk and Scalemail
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level (Should at least have comparable durability to Grape
      Juice) | Town level (Comparable to his teammates as he fought alongside them
      against Gigantomachia and took attacks from him that could harm Shigaraki, who
      is this durable), higher with Body Bulk and Scalemail
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Could fight Gigantomachia alongside his companions for extended
      periods of time. Endured having his arm impaled and continued fighting without
      any issues. Even after having his body destroyed by Present Mic's Voice, Spinner
      still managed to stand up and wake up Kurogiri)
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with Equipment
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Spinner has showcased some impressive observation skills,
      being able to notice the improvement that Shigaraki's Quirk had during their
      training with Gigantomachia. He was also able to realize that Gigantomachia
      cannot use his full strength in battle because he always waits for instructions
      from his master, compelling Spinner to wake up an unconscious Shigaraki so that
      he could relay orders to the giant, which proved to be successful)
    source_ids:
    - vsbattles-shuichi-iguchi-spinner-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
