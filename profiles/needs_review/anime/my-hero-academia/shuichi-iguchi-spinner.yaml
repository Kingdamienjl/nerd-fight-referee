  axis: weakness
  text: Spinner is obsessed with Stain and his ideals, and is thus much more morally
    inclined than the other members of the League, going so far as to protect Deku
    due to the fact that Stain saw him as fit to live. He also can be distracted when
    a girl compliments him. | The stress of having multiple Quirks has caused him
    to become mentally unstable, making it difficult for him to even speak or think
    clearly. Scalemail causes him to bleed as he uses the Quirk, as well as intensifying
    the mental strain he was enduring from Body Bulk.
