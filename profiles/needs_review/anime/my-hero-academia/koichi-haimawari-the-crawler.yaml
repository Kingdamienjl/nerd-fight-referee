  attack_potency:
    text: Multi-City Block level+ with Slide and Glide (Can draw blood from Octoid,
      who is strong enough to seriously damage a younger Eraser Head with a single
      attack, who was comparable to Knuckleduster) | Multi-City Block level+ with
      Slide and Glide (Should be stronger than he was two years ago. Able to harm
      Number 6 with his attacks in low-impact mode, and would have knocked him out
      had he not missed) | Multi-City Block level+ with Slide and Glide (At full power,
      he managed to destroy and blow away a punch from Number 6's Destruction Style,
      and vastly overwhelm him. Was stated by All For One to possesses an abnormally
      powerful output. Able to slow down a falling commercial plane)
    source_ids:
    - vsbattles-koichi-haimawari-the-crawler-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Subsonic with Slide and Glide (Able to outrun a bus travelling at top speed),
      Hypersonic reactions and combat speed (Can keep up with Instant Villains, who
      can land hits on Knuckleduster) | High Hypersonic (Was able to outpace and dodge
      attacks from Number 6 while he was using his normal Overclock speed) | Massively
      Hypersonic (Able to fully match the speed of Number 6's Lightning Style), higher
      Instinctive Reactions (His body's subconscious reactions are even faster than
      Overclock, making it impossible for "Hi-Crawler" Number 6 to land a direct attack
      on him. All For One suggested that Number 6 should never encounter Koichi again,
      and that trying to overwhelm him with speed alone is an uphill battle. Intercepted
      one of Number 6's strikes while he was using Overclock)
    source_ids:
