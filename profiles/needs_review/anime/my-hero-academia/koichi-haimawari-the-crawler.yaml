  intelligence:
    text: Above Average (Despite his lack of hero training, Koichi has shown that
      he is the type of person who thinks before he acts, planning out a scenario
      to rescue Pop Step from a group of delinquents, though he heavily overestimated
      his physical capabilities in doing so. However, he has also proven himself to
      be a quick learner, greatly improving his mastery over his Quirk after only
      a few pointers from Knuckleduster and Tensei. As he is usually on the receiving
      ends of hits, his body has learned to unconsciously avoid or block attacks,
      using his own Quirk by pure instinct. He has amassed several years of experience
      after becoming a Pro Hero, maximizing the full potential of his Quirk)
