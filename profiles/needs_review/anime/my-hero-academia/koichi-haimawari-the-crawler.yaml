        and suddenly across that surface without any restrictions) All previous abilities
        to a greater extent, plus: Accelerated Development (Has been shown on multiple
        occasions to improve his Quirk rapidly during battles, and vastly surpassing
        his previous limits), Pseudo-Flight (Can perform two mid-air jumps. Can boost
        into the air and fly for a limited amount of time), Damage Boost (Can increase
