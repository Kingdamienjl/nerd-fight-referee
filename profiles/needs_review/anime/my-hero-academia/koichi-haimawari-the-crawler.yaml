- id: claim-weaknesses-7f5972eb
  section: weaknesses
  axis: weakness
  text: Koichi is shy and gets nervous easily. He is not particularly motivated to
    explore the limits of his Quirk on his own. Loses balance if he tries to glide
    with only two limbs. Will lose his balance if he fires his beams without locking
    his feet in place beforehand, though he seems to have an easier time firing while
    moving backwards at the same time. Using only his feet to stick to a surface can
    randomly stop working and send him falling. Koichi's unconsciously holds back
    the power of his Quirk when used against people, and as such can't fire off his
    full power against them. | None notable after the time skip.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0afbae0d
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Basic Hand-to-Hand Combatant (Has received
    basic boxing lessons from Knuckleduster), Energy Manipulation (Can generate energy
    on his hands and feet that let him slide across the ground/walls, stick onto walls,
    or shoot out energy attacks), Gravity Manipulation (His Slide and Glide was described
    as being gravity repulsion), Surface Scaling, Acrobatics (With his hands and feet
    touching any surface he can move freely and suddenly across that surface without
    any restrictions) All previous abilities to a greater extent, plus: Accelerated
    Development (Has been shown on multiple occasions to improve his Quirk rapidly
    during battles, and vastly surpassing his previous limits), Pseudo-Flight (Can
    perform two mid-air jumps. Can boost into the air and fly for a limited amount
    of time), Damage Boost (Can increase the power, speed, and range of his attacks
    if he concentrates enough) All previous abilities to a greater extent, plus: Supernatural
    Willpower (Was stated by All For One to have a massive source of fiery passion
    that allows him to evolve), Expert Hand-to-Hand Combatant (Able to fight on par
    with Number 6 in hand-to-hand combat, and even managed to surpass him), Enhanced
    Energy Manipulation (Can produce the energy from his Quirk on any part of his
    body), Flight (Can jump in the air without any limitations, and can fly freely
    through the air), Forcefield Creation (Able to produce energy shields on any part
    of his body to protect himself from attacks, and could envelope damaged parts
    of his body using his Quirk to hold them together, similar to a cast), Instinctive
    Reaction (His body can instinctively dodge or block incoming attacks), Resistance
    to Heat (His forcefield protected him from the massive heat of Number 6''s plasma
    body)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
