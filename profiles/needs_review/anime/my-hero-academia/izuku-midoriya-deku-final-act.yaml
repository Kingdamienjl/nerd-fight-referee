    - field: weaknesses
      value: 'Using 100% of One For All''s power will break the bones of the limb
        on which it is used. During the Final War Arc this is no longer a weakness,
        as he has gained complete mastery over One For All. Danger Sense has a range
        limitation, as it failed to detect Lady Nagant''s bullet until it was closer
        to him. Danger Sense will not trigger if the enemy lacks malice or desire
        to harm Deku, he normally tries to limit the time spent in this state to five
        minutes at most. However, A single punch at 45% of his power was enough to
        take down Muscular., He could outpace Lady Nagant''s fastest bullet from hundreds
        of meters away., His attacks with Gearshift: Overdrive carry so much energy
        that they are warping the very laws governing reality., He can unleash shockwaves
