  intelligence:
    text: 'Gifted He has displayed an exceptional level of intelligence across several
      situations, often relying on his intellect more than his Quirk.My Hero Academia
      Vol. 3 Chapter 26 He is a fast learner, which allowed him to understand most
      of One For All''s mechanisms in a short time and work around its limitations.My
      Hero Academia Vol. 6 Chapter 48 He has sharp observation and analytical skills,
      demonstrated by creating a plan to escape dozens of villains while trapped on
      a yacht.My Hero Academia Vol. 2 Chapter 15 Gran Torino even praised his intelligence,
      stating that Deku is the kind of person who is always thinking ahead.My Hero
      Academia Vol. 6 Chapter 49 His academic grades are among the highest in Class
      1-A, proving that his constant training with One For All doesn''t interfere
      with his studies.My Hero Academia Vol. 7 Chapter 60 He possesses a borderline
      encyclopedic knowledge of heroes, including their Quirks and strategies, making
      him highly adaptable. Deku proved to be a formidable strategist, devising a
      successful plan for Class 1-A to lure in and capture a dangerous group of criminals.
      His time at U.A. High School enabled him to develop and perfect his signature
      Shoot Style. He has gained invaluable fighting experience and has mastered all
      of his Quirks by tirelessly beating villains for months before returning to
      U.A. High School. His analytical skills have developed to such an extent that
      he was able to analyze Lady Nagant''s movement patterns and accurately track
      her location down based solely on the trajectory of her bullets, even at night
      and under heavy rain. He quickly mastered Fa Jin mid-battle despite being the
      first time he was using it. He has showcased the skill to perform multiple mental
      processes at once,My Hero Academia Vol. 26 Chapter 251 effectively multitasking,
      a skill that is considered not practical for the human brain. He outskilled
      All For One in a one-on-one fight. He can instantly use ideas he came up on
      the fly, with his respect and admiration for Quirks allowing him to harness
      the true potential of One For All. In addition to his own intelligence, in Deku''s
      mind reside the consciousnesses of the former users of One For All, who have
      steadily awakened as the Quirk''s core stockpiled power. These past users can
      talk freely with Deku and thus give him information and advice during his battles.
      Standard Tactics: Deku typically starts his battles by activating One For All
      at its maximum available output.My Hero Academia Vol. 37 Chapter 367 He also
      wraps strands of Blackwhip around his neck, each charged with Fa Jin to power
      his Blackchain attack. He attempts to end battles quickly by immediately using
      Gearshift, which remains central to his tactics throughout the fight.My Hero
      Academia Vol. 40 Chapter 406 If driven to the point where Gearshift becomes
      a liability, he will consider granting the enemy this Quirk in such a violent
      manner that it can damage their soul, while adopting his Overlay form to replicate
      the speed he had with Gearshift.'
    source_ids: *id002
    confidence: 0.8
