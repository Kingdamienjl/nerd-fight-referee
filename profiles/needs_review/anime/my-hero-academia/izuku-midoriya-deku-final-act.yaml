      value: Superhuman (Deku trains relentlessly, even making exercises during his
        classes. Despite his timid demeanor, Deku has an iron will and will continue
        to fight for as long as he needs to. At the start of his career, he was capable
        of thinking coherently with a broken arm and two shattered legs while falling
        at terminal velocities after obliterating an Executor Bot. Later on he was
        able to endure the agonizing pain of using the full force of One For All many
        times, when a single use of 100% is enough to break the bones in his arm,
        all while receiving a beating from Muscular. He regained his composure shortly
        after, being able to travel from the top of a small mountain to his camp and
        was still able to keep fighting until the crippling pain of his untreated
        wounds finally forced him to stop. He can battle with Pixie-Bob's Earth Beasts
        for eight hours straight) | Superhuman (Has proven to be able to use Full
        Cowl 100% for several minutes without outside help, and has shown to be capable
        of fully enduring the pain of his broken bones) | Superhuman (Can endure having
        the power of his own smashes being reflected back at his limbs, tearing his
        muscles apart. He kept fighting despite several gaping holes being made in
        his body by laser beams)
