- id: claim-stamina-c1cf9640
  section: power_scale
  axis: stamina
  text: Superhuman (His incredible stamina has only grown as he continued his training
    to complete One For All. After the events of the Paranormal Liberation War, he
    has proven to be capable of defeating villains and traveling throughout the country
    for weeks on end, if not months,My Hero Academia Vol. 32 Chapter 316 without rest,
    all while keeping Blackwhip constantly active,My Hero Academia Vol. 32 Chapter
    317 showcasing a level of endurance rivaling that of All Might during his prime.
    Despite his extreme fatigue, he could still drive back the combined efforts of
    Class 1-A, and refused to take a rest until he spoke to All Might.My Hero Academia
    Vol. 33 Chapter 327 His immense pain tolerance has grown even further, to a point
    that even repeatedly breaking his limbs barely hampers his physical performance.
    He has also been able to bear the pain of bullet wounds for weeks. Fought Shigaraki
    for more than 20 minutes despite struggling to breathe, forcing his busted-up
    body far beyond its limit, all while enduring crippling agony. Even after this
    brutal, drawn-out battle, he still managed to prevail over All For One while on
    his last legs)
