    - field: weaknesses
      value: New Order can only have two rules in affect at once, and one of those
        two rules is usually used to grant herself super strength. In order to apply
        another rule, the name she calls out must be the same name the target in question
        identifies themselves as. Despite granting herself super strength, her physical
        abilities are still inferior to that of All Might. Her existence erasure has
        only been used on the air, and it shouldn't be assumed to work on anything
