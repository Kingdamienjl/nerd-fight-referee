    - field: intelligence
      value: Gifted (As the No. 1 and most capable Hero of America, she likely has
        many years of combat experience, and has even been shown to have received
        military training. She has excellent control over her Quirk and its applications.
        According to All For One, Star and Stripe has been the one keeping international
        criminal organizations at bay while All Might only dealt with Japan, and that
        she would prove to be far more than a mere nuisance to him. He even admitted
        he wanted to steal One For All before confronting her, showing just how much
        of a threat All For One viewed her as. It has been stated that she easily
        shrugs off cheap tricks and petty tactics from her enemies. She was able to
        deduce that the explosion of one of her teammates' jet wouldn't be enough
        to kill Shigaraki, deciding to create a rule that would revolt against other
        Quirks despite not fully knowing how the All For One Quirk worked. According
        to Commander Agpar, Star usually tackles her work and hero activities in an
        independent manner. Able to know with precision the location of her giant
        air construction despite it being completely invisible to the naked eye)
      source_id: mediawiki-4712408
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: New Order can only have two rules in affect at once, and one of those
        two rules is usually used to grant herself super strength. In order to apply
        another rule, the name she calls out must be the same name the target in question
        identifies themselves as. Despite granting herself super strength, her physical
        abilities are still inferior to that of All Might. Her existence erasure has
        only been used on the air, and it shouldn't be assumed to work on anything
        else. Her rule also can't arbitrarily affect another target that she hasn't
        touched through clever wording. For example, she cannot touch the air and
        make a rule that whoever touches the air will die. This Quirk does not grant
        her the power to resist the deconstruction effects of Decay.
      source_id: mediawiki-4712408
      provider_id: vsbattles
      authority: high
      confidence: 0.75
