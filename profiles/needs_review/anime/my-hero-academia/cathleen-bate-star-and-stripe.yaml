power_scale:
  tier:
    text: High 6-B with New Order, higher with Fist Bump To The Earth and Keraunos,
      far higher with Intercontinental Cruise Punch
    source_ids: &id002
    - mediawiki-4712408
    confidence: 0.8
  attack_potency:
    text: Large Country level with New Order (Has a rule placed on herself that grants
      her enough physical power to damage Incomplete Shigaraki, who is just as durable
      as All Might250 Teratons of TNT), higher with Fist Bump To The Earth (Inflicted
      greater damage on Shigaraki than she did with her enhanced strength rule) and
      Keraunos (Able to keep pinned down Shigaraki and his High-End Nomu, causing
      them relentless damage), far higher with Intercontinental Cruise Punch (Capable
      of using her special authority to launch the Tiamat Missiles and combine them
      all to perform a single ultimate strike. Inflicted severe injuries on Shigaraki,
      even though he had buried himself underground and wasn't directly hit by the
      explosion), Can ignore conventional durability (Can use her Quirk to stop a
      person's heart, or suffocate them by erasing the air)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ (Was capable of dodging Shigaraki's radio waves. Capable of
      catching real lasers out of the air with her bare hands0.77c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class P with New Order (Is capable of generating this amount of force by
      jumping.368.66 Trillion Metric Tons Was able to pin down Incomplete Shigaraki),
      higher with Fist Bump To The Earth (Stronger than she normally is with her enhanced
      strength rule) and Keraunos (Can keep pinned down Shigaraki and his High-End
      Nomu)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Large Country level with New Order (Her punches are strong enough to draw
      blood from Incomplete Shigaraki), higher with Fist Bump To The Earth, far higher
      with Intercontinental Cruise Punch
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small City level (Withstood a fraction of the explosion from the Tiamat
      Missiles without her enhanced strength rule1.66 Megatons of TNT), Large Country
      level with New Order (Is able to endure the recoil of her own physical blows),
      far higher with Fist Bump To The Earth (Took the explosion from the Intercontinental
      Cruise Punch completely unaffected)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (She is the No. 1 Pro Hero of America and, as such, is far superior
      to any hero-in-training who can battle for hours on end. Wasn't shown to get
      tired at all during her confrontation with Shigaraki. Has endured harsh military
      training)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, up to Tens of Kilometers with New Order (Can shape
      the air into a copy of herself that is 1000 times bigger. Her Fist Bump To The
      Earth blew away the sky in a range of tens of kilometers. Her giant laser Keraunos
      could reach all the way to the bottom of the ocean)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (As the No. 1 and most capable Hero of America, she likely has many
      years of combat experience, and has even been shown to have received military
      training. She has excellent control over her Quirk and its applications. According
      to All For One, Star and Stripe has been the one keeping international criminal
      organizations at bay while All Might only dealt with Japan, and that she would
      prove to be far more than a mere nuisance to him. He even admitted he wanted
      to steal One For All before confronting her, showing just how much of a threat
      All For One viewed her as. It has been stated that she easily shrugs off cheap
      tricks and petty tactics from her enemies. She was able to deduce that the explosion
      of one of her teammates' jet wouldn't be enough to kill Shigaraki, deciding
      to create a rule that would revolt against other Quirks despite not fully knowing
      how the All For One Quirk worked. According to Commander Agpar, Star usually
      tackles her work and hero activities in an independent manner. Able to know
      with precision the location of her giant air construction despite it being completely
      invisible to the naked eye)
    source_ids: *id002
    confidence: 0.8
