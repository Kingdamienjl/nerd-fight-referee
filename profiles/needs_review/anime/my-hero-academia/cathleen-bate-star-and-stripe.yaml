- id: claim-weaknesses-12029138
  section: weaknesses
  axis: weakness
  text: New Order can only have two rules in affect at once, and one of those two
    rules is usually used to grant herself super strength. In order to apply another
    rule, she must drop one of her previous two rules. She must make contact with
    something and say its name in order for New Order to take effect. If she doesn't
    know the name of her target, she cannot directly affect them with New Order. When
    calling the name of a target that has a sense of self, the name she calls out
    must be the same name the target in question identifies themselves as. Despite
    granting herself super strength, her physical abilities are still inferior to
    that of All Might. Her existence erasure has only been used on the air, and it
    shouldn't be assumed to work on anything else. Her rule also can't arbitrarily
    affect another target that she hasn't touched through clever wording. For example,
    she cannot touch the air and make a rule that whoever touches the air will die.
    This Quirk does not grant her the power to resist the deconstruction effects of
    Decay.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
