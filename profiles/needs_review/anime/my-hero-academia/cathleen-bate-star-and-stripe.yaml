        Thus, giving her the ability to manipulate and bestow new properties onto
        herself and the world around her), Air Manipulation (Removed the air around
        Tomura Shigaraki within a radius of one hundred meters. Solidified the air
        into a shape of her body, but one thousand times larger), Energy Manipulation
        (Remodeled several lasers into a gigantic lance of energy), Statistics Amplification
        (By using her Quirk on herself, she can increase her strength, speed and durability
        to incredibly high levels), Limited Reactive Evolution & Accelerated Development
        (Quirk users have been shown to evolve or increase the strength of their quirk
        when in a life or death situation) This can grant her: Limited Existence Erasure
        (Was able to erase the air 100 meters in front of her out of existence), Energy
        Manipulation and Light Manipulation (Can make lasers solid, and combined several
        of them into one giant laser spear), Air Manipulation (Is able to shape the
        air into a giant construct of herself which mimics her movements and is completely
        invisible to the naked eye), Large Size (Type 3 with Fist Bump To The Earth.
        Can shape the air into a construct of herself that is 1000 times bigger),
        Vector Manipulation (Was able to redirect the Tiamat missiles as they were
        in motion), Biological Manipulation (Can make a rule that stops the heart
        of her opponent if they break her condition), Power Modification (Added a
        rule to New Order that made it revolt against other Quirks, making it impossible
        to hold New Order and another ability), Resistance to Heat (Able to survive
        being struck by multiple lasers and only take minor damage)] Reality warping
        (via New Order) Death Manipulation (via New Order) (She almost killed Shigaraki
        by making his heart to stop if he moved his legs before he reformed himself
        into a new being with new name and identity which made it harder for her kill
        him) Conceptual Manipulation (via New Order) Weather Manipulation ( She was
        able to set a new rule on the atmosphere and erase the air making it difficult
        for Shigaraki to breath in the Star Shape and trapped him in there)'
