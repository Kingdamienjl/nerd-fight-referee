- id: claim-weaknesses-a4adb9d8
  section: weaknesses
  axis: weakness
  text: 'Overusing one aspect of his power will cause him to overheat or lower his
    body temperature to dangerous levels. Using his strongest ice attack will cause
    his body to freeze instantly, significantly reducing his overall speed. According
    to Stain, Shoto relies on his Quirk too much in-combat, which makes him a careless
    fighter, although this weakness has been mitigated over time. Phosphor requires
    intense concentration to maintain and time to build up, and losing his focus will
    cause the technique to deactivate. Feats: Created a massive ice structure that
    dwarfed a stadium, and melted it shortly after. Can freeze a whole lake in an
    instant. His firepower was stated to be on par with Endeavor''s by All Might.
    Is capable of resisting the extreme temperatures of his own Quirk. His Phosphor
    is capable of chilling down even Dabi''s intense Flashfire Fist, which are vastly
    superior to Endeavor''s.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5658fa7b
  section: abilities
  axis: hax
  text: 'U.A. Beginning Saga= *Superhuman Physical Characteristics *Supernatural Willpower
    (Have been shown to be able to push through his limits to achieve victory) *Acrobatics
    (Can perform mid-air movements after being forcefully thrownMy Hero Academia Vol.
    5 Chapter 43) *Ice Manipulation and Fire Manipulation (Half-Cold Half-Hot allows
    him to generate and manipulate ice and fireMy Hero Academia Vol. 2 Chapter 11)
    *Statistics Amplification (Can surpass his limits and become stronger during battle)
    *Air Manipulation (By combining his ice and fire sides, Shoto can release wind
    blasts of considerable powerMy Hero Academia Vol. 5 Chapter 40) *Limited Explosion
    Manipulation (Can create explosions by using the full potential of both sides
    of his Quirk) *Resistance to Cold and Heat (His body is naturally resistant to
    his own Quirk, and he has improved this resistance with training) *All previous
    abilities and resistances, plus: *Social Influencing (His victory over Dabi influenced
    other heroes and students to do their best and go beyond from this part of the
    battlefieldMy Hero Academia Vol. 36 Chapter 353) *Flight (Able to float and travel
    in the air using his fire sideMy Hero Academia Vol. 30 Chapter 286) *Limited Fusionism
    (Capable of merging both his fire and ice to create phosphorMy Hero Academia Vol.
    36 Chapter 352) *Limited Power Nullification (Capable of neutralizing heat/fire
    with his Phosphor techniqueMy Hero Academia Vol. 36 Chapter 351)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
