    - field: standard_equipment
      value: 'His Hero Costume, which was made from a special fiber that is able to
        endure the cold and heat of his Quirk. There is a special device near his
        neck that senses his body temperature, and it automatically cools down or
        heats up accordingly.My Hero Academia Vol. 7 Chapter 54 It''s used for supporting
        the vest, Combat Vest: It''s capable of sensing Shoto''s temperature which
        automatically cools down or heats up according to the facet of his Quirk he''s
        using in order to stabilize his body temperature., Utility Belt: The metal
        capsules that hang on the belt contain water, pain medication, and disinfectants.
        This makes up the first aid kit., Snow Boots: They have spikes that are placed
        under the soles. This prevents slipping in frozen places., Wrist Guards: As
        an upgrade to his costume, Shoto received new wrist guards made from the same
        material as his vest. They appear to help him control the temperature of his
        ice and flames by keeping the high temperatures from travelling up his arms
        to his upper body.'
      source_id: vsbattles-shoto-todoroki-shoto-my-hero-academia
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Gifted (Shoto is extremely intelligent, having one of the highest grades
        in his classMy Hero Academia Vol. 7 Chapter 60 and proficient enough in battle
        to be able to dispatch most villains effortlessly. He is also considered the
        single most competent member of Class 1-A in combat, which includes the likes
        of Dynamight and Deku, and got into U.A. by recommendation rather than taking
        the Entrance Exam) Standard Tactics: Shoto usually starts his battles by sending
        waves of ice to his opponent from a great distance, while using his fire to
        stabilize his body temperature. If his opponent gets close enough, Shoto will
        release a large amount of fire to keep them away and use his ice to move quickly
        on the battlefield. As of the Joint Training Arc, Shoto has learned how to
        use both his ice and fire interchangeably, primarily from long-range.'
      source_id: vsbattles-shoto-todoroki-shoto-my-hero-academia
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Overusing one aspect of his power will cause him to overheat or lower
        his body temperature to dangerous levels. Using his strongest ice attack will
        cause his body to freeze instantly, significantly reducing his overall speed.
        According to Stain, Shoto relies on his Quirk too much in-combat, although
        this weakness has been mitigated over time. Phosphor requires intense concentration
        to maintain and time to build up, and melted it shortly after. Can freeze
        a whole lake in an instant. His firepower was stated to be on par with Endeavor's
        by All Might. Is capable of resisting the extreme temperatures of his own
        Quirk. His Phosphor is capable of chilling down even Dabi's intense Flashfire
        Fist
      source_id: vsbattles-shoto-todoroki-shoto-my-hero-academia
      provider_id: vsbattles
      authority: high
      confidence: 0.75
