- id: claim-standard-equipment-a2838eda
  section: equipment
  axis: equipment
  text: 'His Hero Costume, which was made from a special fiber that is able to endure
    the cold and heat of his Quirk. There is a special device near his neck that senses
    his body temperature, and it automatically cools down or heats up accordingly.My
    Hero Academia Vol. 7 Chapter 54 It''s used for supporting the vest; *Combat Vest:
    It''s capable of sensing Shoto''s temperature which automatically cools down or
    heats up according to the facet of his Quirk he''s using in order to stabilize
    his body temperature. *Utility Belt: The metal capsules that hang on the belt
    contain water, pain medication, and disinfectants. This makes up the first aid
    kit. *Snow Boots: They have spikes that are placed under the soles. This prevents
    slipping in frozen places. *Wrist Guards: As an upgrade to his costume, Shoto
    received new wrist guards made from the same material as his vest. They appear
    to help him control the temperature of his ice and flames by keeping the high
    temperatures from travelling up his arms to his upper body.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
