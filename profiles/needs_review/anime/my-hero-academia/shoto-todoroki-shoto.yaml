      to be able to dispatch most villains effortlessly. He is also considered the
      single most competent member of Class 1-A in combat, which includes the likes
      of Dynamight and Deku, and got into U.A. by recommendation rather than taking
      the Entrance Exam) Standard Tactics: Shoto usually starts his battles by sending
      waves of ice to his opponent from a great distance, while using his fire to
      stabilize his body temperature. If his opponent gets close enough, Shoto will
      release a large amount of fire to keep them away and use his ice to move quickly
      on the battlefield. As of the Joint Training Arc, Shoto has learned how to use
