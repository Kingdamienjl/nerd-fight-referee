        (His combat expertise overwhelmed Tomura Shigaraki's. His kicking skills have
        greatly improved. Fought and defeated Lady Nagant, the best long-range fighter
        in the entire country), Levitation (Able to suspend himself in mid-air with
        Float), True Flight (By combining Float with Air Force, Deku is capable of
        flying with no restrictions), Rage Power (Can boost his power immensely in
        a fit of anger. The power of his Blackwhip is linked to his emotional state),
