  axis: hax
  text: Superhuman Physical Characteristics, Skilled Hand-to-Hand Combatant (Can battle
    an experienced Deku and even used a karate chop to neutralize him), Acrobatics
    (Capable of bouncing around an area at high speeds), Elasticity (Can make any
    non-living object he touches elastic), Pseudo-Flight (Can make even the air elastic,
    allowing him to jump indefinitely in the air), Attack Reflection (Can reflect
    Deku's air blasts), Statistics Amplification and Empowerment (His physical strength
    and speed are dramatically enhanced proportionate to the intensity of La Brava's
