        Who can harm The Serpenters and both them and he can survive the force of
        his Howitzer Impact), Large Country Level with 100% (Far stronger than before,
        Dispersed Nine's massive Storm with a shockwave alongside Bakugo) | Large
        Town Level (Has strengthened his body to allow him to handle 10% without harming
        his body. Meaning that his 10% shouldn't be too much stronger than his base),
        Higher with 10% (Should be comparable to Bakugo), Large Town Level+ with 15%
        (Broke through Flect Turns Reflect, which his 10% couldn't do), Small City
        Level with 20% (Harmed a villain, that could withstand Bakugo's Howitzer Impact,
        and his St. Louis Smash was shown to be comparable to it), Large Country Level
        with 100% | Small City Level (Has become far stronger since his first fight
        with Muscular, allowing him to wield 30% as he used to do with 5% in the past.
        Likely meaning that the power boost from 30% is marginal. Also doesn't use
        20% at all anymore, likely meaning that he has surpassed it, even in base),
        Higher with 30% (Considerably stronger than his 20%, scales to Gran Torino,
        who survived an Air Cannon, as well as caught All Might. Who had been launched
        by a massive attack by All For One), Large Country level with 45% (He possesses
        enough strength to restrain Shigaraki, who was said to be just as powerful
        as All Might and equal to the USJ Nomu. Should be comparable to the Near-High
        End Nomu that survived the Tiamat Missiles. Is superior to Endeavor, who contributed
