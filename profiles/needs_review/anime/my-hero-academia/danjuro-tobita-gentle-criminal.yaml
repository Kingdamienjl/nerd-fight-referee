- id: claim-weaknesses-46f58030
  section: weaknesses
  axis: weakness
  text: Gentle is flamboyant and obsessed with gaining notoriety, often showing off
    in an attempt to gain views. He is also prone to explaining his Quirk to his viewers
    and his fixation on "style" can allow others to deduce his identity and abilities.
    He cannot deactivate his Quirk once it is applied to an object and its effects
    will only fade after a certain amount of time has passed, which can allow opponents
    to use Gentle's Quirk against him. Lover Mode is only temporary and can only be
    used once per day.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2ab21c9c
