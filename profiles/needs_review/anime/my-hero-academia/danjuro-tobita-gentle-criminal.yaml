        which can withstand explosions this powerful without a scratch), Higher with
        5% (Can drop kick a massive steel beam. Able to harm Bakugo, who can withstand
        the power of massive explosions. Considers 5% a minor increase in strength),
        Multi-City Block Level with Delaware Smash. Large Island Level+ with 100%
        (As powerful as All Might during the events Two Heroes, who is this powerful)
        | Multi-City Block Level (Has been training for almost a whole year, making
