  attack_potency:
    text: City Block level (His base strength was stated to be dozens of times weaker
      than in his Lover Mode), Multi-City Block level+ with Lover Mode (Overpowered
      8% Deku and harmed him during many of their clashes), Varies with Elasticity
      (Can reflect his opponents attacks back to his opponents. Capable of reflecting
      a charge from 8% Deku) | City Block level (Has become far stronger than before,
      as he was revealed to have single-handedly defeated an entire prison of villains),
      City level with Lover Mode (Was capable of stopping and holding the U.A. Fortress
      while it was in free fall), Varies with Elasticity
    source_ids:
    - vsbattles-danjuro-tobita-gentle-criminal-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic+ reactions and combat speed (Could react to 8% Deku), Hypersonic+
      movement speed with Elasticity (Can bounce at extremely high speeds using his
      Elasticity. Was remarked as too unpredictable and hard to read by Deku), higher
      with Lover Mode (Can outpace 8% Deku and move faster than him) | Hypersonic+
      reactions and combat speed (Should be faster than before), Hypersonic+ movement
      speed with Elasticity, higher with Lover Mode (Was able to see Deku as he tackled
      Shigaraki, though he admitted that he only barely saw him)
    source_ids:
    - vsbattles-danjuro-tobita-gentle-criminal-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class 25 (Dozens of times weaker than in his Lover Mode), Class K with Lover
      Mode (Overpowered 8% Deku, and threw him around), higher with Elasticity (Tried
      to crush 8% Deku against the ground using his Elasticity. Deku was unable to
      push through his elastic walls) | Class 25 (Stronger than before), Class T with
      Lover Mode and Elasticity (Capable of stopping and holding the U.A. Fortress
      while it was in free fall, although he was faltering as time went on)
    source_ids: &id002
    - mediawiki-1601696
    confidence: 0.95
  striking_strength:
    text: City Block level, Multi-City Block level+ with Lover Mode | City Block level,
      City level with Lover Mode
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level+ (Able to take Air Force Smashes from 8% Deku), higher
      with Love Mode (Is more durable than before, although not by a large amount
      as 8% Deku could still hurt him), far higher with Elasticity (His air membranes
      were able to tank attacks from 8% Deku) | Multi-City Block level+ (Should be
      more durable than before), City level with Lover Mode and Elasticity (Withstood
      the crushing weight of holding the U.A. Fortress)
    source_ids:
    - vsbattles-danjuro-tobita-gentle-criminal-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Endured an extended battle against Deku, and took multiple Air
      Force cannons to his back and stomach. Single-handedly fought an entire prison
      of villains by himself, and outlasted them)
    source_ids:
    - vsbattles-danjuro-tobita-gentle-criminal-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Several Meters with Elasticity | Standard Melee Range,
      Hundreds of Meters with Elasticity (Created an air trampoline that was larger
      than the U.A. Fortress)
    source_ids:
    - vsbattles-danjuro-tobita-gentle-criminal-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Above Average (Although he's a little-known villain and a Hero Course dropout\
      \ with terrible grades, Gentle has shown himself to be surprisingly intelligent,\
      \ frequently outwitting law enforcement and Pro Heroes in his various crimes\
      \ and heists and escaping with the help of his accomplice La Brava. His foppish\
      \ and flamboyant demeanor also hides the fact that he has spent years mastering\
      \ his Quirk, proving a match for Deku, one of the most promising students of\
      \ Class 1-A and the prot\xE9g\xE9 of veteran heroes like All Might and Gran\
      \ Torino, in hand-to-hand combat through carefully applied use of his Quirk.\
      \ However, he is obsessed with gaining views and frequently turns his back on\
      \ his foes in an attempt to accomplish his desired goals. His fixation on his\
      \ own image also exposed him to Deku when they inadvertently ran into each other\
      \ on the street, blurting out his love for a particular brand of tea that allowed\
      \ the Hero Course student to deduce Gentle's identity)"
    source_ids:
    - vsbattles-danjuro-tobita-gentle-criminal-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
