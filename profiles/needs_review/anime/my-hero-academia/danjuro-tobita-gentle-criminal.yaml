        \ Brava. His foppish and flamboyant demeanor also hides the fact that he has\
        \ spent years mastering his Quirk, proving a match for Deku, one of the most\
        \ promising students of Class 1-A and the prot\xE9g\xE9 of veteran heroes\
        \ like All Might and Gran Torino, in hand-to-hand combat through carefully\
        \ applied use of his Quirk. However, he is obsessed with gaining views and\
        \ frequently turns his back on his foes in an attempt to accomplish his desired\
        \ goals. His fixation on his own image also exposed him to Deku when they\
        \ inadvertently ran into each other on the street, blurting out his love for\
        \ a particular brand of tea that allowed the Hero Course student to deduce\
        \ Gentle's identity)"
      source_id: mediawiki-1601696
