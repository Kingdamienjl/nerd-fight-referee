        \ attacks with fire power. He can also form a sword of solid fire which is\
        \ hot enough to cut through steel), Sound Manipulation (All Oni can imbue\
        \ their instruments with the sound of purification for their Ongeki Da finishers),\
        \ Explosion Manipulation (His attacks have a tendency of causing explosions),\
