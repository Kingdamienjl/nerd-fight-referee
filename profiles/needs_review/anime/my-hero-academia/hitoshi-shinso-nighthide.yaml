        \ to defeat Makamou), Regeneration (Mid-Low), Statistics Amplification (It\
        \ is possible for Hibiki to amplify the cleansing sound when using the Ongekiko\
        \ Kaentsuzumi and the Ongekiko Bakuretsu Kaentsuzumi), Natural Weaponry (Can\
