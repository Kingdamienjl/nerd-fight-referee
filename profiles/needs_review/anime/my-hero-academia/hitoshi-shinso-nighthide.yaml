      multiple students to carry him forward, conserving his stamina. He is also willing
      to push people's buttons to get a reaction he can exploit with his brainwashing
      ability. He trained with Eraser Head in hand-to-hand combat for about a year,
      and has obtained proficient control over his Binding Cloth. He also possesses
