- id: claim-weaknesses-5486e9a6
  section: weaknesses
  axis: weakness
  text: Using his Muscle Enhancement makes his arms bleed. After using Overclock,
    the Quirk needs a cool-down time of ten seconds before using it again, or he will
    deprive his brain of oxygen (This weakness goes away as Hi-Crawler). Entering
    Lightning Style is fatal, as he turns most of his body into plasma and his regeneration
    cannot restore his major organs. As such he has a limited amount of time in Lightning
    Style before eventually dying once he runs out of energy. Destruction Style cannot
    be activated by himself, he needs multiple Bomber Villains to fuse with in order
    to enter this state. His skeleton and brain is a weak point while in his Lightning
    Style or Destruction Style.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2d2d9d1c
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Expert Hand-to-Hand Combatant (His
    fighting style is based off of O''Clock, and can fight evenly with Knuckleduster)
    *Acrobatics (Can run up walls or wall jump up buildings, even capable of jumping
    off birds in mid flight) *Supernatural Willpower (His will is so great that he
    can force himself to stay alive even though he was only a skeleton and brain,
    and his regeneration couldn''t restore his organs) *Body Control (Can increase
    the size of his muscles, thus increasing his strength. Can grow multiple limbs
    or even melt his body) *Elemental Intangibility (Can transform most of his body
    into some kind of liquid, which he uses to escape from holds) *Immaterial Intangibility
    (His Lightning Style turns the majority of body into plasma, and has been stated
    to be made out of pure energy) *Shapeshifting (Can transform his body to look
    like anyone he wants) *Regeneration (Low-Mid. Using his healing powers, he could
    regenerate from shotgun wounds in mere moments. While using Overclock alongside
    his healing power, he could regenerate an entire arm instantly. Was able to grow
    back his body from a skeleton and brain, though he couldn''t regenerate his major
    organs) *Statistics Amplification with Overclock (Overclock stimulates the brain
    and heightens his senses to the point that time itself appears to be still, all
    while boosting his own speed by several times. This gives him Perception Manipulation,
    Sense Manipulation, Enhanced Senses [Can improve his vision further with Hi-Crawler
    and Sniper Style], and Social Influencing [As a result of his heightened senses,
    he can hear, see, and think at hyper-speed. His senses are heightened to such
    a degree that he can read someone''s subconscious reactions and adjust their responses
    via verbal manipulation]) *Multiple Selves (Type 1; Has a vestige of All For One
    in his head that takes the form of O''Clock, which can give him advice while in
    battle) *Body Control and Explosion Manipulation (With Bombify and Self-Detonation,
    he can create bombs from his body and make them explode. Can transform his body
    into combusting plasma, and fire plasma projectiles that explode on contact) *Limited
    Radiation Manipulation (Can create and manipulate electromagnetic waves to shut
    down the power and electronic devices, or to give orders to the Anonymous) *Hive
    Mind (Type 1; Has a hive mind control over the Anonymous) *Transformation (Capable
    of multiple different transformations like Hi-Crawler and Lightning Style) *Bodily
    Weaponry (Grows claws while in his Hi-Crawler form) *Plasma Manipulation (Can
    transform most of his body into plasma, and shoot out plasma projectiles) *Flight
    (Can fly freely in the air with Lightning Style) *Danmaku (Can shoot out ten projectiles
    from each of his finger in Lightning Style) *Homing Attack (His projectiles in
    Lightning Style will follow his target) *Resistance to Pain (His body was modified
    to resist pain) and Heat (His skeleton and brain are unaffected by the heat of
    his body becoming plasma in his Lighting Style) *All previous abilities to a greater
    extent, plus: *Large Size (Type 1; His body is bigger than buildings) *Duplication
    (Can make his giant body explode and send out multiple copies of himself that
    have the same size and appearance as his Lightning Style)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
