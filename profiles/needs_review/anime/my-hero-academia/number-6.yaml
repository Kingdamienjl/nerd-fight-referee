        the enemy. This attack has a chance to stun the enemy and has a higher chance
        to hit vital points. * Pay Day: The user throws money at the enemy. * Bind:
        The user coils around the target to damage them continually. TM Moves:= *
        Mega Punch: The user throws a strong yet inaccurate punch. * Razor Wind: The
        user charges up before slashing the opponent with sharp winds. * Swords Dance:
        A status move that doubles the user''s attack. * Mega Kick: The user throws
        a strong yet inaccurate kick. * Toxic: The user poisons the opponent, causing
        them to get afflicted with an increasingly more powerful poison. * Take Down:
        A strong move causing recoil damage on the user. * Double-Edge: An even stronger
        move causing recoil damage to the user. * Bubblebeam: The user shoots concentrated
        bubbles at the enemy, with a chance to reduce their speed. * Ice Beam: A beam
        of cold that has a chance to freeze the enemy solid. * Blizzard: A gust of
        cold wind that hits all enemies and has a chance to freeze the enemy solid.
        * Submission: A strong physical move that deals recoil damage to the user.
        * Seismic Toss: A fighting-type move that deals a fixed amount of damage.
        * Rage: An attack that deals a constantly increasing amount of damage at the
        cost of forcing the user to only use this move. * Thunder: A strong electric
        attack with a chance to paralyze with low accuracy. * Earthquake: A skill
        that provokes an earthquake. * Fissure: The user opens up the earth and crushes
        the opponent flat within it. It will automatically defeat even beings on par
        with the user. * Psychic: The user attacks the target with a telekinetic blast,
        possibly lowering their defense against projectiles. * Teleport: A simple
        teleportation technique. * Rest: The user falls asleep, healing themselves
        to full health. * Thunder Wave: The user lets out small electric waves to
        paralyze the opponent. * Tri'
