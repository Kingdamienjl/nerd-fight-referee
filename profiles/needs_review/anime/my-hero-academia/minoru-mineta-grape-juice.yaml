- id: claim-weaknesses-fd9cf7bc
  section: weaknesses
  axis: weakness
  text: 'He starts to bleeds if he uses his Quirk too much without recovering. He
    can easily cower if he feels he can''t handle a situation, though this weakness
    has mitigated over time. Notable Attacks and Techniques Pop Off: Grape Juice''s
    Quirk that allows him to produce extremely sticky spheres from his head, which
    he can then use as projectiles, with a new sphere growing in place of the removed
    one in seconds. The spheres are able to stick to surfaces, with the exception
    of Grape Juice himself, who causes the spheres to bounce him away. Depending on
    his health level, their stickiness may last a whole day. *Grape Rush: Grape Juice
    rushes towards the enemy while throwing several of his sticky spheres at them,
    sticking the enemy in place and allowing Grape Juice to rush past them. *Grape
    Buckler: Grape Juice sticks a number of Pop Off spheres on a shield, which he
    can use for defense while simultaneously trapping whatever hits the shield.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
