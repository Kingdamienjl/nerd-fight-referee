    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (As a Pro Hero, Mount Lady has been officially licensed by
      the government to act as a crime-fighting Hero. As a result, she has received
      at least basic hand-to-hand combat training and is seen utilizing it to pummel
      her foes with her immense size. She has also shown herself to be careful enough
      to take proper caution during a hostage situation as well as having the sense
      to not use her Quirk while inside a building, lest she cause the destruction
      of said building and the numerous buildings around it)
    source_ids:
    - vsbattles-yu-takeyama-mount-lady-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
