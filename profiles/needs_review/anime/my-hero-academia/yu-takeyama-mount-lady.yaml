    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Multi-City Block level+ with Gigantification (One-shotted a massive villain
      who was fighting Kamui Woods. Effortlessly overpowered the Vanguard Action Squad
      Nomu, which has enough strength to create this earthquake according to Magne711.97
      Tons of TNT) | Large Country level with Gigantification (Can fight against Geten
      and destroy his ice structures, which could clash with Dabi's Blueflame. Able
      to briefly hold and slow down Gigantomachia, something neither Dabi or Geten
      were able to do250 Teratons of TNT)
    source_ids:
    - vsbattles-yu-takeyama-mount-lady-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic+ reactions and combat speed (Defeated a massive villain before
      Kamui Woods' Lacquered Chains Prison could reach him. Managed to intercept Mr.
      Compress, who had been propulsed up by Magne's QuirkMach 16.34), Subsonic movement
      speed with Gigantification (Due to her enormous size, she is able to run at
      these speeds) | Hypersonic+ reactions and combat speed (Faster than before),
      Subsonic movement speed with Gigantification
    source_ids:
    - vsbattles-yu-takeyama-mount-lady-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class K with Gigantification (Able to easily support her own building-sized
      weight, which should be around this heavy. Casually wore and lifted a pickup
      truck like a shoe. Accidentally sent the roof of a building flying by transforming135
      Metric Tons) | At least Class M with Gigantification (Can push through Geten's
      ice structures, which are this heavy. Was able to slightly slow down Gigantomachia's
      charge and force his mouth to open, although he easily overpowered her when
      he stopped ignoring her94,859 Metric Tons)
    source_ids: &id002
    - mediawiki-382103
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level+ with Gigantification (Capable of knocking out other
      giants with physical hits) | Large Country level with Gigantification (Can break
      Geten's ice with her punches)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level+ with Gigantification (Can withstand the force of
      her own attacks) | Large Country level with Gigantification (Can withstand ice
      attacks from Geten, who is able to clash with Dabi's Blueflame. Survived being
      tossed by Gigantomachia, who had decided to attack them so that they could not
      get in his way anymore, although it did knock her out)
    source_ids:
    - vsbattles-yu-takeyama-mount-lady-my-hero-academia
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Capable of using her Quirk after being seriously injured. Forcibly
