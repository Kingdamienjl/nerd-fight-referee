- id: claim-weaknesses-e9313d26
  section: weaknesses
  axis: weakness
  text: 'The continued use of Flashfire Fist raises his body temperature, causing
    him to weaken, so he refrains from overusing to use his most powerful attacks
    recklessly. This weakness seems to have been mitigated at the time of the Paranormal
    Liberation War Arc, as he was able to continuously use his strongest attacks without
    getting weaker. Using Prominence Burn instantly raises his body temperature to
    its maximum, making it a technique he cannot use carelessly. Feats: Can endure
    the immense heat of his own flames, which he states builds up inside of him after
    every serious attack he uses. Flames on par with his own are capable of melting
    Real Steel,My Hero Academia Vol. 22 Chapter 205 who trained his steel to be more
    resistant to heat than normal.My Hero Academia Vol. 22 Chapter 204 Can vaporize
    the majority of Hood''s body with his Prominence Burn, and would have killed him
    had he not thrown his head away. Star and Stripe compared the heat of her United
    Laser Keraunos to Endeavor''s, stating that if this had been enough to defeat
    Shigaraki, Endeavor would have been able to finish the job.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
