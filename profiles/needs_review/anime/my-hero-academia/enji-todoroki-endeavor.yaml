    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (As the No. 1 Pro Hero, Endeavor is significantly more experienced
      and intelligent than heroes in training and even most other Pro Heroes. He has
      the highest tally of resolved criminal cases in recorded history.My Hero Academia
      Vol. 1 Chapter 3 He possesses remarkable analytical skills, demonstrated when
      he deduced that Deku had an extremely powerful Quirk that stacks up to All Might
      himself after only seeing it used once.My Hero Academia Vol. 5 Chapter 37 Later,
      he was able to quickly figure out Hood's weakness while fighting him. He is
      also a very competent teacher, having taught his two sons how to use their flames
      effectively while also vastly improving the skills of Deku and Dynamight during
      their Hero Work-Studies program with him)
    source_ids: *id002
    confidence: 0.8
