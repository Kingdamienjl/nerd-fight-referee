      arm rip off. Endured mighty attacks from Dabi despite being heavily injured
      and tired from fighting All For One)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, up to Hundreds of Meters with Hellflame (Able to cut
