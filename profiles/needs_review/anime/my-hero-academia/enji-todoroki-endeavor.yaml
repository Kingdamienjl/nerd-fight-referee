  attack_potency:
    text: Large Country level with Hellflame (Can break the bones of a High-End,My
      Hero Academia Vol. 28 Chapter 268 who was stated to be just as durable as Hood.My
      Hero Academia Vol. 30 Chapter 294 Able to clash against Incomplete Shigaraki's
