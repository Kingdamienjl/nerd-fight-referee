      stop All For One's attacks.My Hero Academia Vol. 36 Chapter 354 By regulating
      his Quirk output, he can move at super speeds0.77c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class P (Can slam a High-End and keep it pinned to the floor, who threw
