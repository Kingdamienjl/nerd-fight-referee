- id: claim-weaknesses-d303ceea
  section: weaknesses
  axis: weakness
  text: 'Low self-esteem and suffers from anxiety issues, he is only able to manifest
    items he currently has in his system, so he must eat his repertoire every day.
    Notable Attacks/Techniques Manifest: This Quirk allows Suneater to manifest the
    characteristics of the things he eats. Over the 2 and a half years he''s been
    at U.A., he has trained his Quirk to incredible degrees. The training allowed
    him for size variation, concurrent manifestations, feature selection, and mixed
    conflagration. He seems to be able to make all these alterations from anywhere
    on his body simultaneously and generate parts that he hasn''t specifically eaten
    (such as wings and feathers from chicken or poison from eating takoyaki). He has
    also been shown to manifest things that aren''t food (such as crystals), so long
    as he''s able to consume it somehow. Suneater Quirk.png|Suneater''s Manifest Quirk
    *Crab Pincer/Crab Tentacle Hand: Suneater can transform his hand into a crab pincer
    strong enough to effortlessly crush a few guns and a sword. He later combines
    it with the strength of his tentacle fingers to make a stronger version that he
    uses to hold enemies back in hand-to-hand combat. *Octopus Neurotoxin: Suneater
    can generate the naturally occurring neurotoxin found in an octopus'' saliva,
    and can adjust the toxicity to avoid killing his opponent. *Clam Hand/Clam Shield:
    Transforming his hand into a clam''s shell, he uses it to deliver hardened strikes
    to an enemy. Later, he shows a more powerful version by generating a giant clamshell
    from his back to protect his entire body. He can do it fast enough that he does
    in mid-air as he jumps, closing the shell in a way to precisely clamp multiple
    enemy weapons. *Chimera Kraken: Suneater generates several giant tentacles and
    covers parts of them and his body with crab armor as well as giving each tentacle
    crab pincers, combining the muscular strength of the tentacles and the crab''s
    toughness to easily swoop enemies around in a large area. MHA VHCK.png|Chimera
    Kraken *Crystal Chicken Talon: Suneater transforms part of his legs into tentacle
    muscles to give them superior strength and reach, while also transforming his
    foot into a giant chicken talon covered in hard sharp crystals, then using it
    to deliver a powerful frontal kick. *Chimera Centaur: Suneater uses his Quirk
    to transform into a centaur and charge into the enemy ranks while using his arms
    to summon different types of fruit and knock out his opponents in an instant.
    *Octopus Mirage: Suneater replicates the cloaking abilities of octopuses to mask
    his presence with the surroundings so he can attack his target by surprise. *Scorpius
