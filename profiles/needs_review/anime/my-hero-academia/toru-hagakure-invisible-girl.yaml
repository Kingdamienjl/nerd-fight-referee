        Power Absorption (Has a weaker version of All For One's Quirk, allowing him
        to steal up to eight Quirks from others), Possible Power Bestowal (Likely
        comparable to All For One's Quirk), Information Analysis (Able to determine
        the Quirks of others and how powerful they are), Forcefield Creation (Can
        generate multilayered barriers in many different shapes and sizes), Energy
        Projection (Able to fire energy orbs and laser beams from his fingers), Danmaku
        (With laser beams), Air Manipulation (Can shoot high-pressure air blasts,
        usually in conjunction with his barriers), Water Manipulation (Can generate
        enormous, dragon-like structures using a dark blue liquid. Able to control
        the size and number of the dragons), Cell Manipulation (Grants Healing/Regeneration
        [At least Mid-Low. With Cell Activation, he can activate the cells in those
        with a B blood type. Comparable to Katsuma's Quirk, who could heal Shouji
        from puncture wounds caused by laser beams] and Accelerated Development [Physical
        Stats. Noted by Deku to enhance the target's physical condition]), All previous
        abilities to a greater extent, Rage Power (Became more powerful as a result
        of his rage. His storms and shields also became stronger), Flight (Can move
        through the air using a tornado)
