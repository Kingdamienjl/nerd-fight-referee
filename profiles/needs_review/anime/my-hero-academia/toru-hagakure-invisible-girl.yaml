      value: His Weather Operations is too powerful for him, and will destroy his
        tissue if overused. This combined with his unknown illness has made his body
        weaker than it was before, causing his body to break down in certain situations.
        It was worsened by receiving All For One, causing him to exhaust faster. Using
        Quirks multiple times in a short period of time puts a great amount of stress
        on him. His Cell Activation is based on blood types, his body would exhaust
        more easily and worse.
