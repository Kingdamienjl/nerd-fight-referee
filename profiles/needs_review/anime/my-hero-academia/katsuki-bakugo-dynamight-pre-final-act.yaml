    - field: intelligence
      value: "Gifted (Dynamight is a straight-A student who is a genius in the use\
        \ of his Quirk, being able to perform subtle lateral calculations and adjustments\
        \ to propel himself at high speeds while maintaining maneuverability. He's\
        \ trained himself to incorporate hand-to-hand combat into his Quirk's daily\
        \ use, allowing him to quickly blast his way through most foes and completely\
        \ overwhelming Deku in their duel after he came with the intent to grievously\
        \ harm. In addition, he is a perfectionist and a sore loser, constantly striving\
        \ to improve himself through continuous study and training with his Quirk.\
        \ He's an observant individual, being able to tell when someone is lying based\
        \ on their facial expressionsMy Hero Academia Vol. 12 Chapter 103 and was\
        \ also clever enough to figure out that a \"monster\" attacking was just an\
        \ illusion because it had no shadow. However, his hot-headedness has proven\
        \ to be a detriment on more than one occasion, causing him to forget his objective\
        \ at hand in favor of blowing up whatever managed to agitate him. He was able\
        \ to use 100% Full Cowl right after receiving it,Though this is likely partly\
        \ because he already knew the Quirk, was born with one (unlike Deku) and (according\
        \ to Gran Torino in chapter 46) All Might could do the same because of his\
        \ \u201Cbody\u201D rather than his intelligence.)"
