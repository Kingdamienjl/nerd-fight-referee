      value: Superhuman (Deku trains relentlessly, even making exercises during his
        classes. Despite his timid demeanor, Deku has an iron will and will continue
        to fight for as long as he needs to. At the start of his career, he was capable
        of thinking coherently with a broken arm and two shattered legs while falling
