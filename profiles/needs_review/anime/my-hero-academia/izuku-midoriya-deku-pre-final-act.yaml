    - field: intelligence
      value: Gifted (He has shown to be exceptionally intelligent on several occasions.
        He has also proven to be a quick learner, which has helped him figure out
        most of One For All's mechanisms in a short time period and work around its
        limitations. He has displayed sharp observation and analysis skills, coming
        up with a plan to escape dozens of villains when he was trapped on a boat.
        It's usually his intelligence that has helped him more than his Quirk. Gran
        Torino even complimented his intelligence, saying that Deku is the kind of
        person who thinks before he acts. His grades are one of the highest in his
        entire class, showing that his constant training with One For All doesn't
        interfere with his studies. Deku also possesses a borderline encyclopedic
        knowledge of heroes, including their Quirks and combat strategies, making
        him resourceful as a result. His time at U.A. High School has helped him develop
        his own signature Shoot Style, allowing him to fight on par against opponents
        with many years of experience) | Gifted (Deku has developed analytical skills
        that allowed him to accurately predict the movements of people like Lemillion,
        who was capable of casually outpacing the majority of Class 1-A. He has also
        proven to be an exceptional strategist, having laid out an entire plan to
        lure in and capture a group of villains who individually, were far stronger
        than Class 1-A, a plan that ended up succeeding) | Gifted (Developed extremely
        quick in order to keep up with Endeavor's training. He learned how to create
        multiple long-lasting Blackwhip strands in one week, when before he could
