- id: claim-weaknesses-918ee54a
  section: weaknesses
  axis: weakness
  text: His fighting style doesn't fully suit his Shapeshifting Quirk. Bulking up
    throws his body weight off balance and disrupts his center of gravity. As a result,
    while his attacks themselves are swift, his windups tend to lag. His power, speed,
    and regeneration take a noticeable dive after only a few minutes of sustained
    combat. | Hood cannot regenerate if his head is destroyed, so he takes special
    care to protect it during battle, which can provide perceptive opponents with
    insight into his primary weakness.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-03f7393d
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Expert Hand-to-Hand Combatant (Outmatched
    both Rappa and Mirko, though they were younger at the time.My Hero Academia: Vigilantes
    Vol. 11 Chapter 90 Has martial arts experience that All For One considered impressive
    drilled into his muscle memoryMy Hero Academia: Vigilantes Vol. 11 Chapter 91),
    Body Control and Transformation (Has a Shapeshifting Quirk that allows him to
    transform the core structure of his body by propagating cells at high speeds,
    giving him the ability to bulk himself up, stretch his limbs,My Hero Academia
    Vol. 20 Chapter 187 and grow to monstrous sizes on a whimMy Hero Academia: Vigilantes
    Vol. 12 Chapter 92), Large Size (Type 0; He is far bigger than humans after fully
    transformingMy Hero Academia: Vigilantes Vol. 12 Chapter 93), Regeneration (Mid-Low;
    Able to heal sliced tendons and gunshots to the eye) All previous abilities to
    a greater extent, plus: Large Size (Type 0; Is far taller than Dr. Garaki and
    EndeavorMy Hero Academia Vol. 27 Chapter 261), Enhanced Senses (Can recognize
    specific commands through radio wave signalsMy Hero Academia Vol. 30 Chapter 295),
    Flight (Capable of flying effortlesslyMy Hero Academia Vol. 20 Chapter 186), Regeneration
    (Mid; Able to regenerate his entire body from his severed headMy Hero Academia
    Vol. 20 Chapter 188), Immortality (Types 2 and 3; Hood is able to keep fighting
    even if a large portion of his body is destroyed, with his regeneration allowing
    him to ignore fatal blows), Self-Sustenance (Types 2 and 3; Nomu are made from
    reanimated corpses,My Hero Academia Vol. 27 Chapter 262 and are said to never
    feel exhaustedMy Hero Academia Vol. 31 Chapter 296), Muscle Augmentation and Statistics
    Amplification (Can augment his muscles, granting him even more power), Summoning
    (Can summon at least nine Nomu from his own body)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
