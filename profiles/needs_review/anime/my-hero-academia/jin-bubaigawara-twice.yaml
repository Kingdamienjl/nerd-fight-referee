  section: weaknesses
  axis: weakness
  text: 'Twice requires sufficient details about the object he wants to clone such
    as height, chest, foot measurement etc. in case of humans; in order to copy it
    perfectly. The clones he creates have less endurance than the originals, and will
    dissolve after taking enough damage. Twice has no direct control over the clones
    he creates as they retain the original person''s personality. Feats: During the
    battle against Meta Liberation Army, who had 116,510 warriors on their side, Twice
    was able to make more than enough clones to combat them. Claimed to be able to
    make 20,000 clones of Dabi but held off due to not wanting to crush the Meta Liberation
    Army before Gigantomachia arrived.'
