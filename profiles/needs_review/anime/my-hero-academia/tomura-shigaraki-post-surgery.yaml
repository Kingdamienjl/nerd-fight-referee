- id: claim-weaknesses-c64ddeba
  section: weaknesses
  axis: weakness
  text: His forcefully interrupted procedure prevents him from using the full extent
    of his abilities, slowing his Super Regeneration and preventing him from stealing
    One For All. He doesn't fully understand how to use all of All For One's Quirks
    and is often possessed by his master's vestige. All For One can only give and
    take Quirks and cannot destroy any Quirks within his body, even if they are self-damaging.
    He requires physical contact with a target to steal their Quirk. | He no longer
    suffers from the weaknesses caused by his interrupted procedure. His infinite
    growth slows him down due to its sheer weight. His core bears a permanent scar
    inflicted by New Order's Revolt, which allows powerful spiritual attacks to destroy
    it and reach his soul.
