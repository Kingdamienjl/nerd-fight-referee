        This Quirk allows him to turn his body into steel. It can be used as both
        the strongest defense and the strongest attack.My Hero Academia Volume 3 Chapter
        25 Using his Quirk for too long will cause him to suffer from iron fatigue,
        gradually weakening the steel''s hardness. Real Steel has said that he will
        gain longer and stronger use of his Quirk depending on the level of iron in
        his diet. It is unknown if this refers to foods that had iron in them, or
        literal metal. *Steel Fist: He uses his iron hardened fist to break through
        his enemy''s defenses and crush them. His steel enhanced swing is strong enough
        to break clean through solid ice.'
