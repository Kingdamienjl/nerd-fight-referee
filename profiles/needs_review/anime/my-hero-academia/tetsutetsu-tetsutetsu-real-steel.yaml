- id: claim-weaknesses-dbf8565b
  section: weaknesses
  axis: weakness
  text: 'Using his Quirk for too long will cause Real Steel to suffer from iron fatigue,
    gradually weakening the steel''s hardness. Can potentially melt from prolonged
    exposure to extreme heat. Feats: Can resist high amounts of heat/cold by turning
    his body into steel, which has a high melting point. By the time of the Joint
    Training Arc he has trained his Quirk to be even more resistant to heat by sitting
    inside of a stove. Shoto''s ice attacks have no effect on him. Withstood Shoto''s
    most powerful fire attack, which were stated by All Might to be on par with Endeavor,
    though he was in danger of melting had the fight dragged out. Notable Attacks
    and Techniques Steel: This Quirk allows him to turn his body into steel. It can
    be used as both the strongest defense and the strongest attack.My Hero Academia
    Volume 3 Chapter 25 Using his Quirk for too long will cause him to suffer from
    iron fatigue, gradually weakening the steel''s hardness. Real Steel has said that
    he will gain longer and stronger use of his Quirk depending on the level of iron
    in his diet. It is unknown if this refers to foods that had iron in them, or literal
    metal. *Steel Fist: He uses his iron hardened fist to break through his enemy''s
    defenses and crush them. His steel enhanced swing is strong enough to break clean
    through solid ice.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
