power_scale:
  tier:
    text: 'Low 7-B with Explosion, higher with Howitzer Impact, far higher with Cluster
      | High 6-B with Explosion, higher with Cluster, far higher with Howitzer Impact:
      Cluster, even higher with Plus Ultra'
    source_ids: &id002
