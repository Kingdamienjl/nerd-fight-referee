- id: claim-standard-equipment-3526a58f
  section: equipment
  axis: equipment
  text: 'His Hero Costume, which comes equipped with: *Grenadier Bracers: A pair of
    gauntlets that store Dynamight''s sweat, allowing him to release his most powerful
    explosions without damaging himself, and knee pads.My Hero Academia Vol. 2 Chapter
    9 *Improvised Grenades: Around the belt of his Hero Costume are several containers
    made to look like hand grenades. These can store Dynamight''s nitroglycerin-like
    sweat and can be used as regular grenades at a later time. These were first used
    during the Provisional Hero License Exam by Chargebolt.My Hero Academia Vol. 12
    Chapter 107 *Knee Pads: Very blunt metal metallic attachments Dynamight''s knees.
    They were likely designed to increase the power of his knee strikes. *Strafe Panzer:
    A number of retractable machine guns that can extend from the back of his hero
    costume and mount over his shoulders. Like his Grenadier Bracers, they use his
    nitroglycerin-like sweat as ammunition.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
