    confidence: 0.8
  attack_potency:
    text: 'Small City level with Explosion (Has grown considerably stronger than he
      was previously. As powerful as 30% Deku2.15 Megatons of TNT), higher with Howitzer
      Impact, far higher with Cluster (Stated that these focused explosions are stronger
      than anything he has done beforeMy Hero Academia Vol. 30 Chapter 293) | Large
      Country level with Explosion (Comparable to Shoto and Full Cowl Deku, as he
      fought Dark Might alongside themMy Hero Academia: You''re Next250 Teratons of
      TNT), higher with Cluster (Slightly stung Complete Shigaraki,My Hero Academia
      Vol. 37 Chapter 365 something Suneater''s Plasma Cannon failed to do), far higher
      with Howitzer Impact: Cluster (Shigaraki stated this attack was fantastic and
      that he had to get rid of itMy Hero Academia Vol. 36 Chapter 359), even higher
      with Plus Ultra (Blasted through an attack from Rampage Form Dark Might), Can
      ignore conventional durability (The heat of his explosions is so high that he
      can burn foes stronger than him, such as a suppressed All Might.My Hero Academia
      Vol. 7 Chapter 62 His Howitzer Impact: Cluster left a sizable burn mark on Complete
      Shigaraki''s face)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Supersonic (Can run on par with Base DekuMy Hero Academia Vol. 28 Chapter
      274Mach 1.44) with High Hypersonic reactions and combat speed (Capable of keeping
      up with 30% Deku's speedMach 25.76), High Hypersonic movement speed with Explosion
      (Can travel at speeds on par with 30% Deku's), Relativistic+ with Cluster (Managed
      to shove 45% Deku away from Shigaraki's Rivet Stab. Stated to have grown faster
      than ever before. Was capable of landing blasts on the Near High-End Nomu0.77c)
      | Supersonic movement speed, Relativistic+ reactions and combat speed (Capable
      of keeping pace with Shigaraki's initial growth along with Mirko, Edgeshot,
      and Best JeanistMy Hero Academia Vol. 35 Chapter 346), FTL with Cluster (His
      speed was praised by All Might, and he even managed to outpace Rewind All For
      One, catching up to him despite his head start1.68c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class K (Stronger than he was before100 Metric Tons) | Class K (Stronger
      than before)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Multi-City Block level+ (Far stronger than before711.97 Tons of TNT) | Multi-City
      Block level+
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small City level (Far more durable than before after many months of training)
      | Large Country level (Withstood attacks from Golden Age Dark Might)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: 'Superhuman (Was able to fight continuously for eight hours against Pixie-Bob''s
      Earth Beasts.My Hero Academia Vol. 8 Chapter 71 Withstood multiple attacks from
      Deku during their battle and managed to beat him.My Hero Academia Vol. 14 Chapter
      120 Could keep fighting even after his ribs were broken by Nine.My Hero Academia:
      Heroes: Rising He was able to utilize Full Cowl 100% for several minutes and
      has shown to be able to somewhat ignore the pain of shattered bones. Endured
      horrific stab and slash wounds from the Serpenters, shrugging off impalement
      and the ripping of his flesh several times to overcome them, even while losing
      significant amounts of blood)'
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, up to Kilometers with Explosion, Unknown with Cluster
      (While his Cluster explosions are heavily concentrated to increase their damage
      and power, these blasts are still big enough to cover massive areas)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (Dynamight is a straight-A student who is a genius in the use of
      his Quirk, being able to perform subtle lateral calculations and adjustments
      to propel himself at high speeds while maintaining maneuverability. He's trained
      himself to incorporate hand-to-hand combat into his Quirk's daily use, allowing
      him to quickly blast his way through most foes and completely overwhelming Deku
      in their duel after he came with the intent to grievously harm. In addition,
      he is a perfectionist and a sore loser, constantly striving to improve himself
      through continuous study and training with his Quirk. He's an observant individual,
      being able to tell when someone is lying based on their facial expressionsMy
      Hero Academia Vol. 12 Chapter 103 and was also clever enough to figure out that
      a "monster" attacking was just an illusion because it had no shadow. However,
      his hot-headedness has proven to be a detriment on more than one occasion, causing
      him to forget his objective at hand in favor of blowing up whatever managed
      to agitate him. He was able to use 100% Full Cowl right after receiving it,
      though this is likely partly because he already knew the Quirk and was born
      with one, unlike Deku)
    source_ids: *id002
    confidence: 0.8
