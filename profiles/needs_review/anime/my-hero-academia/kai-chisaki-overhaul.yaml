- id: claim-weaknesses-a0b52c6f
  section: weaknesses
  axis: weakness
  text: 'His Quirk is only usable through his hands and becomes powerless if they
    are restrained or destroyed. He must disassemble himself in order to recover.
    He also suffers from severe mysophobia, the fear of germs. Feats: *Killed Magne
    by disassembling her with his power. *Splattered Mr. Compress'' arm. *Held his
    own against Deku who had Eri''s Quirk on his side. *Mortally wounded Sir Nighteye
    with his spikes. Notable Attacks/Techniques Overhaul: This Quirk gives him the
    ability to instantly disassemble anything he touches with his hands, allowing
    him to instantly turn Magne''s upper body and Mr. Compress'' arm into a blood
    splatter with the lightest touch. He can also reassemble things he has destroyed
    if he so wishes, rendering the Reservoir Dogs completely healthy after destroying
    them, repeatedly disassembling and reassembling Eri in order to continually extract
    her blood for use in creating Quirk-Destroying Bullets, and healing his own injuries
    by disassembling and reassembling himself in an instant. In addition, he can modify
    the things he reassembles, allowing him to turn the floor he shattered into rows
    upon rows of jagged stone pillars to impale others with. Perhaps the most monstrous
    use of this ability is his ability to fuse two disassembled objects together to
    combine their traits, doing this to his own henchmen, Nemoto and Katsukame, on
    two separate occasions in order to become a massive monstrosity with access to
    their Quirks.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
