- id: claim-weaknesses-eeee88ef
  section: weaknesses
  axis: weakness
  text: If Uravity uses her Quirk too much, or hits her weight limit, she'll be overcome
    by nausea. This weakness has been mitigated over time. She has to make physical
    contact with her target in order to make them float. This weakness has become
    lesser by the Final War Arc after her Quirk Awakening, as Zero Gravity can now
    spread among different targets touching each other, without Uravity having to
    touch them all herself.
