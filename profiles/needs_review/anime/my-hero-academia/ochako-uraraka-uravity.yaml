  intelligence:
    text: Above Average (Uravity is a lively and energetic young girl who is known
      to work well with others. Although her grades are not particularly great, her
      creative use of her Quirk allowed her to score third place in U.A.'s rigorous
      Entrance ExamMy Hero Academia Volume 1 Chapter 5 and tenth place during Eraser
      Head's Quirk Apprehension Test,My Hero Academia Volume 1 Chapter 7 showing great
      mastery of her Quirk and its applications. Her determination and optimistic
      outlook allow her to make decisions on the fly and come up with complex strategies
      with only minimal assistance, nearly getting the drop on Dynamight during their
      battle. In addition, her training with the hero Gunhead has given her valuable
      martial arts training, allowing her to subdue her foes with any number of grappling,
      take down, and throwing maneuvers, which proved invaluable during her sparring
      session with Thirteen, a powerful hero with a Black Hole Quirk.My Hero Academia
      Volume 8 Chapter 67 Her fighting abilities have even improved to the point she
      can fight Toga by herself, who is skilled enough to kill multiple pro heroes
      with easeMy Hero Academia Volume 28 Chapter 273)
    source_ids:
    - vsbattles-ochako-uraraka-uravity-my-hero-academia
