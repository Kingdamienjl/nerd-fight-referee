- id: claim-powers-and-abilities-bd88fcad
  section: abilities
  axis: hax
  text: 'U.A. Beginnings Saga= *Superhuman Physical Characteristics *Skilled Hand-to-Hand
    Combatant (Has learned the "Gunhead Martial Arts", a fighting style based on grappling
    and grabbing techniquesMy Hero Academia Volume 9 Chapter 80) *Gravity Manipulation
    (Can manipulate gravity to make things float/weightless through her touch and
    can turn it off by putting her fingers together to releaseMy Hero Academia Volume
    1 Chapter 6) *Levitation (Can use her Quirk on herself to floatMy Hero Academia
    Volume 2 Chapter 10) *All previous abilities, plus: *Flight (She has rockets in
    her boots that allow her to travel through the air when combined with her QuirkMy
