  axis: weakness
  text: His Quirk is too powerful for him, and will destroy his cellular tissue if
    overused. This has made his body weaker than it was before, causing his body to
    break down in certain situations. It was worsened by receiving All For One, causing
    him to exhaust faster. Using Quirks multiple times in a short period of time puts
    a great amount of stress on him. His Cell Activation is based on blood types,
    of which he is incompatible. Since his Life-Support Tubes heal him after overusing
    his Quirks, if they were to be broken, his body would exhaust more easily and
    worse. | Same as before. With his Life-Support Tubes broken, his body is no longer
    able to heal itself.
