    - field: powers_and_abilities
      value: U.A. Beginnings Saga=Superhuman Physical Characteristics, Skilled Hand-to-Hand
        Combatant, Acrobatics, Supernatural Willpower (Able to endure enormous amounts
        of pain while staying conscious and fighting), Awakened Power (By breaking
        his limits, he is able to manifest power beyond his 100%), Statistics Amplification
        (Can increase his strength, durability, and speed with One For All), Air Manipulation
        (Can generate air pressure with his attacks. Can create tornadoes), Power
        Bestowal (Can give One For All to other people), Resistance to Mind Manipulation
        (His strong will allowed him to overpower Shinso's Brainwashing) and Power
        Absorption (One For All cannot be forcibly taken) All previous abilities,
        Analytical Prediction (Can predict the movements of opponents much faster
        than him), Energy Manipulation (Able to create dark tendrils of energy from
        his body using Blackwhip), Multiple Selves (Types 1 and 2. Can communicate
        with the vestiges of his predecessors), Pseudo-Flight (Can travel through
        the air using wind pressure) All previous abilities, Expert Hand-to-Hand Combatant
        (His combat expertise overwhelmed Tomura Shigaraki's. His kicking skills have
        greatly improved. Fought and defeated Lady Nagant, the best long-range fighter
        in the entire country), Levitation (Able to suspend himself in mid-air with
        Float), True Flight (By combining Float with Air Force, Deku is capable of
        flying with no restrictions), Rage Power (Can boost his power immensely in
        a fit of anger. The power of his Blackwhip is linked to his emotional state),
        Enhanced Senses (Managed to see Lady Nagant at night and while it was raining),
        Precognition and Extrasensory Perception (Able to detect imminent threats
        with Danger Sense. Capable of perceiving hostility and bloodlust), Smoke Manipulation
        (Can generate smoke with Smokescreen), Kinetic Energy Manipulation (Able to
        store and release motion-based energy using Fa Jin), Enhanced Supernatural
        Willpower (He possesses the combined willpower of the previous eight wielders
        of One For All, and his own willpower has strengthened considerably as well)
        and Resistance to Mind Manipulation (The vestiges of his predecessors can
        block mind attacks)
      source_id: character-stats-profiles-ryuko-tatsuma-ryukyu-my-hero-academia
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: City Block Level (Can break through a Victory Bot using a metal plate,
        which can withstand explosions this powerful without a scratch), Higher with
        5% (Can drop kick a massive steel beam. Able to harm Bakugo, who can withstand
        the power of massive explosions. Considers 5% a minor increase in strength),
        Multi-City Block Level with Delaware Smash. Large Island Level+ with 100%
        (As powerful as All Might during the events Two Heroes, who is this powerful)
        | Multi-City Block Level (Has been training for almost a whole year, making
        him much stronger than before. It was stated that Phantom Thief's limbs would
        have exploded if he had managed to use the full power of One For All, while
        Deku's more trained body is able to wield it without blowing his limbs off.
        Phantom Thief is several times weaker than 8%. Monoma can harm base Kirishima),
        Small Town level with 8% (Several times stronger than Monoma, who can harm
        Kirishima. His X Catapult with Bakugo managed to push Nine back), Small City
        Level with 20% (Far stronger than his 10%, which is Comparable to Bakugo.
        Who can harm The Serpenters and both them and he can survive the force of
        his Howitzer Impact), Large Country Level with 100% (Far stronger than before,
        Dispersed Nine's massive Storm with a shockwave alongside Bakugo) | Large
        Town Level (Has strengthened his body to allow him to handle 10% without harming
        his body. Meaning that his 10% shouldn't be too much stronger than his base),
        Higher with 10% (Should be comparable to Bakugo), Large Town Level+ with 15%
        (Broke through Flect Turns Reflect, which his 10% couldn't do), Small City
        Level with 20% (Harmed a villain, that could withstand Bakugo's Howitzer Impact,
        and his St. Louis Smash was shown to be comparable to it), Large Country Level
        with 100% | Small City Level (Has become far stronger since his first fight
        with Muscular, allowing him to wield 30% as he used to do with 5% in the past.
        Likely meaning that the power boost from 30% is marginal. Also doesn't use
        20% at all anymore, likely meaning that he has surpassed it, even in base),
        Higher with 30% (Considerably stronger than his 20%, scales to Gran Torino,
        who survived an Air Cannon, as well as caught All Might. Who had been launched
        by a massive attack by All For One), Large Country level with 45% (He possesses
        enough strength to restrain Shigaraki, who was said to be just as powerful
        as All Might and equal to the USJ Nomu. Should be comparable to the Near-High
        End Nomu that survived the Tiamat Missiles. Is superior to Endeavor, who contributed
        to creating a massive Pyrocumulonibus cloud), At Least Continent Level with
        100% (Far superior to his previous 100%. A single hit at 100% could dislocate
        Shigaraki's jaw. Comparable to All Might in his Prime). Higher with Fa Jin
        (Can store kinetic energy and release it for bursts of power and speed)
      source_id: character-stats-profiles-ryuko-tatsuma-ryukyu-my-hero-academia
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Athletic Human (Able to run on par with Bakugo) with Hypersonic reactions
        and combat speed (Superior to Mineta, who can dodge whip attacks. Can react
        to Shoto's Ice, which can move at these speeds), Higher with 5% (Can easily
        move faster than bullets. Caught fire through sheer speed on several occasions),
        Massively Hypersonic+ with 100% (Has been stated to be as quick as All Might)
        | Supersonic Travel Speed (Able to move at these speeds) with High Hypersonic+
        Reaction and combat speed (Can react to Nine, even in base. Who can move at
        these speeds), Massively Hypersonic with 8% (Deku in this state is way faster
        than his 5%, scales to Kaminari, who caught Lightning. Kept pace with Eraser
        Head, who can dodge lightning. Roughly equal to Bakugo, who can move at these
        speeds), Higher with 20% (Overhaul was impressed by Deku's speed, claiming
        that he could only avoid his strikes because they were too easy to predict,
        which should make him comparable to Nighteye and Rappa, the latter of whom
        could move at speeds comparable to Overclock, which can blitz Knuckleduster
        from 250 meters away), Massively Hypersonic+ with 100% (Could dodge Nine's
        Lightning at close range. Far faster than his 20%) | At Least Supersonic Travel
        speed, Massively Hypersonic Combat and Reaction speed (Shouldn't be too much
        slower than his 10%), At least Massively Hypersonic Combat and Reaction speed
        with 10% (Superior to the speed of his 8%), Higher with 15%, Even Higher with
        20%, Massively Hypersonic+ with 100% | At Least Supersonic Travel speed, At
        Least Hypersonic+ Combat and Reaction speed (Faster than before), At least
        Massively Hypersonic Combat and Reaction speed with 30% (Superior to the speed
        of his 20%), Sub-Relativistic with 45% (Outpaced Gran Torino and multiple
        other Pro Heroes. His Blackwhip managed to out speed Shigaraki, who was said
        to be as fast as All Might and the USJ Nomu. Should also be faster than Star
        and Stripe, who caught a laser from 100 meters away, and dodged Shigaraki's
        Radio Waves. As well as Shigarki from the same fight, who could also react
        to the lasers), Relativistic+ with 100% (His Faux 100% was capable of blitzing
        a bullet from Lady Nagant, who's base bullets are this fast. With Nagant boosting
        her bullets velocity when Deku performed this feat), FTL with Fa Jin
      source_id: character-stats-profiles-ryuko-tatsuma-ryukyu-my-hero-academia
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: City Block Level (Able to take the force of his own strikes), Higher
        with 5% (Can withstand the power of Bakugo's strongest explosions. Survived
        being crushed between two steel pillars. Managed to survive a fall that left
        a crater several meters wide on solid metal), Large Island Level+ with 100%
        (His right arm was able to endure a clash against Muscular for a long period
        of time) | Multi-City Block Level (Should be as durable as the likes of Ida,
        Tsuyu, and Kirishima. Who all took hits from a casual Chimera. Who could break
        out of Shoto's ice), Small Town Level with 8%, (Survived Nines lightning,
        which can pulverize buildings, destroy a city, cause an Island wide blackout,
        and create a massive crater, even when most of it is absorbed by Kaminari),
        Large Country Level with 100% (Can take attacks from Nine at full strength)
        | Large Town Level (Withstood the Reflection of his 10% energy being redirected
        on him), Higher with 10%, Large Town Level+ with 15% (Took reflected hits
        from Flect turn, which could break his bones at 10%), Small City Level with
        20%, Large Country Level with 100% | Small City Level, Higher with 30%, Large
        Country Level with 45% (Capable of taking an elbow strike from Shigaraki,
        who is as strong as the USJ Nomu. Withstood a close range Air Cannon from
        Shigaraki, who tried but couldn't think of any other Quirk to put Deku down),
        At Least Continent Level with 100% (Far superior to his 45%), Higher with
        Iron Soles (Able to withstand even Deku's strongest kick at 100% with barely
        any damage), and with Mid-Gauntlets (Capable of taking a shot from Lady Nagant's
        Rifle, which can severely wound 45% Deku. He is in possession of two pairs
        of Mid-Gauntlets that reinforce both his arms and legs)
