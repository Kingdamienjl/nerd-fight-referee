- id: claim-standard-equipment-97651c90
  section: equipment
  axis: equipment
  text: 'His Hero Costume, which includes: *Pointers: Disc-shaped projectiles that
    stick to targets. When Chargebolt releases his electricity, it converges to where
    the released pointer is. The working distance limit is 10 meters. *Shooter: A
    device Chargebolt wears on his right forearm that fires the Pointers. It contains
    a dial that allows him to choose the pointer he wants his electricity to be directed
    towards in case multiple Pointers are set up. *Optical Visor: A headwear that
    updates Chargebolt with info about the location of the Pointers.My Hero Academia
    Volume 12 Chapter 107 *Communication Earpiece: Chargebolt wears an earpiece on
    his right ear that allows him to channel his electricity and create electrical
    communication signals. This allows him to communicate with other channels remotely.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
