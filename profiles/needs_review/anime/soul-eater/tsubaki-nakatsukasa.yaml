        lose access to his weapon transformation and even turn on her. Notable Attacks/Techniques
        ===Basic Techniques=== *Maka Chop: A disciplinary chop with the spine of a
        tome to the top of the head. Usually causes blood to spurt from the resulting
        wound. *Soul Perception: A technique used by humans in the Soul Eater universe.
        While practically any Meister, Weapon, and in some cases normal humans can
        see the souls of the deceased, this unique ability allows a person to perceive
        the souls of living people, and is much more of a rare skill. *Black Blood:
        A type of artificially made black blood cell invented by Medusa. The Black
        Blood, when infecting a person, fills the infected''s soul with madness and
        imbues him/her with great power. It can solidify, heal wounds, and can be
        used as weapons. **Black Blood Armor: During latter activations of the Black
        Blood within Maka, it is able to produce an armor of hardened blood that protects
        her from harm in the form of a black dress, that closely resembles the one
        worn while she appears in Soul''s mind. It also raises all of her physical
        stats, making her much stronger, faster, and more durable. ===Soul Resonance
        Techniques=== *Soul Resonance: A special technique used by technicians and
        their weapons, in which they synchronize their soul''s wavelength increasing
        the power of the technicians soul. By doing so, they can use highly powerful
        techniques unique to each weapon and technician pair. *Witch-Hunt: A traditional
        Scythe-Meister attack. The move turns the blade of the scythe into a crescent
        moon shape. Normally the Witch-Hunt is used to send a single wave attack along
        the ground towards the enemy but there are other variations of the move: **Number
        Six Hunt Slash: A rotating slash with a six-shaped after-image. **Letter "U"
        Hunt Slash: A crescent slash brought from below where the blade is dragged
        upward in the shape of a U. **Scythe Menace Severing: When using this attack,
        Soul collects the soul wavelength around him and redirects it back from where
        it came. The downside of this attack is that it is indiscriminate and unselective,
        being unable to distinguish between either enemy or ally. As a result, the
        technique cannot be used in team missions. There is a further disadvantage
        present due to the rotation the user must undergo to perform the attack, which
        results in disorientation for a few moments after completion. **Kamaitachi:
        A powerful technique in which "whips" the Soul Wavelengths drawn into the
        Scythe Blade from the Witch-Hunt and flings them back to the originator. The
        drawback of this technique is that it''s indiscriminate and hard to control,
        not only being not suited for team use but also cause disorientation upon
        completion. *Demon Hunt: An improved Scythe-Meister technique surpassing the
        Witch-Hunt. The scythe''s form resembles a giant broadax with a large beard
        and spike. **Letter "I" Hunt Slash: An energy shockwave that cuts in a straight
        line. *Kishin Hunt: The most powerful of the Traditional Scythe-Meister Techniques,
        it''s an even more powerful Demon Hunt that ignores the immortality of a foe
        and slices it in two, purging all evil within it. However, this technique
        will have no effect on the pure of heart due to Maka''s Anti-Demon Wavelength.'
