    - field: powers_and_abilities
      value: "Herself= Superhuman Physical Characteristics, Soul Manipulation (Can\
        \ manipulate her soul's wavelength for a variety of purposes, and attack non-corporeal\
        \ opponents. Soul can affect soul-based weaponry and swallow the souls of\
        \ his foes), Enhanced Senses and Extrasensory Perception (Can detect one's\
        \ soul, even bypassing any attempts at hiding it. She is noted for possessing\
        \ incredibly advanced Soul Perception, with Medusa considering her a great\
        \ threat specifically due to this ability), Statistics Amplification (Can\
        \ bolster her own power and that of her allies with a Soul Melody or by tapping\
        \ into Madness), Regeneration (Low-Mid, Black Blood seals virtually any non-lethal\
        \ wound and can even save Maka from being impaled through the chest or brain),\
        \ Madness Manipulation (Can instill madness into others), Empathic Manipulation\
        \ (Can nullify one's bloodlust to the point of making them unwilling to even\
        \ defend themselves), Power Nullification (Can cancel out the magic of witches),\
        \ Damage Boost (Her Anti-Demon Wavelength gives her greater power against\
        \ witches and other enemies using dark magic), Power Bestowal (Via Soul Resonance,\
        \ she can extend her Anti-Demon Wavelength to others); Resistance to Soul\
        \ Manipulation, Mind Manipulation (Her Anti-Demon Wavelength and mastery of\
        \ Black Blood grants her resistance to attempts to manipulate her, drive her\
        \ into madness, or affect her soul. She managed to resist Arachne's and Kishin\
        \ Asura's madness manipulation and can extend this resistance to a large group\
        \ of people), and Illusion Creation (Dispelled Kishin Asura's illusion that\
        \ Black\u2606Star was under) |-|With Soul= Sound Manipulation (Her Scythe,\
        \ Soul Eater Evans, can turn his Scythe Arm into a keyboard which can release\
        \ powerful sound waves that can shatter concrete and instill Madness in those\
        \ who hear it as well as counter the Madness Wavelength of others), Blood\
        \ Manipulation (Can control Black Blood, a synthetic fluid mixed with her\
        \ natural blood to create armor and enhance her attacks), Flight (Can fly\
        \ by channeling her Grigori wavelength through Soul to create wings), Shapeshifting\
        \ (Soul can change the form he takes as a Scythe), Minor Sleep Manipulation\
        \ (Soul Adagio lets her drain energy from her opponents, putting them into\
        \ a trance-like state); Resistance to Homing Attack and Weapon Manipulation\
        \ (Soul Hack allowed Maka and Soul to commandeer various projectiles around\
        \ them)"
