    - field: intelligence
      value: 'Genius in combat (As one of the Eight Generals, Asura represents the
        elite of the elite within the Shinkoku Trastrium forces. He was trained by
        Augus and fought in the War of Creation for thousands of years, battling the
        Gohmas both on the planet surface and in space. Asura can be extremely creative
        and cunning in combat, making full use of what could appear as a savage form
        of brawling at first, just to reveal itself as a polyhedric fighting style
        able to adapt against opponents of all form and size. Asura has no issues
        dealing with multiple adversaries coming at him at the same time or fighting
        while pursuing them at a fast pace. He can accurately predict the moves of
        his foes and figure out effective counters on the fly, often doing things
        such as catching weapons with his bare hands and reflect attacks back to their
        owner. Asura can adapt at fighting with two, six or even no arms at all thanks
        to his tenacity and ingenuity, which allowed him to achieve accomplishments
        such as fighting offAsura''s Wrath - Episode 6: Confessions of a Mask Yasha
        for awhile after losing all his arms and landing a well-timed killing blow
        on Augus in a most unlikely way. He later took his sword and, armed only with
        his mouth and legs, used it to cut down a great portion of an army of Gohmas
        despite not having any experience of swordfighting. Over the course of his
        story, Asura mowed through hordes of Gohmas, legions of Shinkoku Trastrium
        soldiers and entire fleets of battleships. He and Yasha have repeteadly showed
        perfect coordination, battling together with great dexterity whether they
        were on solid ground or in space. The list of powerful adversaries he defeated,
        at various stages in time, include Wyzen, Augus, Deus, Gohma Vlitra and Chakravartin.
        Has had a life-long rivalry with Yasha, since the time they trained together
        as rookies, to the several occasions when fate put each against the other,
        eventually emerging victorious in their final bout)'
