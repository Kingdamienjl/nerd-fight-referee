    - field: intelligence
      value: 'Genius in combat (As one of the Eight Generals, Asura represents the
        elite of the elite within the Shinkoku Trastrium forces. He was trained by
        Augus and fought in the War of Creation for thousands of years, battling the
        Gohmas both on the planet surface and in space. Asura can be extremely creative
        and cunning in combat, making full use of what could appear as a savage form
        of brawling at first, just to reveal itself as a polyhedric fighting style
        able to adapt against opponents of all form and size. Asura has no issues
        dealing with multiple adversaries coming at him at the same time or fighting
        while pursuing them at a fast pace. He can accurately predict the moves of
        his foes and figure out effective counters on the fly, often doing things
        such as catching weapons with his bare hands and reflect attacks back to their
        owner. Asura can adapt at fighting with two, six or even no arms at all thanks
        to his tenacity and ingenuity, which allowed him to achieve accomplishments
        such as fighting offAsura''s Wrath - Episode 6: Confessions of a Mask Yasha
        for awhile after losing all his arms and landing a well-timed killing blow
        on Augus in a most unlikely way. He later took his sword and, armed only with
        his mouth and legs, used it to cut down a great portion of an army of Gohmas
        despite not having any experience of swordfighting. Over the course of his
        story, Asura mowed through hordes of Gohmas, legions of Shinkoku Trastrium
        soldiers and entire fleets of battleships. He and Yasha have repeteadly showed
        perfect coordination, battling together with great dexterity whether they
        were on solid ground or in space. The list of powerful adversaries he defeated,
        at various stages in time, include Wyzen, Augus, Deus, Gohma Vlitra and Chakravartin.
        Has had a life-long rivalry with Yasha, since the time they trained together
        as rookies, to the several occasions when fate put each against the other,
        eventually emerging victorious in their final bout)'
      source_id: mediawiki-4697668
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Using heavy attacks causes him to overheat, forcing him into a cooldown
        period that lasts a few seconds. Before having Yasha''s Mantra Reactor added
        to his own, Asura''s mantra was too fierce for his body to contain, potentially
        killing him with his own power and making him consume potentially his entire
        life-force in exchange for pure power. As Wrath Asura, his body becomes unstable
        and cannot contain the sheer volumes of Mantra his anger generates, causing
        his body to become scorching hot and fall apart until complete self-destruction;
        attacking in this state causes more harm to AsuraAsura''s Wrath - Illustrations
        (Wrath Asura) than his enemies. All of the aforementioned limitations ceased
        from the moment Asura was bestowed the Mantra Reactor of the Karma Fortress.
        While Asura can resurrect himself, this takes time ranging from several hours
        to even thousands of years. His very existence is connected to that of the
        Mantra itself, reason why killing Chakravartin caused him to die as well.
        Note: All of Asura''s keys are indexed from the perspective of the last power-up
        and level of strength demonstrated right before the next key. |-|Mantra= Mantra
        is the energy permeating the whole universe. It is generatedAsura''s Wrath
        - Illustrations (Mantra) by the power of prayers and emotions, as well as
        existing in large quantities within the souls of every living being. Mantra
        exists in eight pure forms,Asura''s Wrath - Illustrations (The Eight Guardian
        Generals): Pride, Lust, Greed, Sloth, Vanity, Violence, Melancholy and Wrath.
        In its natural state, Mantra exists as vibrationsAsura''s Wrath - Illustrations
        (Mantra Reactor) similar to those emitted by sound waves and flows within
        living beings and can be utilized in a manner akin to electricity. The civilization
        of Shinkoku Trastrium learned to harness and store it long time in the past,
        thus achieving advanced technology and giving birth to the demigods, the only
