    - field: intelligence
      value: 'Genius in combat (As one of the Eight Generals, Asura represents the
        elite of the elite within the Shinkoku Trastrium forces. He was trained by
        Augus and fought in the War of Creation for thousands of years, battling the
        Gohmas both on the planet surface and in space. Asura can be extremely creative
        and cunning in combat, making full use of what could appear as a savage form
        of brawling at first, just to reveal itself as a polyhedric fighting style
        able to adapt against opponents of all form and size. Asura has no issues
        dealing with multiple adversaries coming at him at the same time or fighting
        while pursuing them at a fast pace. He can accurately predict the moves of
        his foes and figure out effective counters on the fly, often doing things
        such as catching weapons with his bare hands and reflect attacks back to their
        owner. Asura can adapt at fighting with two, six or even no arms at all thanks
        to his tenacity and ingenuity, which allowed him to achieve accomplishments
        such as fighting offAsura''s Wrath - Episode 6: Confessions of a Mask Yasha
        for awhile after losing all his arms and landing a well-timed killing blow
        on Augus in a most unlikely way. He later took his sword and, armed only with
        his mouth and legs, used it to cut down a great portion of an army of Gohmas
        despite not having any experience of swordfighting. Over the course of his
        story, Asura mowed through hordes of Gohmas, legions of Shinkoku Trastrium
        soldiers and entire fleets of battleships. He and Yasha have repeteadly showed
        perfect coordination, battling together with great dexterity whether they
        were on solid ground or in space. The list of powerful adversaries he defeated,
        at various stages in time, include Wyzen, Augus, Deus, Gohma Vlitra and Chakravartin.
        Has had a life-long rivalry with Yasha, since the time they trained together
        as rookies, to the several occasions when fate put each against the other,
        eventually emerging victorious in their final bout)'
      source_id: mediawiki-4697668
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Using heavy attacks causes him to overheat, forcing him into a cooldown
        period that lasts a few seconds. Before having Yasha''s Mantra Reactor added
        to his own, Asura''s mantra was too fierce for his body to contain, potentially
        killing him with his own power and making him consume potentially his entire
        life-force in exchange for pure power. As Wrath Asura, his body becomes unstable
        and cannot contain the sheer volumes of Mantra his anger generates, attacking
        in this state causes more harm to AsuraAsura''s Wrath - Illustrations (Wrath
        Asura) than his enemies. All of the aforementioned limitations ceased from
        the moment Asura was bestowed the Mantra Reactor of the Karma Fortress. While
        Asura can resurrect himself, this takes time ranging from several hours to
        even thousands of years. His very existence is connected to that of the Mantra
        itself, reason why killing Chakravartin caused him to die as well, as well
        as existing in large quantities within the souls of every living being. Mantra
        exists in eight pure forms, Asura''s Wrath - Illustrations (The Eight Guardian
        Generals): Pride, Melancholy and Wrath. In its natural state, Mantra exists
        as vibrationsAsura''s Wrath - Illustrations (Mantra Reactor) similar to those
        emitted by sound waves and flows within living beings and can be utilized
        in a manner akin to electricity. The civilization of Shinkoku Trastrium learned
        to harness and store it long time in the past, thus achieving advanced technology
        and giving birth to the demigods, the only beings able to utilize Mantra.
        It flows within them and fuels their power, which increases proportionally
        to the amount of Mantra they possess and are able to channel. With sufficient
        amounts, the strength of a demigod can even circumvent trivial matters such
        as size.Asura''s Wrath - Interlude 5 center, 400px The demigods are the descendants
        of genetically enhanced humans, Asura''s Wrath - Illustrations (Demigods)
        having gained control over Mantra and established themselves as the ruling
        class on Gaea. The Demigods'' bodies have mostly relinquished flesh in favor
        of mechanical parts, greatly increasing their strength, resilience and physical
        performances. Even their blood has been replaced by an oil-like type of liquid.
        Demigods can live for tens of thousands of years without showing any sign
        of age, but eventually their bodies will start to decay too, as shown by the
        existence of older demigods and their overall need to reproduce and ensure
        the continuation of their lineage. The most importat element within a demigod
        is its Mantra reactor, an engine whose conductors resonate with Mantra and
        transform it into fuel. In this way, the demigods achieve incredible supernatural
        abilities, and are able to increase their power exponentially the more Mantra
        they possess. Additionally, all demigods possess a basic ability to activate
        the Mantra within their bodies and cover them with additional layers of golden
        armor. The process and degrees differs among each of them. After his initial
        confrontation with Chakravartin, Asura was bestowed the Mantra Reactor of
        the Karma Fortress, Asura''s Wrath - Episode 20: The Key to Victory an engine
        so powerful that was able to store the Mantra harnessed from trillions of
        souls. With such powerful device inside him, Asura was finally able to channel
        the full extent of his potential without any of the limits his body was previously
        subjected to. Thanks to the power of Mantra, Asura grows four additional arms
        covered in metal, greatly increasing his strength and overall performances.
        At first he could only achieve such form through Mythra''s power, but later
        managed to transform on his own because of the sheer hatred he felt for Wyzen
        and the rest of the Seven Deities. From that moment on, Asura became able
        to enter such form at will. center, 500px A foreshadowing of what Asura will
        turn into later in the story. Refusing to succumb to the Gohmas, Asura''s
        rage manifests for the first time as colossal constructs of fiery Mantra.
        With this newly acquired power, Asura wipes out all the Gohmas before him,
        rendering the battlefield into a desolate wasteland. Too powerful to be contained,
        such overflowing energy finally erupts out of his body and explodes into a
        massive blast, leaving only Asura''s withered body behind. Witnessing the
        unjust death of little Ahria by the cruel hands of Olga triggered an unprecedented
        explosion of fury within Asura, transforming him into a beast of unprecedented
        power. With four gigantic phantom arms made of pure Mantra, Asura lost any
        control of himself and abandoned himself to a ma'
