    - field: weaknesses
      value: 'Using heavy attacks causes him to overheat, forcing him into a cooldown
        period that lasts a few seconds. Before having Yasha''s Mantra Reactor added
        to his own, Asura''s mantra was too fierce for his body to contain, potentially
        killing him with his own power and making him consume potentially his entire
        life-force in exchange for pure power. As Wrath Asura, his body becomes unstable
        and cannot contain the sheer volumes of Mantra his anger generates, causing
        his body to become scorching hot and fall apart until complete self-destruction;
        attacking in this state causes more harm to AsuraAsura''s Wrath - Illustrations
        (Wrath Asura) than his enemies. All of the aforementioned limitations ceased
        from the moment Asura was bestowed the Mantra Reactor of the Karma Fortress.
        While Asura can resurrect himself, this takes time ranging from several hours
        to even thousands of years. His very existence is connected to that of the
        Mantra itself, reason why killing Chakravartin caused him to die as well.
        Note: All of Asura''s keys are indexed from the perspective of the last power-up
        and level of strength demonstrated right before the next key. |-|Mantra= Mantra
        is the energy permeating the whole universe. It is generatedAsura''s Wrath
        - Illustrations (Mantra) by the power of prayers and emotions, as well as
        existing in large quantities within the souls of every living being. Mantra
        exists in eight pure forms,Asura''s Wrath - Illustrations (The Eight Guardian
        Generals): Pride, Lust, Greed, Sloth, Vanity, Violence, Melancholy and Wrath.
        In its natural state, Mantra exists as vibrationsAsura''s Wrath - Illustrations
        (Mantra Reactor) similar to those emitted by sound waves and flows within
        living beings and can be utilized in a manner akin to electricity. The civilization
        of Shinkoku Trastrium learned to harness and store it long time in the past,
        thus achieving advanced technology and giving birth to the demigods, the only
        beings able to utilize Mantra. It flows within them and fuels their power,
        which increases proportionally to the amount of Mantra they possess and are
        able to channel. With sufficient amounts, the strength of a demigod can even
        circumvent trivial matters such as size.Asura''s Wrath - Interlude 5 center|400px
        |-|Demigod Physiology= The demigods are the descendants of genetically enhanced
        humans,Asura''s Wrath - Illustrations (Demigods) having gained control over
        Mantra and established themselves as the ruling class on Gaea. The Demigods''
        bodies have mostly relinquished flesh in favor of mechanical parts, greatly
        increasing their strength, resilience and physical performances. Even their
        blood has been replaced by an oil-like type of liquid. Demigods can live for
        tens of thousands of years without showing any sign of age, but eventually
        their bodies will start to decay too, as shown by the existence of older demigods
        and their overall need to reproduce and ensure the continuation of their lineage.
        The most importat element within a demigod is its Mantra reactor, an engine
        whose conductors resonate with Mantra and transform it into fuel. In this
        way, the demigods achieve incredible supernatural abilities, and are able
        to increase their power exponentially the more Mantra they possess. Additionally,
        all demigods possess a basic ability to activate the Mantra within their bodies
        and cover them with additional layers of golden armor. The process and degrees
        differs among each of them. After his initial confrontation with Chakravartin,
        Asura was bestowed the Mantra Reactor of the Karma Fortress,Asura''s Wrath
        - Episode 20: The Key to Victory an engine so powerful that was able to store
        the Mantra harnessed from trillions of souls. With such powerful device inside
        him, Asura was finally able to channel the full extent of his potential without
        any of the limits his body was previously subjected to. |-|Transformations=
        {{#tag:tabber| {{!}}-{{!}}Six-Armed Vajra= Thanks to the power of Mantra,
        Asura grows four additional arms covered in metal, greatly increasing his
        strength and overall performances. At first he could only achieve such form
        through Mythra''s power, but later managed to transform on his own because
        of the sheer hatred he felt for Wyzen and the rest of the Seven Deities. From
        that moment on, Asura became able to enter such form at will. center|500px
        {{!}}-{{!}}Semi-Berserker= A foreshadowing of what Asura will turn into later
        in the story. Refusing to succumb to the Gohmas, Asura''s rage manifests for
        the first time as colossal constructs of fiery Mantra. With this newly acquired
        power, Asura wipes out all the Gohmas before him, rendering the battlefield
        into a desolate wasteland. Too powerful to be contained, such overflowing
        energy finally erupts out of his body and explodes into a massive blast, leaving
        only Asura''s withered body behind. {{!}}-{{!}}Berserker/Wrath= Witnessing
        the unjust death of little Ahria by the cruel hands of Olga triggered an unprecedented
        explosion of fury within Asura, transforming him i'
