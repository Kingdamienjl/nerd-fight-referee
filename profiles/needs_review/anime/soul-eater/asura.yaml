        killing him with his own power and making him consume potentially his entire
        life-force in exchange for pure power. As Wrath Asura, his body becomes unstable
        and cannot contain the sheer volumes of Mantra his anger generates, attacking
        in this state causes more harm to AsuraAsura''s Wrath - Illustrations (Wrath
        Asura) than his enemies. All of the aforementioned limitations ceased from
        the moment Asura was bestowed the Mantra Reactor of the Karma Fortress. While
        Asura can resurrect himself, this takes time ranging from several hours to
        even thousands of years. His very existence is connected to that of the Mantra
        itself, reason why killing Chakravartin caused him to die as well, as well
        as existing in large quantities within the souls of every living being. Mantra
        exists in eight pure forms, Asura''s Wrath - Illustrations (The Eight Guardian
        Generals): Pride, Melancholy and Wrath. In its natural state, Mantra exists
        as vibrationsAsura''s Wrath - Illustrations (Mantra Reactor) similar to those
        emitted by sound waves and flows within living beings and can be utilized
        in a manner akin to electricity. The civilization of Shinkoku Trastrium learned
        to harness and store it long time in the past, thus achieving advanced technology
        and giving birth to the demigods, the only beings able to utilize Mantra.
        It flows within them and fuels their power, which increases proportionally
        to the amount of Mantra they possess and are able to channel. With sufficient
        amounts, the strength of a demigod can even circumvent trivial matters such
        as size.Asura''s Wrath - Interlude 5 center, 400px The demigods are the descendants
        of genetically enhanced humans, Asura''s Wrath - Illustrations (Demigods)
        having gained control over Mantra and established themselves as the ruling
        class on Gaea. The Demigods'' bodies have mostly relinquished flesh in favor
        of mechanical parts, greatly increasing their strength, resilience and physical
        performances. Even their blood has been replaced by an oil-like type of liquid.
        Demigods can live for tens of thousands of years without showing any sign
        of age, but eventually their bodies will start to decay too, as shown by the
        existence of older demigods and their overall need to reproduce and ensure
        the continuation of their lineage. The most importat element within a demigod
        is its Mantra reactor, an engine whose conductors resonate with Mantra and
        transform it into fuel. In this way, the demigods achieve incredible supernatural
        abilities, and are able to increase their power exponentially the more Mantra
