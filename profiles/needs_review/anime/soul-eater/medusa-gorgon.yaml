  intelligence:
    text: 'Genius; A brilliant scientist, skilled in emotional manipulation, and capable
      of executing multi-step plans over months and years to her benefit. ManipulatedSoul
      Eater: Chapter 37 the course of battle between DWMA and Arachnophobia all while
      retrieving Brew without anyone noticing. Medusa is a very formidable and capable
      unarmed combatant. Her fighting style is a defensive one consisting of the usage
      of magic, kicks, skills in blocking, and her tail snake. Her defenses are considerable
      to the point she usually leaves no openings. Her combat prowess is enough to
      fend off and place considerable injury on Franken Stein when wielding Spirit.Soul
      Eater Manga: Chapter 21 She is also able to hold her own with Justin LawSoul
      Eater: Chapter 69 and defend herself of assaults from Enrique, a monkey and
      skilled in thai boxing.Soul Eater: Chapter 60. She had successfully figured
      out the DWMA''s secret Soul Eater: Chapter 15 from her time as a nurse and invented
      the Black Blood, which can turn one into a Kishin via resonating with them from
      the madness.Soul Eater: Chapter 67 Medusa is also very skilled in manipulating
      and deceiving others. She is capable of bending almost anyone to her will through
      methods varying from false kindness to blackmail and even torture. The best
      proof of her acting and manipulation skills is the fact that she managed to
      live unnoticed in the DWMA, under the nose of even Death himselfSoul Eater:
