        (Superior to Liz, who can perceive spirits and ghosts.) *Non-Physical Interaction
        (Ordinary people like Kilik can touch dead souls as if they were physical
        objects, even though they appear intangible to matter.) *Martial Arts *Acrobatics
        *Flight (With Broom) * Shapeshifting (Can quickly change her new body to match
        the appearance of her old one) * Shapeshifting, Animal Manipulation (Witches
        souls have the ability to transform, allowing them to turn into animals or
        insects specific to them) *Magic (With Vector Arrows and Magic Energy) *Statistics
        Amplification (Magic can be used as a layer covering the bodies of magical
        beings, making them stronger and granting them such high resistance that it
        resembles invulnerability.) *Energy Projection & Energy Manipulation (Through
        her magic, she can manifest vector arrows and other arrows to do several abilities)
        *Vector Manipulation (With Vector Magic, Can forcibly move someone in a specific
