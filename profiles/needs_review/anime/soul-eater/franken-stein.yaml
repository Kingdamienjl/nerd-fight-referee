- id: claim-weaknesses-58da5aaf
  section: weaknesses
  axis: weakness
  text: "Izuna can not be used for a long time as it puts strain on him quickly. Is\
    \ easily susceptible to madness. {| class=\"wikitable mw-collapsible mw-collapsed\"\
    \ !Notable Attacks/Techniques: |- | *{{Translation|Soul Perception|\u9B42\u611F\
    \u77E5|Tamash\u012B Kanchi}}: Franken Stein is able to sense and perceive the\
    \ souls of other beings. Unlike most Meisters, not only can he see the souls himself,\
    \ but his Soul Perception is at such a high level that he can read an individual's\
    \ personality, characteristics and Soul Wavelength. Unlike most meister's it doesn't\
    \ seem to take any focus to use this ability, which is probably partially why\
    \ he is able to adapt most any weapon's wavelength.Soul Eater: Chapter 2 ;Wavelength\
    \ Control Techniques *{{Translation|Adjust|\u76F8\u6BBA|S\u014Dsai}}:Soul Eater\
    \ Guidebook: How to make a Death Scythe With his control over his own wavelength,\
    \ he stated that he can easily counter the attacks of certain soul wavelength\
    \ attacks (such as Ultimate Move: Black\u2606Star Big Wave) by adjusting the characteristics\
    \ of his own wavelength to match others, which causes their wavelength to lose\
    \ its power against him. This relationship is similar to the Soul Resonance between\
    \ that of a meister and weapon.Soul Eater: Chapter 15 *{{Translation|Soul Resonance|\u9B42\
    \u306E\u5171\u9CF4|Tamash\u012B no Ky\u014Dmei}}: Stein is capable of synchronizing\
    \ his wavelength with Demon Weapons and performing more powerful techniques as\
    \ a result of his given weapon amplifying his wavelength sent by him, sending\
    \ the amplified wavelength back to Stein, and repeating the process.Soul Eater:\
    \ Chapter 5 *{{Translation|Soul Sutures|\u9B42\u7CF8\u7E2B\u5408|Tamash\u012B\
    -ito h\u014Dg\u014D}}: Soul Sutures are a precise manipulation of Stein's soul\
    \ to create threads out of his soul and suture it throughout one's body to stop\
    \ their movements. **{{Translation|Soul Thread Diffusion Suture|\u9B42\u7CF8\u62E1\
    \u6563\u7E2B\u5408|Tamash\u012B-ito kakusan h\u014Dg\u014D}}: Further enhancing\
    \ the thread, Stein can spread it throughout one's nervous system to prevent any\
    \ movement. This ability requires a lot of concentration and precise control.\
    \ *{{Translation|Soul Menace|\u9B42\u5A01|Kon'i}}: Franken Stein is a very skilled\
    \ and powerful practitioner of the special art known as Soul Menace, which allows\
    \ him to apply his own Soul Wavelength offensively without the usage of a weapon.\
    \ This ability allows him to attack with a variety of techniques which mimic the\
    \ properties of electricity.Soul Eater Volume 2; Chapter 2, page 24-25 This move\
    \ also allows him to deal deadly internal damage powerful enough to negate the\
    \ usage of the Black Blood from Crona after three usages during their battle as\
    \ well as send his opponents flying a great distance due to it's powerful force.\
    \ Due to this, he has a wide variety of techniques that few others can perform,Soul\
    \ Eater Volume 2; Chapter 5, pages 157, 161,166 as well as easily \"kill\" White\
    \ Rabbit in one hit. Black\u2606Star once remarked that unlike himself, Stein\
    \ is able to fire Soul Menaces consecutively without build-up and admits that\
    \ Stein's proficiency over Soul Menace surpasses his.Soul Eater Volume 16; Chapter\
    \ 63, page 24 **{{Translation|Two Palm Soul Menace - Twin Spears|\u4E8C\u638C\u9B42\
    \u5A01\u30FB\u53CC\u69CD |Nish\u014D Kon'i - S\u014Ds\u014D }}: A variation of\
    \ the Soul Menace attack that instead makes use of both hands, rather than just\
    \ one. The attack's power is greatly amplified and able to incapacitate even stronger\
    \ opponents.Soul Eater Manga: Chapter 2 **{{Translation|Consecutive Soul Menace\
    \ Three-Fold! \"Gi\" \"Go\" \"Shoku\"|\u638C\u9B42\u5A01 \u53C2\u6975\u300C\u9B4F\
    \u300D\u300C\u5449\u300D\u300C\u8700\u300D|Rensh\u014D Kon'i - Sangoku \"Gi\"\
    \ \"Go\" \"Shoku}}: A variation of the Soul Menace technique that rapidly hits\
    \ an opponent three times, in succession, using the same fist. The attack inflicts\
    \ enough internal damage to cause the target to bleed from the mouth.Soul Eater\
    \ Manga: Chapter 17 |} Note: This Profile only covers the Manga Version of Stein.\
    \ ==Notable Matchups== |-|Victories= |-|Losses= |-|Inconclusive= ==References==\
    \ {{Scroll box|{{Reflist|2}}}} ==Notes/Explanations== {{Scroll box|}} {{Discussions}}\
