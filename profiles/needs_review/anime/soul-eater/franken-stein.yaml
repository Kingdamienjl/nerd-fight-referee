  section: abilities
  axis: hax
  text: "*Genius Intelligence *Acrobatics (Could dodgeSoul Eater: Chapter 84 while\
    \ holding two people in his arms and shouldn't be any less skilled than Maka or\
    \ Black\u2606Star) *Enhanced Senses, Information Analysis (Spatial Awareness -\
    \ Sees everything around him clearlySoul Eater: Chapter 21 and could senseSoul\
    \ Eater: Chapter 15 space was being warped around them. Soul Vision - Emotion\
    \ Vision - Inside Vision - Power Sensing - Stein is able to see soulsSoul Eater:\
    \ Chapter 16 and see them to different degrees from simply being able to see one's\
    \ soul to being able to tell one's personality off of their soul as he doesSoul\
    \ Eater: Chapter 2 with it being regarded as an impressive skill. He can also\
    \ tell the kind of power one has as Maka did with Gopher by seeing his soulSoul\
    \ Eater: Chapter 64. Soul Wavelengths also give off one's emotional state as wellSoul\
    \ Eater: Chapter 65. It can also allow Meisters to tell what speciesSoul Eater:\
    \ Chapter 47 the soul response is from. Soul Responses can be felt from dozensSoul\
    \ Eater: Chapter 103 of meters as well) *Statistics Amplification (Through releasingSoul\
    \ Eater: Chapter 93 the cap on his madness, Stein feels freeSoul Eater: Chapter\
    \ 93, and becomes energized and excited, fightingSoul Eater: Chapter 93 & 94 in\
    \ a way Spirit thought he resembled the Kishin itself) *Weapon Mastery (Is a master\
    \ with both scythe and hammer weapons, displaying the greatest performance with\
    \ both compared to their users) *Soul Wavelength & Meister (Stein's soul wavelength\
    \ is described as being highly flexibleSoul Eater: Chapter 2, allowing him to\
    \ analyze other's and adjust his own to theirs within seconds) **Electricity Manipulation\
    \ (Could form his soul wavelength into electricity to knockoutSoul Eater: Chapter\
    \ 2 Black\u2606Star) **Forcefield Creation (Can create a forcefield like doll\
    \ from his soul wavelengthsSoul Eater: Chapter 5) **Improved Soul Manipulation,\
    \ Thread Manipulation & Paralysis Inducement (Spirit's amplificationSoul Eater:\
    \ Chapter 17 allows Stein a more precise control of his wavelength to the point\
    \ he can leave it in people and manipulate it from afar. Can create threads from\
    \ his soul wavelength to hold someone to the ground by their feetSoul Eater: Chapter\
