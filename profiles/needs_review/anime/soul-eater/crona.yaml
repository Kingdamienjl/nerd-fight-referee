- id: claim-standard-equipment-88ee4bd0
  section: equipment
  axis: equipment
  text: '*Demon Sword Ragnarok: A weapon of unique origin that Medusa melted down
    into the Black Blood that she infected into Crona, becoming their partner as a
    consequence of their symbiosis with Ragnarok becoming stronger with every soul
    they take. After Crona merged with the Black Clone, Ragnarok gained the ability
    to manifest himself through three additions Demon Swords: "The Abyss of Despair",
    "The Uncleanliness", and "The Darkness" *Black Clown: An artificial clown that
    Medusa created from Black Blood, making it compatible with Crona and given them
    additional power through Madness Fusion. *Demon Tools (Brew)'
  source_ids: *id004
