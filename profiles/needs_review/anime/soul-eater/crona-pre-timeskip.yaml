      Resonance and swordsmanship due to Ragnarok having control of them. Their best
      ability is the Black Blood running through their body, Crona is enhanced with
      Ragnarok using it to support their musclesSoul Eater: Chapter 18 in combination
      with their movements, allowing Crona to fight better and take on attacksSoul
