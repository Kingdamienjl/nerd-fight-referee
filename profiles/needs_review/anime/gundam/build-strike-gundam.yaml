  axis: attack
  text: Below Average Human level (As a competitive toy, it is not meant for use against
    humans, but it can melt through the plastic of other Gunpla with its weaponry)
    | Below Average Human level (Greater output than before, can vaporize the plastic
    of other Gunpla when using its beam rifle's maximum output) | Below Average Human
    level (Even greater output than before, is considered a World-class Gunpla, Assisted
    in the destruction of the 1/60 Scale Zaku II, which could easily withstand the
    beam weaponry of other World-Class Gunpla), higher with the RG System and the
    Discharge System (Rifle Mode's blast is several times more powerful than any of
    the Build Strike's normal attacks, Can overpower the Gundam X Maoh's Maoh Sword,
    which channels the power of the Gundam X's Satellite Beam Cannon, with the Build
    Knuckle attack, Shattered the Arista Crystal with the Hyper Build Knuckle, which
    was considerably larger than itself, A much smaller Arista Crystal was unharmed
    when struck with a metal bat) | Below Average Human level, higher with the RG
    System and Discharge System (Presumably superior to the Star Build Strike, comparable
    to the Star Burning Gundam, whose Hyper Build Burning Knuckle was able to completely
    shatter and destroy Mashita's Psycho GM)
  source_ids: *id003
  decisive: true
  status: unverified
