- id: claim-weaknesses-d9b9f5e2
  section: weaknesses
  axis: weakness
  text: As a Gunpla powered by Plavsky Particles, the Build Strike will be rendered
    inert if moved outside of an area rich with Plavsky Particles. | Its Beam Rifle
    can be broken by utilizing its maximum output repeatedly, but this was later rectified
    | Sufficiently powerful beam weapons can overwhelm the Star Build Strike's Absorb
    Shield, such as the Gundam X Maoh's Satellite Cannon. The shield is also vulnerable
    to projectile weaponry while its beam absorption function is enabled and it cannot
    absorb beam saber-type weaponry. The Discharge System requires the Absorb Shield
    to siphon energy from enemy beam attacks to activate, rendering it useless against
    those who do not use energy attacks. The use of the Hyper Build Knuckle destroyed
    both of its arms, but it's unknown this event was because of the hardness of the
    Arista Crystal or due to a mechanical failure on the part of the Build Strike.
    The RG System can had adverse effects when used while the Build Strike is heavily
    damaged. | It apparently veers slightly to the right when handling. The Absorb
    Field is useless against kinetic weaponry.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
