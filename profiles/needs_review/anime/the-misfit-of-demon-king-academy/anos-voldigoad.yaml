      value: 'and other powerful holy swords from the Holy Sword World Hyfolia negate
        certain abilities related to Anos'' source, and were specifically created
        to harm Lions of Destruction; However, Anos is not weak against other forms
        of Holy Manipulation. Notable Attacks/Techniques: {{{content| *Magic Eyes
        of Destruction: These magic eyes are capable of "destroying" (disintegrating)
        everything in Anos'' sight, including a person''s mind and magic itself. Additionally,
        these magic eyes can put people to sleep for at least a day. These magic eyes
        can seemingly act automatically to "destroy" powers that attempt to affect
        Anos, making it the ultimate anti-magic. *Magic Eye(s) of Chaotic Destruction:
        The power of this magic eye is the essence of destruction, but in chaotic
        form. It has the power to destroy even the indestructible, but even that is
        merely an after-effect spilling out from this magic. With merely the opening
        of this magic eye the world begins to collapse and become chaotic. This magic
        eye is capable of destroying order and reason. If there''s a contradiction
        between this magic eye and the reason that must be destroyed, Anos will win
        unilaterally. Compared to the reason which makes a single event certainly
        happen, it''s far more advantageous for this magic eye which makes this event
        never happen. Additionally, the contradiction turns into the power of this
        magic eye. This magic eye can make events that will certainly happen and/or
        already happened never happen, by destroying reason and creating a logical
        contradiction, therefore unilaterally winning. In other words, as one possible
        use of this magic eye, Anos can destroy a power after the power already affected
        him, by destroying the reason of the power and creating a logical contradiction,
        therefore unilaterally winning, and subsequently nullifying the power''s effect
        as if he was never even affected to begin with. It was the original magic
        eyes of Anos before he suppressed its power to the utmost limit, obtaining
        the more reasonable Magic Eyes dyed in Destructive Purple that can destroy
        order, and later exchanged his right eye with the God of Destruction Aberneyu''s
        right eye (Divine Eye(s) of Apocalypse), obtaining the much weaker Magic Eyes
        of Destruction. Anos is still able to use the original power of the Magic
        Eye(s) of Chaotic Destruction even after "losing" his right eye. *Reincarnation:
        Magic that reincarnates the user into the future. If used by someone who excels
        in source magic, the memories and powers of their previous life can be inherited
        intact. *Resurrection: Magic that resurrects the target. If used within three
        seconds of death, the target can be resurrected without any risk. *Source
        Regeneration: Origin magic that uses the enemy''s attack and the target''s
        source as the origin, and restores the source to the state where it was not
        attacked. Normally, magic cannot be used without a source, so just before
        the enemy''s attack hits, can be sent to the future using to regenerate the
        source after its destruction. *Flame: A fire attribute magic that shoots out
        small flames. It is the lowest level fire attribute magic, but if the user
        has a high amount of magic power, it can be even more powerful than a . *Hell
        Flame Annihilation Mortar: A fire attribute magic that shoots out a miniature
        jet-black sun. It was the highest level fire attribute magic in the Militia
        World prior to the introduction of . In the Mythical Age, a single user could
        activate multiple . Anos burned down the country Dilhade with this magic while
        half-asleep. *Hell Water Destruction Waterfall: A water attribute magic that
        spews a jet-black waterfall upwards from the ground and fills the surrounding
        area with dark-coloured water that swallows its targets. *Magic Black Thunder
        Emperor: A lightning attribute origin magic that shoots out black lightning.
        Origin magic borrows power from an older and stronger existence. However,
        the older it is, the more uncertain its existence becomes, which makes its
        power difficult to control. Therefore the best way of using origin magic is
        to clearly know the existence which they are borrowing power from, or to borrow
        power from an object which they have an affinity with. By its very nature
        of borrowing power from the "origin", origin magic by definition cannot affect
        the origin itself. Origin magic cannot be activated by one''s own magic power
        alone. It is capable of producing enough power to put someone inferior on
        par with someone superior. *Ash Purple Destruction Thunder-fire Electric Field:
        A lightning attribute magic that rains down purple lighting. Its power far
        surpasses . *Hell Flame Binding Chains Magic Formation: Origin magic that
        creates a magic formation to attack the target while simultaneously restricting
        the movements and magic power of the target. *Magic Threads: Magic that enables
        the user to create and control magic threads. *Flight: Magic that enables
        the user to fly. *All Magic Complete Healing: Magic that heals all damage
        to the target'
