  axis: equipment
  text: '*Sword of the Almighty, Leviangilma: Invulnerability ([https://imgur.com/a/IT0gQWu
    When Leviangilma is summoned, Arcana or her host will remain in a state of permanence
    and cannot be destroyed. Regardless of what power is used to attack them, the
    user will remain unharmed as they aren''t subject to any forms of destruction,
    being eternally unchanging]), Causality Manipulation ([https://gyazo.com/b65a8188a590d4e8f0275f7b64323d44
    Can erase wounds from the past, retroactively protecting the target]), Power Nullification
    ([https://imgur.com/a/RKOgNoW The slashes of Leviangilma can sever the connection
    between two things, including Order]), Law Manipulation, Fate Manipulation, Conceptual
    Manipulation (Type 1), Information Manipulation (Type 2), Resistance Negation,
    Existence Erasure (History), Immortality Negation & Regeneration Negation (Types
    3, 4, 5 & 8, up to High-Godly - [Concept (Type 1), History & Information (Type
    2)] [https://imgur.com/a/7Ajucxa The sword possesses Genedonov''s power, the order
    that opposes order, thus being able to erase the gods and negate their survivability
    despite Gods being able to resist other God powers, doing so to the likes of Revalschned
    who exists as the past of the Militia World''s own history]) *Sword of a Thousand
    Bolts, Gauddigemon: Statistics Amplification ([https://imgur.com/a/Tyd1hdO Demons
    swords like other magic weapons and items possess the ability to amplify their
    wielder''s power by at least tenfold for mediocre items and up to several tenfold
    for genuine well made items]), Unholy Manipulation (Is a demon sword thus it releases
    magic on the same wavelength as demons), Electricity Manipulation & Limited Durability
    Negation (Gauddigemon [https://imgur.com/a/NIcItWx causes heavy lightning to surge
    through the wounds or scars it inflicts burning the target to a crisp]), Size
    Manipulation (Gauddigemon''s blade [https://imgur.com/a/8XBdyYb is capable of
    extending long distances as purple lightning]), Existence Erasure, Invulnerability
    Negation & Conceptual Manipulation (Type 1; Erased the [https://imgur.com/a/0ZNrM9u
    Netherworld King Aeges Code] and the [https://imgur.com/a/J5zJGMb Goddess of Creation
    Militia]. Can destroy sources, Gods along with their source which is [https://gyazo.com/1f517fb2d8cb0ae60df3a9b9a0ef84ff
    invulnerable]), Immortality Negation & Regeneration Negation (Types 2, 3, 4, 5
    & 8 up to High-Godly; Is a demon sword capable of killing Gods. Graham enchanted
