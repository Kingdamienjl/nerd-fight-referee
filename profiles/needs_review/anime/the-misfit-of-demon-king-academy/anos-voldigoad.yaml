- id: claim-intelligence-6b5f7b3c
  section: power_scale
  axis: battle_iq
  text: At least Extraordinary Genius, likely Supergenius ([https://imgur.com/a/tF7GDOX
    He has a great understanding of magical efficiency, including theoretical and
    practical formulae]. [https://imgur.com/a/8BOimb2 In one second, Anos memorized
    and learned a complicated magic formula which took Sasha Necron, a genius as well,
    1 month to learn and then proceeded to complete the formula which even the creator
    wouldn't have been able to do for another 1000 years after witnessing it only
    once]. He effortlessly deciphered hundreds of thousands of magic characters, a
    feat which would take an accomplished mage a whole day to do, after looking at
    it just once. [https://imgur.com/a/btB1UAe He is a master of creation magic. Expert
    creation magic users create not just the object but the atoms that make up the
    object. This means they are knowledgeable about the atomic structure of what they
    create]. [https://imgur.com/a/RACF176 He has mastered almost every spell in existence],
    he has also developed various original spells of his own which includes but is
    not limited to Origin Magic, a completely new and powerful type of magic, Teleportation
    magic which links two spaces allowing one to transcend distance. [https://imgur.com/a/RIq96VK
    Can instantly create new spells for a given situation, whereas creating a spell
    is normally a task that takes years and sometimes decades]. Grysilis Dello, a
    genius magic researcher, [https://imgur.com/a/LNs6MxG succeeded in understanding
    and reviving ancient runes, took 800-2000 years to utilize them to develop his
    own ancient spells comprising of over a hundred million characters. Ancient runes
    were deemed incomprehensible by other researchers of the Mythical Era. It is impractical
    and utilizes a synergy of ancient characters, numerals and illogical arithmetic
    to develop complex spell formulas even by the standards of the Mythical Era yet,
    just by seeing it once, Anos not only instantly analyzed and understood the mechanics,
    strengths, weaknesses and limits of ancient runes, but also arrived at a spell
    lying at the very limit of its capabilities]. [https://imgur.com/a/UaBWaUf Anos
    read and perfectly memorized 1799 books in mere moments]. In mere moments, [https://imgur.com/a/xAZkrCq
    he deciphered and read an unknown language passed down in a civilization through
    the half of it that was deciphered into ancient runes. This civilization had been
    deciphering the language for hundreds of years and were unable to complete it].
    While under duress, [https://imgur.com/a/REANqQ6 he is capable of splitting his
    consciousness between a hundred bodies and controlling each one by maintaining
    a hundred parallel thoughts concurrently all while receiving feedback from the
    five senses of each individual body] [https://imgur.com/a/AheabwG Is capable of
    linking eyes with the Goddess of Creation, Militia and accurately processing all
    that it is she sees without missing any details. Militia's eyes are incredibly
    wide ranging], [https://imgur.com/a/joUjkZv capable of viewing the entire world].
    Anos created Venuzdonoa which can destroy all things in existence)
