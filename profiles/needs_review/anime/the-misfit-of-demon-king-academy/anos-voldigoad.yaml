- id: claim-powers-and-abilities-8b531e32
  section: abilities
  axis: hax
  text: 'General= *Extrasensory Perception (Can create a net of magic in an area to
    identify lifeforms as well as locate others in an areaLight Novel Volume 3 Chapter
    17) *Power Mimicry (The user is able to copy any spell just by observing it and
    it is also possible to copy the spell from the same copy of another spell) *Limited
    Reactive Evolution (The Source releases the most power the closer an individual
    is to death and by utilizing this power, their abilities are stronger than before.Light
    Novel Volume 3, Chapter 3 Misha Necron gained new abilities such as her Eyes of
    Creation on the verge of death when faced against Linka TheornessLight Novel Volume
    4 Chapter 13Light Novel Volume 3 Chapter 14Light Novel Volume 4 Chapter 17) *Magic
    (At the core of every spell there is an existing theoretical and practical formula
    that allows it to function. A magical blueprint that determines the function of
    the magic. In addition, altering the spell formula changes the properties of the
    magic itselfLight Novel Volume 1 Chapter 10Light Novel Volume 2 Chapter 8Light
    Novel Volume 1 Chapter 13) *Aura, Fear Manipulation, Sleep Manipulation & Death
    Manipulation (Certain levels of magic power are capable of causing fear in andLight
    Novel Volume 1 Chapter 17 incapacitating those without a sufficient level of resistance
    to it.Light Novel Volume 3 Prologue This fear is the same that''s caused by Anos
    whose words carry a compelling force because of the immense amounts of magic power
    he possesses.Light Novel Volume 1 Prologue In more severe cases, high levels of
    magic power can outright cause others to die and as a result characters are instinctually
    unable to sense such levels of magic powerLight Novel Volume 1 Chapter 17) *Energy
    Manipulation (Can utilize the magic power in the environment around themLight
    Novel Volume 3 Chapter 17) *Non-Physical Interaction **Elemental (Lightning, Wind,
    Fire, Light & Water; Magic is capable of interacting with and directly harming
    beings made of these elementsLight Novel Volume 2 Chapter 19) **Information [Type
    2], Stories & Emotions; (Can interact with and harm Spirits which are beings formed
    from rumors, folklore, legends, fears, beliefs, aspirations of othersLight Novel
    Volume 2 Prologue) **Laws, Concepts [Type 1] & Fate; (Can interact with and harm
    Gods who are Order, the concepts, laws, fate, providence of the worldLight Novel
    Volume 4 Chapter 6) *Mind Manipulation, Soul Manipulation & Conceptual Manipulation
    (Type 3: Can interact with and harm the source which is the fundamental concept
    of existence.Light Novel Volume 1 Chapter 26 The source is the equivalent of the
    Soul and Psyche but existing even deeper. Naturally, affecting the source should
    require going beyond the soul and psyche to reach it. Whatever effect experienced
    by the source is experienced by the body and soul in some or in equal measure
    such as a deterioration in the body''s physical condition resulting from an anomaly
    with the source, splitting the source resulting in one''s body and soul being
    split as well, effect of curses which target the source affecting the body. The
    source can be split into three incomplete parts otherwise known as artificial
    sources those parts being the heart, the body and magic power. Thoughts and emotions
    are born from the source, when creating emotions to use for , Eleonore is creating
    the incomplete source, the heart. We can conclude that the heart is responsible
    for a person''s thoughts, emotions and personality and is otherwise the mind.
    Thus, anyone or thing capable of affecting the source should as well be capable
    of affecting the soul and mind) *Telekinesis (Can move and control objects with
    their magic powerLight Novel Volume 2 Chapter 5) *Statistics Amplification & Damage
    Boost (Can increase their physical prowess as well as the power of offensive and
    defensive magic by increasing the amount of magic power used in their body,Light
    Novel Volume 2 Chapter 26 the amount of magic power used in any spellLight Novel
    Volume 4 Chapter 12) *Animal Manipulation & Clairvoyance (Can take control of
    animals and use them as familiars, share vision with them.Light Novel Volume 3
    Chapter 17 Can project videos of far locations seen through magic eyes or familiars
    via Light Novel Volume 2 Chapter 7Light Novel Volume 2 Chapter 22) *Creation (Can
    create various objects, structures, weaponsLight Novel Volume 1 Chapter 1) Dimensional
    Storage (Can store items away inside storage magic circlesLight Novel Volume 3
    Chapter 6Light Novel Volume 4 Chapter 2Light Novel Volume 4 Chapter 15) *Forcefield
    Creation & Limited Invulnerability (Can create forcefields via magic & anti-magic
    barriers. Anti-Magic barriers can''t be broken by pure physical attacks) *Limited
    Law Manipulation (allows the user to make an absolute contract with a person,
    bounding himself and the person to the rules of said contractLight Novel Volume
    1 Chapter 4) *Telepathy (Can communicate their thoughts to others via , read minds
    via Light Novel Volume 1 Chapt'
