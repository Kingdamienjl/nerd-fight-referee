        ability to fly allows it to avoid Ground-Type moves that travel along the
        ground, it is still vulnerable to Ground-Type moves that can strike it from
        the air, such as Mud Bomb or Thousand Arrows. It's warrior-like mentality
        causes it to be stubborn and reckless. Charizard will die if the flame on
        the tip of its tail is ever extinguished. Flare Blitz deals a significant
        amount of damage to Charizard upon impact with its target, and Solar Power
        causes Charizard to take damage every turn in harsh sunlight, Mega Charizard
