        \ the reigning Champion before losing to Ash. His strategies are able to easily\
        \ overwhelm and counter the likes of other champion-tiered trainers such as\
        \ Lance and Diantha, and he is described as a genius with unmatched observational\
        \ skills. He is capable of advanced learning and observation of his opponent's\
        \ strategies, and can even replicate them like he did with Inteleon copying\
        \ Pikachu's Counter Shield Strategy. As the champion, Leon is also highly\
        \ knowledgeable about Pok\xE9mon, being able to easily calm and befriend a\
        \ wild Corviknight, as well as shares a lot of understanding about the phenomena\
        \ surrounding them such as Dynamax, Gigantamax and even Mega EvolutionPok\xE9\
        mon Journeys - Episode 86: A Battle of Mega Versus Max) Standard Tactics:\
        \ *As the highest ranked trainer in the world, Leon offers a diverse and overwhelming\
        \ set of skills and strategies to his battling, that are effective in both\
        \ long-term planning or improvised as the battle is ongoing, even against\
        \ other strategically-advanced Pok\xE9mon champions such as Ash and Diantha.\
        \ He is highly perceptive of his opponents, and is stated to learn from every\
        \ battle he watches. *Charizard is considered his Ace Pok\xE9mon, and he will\
        \ usually rely on it when sizing up to other powerful Pok\xE9mon such as Diantha's\
        \ Mega Gardevoir, Ash's Pikachu and even Eternatus. His Rillaboom is also\
        \ notably powerful and used to sweep his opponents like it did against Diantha.\
        \ His Cinderace and its versatile Libero ability allows him to change its\
        \ type to better suit particular matchups, such as making it resist Pikachu's\
        \ Thunderbolt by transforming into a Ground-type. Leon is also very accustomed\
        \ to switching his Pok\xE9mon out and managing his numbers to maintain advantage,\
        \ and even employs the likes of Dragapult's Dragon Tail to manipulate his\
        \ opponent's ability to switch."
