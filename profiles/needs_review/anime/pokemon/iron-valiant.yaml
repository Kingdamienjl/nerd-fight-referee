        \ and Self-Confusion), Damage Boost and Minor Self-Power Nullification (If\
        \ a Pok\xE9mon uses a move that's the same type as itself, the move's power\
        \ will increase. Sheer Force increases the power of moves with secondary effects\
        \ at the cost of negating those effects), Size Reduction (All Pok\xE9mon have\
        \ the ability to shrink themselves to fit inside Pok\xE9balls), Non-Physical\
        \ Interaction (Pok\xE9mon are able to interact with and harm Gastly, who is\
        \ 5% deceased spirit and 95% poisonous gas, and Spiritomb, a Pok\xE9mon who\
        \ is composed of 108 spirits), Regeneration (Mid)(All Pok\xE9mon are able\
        \ to quickly recover from being crushed flat), Pressure Point Strikes (The\
        \ original Japanese text described critical hits as \"striking a pressure\
        \ point\"), Social Influencing (People who own Pok\xE9mon find themselves\
        \ much easier to talk to), Accelerated Development (Pok\xE9mon will become\
        \ more experienced from fights than they normally should if they fight smarter\
        \ opponents such as trainers or are traded to a different trainer. Pok\xE9\
        mon can even gain experience just by eating food), Enhanced Senses and Extrasensory\
        \ Perception (Pok\xE9mon can routinely find items while walking that their\
        \ trainers don't. Pok\xE9mon can also sense the energy of powerful opponents,\
        \ such as Zapdos. Pok\xE9mon can also sense when the seasons change), Resistance\
        \ to Absolute Zero (Pok\xE9mon can survive getting hit by the move Sheer Cold\
        \ without dying, a one hit knockout move that has a temperature of absolute\
        \ zero, and will take zero damage from the attack if they are a higher level\
        \ than the user),Corrosion Inducement and Acid (Pok\xE9mon are not hurt by\
        \ the moves Corrosive Gas, a move that corrodes away a Pok\xE9mon's held item\
        \ with acidic gas, and Gastro Acid, a move where Pok\xE9mon shoot their stomach\
        \ acid), Plant, Fungus, and Arthropod Manipulation (Bug and Grass-type moves\
        \ are not very effective on Flying-types like Braviary) and Immunity to Spiritual\
        \ Force Manipulation and Accuracy Reduction (Ghost-type moves have no effect\
        \ on Normal-types like Braviary, Keen eye prevents accuracy loss) Same as\
        \ before minus Power Nullification and Resistance to Arthropod Manipulation\
        \ and Immunity to Spiritual Force Manipulation, Psychic Energy and Aura Manipulation\
