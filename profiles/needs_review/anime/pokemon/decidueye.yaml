- id: claim-weaknesses-177caafd
  section: weaknesses
  axis: weakness
  text: "Weak to Ghost, Dark, Flying, Ice, and Fire type moves. Becomes extremely\
    \ flustered by a surprise attack Notable Attacks and Techniques: *Spirit Shackle:\
    \ Decidueye shoots out multiple ghostly arrows which hit the opponents shadow,\
    \ damaging it and stitching his shadow to the ground, preventing escape. *Phantom\
    \ Force: Decidueye vanishes and then reappears, dealing damage to the opponent\
    \ whilst ignoring barriers. *Leaf Storm: Decidueye shoots out a powerful storm\
    \ of sharp leaves, lowering its special attack. *U-turn: Decidueye rushes at the\
    \ opponent and then does a u-turn. The damage depends on the Pok\xE9mon's friendship\
    \ level. *Spite: Decidueye lowers the PP of the last move the opponent used. *Tackle:\
    \ Decidueye tackles its opponent. *Growl: Decidueye growls, intimidating the opponent\
    \ and lowering its attack by two times. *Leafage: Decidueye pelts the target with\
    \ precisely moving leaves. *Astonish: Decidueye makes a sudden loud noise, astonishing\
    \ its opponent and dealing damage, all while causing them to flinch. *Peck: Decidueye\
    \ charges its beak with energy and strikes the opponent. *Shadow Sneak: Decidueye\
    \ extends its shadow and attacks the opponent from behind. This attack strikes\
    \ the target before they can even act under normal circumstances. This is due\
    \ to priority which allows the attacker always move before it's target can regardless\
    \ of speed when using said move. *Razor Leaf: Decidueye hits the opponent with\
    \ a multitude of razor sharp leaves. *Synthesis: Decidueye absorbs sunlight and\
    \ heals its HP. *Pluck: Decidueye pecks the opponent, stealing any berries they're\
    \ holding. *Nasty Plot: Decidueye thinks nasty thoughts, boosting his special\
    \ attack two-fold. *Sucker Punch: Decidueye strikes the opponent first before\
    \ they have a chance to attack. This move fails if the opponent is not readying\
    \ an offensive move. *Leaf Blade: Decidueye strikes the opponent with blades made\
    \ out of leaves and filled with grass-type energy. *Feather Dance: Decidueye envelops\
    \ the opponent in feathers, lowering their attack stat significantly. *Brave Bird:\
    \ Decidueye flies upwards and then strikes its opponent with full force, taking\
    \ some damage from the impact. *Confuse Ray: Decidueye shoots out a ball of light\
    \ which confuses the target when hit. *Double Team: Decidueye creates illusionary\
    \ copies of itself which it can then control *Defog: Decidueye clears all status\
    \ changes and barriers off of the battlefield.. *Knock Off: Decidueye strikes\
    \ the opponent, knocking off its items. Abilities *Overgrow: Powers up Grass-type\
    \ moves when the Pok\xE9mon's HP is low. *Long Reach: If Decidueye uses a contact\
    \ move, it will not activate any effects caused by contact. Z-move *Sinister Arrow\
    \ Raid: Decidueye's signature Z-move after it learns Spirit Shackle. Decidueye\
    \ creates countless arrows using its Z-Power and shoots the target with full force."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6fd8dee3
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Small Size (Type 1; Rowlet is 0.3 meters\
    \ tall) *Flight *Stealth Mastery (Rowlet can sneak up its targets and pelt them\
    \ with vicious kicks before they noticePok\xE9mon Sun/Moon/Ultra Sun/Ultra MoonPok\xE9\
    mon Scarlet and Violet) *Bodily Weaponry (Unconventional; Rowlet's feathers are\
    \ as sharp as blades) *Plant Manipulation (Can use Grass-type moves such as Leafage\
    \ and Razor Leaf) *Sound Manipulation, Statistics Reduction, and Social Influencing\
    \ (Via Growl which makes an opponent lower their attack by cutely growling at\
    \ them. Astonish attacks the target by crying out in a startling fashion which\
    \ can cause the target to flinch) *Darkness Manipulation (Shadow Sneak has the\
    \ user extend its shadow and attacks the foe from behind) *Self-Healing (Synthesis\
    \ restores the user's current HP based on the weather in the battle. Roost has\
    \ the user land and rest its body which restores the user's HP by up to half its\
    \ max HP) *Statistics Amplification (Nasty Plot has the user stimulate its brain\
    \ by thinking bad thoughts which sharply raises the user's Sp. Atk. Ominous Wind\
    \ blasts the target with a gust of repulsive wind which may also raise the user\u2019\
    s offensive and defensive stats) *Statistics Reduction (Feather Dance covers the\
    \ target's body with a mass of down that harshly lowers its Attack stat) *Afterimage\
    \ Creation (Double Team makes illusory copies of itself to raise the users evasiveness)\
    \ *Status Effect Inducement and Mind Manipulation (Confuse Ray fires a sinister\
    \ ray that causes confusion) *Minor Power Bestowal (Baton Pass switches the user\
    \ with a party Pok\xE9mon in waiting and passes along any stat changes the user\
    \ had) *Air Manipulation and Forcefield Nullification (Defog uses a strong wind\
    \ that blows away the target's barriers such as Reflect or Light Screen and lowers\
    \ the target's evasiveness. Ominous Wind blasts the target with a gust of repulsive\
    \ wind) *Statistics Amplification/Statistics Reduction Nullification (Haze eliminates\
    \ every stat change among all the Pok\xE9mon engaged in battle) *Curse Manipulation\
    \ (Curse if used by a Ghost-type The user will lose half of its maximum HP and\
    \ put a curse on the target which causes the target to 1/4 of its maximum HP at\
    \ the end of each turn) *Homing Attack (Magical Leaf scatters curious leaves that\
    \ chase the target) Resistance to; *Fighting-type and Water Manipulation (Only\
    \ takes 1/2 damage from Fighting and Water-type attacks) *Plant Manipulation (Only\
    \ takes 1/4 damage for Grass-type attacks) Immunity (within reason) to; Ground-type\
    \ (It's Flying-type grants an Immunity to Ground-type moves) Same as before including;\
    \ *Greater Bodily Weaponry, Marksmanship and Superhuman Precision (Dartrix has\
    \ feathers called blade quills that it throws at enemies or prey. Dartrix seldom\
    \ misses its shoots. Dartrix can throw each of its blade quills precisely at week\
    \ pointsPok\xE9mon Sword and Shield) *Enhanced Senses (Dartrix is supremely sensitive\
    \ to the presence of others, it can detect opponents standing behind it, flinging\
    \ its sharp feathers to take them out) *Intangibility Nullification (Foresight\
    \ enables a Ghost-type target to be hit by Normal- and Fighting-type attacks.\
    \ It also enables an evasive target to be hit) Same as before except Immunity\
    \ to Ground-type and Fighting-type resistance; *Greater Marksmanship and Superhuman\
    \ Precision (Decidueye's shots never miss. Decidueye fires arrow quills from its\
    \ wings with such precision, they can pierce a pebble at distances over a hundred\
    \ yards. In a tenth of a second, it can nock and fire an arrow quill, piercing\
    \ an opponent's weak point before they notice what's happening) *Greater Stealth\
    \ Mastery (Decidueye can mask its presence, allowing it to attack unaware foesPok\xE9\
    mon Sun and Moon site) *Greater Darkness Manipulation (Spirit Shackle has the\
    \ user attack while simultaneously stitching the target's shadow to the ground\
    \ to prevent the target from escaping. Phantom Force has the user disappear then\
    \ strike the target on the next turn, bypassing any protection moves) Immunity\
    \ (within reason) to; *Normal-type and Fighting-type (It's Ghost-typing grants\
    \ an immunity to Normal and Fighting-type attacks) Same as Dartrix except Immunity\
    \ to Ground-type and Fighting-type resistance; *Likely Marksmanship and Superhuman\
    \ Precision (Should possess similar skills to a normal Decidueye) *Enhanced Homing\
    \ Attack (Aura Sphere lets loose a pulse of aura power from deep within its body\
    \ at the target which never misses) *Enhanced Statistics Reduction (Triple Arrows\
    \ has a 50% chance of lowering the target's Defense. In Legends Arceus it also\
    \ heightens the chance of Decidueye's future attacks landing critical hits. Rock\
    \ Smash has a 50% chance of lowering the target's Defense) Resistance to; Rock-type,\
    \ Ground-type, Electricity Manipulation, Darkness Manipulation (Only takes 1/2\
    \ damage from Rock, Ground, Electric, and Dark-type moves)"
