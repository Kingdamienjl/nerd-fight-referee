  name: Resistance to; *Fighting-type and Water Manipulation (Only takes 1/2 damage
    from Fighting and Water-type attacks) *Plant
  description: "Resistance to; *Fighting-type and Water Manipulation (Only takes 1/2\
    \ damage from Fighting and Water-type attacks) *Plant Manipulation (Only takes\
    \ 1/4 damage for Grass-type attacks) Immunity (within reason) to; Ground-type\
    \ (It's Flying-type grants an Immunity to Ground-type moves) Same as before including;\
    \ *Greater Bodily Weaponry, Marksmanship and Superhuman Precision (Dartrix has\
    \ feathers called blade quills that it throws at enemies or prey. Dartrix seldom\
    \ misses its shoots. Dartrix can throw each of its blade quills precisely at week\
    \ pointsPok\xE9mon Sword and Shield) *Enhanced Senses (Dartrix is supremely sensitive\
    \ to the presence of others, it can detect opponents standing behind it, flinging\
    \ its sharp feathers to take them out) *Intangibility Nullification (Foresight\
    \ enables a Ghost-type target to be hit by Normal- and Fighting-type attacks.\
    \ It also enables an evasive target to be hit) Same as before except Immunity\
    \ to Ground-type and Fighting-type resistance; *Greater Marksmanship and Superhuman\
    \ Precision (Decidueye's shots never miss. Decidueye fires arrow quills from its\
    \ wings with such precision, they can pierce a pebble at distances over a hundred\
    \ yards. In a tenth of a second, it can nock and fire an arrow quill, piercing\
    \ an opponent's weak point before they notice what's happening) *Greater Stealth\
    \ Mastery (Decidueye can mask its presence, allowing it to attack unaware foesPok\xE9\
    mon Sun and Moon site) *Greater Darkness Manipulation (Spirit Shackle has the\
    \ user attack while simultaneously stitching the target's shadow to the ground\
    \ to prevent the target from escaping. Phantom Force has the user disappear then\
    \ strike the target on the next turn, bypassing any protection moves) Immunity\
    \ (within reason) to; *Normal-type and Fighting-type (It's Ghost-typing grants\
    \ an immunity to Normal and Fighting-type attacks) Same as Dartrix except Immunity\
    \ to Ground-type and Fighting-type resistance; *Likely Marksmanship and Superhuman\
    \ Precision (Should possess similar skills to a normal Decidueye) *Enhanced Homing\
    \ Attack (Aura Sphere lets loose a pulse of aura power from deep within its body\
    \ at the target which never misses) *Enhanced Statistics Reduction (Triple Arrows\
    \ has a 50% chance of lowering the target's Defense. In Legends Arceus it also\
    \ heightens the chance of Decidueye's future attacks landing critical hits. Rock\
    \ Smash has a 50% chance of lowering the target's Defense) Resistance to; Rock-type,\
    \ Ground-type, Electricity Manipulation, Darkness Manipulation (Only takes 1/2\
    \ damage from Rock, Ground, Electric, and Dark-type moves)"
