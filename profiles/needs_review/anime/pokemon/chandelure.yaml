    mon Scarlet and Violet) *Soul Manipulation (Able to take the opponent's soul out\
    \ of their body and burn it or absorb it, and Litwick can directly attack the\
    \ soul) *Absorption (Of life energy, souls, and fire) *Statistics Amplification\
    \ (After absorbing fire, Litwick's Fire-Type attacks are empowered) *Shadow Manipulation\
    \ *Fire Manipulation (With various fire type moves, like Flame Burst, which can\
    \ be used continuouslyPokemon Journeys: The Series Episode 14) *Poison Manipulation\
    \ *Status Effect Inducement (Via Confuse Ray) *Body Control (Acid Armor allows\
    \ the user to liquefy and reform their own body) *Power Nullification (Via Imprison\
    \ which temporarily prevents the target from using any moves that the user is\
    \ capable of) *Size Manipulation (Via Minimize which shrinks the user and allows\
    \ them to better evade attacks) *Illusion Creation (Night Shade causes a target\
    \ to see a frightening mirage which causes them harm) *Empathic Manipulation (Via\
    \ Captivate which allows the user to use their use their supernatural charm to\
    \ infatuate a target of the opposite gender) *Curse Manipulation (Via Curse) *Durability\
    \ Negation (Curse inflicts a curse at the target at the cost of the user's health.\
    \ Said curse deals a proportionate amount of damage after a period of time and\
    \ will continue until the target perishes. Pain Split adds the total amount of\
    \ health between the user and the target before sharing it equally, often harming\
    \ the target regardless of defenses) *Statistics Reduction (Via Clear Smog and\
    \ Haze, both moves removing all stat changes from targets and/or allies. Memento\
    \ causes the user to faint at the cost of severely reducing their target's attacking\
    \ capabilities) *Limited Forcefield and Precognition Negation (Via Infiltrator)\
    \ Resistance to: *Poison Manipulation *Acid Manipulation *Steel-Type *Plant Manipulation\
    \ *Ice Manipulation *Bug-Type All previous abilities greatly enhanced *Greater\
    \ Life Manipulation (Lampent's Pokedex entry states it can absorb life energyPokemon\
    \ Black and White Episode 26) *Small Size (Type 0. Is 0.6 meters tall) All previous\
    \ abilities except Small Size greatly enhanced"
