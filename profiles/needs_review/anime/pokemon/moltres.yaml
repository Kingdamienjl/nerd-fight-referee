  axis: weakness
  text: 'Moltres is vulnerable to Water, and Electric Type moves and is especially
    weak to Rock Type moves. Using Burn Up removes its Fire Typing which removes its
    Water Type weakness in exchange for an Ice Type weakness and lessens its Rock
    Type weakness and removes its burn immunity. Becomes weak to Ground Type moves
    if forcibly grounded before it uses Burn Up. Weak to Rock, Electric, Ice, and
    Fairy type moves Feats: *It can generate so much energy that it causes the seasons
    to change with its presence alone. *Can quickly cross Sinnoh''s routes.'
