  axis: hax
  text: "Superhuman Physical Characteristics, Bodily Weaponry (Stinger), Dynamax,\
    \ Non-Physical Interaction (Able to interact with Ghost-type Pok\xE9mon), Poison\
    \ Manipulation (Poison Sting deals damage and has a 30% chance of poisoning the\
    \ target), Enhanced Senses, Healing, Adhesive Manipulation, Statistics Reduction,\
    \ Thread Manipulation (With String Shot), Status Effect Inducement (Poison status),\
    \ Small Size (Type 2, Weedle are usually 0.3m according to the Pokedex) Resistance\
    \ to Plant Manipulation, Poison Manipulation, Acid Manipulation, Magic and Sleep\
    \ Manipulation Same as before, plus Small Size (Type 1, around 0.6m), Defense\
    \ Amplification (Moves like Harden raise the user's Defense by one stage), Body\
    \ Control (Harden is a move that hardens the user's body, increasing durability),\
    \ Purification (Type 3, Can quickly cure itself of status effects like burning,\
    \ frozen, sleep, mind manipulation, paralysis, electric based paralysis) Same\
    \ as before except it loses Purification due to lacking the Shed Skin ability,\
    \ plus Small Size (Type 0, is 3\u203203\u2033 ft in height), Flight, Statistics\
    \ Amplification (Swords Dance and Agility should grant this), Darkness Manipulation,\
    \ Poison Manipulation, Rage Power, Berserk Mode (Outrage is an ability it can\
    \ learn in the Let's Go games), Durability Negation to an extent via Endeavor,\
    \ Pressure Point Strike (Laser Focus can be used to increase the chances of it\
    \ landing a critical hit. Additionally, Beedrill's Sniper ability allows it to\
    \ do even more damage with a critical hit. A critical hit is described as a pressure\
    \ point attack), Reactive Power Level (Fury Cutter gets stronger the more times\
    \ it hits the enemy. Swarm Is an ability that increases Beedrill's bug attack\
    \ power when its low on health), Weapon Creation (Toxic Spikes creates spikes\
    \ made out of poison), Superior Statistics Amplification (Fell Stinger drastically\
    \ increases its power after it KOs or kills a target)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
