      \ Pok\xE9mon), higher via the Bicycle | Massively Hypersonic (Can react to other\
      \ First Partner Pok\xE9mon like Silver's Totodile) | FTL (Can trade blows with\
      \ Whitney's Miltank; can react to Maylene's Lucario) | FTL (Kept up with Jasmine's\
      \ extremely heavily trained Steelix; reacted to Post-FRLG Giovanni's team) |\
