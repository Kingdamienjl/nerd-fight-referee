    - field: powers_and_abilities
      value: "Pokemon as a series is pretty powerfull. They has cosmic Legendaries\
        \ such as Arceus who created the Pok\xE9mon Multiverse and Giratina who is\
        \ a Multiversal anti-matter manipulator, along with Dialga and Palkia, who\
        \ have control over time and space respectively. The series also has the Weather\
        \ Trio, who are responsible for shaping the main planet setting of the series.\
        \ It consists of Groudon, who creates continents, who expands the sea, who\
        \ is superior to both and ends the conflict between the two Pok\xE9mon. The\
        \ Legendaries in this verse in general are usually very powerful either in\
        \ terms of raw power such as Regigigas being able to tow continents or hax\
        \ such as Xerneas being able to grant and control life and Hoopa's manipulation\
        \ of hyperspace. Quite a few Legendary Pok\xE9mon are planet busters as well.\
        \ Many Pok\xE9mon, both Legendary and non-Legendary, are capable of using\
        \ hax techniques in forms of moves, usually in form of Ghost and Psychic Types."
      source_id: character-stats-profiles-ethan-pok-mon-pokemon
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
