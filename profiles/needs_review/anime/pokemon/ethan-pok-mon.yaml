        \ powerful than his, and he has improved his mind as well as his abilities.\
        \ Sabrina states his love for his Pok\xE9mon \"smashed\" her psychic abilities,\
        \ with the Gym Leader even theorizing that love may too be a form of psychic\
        \ abilitySaffron City Gym), Stealth Mastery (Snuck up on multiple Farfetch'd\
        \ despite their sensitive ears. Covertly maneuvered around Team Rocket\u2019\
        s base as Lance stormed it), Social Influencing (Animal Charming; As an expert\
        \ Trainer and Pok\xE9athlete, Ethan can draw out the abilities and eternal\
        \ trust of any Pok\xE9mon he uses. Owns the Rising Badge, which allows all\
        \ Pok\xE9mon to recognize the owner as their Trainer and obey their every\
        \ command without question (and then earned 8 more Gym Badges after that).\
        \ Reputation; Has gathered countless adoring fans throughout all of Johto\
        \ from his adventures as a Pok\xE9mon Trainer, his victories in the Battle\
        \ Frontier, his athletic career in the Pok\xE9athlon, and so on. Charisma;\
        \ Many characters in the verse are charmed by Ethan's character enough to\
        \ give them their personal phone numbers, or even the phone number of a loved\
        \ one. Instigating Fear; A Dragon Tamer who claimed to have seen \"real terror\"\
        \ and challenged Ethan soon pled for mercy once Ethan won), Genius Intelligence,\
        \ Sound Manipulation via Pok\xE9Gear and GB Sounds, Purification via the Cleanse\
        \ Tag (Wards off evil spirits), Resistance to Temperature Manipulation (Can\
