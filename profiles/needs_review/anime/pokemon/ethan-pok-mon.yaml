- id: claim-weaknesses-6df57660
  section: weaknesses
  axis: weakness
  text: "None notable | The weaknesses of all his specific Pok\xE9mon Feats: *Defeated\
    \ all 8 Johto Gym Leaders *Defeated the veteran of Dragon Pok\xE9mon and Pok\xE9\
    mon League Champion, Lance *Defeated all 8 Kanto Gym Leaders *Defeated all 5 Frontier\
    \ Brains even without his Legendary Pok\xE9mon *Defeated the Karate King, Chuck,\
    \ and Bruno, the greatest martial artists in the Indigo League; and defeated Maylene,\
    \ Sinnoh\u2019s greatest martial artist, in the Pok\xE9athlon *Maneuvered around\
    \ the mazelike caves of Mt. Mortar, Mt. Silver, and Cerulean Cave *Traveled through\
    \ time to defeat Giovanni, stopping Team Rocket\u2019s return before it started\
    \ *Is such a skilled Pok\xE9athlete that the Hall of Fame for Pok\xE9athletes\
    \ is basically a museum dedicated to him in gold *Won the Pok\xE9athlon 100 times\
    \ *Got 1st place in all 10 Pok\xE9athlon minigames 50 times (for at least 500\
    \ 1st places) *Fought and defeated Mewtwo *If he obtains both Groudon and Kyogre,\
    \ fought and defeated Rayquaza *At the culmination of his journey, won against\
    \ the ultimate trainer Red even after he had trained on Mt. Silver for 3 years\
    \ after the events of FRLG"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-015c0d3d
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Supernatural Willpower, possible limited\
    \ Telepathy and Resistance to Mind Manipulation (Psychic Franklin stated that\
    \ Ethan's mind is more powerful than his, and he has improved his mind as well\
    \ as his abilities. Sabrina states his love for his Pok\xE9mon \"smashed\" her\
    \ psychic abilities, with the Gym Leader even theorizing that love may too be\
    \ a form of psychic abilitySaffron City Gym), Stealth Mastery (Snuck up on multiple\
    \ Farfetch'd despite their sensitive ears. Covertly maneuvered around Team Rocket\u2019\
    s base as Lance stormed it), Social Influencing (Animal Charming; As an expert\
    \ Trainer and Pok\xE9athlete, Ethan can draw out the abilities and eternal trust\
    \ of any Pok\xE9mon he uses. Owns the Rising Badge, which allows all Pok\xE9mon\
    \ to recognize the owner as their Trainer and obey their every command without\
    \ question (and then earned 8 more Gym Badges after that). Reputation; Has gathered\
    \ countless adoring fans throughout all of Johto from his adventures as a Pok\xE9\
    mon Trainer, his victories in the Battle Frontier, his athletic career in the\
    \ Pok\xE9athlon, and so on. Charisma; Many characters in the verse are charmed\
    \ by Ethan's character enough to give them their personal phone numbers, or even\
    \ the phone number of a loved one. Instigating Fear; A Dragon Tamer who claimed\
    \ to have seen \"real terror\" and challenged Ethan soon pled for mercy once Ethan\
    \ won), Genius Intelligence, Sound Manipulation via Pok\xE9Gear and GB Sounds,\
    \ Purification via the Cleanse Tag (Wards off evil spirits), Resistance to Temperature\
    \ Manipulation (Can withstand the cold of Pryce's Gym, which is actively frozen\
    \ to the point that all of its Gym trainers wear winter clothing; Can traverse\
    \ Ice Path normally, which is so cold it can freeze peoples' shoes to the cave\
    \ floor, can navigate Clair's Gym which is filled with a sea of lava); Can give\
    \ to his Pok\xE9mon: Statistics Amplification via Battle Items and Aprijuice,\
    \ Healing and Purification (Type 3) via Medicine Items, Accelerated Development\
    \ via Rare Candies, Text Manipulation via Ball Capsules, Social Influencing (Can\
    \ make his Pok\xE9mon extremely beautiful through their massive Beauty stats or\
    \ through Preparation), Immersion (Can put his Pok\xE9mon inside his Pok\xE9walker)\
    \ | Superhuman Physical Characteristics, Enhanced Senses, Non-Physical Interaction,\
    \ Supernatural Willpower (Because Ethan walks alongside his Pok\xE9mon, he has\
    \ achieved a far superior bond with them than normal trainers can; this bond allowed\
    \ his Pok\xE9mon to persevere even against the Indigo Pok\xE9mon League), Marksmanship\
    \ and Superhuman Precision (Ethan's Pok\xE9mon, even ones with the lowest Skill,\
    \ can accurately throw snowballs dozens of yards and hit their mark every time),\
    \ Resistance to Temperature Manipulation [All], all the abilities of all his Pok\xE9\
    mon"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
