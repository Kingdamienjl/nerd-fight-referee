  attack_potency:
    text: "Wall level+ (Should be at least as strong as Red when he was this age)\
      \ | Small City level (Owns a Cyndaquil, and defeated Silver\u2019s Totodile\
      \ with it) | At least Mountain level (Defeated Falkner, Bugsy, and with difficulty\
      \ he defeated Whitney. Can overpower Maylene's Gym team in the Pok\xE9athlon)\
      \ | Large Mountain level (Defeated Morty, Chuck, and Jasmine. When Celebi transported\
      \ him to the past, he defeated a post-FRLG Giovanni), | Large Island level (Defeated\
      \ the new and improved Elite Four, and eventually overcame League Champion Lance,\
      \ who should be stronger than Champion Blue, and stomped post-Kanto Silver who\
      \ easily defeated the Elite Four) | At least Large Island level (Defeated the\
      \ Kanto Gym Leaders, who are all \u201Cas strong as any in Johto\u201D\"Hmm?\
      \ You're not collecting Kanto Gym Badges? The Gym Leaders in Kanto are as tough\
      \ as any you battled in Johto. I recommend that you challenge them.\". This\
      \ would include Clair who states herself to be as strong as an Elite Four member,\
      \ and who (while considerably weaker) can fight alongside Champion Lance. Defeated\
      \ Gen 2 Blue who was going all-out, who was also the 8th and strongest Gym Leader\
      \ of Kanto) | Planet level (Fought and defeated Mewtwo and added him to his\
      \ team. In the event that he comes to own Kyogre and Groudon, he fought and\
      \ defeated Rayquaza and added him to his team. Fought a massively stronger Lance\
      \ who had become far superior to his previous state. At the culmination of his\
      \ journey, he won against Red himself, who had beaten Mewtwo even before he\
      \ trained on Mt. Silver)"
    source_ids:
    - mediawiki-4998643
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Superhuman with Relativistic+ reactions (Comparable to Trainers such as\
