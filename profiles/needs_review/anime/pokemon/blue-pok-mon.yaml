      value: 'The user charges up energy, before unleashing a devastating strike at
        the enemy. This attack has a chance to stun the enemy and has a higher chance
        to hit vital points. * Pay Day: The user throws money at the enemy. * Bind:
        The user coils around the target to damage them continually. TM Moves:= *
        Mega Punch: The user throws a strong yet inaccurate punch. * Razor Wind: The
        user charges up before slashing the opponent with sharp winds. * Swords Dance:
        A status move that doubles the user''s attack. * Mega Kick: The user throws
        a strong yet inaccurate kick. * Toxic: The user poisons the opponent, causing
        them to get afflicted with an increasingly more powerful poison. * Take Down:
        A strong move causing recoil damage on the user. * Double-Edge: An even stronger
        move causing recoil damage to the user. * Bubblebeam: The user shoots concentrated
        bubbles at the enemy, with a chance to reduce their speed. * Ice Beam: A beam
        of cold that has a chance to freeze the enemy solid. * Blizzard: A gust of
        cold wind that hits all enemies and has a chance to freeze the enemy solid.
        * Submission: A strong physical move that deals recoil damage to the user.
        * Seismic Toss: A fighting-type move that deals a fixed amount of damage.
        * Rage: An attack that deals a constantly increasing amount of damage at the
        cost of forcing the user to only use this move. * Thunder: A strong electric
        attack with a chance to paralyze with low accuracy. * Earthquake: A skill
        that provokes an earthquake. * Fissure: The user opens up the earth and crushes
        the opponent flat within it. It will automatically defeat even beings on par
        with the user. * Psychic: The user attacks the target with a telekinetic blast,
        possibly lowering their defense against projectiles. * Teleport: A simple
        teleportation technique. * Rest: The user falls asleep, healing themselves
        to full health. * Thunder Wave: The user lets out small electric waves to
        paralyze the opponent. * Tri'
      source_id: character-stats-profiles-blue-pok-mon-pokemon
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "Duplication: One of MissingNo.'s most useful aspects is its ability\
        \ to duplicate items. A specific item in one's inventory will have its number\
        \ increased to 128 instantly. In an unrelated glitch, it can passively cause\
        \ certain beings to randomly duplicate around it., Sprite Glitch: MissingNo.\
        \ causes severe issues with graphics when it appears. This can lead to characters\
        \ being duplicated as stated above, but it can also cause sprites to be scrambled\
        \ or shredded just from its sheer presence., Crash: MissingNo. appearing before\
        \ an enemy has a chance to cause the game to crash. This effectively destroys\
        \ the game world, forcing the player to load a previous state of the game.\
        \ MissingNo. itself isn't, immune to this effect, however. * Health Bar: MissingNo.'s\
        \ health bar is rendered through non-numerical symbols. This essentially means\
        \ that defeating MissingNo. through regular attacks is impossible, as its\
        \ health bar will never reach zero and instead simply scroll through different\
        \ characters. * Glitch Physiology: As a glitch, MissingNo. does not exist\
        \ as a regular being. Instead, it is a manifestation of the absence of data\
        \ on a particular Pok\xE9mon. When this Pok\xE9mon is forced to appear, it\
        \ takes a variety of pieces of incompatible information in its surroundings\
        \ and forces them to become its characteristics. As a result, MissingNo.'s\
        \ true self lacks any characteristics whatsoever and is simply a vacuum of\
        \ identity. As this nonexistence is on the level of the data of the game,\
        \ it is beyond the notions of existence and nonexistence present strictly\
        \ within the world of the game. |-|Base Moves:= * Water Gun: The user projects\
        \ water at the enemy to damage them. * Sky"
      source_id: character-stats-profiles-blue-pok-mon-pokemon
      provider_id: character_stats_profiles
      authority: high
