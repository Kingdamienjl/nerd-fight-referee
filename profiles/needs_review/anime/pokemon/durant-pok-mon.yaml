      value: "Duplication: One of MissingNo.'s most useful aspects is its ability\
        \ to duplicate items. A specific item in one's inventory will have its number\
        \ increased to 128 instantly. In an unrelated glitch, it can passively cause\
        \ certain beings to randomly duplicate around it., Sprite Glitch: MissingNo.\
        \ causes severe issues with graphics when it appears. This can lead to characters\
        \ being duplicated as stated above, but it can also cause sprites to be scrambled\
        \ or shredded just from its sheer presence., Crash: MissingNo. appearing before\
        \ an enemy has a chance to cause the game to crash. This effectively destroys\
        \ the game world, forcing the player to load a previous state of the game.\
        \ MissingNo. itself isn't, immune to this effect, however. * Health Bar: MissingNo.'s\
        \ health bar is rendered through non-numerical symbols. This essentially means\
        \ that defeating MissingNo. through regular attacks is impossible, as its\
        \ health bar will never reach zero and instead simply scroll through different\
        \ characters. * Glitch Physiology: As a glitch, MissingNo. does not exist\
        \ as a regular being. Instead, it is a manifestation of the absence of data\
        \ on a particular Pok\xE9mon. When this Pok\xE9mon is forced to appear, it\
        \ takes a variety of pieces of incompatible information in its surroundings\
        \ and forces them to become its characteristics. As a result, MissingNo.'s\
        \ true self lacks any characteristics whatsoever and is simply a vacuum of\
        \ identity. As this nonexistence is on the level of the data of the game,\
        \ it is beyond the notions of existence and nonexistence present strictly\
        \ within the world of the game. |-|Base Moves:= * Water Gun: The user projects\
        \ water at the enemy to damage them. * Sky"
