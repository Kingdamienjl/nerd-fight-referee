        \ can damage Regigigas. Later fought off the Forces of Nature relatively early\
        \ into his Unova journey), Small Country level+ with Absorbed Electricity\
        \ (Absorbed Therian Form Thundurus\u2019 power, with Thundurus being able\
        \ to damage Pikachu. Ash\u2019s Pikachu used this electricity to create an\
        \ Electro Ball significantly larger than what it could create normally) or\
        \ Combo Moves (Combines the power of two moves into one. Ash\u2019s Pikachu\
        \ one-shot Trip\u2019s Serperior, who can harm it, with a combination of Electro\
        \ Ball and Iron Tail. It also defeated Tobias\u2019 Latios with a combination\
        \ of Volt Tackle and Iron Tail), Multi-Continent level with Blue Orb (Upon\
        \ absorbing the Blue Orb, Ash\u2019s Pikachu could cancel out an attack from\
        \ Kyogre, who is comparable to Groudon, who is capable of raising the continents)\
        \ | Small Planet level (Not much weaker than Ash-Greninja. Fought Lysandre,\
        \ who could fight Alain's Mega Charizard X), higher with Ash-Greninja (Fought\
        \ and matched Alain's Mega Charizard X, which can match 50% Zygarde, who should\
        \ be 1/2 as strong as Complete Zygarde, who is capable of destroying the Megalith\
        \ that was stated to be able to destroy the world) | Universe level+ (Fought\
        \ and matched Gladion, who could damage Base Necrozma, who could affect all\
        \ of Ultra Space), higher with Z-Moves (Overpowered Guzzlord with a combined\
