- id: claim-powers-and-abilities-8d7e3e1e
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Small Size (Type 1. Is 0.4 meters tall)\
    \ *Non-Physical Interaction (Can interact with Ghost-types who are unaffected\
    \ by normal type attacks) *Telekinesis (Can use various Psychic moves) *Fire Manipulation\
    \ *Empowerment (Able to refill their energy by eating twigsPok\xE9mon X and YPok\xE9\
    mon Omega Ruby/Alpha Sapphire) *Temperature Manipulation (By puffing hot air out\
    \ of their roomy ears, they can reach a heat of 390 \xB0F) *Sound Manipulation\
    \ (Via Howl) *Statistics Amplification (Blaze empowers fire-type moves by 50%\
    \ when at 1/3 HP. Howl raises the user and their allies' attack when used) *Status\
    \ Effect Inducement (Via Psybeam which hits the target with a peculiar ray which\
    \ has a 10% chance to induce confusion) *Weather Manipulation (Via Sunny Day)\
    \ *Statistics Reduction (Tail Whip lowers the targets defenses) *Probability Manipulation\
    \ (Lucky Chant prevents the user's opponents from landing critical hits) *Sleep\
    \ Manipulation and Mind Manipulation (Can put targets to sleep via Hypnosis) *Attack\
    \ Reflection (Via Magic Coat) *Forcefield Creation (Light Screen creates a screen\
    \ of light which reduces the power of special attacks. Magic Coat creates a barrier\
    \ that reflects any non-damaging moves) *Healing (Wish heals the user a turn after\
    \ making a wish) *Power Mimicry (Via Copycat which copies the last move the opponent\
    \ has used in battle) *Reality Warping (Psychic Terrain warps the very ground\
    \ and causes strange effects on those affected. Magic Room warp reality temporarily\
    \ in a space around the user in order to disable all equipment) Resistance to\
    \ *Bug-Type (Only takes 1/2 from Bug-Type attacks) *Fire Manipulation (Only takes\
    \ 1/2 from Fire-Type attacks) *Steel-Type (Only takes 1/2 from Steel-Type attacks)\
    \ *Ice Manipulation (Only takes 1/2 from Ice-Type attacks) *Plant Manipulation\
    \ (Only takes 1/2 from Grass-Type attacks) *Fairy-Type (Only takes 1/2 from Fairy-Type\
    \ attacks) *Temperature Manipulation (By expelling heat from their ears, they\
    \ are able to protect themselves from overheating.Pok\xE9mon Scarlet and Violet\
    \ Their own ears are able to withstand expelling this hot air) All previous abilities\
    \ except Small Size greatly enhanced All previous abilities greatly enhanced *Greater\
    \ Power Mimicry (Role Play allows the user to copy the target's passive ability)\
    \ *Greater Statistics Reduction (Mystical Fire lowers the target's special attack)\
    \ *Shadow Manipulation *Clairvoyance (By gazing at the tip of their branch, they\
    \ are able to achieve a focused state which allows them to see into the future)\
    \ *Precognition (Are known for their capabilities of seeing into the future. Future\
    \ Sight lets the user foresee chance to attack in the future which hits the opponent\
    \ two turns after use) *Transformation and Statistics Amplification (While holding\
    \ Delphoxite a trainer with a Key Stone can allow Delphox to Mega Evolve which\
    \ transforms the Pok\xE9mon and increases their stats) As Mega Delphox: *Flight\
    \ (Flys in the air with it's broomstick) *Weapon Control (Mega Delphox controls\
    \ two branches that float by its side using them skillfully to attack and bewilder\
    \ foes) Resistance to *Telekinesis (Only takes 1/2 from Psychic-Type attacks)\
    \ *Fighting-Type (Only takes 1/2 from Fighting-Type attacks)"
  source_ids: *id003
  decisive: true
  status: unverified
