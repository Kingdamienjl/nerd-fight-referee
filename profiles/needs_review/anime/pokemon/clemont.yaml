  intelligence:
    text: "Supergenius; is a brilliant inventor that has created many impressive inventions\
      \ that have made him famous in the Kalos region, such as Super Training, a handheld\
      \ virtual world that Pok\xE9mon can enter and train inside to get significantly\
      \ stronger, and Lumiose City\u2019s Prism Tower light system, a display most\
      \ in Kalos would consider the most beautiful thing in the city, if not the region.\
      \ Was heavily implied to be one of the brains behind the creation of the Rotom\
      \ Dex, a machine superior to even the Mark VI Pok\xE9dex. Is one of the best\
      \ battlers in the Kalos region, his Gym requiring any challengers to possess\
      \ 4 Gym Badges to even face him. Is a Marquis in the Battle Chateau, proving\
      \ he\u2019s won a remarkable amount of battles against many heavily experienced\
      \ trainers. In Pok\xE9mon Masters, he invented a method to turn Sync Stone energy\
      \ into electricity, essentially generating usable energy through Trainers\u2019\
      \ thoughts and emotions that will never run out, and even disabled a superweapon\
      \ capable of eviscerating the entire island of Pasio and possibly even Xerneas\
      \ herself (though Lysandre had already been wrong about Yveltal being able to\
      \ do the same) Standard Tactics: Upon starting a battle, Clemont will extend\
      \ both of the mechanical arms in his backpack to intimidate the opponent, much\
      \ like a human raising their arms to scare off a bear. Clemont\u2019s battle\
      \ style revolves around using copious amounts of electricity, and as such he\
      \ will have his Pok\xE9mon use Electric Terrain as soon as the opportunity presents\
      \ itself to give his Pok\xE9mon a home field advantage on any battlefield. Then\
      \ he will use various electric attacks on his opponent, which are complemented\
      \ by the amount of electricity running through the ground to make these attacks\
      \ do even more damage than usual. *Clemont\u2019s Pok\xE9mons\u2019 go-to attack\
      \ during this scenario is Thunderbolt due to the move\u2019s already devastating\
      \ power and the fact that it normally cannot miss within the context of the\
      \ game."
    source_ids:
    - vsbattles-clemont-pokemon
    confidence: 0.6
    notes: auto_repair source extraction
