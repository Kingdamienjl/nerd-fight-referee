    \ *Solar Charger: A massive, extendable flashlight that fits in his backpack (shown\
    \ in proper use in the anime) based on a Heliolisk\u2019s frill that will absorb\
    \ sunlight during the day to provide Clemont with light whenever he needs it.\
    \ *Gift-Giving Machine: Gives a gift to anyone who beats him in a non-Gym challenge.\
    \ *Trainer-Grow-Stronger Machine: Implied to be a machine that makes his Pok\xE9\
