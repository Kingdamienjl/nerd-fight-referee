    \ and places, its PMD counterpart can create portals), Body Control, Mind Manipulation\
    \ (Its pre-evolution, Dusclops, can hypnotize its foe by waving its hands in a\
    \ macabre manner and by bringing its single eye to bear. The hypnotized foe is\
    \ made to do Dusclops's bidding), Absorption (Its pre-evolution, Dusclops, can\
    \ absorb anything, however large the object may be), Soul Absorption (Dusknoir\
    \ can absorb souls), Possession (Of an empty body), Self-Sustenance (Types 1 and\
    \ 2), Invisibility (Dusknoir's pre-evolution, Duskull, is able to make itself\
    \ invisible), Intangibility and Incorporeality (Dusknoir is a Pok\xE9mon native\
    \ from the Ghost World, another plane of existence where the spirits of deceased\
    \ humans and pok\xE9mon reside, as well as other ghost-type pok\xE9mon. Dusknoir's\
    \ body is intangible and completely hollow, and inside there is only a void and\
    \ spectral flames. Dusknoir also should be comparable to Pok\xE9mon like Gengar),\
    \ Levitation Darkness Manipulation, Ectoplasm Manipulation (Via Ghost-Type moves),\
    \ Enhanced Senses (Via Stair Sensor. The antenna on its head captures radio waves\
    \ from another worlds), Dimensional/Spiritual BFR (Dusknoir can drag souls to\
    \ other dimensions), Power Nullification (Via Disable), Illusion Creation (Its\
    \ pre-evolution, Duskull, can create illusions to frighten or deceive its opponents)\
