  axis: hax
  text: "Superhuman Physical Characteristics, Statistics Amplification, Statistics\
    \ Reduction, Precognition (Via Future Sight), Telekinesis, Status Effect Inducement\
    \ (The attack Confusion may rarely induce the Confusion status effect), Fear Manipulation\
    \ (The Pokedex states \"The Pok\xE9mon\u2019s intimidating red eyes cause all\
    \ those who see it to become transfixed with fear\"), Sleep Manipulation (via\
    \ Hypnosis. The Pokedex states, \"Its stare can lull its foes to sleep.\"), Earth\
    \ Manipulation, Healing, Enhanced Senses, Explosion Manipulation/Self-Destruction,\
    \ Restricted flight (Moves by floating in mid-air) & Immunity to Ground Type attacks\
    \ via Levitate, Resistance to Normal, Fire, Flying, Poison & Psychic Type attacks\
    \ as well as Sleep Manipulation, able to temporarily prevent a target or all participants\
    \ use of items in the battle via Embargo or Magic Room, & to prevent healing &\
    \ Regeneration via Heal Block, the moon's phase has an effect on its health &\
    \ power, Dynamax"
