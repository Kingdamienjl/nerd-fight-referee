- id: claim-powers-and-abilities-218cdfb1
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Martial Arts (Makuhita follow a harsh\
    \ and disciplined workout regimen, where they awake early in the morning, train\
    \ rigorously together, eat lots of food for energy, nap in the afternoon, and\
    \ train again.Pok\xE9mon Moon They devote their entire lives to toughening their\
    \ bodies by slamming into thick trees.Pok\xE9mon Diamond, Pearl & Platinum) *Small\
    \ Size (Type 0: Makuhita is 1 m tall) *Probability Manipulation (Focus Energy\
    \ increases the likelihood of landing critical hits on opponents. Cross Chop makes\
    \ critical hits land more easily. Vital Throw is stated to be an attack that never\
    \ misses.) *Precognition (Analytical Prediction; Detect allows the user to fully\
    \ evade almost any incoming attack) *Limited Earth Manipulation (Sand Attack allows\
    \ the user to hurl sand at a target's face) *Status Effect Inducement (Accuracy,\
    \ Flinch & Confusion; Sand Attack lowers an target's accuracy, making their attacks\
    \ less likely to land. Fake Out causes targets to flinch, making them unable to\
    \ execute a move for one turn. Dynamic Punch can cause targets to become confused\
    \ if successfully landed.) *Paralysis Inducement (Force Palm can paralyze opponents)\
    \ *Vibration Manipulation (Can create shockwaves with Force Palm. Makuhita are\
    \ capable of rumbling and quaking entire caves as a byproduct of their strenuous\
    \ training.) *Air Manipulation & BFR (Whirlwind allows the user to generate a\
    \ powerful gust of wind that blows the target out of battle) *Purification (Type\
    \ 3; Smelling Salts can cure opponents of paralysis) *Statistics Amplification\
    \ (Guts raises the user's Attack stat if they have a status condition. Bulk Up\
    \ allows the user to simultaneously increase their offensive and defensive capabilities.\
    \ Belly Drum maximizes the user's Attack stat. Helping Hand allows the user to\
    \ increase the damage of an ally's attack by 50%) *Damage Boost (Sheer Force removes\
    \ all added effects from the user's attacks and allows them to do more damage.\
    \ Black Belt boosts the power of the user's Fighting Type moves by 20%. Smelling\
    \ Salts' attack power doubles if the target is already paralyzed. Knock Off does\
    \ more damage to targets that are holding items. Counter doubles the damage of\
    \ the user's next attack, immediately after being physically hit by a target.\
    \ Reversal becomes more powerful the less HP the user has. Heavy Slam does more\
    \ damage if the user outweighs the target.) *Forcefield Negation (Feint allows\
    \ the user to bypass Protect, a move that shields the user from almost any attack)\
    \ *Forcefield Creation (Wide Guard allows the user to form a protective barrier\
    \ around their allies and themselves from wide-ranged attacks) *Dynamax (Can grow\
    \ to an enormous size in areas with Dynamax energy, most notably Galarian Dens\
    \ and Stadiums.Pok\xE9mon Sword and Shield) Resistance to; *Rock, Dark, & Bug\
    \ (Fighting Type Pok\xE9mon take \xBD\xD7 damage from Rock, Dark, and Bug-Type\
    \ Attacks) *Fire & Ice Manipulation (Takes \xBD\xD7 damage from Fire and Ice-Type\
    \ attacks with Thick Fat) * Limited Precognition (Analytical Prediction; Feint\
    \ allows the user to bypass moves like Detect) All the abilities of Makuhita except\
    \ Small Size plus; *Water Manipulation (Brine allows the user to shoot a powerful\
    \ stream of water at targets) **Further Damage Boost (Brine does double the damage\
    \ if the target's HP is less than 50%) *Further Status Effect Inducement (Flinch;\
    \ King's Rock may cause targets to flinch every time the user successfully inflicts\
    \ damage)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
