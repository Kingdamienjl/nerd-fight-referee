        \ is superior to both and ends the conflict between the two Pok\xE9mon. The\
        \ Legendaries in this verse in general are usually very powerful either in\
        \ terms of raw power such as Regigigas being able to tow continents or hax\
        \ such as Xerneas being able to grant and control life and Hoopa's manipulation\
        \ of hyperspace. Quite a few Legendary Pok\xE9mon are planet busters as well.\
