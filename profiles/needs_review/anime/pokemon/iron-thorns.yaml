        scene, where she creates a pink colored platform), Aura (Goddesses display
        an aura around themselves before transforming. They can also continue to retain
        the aura after the transformation and have it dissipate whenever), Shockwave
        Generation (Goddesses can send out shockwaves before transforming as seen
