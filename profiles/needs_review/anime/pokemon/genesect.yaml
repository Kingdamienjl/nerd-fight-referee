- id: claim-powers-and-abilities-3e1bec9a
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses,Flight, Cyborgization,
    Transformation, Immortality (Type 1), Telepathy, Elemental Manipulation (Fire,Water,
    Ice and Lightning), Energy Manipulation, Light Manipulation, Sound Manipulation,
    Magnetism Manipulation, Metal Manipulation, Homing Attack (Via Lock-On), Thread
    Manipulation and Adhesive Manipulation (The thread produced from its cannon can
    be adhesive), Passive Statistics Amplification (Download amplifies the special
    attack stat or attack stat by +1), Absorption (Giga Drain lets the user absorb
    50% of the damage done),Power Nullification (Prevents moves like Fly and Bounce
    and the Ability Levitate), Non-Physical Interaction, Mind Manipulation (Is able
    to use psychic moves such as Zen Headbutt), Poison Manipulation and Status Effect
    Inducement (Is able to use moves like toxic and other moves that cause status
    effects), Regeneration (At least Low-Mid, comparable to Mewtwo), Self-Sustenance
    (Type I, II, and III, Is able to survive in space. Genesect is a cybernetic insect
    which doesn't seem to need natural needs such as eating or sleeping), Darkness
    Manipulation (Genesect has access to the dark-type move dark pulse), Attack Reflection
    (Magic Coat reflects any move causing status conditions back to the attacker)
    Immunity to Poison and Acid (Immune to poison type moves of which some are acid
    based), Resistance to Steel, Psychic, Ice, Dragon, and Fairy and Resistance to
    Grass (Genesect's typing grants this), Immunity to Soul Manipulation and Mind
    Manipulation, Resistance to Hacking, Absorption (Is resistant to moves like Giga
    Drain), Energy Manipulation (Resistant to moves like Energy Ball) and Immune to
    Disease Manipulation
  source_ids: *id003
  decisive: true
