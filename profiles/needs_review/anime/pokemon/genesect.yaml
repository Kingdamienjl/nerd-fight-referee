    - field: standard_equipment
      value: A Drive is a held item corresponding with Genesect. It changes the type
        of the holder's Techno Blast, Genesect's signature move, to the corresponding
        type of Drive. It also changes Genesect's form, such that the Drive visible
        on its body reflects its held Drive. right The Shock Drive is a type of held
        item introduced in Generation V. It corresponds to the Electric type. The
        Shock Drive, along with the other Drives, appeared in Genesect and the Legend
        Awakened, attached to a member of the Genesect Army. While it was used with
        the same purpose of changing the type of Techno Blast in the movie, it was
        also the key item to tell its owner apart from the other Genesect. right The
        Burn Drive is a type of held item introduced in Generation V.It corresponds
        to the Fire type. Blake used the Burn Drive to battle Team Plasma on the Plasma
        Frigate, though, due to it being incomplete at the time, Genesect was injured
        by its own attack and left exhausted after using Techno Blast on some Team
        Plasma Grunts. After Blake had later used the Fire-type Techno Blast to save
        the Swords of Justice from being frozen in ice, Cobalion knocked the damaged
        Burn Drive off of Genesect's body, after which it exploded. right The Douse
        Drive is a type of held item introduced in Generation V.It corresponds to
        the Water type. The Genesect with the Douse Drive had a different personality
        from the others, and was typically timid and kind unless forced to act by
        its leader. right The Chill Drive is a type of held item introduced in Generation
        V. It corresponds to the Ice type. The Chill Drive, along with the other Drives,
        appeared in Genesect and the Legend Awakened, attached to a member of the
        Genesect Army. While it was used with the same purpose of changing the type
        of Techno Blast in the movie, it was also the key item to tell its owner apart
