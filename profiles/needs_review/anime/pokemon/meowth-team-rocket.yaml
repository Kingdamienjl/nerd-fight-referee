power_scale:
  tier:
    text: At least High 7-A, likely 6-C, higher with Machines and Power of Love, likely
      3-C to High 3-A with Bewear Mech | 6-C
    source_ids: &id002
    - mediawiki-4802149
    confidence: 0.8
  attack_potency:
    text: "At least Large Mountain Level+, likely Island Level (Despite being considered\
      \ weak, can occasionally keep up with fully evolved and Ash's pok\xE9mon, including\
      \ Pikachu, staggered a trained Tyranitar, defeated Barry's Empoleon with Scratch,\
      \ defeated a street Persian, fought several Liepards), higher with Machines\
      \ (Many machines increase his power and allows him to match Ash and co's pok\xE9\
      mon with little issue, some usually require several trained pok\xE9mon togheter\
      \ to defeat them) and Power of Love (Matched 5 fully evolved and trained Pok\xE9\
      mon attacks, which are Infernape, Staraptor, Togekiss, Seviper and Yanmega,\
      \ at once with Fury Swipe of Love before one shotting all of them), likely Galaxy\
      \ Level to High Universe Level with Bewear Mech (Could block attacks from Guzzlord,\
      \ who overpowered Bewear) | Island Level (Comparable to other Gigantamax Pok\xE9\
      mon)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "FTL (Comparable to fully evolved pok\xE9mon, occasionally reacts to Pikachu's\
      \ thundershock and other attacks, even from close range, dodged solar beam,\
      \ ran from a noddles shop to a cranyon in a short timeframe, dodged rowlette's\
      \ leaves like they were frozen, dodged pokeballs on the internet, which moved\
      \ like data), higher with Power of Love (Blitzed and defeated 5 fully evolved\
      \ and well trained Pok\xE9mon), Varies from Immobile, up to FTL with Machines\
      \ (Some mechas do not move, but many are able to keep up with other Pok\xE9\
      mon), at least Massively FTL+, likely Infinite with Bewear Mech (kept up with\
      \ Guzzlord) | FTL (Comparable to other Gigantamax Pok\xE9mon)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: "Class M (Comparable to fully evolved pok\xE9mon, struggled evenly with\
      \ Pikachu, though lost in the end, helped in halting a Dragonite), higher via\
      \ Machines (Many machines increase his strength, and his mechas are usually\
      \ capable of easily overpower Ash's pok\xE9mon) and Power of Love (Physically\
      \ outmatched 5 fully evolved Pok\xE9mon in strength), at least Class Z, likely\
      \ far higher with Bewear Mech | Class T (Comparable to other Gigantamax pok\xE9\
      mon that are far stronger than Machamp, who can move mountains)"
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Large Mountain Level+, likely Island Level, higher with Machines
      and Power of Love, likely Galaxy Level to High Universe Level with Bewear Mech
      | Island Level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: "At least Large Mountain Level+, likely Island Level (Constantly survives\
      \ attacks from fully evolved pok\xE9mon, being blasted by Pikachu to the sky\
      \ is routine to him), Toon Force makes him extremely difficult to kill (Has\
      \ survived attacks far higher than his durability, has recovered from being\
      \ turned to dust and survived other forms of lethal damage via elasticity),\
      \ higher with Machines and Power of Love (Scaling from his Attack Potency, as\
      \ Meowth performed all the feats in this state with sheer physicaly strength),\
      \ likely Galaxy Level to High Universe Level with Bewear Mech | Island Level"
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: "Superhuman (Resisted being taken to the spirit world after having his life\
      \ force drained, and endured said draining from multiple Litwicks, implied to\
      \ have lasted a long time starving, Pok\xE9mon are hard-wired for battle, and\
      \ are capable of fighting for a considerable time even while sustaining injuries\
      \ from other Pok\xE9mon)"
    source_ids: *id002
    confidence: 0.8
  range:
    text: "Standard Melee Range; at least Several Meters with Fury Swipes of Love\
      \ | Varies, up to Hundreds of Meters (Can utilize bazookas and missiles, can\
      \ utilize building-sized mechas) | Tens of Meters (is 33 meters tall, comparable\
      \ to other gigantamax pok\xE9mon)"
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: "Learned to walk on 2 and talk the human language in a week through observation,\
      \ the latter being only done by legendaries or telepathy) Resistance to Electricity\
      \ manipulation, Heat manipulation, Noxious gasses, Mind Manipulation, Death\
      \ Manipulation (Survived mimikyu's true form the second time he saw it, which\
      \ kills those that stare at it) and Limited Resistance to BFR (Resisted being\
      \ pulled to the spirit world while low on life force, came back from the mirror\
      \ world after sunset, which is impossible to do so, under a unknown timeframe),\
      \ Poison Manipulation, Fire Manipulation and Normal-Type moves, Immunity (within\
      \ reason) to Ghost-type Moves All previous abilities plus Gigantamax Via equipment\
      \ he gets: Time Manipulation and likely Limited Plot Manipulation (Fast fowarded\
      \ the narrative with his remote, can possible pause and rewind it based on the\
      \ other buttons), Flight and Spaceflight (Via jetpacks, Rockets and Meowth Balloon),\
      \ Explosion Manipulation, Statistics Amplification (Via Balloon boosts, armor\
      \ and the Mecha Evolution Power-Packed Amplify-O-Rama Mark 2, can amplify others\
      \ with other gadgets), Energy Manipulation, Air Manipulation, Enhanced Senses\
      \ (Via periscope), Can build Mechanical pok\xE9mon capable of using moves, Magnetism\
      \ Manipulation, Electricity Manipulation and Attack Reflection (Via various\
      \ Meowth Balloon Equipment, gadgets and Gengar Mecha), Absorption (Of electricity\
      \ and solar energy), Heat Manipulation, Light Manipulation, Ice manipulation,\
      \ Body Puppetry, Broadway Force, Water Manipulation, Forcefield Creation, Power\
      \ Mimicry, Smoke Manipulation, Extrasensory Perception, Mind Control, Teleportation,\
      \ BFR, Sound Manipulation, Weather Manipulation, Dream Manipulation, Hacking,\
      \ Information Analysis Resistance to Electricity Manipulation, Paralysis Inducement,\
      \ Bug and Psychic-type Moves, Ice Manipulation, Water Manipulation, Fire Manipulation,\
      \ Air Manipulation"
    source_ids: *id002
    confidence: 0.8
