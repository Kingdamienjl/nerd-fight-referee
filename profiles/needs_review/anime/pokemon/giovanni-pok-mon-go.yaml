  intelligence:
    text: "Extraordinary Genius, manages the entire Team GO Rocket organization and\
      \ outranks all 3 of its Team Leaders, who lead millions of Team GO Rocket grunts\
      \ themselves. Is capable of tricking the Player, who can easily solve the mysteries\
      \ behind various ancient Pok\xE9mon alongside Professor Willow and is an amazing\
      \ Pok\xE9mon trainer himself. Developed all of Team GO Rocket\u2019s technology,\
      \ which even Professor Willow admits is highly advanced even without knowing\
      \ what it is. Engineered the means to convert Pok\xE9mon to Shadow Pok\xE9mon,\
      \ temporarily change the entire world\u2019s Pok\xE9mon habitats, and globally\
      \ invade an entire planet all on his own. Routinely finds and acquires new Legendary\
      \ Pok\xE9mon to be used as Shadow Pok\xE9mon."
    source_ids:
    - mediawiki-3993913
