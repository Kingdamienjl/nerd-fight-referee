- id: claim-weaknesses-adffe990
  section: weaknesses
  axis: weakness
  text: "Several of his Pok\xE9mon are weak to Ice-type attacks. Is vastly overconfident,\
    \ which can be exploited by a smart enough opponent. Finding new Legendary Pok\xE9\
    mon takes time, and has so far only found the 3 Legendary Birds, Legendary Dogs,\
    \ and Mewtwo. His technology can be reverse-engineered if an opponent gets enough\
    \ of it, however only extremely smart people have been known to do this, and even\
    \ then it took time. If opposing Trainers get their hands on a Shadow Pok\xE9\
    mon and are able to purify them, they will retain some of their power they had\
    \ as a Shadow Pok\xE9mon, which can then be used against him."
  source_ids: *id003
  decisive: false
