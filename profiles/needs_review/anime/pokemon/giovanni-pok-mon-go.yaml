    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Wall level+ (Should be the same as his main canon self) | At least Planet\
      \ level, likely higher (Superior to the 3 GO Rocket Leaders, while even just\
      \ one of any of their Pok\xE9mon are easily capable of defeating a Mewtwo or\
      \ Rayquaza that had not sufficiently been powered up from their normal self.\
      \ Candela, Spark, and Blanche were implied to be required to fight him together,\
      \ all of which were capable of beating a Rocket Leader on their own. Is the\
      \ only person in the game with a straight up Legendary Shadow Pok\xE9mon, while\
      \ even Shadow Pseudo-Legendaries can challenge even the most prepared Players.\
      \ Far superior to his regular Grunts, which pre-Go Rocket arc Spark and Professor\
      \ Willow had to team up to defeat just a single one, despite Spark owning a\
      \ Zapdos and Raikou), far higher via Shadow Mewtwo (Acquired a Shadow version\
      \ of Mewtwo during GO Fest 2020, which should be massively superior to even\
      \ his Shadow Legendary Birds)"
    source_ids:
    - mediawiki-3993913
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Peak Human with Relativistic+ reactions (Comparable to Trainers as Yellow\
      \ or Cynthia who can dodge and react to attacks from fully evolved Pok\xE9mon)\
      \ | At least Relativistic+, likely far higher (His Pok\xE9mon are far superior\
      \ to a base Rayquaza, who can quickly move across the globe. Possesses Shadow\
      \ versions of the 3 Legendary Birds, meanwhile Shadow Pok\xE9mon are vastly\
      \ superior to normal Pok\xE9mon of the same species to the point where it\u2019\
      s common belief that you could never simply power one up to be as strong), far\
      \ higher via Shadow Mewtwo"
    source_ids:
    - mediawiki-3993913
    confidence: 0.6
    notes: auto_repair source extraction
