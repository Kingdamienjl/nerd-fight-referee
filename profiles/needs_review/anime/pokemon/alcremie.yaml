  axis: hax
  text: "Superhuman Physical Characteristics, Small Size (Type 1), Immortality (Type\
    \ 2) and Regeneration (Low-High) (Was born from particles, Is made of cream, Milcery\
    \ casually detaches and reattaches its parts, Alcremie regularly secretes cream),\
    \ Flight, Power Bestowal (Any patisserie visited by a Milcery is guaranteed success\
    \ and good fortune, Magic, Fragrance Manipulation, Statistics Amplification, Status\
    \ Effect Inducement (Confusion), Statistics Reduction (Opponent\u2019s evasiveness,\
    \ Misty Terrain halves the damage of dragon-type moves), Life Force Draining,\
    \ Healing (Can remove all status effects affecting the user\u2019s party, Can\
    \ heal half it\u2019s max HP), Empathic Manipulation, Light Manipulation, Can\
    \ change the terrain with Misty Terrain, limited Mind Manipulation and Power Swap\
    \ via Entrainment (Dances in a rhythmic way that compels the opponent to mimic\
    \ it, replacing their ability with the user\u2019s), Resistance to Sleep Manipulation\
    \ (Itself and allies cannot be put to sleep) and Power Nullification (Itself and\
    \ allies cannot have their move choices limited), Dynamax, Resistance to Martial\
    \ Arts (Fighting), Bug, and Darkness Manipulation (Dark)- type moves, Immunity\
    \ to Dragon-type moves | All of the previous except Flight, Reactive Evolution\
    \ (Upon evolving, it\u2019s cream takes on one of various flavors), Organic Manipulation\
    \ (Regularly secretes cream), Empathic Manipulation (Attackers who eat her cream\
    \ become rapidly soothed and lose the will to battle) | All of the previous except\
    \ Small Size, Gigantamax, Natural Weaponry (Can fire its cream as high-calorie\
    \ missiles), Danmaku, Confusion Inducement and Empathic Manipulation via cream\
    \ missiles (Fills those hit with energy and euphoria), Superior Magic and Healing\
    \ via G-Max Finale (Heals the HP of allies by half of their max HP), Explosion\
    \ Manipulation and Statistics Reduction (opponent's speed) via Max Strike, Forcefield\
    \ Creation via Max Guard"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
