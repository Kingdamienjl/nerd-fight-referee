    \ Weaponry (Has sharp fangs and can use them with moves like Bite and Crunch)\
    \ *Damage Boost (With the Adaptability ability, attacks with the same type of\
    \ the user deal more damage. with the Reckless ability, attacks that have recoil\
    \ deal more damage. Brine doubles in power if the target is under half its health.\
    \ Revenge doubles in power if the user has been hurt before using the move. Flail\
    \ becomes more powerfull the less HP the user has) *Resistance Negation (With\
    \ the Mold Breaker ability, its attacks can ignore passive defensive abilities.\
    \ The move Chip Away ignores the target's defense and evasion stats changes) *With\
    \ the Rock Head ability, it doesn't takes recoil damage from its own attacks *Sound\
    \ Manipulation and Insomnia Inducement (With Uproar, it prevents anyone on the\
    \ battlefield to fall asleep and wakes up those already sleeping) *Status Effect\
    \ Inducement (Can make the target flinch with Bite and Headbutt. Can give itself\
    \ the confusion status with Thrash) *Statistics Reduction (Tail Whip lowers defense,\
    \ Scary Face and Mud Shot lower speed, Crunch has a chance to lower defense, Bubble\
    \ Beam has a chance to lower speed, Muddy Water has a chance to lower accuracy)\
    \ *Statistics Amplification (Can raise its speed with Agility. when using Rage,\
    \ its attack get raised if it gets hit) *Biological Manipulation (Soak turns the\
    \ target into a Water type) *Self-Destruction and Durability Negation (Final Gambit\
    \ makes it faint but always deal damage equal to its remaining HP) *Berserk Mode\
    \ (via Thrash) *Earth Manipulation (via Mud Shot) *Minor Sealing (Whirlpool traps\
    \ the target into a vortex, making them unable to leave the battle) *Damage Transferal\
    \ (Endeavor makes the target's HP equal to the user) *Social Influencing (Via\
    \ Scary Face and Tail Whip) *Body Control (With Agility, it can make its body\
    \ lighter by relaxing its muscles) *Homing Attack (Swift can never missand always\
    \ hit the target) *Resistance to Water, Fire, Ice and Steel type moves *Superhuman\
    \ Physical Characteristics *Small Size (1.0 meter) *Water Manipulation (As a Water\
    \ type, it can learn a multitude of Water type moves) *Underwater Breathing *Non-Physical\
    \ Interaction (Can hurt intangible and incorporeal Pok\xE9mon like Ghastly with\
    \ any attack that is not Normal or Fighting type) *Bodily Weaponry(Has sharp fangs\
    \ and can use them with moves like Bite and Crunch) *Statistics Amplification\
    \ (With the ability rattled, its speed increases when hit with a Dark, Bug or\
    \ Ghost type attack) *Statistics Reduction (Tail Whip lowers defense, Scary Face\
    \ lowers speed, Crunch has a chance to lower defense) *Damage Boost (With the\
    \ Adaptability ability, attacks with the same type of the user deal more damage.\
    \ Last Respects deals more damage every time an ally is defeated. Flail becomes\
    \ more powerfull the less HP the user has) *Resistance Negation (With the Mold\
    \ Breaker ability, its attacks can ignore passive defensive abilities) *Sound\
    \ Manipulation and Insomnia Inducement (With Uproar, it prevents anyone on the\
    \ battlefield to fall asleep and wakes up those already sleeping) *Status Effect\
    \ Inducement (Can flinch with Zen Headbutt, Bite and Headbutt. Can give itself\
    \ the confusion status with Thrash) *Biological Manipulation (Soak turns the target\
    \ into a Water type) *Damage Transferal (Endeavor makes the target's HP equal\
    \ to the user) *Social Influencing (Via Scary Face and Tail Whip) *Resistance\
    \ to Cold Temperatures (It lives in frigid seasWhite-Striped Basculin Pok\xE9\
    dex entry - Scarlet ), Water, Fire, Ice and Steel type moves Same as White-Striped\
    \ Basculin except Small Size and Statistics Amplification. *Large Size (3.0 meters)\
    \ *Soul Manipulation (Cloaks itself in the souls of its deceased companionsBasculegion\
    \ Pok\xE9dex entry - Legends: Arceus ) *Illusion Creation (Can create terrifying\
    \ illusionsFemale Basculegion Pok\xE9dex entry - Violet ) *Darkness Manipulation\
    \ and Statistics Reduction (Shadow Ball is described as a blob of shadows, and\
    \ has a chance to lower special defense) *Teleportation and Power Nullification\
    \ (With Phantom Force, it teleports a short time before hitting the target, and\
    \ is able to hit them through barriers like Protect or precognition like Detect)\
    \ *Damage Boost (Hex doubles in power if the target suffers from a status effect)\
    \ *Statistics Amplification (With the ability Swift Swim, its speed doubles when\
    \ it rains) *Resistance to Poison and Bug type moves and immunity (within reason)\
    \ to Normal and Fighting type moves"
