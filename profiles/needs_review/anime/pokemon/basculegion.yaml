        \ Breathing, Non-Physical Interaction (Can hurt intangible and incorporeal\
        \ Pok\xE9mon like Ghastly with any attack that is not Normal or Fighting type),\
        \ Bodily Weaponry (Has sharp fangs and can use them with moves like Bite and\
