        \ using the move. Flail becomes more powerfull the less HP the user has),\
        \ Resistance Negation (With the Mold Breaker ability, its attacks can ignore\
        \ passive defensive abilities. The move Chip Away ignores the target's defense\
        \ and evasion stats changes), With the Rock Head ability, it doesn't takes\
