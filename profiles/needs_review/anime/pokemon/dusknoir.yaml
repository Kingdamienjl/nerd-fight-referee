  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Superhuman Speed, Self-Sustenance (Types\
    \ 1 and 2), Invisibility (Duskull is able to make itself invisible), Intangibility\
    \ and Incorporeality (Dusknoir's line is a native from the Ghost World, another\
    \ plane of existence where the spirits of deceased humans and pok\xE9mon reside,\
    \ as well as other ghost-type pok\xE9mon. Dusknoir's body is intangible and completely\
    \ hollow, and inside there is only a void and spectral flames. Dusknoir also should\
    \ be comparable to Pok\xE9mon like Gengar), Levitation, Limited Accelerated Development\
    \ (Via Exp. Elite), Elemental Manipulation (Of the Darkness, Hellfire, Life Force\
    \ Absorption (Via Pain Split), Statistics Reduction (Via Leer, Shadow Ball, Frighten\
    \ and Memento), Stealth Mastery and Camouflage (Duskull can hide among the shadows\
    \ and is an excellent tracker), Ectoplasm Manipulation (Via Ghost-Type moves),\
    \ Enhanced Senses (Via Stair Sensor. The antenna on its head captures radio waves\
    \ from another worlds), Water Walking (Via All-Terrain Hiker), Telekinesis (Via\
    \ Psychic), Immortality (Type 1 and 7), Dimensional Travel, Teleportation, Smoke\
    \ Manipulation and Negation (Via Haze), Power Nullification (Via Disable, Mean\
    \ Look and Imprison. Dusknoir can inflict the \"Paused\" status, which prevents\
    \ the opponent from using moves temporarily), Fear Manipulation (A glare from\
    \ the single scarlet eye of Duskull makes even burly grown-ups freeze in utter\
    \ fear), Minor Sealing (Via Mean Look), Curse Manipulation (Via Curse and Grudge),\
    \ Limited Probability Manipulation (Via Type-Advantage Master and Sharpshooter),\
    \ Status Effect Inducement, Perception Manipulation (Via Night Shade), Illusion\
    \ Creation (Its pre-evolution, Duskull, can create illusions to frighten or deceive\
    \ its opponents), Light Manipulation (Via Confuse Ray), Precognition and Time\
    \ Manipulation (Future Sight allows the user to observe and attack the target\
    \ in the future, bypassing Force fields and Precognition in the process), Invisibility\
    \ Negation and Illusion, Durability Negation (Via Curse, Pain Split and Soul Manipulation),\
    \ Damage Boost (Via Payback, Hex and Pursuit), Damage Transferal (Via Pain Split),\
    \ Non-Physical Interaction (Can harm non-corporeal Pokemon), Dynamax, Resistance\
    \ to Poison and Bug moves, Immunity to Normal and Fighting moves, Resistance to\
    \ Gravity Manipulation. Same as Duskull to a greater extent, additionally Homing\
    \ Attack (Shadow Punch), Resistance Negation (Via TCG Shadow Punch), Limited Immunity\
    \ Negation, Fire, Ice, and Electricity variety), Gravity Manipulation (Via Gravity),\
    \ Damage Transferal (Via Destiny Bond), Absorption (Dusclops can absorb anything,\
    \ however large the object may be), Mind Manipulation (Dusclops can hypnotize\
    \ its foe by waving its hands in a macabre manner and by bringing its single eye\
    \ to bear. The hypnotized foe is made to do Dusclops's bidding) Same as Dusclops\
    \ but to a greater extent, additionally Air Manipulation (Via Ominous Wind), possibly\
    \ Portal Creation (Dusknoir can travel and teleport to other worlds and places,\
    \ its PMD counterpart can create portals), Body Control, Soul Absorption (Dusknoir\
    \ can absorb souls), Possession (Of an empty body), Empathic Manipulation (Via\
    \ Dark Pulse. Dusknoir can shoot orbs imbued with loathsome emotions), Aura (Explosive\
    \ and Fear type; Via Dark Pulse), Sleep Manipulation (Via Sleep Charm), Void Manipulation\
    \ (Inside Dusknoir's body there is a void, everything that absorbs this void will\
    \ never come back), Dimensional/Spiritual BFR (Dusknoir can drag souls to other\
    \ dimensions), Berserk Mode, Danmaku, Negation (Via Foresight), Mind Reading (Via\
    \ Foresight), Statistics Amplification (Via Ominous Wind), Soul Manipulation (The\
    \ spectral ball of fire that Dusknoir generates inside its body steal the soul\
    \ instantly from those who look at it. Dusknoir can tear the soul directly from\
    \ its opponents and can harm ghosts and souls), Pseudo-Black Hole Creation, Can\
    \ swap passive abilities via Skill Swap, Can do more damage when things are looking\
    \ desperate, Takes down stamina twice as quick"
