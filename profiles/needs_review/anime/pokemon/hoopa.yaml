- id: claim-weaknesses-bc27b194
  section: weaknesses
  axis: weakness
  text: Hoopa can be confined by the Prison Bottle. Hoopa can only be unbound for
    three days, as stated in Omega Ruby & Alpha Sapphire. However, it should be noted
    that it can destroy the Bottle. While Confined, it is weak to Ghost and Dark-type
    moves. While Unbound, it is weak to Fairy-type moves and especially weak to Bug-type
    moves. Hoopa cannot utilize Hyperspace Fury while Confined. Its rings have a limit
    as to how long they can be open if stressed by a time-space distortion such as
    the one it inadvertently created around Dahara Tower.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
