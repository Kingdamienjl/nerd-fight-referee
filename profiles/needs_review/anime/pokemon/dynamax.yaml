        mon are covered in a red violet hue and have visible jolts of electricity\
        \ bouncing around them), Spatial (Dynamax causes Pok\xE9mon to warp space\
        \ around them to make them \"appear far larger than they truly are\"), Weather\
        \ (All Dynamax Pok\xE9mon create a storm within their den that grows stronger\
