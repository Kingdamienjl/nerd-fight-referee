    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Sealing (Pokeballs seal more than
        just Pokemon, they can seal rice balls, and ancient versions catch even non-Pokemon
        souls), Natural Weaponry (Croagunk and Toxicroak have natural poison sacs),
        Poison Manipulation (Poison Sting poisons the enemy, Venoshock drenches the
        enemy with poison and doubles the damage if the enemy is poisoned), Non-Physical
        Interaction, Soul Manipulation, Soul Mutilation (All Pokemon can affect ghosts
        with almost all attacks. Grimmsnarl's Spirit Break shatters one's spirit),
        Reactive Power Level (Revenge does more damage if the user was just attacked
        by the enemy), Stealth Mastery, Darkness Manipulation (Sucker Punch attacks
        with darkness and sucker punches the enemy. Bite damages the enemy with darkness.
        Has various other Dark moves), Martial Arts (Scraggy and Scrafty are fighting
        type Pokemon with expert martial arts moves), Electricity Manipulation (Thundershock,
        and many other electric moves), Healing, Purification (Shed Skin helps Scrafty
        and Scraggy to remove status conditions that work even on a conceptual level),
        Mind Manipulation, Emotional Manipulation (Torment torments the enemy and
        makes it enraged and unable to use the same attack twice in a row, Swagger
        infuriates the enemy and makes them confused), Statistics Amplification (Nasty
        Plot doubles Liepard's non physical attack potency), Fear Manipulation (Scraggy's
        Scary Face scares the enemy and lowers its speed), Statistics Reduction, Forcefield
        Negation (Brick Break destroys forcefields), Plant Manipulation (Morpeko's
        Bullet Seed), Fate Manipulation, Causality Manipulation, Law Manipulation,
        Transformation (Morpeko's Hunger Switch makes it transform into a darker version.
        All her Pokemon can Dynamax), Spatial Manipulation, Time Manipulation (Dynamax
        makes Pokemon look far larger than they actually are by warping time and space.
        Pokemon can rip apart the fabric of space with regular attacks), Air Manipulation
        (Dynamax Pokemon can blow enemies away), Resistance to, Death Manipulation
        (Perish Song does not work on Dynamaxed Pokemon)
      source_id: character-stats-profiles-marnie-pok-mon-pokemon
      provider_id: character_stats_profiles
