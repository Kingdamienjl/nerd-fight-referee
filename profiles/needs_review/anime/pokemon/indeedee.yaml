  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Supernatural Willpower (Pokemon can brush
    off status effects through sheer determination. Pokemon can regenerate their life
    force with their sheer willpower. Male Indeedee has the Inner Focus ability which
    is described as a sheer force of will to prevent them from flinching), Status
    Effect Reflection (Synchronise inflicts the same status effect the user has gotten
    from the opponent to the opponent, including burning, poisoning, electric based
    paralysis, and normal paralysis), Durability Negation (Can directly cause emotional
    damage), Spatial Manipulation, Time Manipulation, Empowerment (Love, trust, bonds
    and Galar particles can increase their power. Male Indeedee are powered by positive
    emotions), Extrasensory Perception (Males can sense emotion), Telepathy (If a
    bond between trainer and Pokemon is strong, they can read their trainer's mind.
    Females send information by touching horns with other Indeedee), Reactive Power
    Level, Energy Projection, Energy Manipulation, Statistics Reduction, Social Influencing,
    Empathic Manipulation (With Play Nice. Disarming Voice does emotional damage to
    the enemy), Mind Manipulation (Encore forces the enemy to use the same move again),
    Power Modification (Guard and Power Split), Status Effect Inducement (Confusion
    status effect), Damage Boost, Power Bestowal, Fragrance Manipulation, Purification
    (Type 3 with Aromatherapy), Telekinesis, Statistics Amplification, Healing, Power
    Mimicry (Copies stat changes with Psych Up), Non-Physical Interaction (Can interact
    with souls, dreams, minds, shadows), Dynamax, Resistance to Soul Manipulation,
    Fear Manipulation, Light Manipulation, Dream Manipulation, Empathic Manipulation,
    Air Manipulation (Resists Ominous Wind), Ectoplasm Manipulation, Darkness Manipulation
    (Resists shadow based attacks), Telekinesis, Mind Manipulation (Psychic types
    can resist mind control), Magic, Gravity Manipulation, Spatial Manipulation, Time
    Manipulation
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
