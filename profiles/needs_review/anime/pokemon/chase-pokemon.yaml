    - field: standard_equipment
      value: "Pok\xE9mon Box: As PCs are obsolete tech, the Pok\xE9mon Box is a large\
        \ cylinder with every Pok\xE9mon that Chase has ever caught stored inside\
        \ it. Chase can remove Pok\xE9mon and put them inside at will, however as\
        \ a drawback his Pok\xE9mon will not be healed by entering it like a normal\
        \ PC., Potions: Potions can heal a Pok\xE9mon\u2019s HP, or stamina, during\
        \ battle. The type of Potion dictates how much HP will be restored, from 20\
        \ HP to all of it., Revive: Items that can revive a fainted Pok\xE9mon, with\
        \ half of their health back. Max Revives restore the Pok\xE9mon back to perfect\
        \ condition., Soda Pops: Drinks are just as refreshing to Pok\xE9mon as they\
        \ are to humans, and can be used to heal their stamina as well., Antidote:\
        \ A spray that removes poison from a Pok\xE9mon., Paralyze Heal: A spray that\
        \ frees a paralyzed Pok\xE9mon., Burn Heal: A spray that heals a Pok\xE9mon's\
        \ burn., Ice Heal: A spray that defrosts a Pok\xE9mon that has been frozen\
        \ solid., Awakening: A spray that awakens a Pok\xE9mon from induced sleep.,\
        \ Ethers: Medicine that restores the PP of a single move of one of his Pok\xE9\
        mon., Elixirs: Medicine that restores the PP of every single move one of his\
        \ Pok\xE9mon has., Full Heal: A spray that heals any and all status conditions\
        \ a Pok\xE9mon has., Pewter Crunchies: A crunchy snack that heals any and\
        \ all status conditions a Pok\xE9mon has., Shalour Sable: A shortbread that\
        \ heals any and all status conditions a Pok\xE9mon has., Evolution Stones:\
        \ Curious stones capable of causing certain Pok\xE9mon to evolve., PP Up:\
        \ A medicine that slightly raises the max PP of a single move of a Pok\xE9\
        mon., PP Max: A medicine that maximizes the max PP of a single move of a Pok\xE9\
        mon., Rare Candy: A candy that makes his Pok\xE9mon stronger for each one\
        \ they eat., Candies: A candy that makes his Pok\xE9mon stronger for each\
        \ one they eat., Poke Balls, Razz Berries: Berries that make it slightly easier\
        \ to catch a Pokemon., Golden Razz Berries make it significantly easier to\
        \ catch them., Nanab Berries: Berries that calm wild Pokemon a little, making\
        \ them move around a bit less., Golden Nanab Berries significantly calm them\
        \ down., Pinap Berries: Berries that make Chase slightly more likely to get\
        \ an item from the Pokemon he's trying to catch., Golden Pinap Berries make\
        \ him significantly more likely to get an item., Key Stone: A special filled\
        \ with an unknowable power, which allows him to Mega Evolve any applicable\
        \ Pok\xE9mon that he has crafted a remarkable bond with."
      source_id: mediawiki-4786644
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Extraordinary Genius, is the greatest Pok\xE9mon mind on the planet,\
        \ having completely filled the Kanto Pokedex and defeated the Master Trainers\
        \ for every single Pok\xE9mon on the list, making him the Grand Master of\
        \ all 153 Master Trainers, every single one of which already being far above\
        \ the Elite Four. After he beat Red, he received the Battle Master title from\
        \ him, implying Red had been the greatest Trainer on Earth. Took down the\
        \ Team Rocket of the GO timeline. His Pikachu is so smart that just by learning\
        \ 2 Secret Techniques out of 5 he was already considered significantly smart\
        \ for a Pok\xE9mon."
      source_id: mediawiki-4786644
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Pikachu can only perform Pika Papow once per battle. For an unknown\
        \ reason, Chase's Pikachu absolutely refuses to evolve, Taught Partner Pikachu\
        \ all 5 Secret Techniques, becoming the first Trainer to ever do so, Filled\
        \ his Pokedex with all 153 known Pok\xE9mon, Defeated the Elite Four, Defeated\
        \ the current Pok\xE9mon League Champion, Defeated and caught Mewtwo, an unstoppable\
        \ Pok\xE9mon far superior to any other in the Pokedex, Defeated every single\
        \ Master Trainer, proving that he has the strongest iteration of every known\
        \ Pok\xE9mon, Saved up for and bought the Crown, the most expensive item in\
        \ all of GO, To catch the 3 Legendary Birds and Mewtwo, Chase had to KO them\
        \ before the catching phase began, meaning he did fully defeat them in battle.,\
        \ Whether Chase has powerful versions of Alolan Pok\xE9mon can be left up\
        \ to the discretion of the creator of the VS match, as there are no Alolan\
        \ Master Trainers that he could have defeated, the Pok\xE9mon Evolutions short\
        \ is considered noncanon to Let's Go, as Chase is portrayed as the canon protagonist\
        \ instead of Elaine virtually everywhere else and nearly the entire short\
        \ conflicts with the game's actual events."
      source_id: mediawiki-4786644
