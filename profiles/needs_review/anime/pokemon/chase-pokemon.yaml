    \ level (Tanked hits from Brock, Misty, and Lt. Surge's ace Pok\xE9mon ) | At\
    \ least Mountain level+ (Tanked hits from Erika, Sabrina, and the entire Fighting\
    \ Dojo) | Island level+ (Utilizes Mega Venusaur, Mega Blastoise, and Mega Charizard\
    \ in battle, withstood attacks from the Elite Four and even Champion Trace's Mega\
    \ Pidgeot) | Planet level (Tanked attacks from Mewtwo and the 3 Legendary Birds.\
    \ His Pikachu withstood the Pikachu Master's attempts to defeat it, meanwhile\
    \ Master Trainers\u2019 Pok\xE9mon in general are far superior to Post-Champion\
    \ Chase\u2019s Mega Pok\xE9mon; can withstand hits from Blue's Mega Charizard\
    \ Y whose team even without Mega Evolution defeated the Elite Four years ago)\
    \ | At least Galaxy level, possibly High Universe level (Possesses both forms\
    \ of Mega Mewtwo and uses him in battle. Has Pok\xE9mon like Partner Pikachu that\
    \ can keep up with him in a Double Battle. Owns the strongest iteration of all\
    \ 153 Kanto Pok\xE9mon who are as durable if not even sturdier than each respective\
    \ Pok\xE9mon's Master Trainer, who possess the strongest trained Pok\xE9mon known\
    \ to man. Can survive attacks from Red and Green's Mega Pok\xE9mon, who vastly\
    \ outclass their Master Trainer counterparts even while untransformed)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
