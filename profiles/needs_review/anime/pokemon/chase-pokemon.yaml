- id: claim-standard-equipment-f3416a47
  section: equipment
  axis: equipment
  text: "*Pok\xE9mon Box: As PCs are obsolete tech, the Pok\xE9mon Box is a large\
    \ cylinder with every Pok\xE9mon that Chase has ever caught stored inside it.\
    \ Chase can remove Pok\xE9mon and put them inside at will, however as a drawback\
    \ his Pok\xE9mon will not be healed by entering it like a normal PC. *Medicine\
    \ Pocket: **Potions: Potions can heal a Pok\xE9mon\u2019s HP, or stamina, during\
    \ battle. The type of Potion dictates how much HP will be restored, from 20 HP\
    \ to all of it. **Revive: Items that can revive a fainted Pok\xE9mon, with half\
    \ of their health back. Max Revives restore the Pok\xE9mon back to perfect condition.\
    \ **Soda Pops: Drinks are just as refreshing to Pok\xE9mon as they are to humans,\
    \ and can be used to heal their stamina as well. **Antidote: A spray that removes\
    \ poison from a Pok\xE9mon. **Paralyze Heal: A spray that frees a paralyzed Pok\xE9\
    mon. **Burn Heal: A spray that heals a Pok\xE9mon's burn. **Ice Heal: A spray\
    \ that defrosts a Pok\xE9mon that has been frozen solid. **Awakening: A spray\
    \ that awakens a Pok\xE9mon from induced sleep. **Ethers: Medicine that restores\
    \ the PP of a single move of one of his Pok\xE9mon. **Elixirs: Medicine that restores\
    \ the PP of every single move one of his Pok\xE9mon has. **Full Heal: A spray\
    \ that heals any and all status conditions a Pok\xE9mon has. **Pewter Crunchies:\
    \ A crunchy snack that heals any and all status conditions a Pok\xE9mon has. **Shalour\
    \ Sable: A shortbread that heals any and all status conditions a Pok\xE9mon has.\
    \ *Power-Up Pocket: **Evolution Stones: Curious stones capable of causing certain\
    \ Pok\xE9mon to evolve. **PP Up: A medicine that slightly raises the max PP of\
    \ a single move of a Pok\xE9mon. **PP Max: A medicine that maximizes the max PP\
    \ of a single move of a Pok\xE9mon. *Candy Jar: **Rare Candy: A candy that makes\
    \ his Pok\xE9mon stronger for each one they eat. **Candies: A candy that makes\
    \ his Pok\xE9mon stronger for each one they eat. *Catching Pocket: **Poke Balls\
    \ **Razz Berries: Berries that make it slightly easier to catch a Pokemon. ***Golden\
    \ Razz Berries make it significantly easier to catch them. **Nanab Berries: Berries\
    \ that calm wild Pokemon a little, making them move around a bit less. ***Golden\
    \ Nanab Berries significantly calm them down. **Pinap Berries: Berries that make\
    \ Chase slightly more likely to get an item from the Pokemon he's trying to catch.\
    \ ***Golden Pinap Berries make him significantly more likely to get an item. *Battle\
    \ Pocket: **Key Stone: A special filled with an unknowable power, which allows\
    \ him to Mega Evolve any applicable Pok\xE9mon that he has crafted a remarkable\
    \ bond with. **X"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-125610bc
  section: power_scale
  axis: battle_iq
  text: "Extraordinary Genius, is the greatest Pok\xE9mon mind on the planet, having\
    \ completely filled the Kanto Pokedex and defeated the Master Trainers for every\
    \ single Pok\xE9mon on the list, making him the Grand Master of all 153 Master\
    \ Trainers, every single one of which already being far above the Elite Four.\
    \ After he beat Red, he received the Battle Master title from him, implying Red\
    \ had been the greatest Trainer on Earth. Took down the Team Rocket of the GO\
    \ timeline. His Pikachu is so smart that just by learning 2 Secret Techniques\
    \ out of 5 he was already considered significantly smart for a Pok\xE9mon."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-9b126fb0
  section: weaknesses
  axis: weakness
  text: "Pikachu can only perform Pika Papow once per battle. For an unknown reason,\
    \ Chase's Pikachu absolutely refuses to evolve, and he will get impatient if he\
    \ doesn't battle for prolonged periods of time. Pikachu can't perform Pikachu's\
    \ support on himself. Feats: *Taught Partner Pikachu all 5 Secret Techniques,\
    \ becoming the first Trainer to ever do so *Filled his Pokedex with all 153 known\
    \ Pok\xE9mon *Defeated the Elite Four, who are the 4 strongest Pok\xE9mon trainers\
    \ in the world *Defeated the current Pok\xE9mon League Champion, taking his title\
    \ of strongest in the world for himself *Defeated and caught Mewtwo, an unstoppable\
    \ Pok\xE9mon far superior to any other in the Pokedex *Defeated every single Master\
    \ Trainer, proving that he has the strongest iteration of every known Pok\xE9\
    mon, earning him the title of Grand Master Trainer *Saved up for and bought the\
    \ Crown, the most expensive item in all of GO Note: *To catch the 3 Legendary\
    \ Birds and Mewtwo, Chase had to KO them before the catching phase began, meaning\
    \ he did fully defeat them in battle. *Whether Chase has powerful versions of\
    \ Alolan Pok\xE9mon can be left up to the discretion of the creator of the VS\
    \ match, as there are no Alolan Master Trainers that he could have defeated, though\
    \ all Alolan Kanto Pokemon can be traded for infinitely. *As usual, the Pok\xE9\
    mon Evolutions short is considered noncanon to Let's Go, as Chase is portrayed\
    \ as the canon protagonist instead of Elaine virtually everywhere else and nearly\
    \ the entire short conflicts with the game's actual events."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c97b5895
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Genius Intelligence, likely Immortality\
    \ (Type 1, was implied by the creators to not age physically as his model doesn't\
    \ change), Preparation (All forms except Technological), Summoning (of Elaine),\
    \ Sealing (Via Pok\xE9 Balls), can give to his Pok\xE9mon: Transformation (Evolution\
    \ items and Mega Evolution), Healing and Purification (Type 3 via Recovery Items),\
    \ Statistics Amplification (via Battle Items), | Superhuman Physical Characteristics,\
    \ Enhanced Senses, Non-Physical Interaction, Resistance to cold temperatures (All\
    \ Pok\xE9mon in the GO timeline can casually survive and live inside snowy environments)\
    \ [All], Small Size (Type 1), Electricity Manipulation, Homing Attack, Statistics\
    \ Amplification (With Agility and Double Team), Reactive Power Level (Pika Papow\
    \ does more damage the stronger the bond between Chase and Pikachu), Vector Manipulation\
    \ (Pika Papow cannot miss by any means), Power Bestowal (Can expend his Pika Papow\
    \ to amplify every stat a partner has) Afterimage Creation, Forcefield Creation,\
    \ Can paralyze enemies with several of its attacks, Healing, Resistance to Electricity\
    \ Manipulation, Metal Manipulation, Air Manipulation, Sleep Manipulation, and\
    \ Sealing (Even while trapped inside a Pok\xE9 Ball at the edge of Pallet Town,\
    \ Pikachu rolled his Pok\xE9 Ball all the way to Professor Oak\u2019s Lab, through\
    \ the door, and onto the table where Chase was supposed to have chosen a Starter\
    \ Pok\xE9mon that day, while normal Pok\xE9mon can only shake their Pok\xE9 Balls)\
    \ [Pikachu], all the assorted abilities of Venusaur, Charizard, Blastoise, Articuno,\
    \ Zapdos, Moltres, Mewtwo, and every other Kanto Pok\xE9mon along with Meltan\
    \ and Melmetal Empowerment (Bonding with Chase increases their power), Accelerated\
    \ Development, Instinctive Action (Can shake themselves out of induced sleep and\
    \ avoid attacks automatically), Damage Reduction, Damage Boost (Can deal critical\
    \ hits more often to impress its trainer), Regeneration (Low, can heal debilitating\
    \ burns out of sheer love for their trainer), Supernatural Willpower, Self-Purification\
    \ (Type 3), Supernatural Willpower and Self-Heat Manipulation (Their determination\
    \ is so fiery it can literally melt ice), Body Control/Resistance to Poison Manipulation\
    \ (Can expel poison from its bloodstream so Chase won\u2019t worry), and Status\
    \ Effect Inducement (Can break out of paralysis, heal burns, and shake itself\
    \ awake from induced sleep)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
