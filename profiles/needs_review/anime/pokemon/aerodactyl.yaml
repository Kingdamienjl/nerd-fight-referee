- id: claim-weaknesses-b8d69c91
  section: weaknesses
  axis: weakness
  text: "Weak against Rock, Steel, Water, Electric and Ice type attacks | Aerodactyl\
    \ can only access their Mega Evolutionary stage through physical possession of\
    \ a specific Mega Stone type that is uniquely attuned to that species and resonating\
    \ the Stone with an accompanying Mega Ring (or similar device containing a Key\
    \ Stone), which can only be constructed by artificial means: this excludes most\
    \ wild specimens from harnessing the innate evolutionary potential, leaving only\
    \ individuals in captivity as probable candidates for Mega Evolution. Mega Evolution\
    \ is not a permanent transformation; specimens immediately revert back to their\
    \ \"base\" forms once combat has been successfully concluded Notable Attacks/Techniques\
    \ *Rock Head: Aerodactyl's primary special ability. Aerodactyl flesh around the\
    \ head region is particularly durable even compared to the rest of their rock-tough\
    \ bodies, preventing any possibility of self-trauma from recoil of their more\
    \ reckless physical attacks. *Unnerve: Aerodactyl's hidden (secondary) special\
    \ ability. A select few Aerodactyl can manifest a negative atmospheric reaction\
    \ towards other Pok\xE9mon, functioning as an effective \"fear aura\" to disorientate\
    \ and demoralize potential foes. This power is potent enough to even prevent the\
    \ targeted Pok\xE9mon from using any attached items or consuming food materials.\
    \ -Tough Claws: Mega Aerodactyl's special ability. As a result of the Mega Evolution,\
    \ these Aerodactyl have developed sharper, more durable and refined claws on their\
    \ hands and feet, resulting in more powerful strikes. *Ice Fang: Aerodactyl infuses\
    \ its fang(s) with frost, before biting down on the opponent. *Fire Fang: Aerodactyl\
    \ immolates its fang(s) with fire, before biting down on the opponent. *Thunder\
    \ Fang: Aerodactyl energizes its fang(s) with electricity, before biting down\
    \ on the opponent. *Wing"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
