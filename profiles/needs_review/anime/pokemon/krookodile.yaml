        \ be 1/2 as strong as Complete Zygarde, who is capable of destroying the Megalith\
        \ that was stated to be able to destroy the world) | Universe level+ (Fought\
        \ and matched Gladion, who could damage Base Necrozma, who could affect all\
        \ of Ultra Space), higher with Z-Moves (Overpowered Guzzlord with a combined\
        \ Gigavolt Havoc on two occasions. One-shot Mother Beast Lusamine and overpowered\
        \ Tapu Koko's Guardian of Alola Z-Move to defeat it with 10,000,000 Volt Thunderbolt)\
        \ | Outerverse level (Fought and defeated Cynthia in the Masters Tournament\
        \ Semifinals, whose Garchomp could cancel out Palkia's Spacial Rend, with\
        \ Palkia being able to destroy reality, which contains infinite universes.\
        \ Fought and defeated Leon, who is even stronger than Cynthia, in the Masters\
