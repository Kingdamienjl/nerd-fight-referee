      value: 'Is a bit prone to anger and the belief of betrayal, even when it''s
        not true. Weak to Fire, and Ground moves. (Note that "fighting type moves"
        aren''t necessarily just martial arts or punching and kicking (though a good
        portion are), as moves like Mega Punch, Mega Kick, Bullet Punch, and others
        are normal, steel, or elemental. And aura (and its verse equalized compatriots)
        isn''t necessarily it either due to the existence of Dragon, Dark, Heal, and
        Origin Pulse (Water Pulse isn''t aura)). Using its aura for life restoration
        guarantees its death unless split with another aura user/s, though this could
        kill them both/all if its still overwhelming. The moves Feint, Phantom/Shadow
        Force, Hyperspace Hole, and Hyperspace Fury bypasses Detect and renders it
        inert for a short period of time, this is one individual, with its own personality
        traits and character development, isn''t simply a subordinate partner, this
        profile follows the rules for alternative canon profiles, along with others,
