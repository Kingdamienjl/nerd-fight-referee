- id: claim-intelligence-0ff3adb0
  section: power_scale
  axis: battle_iq
  text: "High. Is a seasoned warrior, having participated in a war, fighting dozens\
    \ of other highly trained Pok\xE9mon (including Houndooms which have an advantage\
    \ on it), and is a servant to what seems to be a knight. Lucario has fought legendary\
    \ Pok\xE9mon, and had the sense to sacrifice its life for the greater good. Can\
    \ even fight while blinded. Still retained its combat experience after over a\
    \ thousand years of being sealed, without being rusty at all, and immediately\
    \ went on an assault on Ash seconds after its release for having similar aura\
    \ to Sir Aaron"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-145cf25e
  section: weaknesses
  axis: weakness
  text: 'Is a bit prone to anger and the belief of betrayal, even when it''s not true.
    Weak to Fire, Fighting, and Ground moves. (Note that "fighting type moves" aren''t
    necessarily just martial arts or punching and kicking (though a good portion are),
    as moves like Mega Punch, Mega Kick, Bullet Punch, and others are normal, steel,
    or elemental. And aura (and its verse equalized compatriots) isn''t necessarily
    it either due to the existence of Dragon, Dark, Heal, and Origin Pulse (Water
    Pulse isn''t aura)). Using its aura for life restoration guarantees its death
    unless split with another aura user/s, though this could kill them both/all if
    its still overwhelming. The moves Feint, Phantom/Shadow Force, Hyperspace Hole,
    and Hyperspace Fury bypasses Detect and renders it inert for a short period of
    time Note: This Lucario is very different from every other Lucario shown, anime,
    game, or otherwise. Unlike the Lucario page, which is the species, this is one
    individual, with its own personality traits and character development, isn''t
    simply a subordinate partner, and is vastly stronger than any other one shown
    so far. Hence why it has a set gender, origin, and is strictly an anime character
    in its category. All in all, this profile follows the rules for alternative canon
    profiles, along with others, such as Pikachu (Anime), Clefairy (Pocket Monsters),
    and Wigglytuff (Mystery Dungeon) Notable Techniques: *Aura Sphere: Lucario charges
    a ball of aura and fires it at the opponent, homing onto him or her and has a
    hard time missing. *Detect: Lucario sees an attack coming through precognition
    and dodges, blocks, parries, or counters it. However, it becomes less useful if
    used in succession, but resets if another move is used in-between.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-201c35fc
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Enhanced Senses, Martial Arts, Longevity,\
    \ Aura, Energy Manipulation and Projection, Extrasensory Perception, Homing Attacks,\
    \ Telepathy, Chi Manipulation, Life Restoration (bordering on Resurrection), Precognition,\
    \ Resistance to possibly Absorption (Pok\xE9mon seem to be incapable of being\
    \ absorbed by the tree. That or the tree doesn't absorb Pok\xE9mon by choice)\
    \ and certainly Normal, Bug, Rock, Steel, Grass, Ice, Dragon, and Dark attacks\
    \ with a High Resistance to Poison attacks, Sealing (Aura Guardians have sealed\
    \ Spiritombs in the past (Each Spiritomb is a combination of 108 dangerous and\
    \ wicked spirits, so the sealing is rather impressive), and this Lucario, being\
    \ above most, if not all Aura Guardians, should be capable of the deed), Emotion\
    \ Sensing, Mind Reading"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
