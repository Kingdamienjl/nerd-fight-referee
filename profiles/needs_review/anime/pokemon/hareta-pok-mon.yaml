    \ Non-Physical Interaction [All] Flight, Water Manipulation, Absorption and Damage\
    \ Transferal (Via Bide; can absorb any damage he takes and then unleash it all\
    \ back in a single blow), Limited Statistics Amplification (Via Brine), Weather\
    \ Manipulation (Via Rain Dance), Air Manipulation (Via Defog) [Empoleon] Fear\
    \ Manipulation, Enhanced Senses (Plus X-Ray vision), Electricity Manipulation,\
