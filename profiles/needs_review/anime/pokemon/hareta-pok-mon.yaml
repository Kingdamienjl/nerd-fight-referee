    \ Mastery (Sneaked up on two Team Galactic grunts while his arms and legs are\
    \ tied up), Supernatural Willpower (Takes a poison jab from Saturn's Toxicroak\
    \ and gets back up through sheer willpower. Even after the poison starts taking\
    \ effect he keeps fighting. His willpower powered up Azelf, the master of willpower),\
    \ Extrasensory Perception (He can understand what his Pokemon are saying as well\
    \ as sense their feelings. He can sense when his Pokemon are going to evolve.\
    \ At one point he describes this as hearing his Pokemon's voice), Social Influencing\
    \ (According to Professor Rowan Hareta communicates with Pokemon via the heart,\
    \ and his feelings can sway Pokemon around him to aid him. Quickly figures out\
    \ why Deoxys is attacking everyone and after a battle befriends it. Figures out\
    \ Regigigas' motivations and convinces it to join him. Befriends Giratina and\
    \ fights by its side), Sound Manipulation (Can shout loudly enough to stun everyone\
    \ nearby. Broke several Pokemon out of mind control by shouting at them), Sealing\
    \ (Via Pok\xE9balls), Can give to his Pok\xE9mon: Healing and Purification (Type\
    \ 3. Via Recovery Items), Resistance to Electricity Manipulation (Took a thunderpunch\
    \ from Mitsumi's Electivire and soon after tanks a ton of electricity, and isn't\
