    \ *Water Manipulation (Via Life Dew) *Purification (Type 3. Via Healing Wish,\
    \ Aromatherapy, and Healer) *Healing (Life Dew throws mysterious water around\
    \ and restores the HP of itself and its ally Pok\xE9mon currently in the battle.\
    \ Healing Wish causes the user to faint but the Pok\xE9mon taking its place will\
    \ have its HP restored and status conditions cured. Heal Pulse restores the target's\
    \ HP by up to half of their max HP) *Sound Manipulation and Minor Empathic Manipulation\
    \ (Via Disarming Voice which does emotional damage to opposing Pok\xE9mon) *Light\
    \ Manipulation (via Dazzling Gleam which damages opposing Pok\xE9mon by emitting\
    \ a powerful flash) *Statistics Reduction, and Social Influencing (Via Play Nice\
    \ which makes an opponent lower their attack by befriending them) *Fragrance Manipulation\
    \ (Via Aromatic Mist) *Energy Projection *Light Manipulation *Status Effect Inducement\
    \ (Via Confusion which hits the target with a weak telekinetic force which has\
    \ a 10% chance to induce confusion. Psybeam also has a 10% chance to induce confusion\
    \ on hit) *Paralysis Inducement (Via Nuzzle) *Statistics Amplification (Via Calm\
    \ Mind which raises the user's Special Attack and Special Defense when used) Resistance\
    \ to *Telekinesis (Only takes 1/2 from Psychic-Type attacks) *Fighting-Type (Only\
    \ takes 1/2 damage from Fighting-Type attacks) All previous abilities greatly\
    \ enhanced *Small Size (Type 0. Hattrem is 0.6 meters tall)) *Bodily Weaponry\
    \ (Are known for using their braids to pummel their targets) *Darkness Manipulation\
    \ (Via Brutal Swing) All previous abilities except Small Size greatly enhanced\
    \ *Flight (Levitation) *Pain Manipulation (Induces headaches to any approaching\
    \ foe as a deterrent) *Bodily Weaponry (Possesses tentacles which are tipped with\
    \ claws) *Magic (Magic Powder's description indicates that it has magical properties)\
    \ *Power Modification (Via Magic Powder which changes the target\u2019s type to\
