      \ Will usually rely upon Garchomp to take control for any direct battle as her\
      \ ace Pok\xE9mon. Has notably used her Gastrodon when faced against hordes of\
      \ Pok\xE9mon surrounding her such as Team Galactic\u2019s Golbats. When faced\
      \ against an opponent that she thinks will be an issue, she has used her Spiritomb\u2019\
      s Destiny Bond to directly take it out instead of relying on power, such as\
      \ against Ash\u2019s Pikachu. Will consistently switch Pok\xE9mon in regards\
      \ to what she is fighting in a cool temperament. When facing a trainer she respects,\
