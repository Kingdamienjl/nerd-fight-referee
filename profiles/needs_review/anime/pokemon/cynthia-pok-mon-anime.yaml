    confidence: 0.8
  attack_potency:
    text: "Likely Wall level physically (Should be comparable to other Pok\xE9mon\
      \ trainers like Ash and Team Rocket, Was able to throw a Pokeball into the air\
      \ so high that it was not visible in a matter of seconds.) | Low Complex Multiverse\
      \ level (Is the Champion of the Sinnoh Region, and ranked #2 in the World Coronation\
      \ as a member of the Masters 8 with her Pok\xE9mon team. Her Garchomp was capable\
      \ of cancelling out Palkia\u2019s Spacial Rend with Draco MeteorPalkia is assumed\
      \ to be comparable to its representation in the Games, as it is the treated\
      \ as the representation of space in the Pok\xE9mon multiverse as a whole. Although\
      \ Palkia's Spacial Rend was done in retaliation to Garchomp's Draco Meteor,\
      \ Palkia was berserk and unrestrained within the Red Chain, and was only able\
      \ to cancel it out, compared to the combined efforts of Pikachu, Piplup and\
      \ Croagunk being overpowered against Dialga's Roar of Time (who was in the same\
      \ berserk state as Palkia). This suggests there was no restraint on power on\
      \ Palkia's end to merely block Draco Meteor, and was instead trying to overpower\
      \ Garchomp instead., as well as battled multiple legendary Pok\xE9mon such as\
      \ Heatran and the Forces of NaturePok\xE9mon the Series: Black and White - Episode\
      \ 97. Defeated Iris in a 3v3 battle, and battled Ash in a 6v6 in an extremely\
      \ close fight. Diantha believed Cynthia was capable of defeating Leon, who had\
      \ prior lost her own battle to Leon.), higher with Mega Garchomp & Dynamax (By\
      \ Mega Evolving her Garchomp, it is capable of increasing its power massively\
      \ compared to normal. By Dynamaxing her Pok\xE9mon, they get a temporary high\
      \ boost in size and power such as her Togekiss who could fight and overwhelm\
      \ Ash\u2019s Mega Lucario)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Likely Superhuman with Massively FTL+ to Infinite reactions (Should be\
