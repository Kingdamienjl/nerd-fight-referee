      \ in particular in quick at commanding her Pok\xE9mon, and was able to stop\
      \ Garchomp before its Brick Break could land.) | At least Massively FTL+, likely\
      \ Infinite (Able to keep up with legendary Pok\xE9mon such as Palkia, Flame\
