        \ As a child, Shinra awakened the ability of a Third Generation and gained\
        \ the ability to ignite, control, and utilize flames from his feet. While\
        \ doing so, he leaves ashes on the floor in the shape of feet, which is known\
        \ as the \"Devil's Footprints\". Using his ability in conjunction with his\
        \ fighting style, Shinra has enough force in his kick to sever a limb or destroy\
        \ an Infernal's core. With his kicks, he can cause an explosion on contact\
        \ to lift an object as heavy as a car high into the air. With his ignited\
        \ feet, he can change the trajectory of his kicks in mid-air, allowing him\
        \ to rush in with a flurry of kicks one after another repeatedly. Shinra is\
        \ noted to have an excelled proficiency in his mobility while fighting, as\
        \ his Ignition Ability allows him to fly or glide across the floor rapidly\
        \ and jump continuously from platforms to outmaneuver an opponent before they\
        \ can react. As a Third Generation, he has shown to have resistance against\
        \ external flames. During his fight with Burns in Fuch\u016B Prison, Shinra's\
        \ footprints evolved further with bladed talons at the edges of his feet.\
        \ Shinra Activates Devil's Footprints.gif|Shinra activates his Devil's Footprints\
        \ Shinra's Fire Kick.gif|Shinra's Devil's Footprints Kick Hand Seals: Shinra\
        \ was taught by Captain Benimaru how to utilize hand seals in order to redirect\
        \ and concentrate the energy in his body. This allows him to manipulate characteristics\
        \ of the flames he produces from his ignition ability. *{{Nihongo|Tiger Sign|{{Ruby|\u864E\
        |\u3068\u3089}}{{Ruby|\u62C9|\u3072\u3057}}\u304E|Tora Hishigi}}: By utilizing\
        \ this hand seal, Shinra is able to use Rapid which increases the thrust of\
        \ his flames, giving an exponential boost to his speed. *Corna: When Shinra\
        \ uses this hand seal his flames manifest in an explosive nature, allowing\
        \ him to attack with a lot more force. By utilizing this hand sign, Shinra\
        \ is able to use Hellfire which creates a huge devil head made out of the\
        \ fire and chomps down on his opponent. Shinra's Rapid.gif|Shinra using Rapid\
        \ Shinra's Corna.gif|Shinra using Hellfire Superfire: Normally a human is\
        \ only capable of using 30% of their ignition ability, but in times of danger,\
        \ they can remove that limitation, and use 100% of their power. Shinra activates\
        \ his Superfire by feeling the Pressure of Death and using that to push him\
        \ to his limit of power. Shinra's Superfire is a shining blue color and it\
        \ increases in power and temperature. Shinra_Superfire.jpeg|Shinra activates\
        \ Superfire Superfire_Shinra_Kusakabe.png|Shinra's Superfire {{Nihongo|Adolla\
        \ Burst|\u30A2\u30C9\u30E9\u30D0\u30FC\u30B9\u30C8|Adora B\u0101suto}} Having\
        \ the Adolla Burst, Shinra can be temporarily empowered with the Adolla Grace\
        \ through forcing an Adolla Link to a person who originates from Adolla, or\
        \ someone graced. Under Grace, Shinra can enter a state of light speed, causing\
        \ his body to split into subatomic particles in the process. The particles\
        \ then surpass the speed of light, allowing them to go a few seconds back\
        \ in time to the point before Shinra's body broke apart. As a result, Shinra's\
        \ body is re-materialized. Doing so enables him to circumvent the laws of\
        \ physics and allow him to travel at relativistic speeds without ending up\
        \ dead. Under such state, Shinra could see images of Tempe's past in his head,\
        \ enter Sho's Severed Universe, and accumulate enough strength to defeat the\
        \ Demon Infernal. The connection with his Adolla Burst is strengthened according\
        \ to the intensity of his desire. Shinra's Adolla_Burst.gif|Shinra's Adolla\
        \ Burst {{Nihongo|Adolla Link|\u30A2\u30C9\u30E9\u30EA\u30F3\u30AF|Adora Rinku}}\
        \ The Adolla Link seems to be an experience that connects a human to the Adolla\
        \ or the Evangelist. Those with the Adolla Burst are able to experience the\
        \ Adolla Link as a physical sensation or a series of visions. These sensations\
        \ are normally triggered by powerful emotions. Shinra Kusakabe has also shown\
        \ the ability to sense strong emotions through the Adolla, such as Konro's\
        \ desperation or Giovanni's murderous intent. However, he was not able to\
        \ directly respond to these feelings and he did not experience a vision. |}\
