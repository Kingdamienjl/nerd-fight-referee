        \ this hand seal, Shinra is able to use Rapid which increases the thrust of\
        \ his flames, giving an exponential boost to his speed. *Corna: When Shinra\
        \ uses this hand seal his flames manifest in an explosive nature, allowing\
        \ him to attack with a lot more force. By utilizing this hand sign, Shinra\
        \ is able to use Hellfire which creates a huge devil head made out of the\
        \ fire and chomps down on his opponent. Shinra's Rapid.gif|Shinra using Rapid\
        \ Shinra's Corna.gif|Shinra using Hellfire Superfire: Normally a human is\
        \ only capable of using 30% of their ignition ability, but in times of danger,\
        \ they can remove that limitation, and use 100% of their power. Shinra activates\
        \ his Superfire by feeling the Pressure of Death and using that to push him\
        \ to his limit of power. Shinra's Superfire is a shining blue color and it\
        \ increases in power and temperature. Shinra_Superfire.jpeg|Shinra activates\
        \ Superfire Superfire_Shinra_Kusakabe.png|Shinra's Superfire {{Nihongo|Adolla\
        \ Burst|\u30A2\u30C9\u30E9\u30D0\u30FC\u30B9\u30C8|Adora B\u0101suto}} Having\
        \ the Adolla Burst, Shinra can be temporarily empowered with the Adolla Grace\
        \ through forcing an Adolla Link to a person who originates from Adolla, or\
        \ someone graced. Under Grace, Shinra can enter a state of light speed, causing\
        \ his body to split into subatomic particles in the process. The particles\
        \ then surpass the speed of light, allowing them to go a few seconds back\
        \ in time to the point before Shinra's body broke apart. As a result, Shinra's\
        \ body is re-materialized. Doing so enables him to circumvent the laws of\
        \ physics and allow him to travel at relativistic speeds without ending up\
        \ dead. Under such state, Shinra could see images of Tempe's past in his head,\
        \ enter Sho's Severed Universe, and accumulate enough strength to defeat the\
        \ Demon Infernal. The connection with his Adolla Burst is strengthened according\
        \ to the intensity of his desire. Shinra's Adolla_Burst.gif|Shinra's Adolla\
        \ Burst {{Nihongo|Adolla Link|\u30A2\u30C9\u30E9\u30EA\u30F3\u30AF|Adora Rinku}}\
