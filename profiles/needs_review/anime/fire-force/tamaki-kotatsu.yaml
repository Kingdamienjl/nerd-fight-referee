- id: claim-weaknesses-6090211d
  section: weaknesses
  axis: weakness
  text: 'None Notable Attacks/Techniques: Nekomata: Tamaki ignites pink fire around
    her body in the shape of cat ears, two forked tails, and flames on her fingertips
    which increase their speed and mobility substantially. Through this process, she
    is granted the ability to surround her target with flames or use such flames as
    an offensive force via the two tails. The tails can also be extended to high lengths,
    for such things as sending a distress signal. *Composed Flame Tail: Upon activating
    Nekomata, Tamaki uses her ignited tails to whip her opponent. *Nekomata Falling
    Star: First, Tamaki uses some material to burn and fuel her fire, in which she
    then creates a large fireball in between her hands. She then coats herself in
    flames, giving the appearance of two huge flame cat-like eyes and tails, and proceeds
    to hit her opponent embodied with the flames. Tamaki is Fire.gif|Nekomata Nekomata
    2nd Form.png|Nekomata 2nd Form Composed Flame Tail.png|Composed Flame Tail Tamaki
    Defeats Twins.png|Nekomata Flaming Star ==Notable Matchups== Victories: Losses:
    Maki Oze (Enen no Shouboutai) Maki''s Profile (Both were bloodlusted and started
    five meters away. Neither had preparation time or knowledge of the other''s abilities)
    Inconclusive: ==References== {{Reflist|2}} {{Discussions}} Category:Characters
    Category:Enen no Shouboutai Category:Female Characters Category:Manga Characters
    Category:Fire Users Category:Martial Artists Category:Anime Characters Category:Teenagers
    Category:Firefighters Category:Nuns Category:Good Characters Category:Protagonists
    Category:Humans Category:Flight Users'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
