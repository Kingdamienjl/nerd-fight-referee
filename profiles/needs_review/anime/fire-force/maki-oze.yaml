      value: 'None Notable Attacks/Techniques: Ignition Ability: Maki possesses Second
        Generation abilities, having adapted to Spontaneous Human Combustion by becoming
        able to control flames from a long distance. In doing so, she can handle herself
        against two Third Generations simultaneously, being able to extinguish and
        absorb their generated flames into a giant fireball. Maki''s abilities provide
        defense for her entire team, as she can reflect incoming fire attacks and
        use an opponent''s flames against them. While she''s unable to deflect or
        redirect a fire with too much driving force, she is still able to alter its
        shape in order to reduce its impact. Pusu_Pusu_Maki.png|Pusu Pusu Meramera-FF.png|Mera
