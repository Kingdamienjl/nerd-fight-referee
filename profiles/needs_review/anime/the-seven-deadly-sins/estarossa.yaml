- id: weaknesses-immune-to-his-commandment-estarossa-cannot-break-the-rule-of-his-own-
  name: immune to his Commandment. Estarossa cannot break the rule of his own Commandment
    or he will be affected by it. All Demo
  description: 'immune to his Commandment. Estarossa cannot break the rule of his
    own Commandment or he will be affected by it. All Demons are vulnerable to Holy
    Magic, as it breaks down Darkness particles. Note however that high-level demons
    have shown to take only minor damage from beings near their own level, implying
    the vulnerability is not extreme. The regeneration used by demons heals injuries
    but not the "damage" dealt. In practical terms, this has shown to mean that the
    more a demon regenerates the weaker they get, eventually reaching the point where
    they no longer have the energy to regenerate at all. | In this form Estarossa
    is insane and extremely playful. The Commandment of Truth only works on people
    that know they are lying in his presence; it can also work on himself, petrifying
    him if he breaks an oath. | He initially regained his sanity after absorbing Reticence,
    but retains the other weaknesses and becomes mentally unstable. As time passes
    he undergoes a complete psychotic break, lashing out even at someone he claims
    to love. Notable Attacks/Techniques: Demon Power: Estarossa acquired the abilities
    and traits of a high-level demon upon gaining a Commandment, and can access his
    demonic biology and powers to give himself a boost in physical ability and various
    other advantages. Note that Estarossa always has his demon mark activated. At
    night, his magic power increases. Power of Darkness: As part of his demon biology,
    Estarossa can generate solid darkness from his body which he can manipulate and
    shape as well as project outward from himself. He can use this black matter for
    a variety of offensive, defensive, and supplementary purposes. * Elemental Intangibility
    Nullification: Note that Estarossa only gains this ability after absorbing the
    Truth commandment. He coats his enemy in his darkness and prevents them from shifting
    into their elemental form such as water. * Enhanced'
  source_ids: *id002
