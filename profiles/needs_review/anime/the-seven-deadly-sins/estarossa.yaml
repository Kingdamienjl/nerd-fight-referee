- id: claim-weaknesses-36e14b5a
  section: weaknesses
  axis: weakness
  text: 'Those who don''t feel any hatred in their hearts are immune to his Commandment.
    Estarossa cannot break the rule of his own Commandment or he will be affected
    by it. All Demons are vulnerable to Holy Magic, as it breaks down Darkness particles.
    Note however that high-level demons have shown to take only minor damage from
    beings near their own level, implying the vulnerability is not extreme. The regeneration
    used by demons heals injuries but not the "damage" dealt. In practical terms,
    this has shown to mean that the more a demon regenerates the weaker they get,
    eventually reaching the point where they no longer have the energy to regenerate
    at all. | In this form Estarossa is insane and extremely playful. The Commandment
    of Truth only works on people that know they are lying in his presence; it can
    also work on himself, petrifying him if he breaks an oath. | He initially regained
    his sanity after absorbing Reticence, but retains the other weaknesses and becomes
    mentally unstable. As time passes he undergoes a complete psychotic break, lashing
    out even at someone he claims to love. Notable Attacks/Techniques: Demon Power:
    Estarossa acquired the abilities and traits of a high-level demon upon gaining
    a Commandment, and can access his demonic biology and powers to give himself a
    boost in physical ability and various other advantages. Note that Estarossa always
    has his demon mark activated. At night, his magic power increases. Power of Darkness:
    As part of his demon biology, Estarossa can generate solid darkness from his body
    which he can manipulate and shape as well as project outward from himself. He
    can use this black matter for a variety of offensive, defensive, and supplementary
    purposes. * Elemental Intangibility Nullification: Note that Estarossa only gains
    this ability after absorbing the Truth commandment. He coats his enemy in his
    darkness and prevents them from shifting into their elemental form such as water.
    * Enhanced'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-01b8f6bf
  section: abilities
  axis: hax
  text: 'Unknown Exploding Magic: Esterossa can make living things around him explode
    without moving. He only used that ability once in the entire manga, and that was
    to make Ban get off him after killing Meliodas Admonition: Estarossa can extract
    the commandments (demonic curses) of others, summon them at will, and absorb them
    into himself if need be. File:EstrarossaAdmonition.png|Summons Galand''s commandment
    File:EstarossaAdmonition2.png|Absorbs Monspeet''s commandment Blackout: Estarossa
    engulfs a specific target with his darkness, powerful enough to swallow mid-morning
    Escanor''s Cruel Sun. However, when Escanor entered his late-morning form his
    sun broke out of Estarossa''s darkness. File:Blackout2.png|Escanor''s sun is engulfed
    Demonification: Estarossa can forcibly turn other beings into demons, although,
    like the Holy Knight apprentices Hendrickson experimented on, they explode if
    they are incompatible with the demonification. File:Demonification1.png|Turns
    a bird File:Demonification2.png|into a demon, which explodes Full Counter: Estarossa
    is able to reflect the force of any physical attack, such as a standard sword
    swing or punch, back at his foe with twice its original strength by parrying it
    with his sword. However, he cannot reflect anything other than a standard physical
    attack, making it useless against supernatural techniques. In addition, Estarossa
    needs to be able to read the timing and nature of the attack in order to use Full
    Counter against it and can''t launch an attack of his own in the meantime. File:EstarossaFullCounter1.png|Escanor
    swings File:EstarossaFullCounter2.png|but he takes the damage Hellblaze: Estarossa
    can generate the black purgatory fire of the Demon Clan, capable of nullifying
    the regeneration of "immortals" like Ban and Meliodas. Hellblaze can be coated
    on Mael''s body or weapon to enhance his strikes. He can also generate large area-of-effect
    explosions of black fire. The black fire cannot be put out normally, and was able
    to burn down the Fairy King''s Forest despite the Forest being immune to natural
    fire. File:EstarossaHellblaze1.png|Releases a blast of purgatory fire File:EstarossaHellblaze2.png|Omnidirectional
    area-of-effect blast *Black Hound: Estarossa creates a construct of black fire
    in the shape of a large dog. By moving in a circle the dog can create a barrier
    of black fire. File:BlackHound1.png|Black Hound File:BlackHound2.png|It attacks
    the knights File:BlackHound3.png|and creates a black fire vortex *Killing Saucer:
    Estarossa creates spinning blades of darkness in his hands that rotate at high
    speeds and slash his enemies, covering them in darkness to stop their movement.
    They will also presumably suffocate unless they are able to break out. File:KillingSaucer1.png|Slices
    his enemies File:KillingSaucer2.png|and they are covered in darkness Rebellion:
    Estarossa creates seven black blades, presumably from his black matter, each with
    a different form. He creates seven blades for the seven hearts of a high-level
    demon that must be destroyed for his victim to be killed. File:Rebellion.png|Rebellion'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
