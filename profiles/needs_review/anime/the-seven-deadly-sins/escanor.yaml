    - field: intelligence
      value: Varies. Escanor is almost completely useless in combat during the night,
        being timid, submissive, and crumbling under pressure. However, he has shown
        a great deal of cunning at times, providing Galand and Melascula with alcoholic
        drinks to distract them until sunrise. During the daytime, he is insufferably
        arrogant and somewhat flamboyant, spouting entire poems to Merlin in the midst
        of combat and growing angered should one mistake them for an incantation of
        his ability. However, he is also an incredibly skilled and mighty combatant,
        so much so that he effortlessly overpowered and killed the Vampire King Izraf
        and two members of the Ten Commandments on top of being recognized as the
        strongest member of the Sins, which includes the likes of Meliodas (who helped
        to seal the Ten Commandments), King (who can ward off entire kingdoms of Holy
        Knights), and Ban (who has killed Demons in the past).
      source_id: mediawiki-48448
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Escanor has no control over his Sunlight ability, he will continue to
        grow in strength depending on what time of day it is and his power becomes
        completely unmanageable at its peak. At night he becomes weak, timid and submissive.
        Pseudo-Sun only gives Escanor a few seconds of constant power boost, which
        then gets him back to his weaker state. Though this is irrelevant if he''s
        using Rhitta. If using Rhitta as a sun, his form will be lost if Rhitta is
        knocked out of his hand, and its stored power is finite. During the daytime
        he''s rather arrogant, but this is mitigated somewhat by his combat skill
        and power in addition to his willingness to simply blitz targets. Escanor''s
        Sunshine cannot display its full power during rainy or cloudy conditions.
        | His form as "The One" only lasts for as long as it is precisely high noon,
        fading the minute noon passes, after Noon his power will begin to decline.
        | The One Ultimate requires Escanor to convert his own life force into magic
        power Notable Attacks/Techniques: right|400px|Escanor at night on the left
        versus day on the right. ===Grace=== Sunshine: Escanor''s Grace was originally
        bestowed by the Supreme Deity to the Archangel Mael, and eventually passed
        to Escanor through unknown means. Due to Sunshine, Escanor changes form throughout
        the day, spending the night as a weak, frail man and the day as a strong,
        muscular warrior. His personality changes along with his body, becoming extremely
        timid while weak but extremely prideful while strong. At dawn, Escanor undergoes
        a massive jump in power, and continues to get stronger every second until
        noon, at which point his power reaches its peak. After noon he gets gradually
        weaker until he shifts back into his frail form after sunset. While he spends
        most of the morning with an idealized musculature, when noon is near Escanor
        becomes grotesquely muscular, to the point of looking inhuman. At noon he
        turns into The One, who Merlin described as "the invincible incarnation of
        power." In addition to granting him great power, Sunshine allows Escanor to
        produce enormous quantities of heat and light. He normally keeps the aura
        somewhat contained, but as noon gets closer he melts the ground around him
        and even his allies'' metal armor. He can flare his aura at will to produce
        an immense burst of light and heat, seemingly melting Edinburgh even at dawn.
        File:EscanorBoom1.png|Sunshine Aura File:EscanorBoom2.png|Flares his aura
        File:EscanorBoom3.png|and destroys Edinburgh Notably, Sunshine-imbued attacks
        can prevent regeneration up to a certain extent. Though Izraf''s wounds closed,
        the heat remained and continued to damage him. Melascula was unable to heal
        her burns even after she had recovered her energy. In addition, Escanor''s
        soul itself is imbued with Sunshine and severely burns those who attempt to
        extract and absorb it, returning to his body on its own. File:EscanorRegenNegation1.png|Wounds
        Izraf File:EscanorRegenNegation2.png|and prevents healing Also note that the
        heat and fire produced by Sunshine is superior to natural fire, as it was
        able to instantly vaporize Izraf''s Black Full-Plate, which he said was impregnable
        even to the Demon Clan''s purgatory fire. Purgatory fire burned down the Fairy
        King''s Forest, which is immune to natural fire. centre|thumb|300px|Destroys
        Izraf''s Armor * Cruel Sun: Escanor forms a miniature sun in his hand that
        radiates immense heat. He can control its movements, using it to strike enemies
        as well as standing on it and using it as a flying vehicle. He can greatly
        enlarge the sun by putting more power into it. File:CruelSun.png|Cruel Sun
        File:CruelSunHit1.png|Smacks Estarossa File:CruelSunHit2.png|to Lake Penace
        * Pride Flare: Escanor causes the Cruel Sun to burst in an immense radiation
        of heat. When fighting Estarossa this technique vaporized a lake in an instant.
        File:PrideFlare1.png|Smashes Estarossa down File:PrideFlare2.png|and detonates
        * Crazy Prominence: Escanor''s causes numerous fireballs to launch from his
        body in many directions Crazy Prominence.png CP Stuff.png * Divine Sword Escanor:
        In his "The One" form, Escanor chops the air in the direction of his opponent
        with his bare hand. This technique instantly incapacitated even Assault Mode
        Meliodas and broke Zeldris'' Ominous Nebula defense. File:DivineSwordEscanor2.png
        File:DivineSwordEscanor3.png Escanor Chop.png * Divine Spear Escanor: After
        Escanor reaches the peak of his power, and becomes The One, he thrusts his
        index finger into his opponent. Escanor''s Finger.png Divine Spear.png ===Weapon===
        Divine Axe Rhitta: An enormous one-handed axe so heavy that even Unsealed
        Base Meliodas and Base Galand have difficulty lifting it, much heavier than
        Diane''s enormous war hammer Gideon. It is able to store the immense heat
        produced by Escanor during the day, allowing him to protect his surroundings
        and concentrate his attacks. He can call his axe to him from great distances
        by raising his hand in the air, causing the axe to fly to him. By saying "Sa'
      source_id: mediawiki-48448
