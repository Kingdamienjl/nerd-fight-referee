    text: Varies. Escanor is almost completely useless in combat during the night,
      being timid, submissive, and crumbling under pressure. However, he has shown
      a great deal of cunning at times, providing Galand and Melascula with alcoholic
      drinks to distract them until sunrise. During the daytime, he is insufferably
      arrogant and somewhat flamboyant, spouting entire poems to Merlin in the midst
      of combat and growing angered should one mistake them for an incantation of
      his ability. However, he is also an incredibly skilled and mighty combatant,
      so much so that he effortlessly overpowered and killed the Vampire King Izraf
      and two members of the Ten Commandments on top of being recognized as the strongest
      member of the Sins, which includes the likes of Meliodas (who helped to seal
      the Ten Commandments), King (who can ward off entire kingdoms of Holy Knights),
      and Ban (who has killed Demons in the past).
