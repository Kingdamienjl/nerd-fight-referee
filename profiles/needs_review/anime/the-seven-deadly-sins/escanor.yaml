- id: claim-weaknesses-5e99cd77
  section: weaknesses
  axis: weakness
  text: 'Escanor has no control over his Sunlight ability, he will continue to grow
    in strength depending on what time of day it is and his power becomes completely
    unmanageable at its peak. At night he becomes weak, timid and submissive. Pseudo-Sun
    only gives Escanor a few seconds of constant power boost, which then gets him
    back to his weaker state. Though this is irrelevant if he''s using Rhitta. If
    using Rhitta as a sun, his form will be lost if Rhitta is knocked out of his hand,
    and its stored power is finite. During the daytime he''s rather arrogant, but
    this is mitigated somewhat by his combat skill and power in addition to his willingness
    to simply blitz targets. Escanor''s Sunshine cannot display its full power during
    rainy or cloudy conditions. | His form as "The One" only lasts for as long as
    it is precisely high noon, fading the minute noon passes, after Noon his power
    will begin to decline. | The One Ultimate requires Escanor to convert his own
    life force into magic power Notable Attacks/Techniques: right|400px|Escanor at
    night on the left versus day on the right. ===Grace=== Sunshine: Escanor''s Grace
    was originally bestowed by the Supreme Deity to the Archangel Mael, and eventually
    passed to Escanor through unknown means. Due to Sunshine, Escanor changes form
    throughout the day, spending the night as a weak, frail man and the day as a strong,
    muscular warrior. His personality changes along with his body, becoming extremely
    timid while weak but extremely prideful while strong. At dawn, Escanor undergoes
    a massive jump in power, and continues to get stronger every second until noon,
    at which point his power reaches its peak. After noon he gets gradually weaker
    until he shifts back into his frail form after sunset. While he spends most of
    the morning with an idealized musculature, when noon is near Escanor becomes grotesquely
    muscular, to the point of looking inhuman. At noon he turns into The One, who
    Merlin described as "the invincible incarnation of power." In addition to granting
    him great power, Sunshine allows Escanor to produce enormous quantities of heat
    and light. He normally keeps the aura somewhat contained, but as noon gets closer
    he melts the ground around him and even his allies'' metal armor. He can flare
    his aura at will to produce an immense burst of light and heat, seemingly melting
    Edinburgh even at dawn. File:EscanorBoom1.png|Sunshine Aura File:EscanorBoom2.png|Flares
    his aura File:EscanorBoom3.png|and destroys Edinburgh Notably, Sunshine-imbued
    attacks can prevent regeneration up to a certain extent. Though Izraf''s wounds
    closed, the heat remained and continued to damage him. Melascula was unable to
    heal her burns even after she had recovered her energy. In addition, Escanor''s
    soul itself is imbued with Sunshine and severely burns those who attempt to extract
