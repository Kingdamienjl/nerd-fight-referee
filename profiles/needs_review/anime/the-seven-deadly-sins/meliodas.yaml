- id: claim-weaknesses-a53adb4e
  section: weaknesses
  axis: weakness
  text: 'Formerly lost the capacity for rational thought when succumbed to Wrath.
    All Demons are vulnerable to Holy Magic, as it breaks down Darkness particles.
    Note however that high-level demons have shown to take only minor damage from
    beings near their own level, implying the vulnerability is not extreme. The regeneration
    used by demons heals injuries but not the "damage" dealt. In practical terms,
    this has shown to mean that the more a demon regenerates the weaker they get,
    eventually reaching the point where they no longer have the energy to regenerate
    at all | Same as before, minus the regeneration weakness. Is afraid of using his
    original magic power {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- |{{Border|Scroll=Yes|Visible=No|Content=
    Demon: Meliodas is a high-level demon and can access his demonic biology to give
    himself a boost in physical ability and various other advantages. Meliodas can
    activate and deactivate his demon mark at will. At night, his magic power increases.
    *Assault Mode: This simply refers to Meliodas returning to the full extent of
    his power as when he led the Ten Commandments in the past. It is not a "transformation"
    in the usual sense of the word. His total power level in this form is 142,000.
    Meliodas exudes a miasma that causes weaker beings to feel sick, even ones as
    powerful as Post-Training King. centre|thumb|300px|Exuding miasma Power of Darkness:
    As part of his demon biology, Meliodas can generate solid darkness from his body
    which he can manipulate and shape as well as project outward from himself. He
    can use this black matter for a variety of offensive, defensive, and supplementary
    purposes. One of Meliodas'' favored attacks is to create large pillars of darkness
    energy. *Enhanced'
