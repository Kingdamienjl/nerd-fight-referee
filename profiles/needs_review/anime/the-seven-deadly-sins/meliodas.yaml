  name: Meliodas}} ==Summary== Meliodas is the Dragon's Sin of Wrath and the captain
    of the Seven Deadly Sins. In the present day, he cheerfully runs the Boar Hat,
    a bar based on top of a giant pig, serving patrons infamously terrible food along
    with his brand of liquor. The sin referred to in his epithet is the destruction
    of the Kingdom of Danafor, done by Meliodas in a fit of rage after his first battle
    with Fraudrin. His happy-go-lucky facade belies his troubled past as the firstborn
    son of the Demon King who betrayed his own race, including his younger brother
    Zeldris, for the sake of his lover, the Goddess Elizabeth. He was cursed with
    immortality by the Demon King for his betrayal while Elizabeth was cursed with
    perpetual reincarnation by the Supreme Deity, and Meliodas has continually loved
    and lost her many times over the last 3000 years. ==Powers and Stats
