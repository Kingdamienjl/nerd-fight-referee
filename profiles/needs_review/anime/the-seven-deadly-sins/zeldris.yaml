      the destructive power of a weapon nearly 10-foldFour Horsemen of the Apocalypse
      Chapter 37). At leastSolar System level with Ominous Nebula (Half as strong
      as his enlarged mark. Completely overwhelmed Near-Noon Escanor and LudoshelNanatsu
      no Taizai Chapter 287), higher at night (The magic power of Demons increases
      at nightNanatsu no Taizai Chapter 237) |-|Enlarged Demon Mark= At most Solar
      System level (Multiplies his power), up to Solar System level with God (Fought
      Afternoon Mael and heavily injured him in a fit of rageNanatsu no Taizai Chapter
      298Nanatsu no Taizai Chapter 299), ] higher with magic-imbued weaponry. At least
      Solar System level with Ominous Nebula (Held back The One Escanor for a considerable
      amount of time before he was overpowered, even managing to scratch the latter''s
      wristNanatsu no Taizai Chapter 288), higher at night |-|Cursed By Light= At
      least Solar System level, higher with Demon Marks (Dalia took a shot at Baruja,
      and Zeldris could hold his own in a fight with him and destroy his sacred spear.
      After enlarging his Demon Mark, he easily stomped DubsThe Seven Deadly Sins:
      Cursed by Light), up to at least Solar System level with magic-imbued weaponry
      (Enhances his power nearly 10-fold. Broke Supreme Deity''s barrier and severely
      damaged her alongside Meliodas), higher at night'
