- id: claim-weaknesses-fc49a9e7
  section: weaknesses
  axis: weakness
  text: 'All Demons are vulnerable to Holy Magic, as it breaks down Darkness particles.
    Note however that high-level demons have shown to take only minor damage from
    beings near their own level, implying the vulnerability is not extreme. Notable
    Attacks/Techniques: Demon: Zeldris is the highest level of demon and can access
    his demonic biology and powers to give himself a boost in physical ability and
    various other advantages. Note that Zeldris always has his demon mark activated.
    At night, his magic power increases. right|thumb|330x330px|Zeldris using the "Black
    Matter" to be able to fly. Power of Darkness: As part of his demon biology, Zeldris
    can generate solid darkness from his body which he can manipulate and shape as
    well as project outward from himself. He can use this black matter for a variety
    of offensive, defensive, and supplementary purposes. *Enhanced'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-86cbed3c
  section: abilities
  axis: hax
  text: 'Admonition: Zeldris can extract the commandments of others, summon them at
    will, and absorb them into himself if need be. File:ZeldrisAdmonition1.png|Begins
    extracting Estarossa''s commandment File:ZeldrisAdmonition2.png|but he needs either
    consent or for Estarossa to be unable to fight File:ZeldrisAdmonition3.png|Summons
    the commandments he''s collected Curse Infliction: Zeldris can induce curses on
    the victims of his Hellblaze attacks. Merlin fell into a coma and her mind was
    engulfed in what Elizabeth described as a "sea" of blackness. Zeldris maintains
    a link to his curse victims, able to appear in their mind to stop those who would
    heal them of the curse. File:ZeldrisCurse1.png|Merlin in a coma File:ZeldrisCurse2.png|Sea
    of darkness within Merlin File:ZeldrisCurse3.png|Zeldris appears in Merlin''s
    mind to stop Elizabeth from intervening Dies Irae: Translates to "Day of Wrath."
    Zeldris raises his sword into the air, creating a portal over his target that
    brings down a massive, dark-colored lightning bolt. File:DiesIrae1.png|Opens a
    portal over his target File:DiesIrae2.png|and sends down a huge, dark lightning
    bolt File:DiesIrae3.png|From a very long range God: Zeldris'' magic power, given
    to him by the Demon King. He can use it to seal others'' magic, which he did to
    Drole. It has been implied that using it makes him much more powerful than he
    is normally. This Power allows him to be resistant to all types of magic, and
    remain virtually untouched by them. File:ZeldrisGod2.png|Sealed Drole''s magic
    File:ZeldrisGod1.png|using his Demon King-granted power Hellblaze: Zeldris can
    generate the black purgatory fire of the Demon Clan, capable of nullifying the
    regeneration of immortals like Ban. Hellblaze can be coated on Zeldris'' body
    or weapon to enhance his strikes. He can generate large area-of-effect explosions,
    which he used to destroy Stigma''s Light of Grace tower. He can also shoot blasts
    of fire from his hands, which he used to attack Merlin through her viewing gem.
    The black fire cannot be put out normally, and was able to burn down the Fairy
    King''s Forest despite the Forest being immune to natural fire. File:ZeldrisHellblaze2.png|Fires
    a blast from his hand File:ZeldrisHellblaze5.png|Releases an area-of-effect explosion
    Ominous Nebula: is a technique of extreme concentration were Zeldris rotates his
    darkness at immense speeds, creating a vortex that surrounds and attracts all
    living beings around him. This power makes the air flow and creates a vacuum and
    everything that comes in contact with it is sliced at a god-like speed by pure
    reflexes, making this technique a Full React. Even Ludociel, the leader of the
    Four Archangels, states that the speed of this technique surpasses his Grace,
    Flash. Zeldris using Ominous Nebula.png|The vacuum draws people in... 0008-0009.png|then
    sends them away flying PhotoEditor-20190109000105.jpg|The Barrier of Darkness
    surrounding Zeldris Indura Transformation: As a demon with a power level over
    50000, Zeldris has access to the Indura Transformation. Upon sacrificing six of
    his seven hearts, Zeldris can transform, considerably increasing his stats, but
    losing his original form and ability to reason. He has never used this ability,
    however, as it is a final resort. Sealing: Zeldris sealed away the Vampire Clan
    instead of killing them because of his relationship with Gelda. thumb|300x300px|centre|Sealed
    the Vampire Clan'
  source_ids: *id004
  decisive: true
  status: unverified
