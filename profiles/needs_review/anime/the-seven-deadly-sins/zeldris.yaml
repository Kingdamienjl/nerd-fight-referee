        than he is normally. This Power allows him to be resistant to all types of
        magic, and remain virtually untouched by them. File:ZeldrisGod2.png|Sealed
        Drole''s magic File:ZeldrisGod1.png|using his Demon King-granted power Hellblaze:
        Zeldris can generate the black purgatory fire of the Demon Clan, capable of
        nullifying the regeneration of immortals like Ban. Hellblaze can be coated
        on Zeldris'' body or weapon to enhance his strikes. He can generate large
