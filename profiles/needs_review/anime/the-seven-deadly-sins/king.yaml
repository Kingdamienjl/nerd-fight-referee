    - field: weaknesses
      value: "Standard Devil Fruit weaknesses. When the flames on his back are lowered,\
        \ his durability decreases in return for his speed increase. Rather arrogant,\
        \ albeit not to a crippling extent. If his face is revealed, he will slightly\
        \ lose control and attack everything around him. When he uses Omori Karyudon,\
        \ he has to temporarily drop the flames on his back, leaving him momentarily\
        \ vulnerable should someone get past his attack. His Hybrid form and Imperial\
        \ Pride Stake also apparently force him to drop the flames on his back, although\
        \ even without Lunarian flames his Zoan form is still incredibly durable.\
        \ Notable Attacks/Techniques: |-|Fire Manipulation= Befitting his epithet,\
        \ King is endowed with the natural ability to \"ignite\" (\u767A\u706B hakka)\
        \ his body, allowing him to create and control fire in both his humanoid and\
        \ pteranodon forms. Using the fire he conjures, King can boost the power of\
        \ his melee attacks, such as by throwing a flaming punch or kicking with a\
        \ flaming leg. He can can launch bullet-like flame projectiles from a distance,\
        \ set his surroundings aflame, and is able to unleash massive explosions from\
        \ his body which he can choose to do once his opponent is in close proximity.\
        \ His back flame is the secret behind his tremendous durability as a lunarian,\
        \ and should he let them go out, his durability will decrease, though it will\
        \ also give him a boost to his physical movement speed. At their strongest,\
        \ King's flames are so potent that they appear to take on the consistency\
        \ of magma. His most powerful seen fire techniques involve King channeling\
        \ fire into his sword in order to generate large, superhot dragons made of\
        \ pure flame to burn whatever they are sent flying against. *Imperial Flame\
        \ ({{Ruby|\u708E\u7687|\u30A2\u30F3\u30C9\u30F3}} Andon, literally meaning\
        \ \"Flame Emperor\"): King creates a fireball over his open palm, then forms\
        \ a fist to throw a powerful, flame-clad punch straight at his opponent. *Imperial\
        \ Flaming Wings ({{Ruby|\u706B\u9F8D\u7687|\u304B\u308A\u3085\u3046\u30C9\u30F3\
        }} Kary\u016Bdon, literally meaning \"Fire Dragon Emperor\"): An attack where\
        \ King ignites his sword's blade and, from its tip, produces a large, whirling,\
        \ serpentine dragon made of fire\u2014described by Zoro as being akin to magma.\
        \ King then sends this dragon flying against a single or multiple enemies\
        \ in order to incinerate them. **Extra Large Imperial Flaming Wings ({{Ruby|\u5FA1\
        \u5B88 \u706B\u9F8D\u7687|\u304A\u304A\u3082\u308A \u304B\u308A\u3085\u3046\
        \u30C9\u30F3}} \u014Cmori Kary\u016Bdon, literally meaning \"Assisting Guardian\
        \ Fire Dragon Emperor\"): A more powerful version of Karyudon, creating a\
        \ larger fire dragon with which to attack and immolate his opponent. The technique's\
        \ true potential was never witnessed because, when King used it against Zoro,\
        \ the latter was able to simply slice the dragon apart using his \"King of\
        \ Hell Three Sword Style\". Imperial Flame.png|Imperial Flame Karyudon.png|Imperial\
        \ Flaming Wings Omori Karyudon.png|Extra Large Imperial Flaming Wings |-|Devil\
        \ Fruit= Dragon-Dragon Fruit, Model: Pteranodon: An Ancient Zoan Devil Fruit.\
        \ It allows the user to transform into a giant pteranodon and pteranodon hybrid\
        \ at will. The transformation increases King's physical capabilities, particularly\
        \ his strength and durability, while also giving him the power of flight.\
        \ *Imperial Archer ({{Ruby|\u4E39\u5F13\u7687|\u30BF\u30F3\u30AD\u30E5\u30A6\
        \u30C9\u30F3}} Tanky\u016Bdon, literally meaning \"Vermilion\u200B Bow Emperor\"\
        ): A melee attack where King flies toward his opponent in his hybrid pteranodon\
        \ form, then hits them with a sweeping strike of one of his wings. *Imperial\
        \ Deep Pride Stake ({{Ruby|\u8C82\u81EA\u5C0A\u7687|\u30C6\u30F3\u30D7\u30E9\
        \u30A6\u30C9\u30F3}} Tenpuraudon, literally meaning \"Proud Marten Emperor\"\
        ): A powerful melee attack used by King in his full pteranodon form. He pulls\
        \ back on his head crest with one arm, stretching his face flat and causing\
        \ his beak to retract into his face. He then lets go of the crest to let his\
        \ head fling forward at extreme speed, almost like a slingshot, over a distance\
        \ several times the length of his body, to strike his opponent with massive\
        \ force (presumably using his beak to pierce them). When using this technique\
        \ against Zoro, he was unable to block the attack and compared it to a laser\
        \ beam. *Imperial Slings And Arrows ({{Ruby|\u5203\u88CF\u53CC\u7687|\u30D0\
        \u30EA\u30BE\u30A6\u30C9\u30F3}}, Bariz\u014Ddon, meaning \"Blade Back Twin\
        \ Emperor\"): An attack where King, while in flight, employs both his pteranodon\
        \ wings like blades, using their forward-most edge to launch what seems to\
        \ be a series of destructive, elliptic air projectiles. Imperial Archer.png|Imperial\
        \ Archer Imperial Deep Pride Stake.png|Imperial Deep Pride Stake Barizodon.png|Imperial\
        \ Slings And Arrows |-|Haki= Haki: There are normally two types of Haki regular\
        \ people can tap into: the Kenbunshoku Haki which allows individuals to sense\
        \ the presence of others, and Bus\u014Dshoku Haki which allows individuals\
        \ to create an invisible armor around them. There is however a third type\
        \ of Haki, Ha\u014Dshoku Haki, that only a few individuals can use. It's currently\
        \ unknown if King is one of these people. *Bus\u014Dshoku Haki (Color of Armaments):\
        \ King has displayed proficient levels in applying this type of Haki. He's\
        \ capable of covering his entire katana with Bu"
      source_id: mediawiki-214184
