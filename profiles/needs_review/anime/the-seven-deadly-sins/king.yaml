      value: 'He is stressed about everyone''s high expectations of him. Notable Attacks/Techniques,
        : While his intimidating appearance and presence usually scares off potential
        opponents, King has to rely on this style if his opponents aren''t scared
        and are still ready to fight. It is not a fighting style in the traditional
        sense. King mostly bluffs himself out of battles or just runs away. King is
        highly skilled in bluffing, which makes his opponents think he is formidable,
        sometimes even rendering them unable to perform techniques against him. His
        frightening aura was so powerful, King managed to literally scare a monster
        to death., : It''s a rumbling sound that others claim to hear when King readies
        for battle or when he is generally serious. The sound has a formidable impact
        on his opponent''s psyche. In reality, it is simply the sound of King''s heart
        beating rapidly and loudly from fear, or other uneasiness. Because of King''s
        intimidating visage and reputation, it is mistaken for bloodlust., : King''s
        intimidating facial expression, which scares off Villains and Mysterious Beings.,
        : King places his hand on the shoulder of his opponent in order to intimidate
        them even more., King Brain: King has a powerful skill that allows him to
        instantly think of and simulate strategies., Super Catch: King supposedly
        has a technique that allows him to catch heavy weights such as a large group
        of people, but he claims not to want to use it for the injured heroes as the
        shockwaves he produces will aggravate their injuries., : A supposed powered-up
        form of King''s mentioned by Child Emperor that increases his abilities and
        powers., : One of King''s bluff techniques, which he obviously doesn''t know.
