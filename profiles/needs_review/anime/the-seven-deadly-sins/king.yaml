    - field: intelligence
      value: 'Above Average generally, Gifted in video game skill (Has managed to
        hide his truth as a powerless individual from the entire Hero Association.
        Defeated 30 people back to back in a fighting video game, one of them being
        a former professional e-sports player) Standard Tactics: King will never make
        the first attack due to his cowardice. He relies entirely on his intimidating
        appearance, his King Engine, reputation or sheer luck in most cases.'
      source_id: vsbattles-king-anime
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "He is stressed about everyone's high expectations of him. Notable Attacks/Techniques\
        \ *{{Nihongo|King Style|\u30AD\u30F3\u30B0\u6D41|Kingu-ry\u016B}}: While his\
        \ intimidating appearance and presence usually scares off potential opponents,\
        \ King has to rely on this style if his opponents aren't scared and are still\
        \ ready to fight. It is not a fighting style in the traditional sense. King\
        \ mostly bluffs himself out of battles or just runs away. King is highly skilled\
        \ in bluffing, which makes his opponents think he is formidable, sometimes\
        \ even rendering them unable to perform techniques against him. His frightening\
        \ aura was so powerful, King managed to literally scare a monster to death.\
        \ *{{Nihongo|King Engine|\u30AD\u30F3\u30B0\u30A8\u30F3\u30B8\u30F3|Kingu\
        \ Enjin}}: It's a rumbling sound that others claim to hear when King readies\
        \ for battle or when he is generally serious. The sound has a formidable impact\
        \ on his opponent's psyche. In reality, it is simply the sound of King's heart\
        \ beating rapidly and loudly from fear, anxiety, or other uneasiness. Because\
        \ of King's intimidating visage and reputation, it is mistaken for bloodlust.\
        \ *{{Nihongo|King Face|\u30AD\u30F3\u30B0\u30D5\u30A7\u30A4\u30B9|Kingu Feisu}}:\
        \ King's intimidating facial expression, which scares off Villains and Mysterious\
        \ Beings. *{{Nihongo|King Hand|\u30AD\u30F3\u30B0\u30CF\u30F3\u30C9|Kingu\
        \ Hando}}: King places his hand on the shoulder of his opponent in order to\
        \ intimidate them even more. *King Brain: King has a powerful skill that allows\
        \ him to instantly think of and simulate strategies. *Super Catch: King supposedly\
        \ has a technique that allows him to catch heavy weights such as a large group\
        \ of people, but he claims not to want to use it for the injured heroes as\
        \ the shockwaves he produces will aggravate their injuries. *{{Nihongo|Super\
        \ Sparking King Mode (SSK)|\u30B9\u30FC\u30D1\u30FC\u30B9\u30D1\u30FC\u30AD\
        \u30F3\u30B0\u30AD\u30F3\u30B0\u30E2\u30FC\u30C9 ({{Ruby|SSK|\u30A8\u30B9\u30A8\
        \u30B9\u30B1\u30FC}})|S\u016Bp\u0101 Sup\u0101kingu Kingu M\u014Ddo (Esu-Esu-K\u0113\
        )}}: A supposed powered-up form of King's mentioned by Child Emperor that\
        \ increases his abilities and powers. *{{Nihongo|Ultimate Hellfire Burst Wave\
        \ Motion Cannon|\u7149\u7344\u7121\u53CC\u7206\u71B1\u6CE2\u52D5\u7832|Rengoku\
        \ Mus\u014D Bakunetsu Had\u014D-h\u014D}}: One of King's bluff techniques,\
        \ which he obviously doesn't know. Child Emperor refers to this move as King's\
        \ limited-time secret killer move. King simply shouts the attack name loudly\
        \ to intimidate his opponents. It appears to be an incredibly powerful energy\
        \ blast in Child Emperor's imagination, which can visibly be seen from outer\
        \ space upon unleashing. The \"technique\" seems to be well-known within the\
        \ Hero Association, as Child Emperor demanded King to use it in order to defeat\
        \ the Dragon-level Monster Association members. When he attempted this technique\
        \ as a last resort, it was seemingly powerful enough to defeat Platinum Sperm\
        \ and Evil Natural Water in a split-second, validating King's legend. However,\
        \ in reality, it was actually Garou's sudden arrival that repelled those two\
        \ powerful monsters, facading King's supposedly killer move. ==Gallery== King.(One.Punch.Man).full.2526886\
        \ (1).png|Regular clothes (Season 2 render) ==Notable Matchups== Victories:\
