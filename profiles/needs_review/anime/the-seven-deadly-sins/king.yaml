      value: 'Formerly lost the capacity for rational thought when succumbed to Wrath.
        All Demons are vulnerable to Holy Magic, as it breaks down Darkness particles.
        Note however that high-level demons have shown to take only minor damage from
        beings near their own level, implying the vulnerability is not extreme. The
        regeneration used by demons heals injuries but not the "damage" dealt. In
        practical terms, this has shown to mean that the more a demon regenerates
        the weaker they get, eventually reaching the point where they no longer have
        the energy to regenerate at all, Same as before, his magic power increases.,
        Assault Mode: This simply refers to Meliodas returning to the full extent
        of his power as when he led the Ten Commandments in the past. It is not a
        "transformation" in the usual sense of the word. His total power level in
        this form is 142, 000. Meliodas exudes a miasma that causes weaker beings
        to feel sick, even ones as powerful as Post-Training King., Power of Darkness:
