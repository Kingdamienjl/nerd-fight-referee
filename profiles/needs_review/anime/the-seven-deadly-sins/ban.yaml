    - field: intelligence
      value: Gifted. Possibly Genius in combat (As a member of the Seven Deadly Sins,
        Ban is one of the strongest and most skilled Holy Knights in all of Britannia.
        True to his former name "Bandit Ban", his strategy is using his ability Snatch
        to steal and sap his foes physical strength and using it against them, Ban
        is an expert hand-to-hand combatant and staff user. Due to his past as a thief,
        he has sticky fingers and is so fast that he can steal someone's teeth while
        they're in the middle of talking before they realize what happened and later
        sneaked up on the Ten Commandments and broke Melascula's neck before she could
        react. However, he doesn't always keep his cool and is seen to rarely get
        serious in a fight as a result of his useful regeneration ability, deciding
        to not going all out until he notices that he's dealing with a threat)
      source_id: vsbattles-ban-the-seven-deadly-sins
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'He has a limit to how much strength and speed he can steal using Snatch,
        and when his time limit runs out he becomes fatigued to the point where he
        can no longer walk. After going to Purgatory, Immortality: Due to drinking
        the Fountain of Youth, Ban gained immortality. He can completely and perfectly
        regenerate from all wounds, including lost limbs, making him extremely hard
        to kill. His immortality stops him from aging, retaining his 23 year old body
        in perpetuity. He needs no food or drink to survive and is, immune to poisons
        and illness; as a result he is in peak condition at all times unless he overuses
        certain Snatch techniques. After surviving and adapting to Purgatory for hundreds
        of years, his immortality improved to the point where the scorching heat and
        frostbite-inducing cold no longer affected him at all, and he could breathe
        the poisonous air as if it were normal.'
      source_id: vsbattles-ban-the-seven-deadly-sins
      provider_id: vsbattles
      authority: high
      confidence: 0.75
