    - field: weaknesses
      value: 'He has a limit to how much strength and speed he can steal using Snatch,
        and when his time limit runs out he becomes fatigued to the point where he
        can no longer walk. After going to Purgatory, he lost his Immortality. Notable
        Attacks/Techniques: *Immortality: Due to drinking the Fountain of Youth, Ban
        gained immortality. He can completely and perfectly regenerate from all wounds,
        including lost limbs, organs, and head, and even being incinerated to ashes,
        making him extremely hard to kill. His immortality stops him from aging, retaining
        his 23 year old body in perpetuity. He needs no food or drink to survive and
        is immune to poisons and illness; as a result he is in peak condition at all
        times unless he overuses certain Snatch techniques. After surviving and adapting
        to Purgatory for hundreds of years, his immortality improved to the point
        where the scorching heat and frostbite-inducing cold no longer affected him
        at all, and he could breathe the poisonous air as if it were normal.'
      source_id: vsbattles-ban-the-seven-deadly-sins
      provider_id: vsbattles
      authority: high
      confidence: 0.75
