      value: Genius (An eccentric romantic at a glance, Gowther is an extremely pragmatic
        and logical individual, weighing options individually based on what he deems
        best at the time, easily altering the minds of dozens of Holy Knights who
        had been enhanced with Demon's Blood at once. He will also torture foes with
        their worst memories if he deems it necessary, showing a ruthless streak.
        He will even turn on his own comrades if it means accomplishing his goals,
        rewriting Guila's mind to forget Zeal in order to learn about what it means
        to have a heart and "stain" her as well as causing Diane to forget King and
        the Sins again)
