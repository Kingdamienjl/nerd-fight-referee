- id: claim-weaknesses-2b2e7d28
  section: weaknesses
  axis: weakness
  text: 'His curiosity sometimes gets the best of him, causing him to make irrational
    decisions to discover emotions and gain "a heart", he has poor eyesight and thus
    requires his glasses to see and aim properly. After regaining his emotions his
    mentality has completely stabilized. Notable Attacks/Techniques: Balor''s Magical
    Eye: Gowther is built with an innate version of Balor''s Magical Eye, which allows
    him to instantly determine another''s power level in terms of physical strength,
    magic power, and will. Carbon Dating: Gowther was able to determine how old a
    tree was by pressing his hand to it and rapidly analyzing it. Enhanced Memory:
    Gowther demonstrated his impressive memory by rapidly flipping through an entire
    book in order to read it. Telekinesis: Gowther has demonstrated basic telekinesis,
    levitating inside his massive armor and controlling it as if it was his own body.
    Transformation: Gowther can change his hair length and color as well as his eye
    color at will. Voice Mimicry: Gowther can perfectly mimic others'' voices. ===Invasion===
    Gowther''s magic power that grants him several mind-related abilities such as
    illusions, memory erasure, creation, and alteration, nerve control, and telepathy.
    Many of Gowther''s techniques are used in conjunction with his Twin Bow Herritt,
    although he doesn''t need it to use Invasion. Gowther''s magic also deals damage
    to the soul. * Blackout: In conjunction with Twin Bow Herritt, Gowther extends
    his power throughout a three mile radius, instantly incapacitating anyone within
    who has a spirit level less than 400 for exactly ten minutes. GowtherBlackout.png|Blackout
    BlackoutEffects.png|renders everyone without a strong enough will Blackout3.png|unconscious
    ** Blackout Arrow: Gowther focuses Blackout into an energy arrow which he fires
    into his target''s head to render them unconscious. This technique was able to
    knock pseudo-sun Escanor unconscious. thumb|centre|250x250px|Blackout Arrow *Breaker
    Off: Gowther completely immobilizes his target by blocking the connection between
    their nerves for ten seconds. thumb|centre|250x250px|Breaker Off * Broadcast:
    Gowther fires a thin beam of light that threads its way through everyone he wishes
    to communicate with, allowing him to transmit his thoughts to everyone affected.
    Broadcast.png|thumb|centre|250x250px|Broadcast * Illusions: Gowther can create
    illusions without directly hitting his target with Invasion. He created an illusory
    attack to fool Chandler into thinking Celestial Arrow had been fired, causing
    him to use Full Counter on nothing and create an opportunity for the real Arrow
    to hit. * Jack: Gowther fires an Invasion blast at his target, taking direct control
    of their nerves in order to control their movements. Enemies being controlled
    by another, as well as those without nerves, are unaffected by this technique.
    Gowther can rapidly fire several Jack projectiles. ** Gatling Jack: Gowther rapidly
    fires Jack in all directions without taking aim. ** Hijack: Gowther uses Herritt
    to enhance his Jack to the point where he can control inanimate constructs like
    the earth golems created by Diane. He was able to wrest control of the golems
    from Diane despite her skill with Creation. GowtherJack.PNG|Jack Gowther''s Gatling
    Jack.jpg|Gatling Jack GowtherHijack.PNG|Hijack * Lost World: After Gowther uses
    this technique, his target''s memories are gradually erased, beginning with the
    most recent. thumb|center|250x250px|Lost World * Nightmare Teller: After hitting
    the target with an Invasion arrow or making physical contact with them, Gowther
    can produce nightmarish visions based on the target''s most traumatic memories,
    trapping them in an endless nightmare. The victim is immobile and defenseless
    while under the effects of this technique. Even if the victim breaks free, they
    are left physically and mentally exhausted by the experience. File:NightmareTeller1.jpg|Traps
    Dreyfus in a nightmare File:NightmareTeller2.jpg|that reduces his psyche to that
    of a child''s File:NightmareTeller3.png|and will never end * Playback: Gowther
    can replay his memories to others by projecting them onto a conjured screen. thumb|centre|250x250px|Playback
    * Rewrite Light: Gowther uses Herritt to fire a barrage Invasion arrows, instantly
    rewriting the memories of those struck, causing them to perceive Gowther and his
    allies as friends, lovers, or whatever else Gowther needs them to be. However,
    these changes are only superficial, and they quickly become undone once the victims
    realize the inconsistencies in their memories. File:RewriteLight1.jpg|Fires Invasion
    arrows File:RewriteLight2.png|that rewrite the memories of the enemies File:RewriteLight3.jpg|turning
    them friendly * Searchlight: Gowther fires a small arrow from his finger that
    allows him to instantly invade the mind of the victim. He can delve into his foes''
    subconscious with this technique. File:Searchlight1.jpg|Allows him to File:Searchlight2.jpg|view
    others'' minds * Sense Opener: Gowther manipulates the feeli'
