- id: claim-powers-and-abilities-784baf1c
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Magic, Non-Physical Interaction (Space\
    \ & Soul; Scale from Escanor, who can interact with portals using his hands.Nanatsu\
    \ no Taizai Extra Chapter: The Vampires of Edinburgh - Part 2 The sins interacted\
    \ with Guila\u2019s soulNanatsu no Taizai Chapter 26) Information Analysis (Can\
    \ analyse brainwave patterns), Extrasensory Perception, Immortality (Types 1 and\
    \ 2: Gowther can survive injuries that would usually kill a regular person), Inorganic\
    \ Physiology (Type 1), Self-Sustenance (Types 1, 2 and possibly 3), Telepathy,\
    \ Telekinesis, Forcefield Creation and Electricity Manipulation (Established a\
    \ barrier that repels anyone with bad intents with an electrical discharge), Power\
    \ Bestowal (Enchanted an idol to protect and camouflage a village), Mind Manipulation,\
    \ Clairvoyance (Spied on Percival and his friends through a familiar), Nightmare\
    \ Manipulation, Fear Manipulation, and Minor Paralysis Inducement via Nightmare\
    \ Teller (Created nightmares based on trauma memories, causing the target to be\
    \ physically & mentally exhausted to the point of paralysis), Memory Manipulation,\
    \ Body Control, Body Puppetry, Biological Manipulation (Can detach and reattach\
    \ his body parts, including his head, making him difficult to kill), Intangibility\
    \ (His magical attacks can oscillate between tangible and intangible forms), Resistance\
    \ Negation and Power Nullification (Reduced his abilities to a fraction of what\
    \ they once were by attempting to erase his memories. Removed the Demon King's\
    \ magical abilities. Erased Ardd's magic), Illusion Creation, Soul Manipulation\
    \ (His magic can deal damage to the soul), Empathic Manipulation and Sleep Manipulation\
    \ (Reversed the effects of Lightball of Love with Sense Opener), Homing Attack\
    \ with Double Bow Harlit, Transformation (Can change his skin color, voice, and\
    \ hair), Summoning, Immunity to Empathic Manipulation and Sleep Manipulation (Was\
    \ completely unaffected by the pleasure and sleep inducement of Mael's Lightball\
    \ of Love), Possibly Soul Manipulation (As a puppet he probably won't have a soul),\
    \ Possession and Mind Manipulation/Madness Manipulation (Type 2: Resisted the\
    \ Dead Spirits Possession), Self-Destruction, Homing Attack, Perception Manipulation,\
    \ Information Analysis, Status Effect Inducement, Paralysis Inducement (Lacks\
    \ a nervous system, rendering him immune to Atollah's powers) and Heat Manipulation\
    \ (Survived Supreme Deity's lightning attack)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
