      value: 'Merlin is sometimes too playful for her own good. Her magic has an extremely
        brief but exploitable casting time. Notable Attacks/Techniques: Blessings:
        Merlin received numerous blessings from both the Supreme Deity and the Demon
        King, who wanted her on their side due to her innate magic power Infinity.
        She negotiated with both deities and persuaded both to grant her knowledge
        and power. The Demon King granted her information on all the secret arts and
        mysteries of the underworld and protection against the brainwashing of the
        Goddess Clan. The Supreme Deity granted her divine protection that could nullify
        dark curses, including the Commandments of the Demon King, although Merlin
