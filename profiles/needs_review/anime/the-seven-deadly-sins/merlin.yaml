    - field: intelligence
      value: The most powerful sorcerer or warlock to ever walk the earth. Highly
        intelligent and competent. Can learn magic at an incredibly fast rate, learning
        in less than one year enough to take out numerous opponents with many more
        decades of learning than him. For most magic needs to be studied and perfected
        for many years, but Merlin's magic developed from birth with no training,
        Merlin is both highly admired and respected by the magical people (such as
        the Druids) and is both envied and feared by his enemies (such as Morgana).
        He can cast spells without chants, has experience in fighting magical creatures,
        deities, dragons and undeads, is a highly skilled swordsman able to take on
        Morgana and Morgause's immortal army, managing to kill several of them whilst
        wielding Excalibur (He is the one that created it with the help of Kilgharrah).
        He has some knowledge in medicine and potion making, is extremely talented
        at keeping secrets, being able to hide his magical abilities from everyone
        for years in Camelot excluding Gaius and Lancelot, because magic is considered
        evil.
      source_id: mediawiki-49128
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'As confirmed by Balinor, creatures born with magic, like Merlin and
        Morgana cannot die, unless they are stabbed through the heart by a sword forged
        in a dragon''s breath. (like Excalibur) It is the only weapon that can permanently
        kill them. Notable Attacks/Techniques: * Stunning Spell: The power of this
        telekinetic blasts is capable of incapacitating, wounding, or even killing
        enemies on impact, even without the presence of obstacles that would be used
        to increase blunt force trauma. His telekinesis can also have a wide range
        like a wave, hitting as many as seven men simultaneously, once killing six
        opponents directly and momentarily stunning another. * Lightning Spell: Merlin
        can call down lightning bolts powerful enough to tear through large sections
        of Morgana''s army at once. * Time Magic: Can slow down objects or, under
        certain circumstances, time itself. * Whirlwind Spell: Can conjure a cyclone
        of wind. * Dragonlord Magic: Can influence dragons and wyverns by speaking
        in the language shared by their souls. Merlin is furthermore able to summon
        Kilgharrah over long distances. * Fire Spells: Can magically conjure flames,
        control fire or make a flame grow. Capable of heating enemies weapons so they
        can no longer hold them, throwing a wave of fire and causing explosions. ==
