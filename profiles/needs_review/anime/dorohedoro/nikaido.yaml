    - field: weaknesses
      value: 'Normal human weaknesses Notable Attacks/Techniques: Returning Kukri
        of Childbirth: A cursed kukri that was created when a mother that had her
        baby killed by a feudal lord hid a knife within her own body, seduced him
        and killed him in his own bed with it. The kukri has the power to enter and
        leave the body of its owner without physically harming them. However, the
        owner will still experience the discomfort and pain one would expect from
        having that kind of foreign object enter and leave the body forcefully. Its
        curse makes it so that every time it enters the body it gradually moves closer
        to the owner''s heart, eventually killing them. Milimeter Dodging: Because
