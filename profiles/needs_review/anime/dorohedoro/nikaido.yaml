        classification of Ancient attributes after a few weeks of study, and also
        learned Transfer magic in a similarly short span of time. Improvises and comes
        up with new spells on the fly to deal with enemy abilities. Instantly came
        out with a plan to defeat Mother Goose after losing an arm and a leg)
      source_id: vsbattles-nikaido-dorohedoro
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Aurora Gate and Aurora Fortress take significant time to cast, as a\
        \ Light-type magic Aurora magic is weak to Darkness-type attacks and Darkness-derivate\
        \ properties like \"Blood\", \"Gloom\", \"Rotting\", and \"Poison\" Notable\
        \ Attacks/Techniques: Magic: Mari is a witch, a human that can use magic due\
        \ to a special organ on her body called a Phantom Instrument that produces\
        \ magic power. Her attribute is the Ancient attribute known as \u201CAurora\u201D\
        , the strongest light attribute and a versatile attribute which makes her\
        \ magic shine with the seven colors of the rainbow. Additionally, Aurora magic\
        \ attacks have the ability to deal damage directly to souls and even destroy\
        \ them, though Mari can regulate their power to make them non-lethal. *Aurora\
        \ Bullet (\u6975\u5149\u306E\u93C3 (\u30A2\u30A6\u30ED\u30FC\u30E9\u30FB\u30D0\
        \u30EC\u30C4\u30C8) lit. Auroral Arrowhead): Mari imitates a gun with her\
        \ fingers before shooting a powerful concentrated magic bullet at high speed.\
        \ *Aurora Gate (\u5149\u306E\u5230\u9054\u70B9 (\u30A2\u30A6\u30ED\u30FC\u30E9\
        \u30FB\u30B2\u30FC\u30C8) lit. Light Convergence): Mari's strongest offensive\
        \ spell. Mari summons a huge magic circle beneath her feet as she gathers\
        \ magic power. Once she finishes building up power Mari joins her hands together\
        \ and gives a chant for the spell, which will release a powerful wave of light\
        \ from a gate that appears in front of Mari. Chant: \u201CWith the blessing\
        \ of a Goddess's of Dawn, I become one who embodies the divine will. The end\
        \ of knowledge and creativity brings about dazzling demise. Ultimate light\
        \ opens up the heavenly gates\u2014\u2014and entices that person to step in\
        \ nothingness!\u201D *Aurora Beam: Mari shoots a two-meter thick magic beam\
        \ from a magic square that appears in her vicinity. *Aurora Cannon: Mari gathers\
        \ her magic power into a huge shell before shooting it towards the enemy.\
        \ **Auroral Collider: An Aurora Cannon enchanted with 'Electrification' magical\
        \ property, taking the form of rainbow-colored thunder bullet. *Aurora Barrage:\
        \ Mari releases a storm of light bullets from several hundred small magic\
        \ circles that appear around her. *Aurora Blade: Mari creates a 20m long blade\
        \ out of rainbow-colored particles to slash the enemy. **Eclipse Blade: Mari\
        \ reverses the light property of Aurora Blade, turning it into a Darkness-type,\
        \ Moon-property jet-black sword. **Helios Blade: Mari turns her Eclipse blade\
        \ into a Light-type Sun-property sword of light. *Aurora Counter: Undescribed\
        \ spell that Mari used to shoot down hundreds of missiles to save Ouka. *Stardust\
        \ Aurora (\u6975\u5149\u6D41\u661F\u7FA4 (\u30B9\u30BF\u30FC\u30C0\u30B9\u30C8\
        \u30FB\u30A2\u30A6\u30ED\u30FC\u30E9) lit. Auroral Meteor Shower): An improvised\
        \ technique Mari developed to try and deal with Iori Himemiya and her Relic\
        \ Eater ability to predict magic and the enemy's movements. Mari creates a\
        \ huge magic circle below her. She then pulls her right arm back, building\
        \ up magic power before punching the magical circle, causing it to crumble\
        \ and release several overlapping car-sized Aurora Cannons in all directions.\
        \ Because the circle was crushed before the operative procedure fixing the\
        \ magic into rays could be completed, the magic is forced to activate prematurely\
        \ and the Aurora Cannons fire in random directions. *Aurora Impact: Mari uses\
        \ a five-layered magic circle to converge magic power into her hands. She\
        \ joins her hands together and slams her fists into the enemy, releasing the\
        \ magic at the same time to cause an explosion capable of pulverizing an Einherjar\
        \ made with Blue Crystal. *Aurora Arrow: Mari summons a bow with a rainbow-colored\
        \ arrow. *Aurora Enchantment: Mari envelops her own fist or leg with magic,\
        \ massively increasing the power of her blows to the point it can blow through\
        \ Ouka Ootori's defenses despite Ouka being in Dracula form. *Aurora Rain:\
        \ Mari summons several magical circles on the sky that constantly pour down\
        \ rainbow-colored pillars of light. Mari can create up to 100 magic circles\
        \ for this attack. *Shockwave: Mari can concentrate and release her magic\
        \ power from her body as a shockwave. This technique can be used to blow nearby\
        \ people away or to counter a sound attack. *Aurora Benefit: Mari's body is\
        \ covered with a very thin layer of aurora light. This spell is a combination\
        \ of body strengthening magic and brain acceleration magic that significantly\
        \ increases Mari's speed and reflexes. However, brain acceleration magic is\
        \ incredibly dangerous and can cause brain damage at the slightest mistake,\
        \ which is why Mari doesn't voluntarily use this spell. *Aurora Field: Mari\
        \ creates a field of multi-colored light. Anything inside the field (or that\
        \ enters the field after while it\u2019s active) slows down to a crawl and\
        \ moves in slow motion, also increasing their weight. *Aurora Shield: Mari\
        \ puts her hands on the ground and creates a magic circle around her. The\
        \ circle wraps everyone inside it with multi-colored light like a barrier\
        \ film. *Aurora Fortress (\u5149\u306E\u57CE\u585E (\u30A2\u30A6\u30ED\u30FC\
        \u30E9\u30FB\u30D5\u30AA\u30FC\u30C8\u30EC\u30B9) lit. Fortress of Light):\
