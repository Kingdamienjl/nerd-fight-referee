        \ Nemesis to the end of spacetime. * Black Lady blitzed Sailor Moon taking\
        \ her Silver Crystal. * Teleported herself and others. * Brainwashed Tuxedo\
        \ Kamen. * Called down a Black Crystal Pillar. Crystal Pillars emit poisonous\
        \ mists that gradually fade things from existence. Several of these Pillars\
        \ working together exponentially increase the speed at which they work such\
        \ that 3 of them rapidly threatened a planet. * Can make a palace disappear\
        \ into darkness and create what she wants in it's place. Kind of a vague statement\
        \ though. Notable Attacks/Techniques: |-|Chibiusa Tsukino= {{#Tag:Tabber|\
        \ Original Form= File:Abracadabra Pon 29.jpg|Abracadabra Pon File:powers garlic\
        \ attack.jpg|Garlic Attack File:Moon Prism Power Chibi Moon (manga).jpg|Moon\
        \ Prism Power, Make Up File:Moon Crisis, Make Up (manga).jpg|Moon Crisis,\
        \ Make Up File:Pink Moon Crystal Power, Make Up.jpg|Pink Moon Crystal Power,\
        \ Make Up * Abracadabra Pon: A magic ability used by Chibiusa in the manga.\
        \ To perform this ability, Chibiusa uses Luna-P. Chibusa transforms the Luna-P\
        \ into various objects. Most notably is an umbrella which she can use to hypnotize\
        \ people. Chibiusa learned this ability from Sailor Pluto in the manga, after\
        \ the former was teased by the children of Crystal Tokyo and went wandering\
        \ down the hallways to the Space-Time Door. Pluto told Chibiusa that whenever\
        \ she felt sad, she should utter the phrase \"abracadabra\" to feel happier.\
        \ Sailor Pluto demonstrated the ability of Chibiusa by causing flowers to\
        \ appear and bloom. * Garlic Attack: An attack that was used by Chibiusa Tsukino\
        \ in the first Chibiusa's Picture Diary side story. The night before, Chibiusa\
        \ had eaten a Korean dish Makoto had made and was left with a strong breath\
        \ of garlic the next day, nauseating most who were around her. After discovering\
        \ that Lilica and her mother were really vampires, and Lilica had gotten ahold\
        \ of Sorano and Kyuusuke, Chibiusa used her garlic breath to knock Lilica\
        \ unconscious. : Henshin: Chibiusa can use the Power of her Sailor Crystal\
        \ to Transform into Sailor Chibi Moon and then her stronger forms. The Henshin\
        \ Power can also be used to teleport through dimensions or reverse enemy-magic.\
        \ chibimoon-awakens.jpg|First Sailor Chibi Moon's transformation * Moon Prism\
        \ Power, Make Up: The first command Chibiusa Tsukino used to transform into\
        \ Sailor Chibi Moon. It was first used in Act 27 of the manga. * Crisis, Make\
        \ Up: A command used to transform into Super Sailor Chibi Moon in the manga\
        \ with the Holy Grail. In the English version, it was Moon Crisis Power. Holy\
        \ grail CM.jpg * Moon Crisis, Make Up: The command used by Usagi and Chibiusa\
        \ to transform into Super Sailor Moon and Super Sailor Chibi Moon, respectively.\
        \ It debuted in Act 39 of the manga. In Act 46, Usagi and Chibiusa held hands\
        \ and raised them up in the air while saying \u201CMoon Crisis! Make Up!\u201D\
        \ and instantly transformed into Super Sailor Moon and Super Sailor Chibi\
