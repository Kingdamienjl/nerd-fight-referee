    - field: standard_equipment
      value: "Items= File:bxw item18.png|Luna-P File:Key of Space-Time (manga).jpg|Space-Time\
        \ Key \uFF62\u6642\u7A7A\u3058\u304F\u3046\u306E\u30AB\u30AE\uFF63 File:HolyGrailArtbook3.jpg|Holy\
        \ Grail \uFF62\u8056\u676F\u305B\u3044\u306F\u3044\uFF63 File:Chibi Moon Compact\
        \ 29.jpg|Chibi Moon Compact File:bxw item22.png|Crystal Carillon * Luna-P:\
        \ A device used by Chibiusa Tsukino that was given to her by Sailor Pluto.\
        \ It was her dear friend and it bore a strong resemblance to Luna. Luna-P\
        \ seemed to have some self-awareness; it followed Chibiusa and defended her.\
        \ She could also use Luna P for communication with the other Sailor Guardians.\
        \ Chibiusa used Luna-P with various commands. She used Abracadabra Pon, a\
        \ phrase that was taught to her by Sailor Pluto, for whenever she felt sad.\
        \ She also transformed Luna-P into an umbrella in order to hypnotize Usagi's\
        \ family into thinking that she was their cousin. Luna-P transformed into\
        \ the Pink Moon Rod when Sailor Chibi Moon desired the power to help her friends.\
        \ * Space-Time Key \uFF62\u6642\u7A7A\u3058\u304F\u3046\u306E\u30AB\u30AE\uFF63\
        : A magical item from the Sailor Guardian of Space-Time, Sailor Pluto, that\
        \ was carried and used by Chibiusa Tsukino after the latter had taken one\
        \ from Sailor Pluto's chain in order to travel back in time. The key allowed\
        \ Chibiusa to travel through various timelines, and call on Sailor Pluto as\
        \ well. * Prism Heart Compact: Chibiusa Tsukino's first transformation brooch,\
        \ in which she used to transform into Sailor Chibi Moon. It is also referred\
        \ to as the Pink Sugar Compact. The compact is never referred to as this name,\
        \ as it was never named on-screen or in the manga. * Holy Grail \uFF62\u8056\
        \u676F\u305B\u3044\u306F\u3044\uFF63: A sacred goblet/cup of great, holy power\
        \ used by Super Sailor Chibi Moon in the manga. By calling out Crisis, Make\
        \ Up!, the Grail enables her to temporarily become Super Sailor Chibi Moon,\
        \ which is a much stronger and more powerful evolution of her third regular\
        \ Sailor form. * Chibi Moon Compact: The brooch that Chibiusa uses in order\
        \ to transform into Super Sailor Chibi Moon with \"Moon Crisis, Make Up!\"\
        \ It is her second compact, and it is very similar to Usagi's, except that\
        \ the center jewel is a heart instead of a circle, and the outer ribbon design\
        \ pattern is slightly different. Like Usagi's compact, she received it from\
        \ Pegasus. * Crystal Carillon: A mystical attack item given to Super Sailor\
        \ Chibi Moon by Pegasus, and was used to call upon Pegasus during fights,\
        \ so she could use his exceptional healing ability. The Carillon was a very\
        \ small item, smaller than the palm of the hand. It was given to Chibiusa\
        \ by Pegasus mainly for the purpose of communication. All Chibiusa had to\
        \ do was to ring the bell to call on Pegasus. Sailor Chibi Moon used it to\
        \ perform Twinkle Yell once."
