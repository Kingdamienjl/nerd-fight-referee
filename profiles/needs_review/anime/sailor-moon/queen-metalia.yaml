- id: claim-weaknesses-da95fa2b
  section: weaknesses
  axis: weakness
  text: "The Star-like diamond mark on her forehead is a weak point that can be attacked\
    \ by holy light attacks like Sailor Moon's.Vol 3, Act 14 Conclusion and Commencement\
    \ - Petite \xC9trangere - Intense enough lights can physically repel or push away\
    \ Metalia's form such as when Sailor Moon made the Whole Moon glow with the intensity\
    \ of the Silver Crystal. She prefers to emotionally torture sentient beings than\
    \ kill them since in their despair they release more energy for her to consume.\
    \ Feats: Show/Hide"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0b27d4d1
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Teleportation, Incorporeality
    (Literally made out of darkness), Intangibility, Immortality (Type 1 & 3), Regeneration
    (At least Low-High, possibly Mid-High: To defeat Metalia Sailor Moon had to reduce
    her to a "dark speck of dust"), Darkness Manipulation (Metalia made the entire
    Sun go dark, she can also absorb entire planets into her darkness), Air Manipulation,
    Weather Manipulation (Metalia''s presence on Earth created winds so intense and
    cold that it caused a state of emergency across the globe), Size grows in relation
    to the amount of energy she absorbed, Energy-Sensing (Metalia can sense the energy
    of beings on the surface from Deep Underground and was able to sense the energy
    of individual beings), Energy-Draining (Metalia absorbed energy on the surface
    from deep underground and was able to absorb an energy attack to her face where
    her weak point was), Petrification (Metalia can turn entire kingdoms to stone),
    Resurrection and Power Bestowal (Metalia revived Mamoru and gave him greater dark
    power), Brainwashing (Metalia''s awakening caused humanity to go insane, and she
    later hypnotized them to serve her), Illusion Creation (Can transmit images to
    others psionically), Self-Sustenance (Type 1, 2 & 3), Telepathy, Her Mere Presence
    can cause beings to go blind, Magic, Existence Erasure, Earth Manipulation, Spatial
    Manipulation (Her presence warps space), Absorption (She is able to absorb people),
    Resistance to Soul Manipulation and Purification (She was not affected by the
    spiritual attack of Sailor Mars), Large Size (Type 5, potentially Type 6)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
