  intelligence:
    text: 'Genius (Extremely intelligent, immense wisdom and judgement skills, knowledgeable
      in physics), possibly bordering on Nigh-Omniscience in regards to space and
      time. She has been alive for many millennia guarding the Space-Time door and
      understands timelines to a T. Standard Tactics: Infiltrating and transforming
      | Her attacks are based around time, the underworld, space, darkness, death,
      precognition, and powers granted by her Garnet Orb. In-Character she is less
      likely to use her Talisman to its full extent due to it having a very large
      obvious energy signature and if the three Talismans are gathered they will summon
      Sailor Saturn, whose destiny is to destroy the world. She is also not likely
      to cause time to stop unless it is absolutely necessary and the last resort.
      | Is bloodlusted under Sailor Galaxia | Unknown'
