    - field: weaknesses
      value: "if you withdraws her brooch, she loses her transformation, Surpassed\
        \ her thousands of years old mother Queen Serenity by the age of 16., Saved\
        \ the Universe many times., Cross Dimensions at will, Create Heavely Body\
        \ with her presence, She has destroy the Dark Universe, She is the Strongest\
        \ soldier of the Universe, Light Up the Universe and Space Time., Moon Power\
        \ [disguise] ni nare: Using the Disguise pen Usagi can transform into whatever\
        \ she wants., Moon Prism Power, Make Up: The first command that Usagi Tsukino\
        \ used to transform into Sailor Moon. In the manga, the transformation is\
        \ instant. All Usagi has to do is to cross her arms and say the phrase, she\
        \ has transformed into Sailor Moon., Moon Crystal Power, Make Up: The second\
        \ command that Usagi Tsukino uses to transform into Sailor Moon in the manga\
        \ series, first anime series, Moon Cosmic Power, Make Up: The third command\
        \ that Usagi Tsukino used to transform into Sailor Moon. It debuted in episode\
        \ 91 of the anime and Act 27 of the manga., Make Up: The command used when\
        \ Sailor Moon used the Holy Grail to transform/evolve into Super Sailor Moon.,\
        \ Moon Crisis, Make Up: The command used by Usagi and Chibiusa to transform\
        \ into Super Sailor Moon and Super Sailor Chibi Moon, respectively. It debuted\
        \ in episode 130 of the original anime and Act 39 of the manga., Silver Moon\
        \ Crystal Power, Make Up: The command that Usagi Tsukino uses, along with\
        \ the Holy Moon C\xE1lice, to transform into Eternal Sailor Moon in the manga.,\
        \ Supersonic Waves: Usagi cries and her crying is amplified through her hairpieces,\
        \ creating a powerful vibration attack. The attack can destroy dimensions\
        \ and can hit on the astral plane, hurting ghosts., Moon Frisbee: Sailor Moon\
        \ throws her tiara, in turn it becomes a rapidly rotating disc similar to\
        \ a frisbee. The Tiara transmutes what it touches into moon dust., Sailor\
        \ Moon Kick: Sailor Moon kicks her opponent to injure them. The kick was able\
        \ to hurt Youma that was not even affected by the Supersonic Waves., Double\
        \ Sailor Moon Kick: Sailor Chibi Moon used this physical attack together with\
        \ Sailor Moon., Moon Twilight Flash: Sailor Moon uses her tiara to reflect\
        \ a beam of the mystic light of the moon at her enemy. This attack hits intangible\
        \ beings and burns them away, even able to destroy Nephrite's Shadow when\
        \ Mars' Ofuda could not., Moon Healing Escalation: Sailor Moon uses the Silver\
        \ Crystal via the Moon Stick to release positive energy capable of bringing\
        \ people from the grave, restoring power to an entire city, curing people\
        \ of brainwashing. Pre-Serenity she could use the ability on a City-Scale\
        \ however Post-Serenity her range expanded into healing entire worlds. During\
        \ her battle with Queen Metalia, Sailor Moon resurrected the ancient Moon\
        \ Kingdom merely as a side-effect of the positive energy she was using., Moon\
        \ Princess Halation: Sailor Moon uses the Cutie Moon Rod to send a piercing\
        \ beam of light from the tip. This light can penetrate though space-time and\
        \ magical barriers, able to hit and affect Planet Nemesis despite the negative\
        \ energy barrier nullifying energy and the intense space-time warping of the\
        \ planet. The attack also hits on the spiritual plane as it was able to destroy\
        \ the evil spirit, Moon Spiral Heart"
