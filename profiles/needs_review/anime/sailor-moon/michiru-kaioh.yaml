    - field: standard_equipment
      value: "Neptune Crystal, Tiara: Part of any Sailor Senshi's fuku, except Sailor\
        \ Cosmos, Sailor Galaxia, and Eternal Sailor Moon. When looking at the tiara\
        \ from a distance it appears to have a rather simple smooth golden design\
        \ with a circular red gem at it's centre. On closer inspection though one\
        \ can see that it in fact has subtle details engraved in its surface and the\
        \ gem itself is encased in a golden frame., Galactica Bracelets, Deep Aqua\
        \ Mirror: Sailor Neptune's Talisman, which she used to perform the attack\
        \ \"Submarine Reflection\". It was used not only as a weapon, but also to\
        \ reveal the truth and the location of enemies. The item is already possessed\
        \ by the owner, rather than being made to summon the Holy Grail they were\
        \ made to summon Sailor Saturn herself. The mirror has been seen to work for\
        \ others beside Sailor Neptune as Chibiusa once used it to locate and teleport\
        \ to a different location. Michiru gave Chibiusa the mirror at some point\
        \ before the Dream Arc. When the Outer Sailor Guardians returned, Chibiusa\
        \ teleported the mirror back to Super Sailor Neptune in order to help her\
        \ fight the Dead Moon Circus., Marine Cath\xE9drale: The name of Michiru's\
        \ violin. During one of her concerts, an audience member states, \"I hear\
        \ that her violin is a five hundred million yen Stradivarius named after the\
        \ temple of the sea.\" Michiru, as Sailor Neptune, is also able to use her\
        \ violin for attacking, as she used it to perform an unnamed sound attack\
        \ in Act 30. She is also able to perform two attacks with her violin in the\
        \ manga: Submarine Violin Tide and Galactica Violin Tide., Galactica Bracelets:\
        \ Bracelets worn when Sailor Saturn was reconstructed to be a loyal subject\
        \ to Sailor Galaxia. Can be used to fire blasts of energy at an enemy. Destroying\
        \ them entirely and allowing the user to take their Sailor Crystal from them.\
        \ They have purple and green gems on them. :Can Pilot: Kaioumaru"
      source_id: vsbattles-michiru-kaioh
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Gifted (Very intelligent. She attended a school reserved for geniuses
        simply to spy on her enemies in the Infinity arc of the series and excelled
        in academics and the arts without much effort.) She''s also been shown to
        have sharp intuition and some form of precognition, which is enhanced by her
        Deep Aqua Mirror. Standard Tactics: Infiltrating and transforming | Her attacks
        are based around the ocean or sea, precognition and powers granted by her
        mirror. In-Character she is less likely to use her Talisman to its full extent
        due to it having a very large obvious energy signature and if the three Talismans
        are gathered they will summon Sailor Saturn, whose destiny is to destroy the
        world. | Is bloodlusted under Sailor Galaxia | Unknown'
      source_id: vsbattles-michiru-kaioh
      provider_id: vsbattles
      authority: high
