- id: claim-weaknesses-64739592
  section: weaknesses
  axis: weakness
  text: 'VanityVol 2, Act 7 Mamoru Chiba - Tuxedo Mask -, the Holy Sword. Feats: Toggle
    Physicals * In the Silver Millennium, Beryl was actually the one who slew Prince
    Endymion at Metalia''s urging. * Beryl explicitly says she''s stronger than S-Tier
    Post-Serenity Sailor Moon.Vol 2, Act 11 - Reunion, Endymion However, Beryl is
    vain and great caution is advised before using this. * Was able to fight the entire
    First Arc Sailor Senshi Team at once. * Metalia, an energy-senser was surprised
    Sailor Moon and the Others could Kill Beryl, wondering if they got stronger.Vol
    3, Act 12 - Enemy, Queen Metaria This may support the previous statement. * Princess
    Serenity was releasing Stellar Levels of Energy that Kunzite couldn''t handle.
    Beryl teleports in to save him and is unaffected by the level of energy. * Fast
    enough to blitz First Arc Sailor Moon. Even Civilian Form Sailor Senshi have FTL
    Feats.Codename: Sailor V, Vol.1 - The Birth of Sailor V! Special Abilities * Can
    see distant events in her Crystal Ball. * Teleportation * Bound the Kings of Heaven
    to her whim. * Can Control the Bodies and Minds of Others. Since she basically
    gave the Heavenly Kings their powers, she may be able to do the same. Respect
    Thread for the 4 Heavenly Kings. * Can Bind someone through the cycle of regeneration
    so that no matter how many times they are reborn or regenerate they will be slaves
    to her will.Vol 2, Act 10 Moon * Led a successful invasion of the Moon and nearly
    led a successful invasion of the Earth. Notable Attacks/Techniques: *Beryl''s
    Curse: Queen Beryl can cast a very cruel spellbinding people to her whim across
    the cycles of reincarnation, so even when they die and are reborn they will remain
    bound to her will. Using this spell she can also change the bodies and powers
    of the affected beings to serve her better. ==Notable Matchups== Victories: Losses:
    Inconclusive: ==References== {{Scroll box|content={{reflist|2}}}} {{discussions|Queen-Beryl-manga|Queen
    Beryl (manga)}} Category:Characters Category:Sailor Moon Category:Female Characters
    Category:Manga Characters Category:Light Novel Characters Category:Tragic Characters
    Category:Evil Characters Category:Royal Characters Category:Antagonists Category:Primary
    Antagonists Category:Humans Category:Villains Category:Leaders Category:Queens
    Category:Magic Users Category:Mind Users Category:Flight Users Category:Teleportation
    Users Category:Telekinesis Users Category:Matter Users Category:Hair Users Category:Staff
    Users Category:Darkness Users Category:Corruption Users Category:Curse Users Category:Portal
    Users Category:Clairvoyance Users Category:Self-Sustenance Users Category:Fallen
    Characters'
