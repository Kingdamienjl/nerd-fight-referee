        \ turn the Rasengan and Parent-Son Rasengan invisible, He is also capable\
        \ of using Uchiha Style Shurikenjutsu: \"Lightning\": Triple which is connected\
        \ a stream of lightning between three shuriken), High-Level Wind Manipulation\
        \ & Durability Negation (Boruto is capable of casting an S-Rank Jutsu known\
        \ as the Rasenshuriken, this is impressive as its deemed a Forbidden S-Rank\
        \ Jutsu by Tsunade,Kakashi, The Other Kage, and Naruto, The Rasenshuriken\
        \ is stated to do damage on a Cellular Level), Chakra Aura, Portal Creation,\
        \ Space-Time Manipulation & BFR (With his Karma Seals; Boruto is capable of\
        \ manifesting Karma Portals which he uses to both travel places as well as\
