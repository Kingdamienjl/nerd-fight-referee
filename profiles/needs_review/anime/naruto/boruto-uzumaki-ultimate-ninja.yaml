power_scale:
  tier:
    text: 8-A, higher with Shinobi Gauntlet | 4-A
    source_ids: &id002
    - mediawiki-4873608
    confidence: 0.8
  attack_potency:
    text: 'Multi-City Block level (Should be comparable to the Genin of the past.
      Often shown to be superior to Sarada and Mitsuki. Knocked out multiple members
      of Zero without being alerted. Fought 3 Uchiha during the Warring States Period,
      though would have been killed had he not been saved by Nanashi. Fought against
      Nanashi Uchiha, albeit the latter was holding back as she was conflicted and
      hadn''t used Yachihoko. His Rasengan was able to temporarily clash with Hokage
      Naruto''s Rasengan, but it should be noted that they were sparring and Naruto
      wasn''t going all out. Was able to harm Fused Momoshiki with his Vanishing Rasengan,
      though the latter was heavily weakened and almost depleted of all his chakra),
      higher with Shinobi Gauntlet (The Gauntlet contains jutsu on levels far above
      his own) | Multi Solar System Level (When amped by Yachihoko, which gave him
      the chakra of nearly every shinobi in the Ninja World including Naruto''s, his
      Vanishing Rasengan was able to deflect the sword of Merz''s Perfect Susano''o,
      which was gradually overpowering a weakened Majestic Attire: Susano''o. Cracked
      and broke though Merz''s Susano''o with his Rasengan50.64 ExaFoe)'
    source_ids: *id002
    confidence: 0.8
  speed:
