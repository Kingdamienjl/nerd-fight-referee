    - field: intelligence
      value: 'First off Boruto has been said to be a prodigy, talented and even a
        genius by numerous people in verse and even the narrator in the novels. Before
        entering the academy, at age 7, Boruto could use the Jonin-level technique
        Shadow Clone Jutsu and could instantly make 3 clones off the rip. Although
        he is the son of Naruto, the most proficient user of this technique, he was
        not taught it by him and figured it out on his own at such a young age, a
        testament to his talent. Boruto can solve advanced problems with his methods
        even though he doesn''t pay attention in classes. When Shino gives him an
        even harder question far above his classes'' level, Mitsuki''s explanation
        is enough for Boruto to understand instantly. Without studying or cheating
        like the rest of his class, Boruto still managed to get a perfect score for
        the final exam to graduate. In the Academy, Boruto learned both Wind and Lightning
        Styles. He constantly used both with his ninja tools and shadow clones, creating
        his combination Jutsu, which he named Boruto Stream. This is impressive as
        Jonin are usually expected to use at least 2 Nature transformations, whereas
        Boruto does this in the academy. By the time he becomes a Genin and the Chunin
        Exams roll around, his skills are arguably Jonin level, and he has also picked
        up Water Style, all without any real training. For a shinobi to utilize any
        jutsu, they must possess well-rounded scientific knowledge and must know every
        aspect contributing to said jutsu, excluding some exceptions. So, for Boruto
        to use Wind, Lightning, and Water styles, he must understand all three elements.
        When Sasuke tasked Boruto with learning the Rasengan so that he could become
        his student, He managed to do so in only a few days (three days, if I''m counting
        correctly). At first, it looks incomplete, as it''s small and vanishes. Still,
        Boruto actually went a step further and added a Nature Transformation, unconsciously
        creating an S-rank Vanishing Rasengan jutsu instead of replicating the A-rank
        Rasengan jutsu. This is something that even Kakashi and Minato couldn''t achieve,
        and they''re both once-in-a-generation prodigious talents. However, this is
        the only type of Rasengan Boruto could create at that point. By the next arc,
        which doesn''t take place too long after the Chunin Exams, Boruto has learnt
        how to create a normal regular sized Rasengan and even do it one-handed. And
        he has even learnt how to create a regular-sized Vanishing Rasengan one handed
        as wellchapter 65. Boruto later creates, in record time, another Nature Transformation
        Rasengan using wind style. The Wind Style: Rasengan. He also made the High
        Compression Rasengan instead of the Giant Rasengan since he lacked the chakra
        reserves. Instead, he went the other way, further compressing and condensing
        the Rasengan to its limit to increase its power in his own way. |-|Combat=
        In the Academy, Boruto sparred against Hanabi, and she compared his skills
        to those of an adult even though he did not have a Byakugan to make full use
        of the Gentle Fist. His use of clones alongside his incomplete Gentle Fist
        fighting style forced Hanabi to use Eight Trigrams: Palm Rotation against
        him at 7 years old. During his Academy Graduation, Boruto not only led his
        class but also devised three different plans, utilising the skills and abilities
        of his classmates. Two of these plans secured wins over Anko and Konohamaru,
        two Jonin with years of experience and accolades, and they also enabled them
        to rescue their captured classmates without casualties. His final plan managed
        to ensnare Kakashi, a world-renowned prodigy, strategist, and former Hokage
        who continues to hone his strength to this day. Although he could not grab
        the bell in time, Kakashi acknowledged his plan and passed the classepisode
        37. This showcases that Boruto was already Chunin level even in the academy,
        as this entails the ability to balance risk and sacrifices on a mission, among
        other things. Something Kakashi agrees with when he almost gets the bell from
        him singlehandedly. Team 7, most importantly Boruto, was able to trick Ao
        into grabbing the Chakra Sword, and stab Boruto with his own. Unbeknownst
        to him, he had stabbed a shadow clone, and Mitsuki came in and wrapped his
        arm around Ao''s hand, making him hold onto and keep holding on to the blade
        and thus draining him of his energy enough to slow him down. In the same chapter,
        Boruto uses his own chakra absorption gauntlet to cancel out Ao''s, which
        lets his Rasengan make contact with Ao and deal significant damage to his
        chakra absorption gauntlet and render it useless. Boruto also tricked Ao into
        thinking his clone was the real deal by putting the CAG (Chakra Absorption
        Gauntlet) on it, while Boruto hid underneath him and cut him nearly on two
        with the Chakra Blade after tricking Ao. While being punched away by Boro,
        Boruto saw Sarada charging in with the Chidori. He instantly calculated how
        long it''d take for her to reach him and Boro and made a quick plan to help
        he'
