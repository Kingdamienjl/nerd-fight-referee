    71), Surface Scaling and Water Walking (By focusing chakra at the soles of their
    feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto
    Chapter 18Naruto Chapter 90), Enhanced Senses (Can easily distinguish people by
    their scent and determine the physical condition of an individual, even from a
    considerable distance), Earth Manipulation, Afterimage Creation, Stealth Mastery,
    and Speed Enhancement (The Substitution Jutsu allows its user to instantly replace
    themselves with a nearby object such as a tree log, plant, person, or clone at
    the exact moment they are attacked. The Jutsu works even if the user is physically
    restrained or observed by characters as observant as Sharingan or Sage Mode users.
    This creates the optical illusion of the user being hit, which confuses the opponent
    and gives them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter
    54Naruto Chapter 374Naruto Chapter 580Naruto Chapter 674), Fusionism (Can transform
    together with Akamaru into a two-headed wolf), Limited Flight, Minor Illusion
    Creation and Duplication (With the Clone TechniqueRin no Sho, Page 220, Shinobi
    can create illusionary duplicates of themselves that have no physical substance),
    Shapeshifting (With the Transformation Technique, Shinobi can transform themselves
    into other people, animals, plants, and even inanimate objects, such as weapons),
    Paralysis Inducement (With the Temporary Paralysis TechniqueRin no Sho, Page 176,
    Shinobi can completely paralyze their targets from close to mid range), Akamaru
    has: Superhuman Physical Characteristics, Chakra Manipulation, Enhanced Senses
    (Has heightened senses, such as smell and hearing. can ''sense'' chakra with his
    nose, which allows him to judge an enemy''s strength), Small Size (Type 1, only
    in Part 1)'
  source_ids: *id003
  decisive: true
