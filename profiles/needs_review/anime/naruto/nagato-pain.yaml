power_scale:
  tier:
    text: "from 7-B to 6-B, higher with Shinra Tensei, far higher with Ch\u014D Shinra\
      \ Tensei, even higher with Chibaku Tensei | 6-B, higher with Shinra Tensei,\
      \ far higher with Ch\u014D Shinra Tensei, even higher with Chibaku Tensei"
    source_ids:
    - vsbattles-nagato-pain-naruto
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Varies (Pain's power depends on how many bodies are active at once and\
      \ how far they are from Nagato) from City level+ (Even with all six bodies active\
      \ and far from Nagato, Pain easily overpowered Kakashi, Ch\u014Dza, and Ch\u014D\
      ji. With fewer bodies active, he traded blows with base Naruto, despite not\
      \ being at full capacity53.15 Megatons) to Country level (His Rain Tiger at\
      \ Will technique is this powerful, and he can maintain it over all of Amegakure\
      \ for long periods without tiring. Casually caught a punch from Sage Mode Jiraiya.\
      \ Sage Mode Jiraiya admitted that the three Pains he faced could kill him if\
      \ he fought them all at once.Naruto, Chapter 378: \"One to One...!!\" The Animal\
      \ Path stabbed and wounded Sage Mode Jiraiya, and his dog and bird summons matched\
      \ Gamaken, who is comparable to GamabuntaSha no Sho, Page 657 Teratons), higher\
      \ with Shinra Tensei (Easily dispersed Sage Mode Naruto's Rasenshuriken with\
      \ three bodies active, and later repeated the feat with one body active while\
      \ heavily exhausted.Naruto, Chapter 441: \"Rasen-Shuriken vs. Almighty Push!!\"\
      \ A casual Shinra Tensei sent Sage Mode Naruto and his clone flying, dispersing\
      \ the clone and hurting the original. Casually one-shot Gamabunta and Gamaken\
      \ with a massive Shinra Tensei, blasting both outside the village and breaking\
      \ all of their bones), far higher with Ch\u014D Shinra Tensei (When Nagato focuses\
      \ all of his power through the Deva Path, Shinra Tensei is dramatically enhanced,\
      \ enough to level all of Konoha), even higher with Chibaku Tensei (His Chibaku\
      \ Tensei is calculated to be this powerful and should be superior to his other\
      \ attacks. It overpowered Six-Tailed Naruto and his Tailed Beast Bomb7 Teratons,\
      \ possibly 14.9 Teratons)"
    source_ids:
    - vsbattles-nagato-pain-naruto
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'At least Sub-Relativistic (Reacted to Sage Mode Naruto, consistently kept
      up with Kakashi''s Lightning Blade strikes, and responded to a charge from Six-Tailed
      NarutoNaruto, Chapter 438: "The Seal Destroyed!!"0.028c) | At least Relativistic
      (Reacted to and kept up with Nine-Tails Chakra Mode Naruto0.14c)'
    source_ids:
    - vsbattles-nagato-pain-naruto
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class T (Comparable to Sage Mode Naruto) | At least Class T (Superior
      to the Six Paths of Pain)
    source_ids: &id002
    - mediawiki-4252
    confidence: 0.8
  striking_strength:
    text: 'Varies from City level+ (Stabbed Kakashi. Traded blows with base Naruto)
      to Country level (With two Pains left, the Preta Path hurt Sage Mode Naruto
      with a punch. As the last Pain remaining, the Deva Path pulled in and stabbed
      Fukasaku, who had sparred with Sage Mode Naruto. He then easily overpowered
      and stabbed base Naruto, who had previously traded blows with him while more
      Pains were active. The Asura Path ripped off Sage Mode Jiraiya''s armNaruto,
      Chapter 379: "Jiraiya''s Decision") | Country level (Far more powerful than
      the Six Paths of Pain. Overpowered Nine-Tails Chakra Mode Naruto in a soul tug-of-war
      and easily held down Killer B)'
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Varies from City level+ (Scales to his own striking strength, and his peak
      could somewhat withstand his own Shinra Tensei) to Country level (Took a kick
      from Sage Mode Naruto with three bodies active, though it sent him flying. Later
      survived another kick from Sage Mode Naruto while exhausted and low on chakra.
      The Human Path survived a kick from Sage Mode Jiraiya, though its eyes were
      permanently damaged, and later casually caught one of his punches. The Preta
      Path briefly held back Jiraiya's Massive Rasengan before absorbing it. Withstood
      the recoil of his own Shinra Tensei, and even the partial explosion of Six-Tailed
      Naruto's Tailed Beast Bomb) | Country level (Even while frail and emaciated,
      he easily withstood the initial impact of Version 2 Killer B's Lariat before
      absorbing it)
    source_ids:
    - vsbattles-nagato-pain-naruto
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman (Possesses vast chakra reserves as an Uzumaki and Rinnegan wielder,
