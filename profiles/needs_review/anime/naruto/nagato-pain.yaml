      have an infinite chakra supplyNaruto, Chapter 591: "Risk" that continuously
      refills. They can keep fighting indefinitelyNaruto, Chapter 662: "A True Ending"
      without succumbing to fatigue, pain, or debilitating injuries)'
    source_ids:
