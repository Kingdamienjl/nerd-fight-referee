- id: claim-weaknesses-8e9f48d5
  section: weaknesses
  axis: weakness
  text: "Nagato's real body is emaciated, crippled, and unable to walk on its own,\
    \ making him vulnerable if located. Each Path of Pain can only use its own set\
    \ of abilities, and the bodies weaken the farther they are from Nagato, as his\
    \ control range is limited. Operating individually, the bodies are far less effective,\
    \ making coordination between them crucial. The Deva Path's standard Shinra Tensei\
    \ has a roughly five-second cooldown. Ch\u014D Shinra Tensei requires a much longer\
    \ recovery time, disables all other bodies, and shortens Nagato's lifespan. Chibaku\
    \ Tensei requires massive chakra expenditure and needs Nagato to be close to the\
    \ Deva Path to transmit the signal. The Human and Naraka Paths must touch their\
    \ target, and the Preta Path cannot absorb purely physical attacks | Bound to\
    \ the will of Edo Tensei's caster. {| class=\"mw-collapsible mw-collapsed\" align=\"\
    center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left;\""
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
