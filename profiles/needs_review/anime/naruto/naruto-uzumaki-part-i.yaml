      \ In an even more feral state, he completely overpowered Haku. Kakashi momentarily\
      \ mistook him for Zabuza Momochi. Zabuza described his chakra as being bigger\
      \ than that of Kakashi, and that it filled him with dreadNaruto Chapter 2853.15\
      \ Megatons) | City Block level+ (Cracked Gaara\u2019s sand armorNaruto Chapter\
      \ 96. Drew blood from an off-guard Partial Transformation Gaara and sent him\
      \ flyingNaruto Chapter 128, later forcing him to transform into Shukaku with\
      \ 2,000 clones, however, Gaara was vulnerableNaruto Chapter 134 after being\
      \ hit with a letter bomb in his weakest spotNaruto Chapter 13392.9 Tons), up\
      \ to City level+ with Kyubi Influence. | Multi-City Block level (Stronger than\
      \ before after his training. Fought and matched Sasuke, although Sasuke was\
      \ still in recoveryNaruto Chapter 175. Somewhat matched Post-Curse Mark Ritual\
      \ Sasuke, although Sasuke was mostly toying with him and overpowering himNaruto\
      \ Chapter 219Naruto Chapter 226100 Tons), City level+ with Rasengan (One-shot\
      \ Kabuto YakushiNaruto Chapter 168), higher with Kyubi Influence (Should not\
      \ be weaker than he was against Haku, as he was at his angriest and most feral\
      \ state since that fight. Easily overpowered SasukeNaruto Chapter 229), Mountain\
      \ level with One-Tailed Kyubi Cloak (Much stronger than his Kyubi Influence\
      \ state, and overwhelmed Three Tomoe Sasuke, forcing him into using CS1, and\
      \ then CS2Naruto Chapter 231100 Megatons), Large Mountain level with Vermilion\
      \ Rasengan (Clashed evenly with CS2 Sasuke's ChidoriNaruto Chapter 2331 Gigaton)\
      \ | Multi City-Block level (Same as before. Fought and defeated Raiga), City\
      \ level+ with Rasengan (Same as before. Killed Raiga), higher with Kyubi Influence,\
      \ Mountain level with One-Tailed Kyubi Cloak, Large Mountain level with Vermilion\
      \ Rasengan"
