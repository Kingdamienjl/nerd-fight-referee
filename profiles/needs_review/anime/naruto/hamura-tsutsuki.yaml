        \ state that gives the user enhanced speed, and durability and the ability\
        \ to form Truth-Seeking Orbs., : Truth-Seeking Orbs are spheres of black,\
        \ malleable chakra that are comprised of all five fundamental nature transformations,\
        \ natural energy, and Six Paths Sage Chakra. The user can shape and manipulate\
        \ these black orbs that can delete anything they touch. They render nearly\
        \ all powers that come in contact with it completely useless. These orbs of\
        \ black chakra are highly versatile and can be used for offensive, and supplementary\
        \ purposes. The user can apply shape transformation to the balls to alter\
        \ them into various weapons, either by having the spheres pierce through holes\
        \ in their hands or by simply grabbing them. The balls can also wrap around\
        \ the user to act as a defensive shield, or be launched to serve as high-speed\
        \ projectiles. They are also capable of causing massive explosions by rapidly\
        \ expanding their size, a lethal attack that can also damage the user's own\
        \ body."
