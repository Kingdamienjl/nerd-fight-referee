- id: claim-weaknesses-d0c9fed2
  section: weaknesses
  axis: weakness
  text: "Incapable of utilizing the Six Paths Chibaku Tensei without Hagoromo. Notable\
    \ Attacks and Techniques: *: This eye technique is the Kekkei Genkai of the Hy\u016B\
    ga and \u014Ctsutsuki clans and one of the Three Great D\u014Djutsu. Wielders\
    \ of this eye can see long distances (at least up to 10 kilometers) and can see\
    \ objects that are too small for the average eye to detect (such as the tenketsu\
    \ points on a human's body). The Byakugan has an almost perfect 360-degree field\
    \ of vision, though there is a small blind spot located near the back of the user's\
    \ neck. The eye can also see through objects as well as many barriers and can\
    \ see chakra. *: Sometime before his death, Hamura had awoken the Tenseigan in\
    \ his own Byakugan. Doing this gave him several abilities, such as the ability\
    \ to manifest his own Truth-Seeking Orbs and an enhanced state called the Tenseigan\
    \ Chakra Mode. **: An enhanced chakra state that gives the user enhanced speed,\
    \ strength, and durability and the ability to form Truth-Seeking Orbs. *: Truth-Seeking\
    \ Orbs are spheres of black, malleable chakra that are comprised of all five fundamental\
    \ nature transformations, natural energy, and Six Paths Sage Chakra. The user\
    \ can shape and manipulate these black orbs that can delete anything they touch.\
    \ They render nearly all powers that come in contact with it completely useless.\
    \ These orbs of black chakra are highly versatile and can be used for offensive,\
    \ defensive, and supplementary purposes. The user can apply shape transformation\
    \ to the balls to alter them into various weapons, either by having the spheres\
    \ pierce through holes in their hands or by simply grabbing them. The balls can\
    \ also wrap around the user to act as a defensive shield, or be launched to serve\
    \ as high-speed projectiles. They are also capable of causing massive explosions\
    \ by rapidly expanding their size, a lethal attack that can also damage the user's\
    \ own body."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-06609c06
  section: abilities
  axis: hax
  text: "*\u014Ctsutsuki Physiology (\u014Ctsutsuki) **True Flight **Longevity **Self-Sustenance\
    \ (Type 1; Can breathe in space like Toneri) **Telepathy & Telekinesis *Superhuman\
    \ Physical Characteristics **Acrobatics *Chakra Manipulation **Surface Scaling\
    \ **Statistics Amplification (Can enhance his physical capabilities and speed\
    \ with chakra) **Air Manipulation, Fire Manipulation, Water Manipulation, Earth\
    \ Manipulation, Electricity Manipulation, Elemental Manipulation & Yin-Yang Manipulation\
    \ **Energy Projection, Extrasensory Perception, Mind Manipulation, Energy Absorption,\
    \ Limited / Selective Intangibility *Enhanced Senses (The Byakugan grants him\
    \ the ability to see chakra, nearly 360\xB0 vision, and the ability to see vast\
    \ distances and the chakra pathway system) **X-ray Vision with the Byakugan *Gravity\
    \ Manipulation (Can control attractive and repulsive forces to a limited extent)\
    \ *Reality Warping (Truth-Seeking Orbs are partially comprised of Yin-Yang Release,\
    \ which is capable of altering reality in a variety of ways) which allows for:\
    \ **Matter Manipulation (Molecular; The Truth Seeking Orbs are superior to Onoki's\
    \ Dust Release, which turns targets to dust on a molecular level, even before\
    \ Yin-Yang Release is applied to them) **Existence Erasure (Can erase Ninjutsu,\
    \ people, space-time, and matter) **Transmutation (Truth-Seeking Orbs can be altered\
    \ into different states of matter, energy attacks, Chakra Receivers, and more)\
    \ **Shapeshifting & Size Manipulation (The Truth-Seeking Orbs can be morphed into\
    \ a variety of shapes and sizes **Limited Telekinesis (Truth-Seeking Orbs can\
    \ be freely controlled telekinetically, up to a 70 meter radius) **Power Nullification\
    \ (Truth-Seeking Orbs negate and erase all Ninjutsu they come into contact with,\
    \ which includes energy and elemental based attacks, Edo Tensei, and Dust Release\
    \ to name a few, with the exception of those imbued with natural energy) **Possibly\
    \ Space-Time Manipulation (Potentially capable of creating new Time-Spaces, because\
    \ the regular Truth-Seeking Orbs were stated to be the same as Kaguya's Expansive\
    \ one besides their size) *Ice Manipulation, Cosmic Radiations, Illusion Creation\
    \ *Deconstruction & Existence Erasure (Users of Six Paths chakra are unaffected\
    \ by the Truth-Seeking Orbs) *Power Nullification (Users of Six Paths chakra can\
    \ bypass the nullification effects of the Truth-Seeking Orbs, and the attacks\
    \ of Six Paths chakra users can bypass the nullification effects of the Truth-Seeking\
    \ Orbs)"
  source_ids: *id003
  decisive: true
  status: unverified
