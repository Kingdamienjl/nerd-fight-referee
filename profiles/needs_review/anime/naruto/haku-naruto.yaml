    confidence: 0.8
  attack_potency:
    text: "City level+ (Kakashi and Naruto both believed that Haku had killed ZabuzaNaruto\
      \ Chapter 16 when he knocked him out, something that Kakashi\u2019s copied Great\
      \ Waterfall Jutsu was unable to achieve.Naruto Chapter 15 Kakashi admitted that\
      \ Haku was stronger than Naruto, Sasuke and even himself. Zabuza stated that\
      \ even if Kakashi defeated him, he wouldn\u2019t be able to beat Haku, also\
      \ stating that Haku\u2019s skills were superior to his own.Naruto Chapter 26\
      \ Forced a feral KN0 Naruto to evade one of his attacks.Naruto Chapter 28 As\
      \ an Edo Tensei, he harmed Sai and Omoi while they were in the sky. Clashed\
      \ with Rock Lee and Might GuyNaruto Chapter 521)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Sub-Relativistic (Zabuza claimed that even if Kakashi defeated him, he\
      \ wouldn't be able to defeat Haku, also stating that Haku's skills surpassed\
      \ his own.Naruto Chapter 26 Threw his needle fast enough to intercept Zabuza's\
      \ shuriken.Naruto Chapter 25 Despite having expended much of his chakra already,Naruto\
      \ Chapter 27 he reacted to a charge from a feral Ky\u016Bbi Influence Naruto.Naruto\
      \ Chapter 28 As a weakened Edo Tensei, he blocked the Leaf Coiling Whirlwinds\
      \ from Might Guy and Rock LeeNaruto Chapter 522 and defended himself and Zabuza\
      \ from Sai's ink birdsNaruto Chapter 5200.02c), higher movement speed with Shunshin\
      \ no Jutsu (Intercepted a Lightning Blade from KakashiNaruto Chapter 30 on two\
      \ separate occasionsNaruto Chapter 523), Speed of Light with Crystal Ice Mirrors\
      \ (Haku can move between the mirrors at the speed of light, making it impossible\
      \ for his opponents to perceive attacks from his light speed movementRin no\
      \ Sho, Page 221)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class G (Can run for a distance while carrying Zabuza and his large sword,
      is stronger than Zabuza and Kakashi)
    source_ids: *id002
