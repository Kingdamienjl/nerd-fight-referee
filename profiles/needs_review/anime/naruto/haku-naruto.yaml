      \ Hurricane Whirlwinds from Might Guy and Rock LeeNaruto Chapter 522), higher\
      \ with Ice Rock Dome of Magnificent Nothingness (Withstood an attack from Sai\u2019\
      s ink birds.Naruto Chapter 520)"
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Part I Sasuke implied Haku had incredible stamina), Infinite
      as an Edo Tensei (Edo Tensei have an infinite chakra supplyNaruto Chapter 591,
      that is to say their chakra reserves will refill indefinitely and continuously,
      meaning that they can keep fightingNaruto Chapter 662 without fail or succumbing
      to physical limitations like fatigue, pain, or debilitating injuries)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range normally, Extended Melee Range standard ninja tools
      such as kunai, shuriken, swords and senbons, Several Meters with Thousand Flying
      Water Neddles of Death, Tens of Meters with Certain-Kill Ice Spears, Hundreds
      of Meters with Crystal Ice Mirrors
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted in general, Genius combatant (A prodigy whom despite his young age
      was raised by Zabuza to be capable of taking down even Jonin's, thus he also
      has a decent amount of experience in assassination and espionage. He's a formidable
      foe against the likes of Sasuke. Haku was also very keen-minded, as he had been
      shown to have great observational and analytical abilities, capable of quickly
      determining a way around an opponent's technique or strategy. He has good knowledge
      of human anatomy and acupuncture, thanks to Zabuza's former Anbu training. He
      also had the proficiency to perform hand seals with only one hand, a skill that
      amazed even Kakashi, he's even capable of preventing multiple summoning scroll
      in the process and sent his dogs to poof through sheer speed and tactic. Haku
      also has knowledge of some animals. Haku also knew a lot about herbalism, as
      he often collected plants to use for medical purposes such as likely for surgery
      use.)
    source_ids: *id002
