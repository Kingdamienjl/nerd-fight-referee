    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Longevity (As an Uzumaki, he possesses
        an incredible life-force, granting him a longer lifespan than normal humans),
        Regeneration (High-Low normally; As he has Hashirama''s cells. Low-Mid with
        Kurama''s chakra; Regenerated in an instant after Sasuke pierced through his
        chest and right lung), Immortality (Type 3), Absorption (Can absorb techniques
        with his artificial limb), Self-Sustenance (Type 1; Can breathe in space),
        Master Martial Artist & Weapon Mastery, Acrobatics (Hypermobility & Self-Momentum),
        Explosion Manipulation (With Explosive Tags), Chakra Manipulation, Elemental
        Manipulation (Air Manipulation, Fire Manipulation, Water Manipulation, Earth
        Manipulation and Electricity Manipulation), Homing Attack, Limited Durability
        Negation & Limited Power Nullification(The Wind Style: Rasenshuriken does
        damage by specifically attacking and damaging the cells of his targets. Additionally,
        it''s capable of destroying the chakra circulation paths that allow users
        to use their chakra), Statistics Amplification (Shinobi are capable of enhancing
        their physical capabilities with the use of chakra. The Bodyflicker Jutsu
        allows Shinobi to greatly enhance their speed by focusing chakra in their
        feet), Surface Scaling (Water Walking; By focusing chakra at the soles of
        their feet, Shinobi can scale and cling to vertical surfaces, and even walk
        on water), Afterimage Creation, Stealth Mastery & Speed Enhancement (The Substitution
        Jutsu allows its user to replace themselves with a nearby object such as a
        tree log, plant, person, or clone at the exact moment they are attacked. The
        Jutsu works even if the user is physically restrained or observed by characters
        as observant as Sharingan or Sage Mode users. This creates the optical illusion
        of the user being hit, which confuses the opponent and gives them an opening
        to flee or counterattack), Minor Illusion Creation & Duplication (With the
        Clone Jutsu, Can create shadow clones who can use his techniques, act as decoys
        and distractions, shields to protect him from harm and damage, improve his
        maneuverability, relay their knowledge and experiences to him, among other
        things), Shapeshifting (With the Transformation Jutsu, Shinobi can themselves
        into other people, animals, plants, and even inanimate objects, such as weapons),
        Paralysis Inducement (With the Paralysis Jutsu, Shinobi can completely paralyze
        their targets from close to mid range), Energy Projection (With his Rasengan
        variants), Summoning (Can summon toads of varying sizes, some of which can
        crush and flatten targets from above, spew oil from their mouths to restrict
        the movements of targets, levitate, skillfully wield weapons, manipulate water,
        and utilize illusions, among other things), Telepathy (Can read the minds
        of targets by making contact with them and connecting his chakra to them),
        Multiple Selves (All Types), Accelerated Development, Dimensional Storage,
