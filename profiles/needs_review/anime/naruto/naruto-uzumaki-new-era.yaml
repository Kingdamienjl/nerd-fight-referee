        Absorption (Energy; Can absorb natural energy from his surroundings), Limited
        Petrification & Transmutation (Opponents who absorb excess amounts of natural
        energy from him without the ability to properly balance it will subsequently
        be turned to stone and into a frog), Enhanced Senses & Extrasensory Perception
        (Can sense attacks without directly seeing them, allowing him to dodge appropriately
