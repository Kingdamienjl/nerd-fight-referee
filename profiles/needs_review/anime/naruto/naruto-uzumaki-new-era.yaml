- id: claim-intelligence-1d1515e9
  section: power_scale
  axis: battle_iq
  text: "Genius, Extraordinary Genius with Chakra understanding and manipulation in\
    \ Six Paths Sage Mode Naruto acts headstrong and often acts without thinking,\
    \ however, Naruto's years as a prankster gave him a cunning imagination that is\
    \ useful in battle. He is a remarkable tactile learner, able to learn better through\
    \ executing a task rather than theorizing about it. Once they see him in action,\
    \ even the likes of the Second Hokage revised their thoughts about his intellect.\
    \ Naruto can formulate multi-step plans and even backups to those plans in the\
    \ thick of battle. Naruto's strategies typically involve shadow clones: he may\
    \ direct his opponent's attention towards one of his clones to disguise his movements;\
    \ he may transform them into objects or other individuals for surprise attacks;\
    \ he may make himself seem predictable by creating a pattern, to throw them off\
    \ by breaking it. He is rather observant, noticing details others may overlook\
    \ and subsequently taking advantage of it. Even when given new information, he\
    \ can act quickly. When not in combat, he is generally average in intellect but\
    \ can be pretty stupid sometimes. This is usually used as a comedic effect, making\
    \ Naruto the butt of many jokes inside and outside the show. Naruto, after gaining\
    \ Six Paths Sage Mode, is granted unrivaled knowledge of all life in this world\
    \ and the energies that power them.Jin no Sho, Page 310 By using this knowledge,\
    \ and his mastery over Yin-Yang Style, the foundational abilities for all Jutsu\
    \ in the world.Jin no Sho, Page 226 Naruto can perform truly miraculous feats\
    \ of intelligence and manipulation. He stopped the fading life of Might Guy after\
    \ he utilized the 8th Gate,Naruto, Chapter 673: \"WE Will...!!\" which slowly\
    \ heats the body until it incinerates into ash, by restoring his chakra nodes\
    \ before they were destroyed. He also re-created the eye of Kakashi Hatake after\
    \ it was ripped out by Madara Uchiha by utilizing cells from Kakashi's body and\
    \ reconstructing them into an entirely separate biological function.Naruto, Chapter\
    \ 675: \"Your Current Dream\" Compounding onto this, Naruto is equipped with the\
    \ ability to create Truth Seeking Orbs, structures which are noted to grant users\
    \ truth in all thingsJin no Sho, Page 249 and utilize all five nature transformations,\
    \ alongside Yin-Yang Style.Naruto, Chapter 689: \"I Love You Guys\" A feat that\
    \ hasn't been achieved since the days of Hagoromo_\u014Ctsutsuki (Manga) and Hamura\
    \ \u014Ctsutsuki, with even consummate geniuses like Minato Namikaze and Itachi\
    \ Uchiha being incapable of mastering all seven transformations.Naruto, Chapter\
    \ 321: \"Honey-Tongued...!!\"Jin no Sho, Page 290Naruto, Chapter 617: \"Those\
    \ Who Dance in the Shadows, Part 2"
