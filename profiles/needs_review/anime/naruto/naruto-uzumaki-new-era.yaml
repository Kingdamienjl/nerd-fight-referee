        sense incoming danger and dodge accordingly), Mind Manipulation/Mind-Based
        BFR & Non-Combat Applicable Spatial Manipulation(With Ma and Pa), Limited
        Durability Negation (Can ignore the outer defense of targets and accurately
        perform internal damage by sending chakra waves into them with Frog Strike),
        Clairvoyance (Sensed and gained information about the events of the Fourth
