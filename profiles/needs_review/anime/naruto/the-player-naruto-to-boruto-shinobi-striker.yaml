    - field: powers_and_abilities
      value: "By himself: Superhuman Physical Characteristics, Martial Arts, Chi Manipulation,\
        \ Statistics Amplification (Shinobi are capable of enhancing their physical\
        \ capabilities via the use of chakra. The Shunshin no Jutsu allows Shinobi\
        \ to greatly enhance their speed by focusing chakra in their feet), Surface\
        \ Scaling and Water Walking (By focusing chakra at the soles of their feet,\
        \ Shinobi can scale and cling to vertical surfaces, and even walk on water),\
        \ Energy Projection, Afterimage Creation, Stealth Mastery, and Speed Enhancement\
        \ (The Substitution Jutsu allows its user to instantly replace themselves\
        \ via a nearby object such as a tree log, plant, person, or clone at the exact\
        \ moment they are attacked. The Jutsu works even if the user is physically\
        \ restrained or observed by characters as observant as Sharingan or Sage Mode\
        \ users. This creates the optical illusion of the user being hit, which confuses\
        \ the opponent and gives them an opening to flee or counterattack), Regeneration\
        \ (Low), Weapon Mastery (Versed in the use of various kunai, swords and shuriken),\
        \ Acrobatics, Minor Illusion Creation and Duplication (via the Clone Technique,\
        \ The Player, just like Naruto, can create solid \"shadow clones\" that are\
        \ identical to him and can use his abilities as well as relay any information\
        \ they gained back to the original upon being dispersed), Shapeshifting (via\
        \ the Transformation Technique, Shinobi can transform themselves into other\
        \ people, animals, plants, and even inanimate objects, such as weapons), Paralysis\
        \ Inducement (via the Temporary Paralysis Technique and Paralysis Kunai, Shinobi\
        \ can completely paralyze their targets from close to mid range), Genjutsu\
        \ Nullification (Shinobi can typically break free from and nullify non-ocular\
        \ genjutsu by intentionally disrupting the flow of chakra viain their bodies),\
        \ Homing Attack (Can lock on their targets, various Ranged Jutsu home on their\
        \ target), Lightning Manipulation and Paralysis Inducement (via Lightning\
        \ Style Techniques), Wood Manipulation, Forcefield Creation via Wood Release,\
        \ Water Manipulation (via Water Release), Animal Manipulation (via Bird Clone\
        \ Jutsu), Statistics Amplification via scrolls (Depending on the scroll, The\
        \ Player can have increased damage, speed, chakra recharge, and even health),\
        \ Thread Manipulation (Can use threads to pull himself to far surfaces), Power\
        \ Mimicry (Can learn and master all forms of ninjutsu, genjutsu, taijutsu\
        \ and even D\u014Djutsu from their masters), Status Effect Inducement, Statistics\
        \ Reduction and Limited Power Nullification (Various jutsu can lower the target's\
        \ strength, speed, defense and even reset the ninjutsu cooldown, or just paralise\
        \ them all together, preventing the opponent from using their ninjutsu), Homing\
        \ Attack (Once locked on, any attacks will track the opponents even if they\
        \ are moving away), Via summons: Summoning (Can summon toads, salamanders,\
        \ slugs, C2 Dragons and snakes of varying sizes, some of which can crush and\
        \ flatten targets from above, spew oil from their mouths to restrict the movements\
        \ of targets, levitate, skillfully wield weapons, manipulate water, Poison\
        \ Manipulation, Status Effect Inducement, Statistics Reduction, Power Nullification,\
        \ Healing and Explosion Manipulation), Base Game: All previous abilities from\
        \ Base, Teleportation (via Teleportation Jutsu), Air Manipulation (via Leaf\
        \ Whirlwind), Statistics Amplification, Body Control, Healing and Invulnerability\
        \ (via Eight Inner Gates, Seven Heavenly Breaths and Lightning Style Chakra\
        \ Mode, gets an boost in attack power, speed, tracking range, and invulnerable\
        \ to all attacks, except Secret Techniques, for a short period), Electricity\
        \ Manipulation and Paralysis Inducement (via Lightning Style: Lariat and Lightning\
        \ Blade), Wind Manipulation, Limited Durability Negation and Limited Power\
        \ Nullification (via Sage Art: Wind Style Rasen Shuriken, as it damages targets\
        \ on a cellular level by specifically attacking and damaging the cells of\
        \ his targets and is capable of destroying the chakra circulation paths that\
        \ allow users to use their chakra), Has access to all 2 Tomoe Sharingan, 3\
        \ Tomoe Sharingan, Izanami & Izanagi, Mangeky\u014D Sharingan, Has access\
        \ to all of Kakashi's Mangeky\u014D Sharingan Abilities, Can use all Deva\
        \ Path Abilities like Limited Levitation (The Deva Path allows the user to\
        \ levitate), Gravity Manipulation, Telekinesis, and Sealing (The Deva Path\
        \ allows the user to control attractive and repulsive forces, in a very similar\
        \ fashion to electromagnetic attraction and repulsion. Shinra Tensei allows\
