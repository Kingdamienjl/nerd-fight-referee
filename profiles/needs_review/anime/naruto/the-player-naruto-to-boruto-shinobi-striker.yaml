        \ Sharingan and Mangeky\u014D Sharingan weaknesses. Kamui can't perform physical\
        \ attacks or teleport while this ability is active, and must deactivate it\
        \ to do so. The user's ability to teleport objects to the Kamui dimension\
        \ is faster than their ability to transport themselves. Additionally, this\
        \ ability can only be used continuously for 5 minutes, after which there is\
        \ a short recharge period. Kotoamatsukami can only be used once each ten years,\
        \ per eye, unless the user possesses Hashirama Senju's cells. Opening Gates\
        \ leaves his body physically exhausted depending on the number, with opening\
