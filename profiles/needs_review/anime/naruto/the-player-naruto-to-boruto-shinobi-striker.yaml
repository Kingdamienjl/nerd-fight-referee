- id: claim-weaknesses-9f1587d2
  section: weaknesses
  axis: weakness
  text: "All of his transformations only last for at most 1 minute, with some of his\
    \ transformations instantly running out by using his strongest technique. Sharingan\
    \ and Mangeky\u014D Sharingan weaknesses. Kamui can't perform physical attacks\
    \ or teleport while this ability is active, and must deactivate it to do so. The\
    \ user's ability to teleport objects to the Kamui dimension is faster than their\
    \ ability to transport themselves. Additionally, this ability can only be used\
    \ continuously for 5 minutes, after which there is a short recharge period. Kotoamatsukami\
    \ can only be used once each ten years, per eye, unless the user possesses Hashirama\
    \ Senju's cells. Opening Gates leaves his body physically exhausted depending\
    \ on the number, with opening the Eighth Gate leading him to death. Deva Realm\
    \ has a 5-second window between repels. Shinra Tensei drains Deva Realm, and Chou\
    \ Shinra Tensei temporarily disables all of his bodies, the energy required taking\
    \ off a portion of the user's lifespan. Chibaku Tensei uses up a lot of chakras."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5a2d2c87
  section: abilities
  axis: hax
  text: "*By himself: Superhuman Physical Characteristics, Martial Arts, Chi Manipulation,\
    \ Statistics Amplification (Shinobi are capable of enhancing their physical capabilities\
    \ via the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance\
    \ their speed by focusing chakra in their feet), Surface Scaling and Water Walking\
    \ (By focusing chakra at the soles of their feet, Shinobi can scale and cling\
    \ to vertical surfaces, and even walk on water), Energy Projection, Afterimage\
    \ Creation, Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows\
    \ its user to instantly replace themselves via a nearby object such as a tree\
    \ log, plant, person, or clone at the exact moment they are attacked. The Jutsu\
    \ works even if the user is physically restrained or observed by characters as\
    \ observant as Sharingan or Sage Mode users. This creates the optical illusion\
    \ of the user being hit, which confuses the opponent and gives them an opening\
    \ to flee or counterattack), Regeneration (Low), Weapon Mastery (Versed in the\
    \ use of various kunai, swords and shuriken), Acrobatics, Minor Illusion Creation\
    \ and Duplication (via the Clone Technique, The Player, just like Naruto, can\
    \ create solid \"shadow clones\" that are identical to him and can use his abilities\
    \ as well as relay any information they gained back to the original upon being\
    \ dispersed), Shapeshifting (via the Transformation Technique, Shinobi can transform\
    \ themselves into other people, animals, plants, and even inanimate objects, such\
    \ as weapons), Paralysis Inducement (via the Temporary Paralysis Technique and\
    \ Paralysis Kunai, Shinobi can completely paralyze their targets from close to\
    \ mid range), Genjutsu Nullification (Shinobi can typically break free from and\
    \ nullify non-ocular genjutsu by intentionally disrupting the flow of chakra viain\
    \ their bodies), Homing Attack (Can lock on their targets, various Ranged Jutsu\
    \ home on their target), Lightning Manipulation and Paralysis Inducement (via\
    \ Lightning Style Techniques), Wood Manipulation, Forcefield Creation via Wood\
    \ Release, Water Manipulation (via Water Release), Animal Manipulation (via Bird\
    \ Clone Jutsu), Statistics Amplification via scrolls (Depending on the scroll,\
    \ The Player can have increased damage, speed, chakra recharge, and even health),\
    \ Thread Manipulation (Can use threads to pull himself to far surfaces), Power\
    \ Mimicry (Can learn and master all forms of ninjutsu, genjutsu, taijutsu and\
    \ even D\u014Djutsu from their masters), Status Effect Inducement, Statistics\
    \ Reduction and Limited Power Nullification (Various jutsu can lower the target's\
    \ strength, speed, defense and even reset the ninjutsu cooldown, or just paralise\
    \ them all together, preventing the opponent from using their ninjutsu), Homing\
    \ Attack (Once locked on, any attacks will track the opponents even if they are\
    \ moving away) *Via summons: Summoning (Can summon toads, salamanders, slugs,\
    \ C2 Dragons and snakes of varying sizes, some of which can crush and flatten\
    \ targets from above, spew oil from their mouths to restrict the movements of\
    \ targets, levitate, skillfully wield weapons, manipulate water, Poison Manipulation,\
