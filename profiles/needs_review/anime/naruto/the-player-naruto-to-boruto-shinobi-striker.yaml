        \ via a nearby object such as a tree log, plant, person, or clone at the exact\
        \ moment they are attacked. The Jutsu works even if the user is physically\
        \ restrained or observed by characters as observant as Sharingan or Sage Mode\
        \ users. This creates the optical illusion of the user being hit, which confuses\
        \ the opponent and gives them an opening to flee or counterattack), Regeneration\
        \ (Low), Weapon Mastery (Versed in the use of various kunai, swords and shuriken),\
        \ Acrobatics, Minor Illusion Creation and Duplication (via the Clone Technique,\
