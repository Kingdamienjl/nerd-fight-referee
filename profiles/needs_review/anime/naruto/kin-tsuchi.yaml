    - field: weaknesses
      value: Goku can be weakened and put into intense pain if his tail is grabbed
        or removed, though he gets over this after the Red Ribbon Saga. At first,
        he cannot fly without the Kintoun, but he learns how to fly before the 23rd
        World Tournament. He needs a moon in order to transform and as an Ozaru, he
        becomes an animalistic berserker with no control over himself. Saiyans require
        a higher metabolism, they perform worse in battle and become fatigued., Goku
        seeks strong opponents and therefore will sometimes allow his opponents to
        reach their full power for the sake of a good fight. Kaioken strains his body,
        causing him intense pain and exhaustion if he overuses it. He can drop his
        guard and leaves openings for his opponents whenever he gets distracted, lowering
        his durability. His Genki-dama requires a long charge-up period, during which
        time he is vulnerable. He cannot survive in the vacuum of space and needs
        to locate a ki signature to teleport using Instant Transmission. Super Saiyan
        3 drains his ki rapidly and will exhaust him within only a few minutes.
      source_id: character-stats-profiles-kin-tsuchi-anime
