    \ the hatred or pain, the more powerful the Sharingan becomesNaruto Chapter 619),\
    \ Minor Light Manipulation (The Sharingan shines in the darkNaruto Chapter 301),\
    \ Illusion Nullification (Sharingan users can break free ofNaruto Chapter 141\
    \ andBoruto Chapter 3 nullifyNaruto Chapter 478 genjutsuSasuke Shinden, Chapter\
    \ 3Sasuke Shinden, Chapter 4), Resistance to Illusion Creation, Perception Manipulation,\
    \ and Mind Manipulation (The Sharingan allows its user to discern the mechanicsRin\
