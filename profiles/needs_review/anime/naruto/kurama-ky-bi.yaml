  section: weaknesses
  axis: weakness
  text: "Kurama used to be constantly angry and easily provoked, though this faded\
    \ after he was sealed inside Naruto. He is vulnerable to sufficiently high-level\
    \ mind control and sealing techniques. While sealed inside a jinch\u016Briki,\
    \ he dies if his host dies. Like all Tailed Beasts, he cannot properly focus his\
    \ power without a jinch\u016Briki's help, and otherwise lashes it out at random.\
    \ Baryon Mode consumes chakra at an extreme rate, and using it ultimately cost\
    \ Kurama his life. {| class=\"mw-collapsible mw-collapsed\" border=\"1\" cellpadding=\"\
