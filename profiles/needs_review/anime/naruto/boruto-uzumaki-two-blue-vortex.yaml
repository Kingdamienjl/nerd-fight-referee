- id: claim-weaknesses-006fe662
  section: weaknesses
  axis: weakness
  text: "Boruto is still unable to properly control his K\u0101ma.Boruto: Two Blue\
    \ Vortex Chapter 9 To utilize the Uzuhiko, Boruto needs to be grounded so that\
    \ he can take chakra from the Earth through his feet. To use the Flying Raijin\
    \ Jutsu, Boruto needs to use metal objects. It takes him at least one minute or\
    \ more to infuse chakra into an object for Flying Raijin Jutsu. The further away\
    \ the object, the harder it is for Boruto to teleport to. If the objects have\
    \ similar shapes he's unable to discern them, which is why he prepared different\
    \ metal objects with distinct shapes to act as unique symbols that he could visualize\
    \ in order to accurately teleport to his intended coordinates even over great\
    \ distances.Boruto: Two Blue Vortex Chapter 16Boruto: Two Blue Vortex: Volume\
