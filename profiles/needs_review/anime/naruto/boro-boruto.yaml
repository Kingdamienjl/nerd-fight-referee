- id: claim-powers-and-abilities-0eb9569b
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Social Influencing (Using his charisma\
    \ and way of speaking, Boro manipulates several people and makes them see him\
    \ as a \"savior\", turning them into blind followers of his cult and worshipers\
    \ of the \u014Ctsutsuki), Martial Arts, Acrobatics, Stealth Mastery, Weapon Mastery\
    \ (Proficiency in shurikenjutsu), Chakra Manipulation, Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of\
    \ chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed\
    \ by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto\
    \ Chapter 71), Surface Scaling and Water Walking (By focusing chakra at the soles\
    \ of their feet, Shinobi can scale and cling to vertical surfaces, and even walk\
    \ on waterNaruto Chapter 18Naruto Chapter 90), Minor Illusion Creation and Duplication\
    \ (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary\
    \ duplicates of themselves that have no physical substance), Shapeshifting (With\
    \ the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform themselves\
    \ into other people, animals, plants, and even inanimate objects, such as weapons),\
    \ Paralysis Inducement (With the Temporary Paralysis TechniqueRin no Sho, Page\
    \ 176, Shinobi can completely paralyze their targets from close to mid range),\
    \ Cyborgization (Partial; Like with all other members of Kara, Boro's body had\
    \ been modified with Scientific Ninja Tools by Amado), Illusion Creation (Can\
    \ create illusory images of himself to communicate over a long distance with Genjutsu\
    \ Communication), Technology Manipulation (Due to the modifications, he is able\
    \ to release a fast-acting virus that is carried by his dark mist, and also gunpowder\
    \ through disks that are in his body), Regeneration (High-Mid; Boro can regenerate\
    \ from a special core inside his body; he has regenerated from having his head,\
    \ his upper body and lower body completely obliterated. The core can be moved\
    \ around the body via hand seals, lowering the chances of its destruction), Immortality\
    \ (Type 3 and 8; [He will regenerate from any damage as long as his core is intact]),\
    \ Mist Manipulation (He can also produce a dark mist), Disease Manipulation and\
    \ Paralysis Inducement (His mist is laced with a virus that infects whoever comes\
    \ into contact with it, sapping their strength and gradually rendering them paralysed.\
    \ The virus has also been shown to cause fever and pain when breathing in people\
    \ who have been infected for a considerable time), Breath Attack (Can expel fire,\
    \ water and acid from his mouth), Fire Manipulation, Earth Manipulation, Water\
    \ Manipulation, Acid Manipulation (Can create a potent acid able to easily melt\
    \ shuriken), Explosion Manipulation (Can mix gunpowder with his mist, to instantly\
    \ detonate with the slightest spark), Large Size (Type 1 in Mutated Form) Immense\
    \ Pain Tolerance (Doesn't seem to be affected by the pain of a hole in his stomach\
    \ made by Boruto's rasengan. Showed no reaction to being hit and having his body\
    \ destroyed by Kawaki multiple times. Laughed at having his arm poisoned and sneered\
    \ at having his shoulder destroyed by a rasengan), Disease Manipulation (The mist\
    \ he creates is laced with a virus that he is immune to) and Poison Manipulation\
    \ (Can neutralize Mitsuki's poison inside his body, with its regeneration), his\
    \ dark mist has Resistance to Air Manipulation (His dark mist is unaffected by\
    \ Mitsuki's Wind Release techniques)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
