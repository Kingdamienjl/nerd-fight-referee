  section: power_scale
  axis: stamina
  text: "Superhuman (Hagoromo was blessed with extremely powerful and large chakra\
    \ reserves from birth, which he'd inherited directly from his mother, Kaguya \u014C\
    tsutsuki.Naruto Chapter 681Jin no Sho, Page 216Jin no Sho, Page 217 His chakra\
