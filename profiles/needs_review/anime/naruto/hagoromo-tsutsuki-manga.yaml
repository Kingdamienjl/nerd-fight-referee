    \ Particles, which healed him of his ailment. Afterwards, he hid what remained\
    \ of the particles in two separate locations, and left clues for how to find them\
    \ should the need arise to cure someone of the same illness in the future.Naruto:\
    \ Sasuke's Story - The Uchiha and the Heavenly Stardust: The Manga, Chapter 3\
