    \ endure being impaled by Kurama long enough for Minato seal the beast and her\
    \ chakra inside Naruto.Naruto Chapter 503Naruto Chapter 504 Given the fact that\
    \ he possesses both the powers and chakra of the likes of Hashirama Senju and\
