        \ in his own right.Naruto Chapter 696 Those endowed with even a portion of\
        \ his abilities are blessed with an unbelievable aptitude for Ninjutsu, being\
        \ able to master any technique they are taught due to their inherent mastery\
        \ of all five Nature Transformations.Naruto Chapter 375 This is to be expected,\
        \ as Hagoromo is the famed inventor of all forms of Ninjutsu known in the\
        \ modern world, and is credited with being the father of all Shinobi.Jin no\
        \ Sho, Page 226Sha no Sho, Page 182Sha no Sho, Page 156Sha no Sho, Page 313Naruto\
        \ Chapter 373Naruto Chapter 425Jin no Sho, Page 70 Additionally, he also inventedNaruto\
        \ Chapter 594 several Ninja Tools that are famed for their unique and complex\
        \ abilities, even a millennia later.Naruto Chapter 527 He also proved himself\
        \ to be an extremely competent combatant, which was alluded to through his\
        \ battle against the Ten Tails. Even against a stronger opponent, Hagoromo\
        \ was able to come out on top in the end, eventually managing to seal the\
        \ beast away.Naruto Chapter 681Jin no Sho, Page 217 He is also profoundly\
        \ experienced, having lived for thousands of years. He has gained a great\
        \ deal of experience from travelling all over the world in order to preach\
        \ his Ninsh\u016B creed.Jin no Sho, Page 218 Additionally, he has been watching\
        \ over the world for the last 1000 years since his death,Jin no Sho, Page\
        \ 70 which allowed him to observe and interact with many cultures over a number\
        \ of time periods. He also showcased his general intelligence when he performed\
        \ extensive research in order to figure out how to undo his mother's Infinite\
        \ Tsukuyomi, in which he succeeded.Naruto Chapter 692 Another instance in\
        \ which he showed great intellect was during his initial visit to the Land\
        \ of Redaku. After contracting the chakra illness, he stumbled upon a meteor\
        \ that contained a substance called the Ultra/Polar Particles, which healed\
        \ him of his ailment. Afterwards, he hid what remained of the particles in\
        \ two separate locations, and left clues for how to find them should the need\
        \ arise to cure someone of the same illness in the future.Naruto: Sasuke's\
        \ Story - The Uchiha and the Heavenly Stardust: The Manga, Chapter 3 These\
        \ clues came in the form of a series of riddles. These riddles showcased his\
        \ profound knowledge of Astronomy. He subtly hid the locations of the particles\
