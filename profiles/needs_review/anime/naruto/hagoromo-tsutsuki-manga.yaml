    riki,Naruto Chapter 642Naruto Chapter 671 Hagoromo should logically be able to\
    \ replicate Madara and Hashirama's feat of fighting for a full day.Naruto Chapter\
    \ 624 Furthermore, Hagoromo is still held in a myhtical regard in Kumogakure,\
    \ to the point where the usage of his tools is considered an extremely difficult\
    \ feat to achieve for anyone,Naruto Chapter 527 so it's likely that he should\
    \ also be capable of replicating feats on the Third Raikage's level. Moreover,\
    \ the Third Raikage was able to fight Gy\u016Bki to the point where both of them\
    \ collapsed from exhaustion,Naruto Chapter 555 and Hagoromo's also far beyond\
    \ the likes of Gy\u016Bki. As a result, it stands to reason that he would be capable\
    \ of replicating the Third Raikage's feat of fighting for three days and three\
    \ nights.Naruto Chapter 553 Finally, he should also be comparable to Naruto and\
    \ Sasuke, who were able to fight each other for many hours, even after exhausting\
    \ most of their chakra beforehandNaruto Chapter 697) Ten-Tails Jinch\u016Briki=Superhuman\
    \ (With the Ten-Tails's chakra under his disposal, Hagoromo had access to the\
    \ beasts nearly unlimited chakra reserves in addition to his own. The Ten-Tails's\
