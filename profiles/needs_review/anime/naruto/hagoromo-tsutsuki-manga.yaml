- id: claim-powers-and-abilities-62bdd9dc
  section: abilities
  axis: hax
  text: "interrogation and restoration, by summoning and making use of the King of\
    \ Hell's abilities. The Naraka Path can also be used as a form of F\u016Binjutsu,\
    \ allowing its user to seal the bodies and souls of others inside the King of\
    \ Hell to be summoned back at the user's discretion. The King of Hell can also\
    \ be used to return the souls of those who have died at the user's hands to the\
    \ world of the living, and back into their physical bodies. **To interrogate,\
    \ the Naraka Path need only catch hold of a person, causing the King of Hell to\
    \ appear before them. With the victim completely paralyzed, the Naraka Path begins\
    \ questioning them. If the victim answers the user's question truthfully, they\
    \ may be spared. However, if they lie, the King of Hell kills them on the spot.\
    \ The King of Hell gives the user the power over life and death, and can ultimately\
    \ decide their victim's fate. Meaning that they may still choose to kill their\
    \ target, anyway, even if they answered truthfully. NarakaPath1.jpeg NarakaPath2.jpeg\
    \ NarakaPath3.jpeg NarakaPath4.jpeg **The second ability the Naraka Path possessed\
    \ is the ability to repair any damage. To do so, the Naraka Path has the King\
    \ of Hell ingest the damaged body with its tendril-like arms into its mouth. Then,\
    \ after a short time, the destroyed body will emerge from its mouth, completely\
    \ rejuvenated and repaired. centre|thumb|350x350px|The Naraka Path's healing ability\
    \ *: The Deva Path grants its user the ability to control gravity, in the form\
    \ of attractive and repulsive forces. Despite their incredible power, these gravity\
    \ manipulating techniques cannot be performed in rapid succession; the amount\
    \ of time required to recharge after use varies depending on the scale of the\
    \ technique used, five seconds being the basic minimum. ** : A technique that\
    \ manipulates attractive force to pull matter towards the user at will. It has\
    \ the same five-second limit as the Shinra Tensei. It is possible to attract multiple\
    \ targets at once, causing them to collide with each other. This technique is\
    \ extremely versatile, and can be used to attract opponents into one's attacks,\
    \ making it very difficult to avoid getting hit with them. center|thumb|388x388px|Bansh\u014D\
    \ Ten'in **: Is the Deva Path's ability to manipulate repulsive force at the user's\
    \ will to push matter or techniques away. This technique essentially makes its\
    \ user impervious to most physical attacks or Ninjutsu, because they can simply\
    \ push them all away. When used against Ninjutsu, this technique simply causes\
    \ the incoming Jutsu to dissipate. Shinra Tensei's power and range can also be\
    \ adjusted by the user, and can greatly vary between pushing someone away and\
    \ reducing an entire village to rubble and ash. Hagoromo famously used this technique\
    \ to hurl the moon into orbit. He also used it to place the meteor containing\
    \ half of the Polar Particles into a permanent orbit around the planet. center|thumb|388x388px|Shinra\
    \ Tensei **: Using this technique, the user Creates a gravity core in the form\
    \ of a black sphere. That core then proceeds to use its immense gravitational\
    \ pull to attract any nearby landmasses, people, and objects to its center. The\
    \ attracted matter then begins to pile up around the core until it forms a spherical\
    \ planetoid, trapping anyone caught in it inside. The technique's size can vary\
    \ greatly depending on how much chakra the user invests into the technique. The\
    \ sphere can also be enlarged after the technique's already been used, making\
    \ it easy to adjust its power level depending on the target's strength. The user\
    \ is capable of creating numerous cores simultaneously, making it possible to\
    \ trap several targets at once or simply use the formed rock formations as a meteor\
    \ shower to attack opponents on the ground. It is also possible to transform a\
    \ target into the gravitational core itself, which makes it extremely difficult\
    \ to escape. ChibakuTensei11.png|Chibaku Tensei's first appearance ChibakuTensei2.png|Madara's\
    \ \"rain drops\" Chibaku Tensei.gif|Chibaku Tensei **: Six Paths \u2014 Chibaku\
    \ Tensei is a supremely powerful F\u016Binjutsu (Sealing Technique) that has the\
    \ power to seal the likes of Ten Tails and Kaguya \u014Ctsutsuki. The technique\
    \ is, in essence, an extremely empowered version of the standard Chibaku Tensei.\
    \ The main difference lies in that instead of creating an orb that functions as\
    \ the gravitational core, the user transforms their target into the gravitational\
    \ core. The target is subsequently buried under a barrage of endless rubble until\
    \ a moon-sized satellite is formed, trapping the target inside. The target is\
    \ also subjected to the technique's sealing power, which shuts off all of their\
    \ power and abilities, making them helpless and unable to escape by any means.\
    \ This technique is activated when two people who possess the Sun and Moon seals\
    \ respectively make physical contact with their intended target. This technique\
    \ was originally used by Hagoromo and Hamura to seal their mother, who had transformed\
    \ into the Ten Tails. During the ev"
