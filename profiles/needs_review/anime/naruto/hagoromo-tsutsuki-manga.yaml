      \ Chapter 527Naruto Chapter 528Naruto Chapter 536 The Sacred Tools are so draining\
      \ that they've been said to be fatal to most people, due to their extreme drain\
      \ on one's chakra reserves.Naruto Chapter 527 His powerful life-force was inherited\
      \ by his direct descendants, such as the Senju and Uzumaki clans respectively,\
      \ which blessed them with extremely strong strong life-force and vitality,Naruto\
      \ Chapter 579 which allowed them to survive grievous injuries and simply fight\
      \ through them.Naruto Chapter 663 This could be observed with Nagato, who's\
      \ admittedly nowhere near Hagoromo's level.Naruto Chapter 439 He was able to\
      \ survive and continue fighting through severe injuries and debilitating pain,Naruto\
      \ Chapter 447 and even managed to summon the Gedo Statue and make use of its\
      \ abilities, which requires a tremendous amount of chakra due to the statue\
      \ draining its user's life-force.Jin no Sho, Page 247 This could also be observed\
      \ through Kushina, who had recently had her Tailed Beast extracted, which is\
      \ a guaranteed death sentence.Naruto Chapter 261 Even so, she was able to survive\
      \ for an extended period of time, restrain Kurama with her Adamantine Sealing\
      \ Chains, erect a Kurama-level barrier, and endure being impaled by Kurama long\
      \ enough for Minato seal the beast and her chakra inside Naruto.Naruto Chapter\
      \ 503Naruto Chapter 504 Given the fact that he possesses both the powers and\
      \ chakra of the likes of Hashirama Senju and Madara Uchiha,Naruto Chapter 671Naruto\
      \ Chapter 686 and that the likes of Obito and Madara only started to reach his\
      \ level upon becoming Ten-Tails Jinch\u016Briki,Naruto Chapter 642Naruto Chapter\
      \ 671 Hagoromo should logically be able to replicate Madara and Hashirama's\
      \ feat of fighting for a full day.Naruto Chapter 624 Furthermore, Hagoromo is\
      \ still held in a myhtical regard in Kumogakure, to the point where the usage\
      \ of his tools is considered an extremely difficult feat to achieve for anyone,Naruto\
