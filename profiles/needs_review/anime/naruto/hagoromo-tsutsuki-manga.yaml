    \ are famed for their unique and complex abilities, even a millennia later.Naruto\
    \ Chapter 527 He also proved himself to be an extremely competent combatant, which\
    \ was alluded to through his battle against the Ten Tails. Even against a stronger\
    \ opponent, Hagoromo was able to come out on top in the end, eventually managing\
    \ to seal the beast away.Naruto Chapter 681Jin no Sho, Page 217 He is also profoundly\
    \ experienced, having lived for thousands of years. He has gained a great deal\
