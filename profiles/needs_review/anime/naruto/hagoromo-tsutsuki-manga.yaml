    \ Sasuke's Story - The Uchiha and the Heavenly Stardust: The Manga, Chapter 5Naruto:\
    \ Sasuke's Story - The Uchiha and the Heavenly Stardust: The Manga, Chapter 6\
    \ For this conclusion to be reached, several clues need to be uncovered first.\
