- id: claim-weaknesses-914a79f4
  section: weaknesses
  axis: weakness
  text: "The base Truth-Seeking Orbs have a maximum range of up to 70 meters, outside\
    \ of which the user loses control over them.Naruto Chapter 669 Shinra Tensei requires\
    \ a 5 second recharge period between each consecutive usage of the technique.Naruto\
    \ Chapter 434 Hagoromo is a pacifist above all else, with his main motivation\
    \ being the achievement of peace and order. This means he's likely to look for\
    \ a peaceful resolution to most conflicts, if possible, which might limit him\
    \ from using his more lethal abilities in combat as a starting move. However,\
    \ he is not entirely averse to combat, as he is more than willing to step up and\
    \ engage in mortal combat if it meant saving the world from cataclysmic threats\
    \ such as the Ten-Tails or Infinite Tsukuyomi. He would be more than willing to\
    \ exercise his power if it meant protecting humanity, and the world at large.Naruto\
    \ Chapter 681Jin no Sho, Page 217 Used to be incapable of utilizing Six Paths\
    \ \u30FC Chibaku Tensei without his brother, Hamura \u014Ctsutsuki, as it required\
    \ both of their individual seals to invoke.Jin no Sho, Page 268Jin no Sho, Page\
    \ 269 However, he has since gained the ability to perform the technique on his\
    \ own at some point in his life, as he now possesses both the Sun and Moon seals.Naruto\
    \ Chapter 690 Ten-Tails Jinch\u016Briki=The removal/extraction of a Tailed Beast\
    \ results in its Jinch\u016Briki's death;Naruto Chapter 261 however, in Hagoromo's\
    \ case as a Ten-Tails Jinch\u016Briki, this process is different due to the Gedo\
    \ Statue's immense life-force keeping its host alive even after the chakra is\
    \ extracted. Hagoromo is left severely weakened for several months, though.Naruto\
    \ Chapter 656 Cannot exist for long periods of time within the physical world,\
    \ as he will be shortly pulled back to the Pure Land.Naruto Chapter 692 Additionally,\
    \ he cannot manifest freely in the first place unless specific conditions are\
    \ met, such as the recreation of his chakraNaruto Chapter 686 by an Ashura or\
    \ Indra reincarnate.Naruto Chapter 681 If he gifts his chakra to another, he will\
    \ be left unable to utilize chakra taxing techniques for a period of time.Naruto\
    \ Chapter 686 {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
    1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"\
    text-align: left"
