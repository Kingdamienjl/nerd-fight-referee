    - field: powers_and_abilities
      value: "interrogation and restoration, by summoning and making use of the King\
        \ of Hell's abilities. The Naraka Path can also be used as a form of F\u016B\
        injutsu, allowing its user to seal the bodies and souls of others inside the\
        \ King of Hell to be summoned back at the user's discretion. The King of Hell\
        \ can also be used to return the souls of those who have died at the user's\
        \ hands to the world of the living, To interrogate, the Naraka Path need only\
        \ catch hold of a person, causing the King of Hell to appear before them.\
        \ With the victim completely paralyzed, the Naraka Path begins questioning\
        \ them. If the victim answers the user's question truthfully, they may be\
        \ spared. However, if they lie, the King of Hell kills them on the spot. The\
        \ King of Hell gives the user the power over life and death, and can ultimately\
        \ decide their victim's fate. Meaning that they may still choose to kill their\
        \ target, anyway, The second ability the Naraka Path possessed is the ability\
        \ to repair any damage. To do so, the Naraka Path has the King of Hell ingest\
        \ the damaged body with its tendril-like arms into its mouth. Then, after\
        \ a short time, the destroyed body will emerge from its mouth, completely\
        \ rejuvenated and repaired. centre, thumb, 350x350px, The Naraka Path's healing\
        \ ability, : The Deva Path grants its user the ability to control gravity,\
        \ in the form of attractive and repulsive forces. Despite their incredible\
        \ power, these gravity manipulating techniques cannot be performed in rapid\
        \ succession, the amount of time required to recharge after use varies depending\
        \ on the scale of the technique used, five seconds being the basic minimum.,\
        \ : A technique that manipulates attractive force to pull matter towards the\
        \ user at will. It has the same five-second limit as the Shinra Tensei. It\
        \ is possible to attract multiple targets at once, causing them to collide\
        \ with each other. This technique is extremely versatile, and can be used\
        \ to attract opponents into one's attacks, making it very difficult to avoid\
        \ getting hit with them. center, thumb, 388x388px, Bansh\u014D Ten'in, : Is\
        \ the Deva Path's ability to manipulate repulsive force at the user's will\
        \ to push matter or techniques away. This technique essentially makes its\
        \ user impervious to most physical attacks or Ninjutsu, because they can simply\
        \ push them all away. When used against Ninjutsu, this technique simply causes\
        \ the incoming Jutsu to dissipate. Shinra Tensei's power and range can also\
        \ be adjusted by the user, and can greatly vary between pushing someone away\
