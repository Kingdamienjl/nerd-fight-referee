  section: power_scale
  axis: battle_iq
  text: "Extraordinary Genius Hagoromo \u014Ctsutsuki is a prodigious man of many\
    \ talents, in which he greatly excels. Indra \u014Ctsutsuki, Hagoromo's son, inherited\
    \ all of his father's abilities and talent from birth, which led to him being\
