    \ creed.Jin no Sho, Page 218 Additionally, he has been watching over the world\
    \ for the last 1000 years since his death,Jin no Sho, Page 70 which allowed him\
    \ to observe and interact with many cultures over a number of time periods. He\
    \ also showcased his general intelligence when he performed extensive research\
