    \ such as the Senju and Uzumaki clans respectively, which blessed them with extremely\
    \ strong strong life-force and vitality,Naruto Chapter 579 which allowed them\
    \ to survive grievous injuries and simply fight through them.Naruto Chapter 663\
    \ This could be observed with Nagato, who's admittedly nowhere near Hagoromo's\
    \ level.Naruto Chapter 439 He was able to survive and continue fighting through\
    \ severe injuries and debilitating pain,Naruto Chapter 447 and even managed to\
    \ summon the Gedo Statue and make use of its abilities, which requires a tremendous\
    \ amount of chakra due to the statue draining its user's life-force.Jin no Sho,\
    \ Page 247 This could also be observed through Kushina, who had recently had her\
    \ Tailed Beast extracted, which is a guaranteed death sentence.Naruto Chapter\
    \ 261 Even so, she was able to survive for an extended period of time, restrain\
