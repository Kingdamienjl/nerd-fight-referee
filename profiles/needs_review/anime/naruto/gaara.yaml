    \ Sunagakure for various purposes, including numerous supplementary functions\
    \ ranging from concealment to disguise. However, the tool itself rose to prominence\
    \ in the hands of the jinch\u016Briki of Shukaku, who acquired the ability to\
    \ manipulate sand through the beast, with the most renowned amongst these being\
    \ Gaara. While Gaara can control any sand, he keeps special sand in his gourd.\
    \ This sand is infused with his chakra, allowing him to drive faster and more\
    \ powerful attacks. **{{Nihongo|Shield of Sand|{{Ruby|\u7802|\u3059\u306A}}\u306E\
    {{Ruby|\u76FE|\u305F\u3066}}|Suna no Tate}}: A unique technique to Gaara. Whenever\
    \ Gaara is about to be harmed, a layer of sand will automatically surround and\
    \ protect him. The sand will react regardless of Gaara's will, even protecting\
    \ him from self-inflicted injuries. **{{Nihongo|Sand Armour|{{Ruby|\u7802|\u3059\
    \u306A}}\u306E{{Ruby|\u93A7|\u3088\u308D\u3044}}|Suna no Yoroi}}: Gaara can cover\
    \ himself in a compacted layer of sand, providing an additional defense should\
    \ his Shield of Sand fail. **{{Nihongo|Sand Coffin|{{Ruby|\u7802|\u3055}}{{Ruby|\u7E1B\
    |\u3070\u304F}}{{Ruby|\u67E9|\u304D\u3085\u3046}}|Sabaku Ky\u016B}}: Using the\
    \ sand he keeps stored in his Sand Gourd, Gaara immobilizes his targets and captures\
    \ them. Because the sand is naturally malleable, most of the target's usual methods\
    \ for defense or escape become ineffective once they've been encased by it. They\
    \ can only wait until Gaara releases or kills them. When killing his targets,\
    \ Gaara tends to either let them suffocate or use Sand Waterfall Funeral. ***{{Nihongo|Sand\
    \ Burial|{{Ruby|\u7802|\u3055}}{{Ruby|\u7011\u9001\u846C|\u3070\u304F\u305D\u3046\
    \u305D\u3046}}|Sabaku S\u014Ds\u014D}}: After encasing a target with sand, such\
    \ as by using the Sand Binding Coffin, Gaara clenches his fist to cause the sand\
    \ to contract. The sand presses in on the target from all directions until they're\
    \ pulverized, killing them. Although some of the target's remains burst through\
    \ the sand, scattering around the area similar to rain, most of their blood is\
    \ absorbed by the sand itself. Gaara can moderate the amount of pressure used\
    \ in the sand's contraction, either making death quick and painless or dragging\
    \ it out to prolong their suffering. He can also stop short of killing his targets,\
    \ only compressing the sand enough to break their bones. In this case, however,\
    \ the damage is so severe that only Tsunade is skilled enough to mend the bones,\
    \ and even then she anticipates only a 50% success rate. In Gaara Hiden, the Sand\
    \ Burial is stated to leave no identifiable trace of its victims, making it a\
    \ useful way to fake a person's death. **{{Nihongo|Sand Wave|{{Ruby|\u7802|\u3055\
    }}{{Ruby|\u6F20|\u3070\u304F}}{{Ruby|\u6CE2|\u306F}}|Sabakuha}} The user shapes\
    \ their sand into a wall to protect against attacks or to block an enemy's path.\
    \ While initially appearing more curved, Gaara's usage eventually was shaped to\
