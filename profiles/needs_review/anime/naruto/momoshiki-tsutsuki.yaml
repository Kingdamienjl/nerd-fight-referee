    \ (The Pheasant Hunter explodes on impact with its target, doing extensive damage\
    \ to the surroundings), Shadow Manipulation, Clairvoyance (Can read the fates\
    \ of others with his Byakugan), Power Bestowal (Bestowed upon Boruto the ability\
    \ to absorb ninjutsu), Enhanced Senses (With the Byakugan, he has the ability\
    \ to see chakra, an almost 360\xB0 range of vision, and the ability to see vast\
    \ distances and the chakra pathway system), Limited Durability Negation (The Gentle\
    \ Fist bypasses durability to an extent as it directly targets the nerves and\
    \ life energy channels to disrupt the target's movements and ability to control\
    \ their inner energy), Paralysis with the black receivers (Can paralyse and restrict\
    \ the movements of targets, and also control them), Creation (Can create large\
    \ elemental beasts), Time Stop and Incorporeality as a spirit, Resistance to Illusion\
    \ Creation, Ice Manipulation and Cosmic Radiations All previous abilities, Aura,\
    \ Vibration Manipulation (Can create shock waves with his chakra), likely Electricity\
    \ Manipulation (Should have gained Kinshiki's ability to cloak himself in purple\
    \ electricity) and Extrasensory Perception (Should have gained Kinshiki's ability\
    \ to sense chakra) \u014Ctsutsuki Physiology (\u014Ctsutsuki Vessel), Superhuman\
    \ Physical Characteristics, Chakra Manipulation, Skilled Hand-to-Hand Combatant,\
    \ Acrobatics, Breath Attack, Explosion Manipulation with explosive tags, Light\
    \ Manipulation with flashbang, Smoke Manipulation with smoke bombs, Weapon Mastery\
    \ (Is an adept shuriken and kunai user), Longevity (As a descendant of the Uzumaki\
    \ clan, he possesses an extraordinary life-force, granting him a longer lifespan\
    \ than others) Limited Acupuncture (Holds some degree of knowledge about the Gentle\
    \ Fist), Air Manipulation, Lightning Manipulation, Water Manipulation, Statistics\
    \ Amplification (Shinobi are capable of enhancing their physical capabilities\
    \ with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance\
    \ their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter\
    \ 24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing chakra\
    \ at the soles of their feet, Shinobi can scale and cling to vertical surfaces,\
    \ and even walk on waterNaruto Chapter 18Naruto Chapter 90), Afterimage Creation,\
    \ Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows its user\
    \ to instantly replace themselves with a nearby object such as a tree log, plant,\
    \ person, or clone at the exact moment they are attacked. The Jutsu works even\
    \ if the user is physically restrained or observed by characters as observant\
    \ as Sharingan or Sage Mode users. This creates the optical illusion of the user\
    \ being hit, which confuses the opponent and gives them an opening to flee or\
    \ counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter\
    \ 580Naruto Chapter 674), Minor Illusion Creation and Duplication (With the Clone\
    \ TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates of\
    \ themselves that have no physical substance), Shapeshifting (With the Transformation\
    \ TechniqueRin no Sho, Page 220, Shinobi can transform themselves into other people,\
    \ animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement\
    \ (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely\
    \ paralyze their targets from close to mid range), Sealing (Can seal people's\
    \ movements), Enhanced Senses (Telescopic Vision, Micro Vision, Panoramic Vison\
