    \ Skilled Hand-to-Hand Combatant, Acrobatics, Breath Attack, Explosion Manipulation\
    \ with explosive tags, Light Manipulation with flashbang, Smoke Manipulation with\
    \ smoke bombs, Weapon Mastery (Is an adept shuriken and kunai user), Longevity\
    \ (As a descendant of the Uzumaki clan, he possesses an extraordinary life-force,\
    \ granting him a longer lifespan than others) Limited Acupuncture (Holds some\
    \ degree of knowledge about the Gentle Fist), Air Manipulation, Lightning Manipulation,\
    \ Water Manipulation, Statistics Amplification (Shinobi are capable of enhancing\
    \ their physical capabilities with the use of chakra. The Shunshin no Jutsu allows\
    \ Shinobi to greatly enhance their speed by focusing chakra in their feetRin no\
    \ Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water\
    \ Walking (By focusing chakra at the soles of their feet, Shinobi can scale and\
    \ cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter\
    \ 90), Afterimage Creation, Stealth Mastery, and Speed Enhancement (The Substitution\
    \ Jutsu allows its user to instantly replace themselves with a nearby object such\
    \ as a tree log, plant, person, or clone at the exact moment they are attacked.\
    \ The Jutsu works even if the user is physically restrained or observed by characters\
    \ as observant as Sharingan or Sage Mode users. This creates the optical illusion\
    \ of the user being hit, which confuses the opponent and gives them an opening\
    \ to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto\
    \ Chapter 580Naruto Chapter 674), Minor Illusion Creation and Duplication (With\
    \ the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates\
    \ of themselves that have no physical substance), Shapeshifting (With the Transformation\
    \ TechniqueRin no Sho, Page 220, Shinobi can transform themselves into other people,\
    \ animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement\
    \ (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely\
    \ paralyze their targets from close to mid range), Sealing (Can seal people's\
    \ movements), Enhanced Senses (Telescopic Vision, Micro Vision, Panoramic Vison\
    \ and X-Ray Vision - Byakugan allows him to see long distances and tiny objects,\
    \ has an almost perfect 360\xB0 field of vision, can see through visual obstructions\
    \ and his opponents' internal chakra systems), Analytical Prediction (The Byakugan\
    \ is stated to anticipate and predict movements), Limited Power Nullification\
    \ and Pressure Points (Given the fact that Boruto possesses a Byakugan, he should\
    \ be able to accurately hit someone's Tenketsu, which would allow him to have\
    \ complete control over someone's ability to manipulate chakra. He could even\
    \ halt it from being manipulated altogether), Durability Negation (Boruto should\
    \ be able to interact with someone's Keirakukei with his chakra, given the fact\
    \ that he possesses a Byakugan, which grants him innate sight and knowledge about\
    \ someone's Keirakukei), Resistance to Illusion Creation, Minor Resistance to\
    \ Memory Manipulation (Can remember events that happened even after some of his\
    \ memories were stolen by S\u014Dma)"
