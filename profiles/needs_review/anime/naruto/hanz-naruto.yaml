- id: claim-standard-equipment-0f5f0e8a
  section: equipment
  axis: equipment
  text: "* Kusarigama: A kusarigama is a traditional Japanese weapon consisting of\
    \ a sickle attached to a chain. It may be used to attack opponents, or to incapacitate\
    \ them with the chain. Some skilled kusarigama users can even steal their opponents'\
    \ weapons. Hanz\u014D is noted to be a very skilled user of the kusarigama, which\
    \ he has drenched in poison to further increase its lethality. Unusually, he tended\
    \ to deliver strikes by swinging the sickle with the chain, rather than simply\
    \ employing the weighted end, which is generally considered to be the most effective\
    \ manner. * Poison: Hanz\u014D, in his youth, transplanted the poison sac of a\
    \ black salamander in his village. He was able to poison the environment just\
    \ from breathing. He also imbued his kusarigama's blade with poison. * Explosive\
    \ Tags: Explosive Tags are seets of paper inscribed with a special seal, centering\
    \ around the kanji for \"explode\" (\u7206, baku). Infused with chakra, they will\
    \ explode after a set amount of time, remotely, or after being ignited by flame.\
    \ The tags can be attached to a surface or wrapped around a weapon to be thrown\
    \ at an enemy. They are very versatile and one of the most basic ninja tools.\
    \ Ninja can confuse their enemies by obtaining fake explosive tags. They work\
    \ even under heavy rain. * Antidote: An antidote for his own poison that Hanz\u014D\
    \ carries with him, though Hanz\u014D said that if the amount of poison the victim\
    \ has taken is too high, there is still a chance they will die anyway."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-b301ef9d
  section: power_scale
  axis: battle_iq
  text: 'At least Gifted (Ninjas, by default, have exceptional and well rounded scientific
