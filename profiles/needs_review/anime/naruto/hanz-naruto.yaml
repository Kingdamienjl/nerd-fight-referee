- id: claim-weaknesses-501239ad
  section: weaknesses
  axis: weakness
  text: "Removing his respirator can be risky for himself if the poison sac in his\
    \ body is ruptured and he inhales the poison, which is incapable of killing him\
    \ but can leave him immobilized for seconds, creating an opening. Ibuse needs\
    \ 5 minutes to prepare his poison fog. His paranoia with keeping his position\
    \ as village leader caused him to neglect his training, allowing him to be easily\
    \ defeated by Nagato. {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
    \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
    2\" style=\"text-align: center; background-color: #800080; color: #FFFFFF\" |\
    \ Notable Attacks/Techniques |- | *Dance of the Sickle Blade: Falling Descent\
    \ Blade: Putting some distance between himself and his opponent, Hanz\u014D swings\
    \ his kusarigama high up in the air, and brings it down on his opponent. *Fire\
    \ Release: **Exploding Flame Formation: A technique that was a specialty of Hanz\u014D\
    . This technique makes use of explosive tags that have had a Fire Release technique\
    \ applied in advance, which are hidden along the earth's surface. When the target\
    \ steps in place, the user slams their palm on the ground and causes the explosive\
    \ tags to stream towards the target, wrapping around their body from the feet\
    \ upwards and sticking to them. Once in place around the target's legs, the tags\
    \ detonate simultaneously, causing a large explosion capable of blasting through\
    \ solid rock and engulfing the target in flames. On one occasion, despite Hanz\u014D\
    \ commending Nagato for having avoided this technique, the latter still suffered\
    \ permanent damage to his legs that severely restricted his mobility, attesting\
    \ to its destructive power *Summoning Technique: The Summoning Technique is a\
    \ space-time ninjutsu that allows the summoner to summon animals or people across\
    \ long distances instantly. Hanz\u014D uses this to summon a giant salamander\
    \ named Ibuse. **Poison Mist: Ibuse generates and stores poison fog inside his\
    \ body for 5 minutes, which he exhales from his mouth, poisoning anyone who inhales\
    \ it and causing paralysis within a few seconds. To avoid possible risks in this\
    \ process, Ibuse prepares the poison even before being summoned, releasing it\
    \ immediately upon appearing. **Summoning: Ibuse Poisoning: At Hanz\u014D's command,\
    \ Ibuse tunnels underground to evade the enemy's line of sight, and when the enemy\
    \ least expects it, resurfaces right beneath them, swallowing them whole. With\
    \ the poison already stored inside Ibuse's body, the target is poisoned immediately.\
    \ |}"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
