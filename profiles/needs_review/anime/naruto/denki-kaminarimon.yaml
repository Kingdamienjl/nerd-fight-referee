    - field: intelligence
      value: "Genius. Denki is quite intelligent, showing enough skill with computers\
        \ as he regularly uses them to assist his team on missions. On his personal\
        \ computer he has stored information on other ninja, including their individual\
        \ skills and mission performances. He has also used his computers to survey\
        \ his surrounding area, being able to guide his teammates to desired locations.\
        \ Denki can also hack into other computers and cameras to gain information,\
        \ as he once did to gain access to the Academy's security system. Sai deems\
        \ Denki's broad range of knowledge, along with ability to analyse and formulate\
        \ strategies to be Ch\u016Bnin-level. During the written portion of a Ch\u016B\
        nin Exam, he was able to discreetly pass answers to Iwabee through the use\
        \ of a device that copied his movements. He is also rather scientific, able\
        \ to perform advanced experiments with electronics, showing a strong understanding\
        \ of technology. With such skill, he was able to better facilitate communication\
        \ over long distances. His talents are also acknowledged by Katasuke T\u014D\
