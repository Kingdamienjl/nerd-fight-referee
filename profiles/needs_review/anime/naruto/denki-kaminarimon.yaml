- id: claim-standard-equipment-fb1b10c0
  section: equipment
  axis: equipment
  text: '*Kunai *Flash Bomb: Flash bombs are used for diversions, creating a blinding
    light when they detonate. They may look like small spheres wrapped in paper with
    the character ''light'' or, more conventionally, as canisters. *Lightning Release
    Suit: This is a prototype suit created with Scientific Ninja Tools. The suit provides
    the wielder incredible strength and is powered by Lightning Release to provide
    swift movements for the user, specifically inspired by the Lightning Release:
    Overdrive technique which Denki refers to as Pseudo Lightning Release: Overdrive.
    The suit features a motion sensor visor which functions like the Sharingan, analysing
    and predicting the opponent''s movements. For ranged combat, the suit can launch
    fireballs, and can extend its hands like grappling hooks.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
