    - field: standard_equipment
      value: 'Kunai, Flash Bomb: Flash bombs are used for diversions, creating a blinding
        light when they detonate. They may look like small spheres wrapped in paper
        with the character ''light'' or, more conventionally, as canisters., Lightning
        Release Suit: This is a prototype suit created with Scientific Ninja Tools.
        The suit provides the wielder incredible strength and is powered by Lightning
        Release to provide swift movements for the user, specifically inspired by
        the Lightning Release: Overdrive technique which Denki refers to as Pseudo
        Lightning Release: Overdrive. The suit features a motion sensor visor which
        functions like the Sharingan, analysing and predicting the opponent''s movements.
        For ranged combat, the suit can launch fireballs'
      source_id: mediawiki-4739453
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Genius. Denki is quite intelligent, showing enough skill with computers\
        \ as he regularly uses them to assist his team on missions. On his personal\
        \ computer he has stored information on other ninja, including their individual\
        \ skills and mission performances. He has also used his computers to survey\
        \ his surrounding area, being able to guide his teammates to desired locations.\
        \ Denki can also hack into other computers and cameras to gain information,\
        \ as he once did to gain access to the Academy's security system. Sai deems\
        \ Denki's broad range of knowledge, along with ability to analyse and formulate\
        \ strategies to be Ch\u016Bnin-level. During the written portion of a Ch\u016B\
        nin Exam, he was able to discreetly pass answers to Iwabee through the use\
        \ of a device that copied his movements. He is also rather scientific, able\
        \ to perform advanced experiments with electronics, showing a strong understanding\
        \ of technology. With such skill, he was able to better facilitate communication\
        \ over long distances. His talents are also acknowledged by Katasuke T\u014D\
        no, regularly letting Denki make use of his resources to let him design and\
        \ build his own original tools. These talents lead him to design a combat\
        \ suit that greatly enhances his physical might, along with a motion sensor\
        \ system that constantly analyses and anticipates enemy attacks, which has\
        \ been compared to the Sharingan."
      source_id: mediawiki-4739453
