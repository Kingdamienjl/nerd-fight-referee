        at the soles of their feet, Shinobi can scale and cling to vertical surfaces,
        and even walk on waterNaruto Chapter 18Naruto Chapter 90), Afterimage Creation,
        Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows its
        user to instantly replace themselves with a nearby object such as a tree log,
