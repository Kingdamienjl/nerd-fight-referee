- id: claim-powers-and-abilities-eecd8cfe
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Acrobatics *Multiple Selves (Types\
    \ 1, 2 and 3 as a Jinch\u016Briki) *Telepathy (Can communicate with the other\
    \ Bij\u016B through thought) *Fear-Inducing Aura (His Grandson directly inherited\
    \ his bloodlust which made his opponents visibly terrified) *Transformation (Can\
    \ partially or fully transform into his tailed beast to greatly improve his overall\
    \ statistics) *Chakra Manipulation **Statistics Amplification (Shinobi are capable\
    \ of enhancing their physical capabilities with the use of chakra. The Shunshin\
    \ no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in\
    \ their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71) **Surface\
    \ Scaling & Water Walking (By focusing chakra at the soles of their feet, Shinobi\
    \ can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter\
    \ 18Naruto Chapter 90) **Minor Illusion Creation & Duplication (With the Clone\
    \ Technique,Rin no Sho, Page 220 Shinobi can create illusionary duplicates of\
    \ themselves that have no physical substance) **Shapeshifting (With the Transformation\
    \ Technique,Rin no Sho, Page 220 Shinobi can transform themselves into other people,\
    \ animals, plants, and even inanimate objects, such as weapons) **Paralysis Inducement\
    \ (With the Temporary Paralysis Technique,Rin no Sho, Page 176 Shinobi can completely\
    \ paralyze their targets from close to mid range) **Water Manipulation, Weapon\
    \ Mastery, Limited Duplication, Attack Reflection (His Water-Mirror jutsu involve\
    \ using his staff to emerge a clone reflecting the strength and attack of his\
    \ opponent) **Genjutsu Nullification (Jinch\u016Briki who have gained the cooperation\
    \ of their Bij\u016B can be broken free from genjutsuNaruto Chapter 413Naruto\
    \ Chapter 549 with the help of their Bij\u016B) Jinch\u016Briki Cloak= All previous\
    \ abilities enhanced: *Enhanced Senses, Extrasensory Perception (Able to detect\
    \ chakra from great distances) *Energy Projection, Non-Physical Interaction with\
    \ Tailed Beast Chakra Arms (Tailed Beast Chakra Arms users can physically interact\
    \ with intangible objects like their soul when it's halfway extracted from them)\
    \ Bij\u016B Mode= All previous abilities enhanced: *Energy Projection *Large Size\
    \ (Type 1) *Illusion Creation *Creation (Isobu can create thousands of miniature\
    \ versions of himself) *Mind Manipulation *Paralysis Inducement, Body Puppetry,\
    \ and Possession (Bij\u016B and Jinch\u016Briki are capable of resistingNaruto\
    \ Chapter 444Naruto Chapter 567 the binding effects and control of the Rinnegan's\
    \ Black Receivers) *Regeneration (Low-Godly - Edo Tensei are capable of regenerating\
    \ from the complete destructionNaruto Chapter 517 page 8 and 9 of their bodies.Naruto\
    \ Chapter 561 It's stated that as long as the soul remains, the Edo Tensei will\
    \ keep coming back to lifeNaruto Chapter 120Naruto Chapter 518) *Immortality (Types\
    \ 1, 2, 3, 4, 7 and 8 - Edo Tensei are corpses possessed by a soul brought back\
    \ from the Pure Land. They are incapable of feeling pain along with being able\
    \ to survive grievous injuries such as bisectionNaruto Chapter 523 and dismemberment.Naruto\
    \ Chapter 520 page 21 Edo Tensei will keep coming back so long as their soul remains\
    \ bound to the Edo realmNaruto Chapter 120Naruto Chapter 518) *Inorganic Physiology\
    \ (Type 1 - Edo Tensei bodies are comprised of dust and ash enveloping an already\
    \ deceased corpse shaping it into the revived person the caster choosesNaruto\
    \ Chapter 119) *Self-Sustenance (Types 1, 2 and 3 - The Edo Tensei are the souls\
    \ of the dead the caster wants to reanimate, the caster uses an already dead body\
    \ to house the revived soulNaruto Chapter 520) *Instinctive Action (Edo Tensei\
    \ are programed to automatically counter enemy jutsuNaruto Chapter 547 along with\
    \ their bodies moving of its own accordNaruto Chapter 548) *Mind Manipulation,\
    \ Empathic Manipulation and Emotion Detection (Even though Edo Tensei are able\
    \ to retain their consciousness when brought back from the afterlife, the controller\
    \ can suppress their free willNaruto Chapter 119 Page 16 binding their mind and\
    \ shutting off all emotionNaruto Chapter 522)"
