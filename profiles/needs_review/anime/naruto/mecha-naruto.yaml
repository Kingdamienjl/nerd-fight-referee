    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Chakra Manipulation, Acrobatics
        (The Six Paths of Pain are capable of jumping very high), Minor Illusion Creation
        and Duplication (With the Clone Technique, Shinobi can create illusionary
        duplicates of themselves that have no physical substance), Shapeshifting (With
        the Transformation Technique, Shinobi can transform themselves into other
        people, animals, plants, and even inanimate objects, such as weapons), Paralysis
        Inducement (With the Temporary Paralysis Technique, Shinobi can completely
        paralyze their targets from close to mid range), Statistics Amplification
        (Shinobi are capable of enhancing their physical capabilities with the use
        of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed
        by focusing chakra in their feet), Surface Scaling and Water Walking (By focusing
        chakra at the soles of their feet, Shinobi can scale and cling to vertical
        surfaces, and even walk on water), Stealth Mastery (Can easily sneak past
        an Anbu Black Ops Shinobi, Shizune, Ino, and Inoichi. Can replace himself
        with inanimate objects to avoid damage), Genjutsu Nullification (Shinobi can
        typically break free from and nullify non-ocular genjutsu by intentionally
        disrupting the flow of chakra within their bodies), Afterimage Creation, Stealth
        Mastery, and Speed Enhancement (The Substitution Jutsu allows its user to
        instantly replace themselves with a nearby object such as a tree log, plant,
        person, or clone at the exact moment they are attacked. The Jutsu works even
        if the user is physically restrained or observed by characters as observant
        as Sharingan or Sage Mode users. This creates the optical illusion of the
        user being hit, which confuses the opponent and gives them an opening to flee
        or counterattack), Astral Projection (can make himself an astral projection
        and link up with other Akatsuki members using it), Non-combat applicable and
        preparation based Pocket Reality Manipulation/Spatial Manipulation (Can create
        a sealed dimension with tags put in specific areas), Limited Death Manipulation
        with Preparation (He can put his or another persons chakra into a target and
        control them as his own body albeit weaker, once the chakra runs out the target
        dies he also gains Weapon Creation and Power Mimicry from using this jutsu
        as it recreates their weapons and the abilities the weapons have he also gets
        these from people removing tags in set places that makes a copy of the person
        with the same abilities), Weather Manipulation and Extrasensory Perception
        with Rain Tiger at Will Technique (Allows him to create rain clouds that cause
        rain to fall in a large area, anyone that steps in the rain is sensed by him
        and he can sense their strength from it as well), Enhanced Senses (The Rinnegan
        is capable of perceiving chakra, and its flow within the body. It's also capable
        of perceiving invisible barriers, and can even see the Invisible Limbo Clones,
        which reside in a different dimension and are normally impossible to perceive),
        Paralysis Inducement and Body Puppetry (The Black Receivers can paralyze and
        hinder the movements of whoever they pierce, and they can also control their
        movements), Possession, Clairvoyance, and Telepathy (Via the Six Paths Technique;
        Using the Black Chakra Receivers, the user can transmit their chakra into
        the pierced bodies and take them over in a very similar manner to the Yamanaka
        Clan's Mind-Body Transfer Technique. This allows the user to assume perfect
        control over the bodies as if they were his own. It also allows the user to
        speak through the bodies. The pierced bodies can transfer their thoughts and
        experiences to each other, perfectly coordinate their movements, and share
        their fields of vision to enhance their visual range and eliminate each others'
        blind spots)
