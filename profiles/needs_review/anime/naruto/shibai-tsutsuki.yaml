        \ Intention Reflection (Since the ability is based on harmful intention, and\
        \ is not an ability that requires a physical distance to be traveled. The\
        \ range of it should logically be far higher than what has been shown in the\
        \ series), Several Kilometers with Storm Creation (Shibai, through an unknown\
        \ Shinjutsu, can generate entire thunderstorms, which normally are around\
        \ several kilometers in diameter), Universe level+ with Omnipotence (It's\
        \ explained that Omnipotence allowed \u014Ctsutsuki Gods to create entire\
        \ \"worlds\" from naught. Ada's usage of Omnipotence affected everyone on\
        \ a universal and interdimensional scale), Interdimensional with Senrigan,\
        \ Omnipotence, and Claw Marks (By using Claw Marks, Shibai can traverse through\
        \ entire dimensions), Multiversal with Prescience (With this ability, Shibai\
        \ can perceive a countless number of alternative realities)"
      source_id: vsbattles-shibai-tsutsuki-naruto
      provider_id: vsbattles
      authority: high
