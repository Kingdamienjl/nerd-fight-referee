        \ Chapter 55: \"Legacy\" into their very being through a complex evolutionary\
        \ process similar to reincarnation; a cycle of death and rebirth actualized\
        \ by Kama - bestowing upon them ever-evolving intelligence and martial ability.\
        \ Shibai has consumed an innumerable amount of genetic information. It's held\
        \ as common knowledge by the clan that Shibai had devoured countless planets,\
        \ naturally consuming all genetic information present and incorporating that\
        \ material into himself, resulting in a great increase to his intellect. Additionally,\
        \ \u014Ctsutsuki who can be inferred as being less intelligent compared to\
