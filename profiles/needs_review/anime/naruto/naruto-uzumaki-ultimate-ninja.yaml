    - field: intelligence
      value: 'Average normally, Genius in combat (Naruto acts headstrong and often
        acts without thinking, however, Naruto''s years as a prankster gave him a
        cunning imagination that is useful in battle. He is a remarkable tactile learner,
        able to learn better through executing a task rather than theorizing about
        it. Once they see him in action, even the likes of the Second Hokage revised
        their thoughts about his intellect. Naruto can formulate multi-step plans
        and even backups to those plans in the thick of battle. Naruto''s strategies
        typically involve shadow clones: he may direct his opponent''s attention towards
        one of his clones to disguise his movements; he may transform them into objects
        or other individuals for surprise attacks; he may make himself seem predictable
        by creating a pattern, to throw them off by breaking it. He is rather observant,
        able to notice details others may overlook and subsequently take advantage
        of it. Even when given new information, he can act quickly. When not in combat,
        he is generally average in intellect but can be quite stupid sometimes. This
        is usually used as a comedic effect, making Naruto the butt of many jokes
        inside and outside the show)'
