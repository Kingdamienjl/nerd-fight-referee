        \ Kabuto Yakushi), far higher with Vermilion Rasengan (Clashed evenly with\
        \ CS2 Sasuke's Chidori) | City level, likely higher (Kakashi believed that\
        \ he would have to use the Sharingan against Naruto and Sakura, and he thought\
        \ Naruto would be good backup against Itachi. Danz\u014D stated that he was\
        \ superior to his peers, which should include Neji Hy\u016Bga and Rock Lee),\
        \ far higher with Ky\u016Bbi Cloaks (Drew blood from Deidara with a punch.\
        \ Ripped a casual Orochimaru\u2019s face off and sent him flying), higher\
        \ with Rasenshuriken (Destroyed 2 of Kakazu\u2019s hearts and left the 3rd\
        \ one near death), Island level in Sage Mode (Consistently destroyed Pain's\
        \ bodies when all or most of them were active. Pain stated that Naruto had\
        \ pushed him farther than ever before) | City level normally (Should be as\
        \ strong as he was before the war), Island level in Sage Mode (Should be at\
        \ least as strong as before. Matched the Edo 3rd Raikage's Hell Stab's kinetic\
        \ energy with his Rasengan, circumvented his LCM to crack his skin, and redirected\
        \ his thrust), at least Island level with Kurama Chakra Mode (Stated that\
        \ he was significantly stronger than he was during Pain\u2019s Assault, which\
        \ should put him above his Sage Mode form. Stated to have control over the\
