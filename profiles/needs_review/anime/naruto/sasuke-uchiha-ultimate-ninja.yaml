- id: claim-weaknesses-6a7e3608
  section: weaknesses
  axis: weakness
  text: "Sasuke is somewhat overconfident and is easy to manipulate emotionally. The\
    \ Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu is limited by the\
    \ user's physical condition, that is to say, that the user needs to be physically\
    \ capable of performing the technique they are trying to replicate. They need\
    \ to meet any physical or chakra amount prerequisites the technique in question\
    \ may have. This ability is also incapable of replicating Kekkei Genkai, due to\
    \ either not possessing the genetic predisposition and/or having the necessary\
    \ chakra natures. Naturally, the user also needs to actually see the technique\
    \ they are attempting to copy, meaning they cannot copy something they did not\
    \ see or is obscured from their line of sight. In fact, the same can be said for\
    \ essentially all of the Sharingan's abilities; they are sight based abilities,\
    \ so if the opponent can obscure the user's vision using extremely thick mist/dust\
    \ or blind them, the Sharingan's abilities will be rendered useless. Likewise\
    \ if the opponent is too fast for the Sharingan to visually keep track of them,\
    \ they will be safe from its abilities. Sharingan Genjutsu requires eye contact,\
    \ so if the opponent is able to avoid eye contact or is blind, they will be able\
    \ to avoid Sharingan Genjutsu entirely. Finally, the Sharingan's predictive capabilities\
    \ can be somewhat circumvented by attacks that have little to no pattern, such\
    \ as Naruto's chakra arms that emerge from any part of his body and attack instinctively.\
    \ Use of the Curse Mark erodes the user's body until they eventually lose themselves,\
    \ binding them to Orochimaru. The second level makes this erosion speed up dramatically\
    \ and it requires a greater amount of chakra to sustain it. It also takes a serious\
    \ toll on the user, leaving them unable to move their body afterwards (Not the\
    \ case anymore after his Curse Mark was sealed). | The Mangeky\u014D Sharingan\
    \ offers far more power than the regular Sharingan, but that power comes at a\
    \ cost. More powerful techniques entail a far higher chakra cost, making Mangeky\u014D\
    \ Sharingan Jutsu extremely taxing to use and maintain. Additionally, the Mangeky\u014D\
    \ Sharingan also causes great strain on the user's vision, eventually resulting\
    \ in complete blindness with continuous use. The Susano'o causes its user immense\
    \ pain \"in every cell in their body\" (Not the case anymore after unlocking the\
    \ Eternal Mangeky\u014D Sharingan). | Lacks his left arm. Traveling between dimensions\
    \ consumes a great portion of his Chakra reserves. {| class=\"mw-collapsible mw-collapsed\"\
    \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left"
  source_ids: *id003
