- id: claim-weaknesses-ce8410d8
  section: weaknesses
  axis: weakness
  text: 'Lacks his left arm. Traveling between dimensions consumes a great portion
    of his Chakra reserves. The Sharingan''s ability to copy Ninjutsu, Genjutsu, and
    Taijutsu is [https://imgur.com/gallery/BwAlsIQ limited by the user''s physical
    condition], that is to say that the user needs to be physically capable of performing
    the technique they are trying to replicate. They need to meet any physical or
    chakra amount prerequisites the technique in question may have. This ability is
    also [https://imgur.com/d7JHjAk incapable] of [https://imgur.com/b7Ud9vn replicating
    Kekkei Genkai], due to either not possessing the genetic predisposition and/or
    having the necessary chakra natures. Naturally, the user also needs to actually
    see the technique they are attempting to copy, meaning they cannot copy something
    they did not see or is obscured from their line of sight. In fact, the same can
    be said for essentially all of the Sharingan''s abilities; they are sight based
    abilities, so if the opponent can obscure the user''s vision [https://imgur.com/gallery/vhinaOp
    using extremely thick mist/dust] or blind them, the Sharingan''s abilities will
    be rendered useless. Likewise if the opponent is too fast for the Sharingan to
    visually keep track of them, they will be safe from its abilities. Sharingan Genjutsu
    requires eye contact, so if the opponent is able to avoid eye contact or is blind,
    they will be able to avoid Sharingan Genjutsu entirely. Finally, the Sharingan''s
    predictive capabilities can be somewhat circumvented by attacks that have little
    to no pattern, such as [https://imgur.com/gallery/kpckaTX Naruto''s chakra arms]
    that emerge from any part of his body and attack instinctively. The Susano''o
    causes its user immense pain "[https://imgur.com/a/o2QfJSs in every cell in their
    body]". Incapable of utilizing the Six Paths Chibaku Tensei and Majestic Attire
    Susano''o without Naruto, and cannot utilize the Six Paths Susano''o or Indra''s
    Arrow without enslaving all 9 Tailed Beasts inside 9 Chibaku Tensei. {| class="mw-collapsible
    mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
    | colspan="2" style="text-align: left'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5fab68a9
  section: abilities
  axis: hax
  text: "interrogation and restoration, by using the King of Hell. **To interrogate,\
    \ the Naraka Path need only catch hold of a person, causing the King of Hell to\
    \ appear before them. With the victim seemingly paralyzed, the Naraka Path begins\
    \ questioning them. **The second ability the Naraka Path possessed is the ability\
    \ to repair any damage. To do so, the Naraka Path has the King of Hell ingest\
    \ the damaged body with its tendril-like arms into its mouth. Then, after some\
    \ time, the destroyed body will emerge from its mouth, completely rejuvenated.\
    \ *: The ability to control gravity. Despite their incredible power, these gravity\
    \ manipulating techniques cannot be performed in rapid succession; the amount\
    \ of time required to recharge after use varies depending on the scale of the\
    \ technique used, five seconds being the basic minimum. **: Is a technique that\
    \ manipulates attractive force to pull matter towards the user at will. It has\
    \ the same five-second limit as the Shinra Tensei. It is possible to attract multiple\
    \ targets at once, causing them to collide with each other. **: Is the Deva Path's\
    \ ability to manipulate repulsive force at the user's will to push matter or techniques\
    \ away. **: Is a technique that is channeled through the Deva Path. Hagoromo \u014C\
    tsutsuki notoriously used it to create the moon and trap the Ten-Tails' body inside\
    \ of it. Sasuke Uchiha is also capable of using this technique. He used it to\
    \ hold the Tailed Beasts in captivity. *: Sasuke's unique Rinnegan power. Sasuke\
    \ can swap positions with the object he sees or teleport directly into blank space\
    \ with a shorter distance. Suppose the user switches himself with other things\
    \ in close-range combat. In that case, the user can evade and counter an enemy's\
    \ attack simultaneously by replacing himself with a kunai or other weapon. * This\
    \ medical ninjutsu allows the user to speed up the body's natural healing process\
    \ by sending chakra from their hands into a wound or afflicted body part. This\
    \ allows the user to heal a patient without needing medical equipment or surgery,\
    \ making it very useful on the battlefield. It can be used to treat both external\
    \ and internal injuries. It is vital to match the amount of chakra used to the\
    \ severity of the affliction or injury. This requires a considerable amount of\
    \ chakra control. Because of this, only a few experts can use this technique.\
    \ Kabuto Yakushi demonstrated the ability to use it a short distance away from\
    \ the target instead of direct contact. Unspecified Space\u2013Time Ninjutsu:\
    \ With his Rinnegan, Sasuke can use an unspecified Space\u2013Time Ninjutsu to\
    \ travel to different dimensions."
