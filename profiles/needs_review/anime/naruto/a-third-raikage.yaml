  attack_potency:
    text: "Unknown, possibly Mountain level (He should be somewhat comparable to his\
      \ son, as they share a similar level of power and physical constitution100 Megatons),\
      \ Country level with Lightning Release Chakra Mode (The Raikage, or \"A\", is\
      \ the strongest Shinobi in the village.Jin no Sho, page 142 During A's long\
      \ reign this included several Jinch\u016Briki, including Killer B, and his son.\
      \ Furthermore, the 3rd Raikage has a reputation for being the only Shinobi in\
      \ history to fight a Bijuu unarmored and unarmed.Naruto Chapter 554 His Databook\
      \ entryJin no Sho, page 201 offers further support for this by citing his ability\
      \ to fight Gy\u016Bki with his bare hands, and sever his tails. Gy\u016Bki himself\
      \ praises the Raikage's strength and reselience, and tells Naruto of one of\
      \ their battles where they fought until exhaustion and collapsed simultaneouslyNaruto\
      \ Chapter 5557 Teratons), far higher with Hell Stab (Using this move, the Raikage\
      \ was capable of easily chopping off all of Gy\u016Bki's tails at the same timeNaruto\
      \ Chapter 555 due to the greatly enhanced cutting power offered by this move.\
      \ This move is also capable of easily piercing the Raikage himself, even through\
      \ his Lightning Release Chakra ModeNaruto Chapter 555)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "At least Relativistic (Comparable to Gy\u016Bki, and should be faster than\
