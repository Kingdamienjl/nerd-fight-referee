        \ or \"A\", is the strongest Shinobi in the village.Jin no Sho, page 142 During\
        \ A's long reign this included several Jinch\u016Briki, including Killer B,\
        \ and his son. Furthermore, the 3rd Raikage has a reputation for being the\
        \ only Shinobi in history to fight a Bijuu unarmored and unarmed.Naruto Chapter\
        \ 554 His Databook entryJin no Sho, page 201 offers further support for this\
        \ by citing his ability to fight Gy\u016Bki with his bare hands, and sever\
        \ his tails. Gy\u016Bki himself praises the Raikage's strength and reselience,\
        \ and tells Naruto of one of their battles where they fought until exhaustion\
        \ and collapsed simultaneouslyNaruto Chapter 5557 Teratons), far higher with\
        \ Hell Stab (Using this move, the Raikage was capable of easily chopping off\
