      \ so that normal humans would die after using it for only a short period of\
      \ timeNaruto Chapter 527. A also battled Gy\u016Bki, a Tailed Beast with massive\
      \ amounts of chakra, to the point where they both collapsed. Fought non-stop\
      \ in the Third Shinobi World War for three consecutive days and nights before\
      \ finally collapsingNaruto Chapter 553\u2014 something normal shinobi could\
