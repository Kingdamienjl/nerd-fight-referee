power_scale:
  tier:
    text: "7-B, 7-A with Sharingan, higher with CS1, even higher with Partial Transformation,\
      \ High 7-A with CS2, 6-C with Kirin | 7-B, 7-A with Sharingan, higher with Mangeky\u014D\
      \ Sharingan | High 7-A, higher with Mangeky\u014D Sharingan, 6-B with Chidori,\
      \ far higher with Susano'o | 6-B, higher with Susano'o, far higher with Perfect\
      \ Susano'o, High 6-A with Senjutsu Susano'o, higher with Majestic Attire Susano'o,\
      \ far higher with Majestic Attire Susano'o & Rasengan Barrage | 5-B physically,\
      \ higher with Ninjutsu, even higher with Chidori, far higher with Kusanagi no\
      \ Tsurugi: Chidorigatana, even higher with Susano'o, far higher with Six Path's\
      \ Susano'o, even higher with Indra's Arrow and Majestic Attire Susano'o"
    source_ids: &id002
    - mediawiki-3218
    confidence: 0.95
  attack_potency:
    text: "City level+ (Even before absorbing Orochimaru, he could [https://imgur.com/gallery/I2SUzEp\
      \ casually overpower] Sai), Mountain level with Sharingan ([https://imgur.com/a/hWsm0JC\
      \ Physically clashed] with Itachi Uchiha, who was using the Mangeky\u014D Sharingan,\
      \ after matching his shuriken-jutsu), higher with CS1 (At least one-tenth as\
      \ powerful as his CS2 state), even higher with Partial Transformation (Can [https://imgur.com/a/pTpnBw0\
      \ partially transform into CS2] to enhance his strength), Large Mountain level\
      \ with CS2 ([https://imgur.com/a/QKYVwop Created the thundercloud that spawned\
      \ Kirin] with his Fierce Dragon Flame Jutsu), Island level with Kirin (Completely\
      \ obliterated an entire mountain)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "At least Sub-Relativistic (By integrating the Shunshin no Jutsu into his\
      \ fighting style, his speed became so overwhelming that Tobi remarked it was\
      \ too fast for Deidara to handle. He effortlessly evaded Deidara\u2019s point-blank\
      \ sneak attacks, with Deidara repeatedly commenting on how fast Sasuke was.\
      \ This portrayal is further supported by the databook, which describes his speed\
      \ as \u201Cgodlike\u201D. Moved too fast for Sakura to keep up with), higher\
      \ with Chidori (The Chidori is a technique that dramatically increases the user's\
      \ speed\u2014so much so that they struggle to perceive or react to their opponents\
      \ while using it. This is particularly notable considering that most ninja can\
      \ already enhance their speed and reflexes with the Body Flicker Technique without\
      \ significant drawbacks. Despite this, Minato outright forbade Kakashi from\
      \ using the Chidori, underscoring its risks. The technique\u2019s major drawback\u2014\
      impaired perception at high speed\u2014can only be compensated for with at least\
      \ a two-tomoe Sharingan), even higher with CS1 and CS2 (Briefly outran Itachi's\
      \ Amaterasu), even far higher Reactions with Sharingan (The Sharingan grants\
      \ its user the ability to keep up with\u2014and even counterattack\u2014opponents\
      \ who were previously overwhelming them in terms of speed), higher with Kirin"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class G (Far stronger than his previous self due to training rigorously
      for 3 years, [https://ibb.co/Zpw6Ryb9&#x20;https://ibb.co/NgxZj6rT Casually
      sent Sai flying through] [https://ibb.co/Zpw6Ryb9&#x20;https://ibb.co/NgxZj6rT
      Orochimaru's hideout]), far higher with CS1 (The Curse Seal greatly increases
      Sasuke's Lifting Strength, 10 times weaker than his CS2 state), Class T with
      CS2 (Much stronger than his previous Curse mark second state)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: City level+ (Casually overpowered Sai), Mountain level with Sharingan (Comparable
      to Itachi Uchiha), higher with CS1 (At least one-tenth as powerful as his CS2
      state), even higher with Partial Transformation, Large Mountain level with CS2
      (Comparable to his attack potency)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: City level+, Mountain level with Sharingan (Comparable to his striking strength),
      higher with CS1 (At least one-tenth as durable as his CS2 state), even higher
      with Partial Transformation, Large Mountain level with CS2 (Comparable to his
      striking strength)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: "Superhuman (Has large reserves of chakra. Fought with the Kages, Danz\u014D\
      , and Team Kakashi back to back with little rest)"
    source_ids: *id002
    confidence: 0.95
  range:
    text: "Extended Melee Range, Tens of Meters to Thousands of Kilometers with Ninjutsu,\
      \ Planetary with Deva Path (Six Paths \u30FC Chibaku Tensei allows its users\
      \ to [https://imgur.com/gallery/uXHvoi7 create a moon sized planetoid]., shouldn't\
      \ be that inferior to Hagaromo's usage of the Deva Path [https://imgur.com/a/DtZGAIa\
      \ who can send a meteor containing Polar Particles into space, and had it permanently\
      \ orbit the planet]), Interdimensional with his [https://imgur.com/a/p44A5lb\
      \ sensory abilities]"
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius (Has trained with Orochimaru in his curse mark use and swordplay
      for three years, having come back during the early parts of Shippuden easily
      [https://imgur.com/a/n7MET4X outperforming] Naruto and Sakura to the point it's
      stated he's left them in the [https://imgur.com/a/kLMYBPA dust]. Naruto also
      acknowledges that he needs to [https://imgur.com/a/yYAoa6F catch up to Sasuke]
      and thus wants to learn a [https://imgur.com/a/SwVs9I0 new jutsu] that'll surpass
      Kakashi. Is such an exceptional fighter he is able to fight hundreds of ninjas,
      [https://imgur.com/a/VnWPNFH avoiding their vitals and having not a drop of
      blood on him], with Orochimaru considering him above himself, a genius in his
      own right at a young age. Sasuke is a rather smart planner and good with noticing
      worthy ninjas, [https://imgur.com/a/g07BAON having planned on recruiting Suigetsu,
      Jugo and Karin] for their individual abilities. Is noted to be good at his curse
      mark use, being able to do [https://imgur.com/a/9euWLyN segmental transformations]
      by Jugo even being compared to Kimimaro. And Sasuke seems to have a decent understanding
      in the science department, utilizing his fire style and amaterasu to form a
      [https://imgur.com/a/dDhZPyU thundercloud]. The [https://imgur.com/a/xdzM85Q
      databook] has noted Sasuke to be resourceful, has a keen ability to observe
      and analyze an opponents power such as when he [https://imgur.com/a/ySW1OFY
      formulated a hypothesis] against Deidara's bomb and will even have [https://imgur.com/a/82Ph6cB
      back up plans formed] if he's wrong. It as well [https://imgur.com/a/xdzM85Q
      states] Sasuke is able to see the path to victory in fights. It also says when
      necessary Sasuke will allow himself to be hurt putting him in a special class
      of shinobi as it shows his resolve and ability to act)
    source_ids: *id002
    confidence: 0.95
