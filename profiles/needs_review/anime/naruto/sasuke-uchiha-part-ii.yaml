- id: claim-weaknesses-a29b3f90
  section: weaknesses
  axis: weakness
  text: "Sasuke is a bit overconfident and short-tempered. He can also easily be manipulated\
    \ emotionally. The Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu\
    \ is [https://imgur.com/gallery/BwAlsIQ limited by the user's physical condition],\
    \ that is to say that the user needs to be physically capable of performing the\
    \ technique they are trying to replicate. They need to meet any physical or chakra\
    \ amount prerequisites the technique in question may have. This ability is also\
    \ [https://imgur.com/d7JHjAk incapable] of [https://imgur.com/b7Ud9vn replicating\
    \ Kekkei Genkai], due to either not possessing the genetic predisposition and/or\
    \ having the necessary chakra natures. Naturally, the user also needs to actually\
    \ see the technique they are attempting to copy, meaning they cannot copy something\
    \ they did not see or is obscured from their line of sight. In fact, the same\
    \ can be said for essentially all of the Sharingan's abilities; they are sight\
    \ based abilities, so if the opponent can obscure the user's vision [https://imgur.com/gallery/vhinaOp\
    \ using extremely thick mist/dust] or blind them, the Sharingan's abilities will\
    \ be rendered useless. Likewise if the opponent is too fast for the Sharingan\
    \ to visually keep track of them, they will be safe from its abilities. Sharingan\
    \ Genjutsu requires eye contact, so if the opponent is able to avoid eye contact\
    \ or is blind, they will be able to avoid Sharingan Genjutsu entirely. Finally,\
    \ the Sharingan's predictive capabilities can be somewhat circumvented by attacks\
    \ that have little to no pattern, such as [https://imgur.com/gallery/kpckaTX Naruto's\
    \ chakra arms] that emerge from any part of his body and attack instinctively.\
    \ | The Mangeky\u014D Sharingan offers far more power than the regular Sharingan,\
    \ but that power comes at a cost. More powerful techniques entail a far higher\
    \ chakra cost, making Mangeky\u014D Sharingan Jutsu extremely taxing to use and\
    \ maintain. Additionally, the Mangeky\u014D Sharingan also causes great strain\
    \ on the user's vision, eventually resulting in complete blindness with continuous\
    \ use. The Susano'o causes its user immense pain \"[https://imgur.com/a/o2QfJSs\
    \ in every cell in their body]\". Incapable of utilizing the Six Paths Chibaku\
    \ Tensei and Majestic Attire Susano'o without Naruto, and cannot utilize the Six\
    \ Paths Susano'o or Indra's Arrow without enslaving all 9 Tailed Beasts inside\
    \ 9 Chibaku Tensei. {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
    \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
    2\" style=\"text-align: left; \""
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-51dc9206
  section: abilities
  axis: hax
  text: "interrogation and restoration, by using the King of Hell. **To interrogate,\
    \ the Naraka Path need only catch hold of a person, causing the King of Hell to\
    \ appear before them. With the victim seemingly paralyzed, the Naraka Path begins\
    \ questioning them. **The second ability the Naraka Path possessed is the ability\
    \ to repair any damage. To do so, the Naraka Path has the King of Hell ingest\
    \ the damaged body with its tendril-like arms into its mouth. Then, after some\
    \ time, the destroyed body will emerge from its mouth, completely rejuvenated.\
    \ *: This grants the user the ability to manipulate attractive and repulsive forces\
    \ with objects and people. However, this gravity controlling power cannot be performed\
    \ in rapid succession. The amount of time required to recharge after use varies\
    \ depending on the scale of the techniques used, five seconds being the bare minimum.\
    \ **: A technique that manipulates attractive force to pull matter towards the\
    \ user at will. It has the same five-second limit as the Shinra Tensei. It is\
    \ possible to attract multiple targets at once, causing them to collide with each\
    \ other. **: The Deva Path's ability to manipulate repulsive force at the user's\
    \ will to push matter or techniques away. **: Deva Path's ultimate technique.\
    \ Hagoromo_\u014Ctsutsuki (Manga) notoriously used it to create the moon and trap\
    \ the Ten-Tails' body inside of it. Sasuke Uchiha is also capable of using this\
    \ technique. He used it to hold all nine Tailed Beasts in captivity. *: A ninjutsu\
    \ using the Rinnegan received from the Sage of Six Paths. Within a specific range,\
    \ the jutsu user can switch himself with the location of a target object in an\
    \ instant. Suppose the user switches himself with other things in close-range\
    \ combat. In that case, the user can evade enemy attacks instantly and can also\
    \ attack by switching himself with a kunai or other weapon. Note 1: \"CS1\" stands\
    \ for Curse Seal Level 1 and \"CS2\" stands for Curse Seal Level 2. Note 2: Due\
    \ to Sasuke having Itachi's eyes, he should be able to replicate all of his brother's\
    \ Sharingan abilities. However, Sasuke has not shown any of these in combat, so\
    \ it must be noted in versus matches that he is allowed to use these powers; otherwise,\
    \ they are unusable."
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
