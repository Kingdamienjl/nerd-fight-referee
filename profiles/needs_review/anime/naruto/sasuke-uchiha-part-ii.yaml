    formulated a hypothesis] against Deidara's bomb and will even have [https://imgur.com/a/82Ph6cB
    back up plans formed] if he's wrong. It as well [https://imgur.com/a/xdzM85Q states]
    Sasuke is able to see the path to victory in fights. It also says when necessary
    Sasuke will allow himself to be hurt putting him in a special class of shinobi
    as it shows his resolve and ability to act)
