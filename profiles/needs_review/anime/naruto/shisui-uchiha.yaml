  intelligence:
    text: Shisui was renowned as one of the most talented shinobi to ever grace the
      Leaf Village and the strongest Uchiha of his time. A child prodigy, his talent
      was so great that he was leading squads as a Jonin at a young age and entire
      squads of shinobi from the Mist Village were ordered to flee from him on sight
      despite their renowned brutality. He possesses remarkable skill in all aspects
      of ninja combat, being proficient in taijutsu, ninjutsu, and genjutsu to the
      point that several Anbu-level ninjas, the equivalent of special-ops forces,
      were required to match even a single one of his techniques. Also, he was noted
      to be particularly humble and perceptive amongst the Uchiha, being open-minded
      enough to see the problems with the Uchiha coup d'etat and possessing enough
      foresight to destroy his own body to prevent others from resurrecting him as
      a tool against the village he swore to protect.
