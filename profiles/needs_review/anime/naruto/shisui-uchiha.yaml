- id: claim-weaknesses-c6120ce4
  section: weaknesses
  axis: weakness
  text: "The Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu is limited\
    \ by the user's physical conditionRin no Sho, pages 192-193, that is to say that\
    \ the user needs to be physically capable of performing the technique they are\
    \ trying to replicate. They need to meet any physical or chakra amount prerequisites\
    \ the technique in question may have. This ability is also incapable of replicating\
    \ Kekkei Genkai, due to either not possessing the genetic predisposition and/or\
    \ having the necessary chakra natures. Naturally, the user also needs to actually\
    \ see the technique they are attempting to copy, meaning they cannot copy something\
    \ they did not see or is obscured from their line of sight. In fact, the same\
    \ can be said for essentially all of the Sharingan's abilities; they are sight\
    \ based abilities, so if the opponent can obscure the user's vision using extremely\
    \ thick mist/dustNaruto Chapter 26 or blind them, the Sharingan's abilities will\
    \ be rendered useless. Likewise if the opponent is too fast for the Sharingan\
    \ to visually keep track of them, they will be safe from its abilities. Sharingan\
    \ Genjutsu requires eye contact, so if the opponent is able to avoid eye contact\
    \ or is blind, they will be able to avoid Sharingan Genjutsu entirely. Finally,\
    \ the Sharingan's predictive capabilities can be somewhat circumvented by attacks\
    \ that have little to no pattern, such as Naruto's chakra armsNaruto Chapter 231\
    \ that emerge from any part of his body and attack instinctively. The Mangeky\u014D\
    \ Sharingan offers far more power than the regular Sharingan, but that power comes\
    \ at a cost. More powerful techniques entail a far higher chakra cost, making\
    \ Mangeky\u014D Sharingan Jutsu extremely taxing to use and maintain. Additionally,\
    \ the Mangeky\u014D Sharingan also causes great strain on the user's vision, eventually\
    \ resulting in complete blindness with continuous use. The Susano'o causes its\
    \ user immense pain \"in every cell in their body\". Kotoamatsukami can only be\
    \ used once each ten years, per eye, unless the user possesses Hashirama Senju's\
    \ cells."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-9408b41b
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics, Chakra Manipulation, Breath\
    \ Attack, Fire Manipulation, Air Manipulation, Electricity Manipulation, Afterimage\
    \ Creation, Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows\
    \ its user to instantly replace themselves with a nearby object such as a tree\
    \ log, plant, person, or clone at the exact moment they are attacked. The Jutsu\
    \ works even if the user is physically restrained or observed by characters as\
    \ observant as Sharingan or Sage Mode users. This creates the optical illusion\
    \ of the user being hit, which confuses the opponent and gives them an opening\
    \ to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto\
    \ Chapter 580Naruto Chapter 674), Statistics Amplification (Shinobi are capable\
    \ of enhancing their physical capabilities with the use of chakra. The Shunshin\
    \ no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in\
    \ their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling\
    \ and Water Walking (By focusing chakra at the soles of their feet, Shinobi can\
    \ scale and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto\
    \ Chapter 90), Minor Illusion Creation and Duplication (With the Clone TechniqueRin\
    \ no Sho, Page 220, Shinobi can create illusionary duplicates of themselves that\
    \ have no physical substance), Shapeshifting (With the Transformation Technique,\
    \ Shinobi can transform themselves into other people, animals, plants, and even\
    \ inanimate objects, such as weapons), Paralysis Inducement (With the Temporary\
    \ Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their\
    \ targets from close to mid range) Enhanced Sight (The Sharingan provides its\
    \ user with an incredible clarity of perceptionNaruto Chapter 26. This allows\
    \ the user to easily keep trackNaruto Chapter 27Naruto Chapter 49 of fast moving\
    \ targets with astonishing clarity. This clarity of vision also allows the user\
    \ to easily perceive and decipherNaruto Chapter 333 hand seals at great speedsNaruto\
    \ Chapter 361, read lipsNaruto Chapter 246, and perceive pencil movements in order\
    \ to mimic themNaruto Chapter 41. The Sharingan can also see chakraNaruto Chapter\
    \ 361 as different colors, even through certain solid obstaclesNaruto Chapter\
    \ 579, and even perceive invisible individualsNaruto Chapter 242 and entitiesNaruto\
    \ Chapter 551. The Sharingan also allows its user to focus their vision and act\
    \ like a microscope, allowing it to see objects on a cellular levelNaruto Chapter\
    \ 361 and clearly perceive virusesBoruto Chapter 41), Analytical Prediction (The\
    \ Sharingan allows its user to clearly anticipate their opponent's next moves\
    \ and flawlessly counter themNaruto Chapter 49. A fully matured Sharingan can\
    \ even see a clear visual image of the opponent's next movesNaruto Chapter 230,\
    \ allowing for efficient evasion and counterattacks without any wasted movements),\
    \ Information Analysis and Power Mimicry (The Sharingan has the ability to \"\
    discern the reality behind any technique\" and then reflect it upon its caster.Naruto\
    \ Chapter 12 This enables the user to read the way a foe weaves seals and determine\
    \ the change in chakra nature and the range of the attack from the color of chakra.Shan\
    \ no Sho, page 45 The Sharingan's ability to acquire and decipher this informationRin\
    \ no Sho, pages 192-193 allows its user to instantly understand, memorize, and\
    \ mimic the opponent's NinjutsuNaruto Chapter 15Naruto Chapter 26, GenjutsuNaruto\
    \ Chapter 141, and TaijutsuNaruto Chapter 67Naruto Chapter 68 with nearly perfect\
    \ accuracy. The Sharingan's ability to see chakra also allows its user to assess\
    \ the opponent's remaining energy levels and their next movesNaruto Chapter 390Naruto\
    \ Chapter 641), Empowerment and Rage Power (The Sharingan is awakened and evolved\
    \ through the awakening and development of the user's negative emotions, such\
    \ as hate, grief, or disappointment. The deeper the hatred or pain, the more powerful\
    \ the Sharingan becomesNaruto Chapter 619), Minor Light Manipulation (The Sharingan\
    \ shines in the darkNaruto Chapter 301), Illusion Reflection (The Sharingan has\
    \ the ability to decipher an opponent's genjutsu, mimic it, and reflect it back\
    \ at its user with the Demonic Illusion: Mirror Heaven and Earth ChangeNaruto\
    \ Chapter 141Naruto Chapter 12T\u014D no Sho, page 274), Illusion Nullification\
    \ (Sharingan users can break free ofNaruto Chapter 141 andBoruto Chapter 3 nullifyNaruto\
    \ Chapter 478 genjutsuSasuke Shinden, Chapter 3Sasuke Shinden, Chapter 4), Minor\
    \ Astral Projection (The Sharingan allows its user to project themselves into\
    \ a target's inner consciousness with a mere gazeNaruto Chapter 308Naruto Chapter\
    \ 501), Illusion Creation (Sharingan Genjutsu allows the user to create elaborate\
    \ illusions upon establishing eye contact with the victimNaruto Chapter 384Naruto\
    \ Chapter 385Naruto Chapter 478), Mind Manipulation (Sharingan Genjutsu allows\
    \ its user to hypnotize its target and control their actions upon establishing\
    \ eye con"
