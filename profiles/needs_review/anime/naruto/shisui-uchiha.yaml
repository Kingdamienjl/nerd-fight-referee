    - field: intelligence
      value: Shisui was renowned as one of the most talented shinobi to ever grace
        the Leaf Village and the strongest Uchiha of his time. A child prodigy, his
        talent was so great that he was leading squads as a Jonin at a young age and
        entire squads of shinobi from the Mist Village were ordered to flee from him
        on sight despite their renowned brutality. He possesses remarkable skill in
        all aspects of ninja combat, being proficient in taijutsu, ninjutsu, and genjutsu
        to the point that several Anbu-level ninjas, the equivalent of special-ops
        forces, were required to match even a single one of his techniques. Also,
        he was noted to be particularly humble and perceptive amongst the Uchiha,
        being open-minded enough to see the problems with the Uchiha coup d'etat and
        possessing enough foresight to destroy his own body to prevent others from
        resurrecting him as a tool against the village he swore to protect.
      source_id: vsbattles-shisui-uchiha-naruto
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "The Sharingan's ability to copy Ninjutsu, and Taijutsu is limited by\
        \ the user's physical conditionRin no Sho, pages 192-193, that is to say that\
        \ the user needs to be physically capable of performing the technique they\
        \ are trying to replicate. They need to meet any physical or chakra amount\
        \ prerequisites the technique in question may have. This ability is also incapable\
        \ of replicating Kekkei Genkai, due to either not possessing the genetic predisposition\
        \ and/or having the necessary chakra natures. Naturally, the user also needs\
        \ to actually see the technique they are attempting to copy, meaning they\
        \ cannot copy something they did not see or is obscured from their line of\
        \ sight. In fact, the same can be said for essentially all of the Sharingan's\
