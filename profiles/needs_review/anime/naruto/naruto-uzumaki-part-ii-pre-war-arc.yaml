  stamina:
    text: "Superhuman (Naruto Uzumaki possesses a superhuman level of stamina, stemming\
      \ from both his Uzumaki lineage and his status as the jinch\u016Briki of Kurama,\
      \ the Nine-Tails. Even without consciously accessing Kurama\u2019s chakra, Naruto\u2019\
      s natural stamina and chakra reserves are vast\u2014so much so that even veteran\
      \ j\u014Dnin have acknowledged his extraordinary stamina, far surpassing their\
      \ own.Naruto Chapter 90 As a descendant of the Uzumaki clan, Naruto inherited\
      \ a extraordinary strong life-forceNaruto Chapter 579 that grants him immense\
      \ vitality, accelerated healing,Naruto Chapter 579 and the ability to endure\
      \ and fight through life-threatening injuries.Naruto Chapter 663 From a young\
      \ age, Naruto was capable of maintaining high-output, chakra-intensive training\
      \ for hours on end, even while struggling with chakra control.Naruto Chapters\
      \ 19\u201322Naruto Chapter 90 He was able to push through internal injuries\
      \ and chakra disruption during battle,Naruto Chapter 102 and performed high-level\
      \ feats\u2014such as summoning giant toadsNaruto Chapter 134 and using advanced\
      \ ninjutsu\u2014despite severe fatigue and damage.Naruto Chapter 103Naruto Chapter\
      \ 168Naruto Chapter 225-238 His tenacity and recovery speed allowed him to outlast\
      \ more experienced opponents and continue fighting without rest. Naruto's stamina\
      \ increased drastically from his earlier years, reaching superhuman levels by\
      \ the time of his Sage Mode training. At Mount My\u014Dboku, he endured extremely\
      \ strenuous physical and mental exercises to synchronize with natural energyChapter\
      \ 418\u2013420\u2014training that would normally take years, yet he completed\
      \ it in a matter of days through sheer endurance and determination. During the\
      \ Pain Invasion, Naruto fought almost entirely alone against the Six Paths of\
      \ Pain, utilizing chakra-intensive techniques such as the Rasenshuriken, multiple\
      \ large-scale summonings,Naruto Chapter 431\u2013433 and successive rotations\
      \ of Sage Mode via Shadow Clones to prolong his effectiveness in battle.Naruto\
      \ Chapter 434\u2013436 Even after exhausting Sage Mode and suffering critical\
      \ injuries, he remained conscious,Naruto Chapter 437 resisted capture, and later\
      \ returned to combat shortly afterNaruto Chapter 439\u2013443)"
    source_ids: *id002
    confidence: 0.8
