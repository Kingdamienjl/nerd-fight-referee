    - field: weaknesses
      value: "The Sharingan's ability to copy Ninjutsu, and Taijutsu is limited by\
        \ the user's physical condition, Rin no Sho, pages 192-193 that is to say\
        \ that the user needs to be physically capable of performing the technique\
        \ they are trying to replicate. They need to meet any physical or chakra amount\
        \ prerequisites the technique in question may have. This ability is also incapable\
        \ of replicating Kekkei Genkai, due to either not possessing the genetic predisposition\
        \ and/or having the necessary chakra natures. Naturally, the user also needs\
        \ to actually see the technique they are attempting to copy, meaning they\
        \ cannot copy something they did not see or is obscured from their line of\
        \ sight. In fact, the same can be said for essentially all of the Sharingan's\
        \ abilities, they are sight based abilities, so if the opponent can obscure\
        \ the user's vision using extremely thick mist/dustNaruto Chapter 26 or blind\
        \ them, the Sharingan's abilities will be rendered useless. Likewise if the\
        \ opponent is too fast for the Sharingan to visually keep track of them, they\
        \ will be safe from its abilities. Sharingan Genjutsu requires eye contact,\
        \ the Sharingan's predictive capabilities can be somewhat circumvented by\
        \ attacks that have little to no pattern, Chapter 231 that emerge from any\
        \ part of his body and attack instinctively. The Mangeky\u014D Sharingan offers\
        \ far more power than the regular Sharingan, but that power comes at a cost.\
