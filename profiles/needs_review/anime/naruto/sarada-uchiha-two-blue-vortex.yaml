    confidence: 0.8
  attack_potency:
    text: "Country level+ physically (Should be as strong as her pre-timeskip self56\
      \ Teratons, 8x Baseline), higher with Chakra Enhanced Strength (Sarada inherited\
      \ her mother's expert chakra control and ability to focus it into enhanced strengthV-Jump\
      \ #9 2019), at least Planet level with Lightning Release (Can damage Hidari\
      \ using Chidori CurrentBoruto Two Blue Vortex : Chapter 12), higher with Chidori\
      \ (The Chidori is a high-speed assassination technique that involves concentrating\
      \ massive amounts of raiton chakra into the user's dominant hand.Boruto NNG\
      \ : Chapter 43 & Naruto : Chapter 113 The compressed chakra greatly amplifies\
      \ the piercing power and speed of the strike, allowing the user to injure characters\
      \ physically stronger than themselves through the attack\u2019s concentrated\
      \ force and velocity,Naruto : Chapter 462 & 463 as shown when she tagged RyuBoruto\
      \ Two Blue Vortex: Chapter 19 and harmed HidariBoruto: Two Blue Vortex Chapter\
      \ 10Boruto: Two Blue Vortex Chapter 11Boruto: Two Blue Vortex Chapter 12713.28\
      \ Zettatons), far higher with Mangeky\u014D Sharingan: Ohirume (Sarada is consistently\
      \ shown one-shotting opponents who took little damage from her previous attacks.\
      \ Examples include her one-shotting RyuBoruto Two Blue Vortex : Chapter 21,\
      \ who survived her Chidori attack that Sarada herself stated was too shallow.Boruto\
      \ Two Blue Vortex : Chapter 19 She has also been shown pulverizing dozens of\
      \ Mamushi clones simultaneouslyBoruto Two Blue Vortex : Chapter 31, despite\
      \ the clones not suffering any decrease in power,Boruto Two Blue Vortex : Chapter\
      \ 27 with Shikamaru believing she is capable of taking out 50 at onceBoruto\
      \ Two Blue Vortex : Chapter 32)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "At least Sub-Relativistic (Should be as fast as her pre-timeskip self0.017976c),\
      \ FTL reactions with Sharingan (Can react to Hidari's Chidori and counterattack\
      \ with her ownBoruto Two Blue Vortex : Chapter 111c), higher with Chidori (The\
      \ Chidori is a technique that dramatically increases the user's speed\u2014\
      so much so that they struggle to perceive or react to their opponents while\
      \ using it.Boruto Naruto Next Generations : Chapter 43 This is particularly\
      \ notable considering that most ninja can already enhance their speed and reflexes\
      \ with the Body Flicker Technique without significant drawbacks. Despite this,\
      \ Minato outright forbade Kakashi from using the Chidori, underscoring its risks.\
      \ The technique\u2019s major drawback\u2014impaired perception at high speed\u2014\
      can only be compensated for with at least a two-tomoe SharinganNaruto : Chapter\
      \ 240), even higher reactions with the Mangeky\u014D Sharingan (The Mangeky\u014D\
      \ Sharingan allows the user to perceive and interpret movements within a significantly\
      \ shorter timeframe than the standard Sharingan, greatly enhancing their reaction\
      \ speedItachi Shinden: Book of Dark Night, Chapter 4)"
    source_ids: *id002
    confidence: 0.8
