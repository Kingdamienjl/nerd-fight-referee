- id: claim-weaknesses-d774b07e
  section: weaknesses
  axis: weakness
  text: 'Turbo-Granny form is not without its drawbacks. Okarun is limited to using
    All-Out for only two sprints, as the intense supernatural speed puts too much
    strain to his human body. Once the limit has been reached, Okarun ends up reverting
    back to normal and left barely able to move for a short period of time. However,
    after further training to adapt to the form, Okarun''s body no longer aches after
    reaching his limit, though this drawback is liable to return if he runs for too
    long. Okarun is also unable to swim since the Turbo-Granny does not possess the
    capabilities to. Notable Attacks/Techniques: *Strengths: Okarun, as an astral
    projection, possesses the ability to fly and is invisible to people who do not
    possess refined control of their spiritual power. In addition to this standard
    ability, Okarun can use the Turbo-Granny''s unique power to teleport to other
    locations through the telecommunication system. This power activates when Okarun
    comes into contact with a phone or telephone line, which results in him being
    sucked in and sent traveling through the telecommunication system until he reaches
    his desired destination. To successfully enter the system, Okarun needs to have
    awareness of the electronic device''s spiral flow and must make use of it. He
    also needs to keep moving within the system using the Turbo-Granny''s immense
    speed, or he will be repelled out. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{discussions}} Category:Characters Category:Dandadan Category:Transformation
    Users Category:Flight Users Category:Damage Boost Users Category:Enhanced Senses
    Users Category:Invisibility Users Category:Incorporeal Characters Category:Teleportation
    Users Category:Anime Characters Category:Primary Protagonists Category:Students
    Category:Teenagers Category:Martial Artists Category:Manga Characters Category:Male
    Characters Category:Good Characters Category:Humans'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ec6f3bea
  section: abilities
  axis: hax
  text: Base= Superhuman Physical Characteristics, Hand-to-Hand Combatant, Transformation,
    Bodily Weaponry (In his turbo-granny form, he sports sharp, claw-like teeth and
    fingernails that are capable of cutting off alien fingers with his mouth), Pseudo-Flight
    (Capable of using All-Out to keep himself and Momo afloat in the air long enough
    to land on city ground by having his legs rotate around his body like a helicopter's
    rotary wingsDandadan, Chapter 6), Damage Boost (Since All-Out comes from the boost
    in leg strength, Okarun is able to launch himself with great force like a missile,
    which is his preferred method of attack), Enhanced Senses (Able to clearly see
    spirits, such as earthbound spirits and yokai), Flight, Invisibility, Incorporeality
    via Astral Body (As an astral projection, Okarun can fly and is invisible to people
    who do not possess refine control of their spiritual powerDandadan, Chapter 93Dandadan,
    Chapter 94), Pseudo-teleportation (Able to use the Turbo-Granny's unique ability
    to teleport to other locations through the telecommunication system) |-|Resistances=
    Resistance to Energy Manipulation & Aura Manipulation (People and yokai with paranormal
    abilities or spiritual power are able to survive being eaten by a yokai. When
    an ordinary person is eaten by a yokai, it causes their aura, which is the battery
    needed to sustain life, to disappear and results in their death), Fire Manipulation
    & Temperature Manipulation (Able to withstand the heat burns of Acrobatic Silky
    hairDandadan, Chapter 14)
  source_ids: *id004
