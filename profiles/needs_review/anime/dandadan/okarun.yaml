    - field: weaknesses
      value: 'Turbo-Granny form is not without its drawbacks. Okarun is limited to
        using All-Out for only two sprints, as the intense supernatural speed puts
        too much strain to his human body. Once the limit has been reached, Okarun
        ends up reverting back to normal and left barely able to move for a short
        period of time. However, after further training to adapt to the form, Okarun''s
        body no longer aches after reaching his limit, though this drawback is liable
        to return if he runs for too long. Okarun is also unable to swim since the
        Turbo-Granny does not possess the capabilities to. Notable Attacks/Techniques:
        *Strengths: Okarun, as an astral projection, possesses the ability to fly
        and is invisible to people who do not possess refined control of their spiritual
        power. In addition to this standard ability, Okarun can use the Turbo-Granny''s
        unique power to teleport to other locations through the telecommunication
        system. This power activates when Okarun comes into contact with a phone or
        telephone line, which results in him being sucked in and sent traveling through
        the telecommunication system until he reaches his desired destination. To
        successfully enter the system, Okarun needs to have awareness of the electronic
        device''s spiral flow and must make use of it. He also needs to keep moving
        within the system using the Turbo-Granny''s immense speed, or he will be repelled
        out. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
