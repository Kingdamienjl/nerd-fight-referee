  name: "\u30AA\u30AB\u30EB\u30F3}}, is the main male protagonist of the manga series\
    \ Dandadan. He is an occult fanatic, mainly a believer in aliens and UFOS, who\
    \ was living an introverted school life until he met Momo and became cursed by\
    \ the Turbo-Granny. Although he managed to lift the curse with her help, Okarun\
    \ now faces the problem of having to search for his missing \"kintama\" (Japanese\
    \ slang for male testicles that literally translates to \"golden balls\") and\
    \ overcome any paranormal obstacles along the way. ==Powers and Stats"
