    - field: intelligence
      value: Above Average. Momo is very perceptive and quick-witted when in tight
        situations. When partnered with Okarun, along with any others, while taking
        on the paranormal, Momo would mainly be the one to come up with clever tactics
        that always seem to work. Based on his sumo appearance, Momo figured out the
        Flatwoods Monster's vulnerability to touching the ground. To temporarily stop
        the Earthbound Spirit Crab from chasing after her and Okarun, Momo lured the
        earthbound spirit into an onsen to stiffen its muscles and devised an effective
        strategy with her grandmother to lure the Turbo-Granny into a trap that almost
        came close to the yokai's demise. During her confrontation with Mr. Mantis
        Shrimp and the Serpod Dover Demon Nessie, Momo was creative in using her psychic
        powers to have Okarun act as a living speed boat to dodge the two alien's
        underwater attacks more easily, rather than to have the both of them swim
        for their lives, and came up with the plan to destroy the Serpod Dover Demon
        Nessie's mantis shrimp arms by using her powers to divide the water the moment
        the fused-alien threw another punch, knowing that mantis shrimps are unable
        to withstand the power of their own punches when out of the water. While having
        a clever way of thinking, Momo's tactics could also be perceive as being dangerous
        and reckless. In order to eliminate the Flatwoods Monster by putting the charm
        back on the torii gate, Momo came up with the plan to have the alien use his
        strength to beat her into the wall blocking the entrance until it created
        a large enough crater to provide space on the outside. After being swallowed
        by Acrobatic Silky, Momo took an extreme measure to have the yokai release
        her, Okarun, and Aira by lighting Acrobatic Silky's hair on fire.
      source_id: vsbattles-momo-ayase-dandadan
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Initially, Momo could only grab on to auras if she could see them in\
        \ plain sight but has since improved ever since her confrontation with the\
        \ Turbo-Granny, now being capable of taking a hold of auras by using her sense\
        \ of touch even if they are concealed from her field of vision. While she\
        \ is still able to use her powers even if her hands are bound, Momo finds\
        \ it difficult to use them effectively. Since Momo's power is an extension\
        \ of her hands, they reflect her own physical strength. While she requires\
        \ no effort to control large targets if they are immobile or willing, Momo\
        \ cannot stop them from resisting and may have trouble holding them down.\
        \ If her target manages to regain mobility through sheer force but has not\
        \ broken the hold, Momo will end up being pulled by their movement as long\
        \ as she keeps her power active. This also applies to targets that are already\
        \ moving at a great velocity, such as a bullet train. Momo, however, used\
        \ this to her advantage against the Turbo-Granny to escape from her. Additionally,\
        \ Momo's psychokinesis is also linked to her sense of touch, meaning that\
        \ her hands are susceptible to the sensation of strain and pain. Resilient\
        \ though they may be, Momo's psychic arms can be destroyed if an opponent\
        \ is strong enough to break free from them through sheer brute strength, or\
        \ if the psychic arms are struck with a strong attack. As a result, Momo will\
        \ feel an immense pain in her hands that will render her unable to manifest\
        \ her powers for an unspecified period of time. Notable Attacks/Techniques:\
        \ {{Nihongo|Moe Moe Tri-Beam|\u30E2\u30A8\u30E2\u30A8\u6C17\u529F\u7832|Moe\
        \ Moe Kik\u014Dh\u014D}}: By forming a heart-shape with her hands and shouting\
        \ \"Moe Moe Tri-Beam!\", Momo is able to fire off a powerful psychic blast\
        \ that is capable of repelling and severely damage her opponents. She first\
        \ used this technique to push back an army of mind-controlled Serpos that\
        \ were charging at her and a second time to obliterate the alien responsible\
        \ with one shot. This technique is inspired by the Moe Moe Kikoho's signature\
        \ Moe Moe Tri-Beam performed by the cafe's waitresses where Momo works. Momo\
        \ Tri Beam.png|Moe Moe Tri-Beam Momo Tri Beam 1.png|Moe Moe Tri-Beam {{Nihongo|Power\
        \ of Words|\u8A00\u970A|Kotodama}}An ability that allows Momo to make things\
        \ that are normally impossible become reality through speech. During her childhood,\
        \ Momo received a training lesson from Seiko to use this ability but never\
        \ managed to succeed. It wasn't until her encounter with a mind-control alien\
        \ that she managed to awaken the power and apply it to her psychokinesis,\
        \ resulting in the creation of the Moe Moe Tri-Beam. Note: *Her subjective\
        \ reality only appeared when her power was awakened. After that, most of her\
        \ powers were sealed, so it's a non-combat ability, and it's unknown how her\
        \ subjective reality works either. *In Physically, she's scaling with Flat-Woods\
        \ Monsters. She can endure multiple attacks without relying on psychic powers.\
        \ But she's scaling with that only in Durability since sometimes she couldn't\
        \ deal with normal people when she didn't use her psychic powers. She was\
        \ caught by 2 female students and tied her hands. Therefore, Attack Potency,\
        \ Striking Strength, Lifting Strength would only be Normal Human. ==Notable\
        \ Matchups== Victories: Losses: Inconclusive: ==References== {{Reflist|2}}\
        \ {{Discussions}} Category:Characters Category:Dandadan Category:Telekinesis\
        \ Users Category:Chi Users Category:Forcefield Users Category:Sealing Users\
