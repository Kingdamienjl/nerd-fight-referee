    - field: intelligence
      value: Above Average. Momo is very perceptive and quick-witted when in tight
        situations. When partnered with Okarun, along with any others, while taking
        on the paranormal, Momo would mainly be the one to come up with clever tactics
        that always seem to work. Based on his sumo appearance, Momo figured out the
        Flatwoods Monster's vulnerability to touching the ground. To temporarily stop
        the Earthbound Spirit Crab from chasing after her and Okarun, Momo lured the
        earthbound spirit into an onsen to stiffen its muscles and devised an effective
        strategy with her grandmother to lure the Turbo-Granny into a trap that almost
        came close to the yokai's demise. During her confrontation with Mr. Mantis
        Shrimp and the Serpod Dover Demon Nessie, Momo was creative in using her psychic
        powers to have Okarun act as a living speed boat to dodge the two alien's
        underwater attacks more easily, rather than to have the both of them swim
        for their lives, and came up with the plan to destroy the Serpod Dover Demon
        Nessie's mantis shrimp arms by using her powers to divide the water the moment
        the fused-alien threw another punch, knowing that mantis shrimps are unable
        to withstand the power of their own punches when out of the water. While having
        a clever way of thinking, Momo's tactics could also be perceive as being dangerous
        and reckless. In order to eliminate the Flatwoods Monster by putting the charm
        back on the torii gate, Momo came up with the plan to have the alien use his
        strength to beat her into the wall blocking the entrance until it created
        a large enough crater to provide space on the outside. After being swallowed
        by Acrobatic Silky, Momo took an extreme measure to have the yokai release
        her, Okarun, and Aira by lighting Acrobatic Silky's hair on fire.
      source_id: mediawiki-4792431
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Momo could only grab on to auras if she could see them in plain sight
        but has since improved ever since her confrontation with the Turbo-Granny,
        they reflect her own physical strength. While she requires no effort to control
        large targets if they are immobile or willing, Momo will end up being pulled
        by their movement as long as she keeps her power active. This also applies
        to targets that are already moving at a great velocity, used this to her advantage
        against the Turbo-Granny to escape from her. Additionally, Momo's psychokinesis
        is also linked to her sense of touch, meaning that her hands are susceptible
        to the sensation of strain and pain. Resilient though they may be, Momo's
        psychic arms can be destroyed if an opponent is strong enough to break free
