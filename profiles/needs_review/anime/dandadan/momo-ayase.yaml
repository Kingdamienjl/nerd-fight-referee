- id: claim-weaknesses-c15f5529
  section: weaknesses
  axis: weakness
  text: "Initially, Momo could only grab on to auras if she could see them in plain\
    \ sight but has since improved ever since her confrontation with the Turbo-Granny,\
    \ now being capable of taking a hold of auras by using her sense of touch even\
    \ if they are concealed from her field of vision. While she is still able to use\
    \ her powers even if her hands are bound, Momo finds it difficult to use them\
    \ effectively. Since Momo's power is an extension of her hands, they reflect her\
    \ own physical strength. While she requires no effort to control large targets\
    \ if they are immobile or willing, Momo cannot stop them from resisting and may\
    \ have trouble holding them down. If her target manages to regain mobility through\
    \ sheer force but has not broken the hold, Momo will end up being pulled by their\
    \ movement as long as she keeps her power active. This also applies to targets\
    \ that are already moving at a great velocity, such as a bullet train. Momo, however,\
    \ used this to her advantage against the Turbo-Granny to escape from her. Additionally,\
    \ Momo's psychokinesis is also linked to her sense of touch, meaning that her\
    \ hands are susceptible to the sensation of strain and pain. Resilient though\
    \ they may be, Momo's psychic arms can be destroyed if an opponent is strong enough\
    \ to break free from them through sheer brute strength, or if the psychic arms\
    \ are struck with a strong attack. As a result, Momo will feel an immense pain\
    \ in her hands that will render her unable to manifest her powers for an unspecified\
    \ period of time. Notable Attacks/Techniques: {{Nihongo|Moe Moe Tri-Beam|\u30E2\
    \u30A8\u30E2\u30A8\u6C17\u529F\u7832|Moe Moe Kik\u014Dh\u014D}}: By forming a\
    \ heart-shape with her hands and shouting \"Moe Moe Tri-Beam!\", Momo is able\
    \ to fire off a powerful psychic blast that is capable of repelling and severely\
    \ damage her opponents. She first used this technique to push back an army of\
    \ mind-controlled Serpos that were charging at her and a second time to obliterate\
    \ the alien responsible with one shot. This technique is inspired by the Moe Moe\
    \ Kikoho's signature Moe Moe Tri-Beam performed by the cafe's waitresses where\
    \ Momo works. Momo Tri Beam.png|Moe Moe Tri-Beam Momo Tri Beam 1.png|Moe Moe Tri-Beam\
    \ {{Nihongo|Power of Words|\u8A00\u970A|Kotodama}}An ability that allows Momo\
    \ to make things that are normally impossible become reality through speech. During\
    \ her childhood, Momo received a training lesson from Seiko to use this ability\
    \ but never managed to succeed. It wasn't until her encounter with a mind-control\
    \ alien that she managed to awaken the power and apply it to her psychokinesis,\
    \ resulting in the creation of the Moe Moe Tri-Beam. Note: *Her subjective reality\
    \ only appeared when her power was awakened. After that, most of her powers were\
    \ sealed, so it's a non-combat ability, and it's unknown how her subjective reality\
    \ works either. *In Physically, she's scaling with Flat-Woods Monsters. She can\
    \ endure multiple attacks without relying on psychic powers. But she's scaling\
    \ with that only in Durability since sometimes she couldn't deal with normal people\
    \ when she didn't use her psychic powers. She was caught by 2 female students\
    \ and tied her hands. Therefore, Attack Potency, Striking Strength, Lifting Strength\
    \ would only be Normal Human. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== {{Reflist|2}} {{Discussions}} Category:Characters Category:Dandadan\
    \ Category:Telekinesis Users Category:Chi Users Category:Forcefield Users Category:Sealing\
    \ Users Category:Enhanced Senses Users Category:Extrasensory Perception Users\
    \ Category:Subjective Reality Users Category:Aura Users Category:Energy Users\
    \ Category:Life Users Category:Memory Users Category:Reality Warpers Category:Humans\
    \ Category:Teenagers Category:Schoolgirls Category:Students Category:Female Characters\
    \ Category:Manga Characters Category:Primary Protagonists"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1627817d
  section: abilities
  axis: hax
  text: 'Base= Superhuman Physical Characteristics, Aura, Hand-to-Hand Combatant,
    Supernatural Willpower, Psychokinesis, Chi Manipulation (With her ki awakened,
    Momo gained access to her spiritual power to perform psychokinesisDandadan, Chapter
    1), Forcefield Creation, Sealing (Can control Turbo-Granny''s curse to prevent
    Okarun from berserk again), Limited Paralysis Inducement (Can immobilize people
    through psychokinesis), Enhanced Senses & Extrasensory Perception (Spiritual power
    grants her the ability to see and sense the auras of living and non-things around
    her.Dandadan, Chapter 4Dandadan, Chapter 5), Aura Manipulation (Along with the
    power to sense auras, Momo''s spiritual power also grants her the ability to exert
    her influence over them to control the movements aura of living and non-things),
    Non-Physical Interaction (Can see and touch spirits, ghost, curses, and aura things
    that cannot be seen by humansDandadan, Chapter 6), Energy Manipulation & Life
    Manipulation & Memory Manipulation (Uses psychic powers to connect with aura,
    life force, and transmit it. Momo''s psychic powers also possess the unique ability
    to peer into the memories of her targetsDandadan, Chapter 16), BFR (By saying
    the word ''Pomade'' ten times, she was able to temporarily expel the evil spirit
    from the human dimension, but the next time she would have to say it 100 times),
    Reality Warping (An ability that allows Momo to make things that are normally
    impossible become reality through speech. Trained by Seiko Ayase, she is able
    to perform Tri-Beam attacks to other dimensionsDandadan, Chapter 85), Resistance
    to Empathic Manipulation (Resistance to Serpo psychokinesis that can control brain
    waves), Energy Manipulation & Aura Manipulation (People and yokai with paranormal
    abilities or spiritual power are able to survive being eaten by a yokai. When
    an ordinary person is eaten by a yokai, it causes their aura, which is the battery
    needed to sustain life, to disappear and results in their death), Fire Manipulation
    & Temperature Manipulation (Able to withstand the heat burns of Acrobatic Silky
    hairDandadan, Chapter 14) |-|Awakening= All previous abilities to a greater extent,
    plus: Purification (Type 2. Able to purify Granny Turbo from Okarun''s body),
    Subjective Reality (When the power awakens all imaginary things can come true)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
