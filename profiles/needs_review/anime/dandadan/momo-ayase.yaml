        \ Reality Users Category:Aura Users Category:Energy Users Category:Life Users\
        \ Category:Memory Users Category:Reality Warpers Category:Humans Category:Teenagers\
        \ Category:Schoolgirls Category:Students Category:Female Characters Category:Manga\
        \ Characters Category:Primary Protagonists"
      source_id: vsbattles-momo-ayase-dandadan
