  name: Shiratori Aira}} is a major supporting character of the manga series Dandadan.
    She is a former popular student at the same high school as Momo Ayase and Okarun
    who serves as one of their main allies whenever the two are faced with the paranormal.
    Initially, Aira developed a chuunibyou-like personality after discovering one
    of Okarun's kintama. She was convinced that her ability to see the supernatural
    after coming into contact with the ball that she believed was sent down from heaven
    and her beauty (which she viewed as being the most important aspect) was a sign
    that she was chosen to protect the world from evil. She accused Momo of being
    a demon and her enemy after seeing her use her psychic powers, which she called
    her "demon wings", to drop a tub on her head and made it her mission to defeat
    her. This personality of hers was soon lost by the time she agreed to help keep
    Jiji from swapping places with the Evil Eye. ==Powers and Stats
