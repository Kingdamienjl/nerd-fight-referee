    - field: weaknesses
      value: "At first, Momo could only grasp auras if she could see them well, but\
        \ she has since improved since her encounter with the Turbo Granny and can\
        \ now use her sense of touch to grasp auras, even if they are hidden from\
        \ her line of sight. *Physical Strength Reliance: Since Momo's power is an\
        \ extension of her hands, they reflect her grip strength. While she requires\
        \ no effort to control large targets if they are immobile or willing, Momo\
        \ cannot stop them from resisting and may have trouble holding them down.\
        \ If her target manages to regain mobility through sheer force but has not\
        \ broken the hold, Momo will end up being pulled by their movement as long\
        \ as she keeps her power active. This also applies to targets that are already\
        \ moving at a great velocity, such as a bullet train. Momo, however, used\
        \ this to her advantage against the Turbo Granny to escape from her. *Direct\
        \ Link to Her Sense of Touch and Pain: Additionally, Momo's psychokinesis\
        \ is also linked to her sense of touch, meaning that her hands are susceptible\
        \ to the sensation of strain and pain. Resilient though they may be, Momo's\
        \ psychic arms can be destroyed if an opponent is strong enough to break free\
        \ from them through sheer brute strength, or if the psychic arms are struck\
        \ with a strong attack. As a result, Momo will feel an immense pain in her\
        \ hands that will render her unable to manifest her powers for an unspecified\
        \ period of time. *Difficulty While Bound/Restricted: While she is still able\
        \ to use her powers even if her hands are bound, Momo finds it difficult to\
        \ use them effectively. Notable Attacks/Techniques: A list of some abilities\
        \ the character generally uses. Note: Self-explanatory ==Explanations== \"\
        Base\" and \"Awakened\" Isn't Correct Terminology: Momo's abilities simply\
        \ don't function that way. What's used to reference \"awakened\" is her awakening\
        \ her latent ability, but she always has this ability in her base form, it's\
        \ simply her at her absolute full strength due to her awakening for the first\
        \ time. As her grandmother put's it, Momo has the ability to reach her full\
        \ power through training to gradually release more and more power, so it isn't\
        \ as if she simply doesn't have access to this power unless she goes into\
        \ a different form, it's more like she isn't experience in using her power\
        \ enough to grasp her true potential strength, therefore labelling them as\
        \ if they are two separate forms isn't the correct way to go about it. ==Gallery==\
        \ Put other pictures of the character here. ==Others== Notable Victories:\
