- id: claim-weaknesses-9bd5f91d
  section: weaknesses
  axis: weakness
  text: 'Jiji, being compassionate, fell victim to the deception of the Evil Eye.
    Despite warnings, even from sources as significant as Turbo-Granny, he remained
    undeterred in his actions.Dandadan, Chapter 40 When he uses The Evil Gun technique,
    it causes him injuries to his hand. Dandadan, Chapter 98 Notable Attacks/Techniques:
    Ha Wave: Jiji has the spiritual power to let his ki flow out to emit an invisible
    burst capable of knocking back anything in his path. He does this by first concentrating
    on channeling his spiritual power to his hands and then thrusting them forward
    while cupped. File:Jiji Emission Ha wave.jpg The Evil Gun: A Power of Words enhanced
    version of the Ha Wave where Jiji utters the words "Evil Gun" to give an increase
    to its attack power, resulting in a powerful beam of energy being shoot out from
    the thrust of his hands. It was first used to attack one of the space globalists
    that was restraining Aira, successfully freeing her. File:Jiji The Evil Gun.png
    The Power of Spiral: After understanding the Power of Spiral, Jiji can unite Ki
    with the power of the Evil Eye, resulting in a larger beam compared to the Evil
    Gun, several times over. File:GbUBqXNOyvI.jpg ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Reflist|2}} {{discussions}} Category:Extrasensory
    Perception Users Category:Reality Warpers Category:Damage Boost Users Category:Transformation
    Users Category:Characters Category:Dandadan Category:Male Characters Category:Manga
    Characters Category:Anime Characters Category:Chi Users Category:Multiple Selves
    Users'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2efb6f3a
  section: abilities
  axis: hax
  text: 'Before accessing Ki= Aura, Extrasensory Perception (Jiji possesses the ability
    to see spirits after encountering the Evil Eye in his previous house.) Resistance
    to Energy Manipulation & Aura Manipulation (People and yokai with paranormal abilities
    or spiritual power are able to survive being eaten by a yokai. When an ordinary
    person is eaten by a yokai, it causes their aura, which is the battery needed
    to sustain life, to disappear and results in their death), Mind Manipulation and
    Biological Manipulation (If an ordinary human gets possessed by yokai, who are
    revered as gods, they will lose their minds, their cells will break down, and
    they will die. However, Jiji is a person with high spiritual power, so he does
    not experience that outcome.Dandadan, Chapter 50), Madness Manipulation (Type
    3; Jiji is unaffected by Tsuchinoko''s psychic wavesDandadan, Chapter 38, which
    can trigger suicide, due to his high spiritual power.Dandadan, Chapter 41) |-|Accessing
    Ki= All previous abilities and resistance, plus: Superhuman Physical Characteristics,
    Ki Manipulation (Jiji has the ability to tap into his ki after being under Seiko''s
    tutelage.), Multiple Selves (Type 2; after being possessed by the Evil Eye.) Transformation
    (After being splashed by cold water, Jiji transforms into the Evil Eye.) Energy
    Projection and Shockwave Creation (Can use his ki to fire invisible bursts of
    energyDandadan, Chapter 79), Limited Attack Reflection (His ki blasts are capable
    of countering and redirecting laser beams from aliens.Dandadan, Chapter 97), Reality
    Warping and Damage Boost (An enhanced version of the Ha Wave called "A Power of
    Words"Dandadan, Chapter 95 is employed by Jiji. He utters the phrase "Evil Gun,"
    enhancing its attack power. This results in a powerful beam of energy being shot
    out from the thrust of his hands.Dandadan, Chapter 97) Resistance to Heat Manipulation
    (Can tolerate heat from aliens that can quickly evaporate water)'
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
