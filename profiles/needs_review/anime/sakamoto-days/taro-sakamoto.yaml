        weapons such as guns, bombs and bladesSakamoto Days 1 and been an expert marksman
        since as early as 14Sakamoto Days 10. Aoko stated Sakamoto can use anything
        in site as a weapon including food, utensils, everyday objects and appliances
        as weaponsSakamoto Days 107, and uses his surroundings or whatever is on hand)
        *Vehicular Mastery (Displayed skillful motorcycle driving skills) *Social
        Influencing (Charisma - Sakamoto was popular amongst the female students as
        he would frequently get boatloads of Valentine''s gifts and chocolates in
        droves) *Accelerated Development (Battle - Stated he was getting used to Kindaka''s
        speedSakamoto Days 110 when he couldnt react to him beforeSakamoto Days 109)
        *Adaptation (Can adapt 100 meters underwater and fought off multiple sharks
        100 meters undersea as part of his training and developed better lung capacitySakamoto
        Days 16) *Stealth Mastery (Able to sneak through a building and take out a
        few people without them noticing) *Photographic Memory (While he did not recognize
        Boiled initially, he remembered the exact composition of his bombs with one
        look at his paper years ago) *Extrasensory Perception (Blocks an invisible
        punch inches away from him and grabs the assassin before they can reactSakamoto
        Days 20) *Smoke Manipulation (With smoke bombs) *Status Effect Inducement
        (Statistics Reduction - Blinds an opponent using pencil lead and a stickerSakamoto
        Days 29) *Electricity Manipulation (With taser) |-|Prime/JAA/The Order= All
        previous abilities but far enhanced including, *Social Influencing **Reputation:
        - Up until his retirement Sakamoto was widely feared as the strongest assassin
        in history. *Aura (Overwhelming - His very presence is stated to be like a
        "powerful weapon". Fear Inducing - Just from his Skinny form appearing Boiled
