- id: claim-powers-and-abilities-1e854c1d
  section: abilities
  axis: hax
  text: 'JCC= Sakamoto has mostly the same abilities in all keys excluding Illusion
    Creation which all are a result of his experience as an assassin. *Superhuman
    Physical Characteristics *Master Martial Artist, Expert Acrobat, Instinctive Reaction,
    Pressure Points Knowledge, and Enhanced Senses (Has been said by multiple different
    assassins that he is the greatest assassin in the world. Trained by Etsuko Satoda;
    a retired assassin famous for her martial arts. Was able to accurately block a
    speeding bullet with a cough drop. Blocked an attack from an opponent wearing
    an invisibility suit) *Weapon Mastery, and Weapon Creation, and Explosion Manipulation
    (Expert in using assassination weapons such as guns, bombs and bladesSakamoto
    Days 1 and been an expert marksman since as early as 14Sakamoto Days 10. Aoko
    stated Sakamoto can use anything in site as a weapon including food, utensils,
    everyday objects and appliances as weaponsSakamoto Days 107, and uses his surroundings
    or whatever is on hand) *Vehicular Mastery (Displayed skillful motorcycle driving
    skills) *Social Influencing (Charisma - Sakamoto was popular amongst the female
    students as he would frequently get boatloads of Valentine''s gifts and chocolates
    in droves) *Accelerated Development (Battle - Stated he was getting used to Kindaka''s
    speedSakamoto Days 110 when he couldnt react to him beforeSakamoto Days 109) *Adaptation
    (Can adapt 100 meters underwater and fought off multiple sharks 100 meters undersea
    as part of his training and developed better lung capacitySakamoto Days 16) *Stealth
    Mastery (Able to sneak through a building and take out a few people without them
    noticing) *Photographic Memory (While he did not recognize Boiled initially, he
    remembered the exact composition of his bombs with one look at his paper years
    ago) *Extrasensory Perception (Blocks an invisible punch inches away from him
    and grabs the assassin before they can reactSakamoto Days 20) *Smoke Manipulation
    (With smoke bombs) *Status Effect Inducement (Statistics Reduction - Blinds an
    opponent using pencil lead and a stickerSakamoto Days 29) *Electricity Manipulation
    (With taser) |-|Prime/JAA/The Order= All previous abilities but far enhanced including,
    *Social Influencing **Reputation: - Up until his retirement Sakamoto was widely
    feared as the strongest assassin in history. *Aura (Overwhelming - His very presence
    is stated to be like a "powerful weapon". Fear Inducing - Just from his Skinny
    form appearing Boiled felt a sense of "foreboding" and was frozen in place unable
    to move) |-|Retired/Fat Body= Pre-Mina''s Enhancements Same as before but only
    scales to 30% of his Prime *Body Control and Statistics Amplification (Can burn
    calories quick enough to revert back to his skinny form while in combat. Immediately
    regains his fat form after eating overnight. Accumulated damage can also trigger
    the transformation. Sakamoto couldnt land any hits on Boil in his fat form but
    after burning calories, his is punch is too fast for BoiledSakamoto Days 12. Immediately
    regains his fat form after eating overnight) *Limited Explosion Manipulation (Used
    Boiled''s bombs to enhance his AP) *Limited Illusion Inducement (Caused Boiled
    to hallucinate his brutal death when confronted by Skinny Sakamoto) *Regeneration
    (Low - When transforming into his fit form, he looked like he healed his initial
    injuries caused by Boiled) *Preparation (Has a secret stash of weapons and equipment.
    Equipped Shin''s gun and his store''s nametags with trackers. His store is laced
    with booby traps) *Damage Reduction (His apron is shown to be able to defend people
    from an explosion) Post-Mina''s Enhancements Same as before, without Illusion
    Creation |-|Resistances= *Telepathy (Shin cannot read his thoughts likely when
    Sakamoto empties his mind) *Extreme Temperatures (Completely relaxed in a flaming
    sauna with temperatures enough to cause spontaneous combustion, also considers
    a cold bath at 1 Celsius tepid) *Poison Manipulation (Resisted Kobayashi''s poison
    and choked him to unconsciousness) *Explosion Manipulation (Can resist Boiled''s
    bombs and use them to enhance his AP)'
