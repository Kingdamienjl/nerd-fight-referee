        of combat, he applies his assassin skills with remarkable precision and subtlety,
        becoming a well-regarded jack-of-all-trades within his community and a caring,
        "legendary" father to his daughter, Hana. He also appears to possess photographic
        memory, having recalled the exact chemical composition of Boiled's explosives
        despite only glimpsing it years prior.
