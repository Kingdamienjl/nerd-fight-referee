- id: claim-powers-and-abilities-e445471a
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Superhuman Physical Characteristics
    **Enhanced Senses (Awareness: Uzuki is capable of handling Takamura, one of the
    strongest assassins who is capable of cutting down large structures with ease
    in a split second. This allowed him to rescue Gaku from him) *Multiple Selves
    (Type 1: Uzuki suffers from Dissociative Identity Disorder, a condition which
    developed as a way for Uzuki to deal with the trauma. This condition allows Uzuki
    to create multiple personas, changing his own characteristics to match those of
    a specific individual; these personas remain even after the person they''re based
    on dies and are so accurate that even other people who were close to the person
    whom Uzuki is emulating have trouble telling the difference, an example of this
    would be Sakamoto and Nagumo who admitted that Uzuki''s Rion persona resembled
    their old friend so closely that it''s hard to distinguish between the real Rion
    and Rion-Uzuki. Since the death of Haruma, Gaku''s unknown fate, and the seeming
    assimilation of the Takamura personality, Uzuki has become a jaded and uncaring
    individual, a shell of his former self. He seemingly no longer cares about his
    foster siblings, letting the Rion Akao personality influence his opinions on Tenkyu
    and is fixated on the goal of destroying the Japanese Association of Assassins
    no matter the cost. Uzuki can also mimic, if not outright replicate, the individual''s
    mannerisms and capabilities as well. An example of this can be seen with his Takamura
    personality who not only mutters unintelligibly just as the real Takamura did
    but is also a master swordsman, being able to match and eventually cut down the
    real Takamura despite Uzuki having not shown any proficiency with wielding a katana
    up to that point in the series) **Technique Mimicry and Accelerated Development
    (Under extreme stress, Uzuki can adopt the persona and skills of people he knows.
    Uzuki spontaneously creates Takamura''s personality inside his own head, gaining
    Takamura''s exact mannerisms, physicals, and swordsmanship at point-blank range
    and catching Takamura off-guard. or the tactical, precognitive fighting style
    of Rion) **Analytical Prediction via Rion personality **Information Analysis via
    Rion personality **Status Effect Inducement (Shin''s life flashes before his eyes
    when he reads Slur''s mind) *Martial Arts (Similar to Sakamoto and Nagumo, Uzuki
    also attended the JCC and learned CQC) *Weapon Mastery (He primarily uses a versatile
    segmented sword-whip that functions as both a close-quarters blade and a mid-range
    whip. He later adds Takamura''s katana to his arsenal after developing a persona
    based on the legendary assassin. His weapons are characterized by their ability
