    - field: standard_equipment
      value: '*Multi-Tool: Nagumo uses a large multi-tool weapon that has six different
        functions. In the past, he carried each blade separately under his trench
        coat. The weapons contained inside his large multi-tool weapon include: *Multiple
        Blades: There are multiple fold and pop-out blades contained within Nagumo''s
        large multi-tool weapon. One of his blades doubles as a can opener at parties.
        *Dual Swords: Inside his large, multi-tool weapon, Nagumo carries a pair of
        sharp and detachable swords. These swords are sharp enough to pierce through
        the roof of a car and durable enough to withstand powerful blows from Yotsumura.
        *Scythe: A scythe that Nagumo held along with his other weapons. He used it
        during his fight against Gaku, primarily to distract him from Nagumo''s invisible
        blade. *Axe: Nagumo''s weapon can transform into a durable axe that he used
        during his fight against Gaku to send him crashing into the wing of an airplane.
        The back side of the axe is flat, which confused Gaku about whether the weapon
        was an axe or a hammer. *Invisible Blade: A disposable yet sharp blade, made
        entirely of ceramic, with the peculiar characteristic of being almost invisible.
        By distracting Gaku with his other weapons, Nagumo managed to sneak the ceramic
        blade out and stab him. It is stated that the blade only works once, as it
        becomes visible after being soiled with blood. *Dice: Nagumo uses some dice
        to decide which blade he will kill his enemy by, or to distract his enemy
        to deliver a devastating blow. *Several Pistols *Assassin Knife'
      source_id: vsbattles-shishiba
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Genius in combat. Nagumo is an ex-member of the Order and one of the
        strongest assassins in Japan. As a student Nagumo was one of the three greatest
        prospects to ever step foot into the JCC alongside Taro Sakamoto and Rion
        Akao. Kindaka a founding member of the Order stated that the three of them
        could be future leaders of the assassin world. In current time, Slur considered
        Nagumo as one of the top two fighters in the Order, and thus the second strongest
        assassin in the JAA. Granny Miya stated that he is currently stronger than
        Taro Sakamoto due to the latter''s five year-long retirement. Kashima, a powerful
        assassin working for Slur, classified Nagumo as an S-rank target on the hit
        list he created. Taro Sakamoto, "the legendary hitman" himself, even stated
        that it would take a lot for Nagumo to lose a fight. Due to his exceptional
        combat abilities, he was able to put Gaku, one of Uzuki''s strongest subordinates
        on the brink of death after engaging him in battle. Nagumo was a part of the
        intelligence-gathering department during his younger days at the JCC. He is
        a highly perceptive individual, quickly able to deduce Kindaka''s theory of
        a spy existing within the JAA''s organization without the latter even saying
        anything, and was also able to quickly notice that Erio Muto, a JAA executive,
        was a spy working for Slur. His intellect and planning is partly what makes
        him such a deadly fighter, as he''s able to stay one step ahead of his opponent
        through deception and schemes. Nagumo can use morse code, as shown when he
        uses the signal lights of a moving vehicle to tell Shishiba that he was "killing".
        Standard Tactics: Nagumo is easygoing and carefree, even in the middle of
        intense battles, once claiming to enjoy the wind in his hair as he stabbed
        a man in the arm. He is also very playful with his opponents, as demonstrated
        multiple times. For instance, he evades and tricks Minimalist, a hardened
        serial killer, before handing him some dice to decide which of his blades
        he''d die by. Another example is during his fight against Gaku, where he asked
        the latter if he liked Bruce Lee after being hit with a one-inch punch. However,
        when it comes to matters involving his friends, Nagumo tends to reveal his
        true emotions. One such instance is when he shoves Uzuki out of Takamura''s
        path, wondering why he saved the villain despite Uzuki''s murders, influenced
        by the fact that a part of Rion Akao still resided in Uzuki''s body. In fact,
        Nagumo has shown deep care for his old friends Sakamoto and Rion since their
        time at the JAA, still thinking about her even after she was confirmed dead.
        This is also confirmed in their encounter during the Assassin Exhibition of
        the Century Arc, where, once Rion took control over Uzuki''s body and spoke
        to him, Nagumo immediately recognized Rion''s personality and questioned her
        identity. Rion Akao states that Nagumo does everything with coordination and
        skill, which makes him a deadly combatant. This was made evident in his fight
        against Gaku; despite being outmatched in physical ability, Nagumo was able
        to defeat him with his combat skill and trickery. His combat skill was stated
        by Slur to be among the top two in the Order.'
      source_id: vsbattles-shishiba
