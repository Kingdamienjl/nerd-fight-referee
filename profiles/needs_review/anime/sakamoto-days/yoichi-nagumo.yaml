- id: claim-standard-equipment-88bc84c1
  section: equipment
  axis: equipment
  text: '*Multi-Tool: Nagumo uses a large multi-tool weapon that has six different
    functions. In the past, he carried each blade separately under his trench coat.
    The weapons contained inside his large multi-tool weapon include: *Multiple Blades:
    There are multiple fold and pop-out blades contained within Nagumo''s large multi-tool
    weapon. One of his blades doubles as a can opener at parties. *Dual Swords: Inside
    his large, multi-tool weapon, Nagumo carries a pair of sharp and detachable swords.
    These swords are sharp enough to pierce through the roof of a car and durable
    enough to withstand powerful blows from Yotsumura. *Scythe: A scythe that Nagumo
    held along with his other weapons. He used it during his fight against Gaku, primarily
    to distract him from Nagumo''s invisible blade. *Axe: Nagumo''s weapon can transform
    into a durable axe that he used during his fight against Gaku to send him crashing
    into the wing of an airplane. The back side of the axe is flat, which confused
    Gaku about whether the weapon was an axe or a hammer. *Invisible Blade: A disposable
    yet sharp blade, made entirely of ceramic, with the peculiar characteristic of
    being almost invisible. By distracting Gaku with his other weapons, Nagumo managed
    to sneak the ceramic blade out and stab him. It is stated that the blade only
    works once, as it becomes visible after being soiled with blood. *Dice: Nagumo
    uses some dice to decide which blade he will kill his enemy by, or to distract
    his enemy to deliver a devastating blow. *Several Pistols *Assassin Knife'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
