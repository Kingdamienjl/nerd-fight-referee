    - field: weaknesses
      value: 'A bit overconfident, if he overuses his magoi, he reverts to his base
        form, The over usage of the Sacred Palace for swapping the ranks of gods causes
        depletion of its magoi which eventually leads to its collapse. Feats:, Sinbad''s
        Lightning Sword (City level), Casually destroyed a mountain range when he
        was just a teenager (City level), His Metal Vessel Baal is the Lightning Djinn
        that Sinbad obtained when he conquered the 1st Dungeon. Baal is the Djinn
        of Wrath and Heroes. This Djinn dwells in the sword he carries with him. He
        can attack with the element of lightning by his Metal Vessel. :Djinn Equip:
        In this form, Sinbad takes on the appearance of a dragon and gets two horns
        and a jewel on his forehead and an elaborate necklace along with blue scale-like
        armor over parts of his body and a long tail. In this equip, Sinbad gains
        the sword of Baal, Bararaq Saiqa. The sword has a guard around the hilt similar
        to that of the claw of Baal with blue scales. :, Bararaq Saiqa (Lightning
        Sword): Sinbad draws lightning from the sky to his sword, where it is stored
        and eventually used to blast the enemy with lightning powerful enough to hurt
        the Medium, Bararaq Inqerad-Saiqa (Lightning Sword of Extinction): When this
        Extreme Magic is used, the Djinn Focalor is the Wind Djinn that Sinbad obtained
        when he conquered the 41st Dungeon. Focalor is the Djinn of Rule and Submission.
        This Djinn dwells in the silver bracelet on his right arm. :Djinn Equip: In
        this form, Sinbad takes on the appearance of a bird, with dark feathers covering
        various parts of his body. His hair grows longer and is feather-like at the
        ends. He is adorned with a golden collar and gains a third eye on his forehead.
        He can control the wind in a form of tornadoes from the palms of his hands.
        :, Foraz Zora (Cleaving Wind): Sinbad uses this attack to summon two wind
        tornadoes around his hands, then combines them over his head, throwing down
        an enormous tornado that can destroy a mountain. He is also able to manipulate
        wind on a smaller scale, Metal Vessel Zepar is the Sound Djinn that Sinbad
        obtained when he conquered the 16th Dungeon. This Djinn dwells in the ring
        on Sinbad''s middle finger. :Djinn Equip: In this form, Sinbad takes the appearance
        of a small imp with dragon wings, tail and three eyes. He can perform an incredibly
        loud scream able to "command" others into doing something. When used on Kougyoku,
        he told her mind to sleep. Sinbad has stated that because it is a tasteless
        move, it affects everyone in the vicinity to some degree. Not only can he
        do that, but he can also control other people''s minds by using a special
        type of sound wave. He does this by forcing his own Rukh into their bodies.
        Sinbad had done this with Kougyoku during their fight and to two other unknown
        people, Metal Vessel :Djinn Equip: In this form, Sinbad takes the form of
        a nine-tails fox with white fur. His hair changes to white and lengthens.
        His ears also elongate and look like the ears of a fox. He also gains eyes
        on his palms which allows him to use Valefor''s true ability by releasing
        some sort of waves., Stagnation: The ability to stop molecules and restrict
        a substance''s movement. This includes the ability to generate ice, which
        is done by stopping the movement of water molecules in the air and then manipulating
        them from a liquid or gas state to solid form. By using it on opponent Sinbad
        can separate a person''s sensation from the surroundings and slow down their
        movement as much as possible. Because of this, even the opponent''s thoughts
        are slowed down'
      source_id: vsbattles-sinbad-magi
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Weapon Mastery, Martial Arts, Magoi
        Manipulation, Limited Precognition (As a Singularity Sinbad can see the threads
        of destiny and guide others along), Limited Power Nullification (Against magic,
        via Magoi manipulation), Divine Protection (Singularities are blessed by the
        Gods allowing Sinbad to escape another realm. Because of this controlling
        a singularity is next to impossible. Sinbad was also protected by the Gods
