- id: claim-powers-and-abilities-6781ca3e
  section: abilities
  axis: hax
  text: 'Base= Superhuman Physical Characteristics, Skilled Spear User, Magoi Manipulation,
    Non-Physical Interaction (only in Spirit Form), Acausality (Type 4; Is Fallen),
    Resistance to Mind Manipulation, Soul Manipulation (Due to falling into depravity,
    Hakuryuu is separated from the Great Flow, and was thus unaffected by Sacred Palace
    Sinbad rewriting the Ruhk which governs souls and fate and altered the minds of
    the planet''s population), Earth Manipulation and Life Manipulation (Due to wielding
    metal vessels of Life and Earth, he should have resistance to attacks of that
    nature, similar to how Alibaba was resistant to fire and heat based attacks).
    |-|Djinn Equip: Zagan= All prior in addition to Magic, Empathic Manipulation (He
    can plant seeds in people''s brains which increase their anger and hatred and
    remove their fear), Plant Manipulation (Controls plants and their growth), Life
    Manipulation (Zagan has the power to manipulate plants and living organisms. In
    the wake of his white blade living organisms submit to his will.), Fungus Manipulation,
    Biological Manipulation (Alters the biology of living things, such as turning
    microscopic bacteria into giant monsters or arrows), Earth Manipulation (It has
    been stated by Zagan that he controls earth), Matter Manipulation (Controls bacteria
    to decompose organic matter), Absorption (His metal vessels allow him to absorb
    Magoi from the phenomena of life and earth), Healing (Zagan can be used for healing
    wounds.) |-|Djinn Equip: Belial= Life Manipulation (Belial''s magic is life magic),
    Illusion Creation (He can create illusions), Memory Manipulation (He can implant
    false memories and erase existing ones), Perception Manipulation (He can destroy
    the five senses of those who hear the roar of Belior Zauto. His attacks with Belial''s
    Scythe do not physically damage the body, but instead permanently sever the senses
    connected to the damaged body part by sending the senses to another dimension,
    making it impossible to use the damaged limbs and body parts), BFR, Soul Manipulation
    (Should his scythe strike the head it sends the victim''s soul to another dimension
    and leaves their body comatose and dying). Paralysis Inducement(The parts or limbs
    cut off by Hakuryuu''s weapon are not damaged, but the person who owns those limbs
    can never use the severed limb again. We see this in Alibaba vs Hakuryuu. It is
    confirmed by Hakuryuu that Alibaba cannot move his cut leg again.)'
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
