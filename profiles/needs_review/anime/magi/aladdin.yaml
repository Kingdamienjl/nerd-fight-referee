      value: 'Used to be passive, usually doesn''t attempt to kill opponents. Notable
        Attacks/Techniques: Borg: A magical energy shield that blocks physical and
        magic attacks. This is one of the most basic skills for any mage. Ugo: Aladdin''s
        djinn. Ugo is a very powerful, fast and durable djinn that can use heat magic.
        Fire Magic: Aladdin being adept in the 1st rukh allows him to use fire magic.
        *Harhar Infigar (Scorching Heat Double Palms): Aladdin shoots a widespread
        blast of heat magic from his staff. This can also be combined with other magic
        to make it stronger. *Harhar Rasars (Scorching Heat Consecutive Bullets):
        Aladdin summons multiple miniature fireballs. Aladdin can control these individually,
        and they explode on contact. Water Magic: Aladdin being adept in the 2nd type
        of rukh allows him to use water magic. *Harhar Raaki (Evaporation Baptism):
        This is a composite magic that combines both heat and water magic. It heats
        the water inside of the body and boils it from the inside. It can be used
        on multiple bodies at once. *Sharrar Raaki (Water Mirror Mirage): A magic
        that creates a mirage by generating the refraction in light with the high
        temperature steams. Wind Magic: Aladdin being adept in the 5th type of rukh
        allows him to use wind magic. *Asfal Riff (Piercing Wind): A magic that forms
        a tornado that expands as time goes on. Light Magic: Aladdin being adept in
        the 3rd type of rukh allows him to use light magic. *Flash (Ray of light):
        A beam of light that attacks the opponent. Lightning Magic: Aladdin being
        adept in the 4th type of rukh allows him to use lightning magic. *Ramuzu (Thunder):
        Aladdin summons a ball of lightning and hurls it at the foe. Gravity Magic:
        Another key basic for mages. *Flight/Levitation: Allows Aladdin to fly at
        great speeds and stand in mid-air. *Golems: Using the gravity magic, Aladdin
        can manipulate sand, dirt, ground, etc to form Golems. (3 in all) They''re
        capable of breaking the borg shields of Titus. Aladdin can also channel Harhar
        Infigar through them making it more powerful. Sound Magic: Aladdin being adept
        in the 6th type of rukh allows him to use sound magic. Clairvoyance Magic:
        Aladdin can use this Magic and project his memories from the rukh in his blood
        as images but he hasn''t mastered it yet. Strength Magic: *Dhoruf Sabaha (Thrust
        Reaction or Gravity Reaction): By manipulating the dhorrs (powers) into certain
        reils (pathways), he can alter the fundamental laws of physics to repel attacks.[70]
