    - field: weaknesses
      value: "Physically weak and has a cocky attitude. Feats: Casually destroyed\
        \ the outskirts of an island. (City level) Notable Attacks/Techniques: Borg:\
        \ It is said that this is proof that one can do magic. It is a defensive move\
        \ that blocks out attacks with evil intent. It blocks out all physical attacks\
        \ and magic to a certain degree. Ice Magic: Judar is able to order water around,\
        \ then freezes it into large Ice Shards. * Thalg Al-Salos (Rain Of Ice Spears):\
        \ Judar creates a huge ice shard and can shed it to many other pieces to send\
        \ it to wherever he wants. Wherever it touches, it freezes that area completely.\
        \ * Thalg Thalgeyya (Pursuing Ice Dragons): Judar combines his Ice Magic with\
        \ Wind Magic to create several ice tornadoes that pursue his opponents. Gravity\
        \ Magic: Judar is able to use Gravity Magic where it appears like he is flying,\
        \ by manipulating gravity. He is also able to use it to push people away with\
        \ tremendous force. Lightning Magic: Judar can turn his Magoi into Lightning\
        \ Magic. During the summit in Sindria, he used Black Rukh to summon black\
        \ lightning with his 'new' power. * Ramz Al-Salos (Downpour of Thunder Lances):\
        \ Judar is able to use Black Rukh to summon black lightning and manipulate\
        \ it. * Ill-Ramz Al-Salos (Black Rain of Spears): Judar makes black thunder\
        \ strike from the sky on his opponents. Wind Magic: Judar also showed using\
        \ wind magic when he invaded Sindria. He created a small tornado to attack\
        \ Ja'far. Space\u2013Time Magic: Judar was able to use space and time magic\
        \ to transport himself to another place without the divine protection of a\
        \ Djinn although due to this new ability, it tires him out greatly. Isolation\
        \ Barrier (\u7D76\u7E01\u7D50\u754C, Zetsuen Kekkai): Judar is able to create\
        \ a large, black-colored \"Isolation Barrier\" which stops the flow of Magoi\
        \ to inhibit casting spells inside the barrier. All spells cast before the\
        \ barrier lose their power and any Magician or Djinn User becomes unable to\
