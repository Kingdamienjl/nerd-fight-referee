        * Justice On and Justice Tornado: After jumping onto his opponent''s shoulder
        (Justice On) Toppo begins spinning at an extremely high speed to disorientate
        them (Justice Tornado). * Justice Crusher: While his adversary is distracted
        Toppo grabs their arm and dislocates their shoulder. * Justice Flash: Toppo
        extends one arm, grabs it with another then unleashes a barrage of Ki blasts
        from his finger tips. * Justice Rear Naked Choke: Toppo grapples his opponent
        from behind and starts to squeeze them until all of their bones are broken
        or until they are rendered unconscious. * Destruction: Due to his status as
        a God of Destruction Candidate, possessing a God of Destruction''s full power,
        Toppo is capable of erasing nearly anything with little effort, although he
        must charge this energy before using it. By extending one of his hands in
        front of him and uttering "Destroy", Toppo causes the object he focuses on
        to disintegrate, potentially erasing them from existence entirely. This is
        even shown to work on spirits/souls, as it was used to kill Dr. Mashirito,
        who was a ghost. Toppo can also use this energy to form an aura, erasing any
        attacks that get near him and making him extremely difficult to damage.'
