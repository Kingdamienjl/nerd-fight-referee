    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Alibaba is a very talented swordsman. He spent a lot of his childhood
      being trained in Balbadd Royal Swordplay. Balbadd Royal Swordplay is similar
      to Saber Fencing, where you put your unused hand behind your back, or against
      your chest, while using your one handed sword, as to protect a potential vulnerability
      or keep it out of the way. However, Alibaba utilizes his other hand as support
      for more agile and swift dodges In his fight against Jamil, he was able to easily
      read and dodge all of Jamil's moves, and call out his every opening, just as
      Jamil's master had done to him. Despite learning Royal Swordplay for years,
      he was still bested by a very casual Alibaba. Alibaba was also taught by Sharrkan,
      another extremely powerful master swordsman. Alibaba was able to also utilize
      Sharrkan's fighting style on top of his normal sword style, The Crawling Sword
      Style, which is described to be snake-like and very hard to predict against
      Toto. He managed to defeat her while she was using Magoi Manipulation to reinforce
      her strikes, and Alibaba not even using his Dijin Weapon equip. Alibaba is also
      very intellectually gifted. He was given a high level of education possible
      in the Royal Palace of Balbadd after the king adopted him. He knows difficult
      languages like the Torran Language and possesses high knowledge. He also solved
      the problems of a country on the verge of bankruptcy and helped create new laws
      using his skills in politics and trading and his way of communicating with others.
      After his time in the Dark Continent, he has gained a plethora of knowledge
      from the Alma Torran magicians of that age. At that time he also gained the
      ability to increase his concentration in order to think faster and get more
      information far faster than a regular human, this allowed him to go through
      all documents related with the Kou Empire, a normal human would need several
      years for this feat while Alibaba managed it in less than two weeks)
    source_ids:
    - vsbattles-alibaba-saluja-magi
    confidence: 0.6
    notes: auto_repair source extraction
