- id: claim-weaknesses-95564f97
  section: weaknesses
  axis: weakness
  text: 'Overusing his magoi reverts him back to base. Notable Attacks and Techniques:
    Amon royal sword.png|His Metal Vessel AmolBerka.gif|Amol Berka Amol Dherrsaiqa.gif|Amol
    Dherrsaiga Amol Al-Bador Saiqa.gif|Amol Al-Bador Saiga Amon: The Djinn of Posterity
    and Politeness, he grants Alibaba the ability to control fire in a number of different
    ways. * Amol Berka (Amon''s Wall): Alibaba creates a wall of flames to either
    block attacks or keeps people away. * Amol Dherrsaiqa (Amon''s Roaring Flame Sword):
    Alibaba projects a massive vortex of flames from his sword. * Amol Al-Bador Saiqa
    (Flame Minister''s Beheading Sword): Alibaba''s Extreme Magic. Summons a giant
    figure made of flames wielding a sword also made of flames; the sword can pierce
    almost anything. Against Hakuryuu this summoned a giant phoenix rather than a
    humanoid figure. * Life Review: Alibaba spent 100+ years as a disembodied consciousness
    in a doll body that was extremely difficult to control, he had to get used to
    the dangers of Dark Continent in the doll form. When he came back to his human
    body his body could perceive things at terrifying speed. He could now see things
    in super-slow motion when he wants to or when his body is in danger. This allows
    for an instant to last an eternity for Alibaba. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{discussions}} Category:Characters Category:Magi Category:Sword
    Users Category:Male Characters Category:Anime Characters Category:Protagonists
    Category:Good Characters Category:Heroes Category:Orphans Category:Fire Users
    Category:Flight Users Category:Manga Characters Category:Humans Category:Magic
    Users Category:Weapon Masters Category:Absorption Users Category:Energy Users
    Category:Time Users Category:Royal Characters Category:Non-Physical Interaction
    Users Category:Married Characters Category:Adults Category:Social Influencers
    Category:Statistics Amplification Users'
