  stamina:
    text: Superhuman (He's able to survive an attack from a Kou experiment monster,
      who's equivalent to Masrur, who could kick someone through a forest. He's also
      able to take internal damage and continue fighting. He also keeps on fighting
      after suffering from multiple serious injuries including his arm being bitten
      and broken. He's even able to continue fighting even when he's exhausted and
      running out of magoi. He can maintain his sanity after watching his life up
      to his death over and over again and can also experience 100-200 years of the
      Great Magic Influence without losing his sanity)
