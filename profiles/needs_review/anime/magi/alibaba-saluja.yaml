        Dherrsaiga Amol Al-Bador Saiqa.gif|Amol Al-Bador Saiga Amon: The Djinn of
        Posterity and Politeness, he grants Alibaba the ability to control fire in
        a number of different ways. * Amol Berka (Amon''s Wall): Alibaba creates a
        wall of flames to either block attacks or keeps people away. * Amol Dherrsaiqa
        (Amon''s Roaring Flame Sword): Alibaba projects a massive vortex of flames
        from his sword. * Amol Al-Bador Saiqa (Flame Minister''s Beheading Sword):
        Alibaba''s Extreme Magic. Summons a giant figure made of flames wielding a
        sword also made of flames; the sword can pierce almost anything. Against Hakuryuu
        this summoned a giant phoenix rather than a humanoid figure. * Life Review:
        Alibaba spent 100+ years as a disembodied consciousness in a doll body that
        was extremely difficult to control, he had to get used to the dangers of Dark
