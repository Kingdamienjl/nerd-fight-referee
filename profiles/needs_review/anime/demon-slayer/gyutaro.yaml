      value: 'Town level (He is the true Holder of the Position of Upper Rank Six
        and much stronger than his sister. Managed to fight Tengen and Post-Rehabilitation
        Tanjiro KamadoKimetsu no Yaiba, Chapter 88: "How to Defeat Them" at the same
        time and overwhelm them. Tanjiro needed a hundred times more than his usual
        strength, and awaken his Demon Slayer Mark, to cut his neck off. Despite the
        fact that he was decapitated, Gyutaro was still capable of creating long-ranged
        tornados of razor sharp blood that decimated the surroundings with ease, severely
        injuring and maiming Tengen,Kimetsu no Yaiba: Anime, Episode 43: "Never Give
        Up"Kimetsu no Yaiba, Chapter 94: "Do Something" Tanjiro and Inosuke, and would
        have likely killed them if it wasn''t for Nezuko''s own unique Blood Demon
        Art: Exploding Blood saving them all. Muzan said that Daki was holding Gyutaro
        backKimetsu no Yaiba, Chapter 95: "Final Moments"Kimetsu no Yaiba, Chapter
        98: "The Upper Ranks Gather" and that Gyutaro would''ve killed Tengen, Tanjiro,
        Nezuko, Zenitsu and Inosuke all by himself if he had been the one fighting
        from the beginning.6.645 Kilotons of TNT)'
