      confidence: 0.75
    - field: intelligence
      value: Above Average (Gyutaro displays incredible tactical foresight and intelligence.
        He is able to use the information he gathered from Daki to coordinate their
        attacks against his opponents and was able to figure out and avoid Tengen's
        usage of bombs. Gyutaro was also able to use his Blood Demon Art tactically
        to create inescapable attacks. After seeing Hinatsuru fire a barrage of kunai,
        Gyutaro correctly surmised that mounting an attack that would normally be
        easily mitigated by his regeneration had an underlying motive and chose to
        deflect the attack rather than taking it head on. He is also shown to use
        his flesh manipulation ability in creative ways, such as trapping Tengen's
        and Tanjiro's blade in his flesh Kama to keep them from moving. Lastly, Gyutaro
        figured out Tanjiro's strategy which was to disguise the scent of the wisteria-laced
        kunai with a prostitute's incense bag in order to land a surprise attack on
        him)
      source_id: mediawiki-4721303
