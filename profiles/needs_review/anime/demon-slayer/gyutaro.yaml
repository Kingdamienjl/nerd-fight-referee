        Tengen.gif|Rotating Circular Slashes - Flying Blood Sickles Gyutaro uses his
        Blood Demon Art after being beheaded.gif|Full-Powered Rotating Circular Slashes
        - Flying Blood Sickles *: Gyutaro''s Blood Demon Art allowed him to manipulate
        his own body''s blood in various ways. He was shown to generate them from
        his flesh Kama or from open wounds on his body or release blood at will from
        his veins. It was implied that Gyutaro doesn''t run out of blood due to his
        regenerative abilities, giving him a virtually infinite source of blood to
        fuel his techniques. In combat, he usually created barrages of solidified
        sickle-shaped blood as sharp as blades that can travel at immensely fast speeds
        to attack his opponents. Gyutaro was capable of freely manipulating these
        blood slashes at will, altering their movements until they hit his opponent
        or shaping them however he pleased. Furthermore, his blood sickles were coated
        in deadly poison. **: Gyutaro releases multiple sharp and durable sickle-shaped
