  axis: equipment
  text: A pair of Kama (Gyutaro carries around a pair of Kama fashioned from his own
    flesh and blood. They serve as his main tools in combat and are extremely durable
    and sharp, being able to tear through flesh and block attakcs from Nichirin Swords
    with ease. They are blood red in color and are coated with deadly poison. Gyutaro
    briefly displayed the ability to move his Kama telekinetically, making it fly
    back towards him as if it were a boomerang. When he was a child, Gyutaro possessed
    a similar Kama which someone left behind and was most likely his main source of
    inspiration for using a pair of Kama as a demon)
