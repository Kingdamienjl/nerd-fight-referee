    }}{{Ruby|\u9B3C|\u304D}}{{Ruby|\u8853|\u3058\u3085\u3064}}|Kekkijutsu}}: Gyutaro's\
    \ Blood Demon Art allowed him to manipulate his own body's blood in various ways.\
    \ He was shown to generate them from his flesh Kama or from open wounds on his\
    \ body or release blood at will from his veins. It was implied that Gyutaro doesn't\
    \ run out of blood due to his regenerative abilities, giving him a virtually infinite\
    \ source of blood to fuel his techniques. In combat, he usually created barrages\
    \ of solidified sickle-shaped blood as sharp as blades that can travel at immensely\
    \ fast speeds to attack his opponents. Gyutaro was capable of freely manipulating\
    \ these blood slashes at will, altering their movements until they hit his opponent\
    \ or shaping them however he pleased. Furthermore, his blood sickles were coated\
    \ in deadly poison. **{{Nihongo|Flying Blood Sickles|{{Ruby|\u98DB|\u3068}}\u3073\
    {{Ruby|\u8840|\u3061}}{{Ruby|\u938C|\u304C\u307E}}|Tobi Chigama}}: Gyutaro releases\
    \ multiple sharp and durable sickle-shaped blades of solidified blood by swinging\
    \ his Kama. These blades can be manipulated freely by him. **{{Nihongo|Rampant\
    \ Arc Rampage|{{Ruby|\u8DCB|\u3070\u3063}}{{Ruby|\u5F27|\u3053}}{{Ruby|\u8DF3\
