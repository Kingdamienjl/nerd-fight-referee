    - field: weaknesses
      value: 'Demons quickly disintegrate into dust when exposed to sunlight, and
        despite their regeneration, will die upon decapitation from a Nichirin Blade
        due to their sun absorbing materials, Gyutaro, however, can only be killed
        via Nichirin decapitation if he is beheaded at the same time as Daki. Wisteria
        is poisonous to demons. Notable Attacks/Techniques: File:GyutaroFlyingBloodSickles.gif|Gyutaro
        manipulating his own blood to form his Flying Blood Sickles File:GyutaroRampantArcRampage.gif|Gyutaro
        defending against and repelling Hinatsuru''s kunai with Rampant Arc Rampage
        File:GyutaroRotatingCircularSlashes.gif|Gyutaro''s Rotating Circular Slashes
        *: **Haemokinesis: Gyutaro''s Blood Demon Art allowed him to manipulate his
        own body''s blood in various ways. He was shown to generate them from his
        blood sickles, from open wounds on his body, or release blood at will from
        his veins. It was implied that Gyutaro doesn''t run out of blood due to his
        regenerative abilities, giving him a virtually infinite source of blood to
        fuel his techniques. In combat, he usually created barrages of solidified
        sickle-shaped projectiles as sharp as blades that can travel at immensely
        fast speeds to attack his opponents. Gyutaro was capable of freely manipulating
        these blood slashes at will, altering their movements until they hit his opponent
        or shaping them however he pleased. Furthermore, his blood sickles were coated
        in poison, making them even more dangerous as the damage they cause was worsened
        by the effects of the poison. ***: Gyutaro releases multiple sharp and durable
        sickle-shaped blades of solidified blood by swinging his Kama. ***: Gyutaro
        flails around his Kama haphazardly and creates a dome of sickle-shaped blades
        of solidified blood around him that defend from incoming attacks. ***: Gyutaro
        extends both of his arms, and unleashes circular waves of sharp solidified
        blood from his arms by rupturing his veins as he aims it directly at his target,
        although he can also merely rupture the veins on his shoulders to activate
        it. This technique requires little effort on Gyutaro''s part, has massive
        range, and he is implied to even able to activate it as his head is being
        cut off. ==Notes/Explanations== Category:Soda727'
