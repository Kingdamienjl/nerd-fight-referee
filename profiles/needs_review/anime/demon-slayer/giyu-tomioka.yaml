  attack_potency:
    text: At least Town level, likely higher (Comparable to Base Sanemi in sparring.
      Parried attacks from Akaza. Was able to cut deep into Akaza's body and parried
      his shockwave, while being heavily wounded and having a broken blade6.645 Kilotons
      of TNT), higher with the Demon Slayer Mark (Comparable to Marked ICA Tanjiro,
      whose Demon Slayer Mark significantly increased his strength. Matched a serious
      Akaza, being able to make shallow cuts on his neck. Overwhelmed a serious Akaza
      the longer the fight continued by obliterating his body with Drop Ripple Thrust
      and Constant Flux. Parried attacks from Muzan. Clashed with Sanemi to turn their
      swords red. Comparable to the other Marked Hashira), even higher with Constant
      Flux and Bright Red Nichirin Sword (Burnt Muzan and caused him severe pain.
      Overwhelmed Akaza and pushed him back across a layer of the Infinity Fortress
      with Constant Flux)
    source_ids:
    - vsbattles-giyu-tomioka-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Massively Hypersonic+ (Can keep up with a casual Akaza and is comparable\
