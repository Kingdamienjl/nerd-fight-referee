- id: claim-powers-and-abilities-68b00630
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Acrobatics **Body Control & Regeneration
    (Low - With breathing, one can stop blood hemorrhages and can manipulate their
    own bloodflow. Tengen can also force his heart to stop to beat with his muscles)
    **Extrasensory Perception (Able to sense the presence of others and malicious
    intent, this can be used to differentiate humans and demons, determine how strong
    someone is to a certain extent or detect an enemy in the vicinity, Had a bad feeling
    despite not clearly sensing any demons, Muzan stated that the Hashira could detect
    an Upper Rank in the Entertainment District right away) **Enhanced Hearing (Has
    an extremely good sense of hearing, Was able to hear the sounds of a fight under
    the ground while he was aboveground) *Hand-to-Hand Combatant & Master Swordsman
    **Sunlight Absorption (The ore of his blades (Scarlet Crimson Ore) absorbs sunlight)
    **Non-Physical Interaction with Nichirin Sword (Nichirin Swords can cut through
    Zohakuten''s lightning) **Explosion Manipulation (His Nichirin Swords possess
    high explosive power, also has bombs) **Instinctive Reaction (Comparable to the
    other Hashiras and Tanjiro who can react instinctively) *Information Analysis
    & Analytical Prediction (Tengen developed a technique named "Score" that allows
    him to deconstruct his opponent''s movements and actions into sound to help him
    find an opening and read their moves) *Statistics Amplification (Total Concentration
    Breathing increase the user''s speed and power to match demons) * Greater Battle
    Spirit (Similar to Gyutaro, who can produce an intense bloodlust that causes chills)
    *Shockwave Generation (Breathing Techniques allow sword forms to strike from a
    longer distance) *Stealth Mastery (Approached Tanjiro and Inosuke without getting
    detected by their Enhanced Smell and Touch respectively, Was able to sneak up
    on someone in a room and then vanish from it before they could turn around or
    notice him leaving) |-|Resistances= Resistance to: *Fire Manipulation, Water Manipulation
    & Heat Manipulation (Demon Slayer Corps Garbs protect against fire, water and
    cold) *Fear Manipulation & Paralysis Inducement (As a Hashira, he should be like
    Giyu who is unaffected by the aura of Lower and Upper Rank like Rui. Rui''s aura
    was implied to be similar to Shinobu''s, which caused intense shuddering and lack
    of air) *Poison Manipulation (Total Concentration Breathing grant resistance to
    poison and the ability to slow its circulation. His ninja training adapted his
    body to be resistant to poison. Gyutaro''s deadly poison was affecting Tengen
    so slowly that Gyutaro was almost tricked into thinking that Tengen is immune.
    Stopped his heart beat to further slow the circulation of Gyutaro''s poison and
    fought afterwards) *Biological Manipulation (Users of Total Concentration Breathing
    are resistant to Muzan''s blood which can immediately transform normal humans
    into demons with a scratch, leading them to require a few days to willingly transform.
    Can resist Muzan''s injected blood which rapidly attacks and destroys cells leading
    to quick melting and vaporization) *Pain Manipulation (Was able to fight with
    extremely severe injuries, including losing an arm and eye with deadly poison
    circulating in his body, with no sign of pain) *Air Manipulation (Comparable to
    Tanjiro who was unbothered by the Swamp Demon''s pocket dimension that has almost
    no air)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
