power_scale:
  tier:
    text: 'Name: Tengen Uzui Origin: Demon Slayer: Kimetsu No Yaiba Gender: Male Age:
      23 Classification: Human, Demon Slayer, Shinobi, Sound Hashira of the Demon
      Slayer Corps, God of Flashiness and Festivals'
    source_ids:
    - vsbattles-tengen-uzui-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Town level (Far stronger than Post-Rehabilitation Tanjiro, Zenitsu, and
      Inosuke. Had no problem defeating Daki, who can slice apart buildings, and he
      didn't even believe her being Upper 6 due to how weak she was in comparison.
      Should be comparable to the other Hashira. Clashed with Gyutaro, blocked his
      blood blades, which are capable of this damage, and later kept up with a blood
      lusted Gyutaro even while poisoned and severely injured after completing his
      Musical Score technique. Was considered the last line of defense during the
      final battle)
    source_ids:
    - vsbattles-tengen-uzui-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively Hypersonic+ (Could cut multiple bombs in large swings before the
      first could detonate despite being poisoned. Much faster than the Post-Rehabilitation
      trio and amazed them with his speed. Mitsuri Kanroji is compared to albeit superior
      to Tengen in technique speed. Should be comparable to the other Hashira; the
      list is purely about running speed with no specified length or description of
      the running course, while Mitsuri, Muichiro and Obanai are suggested to have
      been impeded in some way)
    source_ids:
    - vsbattles-tengen-uzui-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 25, likely Class K (Physically stronger than Post-Hashira
      Training Tanjiro, who could push a rock this large. Tengen ranks second in Hashira
      arm-wrestling rankings, putting him above the likes of Sanemi, Kyojuro etc)
    source_ids: &id002
    - mediawiki-3935495
    confidence: 0.95
  striking_strength:
    text: Town level (Decapitated Daki with ease, could damage Gyutaro. Can easily
      destroy floors with his swords)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Town level (Withstood numerous Rotating Circular Slashes from Gyutaro)
    source_ids:
    - vsbattles-tengen-uzui-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Hashira can train for months through training that almost puts
      them on the verge of death. Tengen fought while being poisoned and while protecting
      his wives, and could endure large amounts of damage done to him for a long time.
      Comparable to fellow Hashira who fought Lower Rank-level Demons in the Infinity
      Fortress for nearly 5 hours on top of fighting Upper Ranks)
    source_ids:
    - vsbattles-tengen-uzui-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  range:
