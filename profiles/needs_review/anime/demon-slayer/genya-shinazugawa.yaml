    - field: weaknesses
      value: 'Demons quickly disintegrate into dust when exposed to sunlight, and
        despite their regeneration, will die upon decapitation from a Nichirin Blade
        due to their sun absorbing materials, Hantengu''s emotion clones, however,
        can''t be killed via Nichirin decapitation and can only be killed via sunlight
        or when Hantengu''s main body is decapitated for the second time. Wisteria
        is poisonous to demons. His emotion clones weaken when splitting further after
        they''re all manifested. Damaging his or his clones'' tongues make them regenerate
        slower. Sekido''s lightning is unable to pass through the flesh of his fellow
        emotion clones or Hantengu himself due to them being of the same flesh. Notable
        Attacks/Techniques: HantenguSplit.gif|Hantengu splitting to manifest Sekido
        and Karaku *: **Emotional Demon Clone Manifestation: Hantengu''s Blood Demon
        Art allows him to manifest his emotions as younger clones of himself, which
        can be identified by a kanji on their tongue. These clones all have different
        appearances, abilities, and weapons, with their individual strength being
        at least Upper Rank caliber. The emotions shown are anger, pleasure, sorrow,
        joy, hatred, and resentment, with Hantengu himself having the kanji of "fear"
        etched onto his tongue. SekidoLightning.gif|Sekido electrocuting Tanjiro with
        his Khakkhara *: **Lightning Generation: Sekido''s Blood Demon Art allows
        him to generate lightning that flashes blue and red from his Khakkhara by
        stabbing it onto a surface, typically the ground. His lightning was extremely
        potent, instantly paralyzing targets, even if they are in mid-air, and causing
        them to lose consciousness in a short period of time. KarakuWindBlast.gif|Karaku
        launching away Muichiro with his Uchiwa *: **Wind Blasts: Karaku''s Blood
        Demon Art allows him to generate powerful, green gusts of wind by swinging
        down his maple leaf-shaped Uchiwa. UrogiSonicScream.gif|Urogi attacking Tanjiro
        with his Sonic Scream *: **Sonic Scream: Urogi''s Blood Demon Art allows him
        to generate powerful, yellow sound waves from his mouth, by inhaling amounts
        of air that glows bright yellow light from his mouth. SekidoWeepingSpears.gif|Aizetsu
        putting multiple holes through Genya with Weeping Spears *: **Spear Projection:
        Aizetsu''s Blood Demon Art allows him to create multiple jagged blue-to-red
        projectiles out of thin air by simply thrusting his Yari and instantly launch
        them at his targets from afar. ***: Aizetsu thrusts his Yari, creating multiple
        long-ranged projections of the spear attack. ZohakutenCrazedCryofThunderDeath.gif|Zohakuten''s
        Crazed Cry of Thunderdeath ZohakutenCountlessStrikingTrees.gif|Zohakuten''s
        Countless Striking Trees ZohakutenCompressedSoundWaves.gif|Zohakuten attacking
        Mitsuri with Compressed Sound Waves *: **Wood Manipulation: Zohakuten''s main
        Blood Demon Art grants him the ability to take control of the trunks of surrounding
        trees and manipulate it by striking the drums at his back. Zohakuten mainly
        shapes the wood into massive snake-like dragon heads that can stretch up to
        twenty meters in length, though he can also create dragon heads within the
        main dragon heads in order to increase its length and reach. ***: Zohakuten
        strikes a drum, commanding two wooden dragons to unleash Sekido''s electricity
        and Urogi''s sound waves respectively. ***: Zohakuten incessantly strikes
        his drums, unleashing numerous wooden dragons to create a wide-ranged attack.
        ***: Zohakuten opens his mouth and unleashes extremely loud and powerful sound
        waves. UramiSonicScream.gif|Urami attacking Genya with his Sonic Scream *:
        **Sonic Scream: Urami is able to utilize Urogi''s Blood Demon Art, which allows
        him to generate powerful, yellow sound waves from his mouth, by inhaling amounts
        of air that glows bright yellow light from his mouth. == Notes/Explanations
