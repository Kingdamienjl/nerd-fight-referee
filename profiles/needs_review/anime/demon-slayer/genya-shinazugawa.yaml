- id: claim-powers-and-abilities-ff79b21b
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Type 2; survived being
    cut in half), Regeneration (High-Low; can regenerate after getting stabbed in
    his vital points), Enhanced Senses (Possesses a special sense of taste alongside
    strong biting strength and special digestive organs that allows him to eat demons.
    Demons can easily smell blood and wisteria flowers), Limited Information Analysis
    (Demons can perceive details like blood type, sickness and genes), Battle Spirit,
    Limited Fear Manipulation & Paralysis Inducement (Overwhelming Aura; They emit
    an aura that overwhelms others and causes the opponent to feel numerous negative
    effects. These negative effects from their overwhelming aura causes the opponent
    fear and even paralysis from the force of their aura alongside them shuddering
    and the inability to breathe. It can even cause internal bleeding, external lacerations,
    internal heart pain, and sapping the strength from limbs), Extrasensory Perception
    (Able to sense the presence of others and malicious intent, this can be used to
    differentiate humans and demons, determine how strong someone is to a certain
    extent or detect an enemy in the vicinity), Stealth Mastery (Confident enough
    in his stealth abilities and ability to hide his presence to attempt sneak attacks
    on Upper Moons), Weapon Mastery (Dual wields a sword and a shotgun), Acrobatics,
    Sunlight Absorption (The ore of his blade, gun and bullets (Scarlet Crimson Ore)
    absorbs sunlight), Transformation and Power Mimicry (Can transform into a partial
    demon and gain their abilities after consuming their cells), Statistics Amplification
    (Becomes stronger by transforming into a partial demon, and by consuming the cells
    of strong demons), Rage Power and Awakened Power (Becomes stronger and faster
    through his Repetitive Action technique of reciting a prayer and summoning a memory
    of anger or pain, allowing him to dodge Aizetsu''s spear at point blank range
    and seemingly teleport behind him) | All previous abilities plus, better Regeneration
    (Low-Mid; Can regenerate several holes in his body) | All previous abilities |
    All previous abilities plus, Wood Manipulation (Can create a tree from inside
    his opponent''s body after a bullet sinks into their flesh), Homing Attack (His
    flesh bullets will seek his opponent and change their trajectory like living things),
    Blood Manipulation (The tree connected to his opponent will suck their blood)
    |-|Resistances= Resistance to: Fire Manipulation, Water Manipulation, Heat Manipulation
    (Demon Slayer Corps Garbs protect against fire, water and cold), Pain Manipulation
    (Can fight without signs of pain despite mutilating injuries), Poison Manipulation
    (Strong demons are highly resistant to poison. Should have better resistance than
    Gyutaro who shook off a poison dosage that would paralyze an ordinary demon for
    half a day within moments), Fear Manipulation and Paralysis Inducement (Able to
    withstand aura that causes fear and paralysis)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
