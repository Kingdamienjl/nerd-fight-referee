    \ sun steel bullets, that, when fired, the direction and velocity of the bullets\
    \ could be freely manipulated by Genya to easily move around obstructions between\
    \ the bullet and the intended target, as seen when his bullets moved around Kokushibo's\
    \ sword, directly burying themselves into his flesh. Once inside its target, the\
    \ bullets can immediately grow into a gigantic tree similar to Zohakuten\u2018\
    s blood demon technique and then entangle and wrap around the intended target,\
    \ paralyzing them. **Blood Roots: Genya could further alter his embedded Flesh\
