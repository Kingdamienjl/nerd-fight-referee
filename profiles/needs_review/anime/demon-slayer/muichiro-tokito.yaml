  attack_potency:
    text: Town level (Superior to Post-Type Zero training Tanjiro, as Tanjiro hadn't
      reached the level of a Hashira until after his Hashira training, who could match
      Hantengu's emotion clones. Should be comparable to the other Hashira, as he
      is a prodigy who reached the Hashira rank within two months after picking up
      a sword, earning him the praise of Tengen. Matched Obanai and Sanemi in a sparring
      match with wooden swords during the Hashira Training Arc), higher with Demon
      Slayer Mark (Should be comparable to Marked Mitsuri Kanroji who could compete
      with Upper Moon 4 level demons. Had little difficulty defeating Gyokko, even
      in his Molting Transformation and while under the influence of a paralyzing
      poison, when his base form previously got overwhelmed, claiming he wasn't serious
      until the end), far higher with Bright Red Nichirin Sword and Death Amp (Turned
      his sword red with one arm despite being slashed in half, burning Kokushibo's
      insides and making him stiff with a searing pain, contributing to him screaming
      in agony)
    source_ids:
    - vsbattles-muichiro-tokito-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
