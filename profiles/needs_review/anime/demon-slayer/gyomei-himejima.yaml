    - field: attack_potency
      value: "Town level (Gyomei is the strongest hashira of his generation. Is considered\
        \ a prodigy like Muichiro, being able to climb up to the rank of a Hashira\
        \ within two weeks after picking up a sword. Praised to have an incredible\
        \ physique by Kokushibo, described as \"refined to its upmost limits\", one\
        \ that hasn't been seen in 300 years. Decapitated Muzan and parried his Black\
        \ Blood Brambles. Comparable, if not superior to Sanemi. Kokushibo considered\
        \ him and Sanemi to be highly skilled even among the Hashira and that by killing\
        \ them, the remaining slayers should be easy to defeat. Also considered as\
        \ the strongest in the slayer\u2019s corps by Tanjiro, Inosuke, Mitsuri and\
        \ Muichiro6.645 Kilotons of TNT), higher with the Demon Slayer Mark (Blew\
        \ a chunk out of serious Kokushibo's chest. Blew chunks off of Muzan's arms\
        \ and whips, something that most of the Hashiras aren't capable of doing),\
        \ even higher with Bright Red Nichirin Chained Spiked Flail and Axe (Smashed\
        \ Kokushibo's head, albeit with help. Blew chunks off of Muzan)"
      source_id: mediawiki-3953954
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: Massively Hypersonic+ (Could keep up and dodge many attacks from Kokushibo
        who later praised his speed and reflexes. Should be significantly faster than
        Unmarked Mitsuri who could dodge lightning from Zohakuten and Tengen who could
        do this Mach 2274), far higher with the Demon Slayer Mark (The Demon Slayer
        Mark significantly enhances the user's speed. Blocked an angry Kokushibo's
        attempt at blitzing him and avoided his crescent moons. Kept up with a serious
        Kokushibo and avoided numerous danmaku crescent moons. Changed the trajectory
        of his chains last second to protect Sanemi from Kokushibo's sudden transformationMach
        2274), even higher with Transparent World (Kept up with serious Kokushibo's
        extreme danmaku crescent moon and even threw a juzu bead at him without him
        noticing. Changed his trajectory mid leap and avoided Kokushibo's crescent
        moon that caught Marked Transparent World Muichiro off guard despite having
        no swinging motion. Kokushibo was unable to land a hit on him)
      source_id: mediawiki-3953954
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: Town level (Withstood hits from a casual Kokushibo), higher with the
        Demon Slayer Mark (Comparable to Marked Sanemi. Withstood hits from a serious
        Kokushibo)
      source_id: mediawiki-3953954
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: Superhuman (Superior to Tanjiro who endured extremely taxing training
        for seven days non-stop with no food, no sleep, and only a small amount of
        water from rain, later drained for even greater stamina, was also getting
        injured frequently during the training session. Far superior to Inosuke who
        can hunt for 3 days. Hashira can train for months through training that almost
        puts them on the verge of death. Fought Lower Rank-level demons in the Infinity
        Castle for nearly 5 hours on top of fighting Kokushibo. Didn't seem tired
        at the end of his long fight with Kokushibo)
      source_id: mediawiki-3953954
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Several Meters with his Chained spiked flail and axe and Breathing Styles.
