    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Superhuman Athleticism, Acrobatics,
        Self-Sustenance (Type 3; Demons do not sleep), Enhanced Senses, Telepathy,
        Martial Arts, Weapon Mastery, Immortality (Type 1, 3 and 8; Daki is one with
        Gyutaro. They have to be decapitated at the same time for them to die), Social
        Influencing (Lived among humans without suspicion for several years), Regeneration
        (High-Mid; Can quickly regenerate from decapitation, her head being crushed,
        and losing limbs), Absorption (Demons can grow stronger by eating humans),
        Body Control, Elasticity (Can turn her neck into a sash, allowing it to stretch
        when slashed, making it necessary to attack her from multiple directions simultaneously
        or with enough speed and force to decapitate her), Biological Manipulation
        (Can turn people into demons with her blood), Aura & Fear Manipulation (Has
        a vastly superior aura to the Lower Moons, which can cause shuddering and
        a feeling of lacking air, as she could inflict fear upon Tanjiro), Sleep Manipulation,
        Sealing & Transmutation (Can seal people within her sash and turn them into
        flat designs, also putting them to sleep), Blood Manipulation, Poison Manipulation,
        Summoning (Can summon Gyutaro from own flesh), Pain Suppression (Demons are
        shown to not mind pain, as they can shrug off their limbs and heads being
        sliced off or crushed), Resistance to: Regeneration Negation (High-Mid; As
        long as Gyutaro''s alive, she can regenerate from decapitation by Nichirin
        blades, which normally kill a demon), Disease Manipulation (Demons are unable
        to get sick), Fear Manipulation & Paralysis Inducement (Should easily resist
        the Lower Moons'' aura), Sleep Manipulation, Mind Manipulation, possibly Dream
        Manipulation, Death Manipulation & Soul Manipulation (Enmu implied that he
        could only challenge an Upper Moon if he receives more of Muzan''s blood,
        suggesting that they resist his Blood Demon Art)'
      source_id: character-stats-profiles-daki-demon-slayer
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
