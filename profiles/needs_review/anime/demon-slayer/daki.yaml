        the Lower Moons'' aura), Sleep Manipulation, Mind Manipulation, possibly Dream
        Manipulation, Death Manipulation & Soul Manipulation (Enmu implied that he
        could only challenge an Upper Moon if he receives more of Muzan''s blood,
        suggesting that they resist his Blood Demon Art)'
