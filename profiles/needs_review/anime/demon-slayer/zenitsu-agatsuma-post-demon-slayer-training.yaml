    - field: weaknesses
      value: 'Cowardly | Using Godspeed twice in a day makes him unable to use his
        legs | None notable {| class="wikitable mw-collapsible mw-collapsed" !Notable
        Attacks and Techniques: |- | *: A Breathing Style that mimics lightning, specifically
        swift strikes and movements akin to lightning ripping through the sky, and
        replicates it with the user''s movements, techniques and abilities. Most,
        if not all, known techniques and forms involve utilizing blinding speeds and
        immensely fast attacks to overwhelm the enemy in an instant. This Breathing
        Style focuses on channeling strength into the user''s legs, and maximizing
        the output of every single muscle and blood vessel in them. Users also mimic
        lightning to such high fidelity that they cause the air to vibrate when poised
        to unleash a technique and create immensely loud sounds akin to thunder with
        their mere footsteps. **: The user unsheathes their katana, dashes forward
        at blinding speeds and decapitates their opponent faster than they can react,
        before sheathing it back. This technique is extremely reminiscent of Iaijutsu
        and its movements are described to be akin to "lightning ripping through the
        air". **: An extension of the Thunderclap and Flash technique created by Zenitsu.
        The user performs Thunderclap and Flash six times in quick succession while
        slightly augmenting the power and speed of his dashes. **: An extension of
        the Thunderclap and Flash technique created by Zenitsu. The user performs
        Thunderclap and Flash eight times in quick succession while slightly augmenting
        the power and speed of his dashes. **: An extension of the Thunderclap and
        Flash technique created by Zenitsu. The user performs Thunderclap and Flash
        while greatly augmenting the speed of the technique. During the first display
        of this technique, an unconscious Zenitsu remarked that he mustn''t perform
        this technique more than 2 times, otherwise his legs would be rendered useless
