    confidence: 0.95
  attack_potency:
    text: At least Town level, likely higher (Stated that she has muscles eight times
      denser than what they should be. Superior to Post-Type Zero training Tanjiro,
      as Tanjiro hadn't reached the level of a Hashira until after his Hashira training,
      who could match Hantengu's emotion clones. Should be comparable to the other
      Hashira such as Tengen, who could match Gyutaro and survive his final attack.
      Could easily slash through and block Zohakuten's attacks. Showed afterwards
      that she managed to make a shallow cut in Zohakuten's neck, which should be
      the toughest part of his body), higher with the Demon Slayer Mark (Was able
      to match Full Power Zohakuten and stalemate him until sunrise despite Zohakuten
      being unkillable. Ripped Muzan's arm clean off)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+ (Could keep up with Zohakuten and dodge his lightning.
      However, she is slightly slower than Giyu, Sanemi and Obanai), higher with the
      Demon Slayer Mark (Zohakuten could only manage to hit her when she was exhausted)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 25, at most Class 50 (Stronger than Tanjiro but weaker than
      Gyomei), Class K with Demon Slayer Mark
