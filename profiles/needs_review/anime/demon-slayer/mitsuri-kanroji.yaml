- id: claim-powers-and-abilities-35d6c356
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Acrobatics (Is the most flexible Hashira
    with the highest level of maneuverability) **Instinctive Reaction (Was able to
    dodge many of Muzan''s attacks, which were too fast for her to see, using her
    instincts) **Body Control & Regeneration (Low - With Total Concentration Breathing,
    one can stop blood hemorrhages) * Greater Battle Spirit (Similar to Gyutaro, who
    can produce an intense bloodlust that causes chills) *Extrasensory Perception
    (Able to sense the presence of others and malicious intent, this can be used to
    differentiate humans and demons, determine how strong someone is to a certain
    extent or detect an enemy in the vicinity, Muzan stated that the Hashira could
    detect an Upper Rank in the Entertainment District right away) *Master Swordswoman
    **Sunlight Absorption (The ore of her katana (Scarlet Crimson Ore) absorbs sunlight)
    **Non-Physical Interaction with Nichirin Sword (Nichirin Swords can cut through
    Zohakuten''s lightning) **Statistics Amplification (Total Concentration Breathing
    can make the user become much stronger and faster. Her Demon Slayer Mark further
    increases her power and speed) **Perception Manipulation (Can create seemingly
    elemental effects) **Shockwave Generation (Breathing Techniques allow sword forms
    to strike from a longer distance) *Invisibility & Stealth Mastery with Yushiro''s
    talisman (Used the paper talismans to mask his presence and become invisible)
    *Enhanced Senses with Yushiro''s talisman (Neutral Vision; Can see invisible beings
    and invisible attacks. Can let blind people see as well) |-|Resistances= Resistance
    to: *Fire Manipulation, Water Manipulation & Heat Manipulation (Demon Slayer Corps
    Uniforms protect against fire, water and cold) *Poison Manipulation (Total Concentration
    Breathing grant resistance to poison and the ability to slow its circulation)
    *Biological Manipulation (Breathing Users are resistant to Muzan''s blood which
    can immediately transform normal humans into demons with a scratch, leading them
    to require a few days to willingly transform. Can resist Muzan''s injected blood
    which rapidly attacks and destroys cells leading to quick melting and vaporization)
    *Pain Manipulation (Was willing to continue fighting after suffering crippling
    injures and having her ear severed) *Enhanced Fear Manipulation & Paralysis Inducement
    (As a Hashira, she should like Giyu who is unaffected by the aura of Lower and
    Upper Rank like Rui. Rui''s aura was implied to be similar to Shinobu''s, which
    caused intense shuddering and lack of air. Immune to Muzan Kibutsuji''s aura that
    made Akaza bleed and paralyzed him in fear) *Air Manipulation (Comparable to Tanjiro
    who was unbothered by the Swamp Demon''s pocket dimension that has almost no air)
    *Resistance to Enhanced Smell, Clairvoyance & Extrasensory Perception with Yushiro''s
    talisman (Can mask their own bloodlust, malicious intent, presence, location,
    strength, and scent from Tanjiro and even Muzan himself)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
