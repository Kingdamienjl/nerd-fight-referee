        causing fear and paralysis), Blood Manipulation, Thread Manipulation (His
        Blood Demon Art allows him to produce sharp, steel-like threads from his flesh
        and blood), Damage Boost (Can increase the strength and durability of his
        threads by infusing them with his blood), Platform Creation (Can walk on his
        threads in mid-air), Power Bestowal (Can share his Blood Demon Art with other
        demons through apportioning it into spiderlike forms for their consumption),
