      value: 'Zenitsu is an extremely insecure person, to the point where he always
        thinks that he is weak. And for that reason, his true strength manifests only
        when he is either asleep or unconscious (This is no longer the case by the
        time of the Final Arc) | Using God Speed twice in a day makes him unable to
