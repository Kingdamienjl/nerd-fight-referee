        akin to lightning ripping through the sky, and replicates it with the user''s
        movements, techniques and abilities. Most, if not all, known techniques and
        forms involve utilizing blinding speeds and immensely fast attacks to overwhelm
        the enemy in an instant. This Breath Style focuses on channeling strength
        into the user''s legs, and maximizing the output of every single muscle and
        blood vessel in them. Users also mimic lightning to such high fidelity that
        they cause the air to vibrate when poised to unleash a technique and create
        immensely loud sounds akin to thunder with their mere footsteps. *First'
