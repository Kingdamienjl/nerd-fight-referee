  text: A pair of Japanese War Fans (Doma carries around a pair of Japanese war fans
    most likely fashioned from his flesh (similar to all other weapons used by demons),
    that act as his main offensive weapons and aid in spreading his Blood Demon Art.
    His fans are of a golden color with several patterns resembling lotuses engraved
    on the side complete with a green tieback. They are extremely sharp and suited
    for his style of combat, being able to slice and slash as well as swords and generate
    huge gusts of air. They are also shown to be extremely durable, withstanding multiple
    sword slashes and attacks without breaking)
