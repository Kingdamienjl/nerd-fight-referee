    - field: intelligence
      value: Gifted (Doma is exceptionally intelligent, which he displayed on multiple
        occasions. While in a fast-paced brawl with Kanao, he was able to process
        and deduce her abilities, surmising that it was her superhuman eyesight that
        allowed her to parry and dodge his ice attacks and immediately develop a strategy
        to counter it. In another instance, when he left Kanao and Inosuke to fight
        his ice clones, he construed that Inosuke had an acute sense of touch just
        by observing his behavior when near his ice techniques. It is also implied
        that Doma was able to trick and deceive all of his followers, allowing him
