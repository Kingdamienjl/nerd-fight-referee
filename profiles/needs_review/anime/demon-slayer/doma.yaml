      value: A pair of Japanese War Fans (Doma carries around a pair of Japanese war
        fans most likely fashioned from his flesh (similar to all other weapons used
        by demons), that act as his main offensive weapons and aid in spreading his
        Blood Demon Art. His fans are of a golden color with several patterns resembling
