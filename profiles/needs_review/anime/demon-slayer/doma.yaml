    - field: weaknesses
      value: "Standard Demon Weaknesses. Likes to play around and doesn\u2019t get\
        \ serious until he's in danger. {| class=\"wikitable mw-collapsible mw-collapsed\"\
        \ !Notable Attacks and Techniques: |- | Frozen_Lotuses.png|Frozen Lotuses\
        \ Barren_Hanging_Garden.png|Barren Hanging Garden Freezing_Clouds.png|Freezing\
        \ Clouds Lotus_Vines.png|Lotus Vines Cold_White_Princesses.png|Cold White\
        \ Princesses Wintry_Icicles.png|Wintry Icicles Scattering_Lotuses.png|Scattering\
        \ Lotuses Crystalline_Divine_Child.png|Crystalline Divine Child Rime_Waterlily_Bodhisattva.png|Rime\
        \ - Waterlily Bodhisattva *{{Nihongo|Blood Demon Art|{{Ruby|\u8840|\u3051\u3063\
        }}{{Ruby|\u9B3C|\u304D}}{{Ruby|\u8853|\u3058\u3085\u3064}}|Kekkijutsu}}: Doma's\
        \ Blood Demon Art grants him extremely powerful cryokinesis. He can generate\
        \ ice and frost from his flesh and blood and can spawn it anywhere in his\
        \ vicinity, as well as manipulating it at will, allowing him to unleash incredibly\
        \ potent ice techniques. Additionally, the ice created from his Blood Demon\
        \ Art is extremely lethal to those that inhale it, causing the cells of the\
        \ victim's lungs to die and rendering them unable to breathe very quickly.\
        \ His ice and frost has also been noted to be extremely cold, as shown when\
        \ the air around Doma's frost was cold enough to make Shinobu's lungs feel\
        \ as if they were about to burst and nearly freeze Kanao's body and surroundings\
        \ just by coming into contact with it. **{{Nihongo|Frozen Lotus|{{Ruby|\u84EE\
        |\u306F\u3059}}{{Ruby|\u8449|\u306F}}{{Ruby|\u6C37|\u3054\u304A\u308A}}|Hasuhag\u014D\
        ri}}: Doma delivers a forward fan slash that creates razor-sharp ice shards\
        \ along with several ice lotuses. **{{Nihongo|Barren Hanging Garden|{{Ruby|\u67AF\
        |\u304B\u308C}}{{Ruby|\u5712|\u305D\u306E}}{{Ruby|\u5782|\u3057\u3065}}\u308A\
        |Karesono Shizuri}}: A series of 8 to 10 successive fan attacks that generates\
        \ ice shards to slice the enemy into pieces. **{{Nihongo|Freezing Clouds|{{Ruby|\u51CD\
        |\u3044}}\u3066{{Ruby|\u66C7|\u3050\u3082\u308A}}|Itegumori}}: Doma creates\
        \ a large wave of cold wind and uses his fans to scatter them. This technique\
        \ nearly froze Kanao's eyeballs. **{{Nihongo|Lotus Vines:|{{Ruby|\u8513|\u3064\
        \u308B}}{{Ruby|\u84EE|\u308C\u3093}}{{Ruby|\u83EF|\u3052}}|Tsuru Renge}}:\
        \ Similar to his Frozen Lotus technique, Doma creates several lotuses made\
        \ of ice and long frost vines that extend his reach and can capture or slice\
        \ up his opponents. **{{Nihongo|Cold White Princesses:|{{Ruby|\u5BD2|\u304B\
        \u3093}}{{Ruby|\u70C8|\u308C\u3064}}\u306E{{Ruby|\u767D|\u3057\u3089}}{{Ruby|\u59EB\
        |\u3072\u3081}}|Kanretsu no Shirahime}}: Doma creates the upper body of two\
        \ female humanoid figures at the end of lotuses using ice with the ability\
        \ to blow icy air towards his target. The wind generated was cold enough to\
        \ instantly freeze the surrounding wood bridges and water. Kanao noted that\
        \ this technique is extremely broad and has a long reach. **{{Nihongo|Wintry\
        \ Icicles|{{Ruby|\u51AC|\u3075\u3086}}\u3056\u308C{{Ruby|\u6C37\u67F1|\u3064\
        \u3089\u3089}}|Fuyuzare Tsurara}} Doma spawns numerous icicles to impale his\
        \ target. **{{Nihongo|Scattering Lotuses|{{Ruby|\u6563|\u3061}}\u308A{{Ruby|\u84EE\
        |\u308C\u3093}}{{Ruby|\u83EF|\u3052}}|Chiri Renge}}: Doma swings his fans\
        \ and creates a blizzard of long-ranged razor-sharp ice shards shaped like\
        \ lotus petals. **{{Nihongo|Crystalline Divine Child|{{Ruby|\u7D50|\u3051\u3063\
        }}{{Ruby|\u6676|\u3057\u3087\u3046}}\u30CE{{Ruby|\u5FA1|\u307F}}{{Ruby|\u5B50\
        |\u3053}}|Kessh\u014D no Miko}}: Doma creates miniature ice replicas of himself\
        \ to battle his opponents. He has shown to be capable of creating up to six\
        \ clones of himself at once, all possessing roughly the same skill and proficiency\
        \ as Doma himself in addition to being fully capable of using any of his techniques,\
        \ albeit not to the same caliber as him. Furthermore, these clones are able\
        \ to record any information they gather during battle and relay it to Doma,\
        \ allowing him to better fight his opponents. However, one drawback to this\
        \ technique is that the clones require concentration in order to maintain\
        \ their functionality, as seen when they disappeared when Shinobu's poison\
        \ started to take effect on Doma. **{{Nihongo|Rime \u2014 Water Lily Bodhisattva|{{Ruby|\u9727\
        |\u3080}}{{Ruby|\u6C37|\u3072\u3087\u3046}}\u30FB{{Ruby|\u7761|\u3059\u3044\
        }}{{Ruby|\u84EE|\u308C\u3093}}{{Ruby|\u83E9|\u307C}}{{Ruby|\u85A9|\u3055\u3064\
        }}|Muhy\u014D - Suiren Bosatsu}} Doma creates an enormous Bodhisattva statue\
        \ surrounded by lotuses made of ice. Its most notable trait is its ability\
        \ to generate huge gusts of Doma's deadly ice from its mouth and deliver powerful\
        \ physical attacks using its large arms. It is also able to grab targets using\
        \ its hands. |} ==Notable Matchups== Victories: Losses: *Hashiras (Demon Slayer:\
