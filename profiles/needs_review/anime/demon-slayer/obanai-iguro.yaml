- id: claim-powers-and-abilities-ef122332
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Acrobatics **Body Control & Regeneration
    (Low - With Total Concentration Breathing, one can stop hemorrhages, and can manipulate
    his blood flow) **Statistics Amplification (Total Concentration Breathing increase
    the user''s speed and power to match demons. His Demon Slayer Mark further increases
    his power and speed) **Transparent World: Perception Amplification, Information
    Analysis, Enhanced Sight, Analytical Prediction, and Enhanced Precognition (Transparent
    World makes his perception of time slow down and makes the user directly see their
    opponent''s muscles, blood flow and movements which allows them to predict their
    next moves) *Supernatural Willpower & Awakened Power (Surpassed his limits when
    his life was on the brink of danger and unlocked the Demon Slayer Mark while turning
    his sword red with pure gripping strength. Compared his situation to Muichiro
    who did the same thing while bisected in half) *Extrasensory Perception (Able
    to sense the presence of others and malicious intent. Muzan stated that Hashira
    could detect an Upper Rank in the Entertainment District right away) * Greater
    Battle Spirit (Similar to Zohakuten, who can cause opponents to completely freeze
    in fear, sapping strength from limbs and causing heart pain) *Instinctive Reaction
    (Comparable to Kyojuro, Mitsuri, Sanemi, and Giyu who can react instinctively)
    *Pressure Points (Was able to pin down Tanjiro in a way that restricted movement
    or breathing) *Invisibility & Stealth Mastery with Yushiro''s talisman (Used the
    paper talismans to mask his presence and become invisible) *Enhanced Senses with
    Yushiro''s talisman (Neutral Vision; Can see invisible beings and invisible attacks.
    Can let blind people see as well) *Kaburamaru: **Animal Manipulation & Precognition
    (To compensate for being almost blind in his right eye, Obanai uses his snake
    Kaburamaru to read enemy attacks and then relay that information to himself. Used
    Kaburamaru to fight Muzan and predict his attacks even after being rendered completely
    blind) *Master Swordsman and Limited Elasticity (Is one of the strongest and most
    skilled swordsmen in the entire Demon Slayer Corps. Can match opponents who have
    over a century worth of combat experience. Was the one to teach all the other
    Demon Slayers in the Demon Slayer Corps sword revision. Can make a normal wooden
    sword bend, weave, and extend in impossible ways) **Sunlight Absorption (The ore
    of his katana (Scarlet Crimson Ore) absorbs sunlight. The amount of sunlight his
    weapon has absorbed is so great that Kokushibo''s katana would burn and break
    off before it could cut through) **Non-Physical Interaction with Nichirin Sword
    (Nichirin Swords can cut through Zohakuten''s lightning) **Perception Manipulation
    (Users of Breathing Styles can create seemingly elemental effects) **Shockwave
    Generation (Breathing Styles allow sword forms to strike from a longer distance)
    **Bright Red Nichirin Sword: Heat Manipulation & Regeneration Nullification (Bright
    Red Blades emits heat and is capable of inflicting wounds that burn on the cellular
    level, hampering demon regeneration) |-|Resistances= Resistance to: *Fire Manipulation,
    Water Manipulation & Heat Manipulation with Demon Slayer Corps Garbs (Demon Slayer
    Corps Garbs protect against fire, water and cold) *Poison Manipulation (Total
    Concentration Breathing grant resistance to poison and the ability to slow its
    circulation) *Biological Manipulation (Users of Total Concentration Breathing
    are resistant to Muzan''s blood which can immediately transform normal humans
    into demons with a scratch, leading them to require a few days to willingly transform.
    Can resist Muzan''s injected blood which rapidly attacks and destroys cells leading
    to quick melting and vaporization, especially with the Demon Slayer Mark) *Pain
    Manipulation (Was willing to continue fighting after suffering crippling injures
    and intense damage) *Enhanced Fear Manipulation & Paralysis Inducement (Immune
    to Muzan Kibutsuji''s aura that made Akaza bleed and paralyzed him in fear) *Air
    Manipulation (Comparable to Tanjiro who was unbothered by the Swamp Demon''s pocket
    dimension that has almost no air) *Resistance to Enhanced Smell, Clairvoyance
    & Extrasensory Perception with Yushiro''s talisman (Can mask their own bloodlust,
    malicious intent, presence, location, strength, and scent from Tanjiro and even
    Muzan himself)'
  source_ids: *id003
  decisive: true
  status: unverified
