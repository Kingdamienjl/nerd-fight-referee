  stamina:
    text: Superhuman (Hashira can train for several months on end. Superior to Tanjiro
      who endured extremely taxing training for seven days non-stop with no food,
      no sleep, and only a small amount of water from rain, later drained for even
      greater stamina, was also getting injured frequently during the training session.
      Far superior to Inosuke who can hunt for three days. Comparable to fellow Hashira
      who fought Lower Rank-level demons in the Dimensional Infinity Fortress for
      nearly 5 hours on top of fighting Upper Ranks. In his Special One-Shot, Kyojuro
      ruptured his eardrums, yet didn't flinch in the slightest, ignoring the pain
      and continuing to fight and win. In Kyojuro Rengoku's Story, he suffered dozens
      of severe wounds and injuries from gunshots and explosions coming from the former
      Lower Rank 2, Hairo, but continued to stall enough time for all the bombs he
      planted to be disarmed without showing any signs of pain or fatigue, which shocked
      Hairo, who questioned himself on whether the person he met in the past was really
      the same person he was fighting now. Furthermore, his battle against Enmu when
      he fused with an entire train, he was able to keep him at bay in 5 different
      train carts without tiring. Lastly, he managed to keep up with Akaza, one of
      the strongest demons in existence despite physically and mentally exert himself
      beyond his limit and sustaining multiple irreparable and fatal wounds, like
      a smashed eye, shattered ribs and damaged internal organs. Most impressively,
      he managed to keep Akaza at bay despite having his vital spot, his Solar Plexus,
      pierced by the Upper Rank's arm and bleeding out. Despite all of his fatal wounds
      and injuries, he never once flinched or showed signs of pain or agony)
    source_ids:
