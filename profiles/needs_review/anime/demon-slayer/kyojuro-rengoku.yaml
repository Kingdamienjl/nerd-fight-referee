  intelligence:
    text: 'Gifted (As a swordsman who came from a lineage of Flame Hashira, Kyojuro
      had access to generations of combat knowledge and tactics as well as training
      from previous Flame Hashira, like his father, Shinjuro Rengoku. Kyojuro could
      also master the entire Breath of Flames style just from reading 3 volumes of
      a book on it. During the battle against Akaza, he displayed keen judgement like
      after being attacked by Akaza''s Destructive Death: Air Type, he realizes that
      he must fight at close range with he wanted to increase the chances of cutting
      of his head. Even when the usually deductive and sagacious Tanjiro Kamado was
      at a loss of how to kill Enmu, Kyojuro instinctively knew that, no matter what
      form a demon takes, it will always have a weak spot. He also possesses great
      knowledge in the use of the Total Concentration Breathing, knowing how to plug
      minor wounds and hemorrhaging and saved Tanjiro from dying of blood loss. As
      another testament to his tactical intellect, Kyojuro could instantly read his
      allies'' sign language at indicating the Flute Demon''s abilities despite being
      unable to fully control their movements and execute a countermeasure before
      the demon''s Blood Demon Art befell him)'
    source_ids:
    - vsbattles-kyojuro-rengoku-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
