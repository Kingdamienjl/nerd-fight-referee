        demolished the entire Entertainment District with his Blood Blades. Stated
        by Doma to be superior to Akaza and has defeated and absorbed three other
        demons who challenged his rank before. Easily defeated Marked Muichiro, severing
        his arm in a single swipe before pinning him to a column using his own Nichirin
        Sword. Kept up with Sanemi in multiple clashes, ultimately overwhelming him
        and leaving his torso slashed open, requiring stitches. Kept up with Gyomei
        and forced him to activate his Demon Slayer Mark. Stood his ground against
        Marked Gyomei and Sanemi together without resorting to using his Shichishito
        Blade and has cut the latter's fingers off, and would have slashed both of
        his arms off if Gyomei didn't intervene and divert the attack. Slashed Marked
        Muichiro and Demon-Transformed Genya in half, while pushing Gyomei and Sanemi
