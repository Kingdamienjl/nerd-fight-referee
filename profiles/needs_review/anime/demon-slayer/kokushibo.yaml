  name: The ugliness of having my head cut off, my body diced and crushed into pieces,
    and being unwilling to accept defeat. A disgrace to life. Is this why I lived
    for hundreds of years? Did I really not want to die? So much that I turned into
    a hideous monster? Did I really want to be stronger? So much that I ate all those
    humans? Did I really not want to die? To the point I became this wretched creature?
