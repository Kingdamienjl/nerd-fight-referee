        appearance, the katana is created from the flesh and blood of Kokushibo himself
        and due to his body's immense durability and hardness, his katana is as sharp,
        if not more, than a regular Nichirin Sword. His sword is fleshy red in color,
        akin to the color of blood, with veins and his eyes all around the blade and
        even the hilt. However, it is unknown whether those eyes can be used to extend
        his vision. His katana's hilt is circular shaped with 4 slight indentations,
