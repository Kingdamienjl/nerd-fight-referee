  attack_potency:
    text: At least Town level, likely far higher (As the holder of the Upper Rank
      1 position, he is the strongest of the Twelve Kizuki, and is second only to
      Muzan in the hierarchy, making him far superior to the likes of Gyutaro, who
      demolished the entire Entertainment District with his Blood Blades. Stated by
      Doma to be superior to Akaza and has defeated and absorbed three other demons
      who challenged his rank before. Easily defeated Marked Muichiro, severing his
      arm in a single swipe before pinning him to a column using his own Nichirin
      Sword. Kept up with Sanemi in multiple clashes, ultimately overwhelming him
      and leaving his torso slashed open, requiring stitches. Kept up with Gyomei
      and forced him to activate his Demon Slayer Mark. Stood his ground against Marked
      Gyomei and Sanemi together without resorting to using his Shichishito Blade
      and has cut the latter's fingers off, and would have slashed both of his arms
      off if Gyomei didn't intervene and divert the attack. Slashed Marked Muichiro
      and Demon-Transformed Genya in half, while pushing Gyomei and Sanemi away, and
      freeing himself from Genya's paralyzing Blood Demon Art>6.45 Kilotons of TNT),
      possibly higher in Monster Form
    source_ids:
    - vsbattles-kokushibo-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Massively Hypersonic+, likely far higher (Blitzed base Akaza and
      slashed off his arm without him noticing. Blitzed Marked Muichiro, slashing
      his arm off in a single swipe and pinning him to a pillar column before he can
      even react, with Muichiro considering the speed to be "in another dimension"
      compared to his own, which should make him faster than Hashira like Mitsuri
      who dodged lightning and Tengen who could cut numerous bombs at once before
      they even explode.> Mach 2274), higher attack speed with Shichishito Blade Form
      (Blitzed Marked Sanemi and Marked Gyomei from far away, with both of them crediting
      his speed, and Sanemi admitting he would've lost his arms if not for Gyomei
      diverting the attack and has kept both them whom were Marked at bay, with them
      only being able to get close due to Genya's Blood Demon Art restraining him),
      even higher with Monster Form (Completely blitzed both Marked Sanemi and Gyomei.)
    source_ids:
    - vsbattles-kokushibo-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
