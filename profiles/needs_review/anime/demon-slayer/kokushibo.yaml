    - field: weaknesses
      value: "The sun turns him into ashes. Wisteria flowers are poisonous to him.\
        \ Extraordinarily arrogant and a perfectionist, and is easily offended. A\
        \ hit from Bright Red Blades can hamper demonic regeneration and incinerate\
        \ his cells if at a high enough level. Notable Attacks/Techniques: * Demonic\
        \ Blood: After consuming the Blue Spider Lily, Muzan developed supernatural\
        \ blood with special properties that can transform humans into demons once\
        \ ingested. His special blood also seems to give rise to a plethora of special\
        \ abilities unique to demons such as powerful regeneration, the power to shapeshift,\
        \ immortality, an accelerated growth rate, enhanced physical prowess and even\
        \ supernatural abilities called Blood Demon Arts. Muzan can also further empower\
        \ a demon by giving more of his blood, enhancing their preexisting abilities.\
        \ However this is limited to how much blood the recipient can withstand and\
        \ adapt to. If a human were to take in too much blood from Muzan, their body\
        \ would mutate faster than they can withstand, causing them to self-destruct\
        \ into one giant mass of flesh before disintegrating into ash. The same would\
        \ also presumably happen to a demon if they couldn't withstand the blood's\
        \ effects, as implied by Muzan. * Arm Whips: Muzan can stretch his arms and\
        \ grow several sharp blades in his extended forearms and shape shift his hands\
        \ into several bladed protrusions, each ranging from 90 centimeters (35.4\
        \ inches) to 10 meters (32.8 feet), which he could then swing like whips to\
        \ easily tear his opponents to pieces. The sheer swinging speed of his attacks\
        \ is extremely fast and the precision of his attacks is also extremely accurate.\
        \ And, due to the sheer length of his arms, Muzan possesses such a massive\
        \ attack range that not even three Hashira could get close to him. * Mouth\
        \ Suction: Muzan's arm whips also possess numerous mouths full of sharp fangs\
        \ all throughout them. Muzan can use these mouths to breathe with absurd force\
        \ and suction strength that he can change at any moment from extremely long\
        \ ranges, which he uses to pull his opponents into striking range of his arm\
        \ whips. This will prove severely impeding for the Hashiras' movements as\
        \ avoiding them will consume a lot more stamina. * Leg Whips: Muzan later\
        \ grew 4 tubes on each thigh, each of 7 meters (22.9 feet) in length. Unlike\
        \ his spinal whips, they are much quicker and, thanks to his immense skill\
        \ in shapeshifting, he can rapidly grow the whips and then dispel them faster\
        \ than the human senses can perceive, allowing him to attack from one's blind\
        \ spots easily, shown when he manages to use them to critically injure four\
        \ Hashira and Hashira-level Demon Slayers without them sensing or perceiving\
        \ that Muzan's body had altered and morphed itself. * Spine Whips: Later,\
        \ upon being further enraged, Muzan grow 9 thin tubes, each 4 meters (13.1\
        \ feet) in length, akin to spine-like protrusions from his back that extend\
        \ into bladed, whip-like tentacles. With them, Muzan is able to drastically\
        \ increase his attack range and number of attacks in tandem with his whip\
        \ arms, allowing him to easily mow down hordes of Demon Slayers and corner\
        \ four Hashira. Furthermore, its incredibly difficult to read the trajectory\
        \ of each of whip, making it even more nearly impossible to counter. * Black\
        \ Blood, Brambles (\u30FB Kokketsu: Kikyoku?): Muzan uses his own flesh and\
        \ blood to create several black spiked-barbed wires to entangle his target.\
        \ == Gallery == thumb thumb thumb"
      source_id: character-stats-profiles-kokushibo
