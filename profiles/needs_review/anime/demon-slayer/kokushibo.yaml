      value: Gifted (As a talented swordsman who has existed for over four centuries,
        Kokushibo has experienced countless battle situations and threats which he
        has learnt to overcome and circumvent. This was displayed during his battle
        with three Hashira and Genya, where he was able to adapt to their special
        and unique fighting styles and tactics nigh instantaneously after witnessing
        it. For example, after Muichiro unleashed his first attack against the Upper
        Rank, he was able to determine he was a user of Mist Breathing, a talented
        one at that. This was further accentuated through Kokushibo being able to
