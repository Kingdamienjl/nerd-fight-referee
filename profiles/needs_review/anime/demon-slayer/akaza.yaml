    - field: intelligence
      value: "Above Average | Gifted (With over a century of combat experience and\
        \ martial arts training under his belt, Akaza is able to fight effectively\
        \ with foresight and tactical intelligence. This even surprised Giyu, who\
        \ stated that Akaza could instantly evolve and adapt to any attack or technique\
        \ that he uses, to the point that he can predict when his opponents will strike\
        \ and how to counter them with equal power. Before he became a demon, Akaza\
        \ has displayed natural aptitude in martial arts, shown when he was capable\
        \ of beating up trained swordsmen from neighboring dojos while still in the\
        \ midst of learning Keizo's Sory\u016B Style. This is further exemplified\
        \ when he could fight and defeat grown men without martial arts training)"
      source_id: vsbattles-akaza-demon-slayer
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "None notable. | Standard Demon Weaknesses. When reminded of his days\
        \ as a human, and his late fianc\xE9, he loses the will to fight and allows\
        \ himself to die. He refuses to fight women, even if they're members of the\
        \ Demon Slayer Corps. {| class=\"wikitable mw-collapsible mw-collapsed\" !Notable\
        \ Attacks and Techniques: |- | Compass Needle.gif|Technique Development: Compass\
        \ Needle Void Style.gif|Air Type War Style.jpg|Disorder Obliteration Style.gif|Annihilation\
        \ Type Cap Tip Slice.jpg|Crown Splitter Flowing Light Flash.jpg|Explosive\
        \ Flurry Dual Layered Demon Wick & Bone Burning Sun.jpg|Eight-Layered Demon\
        \ Core Willow of a Thousand Flashes.jpg|Ten Thousand Leaves Flashing Willow\
        \ Ring of a Thousand Flying Planets.jpg|Flying Planet Thousand Wheels Chaotic\
        \ Blue Metal Afterglow.jpg|Blue Silver Chaotic Afterglow *: . **: Akaza manifests\
        \ a light blue snowflake-shaped compass underneath him with numbers ranging\
        \ from 1 to 12. This technique allows Akaza to sense a person's \"\", a person's\
        \ will to fight, which he uses to achieve numerous effects while in combat.\
        \ Firstly, he is able to determine the strength of anyone at a glance, such\
        \ as when he discerned that Kyojuro was a Hashira just by looking at him.\
        \ Secondly, Akaza is able to detect the presence of his opponents in his immediate\
        \ surroundings (even in his blind spots) and can use this to predict where\
        \ and how his opponents will strike him. This technique also allows Akaza\
        \ to tell where his target's weaknesses are located and instinctively aim\
        \ for them. Furthermore, the precision of Akaza's attacks are greatly enhanced,\
        \ to the point where Tanjiro stated that it was like magnets were pulling\
        \ his fists towards his vitals, and even described them as having \"unparalleled\
        \ precision\". This is hinted at when a slight scrape from his kick (even\
        \ while his sword had blocked it) caused Tanjiro to bleed. Moreover, Tanjiro\
        \ also stated that Akaza was able to pierce through any opening in his attacks\
        \ without fail. Another trait of his Compass Needle allows him to reactively\
        \ adapt to his opponent's attacks, learning to anticipate their techniques\
        \ and attack forms and even strike back with equal accuracy over time. Additionally,\
        \ the stronger a person's Battle Spirit, the stronger the response of his\
        \ Compass Needle. His Battle Spirit detection is so accurate that he can find\
        \ the location of Tanjiro in his surroundings and fight and overpower Giyu\
        \ without a head, meaning that he is performing those feats while basically\
        \ being deaf and blind. *: Akaza punches the empty air in front him, creating\
        \ a shockwave that flies towards his enemies and hits them from afar. These\
        \ airborne shockwaves can be created multiple times in quick succession and\
        \ can be unleashed in the sky or on the ground. *: Punching rapidly in front\
        \ of himself, Akaza creates a barrage of large shockwaves. This attack was\
        \ capable of overpowering Kyojuro's Flame Tiger technique. *: One of Akaza's\
        \ most powerful techniques. Akaza crouches with both his arms at the side\
        \ of his body poised to strike. He then lunges forward, creating two powerful\
        \ circular shockwaves from the palm of his hands which he uses to strike his\
        \ target with tremendous force. This technique was strong enough to go through\
        \ Kyojuro's most powerful attack, Rengoku. *: . **: A reverse, rising axe\
        \ kick that produces a shockwave once it connects with the target. **: A flashing\
        \ flurry of powerful straight kicks so fast that they create afterimages,\
        \ with each kick producing powerful shockwaves. This technique was powerful\
        \ enough to launch Giyu an extremely far distance. **: A kick that utilizes\
        \ a flowing motion which strikes Akaza's target from below and launches them\
        \ upward. *: Akaza unleashes eight powerful punches, each strike creating\
        \ large and strong shockwaves in a similar fashion to his Disorder technique.\
        \ *: . **: A powerful downward punch that delivers a large shockwave into\
        \ the ground which expands outward. *: Akaza's ultimate technique. Akaza unleashes\
        \ an omni-directional barrage of countless thin and sharp shockwaves that\
        \ deliver a hundred blows to his target coming from everywhere almost at the\
        \ same time. This attack was so powerful that it could negate Giyu's Dead\
        \ Calm technique, a move known for its immense defensive capabilities. |}\
