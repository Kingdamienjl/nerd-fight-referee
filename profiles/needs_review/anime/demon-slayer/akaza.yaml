        \ Flurry Dual Layered Demon Wick & Bone Burning Sun.jpg|Eight-Layered Demon\
        \ Core Willow of a Thousand Flashes.jpg|Ten Thousand Leaves Flashing Willow\
        \ Ring of a Thousand Flying Planets.jpg|Flying Planet Thousand Wheels Chaotic\
        \ Blue Metal Afterglow.jpg|Blue Silver Chaotic Afterglow *{{Nihongo|Technique\
        \ Development|{{Ruby|\u8853|\u3058\u3085\u3064}}{{Ruby|\u5F0F\u5C55\u958B\
        |\u3057\u304D\u3066\u3093\u304B\u3044}}|Jutsushiki Tenkai}}: . **{{Nihongo|Compass\
        \ Needle|{{Ruby|\u7F85|\u3089}}{{Ruby|\u91DD|\u3057\u3093}}|Rashin}}: Akaza\
        \ manifests a light blue snowflake-shaped compass underneath him with numbers\
        \ ranging from 1 to 12. This technique allows Akaza to sense a person's \"\
        {{Nihongo|Battle Spirit|{{Ruby|\u9B2D|\u3068\u3046}}{{Ruby|\u6C23|\u304D}}|T\u014D\
        ki}}\", a person's will to fight, which he uses to achieve numerous effects\
        \ while in combat. Firstly, he is able to determine the strength of anyone\
        \ at a glance, such as when he discerned that Kyojuro was a Hashira just by\
        \ looking at him. Secondly, Akaza is able to detect the presence of his opponents\
        \ in his immediate surroundings (even in his blind spots) and can use this\
        \ to predict where and how his opponents will strike him. This technique also\
        \ allows Akaza to tell where his target's weaknesses are located and instinctively\
        \ aim for them. Furthermore, the precision of Akaza's attacks are greatly\
        \ enhanced, to the point where Tanjiro stated that it was like magnets were\
        \ pulling his fists towards his vitals, and even described them as having\
        \ \"unparalleled precision\". This is hinted at when a slight scrape from\
        \ his kick (even while his sword had blocked it) caused Tanjiro to bleed.\
        \ Moreover, Tanjiro also stated that Akaza was able to pierce through any\
        \ opening in his attacks without fail. Another trait of his Compass Needle\
