    - field: weaknesses
      value: 'Like any Yato, gets weak if he is exposed to the sun. Notable Attack/Techniques:
        Tremendous Strength: Hinted as one of the elites among the Yato race, Kamui
        is one of the strongest Yato in existence. Naturally, Kamui inherited his
        father''s blood yielding strength able to confidently fight Hosen, The King
        of Yato. His physical strength is so impressive that he can literally chop
        up his opponents. He can easily penetrate his opponent''s body with his arm
        and land a finishing blow. He managed to destroy a space ship with ONE kick.
        Expert Hand-to-Hand Combatant: Instead of relying on brute force alone, Kamui
        is shown to be acrobatic in his movements and skillful in his attacks. Kamui
        is one of the strongest Yato alive and also one of the strongest characters
        in the show. Despite taking more apparent damage from Hosen than the damage
        he did in return, it is strongly implied that Kamui''s confidence to fight
        and even injure the King of the Night shows his great strength and ability
        to fight. One of Kamui''s attacks alone is absolutely lethal. His incredible
        physical skills makes it extremely hard to dodge or to block his attacks,
        while with his strength and speed, he can easily dodge and block even extremely
        powerful attacks. Tremendous Endurance: Kamui was able to withstand damage
        from Housen, who was one of the strongest characters introduced in Gintama.
        Although he took several hits, Kamui was at great health after fighting Housen.
        Even anesthetic drugs are barely effective against him. When Kamui was injected
        with a drug strong enough to even knock out an elephant during his fight with
        Takasugi, he was still able to fight and kill about 20 soldiers before the
        drug finally knocked him out. Healing: Like any yato, he has amazing healing
        abilities. Note: Kamui is not to be confused with the Mangekyou Sharingan
        ability, and the Life Fiber articles and clothing Ryuko, Ragyo and Satsuki
        wear. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions|Kamui
