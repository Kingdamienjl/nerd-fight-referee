        Category:Aliens Category:Martial Artists Category:Enhanced Senses Users Category:Fourth
        Wall Aware Characters Category:Regeneration Users Category:Gun Users Category:Sadists
        Category:Parasol Users Category:Adaptation Users'
      source_id: vsbattles-kagura-gintama
      provider_id: vsbattles
      authority: high
      confidence: 0.75
