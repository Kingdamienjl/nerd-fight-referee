- id: claim-weaknesses-ec1fade3
  section: weaknesses
  axis: weakness
  text: 'Like any Yato, she gets weak if she is exposed to the sun. Notable Attacks/Techniques:
    As a Yato, Kagura has smooth fair skin, like all yato her body is well developed
    with strong, flexible, lean, toned muscle. She possesses amazing natural and instinctive
    fighting abilities, and tremendous physical; strength, speed, instincts, durability,
    tactical analytical skills, reflexes, agility, pheromones, flexibility, charisma,
    health, endurance, regenerative capabilities, longevity, vitality, willpower,
    and senses all of which far surpass human capabilities. Abuto has suggested that
    Kagura is among the highest elite of the Yato, equal only to Kamui, Umibouzo,
    and Housen meaning her abilities far exceed that of an average Yato, however her
    kind nature holds back that destructive potential, only to be released when she
    is awakened. Expert Hand-to-Hand Combatant: Due to the yato blood running through
    her veins she is exceptionally strong, but can also lose control of her power
    and "awaken", when her friends are in serious danger. Her innate Yato killer instincts
    are generally suppressed because she doesn''t like it, but is frequently overtly
    released when giving Shinpachi a thrashing every now and then. However, her instincts
    fully woke up in Yoshiwara Blaze arc in her battle with Abuto when he hurt Shinpachi
    who came to assist Kagura. Healing: She has shown amazing healing abilities after
    Kijima Matako shot her. Kagura was able catch the bullets with her hands and mouth.
    Umbrella (gun): The umbrella also acts as a weapon that can fire bullets like
    a machine-gun. Even without her parasol, Kagura is an incredible close range fighter.
    Category:Berserkers Category:Fourth Wall Aware Characters ==Notable Matchups==
    Victories: Losses: Inconclusive: {{Discussions|Kagura Gintama|Kagura (Gintama)}}
    Category:Characters Category:Gintama Category:Protagonists Category:Antiheroes
    Category:Good Characters Category:Female Characters Category:Anime Characters
    Category:Manga Characters Category:Aliens Category:Martial Artists Category:Enhanced
    Senses Users Category:Fourth Wall Aware Characters Category:Regeneration Users
    Category:Gun Users Category:Sadists Category:Parasol Users Category:Adaptation
    Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
