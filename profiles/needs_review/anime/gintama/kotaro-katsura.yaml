    - field: attack_potency
      value: Small Town level+ (Fought against Housen, and ultimately defeated him,
        although this was done with incredible difficulty and Gintoki frequently required
        outside help. Countered an attack from Dark Vader, sending it through the
        space station and destroying a massive section of it. Fought against Benizakura,
        whose strength was compared to a tactical nuke, and succeeded at destroying
        it) | Small Town level+ (Grew much stronger over the course of the last several
        arcs as a result of frequent fighting. Fought evenly against Kamui and during
        the fight was rapidly closing the gap in power, although he eventually was
        defeated. Kamui could fight evenly against Housen without much effort, and
        was even implied to possibly be stronger. This shows that Gintoki is much
        stronger than he was during his fight against Housen, and could likely fight
        him on more even grounds. Fought and defeated Takasugi, with Takasugi being
        someone whose strength was respected by Kamui. Fought against Batou and managed
        to defeat him, with Batou being said to rival Batou. By the Rakuyou Decisive
        Battle Arc, he likely got even stronger. Was "just barely" able to compete
        with Utsuro, who is vastly superior to the aforementioned two Yato)
