        Shouyou, Katsura uses a Katana and he is a highly skilled samurai. Enhanced
        Endurance: Katsura has shown a great amount of endurance, as seen during the
        Rakuyou Arc, during his battle against Neptune Shoukaku. Despite being brutally
        injured by Shoukaku, he managed to get up and eventually defeat him. Katsura
        has shown during the battle against Shoukaku to have a hard head, being able
