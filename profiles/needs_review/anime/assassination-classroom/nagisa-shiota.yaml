        \ using the Stun Clap on Taokaka F94D54EA-130C-4426-B630-81F1E3462C5B.gif|Nagisa\u2019\
        s Bloodlust 0CA478FD-E1C4-49DF-8926-7D3310B37537.gif|Nagisa attempting to\
        \ assassinate Koro-Sensei 444B2F1B-A5D5-4098-862A-34035D1467D6.gif A3ABC0AA-D792-40E1-8BFE-C0DDC1BB1BCD.gif|Nagisa\u2019\
