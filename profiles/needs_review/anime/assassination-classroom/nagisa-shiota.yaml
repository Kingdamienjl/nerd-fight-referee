    - field: weaknesses
      value: 'Nagisa can grow reckless or lack foresight during combat while focusing
        on his target Notable Attacks/Techniques: *Bloodlust: Nagisa is able to project
        his bloodlust as an aura that can cause frightening hallucinations to those
        it is directed at, paralyzing them and rendering them unable to counterattack
        as Nagisa closes for the kill. However, should Nagisa be consumed in his own
        rage, he''ll often suffer from tunnel vision and will often miss certain details
        which can allow his opponents to catch him off guard. *People Reading/Discernment:
        Nagisa developed the ability to read people''s expressions and intentions
        with ease as a result of his past experience with his controlling mother.
        There are occasions when he can detect if a person is lying or not being entirely
        truthful (e.g. Terasaka when he is plotting with Shiro) After being placed
        on the receiving end of the Reaper''s improved Clap Stunner, this ability
        somehow later evolves into a sort of advanced ability that allows Nagisa to
        analyze a person''s state of mind simply by looking at them. This is illustrated
        and/or described as "wavelengths" or "wavelengths of consciousness" of people
        that represents their breathing, line of sight, facial expression, body language
        and more. This ability allows Nagisa to find a person''s "color in consciousness,"Assassination
        Classroom; Volume 13; Chapter 112 or their next move, whether or not it will
        be safe for him to assault the target, "gaps in consciousness," or openings
        in their guard, as well as their "peak in consciousness," or the state of
        mind in which a person is highly susceptible to outside stimuli, such as the
        Clap Stunner, which he has made effective use of in different ways, from stunning
        enemies before attacking them to simple, almost trivial things such as being
        able to remove a size label from clothing without the person wearing it noticing.
        *Clap-Stunner: A typical stun clap has three conditions that must be met for
        it to be used effectively: # The user must have more than one weapon. # The
        opponent must be skilled at combat. # The opponent must have experienced the
        feeling of facing death at some point in the past.Assassination Classroom;
        Volume 9; Chapter 71 After facing The Reaper and experiencing first-hand a
        higher level of this technique, Nagisa also improved this ability to some
        degree. *Kiss of Death: Nagisa has shown some level of skill when using Irina''s
        "Kiss of Death" technique, able to acquire 15 "Hits" off of Kaede and enough
        to knock her out. Irina has remarked that Nagisa''s training in indiscriminate
        French kisses have bestowed on him remarkable enough skill to exceed his classmates
        by a large margin, as he is supposedly capable of registering a total of 40
        "Hits" if he were to place more effort into his kiss. *Japanese Self-Defence
        Forces Martial Arts: Underwent basic military training from a professional
        instructor who was at the top of his division. *Capoeira: Au Sem Mao. *Boxing:
        Overhand Punch. *Grappling: Basic Pin. *Jiu-Jutsu: Flying Triangle Choke.
        *Taekwondo: Back Heel Sweeping Kick. *Nanba: A walking method said to have
        been used by Ninjas. By moving the arms and legs on the same side together,
        you avoid excessive movement from twisting your hips and adjusting your balance,
        thereby suppressing the sounds made by the rustling of your clothes and footsteps.
        It can even be used to erase one''s presence entirely. Nagisa possesses the
        second highest stealth score in the entirety of Class 3-E. *Free Running:
        Nagisa possesses a mobility rating of 3.5/5 which shows a high proficiency
        in using this technique. The description of free-running has been provided
        in the "acrobatics" under the "general assassination skills" of the powers
        and abilities section. ==Notable Matchups== Victories: Losses: Inconclusive:
        Chisato Nishikigi (Lycoris Recoil) Chisato''s Profile (Speed was equalized,
        standard equipment but the same rubber bullets that Chisato uses are given
        to Nagisa instead of BBs/paintballs and his special PE suit were restricted)
