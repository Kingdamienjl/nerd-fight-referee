    - field: weaknesses
      value: "Nagisa can grow reckless or lack foresight during combat while focusing\
        \ on his target, and opponents with bloodlust that exceeds Nagisa's own are\
        \ not affected in the slightest. ==Notable Attacks and Techniques== Assassination:\
        \ Nagisa has an extraordinary amount of natural talent as an assassin due\
        \ to his impressive observant nature, his remarkable stealthy movements, and\
        \ his immense bloodlust. This inclination has also been made apparent numerous\
        \ times during the span of the story, such as his duels against Takaoka, his\
        \ fight against Karma, and Korosensei respectively. Several other characters\
        \ such as Karma and Maehara have noted that he is full of surprises - one\
        \ can never know when or where Nagisa will aim to strike, and his talent in\
        \ the art of assassination has garnered respect from even those who are not\
        \ his peers to the point that others have commented on the potential Nagisa\
        \ possessed that could be fulfilled in the role of a professional hitman.\
        \ Bloodlust: Nagisa possesses a massive amount of hidden bloodlust despite\
        \ his initial character, impression, and appearance which can affect his opponents\
        \ in varying ways; the most significant, powerful reaction can involve immobilization\
        \ and an inability to counterattack or to fight back, and this type of reaction\
        \ affects even trained professional assassins. This is made very clearly evident\
        \ for the first time during his mock assassination with Takaoka, and another\
        \ early event is the incident when two of his old classmates threatened him,\
        \ sparked the interest of all three of Class E's main faculty. When Nagisa's\
        \ bloodlust is released or directed at someone, it is metaphorically represented\
        \ as a large, blood-soaked snake coiled around his target with its fangs bared\
        \ and ready to strike at any moment. In later chapters, his bloodlust takes\
        \ the form of a flaming aura around him in a way that either mimics or reflects\
        \ that of the God of Death. However, if Nagisa were to lose control of his\
        \ bloodlust due to emotional provocation, his inability to rein his bloodlust\
        \ back under control is indicated in his eyes, which are illustrated as dull,\
        \ and as such can cause him to grow reckless or lack foresight during combat\
        \ while focusing on his target, apart that would cause that opponents with\
        \ bloodlust that exceeds Nagisa's own are not affected in the slightest. Nekodamashi\
        \ Clap: combat technique used to stun, or even temporarily paralyze a target.\
        \ However, if the target's conscious wavelengths are erratic, the user would\
        \ not be able to find the peak necessary to perform the technique. Furthermore,\
        \ the effect of the stun can be drastically negated if the target shifts their\
        \ consciousness somehow, which was notably exploited by Karma, who bit his\
        \ tongue in order to do so. People Reading: People Reading/Discernment: Nagisa\
        \ developed the ability to read people's expressions, intentions, and most\
        \ of their actions' reasons with ease as a result of his past experiences\
        \ with his mother, Hiromi Shiota, and after being placed in the Class 3-E,\
        \ even more after meeting Koro-sensei. There are occasions when he can detect\
        \ if a person is lying or not being entirely truthful, such when Terasaka\
        \ was plotting with Shiro. After being placed on the receiving end of the\
        \ God of Death's improved Clap Stunner, this ability later evolves, now allowing\
        \ Nagisa to analyze a person's state of mind simply by looking at them, being\
        \ described as \"wavelengths\" or \"wavelengths of consciousness\" of people\
        \ that represent their breathing, line of sight, facial expression, body language\
        \ and more. Marksmanship: In June, Nagisa scored 84/200 in Marksmanship, making\
        \ him the fifth best among the boys and seventh overall amongst his class.\
        \ Kiss of Death: Nagisa has shown some level of skill when using Irina's \"\
        Kiss of Death\" technique, able to acquire 15 \"Hits\" off of Kaede. Irina\
        \ has remarked that Nagisa's training in indiscriminate French kisses have\
        \ bestowed on him remarkable enough skill to exceed his classmates by a large\
        \ margin, as he is supposedly capable of registering a total of 40 \"Hits\"\
        \ if he were to place more effort into his kiss. ==Others== Notable Victories:\
        \ *Son Goku (Dragon Ball) Goku\u2019s profile (CSAP Match Archive #47. 7-C\
        \ versions were used and speed was equalized) Notable Losses: *Izuku Midoriya\
        \ (My Hero Academia) Izuku\u2019s profile Inconclusive Matches: ==Gallery==\
