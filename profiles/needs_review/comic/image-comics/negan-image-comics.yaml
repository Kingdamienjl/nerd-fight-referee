      value: Gifted (Negan is depicted as a highly intelligent character in the series.
        He demonstrates a keen strategic mind, particularly in his ability to lead
        and maintain control over the Saviors, a large and formidable group that imposes
        its will on other communities through fear and coercion. He is adept at using
        psychological tactics to assert dominance and loyalty among his followers.
        Has a profound understanding of human psychology, which he exploits to manipulate
        individuals and situations to his advantage. He is skilled at reading people,
        understanding their motivations, and using this knowledge to influence or
        control them. Negan's intelligence is also evident in his resourcefulness
        and adaptability. He is capable of making the most out of difficult situations,
        using whatever resources are available to secure advantages for himself and
        his group. His charisma and leadership are partially rooted in his intelligence.
        Negan knows how to inspire fear, respect, and even loyalty among his followers.
        He uses a combination of force, persuasion, and incentives to maintain order
        and discipline within the Saviors. He is adept at planning and executing attacks
        against other groups. He understands the importance of psychological warfare
        and uses it effectively against his enemies, often employing brutal tactics
        to instill fear and submission. Throughout the series, Negan shows an ability
        to adapt to changing circumstances and to learn from his mistakes. This adaptability
        is a testament to his intelligence, as he is constantly reassessing his strategies
        and approaches in light of new information)
