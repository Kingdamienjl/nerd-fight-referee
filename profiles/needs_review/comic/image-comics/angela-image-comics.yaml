  intelligence:
    text: Gifted. Being well-renowned as a legendary warrior and hunter, Angela is
      deceptively intelligent. In addition to possessing roughly 100,000 years of
      combat experience and achieving top marks in her class, she's able to track
      a Hellpsawn's whereabouts as she was able to successfully lure a newly created
      and confused Medieval Spawn to a remote location before finishing him off with
      her Dimensional Lance. During her return to Heaven, Angela managed to form a
      plan with her friends to bring down her accuser, Gabrielle by secretly recording
      the conversation where Gabrielle confessed to all her crimes, later turning
      the evidence over to her lawyer, Callindra.
    source_ids:
