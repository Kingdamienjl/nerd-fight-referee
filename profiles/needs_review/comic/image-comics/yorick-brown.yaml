    - field: weaknesses
      value: 'The Smart Atoms of a Viltrumite cannot withstand high temperatures for
        long periods of time, with prolonged exposure heavily weakening their strength
        and durability as the atomic bonds are ripped apart. Pinpoint high frequency
        sound waves can disrupt a Viltrumite''s inner ears and highly sensitize equilibrium,
        disrupting their flight, causing intense pain or potentially death. The Scourge
        Virus is a specially engineered virus that infects Viltrumites and severely
        hampers their strength and invulnerability, usually resulting in death. The
        Klaxus Plant will poison and weaken the species. Rognarr are an alien species
        that evolved on a planet of such high gravity that they needed denser muscle
        tissue just to survive and move. These aliens are capable of easily killing
