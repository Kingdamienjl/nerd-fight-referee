- id: claim-powers-and-abilities-32a50841
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= *Superhuman Physical
    Characteristics * True Flight *Martial Arts (Viltrumite culture is imperialistic
    and driven by a doctrine where only the strong should survive.The Official Handbook
    of the Invincible Universe All world-conquering viltrumites would be put through
    auditions to test their skillsInvincible #11 and later on train with veteransInvincible
    #55 to better their fighting style) *Longevity (The older viltrumites get the
    slower they age, allowing them to live for thousands of years) * Regeneration
    (Low-Mid over time) and Immortality (Type 2 & 3; As long as the brain and heart
    remain mostly intact the viltrumite body will repair itselfInvincible #141, healing
    from severe head traumaInvincible #65-#68 and bone and organ damageInvincible
    #72-#74. Their physiology allows them to recover from physical damage at an extremely
    accelerated rateThe Official Handbook of the Invincible Universe, enabling them
    in fights with injuries as severe as their guts spilling outInvincible #28-#29Invincible
    #115, skin incineratedInvincible #64/#140 or brain exposed) * Adaptation (Viltrumite
    DNA aggressively self-repairs and adapts to maintain its structure, ensuring its
    own survival when combined with DNA from another species by gradually replacing
    it, and their individual molecules will perform their functions in extreme conditions)
    * BFR (Can punch opponents into spaceInvincible #86) * Enhanced Lung Capacity
    (Viltrumites can hold their breath for up to 2 weeksInvincible #5) * Telepathy
    via C.O.P earpiece (Alien technology allows him to speak telepathically with others
    using equivalent technology in spaceInvincible #71. Without it, the discussion
    works only one way) * Shockwave Generation (Should be able to replicate what Invincible
    and Conquest have done to their opponents as all Viltrumites share the same powers)
    Resistance to: * Fire Manipulation (Comparable to Invincible, who can survive
    Furnace''s fire blastsInvincible #19) * Radiation Manipulation (Can travel through
    space without any ill effects. Comparable to Invincible, who survived being at
    the epicenter of a nuclear explosionInvincible #52) * Electricity Manipulation
    (Comparable to Invincible, who can endure and power through electrical attacksInvincible
    #59/#79/#81) * Temperature Manipulation (Viltrumite atoms'' ability to exchange
    energy with the background changes their temperature where needed, allowing normal
    bodily functions to continue even when the outside temperature is near absolute
    zero or as hot as the surface of a star. In short bursts, they can withstand temperatures
    even hotter than the sun) * Gravity Manipulation (Viltrumites'' atoms can ensure
    the molecules behave normally even under extreme forces and be forced to maintain
    their relative positions in the air, allowing them to operate in planets with
    a severe gravitational quotientInvincible #35 without issue) }}'
