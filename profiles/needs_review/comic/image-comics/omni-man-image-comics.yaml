- id: claim-weaknesses-3e7abc62
  section: weaknesses
  axis: weakness
  text: 'The Smart Atoms of Viltrumites cannot withstand high temperatures for long
    periods of time, with prolonged exposure weakening their durability as the atomic
    bonds are ripped apart. Pinpoint high frequency sound waves can disrupt a Viltrumite''s
    inner ears and highly sensitize equilibrium, disrupting their flight, causing
    intense pain or potentially death. The Scourge Virus is a specially engineered
    virus that infects Viltrumites and severely hampers their strength and invulnerability,
    usually resulting in death. The Klaxus Plant will poison and weaken the species.
    ==Gallery== {{Scroll box|content= Omni-Man Supra-Man Concept art.webp|Omni-Man''s
    original design. F777d2c750699dd965c58a97d4991a22.jpg|Invincible TP New Edition,
    Vol. 2 90003534a95cb4b519b465ed2ae29610.jpg|Invincible #138, THE END OF ALL THINGS,
    Part Six Of Twelve. E6dfa1edb2094fccb5f5c09091676e3d.jpg|End Of Series. D6e2dc6c316541eaf8168ef427ce1d63.jpg|Art
    done by Ryan Ottley 74c7e44be9ccd479ca7ca4589f1c293b.jpg|Art done by Ryan Ottley
    0ff21b4cc5a343aab796e14ab504078a.jpg|Art done by Ryan Ottley CFB82C83D81D46B09EB23F4CF240C7C0.webp|
    Variant cover 39e94319db545336283b36def9fbd7d7.jpg|Invincible #12 (SDCC Exclusive)
    Invincible 01 Variant Bergamo2025 Omni-Man cover NS.jpg| ariant cover B704ace2fd864f581f65b5100ca35e6d.jpg|Omni-Man
    leaves Earth. 7632d98ddfbe8e060c5ea643c1ffc4b7.jpg|Art done by Ryan Ottley 1935f302a00b61b7a419780004ff73dc.webp|Invincible
    Vol. 22 TP 43a9d6d4895cbf35f9b20397787c39f7.jpg|Reboot Arc 1-c77259519ccad08e90bb3b441a9c593c.webp|Supreme
    Vs. Omni-Man! crossover 0c82ae5656336d9994e46c31d056b50d.jpg|Omni-Man, Captain
