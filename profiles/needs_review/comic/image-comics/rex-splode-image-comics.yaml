        men while younger. Fends himself off against the Reanimen. Rex was trained
        specially in hand-to-hand combat, with it being noted that he received rigorous
        training in various forms of martial arts and wrestling), Cyborgization (Partial:
        Has a robotic hand), Explosion Manipulation, Self-Destruction (Can blow up
        his entire skeleton), Matter Manipulation, Plasma Manipulation and Heat Manipulation
        (He was also fitted with bioelectromagnetic synthetic implants in both his
        forearms that extend down through the pronators and supinators of the wrist
        and end along the flexors and extensors of the digits. When activated by synaptic
        impulses from from h his brain the devices are capable of charging molecules
        to an unstable level, making aking any inorganic inom object he can hold in
        his hands volatile and explosive. The charged particies create visible fields
        of plasma that envelop the affected items The combustive object can then be
        thrown at a target where upon striking it will cause the item to explode.
        The generation of heat in large quantities accompanies the explosive chemical
        reaction. It is this rapid liberation of heat that causes the gaseous products
        of reaction to expand an and generate high high pressures. This rapid generation
        of high pressures of the released gas constitutes the explosion. The detonation
        is initiated by the application of shock or impact to a small portion of the
        mass of the explosive material. The blast is equal in damage and effect to
        the relative size of the hurled object), Danmaku (His robotic hand can use
        rapid-fire attacks), Stealth Mastery, Pain Suppression, Regeneration (Low)'
      source_id: character-stats-profiles-rex-splode-image-comics
      provider_id: character_stats_profiles
