    - field: attack_potency
      value: Wall level (270 KJ-Can fight with those who can harm him. Killed Joe
        by biting his throat out. Comparable to Daryl, who could harm Beta, who tanked
        falling down an elevator shaft. Almost killed Tyreese with six punches. Knocked
        out Aaron with a single punch. Busted a door open, and he did the same in
        a heavily weakened state. Killed a walker with a single kick.. Broke the nose
        of a decapitated head. Broke a wooden plank off a door in weakened state.
        Could trade blows with the Governor in a weakened state. Traded blows with
        Negan and Shane.) Street level to Wall level with weapons (Has used a variety
        of weapons throughout the main show on both walkers and opposing groups, like
        his iconic Colt Python and several other firearms and melee weapons that are
        around this level. Used an M67 Grenade to break out of the CDC building.)
        | Wall level (Got stronger after training in the Civic Republic Military.
        Traded blows with Pearl Thorne who survived a massive explosion.). Higher
        with his prosthetic hand (Used his prosthetic hand to destroy the stone growths
        on the head of a walker. Defeated a larger CRM soldier and crushed his helmet
        and skull with several blows.)
      source_id: character-stats-profiles-rick-grimes-image-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
