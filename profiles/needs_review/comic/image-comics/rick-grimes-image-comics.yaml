      value: Wall level (Survived a massive explosion that destroyed a bridge. Has
        withstood blows from Merle, Shane, Tyreese, The Governor, Jesus, Negan and
        Daryl. Can tank hits from Lucille, which can crush skulls. Didn't even flinch
        when Pete, a full grown man, punched him in the face. Survived a M67 grenade
        explosion, albeit he was several meters away. Fell into a pit with Daryl without
        getting injured. Shrugged off a fall from a few meters, could do the same
