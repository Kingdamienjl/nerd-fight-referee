    - field: weaknesses
      value: 'Pre-metamorphosis Spawn still needs oxygen. (Comic Issue 33) Notable
        Attacks/Techniques: Fear Manipulation Explanations: If hell and the black
        abyss being the same thing wasn''t obvious enough, Violator is a native of
        Hell and part of Malebolgia''s children, he wants him and the other natives
        to be the leaders of hell''s army instead of the hellspawns, now that this
        context is established, we can make the connection between the black abyss
        and hell, by Violator saying he is born in the black abyss. (Comic Issue 15
        and 50) In the Spawnverse the more souls you collect, the more powerful you
        become (Comic Issue 81) in the context of your powers. (Comic Issue 82) Spawn
        has six thousand souls inside him, and also consumes the people he has killed,
        layering his abilities to such degrees. (Read justification for multiple souls
        and absorption.) ===Addressing allegedly antifeats for Spawn: === ==== How
        can Spawn be faster than light if his teleportation is stated to be speed
        of light? ==== *Teleportation in Spawnverse doesn''t just serve as a way to
        fast travel, but a way to navigate to and through entities. Al doesn''t have
        to know the actual pathway to a location if he teleports, as the teleportation
        does that job for him, (Comic Issue 9) it also allows him to go through obstacles
        that he normally wouldn''t be able to. (Comic Issue 11) This ability also
        works on others, with that giving natural benefits like them also being split
        into atoms. Overall the teleportation''s pros are not only its speed, so that
        area being negated by Al''s faster speed doesn''t matter. It''s also fair
        to assume that his teleportation gets faster in the series just like his body
        does, throughout the series Al keeps learning new aspects of his powers, with
        that being both physical and mental. ==== He needs weapons that can level
        a small building to defeat Overtkill. ==== *This was an early Spawn, that
        hadn''t grasped his powers yet, nor had the luxuries of learning more about
        them like his future self does, there is also a difference in what Al can
        do in his own mindset and what he can do if he allows K7-Leetha to take over
        like it did when he erased himself with Angela''s angelic lance. ==== Twitch
        hits Spawn with a bullet. ==== *Twitch is a (Comic Issue 23) sharpshooter
        (Comic Issue 30) and Al didn''t pay any attention to the bullet, he didn''t
        even react when it hit him and just kept running. (Comic Issue 23) ==== Al
        couldn''t react to the nazis'' bullet. ==== *Al was poisoned at this time,
        with this poisoning leaving him badly weakened, (Angela Issue 4) throughout
        his journey in Alabama he didn''t try, (Comic Issue 30) nor did use any energy
        from his suit. (Comic Issue 31) ==== Al thought that his infiltration mission
        would take twenty minutes tops. ==== *Al didn''t want to use any of his powers,
        (Comic Issue 55) he also wanted to savor this mission as it links to his past
        life, making him feel human again. (Comic Issue 55) Al in general loves military
        related actions, (Comic Issue 138) which is constantly (Comic issue 105) shown
        throughout the series. (Comic Issue 148) This obviously implies Al holds back
        when it comes to these situations, so he can savor them. ==== Al went blow
        for blow with Cy-Gor for ten minutes. ==== *In general, the previous reasoning
        also applies here, but it''s worth mentioning that beasts in Spawn verse have
        a link with Satan, they are filled with black energy, which can power Al,
        (Comic Issue 44) these beasts with black energy have feats against angels
        as well. (Comic Issue 45) ==== Al couldn''t react in time to save Twitch from
        a bullet. ==== *This version of Al is half fused with his wounded human self,
        meaning that how he used to operate with his dead body isn''t the same as
        this one so it needs rest, (Comic issue 133) not only that but it''s stated
        that Al wasn''t as strong as he used to be in this timeperiod, to the point
        that sensing agony in the city was a new ability for him again, (Comic Issue
        128) despite his previous self being able to do this without any effort. (Comic
        Issue 105) ==== Al wasn''t fast enough to stop Wanda from shooting herself.
        ==== *The previous refutation to Twitch''s similar situation can be applied
        here, we know this to be the exact case, given how the Mother of Creation
        stops the bullet by slowing down time, (Comic Issue 159 and 160) something
        Al could previously do without any effort too. (Comic issue 116) We''re also
        reminded later on that Al''s power limiter that Malebolgia gave him was still
        in play in this time period, with that leaving him at his weakest state ever.
        (Obviously excluding external factors like him being poisoned) (Comic Issue
        160) Notes: I dropped the series after issue 164. Category:Stolp __NOEDITSECTION__'
