    - field: attack_potency
      value: Small Building level with Military Weapons (With Military weapons Al
        has enough fire power to level a small building, (Comic Issue 7) or a bulletproof
        cyborg (Comic Issue 6) that can destroy tanks. (Comic Issue 6)), Small Building
        level (Fought and beat fifth heaven's elemental fire anti-spawn to the point
        that the fifth heaven operators deemed that the anti-spawn needed to be more
        powerful before fighting Al, an anti-spawn that could already track Al through
        time and space, basically making it irrelevant of when or where Al hid, the
        anti-spawn would find him and try to finish the job. (Comic Issue 17) This
        anti-spawn had shown more raw power than Al has ever faced before, with him
        questioning if he is even stronger than him, this includes being stronger
        than Overtkill. (Comic Issue 17)), Large Island level (Al has been able to
        fight angels such as Angela, a high class angel. (Comic Issue 44) To the point
        that the angels supervisors would only accept someone above Angela if they
        beat Spawn who beat her. (Comic Issue 44) Lilith has always wanted to know
        if an angel could really take damage as well as they can dish it out, implying
        she talks about angels in general. (Curse Of The Spawn Issue 15) She then
        proceeds to generate a fire with heat many times the surface of the hottest
        star, with that being just a light bulb for Abe. (Curse Of The Spawn Issue
        15) Lowballing this to mean four times (since 'many' is a word that exceeds
        the word 'several' which means at least three) we get this value.), Solar
        System level (While reconfiguring reality Al had enough power to make air
        as heavy as the heart of a star, (Comic Issue 9) which requires this much
        energy. This calculation utilises energy-mass conversion (E = mc^2), we know
        that this is accurate as the narrator describes the feat as Al creating mass
        via pumping the air with energy (specifically heat), meaning the mass was
        converted from energy.), High Universe level (Al's previous power was as nothing
        compared to the new power he gained while reconfiguring reality. (Comic Issue
        10)), Universe level+ (Spawn can utilise magic, (Comic Issue 20) something
        that is considered as an extra-dimensional force, beyond hocus-pocus and mere
        spiritualism by Houdini himself. (Comic Issue 19)), Possibly High Universe
        level to Multiverse level (Spawn beat Preston who's powers grew beyond measure,
        with it going to be greater than worlds soon after. (Comic Issue 104)), Multiverse
        level (While Spawn was reconfiguring reality he took upon the powers to shift
        the very axis of the multiverse, (Comic Issue 10) with there existing at least
        a billion universes, (Comic Issue 20) and possibly even billions of them.
        (Curse Of The Spawn Issue 10)), Outerverse level (Spawn made a war cry that
        shook the very timbers of creation, reverberating across worlds. (Comic Issue
        100) This should obviously include hell, it's even said to be a thing that
        was created by God (Comic Issue 49) also consistent with how hell is his shadow.
        (Comic Issue 53). Hell is a place that is not a place nor an idea, it transcends
