- id: claim-weaknesses-651f6028
  section: weaknesses
  axis: weakness
  text: 'The Smart Atoms of Viltrumites cannot withstand high temperatures for long
    periods of time, with prolonged exposure weakening their durability as the atomic
    bonds are ripped apart. Pinpoint high frequency sound waves can disrupt a Viltrumite''s
    inner ears and highly sensitize equilibrium, disrupting their flight, causing
    intense pain or potentially death. The Scourge Virus is a specially engineered
    virus that infects Viltrumites and severely hampers their strength and invulnerability,
    usually resulting in death. The Klaxus Plant will poison and weaken the species.
    ==Gallery== Thragg Vol 1 129.webp|Aura Farming. RyanOttleyViltrumites.webp|Thragg
    and his fellow Viltrumites. Modern Family Part 6.webp|Invincible #120. New-edition-covers-for-volumes-13-14-v0-y6nvwp77zq6f1.jpg|Invincible
    TP New Edition, Vol 13. Images (48).jpg|Thragg VS Battle Beast - Invincible issue
    #115. Ryan Ottley''ss.jpg|Art done by Ryan Ottley. V.CT THRAGG.jpg|Variant Cover.
    Invincible Vol 1 120 002 (1).webp|Thragg finally kills Battle Beast - Invincible
    issue #120. RDT 20260702 2034197483413576045083619.jpg|A scared Conquest bowing
    at Thragg - Invincible Returns issue #70.5. Invincible Vol 1 120 003.webp|Thragg
    healing after his fight with Battle Beast. CHAPTER 140 COVER.jpg|Invincible issue
    #140 - The End of All Things - Part eight of twelve. 625053341 18106196764749675
    7646296574328245773.jpg|Art done by Ryan Ottley. Thragg''s Battle with Mark, His
    Final words.jpg|"Oh, Hell--" Thragg''s Final words. ==Notable Matchups== Victories:
    Losses: * Battle Beast (Invincible) Battle Beast''s Profile (Pre-Timeskip Thragg
    was used, the battlefield was Thraxa, starting distance was 20 meters apart, Battle
    Beast had his weapons and his jetpack, both were bloodlusted) * Adam (Hellaverse)
    Adam''s profile (Adam was Low 5-B. Battle took place in Hell. Speed was equalized)
    Inconclusive: * Kamen Rider Punkjack (Kamen Rider) Punkjack''s Profile (Conspiracy
    Arc Kamen Rider Punkjack & Post-Timeskip Thragg were used. Punkjack is allowed
    to use the Fever Buckle, but not any form of Fever Boost, and the Boost Buckle
    is also restricted. Fight took place in Cynosure Facility and Starting Distance
    is 250 meters. Speed was not equalised) * Might Guy (Naruto) Guy''s profile (Post-Timeskip
