        Could trade blows with the Governor in a weakened state. Traded blows with
        Negan and Shane.) Street level to Wall level with weapons (Has used a variety
        of weapons throughout the main show on both walkers and opposing groups, like
        his iconic Colt Python and several other firearms and melee weapons that are
        around this level. Used an M67 Grenade to break out of the CDC building.)
        | Wall level (Got stronger after training in the Civic Republic Military.
