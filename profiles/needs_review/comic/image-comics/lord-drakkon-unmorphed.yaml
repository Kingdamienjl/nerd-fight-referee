    - field: powers_and_abilities
      value: '* Superhuman Physical Characteristics * Regeneration (High-Low, Low-Mid
        overtime) * BFR (Can throw people into space) * Longevity (Lived for thousands
        of years) * Martial Arts (Fought with Battle Beast, a combat genius, in a
        fight that lasted days. Was bred to be the most skilled and powerful Viltrumite)
        * Telepathy (Has Alien technology in his ear allowing him to hear and transmit
        thoughts) * Flight * Immortality(Types 2 and 3: As long as the brain and heart
        remain mostly intact the viltrumite body will repair itself) * Adaptation
        and Reactive Evolution (Viltrumite DNA aggressively self-repairs and adapts
        to maintain it''s structure, ensuring it''s own survival when combined with
        DNA from another species by gradually replacing it, and their individual molecules
        will perform their functions in extreme conditions) * Enhanced Senses * Social
        Influencing (Succesfully convinced Invincible and Omni-Man on a truce, threatening
        with his forces destroying the planet were they to retaliate, and Allen the
        Alien, mentioning that even if he were to be infected with the Scourge virus,
        he''d be able to kill him and it''d ultimately accomplish nothing. Led the
        Viltrumite Empire for thousands of years and kept it''s stranglehold on the
        galaxy even with their dwindling numbers) Resistance to: * Extreme Cold &
        Cosmic Radiations * Gravity Manipulation (Viltrumites'' atoms can be forced
        to maintain their relative positions in the air, as well as ensure the molecules
        behave normally even under extreme forces, allowing them to operate in planets
        with a severe gravitational quotient without issue) * Absolute Zero, Cosmic
