    \ manipulate matter at the subatomic level, letting her reshape or create almost\
    \ anything. She\u2019s one of the strongest non\u2011Viltrumites, capable of massive\
    \ constructs, flight, shields, and large\u2011scale environmental changes. Her\
    \ powers are limited by mental blocks that stop her from altering living beings.\
    \ ==Powers and Stats"
