    - field: weaknesses
      value: 'A downside to Atom Eve''s transmutation powers is that she absorbs any
        unused atoms into her body, which must later be eliminated from her system
        as waste. She claims that on days when she uses her powers a lot she can "go
        to the bathroom" six or seven times. Her mental blocks can only be overcome
        through extreme mental stress like severe trauma or near death experiences.
