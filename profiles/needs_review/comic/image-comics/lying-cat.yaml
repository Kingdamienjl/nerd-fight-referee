    - field: attack_potency
      value: At least City level (The awakening of Ogre Rancorem launched a beam of
        light into the sky, moving the clouds within a wide range of it. Defeated
        Salamander, the elemental spirit of fire who has the power to control a volcano's
        activity), likely far higher (The awakening of Ogre Rancorem and his ability
        to use Another Force completely shocked the Beast King, Guildna, and despite
        being one-shot by him, he still managed to somewhat hold back a serious attack
        from him. Contended with a suppressed Vares, who should be as strong as his
        late-game self and at least somewhat comparable to Guildna and Altena. By
        sacrificing themselves, Salamander and the other Elementals were able to heavily
        suppress the damage dealt by the combination of a timequake and a shockwave
        from the Corridor of Time Layers, with regular timequakes alone being repeatedly
        implied and stated to be spacetime-threatening events) | At least Low Complex
        Multiverse level (In the Tower of Time's "Time Space", he fought and overpowered
        the Visus Embryo, which is a device primarily used to change the world, as
        well as rewrite history and remake the future, sending massive tremors all
        throughout space-time in the process. It has been repeatedly stated that there
        are infinite existing worlds and possibilities, in addition to time being
        endless, as well as numerous dimensional layers, including a higher temporal
        dimension known as the "Time Ghost Layer", meaning the Visus Embryo's feats
        can affect an infinite, at least 5th dimensional multiverse. Destroyed the
        Time Layer Distortion, which is a temporal distortion given physical form
        that was created by Xeno Prisma, the same thing which can cause timequakes
        and heavily strain and warp space-time. Defeated Ogre Rancorem itself, thus
        unlocking the full extent of its power, as well as Guildna. Fought on par
        with Chronos Menas and Eden, who contain the Alpha Geo and its power, which
        is meant to be a sort of antithesis to Xeno Prisma, also being capable of
        tearing a hole in space-time. Defeated the Phantom of the Persona Symphony,
        who is likely superior to the main story's Phantom and was going to harness
        and "encourage" enough human desires to cover all worlds in total chaos and
        darkness), possibly High Hyperverse level (Defeated Geo Anguirus, the fusion
        between Altena, Feinne, the latter's Geo Prisma, and elemental Prisma, with
        the energy of said fusion being stated to simply continue growing exponentially.
        Geo Anguirus was seemingly able to crack space-time, sending the party to
        some sort of void, and it possesses the power of Feinne's Geo Prisma, which
        was harnessing the power of an infinite number of dimensions and, as a result,
        countless worlds. Whether the dimensions referred are spatial or simply universes
        isn't entirely clear. However, based on the Japanese wording of the statement,
        as well as the fact that Another Eden often uses dimensions in either a spatial
        or temporal sense, namely with the Time Ghost Layer, it's possible that the
        statement was indeed referring to infinite spatial/temporal dimensions)
