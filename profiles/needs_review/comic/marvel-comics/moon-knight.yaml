    - field: weaknesses
      value: 'Marc can be quite self-destructive. His personalities have different
        set of memories, so sometimes he isn''t aware of it. HIs armour has exposed
        parts, which can be fatal to him, if exploited. Marc cares deeply about nature,
        and is willing to let people get harmed as long as Nature does what it needs
        to do. He is willing to go to extremes to make sure an enemy is defeated.
        Made himself be absorbed by Moon Shade so he could defeat him from inside.
        Empowered by Khonshu''s Priest''s spirit=His power can go up and down depending
        on the visibility of the moon - this was later revealed to be work of his
        willpower. His mind can also change his power levels. When the Moon Kings
        attacked, he was hallucinating and thought he was fighting a stronger enemy,
        which led his power to fluctuate. At a time, Marc thought Khonshu''s power
        comes to him via a statue as well, so when that was destroyed, he thought
        he lost his powers. Classic fist of khonshu His strength relies on the visibility
        and glow of the Moon., The demon was causing Marc''s body to start to mutate
        and decay, By any means necessary: Moon Knight is not afraid to seriously
        hurt himself if it means he will get the upper hand on an enemy. When a villain
        forced him into a hallucination, he started cutting himself up slightly to
        keep himself "awake"Moon Knight Vol 1 22., He is also not afraid to lose a
        lot of money as long as he defeats an enemy. For example, he let his plane
        gets destroyed so he could sneak into a base., This file only covers Moon
        Knight''s appearances until House of M Vol 1 7, just before the start of Moon
        Knight Vol 5. Due to a lot of changes in Moon Knight Vol 5, the character
        has been split into two profiles for sake of consistency and accuracy. Therefore,
        there is no backscaling done in this profile. However, modern version''s base
        may scale to his classic version., From his first appearance until Moon Knight
        Vol 1 36, a Spirit of Khonshu''s priest was in his body, implying that it
        was empowering him. After the Spirit left, Moon Knight continued fighting
        crime but had no powers until Khonshu took residence in his mind and began
        to empower him (Moon Knight Vol 2 1/Moon Knight: Fist of Khonshu (1985) #1
        ). Khonshu would then leave him during West Coast Avengers Vol 2 41, leaving
        Marc powerless once more., From Marc Spector: Moon Knight Vol 1 33/34 - to
        Marc Spector: Moon Knight Vol 1 46, he was empowered by the Demogoblin, as
        he was infected on a deep level., After his death in Marc Spector: Moon Knight
        Vol 1 60'
