    - field: intelligence
      value: 'A very cunning and smart person, who finds a way to take advantage of
        his disadvantages. Helped build the technologies he use regularly, including
        vehicles, which uses Lunar Energy as a power source. Created different public
        personas around his different personalitiesMarvel Fanfare Vol 1 30 and formed
        connections at various levels. Has studied astrologyWest Coast Avengers Vol
        2 26 extensively and was able to use his knowledge of astrology to locate
        an enemy. Used his detective skills to track down Randall and stop him before
        he killed MarleneMarc Spector: Moon Knight Vol 1 38 . Picked up on various
        types of skills, such as rock climbing and wall climbing. Rewired electricity.
        * Managed to break into Latverian embassy and bypassed it''s security and
        traps that were built by Doctor Doom. Is a decent enough detective, who was
        able to find information on various mob bosses and organisations by connecting
        dots. Was able to find out about a secret meeting between mob bosses and crashed
        it. After seeing his alternate reality counterpart use some weapons, Marc
        took a note of it so he could replicate them when he returned back to his
        own universe. Rerouted his Avengers ID signal to use it for something else.
        Information gathering: * Created the Shadow Keep/Shadow Cabinet - a group
        of individuals he has gathered from various places in society to give him
        the right intel and information when he needs it. This includes a news report,
        a police sheriff, among others. To make sure they can provide him quality
        information, he has hidden his identity from them - they do not know who they
        are working for. Has a doctor on payroll to test things for him that the public
        can''t and shouldn''t know about. * Steven Grant: To create connections with
        people in the higher echelons of society, As Steven Grant, he created a business
        using the money he earned as a mercenary. He spends his wealth publicly on
        businesses and sometimes philanthropy, but privately, uses that wealth to
        upgrade his gear and tech. *Jake Lockley: To maintain an eye on the ground,
        he turned one of his personalities, Jake Lockley, into a New York Cabbie so
        he could gather information since things tend to spread quickly at that level.
        Using his connections at this level, he was able to find out that a villain
        was targeting the Mayor. Sometimes its easier for him to tail a criminal as
        Jake than it is to do so as Moon Knight. Jake also has connections with other
        superheroes as well, who might not be aware of his status as Moon Knight.
        Thanks to his years of mercenary work, he is a master of various types of
        weapons, such as guns, swords, and other things. Mastered every weapon ever
        invented. Can utilise his equipment in different ways to save him from dangerous
        situations. For example, when Arsenal tied him to ropes under water, he was
        able to use his darts and throw them at an angle to free himself. When he
        noticed that Killgrave could effect people with his voice, he stuffed his
        ears with something so he can''t hear his voice. Uses his cape to his advantage,
        such as faking getting hit by a sword to have his enemy lower their guard
        - and also for him to hide his weapons under his cape. When he realised he
        couldn''t do anything against the Raptor physically, he quickly analysed the
        armour and removed the batteries to defeat himMarvel Super-Heroes Vol 2 1.
