        was targeting the Mayor. Sometimes its easier for him to tail a criminal as
        Jake than it is to do so as Moon Knight. Jake also has connections with other
        superheroes as well, who might not be aware of his status as Moon Knight.
        Thanks to his years of mercenary work, he is a master of various types of
        weapons, such as guns, swords, and other things. Mastered every weapon ever
