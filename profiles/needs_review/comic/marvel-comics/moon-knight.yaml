    - field: stamina
      value: 'Beat up the Hatchet Man, despite being massively wounded. Despite fighting
        a lot of criminals, and then being stabbed, he was able to power through and
        defeat the enemy, saving the city. Stayed underwater for a while until he
        could break a wall. Didn''t eat for days. After being tired under water for
        a long time, he managed to free himself and as soon as he was free, fought
        Arsenal, and even ended up defeating himMoon Knight Vol 1 20. After getting
        hit in the chest with a knife and thrown to the river, Marc fought tirelessly
        against the oceanic stream and managed to return back to the surface. He nearly
        died in the process - actually, he thinks he might have died and been resurrected
        again, but his record might not be accurate as he was halucinating. After
        coming back, soon after he fought Scarlet and eventually overpowered her.
        Empowered by Khonshu''s Priest''s spirit=Greater than before. Fought a guy
        who could drain energy from people, making them weaker Can fight for prolonged
        periods of time without getting tired. Swam underwater under a large mansion.
        Fell through two storeys. Fought against Black Spectre despite sustaining
        wounds and injuries. Even greater than before. The Moon and it''s visibility
        plays a role on his stamina. The brighter the Moon, the more stamina he will
        have. Greater than in base. After fighting Doctor Doom, he was damaged so
        much, that he only had days left. However, despite that, he managed to fight
        many different villains, including Moon Shade who had stolen Franklin Richard''s
        power.Marc Spector: Moon Knight Vol 39 - Marc Spector: Moon Knight Vol 1 46'
