        Megingjord will later leave Thor in such an exhausted state he can barely
        walk, while the Warrior''s Madness robs Thor of his ability to differentiate
        between friends and foes). He has sometimes been portrayed as susceptible
        to the charms of extremely beautiful evil women, in particular Amora the Enchantress.
