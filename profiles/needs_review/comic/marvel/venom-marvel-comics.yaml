- id: claim-weaknesses-c99811aa
  section: weaknesses
  axis: weakness
  text: 'Venom/Toxin/Magic Venom= *Mental Instability: Eddie has been repeatedly shown
    relapsing into his unstable "lethal protector" mindset. As both Venom and Toxin
    he reverts to this persona, killing criminals just as offhandedly. He is also
    addicted to the power bestowed upon him by being bonded to a symbiote, which has
    causes drastic shifts in his personality. *Sonic and Heat: The Venom symbiote,
    like all others of its kind, is vulnerable to heat and sonic based attacks. They
    can cause the symbiote physical pain and discomfort, though as Venom has evolved
    this weakness only applies to exceedingly powerful applications of these attacks.
    The Toxin symbiote is more resilient to these attacks than most other members
    of its species. |-|Anti-Venom= *Mental Instability: Eddie has been repeatedly
    shown relapsing into his unstable "lethal protector" mindset. Recently as Anti-Venom
    he''s seemingly reverted back to this persona, killing criminals just as offhandedly
    as before despite the obvious option of curing them of their drug addictions and
    actually helping them with his powers. *Darkforce: As Anti-Venom is formed from
    the Lightforce it is vulnerable to the Darkforce, which can weaken or nullify
    the suit''s healing powers. *Antibody Overuse: If Anti-Venom overuses his healing
    powers the symbiote becomes weakened and can potentially be overwhelmed and purged.
    |-|Legion/Captain Universe= Possesses severe Post-Traumatic Stress Disorder following
    his encounters with Knull. |-|The Eventuality= None notable. Note: Before making
    any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics. ==Notable Matchups== Victories: Losses: *Agent Venom (Marvel Comics)
    Agent Venom''s Profile (Flash had the Space Knight Venom, while Eddie had the
    Pre-Knull Venom. Both bloodlusted) Inconclusive: ==References== {{Scroll box|content={{Reflist|2}}}}
    ==Statistics Values== {{Discussions|Venom Edward Brock|Venom (Edward Brock)}}
