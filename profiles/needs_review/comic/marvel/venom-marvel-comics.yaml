- id: claim-powers-and-abilities-6071c476
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Venom/Toxin={{Border|Scroll=Yes|Visible=No|Content=
    *Superhuman Physical Characteristics **Multiple Selves (Type 3; Eddie Brock and
    Venom coexist in a symbiotic relationship) **Enhanced Senses (Venom has 360 degree
    vision and can see out of any part of his symbiote, and can hear heartbeats) **Immortality
    (Type 3) ***Regeneration (Mid for Eddie; Regenerated from having his head stabbed
    by Wolverine and being shot in the head,Amazing Spider-Man Presents: Anti-Venom
    - New Ways To Live Volume 1 Issue 1 High-Mid for Venom; Regenerated from being
    blown up and can regenerate from just a severed tongue) **Self-Sustenance (Type
    1; Does not need to breathe, Venom is able to process breathable gases for its
    host when they would otherwise be unable, allowing them to survive underwater
    and in space as well as filtering out toxic gasses in the air) *Acrobatics & Martial
    Arts (Possesses basic combat training) *Telepathy (All Klyntar are able to communicate
    with their hosts through telepathy, as well as communicate with the Klyntar Hivemind
