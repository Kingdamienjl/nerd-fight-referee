      value: 'Telepathy (Shown to communicate with 30 other telepaths while fighting
        the Brood. Read someone''s mind and give others the information she finds.
        Bonds the minds of every mutant on Earth so they can communicate with one
        another. Can look through the memories of others.), Analytical Prediction
        (Can predict Scott''s moves to dodge his optic blasts), Biological Manipulation
        (Can stop someone''s heart and blood flow. Can shut off someone''s nerve ending
        and was stated to be able to "unplug" a person''s nervous system), Minor Blood
        Manipulation (Stopped the flow of blood from reaching Deadpool''s brain and
        can clot Fantomex''s blood to stop his bleeding), Paralysis Inducement (Stopped
        Spider-Man and Iron Man from moving with her powers), Technology Manipulation
        (Stopped a camera from working and froze the circuitry in Fitzroy''s gloves),
        Telekinesis and minor Matter Manipulation (Stated to move objects as big as
        mountains and as small as air molecules), Flight (Can use her powers to fly
        herself and several people), Energy Projection, Absorption and Statistics
        Amplification (Can absorb the psychic energies of others. This can be used
        to increase her power.), Forcefield Creation, Extrasensory Perception (Can
        sense brainwave activity and emotions. She can also sense someone stuck underground.
        Through seeing mental images and feeling sensations, she can sense a trap
        about to happen), Mind Manipulation (Can turn off someone''s mind. Hurt Juggernaut
        through his helmet. Breaks through mental barriers placed by Onslaught.),
        Illusion Creation (Created an illusion of the X-Men fighting themselves with
        the help of Xavier, Cable and Nate. Fooled Magento into believing he killed
        Dazzler. Made an illusion to look like the X-Men are dead.), Perception Manipulation
        (Made herself invisible to the Inhumans with Rachel and Laura. Made onlookers
        not notice Beast''s appearance. Layers a false identity over the true minds
        of herself, Cable and Gambit, suppressing any hint of their mutant nature.),
        Memory Manipulation (Relives past memories with Scott. Can directly put information
        into someone''s long term memory. Can lock away a person''s memories.), Power
        Nullification via Mind Control (Turned off Thunderbird''s powers), Empathic
