        drastic shifts in his personality. *Sonic and Heat: The Venom symbiote, like
        all others of its kind, is vulnerable to heat and sonic based attacks. They
        can cause the symbiote physical pain and discomfort, though as Venom has evolved
        this weakness only applies to exceedingly powerful applications of these attacks.
        The Toxin symbiote is more resilient to these attacks than most other members
        of its species. *Mental Instability: Eddie has been repeatedly shown relapsing
