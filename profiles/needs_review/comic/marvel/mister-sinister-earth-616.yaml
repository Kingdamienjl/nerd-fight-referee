        \ of combating the likes of Thor, Hyperion, and Starbrand simultaneouslyNew\
        \ Avengers (Vol. 3) #32) | Outerverse Level with Universal Destructive Capacity\
        \ via All-Black, The Godslayer (It's stated that Thor of Earth-14412 utilized\
        \ the All-Black to defeat the likes of Galactus, which the symbiote bonded\
        \ with, causing him to go on an absolute rampage devouring worlds across the\
        \ cosmos. It's further stated that amongst the abilities of The All-Black\
        \ it has the ability to engulf celestial bodies and potentially even that\
        \ of the universe itself.\"Attack Potency \u2260 Destructive Capacity\" effectively\
        \ meaning that the potency to destroy something can be lesser than the Attack\
        \ Potency someone can deploy), Outerverse Level via Godbomb Detonation (When\
        \ detonated, the Godbomb explodes throughout all of space-time simultaneously,\
        \ causing all gods in the multiverse to simultaneously die over every second\
        \ of their lives in the past, present, and future all at once, killing every\
        \ god who lived or will ever liveThis is not referring to characters called\
