    - field: standard_equipment
      value: "thumb|right|Thor, Asgardian God of Thunder The Asgardian Warhammer Mjolnir:\
        \ Mjolnir is a symbolic weapon of Thor, a hammer forged from Uru metal, whose\
        \ chief properties are durability, the ability to maintain enchantment, and\
        \ absorb energies. Mjolnir resembles more of a short handle mallet than a\
        \ traditional Warhammer. Mjolnir itself is already extremely durable and combined\
        \ with the various enchantments placed upon it by Odin, is even harder. It\
        \ has survived heat as extreme as the heart of the Sun, and blasts powerful\
        \ enough to destroy planets. Jane Foster, when wielding a copy of the powers\
        \ of Thor, used Mjolnir to neutralise a supernova, and generated a thunderclap\
        \ that shook planets half a universe away in the process. * Worthiness Enchantment:\
        \ This enchantment surrounding Mjolnir prevents it from being wielded by anyone\
        \ save those who have been found worthy. Thus far, this includes Thor, the\
        \ Red Norvell, Beta Ray Bill and Captain America. To anyone else, Mjolnir\
        \ cannot be lifted from the ground nor wrested from Thor's grip. * Transformation:\
        \ When Thor was living on Earth under a mortal guise, he could use Mjolnir\
        \ to transform from his Donald Blake persona into Thor and vice versa. Thor\
        \ lost this ability when this enchantment was transferred to Beta Ray Bill's\
        \ hammer, Stormbreaker. Later, Odin permanently separated the two personas.\
        \ * Mystical Link: Mjolnir obeys Thor\u2019s commands as though it were alive,\
        \ and if Thor's will is strong enough, the hammer can pass through nearly\
        \ any barrier to reach him should he so chooses; Mjolnir will even return\
        \ to Thor while he is in his mortal persona as Jake Olson. Mjolnir can also\
        \ transform Thor into his civilian guises. When Thor is a civilian, the hammer\
        \ most often becomes an old wooden cane. While employing a mortal guise, Thor\
        \ would transform back into his mortal form if he was separated from Mjolnir\
        \ for more than 60 seconds. * Weather Control: Wielding Mjolnir grants Thor\
        \ the ability to control the base elements of a storm, i.e., rain, wind, thunder,\
        \ ice, snow, and more. * Flight: Thor is capable of hurling Mjolnir with great\
        \ force and, by holding onto the leather thong, is capable of flying through\
        \ the air at tremendous speeds. While in an Earth-like atmosphere, Thor generally\
        \ flies at Mach 32, and change course in mid-flight. He can hover in mid-air\
        \ with the winds like Storm. * God-Blast: Thor is capable of channeling different\
        \ amounts of his godly energies in combination with the mystical properties\
        \ of Mjolnir. These energies can be channeled through his hammer for a single\
        \ energy beam known as the God-Blast which is able to kill even immortals.\
        \ Thor used the God-Blast to destroy the Brain Dome of the mighty Celestial\
        \ Exitar. To do it, Thor reinforced Mjolnir with the Belt of Strength, which\
        \ doubles its fortification and durability. Mjolnir shattered from the amount\
        \ of power Thor channeled. Thor used the God-Blast to defeat Surtur and Ymir.\
        \ The God-Blast is so powerful that it forced Galactus to flee for his life.\
        \ The God-Blast was able to stop the Juggernaut (Cain Marko) while he was\
        \ in motion and to push him backwards, despite Cyttorak's unstoppability enhancement.\
        \ The God-Blast was also shown to be capable of knocking down the skymother\
        \ Majeston Zelia, who had absorbed the Odin-Force. Thor can send the God-Blast\
        \ to the core of Ego the Living Planet and Alter Ego and render both comatose.\
        \ Two combined God-Blasts were capable of doing harm to the Phoenix Force,\
        \ and four God-Blasts in unison were able to temporarily hold back a collapse\
        \ of the multiverse's dimensional walls, that had mortally wounded the Universal\
        \ Eternity. Thor likely used a God-Blast to end the life of the suffering\
        \ elder god Toranos as an act of mercy. * Anti-Force: Thor is capable of producing\
        \ an indescribably powerful blast known as the Anti-Force which is capable\
        \ of annihilating entire planets. Thor was able to defeat the Mangog by shooting\
        \ him the Anti-Force, with Mjolnir, inside his mouth. * Thermo-Blast: Thor\
        \ has the ability to produce a universe shaking Thermo-Blast capable of decimating\
        \ even entire planets and beings as powerful as Ego the Living Planet. * and\
        \ Redirection: Thor is able to use Mjolnir to absorb energy blasts directed\
        \ towards him as means of attack. Once the energy is absorbed, Thor can redirect\
        \ it back amplified towards the source. Thor used Mjolnir to absorb the Silver\
        \ Surfer's cosmic blasts, radioactive energy, and such as Magneto's personal\
        \ magnetic field. Mjolnir has even managed to redirect the energy of the Null\
        \ Bomb, which was created to destroy all life in the Black Galaxy, the blast\
        \ of which was shown as powerful enough to reignite a dying sun. It has also\
        \ absorbed mystical energies, such as Pluto's mystic flame. The hammer was\
        \ even able to absorb a portion of the mystical energies granted from every\
        \ god pantheon on Earth. * : By spinning Mjolnir in a precise manner at cyclotronic\
        \ speeds, Thor can manipulate matter from a molecular level to a vast scale,\
        \ which allows him to create other configurations and even allows him to the\
        \ elements themselves. This ability was evident when he transmuted the Absorbing\
        \ Man's wood and iron body to the gas helium. * : Thor was able to absorb\
        \ and manipulate the electromagnetic energies of the Celestial Mothership.\
        \ * Cosmic Energy: Mjolnir allows Thor to produce and control cosmic energy\
        \ to an unknown limit for a variety of purposes. * : Mjolnir can detect practically\
        \ all types of energy. It reacts particularly strongly to evil psychic energy,\
        \ and supernatural energy. Mjolnir can also track down the energy pattern\
        \ of someone in hiding, detect any Asgardians aura by their electrons discharge,\
        \ and can sense and track the energy radiating from mystical objects. * Nether\
        \ World Power: Thor can use Mjolnir to tap into the power of the Nether Worlds\
        \ (dark dimensions). * : By grasping Mjolnir by the leather thong and rapidly\
        \ swirling it, Thor can channel energies for the purpose of opening through\
        \ means of a vortex and in this vortex time has no meaning, which means he\
        \ and others can pass through it to their destinations instantaneously. He\
        \ can open gateways which allow him to travel across locations no matter how\
        \ great the distance within moments or even , as he does when he travels from\
        \ Asgard to Earth and vice-versa. Thor has used Mjolnir to rip the fabric\
        \ of the Universe to Surtur and Ymir to the Death Dimension and send an entire\
        \ population to Limbo, Thor can also use Mjolnir to travel through portals\
        \ anywhere within the same dimension. * : Thor's hammer has the ability to\
        \ manipulate souls. * : Thor used this ability on the super villain the Presence,\
        \ who was forced to surrender to prevent himself from being reduced to a lifeless\
        \ husk. * Illusion Detection: Mjolnir can distinguish images, holograms, and\
        \ different illusions from reality: Thor once commanded the hammer to strike\
        \ the demon lord Mephisto, who was hiding among false images of himself. *\
        \ : With Mjolnir, Thor is capable of creating powerful barriers, force fields\
        \ and vortexes that are impenetrable. Not even Earth's most advanced weapons\
        \ could weaken Thor's barrier field that shielded the U.N. headquarters. Thor\
        \ stated that he could have contained a cosmic flash attack from Stellaris,\
        \ this blast was strong enough to destroy the planet Earth. These vortexes\
        \ and barriers are so durable that they can contain explosions powerful enough\
        \ to destroy a fifth of the Marvel Universe. * : While channeling his power\
        \ through Mjolnir, Thor was able to resurrect a man he had wrongly killed.\
        \ * Alpha Particles: Thor's hammer can harness Alpha Particles from the atmosphere\
        \ and could use it to atomize any weaponry. * Negation of Mystic Energy: He\
        \ used this ability on the Juggernaut to negate the mystical energies that\
        \ allow him to generate his force-field, allowing him to defeat Juggernaut\
        \ in combat. He was able to stop Mephisto from taking human souls to the Dark\
        \ Dimension. * Undead Lethality: As a former religious relic, Mjolnir is lethal\
        \ to undead. Thor once threw Mjolnir at a vampire, with contact causing the\
        \ vampire to burst into flame and crumble to dust. {{Navigation"
