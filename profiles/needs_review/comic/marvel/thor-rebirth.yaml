    - field: stamina
      value: 'Thor is able to sustain himself almost indefinitely without any exhaustion.&#91;347&#93;
        He was capable of fighting for two years straight without food or sleep,&#91;262&#93;
        and his stamina allowed him to battle the entire Frost Giant army for nine
        months without any sustenance or rest.&#91;348&#93; Superhuman Agility: Thor''s
        natural balance, agility, and bodily coordination are enhanced to levels that
        are far beyond the natural physical limits of even the finest human athlete.
        Superhuman Reflexes: Thor can track objects travelling faster than the speed
        of light,&#91;349&#93; and he has consistently been able to react to objects
        in his path when travelling through outer space at full speed, or when fighting
        with opponents capable of moving and attacking at such speeds at a close distance.
        Vast Energy Manipulation: Thor has the ability to manipulate vast amounts
        of energy, using Mjolnir he can channel the storm''s energy into blasts so
        powerful that he can destroy Secondary Adamantium. Thor can also channel his
        godly energies through Mjolnir, creating rays powerful enough to kill even
        immortals.&#91;301&#93; Weather Control: Being the God of Thunder, Thor has
        the ability to control the elements of storms, both with and without Mjolnir.&#91;76&#93;
        Thor can summon and control the near-infinite powers of the storm, causing
