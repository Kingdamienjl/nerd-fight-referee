- id: claim-powers-and-abilities-e4b5068a
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Social Influencing (Started and led
    a successful protest against Dexter Bennett, despite public knowledge of his crimesAmazing
    Spider-Man Vol 1 612), Electricity Manipulation, Surface Scaling (As shown hereAmazing
    Spider-Man Vol 1 9), Extrasensory Perception (Can use his powers as a metal detector),
    Aura (Can use his aura to shock opponents, and deflect attacksAmazing Spider-Man
    Vol 1 82Daredevil Vol 1 87), Light Manipulation (Can cause light flashes, and
    can light up a significant part of New York.Spider-Man Vol 1 40), Transmutation
    (Can turn sand to glass as its thrown mid-air, and solidify the airFantastic Four
    Vol 1 218), Heat Manipulation (Can melt through elevator doors in seconds and
    melt bullets mid-airDaredevil Vol 1 2Untold Tales of Spider-Man Vol 1 11), Magnetism
    Manipulation (Can use magnetism to stick himself onto surfaces), limited Flight
    (Can use magnetism to make himself fly over and between current-carrying objects),
    Absorption and Statistics Amplification (Can absorb electricity to increase his
    own strength), Creation (Can create a ramp of electricity), Sealing (Can seal
    his opponents into solid carbonized air), Technology Manipulation (Can disrupt
    technology with his powers and operate complex machinesPeter Parker: The Spectacular
    Spider-Man Vol 1 66Peter Parker: The Spectacular Spider-Man Vol 1 40), Adhesive
    Manipulation (Can fuse adhesives mid-air), Shockwave Creation (As shown here),
    Biological Manipulation (Can knock out his opponents using static charge and cause
    heart attacksFalcon Vol 1 3Joe Fixit Vol 1 5). Resistance to Electricity Manipulation
    (Can casually resist fatal electric shocks) and Pain Manipulation (Can quickly
    recover from pain thanks to his enhanced stamina) | Same as before, with enhanced
    Flight (As explained here), Biological Manipulation (Can disrupt electrical impulses
    in brainsAmazing Spider-Man Vol 1 423), Magnetism Manipulation (Can levitate and
    throw objectsMarvel Knights: Spider-Man Vol 1 3) and Psionic Nullification (As
    shown hereAmazing Spider-Man Vol 1 425) | Same as before, with Inorganic Physiology,
    Transformation, limited Shapeshifting and Intangibility (Dillon was transformed
    into a living lightning bolt, and as such can transmit himself along materials,
    and across the cityAmazing Spider-Man Vol 1 613Amazing Spider-Man Vol 1 614),
    Forcefield Creation (As shown here), enhanced Absorption (Can absorb microwave
    radiation as well, and others'' attacksYoung Allies Vol 2 2Avengers Academy Vol
    1 14) and limited Immortality (Type 2; Upon his death, remnants of Electro were
    suspended across the environment, having to be condensed back by Dr. Octopus,
    who states that Electro cannot ever really die.Amazing Spider-Man Vol 5 69)'
