- id: claim-weaknesses-edb9bd82
  section: weaknesses
  axis: weakness
  text: 'Can only absorb and kill the Gods whose time it is to die. The more energies
    he absorb, the more Atum loses himself into Demogorge.Iron Man Vol 1 Annual 10
    - The Saga of the Serpent Crown: Blood Feud Atum exists in a higher plane but
    if he comes down to the lower ones, he will get hungry and thus turn into his
    monstrous form. And when he gets angry, he turns into Demogorge. If a person is
    too noble, he won''t absorb them and kill them. Consuming too many Godheads can
    cause him to explode, however, this seems like an inconsistency with his lore
    and character. Note: Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
