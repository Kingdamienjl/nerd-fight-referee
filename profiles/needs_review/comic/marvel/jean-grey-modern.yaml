        Telekinesis and minor Matter Manipulation (Stated to move objects as big as
        mountains and as small as air molecules), Flight (Can use her powers to fly
        herself and several people), Energy Projection, Absorption and Statistics
        Amplification (Can absorb the psychic energies of others. This can be used
        to increase her power.), Forcefield Creation, Extrasensory Perception (Can
        sense brainwave activity and emotions. She can also sense someone stuck underground.
