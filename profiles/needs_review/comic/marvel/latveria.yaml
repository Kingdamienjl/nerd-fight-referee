      value: Genius Intelligence, Master Swordsman (Trained under and surpassed Europe's
        greatest swordsmen) and Martial Artist (Caught Captain America's shield, and
        is skilled enough to be a match for him and Black Panther even when his armor's
        been depowered), Enhanced Senses (His hearing is superhuman), Superhuman Physical
        Characteristics, Magic, Flight, Forcefield Creation, Energy Manipulation and
        Absorption (Drained all of Count Nefaria's power, leaving him an old man,
        and absorbed Nightmare after converting him into energy), Ice Manipulation
        (Has refrigerating units built into his armor that can freeze Reed Richards),
        Magnetism Manipulation (Reversed his armor's polarity to turn Magneto's powers
        against him, and caught Cap's shield in a magnetic field), Mind Manipulation
        (Has "Instant Hypnotism Inducers" that he can use to control others built
        into his armor, and scrambled Grey Hulk's nerve impulses to render him incapable
        of controlling his body), Invisibility (Has a portable cloaking unit installed
        into his armor that makes it so that not even Wolverine can sense him), Teleportation
        (Can teleport using his emergency transport beam and has teleporters located
        all across Earth), Time Travel (Has time circuity built into his armor, letting
        him travel through time, and used null-time sequencers to travel across time
        while fighting Reed, defeated Galactus by repeatedly traveling back in time
        to find a new angle), Transmutation (Can convert matter into energy), Reactive
        Evolution (His armor's defenses are adaptive and nearly self-aware, using
        adaptive technology) Dream Manipulation (He can enter the Dreamtime and travel
        through the dreams of others), Mind Manipulation (He can hypnotize others
        through eye contact and dominated a Kraken with his mind. He controlled Reed
        to leave him open for his mind transfer and used hypnosis to disable the Fantastic
        Four's powers), Soul Manipulation (Can switch his soul with others using the
        Ovoid Mind Transfer), BFR (Sent Morgan Le Fay to 1 million B.C.), Portal Creation
        (Can weaken the barriers between dimensions to open up portals), Summoning
        (Can summon legions of demons and Mindless Ones capable of beating down and
        restraining Ben, summoned hordes of monsters to fight the Avengers), Teleportation
        (He can teleport and change the destination of other teleporters) Gravity
        Manipulation (Can increase the effects of gravity with his Sensitizer), Matter
        Manipulation (Possesses technology that can reduce others to atoms and trigger
        the atomic destruction of their bodies, transformed his own body on molecular
        scale, used a device to reconstitute Shadowcat's body from molecules, gave
        Ultron the ability to cancel the force binding subatomic particles), Mind
        Manipulation (Hypnotized UN delegates with a device hidden in a statue, used
        his "Emotion Charger" to make every villain on Earth active, affecting even
        Super Skrull in another galaxy and Kang the Conqueror in the future, and his
        Vibration Bomb would wipe out patriotism and loyalty across the world, destroying
        the personalities of everyone on Earth and replacing it with complete loyalty
        to Doom, making his thoughts their own), Plot Manipulation with the Prime
        Mover (Can control reality as if it were a chessboard, dictating the actions
        of others, and can retroactively remake the lives of others, as proven by
        when he made it so that he had always been a thoughtform created from the
        darker side of Reed's mind), Size Manipulation (Can shrink others to a subatomic
        size with the Reducing Ray, trapping them within the Microverse, another dimension,
        and created a device to scale himself back up. Can alter the mass of objects
        with his Molecular Expander), Space-Time Manipulation (Can apparently turn
        time into space with his technology, possesses a Time Cube incorporated into
        his armor that he can use to reverse time, reconstructing his destroyed castle.
        Can freeze time with a certain device and can transport people to a time platform
        in his castle where they will be frozen in time), Technology Manipulation
        / Hacking (Hacked into all of America's electronics to shut down technology
        all across the country, and has access to the computer systems of all the
        world's Great Powers, including the Avengers', took control over Avengers
        Headquarters), Attack Reflection (His Psionic Refractor can reflect mental
        attacks), BFR (Can teleport his opponents to another dimension using certain
        spheres), Healing (Can heal injuries that modern medicine cannot), Illusion
        Creation (Can make others see whatever he desires using a special drug), Power
        Absorption (Can absorb the powers of Silver Surfer, Galactus, and even Franklin
        Richards, drained the Power Cosmic from both Terrax and Silver Surfer with
        his Siphon Suit), Power Nullification (Disabled Scarlet Witch's powers with
        a device), Transmutation (Transmuted Storm into chrome with a special globe)
        All his magical abilities on a higher scale, Physics Manipulation (Doom's
        presence was repealing the laws of physics)
