    to easily lay waste to a planet and a Doombot once destroyed a planet with another
    spaceshipSilver Surfer (1987) #107) | Planet level (Most Doombots are somewhat
    comparable to Doom himself and capable of at least holding off the Thing) Power
    Source: Cosmic radiation, nuclear, solar and mystic energy Industrial Capacity:
    Doom''s factories can produce squads of Doombots in under an hour. Military Prowess:
    Thousands of soldiers, primarily robots, though in a simulation, Latveria had
    enough robots to outlast the world''s heroes Notable Individuals: Doctor Doom,
    Kristoff Vernard, Gustav Hauptmann, the Doomsquad'
