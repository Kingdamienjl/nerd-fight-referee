- id: claim-powers-and-abilities-89697ad2
  section: abilities
  axis: hax
  text: 'Original Ms. Marvel= *Superhuman Physical Characteristics and Flight (As
    shown hereMs. Marvel Vol 1 #1) * Precognition (Can sense threats before they happenMs.
    Marvel Vol 1 #6, can predict opponent attacksMs. Marvel Vol 1 #2 and thwart sneak
    attacks) *Cloth Manipulation (Can change into her costume at will) * Enhanced
    Senses (Can visualize microscopic seamsMs. Marvel Vol 1 #4, acute hearingMs. Marvel
    Vol 1 #16) *Forcefield Creation (Possesses energy shields) *Acrobatics (As shown
    hereMs. Marvel Vol 1 #9) * Martial Arts (Knows JudoMs. Marvel Vol 1 8) * Vehicular
    Mastery (Is an USAF pilotCaptain Marvel Vol 7 #1) * Stealth Mastery (Was trained
    as a spyMs. Marvel Vol 2 #34, completely hides her trail from Black Widow) * Adaptation
    and Reactive Evolution (As shown here)Life of Captain Marvel Vol 2 #4 *Non-Physical
    Interaction, Underwater Breathing and Magnetism Manipulation via Preparation (Improvised
    a way to deal with Vision''s intangibility, a water breathing serum and a device
    capable of creating a magnetic field) Resistances= Resistance to Temperature Manipulation,
    Ice Manipulation, Fire Manipulation (Resisted hundreds of degrees bellow 0, and
    the heat of the explosionMs. Marvel Vol 1 #8), Mind Manipulation, Soul Manipulation
    (Resisted Millennia BloomMs. Marvel Vol 1 #19), Poison Manipulation (Resisted
    the poison of a giant snakeMs. Marvel Vol 1 #21), Electricity Manipulation (Resisted
    thousands of megawattsThe Avengers (1963) Annual #8), Paralysis Inducement (Resisted
    a poison that induces paralysis Ms. Marvel Vol 1 #23), Radiation Manipulation
    (As shown here) Classic Ms. Marvel= All previous powers plus: * Greater Superhuman
    Physical Characteristics and Flight (As shown hereMs. Marvel Vol 2 #1) * Weaker
    Precognition (She can see moments of the futureBlack Widow & The Marvel Girls
    #3, though has largely faded awayMarvel Official Website) * Energy Manipulation
    and Energy Projection (Photon Blasts) * Extrasensory Perception (Can detect energy
    sourcesAvengers Vol 3 #44) * Greater Martial Arts (Has genetically programmed
    combat skillsAvengers Vol 3 #47) *Instinctive Action (Her powers activate automatically
    to protect her, Has genetically programmed combat skillsAvengers Vol 3 #47) *
    Pressure Points (Shows knowledge of nerve strikesMarvel Super Heroes (1990) #10)
    * Weapon Mastery (As shown hereMs. Marvel Vol 2 #22) * Absorption (ThermalMs.
    Marvel Vol 2 #24, lightAvengers Vol 3 #41, electricalIron Man (1998) #24, radiationThe
    Mighty Avengers #6 magicMs. Marvel Vol 2 #5 and sonicNew Avengers Vol 1 #15. while
    absorbing Phoenix Force she could see the outside of time and space) * Statistics
    Amplification (Can increase her attributes using absorbed energyAvengers Vol 3
    #41) * Matter Manipulation (Can create her suit by manipulating matterCaptain
    Marvel: Shadow Code) * Regeneration (Mid; Stated by Beast to possess a healing
    factor beyond WolverineMs Marvel Vol 2 20. Regenerated her arms after they were
    reduced to bonesCaptain Marvel Vol 10 40) * Healing (Can sterilize anyone''s cellular
    structure, disinfecting themAvengers Vol 3 #65) * Light Manipulation (Can increase
    her attributes using absorbed energyAvengers Vol 3 #41, absorb and redirect sunlightAvengers
    Vol 3 #66) * Power Absorption (Absorbed her powers back from Super-AdaptoidNew
    Avengers (2005) Annual #1) * Greater Resistance to Temperature Manipulation and
    Freezing (Can draw on her energy reserves to avoid freezingAvengers Vol 3 #47,
    survives her lungs being frozen solidMs. Marvel Vol 2 #30) * Resistance to Power
    Absorption (Resists a Super-AdaptoidNew Avengers (2005) Annual #1) * Resistance
    to Sleep Manipulation (Resists SedativesMs. Marvel Vol 2 #44) * Resistance to
    Age Manipulation (Resisted The Traveler''s spell to kill her by aging herMs. Marvel
    Vol 2 #4) * Resistance to Basic Magic (Resisted The Traveler''s spell to kill
    her by aging herMs. Marvel Vol 2 #4. Can absorb magicMs. Marvel Vol 2 #5) * Resistance
    to Possession (Not affected by a virus that causes people to be taken over by
    symbiotesThe Mighty Avengers (2007) #8,Overcame Carnage''s possessionAbsolute
    Carnage: Captain Marvel) Binary= All previous powers greatly enhanced plus: *
    Self-Sustenance (Type 1; As shown hereUncanny X-Men Vol 1 #164) * Heat Manipulation,
    Light Manipulation and Radiation Manipulation (Like a star she can generate heat,
    light and radiation across all spectrumUncanny X-Men Vol 1 #164, can convert energy
    into gamma rays) * Portal Creation (Created a portal to another universe by manipulating
    the fabric of realitySecret Avengers (2010) #28) * Gravity Manipulation and White
    Hole Creation (Created a white holeQuasar #34, releasing anti-gravity waves made
    it so she could not be touchedX-Men Unlimited (1993) #13) * Telekinesis (Disarmed
    enemiesQuasar Vol 1 #56) * Attack Reflection (Reflected beams from Shi''ar ship)
    * Spatial Manipulation (Was destroying space with a white hole, her power was
    bending space around her, bending the fabric of reality created a rift to another
    universeSec'
