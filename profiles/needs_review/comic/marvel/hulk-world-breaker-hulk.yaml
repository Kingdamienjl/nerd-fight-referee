    - field: intelligence
      value: 'Extraordinary Genius (He is one of the most brilliant scientists on
        the Marvel Earth, rivalling the likes of Tony Stark. Banner is also recognized
        as the premier expert on radiation. Claimed to be one of the eight smartest
        people on Earth. Doctor Doom has stated that Banner is superior to him in
        some fields. When in an intelligent state of mind, the Hulk is proficient
        in martial arts, due to training from Iron Fist) | Below Average (Not very
        bright but capable of pulling off surprisingly clever battle tactics) | Average
        (He was a capable mob enforcer) | At least Average (He learned how to control
        his rage with the help of Hiroim, and had some experience as a leader) | At
        least Above Average (He holds the ability to analyze situations and reach
        conclusions and solutions successfully using "unreason and magical thinking")
        Standard Tactics: Despite his primal exterior, Dr. Banner is still able to
        control Hulk''s actions to some extent, as such Hulk will not kill his opponents
        or use excessive force if he doesn''t require it. *As stated by Iron Man,
        he can change his power beneath his punches. *As stated by Amadeus Cho, Hulk
        only ever attempts to grievously injure people under extreme circumstances
        **Cho later uses this theory himself to control Hulk''s power. **This is actually
        supported a few other times. *Hulk can easily kill his rogues'' gallery if
        he chooses to, but doesn''t. *Banner controls the Hulk to some extent, implying
        the morally idealistic Banner would actively try to hold back his attacks
        in order to not murder his opponents. **A more explicit version for supporting
        the above statement. *Hulk refused to kill Fin Fang Foom despite that Foom
        killed 2 people. *Subconsciously held back his strength while being inside
        a building, in order to not hurt the people that were in there. *Held back
        during his fight with Deadpool.Deadpool Volume 4, #38'
      source_id: vsbattles-hulk-world-breaker-hulk-earth-616
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'If he is not sufficiently enraged, he transforms back to Bruce Banner,
        with only base human stats (although he has shown the ability to maintain
        the transformation in varying emotional states), and can be knocked out depending
        on the circumstances. In his Grey and Immortal Hulk incarnations, he reverts
        to human form when exposed to bright day sunlight. His powers are heavily
        tied to his psyche, and as such are subject to change. For example, a fear
        of harming others as the Merged Hulk made it so that he decreased in power
        with anger for some time. His powers also at one point became only usable
        at night due to his subconscious fear of exposure and the judgment of others.
        As Devil Hulk, he prevents himself from getting too enraged to not lose control,
        becoming the Childlike Hulk if he gets too angry as a safety mechanism, which
        decreases his strength. He is repelled by holy objects related to the The
        One Above All. Feats: *Worldbreaker Hulk destroyed a planet in his clash with
        Red She-Hulk. *Overpowered Hulkbuster Iron Man *Overpowered The Thing Notable
        Attacks/Techniques: *Thunderclap: A term used to refer to a large shock wave
        created by a character with sufficient, superhuman strength violently clapping
        their hands together. These attacks can be incredibly destructive and lethal,
        sometimes equaling nuclear bombs or hurricanes. *Reactive'
      source_id: vsbattles-hulk-world-breaker-hulk-earth-616
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "The Hulk\u2019s Powers, while often thought of as physical, are actually\
        \ primarily psychological in nature. Those mutated by the Gamma Radiation\
        \ used in the Gamma Bomb have their innermost desires and psychological status\
        \ manifested as mutations. As such, the Hulk\u2019s powers are in actuality\
        \ malleable. For example, as his rage increases, not only does the Hulk increase\
        \ in power, but becomes more resilient, shaking off attacks and powers that\
        \ previously overwhelmed him and surviving things he could not before. However,\
        \ due to Banner\u2019s shattered psyche and psychological trauma, this can\
        \ also manifest as weaknesses and split forms, giving each mental aspect,\
        \ subconscious fear, and psychological compulsion some level of tangible repercussions\
        \ on the Hulk. ==Notable Matchups== Victories: *Patrick Star (Spongebob Squarepants)\
