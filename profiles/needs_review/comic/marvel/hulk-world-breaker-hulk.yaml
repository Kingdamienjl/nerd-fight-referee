      value: 'If he is not sufficiently enraged, he transforms back to Bruce Banner
        (although he has shown the ability to maintain the transformation in varying
        emotional states) and can be knocked out depending on the circumstances. In
        his Immortal Hulk incarnations, he reverts to human form when exposed to bright
        day sunlight. His powers are heavily tied to his psyche, and as such are subject
        to change. For example, a fear of harming others as the intelligent Hulk made
        it so that he decreased in power with anger for some time. His powers also
        at one point became only usable at night due to his subconscious fear of exposure
        and the judgment of others. As Devil Hulk, he prevents himself from getting
        too enraged to not lose control, becoming the Savage Hulk if he gets too angry
        as a safety mechanism, which decreases his strength. He''s repelled by things
