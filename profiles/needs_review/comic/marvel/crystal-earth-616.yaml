      value: '*Magic cannot be used to conjure scientific objects or objects that
        were created by scientific means.Doctor Strange: The Oath #5 *Using too much
        magic can kill the user, especially if they are weak, already injured or suffering
        from a physical illness, and/or unskilled, such as how Asmodeus''s already-weak
        heart gave out due to him using too much magic in his battle against Doctor
        Strange. *Mysterium, a mineral from the White Hot Room, can nullify all forms
        of magic, even the magic of those as powerful as Dormammu or the Trinity of
        Ashes, the latter of whom rival the Vishanti. *Exocentric magic, the art of
        calling upon higher beings for mystic power and spells, is the riskiest of
        the three main branches of sorcery due to the mystic principalities involved
        possibly choosing either to not give power to the requesting sorcerer or to
        demand too high a price (such as the demon lord Satannish often asking for
        the soul of those wanting to invoke his power). *If a magical spell is broken,
        pain is reflected onto the caster, with the backlash being more severe the
        more complex the spell is.Magik (2025) #5 *Magic relies heavily on one''s
        emotional state,Runaways (2025) #4 with severely drained emotions carrying
        the risk of leaving a sorcerer unable to cast spells. *Users of standard sorcery
