    - field: weaknesses
      value: 'Avenger must remain alive and conscious to use Verg Avesta, and it can
        only be used on a single target. Also, because he must be lethally injured
        to be able to use it on other Servants effectively, it is usually useless
        without someone to back him up and will result in his death. Using Murderous
        Intent will vastly increase his capabilities, but will also ultimately kill
        him in the process. Avenger also cannot fight while in spirit form, and as
        the Grail, his Low-Godly regeneration takes time and will bring him back as
        a Servant. Notable Attacks/Techniques: Shade: Angra Mainyu can take the form
        of a shadowy, wolf-like monster. Whenever he is killed, his remains take this
        form, an undead state similar in nature to daemons, though weaker. However,
        they can still easily kill humans, though they aren''t much of a match against
        Servants on their own. The trouble is that thanks to Unlimited Raise Dead,
        they appear in massive numbers made up of all of Angra Mainyu''s previous
        deaths. Unlimited Raise Dead: Infinite Ruin: A time loop created by Bazett''s
        wish, causing the time to loop every four days in a world of dreams and producing
        shade in each world, spawning countless shades throughout countless loops.
        Angra Mainyu: All the World''s Evil: The nature of Angra Mainyu, that of a
        normal man cursed with All the World''s Evil. It is normally not all that
        useful against Servants, only designating his soul as an existence tailored
        towards killing, and is the origin of his supernatural skill in killing humans.
        He has the instinctual knowledge needed to fulfill his role as All the World''s
        Evil, making him a being that can slay even the strongest humans. In terms
        of human killing ability, he is on par with ORT and Primate Murder. He keeps
        up in quality but lacks their speed. After he is absorbed by the Holy Grail,
        which becomes an incarnation of All the World''s Evil, its abilities are heavily
        amplified by the wish-granting nature of the Grail, which seeks to bring him
        into existence. Now, it is more a curse than a wish-granting machine, an affliction
        that interprets any wishes it is confronted with in the most destructive possible
        ways. After being corrupted, the Grail becomes capable of summoning non-heroic
        Servants, such as Gilles de Rais, Medea, and Medusa. The Grail first births
        him as an endless black mud that taints everything it touches, a curse that
        will flood over the world and strike down all humans equally with 5.6 billion
        curses. The scourge is so strong that it stains all it touches, breaking down
        their body, mind, and soul, driving them insane with fear and pain. It turns
        the emotions they feel in death into magical energy to propagate itself. It
        near inevitably kills anyone it touches, ultimately claiming Kiritsugu Emiya''s
        life years after he was exposed to it. It can, however, be resisted by those
        with exceptionally powerful wills, such as Shirou Emiya, and Gilgamesh, whose
        ego is too strong to be tainted by such an affliction. When it comes to Servants,
        it instead "blackens" them, shifting their alignment to evil and incarnating
        them in the world. They become incredibly strong at the cost of losing much
        of their sanity and restraint, recklessly using up their magical energy without
        hesitation. In this manner, he claims both Berserker and Saber, turning the
        latter into her altered state. Servants with less heroic stories can resist
        its effects as they are similar, allowing True Assassin to handle the curse
        without much danger. Angra Mainyu will eventually be birthed by the Grail
        in a physical form of great size and power, far surpassing his regular limits
        as a Servant. * The Black Shadow: In Heaven''s Feel, Avenger comes into the
        world in the form of a Black Shadow that acts as Sakura''s shadow. It takes
        on her desires and acts on them, targeting those she dislikes during its nightly
        hunts for magical energy. At first, it only drains enough magical power to
        leave its victims unconscious, but it quickly starts to consume them in their
        entirety. It is intangible and incorporeal, incapable of being affected by
        conventional attacks, and potentially lacks even a concept of death. Its touch
        corrodes all it comes into contact with, carrying on the curse of All the
        World''s Evil, dissolving organic matter and breaking it down into magical
        energy, consuming their souls as well. It can spread out over an area like
        mud, or absorb all the energy in an area to explode and swallow everything
        around it. It can also be used to repair the damage done to Sakura''s body,
        teleport her, and restrain others with tentacles so that they can be easily
        consumed. === Noble Phantasms === Verg Avesta: False Copy of Inscribed Creation:
        A primal curse of simple retribution. It reflects the pain of any damage dealt
        to him back to his opponent, mirroring the pain without the wounds by inscribing
        it onto their soul. This pain won''t fade until Avenger''s wounds are healed
        or he dies. It''s a reasonably weak Noble Phantasm, requiring Avenger to be
        aliv'
      source_id: character-stats-profiles-gilgamesh-marvel
