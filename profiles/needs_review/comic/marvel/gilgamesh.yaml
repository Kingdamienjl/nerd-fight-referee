        but dies in the process), Possession, can utilize Shirou''s abilities when
        possessing his body, Nonexistent Physiology in spirit form, Servant Physiology,
        Rage Power and Empowerment with Avenger, Limited Resistance to Memory Manipulation
        with Oblivion Correction, likely many other abilities (As a weak Grail, he
        can still grant wishes, having created Bazett''s looping world of dreams in
        this way) Absorption and Durability Negation (Can take in and absorb others,
        can break down organic matter into magical energy with a touch), Mind Manipulation
        (The Black Shadow destroys the minds of those it affects, and can corrupt
        Servants and distort their mentality), Soul Manipulation, Conceptual Manipulation,
        Information Manipulation, Intangibility, Incorporeality, possibly Immortality
        (Type 5; Shirou notes that it may not even have a concept of death) All previous
        abilities to a much greater extent, Magic, Curse Manipulation, Darkness Manipulation,
        Dream Manipulation, Elemental Manipulation, Illusion Creation, Mind Manipulation,
        Reality Warping, Soul Manipulation, Conceptual Manipulation, Information Manipulation
        (Possesses an incomplete Heaven''s Feel), Spatial Manipulation, Time Manipulation,
        Absorption, Possession, Resurrection (Resurrected Kirei and replaced his heart),
        Telepathy, Regeneration (High-Godly. Regenerated from having parts of his
        body blown apart by Enuma Elish. After being destroyed at the end of Fate/stay
        night, Avenger was able to reform as his Servant form from a spiritual state.
        Should have this level of regeneration due to his outer-dimensionality), Immortality
        (Types 3 and 6). With his connection to the Root he has: Nonexistent Physiology,
        Acausality (Type 5), Immortality (Type 5), Transduality (Type 3), Reality
        Warping, Spatial Manipulation, Matter Manipulation, Time Travel, Time Manipulation,
        Law Manipulation, Information Analysis, Power Mimicry including all powers
        from the Nasuverse (Should be comparable to the likes of Ryougi Shiki, though
