        \ and does not appear to require oxygen; he also survived the blast from a\
        \ Nega-Bomb.&#91;11&#93; Superhuman Stamina Paraphernalia Weapons Mjolnir\
        \ Notes Matthew Wolf voiced Thor in the animated films Hulk vs. Thor and Thor:\
        \ Tales of Asgard. Rick D. Wasserman voiced him on the animated series Avengers:\
        \ Earth's Mightiest Heroes. Wasserman had previously voiced the Hulk in the\
        \ film Planet Hulk, and also voiced the Absorbing Man, Surtur and Ymir on\
        \ Earth's Mightiest Heroes. Wolf did audition to reprise the role on Earth's\
        \ Mightiest Heroes, but the producers wanted to go a different direction.\
        \ Trivia Unlike the original comic, Thor does not assume the form of Donald\
        \ Blake when separated from Mjolnir for more than a minute. This is probably\
        \ a reference to the modern Thor comics. In the first season of Avengers:\
        \ Earth's Mightiest Heroes, Thor's costume is adapted from the character's\
        \ Silver Age outfit. In the second season, he dons a costume based on Olivier\
        \ Coipel's redesign for Thor (Vol. 3). Avengers: Earth's Mightiest Heroes\
        \ producer Josh Fine collaborated on both a Thor and an Iron Man animated\
        \ series that had some early development work done; the latter would have\
        \ focused on the God oF Thunder's early adventures. Although both shows were\
        \ pitched as stand-alone series, Fine suspects that they would have ultimately\
        \ shared continuity with Earth's Mightiest Heroes had they made it to production.&#91;28&#93;\
