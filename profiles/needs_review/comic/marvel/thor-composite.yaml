  attack_potency:
    text: 'Varies (Thor almost always holds back for fear of accidentally killing
      his enemies, even if it might mean losing a fight), from Galaxy level (It is
      hinted that he shook the universe as a side effect of the launch of Mjolnir.
      Shook all the stars in the universe. Slightly dented the Silver Surfer''s forehead
      with a headbutt, and Loki commented that Thor has greater strength than the
      Surfer while fighting a serious Norrin63.50893 ZettaFoe) up to High Universe
      level normally (Thor''s battle with Hercules and a clone threatened to destroy
      the Heavens and shook Asgard respectively.Thor: Blood Oath #3Thor: The Trial
      of Thor #1 Superior to Eric Masterson and Dargo Ktor whose battle unleashed
      mystical energy across all planes of existence, and fully powered a machine
      that could collapse infinite timelines into oneMighty Thor Vol 1 #438. Bested
      Ego with his Thermo-BlastThor Vol. 1 #133), Low Outerverse level to Outerverse
      level at peak and with God Blast (When insane and no longer holding back, Thor
      fought simultaneously against Adam Warlock and Silver Surfer, describing them
      both merely as "bothersome fleas." Adam Warlock described this Thor as his "greatest
      fear" and "one of the most physically powerful beings in the universe."Warlock
      and the Infinity Watch Vol 1 23 During this time, Eternity described him as
      a "grave peril" to "a good portion of all that is Infinity and himself."Warlock
      Chronicles Vol 1 6 Physically overpowered Hela,Thor Vol 1 #354 who later stated
      that he was too fierce a fighter even for her.Thor Vol 1 #361 Defeated Mephisto
      in his own realm,Thor Vol 1 #205 and later fought him to a stalemate.Thor Vol
      1 #310 Fought Zeus, who said that Thor resisted him more strongly than any of
      the Titans or Gods of Olympus.Thor Annual #8 This makes him superior to Atlas,
      who lifts the heavens and serves as the Axis Mundi, which is the Greek form
      of Yggdrasil.Incredible Hercules #123Incredible Hercules #132 Even after he
      was depowered and robbed of the Odinforce, Thor was able to defeat M.Y.T.H.O.S,
      who wielded the full power of Yggdrasil.Thor Vol. 6 Annual (2023) During a rampage,
      Thor shattered Yggdrasil''s root.Thor: Man of War Thor''s cries as a newborn
      created storms that shook Yggdrasil and every realm in its branches.Avengers
      1,000,000 B.C When pushing himself beyond his limits, Thor pushed and overpowered
      the World Engine, fighting against both the engine and the tree''s full might.Thor
      Vol. 1 #494 Yggdrasil is stated to be "everything" and to have its roots and
      branches in "all that is,"Loki: Agent of Asgard #11 containing infinite universesThor
      Vol 1 616 and existing across all the infinite planes of realityJourney Into
      Mystery #507Thor #390, thus encompassing all of Earth-616. By uniting his life-force
      with the power of Mjolnir, Thor can generate the God Blast.Thor Vol. 1 #388
      One use of the God Blast defeated Zelia, who had twice the strength of Odin.Thor
      Vol. 2 #12 Two combined God Blasts were capable of doing harm to the Phoenix
      Force.Mighty Thor Vol. 3 #19 Four God Blasts in unison were able to temporarily
      hold back a collapse of the multiverse''s dimensional wallsThor Corps #4 that
