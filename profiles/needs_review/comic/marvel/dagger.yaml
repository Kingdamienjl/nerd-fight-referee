    - field: attack_potency
      value: 'Small Building Level, possibly higher (Can fight those who can harm
        him. Hurt a villain called Street who could lift and throw cars, as well as
        rend a large section of the pavement with a punch. Has harmed and knocked
        out Green Goblin - Hobgoblin, someone empowered by the exact same Goblin formula
