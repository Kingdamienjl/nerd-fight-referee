    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Lightforce energy: The energy
        of light that exists in everyone as life force in its pure state is what is
        called Lightforce energy. It''s a power of good that passively purifies what''s
        dark and evil. Dagger passively generates much more than any other human,
        and unless it is consumed by Cloak she will continuously generate it more
        and more, becoming more powerful. Beings without a soul are not affected by
        the Lifeforce energy but robots'' circuits can suffer from short circuitPeter
        Parker, The Spectacular Spider-Man (1976) #70. **Light Daggers: She throws
        daggers made of pure lightforce energy, they are not solid as such they can
        go through armours and even flesh affecting the soul or the blood of the opponent
        in a huge range of effects. *Solid Light: Dagger can create solid light, which
        despite lacking the purifying effects of pure Lightforce it is physical and
        can be used to create weapons and shields. Notes: *Dagger''s attacks are not
        inherently destructive. Unless explicitly stated or shown to be employed with
        the intent of causing destruction, they should be regarded as non-physical
        in nature and intended solely for purposes of purification. *Before making
