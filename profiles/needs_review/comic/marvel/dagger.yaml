        force to send it flying into the air. Tackled Mysterio through a brick wall.
        Hurt Sandman with a kick - Sandman, at the time, was strong enough to total
        a van with a punch. Completely embarasses Kraven during every one of their
        encounters - Kraven''s bare hands could tear apart Vulture''s wings, which
