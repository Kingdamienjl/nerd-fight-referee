        \ Squirrel Girl Vol. 2 #32, July 2018 She was able to use her computer science\
        \ skills to replicate Allene\u2019s Negative Zone Teleporters with Mjolnir,\
        \ and she\u2019s stated to be good at debugging compile-time errors. She instantly\
        \ figured out how to use Doctor Doom\u2019s time machine and rebuilt Brain\
        \ Drain, who was created by aliens in the 1940s, with Nancy\u2019s help. She\u2019\
        s also shown herself to be a proficient strategist, able to quickly come up\
        \ with successful strategies to help a blinded Hulk defeat Abomination, hinder\
        \ Bi-Beast so the Thing could defeat him,Thing Vol. 2 #8, August 2006 and\
        \ had the hypothesis that Falcon could communicate with Challenger and hinder\
        \ him in the process.Avengers Vol. 1 #689, June 2018 Allene came up with a\
        \ complex plan to take down every hero and villain in the Marvel Universe\
        \ and was able to booby-trap her base to take out the Avengers) Genius (Even\
        \ without her squirrels, she has easily defeated Deadpool, overwhelmed Wolverine\
        \ in sparring, and defeated Spider-Man, Captain America, Steve Rogers, Black\
        \ Widow and Hawkeye in twenty-six seconds. Allene was able to defeat the entire\
        \ Avengers in twenty-two seconds, also figuring out how to counter the Iron\
        \ Man Armor Model 53, which was specifically designed to counter her before\
        \ going on to defeat every hero and villain the Marvel Universe, including\
        \ the likes of The Thing, Magneto, Doctor Strange, Ghost Rider, Storm, Black\
        \ Panther, Wolverine, Spider-Man and many more. With her squirrels, she has\
        \ one of the most prolific win records in the verse, having defeated Doctor\
        \ Doom, Thanos, Terrax, Fin Fang Foom, Baron Mordo, Ego the Living Planet,\
        \ Korvac, Pluto, Dormammu and more) Standard Tactics: Doreen prefers to rehabilitate\
        \ or pacify her opponents before resorting to violence, having claimed that\
        \ rehabilitating criminals was 90% of what she did in her free time.New Avengers\
        \ Vol. 4 #16, November 2016 She always looks for compromise and solutions\
        \ that make everyone happy. When in combat, she uses hand-to-hand combat with\
        \ backup from her partner, Monkey Joe or Tippy-Toe, but if there are squirrels\
        \ in the surrounding area, she\u2019ll summon them to overwhelm her opponents."
