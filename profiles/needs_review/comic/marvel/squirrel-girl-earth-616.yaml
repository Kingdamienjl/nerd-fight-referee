      \ squirrels, she has easily defeated Deadpool, overwhelmed Wolverine in sparring,\
      \ and defeated Spider-Man, Captain America, Steve Rogers, Black Widow and Hawkeye\
      \ in twenty-six seconds. Allene was able to defeat the entire Avengers in twenty-two\
