- id: claim-weaknesses-605ed6e2
  section: weaknesses
  axis: weakness
  text: "None notable Notes: *The Divine Creator is distinct from the One Above All\
    \ of Marvel's main continuity, as several contrasts between them have been shown.\
    \ As such, a separate profile had been created for it. **The main difference lies\
    \ in immutability and the question of omnipotence. While the One Above All is\
    \ portrayed as the cosmological apex of a hierarchy, it has also been suggested\
    \ to reside at the bottom of another hierarchy. In contrast, the Divine Creator\
    \ is depicted as an indivisible, immutable source of all Creation, with everything\
    \ existing as mere thoughts within its dream of Creation. **The concept of the\
    \ Divine Creator closely resembles the Nirguna Brahman or Parabrahman in Hindu\
    \ philosophy, whereas the One Above All may not represent the Ein Sof at all.\
    \ And if it does, it would merely reflect a representative level of infinity -\
    \ one that is still surpassed by whatever corresponds to Atzmus in the Hasidic\
    \ interpretation of Kabbalah. **Confusion often arises from the many times God\
    \ is referred to as the \"Void,\" \"Emptiness,\" or \"Nothingness,\" making it\
    \ difficult to distinguish between God and Oblivion. However, the distinction\
    \ is made clear in the stories, which repeatedly emphasize that Oblivion, in his\
    \ truest form, is pure \"non-existence\" - a part of God, more precisely, God's\
    \ unconscious. This is the message behind \u201Cdissolving into nothing\u201D\
    \ to connect with God: that very \u201Cnothing\u201D from which everything emanated.\
    \ Hence why Oblivion claims that Creation comes from him - because it was dreamt\
    \ within that primordial state. To strip away all illusions that conceal the perfection\
    \ of the Creator is to become whole - merging into the nothingness in which both\
    \ existence and non-existence are contained and ultimately surpassed by God. *Before\
    \ making any changes to this page, please read and follow the Power-scaling Rules\
    \ for Marvel and DC Comics."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
