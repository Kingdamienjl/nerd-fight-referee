  stamina:
    text: Flew through deep space for 8 weeks, passing various planets and systems
      in his path to reach Shi'ar space. However, it would possibly take him years
      of non-stop movement at his top speed to reach Chandilar, which is in Shi'ar
      Galaxy/Andromeda Galaxy/M-31. After fighting Shi'ar warriors along the way,
      his power was finally worn out. Despite Lorna attacking his heart and inner
      organs with her powers - which was also able to affect his powers - he was able
      to continue fighting and find enough strength to attack her and try to free
      himself. After fighting a few enemies, including Quantum Magic Adam Warlock,
      Vulcan flew after an Inhuman spaceship and caught up to it and started fighting
      Black Bolt in it. During the long battle, Black Bolt used his voice on him,
      Vulcan was able to put himself back together and continue fighting until both
      of them removed from the universe in a massive explosion. Immediately after
      his "resurrection" years later, he immediately moved around to check for the
      nearby spaceship and even flew it back to Earth.
    source_ids:
    - vsbattles-vulcan-marvel
    confidence: 0.6
    notes: auto_repair source extraction
