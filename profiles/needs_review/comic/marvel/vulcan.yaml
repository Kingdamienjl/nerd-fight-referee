    - field: intelligence
      value: Extraordinary Genius. Charles Xavier is one of the most intelligent people
        on Earth, being arguably its most powerful telepath and specializes in genetics
        and biology. Has at least 3 PhDs and invented the Cerebro and Cerebra telepathy-boosting
        machines. Due to his telepathic excursions, he has acquired a great deal of
        information from around the world, including knowledge of various cultures,
        fields of science, and important events. As a result of his military training,
        Xavier is also experienced in martial arts and the use of pressure points,
        allowing him to incapacitate those who are much younger and more agile than
        him and has spent decades preparing the X-Men for nearly every conceivable
        threat. In addition, he is savvy enough to develop the Xavier Protocols, a
        series of countermeasures to incapacitate the X-Men should they or he become
        a danger to mankind.
      source_id: vsbattles-vulcan-earth-616
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Paraplegic (Not currently. It should be noted that although he has been
        cured several times, it is usually undone). His abilities can be countered
        by those who also possess sufficiently powerful psionic abilities or resistance
        to such abilities Notable Attacks/Techniques Telepathy: Xavier is one of the
        best telepaths in the Marvel Universe. * Telepathic Illusion: Xavier is able
        to create realistic telepathic illusions and cause people to experience events
        which are not actually occurring. * Telepathic Cloak: Xavier is able to mask
        his presence, allowing him to avoid detection by making it impossible for
        his targets to notice him and his allies. * Psi-Link: Xavier is able to develop
        a mental link with any person which remains as a connection to that individual.
        * Telepathic Camouflage: Xavier is able to mask himself, and other peoples''
        presence from those around him. Can telepathically disguise himself, making
        his appearance to those around him quite different (changing the appearance
        of clothing, as well as more involved disguising). * Mind Blast: Ability to
        place large amounts of information in another''s mind. * Mind Control: Xavier
        has the ability to control the minds of others with his vast telepathic powers.
        His powers are so strong that he is able to completely shut down the consciousness
        of multiple targets, making it appear as if time has stopped from their perspective.
        He can also transfer his thoughts through laser waves. * Mind Possession:
        Xavier is able to possess the mind of another, and use that being''s body
        as his own. * Mind Alteration/Memory Manipulation: Although he is usually
        reluctant to do so, Xavier as able to alter the minds of others by force of
        will, altering memories, removing, or unsealing repressed memories. He can
        also project his own memories or that of others into the minds of those he
        wishes. After Magneto ripped out Wolverine''s spine, Xavier completely wiped
        his memories, leaving him in a vegetative stateX-Men Vol 2 Issue 25 * Psionic
        Shield: Xavier is also able to erect psionic shields to protect himself and
        others from other telepaths and mind manipulators. He usually places these
        on young mutants who have uncontrollable powers, so they can develop them
        over time. * Psionic Bolts: Can project psionic force bolts which have no
        physical effects but which can affect a victim''s mind so as to cause the
        victim pain or unconsciousness and can even kill an adversary. These bolts
        are even powerful enough to affect Sentinels and other robots * Astral Projection:
        Xavier is able to separate his consciousness from his body and enter the astral
        plane, allowing him to communicate with others across in places where his
        normal telepathy cannot reach. He can also create ectoplasmic objects and
        physical constructs like weapons to use in order to combat others who are
        also able to enter the Astral Plane. However, he cannot perform this for extended
        periods, lest he lose his connection with his physical body. * Mental Detection:
        Due to experience with his fellow Mutants, Xavier is able to sense the presence
        of another superhuman mutant within a small but as yet undefined radius of
        himself by perceiving the distinctive mental radiations emitted by such a
        being. This ability can be amplified by Cerebro, allowing him to find and
        distinguish latent or active Mutants from entire populations. * Mind Transferal:
        Xavier is able to transfer both his mind and powers into other host bodies
        if his own physical body could be somehow killed. * Absorb Information: Xavier
        can quickly process and store information via mental transference, allowing
        him to acquire a vast amount of knowledge and learn entire languages in seconds
        by reading the mind of someone who is fluent. * Mindscape: Xavier creates
        his own dimension where time flows differently, a few hours in the real world
        would be months inside the mindscape, this allows him to train mutants with
        months worth of training within few hours like he did with Vulcan and co.
        when he needed them to rescue the X-Men. Telekinesis: Xavier recently developed
        telekinetic powers. His Cerebro helmet enhances them. Other: This profile
        only covers the Earth-616 Marvel version of Professor X Note: Before making
        any changes to this page, please read and follow the Power-scaling Rules for
        Marvel and DC Comics. Feats: Respect thread ==Notable Matchups== Victories:
