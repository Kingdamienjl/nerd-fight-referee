      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Above Average. To draw out the X-Men, he purposefully let Marvel Girl/Rachel
        regain control and escape his captivity. He knew that the X-Men would be using
        the Stargates to get to him, so he asked his new Shi''ar subordinates to destroy
        it. While he was losing power, he didn''t want anyone to know about it, so
        he killed a few Shi''ar spaceships. He used this to spread his name across
        the cosmos and have the Shi''ar fear him, making his eventual revenge slightly
        easier. Used his relationship with Deathbird to enter the royal house of Shi''ar
        Empire. The king, D''Ken, knew his sister wasn''t interesting in reigning,
        so, Vulcan got close to them and used that opportunity to be the eventual
        ruler of Shi''ar Empire in case D''Ken dies (and if there is no legit heir).
        Gabriel saving D''Ken was one of the key factors that led to D''Ken accepting
        him as his sister''s mate. On the day of his wedding, Vulcan killed D''Ken,
        becoming the ruler of Shi''ar Empire. Sent his spies to collect information
        on various worlds and how he can use their power to aid him in his conquestWar
        of Kings: Savage World of Skaar Vol 1 1.'
      source_id: vsbattles-vulcan-marvel
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Base/Emperor Vulcan=Overconfident, egoistical and psychotic. Doesn''t
        know how best to control his powersX-Men: Deadly Genesis Vol 1 4. Due to that,
        he didn''t realise he was leaking energy, which led a government agency to
        find him. His mind is ultimately his weakness. Mentally unstable. His younger
        self appears as an alternate personality in his mind, tormenting him sometimes.
        Emotionally immatureX-Men: Emperor Vulcan Vol 1 2. |-|Omega Level Plus=As
        before, plus the Darwin consciousness inside him acted as an additional weakness.
        Darwin''s thought essentially led to Vulcan being defeated the first time.
        |-|Post-Return=All from base, plus his mental state has deteriorated even
        further than before. His mind was harmed and twisted even more by inter-dimensional
        villains. Feats: * Was at death''s door for years alongside Darwin. * Base:
        ** Broke free from Nightside''s Darkforce attack/containment, which was meant
        to be lethal to him - Nightside''s main power is to manipulate Darkforce.
        ** Faster than Rachel and other X-Men. ** Flew through deep space for 8 weeks,
        passing various planets and systems in his path to reach Shi''ar space. However,
        it would possibly take him years of non-stop movement at his top speed to
        reach Chandilar, which is in Shi''ar Galaxy/Andromeda Galaxy/M-31 * Emperor
        Vulcan: ** After Black Bolt used his voice on him, Vulcan was able to put
        himself back together and continue fighting until both of them removed from
        the universe in a massive explosion. ** Similar to Black Bolt, he too survived
        at the centre of the the T-Bomb explosion, which ripped a hole in the very
        fabric of Space-Time. The two of them were sent to another dimension * Scaling
        (Base/Emperor Vulcan): ** Survived a hit from Colossus. ** Held back a beam
        of Cyclops'' energy with a hand, which are comparable to Hydrogen bombs. **
        Fought Shi''ar Imperial Guards, however, was overwhelmed at the end - especially
        due to Gladiator''s superior strength) ** With a blast, reduced a few aliens,
        including a Kree Accuser to their skeletons ** Alongside Alex and the Imperial
        Guards, defeated the Scy''ar Tal Elder, who scales to regular Gladiator. **
        Fought Quantum Magic Adam Warlock - with Adam noting how terrifying his energy
        absorption was. ** Fought Black Bolt. * Limits: ** Emperor Vulcan Era: Weaker
        than DarkhawkWar of Kings Vol 1 5. ** Koraka Era: *** Weaker than Apocalypse.
        *** Barely survived depowered Tarn while Vulcan was also powerless. Notes:
