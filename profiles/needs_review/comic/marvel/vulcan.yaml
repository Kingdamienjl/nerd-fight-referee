    - field: standard_equipment
      value: 'Base/Omega Level Plus/Post-Return=His superhero costume - which does
        not provide any abilities or resistances. |-|Emperor Vulcan=As the Shi''ar
        emperor, has access to all of Shi''ar''s technology and weaponry, as well
        as it''s soldiers and the Imperial Guards. Shi''ar is a highly advanced type
        5 space civilization (presumably on the Kardashev scale). Some notable technology
        includes: * Armour: Has an armour that he wears. However, it doesn''t provide
        any defence. * Teleportation Technology: Shi''ar has various teleportation
        technologies that he can utilise as their king. Can teleport himself and others
        from one place to another. Has access to Stargates, which allows ships of
        varying sizes to travel across the space instantly. * Spaceships: Has access
        to countless spaceships and battleships, allowing him to travel to other parts
        of the universe with ease or attack planets/other factions with them. When
        he was losing battle against his brother, he armed his various battleships
        to try and attack Alex''s crew in space. * Other'
      source_id: vsbattles-vulcan-marvel
