    - field: intelligence
      value: 'Above Average. To draw out the X-Men, he purposefully let Marvel Girl/Rachel
        regain control and escape his captivity. He knew that the X-Men would be using
        the Stargates to get to him, so he asked his new Shi''ar subordinates to destroy
        it. While he was losing power, he didn''t want anyone to know about it, so
        he killed a few Shi''ar spaceships. He used this to spread his name across
        the cosmos and have the Shi''ar fear him, making his eventual revenge slightly
        easier. Used his relationship with Deathbird to enter the royal house of Shi''ar
        Empire. The king, D''Ken, knew his sister wasn''t interesting in reigning,
        so, Vulcan got close to them and used that opportunity to be the eventual
        ruler of Shi''ar Empire in case D''Ken dies (and if there is no legit heir).
        Gabriel saving D''Ken was one of the key factors that led to D''Ken accepting
        him as his sister''s mate. On the day of his wedding, Vulcan killed D''Ken,
        becoming the ruler of Shi''ar Empire. Sent his spies to collect information
        on various worlds and how he can use their power to aid him in his conquestWar
        of Kings: Savage World of Skaar Vol 1 1.'
      source_id: vsbattles-vulcan-marvel
      provider_id: vsbattles
