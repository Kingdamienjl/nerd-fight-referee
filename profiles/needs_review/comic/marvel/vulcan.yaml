  attack_potency:
    text: 'Wall level+ (Without powers, he is comparable to his brothers, Alex and
      Scott). Varies with powers (As he is an Energy Manipulator, his power levels
      varies depending on how much energy he has available and how much more he can
      absorb, as well as hold back mechanism) from Small Building level (Reducing
      humans to skeleton is 0.05 tons of TNT. When he was a child, he reduced a woman
      to skeleton. As a kid, could hurt Shi''ar soldiers. Created a massive stream
      of energy, knocking away Cyclops and Wolverine among other X-Men. Created a
      shockwave of energy, destroying a spaceship. Put a hole through a Shi''ar and
      reduced his bones and flesh into nothing. Turned other soldiers into almost
      skeletons. Killed the Shi''ar king, D''ken, reducing him to a skeleton) to Planet
      level (Comparable to durability. As a child, had hurt Krakoa, the living island.
      Tossed away Gladiator with an energy attack. Fought Shi''ar Imperial Guards,
      however, was overwhelmed at the end - especially due to Gladiator''s superior
      strength) | Wall level+. Varies with powers from Small Building level (Killed
      someone with electricity) to Planet level (Comparable to durability. In a near
      death state, he had merged with Darwin, having his power increased. The two
      of them, now sharing one body, were awakened from near-death by the M-Day energies
      being removed from mutants and shunned into space. This caused them to become
      Omega Level Plus mutant, far superior to his base form. After losing Darwin,
      he was much weaker) | Wall level+ (Fought his brother, Alex. As their powers
      cancel each other out, their combat was physical, despite energy attacks being
      thrown aroundX-Men: Emperor Vulcan Vol 1 5.). Varies with powers from Small
      Building level (Easily reduced a few Scy''ar Tal with an energy blast) to at
      least Planet level normally (With a blast, reduced a few aliens, including a
      Kree Accuser to their skeletons. Said Accuser should be comparable to Ronan.
      Alongside Alex and the Imperial Guards, defeated the Scy''ar Tal Elder, who
      scales to regular Gladiator), far higher at peak (Fought Quantum Magic Adam
      Warlock. Fought Fought Black Bolt), even higher with Shi''ar arsenal (Has access
      to countless spaceships, weapons, and soldiers - including the Imperial Guards.
      As soon as he was threatened, the guards, including Gladiator, attacks his enemies)
      | Wall level+ (As before. While powerless, put up a fight against Tarn). Varies
      with powers up to Planet level (Far weaker than before as he has lost the "flame"
      within him. And is always holding back out of fear. Caused a massive explosion
      that could been seen from afar. Created a massive explosion on the surface of
      the planet after leaving off in anger. Ripped the arm of a Skrull warrior with
      an energy blast. Defeated a few Shi''ar Imperial Guards. One-shotted a weakened
      Nova after he stole some of Richard''s power. Despite his current state, said
      he can break the moon in half. Stronger than Sunspot>. Fought Storm, however,
      was eventually overpowered since she had helpX-Men: Red Vol 2 10X-Men: Red Vol
      2 17), far higher at peak (According to the Aliens that messed with him in the
      Fault, there is a great power hidden within him, but he struggles to access
      it due to his mental instability. Slowly recovering to his older self). Can
      ignore durability with Durability Negation (Rerouted the impulses within Gladiator''s
      head, dropping him)'
