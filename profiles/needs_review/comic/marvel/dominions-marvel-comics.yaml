        interstellar societies so advanced, the density of their unified intelligences
        collapse space-time into a singularity; Titan theory in general suggests that
        Titans are the singularities themselves, and reside at the heart of the black
        holes of the universe) All previous Powers & Abilities on a far higher scale,
        Abstract Existence (Type 1; The universal machine state of a dominion is a
        possibly fake existence, as Dominionhood is really just an immaterial, forever-lasting,
        idea of existence. Dominions exist forever due to being composed of information),
        Acausality (Types 1, 4, & 5) & Spatio-Temporal Omnipresence (Dominions are
        omnitemporal, which means irrespective of how or when a Dominion formed, having
        done so it has always existed and will always exist. Becoming a Dominion means
        leaving time behind forever to become all times, and as Dominions are already
        outside time and space, they can act across all timelines. To become a Dominion
        is to escape the burden of linearity. A Dominion exists outside the traditional
        bonds of time and space, which means it exists across all points in time simultaneously
        in its most advanced state. Beyonders are linear compared with the non-linear
        Dominions, who even agree that Enigma''s Dominion can''t be prevented by altering
