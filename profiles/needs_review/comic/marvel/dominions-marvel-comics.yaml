    - field: attack_potency
      value: 'Outerverse level (Dominions are vulnerable when they descend to the
        timestream, yet they were confident they could easily crushRise of the Powers
        of X (Vol. 1) #4; 2024 a resurrected Phoenix Force Jean Grey on Earth. After
        opening themselves to linearity, death, and time to confront her, they were
        supposedly capable of overwhelming her in a brief fight and even had to assure
        her they wished her no harm. They naturally occur under universal Abstracts,
        who are the only primal threats they fear alongside Galactus and the Universal
        Phoenix Force, since they are so advanced, they have no other natural threats.
        This indicates their superiority to other universal threats within the cosmic
        hierarchy like Faltinians or Fear Lords. Dominions are indistinguishable in
        power from the grandest mythical godheads, making them at least relative to
        the various Skyfathers) | High Outerverse level (Dominions represent the "happily
        ever after," occupying a state of existence which is the eternal bliss at
        the end of stories, extending as far as the narratives imposed from the White
        Hot Room, which are pathetic stories for them to consume and exploit. The
