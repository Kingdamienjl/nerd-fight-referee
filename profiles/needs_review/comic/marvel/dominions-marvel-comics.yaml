    notes: auto_repair source extraction
  attack_potency:
    text: 'Outerverse level (Dominions are vulnerable when they descend to the timestream,
      yet they were confident they could easily crushRise of the Powers of X (Vol.
      1) #4; 2024 a resurrected Phoenix Force Jean Grey on Earth. After opening themselves
      to linearity, death, and time to confront her, they were supposedly capable
      of overwhelming her in a brief fight and even had to assure her they wished
      her no harm. They naturally occur under universal Abstracts, who are the only
      primal threats they fear alongside Galactus and the Universal Phoenix Force,
      since they are so advanced, they have no other natural threats. This indicates
      their superiority to other universal threats within the cosmic hierarchy like
      Faltinians or Fear Lords. Dominions are indistinguishable in power from the
      grandest mythical godheads, making them at least relative to the various Skyfathers)
      | High Outerverse level (Dominions represent the "happily ever after," occupying
      a state of existence which is the eternal bliss at the end of stories, extending
      as far as the narratives imposed from the White Hot Room, which are pathetic
      stories for them to consume and exploit. The consumption of that aforementioned
      narrative left the White Hot Room mortally injured, as the Dominion Enigma consumed
      three other sources of fuel for aspiring Dominions, including the M''kraan crystal,
      which is the Nexus of Realities, used in the ascension of Orbis Stellaris.Dead
      X-Men (Vol. 1) #4; 2024 Dominions are transcendent of realitySins of Sinister
      (Vol. 1) #1; 2023 and unburdened by linearity to an extent where Beyonders are
      linear compared with them, therefore making them fearsome threats to Beyonders
      and existentially transcendent of them, and greater threats to reality than
      the Beyonders altogether.Defenders: Beyond (Vol. 1) #1; 2022 -Title Page Synopsis
      A Dominion was Eternity''s mysterious enemy outside time and space, specifically
      Multiversal Eternity, who considered the Dominion a threat to all of reality
      while God of Stories Loki even called it a threat to the multiverse beneathDefenders:
      Beyond (Vol. 1) #1; 2022 the Outside/Mystery. Mister Sinister''s Dominion makes
      Black Winter look like an angry jelly baby in comparisonThor (Vol. 6) #24; 2022)'
    source_ids:
