  section: weaknesses
  axis: weakness
  text: 'If his vision were to be reflected upon his eyes, he would be turned to stone.
    Gorgon also wears masks and glasses to cancel out his own power due to his inability
    to turn his power off at will, although he can take these items off in battle.
    Destroying his eyes will render Gorgon unable to use the abilityCable (2020) Issue
    #6. Can take some time to heal more serious woundsAgents of S.H.I.E.L.D. Vol 6.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-bb66fb32
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics (Gorgon possesses "Type 2 Superhuman
    Strength"Wolverine Vol 3 #20 and is further stated to possess superhuman strength
    and speedAll New Official Handbook to the Marvel Universe: A-Z (2005)), Master
    Swordsmanship and Master Martial Artist (Gorgon is a master swordsman and martial
    artist comparable to some of the most skilled fighters in the Marvel universe.
    Gorgon is skilled enough to compete with the legendary Iron Fist in hand to hand
    combatNew Avengers (Vol. 2) #23. As a swordsman, Gorgon is capable of defeating
    dozens of Hand swordsmen whilst blindfoldedWolverine Vol 3 #26), Pressure Points
    (Employs pressure point strikes against Elektra and against Phobos to incapacitate
    him), Sleight of Hand (Feints - Gorgon can use feints to make his opponents attack
    themselves), Weapon Mastery (Is able to fight with a variety of swords, and a
    replica of Wolverine''s clawsNew Avengers (Vol. 2) #23), Marksmanship (When at
    a distance, Gorgon can throw his sword with incredible precision. Whilst still
    blindfolded, his thrown sword would have killed Nick Fury had he not been moved
    out of the way, even though he was being grappled by multiple assailantsSecret
    Warriors #5), Social Influencing (Gorgon''s position as head of various influential
    criminal conspiracies allows him to control a large number of men for combativeOld
