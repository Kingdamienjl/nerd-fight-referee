- id: claim-weaknesses-441c211b
  section: weaknesses
  axis: weakness
  text: 'Solid light is a conductor, so electrical attacks badly wound him. Without
    light particles to sustain him, he will destabilise and banished to the light
    dimension. Rather overconfident and easy to trap. Note: *Don''t attempt to scale
    Spider-Man to Lightmaster Light beams, as he has admitted that this is too fast
    for him, and use his spider-sense to dodge them. *Before making any changes to
    this page, please read and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-278da222
  section: abilities
  axis: hax
  text: 'Light Manipulation (Lightmaster''s principal power revolves around the manipulation
    of solid light) *Energy Projection (Fires solid light out himselft) * Explosion
    Manipulation (Can make explosionsAmazing Spider-Man Vol 1 203) *Energy Manipulation
    & Creation (Can create constructs of light like cages, swords and hammers) **Duplication
    (Creates copies of itself with the same strength and speed as itself, however,
    the more it makes, the less coordinated they areMarvel Team-Up Vol 1 113) **Air
    Manipulation (Create a functional vacuum cleaner) * Blinding (Lightmaster blinds
    Quasar so he can attack him by surprise) *Flight (Using light energy for propel
    himself; can carry things with it) *Heat Manipulation (its rays can generate heatX-Men:
    Legacy Vol 1 275, and by concentrating a blast of solid light, Lightmaster can
    heat up the area around the blast to incredible temperatures in order to kill
    trapped targetsPeter Parker, The Spectacular Spider-Man Vol 1 20; When charged
    with light, it seems to be able to generate more heat, being able to burns two
    people to deathAmazing Spider-Man Annual Vol 1 26 [E Story] and While using Quasar''s
    energy bands, he was able to melt Spider-Man''s webs with a laser burst, something
    that cost him when he posses Dazzler) *Radiation Manipulation (Can blast with
    radiationDark Reign: Mister Negative Vol 1 2) *Telekinesis (It can carry small
    thingsSuperior Spider-Man Team-Up Vol 1 6) * Limited Hacking & Technology Manipulation
    (Disables a computer''s security system with a light beam, link TV cameras to
    all locals TV broadcasting stations and leave Chinatown without electricityDark
    Reign: Mister Negative Vol 1 1) * Limited Transmutation (Capable of converting
    the Facade virus into light wavesCable & Deadpool Vol 1 5) Absorption (Can absorb
    light energy from his surroundings to survive and grow more powerfulDark Reign
    Files,This, in turn, makes him immune to light attacks and resistant to solid
    light) *Regeneration (At least High-Mid; It is able to take shape after being
    separated into several smaller parts, High with a light source; it is able to
