    rifle, he becomes larger and strongerSpectacular Spider-Man Annual Vol 1 12 [D
    Story]Web of Spider-Man Annual Vol 1 8 [E Story]) Resistance to Telepathy (His
    mental patterns are pure light, managing not to be detected by Cable)'
