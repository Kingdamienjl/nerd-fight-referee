    killed the likes of Silver Surfer and Wonder ManWest Coast Avengers Annual Vol
    1 2) and Radiation Manipulation (Withstood a radiation blast from the Presence,
    which killed Captain America, Black Knight and QuicksilverAvengers Vol 3 43).
    Possibly Soul Manipulation (Stated she would "incinerate" a demon's soul, which
    was corroborated by the demon) and Immortality (Unknown Type; Heavily implied
    to be immortal in some way, and Thor doesn't refute itAvengers Vol 3 44) Same
    as before but enhanced (Able to melt shrapnel from explosions mid-air,Beyond!
    Vol 1 4 Energy Manipulation and Matter Manipulation (Firebird's powers allow her
    to manipulate all forms of heat energy, through manipulating molecular and atomic
    pathways to create combustion, allowing her enhanced control over her abilities,
    including Absorption)Avengers Spotlight Vol 1 24, Telekinesis (Can use convection
    currents to lift heavy weights and move them around with ease), Deconstruction
    (Can deconstruct plasma beamsWest Coast Avengers Annual Vol 1 4), Air Manipulation
    (Can use her powers to create hot air bursts which send her opponents floating
    away), Temperature Manipulation (Can cause weapons to melt and remotely adjust
    temperatures of suit components) and limited Creation (Can create a "heat shield"
    to resist heat-based attacksAvengers Spotlight Vol 1 27)
  source_ids: *id003
