    - field: attack_potency
      value: Galaxy Level in Base (Can trade blows with and overpower the likes of
        the Hulk, Iron Man, and Thor. His spells can harm The Sentry. One-Shot Adam
        Warlock. Sent Blue Marvel flying) and with Doombots (Possesses an entire army
        of Doombots powered by a simulation of the Power Cosmic), up to Multiverse
        Level+, possibly Low Complex Multiverse Level with magic (His magic power
        is consistently shown to be comparable, if not slightly superior to that of
        Doctor Strange, especially as he knows spells that Strange himself doesn't
        and is consistently considered a top candidate for Sorcerer Supreme, with
        Strange himself fearing Doom's potential as a sorcerer, not to mention he
        once fought and matched Doctor Strange with magic. Held his own against Dr.
        Voodoo [albeit he needed preparation and still lost], who earlier had beaten
        Modern Dormammu, who while far weaker than his Classic counterpart is still
        superior to the Vishanti, Odin, and Orb, the last of whom was stated to be
        equal to Uatu. While likely amped by Magic, fought and matched Mephisto in
        Hell), technology/preparation (Staggered Uatu with an energy blast from his
        power armor. With an anti-matter beam made with preparation, managed to destroy
        Mephisto's physical form in Hell, although Mephisto was only momentarily affected
        by this and quickly reformed his body. While being charged with all of the
        world's Vibranium, stated it to be above the power of the Cosmic Cube. Was
        portrayed as comparable to an alternate Reed Richards who was wielding an
        Infinity Gauntlet, who should be comparable to Nebula with the Infinity Gauntlet,
        whom easily defeated a large group of cosmic entities. Nathaniel Richards
        stated that with enough motivation, Doom could even give the Celestials pause.
        Learned how to create his own Cosmic Cube. While waiting and training for
        a million years after being sent into the past, killed a Watcher, and was
        implied by Reed Richards to have been stronger than a Well-Fed Galactus when
        he'd killed the Watcher) and absorption (Has absorbed the powers of Galactus,
        a Cosmic Cube, a Watcher, a young Franklin Richards, and Hyperstorm. Absorbed
        the power of House of M Scarlet Witch, stating it to be above the Cosmic Cube
        Beyonder). Can ignore conventional durability in several ways.
