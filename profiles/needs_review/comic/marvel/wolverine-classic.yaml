    - field: intelligence
      value: 'At least Gifted. Vindicator claims that it''s not Wolverine''s powers
        or fighting skills that make him dangerous, but rather his mind.Alpha Flight
        Vol 2 8 Thanks to his superhuman senses, Wolverine is considered to be one
        of the world''s most skilled trackersWolverine: Weapon X Files Vol 1 1 and
        top covert operations agents with the potential of a level ten S.H.I.E.L.D.
        agent in a perfect world as stated by Nick Fury.Secret War: From the Files
        of Nick Fury Vol 1 1Secret War Vol 1 2 Due to his age and decades of combat
        experience against all types of international and intergalactic opponents,
        he is officially known as a war veteranUncanny X-Men Vol 1 158 who has mastered
        virtually every martial art on Earth and has taught many heroes some form
        for fighting, including: the Black Widow,Black Widow: Deadly Origin Vol 1
        1 Rogue,Uncanny X-Men Vol 1 223 Storm,X-Men: Gold Vol 2 24 Nightcrawler,Nightcrawler
        Vol 4 9 Colossus,X-Men Vol 1 122 Primal,Generation Hope Vol 1 4 Sunspot, Armor,Astonishing
        X-Men Vol 3 13 Jubilee,Girl Comics Vol 2 3 Rachel Summers, Phoebe Cuckoo,X-Men:
        Phoenix - Warsong Vol 1 1 and Shadowcat in hand-to-hand combat. In addition,
        Wolverine has intimate knowledge of pressure points and human anatomy and
        is a trained expert with many guns, blades, explosives and other weaponry
        due to his experiences as a solider, samurai, spy, and mercenary along with
        knowledge of several assassination techniques. He is also trained in the use
        of several computer systems and vehicle repair as well as being an accomplished
        pilot and is fluent in many languagesOfficial Handbook of the Marvel Universe
        A to Z Vol 1 13 including English, Japanese, Russian, Mandarin,Wolverine:
        Manifest Destiny Vol 1 1 Cheyenne, Lakota, Spanish, Krakoan,House of X Vol
        1 3 Farsi,Wolverine: Origins Vol 1 32 French, German, Korean, Thai, Vietnamese,
        and most notably Doopspeak, a language which very few individuals have demonstrated
        the ability to understand.'
