  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics **Longevity (Has been likely originated\
    \ from Cretaceous period of the Mesozoic era, or 900 million years in the past)\
    \ **Large Size (Type 2 - Shown to be taller than the Golden Gate Bridge, which\
    \ has a height of 227.4 metersWikipedia - Golden Gate Bridge) **Space Survival\
    \ (Shown to endure the depths of outer space) **Non-Standard Breathing (Types\
    \ 2 and 4) and Self-Sustenance (Type 2 - Has been likely frozen in a iceberg for\
    \ millions of years in suspended animation. Has been resting below the ocean floor\
    \ before being awakened by an undersea nuclear test at 1956 from \"an eons-long\
    \ slumber\". Described as \"amphibious\", \"prehistoric hybrid of land and marine\
    \ reptiles\". Can breathe in outer space by covering himself in an blue aura)\
    \ **Extrasensory Perception and Enhanced Senses (Awareness - Godzilla could sense\
    \ the presence of Yetrigar, who was stalking him at the deserts of Las Vegas.\
    \ Can sense danger and threats, such as a rip in space. Hearing - Can hear even\
    \ while in outer space. Smell - Sensed the scent of the oil leaked by Batragon's\
    \ attack on a tanker) **Bodily Weaponry (Conventional - Shown to have large and\
    \ sharp teeth and claws that can tear apart wings from other monsters) *Expert\
    \ Hand-to-Hand Combatant *Camouflage **Stealth Mastery (Via Ambush) *Berserk Mode\
    \ & Rage Power (Can tap to a \"berserk fury\" to generate more destruction and\
    \ casualties. Dum Dum describes his fury and capacity for violence seeming \"\
    boundless\". Godzilla can enrage and madden himself with \"the fury of agony\"\
    \ after feeling great amounts of pain, turning him berserk. The more pain Godzilla\
    \ feels, the more furious he becomes, and consequently more powerful. The more\
    \ angry Godzilla is, the more increases his speed and strength) **Statistics Amplification\
    \ & Damage Boost (With certain techniques, rage power and energy absorption) *Supernatural\
    \ Willpower (Godzilla can draw upon an inner strength, tap hidden resources, summoning\
    \ courage , succumbing to rage, in order to get through deadly situations and\
    \ combats even while feeling extreme pain or wracked with venomous fire. After\
    \ being hit by Thor's Mjolnir, Godzilla felt a pain such as he never knew before,\
    \ something that only made him reacting on instinct, and roaring with the force\
    \ and anger. Godzilla's rage reminded Thor of the Midgard Serpent, perhaps even\
    \ possessing more fury) *Breath Attack, Fire Manipulation, Temperature Manipulation,\
    \ Light Manipulation & Radiation Manipulation (From his mouth, Godzilla can release\
    \ a concentrated blast of radioactive fire. His dragon-like breath of fire is\
    \ \"highly concentrated radiation\", a \"radioactive firestorm\", and a \"firestorm\
    \ of nuclear radioactivity\". Quickly melted a specially forged and reinforced\
