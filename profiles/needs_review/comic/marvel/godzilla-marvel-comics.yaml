    \ (Godzilla can breathe a blast of hot air when he doesn't bother to use his radioactive\
    \ breath) **Sound Manipulation (Could roar with \"the force of a thousand thunder\
    \ storms\", pushing Thor back) **Explosion Manipulation (Generated a explosion\
    \ with his radioactive flames which could be seen from a long distance) **Technology\
