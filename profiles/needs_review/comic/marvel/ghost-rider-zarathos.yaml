        quite adept at using his powers in combat situations. When dealing with the
        Cult of Zarathos, Blaze was able to use his cunning intellect to escape their
        traps and outsmart enemies who underestimated his resourcefulnessGhost Rider
        Vol 2 #50 (August, 1980). In terms of motorcycles, Johnny also possesses a
