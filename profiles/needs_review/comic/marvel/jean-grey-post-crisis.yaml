      value: "Equipment = | Transportation = Formerly X-Men Blackbird, X-Men Stratojet,\
        \ X-Copter, Professor Xavier's Rolls Royce, Sentinel Air Transport, X-Factor\
        \ Plane, and various aircraft's constructed by Ship. She is also capable of\
        \ telekinetic flight. | Weapons = | Notes = * Jean has a complicated relationship\
        \ with the Phoenix Force. Originally, she was simply a host that bonded with\
        \ the Phoenix,{{r|X-Men Vol 1 101}} and then she became Dark Phoenix and died.{{r|X-Men\
        \ Vol 1 134|137}} However, when she was brought back, it was retconned that\
        \ all of her appearances from {{cl|X-Men Vol 1 101|to=137}} were actually\
        \ the Phoenix Force itself, who posed as Jean while the real Jean was healing\
        \ in a cocoon.{{r|Classic X-Men Vol 1 8}}{{r|Fantastic Four Vol 1 286}} In\
        \ other words, Jean did not destroy D'bari IV because it was the Phoenix.\
        \ Some writers, however, later presented the idea that Jean and Phoenix are\
        \ one.{{r|X-Men: Phoenix Endsong Vol 1 5}}{{r|A.X.E.: X-Men Vol 1 1}} Kieron\
        \ Gillen took it a step even further and had Jean/Phoenix give Hope Summers\
        \ life, who in turn sacrificed herself to give the Phoenix life; thus, Phoenix,\
        \ Jean, and Hope form a cycle.{{r|X-Men: Forever Vol 1 4}}{{r|Immortal X-Men\
        \ Vol 1 18}} X-Editor Jordan D. White said after {{cl|Rise of the Powers of\
        \ X Vol 1 5}}, \"Jean is the Phoenix and always is the Phoenix, even when\
        \ she\u2019s not the Phoenix. And the Phoenix is always Jean, even when it\u2019\
        s not Jean.\"{{cite|ref=true|url=https://aiptcomics.com/2024/06/10/x-men-monday-255-jordan-d-white-exit/|title=X-Men\
        \ Monday #255 \u2013 The Jordan D. White X-It Interview|work=AIPT|first=Chris|last=Hassan|date=10\
        \ June 2024|accessdate=10 June 2024}} * Following M-Day, when most mutants\
        \ were left depowered and no mutant births seemed possible, a mutant baby\
        \ was born in Cooperstown, Alaska, temporarily damaging Cerebra when it detected\
        \ the child. She bore a resemblance to Jean and when Cyclops held her before\
