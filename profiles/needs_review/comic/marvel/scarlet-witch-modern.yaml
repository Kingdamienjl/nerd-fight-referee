      albeit weaker than U.S. Agent), up to Outerverse level at peak and with preparation
      (Stated that she could replicate her multiverse-wide mutant-negation feat again
      with enough time and a great enough source of power. Seemingly erased the Phoenix
      Force from existence with the help of Hope Summers. Along with her mother and
      Agatha Harkness, she defeated the abstract being Chaos after combining their
      powers. Was capable of one-shotting multiple copies of Black Winter which, despite
      not being as strong as the original, were still individually far superior to
      Galactus) | Outerverse level (Stated by Doctor Doom to surpass the Beyonder.
      Created the House of M reality, an alternate version of Earth-616 and wove her
      spell into all existence. Depowered mutants all across the multiverse, in the
      process forming cracks along all realities. Should be stronger than her base
      form, who fought Chaos, who is said to be equal to Eternity)'
