    - field: weaknesses
      value: 'Absorbing nuform makes Miles sick and destroys everything around him.
        Gadgets have limited ammunition. Miles can be seen in camouflage through infrared
        goggles. Spider-Sense can''t detect enemies if their are invisible and they
        aren''t attacking him. Notable Attack/Techniques: *Spider-Sense: Thanks to
        his Spider-Sense, Miles can be warned of incoming danger and attacks before
        they occur.Marvel''s Spider-Man: Miles MoralesMarvel''s Spider-Man 2 (2023)
        This ability is especially useful in preventing himself and others from being
        harmed. Regarding combat, his Spider-Sense''s warnings will differentiate
        between attacks that need to be blocked or dodged when the other option would
        not work. *Web-Shooters: Spider-Man''s iconic and main gadget. Mounted on
        each wrist, Spider-Man can use them to create web lines to maneuver around
        or interact with his environment. Capable of rapid firing shots of webbing
        to ensnare enemies. *Holo-Drone: Deploys a drone that uses a hard light hologram
        to fight by Miles'' side. *Remote Mine: A mine that can be remotely triggered.
        When activated, it electrifies and damages enemies. *Gravity Well: Creates
        a gravity well that pulls enemies together. Knocking them down and making
        them vulnerable to Venom attacks. *Camouflage: Miles turns invisible. However,
        he can be seen through infrared goggles. *Venom Punch: A Punch that Venom
        Stuns a single enemy. Venom Stunned enemies take additional damage from subsequent
        attacks. *Venom Smash: An aerial Venom Punch that smashes into the ground,
        Venom Stunning multiple enemies. *Venom Dash: Miles dashes toward an enemy,
        Venom Stunning and throwing them. On impact, Venom Stuns surrounding enemies.
        *Venom Jump: Miles launches nearby enemies into the air, disarming, and Venom
        Stunning them. *Venom Dash Launcher: While performing a Venom Dash, Miles
        can jump off the enemy to trigger a Venom Jump and launch surrounding enemies
        into the air. *Mega Venom Blast: Miles performs a powerful area-of-effect
        attack that Venom Stuns multiple enemies and heals him. *Chain Lightning:
        Miles hits an enemy with a bolt of lightning that chains to two more enemies.
        *Thunder Burst: Instantly reaches distant targets and lands with a burst of
        Evolved Venom that knocks down a group of enemies. *Galvanize: Miles launches
        an enemy, shocking them and nearby enemies; attacking the airborne enemy releases
        more lightning strikes. *Reverse Flux: Releases an evolved Venom Energy pulse
