- id: claim-powers-and-abilities-e63abaf7
  section: abilities
  axis: hax
  text: "Universal Chaos and Order (M-Bodies)= Abstract Existence (Types 1 & 2; Manifestation\
    \ Bodies are anthropomorphic avatars assumed by the Abstracts in order to act\
    \ in more personal matters, existing as images created by the interpretations\
    \ of lesser onlookers, given semi-substantial being by the reality-altering properties\
    \ of perception. At the same time, Abstracts and their realms are avatars. They\
    \ are symbolic structures created when the universe simplifies itself, giving\
    \ itself meaning and structure, and everything in their realms is purely symbolic/conceptual,\
    \ including the Abstracts themselves.Guardians of the Galaxy Vol. 2 #11, March\
    \ 2009. The two of them are also described as sentient conceptsMarvel Fact Files\
    \ #44), Immortality (Type 1; Type 5; Type 9 \u2013 Due to the nature of Manifestation\
    \ Bodies as simple visualizations brought into being by the perceptions of lesser\
    \ entities, they cannot truly be harmed, as fighting them is tantamount to doing\
    \ battle with one's own thoughts, and any damage seemingly inflicted on them can\
    \ be instantly reversed as if it never happenedGuardians of the Galaxy Vol. 1\
    \ #47), Incorporeality (The M-Bodies of the Abstracts reside above the physical\
    \ universe, and are stated to be \"too abstract to fight in anything remotely\
    \ resembling a physical manner\"Quasar Vol. 1 #25), Acausality (Type 4; Exist\
    \ on the same level of existence as Eternity, above time as a whole.What If? Vol.\
    \ 1 #18), Beyond-Dimensional Existence (Type 3), Reality Warping, Physics Manipulation,\
    \ & Causality Manipulation (Exist as the forces that shape and sustain reality\
    \ as a whole, Order being responsible for giving the universe shape and stability\
    \ and Chaos responsible for giving it movement and dynamism. Without Order, the\
    \ universe couldn\u2019t have formed, because it\u2019d just be a roiling sea\
    \ of endlessly mutating physics; without Chaos, it also couldn\u2019t have formed,\
    \ as the random spark of change wouldn\u2019t have brought it into being in the\
    \ first place), Space-Time Manipulation, Creation and Conceptual Manipulation\
    \ (Type 1; Created The In-Betweener in order for him to serve as the barrier and\
    \ division between themselves and all dual concepts,Doctor Strange Vol. 2 #26Secret\
    \ Wars II #6 and their realm is stated to lie between the polarities of actuality,\
    \ being a plane where all dichotomies blend together and cease to existThanos\
    \ Quest #1), Absorption, Energy Manipulation, Matter Manipulation, Users of All\
    \ Forms of Magic, Mystic Being Physiology (Reside within and are the rulers of\
    \ the Mystical Universe), Cosmic Awareness, Omnipresence, Nigh-Omniscience, Deconstruction\
    \ (Chaos attempted to reduce Galactus to \"a tangle of unrelated notions,\" turning\
    \ him into chaos itself.Ultimates #7 Can dichotomize people, dividing them and\
    \ causing them to lose their individualityThe Infinity Gauntlet #5), Fusionism,\
    \ Dimensional Travel, Telepathy, Teleportation, Telekinesis, Subjective Reality\
    \ (The Magick Universe which they preside over is one where fact and fiction meld\
    \ into one), Resistance to All Forms of Magic Universal Chaos and Order (True\
    \ Selves)= All previous abilities to far greater degrees, as well as Abstract\
    \ Existence (Type 1; The Abstracts are concepts manifesting themselves as entities,Fantastic\
    \ Four Vol. 6 #3 with their very nature being insubstantial as an idea) All previous\
    \ powers and abilities to unfathomably greater scales, Paraconsistent Physiology\
    \ (Type 3; Transcends the In-Betweener, an inner function of Eternity that personifies\
    \ the barrier and division between dichotomies, being \"a concept of concepts\"\
    \ and \"walking the path between all worlds, all concepts,\" simultaneously the\
    \ union of all polarities and something that stands exempt from them) All previous\
    \ powers and abilities to vastly greater scales, Law Manipulation (Comparable\
    \ to The Living Tribunal), Corruption (Type 2; Can infect others with the poison\
    \ of the First Firmament, even conceptual beings, having brought back Galactus\
    \ to his previous state as Devourer of Worlds and vastly amplified his hunger\
    \ in conjunctionUltimates 2 #4)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
