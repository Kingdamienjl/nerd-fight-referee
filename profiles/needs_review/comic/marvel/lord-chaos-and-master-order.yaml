        \ is the synthesis of concepts such as Order, Chaos, Life, Death etc. This\
        \ is also supported by the fact that TLT is described to Bestride all Dualities\
        \ and must know their nature. Bestride is to stand astride over; astride to\
        \ sit over which implies he is above the Dualities present within Marvel.\
        \ This is also supported by the fact that in Strange Tales The Living Tribunal\
        \ describes that Good-Evil, Right-Wrong mean nothing to him. Though someone\
        \ may argue that TLT is indifferent in judging there is still consistency\
        \ that TLT transcends and is above Dualities which would include things like\
        \ Space-Time (infinity, Eternity) as well as Death and all other opposing\
        \ realms/realities which would include the likes of Oblivion.)If this wasn't\
        \ apparent enough, the Realm of Death is the Void which is the realm of Oblivion\
        \ or the Usher of Oblivion which would corroborate with TLT transcending the\
        \ likes of Death, Eternity, Infinity as well as his three faces, Equity, Vengeance,\
        \ Necessity embodying the other abstracts and that Vengeance is Death and\
        \ Oblivion. A mysterious life form given to The Living Tribunal who's Eternal\
        \ and Deathless of which exists in neither Time (Eternity), Space (Infinity),\
        \ or the Fathomless Void (Oblivion).Transcends the Realms of Space and Time\
