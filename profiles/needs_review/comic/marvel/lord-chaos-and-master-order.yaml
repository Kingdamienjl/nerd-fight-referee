      value: "Varies, up to Outerversal (According to Cosmic Hierarchies, that of\
        \ which are natural scales of power, The Living Tribunal has been shown to\
        \ be stronger than Eternity and Infinity. Likely Oblivion and Death as well(TLT\
        \ describes the In-Betweener as a lesser being. Obviously, the In-Betweener\
        \ is the synthesis of concepts such as Order, Chaos, Life, Death etc. This\
        \ is also supported by the fact that TLT is described to Bestride all Dualities\
        \ and must know their nature. Bestride is to stand astride over; astride to\
        \ sit over which implies he is above the Dualities present within Marvel.\
        \ This is also supported by the fact that in Strange Tales The Living Tribunal\
        \ describes that Good-Evil, Right-Wrong mean nothing to him. Though someone\
        \ may argue that TLT is indifferent in judging there is still consistency\
        \ that TLT transcends and is above Dualities which would include things like\
        \ Space-Time (infinity, Eternity) as well as Death and all other opposing\
        \ realms/realities which would include the likes of Oblivion.)If this wasn't\
        \ apparent enough, the Realm of Death is the Void which is the realm of Oblivion\
        \ or the Usher of Oblivion which would corroborate with TLT transcending the\
        \ likes of Death, Eternity, Infinity as well as his three faces, Equity, Vengeance,\
        \ Necessity embodying the other abstracts and that Vengeance is Death and\
        \ Oblivion. A mysterious life form given to The Living Tribunal who's Eternal\
        \ and Deathless of which exists in neither Time (Eternity), Space (Infinity),\
        \ or the Fathomless Void (Oblivion).Transcends the Realms of Space and Time\
        \ (Infinity, Eternity). Traverses All The Realms Of Death, Eternity, Order\
        \ and Chaos\u2014 All the Opposing Realities, The Strongest Of The Cosmos,\
        \ and The Judge Of All Creation. An aspect of the tribunal that safeguards\
        \ the Multiverse; Living Trinity Transcends Order, Chaos, Death, Eternity,\
        \ their realms The Cycle Of The Multiverse/Existence and all other opposing\
        \ realities. The Realm Of Death Is The Void which is The Usher/Realm Of Oblivion,\
        \ And Mind you, Oblivion says he is the Void, So That Means Living Tribunal\
        \ transcends Oblivion And Death. LT is the Top of the Food Chain Of The Cosmic\
        \ Hierarchy, Can enforce his power on any cosmos and judge them, his power\
        \ is supreme in all the Multiverse, all gods find it impossible to conceive/comprehend\
        \ his power. A Universal LT\u2019s (The one that appeared in Classic Strange\u2019\
        s Comics) Power was That Of which \u201CBinds The Cosmos\u201D according to\
        \ That LT Itself, Strange mentions he upset the balance once and that LT was\
        \ prepared to annihilate his Earth and its Reality Negs Strange\u2019s magic/spells\
        \ with a gesture, and disrupts access to abstracts (such as Chaos and Order)\
        \ against The Inbetweener who is a lesser entity to that LT.Should scale higher\
        \ than Pre-Retconned Beyonder (Phoenix Force is capable of destroying the\
        \ Beyonder if he is not careful.) while a US (Universally Stationed) Living\
        \ Tribunal has the power to deny the Phoenix Force, with the scan implying\
        \ that the US Living Tribunal could destroy the Earth and True Form Phoenix.\
        \ The Living Tribunal surpasses the Infinity Gems, so much so he can nullify\
        \ their powers and place judgement upon them. Common misconception is that\
        \ The Living Tribunal was completely killed off by the Ivory Kings (The 3\
        \ Beyonders we see in Secret Wars) however, an M-Body of The Living Tribunal\
        \ that was taken out was from another reality, all Reality/Multiverse/Omniverse\
        \ given form; as such TLT was never actually killed as other TLT's have higher\
        \ states of being and can even hide their essence in other life forms, some\
        \ even serving the Above-All-Others. Another common misconception is that\
        \ Multi-Eternity is stronger than The Living Tribunal. The Tribunal we're\
        \ shown in Ultimates 2 (2016) is just a US LT and that Adam LT only lost because\
        \ he was new, had no power and didn't develop enough which explains why he\
        \ was weaker than his 7th iteration counterpart. Also confirmed that, in the\
        \ analogs of Ultimates 2 (2016), 7th Iteration Living Tribunal would scale\
        \ above Logos and actually judged him.To understand how powerful even a US\
        \ (Universally Stationed) Living Tribunal is, an aspect of The Living Tribunal\
        \ called the Death of Death, the Beyonder couldn't manipulate Death beyond\
        \ completely removing her while the Death of Death could either revive or\
        \ completely erase her. Additionally, when Dr. Strange sped the process of\
        \ the destruction of all of existence Strange with the remains of Eternity\
        \ is all that remains within the Void (the Void is not black; assumed that\
        \ Oblivion got caught up in the destruction) revealed that it was Galactus\
        \ was the one who destroyed all of existence with only a bit remaining The\
