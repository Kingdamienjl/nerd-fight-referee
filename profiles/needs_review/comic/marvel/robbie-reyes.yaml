      value: 'The countless years the Rider had spent on Earth alone had caused him
        serious mental issues and as the Rider is technically dead, he can be influenced
        by beings who have control over dead like Hela Notable Attack/Techniques:
        *Chain Manipulation: Can manipulate his chains which are made from Cyttorak''s
        bones and cannot be destroyed even by creatures like Thanos and can tear apart
        his enemies. *Penance Stare: Frank possesses the supernatural ability to cause
        any individual who stares into his eyes to see and feel every bit of pain
        they have ever inflicted on anyone in their entire lifetime for all eternity.
        *Penance: By infusing his Penance Stare with the Power Cosmic, the Rider can
        incinerate any sinner he uses it against, regardless of whether or not said
        sinner feels any remorse. *Hellfire Explosion: Can create an explosion of
        hellfire so large that it can be seen on the surface of the planet and can
        destroy the Annihilation Wave. *Hellfire Breath: Release hellfire breath from
        his mouth. *Energy Explosion: Can create an energy wave that creates a large
        explosion enough to destroy part of a city. *Energy Projection: Creates energy
        projections from his body or from his hands. *Possession: Frank possesses
        the ability to stretch the natural capacity of the ethereal entities to unprecedented
        limits. Having possessed the whole of Avengers Mountain and assuming control
        over it''s numerous facilities. *Telekinesis: Demonstrated potent telekinesis
        by near-instantaneously dismantling an entire space-ship. ==Notable Matchups==
