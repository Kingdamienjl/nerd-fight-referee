      power-up (Perceived the events around him in a picosecond while running. Dodged
      an explosion and ran a fair distance away from it in time despite only having
      three picoseconds to avoid the explosion, even viewing three picoseconds as
      "an eternity" to himScarlet Witch & Quicksilver #2), Infinite by removing his
      mental barriers (After his mental barriers where removed by Scarlet Witch and
      Synapse,Avengers Vol 1 688 he ran so fastAvengers Vol 1 688Avengers Vol 1 690
