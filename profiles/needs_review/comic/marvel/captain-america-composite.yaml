    - field: standard_equipment
      value: '*Captain America''s Shield: Steve Rogers'' greatest and most iconic
        weapon as Captain America is his shield. Made from a Proto-Adamantium / Vibranium
        Alloy that has never been duplicated, the shield is one of the most durable
        items in the universe, being capable of taking full-powered attacks from the
        likes of Thor, The Hulk, and Silver Surfer without even suffering a small-dent.
        Furthermore, the Shield also absorbs most-kinetic energy from impacts due
        to its Vibranium component, which is why Captain America doesn''t get sent
        flying when he blocks attacks from such powerful opponents. The shield is
        also highly aerodynamic, receiving minimal wind resistance and deflection
        of path, which combined with Steve Rogers'' inhuman precision and skill makes
        it a highly efficient throwing weapon. *Captain America Suit: The uniform
        that Steve Rogers wears as Captain America. The suit is made of Kevlar, Nomex
        and Light-weight Titanium, as has displayed various capabilities such as:
