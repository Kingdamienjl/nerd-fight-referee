    field_candidates:
    - field: powers_and_abilities
      value: Jean excels at astral combat. She maintained a psychic link to Cyclops
        for a number of years. She possessed the memories of the Phoenix duplicate
        of her as well as those of Madelyne Pryor-Summers, her clone, and is thus
        an expert pilot. Jean has shown some proficiency in hand-to-hand and armed,
        non-psionic combat; the extent of this is unknown as she prefers to utilize
        her telekinesis and telepathy during battle. However, she has used her telepathy
        to absorb the fighting prowess and techniques of Colleen Wing and Misty Knight,
        and has been able able to defeat a group of ninjas with the only use of telekinetic
        weapons. She has a college education from Metro College.
      source_id: fandom-marvel-jean-grey-rebirth
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: standard_equipment
      value: 'She can create psionic weapons and constructs out of psychic energy
        that damage a target either physically, mentally or both in some point.{{r|Jean
        Grey Vol 1 4}} The versatility of this ability was greatly enhanced after
        training with Psylocke.{{r|Jean Grey Vol 1 5}} **Temporal Telekinesis: Jean
        has been able to use her telekinetic abilities through time by projecting
        her astral form in different points in the timestream.{{r|X Deaths of Wolverine
        Vol 1 4}} ** {{Power|Telekinetic Flight}}: Jean has, on numerous occasions,
        demonstrated the ability to use her telekinesis to fly across long distances
        at varying speeds. *Psychic Energy Manipulation: Jean has demonstrated the
        ability to harness, tap into, and manipulate psionic energy for various purposes
        and effects, including but not limited to: **{{Power|Psychic Vampires|Psychic
        Siphoning}}: Jean is able to drain others'' psychic energy to enhance her
        psionic powers. The boost she can provide to herself depends on the psychic
        energy within her enemies, explaining the fact that she is rarely seen using
        this power. The greatest feat she has performed after using this ability was
        when she knocked Galactus out with a blast of psychic energy stolen from him,
        the Phoenix, Terrax, and an unknown alien species.{{r|Generations: Phoenix
        & Jean Grey Vol 1 1}} She also used this ability to reconstruct her body after
        being consumed by a Poison, and to kill the Poison Queen.{{r|Venomized Vol
        1 5}} *** Telekinetic Aura:thumb|Surrounding herself with psionic energy.
        She can surround her body with psychic energy to protect herself from harm.
        She survived a high-speed collision from Gladiator, which would have normally
        resulted with her death.{{r|Guardians of the Galaxy Vol 3 13}} *** Psychic
        Resistance: She can protect herself from other telepaths by draining the psychic
        energy that they normally use.{{r|All-New X-Men Vol 1 28}} This also prevents
        her psyche from complete erasure after the Poisons took her over.{{r|Venomized
        Vol 1 5}} *** Psychic Entity Physiology: Jean manages to ascend her physical
        body to become a being of pure psionic force, similar to Nate Grey from the
        age of Apocalypse.{{r|Guardians of the Galaxy Vol 3 13}} In this form she
        is a material energy being who could regain her physical form even after having
        been consumed by a Poison, using this feature to break free of her corporeal
        prison and reconstruct her physical body from scratch.{{r|Venomized Vol 1
        5}} *** Cosmic-Level Telekinetic Blast: She can create a blast of psychic
        energy powerful enough to affect Cosmic Beings as Galactus. ** Psychic Flames
        Manipulation: Even without the Phoenix Force, Jean has been shown to psychically
        control and influence flames composed of psychic energy to a certain extent.{{r|Phoenix
        Resurrection: The Return of Jean Grey Vol 1 2|3}}{{r|Uncanny X-Men Vol 1 355}}
        She can also use her telekinesis to manifest psychic firebird, whose claws
        could inflict both physical and mental damage.{{r|Marvel Comics Presents Vol
        1 15}}{{r|Uncanny X-Men Vol 1 382|383}}{{r|Generations: Phoenix & Jean Grey
        Vol 1 1}} ** Psionic Electricity Generation: She can transform psychic energy
        into concussive bolts of energy.{{r|Guardians of the Galaxy Vol 3 25}} **
        {{Power|Possession}}: She can possess the mind of another and use that being''s
        body as her own.{{r|New X-Men Vol 1 116}} **{{Power|Self-Resurrection}}: Jean
        has been able to resurrect herself by either using her psychic powers or through
        her sheer force of will. Jean has been able to resurrect herself by reconstructing
        her body out of psionic energy after it was vaporized.{{r|Venomized Vol 1
        5}} Jean was even able to fully resurrect herself after being clinically dead
        and independent of the Phoenix Force after encasing herself in a glacier of
        ice.{{r|X-Men: Phoenix Endsong Vol 1 5}} Whenever Jean Grey dies, her spirit
        is sent into the White Hot Room to be resurrected by the Phoenix as a result
        of immense connection to the cosmic entity. *{{Power|Probability Manipulation|Probability
        Negation}}: Jean Grey had been deemed as a nexus of probabilities on multiple
        occasions. There has even been one instance, from whence she returned from
        stasis with the Fantastic Four,{{r|Fantastic Four Vol 1 286}} Destiny titled
        her as such when she failed to view the future due to Jean Grey''s presence.{{r|X-Factor
        1 1}} Another occasion where this has happened is when Destiny revealed that
        due to Jean trascending between time and space she has become an anomaly,
        who''s future is unable to be seen clearly, whilst Scott Summer''s was crystal
        clear.{{r|X-Factor 1 30}} *{{Power|Phoenix Force|Phoenix Force Empowerment}}:
        As the favored and true avatar of the powerful Phoenix Force, Jean may greatly
        increase her powers by tapping into the omniversal life energies of those
        yet unborn.{{r|Excalibur Vol 1 25}}{{r|Excalibur Vol 1 61}} The Phoenix Force
        also allows its avatars to manifest additional powers, especially in terms
        of Jean as its "host, house, and self." Jean Grey'
