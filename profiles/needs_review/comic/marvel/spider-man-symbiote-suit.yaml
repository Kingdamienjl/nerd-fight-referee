    - field: standard_equipment
      value: "*Nano-Tech Costume: Using nanotechnology \u201Cdiscreetly borrowed\u201D\
        \ from Reed Richards' lab, Peter created a Wrist Morpher which provided him\
        \ with access to his new Spider-Man suit. When activated, billions of microscopic\
        \ robots will cover Peter's body in seconds, allowing him to change into his\
        \ superhero persona on the go with access to built in equipment. **Web Shooters:\
        \ Allows Spider-Man to utilize his webbing. Aside from transportation, his\
        \ webbing is incredibly useful in combat, with even just one web ball being\
        \ capable of ensnaring opponents completely. Aside from this, Peter often\
        \ focuses on creating web shields for defence. His webbing also has explosives\
        \ capabilities and can be used in a variety of other ways. He reloads them\
        \ via Web Cartridges. **Spider Tracers: Tiny spider shaped tracers that Spider-Man\
        \ can fire from his wrist onto whatever or whoever he wishes to track through\
        \ his suit. However, large amounts of heat can loosen the adhesively, causing\
        \ them to fall off in certain situations. **Spider-Darts: Small blades that\
        \ Spider-Man can fire from his wrist as to harm or disarm enemies, cut objects,\
        \ and damage technology. They've also been shown to be capable of rapid fire,\
        \ shooting in multiple directions at once, and having explosive capabilities.\
        \ **Sonics: On voice command, Spider-Man can project sonic waves from his\
        \ body and can even increase their potency. While they were designed as Anti-Symbiote\
        \ weaponry, their frequency is powerful enough to destroy large machines.\
        \ **Stealth Mode: Turns Spider-Man completely invisible. This mode is used\
        \ for infiltration, staying hidden, and landing sneak attacks. **Osmotic Gas\
        \ Filter: A part of Spider-Man's suit that allows him to filter out harmful\
        \ gases. *Remote Controlled Suit: A suit that Peter can control from a distance\
        \ as a means to distract his opponents. It's even capable of projecting audio\
        \ of Peter talking. *Spider Society Watch: Given to him by Miguel O'Hara upon\
        \ joining the Spider Society. This device allows Peter to easily travel across\
        \ the multiverse through portals, as well as residing in other universes while\
        \ his body's atoms remain intact."
