    - field: weaknesses
      value: 'He usually doesn''t take his fights seriously unless he has a good reason
        to. *Spider-Sense Disruption: Spider-Man''s Spider Sense can lose its effectiveness
        if it is blocked or temporarily weakened by specialized equipment or certain
        drugs. It also would not trigger if it detects something that is not registered
        as a threat like the Spider-Man clones or the Venom symbiote and its offspring
        and Anti-Venom. When deprived of his spider-sense, Spider-Man becomes vulnerable
        to surveillance and attack, and web-slinging requires most of his concentration.
        This weakness is resolved after embracing The Other, making it harder for
        his Spider Sense to be disrupted. *Ethyl Chloride: Perhaps as a side effect
        of gaining his powers, Spider-Man is susceptible to the pesticide ethyl chloride.
        This chemical is frequently used as a weapon by the Spider-Slayers. Notable
        Attacks/Techniques: |-|Base=Spider-Sense: Spider-Man''s greatest known asset
        is his precognitive ability at his disposal. While commonly known for simply
        warning him of oncoming danger, it does much more. The Spider-Sense allows
        Spider-Man to know which scenarios of a fight are good and bad for him, takes
        a 360 degree snapshot of his surroundings, helps him aim while blinded, lets
        him know when something is about to explode, keeps him aware of everything
        in his vicinity even while asleep, and his Spider-Sense can also help him
        move his body to minimize damage from unavoidable attacks. *Mark of Kaine:
        Spider-Man concentrates his adhesive powers into his hand and rips the skin
        off of the opponent''s face. *Web Shooters: Canisters using a special web
        fluid that he designed himself, they spray webbing that is stronger than steel
        and even people as strong as The Thing has had trouble breaking out of it.
