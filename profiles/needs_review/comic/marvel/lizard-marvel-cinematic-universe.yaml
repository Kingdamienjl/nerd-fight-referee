      value: 'None notable Curt Connors and the Lizard: Although their minds have
        occasionally been mixed or were replaced by one another, they remain two substantially
        different personalities. As it was revealed later, the Lizard persona was
        actually a byproduct of Connors''s suppressed insecurities, frustration, anger
        and other dark emotions and desires; during a period of particularly deep
        crisis, the two even seemed to overlap, to the point that not even Spider-Man
        was able to tell what was really the truth behind Connors''s illness.Spectacular
        Spider-Man Vol 2 12Spectacular Spider-Man Vol 2 13 Because of lizards'' naturally
        pacific nature, Spider-Man theorizes that the reason behind Lizard''s cruelty
        could be Connors''s dark side itself. However, overtime Connors managed to
        get a better grasp at his normal self, and the gap between him and the Lizard
        got wider as it used to be. Connors also recognized his past errors and took
        responibility for them, swearing to improve and make up for them.'
