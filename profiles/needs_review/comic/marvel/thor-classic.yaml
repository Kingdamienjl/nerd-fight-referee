    - field: weaknesses
      value: 'As he fears killing his opponents, he will almost always hold back his
        true strength in a fight. This desire to hold back is also subconscious, as
        he admits that he forgets his true strength, meaning that even when he attempts
        to go all out he may not be capable of accessing his true strength. When entering
        Warrior''s Madness, Thor loses his sanity | Needs to periodically enter the
        Odinsleep to replenish the power of the Odinforce. When in this state, he
        is entirely defenseless. | Thor cannot rewrite past fate. | None notable Feats:
        * Stated to have the power to savage a universe, and then unleashes a blast
        that rips open the fabric of the universe * Shook the heavens, which have
        infinite weight * Contained the explosion of the Life Bomb, which can wipe
        out 1/5 of the universe * Shook the fabric of infinity * His battle against
        Hercules was stated to have almost broken the heavens * Can easily lift a
        book with infinite pages * Overcame infinite gravity * Rent the heavens asunder
        * Survived an explosion that shook the universe and encompassed the entire
        Black Galaxy, with narration comparing it to the Big Bang. The Black Galaxy
        exists outside the normal universe, and is initially stated to be a universe
        of biological matter, then corrected to something "more fantastic" than a
        universe. * Shook the universe with his Thermo-Blast * At his utmost strength,
        managed to push the World Engine, which holds all of the World Tree * As a
        baby, he shook the World Tree every time he cried * The clash between Dargo
        Ktor and Eric Masterson, who only had 10% of Thor''s power, caused mystical
        energy to erupt across all planes of reality and reverberated across the entirety
        of the cosmos. This clash was compared to the Big Bang, and generated enough
        energy to power a machine that would collapse infinite timelines into one
        * Shattered the root of Yggdrasil * One-shot Abomination * One-shot Agger,
        who had the strength of the Hulk * Accidentally felled Namor * Defeated an
        amped Hulk * Fought Silver Surfer * Stalemated Hulk for over an hour * One-shot
        Hulk * Wrestled the manifestation of the Odinforce * Defeated Mephisto * Fought
        against Odin, who was wearing the Destroyer armor * Fought Zeus for months
        straight * Knocked out the Phoenix Force * Staggered Galactus * Broke Galactus''
        helmet and made him scream in pain * Overpowered the Midgard Serpent who had
        a long and bloody battle against Odin * Killed the Demogorge * Killed The
        Glory, unleashing a cosmic tsunami that tore through reality itself, with
        Glory''s strength being compared to the full power of the Asgardian Pantheon
        * Fought within Surtur''s Eternal Flame, which can burn Yggdrasil and all
        of reality * Could contain the God Tempest, although he could not control
        it, with the God Tempest having fought Odin for many days * Defeated Ego with
        his Thermo-Blast, with Ego surpassing Galactus'' power * Defeated Mangog,
        who even Odin fears * With his Godblast, defeated Zeila, who had absorbed
        Odin''s power Category:ObberGobb Category:Tier 2 Category:Tier 1'
