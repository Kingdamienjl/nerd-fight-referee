    - field: powers_and_abilities
      value: "*Regeneration: Thor can heal wounds that would normally leave large\
        \ scars or broken bones in a few hours. As an Asgardian, even if his heart\
        \ is completely removed from his body, Thor\u2019s heart will automatically\
        \ reattach itself to the body if placed in the right spot. *Magic: Thor's\
        \ attacks are magical due to his divine roots. *Element Manipulation and Weather\
        \ Manipulation: Thor had been commanding the elements long before he ever\
        \ wielded Mjolnir. He can create and control atmospheric phenomena even in\
        \ places that shouldn\u2019t allow them to occur, such as outer space. He\
        \ can release lightning from his hands, exhale with the hurricane-force breath,\
        \ and create fire rain on an extremely harsh planet. Also, as a son of Earth\
        \ Mother Gaea, Thor can manipulate tectonic plates to create avalanches, earthquakes,\
        \ landslides and chasms far beyond what natural phenomena can offer. *Energy\
        \ Manipulation: Within Thor's being, there exists a mighty life force called\
        \ the God-Force. He can release this force through powerful auras and energy\
        \ blasts that can kill Durok the Destroyer. *The Gift of Forgetfulness: A\
        \ spell that allows Thor to erase the memories of others. However, whether\
        \ he can use this on other beings of divine roots is unknown, as he has only\
        \ used it on mortals. *Super Hearing: While not exactly combat-useful, Thor\
        \ can hear prayers to him from mortals who are worlds away. *Warrior's Madness:\
        \ Thor can temporarily increase his strength and stamina tenfold at the expense\
        \ of his sanity. In this berserker state, he attacks friends and foes alike.\
        \ Because of this, he rarely used this ability. *All-Tongue: Anyone who hears\
        \ Thor will hear him speak their native language in their hearts. *Illusion:\
        \ Growing up as the brother of Loki, Thor has a few illusion tricks of his\
        \ own. He used an illusion to trick a spying Malekith and even his own allies\
        \ into thinking he killed Ud the Troll, only for those allies later to find\
        \ Ud alive and utterly confused. *Resistance: :*Outer space: Thor can survive\
        \ in the vacuum of space without any aid :*Diseases: Asgardians are immune\
        \ to Earthly diseases :*Radiation, extreme temperature, and Absolute Zero:\
        \ Given he fights gamma-radiated beings, as well as frost giants and fire\
        \ demons regularly, Thor should be highly resistant to these conditions. Even\
        \ when plunged into an area of absolute zero, Thor later emerged from it fairly\
        \ unharmed. :*Poisons: Asgardians are immune to certain levels of poison :*Electricity:\
        \ Electricity from the Celestial Mothership not only failed to give Thor any\
        \ inconvenience but even freshened him. :*Age Manipulation: Due to his extremely\
        \ slow aging rate, Thor can resist the aging effects of Decay's touch or Immortus's\
        \ aging ray. However, he could not resist Hela's aging power. :*Time Stop:\
        \ Being a mythic creature, Thor can move in the time of the beginning where\
        \ all things mortal cease their endless spinnings. He can move in Jormungandr's\
        \ stopped time, his own stopped time, and possibly Odin's stopped time as\
        \ well (although it is possible Odin allowed Thor to do so) :*Matter Manipulation:\
        \ By Thor's own words, his molecules are very different from mortals, allowing\
        \ him to resist certain molecular powers, such as molecular freezing that\
        \ induces total paralysis. :*Transmutation: The screams from the Skull Sea\
        \ of Mephisto's hell, which turn blood to stone, failed to affect Thor. Loki\
        \ had to tap into the power of Surtur's Twilight Sword to turn Thor into a\
        \ frog, implying the God of Mischief's own transmutation power cannot achieve\
        \ such a feat. :*Soul Manipulation: Thor can resist assaults from Glory's\
        \ psychic maggots that eat away at his very soul and could withstand the totality\
        \ of Glory's power, including his soul attacks. Doctor Strange and Mephisto\
        \ also commented that Thor has a mighty soul. Thor even resisted Mephisto's\
        \ attempt to absorb his soul and forced out Loki's astral possession. :*Mind\
        \ Manipulation: Thor has resisted mind attacks from Moondragon. As a god,\
        \ he also didn't have his mind destroyed by Chaos King's power, which could\
        \ immediately destroy a mortal's mind with a touch. He also resisted a wave\
        \ of psychic toxins from Glory that permeated every level of his being: body,\
        \ mind and spirit. He fought said attack and even continued his attack on\
        \ Glory, while just speaking would take an effort to break most men or gods.\
        \ Mind-tendrils attack from the maggots of The Other also affected Thor only\
        \ momentarily before the God of Thunder recovered. The Hurricane of the Lustful\
        \ in Mephisto's Hell also failed to influence Thor. Powers with"
