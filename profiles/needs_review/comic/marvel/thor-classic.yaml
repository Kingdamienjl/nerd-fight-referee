        Warrior''s Madness, Thor loses his sanity | Needs to periodically enter the
        Odinsleep to replenish the power of the Odinforce. When in this state, he
        is entirely defenseless. | Thor cannot rewrite past fate. | None notable Feats:
        * Stated to have the power to savage a universe, and then unleashes a blast
        that rips open the fabric of the universe * Shook the heavens, which have
        infinite weight * Contained the explosion of the Life Bomb, which can wipe
        out 1/5 of the universe * Shook the fabric of infinity * His battle against
        Hercules was stated to have almost broken the heavens * Can easily lift a
        book with infinite pages * Overcame infinite gravity * Rent the heavens asunder
        * Survived an explosion that shook the universe and encompassed the entire
