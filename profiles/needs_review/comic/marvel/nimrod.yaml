    - field: intelligence
      value: 'Above Average (Good djinn on average are exemplary students and Nimrod
        in particular has demonstrated a vast knowledge in many fields, especially
        history) Standard Tactics: Against mortals Nimrods standard approach in battle
        is to transform them into harmless animals. Against other Djinn few attacks
        have been demonstrated, but if he sees a chance transelementation with subsequent
        imprisonment in a bottle seems to be his method of choice.'
      source_id: vsbattles-nimrod-marvel-comics
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Being cold weakens his djinn powers or in extreme cases even prevents
        their use. There are various magical rituals, often even usable by humans,
        that can be used to enslave djinn in particular. Usually those require a small
        piece of the djinns body. Jade is resistant against djinn power. Like most
        djinn he is somewhat claustrophobic. Notable Attacks/Techniques: *Control
        over luck: The djinn as a species control all luck in the universe. As such
        each djinns actions have a small influence on the luck of every being, good
        actions tilting it in the good direction and bad actions in the bad direction.
        *Wish Granting: Djinn have the power to grant wishes, those of other as well
        as their own, and through that are able to do almost everything. However,
        the usage of djinn power comes with a price. Djinn, other than humans, are
        beings made out of fire and the power necessary to fulfill wishes comes from
        their internal fire, which is their lifeforce. This is a strictly limited
        quantity, that never restores itself, and each use of this power shortens
        a djinns lifespan until, when all power is used up, it is just as short as
        a humans. The fundamental understanding of djinn power includes the realisation,
        that any objects change into the form desired by the djinn is an event that
        always was possible. For most complicated applications of their power djinn
        need to use their focus word, a word which focusses their djinn power. Nimrods
        focus word is Qwertyuiop. A particularly interesting aspect of wish granting
        is that the details regarding the result don''t have to be fully known. Due
        to that things like creating a car without knowing how it works or what parts
        it is made from, or making a particular kind of object disappear through all
        of New York without knowing where these objects are located, are possible.
        The following are uses of djinn power Nimrod should be able to accomplish:
        **Teleportation: As accidentally demonstrated by Philippa djinn are able to
        teleport objects and people to distant places. **Existence Erasure: One of
        the easiest exercises for beginner djinn is to make things disappear, turning
        them into nothing. **Probability Manipulation: Aside from their general influence
        over luck djinn can also influence the luck of single events, as demonstrated
        when Philippa accidentally made Mrs. Trump win the lottery. **Possession:
        Nimrod can make himself, and force others to, possess animals. When possessing
        animals djinn can telepathically communicate with each other. Nimrod can also
        reverse the possession. **Accelerating an objects molecular structure: During
        practice Philippa accidentally accelerated a stones molecular structure. Nimrod
        should be able to do the same. **Creation: Djinn are capable of creating any
        object that they know from nothing. They can even create them with modifications
        they lack the technical knowledge for, like for example creating a remote
        controlled excavator. **Astral Projection: Nimrod can separate someones astral
        body from their physical body. **Transformation: Djinn can turn people and
        objects into different things. Turning people into harmless animals, or even
        non-sentient objects like wine bottles, is a standard fighting strategy for
        many djinn. They can also transform themself. Transformation doesn''t just
        change the appearance, but also the biological processes, which has as consequence
        that certain inabilities can be cured through it. **Manipulating knowledge
        and talent: Djinn can grant themselves and other knowledge and talent. They
        can force example become the worlds best and whistling, great artists, learn
        new languages, give someone an idea what they are talking about, become good
        climbers etc. They can also take these things away, as demonstrated when the
        young djinn Dybbuk reduced his teachers intelligence to the point of them
        being incapable of calculating 2+2. **Elementon: Djinn can summon Elementals,
        mini-demons belonging and wielding one of the eight elements earth, air, fire,
        water, spirit, space, time, and luck. They can control them to an extent.
        **Qaesitor Binding: A binding cast by a djinn that is designed to find out
        what a person really hates and make it start coming out of his or her mouth.
        This can be simple things like vegetables to more complicated ones like living
        spiders. **Whirlwinds: Most djinns preferred travelling method is to created
        whirlwinds that carry them quickly over far distances. **Transelementation:
        The act of transubstantiating another person, which can then be followed by
        imprisoning them in a lamp or bottle. **Resurrection: As Nimrods sister Layla
        demonstrated, a djinn can limit the time for an animals transformation to
        the animals lifespan. This has as consequence that if the animal dies, due
        to being killed or otherwise, the transformation is undone and the human resurrected
        in the process. As demonstrated by an accidental wish of Zadie Eloko djinn
        can also bring people back as undead, which can then not be killed by normal
        means. She broug'
