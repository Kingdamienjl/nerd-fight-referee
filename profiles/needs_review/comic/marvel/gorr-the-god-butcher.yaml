- id: claim-powers-and-abilities-2c0daebb
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity, Immortality (Types 2, 4 and
    8; Able to survive as just a severed head. After merging with All-Black, Gorr''s
    body is merely a construct formed by the symbiote, able to reform from All-Black
    so long as it exists), Regeneration (Low-Mid, High-Mid for All-Black; As the progenitor
    Symbiote All-Black should possess regeneration comparable, if not superior, to
    Venom and Carnage), Enhanced Senses (Able to hear the prayers of all those praying
    to Thor and other gods), Weapon Mastery, Martial Arts (Skilled in hand to hand
    combat), Water Walking, Self-Sustenance (Types 1 and 3), Flight, Power Nullification
    (Able to nullify immortality), Energy Projection, Darkness Manipulation (Able
    to completely merge with shadows, as well as create and manipulate pure darkness
    to conceal himself), Weapon Creation (All-Black can be used to create numerous
    weapons including swords, scimitars, maces, knives, flails, whips, and hammers),
    Shapeshifting (All-Black is able to shapeshift to create clothes, armor, wings,
    weapons, chains, and tendrils), Life Manipulation (Able to create sentient minions
    such as Black Berserkers as well as artificial constructs of other people, with
    Gorr in particular being able to create a vast army of Black Berserkers at will),
    Clairvoyance (Able to see and feel through his Black Berserkers), Absorption (All-Black
    is able to absorb and assimilate things such as stars and black holes, even reality
    itself, as well as the blood of gods it or its constructs kills to strengthen
    itself and its host), Biological Manipulation (Those cut by All-Black will be
    gradually infected by it, destroying them from the inside), Time Travel, BFR (Can
    use shards of the Pool of Forevers to send his opponent thousands of years through
    time), Black Hole Creation, Resistance to Heat Manipulation (Was unfazed by being
    tackled into the sun) | All previous abilities, plus: Fusionism and Absorption
    (After losing his physical form, Gorr merges with the All-Black the Necrosword,
    which had been eating the universe, therefore Gorr became what remained of the
    universeKing Thor #3), Body Control (Planets, stars, galaxies, nebulae, black
    holes, and more all part of him, and he can use it in offensive mannersKing Thor
    #4), Black Hole Creation, Deconstruction'
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
