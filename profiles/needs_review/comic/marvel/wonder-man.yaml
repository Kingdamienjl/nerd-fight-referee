- id: claim-weaknesses-30b50e1f
  section: weaknesses
  axis: weakness
  text: '*Energy Weaponry: As he is an ionic energy being, Williams is susceptible
    to attacks that disrupt his unique energy pattern. Dispersion would be hazardous,
    as he might not be able to reform without further assistance from the Scarlet
    Witch. During the Kang Dynasty however, he was dispersed by one of Kang''s weapons
    and was plenty capable of reforming himself on his own after traveling a great
    distance to avoid being discovered alive and making a grand escape, so this is
    unlikely. Williams can, however, be rendered unconscious and it is possible for
    him to be injured. *Sanity: He has been shown to have some mental breakdowns that
    lead to him to attacking the Avengers multiple times after he began to believe
    that everything bad was caused by the team. Note: * Though he often fights them,
    Wonder Man fails to measure up to the true strength of Thor, Hulk and Hercules.
    * Before making any changes to this page, please read and follow the Power-scaling
