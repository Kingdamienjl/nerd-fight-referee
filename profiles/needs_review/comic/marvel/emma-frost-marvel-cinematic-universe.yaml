      although he was somewhat weakened due to being previously injured by the Phoenix
      Force) | High Universe level (Stronger than before. Should be comparable to
      Cyclops, as she had the other half of the Phoenix Force. Briefly fought with
      The HulkAvengers vs. X-Men #11, November 2012)'
