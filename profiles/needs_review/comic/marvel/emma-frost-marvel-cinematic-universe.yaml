        in swordsmanship), Power Nullification (Depowered Enchantress. Can break magical
        connections using her Soulsword, with the effects usually being permanentAmazing
        Spider-Man (2022) #68), Weapon Creation (Created the Soulsword), Minor Attack
        Reflection (Using her sword), Pain Manipulation (Getting stabbed by the soul-sword,
        despite it not doing any physical damage towards non-demons, will still leave
        mortal targets in so much agony that they''ll be unable to move), Martial
        Arts (Takes out the "Cat" as a child), BFR (As shown here), Teleportation
        (Via mutant stepping disks), Summoning (Can summon beasts to aid her), Energy
        Manipulation (Knows Juliani''s Spell of Energy Manipulation from the scrolls
        of Agamotto), Forcefield Creation (Using Vishanti Shield of Personal Defense),
        Invisibility (Using the Crytorryk Spell of Invisibility), Magical Bolts (As
        shown here), Automatic Translation (Using the Translation Spell), Transformation
        and Rage Power (Overuse of her powers awakens the Darkchylde powers within
        her), BFR (As shown here. Magik also casually sent two students to Hell),
        Extrasensory Perception (Can typically detect magical threads and entities
        with a Reveal spell. Should be comparable if not superior to Despair, a young
        demon from Limbo, who can "see the dark, painful side of all things at all
        times" and also sensed that Zoe Laveau was a zombie), Summoning (Even when
        her magic abilities are weakened, can easily summon a large amount of tentacles
        with a basic spell. Can summon energy creatures to attack her enemies with
        the Arm of Phorcys), Fire Manipulation (With the Decay spell), Sound Manipulation
        (Can render an enemy unable to utter sound with a Silence spell), Portal Creation
        (Can create a portal to a dark realm full of vampires), Sealing (Can create
        magic seals and barriers to contain energies and targets), Additional Limbs
        & Energy Manipulation (Can summon many arms of flaming energy with Limbo magic),
        Possibly Astral Projection, Resistance to Mind Manipulation, Fire Manipulation
        (The walls of Belasco''s layer easily withstood the Human Torch''s fire due
        to being coated in Belasco''s magic, with Illyana being a fellow lord of Limbo
        just like Belasco) and likely resistance to Soul Manipulation and Corruption
        (Heka-Nut was unable to claim or corrupt her soulMystic Arcana: Magik), as
