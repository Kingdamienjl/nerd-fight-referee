- id: claim-weaknesses-27789654
  section: weaknesses
  axis: weakness
  text: 'Retains the same mobilityDeadpool: The Gauntlet Infinite Comic Vol 1 8 impairmentsHulk
    Vol 3 6 of his predecessor but has artificially improved upon his biology to not
    be affected by some of the same imperfections. He engineered his new body with
    less nerves compared to the original, in order to not damage himself and feel
    the same pain his progenitor did.Hulk Vol 2 29 Although not shown or stated directly,
    he likely doesn''t require regular transplants of organs like the original did,
    for the plots never seemed to allow room for such recurrence. Furthermore, he
    erased the lingerings traces of the programming meant to enslave M.O.D.O.K. to
    A.I.M. which subtly influenced his predecessor, thus granting himself true free
    will. Requires the integrity of his artificial psionic blaster in order to fire
    his mental bolts. Although he attempted to correct his hubris, such a weakness
    still lingers in him and has often led to his downfall. Notes: *Before making
    any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics. *Do not confuse this version of M.O.D.O.K. with his predecessor.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
