    - field: standard_equipment
      value: 'Suit, visor, collapsible sword, bulletproof shield, bow with explosive
        arrows, knife, retractable claws and blade, revolver *Taskmaster''s suit:
        Taskmaster wore a tactical armored suit when operating on missions. The helmet
        is retractable and can be removed by a button on the right gauntlet. Taskmaster''s
        mask has a heads up display which analyzes battlefield data. Using this HUD,
        Taskmaster was able to predict her opponent''s movement patterns, which she
        used against Natasha Romanoff during their first confrontation, allowing her
        to able to overpower Romanoff with ease. Taskmaster would later use the HUD
        display to assist her with her aim while using her Bow to shoot at Romanoff
        and Yelena Belova''s car, finding the perfect moment to shoot underneath the
        car and cause it to crash. Taskmaster''s gloves contain retractable metal
        claws similar to those of Black Panther, which were used against Red Guardian.
        Taskmaster''s left gauntlet contains a retractable blade similar to Crossbones,
        which was used in an attempt to kill Red Guardian. However, Melina Vostokoff
        managed to attack and entrap Taskmaster, before she could kill Red Guardian
        with the blade. The suit has an in-built parachute.'
