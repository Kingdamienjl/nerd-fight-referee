    - field: weaknesses
      value: 'Whenever he copies something new, it pushes old memories out of his
        brain in a form of amnesia. Can''t copy the meaning behind the actions (for
        example, he might be able to play an instrument like a master after watching
        a virtuoso play, but that doesn''t mean he can read music.) Self-admitted
        cowardice comparatively to many other Marvel Comics characters. His predictive
        ability can be disrupted should his opponent repeatedly alter their fighting
        styleCaptain America (2018) #5 or move in an erratic, unpredictable fashion.Deadpool
        (Vol 3) #2 {|class="wikitable mw-collapsible mw-collapsed" ! Feats |- | Strength:
        *Sent Bullseye flying with a single punch *Can chop through Spider-Man''s
        webbing with a shield throw *Sent three men flying with a single shield toss
        *Can block hits from low ranking Asgardians *Penetrated 2 Asgardians with
        his sword Speed/Agility/Reflexes: *Was able to evade and dance around Iron
        Man *Weaved through a laser grid *Disarmed two men and took their guns before
        they hit the ground *Caught a boomerang from behind *Can fight Captain America
        while simultaneously blocking bullets *Caught Captain America''s Shield *Jumped
        over a bullet *Blocked bullets with chains *Shot a room full of guards dead
        before they could react Durability/Endurance: *Tanked a hit from lightning
        *Got shot in the arm and didn''t even notice *Took a punch from an enraged
        Spider-Man and got back up *Was only briefly stunned by Spider-Woman''s Venom
        Blast *Was crushed through concrete by the Invisible Woman and was only knocked
        out Accuracy: *Landed a triple headshot *Killed a man with two pens *Plugged
        a bolt into a gun barrel *Ricocheted a billy club off several walls and hit
        Spider-Man in the back of the head *Took down four giants with one shield
        toss *Hit Moon Knight with a Billy club *Hit Ant-Man while he was shrunk with
        his bola Skill: *Beat Spider-Woman with one punch to the gut *Won a fight
        against seven different metahumans at the same time without being touched
        once *Very nearly won a fight against 5 different superheroes (including Captain
        America) *Beat up Cat (Shen Kuei), a man consistently portrayed on the same
        level as Shang-Chi *Effortlessly defeated the daughters of both Batroc the
        Leaper and the Tarantula *Beat Electra with his eyes closed *Held his own
        against the 1990s lineup of the Avengers (including Ms. Marvel and Captain
        Marvel) *Held his own against Captain America and Iron Man at the same time
        *Fought against several low-ranking Asgardians during The Siege *Beat Typhoid
        Mary *Defeated Black Widow *Broke into S.H.I.E.L.D HQ and implied he could
        have killed Maria Hill whenever he wanted *Fought with Hawkeye until he got
        bored *Beat hit squads sent by seven different organisations at the same time
        that he trained *Took down Venom with some preparation time *Snuck up on Deadpool
        |} Notable Attacks/Techniques: *Photographic Reflexes: Taskmaster''s primary
        power and the main source of virtually all his other abilities. Taskmaster
        can perfectly replicate the physical movements of peak level humans through
        simple observation. This ability isn''t just limited to seeing the original
        user perform the action in the flesh, it works equally well by watching video
        recordings. Early in his career Taskmaster learned a lot of skills simply
        by watching news footage and recordings of several members of the Avengers
        in action. By watching a video of an action in fast forward he can move at
        superhuman speeds, but doing so places extremely high levels of strain on
        his body and can only be used in shorts bursts. A side effect of this power
        is memory loss, the more knowledge and abilities that he learns, the more
        of his personal memories he losses. *Martial Arts Mastery: Taskmaster is arguably
        one of the best hand to hand combatants in the Marvel Universe. He has perfectly
        replicated the fighting styles of several of the most skilled martial artists
        in his verse including Electra, Iron Fist, Shang-Chi, Captain America and
        Wolverine. He even proved skilled enough to teach Captain America''s fighting
        style. What makes Taskmaster so formidable is the fact that once he has mastered
        any fighting style he can recall it at any time he wants, as a result, he
        is capable of cycling through multiple high-level techniques in rapid succession,
        which makes him hard to read during a fight. Spider-Man even stated that fighting
        Taskmaster was like fighting 7 of the Avengers at the same time. Taskmaster
        is also extremely knowledgeable of pressure points, even being able to subdue
        a giant with this skill. He also likely has some knowledge of chi, he claimed
        to have mastered the art of chi during a fight with a chi user and has fought
        against various martial artists with chi abilities. *Skilled Swordsman: Taskmaster
        is a highly skilled swordsman after having copied the abilities of the Black
        Knight, Silver Samurai, and the Swordsman. He frequently carries a sword into
        battle and has proven skilled enough to fight lesser ranking Asgardians in
        battle'
      source_id: mediawiki-284835
