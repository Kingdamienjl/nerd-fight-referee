- id: claim-powers-and-abilities-a8762e18
  section: abilities
  axis: hax
  text: 'Doctor Octopus=4 Mechanical tentacles on his Back, Genius Intelligence, Stealth
    Mastery (Hid from security policeAmazing Spider-Man; Vol 1; Issue #3; 1963) Telepathy
    (With tentacles only), Surface Scaling (Can scale through walls with his tentacles),
    Elasticity (Seems to be able to enlarge his tentacles), Preparation (Has repeatedly
    made plans for trying to conquer the world and defeat Spider-Man. Studied the
    Avengers and later defeated them with the Sinister Six), Resistance to Mind Control/Telepathy
    (Unaffected by telepathic commands given to him), Electricity Manipulation (His
    arms are insulated) and Gravity Manipulation (Moved in a gravitational field that
    could stop an elephant), Sense Manipulation and Possession with Preparation (Created
    a brain-swapping octobot with tech that forced Spider-Man to ignore his spider-sense)
    |-|Superior Spider-Man=Superhuman Physical Characteristics, Genius Intelligence,
    Preparation, Regeneration (Mid-Low; Has the body of Spider-Man, which can regenerate
    broken bones in hours and recover from vampire attacks), Surface Scaling, Acrobatics
    (Has the body of Spider-Man, and should retain his agile capabilities), Precognition
    (Has access to Spider-Man''s Spider Sense), Enhanced Senses (Has the body of the
    original Spider-Man, which should grant him access to his natural senses. Can
    detect energy build-up and magnetic signatures), Extrasensory Perception (Should
    have this due to having access to the Spider Sense), Skilled Martial Artist, Web
    Creation, Afterimage Creation (Like Spider-Man, he has shown the capability of
    creating afterimages with his speed), Mind Control (With preparation. Created
    technology to mind control the Sinister Six), Technological Manipulation and Limited
    Power Nullification (Can create a power dampening field, which disabled the technology
    of the Sinister Six), Hacking (Able to hack a Shield Helicarrier with his Spider
    Bots), Energy Absorption (Capable of reversing the absorption of energy to weaken
    the opponent), Disease Manipulation (With preparation. Quickly created a device
    to destroy a virus without harming the host), Explosion Manipulation (Can inject
    somebody with Spider Tracers that he can detonate. Carries explosive Spider Bots),
    Electricity Manipulation (His suit''s Spider Legs are capable of shooting electricity),
    Fire Manipulation (Has fire webbing that can help against Venom), Sound Manipulation
    (Has sonic webbing that can fend off Venom), Information Analysis (Capable of
    analyzing targets and can access information about their powers with the lenses
    of his suit, can see through magic illusions), Forcefield Creation (Can create
    forcefields, spider Bots can come together to create forcefields), Ice Manipulation
    (Froze Waxman), Poison Manipulation (With nerve gas), BFR (Can put targets out
    of phase with reality), Limited Body Puppetry (With Octobot), Power Absorption
    (With Preparation. Recreated Doom''s power absorption device), Energy Manipulation
    (Can disrupt Dr. Strange''s magical energies, can charge his arms with anti-ionic
    energy), Power Mimicry (Can mimic Bifrost''s magical energies), Resistance to
    earthly poisons and diseases (Can even recover from vampirism), Mind Control/Telepathy
