    - field: intelligence
      value: 'At least Gifted, likely Genius. Emma Frost is highly skilled in electronic
        theory and electronics and has learned how to build devices that can amplify
        psionic energy and utilize psionic energy for various effects. Taught at Xavier''s
        school for mutants and at the Massachusetts school. Emma has experience as
        a member and leader of the X-Men, along with other teams. Emma is also a skilled
        businesswoman, being one of the heads of the Hellfire Trading Company/Hellfire
        Club. She also used to sit on the Quiet Council as a governing figure of Krakoa.
        Emma is an extremely powerful and learned telepath repeatedly stated to be
        on par with Charles Xavier. Emma also passively learns information through
        telepathic osmosis.Uncanny X-Men vol 1 #496'
      source_id: mediawiki-emma-frost-marvel-comics
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'She''s physically a normal human outside of her diamond form and she
        cannot use her telepathic abilities while in it. Her telepathic powers are
        also unable to read or affect the minds of her siblings.Emma Frost #4Emma
        Frost #5 | Can be harmed by Chaos Magic and taking enough damage could cause
        the Phoenix Force to abandon her. Far more arrogant and overconfident than
        before. Notable Attacks/Techniques: *Psychic Surgery: The utilization of pin-pointed
        psionic energy to exert absolute control over individual brain functions such
        that the physical form can be manipulated (i.e., injuries healed, disabilities
        repaired, the nervous system, etc.), a sub-skill of telepathy unusual for
        even the most powerful of telepaths, but one that Emma is keen to utilize
        whenever the occasion benefits her. *Organic Diamond'
      source_id: mediawiki-emma-frost-marvel-comics
