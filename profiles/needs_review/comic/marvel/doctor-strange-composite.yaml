        Ice Manipulation (Has refrigerating units built into his armor that can freeze
        Reed Richards), Magnetism Manipulation (Reversed his armor's polarity to turn
        Magneto's powers against him, and caught Cap's shield in a magnetic field),
        Mind Manipulation (Has "Instant Hypnotism Inducers" that he can use to control
        others built into his armor, and scrambled Grey Hulk's nerve impulses to render
        him incapable of controlling his body), Invisibility (Has a portable cloaking
        unit installed into his armor that makes it so that not even Wolverine can
        sense him), Teleportation (Can teleport using his emergency transport beam
        and has teleporters located all across Earth), Time Travel (Has time circuity
        built into his armor, letting him travel through time, and used null-time
        sequencers to travel across time while fighting Reed, defeated Galactus by
        repeatedly traveling back in time to find a new angle), Transmutation (Can
        convert matter into energy), Reactive Evolution (His armor's defenses are
