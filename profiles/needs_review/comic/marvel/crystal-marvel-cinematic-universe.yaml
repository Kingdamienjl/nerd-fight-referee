        \ as having an old weaponized drone enter the Hex as she was aware it wouldn\u2019\
        t be changed due to the fact that it matched the time period of Wanda\u2019\
        s reality,WandaVision: S1E05: On a Very Special Episode... and even had Darcy\
        \ send a message through the computer systems inside the Hex without having\
        \ the email altered.WandaVision: S1E05: On a Very Special Episode... Has helped\
        \ repair damaged S.A.B.E.R\u2019s and Carol\u2019s spacecrafts by utilizing\
        \ her powers as lasers to fix devices, with the spacecrafts being capable\
        \ of using Jump Points for transportation.The Marvels (2023) Quickly deduced\
        \ that her and Captain Marvel and Ms. Marvel\u2019s exposure to an unstable\
        \ jump point caused their powers to become entangled, resulting in their switching\
        \ upon using their abilities.The Marvels (2023) They then practiced together\
        \ to control their switching, and quickly learned how to take advantage of\
        \ their entanglement in battle after brief moments of training.The Marvels\
        \ (2023) She can understand the complex structure of the Universal Neural\
        \ Transportation Network, which is a system of wormholes through space-time\
        \ continuum, and can understand the risks that Dar-Benn\u2019s unstable jump\
        \ points posed to the transportation network and the space-time continuum.The\
        \ Marvels (2023) Along with Ms. Marvel and Captain Marvel, they were able\
        \ to figure out Dar-Benn\u2019s motives of using jump points, quickly discovering\
