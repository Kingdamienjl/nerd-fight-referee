    - field: weaknesses
      value: 'Due to the threatening nature of Dark Phoenix''s powers, Jean is reluctant
        when entering battles unless she feels the need to fight seriously, going
        as far as to silently hope her opponents kill her.Ultimate Marvel vs. Capcom
        3 Jean''s ability to hold off her Dark Phoenix persona is described by herself
        as only somewhat under control.Marvel vs. Capcom 3: Fate of Two WorldsUltimate
        Marvel vs. Capcom 3 Phoenix can only equip up to three card effects at a time.
        Feats: *Toted as the "destroyer of worlds".Ultimate Marvel vs. Capcom 3 *Has
        destroyed whole planets in the past.Marvel vs. Capcom 3: Fate of Two WorldsUltimate
        Marvel vs. Capcom 3 *Capable of defeating Galactus.Marvel vs. Capcom 3: Fate
        of Two WorldsUltimate Marvel vs. Capcom 3 Notable Attacks/Techniques: |-|Command
        Normals= Base *Prominence Heel: Phoenix raises her leg and sends a fiery kick
        downwards. *Flare Sword: Phoenix lunges forward while aiming her hand in front,
        attacking the opponent while her hand is covered in fire, leaving a trail
        of flames behind. This can also be performed aerially. *Burn Out Beak: While
        airborne, Phoenix halts all of her momentum, plummeting straight downward
        while her feet are covered in beak-shaped flames Dark Phoenix *Feathers: When
        performing any of her normal attacks, a batch of flames in the shape of feathers
        will be send outwards. This same property applies to her aforementioned attacks.
        |-|Throws= *Throw: Phoenix telekinetically lifts the opponent before tossing
        them away. *Air Throw: While airborne, Phoenix telekinetically lifts the opponent
        and tosses them away a further distance than her regular throw. |-|Special
        Attacks= *TK Shot: Phoenix sends out a fireball, which travels forward and
        explodes upon once making contact with her opponent, burning them. A faster
        variant, as well as one that homes in on the opponent can also be used. As
        Dark Phoenix, two fireballs instead of one. *TK Overdrive: Phoenix covers
        her body in flames as she spins while flying at the opponent. Performing this
        move has the additional benefit of protecting Jean from enemy projectiles
        during its course. This attack can also be aimed diagonally upwards. *TK Trap:
        Phoenix creates a burning phoenix emblem, which flies out as a projectile,
        catching them off guard in specific directions depending on the version used.
        The first two versions fire upon activation, triggered after the opponent
        crosses the path which the emblem is facing. It can either be placed on the
        ground in front of Jean and fire upwards when activated or be placed in the
        in front of her in the air and fire forwards when activated. The final variant
        of the attack be placed directly in front of Phoenix and fire diagonally upwards,
        requiring no actions from the opponent when used. As Dark Phoenix, this technique
        covers a greater area. *Teleportation: Phoenix teleports from her current
        location to another, closing the distance between her and the opponent. She
        can reappear in front of, behind, or above her enemy. *Flight: Similar to
        other fighters, Phoenix can utilize flight to deal deadly air combos. Unique
        to herself, Phoenix is surrounded by a fiery aura when flying. |-|Hyper Combos=
        *Phoenix Rage: Phoenix surrounds herself with a massive flaming bird before
        sending it forward from her position as a projectile. *Healing Field: Phoenix
        activates a flaming orb around her body. If her opponent is within the orb''s
        radius, Jean will replenish her health at an incredibly fast rate. *Dark Phoenix
        Rising: When Phoenix''s life is depleted in battle, she fails to hold back
        her other self, transforming into Dark Phoenix. Upon her transformation, she
        releases a shockwave that pushes away any nearby opponents. In this state,
        all of Jean''s attacks are enhanced Note: Avoid scaling other characters to
        Phoenix through Onslaught. While Onslaught was stated to be superior to Thanos
        and Galactus,Marvel vs. Capcom: Clash of Super Heroes Manual the latter of
        which was confirmed to exist in the Marvel vs. Capcom continuity as far back
        as Marvel Super Heroes,Official Sega Saturn Magazine Issue 23 Jean had not
        yet become the Phoenix during this era. This is shown during X-Men: Children
        of the Atom, in which she is still Marvel Girl.X-Men: Children of the Atom
        ==Notable Matchups== Victories: Losses: Morrigan Aensland (Darkstalkers) Morrigan''s
