      value: '*Armor: A personal armour created by Doom himself, which he wears at
        all time. Due to Victor''s own physical strength being average at best, his
        armor remedies this allowing him to engage in direct combat, making him a
        force to be reckoned with. As expected of the dictator''s trickery, it comes
        loaded with gimmicks. **Photon Blasters: Installed into his fingers, Doom
        can unleash photon-based blasts. **High-Powered Blaster: A ranged weapon Doom
        keeps holstered at his side, which fires lasers. **Built-in Jetpack: Located
        in his back armoring and hidden by his cape, Doom can enable himself to fly
        upon activating this piece of technology. He can also use it in short bursts
        to thrust himself forwards and backwards. If Doom has fallen to the ground,
        he can opt to use a short burst to lift himself back on his feet. **Power-Siphoner:
        Hidden within his chestplate, Doom can steal a portion of others'' power.
        *Missile Turrets: Turrets Doom can spawn from the ground, which launch several
        missiles in the air and come down on his target if they do not hit them initially.
        *Thrones: Two different chairs Doom will be seen sitting on before and after
        his battles as a means to boast of his sovereignty. The first is a larger
        throne with no remarkable traits while the second has the ability to hover.
        *Doombots: Robot duplicates of Doctor Doom that possess similar abilities
        to himself. Victor can call upon them at any time. Arguably, it appears as
        though Doombots may take his place in battle, adding a level of deception
        to foes in regards to whether they are fighting the real Doom or not. *Optional'
