    - field: standard_equipment
      value: "| * Power Armor: Doom is never without his signature power armor, a\
        \ technological marvel he magically forged at a Tibetan monastery and which\
        \ he has extensively upgraded and modified over the years. It incorporates\
        \ many systems, some optional and others almost always present, and Doom builds\
        \ on it whenever necessary. These systems include jet systems, advanced sensory\
        \ systems that can scan on all frequencies, many computers that allow it to\
        \ automatically track and attack targets, a nearly self-aware AI that constantly\
        \ works to improve Doom's defenses, supported by other adaptive technologies,\
        \ and life support systems that produce air, water, food, and energy. Doom's\
        \ armor also contains many weapons, such as grenades, lasers, missile launchers,\
        \ plasma cannons, repulsor beams, wrist blasters, and so on. It is also protected\
        \ by an electrical current that shocks anyone who touches it, and a powerful\
        \ forcefield capable of withstanding a Celestial's energy blasts. The armor\
        \ even has fragments of the True Cross incorporated to fend off vampires and\
        \ demons. It has fail safes to make sure that only Doom can make full use\
        \ of its abilities, to ensure his technology cannot be used against him, and\
        \ even if it is worn by someone else, it will slowly brainwash them and replace\
        \ their personality with Doom's. The armor will even automatically fight on\
        \ its own should Doctor Doom swap his mind with that of another person's with\
        \ the Ovoid Mind Transfer, its AI viewing itself as an extension of Doom's\
        \ will, and it has booby traps in his suit so that anyone he mind-swaps with\
        \ is unable to remove it or use its weapons. Other systems include; ** Acid\
        \ Spray: Doom can spray a highly toxic acid against his foes. ** Anti-Magic:\
        \ Kirbons such as Pym-Particles have anti-magic propertiesMoon Knight: Fist\
        \ of Khonshu #9 (more on Doom's Pym Particles below and in the P&A section).\
        \ ** Belt Jets: As the name suggests, they are jets attached to Doom's belt\
        \ that let him fly. ** Disruption Charge: Doom sends out a charge within his\
        \ gauntlet to release charge that can shatter the molecular cohesion of his\
        \ opponent. ** Ectoplasmic Ionizer: Built into Doom's armor, this allows him\
        \ to dispel the spirits of the dead, sending them to the afterlife. ** Electrical\
        \ Charge Reversal: Doom is able to reverse an electrical charge sent at him,\
        \ something that he used against an electrical whip. ** Electrified Fist &\
        \ Beams: Doom can surround his fist with electricity to enhance his strikes,\
        \ and even fire large electrical blasts. ** Electromagnetic Screen: Doom used\
        \ this to counter a simulated Sue Storm attempting to engulf him in a force\
        \ field. ** Electro-Motors: His armor possesses electro-motors that can propel\
        \ him forward when he is in water. ** Electro-Paralyzer: Built within his\
        \ glove, Doom can temporarily make his opponent stay still. It even worked\
        \ on Thor (though only when the latter was without Mjolnir). ** Electro Magnetic\
        \ Amplifier: Doom used this to electrocute and kill his hybrid \"son\", who\
        \ had the powers of every Fantastic Four member.Fantastic Four #199 He later\
        \ used the same device to send a powerful electric surge straight through\
        \ the Thing which greatly damaged him. ** Electrostatic Force/Force Field\
        \ Projector: With this ability, Doom can seal objects and opponents with a\
        \ forcefield. He even did it once with Mjolnir, and with the Hulk. ** Energy\
        \ Fist: Doom can use this to grab and restrain his opponents. ** Energy Tendrils:\
        \ With unnamed energy tendrils, Doom could block energy blasts to save Reed\
        \ Richards.Captain America Vol. 2 #12 ** Energy Tractor Beam: Doom can send\
        \ out an energy beam or field of sorts that can grab objects he wants, or\
        \ restrain others in large orbs. ** Finger Lasers: Shoots lasers from his\
        \ fingers that can be used to stun someone and knock them out, shoot electro\
        \ blasts, and destroy a target's nerves. ** Force-Rays: Doom can shoot out\
        \ rays that can send him hurtling away.Incredible Hulk #144 ** Full Power\
        \ Thermo-Blast: An intense blast shot from Doom\u2019s hand that reduces those,\
        \ even with armor to protect them, to atoms. ** Heat Generation and Absorption/Nullification:\
        \ His armor is capable of generating heat that can harm Luke Cage, but he\
        \ can also create a concussion vacuum that absorbs the Human Torch's flame\
        \ (or fire deoxygenizing foam to have the same effect). ** Holograms: Doom\
        \ can remotely access holograms of some kind to trick others and make a quick\
        \ escape if need be. He\u2019s also used it to sneak up on people or for communication.\
