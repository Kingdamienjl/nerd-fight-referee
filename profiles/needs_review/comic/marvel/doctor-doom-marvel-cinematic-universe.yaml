        done this against beings as powerful as a Kraken (though he did note the Kraken
        to have a brain "the size of an apple"), as well as people with high mental
        resistance such as Reed Richards. *Ovoid Mind Transfer: A mental power that
        Doom learned from the alien Ovoids. By making eye contact with another being,
