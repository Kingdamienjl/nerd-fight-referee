  text: "*Superhuman Physical Characteristics *Martial Arts (Is a trained hand-to-hand\
    \ combatant) *Explosion Manipulation & Energy Manipulation (Her mind having control\
    \ over her powers let's Jubilee manifest them in a variety of ways, like energy\
    \ balls and streamers, which are described as \"fireworks\" of explosive plasma.\
    \ She can juggle them like trick balls and shape them into small star-like objects\
    \ or explosive spheres. The blasts can also be small enough to do lethal damage\
    \ to one's brain, or large enough to become swirling energy as big as she isUncanny\
    \ X-Men Volume 6 #2 or even as big as a large car, or massive blasts capable of\
    \ wiping out part of a forest.Excalibur Vol. 4 #9 & #11 Alternatively, Jubilee\
    \ can launch waves of energy that can slice through a van,Age of X-Man: X-Tremists\
    \ (2019) #5 point and launch literal finger-guns,Generation X Vol. 1 (1994) #65\
    \ fling ranged energy balls,Hunt For Wolverine: Mystery In Madripoor #2 and fire\
    \ massive energy beams.Generation X Annual #5 She can also charge nearby particles\
    \ such as those of glass with pyrotechnic energy to make them explosive and even\
    \ reabsorb her Fireworks back into her body with no damage whatsoever) **Plasma\
    \ Manipulation (Her energy blasts are describedExcalibur Vol. 4 #23 as plasma\
    \ blasts,Official Handbook of the Marvel Universe: X-Men 2005 plasmoids, and \"\
    fireworks\" of explosive plasma) **Light Manipulation (Across the dozens of times\
    \ she's created bursts of light,Jubilee (2004) #5 Jubilee has claimed it will\
    \ fry one's retinas. Her Fireworks are also stated to cause temporary blindness.\
    \ They can also be used to light up dark areas like mini-flashlights,Wolverine\
    \ Vol 2 (1988) #46 and she can stun enemies via her lumikinetic explosive light\
    \ blastsX-Men: Blood Hunt - Jubilee) **Technology Disruption (Used her Fireworks\
    \ to short-circuit a technological console,X-Men (1963) #258 as well as to flare\
    \ out both vision receptors and infra-red sensorsWolverine Vol. 2 (1988) #62)\
    \ **Limited Fire Manipulation (Has set vans on fire with her powers,Free Comic\
    \ Book Day: X-Men/Blood Hunt as well as much of a street and nearby buildingsAge\
    \ of X-Man: X-Tremists (2019) #4) **Matter Manipulation & Durability Negation\
    \ (Sub-Atomic. Her \"fireworks\" can destroy matter atJubilee (2004) #2 theOfficial\
    \ Handbook of the Marvel Universe: X-Men (2005) molecular,Official Handbook of\
    \ the Marvel Universe: A-Z #6 atomic, or even the subWolverine & Jubilee #1-atomicX-Men\
    \ Vol. 2 (1991) #36 level) *Acrobatics (Has outrun and outmaneuvered multiple\
    \ cops for fun with her ace gymnastic skills, even jumping off a 50-foot drop\
    \ with some help from a hanging object with no trouble or damage whatsoever.Uncanny\
    \ X-Men (1963) #244 Has kept up with Wolverine's agility when battling soldiers,Uncanny\
    \ X-Men (1963) #271 and leaped up the side of a sentinel to blast it in the face.\
    \ This somewhat leaks into her fighting style, and she has been refuted as a highly\
    \ trained gymnast on multiple occasions. She has even incorporated acrobatic kicks\
    \ into her attacks,Patsy Walker, A.K.A Hellcat! (2016) #12 and has also shown\
    \ to be acrobatic here, here, and here) **Limited Hypermobility (Jubilee can use\
    \ her blasts in midair to propel her movementsWolverine Vol. 2 (1988) #55 or to\
    \ blast herself in any directionGeneration X (2017) #87) *Stealth Mastery (Consistently\
    \ evaded detection from the X-Men and Reavers. Her stealth is also shown hereHunt\
    \ For Wolverine: Mystery In Madripoor #3) *Resistance to: **Plasma Manipulation\
    \ (Is resistant to her own plasmoid \"fireworks\" and even her \"Atom Bomb\" explosion,\
    \ and she can also reabsorb her Fireworks back into her body with no damage whatsoever)\
    \ **Telepathy (Is immune to telepathy due to the latent energy flowing within\
    \ in her brain.Storm (2024) #8 Psylocke\u2019s psi-scans were unable to find her,\
    \ and even expert telepath Scurvy described her as being undetectable to him)\
    \ Same as before except for the loss of her plasma-based mutant powers, but with\
    \ the addition of: *Transformation (Can transform into mist), *Immortality (Type\
    \ 1; Is perpetually stuck at the age of 17) *Natural Weaponry (Has fangs)"
  source_ids: *id003
  decisive: true
  status: unverified
