    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Martial Arts (Is a trained hand-to-hand
        combatant), Explosion Manipulation & Energy Manipulation (Her mind having
        control over her powers let''s Jubilee manifest them in a variety of ways,
        like energy balls and streamers, which are described as "fireworks" of explosive
        plasma. She can juggle them like trick balls and shape them into small star-like
        objects or explosive spheres. The blasts can also be small enough to do lethal
        damage to one''s brain, or large enough to become swirling energy as big as
        she isUncanny X-Men Volume 6 #2 or even as big as a large car, or massive
        blasts capable of wiping out part of a forest.Excalibur Vol. 4 #9 & #11 Alternatively,
        Jubilee can launch waves of energy that can slice through a van,Age of X-Man:
        X-Tremists (2019) #5 point and launch literal finger-guns,Generation X Vol.
        1 (1994) #65 fling ranged energy balls,Hunt For Wolverine: Mystery In Madripoor
        #2 and fire massive energy beams.Generation X Annual #5 She can also charge
        nearby particles such as those of glass with pyrotechnic energy to make them
        explosive and even reabsorb her Fireworks back into her body with no damage
        whatsoever), Plasma Manipulation (Her energy blasts are describedExcalibur
        Vol. 4 #23 as plasma blasts,Official Handbook of the Marvel Universe: X-Men
        2005 plasmoids, and "fireworks" of explosive plasma), Light Manipulation (Across
        the dozens of times she''s created bursts of light,Jubilee (2004) #5 Jubilee
        has claimed it will fry one''s retinas. Her Fireworks are also stated to cause
        temporary blindness. They can also be used to light up dark areas like mini-flashlights,Wolverine
        Vol 2 (1988) #46 and she can stun enemies via her lumikinetic explosive light
        blastsX-Men: Blood Hunt - Jubilee), Technology Disruption (Used her Fireworks
        to short-circuit a technological console,X-Men (1963) #258 as well as to flare
        out both vision receptors and infra-red sensorsWolverine Vol. 2 (1988) #62),
