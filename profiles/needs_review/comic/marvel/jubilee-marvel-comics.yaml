  intelligence:
    text: 'Gifted *She already had "above-average" combat skill as stated by official
      guidebooks, along with many fighting techniques picked up from her time in Juvenile
      Hall (to the point of being described as a "fair hand to hand combatant"), but
      her skill improved after receiving training from top-tier fighters like Wolverine
      and Emma Frost. This ranges from learning firearms knowledge and how to turn
      anything on hand to a weapon, to getting martial arts training from LoganOrigin
      of Marvel Comics: X-Men (2010) and Raido, a multi-century old samurai. In battle,
      she has used her powers to blind foes several times over and her precision can
      even let her pick locks from a distance.X-Men Legends #8 *She''s rather adept
      at figuring out flaws in robotic foes, and can accurately target thrusters or
      the like to knock them out of the sky, or blast the vision receptors out of
      a sentinel.Wolverine Vol. 7 #50 In pure hand-to-hand, she''s defeated multiple
      Hand ninjasX-Terminators Vol. 2 (2022) #3 and has defeated multiple mirror clones
      of herself and vampires at the same time, even while blind-folded for part of
      the latter fight. Outside of combat terms, she is an experienced thief. Her
      skills advanced in some point of the future to even be claimed as "the last
      X-Man" by the time-traveler Bishop.Generator X-Men #27 Even when handcuffed,
      she could hold her own in a fight against a blind Reiko, who while blind took
      down multiple Hydra soldiers in mere seconds with her poison sword.Wolverine
      Vol 2 (1988) #56 *She has outrun multiple cops for fun, even jumping off a 50-foot
      drop with some help from a hanging object with no trouble or damage whatsoever.
      Has kept up with Wolverine''s agility when battling soldiers and leaped up the
      side of a sentinel to blast it in the face. This somewhat leaks into her fighting
      style, and she has been refuted as a highly trained gymnast on a few occasions
      before. She has also incorporated acrobatic kicks into her attacks in the past.'
    source_ids:
    - mediawiki-4367036
    confidence: 0.6
    notes: auto_repair source extraction
