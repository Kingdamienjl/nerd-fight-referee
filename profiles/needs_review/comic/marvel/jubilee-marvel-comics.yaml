- id: claim-weaknesses-76abc58f
  section: weaknesses
  axis: weakness
  text: 'Dyscalculia. Won''t use her Atom Bomb attack if innocents are nearby and
    at risk of being harmed by it, and in general refuses to kill her enemies, not
    even the man who hired the hit to murder her parents (though she is more willing
    to kill unrepentant vampires, if reluctantly). | As a Vampire, she had the standard
    weaknesses of a thirst for blood and sunlight. Due to the events of "House of
    M", Jubilee lost her mutant plasma-based powers while she was a vampire. Note:
    Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
