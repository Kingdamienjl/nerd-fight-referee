    text: 'Unknown physically (Rarely engages in physical combat, however, he is a
      former knight). Varies (The strength of Exodus'' powers is affected by the belief
      he and others have in himself), up to at least Planet level with telekinesis
      (Fought and defeated Sersi.Uncanny X-Men #307 Clashed with Apocalypse soon after
      awakening his powers, though he was overpowered and sealed away. Scarlet Witch
      has compared his power to Magneto and Exodus himself has compared his power
      to Magneto. Knocked down and one shot a group with both Sunspot and Cable with
      a single telekinetic bolt. Is an Omega Level Telekinetic, and as a result should
      be comparable, if not superior, to other high-level telekinetics like Jean Grey
      and Cable). Can negate durability in several ways.'
