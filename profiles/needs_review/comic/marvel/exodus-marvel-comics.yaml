- id: claim-powers-and-abilities-c6a52624
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (In the use of swords,
    shields, and knives), Martial Arts, Statistics Amplification (Exodus'' powers
    grow based on the faith/belief he and others have in himself.Immortal X-Men #2
    Immortal X-Men #3 He can also enhance his powers by feeding on the psychic energy
    of those around him.X-Man #14 Exodus can augment his physical stats with his telekinesis),
    Telekinesis and limited Matter Manipulation (Exodus is an Omega Level Mutant with
    the dominant power of telekinesis, meaning he has no discernible upper limit to
    develop this power.House of X #1 Exodus was capable of repairing Xavier''s brain,
    atom by atom, using his powers after he had been shot in the head, but his own
    unconscious psychic defenses wouldn''t let himX-Men Legacy #208), Telepathy and
    Mind Manipulation (Manages to fight Xavier in telepathic combat for a bit and
    dominate him with visions and guilt from his past. The battle was so powerful
    that Emma Frost, another accomplished telepath, feels the feedback from their
    battle thousands of miles away and states it would be enough to fry the brain
    of anyone within a hundred yards.X-Men- Legacy #210 Controls Crystal, Jean Grey,
    Quicksliver and Scarlet Witch using his telepathic powers. Xavier also states
    that Exodus must be incredibly powerful considering he was able to hide his powers
    from himThe Avengers #369), Psychic Energy Absorption (Shown against Nate Grey.),
    Astral Projection, Longevity (Was born sometime during the 12th century), Limited
    Biological Manipulation (Used his powers to increase Quicksilver''s metabolic
    rate), Non-Physical Interaction (His psychic bolts are capable of badly hurting
    people in astral forms. Used his powers to solidify ShadowcatUncanny X-Men Annual
    1999), Teleportation (He was teleporting so fast that none of the X-Men could
    keep up with him and they needed Rachel to determine where he''d be next. Teleported
    and tagged Cannonball with a blast), Forcefield Creation (Trapped all of Genosha
    in a massive unbreakable energy shield and attempted to use it to crush Genosha),
    Healing (Could heal Xavier''s brain atom by atom, and likely employs similar methods
    to heal his own injuries), Extrasensory Perception (Is capable of sensing people
    within his vicinity through telepathy. Is capable of seeing people''s astral projectionsUncanny
    X-Men #315), Energy Manipulation and Energy Projection (Can shoot beams of psionic
    energy from his eyes.Avengers West Coast #101 Can also project psychic bolts),
    Flight and Self-Sustenance (Type 1. Could fly in space and through the sun), Electricity
    Manipulation and Magnetism Manipulation (Stated by Crystal to be superior to her
    in manipulating the electromagnetic spectrum, and is compared by Scarlet Witch
    to MagnetoX-Men #26), Sleep Manipulation (Via telepathy), Illusion Creation, Resistances
    to Sound Manipulation (Was unfazed by an attack from SirynX-Force #25), Radiation
    Manipulation and Biological Manipulation (Blocked devolution energy from a weapon
    created by the High Evolutionary by creating a psychic barrierHeroes for Hire
    #16), Telepathy and Mind Manipulation (Kicked Jean Grey out of his mind while
    he was fighting Nemesis.X-Men #43 Overpowered Sersi''s telepathic assault with
    his telepathy and stole knowledge regarding the nature of the EternalsImmortal
    X-Men #5), Fire Manipulation and Temperature Manipulation (Could fly in space
    and through the sun), Life force Absorption (Survived exposure to Rogue''s touch
    and still had the energy to move at mach 2X-Men- Legacy #262 )'
  source_ids: *id003
  decisive: true
