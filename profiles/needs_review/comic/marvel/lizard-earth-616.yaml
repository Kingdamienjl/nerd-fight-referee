    - field: standard_equipment
      value: 'None notable Curt Connors and the Lizard: Although their minds have
        occasionally been mixed or were replaced by one another, they remain two substantially
        different personalities. As it was revealed later, the Lizard persona was
        actually a byproduct of Connors''s suppressed insecurities, frustration, anger
        and other dark emotions and desires; during a period of particularly deep
        crisis, the two even seemed to overlap, to the point that not even Spider-Man
        was able to tell what was really the truth behind Connors''s illness.Spectacular
        Spider-Man Vol 2 12Spectacular Spider-Man Vol 2 13 Because of lizards'' naturally
        pacific nature, Spider-Man theorizes that the reason behind Lizard''s cruelty
        could be Connors''s dark side itself. However, overtime Connors managed to
        get a better grasp at his normal self, and the gap between him and the Lizard
        got wider as it used to be. Connors also recognized his past errors and took
        responibility for them, swearing to improve and make up for them.'
      source_id: vsbattles-lizard-earth-616-marvel
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Standard= Extraordinary Genius as Curtis Connors, Below Average to Gifted
        as Lizard; {{#tag:tabber| {{!}}-{{!}}Curtis Connors= Was a surgeon during
        the war, became one of the world''s leading authorities on reptiles and developed
        the Lizard serum, as well as many of its variations over the years. Prepared
        a serum that curedAmazing Spider-Man Vol 1 32Amazing Spider-Man Vol 1 33 Aunt
        May from radiation poisoning. Together with Spider-Man, he created a solventAmazing
        Spider-Man Vol 1 43 that melt Rhino''s skin. Deciphered an ancient tabletAmazing
        Spider-Man Vol 1 74 that not even the greatest hieroglyphic experts could
        translate, and then used its content to elaborate the lifeline formula. Found
        a cure that restored his human form and removed Spider-Man''s extra arms by
        using Morbius''s blood as a catalyst. Conducted several testsAmazing Spider-Man
        Vol 1 150 on Spider-Man to determine if he was the real one or a clone. Designed
        an enervator and a special taser, and turned the latter into a life-force
        siphon in a matter of moments.Amazing Spider-Man Vol 1 164 Synthesized a serum
        that cured Spider-Man from the Lizard transformation.Peter Parker, The Spectacular
        Spider-Man Vol 1 40 Spider-Man oftenSpider-Man Blue Vol 1 2 seeks his helpSensational
        Spider-Man Vol 2 35 when it comesPeter Parker, The Spectacular Spider-Man
        Vol 1 40 to solvingSpider-Man: Fear Itself Vol 2 1 scientific dilemmas.Amazing
        Spider-Man Vol 1 554 Altered Doctor Octopus''s technology and replicated voodoo
        magic scientifically. Stated to be smart enoughSensational Spider-Man Vol
        2 23 to have cured cancer. Developed a vaccineSensational Spider-Man Vol 2
        36 that could halt the effects of a "Spider Serum" similar to the one that
        turned him into the Lizard. Built a machineAmazing Spider-Man Vol 3 16Amazing
        Spider-Man Vol 3 17 that would have restored Electro''s powers, hadn''t his
        body been "cured" by Spider-Man to an even greater level. Created a version
        of his Lizard serum capable of nullifying the effects of the Carrion virus
        while also keeping the subjects half-human physically and identical to their
        previous self mentally.Clone Conspiracy Vol 1 4Clone Conspiracy Vol 1 5Clone
        Conspiracy Omega Vol 1 1Amazing Spider-Man Vol 5 15 Became an estimated professor
        at the Empire State University. Designed a poison whose effects are so potent
        that it bypassed Taskmaster''s immunity to every toxic substance known to
        man, while still ceasingAmazing Spider-Man Vol 5 20 to be effective after
        twenty-four hours from the injection. Built his inhibitor chip, a containment
        facility for dangerous threats and a series of self-replicating, anti-Lizard
        killer robotsAmazing Spider-Man Vol 5 25) {{!}}-{{!}}Lizard= At first Lizard''s
        intelligence was quite similar to that of a human, just inferior to Curtis''s
        and corrupted by evil intent, which was worsening as time went on. Devised
        a way to frame Spider-Man. Sly, wicked, calculating and predatory, the Lizard
        has repeteadly matched Spider-Man in combat, and frequently pulls tricks such
        as leading the wall crawler into grabbing his tail in order to get a solid
        holdAmazing Spider-Man Vol 1 76 on him. The Lizard can still be reasoned with
        and, although they don''t normally belong to him, under certain conditions
        he can even show human emotions and attachementAmazing Spider-Man Annual Vol
        1 27 to certain people. Even while psychically forced into savagery, the Lizard
        was still cunning enough to hide under a car and set up a diversion to infiltrate
        a truck. Set up a several months-long plan, which almost came to fulfillment
        and involved a prolonged manipulation of Connors''s subconscious, the swaying
        of influential people under Lizard''s control and the obtainment of a relevant
        position within the Miami drug trade) }} |-|Shed= {{#tag:tabber| {{!}}-{{!}}Lizard''s
