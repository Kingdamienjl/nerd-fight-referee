    - field: weaknesses
      value: 'General= *Extreme cold weakens him considerably and can even stop him
        completely. It also forces him into hibernation, although his human half can
        occasionally intervene and nullify such weakness. *Dehydration weakens him
        terribly, and dehydrating powder even turns him back to Curtis Connors. *Severing
        a large portionWolverine: Savage Vol 1 1 of his tail compromises his balance
        and apparently even reverts the transformation. |-|Classic= *Just handling
        the Lizard serum and inhaling its fumes was enough to triggerAmazing Spider-Man
        Vol 1 44 the transformation. *Due to his metamorphosis being electro-chemical
        in nature, it can be nullified by a massive shock. *Currently bears an inhibitor
        chip on his neck that paralyzes him whenever he represents a threat to someone,
        regardless of them being friends or enemies, even if he weren''t to cause
        damage directly.Amazing Spider-Man Vol 5 21 However, he can still find ways
        to impede them. The chip allows him to attack what it doesn''t recognize as
        a living being, an example being Man-Thing''s drones.Spider-Man: Curse of
        the Man-Thing Vol 1 1 Note: *Before making any changes to this page, please
        read and follow the Power-scaling Rules for Marvel and DC Comics *Although
