    - field: intelligence
      value: "Genius Knew just by looking in Steves eyes that he was still a \"monster\"\
        , stated to be Miami's best blood spatter analyst this is further shown after\
        \ he took a brief look at the body and immediately knew he had been in the\
        \ water and that he had been killed in a separate location. Knows how to pick\
        \ locks. Knew from a single needle mark that Deveaux was injected with potassium.\
        \ Extremely skilled detective as in the span of one conversation was able\
        \ to deduce that Steve was likely keeping hundreds of people as slaves and\
        \ how he could be doing that. Despite being disoriented and injected with\
        \ potassium he was able to immediately guess where he was. Wrote a book on\
        \ forensic science which was stated to be a very thorough bookDexter Down\
        \ Under, Issue #1. Remembered the exact directions to Donovan\u2019s dumping\
        \ grounds despite it being almost impossible to seeDarkly Dreaming Dexter\
        \ Page 5. Speaks fluent Spanish, understands a little CubanDarkly Dreaming\
        \ Dexter Page 26, FrenchDexter by Design page 1, and seemingly LatinDarkly\
        \ Dreaming Dexter Page 168. any Cuban he doesn't understand or if a conversation\
        \ is moving too fast for him to hear correctly he's able to predict and deduce\
        \ whats being said based on contextDarkly Dreaming Dexter Page 27, he's also\
        \ shown to be able to predict what someone might be thinking if he knows the\
        \ person\u2019s psyche well enoughDarkly Dreaming Dexter Page 174. He implies\
        \ that his hunches are always right he just occasionally misleads law enforcement\
        \ so that he can still \u201Chave a hobby\u201DDarkly Dreaming Dexter Page\
        \ 32. Deb stated that he can usually just look at a body and immediately know\
        \ who did itDarkly Dreaming Dexter Page 45. \"Humans\" are interesting to\
        \ him and states that he\u2019s read books, implying some knowledge on psychology.\
        \ He\u2019s also well versed in what different dreams can symbolize despite\
        \ him not usually dreamingDarkly Dreaming Dexter Page 63. Later he gets frustrated\
        \ that he continues to have dreams and describes them as \"freshman psychology\"\
        . Just with a quick look he was able to deduce with their a appearance and\
        \ mood what someone had eaten for breakfastDarkly Dreaming Dexter Page 217.\
        \ He's capable of keeping a mental list of potential victims. Despite not\
        \ liking football when he was asked about the Miami Dolphins he had a ton\
        \ of pre-prepared information/remarks on the subject. Implying he does this\
        \ for most things even if he's not interested on the subjectDearly Devoted\
        \ Dexter page 106. Good at remaking artworks in his university pottery classesDexter\
        \ in the Dark page 96, seems to have some interest in art and it's historyDexter\
        \ by Design page 6 shown when he referenced Hieronymus BoschDexter by Design\
        \ page 75. Seemingly knowledgeable on human anatomy and uses that knowledge\
        \ in combat, shown when even in the heat of battle he could correctly identify\
        \ the location he stabbed a guard in was the \"solar plexus\".Dexter in the\
        \ Dark page 368. Confident that if he got arrested he could defend himself\
        \ in court unless they caught him in the act or had some other irrefutable\
        \ evidenceDexter by Design page 326. After looking at a crime scene he could\
        \ immediately tell that the blood patterns were nearly impossible to create.\
        \ Basically deducing that the crime scene was in some capacity faked.Dexter\
        \ is Delicious page 11. Dexter is able to easily see through faked facial\
        \ expressions that others are completely fooled by, he also calls them \"\
        obvious\" showing how comparatively good he is at faking emotions despite\
        \ Brian being fairly experiencedDexter is Delicious page 88. Knew just by\
        \ hearing Samantha that she had been dopedDexter is Delicious page 272."
