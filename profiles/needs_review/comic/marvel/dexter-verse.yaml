        \ beat him unconscious], [https://youtu.be/Or1EaxLRkM8?list=PLG1VQ9-iLVu_HDYxZr1LiylBpdU3_vXS9&t=381\
        \ can easily disarm opponents even if they get the drop on him]. [https://youtu.be/DjRNYV6HlRs?list=PLG1VQ9-iLVu_HDYxZr1LiylBpdU3_vXS9&t=34\
        \ Was able to quickly regain the upper hand on someone despite them being\
        \ armed with a knife and Dexter being completely unarmed]. Although caught\
        \ off guard he was able to hold his own against a hitman with hundreds of\
        \ kills and decades of experience. [https://imgur.com/hg7fAHD Fought with\
        \ and stalemated Spencer despite having lost a full litre of blood]), Weapon\
        \ Mastery (Can wield knives and larger piercing/slicing weaponry with high\
        \ skill. Knows how to shoot a rifle and has been raised to hunt since he was\
        \ little), Stealth Mastery ([https://youtu.be/MoHOlvR-19c?t=1002 Snuck into\
        \ an active crime scene swarming with cops without being spotted]. [https://youtu.be/77XsiC3NI44?list=PLG1VQ9-iLVu_HDYxZr1LiylBpdU3_vXS9&t=97\
        \ Snuck into another killers bathroom while he was in the shower, wrote something\
        \ on the mirror and left the house all without being heard or spotted], [https://youtu.be/DjRNYV6HlRs?list=PLG1VQ9-iLVu_HDYxZr1LiylBpdU3_vXS9&t=18\
        \ later hid under his plastic wrappings to get the jump on him]. [https://imgur.com/a/FYHJFmT\
        \ Broke into Tony's home and snuck up behind him], was able to do the same\
        \ thing to Mad-Dog despite him being a highly skilled hitman. Hid from two\
        \ cops under some spare trash bags, going undetected, snuck up on and injected\
        \ Harry. Stalked Levi Reed/followed him around town without being spotted\
        \ once. Tailed Captain Spencer in his large truck and somehow managed to evade\
        \ detection, in the coming episodes Dexter was able to follow him to Nicky\
        \ again while in his truck, move silently throughout the large boat without\
        \ being heard and break into Becca's house without her or Nelson noticing\
        \ and then [https://imgur.com/p7q4JCl snuck up behind Spencer and knocked\
        \ him out] without once being seen or heard by anyone), Social Influencing,\
        \ Deception - Like his future self he's fairly skilled at maintaining his\
