- id: claim-weaknesses-47200146
  section: weaknesses
  axis: weakness
  text: 'His magical powers are weakened beyond the boundaries of the Dark Dimension
    such as in the main 616 universe. Time travelling exhausts him, and he is unlikely
    to use it. He is also an incredibly vain, arrogant, and shallow egomaniac and
    megalomaniac who is prone to boasting, gloating, and histrionics rather than using
    his abilities efficiently. Feats: *Sealed Eternity. *Disintegrated Eternity''s
    substance while in his weakest incarnation (Strange Tales #146) *Sealed Zom in
    the chains of living bondage. *Summoned the great black magicians from across
    the universe. *Can merge with his selves from different timelines to amplify his
    already immense power. *Erected (another) barrier to banish all the Mindless Ones
    to a pocket of the Dark Dimension. *Can seal off portals. *Distorted the astral
    form of Dr. Strange with a gesture. *Petrified the Hulk into crystal. *Outlawed
    dreaming in all of his dimensions, where even daydreaming hurts the victim. *Forcibly
    took the Eye of Agamotto from Doctor Strange for his own use, despite the amulet
    having an infinite amount of security enchantments. *In an inferior body, he was
    able to one-shot Umar while she had the Flames of Regency, which could have prevented
    a singularity that would threaten all known universes. *Threatened to shatter
    an entire world while in the Dark Dimension, which has "worlds beyond counting".
    He may have threatened a universe in the Dark Dimension in this instance. *Threatened
    to make a world in the Dark Dimension come tumbling down about his foes, with
    Strange saying that leaving his fight with Dormammu at that moment would make
    his evil spread to worlds beyond counting. Notes: *Before making any changes to
    this page, please read and follow the Power-scaling Rules for Marvel and DC Comics.'
