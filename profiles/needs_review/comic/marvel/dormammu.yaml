    - field: attack_potency
      value: 'Low Outerverse level (Stated twice to be capable of challenging or defeating
        the entire Celestial race. Fought the Trinity of Ashes, who are equal to the
        Vishanti, and Slorioth, a pan-dimensional entity whose totality is vast beyond
        what any single dimensionality could hope to contain,Secret Defenders #25
        extending over all higher dimensions, of whichGhost Rider 2099 Vol. 1 #25
        there isChildren of the Voyager #3-4 anSecret Wars II #2 infinite number.
        Mephisto needed to be helped by Satannish, Hela, Daimon Hellstrom and Pluto
        to face Dormammu, and Nicholas Scratch also indicated that Dormammu was superior
        to Mephisto. Wounded Shuma-Gorath by blasting him in the eye,Doctor Strange
        (Vol. 1) #388; 2018 although Shuma-Gorath is still far stronger. After fusing
        with an alternate counterpart of himself, one-shot Giraud, a host to the Phoenix
        Force who wounded Eternity. Helped Eternity seal away Zom), Varies from Low
        Outerverse level (Far stronger than outside the Dark Dimension) to Outerverse
        level in the Dark Dimension (Although he was inferior, his weakest incarnation
        was able to hold his own against Eternity, with the clash threatening to destroy
        them both. Is usually far more powerful than Doctor Strange even when the
