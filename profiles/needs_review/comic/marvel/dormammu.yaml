  range:
    text: Low Outerversal, higher in the Dark Dimension
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Genius normally, Extraordinary Genius sorcerer (Despite his arrogant nature
      often hindering him, Dormammu is an incredibly skilled strategist and manipulator,
      as well as one of the greatest magicians in the Marvel multiverse. Along with
      his sister, Dormammu managed to manipulate the Dark Dimension''s king Olnar
      into making Dormammu and Umar his two advisors, and took control of the Dark
      Dimension after Olnar''s death. He managed to successfully defeat his sister
      and then trick her into banishment, and has managed to constantly thwart his
      sister''s attempts to take the throne, as well as those of other usurpers. He
      is a skilled strategist and planner, having come incredibly close to conquering
      Earth and outscheming Doctor Strange, only to be barely defeated at the last
      moment. One of his most notable feats of scheming is when he, despite having
      his body destroyed, manipulated events and caused an invasion of Earth by the
      Mindless Ones in order to trick the heroes of Earth into recreating his destroyed
      body.Amazing Spider-Man (1999) #57-#58 He has also been shown to be a competent
      leader of his armies such as in the War of the Seven Spheres. He is also a skilled
      manipulator, even managing to trick Clea by disguising himself as the Pixie
      known as Flick so that she would help weaken Umar enough for him to absorb her
      power, and take back control of the Dark Dimension. He also lured Doctor Doom
      close to him in their battle so that his demons could rip away the Eye of Agamotto
      from Doom, and knew both the only way that Doctor Doom could defeat him on his
      own and that Doom''s ego would never allow him to use that option. Dormammu
      is also a skilled martial artist, casually matching Strange and nearly overwhelming
      him in a melee fight, and only losing due to his own overconfidence. However,
      Dormammu''s greatest assets are his virtually unrivalled skills as a sorcerer,
      greatly exceeding that of Sorcerers Supreme such as the Ancient One and Doctor
      Strange in terms of raw power, and he has outmatched both of them in mystic
      battles)'
    source_ids: *id002
    confidence: 0.8
