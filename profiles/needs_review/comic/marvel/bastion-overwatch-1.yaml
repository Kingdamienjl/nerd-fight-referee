- id: claim-weaknesses-b528b65e
  section: weaknesses
  axis: weakness
  text: "*Ironclad: Passively reduces damage taken while transformed. *Self-Repair:\
    \ Bastion is able to conduct repairs on itself when necessary, welding its parts\
    \ back together to get itself back into fighting form. However, these repairs\
    \ take a few seconds at the least, during which time Bastion is completely unable\
    \ to use any of its weapons. *Reconfiguration: Bastion transforms between its\
    \ two primary combat modes to adapt to battlefield conditions. **Configuration:\
    \ Recon: Bastion's default form, allowing it to walk around and scout for good\
    \ positions to enter its Sentry configuration. In Recon mode, Bastion is fully\
    \ mobile, outfitted with a submachine gun that fires steady bursts of bullets\
    \ at medium range. **Configuration: Sentry: Bastion converts itself into an automated\
    \ Gatling gun capable of unleashing a hail of bullets. The gun's aim can be \"\
    walked\" across multiple targets, dealing devastating damage at short to medium\
    \ range. However, due to the rate of fire and the nature of this weapon, it is\
    \ far less effective at long range. In addition, this weapon has a long-reload\
    \ time due to the sheer number of bullets being fired. **Configuration: Tank:\
    \ Bastion converts itself into a mobile tank that can move at speeds exceeding\
    \ its Recon form. The cannon\u2019s explosive shells demolish targets in a wide\
    \ blast radius, but due to the high amount of power this form uses Bastion can\
    \ only remain in this mode for a limited time. |-"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-df9a393a
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Inorganic Physiology (Type 2, possibly
    Type 1, via being a robot and likely connected in some way to the Iris) Bodily
    Weaponry (Built-in submachine-gun, minigun, and tank cannon), Information Analysis
