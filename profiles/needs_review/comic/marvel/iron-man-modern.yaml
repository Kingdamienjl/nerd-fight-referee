    - field: weaknesses
      value: 'Without his armor he is just a normal human. Notable Attacks/Techniques:
        R.T. node: Thanks to the Repulsor Tech node implanted in his chest, which
        is linked to his brain, Tony is able to interact with different types of energies
        and forces a normal human cannot. The R.T. node acts like a new sense for
        its user. The reactor''s excessive generation of energy provides Stark with
        an increased amount of intelligence and gave him superhuman-level multitasking
        and learning capabilities. It enhances the metabolism, core strength, reaction
        time, reflexes and intelligence up to 25-30 IQ points. Nick Fury''s Intel
        classified him as power level 9. * Energy Emanation: The R.T. node not only
        provides repulsor energy to run devices such as the Iron Man Armor, its user
        can produce beams of energy at will, possibly weaker and less directed than
        the Uni-Beam. * Electrical Fields Detection: As the R.T. node is connected
        to Tony, he can feel different electrical fields that the Reactor is picking
        up. This includes all kinds of invisible frequencies. * Magnetic Force-Field:
        The R.T. node creates a force-field which can be modified at will by its user
        by increasing the power of the Reactor incrementally. It can be so powerful
        to destroy bullets or repel people. It can be so powerful to surpass an electromagnetic
        field generated by Electro. * Levitation: The magnetic force-field generated
        by the Reactor can interfere the ones created by the planet and levitate.
        It''s unknown if this interaction can be used to fly. Psychic Shield: Due
        to S.H.I.E.L.D treatments, Stark''s mind is shielded from even the strongest
        telepaths alive. Crystallized Iron Armor: His armor has evolved from a bulky
        iron suit to a highly complex matrix of molecularly-aligned fully crystallized
        ultra high carbon iron/steel hybrid alloy enhanced by magnetic fields over
        layers of other ultra hyper alloys like titanium alloy and or tungsten/vanadium
        alloys reinforced with carbon nanotubes creating a shell that is pliable,
        yet capable of amazingly high resilience and protection. Energy Shield: Energy
        shielding that can protect the user from harm. It is also capable of reflecting
        attacks and staying mobile. At 2% power, the shield is strong enough to withstand
        a nuclear explosion. It is even capable of protecting its user at the point
        blank of a nuclear explosion caused by a material even more radioactive than
        Uranium, Phlogistone. The suit''s shielding is even capable of resisting a
        force blast from the Spectral Mandarin Ring, a beam of energy so powerful
        it can destroy the bonds between atoms and molecules, and magic. Energy Conversion
        Power Recharge: The armor is also able to absorb and convert nearby or far
        away energy sources, such as heat, solar, electrical, magnetic, geothermal
        or kinetic energy or energy from the planet itself into electricity, or even
        drain energy directly into the batteries for recharge and can also be used
        for strength augmentation. Repulsor Rays: The armor''s primary energy weapon.
        A particle beam weapon, standard equipment in the palm gauntlets; can repel
        physical and energy-based attacks, traveling as a single stream or as a wide-field
        dispersal. Beams possess penetrative strength ranging from effortlessly punching
        through 2 inches of steel to blasting a hole through a mountain. Power output
        can be adjusted for a larger beam or an omnidirectional, full-form repulsor
        blast. Power output can be adjusted to fire beams generating 2 gigawatts (like
        the Mark 3) to the beams in the high petawatt region, as seen with the Mark
        27 (with assistance from outside sources). The latest version, the Mark IVa,
        was introduced with the Iron Man Armor Model 41, featuring a red color. *
        Multi-Vibrational Repulsor Rays: A modified version of the Repulsor Ray for
        the Model 51, capable of damaging beings that can become intangible or use
        phasing. Unibeam: A powerful searchlight, capable of projecting beams in virtually
        every light spectrum. Also used as a powerful weapon that can destroy anything
        in its path. It fires a boosted form of the Monobeam with some energy backing
        it up. * Tri-beam: This unique version of the Unibeam runs on direct power
        from the chest plate, draining it''s energy rapidly if not fully charged;
        causes considerable recoil. * Multibeam: As the name implies, the Multi-beam
        can fire multiple energies at the same time. Generally used with the energy
        that Tony Stark has absorbed. * Pentabeam: The Pentabeam has microwave lensing
        projector that allows for directed beams of ultra-high multi mega-joule electrons,
        protons, acoustic energy, and neutrons. * Omnibeam: Rather than only firing
        beam type attacks, the Omnibeam can generate heats at 25,232 degrees Fahrenheit,
        extremely powerful lights causing irreversible blindness in the enemy, and
        emit ultrasonic attacks capable of stunning even superhumanly durable foes
        and even causing disintegration. The other way the Omnibeam is fired is by
        absorbing or draining any energy in Iron Man''s vicinity, drawing'
