  intelligence:
    text: 'At least Extraordinary Genius, likely Supergenius (He is only a fraction
      less smart than Reed Richards, and his technology is nearly a worthy match for
      Asgardian wizardry. Created various armors that operate on a higher or beyond-dimensional
      scale, like models 22, 38, 61, 63, and 72, the first of which is powered by
      the same enchantment that gives mjolnir its strength, which Thor described as
      taking and weaponizing a gift of the gods. He and his team made a virtual universe
      in which one could do anything, go anywhere and be anyone. He reverse-engineered
      a celestial to make Model 72. Aside from his powers granted to him by his suits,
      Tony Stark is easily one of the smartest people on Earth. Being a engineer and
      mechanic prodigy capable of fixing almost any machinery, he graduated from the
      Massachusetts Institute of Technology with honors at the age of 17. He''s designed
      and built all of the devices and armors listed here and as a futurist, he has
      shown to predict certain events in the future.Illuminati Vol 1 Stark is also
      a world-renowned businessman with impeccable business ethics, able to command
      people''s attentions when he speaks on economic matters and is a brilliant tactician
      and strategist capable of quickly formulating battle strategies and new plans
      if the situation changes, even going as far as putting Reed Richards in check
      on five different boards in chess, a game he didn''t learn until later in his
      life. Besides English, Tony can speak different languages fluently such as Japanese,
      Mandarin Chinese, French, Russian, Korean, and even multiple Middle Eastern
      languages and is a quite physically formidable combatant on his own when the
      situation demands it, managing to fight Hammer Industries guards and bare-handedly
      confront several ninjas) | At least Extraordinary Genius with the Extremis enhancements
      that allow him to process information at a much faster rate. Feats: Base: *Beats
      up several skrulls in hand to hand.Illuminati Vol 2 #1 *Easily flips over a
      guy with a laser via Caps moves. *Takes out several gladiators in hand to hand.
      *Can fight Crimson Dynamo, take a conference, checks over the laboratories and
      bids on a relic simultaneously.Iron Man Vol 4 #7 *Temporary held his own against
      Madame Hydra.Iron Man: Director of S.H.I.E.L.D. *Can even hack advanced technology
      with simple tools while being mentally unstable. As Cosmic Iron Man: *Blew a
      hole through Korvac with his unibeam, temporarily incapacitating him. *Was fine
      after Korvac threw a planet at him. *Was so powerful that Hellcat called for
      Doctor Doom and the Silver Surfer to help stop him. *One-shotted Doctor Doom.
      *Destroyed several planets and extinguished a star during his fight with Korvac.'
    source_ids:
    - vsbattles-iron-man-modern-marvel-comics
    confidence: 0.6
