- id: claim-weaknesses-220fc50f
  section: weaknesses
  axis: weakness
  text: 'Projecting EMPs drains the armor''s own power, causing the usage of this
    ability to be limited. Feats: *Casually lifts and smashes two tanks together.
    *Dodges a volley of metal-cutting laser fire. *Can tear rock from a mountain cliffside
    as if it were paper. *Tears apart a mobile tank-craft with bare hands.Iron Man
    #258.2 *Dispels Doctor Doom''s encephalographic loop, which incapacitated Phoenix
    Rachel Grey.Excalibur #38 *Can easily break out of tech foam which can harden
    to the strength of titanium steel. *Survives an energy wave that destroys the
    West Coast of the United States.Infinity Gauntlet #2 Note: Before making any changes
    to this page, please read and follow the Power-scaling Rules for Marvel and DC
    Comics.'
