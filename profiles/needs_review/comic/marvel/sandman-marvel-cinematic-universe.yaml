    - field: intelligence
      value: Above Average, possibly Gifted (Sandman is often mistaken for an idiot
        by both allies and foes, mostly because of his harsh and hot-heated attitude,
        but he has demonstrated many times to be much more than just brawn. He is
        a seasoned individual, with many years of experience in either committing
        or fighting crime. Sandman has been part of many groups and their different
        iterations, most notably the Frightfoul Four, the Sinister Six, the Wild Pack,
        the Avengers and more, with his valor being recognized by the likes of the
        Wizard, Silver Sable and Captain America. In his life he clashed with a great
        variety of metahumans, each with their own special abilities. Sandman knows
        dozens of creative ways to employ his powers, and has stated from time to
        time to having learned new tricks and applications, as well as having overcomed
        some of his weaknesses. In just a few minutes, he figured out he could transfer
        control of sand to others, while his alternate self took decades to learn
        it. Fought evenly with Spider-Man many times, and in a couple of occasions
        he managed to outsmart both Mister Fantastic and the Human Torch. Received
        science lessonsFantastic Four Vol 1 61 from the Wizard, which allowed him
        to design his new costume. DisassembledAvengers Vol 1 333 a Doombot in moments,
        immediately understanding its structure. Knows how to driveMarvel Team-Up
        Vol 2 3 a jet plane. Was assigned to the trainingAmazing Spider-Man Vol 1
        407 of the recruits of the Wild Pack, and personally trainedAmazing Spider-Man
        Vol 1 676 the Rhino. Can manipulate his sand with enough precision to interfere
        with the functioning of technological devices, achieving feats such as smotheringFantastic
        Four Vol 1 41 Trapster's vibro-shock pulsator, defusing a bomb,Solo Avengers
        Vol 1 7 and causing a robot to self-destructThe Amazing Spider-Man Vol 1 303)
      source_id: vsbattles-sandman-marvel-cinematic-universe-earth-616
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Several of the following weaknesses are exploited multiple times across
        Sandman''s publication history, most notably his vulnerability to water and
        high temperatures. However, for the sake of practicality, this list features
        only a few showings that illustrate each weakness. *Needs to actively turn
        his body to sand or soften it up if hardened, leaving him vulnerable to surprise
        attacks and faster opponents. *Sudden shocks will momentarily shatter him
        into countless grains,Amazing Spider-Man Vol 1 4 and even hits deliveredAmazing
        Spider-Man Vol 1 215 by opponents stronger than him. *Could be apparently
        be trapped inside vacuum cleanersStrange Tales Vol 1 115, although Spider-Man
        states that such trick wouldn''t workMarvel Team-Up Vol 2 3 anymore, and Sandman
        himself later reveals that it was all a ployFriendly Neighborhood Spider-Man
        Annual Vol 1 1 set up to sneak into prison unnoticed. *Particularly strong
        attacks, such as the Hulk and Namor''s, can still cause him to feel pain even
        when solidified. *Can be knocked outAmazing Spider-Man Annual Vol 1 37 if
        hit in sensible spots while solid. *Large amounts of water turn his body,
        into mud disabling his ability to alter his particles willingly. *Still needs
        to breathe like a normal human. *Extremely high temperatures turn him into
        glassAmazing Spider-Man Vol 1 338 or crystalFantastic Four Annual Vol 1 14,
        making him vulnerable to being shattered. *Having his sand mixed with cement
        incapacitates him. *Needs a certain degree of concentration to keep his body
        intact. *Wind tunnelsAmazing Spider-Man Vol 1 281 make it impossible for him
        to reform himself, as long as they last. *Can be caughtUntold Tales of Spider-Man
        Vol 1 3 by turbines. *Hydrofluoric acid can melt his individual granules,
        but not really kill him, unless it totally eats away the one grain that holds
        his intellect.Amazing Spider-Man Vol 1 685 *Sandman is occasionally depicted
        as needing all of his sand mass, or even every single single molecule at times,
        in order to pull himself together, remain sane and ultimately not diePeter
        Parker: Spider-Man Vol 1 16Amazing Spider-Man Vol 2 17Peter Parker: Spider-Man
        Vol 1 22, but such notion has been contradicted more times than not. For example,
        he has left his sand behind without any downside, purposedly chopped awaySilver
        Sable and the Wild Pack Vol 1 56 pieces of himself and absorbed new sand to
        replace lost mass. Spider-Man also states that Sandman always gains and loses
        sand. *His clones are prone to turning on each other, because of their different
        personalities and motives. This might be the reason why he stopped using them.
        *Can be incapacitated by isolating the one grainAmazing Spider-Man Vol 1 684
        that contains his brain waves. Sun Girl apparently incapacitated him by blasting
        the grainSuperior Spider-Man Team-Up Vol 1 7 with a light ray. Note: *Before
        making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics *For more details and further applications
        of Sandman''s powers, it is suggested to visit this blog. *The events narrated
        in the 15 minutes of shame storyline, as well the new powers displayed by
        Sandman''s alterate state, are the result of a specific weakness that is totally
        unsupported and contradicted in most of Sandman''s other appearances (check
        the "Weaknesses" section for further details). This means that such storyline
        doesn''t represent the primary depiction of Sandman, nor the most consistent,
        and because of this its content isn''t featured in this profile. ==Notable
