- id: claim-weaknesses-9176b9c3
  section: weaknesses
  axis: weakness
  text: Interfering with the natural end of the Universe serves as a huge threat to
    her ambitions. She seems to be incapable of dimensional travel without her ship.
    She's far less proficient at using her destructive power against mortals than
    other cosmic beings, analogized by Reed as a person being able to sanitize swaths
    of germs, but not destroy micro-organisms by hand. As a purely destructive entity,
    she can't repair or maintain advanced technology, though she can use it.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-4c17ac85
  section: abilities
  axis: hax
  text: 'Immortality (Type 1, 3, 5, 7, 8, 9; she is non-ephemeral, embodying everything
    that ever was and was ever meant to be, and exists as an unkillable concept. Holds
    the same nature as Eternity, who inhabits a "timeless subcosmos"Strange Tales
    Vol. 1 #146 described as existing beyond life and death.What If? Vol. 1 #18 Due
    to the nature of Manifestation Bodies as simple visualizations brought into being
    by the perceptions of lesser entities, they cannot truly be harmed, as fighting
    them is tantamount to doing battle with one''s own thoughts, and any damage seemingly
    inflicted on them can be instantly reversed as if it never happened.Guardians
    of the Galaxy Vol. 1 #47 The realm from which her and her endlings came from is
    described as being dead in nature despite them both emerging from it, and the
    realm of the Endlings is literally referred to as the Dead Realm by MantorScarlet
    Witch (2024) #1), Incorporeality (The M-Bodies of the Abstracts reside above the
    physical universe, and are stated to be "too abstract to fight in anything remotely
    resembling a physical manner"Quasar Vol. 1 #25), Omnipresence, Reality Warping
    & Spatial Manipulation (Stated to have unimaginable powers that can alter and
    destroy space and reality), Beyond-Dimensional Existence (Type 2. Born beyond
    time and space, making her immune to Scarlet Witch''s temporal spells), Master
    Sorceress (Provided the Wizard with sorcery beyond the scope of most earthbound
    warlocksScarlet Witch & Quicksilver #3), Clairvoyance and Nigh-Omniscience (Can
    gaze upon all of time and space, holding of the same perceptions that her counterpart
    Eternity does), Dream Manipulation, Soul Manipulation, Conceptual Manipulation
    (Type 1), Madness Manipulation (Type 2), Creation, Acausality (Type 4 - Time.
    Should be of the same nature as her Endlings, who are unbounded by time and thus
    unaffected by alterations to their subjective time such as it coming to a complete
    stop), and all powers possessed by Eternity, Abstract Existence (Types 1 & 2;
    She''s an embodiment of the universe and a concept manifesting itself as an entity.
    At the same time, abstracts and their realms are avatars. They are symbolic structures
    created when the universe simplifies itself, giving itself meaning and structure,
    and everything in their realms is purely symbolic/conceptual, including the Abstracts
    themselves.Guardians of the Galaxy Vol. 2 #11, March 2009 She is non-ephemeral,
    embodying everything that ever was and was ever meant to be, and exists as an
    unkillable concept. Should be of a similar nature as Death as well as Lord Chaos
    and Master Order), Existence Erasure, Soul Erasure, & Type 4 Immortality Negation
    (Word of God confirmed that her blasts "end" her targets and erase them from existence
    entirely, to the point where they don''t even go to another plane after they die,
    which is supported by both the Never Queen and the Griever herself stating that
    the Scarlet Witch was "undone" by the blast), Deconstruction (Casually dissolved
    Darcy Lewis''s Hellfire BazookaScarlet Witch #3; 2024), Technology Manipulation,
