  attack_potency:
    text: 'Varies (Since Manifestation Bodies are powered by an exchange of energies
      with the Abstracts, how powerful they are can be adjusted as needed, with them
      being able to be made weaker than even an incomplete Cosmic Cube such as The
      Beyonder, who is otherwise insignificant to the higher members of the Cosmic
      HierarchyFantastic Four Annual (Vol. 1) #23; 1990) up to Outerverse level (Could
      thrash and one-shot an off-guard Molecule Man and weakened but powerful Franklin
      Richards around numerous times.Fantastic Four (Vol. 6) #27; 2020 Her manifestation
      is a conceptual being and living embodiment of the universe''s destruction,
      no different in nature from the other manifested abstract entities.) | Outerverse
      level (All of the Abstracts are immensely above their Manifestation Bodies,
      which are each simply infinitesimal parts of themselvesDoctor Strange, Sorcerer
      Supreme. #54 and "visualizations"Adam Warlock and the Infinity Watch, #1 or
      "dim shadowy reflections"Fantastic Four Annual #23 of their totality created
      by the limited perceptions and imaginations of lesser beings,Guardians of the
      Galaxy Vol. 1 #47 while their true states are entities with no physical attributes
      whatsoever, with the shape and size of their manifested bodies being insignificant
      to themDoctor Strange Vol. 2 #4) | Outerverse level (She exists beside Eternity
      and The Queen of Nevers as one of the "three faces of existence,"Fantastic Four
      (Vol. 6) #44; 2022 being an inalienable aspect of reality who embodies the essence
      of finality,Fantastic Four (Vol. 6) #28; 2021 as well as destruction, entropy
      and heat death, and the concept of how everything ends, and her role is to witness
      the end of Eternity as the last being standing in all of existence. Her domain
      and the void she represents isScarlet Witch & Quicksilver (Vol. 1) #4; 2024
      the Far Shore itself. Along with Eternity and The Never Queen, she is naturally
      one of the few beings who can manifest in Overspace: the domain of the abstracts
      and a metaphysical plane of existenceFantastic Four: Reckoning War Alpha (Vol.
      1) #1; 2022 transcendent of the Macroverse and all realities,Mighty Avengers
      (Vol. 1) #30; 2009 with the Macroverse comprising an infinite hierarchy of qualitatively
      higher planesSilver Surfer (Vol. 3) #141; 1998 which make up nearly all levels
      of the Omniverse)'
