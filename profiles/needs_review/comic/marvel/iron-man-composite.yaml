    - field: standard_equipment
      value: '*Iron Man Armor: Tony''s primary powers mostly come from his iron man
        armors, sophisticated suits containing various offensive, defensive and evasive
        abilities. Some are mission-specific, some are prototypes for testing, and
        others are older models kept for nostalgia or for research. *Extremis virus:
        After being fatally wounded by an Extremis-enhanced terrorist, Tony Stark
        had to inject himself with the Extremis virus in order to survive. His entire
        body has also been enhanced by the techno-organic Extremis virus which granted
        him enhanced senses, reflexes, and regenerative healing. He also reprogrammed
        the serum to help him have better, fourth connection and control over his
        Iron Man armor, effectively making him Iron Man "inside and out.Iron Man Vol
        4 #4 *RepulsorTech Node: Also known as R.T node is a type of fusion power
        which derived from the repulsor technology of the Iron Man suit created by
        Tony. It can be used as a source for clean energy as well as a powerful bomb.
        After being left in a coma in a battle against Norman Osborn, an arc reactor
        was used to run Stark''s body once more by using it to run the basic machine
        codes to keep Stark''s Extremis-modified body working, also providing Stark
        with an increased intelligence, multitasking abilities and additional powers.Iron
        Man Vol 5 #25'
      source_id: vsbattles-iron-man-composite-marvel
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'At least Extraordinary Genius, likely Supergenius (He is only a fraction
        less smart than Reed Richards, and his technology is nearly a worthy match
        for Asgardian wizardry. Created various armors that operate on a higher or
        beyond-dimensional scale, like models 22, 38, 61, 63, and 72, the first of
        which is powered by the same enchantment that gives mjolnir its strength,
        which Thor described as taking and weaponizing a gift of the gods. He and
        his team made a virtual universe in which one could do anything, go anywhere
        and be anyone. He reverse-engineered a celestial to make Model 72. Aside from
        his powers granted to him by his suits, Tony Stark is easily one of the smartest
        people on Earth. Being a engineer and mechanic prodigy capable of fixing almost
        any machinery, he graduated from the Massachusetts Institute of Technology
        with honors at the age of 17. He''s designed and built all of the devices
        and armors listed here and as a futurist, he has shown to predict certain
        events in the future.Illuminati Vol 1 Stark is also a world-renowned businessman
        with impeccable business ethics, able to command people''s attentions when
        he speaks on economic matters and is a brilliant tactician and strategist
        capable of quickly formulating battle strategies and new plans if the situation
        changes, even going as far as putting Reed Richards in check on five different
        boards in chess, a game he didn''t learn until later in his life. Besides
        English, Tony can speak different languages fluently such as Japanese, Mandarin
        Chinese, French, Russian, Korean, and even multiple Middle Eastern languages
        and is a quite physically formidable combatant on his own when the situation
        demands it, managing to fight Hammer Industries guards and bare-handedly confront
        several ninjas) | At least Extraordinary Genius with the Extremis enhancements
        that allow him to process information at a much faster rate. Feats: Base:
        *Beats up several skrulls in hand to hand.Illuminati Vol 2 #1 *Easily flips
        over a guy with a laser via Caps moves. *Takes out several gladiators in hand
        to hand. *Can fight Crimson Dynamo, take a conference, checks over the laboratories
        and bids on a relic simultaneously.Iron Man Vol 4 #7 *Temporary held his own
        against Madame Hydra.Iron Man: Director of S.H.I.E.L.D. *Can even hack advanced
        technology with simple tools while being mentally unstable. As Cosmic Iron
        Man: *Blew a hole through Korvac with his unibeam, temporarily incapacitating
        him. *Was fine after Korvac threw a planet at him. *Was so powerful that Hellcat
        called for Doctor Doom and the Silver Surfer to help stop him. *One-shotted
        Doctor Doom. *Destroyed several planets and extinguished a star during his
        fight with Korvac.'
      source_id: vsbattles-iron-man-composite-marvel
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Without his armor, Extremis or the R.T Node, he is just a normal human
        being. He holds back against opponents he finds harmless or personally refuses
        to kill. Even though he quit drinking, Tony continues to struggle and avoid
        falling off the wagon, making his alcoholism susceptible to the prospect of
        drinking, especially under pressure. | Due to Extremis being biologically
        attached to his body he is directly vulnerable to technological assaults,
        the virus also accelerates some of his brain functions while leaving others
        at normal levels, making him suffer from things like hallucinations. He is
        highly dependent on the R.T Node to keep his Extremis-modified body working
        should he lose Extremis. | Varies from armor to armor. | None Notable. Notable
        Attacks/Techniques: By himself: *Iron Legion: Also known as Royalguard, an
        army of several Iron Man Armors are summoned and commanded from his armory,
        those can be controlled remotely or automatically by his I.As. The legions
        includes both known and unknown models and marks. Stark mainly calls them
        to battle several foes at time or one large and strong enemy. Extremis Enhanced:
        *Technology Interference: Via Extremis, Stark can remotely access to external
        communications systems such as satellites, cellular phones, and computers
        throughout the world. H was could project his voice through a cellular phones
        for example. He can crack codes entire nations couldn''tIron Man: Inevitable
        #6 , and take over Cloc which was a fabrication of Reed RichardsIron Man Vol
        4 #11 *Armor Undersheath: The nanoparticles inside the hollow of his bones
        can form a gold outershell that has the primary functions to manipulate the
        extremis armor, it also works as a shield of sorts RepulsorTech Node: *Energy
        Projection: The R.T. node not only provided repulsor energy to run devices
        such as the Iron Man Armor, its user could produce beams of energy at will,
        albeit much weaker.Iron Man Vol 5 #521 *Electrical Fields Detection: As the
        R.T. node was connected to Tony, he could feel different electrical fields
        that the node was picking up. This included all kinds of invisible frequencies.Iron
        Man Vol 5 #4 *Magnetic Force-Field: The R.T. node created a force-field which
        could be modified at will by its user by increasing the power of the reactor
