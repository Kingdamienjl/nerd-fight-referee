    own ends. After switching bodies with Damocles Rivas, M.O.D.O.K. impersonated
    him so convincely that the ruse has not been discovered until the very last moment.
    Deceived his minions and a number of other parties during the Modok''s 11 arc)
    *Large Size (Type 0; Occasionally portrayed as extremely big or even the size
    of large vehicles and small rooms) *Vehicular Mastery (Pilots his Doomsday Chair
    as if it was part of his own body. Has piloted the two models of his mechanical
