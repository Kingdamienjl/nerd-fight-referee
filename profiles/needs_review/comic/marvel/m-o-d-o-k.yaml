    Prediction (Can perform precise calculations of probability. Staged and accomplished
    a long and complex plan involving a heist on a race of super-advanced aliens and
    the anticipation of several, different double-crossings from his minions and their
    second parties in spite of countless odds. To achieve his ends, he also had to
    precisely calculate the arrival of the time-traveling beacon of the Infinicides
    and the exact time their temporal bottle would take to decay) **Information Analysis
    (Grasped the complex electronic structure of an android replica of Iron Man within
    seconds. Quickly analyzed the effects of energy flares on the A.I.M. adaptoids.
    Seemingly understood Deadpool''s cellular structure by simply gazing at him.Cable
    & Deadpool Vol 1 11 Scanned the entirety of the Infinicide''s beacon from afar
    and developed a nigh-perfect simulation of their defense system) **Social Influencing
