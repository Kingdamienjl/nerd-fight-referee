  attack_potency:
    text: 'Street level physically (HIs Lifting Strength alone warrants such a level.
      However, he is almost completely helpless without the aid of machinery designed
      to help him sustain his own body), Wall level to Small Building level with the
      Doomsday Chair (Casually rams through walls. Its energy guns can turn people
      into skeletons, which requires such levels of force), Planet level via Energy
      Projection (Matched Doctor Doom''s attacks. Knocked out Namor and then caused
      him great pain. Even when holding back, he could still severely hurt and almost
      killMs. Marvel Vol 1 7 Captain Marvel. Defeated The Thing, Captain America and
      The Falcon with a single blast.Fantastic Four: World''s Greatest Comic Magazine
      Vol 1 4 Incapacitated She-Hulk and Red She-Hulk withIncredible Hulk Vol 1 600
      a few blasts.Hulk Vol 2 19 By exerting his power to the max, M.O.D.O.K. managed
      to knock down Red Hulk three times and deal visible damage, although the self-destructive
      strain required made such a level of power impossible to sustain)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Below Average Human by himself (M.O.D.O.K.'s misshapen physique renders
      him almost incapable to move on his own and limits his movements to strenuous
      crawling), Transonic with the Doomsday Chair (Swift enough to best Captain America's
      agility. Is equipped with jets and can fly at high speed), at least Hypersonic
      Reactions, Perceptions and Energy Projection (His mind beam was too fast for
      Captain America to dodge and could intercept his shield in mid-flight on two
