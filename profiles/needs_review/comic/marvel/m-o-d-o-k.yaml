        overthrown his rule or formed splinter cells. Nonetheless, M.O.D.O.K. has
        recurrently been able to secure his position back and maintain a firm hold
        on a relevant portion of A.I.M.. Upon being introducted within the ranks of
        the original Intelligencia, M.O.D.O.K. seamlessly became the de facto leader
        of the alliance alongside the Leader, with whom set up the various events
