  intelligence:
    text: Extraordinary Genius George Tarleton has been subjected an experiment meant
      to transform him into the the greatest mind on Earth,Captain America Vol 1 133
      to the point that he was compared to a living computer. His brain has undergone
      a billion years of accelerated evolution and became on par with the Infinicide,
      a race from five billion years in the future. M.O.D.O.K. can plan and compute
      faster than any machine and is capable of millions of complex calculations per
      millisecond.Captain America and the Falcon Vol 1 9 He needs constant feeding
      of information in order to not fall prey of terrible boredom. His mind grasps
      in seconds what an ordinary man would instead require years to understand. He
      alone can output half the processing necessary to run the Intelligencia's Temporal
      Shifter, which previously required the combined cerebral networks of the Leader,
      the Red Ghost, the Wizard, the Mad Thinker and Egghead. Right after becoming
      M.O.D.O.K., he swiftly replaced the former Scientist Supreme and became one
      of the most prominent and long-lasting leaders of A.I.M., thus the primary director
      and schemer of all their nefarious operations. Although his leadership has been
      faulty, as overtime many exponents of A.I.M. have overthrown his rule or formed
      splinter cells. Nonetheless, M.O.D.O.K. has recurrently been able to secure
      his position back and maintain a firm hold on a relevant portion of A.I.M..
      Upon being introducted within the ranks of the original Intelligencia, M.O.D.O.K.
      seamlessly became the de facto leader of the alliance alongside the Leader,
      with whom set up the various events which took place during the Fall of the
      Hulks storyline and the following ones. Even Doctor Doom recognized M.O.D.O.K.
      as a brilliant foe and one of the finest minds.Sub-Mariner Vol 1 47 Easily discovered
      and penetrated a secret military base. Formulated and executed a intricated
      plan involving various high-profile parties, anticipating a double-crossing
      on their hand and leading to critical situation which even the Avengers barely
      foiled at the very last minute.Captain America and the Falcon Vol 1 1 to 12
      Orchestrated with uncanny precision the events which took place during the MODOK's
      11 storyline, predicting five different double-crossings, the intrusion of three
      infiltrators unrelated to each other and the moves of every single party involved,
      juxtaposing another plan to the already-established heist and ultimately emerging
      victorious.Super-Villain Team-Up/MODOK's 11 Vol 1 1 to 5 As the most brilliant
      mind of the whole cabal of scientists which is A.I.M., M.O.D.O.K. is the greatest
      creative force behind the countless extraordinary inventions which the group
      has produced over the course of his leadership. Although the support of his
      accolites is fundamental to his ends, many of such wonders have specifically
      been created by him. *ConceivedCaptain America Vol 1 117 the original Cosmic
      Cube, a feat that only a scientific geniusFantastic Four Vol 1 319 can achieve.
      *Created an Alteration Chamber capable of turning a normal man into a superpowered
      cyborg in seconds, altering their physical appearance completely and granting
      them a handful of superpowers created by M.O.D.O.K. himself. This process comes
      with a subcutaneous micro-wave energizer which powers the cyborg and makes them
      obedient to M.O.D.O.K.Captain America Vol 1 124 *Redesigned the aforementioned
