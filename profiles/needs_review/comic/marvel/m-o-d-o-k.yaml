- id: claim-weaknesses-f8973739
  section: weaknesses
  axis: weakness
  text: 'M.O.D.O.K. is almost helpless when removed from his Doomsday Chair, for his
    disproportioned body is unable to sustain itself, rendering him just barely able
    to crawl when deprived of external support. Although he can still utilize his
    mental powers, their potency is heavily impaired as a result of the overall strain.
    A-Bomb seemingly implies that M.O.D.O.K. requires his head gear in order to project
    his brain blasts.Fall of the Hulks: Red Hulk Vol 1 1 His body wears its own organs
    out an deadly fast rate, reason why he requires routine transplants harvested
    from clones of himself specifically produced for this purpose. Exerting excessively
    high levels of power damages his own body, an example being the time he sacrificed
    some glands and nerves when venting his rage on Red Hulk. M.O.D.O.K.''s hubris,
    overconfidence and short-sightedness have often led his plans to failure. Notes:
    *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. *Do not confuse this version of M.O.D.O.K. with
    his clone and successor, M.O.D.O.K. Superior. *M.O.D.O.K.''s appearance in Iron
    Man Vol 1 205 is not featured in this profile, for he was artificially improved
    upon and controlled by Yorgon Tykkio and was ultimately destroyed at the end of
    the issue. It is unknown whether M.O.D.O.K. maintained such improvements after
    his resurrection.'
