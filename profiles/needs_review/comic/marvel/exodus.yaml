    - field: weaknesses
      value: 'Acquired her power at 13 years old, and should she die prior to that
        point in time, she won''t resurrectInferno (2021) #1. Moira''s existence requires
        a "container" for her power to function, and won''t work if the universe is
        destroyedCEREBRO #101. After staying at Krakoa''s No-Place, she got Stage
        4 cancer. | None notable. | None notable. Notable Attacks/Techniques: *Reincarnation:
        Moira can reincarnate upon death, being reborn in utero with full awareness
        of her prior existence, while triggering the destruction of the timeline she
        died in. Additionally, her power has a defensive mechanism: her mutant status
        is invisible to other mutants and mutant detection devices. ==Notes/Explanations==
        {| class="mw-collapsible mw-collapsed" align="center" border="1" cellpadding="1"
        cellspacing="1" style="width:100%" | colspan="2" style="text-align: center;
        background-color: #AD6F28; color: #28AD33" |Notes/Explanations |- | *Before
        making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. *Despite being stated to reset timelines with
        her power, this isn''t actually the case. During Sins of Sinister event (Moira
        VII.1), Sinister-corrupted mutants destroyedSins of Sinister AsgardNightcrawlers
        #2, joined Infernal Parliament and turned the Waiting Room into Hell. Exodus,
        bloated with belief by trillions, created a hell for Mister Sinister, which
        shouldn''t be too dissimilar from other mystical pan-dimensional realities,
        infinitely transcendent of the universe. Even Mother Righteous'' sanctumSins
        of Sinister Dominion wasn''t preserved, with it existing in theX-Men: Before
        the Fall Sons of X Astral Plane. To affect and erase all of the above one
        would need to affect the entirety of Earth-616. Additionally, Mister Sinister
        implied that using the Moira Engine wouldImmortal X-Men #9 fully affect even
        the Progenitor, despite Celestials operating on a higher plane of existence.
        **Lastly, Jonathan Hickman himself confirmed that her power specifically rewinds
        Earth-616. **Additionally, despite Destiny claiming that Moira is limited
        to 10 lifetimes, that was caused by what she saw in the future, and wasn''t
        an actual weakness on her power. Mister Sinister too claimed that 10 lifetimes
        is a limit of what he himself can do as opposed to a hard limit. Moira''s
        own plan after being depowered was to repower herself, implying that there
        is no hard limit. *Due to House of X retconning Moira into being a mutant,
        we ultimately have no idea whether she was actually affected by Legacy Virus
        or it was the Shi''ar golem she used to fake her death . That, and the fact
        that she wasn''t affected by her own Retribution Virus, despite being in proximity
        with it more than anyone else, leads one to believe that her mutant gift would
        also hide her from mutant-targeting viruses. *When Moira becomes part of the
        Enigma, she technically becomes High 1-A entity, due to being a part of one.
        However, she lacks the autonomy to act in any way of the scale on either Dominions
        or Titans, and can''t benefit from said tier in any way. Therefore this profile
        treats her part of Enigma key to be the same as her robot self, with appropriate
        additions, without considering her newfound physical statistics. *Due to how
        wielders of sharp adamantium weaponry have consistently been depicted as capable
        of harming characters far above their tiers, we are forced to list separate
        ratings for them to accommodate this. We are well aware that this technically
        does not make sense, but it is likely the least bad available option to not
        ignore this ongoing plot convention. Please note that this does not remotely
        scale to their base statistics/raw energy outputs. |} ==Gallery== Moira vision
