    - field: standard_equipment
      value: 'A suit of Vibranium-coated armor, including retractable claws made out
        of Antarctic Vibranium (anti-metal), which are capable of dissolving any other
        metal on contact, even Adamantium, Vibranium Energy Daggers, which can become
        intangible, negate durability, and can be set to shock mode. Flash marbles,
        explosive marbles. Vibranium Microweave Mesh, Various magical artifacts. *Panther
        Habit: As chieftain of the Wakandan Panther Clan, the ruler is crowned with
        a ceremonial regalia in the form of a Vibranium laced panther habit. T''Challa
        received this crown-like garb after being judged by the Panther Goddess. This
        uniform can absorb vibrations via its Vibranium lacing. It also can negate
        and/or lessen powerful kinetic based attacks such as bullets shots, penetrating
        blades, and normally crushing blows. The lenses in the mask cut glare and
        enhance the Panther''s natural night vision. It also allows him to see in
        infrared and other visual spectra. The suit features cloaking technology,
        Counter Frequency Grenades (to disrupt a teleporter''s teleportation), Binding
        Foil, Anti-Metal Claws (which can cut through any metal target), Wrist Mounted
        Blasters, Energy-Dampening Boots, Glider Wings, Teleportation Device, Hard-Light
        Shielding, Energized Gauntlets, a communicator and Kimoyo AI (which can hack
