    - field: attack_potency
      value: "High Hyperverse Level to Outerverse Level (In a weakened stateKnull\
        \ when performing this feat had just awoken, been blinded for eon's prior,\
        \ and hadn't yet crafted the All-Black, meaning he was without his Standard\
        \ Equipment. Knull himself also states that during this time he himself was\
        \ \"unrefined\"., decapitated a Celestial and murdered three others in order\
        \ to take control of their corpses as vessels, Celestial's are the same being's\
        \ depicted as stronger than the likes of The Watcher, The Stranger, Galactus,\
        \ and The Grandmaster{{Fact}} as well as the same being's stated whose armor\
        \ is stated to be \"dimensionally transcendental\"Marvel Encyclopedia New\
        \ Edition #1) | Outerverse Level to High Outerverse Level (Knull is depicted\
        \ as equal to that of Odinforce ThorKing in Black #3Whilst depicted as \"\
        equal\" it's important to note that for the most part during their fight,\
        \ Knull had the upper hand and does ultimately defeat Thor., eventually going\
        \ on to overpower him, and ultimately defeats him by stabbing him through\
        \ the chest) | Atleast Outerverse Level to High Outerverse Level (King's In\
        \ Black are stated to be the direct opposites to that of the Ivory King's\
        \ otherwise known as the King's in White also known as The Beyonders, existing\
        \ within the higher-plane of the Un-BeyondVenom (Vol. 5) #18The King's In\
        \ Black serve as a dual-equal to that of The King's In White, with the analogy\
        \ being that of \"Light and Dark Magicians\" , This is important as a singular\
        \ Beyonder was capable of combating the likes of Thor, Hyperion, and Starbrand\
        \ simultaneouslyNew Avengers (Vol. 3) #32) | Outerverse Level with Universal\
        \ Destructive Capacity via All-Black, The Godslayer (It's stated that Thor\
        \ of Earth-14412 utilized the All-Black to defeat the likes of Galactus, which\
        \ the symbiote bonded with, causing him to go on an absolute rampage devouring\
        \ worlds across the cosmos. It's further stated that amongst the abilities\
        \ of The All-Black it has the ability to engulf celestial bodies and potentially\
        \ even that of the universe itself.\"Attack Potency \u2260 Destructive Capacity\"\
        \ effectively meaning that the potency to destroy something can be lesser\
        \ than the Attack Potency someone can deploy), Outerverse Level via Godbomb\
        \ Detonation (When detonated, the Godbomb explodes throughout all of space-time\
        \ simultaneously, causing all gods in the multiverse to simultaneously die\
        \ over every second of their lives in the past, present, and future all at\
        \ once, killing every god who lived or will ever liveThis is not referring\
        \ to characters called Gods, but rather the hyper-literal pantheistic God's\
        \ within Marvel Comics, such as The Shinto, Norse, Greek, and Indian Pantheons.)"
