  range:
    text: 'Standard Melee Range to Outerversal | Standard Melee Range to Outerversal
      Teamwork: The team was composed in the moment by superheroes that didn''t have
      any experience working with one another (With the exception of Ant-Man and Wasp,
      who had been partners-in-crimefighting), as such there were many misunderstandings
      at the beginning. Hulk especially, traded hostilities with essentially every
      member before leaving the team for goodAvengers Vol 1 1.5Avengers Classic Vol
      1 1Avengers Vol 1 2, meanwhile Hank Pym felt insecurities regarding his role
      as an AvengerMighty Avengers Vol 1 21. Nonetheless both him and Wasp were able
      to prevent escalation of internal conflicts for a while, and the team was still
      fairly willing to help one another in times of need. Unlike its predecessor,
      this team was far more composed and functional. All the original members now
      had some familiarity with one another, and the new member, Captain America,
      was well-respected by other team members and meshed well with the group. The
      team now had regular training sessions, and weekly meetings with rotating chairperson.
      In combat as well, they had become very well coordinated in movement and covering
      for each other effectivelyAvengers Vol 1 10, and by the end of this era, all
      members had become close friends.Avengers Vol 1 16'
    source_ids:
    - vsbattles-avengers-1960s-team-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
