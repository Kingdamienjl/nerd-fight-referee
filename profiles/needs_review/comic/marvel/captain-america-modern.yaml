    - field: weaknesses
      value: 'Doom is very arrogant and overconfident, sometimes becomes bored and
        allows his opponents to win, and abides by a strict code of honor. He lost
        his "Skin Armor" and his enhanced magical abilities and knowledge after failing
        to honor his deal with the Hazareth Three. He cannot retain the Power Cosmic
        to the same extent as the Silver Surfer or Galactus, as he is still only a
        human, though his Doombots do not have this shortcoming. When wielding Galactus''
        power, Doom is subject to his hunger. During Secret Wars, he cannot fully
        control the immense powers of the Beyonder. Notable Attacks/Techniques: Psionics:
        Doom has studied and gained access to a host of mental abilities, evolving
        as a being through his extensive mental development. *Hypnosis: Doom has the
        power to hypnotize others through eye contact, dominating their minds with
        his overwhelming willpower. *Ovoid Mind Transfer: A mental power that Doom
        learned from the alien Ovoids. By making eye contact with another being, he
        can transfer his consciousness into their body, switching places their original
        consciousness, and leaving them in his old body. As he prefers his own body
        to that of any other, he dislikes doing this, but will do it if necessary,
        and can even use it multiple times in quick succession while fighting. Magic:
        Doom is one of the greatest sorcerers on Earth. He has amassed this magical
        knowledge from several tutors and sources over the years, reading from many
        tomes of black magic and training under Morgan le Fay, Doctor Strange, the
        Haazareth Three, and the Marquis of Death. His magical knowledge was far enhanced
        during his pact with the Hazareth Three, giving him his Skin Armor and all
        the knowledge that he would''ve had had he devoted his entire life to mastering
        magic rather than science. *Anti-Physics: During his demonic powerup, Doom''s
        presence alone was enough to slowly repeal the laws of physics around him,
        weakening their influence. *Crimson Bands of Cytorrak: A spell that draws
        power from the god Cytorrak to create several red energy rings to bind an
        opponent. *Dreamtime: Thanks to his research, Doom can access the Australian
        Aboriginal Dreamtime to communicate with others through their dreams. *Healing:
        Doom can use his mystic abilities to heal himself and others, such as to repair
        his broken neck. *Spirit Reversal: A spell that crippled The Sentry, but only
        due to his unstable mental state. *Summoning: Doom can summon a variety of
        demons and monsters, calling upon entire hordes of demonic abominations to
        fight against his opponents, some of which are strong enough on their own
        to match the likes of the Thing. *Teleportation: Doom''s mystic abilities
        allow him to teleport, and he can even interfere with the teleportation spells
        of others, controlling and changing their destinations so they will arrive
        wherever he pleases, even on a far-off planet. *Temporal Banishment: Doom
        was able to easily banish Morgan le Fay back in time, stranding her in 1,000,000
        B.C. Note: *This profile only covers the 616 version of Doctor Doom. Not all
        of the features described in his armor are present at once (although they
        could be), and many of them are devices that he made in the past. *It also
        does not cover his Secret Wars profiles or his Infamous Iron Man profile,
        otherwise his preparation would go up to Low 1-A for killing the Beyonders
        ==Others== Notable Victories: Notable Losses: Inconclusive Matches: Category:Eseseso
        Category:Tier 6 Category:Tier 4 Category:Tier 2 Category:Tier 1'
