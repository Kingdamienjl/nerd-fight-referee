    - field: weaknesses
      value: 'Without his armor, he is just a normal human. The Mark 1, due to being
        a crude first attempt at an exoskeletal combat suit by Stark, was heavy, slow
        and sluggish to move around, with many of its hinges exposed to the elements
        and outside forces to exploit and temporarily disable the suit''s movement
        systems with only flamethrowers and a missile to use for long-range combat,
        and the original 3 gigawatt arc reactor it was powered by wasn''t designed
        for sustained flight. The Mark 2 originally suffered from a fatal ice buildup
        if it approached altitudes exceeding 40,000 feet, resulting in the main transducer
        feeling sluggish at said altitudes and the hull pressurization becoming problematic,
        which Tony remedied by using a gold-titanium alloy from his Seraphim tactical
        satellite in order to maintain fuselage integrity and maintain power-to-weight
        ratio. While suffering from palladium poisoning, he suffered from an episode
        of recklessness. Suffered from a period of insomnia and several episodes of
        PTSD during the events of Iron Man 3. Weaker armors can''t handle extreme
        conduction | The more damage the Mark 50 armor takes, the fewer nanomachines
        that can be used to regenerate it or make weapons. Notable Attacks/Techniques:
        *Repulsors: Powered by the Arc Reactor, the suits can project a blast of magnetic
        repulsion from its palms, used for the armor''s flight stabilization, as well
        being Iron Man''s main range weapon. **Unibeam: When siphoning energy directly
        to the Arc Reactor, the armor can fire a massive repulsor from its chest that
        can send flying giant enemies like Iron Monger. *Missiles: The armors contain
        several sets of miniaturized missiles mounted on the arms, shoulders, and
        legs of the suit, such as anti-tank missiles and guided missiles. *Laser System:
        The armors are equipped with a palladium-powered laser system located in the
        back of the gauntlets, these can easily cut through any object, from slice
        armored androids to cut a hole in a space ship. *Artificial Intelligent Systems:
        Natural-language user interface computer systems that provide suit feedback,
        tactical analysis, and tactical countermeasures. They are even able to analyze
        Captain America''s fight pattern and provide a programmed countermeasure tactic.
        **House Party Protocol: A special command given by Tony to his I.A to active,
        summon, and control Iron Man armors to his aid. *Remote Propulsion: After
        injecting himself with computer chips on his arm, Stark can now mentally control
        the individual pieces of the armor, allowing him to summon it at any point
        of the battle, and even trap other people inside. * Nanite Manipulation: Stark
        is able to manipulate the nanites of the Bleeding Edge, allowing it to materialize
        the suit and form a wide variety of weapons and tools, including repulsor
        cannons, proton cannons, energy hammers, jackhammers, blades, shields, snares,
        magnetic clamps, coolant blasters, suture spray, wings, and rocket thrusters.
        Note: This profile is still work in progre'
