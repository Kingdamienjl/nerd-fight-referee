    - field: weaknesses
      value: of Astral Forms/Projection== *If an astral form is split from its physical
        body for more than 24 hours, the owner's physical body dies. Also, any Astral
        Projection (telepathic or otherwise) will leave the body unconscious and thus
        vulnerable to attack, and an empty body can be possessed by another astral
        form or spiritual being. *Only skilled sorcerers can use their magic powers
        while using Astral Projection, and while the astral form is outside of the
        body, the body itself is lifeless and immobile. ==References== {{Scroll box|{{Reflist|2}}}}
