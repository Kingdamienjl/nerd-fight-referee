    - field: intelligence
      value: "At least Above Average. Under veteran detective Misty Knight\u2019s\
        \ tutelage, Miles has developed a natural affinity for detective work, earning\
        \ the respect of Misty and Blade, even being able to assist the veteran vampire\
        \ hunter on a vampire hunt. Has trained under the Daughters of the Dragon\
        \ (Misty Knight and Colleen Wing) in both hand-to-hand combat and Kenjutsu,\
        \ becoming an even more formidable fighter that can single-handedly hold his\
        \ own against dangerous foes such as Carnage and Hobgoblin."
      source_id: vsbattles-spider-man-composite-earth-616
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: '*Inexperience (formerly): Due to his relatively short time as Spider-Man,
        Miles biggest weakness is his inexperience in being a costumed crime-fighter.
        He still is not completely sure what his powers make him capable of and this
        handicaps his effectiveness because of this. *Young Age (formerly): Although
        he is very bright and seemingly mature for a 14-year-old, his age and lack
        of real-world experiences is sometimes an obstacle in understanding the gravity
        of the situations around him. Miles has poor combat skills relying on his
        reflexes and as he said himself; luck. *Lack of Combat Training (formerly):
        He has had no combat training beyond what he has learned from watching videos
        of Peter Parker in action and his own experimentation with his powers. This
        leads to him making tactical mistakes in fights, such as when he leaped into
        the center of a group of common thugs and was promptly floored with a punch
        to the face. Notable Attacks/Techniques: *Venom Blast: Miles can temporarily
        paralyze his enemies or destroy technology by simply touching them with his
        hands. However, it seems that there are varying degrees to this ability as
        some opponents have been simply dazed where others have been completely incapacitated.
        It also seems more effective on people with genetic alterations, such as the
        Green Goblin and Venom. This power provides a great advantage as Miles can
        end a confrontation quickly with little collateral damage. These blasts also
        travel through conductive material and can travel along the ground. *Spider-Camouflage:
        Miles, including his clothing, can blend into his surroundings, allowing him
        to sneak up on his enemies or, in some cases, flee from them. The resulting
        effect closely resembles that of invisibility. *Immortality: Norman Osborn
        motioned that immortality is a side effect of the Oz formula, as Miles has
        the Oz formula in his DNA, it means that he also has such power. *Healing
        Factor: Because he is immortal, it means that he can rapidly regenerate his
        injuries. *Energy Burst: A recently new power Miles displayed is the ability
        to unleash a powerful burst of energy. It''s apparently triggered by extreme
        stress. After first using it, Miles is left exhausted. It''s powerful enough
        to destroy much of the Hydra laboratory Miles was being held in. ==Notable
