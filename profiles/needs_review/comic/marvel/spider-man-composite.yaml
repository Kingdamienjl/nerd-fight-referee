        from a home computer). Resistances=Resistance To: Mind Manipulation, Empathic
        Manipulation and Fear Manipulation (Capable of resisting the mind control
        of the Hypno-Hustler, who controlled an entire night club full of people.
        Fought against and overcame Helminth''s empathic control) Managed to resist
