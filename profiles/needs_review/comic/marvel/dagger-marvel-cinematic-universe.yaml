        \ Love and Thunder. He disguised himself as OdinThor: The Dark World twice,\
        \ copied himself as Captain America and an Asgardian, changed his clothes\
        \ from a suit to his armor, made copies of himself against his fight with\
        \ ThorThor, and did the same in his first arrival on Earth,Avengers made an\
        \ illusionary identical clone of himself with verbal communications, locomotion,\
        \ and senses countless times; such as with tricking Agent Coulson, projecting\
        \ himself in SakkarThor: Ragnarock, and even going at the length to conceal\
        \ an entire room with all its furniture. However, his illusions aren't restricted\
