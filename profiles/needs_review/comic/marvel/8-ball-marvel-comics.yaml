    text: At least Genius. Designed a cue that uses propulsion system, magnifying
      ANY force applied to it by a thousandfold. With this weapon that he developed,
      he can easily throw cars - even through buildings, shatter concrete with it,
      sliced a car in half, and more. Hit a phone booth with it, which cracked the
      ground beneath it as it flew. Destroyed a fire hydrant, which flew upwards at
      great speed like a rocket, cracking a concrete wall. Flipped a car. Designed
      a giant 8-Ball Hovercraft that lets him fly. Nadia Pym, a genius, asked him
