        \ somewhat with the various beeping and booping noises it makes (such as to\
        \ say thanks), even blaring the charge bugle upon entering Tank Mode) |-|Combat=Mindless\
        \ (Anything perceived as a threat or triggering Bastion's PTSD will be attacked\
        \ with no semblance of the usual kind and curious robot, even with the good\
        \ aim produced by it's programming) | Gifted (With Torbj\xF6rn eliminating\
        \ much of the killing machine parts of it's programming, Bastion's wit and\
