      value: "General=Average (Despite being programmed as a combative killing machine,\
        \ Bastion has a very child-like mentality and is relatively peaceful and curious\
        \ about its surroundings. Bastion has also shown to be able to retain a great\
        \ deal of its normal personality while in combat,Overwatch 2: Invasion being\
