    - field: weaknesses
      value: "Self-explanatory {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
        \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" |-\
        \ | *Divine Physiology: As the creator of All-Black the Necrosword, he appears\
        \ to possess the same powers it bestows upon its hosts but to a greater extent.\
        \ According to Brunnhilde, much of Knull's power and apparent invincibility\
        \ comes from his metaphysical link to the undead corpse of the Celestial he\
        \ used to refine All-Black, which feeds him power through the Necrosword and\
        \ in exchange assimilates the souls of those he kills; serving as a grotesque\
        \ afterlife. This connection was severed by the Valkyries, thereby greatly\
        \ weakening Knull, though due to his origin and age, he still remained powerful\
        \ enough to fight on-par with the likes of All-Father Thor. *Living Abyss\
        \ Manipulation: As the King in Black, Knull possesses the ability to create,\
        \ control, and manipulate a fount of eldritch darkness\u2014a manifestation\
        \ of the primordial void that existed before the universe itself\u2014that\
        \ he calls the \"living abyss\". Knull has spent billions of years experimenting\
        \ with and honing his powers to create not only the parasitic symbiotes, but\
        \ similar entities such as Mister E and the Exolon. His greatest creations\
        \ have been All-Black, the Void Knight -- a powerful proto-symbiote created\
        \ to enslave the Silver Surfer, and the symbiote dragons. During his invasion\
        \ of Earth, Knull was able to fuse hordes of Symbiote Dragons to engulf the\
        \ entire Earth in a dome of living abyss, blocking out all light. **Symbiote\
        \ Creation: Knull first discovered his ability to create life from darkness\
        \ itself when he manifested All-Black from his shadow in order to kill a Celestial.\
        \ Experimenting with and honing this aspect of his powers over the eons, he\
        \ formed a suit of symbiote-armor, constructed an artificial planet, and amassed\
        \ a horde of wyvern-like monsters from the living abyss. While he initially\
        \ only infected gods and other cosmic beings with the living abyss; when stranded\
        \ on a desolate world he discovered he could also infect mortal creatures\
        \ with the living abyss, creating an army of parasites to conquer the universe\
        \ by corrupting life instead of simply exterminating it. Knull's early experiments\
        \ to hone this aspect of his powers resulted in what became known as the Exolon,\
        \ imperfect symbiotes he discarded as failures. He was also capable of creating\
        \ symbiotes using his blood, though the only known symbiote created in this\
        \ manner is Big Mother. **Symbiote Domination: As the divine progenitor of\
        \ the symbiotes and the nexus of their hive-mind, Knull is able to mentally\
        \ influence and dominate symbiotes even while sealed away; driving them insane\
        \ with bloodlust and hunger. He is also capable of remote-piloting them, enabling\
        \ him to see through their eyes and directly control them; and can manipulate\
        \ their biomasses even when not in direct contact with them, as demonstrated\
        \ when he used an ancient dragon-like symbiote to attack Earth and manifest\
        \ an avatar of his true form. symbiotes infected by Knull's will usually have\
        \ red spirals in place of their eyespots, and are more powerful than symbiotes\
        \ disconnected from his dark hive-mind; sometimes even gaining new powers\
        \ and abilities as a result of the connection. Knull is also capable of forcibly\
        \ removing symbiotes from their hosts either by psychically blasting them\
        \ off or by ripping them off with his bare hands. Being one of the primevals\
        \ of darkness, Knull is also capable of dominating and psychically corrupting\
        \ other non-symbiote dark entities, such as the Void, Cloak, and Moondragon.\
        \ Despite not being one of Knull's creations, Ghost-Spider's artificial symbiote\
        \ was also vulnerable to his psychic corruption. *Superhuman Strength: Knull\
        \ is strong enough to decapitate a Celestial with a single blow, and singlehandedly\
        \ slaughtered entire armies of gods augmented by the Uni-Power. At least some\
        \ of Knull's immense strength is due to him wielding All-Black the Necrosword\
        \ and his symbiote-armor, which supply him with power from the first Celestial\
        \ he'd killed. Knull was able to easily manhandle the Silver Surfer - albeit\
        \ after Norrin had exhausted the majority of his Power Cosmic, and easily\
        \ overpowered the Sentry - touted as one of Earth's strongest heroes - and\
        \ effortlessly tore him in half. Even after the Valkyries severed his metaphysical\
        \ connection to the Headless Celestial, Knull was still strong enough to fight\
        \ Thor Odinson - who possessed a small portion of the Power of the All-Father.\
        \ The avatars that Knull creates using his symbiotes possess only a fraction\
        \ of his true power, but are nevertheless able to easily overpower the likes\
        \ of Venom despite Eddie Brock being simultaneously bonded to both the Venom\
        \ and Tyrannosaurus symbiotes. *Superhuman"
