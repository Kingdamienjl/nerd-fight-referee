- id: claim-weaknesses-977be84b
  section: weaknesses
  axis: weakness
  text: 'Most of Knull''s power is supplied by the All-Black symbiote from the Headless
    Celestial, which will deprive him of a majority of his power if this connection
    is severed. He is also vulnerable to The Light, a metaphysical force that manifests
    as concepts such as honor, benevolence, and nobility and physically as the divine
    power wielded by gods. When remote piloting a symbiote, any damage caused to it
    is also inflicted on Knull and if a person or a metaphysical manifestation has
    freedom in Knull''s hive-mind, they can fight against the symbiotes under his
    control and cause him pain. Note: Before making any changes to this page, please
