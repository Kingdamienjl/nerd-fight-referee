  intelligence:
    text: 'Above Average Before entering the Marvel universe, Gwen was substantially
      an average teenager. She initially depicted as obtuse and lacking in common
      sense for even blatant matters, but such a trait has been heavily toned down
      not long after. Some examples include mistaking the hideous effects of a virus
      (which she knew was a biological weapon) for common mumps or simply speaking
      without really knowing what she is talking about. She was later portrayed as
      much more level-headed, with only occasional lack of awareness. Being a huge
      nerd of Marvel comics let her build an encyclopedic knowledgeGwenpool Holiday
      Special: Merry Mix Up of almost everything related to them [with the exception
      of DeadpoolUnbelievable Gwenpool Vol 1 13 and especially the Guardians of the
      Galaxy], which inside their own world turned into extremely precious and convenient
      resources that came her in handy many times. Gwen has grown sensibly since entering
      the new world, taking on several mercenary jobs alone and with her partners,
      but also teaming up with groups of heroes, most notably the West Coast Avengers
      and the X-Men. She became a fine warrior, capable of utilizing actual combat
      techniques on top of her odd powers. Her greatest feat was, perhaps, taking
      down M.O.D.O.K. on their second encounter thanks to sheer fighting skill. Gwen
      is also very creative with her meta-narrative and reality-warping superpowers,
      as she utilizes them in a number of useful ways, as showcased in the respective
      section. Thanks to them, Gwen has managed to repeteadly put herself out of difficult
      situations and carry on through the many challenges that obstructed her way
      from time to time. Solved a case of school bombing and prevented further incidents
      by guessing that the writer was recycling an old storyline.Unbelievable Gwenpool
      Vol 1 6 Correctly deduced that a race of squid-like aliens would have had issues
      telling earthen species apart.Unbelievable Gwenpool Vol 1 7 Quickly figured
      out Arcade''s deception and immediately saw though his disguise. Tricked all
      the most popular heroes into visiting her island, thus falling into her trap.
      Some years after entering the Marvel Universe, Gwen joined the Empire State
      University and is seemingly keeping on with her studies.Marvel Voices: Pride
      Vol 3 1 Standard Tactics: Before awakening her true powers, Gwenpool didn''t
      have any sort of combat training and could at most handle weapons simply thanks
      to pure force of habit. She was extremely clumsy and much of the work was done
      by her subconscious ability to bend fate granting her an unfair advantage against
      her foes. Although she received a little training, Gwenpool still relied mostly
      on the sheer firepower and area of effect of automatic weapons and explosives,
      of which she was incredibly fond. Even after obtaining her reality-warping abilities,
      Gwen still preffered to meet her opponents in face-front, now with the aid of
      actual fighting abilities which she refined on the battlefield. The Gutter Space
      isn''t used much as a combat tool but rather as either a way of escaping a dire
      situation or in order to harness its several, useful characteristics which allow
      Gwen to dictate the course of events in more subtle ways. At first Gwenpool
      had absolutely no qualms about killing people, but she gradually shifted towards
      less murderous tactics, although she never gave up such habit completely.'
    source_ids: *id002
    confidence: 0.8
