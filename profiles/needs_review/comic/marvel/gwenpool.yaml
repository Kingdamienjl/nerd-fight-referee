- id: claim-weaknesses-9bef8a6e
  section: weaknesses
  axis: weakness
  text: 'Her fate-manipulating powers don''t always work and they immediately ceased
    to have any effect on Deadpool when he realized he was confronting a fellow fourth-wall
    breaker. Ever since entering Marvel Comics, Gwen has effectively become part of
    that world and abides to the rules of the creative force which governs it, even
    though she has still some wiggle room and can actively operate against the higher
    will. Gwen cannot travel to alternate futures if her present has no way of changing,
    such as being locked in a cell, but she can still travel to the past. She also
    cannot jump into a scene which has not been portrayed by the creative force in
    the form of a comic book page.Unbelievable Gwenpool Vol 1 24 However, this latter
    weakness has most likely been overcome the moment when she learned to manipulate
    events occurring off-panel. Her powers explicitly stop working depending on the
    whims of the author, an example being team books,West Coast Avengers Vol 3 5 where
    she is forbidden from showcasing the true extent of her abilities. The latter
    notion is made even more explicit by her victory and losses record, where depending
    on the situation, she managed to triumph over cosmic beings while also losing
    to regular superheroes. Note: *Before making any changes to this page, please
    read and follow the Power-scaling Rules for Marvel and DC Comics. *Do not mistake
    this Gwenpool with her alternate version from a parallel universe.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
