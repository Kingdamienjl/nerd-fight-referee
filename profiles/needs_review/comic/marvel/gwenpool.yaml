      value: Her fate-manipulating powers don't always work and they immediately ceased
        to have any effect on Deadpool when he realized he was confronting a fellow
        fourth-wall breaker. Ever since entering Marvel Comics, Gwen has effectively
        become part of that world and abides to the rules of the creative force which
        governs it, even though she has still some wiggle room and can actively operate
        against the higher will. Gwen cannot travel to alternate futures if her present
        has no way of changing, such as being locked in a cell, but she can still
        travel to the past. She also cannot jump into a scene which has not been portrayed
