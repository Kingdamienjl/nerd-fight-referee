  intelligence:
    text: "Genius: Howard has had a rather unpromising upbringing, which he himself\
      \ attributes to the difficulties experienced during childhood into fitting within\
      \ the school system. He is said to have had the potential to be a brilliant\
      \ scholarHoward the Duck Vol 1 3 onwards (title page) but, as he himself stated,\
      \ his academic career has been unremarkable.Howard the Duck Vol 1 13 As a matter\
      \ of fact, Howard's potential had already begun to manifest in primary school,\
      \ when he figured out that E=mc\xB2, doing so spontaneously and during a moment\
      \ of daydreaming nonetheless; however, his teacher's ignorance readily culled\
      \ any aspiration he may have had.A recurrent memory in Howard's history is an\
      \ early aptitute test which revealed how he would have been best suited as a\
      \ mortician. It was later revealed that Howard's brother ended up taking on\
      \ this profession, raising suspicions on a possible swapping that may have occurred\
      \ between their tests (Howard the Duck Vol 1 13 and Vol 2 6) Following the events\
      \ of Original Sin, Howard learned that he had born the potentially smartest\
      \ creature of his home universe, or perhaps all universes, but once again the\
      \ traumatic experiences of his childhood prevented him from developing his gift.Original\
      \ Sins Vol 1 2 Still, Howard grew into a knowledgeable and cultured individual,\
      \ for he utilizes a very polished language, when he wants to, and is often seen\
      \ reading, musing on, displaying interested for and referencing topics such\
      \ as philosophy, sociology, politics, history, literature and music.Howard the\
      \ Duck Vol 1 4Howard the Duck Vol 1 6Howard the Duck Vol 1 7 to 9Howard the\
      \ Duck Vol 1 10Howard the Duck Vol 1 3 In his life Howard has attempted many\
      \ career paths, without ever finding his true call; in fact, his talents never\
      \ surfaced up until the moment he was marooned in the Earth-616 universe. At\
      \ that point, while he still tried to get by as a normal citizen, fate kept\
      \ pulling him in the most bizarre situations, forcing him to tap into a number\
      \ of skills and employ his quick-thinking in ways he had never done before (more\
      \ details in the Powers&Abilities and Intelligence and Skill Feats sections).\
      \ Howard has also accumulated plenty of life experience, either on his own or\
      \ alongside his allies, among whom are some of Earth's most prestigious superheroes.\
      \ He has traveled the world, the cosmo and even the multiverse, fighting criminals,\
      \ supervillains, monsters, zombies and so on; he went into wild adventures,\
      \ solved mysteries as a private eye, dealt with large-scale politics on multiple\
      \ occasions, handled supernatural powers and met all sorts of otherworldly entities)\
      \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
