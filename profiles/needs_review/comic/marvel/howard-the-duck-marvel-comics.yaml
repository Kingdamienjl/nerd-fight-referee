      \ of in its bulb.Howard the Duck Vol 1 2 *Deduced that the different effects\
      \ of Dr. Bong's bell-shaped helmet's peals depended on pitch and intensity;\
      \ he then exploited this notion to strike him with excessive force, thus causing\
