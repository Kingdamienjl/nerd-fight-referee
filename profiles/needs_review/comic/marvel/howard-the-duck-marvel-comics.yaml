- id: claim-standard-equipment-8f42c577
  section: equipment
  axis: equipment
  text: '*Matches and Cigars (but he is always running low on them), useful for concentration
    (at least to him) and as occasional instruments of harm.Sensational She-Hulk Vol
    1 17Additional, unconventional uses include putting the cigar out on the hand
    of a man who was restraining him (Howard the Duck Vol 1 24) and tossing it on
    the floor to lit up a pool of gasoline (Generation X Vol 1 25) *Cell Phone: Its
    phonebook has the numbers of She-Hulk, Spider-Man (he checks only messages, not
    voicemail, and Howard texts him all the time), the Avengers,Howard the Duck Vol
    6 2 Star LordStar Lord Vol 2 1 and Squirrel Girl.Unbeatable Squirrel Girl Vol
    2 19 *No-Thing: The No-Thing, also known by its proper name "The Absolute Annihilator",
    is a legendary and powerful weapon originating from the Nexus of All Realities.
    Long ago it landed on the Microverse and was used by its inhabitants to save their
    world from Galactus''s hunger; the devourer of worlds had recognized it as akin
    to the Ultimate Nullifier, another device capable of erasing virtually anything
    from reality, including a cosmic entity such as him. This object was gifted to
    Howard by the Man-Thing during their second encounter. Howard has always been
    extremely weary of the No-Thing and kept it more as a charm, actually using it
    only once in his life, as detailed below. center|400px The No-Thing works on bravery,
    in similar fashion to how the Ultimate Nullifier works on intelligence. Its users
    must not only be able to control their fear, but must also possess courage and
    determination. The evil Psycho-Man, who in the past had even created a rude replica,
    could not activate the device exactly because he was stranger to bravery and focused
    only on using fear to harm others. Howard instead stepped into the front line
    and managed to activate the weapon against alternate versions of New Fantastic
    Four and the Psycho-Man himself, causing them to vanish instantly and thus saving
    his friends. Howard was later prompted to use the No-Thing one more time against
    the rampaging Man-Thing, who had been turned into a reality-destroying bomb by
    the effects the Serpent''s fear manipulation powers and the loss of control over
    the Nexus of All Realities. Howard then failed to activate the weapon, because
    deeply in his heart he was afraid of killing someone whom he also considered a
    friend, regardless of the danger it posed. Howard then realized that the Man-Thing
    himself had given him the No-Thing as a contingency in case he had ever gone out
    of control. Howard nearly resigned at erasing his friend for the sake of the whole
    universe, even succeededing in booting the device, yet at the very last moment
    he conceived another, better solution... Optional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-ad51909b
  section: power_scale
  axis: battle_iq
  text: "Genius: Howard has had a rather unpromising upbringing, which he himself\
    \ attributes to the difficulties experienced during childhood into fitting within\
    \ the school system. He is said to have had the potential to be a brilliant scholarHoward\
    \ the Duck Vol 1 3 onwards (title page) but, as he himself stated, his academic\
    \ career has been unremarkable.Howard the Duck Vol 1 13 As a matter of fact, Howard's\
    \ potential had already begun to manifest in primary school, when he figured out\
    \ that E=mc\xB2, doing so spontaneously and during a moment of daydreaming nonetheless;\
    \ however, his teacher's ignorance readily culled any aspiration he may have had.A\
    \ recurrent memory in Howard's history is an early aptitute test which revealed\
    \ how he would have been best suited as a mortician. It was later revealed that\
    \ Howard's brother ended up taking on this profession, raising suspicions on a\
    \ possible swapping that may have occurred between their tests (Howard the Duck\
    \ Vol 1 13 and Vol 2 6) Following the events of Original Sin, Howard learned that\
    \ he had born the potentially smartest creature of his home universe, or perhaps\
    \ all universes, but once again the traumatic experiences of his childhood prevented\
    \ him from developing his gift.Original Sins Vol 1 2 Still, Howard grew into a\
    \ knowledgeable and cultured individual, for he utilizes a very polished language,\
    \ when he wants to, and is often seen reading, musing on, displaying interested\
    \ for and referencing topics such as philosophy, sociology, politics, history,\
    \ literature and music.Howard the Duck Vol 1 4Howard the Duck Vol 1 6Howard the\
    \ Duck Vol 1 7 to 9Howard the Duck Vol 1 10Howard the Duck Vol 1 3 In his life\
    \ Howard has attempted many career paths, without ever finding his true call;\
    \ in fact, his talents never surfaced up until the moment he was marooned in the\
    \ Earth-616 universe. At that point, while he still tried to get by as a normal\
    \ citizen, fate kept pulling him in the most bizarre situations, forcing him to\
    \ tap into a number of skills and employ his quick-thinking in ways he had never\
    \ done before (more details in the Powers&Abilities and Intelligence and Skill\
    \ Feats sections). Howard has also accumulated plenty of life experience, either\
    \ on his own or alongside his allies, among whom are some of Earth's most prestigious\
    \ superheroes. He has traveled the world, the cosmo and even the multiverse, fighting\
    \ criminals, supervillains, monsters, zombies and so on; he went into wild adventures,\
    \ solved mysteries as a private eye, dealt with large-scale politics on multiple\
    \ occasions, handled supernatural powers and met all sorts of otherworldly entities)\
    \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
    1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
    \ left; |Intelligence and Skill Feats: |- | *Correctly guessed, on the fly, that\
    \ a cross-shaped wrench would have scared away the vampiric Hellcow. *Deduced\
    \ that the Space Turnip's brains were located into its green sprouts, instead\
    \ of in its bulb.Howard the Duck Vol 1 2 *Deduced that the different effects of\
    \ Dr. Bong's bell-shaped helmet's peals depended on pitch and intensity; he then\
    \ exploited this notion to strike him with excessive force, thus causing his technology\
    \ to go awire. *Is a skilled climber, having accomplished feats such as rising\
    \ to the top of a tree using only his tie and belt knotted together, climbing\
    \ up a giant pile of home appliances, scaling a rocky and steep hill bare-handed\
    \ and reaching the summit of a high-rising tower covered in plastic credit cards\
    \ without the aid of any gear; the narrator also pointed out that such a labor\
    \ was made even more difficult by Howard's webbed feet, which provided no traction\
    \ against the smooth synthetic surface. *Performed a feat of ventriloquism which\
    \ allowed him to mislead one of his opponents. *Doctor Strange, upon taking back\
    \ the powers he had lent to Howard, recognized his natural talent for magic and\
    \ offered to make him his pupil.Marvel Treasury Edition Vol 1 12 In another instance,\
    \ Jennifer Kale commented how Howard was a born sorcerer and was saddened to learn\
    \ he had to intention to pursue this career.Howard the Duck Vol 1 24 *Has spontanoeusly\
    \ learned to utilize the cosmic force called \"The Farce\" after being simply\
    \ made aware of its existence.Howard the Duck Vol 1 22Howard the Duck Vol 1 23\
    \ *Has solved the Lynoleum Lizard case all on his own, outperforming the professional\
    \ detective Dick Byrd, which ended up murdered in the early phases of his investigation.\
    \ *Could figure out that the bizarre worlds he and the rest of the Daydreamers\
    \ had been wandering through were just creations of Frankling Richard's wondrous\
    \ powers and not proper realities of the multiverse. *Predicted that the Statue\
    \ of Justice's sword would have collapsed under the weight of the people standing\
    \ on it and when it happened he warned the crowd underneath at just the right\
    \ time, saving them all.Howard the Duck Vol 4 3 *Performed a rapid sequence of\
    \ ment"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-a3097bdf
  section: weaknesses
  axis: weakness
  text: 'Can''t properly concentrate without smoking one of his cigars. He once almost
    drowned in the sea due to having never learned how to swim,Howard the Duck Vol
    1 15 but later he seemingly overcome this flaw, showcasing the ability to rapidly
    swim to the bottom of a lake. Has troubles telling humans apart, as he deems "hairless
    apes" to be indistinguishable; it then becomes totally impossible with cats, to
    the point that he went after a white cat when he was supposed to go after a brown
    one.Unbeatable Squirrel Girl Vol 2 6 According to him, ducks have also a terrible
    night vision.Howard the Duck Vol 6 9 Notes: Before making any changes to this
    page, please read and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1ce2bde3
  section: abilities
  axis: hax
  text: '*Genius Intelligence *Superhuman Physical Characteristics *Small Size (Type
    0: Measures two feet and seven inches.Howard the Duck Vol 2 1 These values have
    later been confirmed by Howard himself) *Enhanced Senses (Ducks have twice the
    vision of humans and this allowed Howard to recognize the subtleties of a worn-out
    carpet that had been walked on many times.Howard the Duck Vol 5 1 His keen eyes
    could spot a man unsheating a pocket knife and using it to subtly shank a youth
    in the middle of a brawl. Ducks'' excellent sense of direction also allowed Howard
    to correctly guide his allies through a lab) **Possibly Extrasensory Perception
    (May have a primal and dormant "Duck-Sense" that woke him up from unconsciousness
    in order to escape an alligator''s attack) *Weapon Mastery (Guns: Claims to be
    a crackshot who never misses and could nonchalantly hit a demon in the heart.Man-Thing
    Vol 1 1 Could simultaneously wield and use two pistols with great proficiency.
    Wielded guns during the final showdown between Earth''s heroes and villains versus
    the Skrull forces of the Secret Invasion.Secret Invasion Vol 1 7 Proficient in
    the use of the BFG ("Big Fricking Gun")Marvel Zombies 5 Vol 1 2 provided to him
    by A.R.M.O.R.. Melee: His kung-fu training included the mastering of the staff.
    When working as a security guard, Howard was able to swing his baton like a natural.
    It took him a single sword swing to best a lance-armed knight. Precision: Flicked
    one of his cigars right at a hanging thread, burning it. Threw his harpoon at
    the Pinbal Lizard''s tail and nailed it to the floor. Employed a trash can lid
    as if it was Captain America''s shield. Used his tie and belt tied together as
    an effective lasso) *Martial Arts and Accelerated Development (Training) (His
    will to achieve enabled him to complete a life-time of martial arts training in
    a mere three hours and seventeen minutes, while simultaneously crafting his own
    fighting style named "Quack-Fu", then using these skills to defeat Count Macho,
    a fellow graduate of the same master; unfortunately, his skills have since then
    atrophized due to lack of practice and may resurface only in times of great stress.Howard
    the Duck Vol 1 31 (letters section) Still, over time Howard has often resorted
    to his martial skillsGeneration X Vol 1 21 in order to face his opponents.Howard
    the Duck Vol 6 9Mockingbird Vol 1 5 Has swiftly defeated a wrestler notorious
    for his winning streak. In his youth Howard had also attempted to become a professional
    pugilist, but he soon abandoned such a careerHoward the Duck Vol 1 32) *Acrobatics
    (Capable of a number of athletic maneuvers such as pole-vaultingHoward the Duck
    Vol 2 7 and fast slacklining;Howard the Duck Vol 1 9 also able to run on people''s
    bodies, grab onto pipes to slide down buildingsHoward the Duck Vol 1 20 and swing
    on ropes,Howard the Duck Vol 1 17 vines, duct tape and bed sheets. Jumped on the
    Human Cannonball''s head in mid-flight and obscured his vision.Howard the Duck
    Vol 1 27 Leapt vertically above the heads of multiple people. Has recurrently
    performedHoward the Duck Vol 4 4 jumping attacks against his opponents) *Vehicular
    Mastery (Land Vehicles: Howard is a licensed cab driver and has practiced such
    profession for several years in Cleveland and occasionally New York.Howard the
    Duck Vol 2 Drove the Duckmobile at high speed within the narrow spaces of the
    Mammoth Mall. He could also casually drive a sport car and a van. Rode a toy horse
    around Santa''s workshop while shooting down Hydra automatons. Has been shown
    riding a real horse as well.Marvel Zombies 5 Vol 1 1 Aircrafts: Was able to pilot
    a flying merry-go-round without any previous experience and outmaneuver a plane
    in a dogfight.Howard the Duck Annual Vol 1 1 Piloted a living rocket ride while
    in the middle of a storm, and used it to defeat the wizard Pro Rata and and his
    breakfast monstersHoward the Duck Vol 2 2) *Stealth Mastery (Managed to somehow
    infiltrate an army base, taking advance of a distraction he had involuntarily
    caused, and reached the General''s rooms by hiding underneath the cloche of the
    lunch that was being served.Howard the Duck Vol 1 28 Laid out a purposedly-predictable
    ambush on Dr. Bong in order to make him lower his guard and actually strike him
    by surprise. Misled nurse Barbara by making her believe he was hiding inside the
    wrong set of armor and landed a surprise attack on her Pretended to have committed
    suicide in order to lure a guard into carelessly entering his and other inmates''
    cell, thus leading to a prison break) **Preparation (Anticipated the Uncanny Cockroach''s
    movements, preceeding him to the location he was heading to and laying down a
    trap specifically designed to defeat him. Set up a trap on the fly to distract
    and defeat two men that were hunting him. Upon being hired by the White Rabbit,
    and suspecting it was probably a trap, Howard asked Ant-Man to hide in his clothes
    and come out whenever the Rabbit would reveal her true colors; by doing so'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
