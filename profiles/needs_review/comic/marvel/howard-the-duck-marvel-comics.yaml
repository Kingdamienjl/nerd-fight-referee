    - field: standard_equipment
      value: 'Matches and Cigars (but he is always running low on them), useful for
        concentration (at least to him) and as occasional instruments of harm.Sensational
        She-Hulk Vol 1 17Additional, unconventional uses include putting the cigar
        out on the hand of a man who was restraining him (Howard the Duck Vol 1 24)
        and tossing it on the floor to lit up a pool of gasoline (Generation X Vol
        1 25), Cell Phone: Its phonebook has the numbers of She-Hulk, Spider-Man (he
        checks only messages, not voicemail, and Howard texts him all the time), the
        Avengers, Howard the Duck Vol 6 2 Star LordStar Lord Vol 2 1 and Squirrel
        Girl.Unbeatable Squirrel Girl Vol 2 19, No-Thing: The No-Thing, also known
        by its proper name "The Absolute Annihilator", is a legendary and powerful
        weapon originating from the Nexus of All Realities. Long ago it landed on
        the Microverse and was used by its inhabitants to save their world from Galactus''s
        hunger, the devourer of worlds had recognized it as akin to the Ultimate Nullifier,
        another device capable of erasing virtually anything from reality, including
        a cosmic entity such as him. This object was gifted to Howard by the Man-Thing
        during their second encounter. Howard has always been extremely weary of the
        No-Thing and kept it more as a charm, actually using it only once in his life,
        as detailed below. center, 400px The No-Thing works on bravery, in similar
        fashion to how the Ultimate Nullifier works on intelligence. Its users must
        not only be able to control their fear, but must also possess courage and
        determination. The evil Psycho-Man, who in the past had even created a rude
        replica, could not activate the device exactly because he was stranger to
        bravery and focused only on using fear to harm others. Howard instead stepped
        into the front line and managed to activate the weapon against alternate versions
        of New Fantastic Four and the Psycho-Man himself, causing them to vanish instantly
        and thus saving his friends. Howard was later prompted to use the No-Thing
        one more time against the rampaging Man-Thing, who had been turned into a
        reality-destroying bomb by the effects the Serpent''s fear manipulation powers
        and the loss of control over the Nexus of All Realities. Howard then failed
        to activate the weapon, because deeply in his heart he was afraid of killing
        someone whom he also considered a friend, regardless of the danger it posed.
        Howard then realized that the Man-Thing himself had given him the No-Thing
        as a contingency in case he had ever gone out of control. Howard nearly resigned
        at erasing his friend for the sake of the whole universe, even succeededing
        in booting the device, yet at the very last moment he conceived another, better
        solution... Optional'
      source_id: mediawiki-3335715
      provider_id: vsbattles
      authority: high
      confidence: 0.75
