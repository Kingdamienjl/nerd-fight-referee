  durability:
    text: "At least Multi-Continent level (While already badly wounded from Stormbreaker,\
      \ he endured the power surge from the completed Infinity Gauntlet, which was\
      \ stated by Rocket Raccoon to be of cosmic proportions beyond anything seen\
      \ before, which would at least put it above the Power Stone\u2019s world wipe.\
      \ However, the second surge generated when Thanos snapped the completed Infinity\
      \ Gauntlet to atomize the Infinity Stones, which was unquantifiable by value,\
      \ nearly killed him, left half of his body burnt and took away his life essence.The\
      \ Art of Avengers: Endgame Could hold the Power Stone in his bare hand. Endured\
      \ attacks from Scarlet Witch when she was bloodlusted, albeit was eventually\
      \ overwhelmed. Took numerous attacks from Thor, Captain America with Mj\xF6\
      lnir, Mark 85 Iron Man, Captain Marvel and Hulk. Mark 50 Iron Man only drew\
      \ a single drop of blood after a prolonged engagement), higher with armor, far\
      \ higher with his Double-Bladed Sword (Blocked Mark 85 Iron Man's overloaded\
      \ repulsor beams after absorbing Thor's lightning, which equates to 3.071 Exatons),\
      \ even higher with Energy Shields (Blocked an attack from Scarlet Witch with\
      \ the Space Stone)"
    source_ids:
