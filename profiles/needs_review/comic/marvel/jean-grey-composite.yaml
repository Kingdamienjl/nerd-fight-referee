        \ serve as both support and subtle control, allowing her to lift teammates\
        \ or objects to provide assistance in combat, she also acts as the team's\
        \ medical doctor. Wolverine functions best as a close-range brawler, and his\
        \ healing factor allows him to take risks others can\u2019t and draw enemy\
