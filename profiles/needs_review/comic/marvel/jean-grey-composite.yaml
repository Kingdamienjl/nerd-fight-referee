    - field: standard_equipment
      value: 'Armor, Double-Bladed Sword (Formerly for his Sacred Timeline self),
        Infinity Gauntlet *The Infinity Gauntlet: A powerful gauntlet forged from
        Uru melted by the blazing power of a neutron star by the Dwarf King Eitri,
        under the strict command and supervision of Thanos himself under threat of
        death. With it, Thanos can collectively harness the power of all Six Infinity
        Stones, efficiently channeling and commanding their might without risk of
        misdirection or backfiring. **Power Stone: Directly linked with, and representing
        all Power in the Universe, the Power Stone grants Thanos immense, unrivaled
        power on a cosmic scale, allowing him to effortlessly tear apart the surface
        of worlds and moons, as well as destroy his enemies with blasts of cosmic
        energies. **Space Stone: Directly linked with, and representing all Space
        in the Universe, the Space Stone grants Thanos direct control over the fabric
        of Space itself, allowing him to telekinetically throw parts of Titan''s destroyed
        moon, levitate, and fold space to create portals so that he may instantaneously
        traverse across the universe. **Reality Stone: Directly linked with, and representing
        Reality itself, the Reality Stone grants Thanos the ability to mold and reshape
        the fabric of reality as he sees fit, allowing him to effortlessly transmute
        anything and anyone in his vicinity, create tangible illusions, and reform
        the entire landscape in which he''s in. **Soul Stone: Directly linked with,
        and representing the souls of all sentient beings in the Universe, the Soul
        Stone grants Thanos the power to manipulate the souls of his victims. **Time
        Stone: Directly linked with, and representing all Time in the Universe, the
        Time Stone grants Thanos direct control over the fabric of Time itself, allowing
        him to halt, revert, and accelerate its flow, as well as generate endless
        time loops. **Mind Stone: Directly linked with, and representing the minds
        of all sentient beings in the Universe, the Mind Stone grants Thanos the capability
        to influence and control the minds of his enemies. However, he has yet to
        demonstrate the Mind Stone''s powers in any meaningful way.'
      source_id: vsbattles-jean-grey-composite-marvel-comics
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Extraordinary Genius (Thanos is a cunning and ruthless individual with\
        \ an intellect sharpened by centuries of experience. A brilliant strategist,\
        \ commanding vast armies that have devastated countless worlds and destroyed\
        \ empires across the galaxy, which earned him renown as one of the most fearsome\
        \ warlords in the universe. A master tactician who manipulated events, such\
        \ as Loki's attack on New York and Ronan's retrieval of the Orb to set the\
        \ stage for his pursuit of all six Infinity Stones.Marvel Website: Thanos\
        \ An incredibly skilled combatant, who easily outmaneuvered heroes such as\
        \ Thor, Hulk, Iron Man, Doctor Strange and Captain America during their confrontations.\
        \ Quickly and intuitively learned and mastered how to wield the Infinity Stones,\
        \ being the real master of them, understanding their true power and capable\
        \ of harnessing the Stones' powers on a completely different level, unlike\
        \ their previous owners.The Art of Avengers: Infinity War He found a way to\
        \ time travel from 2014 to 2023 after obtaining Pym Particles, and reverse-engineered\
        \ and mass-produced them alongside Ebony Maw.\u2018Avengers: Endgame\u2019\
        \ directors just explained some of the movie\u2019s biggest mysteries He is\
        \ also an incredibly charismatic master manipulator who can bend even the\
        \ most powerful beings to his will) Standard Tactics: Thanos' fighting style\
        \ greatly varies based on the version used and how many Infinity Stones he\
        \ has. The two main versions that this profile covers are the one from Infinity\
        \ War and the one from Endgame. *The first one is a honorable warrior, who\
        \ prefers not to kill his opponents if not needed and will first try to incapacitate\
        \ them, unless he sees them as a serious threat to his plans, in which case\
        \ he won't have problems killing the opponent if he has a chance to. It is\
        \ unknown how he fight with his Double-Bladed Sword, but with the Stones he\
        \ will try to quickly defeat the opponent with powerful attacks from his Power\
        \ Stone or by incapacitating them with the Reality Stone and the Space Stone,\
        \ but if that doesn't work then he will go for more lethal attacks. When equipped\
        \ with the Complete Gauntlet, his first move will be to snap his finger in\
        \ order to destroy his opponent, deconstructing them and turning them into\
        \ ashes. *The second one, instead, is much less honorable, being far more\
        \ ruthless and sadistic with little regards towards anyone. He won't have\
        \ any problems with trying to kill his opponent even if they aren't an immediate\
        \ threat to him. This is reflected into his fighting style with the Double-Bladed\
        \ Sword, since with it he will try to continuously attack the opponent, without\
        \ giving them the time to counter-attack. He was never seen using the Stones\
        \ singularly, except for the Power Stone which he used briefly against Captain\
        \ Marvel. His first move when equipped with the Complete Gauntlet, instead,\
        \ is to use it to destroy the whole Universe with a snap of his fingers."
      source_id: vsbattles-jean-grey-composite-marvel-comics
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'He must be able to move his hand to activate the Infinity Stones. Continuous
        usage of the Stones had a toll on his body, as his left arm has been permanently
        damaged Note: *As discussed and accepted in this thread, the Infinity Stones
        are stated to be powerful enough to impact a four dimensional being like Dormammu,
        even to the point of cowing him and halting his actions, therefore their hax
