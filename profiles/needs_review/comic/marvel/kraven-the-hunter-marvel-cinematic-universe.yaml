        mystic.Spider-Man: The Lost Hunt Vol 1 4 Kraven has gained worldwide fame
        as a legendary hunter over the course of many decades, earning such a reputation
        by single-handedly hunting every type of beast that walks, climbs, crawls,
        flies and swims, even going as far as doing it unarmed.Amazing Spider-Man
        Vol 1 15Amazing Spider-Man Annual Vol 1 1 Further explorations on his life
        revealed that Kraven has also hunted cryptids (such as the yeti or the Sasquatch),
        many species of dinosaurs and creatures that don''t exist anymore or "were
        never meant to have existed in the first place".Incredible Hulk Vol 3 11 Upon
        having been given a second chance to life, Kraven set off to hunt even more
        bizarre game, succeeding in the capture of creatures such as the Winged Tigers
        of K''un-Lun, the Gamma Wolves and a Giganto. His latest collection of trophies
        also features several humans, masked individuals and humanoid monsters.Captain
