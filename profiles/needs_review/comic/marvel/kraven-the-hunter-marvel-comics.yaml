- id: claim-weaknesses-11648534
  section: weaknesses
  axis: weakness
  text: 'The physical augmentations granted to Kraven by the elixir are temporary,
    therefore he must regularly ingest new doses in order to maintain his superhuman
    powers. Moreover, around the period which preceded his "Last Hunt", his serum''s
    toll on Kraven''s body after decades of consumption had become unsustainable,
    thus leaving him on borrowed time he himself wasn''t aware of. Arrongant and full
    of himself, Kraven often underestimates his opponents even after having studied
    or confronted them directly, refusing to accept his physical inferiority. As noted
    by Spider-Man, he is also susceptible to taunts, which make him careless in battle.
    Kraven has somewhat toned down his arrogance overtime, wanting to restore his
    lost honor, but he nonetheless maintained eccessive levels of self-confidence
    which proved to be his downfall time and time again. Notes: *Before making any
    changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics. *Despite being a frequent and historical foe of Spider-Man, Kraven
    has been recurrently stated to be the weaker among the two, also failing to actually
    injure Spider-Man with his punches and being swiftly overpowered during contests
    of pure strength. Kraven has also never come close to overcoming Spider-Man in
    a direct confrontation without first weakening him through poisons, drugs or other
    underhand strategies. Moreover, Kraven''s has been either stated and/or shown
    to be weakerTales of Suspense Vol 2 58Old Man Logan Vol 2 42 than the likes of
    Iron Man, Tigra, Beast, Kaine and Old Man Logan. ==Notable Matchups== Victories:
