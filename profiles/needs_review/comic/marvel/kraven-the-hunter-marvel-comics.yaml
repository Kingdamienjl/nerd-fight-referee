    - field: standard_equipment
      value: 'Blades: Although firmly against the use of such a form of weaponry at
        first, Kraven has progressively adopted the habit of carrying hunting knives
        and spears of different makings at any given time., Belt Tusks: Kraven sports
        a unique collection of tusks circling around his waist. These items are more
        than just ornaments, for they brim with drugs, poisons and even medicines
        which quickly affect their victim through even a mere scratch. More specific
        examples include concentrated black mamba venom, neural poisons, tranquilizers,
        antidotesSpider-Man: Blue Vol 1 5X-Men: The Hidden Years Vol 1 17 and the
        n''gami, a powerful drug that eases pain and acts as a disinfectant.Ka-Zar
        the Savage Vol 1 21 In more recent years, Kraven has occasionally traded this
        classic belt with a more conventional one, featuring different pouches instead
        of tusks. In yet other instances, Kraven has combined the two articles by
        hanging the tusks to strings circling around his waist and right next to his
        belt., Lion Vest: An energy-based weapon developed by Kraven over the course
        of several months spent in prison. It consists of a tangle of wires hidden
        behind the two lion eyes on his jacket which project electric rays which disable
        the victim''s muscular system. Kraven has rebuilt and improved such a weapon
        several times, adding further offensive options such as stun beams, sleeping
        gas and sonic beams. Kraven has also implemented a gas specifically designed
        to knock out Tigra. Kraven has never abandoned his signature vest, but following
        his resurrection he ceased to employ it as a weapon, leaving it dubious whether
        he refuses to use it or has truly reverted it into normal clothing. thumb,
        center, 250px, Lion VestSpider-Man: Grim Hunt - The Kraven Saga Vol 1 1, Cold
        Weapons and Firearms: Bolas, spears, Amazing Spider-Man Vol 1 634 whip, war
        axe, war club, wooden staff, sword, shield, telescopic harpoon, rifle (loaded
        with darts or bullets), assault rifle, grenades, electric baton, sniper rifle,
        handheld rocket launcher and .585 Gehringer., Garrote: A sturdy wire with
        which Kraven attempted to strangle the Man-Wolf after catching him from behind.Creatures
        on the Loose Vol 1 32, Plasti-Cord: A long and stiff string hidden within
        Kraven''s belt. He used it as lasso to snare Ka-Zar''s neck and attempt to
        hang him on a tree., Poison Ring: A ring featuring a large spike dipped in
        toxins. A single sting could induce strong dizziness into Spider-Man., Anti-Vampire
        Javelin: A folding spear with a silver blade mounted on a wooden shaft. Kraven
        used it to deliver a seemingly lethal blow to Baron Blood., Bear-Trap Bazooka:
        A rocket launcher loaded with foothold traps which clench automatically upon
        hitting the target. It stores at least two traps, as Kraven has used it to
        distract the Hulk and then free himself from a sasquatch''s clutch briefly
        after., Net Guns: Pistols and rifles loaded with nets wide enough to capture
        whole individuals such as Squirrel Girl and the Dinosaur-People.Venom Vol
        1 158, Adamantium Blade: Long knives made by the famous nearly-indestructible
        metal. Kraven owns at least two of such blades., Nets: One of Kraven''s favorite
        items, useful to quickly snare an opponent and render them helpless. Far from
        being common nets, they can be sturdy enough to overcome even Spider-Man''s
        strength or progressively tighten the more the target struggles to free themselves.Astonishing
        Tales Vol 1 2, Darts: Sharp projectiles imbued with poisons and drugs. They
        are thrown by hand or propelled by means such as a wrist device, a blowgun
        or a rifle., Ropes: Mundane tools used for a variety of purposes, such as
        tying people, swinging away to safety or quickly rise through surfaces when
        connected to a pulley device., Adamantium Fishhooks: Hooked wires made of
        the famous and near-indestructible metal. Kraven uses them to fish megalodons,
        but has also employed a tangle of them to snare the Hulk and lift him up in
        the air with a remote-controlled air balloon connected to the fishooks., Adamantium
        Cage: A container with bars forged in Adamantium, durable enough to be impervious
        even to Old Man Logan''s own Adamantium claws., Animals: Kraven is occasionally
        escorted by the wild beasts he has tamed and trained to assist him in combat.
        Some specimen include leopards, tigers, lions and hawks., Jungle Drum: A particularly
        loud percussion instrument whose sounds confuse the enemy., Magnetic Manacles:
        Magnetized metal bracers whose reciprocal attraction increases progressively.
        They come with built-in bells which jingle with every movement, allowing Kraven
        to follow his prey as they struggle to break free., Jungle Scent: An exotic
        aroma which disabled Spider-Man''s Spider Sense and made him easier to track.,
        Malodorous Juices: A gourd filled with liquids whose odor could overload Tigra''s
        enhanced senses., Electric Band: A metal band that discharges electricity.
        It was used by Kraven to knock out the powerful sabertooth Zabu., Ivory Horn:
        An artifact from ancien'
