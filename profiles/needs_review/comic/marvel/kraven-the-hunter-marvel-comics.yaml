    Spider-Man Vol 1 637 and hallucinogens) *Electricity Manipulation, Magnetism Manipulation
    & Paralysis Inducement (His Double-Barreled Ray magnetizes the muscular electrolytes
    within the target''s body, causing them to fall limp upon being struck. The effect
