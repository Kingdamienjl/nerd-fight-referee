    - field: intelligence
      value: 'Genius Sergei has received the upbringing that is expected from a member
        of the russian nobility of his time and overtime he has displayed profound
        knowledge and interest for topics such as music, literature, poetry and philosophy,
        with particular fondness for the productions of his homeland.Unbeatable Squirrel
        Girl Vol 2 33Unbeatable Squirrel Girl Vol 2 35 During his early adulthood,
        Sergei has received further education from Aja Orisha, who introduced him
        to the ways of natural mysticism that she had in turn acquired as a Wakandan
        mystic.Spider-Man: The Lost Hunt Vol 1 4 Kraven has gained worldwide fame
        as a legendary hunter over the course of many decades, earning such a reputation
        by single-handedly hunting every type of beast that walks, climbs, crawls,
        flies and swims, even going as far as doing it unarmed.Amazing Spider-Man
        Vol 1 15Amazing Spider-Man Annual Vol 1 1 Further explorations on his life
        revealed that Kraven has also hunted cryptids (such as the yeti or the Sasquatch),
        many species of dinosaurs and creatures that don''t exist anymore or "were
        never meant to have existed in the first place".Incredible Hulk Vol 3 11 Upon
        having been given a second chance to life, Kraven set off to hunt even more
        bizarre game, succeeding in the capture of creatures such as the Winged Tigers
        of K''un-Lun, the Gamma Wolves and a Giganto. His latest collection of trophies
        also features several humans, masked individuals and humanoid monsters.Captain
        America Vol 1 697 Another of his great feats has been the repetead breaching
        of the High Evolutionary''s defenses and security in order to relentlessly
        hunt down his Ani-Men.Amazing Spider-Man Vol 5 16 Consequently, he has also
        become an expert survivalist, having spent many years in the wildest environments
        of the world and having grown capable of navigating even places such as the
        Savage Land,Amazing Spider-Man Vol 1 104 a place from which he managed to
        return from even after suffering a broken arm and that has eventually become
        his residing place after his resurrection in modern times. Furthermore, given
        his extended lifespan, Kraven has accumulated a wealth of life experience
        spanning approximately a century. Kraven is a man of many talents, which he
        has acquired and honed over the course of his adventures, as better detailed
        in the Powers&Abilities section above. Kraven is also a clever inventor, having
        personally developed the various weapons hidden inside his lion vest and having
        synthesized new gases and drugs designed to specifically affect Tigra and
        Spider-Man. Moreover, he is an proficient cook, can craft various weapons
        and is able to consistently replicate numerous potions and magic spells. An
        excellent instructor as well, Kraven has trained the Gibbon, the Alien Killing
        Krew, his pupil Gregor and his children Vladimir,Spider-Man Vol 1 50 Alyosha,
        AnastasiaSpider-Girl Vol 2 4 and his 87 clones created by the High Evolutionary.
        Kraven has always maintained the Kravinoff family''s business and estate in
        wealth and respectability, even seemingly forming his own small kingdom at
        some point. Aside from his native russian and his naturalized english, Kraven
        also speaks fluent japaneseOld Man Logan Vol 2 41 and may have acquired other
        languages during his many travels. In combat, Kraven has faced a remarkably
        numerous and varied amount of opponents, often representing a challenge, if
        not a dangerous thorn in their side. His martial skills, weapons and traps
        have allowed him to hold his own against foes both stronger and faster than
        him, while his many gadgets and tactics have allowed Kraven to come victorious
        and capture his preys in numerous occasions, being defeated only at the very
        end because of his hubris and will to achieve victory on his own terms. The
        selection of preys confronted by Kraven in one or multiple instances include
        Spider-Man, Scarlet Spider/Kaine, Venom, Tigra, Daredevil, Black Widow, Ka-Zar,
        Man-Wolf, Vermin, Rocket Raccoon, Black Panther, Hulk, Squirrel Girl, Captain
        America, Old Man Logan and even the entire, original formation of the X-Men
        all together. Standard Tactics: At the beginning of his criminal career, Kraven
        adhered to a self-imposed rule of confronting his opponents without the aid
        of weapons, for he went proud of having always bested his preys with none
        but his bare hands. Nonetheless, he was also prone to first test his targets
        with subtler approaches, such as leading them into convenient locations rigged
        with traps or surprising them with sneak attacks and special tools meant to
        hinder and misdirect them. Therefore, Kraven used to leave close combat only
        for those skilled enough to evade his tricks. For a time he has also been
        a hyprocritical fighter, ready to betray his own code of honor once the odds
