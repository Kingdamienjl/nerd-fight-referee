  attack_potency:
    text: 'Small Building level (Has fought Daredevil and Black Widow on equal grounds),
      up to Large Building level with weapons (Although seemingly mundane in nature,
      Kraven''s weapons have recurrently been a threat to individuals much stronger
      than him, likely because of Kraven''s own prodigious strength. Should already
      have access to the more mundane weapons he has used in the time following his
      resurrection. His belt tusks could scratch Spider-Man. Using his knives, Kraven
      was able to draw bloodSecret Empire: Brave New World Vol 1 3 from and deal significant
      injuries to Spider-Man, Spider-Woman, Kaine and Venom. His spears could impale
      Agent Venom. His natural claws wounded Beast. His darts could consistently puncture
      the likes of Spider-Man, Venom, Black Panther and more. His traps have been
      a consistent threat to the likes of Spider-Man, Tigra and Captain America, and
      one of them could gravely wound Venom. His knife and large-caliber cartridges
      could penetrate even Venom''s bulletproof skin. His knives could also slash
      and stab Old Man Logan, as well as break his bone clawsOld Man Logan Vol 2 42)
      | Small Building level, up to Large Building level with weapons (As strong as
      before and with access to the same, and more, weapons), far higher with Adamantium
      blades (Weapons made with this famed material are nearly-indestructible and
      capable of cutting through virtually anything, as exemplified by characters
      such as Wolverine, Laura Kinney, Doctor Doom and more)'
    source_ids:
    - mediawiki-863880
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Superhuman to Subsonic Travel Speed (His speed rivals that of a Cheetah.
