    victim. These rays have successfully affected the likes of Spider-Man, the Vulture,
    Ka-Zar, Zabu, TigraMarvel Chillers Vol 1 4 and Iceman.X-Men/Spider-Man Vol 1 1
    This weapon can also fire electric stun beams) **Sleep Manipulation & Sound Manipulation
    (Overtime Kraven''s vest has been given the ability to release sleeping gas capable
    of knocking out an elephant and shoot sonic blasts which can drive a person insane)
    |-|Optional Equipment/Preparation= *Sleep Manipulation (His gas grenades release
    airborne tranquilizers which can affect even metahumans such as the Man-Wolf and
    Tigra) *Fragrance Manipulation and Power Nullification (Utilizes scents capable
    of nullifying Spider-Man''s spider sense and Tigra''s feline senses) *Electricity
    Manipulation (Has a metal band which electrocutes those on whom it is applied.
    Has put an electric collar around Captain America''s neck which prevented him
    from approaching Kraven) *Magnetism Manipulation (Has a pair of manacles which
    restrict the target''s movements through reciprocal magnetic attraction. His mnemonic
    scrambler operates through magnetism) *Explosion Manipulation (Can fire explosive
    darts from his blowgun. Has access to rocket launchers and landmines) *Information
    Analysis (Carried a device that could provide real-time analyses on Beast''s vitals
    and bodily functions) *Sound Manipulation (Possesses various instruments with
    special properties, such as drums, horns and whistles. At some point Kraven has
    also utilized an ultra-sonic blaster and a sonic gun) **Minor Animal Manipulation
    (The sound of his ivory horn sends elephants in a rampage) **Summoning (Post-Grim
    Hunt only; Has a special whistle whose sound summons his pet dinosaurs to his
    aidUnbeatable Squirrel Girl Vol 2 24) *Light Manipulation (Has employed flashpots
    to perform a quick escape) *Thread Manipulation (His Ben Reilly disguise includes
    one of his Web-Shooters) *Healing (His herbs and potions could heal Spider-Man''s
    most grievous wounds at extraordinary speed) *Poison Manipulation, Perception
    Manipulation & Biological Manipulation (Utilizes darts, traps and ringsSymbiote
    Spider-Man: Alien Reality Vol 1 1 laced with toxins which can stiffen and numb
    the body or induce powerful hallucinations,Amazing Spider-Man Vol 1 293 confusion
    and the disruption of brain functions. Most notably, two darts whose poison had
    been designed specifically for Spider-Man could send him into a death-like, two
    weeks-long coma.Amazing Spider-Man Vol 1 294Web of Spider-Man Vol 1 32 Seven darts
    carrying yet another mixture of toxins meant for Spider-Man could severely affect
    even Deadpool, surpassing his healing factor and the Venom Symbiote attached to
    himDeadpool: Back in Black Vol 1 4) *Mind Manipulation & Telepathy (Administered
    the Gibbon a concoction which caused his wild side to surface, as well as forming
    a telepathic bond between his mind and Kraven''s; the latter''s superior will
    then prevailed and allowed him to control Gibbon''s actions. His mnemonic scrambler
    enslaves the mind of the wearer) *Fear Manipulation & Dream Manipulation (By performing
    a ritual involving the widening of his consciousness through herbs and roots and
    the devouring of a swarm of spiders, Kraven could immerse himself into Spider-Man''s
