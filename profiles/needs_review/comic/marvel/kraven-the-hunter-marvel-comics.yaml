  lifting_strength:
    text: At least Class 50 (Can wrestle with and subdueAmazing Spider-Man Vol 1 209
      a variety of large animals. Has bench-pressed a gorilla and hurled a lion and
      a tiger without effort. Has twisted a metal handrail using just one hand. Claims
      to be strong enough to stop a charging elephant. Uprooted a street light and
      a large chimney. States to have strangled a full-grown grizzly bear. As strong
      as his future self, for the resurrection process only altered his mortality.
      Recounts to have fished megalodons with but a line and a hook, logically dragging
      them out of water as well; such fish are estimated to have had a weight of several
      tens of tons. Easily snapped all the bones in a sasquatch's body. Broke his
      wife Sasha's neck using only one hand and a yeti's neck with his mere fingers.
      Tossed Squirrel Girl high into the air using a single arm.Unbeatable Squirrel
      Girl Vol 2 6 The pressure of a trash compactor wasn't enough to even injure
      him. Has snapped the chain of a pair of handcuffs with extreme ease in multiple
