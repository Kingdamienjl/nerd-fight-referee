    - field: weaknesses
      value: 'He cannot manipulate magic and darkforce energy, the bands are permanently
        attached to his arms (although he can make them invisible), cannot directly
        manipulate psychic energy Notable Attacks/Techniques: -Energy Constructs:
        Unlike Green Lantern constructs, he does not need to concentrate to maintain
        them and they are permanent until they are desummoned or destroyed. They can
        be solid or permeable and can range in size to larger than the Earth, they
        are capable of tanking planet busting attacks and class 100 blows and can
        easily harm Herald-level targets. -Quantum Jump: Quasar opens a portal to
        the Quantum Zone and enters, then opens another portal back to the normal
        universe and exits, performing a sort of teleportation that can take him anywhere
        in the universe. Performing a quantum jump causes local gravity disruptions
        and other damage unless he contains it with an energy barrier -Energy Drain:
        Quasar can drain nearly any type of energy from an opponent or object such
        as a star Other: This Profile only covers the main Marvel Comics 616 version
        of Quasar (Wendell Vaughn) Category:Tier 4 Category:JHFjdnvfcmcd'
