        \ the actual Ultimate Nullifier, but any tangible connection between his powers\
        \ and the iconic weapon is unknown. == Explanations == At a first glance,\
        \ determining if the version of Eternity nullified was the Omniversal state\
        \ of the cosmic being is difficult, thus elaboration is necessary. Reed Richards\
        \ used the Ultimate Nullifier to reconstruct reality [and remove Abraxas and\
        \ his damage from it] specifically by targeting a version of Eternity. If\
        \ Reed targeted Universal Eternity, it's natural to conclude that only the\
        \ Universe was reconstructed. If Reed targeted Multiversal Eternity, it's\
        \ natural to conclude that the multiverse was reconstructed as a consequence.\
        \ Now, it is confirmed that the Ultimate Nullifier undid the damage Abraxas\
        \ wrought on reality. Abraxas's machinations were shown multiple times to\
        \ have caused damage across the multiverse, particularly concerning variants\
        \ of Galactus. * Abraxas killed a variant of Galactus from somewhere in the\
        \ multiverse of alternate realities, and stood within countless Galactus corpses.Fantastic\
        \ Four Annual 2001 (Vol. 1) #1; 2001 * Abraxas killed the Galactus of a Nova\
        \ variant's reality, and used his skull as a homing beacon to navigate the\
        \ multiverse.Fantastic Four (Vol. 3) #46; 2001 * Abraxas boasts about having\
        \ killed Galactus's other selves throughout the multiverse. * With the death\
        \ of Galactus from Earth-616, Abraxas was free to roam the dimensions, killing\
        \ every version of Galactus he found.All-New Official Handbook of the Marvel\
        \ Universe A to Z (Vol. 1) #1; 2006 * The arrival of Abraxas caused Earth-616\
        \ to merge with various alternate realities. Since Reed had to undo damage\
        \ that spanned the multiverse, it's only logical that he couldn't have targeted\
        \ merely a Universal manifestation of Eternity. Keep in mind that while Reed\
        \ was stated a couple of times in guidebooks to have nullified the Universe,Marvel\
        \ Encyclopedia (Vol. 1) Fantastic Four; 2004 this isn't mutually exclusive\
        \ with him 'destroying the whole of reality and recreating the multiverse,'\
        \ which is something he was also said to have done in secondary material.\
        \ == References == {{discussions|The-Ultimate-Nullifier|The Ultimate Nullifier}}\
