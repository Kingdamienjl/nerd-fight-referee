  intelligence:
    text: 'At least Average This version of Loki is extremely smart from a common
      alligator''s standpoint, and is fully human in intellect and reasoning capability.
      Nonetheless, his fundamental animalistic nature and his boundless gluttony often
      take the advantage of him depending on his mood swings.Alligator Loki: Infinity
      Comic Vol 1 6Alligator Loki: Infinity Comic Vol 1 10Alligator Loki: Infinity
      Comic Vol 1 22 Furthermore, he appears to be quite childlike in several aspects.Alligator
      Loki: Infinity Comic Vol 1 31 He is a somewhat capable deceiver and several
      of his adventures involve conjuring various trickeries, occasionally alongside
      his counterpart. Alligator Loki has a number of various skills which he puts
      at use for his different exploits, often surprising the indivisualds he iinteracts
      with. Upon hearing of Mjolnir''s arrival, Alligator Loki instantly calculated
      its tajectory and leaped with the precise timing he needed to catch the hammer''s
      handle. Has rudimentary knowledge of english writing.Alligator Loki: Infinity
      Comic Vol 1 17 Had some innate brawling skill and improved upon visitin K''un-Lun.
      Appears to have learned magic from regular Loki and his able to cast some spells.
      Managed to somehow link asgardian machines to a very earthen inflatable chair.'
    source_ids: *id002
