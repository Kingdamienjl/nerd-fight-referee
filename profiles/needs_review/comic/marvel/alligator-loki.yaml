    destroy things. The horns on his headgear can be utilized as improvised weapons)
    *Longevity (Took a bite out ofAlligator Loki: Infinity Comic Vol 1 16 one of the
    Golden Apples of Idunn, which restore asgardians to their prime, extending their
    life and preserving their youth. Despite the gods requiring periodic consumption
    of the fruit to remain immortal, even a single one should have extended Alligator
    Loki''s lifespan) *Acrobatics (Pulled himself backwards upon being caught in-mid
    air by Thor.Alligator Loki: Infinity Comic Vol 1 4 Caught grip of Mjolnir by leaping
    vertically out of water.Alligator Loki: Infinity Comic Vol 1 7 Caught Throg in
    mid-air, although it took him two tries. Can perform jumping uppercuts. Skillful
    in the usage of ropes, having used one to commit theft, save a friend and dodge
    Throg''s Frogjolnir) *Minor Martial Arts (Received basic martial arts teachings
    from Iron Fist, Lin Lie and Pei.Alligator Loki: Infinity Comic Vol 1 39 Was able
    to perform various techniques during a playful frenzy, unaware one of all the
    collateral damage he was causing) *Stealth Mastery (Planned and carried out [together
    with a bunch of accomplices] a heist to steal cookies from the highly-secured
    Avengers Mansion. The plan almost failed and resulted in the capture of Jeff the
    Land Shark, but only because of sheer unluck. Alligator Loki and his associates
    then successfully rescued Jeff from detention and escaped unpunishedAlligator
    Loki: Infinity Comic Vol 1 41Alligator Loki: Infinity Comic Vol 1 42) *Fire Manipulation
    (His matches produce impossibly large and destructive quantities of flames which
    burned the entirety of K''un-Lun to ashes in a small amount of time) *Magic (Basic.
    While apparently lacking in supernatural skills, Alligator Loki began to display
