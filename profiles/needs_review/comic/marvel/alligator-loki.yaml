    - field: powers_and_abilities
      value: "Illusion Creation, Invulnerability, Perception Manipulation, Shapeshifting,\
        \ Transmutation, Duplication, Invisibility Limited Subjective Reality (3 Layers;\
        \ As the God of Mischief, Loki excels in illusions. He is able to create holographic\
        \ illusions, concealing him as different mortals which are precipitable to\
        \ the outside world, even to beings who otherwise have enhanced sensesThor:\
        \ Love and Thunder. He disguised himself as OdinThor: The Dark World twice,\
        \ copied himself as Captain America and an Asgardian, changed his clothes\
        \ from a suit to his armor, made copies of himself against his fight with\
        \ ThorThor, and did the same in his first arrival on Earth,Avengers made an\
        \ illusionary identical clone of himself with verbal communications, locomotion,\
        \ and senses countless times; such as with tricking Agent Coulson, projecting\
        \ himself in SakkarThor: Ragnarock, and even going at the length to conceal\
        \ an entire room with all its furniture. However, his illusions aren't restricted\
        \ to this. Loki is able to induce any type of concealment he so wishes, with\
        \ him projecting Thor's hand torn off by his knife, him dying, even abbreviating\
        \ the neurology, skin, and breath of the clone he \"killed.\" All of Loki's\
        \ clones are invulnerable to physical attacks, even so much to the point that\
        \ characters that can outright predate on abstract concepts are subject to\
        \ it's concealmentLoki Season 1, Episode 5 \"Journey into Mystery\". Loki's\
        \ illusions can even extend so much to be tangible through rearranging moleculesMarvel\
        \ Website: Loki. Such as him outright turning into a snake which Thor could\
        \ pick up as a child, turning Thor into a real frogThor Deleted Scenes , and\
        \ conjuring real Asgardian weapons. Loki can also make himself \"invisible\"\
        \ by tricking others' minds. He can conceal his presence and that of others\
        \ from Heimdall. Can choose certain individuals in a group to sense him, such\
        \ as when he appeared before Thor but not on S.H.I.E.L.D. security cameras,\
        \ and let Selvig listen to his persuasion while blocking Fury's ability to\
        \ do so) Memory Manipulation and Power Nullification (Separated Odin from\
        \ his powers and removed his memories, who took a while to shake off his enchantmentsMarvel\
        \ Website: Odin. Made Valkyrie relive painful memories and telepathically\
        \ go into people's memories) Telekinesis (Flung all the furniture in his room\
        \ with a single flick, telektncially grabbed a wheel from a counterLoki season\
        \ 1, episode 2 \"The Variant\", lifted a huge building with his telekinesisLoki\
        \ season 1, episode 3 \"Lamentis\") Energy Projection (Can shoot blasts of\
        \ green energy) Teleportation, Dimensional Travel, and BFR (Is stated to have\
