        a smaller mechanical weapon from its metal kneecap. * Downwards Punch: Sentinel
        engulfs its fist in energy and extends its arm to punch the opponent. * Neutralize:
        Sentinel opens up its mouth and spews forth a laser from it. In Marvel vs.
        Capcom 3 onwards, this electrifies the opponent. |-|Throws= * Ground Throw:
        Sentinel grabs the opponent in-front of it and throws them backwards. |-|Special
        Attacks= * Rocket Punch: Sentinel releases and extends its fist, punching
        the opponent in its extended range. * Sentinel Force: Sentinel calls forth
        three smaller rocket-like Sentinels to attack the opponent. In Marvel vs.
        Capcom 3 onwards, these set the opponent on fire. * Flight Mode: Sentinel
        is able to fly freely in the air using its thrusters. * Human Catapult: Sentinel
        grabs the opponent in-front of it and fires at them point blank with its laser,
        launching them backwards. |-|Hyper Combos= * Plasma Storm: Sentinel puts out
