    - field: durability
      value: "Miles' body is physically tougher and more resistant to some types of\
        \ injury than the body of a normal human. His body is also more resistant\
        \ to impact forces than most humans. He can withstand great impacts, such\
        \ as being thrown through a plate-glass window, that would severely injure\
        \ or kill a normal human. Miles has been shown capable of showing no and little\
        \ discomfort when he had a wooden stick and a beer mug break against him,\
        \ respectively.&#91;197&#93; During an altercation with the Roxxon mercenary\
        \ Taskmaster, Miles was thrown through a brick wall without any apparent serious\
        \ injury, though the experience was a little bit painful for him.&#91;72&#93;\
        \ Superhuman Agility: Miles' agility, balance, flexibility, and bodily coordination\
        \ are all enhanced to levels that are far beyond the natural physical limits\
        \ of an Olympic-level gymnast. Superhuman Equilibrium: Miles possesses the\
        \ ability to achieve a state of perfect equilibrium in any position imaginable.\
        \ He seems able to adjust his position by instinct, which enables him to balance\
        \ himself on virtually any object, no matter how small or narrow. Superhuman\
        \ Reflexes: Spider-Man's reflexes are similarly enhanced and are currently\
        \ about 20 times greater than those of an ordinary human. In combination with\
        \ his spider-sense, the speed of his reflexes allows him to dodge almost any\
        \ attack.&#91;citation needed&#93; Wallcrawling: Miles can cling to any surface\
        \ using just his fingertips and feet. The extent to how much pressure he can\
        \ stick to walls is thus far unknown, except that he can handle lifting his\
        \ own weight. Spider-Sense: When danger is present, Miles feels a buzzing\
        \ sensation in his head as a sort of early warning system, allowing him to\
        \ react accordingly. His spider-sense offers him near complete awareness of\
        \ his surroundings, and in conjunction with his reflexes, allows him to instinctively\
        \ dodge or counter nearly all attacks. Miles' Spider-Sense is more developed\
        \ than that of some other spider people; it can identify who poses danger\
        \ is and if he has encountered them.&#91;171&#93; He also believes he can\
        \ push it to sense an area and pick up traces of people to track them.&#91;198&#93;\
        \ Radar Sense: Following the therapy that restored his Spider-Sense, Miles\
        \ discovered that he can take this power to a deeper level. By focusing his\
        \ Spider-Sense and using breathing techniques, he can see through solid matter\
        \ to be aware of potential threats. It is still underdeveloped, as the targets\
        \ he sees appear only vaguely humanoid.&#91;199&#93; This sense expands 360\
        \ degrees around Miles, as he was able to sense an entire room and find someone\
        \ hiding just outside it.&#91;173&#93; It also let him see through the roof\
        \ of a building to \"see\" a sneak attack.&#91;171&#93; Venom Strike Electricity\
        \ Generation: Miles is able to generate and manipulate a form of bio-electricity\
        \ that his body produces, and can utilize the energy for multiple purposes.\
        \ Miles has learned to discharge the energy from his hands in controlled bursts\
        \ of what he calls \"Venom Blasts\". These energy projections vary in power,\
        \ and can affect the nervous system in humans and destroy technology. Depending\
        \ on the intensity of the Venom Blast, some opponents have been simply dazed,\
        \ where others have been completely incapacitated. It also seems more effective\
        \ on people with genetic alterations, such as the Green Goblin and Venom.\
        \ The venom strike is powerful enough to render Cassandra Lang unconscious\
        \ while she was large as Hank Pym's Giant-Man.&#91;61&#93; It was also enough\
        \ to drive away Venom during Miles' first encounter with the creature,&#91;71&#93;\
        \ although by their second encounter, Venom had developed such a tolerance\
        \ to the strike that Miles had to be completely enveloped by the symbiote\
        \ before the venom strike could separate the symbiote from its host.&#91;72&#93;\
        \ Doctor Octopus also developed a set of tentacles that would not conduct\
        \ the venom strike.&#91;200&#93; Max Power: Miles is able to use his venom\
        \ energy to power himself up and transform into what he calls his \u201Cmax\
        \ power mode\u201D. In this state, Miles is far stronger, faster, more durable\
        \ and his venom energy is at its strongest.&#91;201&#93; Mega Venom Blast:\
        \ Miles is able to emit a larger scale burst of bio-electricity from his entire\
        \ body, that he calls the \"Mega Venom Blast\". It is powerful enough to repel\
        \ a large group of opponents and destroy thick ropes and chains that have\
        \ been used to restrain him,&#91;202&#93; as well as destroy much of the Hydra\
        \ laboratory Miles was being held in.&#91;91&#93; This ability leaves Miles\
        \ exhausted after using it, and can be triggered by extreme stress, or focus\
        \ on Miles' part, as he consciously activated it in his escape from Black\
        \ Cat.&#91;202&#93; Venom Beam: Miles showed he could channel his bio-electricity\
        \ outward as a direct burst of electrostatic energy to knock away enemies\
        \ in a stunning/concussive manner.&#91;203&#93;&#91;204&#93; Venom Punch:\
        \ Miles can enhance the power of his punches b"
