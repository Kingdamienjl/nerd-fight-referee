    - field: weaknesses
      value: 'The Silver Surfer rarely fights to truly kill, and often does not use
        his abilities to their fullest extent. Although his body does not require
        sleep, his mind still does in order to give it an opportunity to dream. The
        Surfer is extremely reliant on his cosmic power and is more of a fighter in
        his surfboard than without it. Notable Attacks/Techniques: *Time Travel: The
        Surfer can travel backward or forward in time an undetermined amount (at least
        millions of years both ways). He can take other people or objects with him
        if they are riding his board. When traveling back in time, he can affect the
        past and change the course of history (which he did so against the Overlord
        in Silver Surfer Volume 1) *Transmutation: Norrin can transmute matter into
        other states, ranging from things as simple as turning sand to gold, to restructuring
        complex alien weapons to emit nothing but harmless light *Energy Manipulation:
        The Silver Surfer can harness nearly any form of energy, from ambient heat
        and light to the power of an entire star, to magic and souls, to the primordial
        cosmic energies of the universe itself. He can transform these energies into
        other types, and direct them to create many different types of effect'
