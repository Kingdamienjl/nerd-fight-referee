    - field: intelligence
      value: 'Above Average (Storm has been the leader of the X-Men and thinks of
        creative ways to use her powers in almost any situation, and is aware of the
        effect her powers have on the planet. Served on the governing bodies both
        mutant nations, Krakoa and Arakko, while also being the regent/representative
        of the entire Solar System to the rest of the universe. Is an expert at pickpocketing
        and lock picking. Picked a lock designed by T''Challa to not yield to science
        or magicDoomwar #1) Standard Tactics: Storm often refrains from using her
        full strength for several reasons. Storm more often than not refrains from
        killing, but will if necessary. Storm tries to be careful about the ways she
        alters the weather in one location because it will affect the weather in another
        part of the world. Lastly Storm refrains from using her more powerful abilities
        in populated areas out of fear of collateral damage.'
      source_id: vsbattles-black-panther-classic-marvel
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Storm''s power is affected by her emotions and her willpower. Overuse
        of her powers can cause extreme exhaustion. If she becomes enraged, she can
        cause devastating storms. Storm''s godhead powers vary based the amount of
        people that have faith in her. She formerly had severe claustrophobia, and
        is sometimes depicted as being very arrogant and aggressive. Notable Attacks/Techniques:
        -Electricity Manipulation: Storm''s most common method of offense, she can
        fire a real, natural lightning bolt from the sky, shoot lightning from her
        hands, create EMP''s, manipulate and perceive electromagnetic fields, screw
        with a person''s bio-electricity and generate electrolysis, allowing her to
        breathe underwater. She can even use cosmic lightning bolts in space. -Wind
        Manipulation: Uses the wind as a powerful attack. Her control over wind is
        powerful enough that Storm can instantly create large tornadoes and make vacuums
        that suck away the air. She also uses the wind to make herself fly and increase
        her physical strength. Her winds even managed to affect the Hulk. She can
        also use solar winds. -Flash Flood: Storm can instantly create a flood of
        water. -Flash Freeze: Manipulates the temperature to instantly freeze her
        opponent solid. -Humidity: Storm can increase the temperature to extremely
        high degrees. -Acid Rain: Storm is capable of causing acid rain to fall down
        on her enemies. -Hurricane: Storm can create large scale hurricanes. -Hail:
        Can rain hail down on her enemies. -Hydrogen Bomb: Storm gathers hydrogen
        into a particular area and then uses electricity within that area to ignite
        it, causing a massive explosion. -Atmospheric Pressure: Storm can affect the
        pressure of the atmosphere to her will. -Fog: She can make a fog thick enough
        to hide herself in. She can make it acid for offensive corrosive purposes.
        -Pressure Field: Storm can create a field of pressure around herself and use
        it as a shield. -Telepathy Protection: Storm''s electrical powers in combination
        with her will power gives her protection from telepathy. Notes: *Storm was
        capable of wielding a magical duplicate of Thor''s mystic Hammer Mjolnir,
        created by Loki. *Before making any changes to this page, please read and
        follow the Power-scaling Rules for Marvel and DC Comics. ==Notable Matchups==
