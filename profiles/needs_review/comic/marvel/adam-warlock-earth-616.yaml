        Matter Manipulation (Magus used it to destroy and reform atoms to play around),
        Existence Erasure (Magus planned to erase Adam Warlock from history entirely,
        leaving no trace or memory of his existence behind.Infinity War #6 Thanos
        caused half of all life in the universe to blink out of existence with a snap
        of fingersInfinity Gauntlet #1), Portal Creation, Void Manipulation (Turned
        The Ultimate Nullifier back against Quasar, causing its sphere of annihilation
        to consume him instead), Sealing (Thanos easily imprisoned all of the Abstracts
        with the Gauntlet in handInfinity Gauntlet #5), Biological Manipulation, Information
        Manipulation (The Infinity Stones are access points to the source code of
        reality,All-New Guardians of the Galaxy #10 and through them, one can reprogram
        the simulation that is their universe at will), Nigh-Omniscience, Cosmic Awareness,
        Time Travel, Vector Manipulation, Energy Manipulation (The Power Stone grants
        access to the energy that permeates all of reality and acts as the glue holding
        existence in place, backing the other Gems with infinite power and amplifying
        their capabilities to sculpt the universe), Black Hole Creation (Hulk created
        a black hole to swallow Devondra using the Space StoneInfinity Wars #6), Mind
        Manipulation and Telepathy (The Mind Stone allows one to reach out and feel
        the minds of every sentient being in the universe,Silver Surfer Vol. 3 #45
        as well as alter them to the user''s liking, with Magus stating that the thoughts
