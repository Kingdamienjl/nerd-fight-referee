        \ primarily psychological in nature. Those mutated by the Gamma Radiation\
        \ used in the Gamma Bomb have their innermost desires and psychological status\
        \ manifested as mutations. As such, the Hulk\u2019s powers are in actuality\
        \ malleable. For example, as his rage increases, not only does the Hulk increase\
        \ in power, shaking off attacks and powers that previously overwhelmed him\
        \ and surviving things he could not before. However, due to Banner\u2019s\
        \ shattered psyche and psychological trauma, this can also manifest as weaknesses\
        \ and split forms, giving each mental aspect, subconscious fear, and psychological\
        \ compulsion some level of tangible repercussions on the Hulk."
