      value: Thor's tendency to hold back against foes of Earthly roots, as he fears
        his full might may destroy them, sometimes results in Thor being caught by
        surprise. His statistics amplification methods have severe drawbacks (Using
        Megingjord will later leave Thor in such an exhausted state he can barely
        walk, while the Warrior's Madness robs Thor of his ability to differentiate
        between friends and foes). He has sometimes been portrayed as susceptible
