        weapons and fighting many kinds of foes across the universe. He will exploit
        an enemy's weak points to his advantage amid battle. Thor can devise plans
        that can fool even his most cunning foes when the situation calls for it,
        such as Loki or Malekith the Accursed. He is also a highly skilled medical
