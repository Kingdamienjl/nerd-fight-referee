    - field: intelligence
      value: Gifted (Despite his usual tendency to charge head-first into battle,
        Thor is a veteran warrior with thousands of years of experience using different
        weapons and fighting many kinds of foes across the universe. He will exploit
        an enemy's weak points to his advantage amid battle. Thor can devise plans
        that can fool even his most cunning foes when the situation calls for it,
        such as Loki or Malekith the Accursed. He is also a highly skilled medical
        doctor, although he no longer practices the profession. The magic of the Runes
        and knowledge from the Well of Mimir formerly gave him the knowledge of Odin
        and even allowed him to surpass his father; he could see into the past, present
        and future simultaneously, beyond quantum structure, and beyond cosmic architecture)
