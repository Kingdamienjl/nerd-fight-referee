    - field: intelligence
      value: Gifted in combat (Logan is over 200 years old, meaning he has lived longer
        than his counterpart had, thus he likely compares to him in that he has experienced
        nearly every single major war and conflict from the latter half of the 19th
        century and onwards, as evidenced by his memories showing he's lived a similar
        life to the latter when Cassandra Nova infiltrated his mind, and the fact
        that he recognized Sabretooth. Aside from sharing experiences with his counterpart,
        he has his own long history of killing, having slaughtered those who went
        on a hunt for mutants that killed the X-Men of his world. In this rampage,
        Logan kept on killing relentlessly without stop, even taking lives those who
        weren't involved, which may have included members of his world's Avengers
        given he expresses resentment for them. This killing spree was so great, that
        Logan singlehandedly tarnished the X-Men name and turned the world against
        them. On other accounts, he proves a fiercely skilled fighter by going toe-to-toe
        with and nearly killing Deadpool; a highly skilled, successful ex-special
        forces operative and former mercenary. Later on, Logan once again goes toe-to-toe
        with Wade for hours on end and even defeats him. Furthermore, he took down
        several members of the Deadpool Corps alongside Wade. He proves himself to
        be a resourceful and cunning foe, moving on all fours to intercept Wade's
        bullets with his shoulder pads and slashing his Desert Eagles to force him
        to fight up close, as well as distracting Cassandra Nova for long enough to
        be subdued by Wade. Before fighting the Deadpool Corps, he took advantage
        of their love for Dogpool in order to force them to hold their fire. Logan
        is an observant individual, quickly identifying a Sentinel leg and using it
        as a makeshift rocket to get away from Cassandra Nova's lair and Alioth alongside
        Wade)
