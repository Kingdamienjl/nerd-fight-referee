        at the opponent, exploding on-contact. When performed in the air, he tosses
        them diagonally downwards. *Trick Card: Same as Kinetic Card, except that
        Gambit tosses a deck of cards at an upwards angle instead to hit an aerial
        opponent, utilizing them as an anti-air attack. *Cajun Slash: Gambit unleashes
        one of three different attacks with his staff; either doing a quick one-hit
        swipe, running three-hit underhand combo (upwards, then again upwards in another
        direction and a forward poke) or three consecutive staff slashes (downwards
        jumping swipe, then upwards and again downwards). *Cajun Escape: Gambit leaps
        forwards or backwards toward the wall, grabbing onto it and then quickly hops
        over to the other wall, able to perform a second wall jump before falling.
