    - field: weaknesses
      value: 'None notable. Notable Attacks/Techniques: GambitThrowMvC.gif|Kinetic
        Charge GambitThrow2MvC.gif|Staff Slam *Kinetic Charge: Gambit grabs the opponent
        with his left hand, charging them with kinetic energy before kicking them
        away as they explode. *Staff Slam: Gambit grabs the opponent, jumps forward
        to knock them to the ground and slams his staff three times before hopping
        off. *Air Throw: Gambit presses off the opponent with both legs, sending them
        crashing against the ground. KineticCardMvC2.gif|Kinetic Card TrickCardMvC2.gif|Trick
        Card CajunSlashLight.gif|Cajun Slash (Light) CajunSlashMedium.gif|Cajun Slash
        (Medium) CajunSlashHeavy.gif|Cajun Slash (Heavy) CajunEscapeMvC.gif|Cajun
        Escape CajunStrikeMvC.gif|Cajun Strike *Kinetic Card: Gambit pulls out a deck
        of three cards and then throws them forward at the opponent, exploding on-contact.
        When performed in the air, he tosses them diagonally downwards. *Trick Card:
        Same as Kinetic Card, except that Gambit tosses a deck of cards at an upwards
        angle instead to hit an aerial opponent, utilizing them as an anti-air attack.
        *Cajun Slash: Gambit unleashes one of three different attacks with his staff;
        either doing a quick one-hit swipe, running three-hit underhand combo (upwards,
        then again upwards in another direction and a forward poke) or three consecutive
        staff slashes (downwards jumping swipe, then upwards and again downwards).
        *Cajun Escape: Gambit leaps forwards or backwards toward the wall, grabbing
        onto it and then quickly hops over to the other wall, able to perform a second
        wall jump before falling. He can follow up the move with a downwards staff
        slash. *Cajun Strike: Same as Cajun Escape, except that Gambit automatically
        attacks with a diving kick at an diagonal angle. *Royal Flush: Gambit tosses
        his bo staff upwards into the air and starts rapidly throwing a near-full
        deck of energy-charged cards one by one at the opponent so fast they travel
        in a blur (totaling in 37 cards), making them explode by snapping his fingers.
        When tossed, Gambit''s staff can knock a flying opponent and send them flying
        straight down where he tosses a barrage of Kinetic Cards. *Cajun Explosion:
        Gambit jumps high into the air either forward or backwards and then summons
        a wave of five pillar-like shockwaves by firing his kinetic energy diagonally
        downwards which travel forward, working similarly to Magneto''s Magnetic Shockwave.
