        \ otherwise known as the King's in White also known as The Beyonders, existing\
        \ within the higher-plane of the Un-BeyondVenom (Vol. 5) #18The King's In\
        \ Black serve as a dual-equal to that of The King's In White, with the analogy\
        \ being that of \"Light and Dark Magicians\" , This is important as a singular\
        \ Beyonder was capable of combating the likes of Thor, Hyperion, and Starbrand\
        \ simultaneouslyNew Avengers (Vol. 3) #32) | Outerverse Level with Universal\
        \ Destructive Capacity via All-Black, The Godslayer (It's stated that Thor\
        \ of Earth-14412 utilized the All-Black to defeat the likes of Galactus, which\
        \ the symbiote bonded with, causing him to go on an absolute rampage devouring\
        \ worlds across the cosmos. It's further stated that amongst the abilities\
        \ of The All-Black it has the ability to engulf celestial bodies and potentially\
        \ even that of the universe itself.\"Attack Potency \u2260 Destructive Capacity\"\
        \ effectively meaning that the potency to destroy something can be lesser\
        \ than the Attack Potency someone can deploy), Outerverse Level via Godbomb\
