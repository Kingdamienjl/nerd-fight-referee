power_scale:
  tier:
    text: Low 1-A for normal Celestials, higher for the stronger ones | 1-A | 1-A,
      higher with Preparation
    source_ids: &id002
    - mediawiki-5635
    confidence: 0.8
  attack_potency:
    text: "Low Outerverse level for normal Celestials (Kubik stated that his and Kosmos'\
      \ powers were as nothing compared to that of a single Celestial, who was also\
      \ described as several orders of magnitude above them both and capable of easily\
      \ destroying them if it saw fit, and an alternate version of the Beyonder held\
      \ the power of the race in deep respect.Guardians of the Galaxy Vol. 1 #46 Arishem\
      \ is described as immeasurably more powerful than the combined power of Skyfathers\
      \ such as Odin, Zeus and Vishnu, and the Fourth Host later easily demolished\
      \ the Destroyer Armor, who was empowered by the combined lifeforce of Odin and\
      \ every Asgardian. A Celestial was shown being formed from the compression of\
      \ an explosion that was described as rivaling the Big Bang. Comparable if not\
      \ superior in both power and dimensionality to the Watchers, who exist on transfinite\
      \ levels of realityAvataars: Covenant of the Shield #1), higher for the stronger\
      \ ones (Exitar is so powerful that the size and power of the Fourth Host is\
      \ nothing to him,Thor Annual #14 and The One Above All is more powerful still,\
      \ being the commander of the Fourth Host and the entire race) | Outerverse level\
      \ (Can manifest on the same level of existence as Abstracts such as Eternity\
      \ if need be, attending meetings of the cosmic council as required. Scathan\
      \ the Approver was able to easily subdueGuardians of the Galaxy Vol. 1 #50 the\
      \ Protege after the latter had copied a manifestation body of The Living Tribunal\
      \ and surpassed the likes of Eternity and the Hawk God,Guardians of the Galaxy\
      \ Vol. 1 #49 although he had not reached the Tribunal's own level yet) | Outerverse\
      \ level+ (Celestials do not have alternate universe counterparts as lesser beings\
      \ do, with their appearances in single realities being interlinked aspects of\
      \ a single entity. Comparable to other Multiversal Abstracts, and are capable\
      \ of doing battle with the Aspirants, who can threaten Lifebringer Galactus),\
      \ higher with Preparation (The detonation of their \"unimaginable weapons\"\
      \ during the Celestial War shattered The First Firmament into pieces, reducing\
      \ him to a small fragment of his former self and creating the Second Cosmos\
      \ in the process.Ultimates\xB2 #6 Initiated the Big Bang that birthed the Seventh\
      \ Cosmos,Venom Vol. 4 #4 with Logos stating that the Celestials \"created the\
      \ multiverse itself, in fire and conflagration at the dawn of all things.\"\
      Ultimates\xB2 #4 Created the BeyondersDefenders: Beyond #2 and the Kings in\
      \ Black, the Beyonders' dark oppositesVenom Vol. 5 #18)"
    source_ids: *id002
    confidence: 0.8
