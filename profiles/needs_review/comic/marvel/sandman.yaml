  intelligence:
    text: Above Average, possibly Gifted (Sandman is often mistaken for an idiot by
      both allies and foes, mostly because of his harsh and hot-heated attitude, but
      he has demonstrated many times to be much more than just brawn. He is a seasoned
      individual, with many years of experience in either committing or fighting crime.
      Sandman has been part of many groups and their different iterations, most notably
      the Frightfoul Four, the Sinister Six, the Wild Pack, the Avengers and more,
      with his valor being recognized by the likes of the Wizard, Silver Sable and
      Captain America. In his life he clashed with a great variety of metahumans,
      each with their own special abilities. Sandman knows dozens of creative ways
      to employ his powers, and has stated from time to time to having learned new
      tricks and applications, as well as having overcomed some of his weaknesses.
      In just a few minutes, he figured out he could transfer control of sand to others,
      while his alternate self took decades to learn it. Fought evenly with Spider-Man
      many times, and in a couple of occasions he managed to outsmart both Mister
      Fantastic and the Human Torch. Received science lessonsFantastic Four Vol 1
      61 from the Wizard, which allowed him to design his new costume. DisassembledAvengers
      Vol 1 333 a Doombot in moments, immediately understanding its structure. Knows
