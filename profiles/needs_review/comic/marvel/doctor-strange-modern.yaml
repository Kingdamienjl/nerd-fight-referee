    - field: durability
      value: 'Large Building level physically (Took hits from Morbius and a demonically-amplified
        Wolverine. While heavily disoriented, survived two buildings falling on him.Dr.
        Strange (2020) #2 Tanked a kick from a demonically possessed Silk who was
        twice as strong as usualThe Amazing Spider-Man Vol. 5 #51. Was sent flying
        across the world by a blow from a Zarathos-possessed Ghost Rider with only
        some blood from the mouth to show from it, from Ghost Rider Vol 9 #6), At
        least Galaxy level with Forcefields (The Crimson Bands of Cyttorak defended
        his physical body from a supernova at point-blank range. Can hold back the
        power of Borgo, a perfect clone of the Silver Surfer created out of the latter''s
        own energy. His invisible, automatic shields can protect him from Voltorg''s
        atomic lightning, which was claimed by Yandroth to have the power to "hurl
        stars from their paths", only leaving him stunned due to the impact of the
        blast), Up to Outerverse level at peak (Survived a psychic blow from Umar
        when she caught him off-guard after he momentarily put his magic shield down.
        Withstood beatings from the Mindless Ones in the Dark Dimension and blocked
        their beams with the Cloak of Levitation, during a period in time when the
        Mindless Ones were portrayed as a threat to Dormammu himself, Took a blast
        without any shielding from a serious and Hell-amplified Mephisto who was also
        amplified above his normal Hell-amplified self "a thousand-fold") and with
        his strongest forcefields (Strange''s forcefields managed to shield him from
        the battle between Dormammu and Eternity, one which Strange said threatened
        to destroy both Dormammu and Eternity and was also stated to have caused a
        "transdimensional holocaust", with Dormammu confirming Strange''s shields
        saving him from the clash. He and Clea using magic forcefields managed to
        shield against Dormammu''s attack which was further amplified by him drawing
        on the Dark Dimension for power, and they would''ve overpowered Dormammu together
        with their forcefields had Baron Mordo not sneak-attacked them. Blocked multiple
        attacks from a serious and Hell-amplified Mephisto who was also amplified
        above his normal Hell-amplified self "a thousand-fold"), higher with certain
        Artifacts and Spells (Capable of uniting his being with Eternity through the
        Eye of Agamotto, and vastly increase his magical abilities by merging with,
        or drawing power from beings as powerful as Arioch and Shuma-Gorath. Capable
        of imbuing his magic with the power of Cosmic Entities such as Lord Chaos
        and Master Order, allowing him to stand up to, and even overwhelm the likes
        of The In-Betweener)'
