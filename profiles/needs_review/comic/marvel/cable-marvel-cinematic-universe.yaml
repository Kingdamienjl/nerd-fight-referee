    - field: standard_equipment
      value: '* Armour Suit: Created by a designer named Melvin Potter, the suit is
        made of a light yet extremely durable material, with Murdock requesting it
        to be designed after the devil to reflect his devout Catholicism and be a
        symbol. The helmet is outfitted with a carbon nanotube-based alloy and red
        lenses in the eyeholes. The suit also included a pocket located on the left
        hip of the suit to allow Daredevil to store his Billy Club. After the Blip,
        Murdock would get his suits tailored by Luke Jacobson. These new suits function
        near identically to those made by Melvin Potter. * Billy Club: Created by
        Potter, it can be used as a short staff, or two individual sticks joined by
        a high tensile wire. Additionally, the sticks can be be separated. The Billy
        Club uses a special steel fibre composite cable that makes it nearly indestructible,
        allowing it to extend to a target or function as a grappling hook. Luke Jacobson
        would later upgrade the Billy Club to have a manrikigusari hidden inside of
        it.'
      source_id: mediawiki-cable-marvel-cinematic-universe
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'General= Gifted (Received summa cum laude from Columbia Law School,
        and is a very skilled lawyer) |-|Skill= {{Border|Scroll=yes|Visible=Yes|Content=
        Daredevil is an extremely skilled martial artist, and has been praised for
        his prodigal skill by other martial arts masters such as Stick, Elektra, Iron
        Fist, Nobu, and Bakuto. While casual, had the upper-hand on Maya Lopez, who
        3 years later would go on to fight evenly with HawkeyeHawkeye, S1E3Hawkeye,
        S1E5 and even Yelena Belova and Kate Bishop simultaneously.Hawkeye, S1E4 He
        consistently shows creativeness and adaptability in combat, such as using
        a gun attached to his hand to his advantage, running up a wall to escape a
        hold, and using his surroundings to his advantage to burn Nobu alive, who
        was about to kill him prior to that. }} Standard Tactics: Despite being a
        non-lethal fighter, Daredevil typically never holds back in a battle and brutalises
        his opponents whether they be a goon, henchman or arch-nemesis. He has hospitalised
        multiple criminals in this regard, with the first man he beat up having to
        eat through a straw for a month. However, he avoids intentionally killing
        anyone and typically limits himself to hand-to-hand combat with his Billy
        Club so as to not inflict lethal injuries. Younger opponents are one of the
        few exceptions to Matt''s ferocity as he has a notable sensitivity towards
        them, as seen when Stick tricked him into aiding his assassination of the
        Black Sky, when Elektra killed a young Hand ninja in front of him,Daredevil,
        S2E8 and when he came out of retirement to save Angela Del Toro from Muse.Daredevil:
        Born Again, S1E6 When facing young opponents, Matt will be visibly casual
        and not take the fight as seriously, as shown when he fought Maya Lopez during
        her first job for Kingpin in 2021. Noticeably, following the death of Foggy
        Nelson, Daredevil would become even more ferocious and comfortable with mutilating
        his enemies in battle, snapping the limbs of his opponentsDaredevil: Born
        Again, S1E2Daredevil: Born Again, S1E5 and going as far as to impale Muse
        through the shoulder with his Billy Club.Daredevil: Born Again, S1E7'
      source_id: mediawiki-cable-marvel-cinematic-universe
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Apart from his blindness, Daredevil has few weaknesses. But he inherited
        his father''s ferocity that can overtake him in some fights. He refuses to
        kill his opponents under most circumstances, but will potentially forgo this
        rule if he feels there''s absolutely no other way to protect his friends or
        his city. Has an emotional weakness for women and children, which was exploited
        by Kingpin to bait him into fighting Nobu at Pier 81. ==Notable Matchups==
