    - field: intelligence
      value: 'Above Average (As the leader of the Care Bears, Tenderheart is great
        at remaining level-headed even in some of the tensest situations. His quick
        thinking has got the group out of trouble numerous times. He has demonstrated
        mastery over the use of the Care Bear Stare and the other abilities granted
        to him by the symbol on his belly) Standard Tactics: As it is the goal of
        all members of the Care Bear Family to keep the world a caring place, they
        will try to avoid causing any degree of violence or pain at all costs. The
        go-to method of virtually every Care Bear and Care Bear Cousin is to use the
        Care Bear Stare. The effect the Stare has on its target(s) is a bit inconsistent.
        Occasionally, it will make the target happier and more friendly, thus unwilling
        to fight. Other times, the Stare will nullify effects such as corruption and
        mind manipulation, or it will shut down any of the target''s supernatural
        abilities. Generally, it is safe to assume the following: If the target is
        evil innately, Power Nullification is the most likely effect. If he/she is
        good-natured but is simply angry or fighting because they feel they must,
        Empathic Manipulation is the most likely effect. If the opponent is fighting
        because they are being forced to against their will, such as via Corruption,
        the Stare will nullify whatever effect is controlling them.'
