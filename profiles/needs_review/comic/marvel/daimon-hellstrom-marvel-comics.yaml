- id: claim-intelligence-b3b3c07a
  section: power_scale
  axis: battle_iq
  text: Extraordinary Genius. A renowned exorcist/demonologist who is knowledgeable
    in many myths and dead languages and has spent many nights studying occult arts
    to study ways to combat supernatural threats and challenge his father, Daimon's
    knowledge in satanic matters is such that even Doctor Strange respects it, and
    he was regarded by Yandroth to be a master of the occult on a level even superior
    to Strange. The Eye of Agamotto considered him a possible candidate for the role
    of Sorcerer Supreme.New Avengers Vol 1 Ch 55 Son of Satan is also very knowledgeable
    in non-satanic but still mystical matters.New Avengers Vol 2 Ch 5 Managed to track
    down his sister Satana despite her attempts to avoid this.Thunderbolts Vol 1 Ch
    155 He is also a skilled and creative combatant, being able to fight many foes,
    human or demonic, at once and use his abilities in the best way to surpass a challenge,
    such as surrounding a group of enemies he does not wish to harm with a fire barrier
    that will only burn them if crossed. Understood the plan of a group of splinters
    of Eternity before anyone else in the Defenders. Decided to torture an angel instead
    of killing it to scare satanists into making them loyal to him in hopes they'd
    hurt less people. Cleverly carried out a plan to manipulate Hawkeye and the Thunderbolts
    into resurrecting his wife and prevent a war in hell.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-ec40cfdc
  section: weaknesses
  axis: weakness
  text: 'Weakened by intense cold. Daimon is unwilling to kill, although he will if
    necessary, and has trouble controlling his emotions, sometimes falling in a berserked
    rage. Do note however that in more recent comics he has been portrayed as much
    more aggressive and sometimes willing to kill humans without hesitation, but less
    susceptible to the Darksoul''s influence. Struggles to read the minds of satanists
    | Weaker when outside of Hell. Notes: *Before making any changes to this page,
    please read the Power-scaling Rules for Marvel and DC Comics. *Hellstrom is extremely
    inconsistent, having been hurt by or unable to physically defeat characters he
    should be far stronger than based on other feats, such as Crossbones, Blade, Hellcat
    or Jessica Jones. As such this wiki favors the Handbook explanation of him being
    able to increase his physical statistics through magic, for consistency purposes.
    *While Daimon''s trident used to be a weapon that he stole from Satan, Daimon
    has since absorbed it as part of him and can summon it at will, and as such being
    separated from it is no longer a weakness for him. *While after Defenders 121
    Daimon temporarily lost his Darksoul, the source of his powers, and was weakened
    by it, he obtained it a few appearances afterwards in Hellstorm: Prince of Lies.Hellstorm:
    Prince of Lies Vol 1 Ch 3 Due to his few and inconsistent combat showings in this
    state, it has not received a key. *Daimon used to need to transform into his Son
    of Satan self to use his powers, however this has been shown to be his default
    and only state in newer comics. *Daimon held Satan''s place and power for a while,
    but eventually relinquished this position, keeping only a small portion of hell.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-290389d9
  section: abilities
  axis: hax
  text: "Base \u25BE= Superhuman Physical Characteristics, Immortality (Types 1, 3\
    \ & 4), Resurrection (Returned from his death at the hands of Daniel Drumm.New\
    \ Avengers Vol 2 Ch 31 Can resurrect others as well even after being deprived\
    \ of his position as a Hell Lord), Regeneration (Low-Mid, likely Mid - Ripped\
    \ out his own heart to let Ammit judge itHellstorm: Son of Satan Vol 1 Ch 3 and\
    \ it quickly went back into place.Hellstorm: Son of Satan Vol 1 Ch 4 Regenerated\
    \ from double impalement off-screen.Doctor Voodoo: Avenger of the Supernatural\
    \ Vol 1 Ch 4 Implied he could normally recover from a shot to the headHellstorm:\
    \ Prince of Lies Vol 1 18), Enhanced Senses (Could smell the trace of dark magic\
    \ in a man's tattoo and the fear of the prisoners of a drug cartel), Genius Intelligence,\
    \ Demon Physiology and a Master Sorcerer (Candidate for Sorcerer Supreme, and\
    \ should be superior to his sister), Hellfire, & Demonic Magic, Weapon Mastery\
    \ & Martial Arts (Often faces entire hordes of demons.Marvel Spotlight Vol 1 Ch\
    \ 12 Once an enemy named Mindstar lost his speed advantage against Son of Satan,\
    \ the latter could avoid all of his attacks.Son of Satan Vol 1 Ch 7 Even when\
    \ depowered, Daimon has shown significant skill in combatMarvel Fanfare Vol 1\
    \ Ch 59), Acrobatics (Backflipped over an attack from BlackheartFalcon Vol 2 Ch\
    \ 5), Temperature Manipulation, Fire Manipulation & Soul Manipulation (Can fire\
    \ rays of hell's very own heat, known as Soulfire or sometimes hellfire. Can shoot\
    \ this soulfire out of his hands, trident or out of the earth itself and surround\
    \ himself in its flames. It has been said to be more devastating than any physical\
    \ flame and can be used to bind demons possessing humans to the bodies they're\
    \ in.Marvel Spotlight Vol 1 Ch 19 Daimon can use his fire as a barrier and choose\
    \ what will be affected by it,Marvel Spotlight Vol 1 Ch 21/22 to the point of\
    \ sparing his love interest while killing all her identical, soulless clones.Marvel\
    \ Spotlight Vol 1 Ch 23 He can also use it to search for people,Hellstorm: Prince\
    \ of Lies Vol 1 Ch 8 exorcise demons without harming the humans they are possessingMarvel\
    \ Team-Up Vol 1 Ch 32 or hurt only the target's soul. It was stated to be hotter\
    \ than Hell's lakes,The Defenders Vol 1 Ch 93 which Daimon himself stated were\
    \ far hotter than the Human Torch's attacks), Chi Manipulation, Magic & Willpower\
    \ Manipulation (Daimon's soulfire was said to be all three of these. Soulfire\
    \ potency is related to the user's willpowerHoward the Duck Vol 1 Ch 14), Energy\
    \ Manipulation (The trident is a conduit used for focusing Hellstrom's powers.\
    \ Hellstrom can also release the Darksoul's power to defeat beings far stronger\
    \ than him, although he risks losing his humanity when doing thisSon of Satan\
    \ Vol 1 Ch 3), Elemental Manipulation (Hellstrom's trident is said to control\
    \ elements), Attack Reflection (The Netheranium Daimon's trident is made of can\
    \ reflect energy attacks, and he has used this ability in combat), Flight (Can\
    \ propel energy out of his trident to fly. While he could originally only cross\
    \ short distances with this technique, Hellstorm has been seen using this method\
    \ of self-transportation across longer distances. He has also sprouted wings in\
    \ demonic formHellstorm: Prince of Lies Vol 1 Ch 10 and can hover without the\
    \ use of either of these powersThe Last Defenders Vol 1 Ch 6), Body Puppetry (Forced\
    \ a woman to grip his trident when she touched it), Dimensional Travel, Teleportation\
    \ & Weapon Control (Can teleport to his trident's location, even crossing through\
    \ dimensions, or force it to come back to his hands.Marvel Spotlight Vol 1 Ch\
    \ 17 It's stated he can only do this if an intelligent being holds the trident,\
    \ as this causes the psychoreactive material it's made out of to activate, but\
    \ he has been able to ignore this restriction by using it when it was close enough\
    \ to him), Forcefield Creation (Daimon's trident protected him from a hard fall.\
    \ Helped Sersi and Silver Surfer make a forcefieldChaos War Vol 1 Ch 2), Summoning\
    \ & Weapon Creation (While Daimon's trident used to be just a weapon to him, it\
    \ has become a part of him, and he can summon it at will,Hellstorm: Prince of\
    \ Lies Vol 1 Ch 4 which also means he can also not be injured by it.Hellstorm:\
    \ Prince of Lies Vol 1 Ch 5 Can summon a flying chariot drawn by three demonic\
    \ horses, Hecate, Set and Amon, or a single demon horse named Iblis), Power Nullification\
    \ (Daimon's trident nullifies his father's powers. This does not affect Daimon\
    \ himself, or most other demon's powers, but has affected other Hell Lords such\
    \ as Satannish), Clairvoyance (Hellstrom's trident can be used as a means of entering\
    \ a trance and making spiritual contact with other mediums. Can throw bones bound\
    \ to demons to find the location of whatever he's searching on a planetary scaleJourney\
    \ Into Mystery Vol 1 Ch 633), Homing Attack (Can use the trident's psychic field\
    \ to automatically seek out the target), Earth Manipulation & Magma Manipulation\
    \ (Can command, destroy and melt the gr"
