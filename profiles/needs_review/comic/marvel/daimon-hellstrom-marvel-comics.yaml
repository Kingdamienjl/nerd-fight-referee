    - field: weaknesses
      value: Weakened by intense cold. Daimon is unwilling to kill, although he will
        if necessary, sometimes falling in a berserked rage. Do note however that
        in more recent comics he has been portrayed as much more aggressive and sometimes
        willing to kill humans without hesitation, but less susceptible to the Darksoul's
        influence. Struggles to read the minds of satanists, Weaker when outside of
        Hell, please read the Power-scaling Rules for Marvel and DC Comics., Hellstrom
        is extremely inconsistent, having been hurt by or unable to physically defeat
        characters he should be far stronger than based on other feats, such as Crossbones,
        for consistency purposes., Daimon has since absorbed it as part of him and
        can summon it at will, and as such being separated from it is no longer a
        weakness for him., While after Defenders 121 Daimon temporarily lost his Darksoul,
        the source of his powers, it has not received a key., Daimon used to need
        to transform into his Son of Satan self to use his powers, however this has
        been shown to be his default and only state in newer comics., Daimon held
        Satan's place and power for a while
