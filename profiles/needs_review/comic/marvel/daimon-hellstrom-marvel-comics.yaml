  intelligence:
    text: Extraordinary Genius. A renowned exorcist/demonologist who is knowledgeable
      in many myths and dead languages and has spent many nights studying occult arts
      to study ways to combat supernatural threats and challenge his father, Daimon's
      knowledge in satanic matters is such that even Doctor Strange respects it, and
      he was regarded by Yandroth to be a master of the occult on a level even superior
      to Strange. The Eye of Agamotto considered him a possible candidate for the
      role of Sorcerer Supreme.New Avengers Vol 1 Ch 55 Son of Satan is also very
      knowledgeable in non-satanic but still mystical matters.New Avengers Vol 2 Ch
      5 Managed to track down his sister Satana despite her attempts to avoid this.Thunderbolts
      Vol 1 Ch 155 He is also a skilled and creative combatant, being able to fight
      many foes, human or demonic, at once and use his abilities in the best way to
      surpass a challenge, such as surrounding a group of enemies he does not wish
      to harm with a fire barrier that will only burn them if crossed. Understood
      the plan of a group of splinters of Eternity before anyone else in the Defenders.
      Decided to torture an angel instead of killing it to scare satanists into making
      them loyal to him in hopes they'd hurt less people. Cleverly carried out a plan
      to manipulate Hawkeye and the Thunderbolts into resurrecting his wife and prevent
      a war in hell.
    source_ids: *id002
    confidence: 0.8
