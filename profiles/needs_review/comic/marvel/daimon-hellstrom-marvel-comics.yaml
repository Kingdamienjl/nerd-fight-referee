  attack_potency:
    text: 'Small Building level (When depowered, Daimon could fight Mad-Dog, who himself
      fought Moondragon and Hellcat.Defenders Vol 1 Ch 125 Fought Hellcat herself
      without breaking a sweat even when she attacked him). Planet level, High Universe
      level at peak with powers (Sersi believed his powers to be comparable to hers
      and Silver Surfer''s. Defeated an enemy who had been beating up Hulk for hours,
      giving him ample opportunity to get angry. Physically contended with an enemy
      comparable to Hulk and eventually subdued him with help from him and Namor.The
      Defenders Vol 1 Ch 108 Hurt Mephisto while he was posing as Maia, in the same
      issue where he defeated Silver Surfer and Hulk in one attack.The Defenders Vol
      1 Ch 99 Hurt an enemy who survived attacks from Namor, The Hulk, Dr. Strange
      and Valkyrie. Fought Valkyrie evenly and received similar damage from an explosion.Fear
      Itself: The Fearless Vol 1 Ch 10 One-shot a clone of Hyperion) Varies; at least
      High Universe level (), up to Low Outerverse level (Much stronger than before,
      absorbed his father''s powers when inheriting the Black Halo. Should be comparable
      to other Hell Lords outside of Hell like he is in it), Low Outerverse level
      in Hell (Hell Lords share a level of existenceSilver Surfer Rebirth: Legacy
      Vol. 1 #5, March 2024 with their realms,Hellstorm: Prince of Lies Vol. 1 #2,
      May 1993 with netherworlds being pan-dimensional realitiesThunderbolts 2000
      Vol. 1 #1, May 2000 infinitely transcendent of the universe.Doctor Strange and
      Doctor Doom: Triumph and Torment Vol. 1 #1, July 1989 Held back all of his Hell-Realm
      with help from Doctor Strange.Venom Vol. 2 #13.4, April 2012 Stated he could
      keep Mephisto, Satannish and Pluto as well as other Hell Lords "in check", and
      didn''t wage war on the former because he was afraid that the collateral damage
      would have ripped apart the Nether-Realms, not of his own defeat)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Infinite (Comparable to Hulk and Doctor Strange. Snatched his trident back
      from Satan by surprise and could block attacks from him ), Speed of Light flight
      speed with his chariot (Said to travel this fast) | Varies up to Infinite, Infinite
      speed in Hell (Much superior to before, comparable to Mephisto)
    source_ids: *id002
