      \ Avengers name by writing safeguards into the contract.Mighty Avengers #2 She\
      \ is a skilled negotiator, as she was able to calm Scorpion down before Spider-man\
      \ got in the way,She-Hulk (vol. 1) #4 convinced Hercules to pay a super villain\
      \ he injured,She-Hulk (vol. 1) #9 convinced several soldiers not to fire on\
      \ her for their own safety,She-Hulk (vol. 2) #38 used a time paradox to create\
      \ an opening.She-Hulk (vol. 2) #3 She is also a proficient hand-to-hand combatant,\
      \ trained by some of the greatest martial artists in the Marvel universe such\
      \ as Captain America and Gamora. A quick thinker, she tricked the Seeker into\
      \ crushing himself,The Savage She-Hulk #21 caused a pair of robots to crash\
      \ into each other,Sensational She-Hulk in Ceremony #2 saw through Mysterio's\
      \ tricks,The Sensational She-Hulk #2 wrapped her fist in insulation to defeat\
      \ Electro,The Sensational She-Hulk #58 set the Ranger and Boomerang against\
      \ each other,The Sensational She-Hulk #59 snuck out of a SHIELD prison by changing\
      \ back into Jennifer Walters,Marvel Graphic Novel No. 18 \u2013 The Sensational\
