        \ there is no point in making said distinction. * Kang destroying the timeline\
        \ during his fight with Ultron is attributed to Marvel Universe's mechanics\
        \ rather than Kang's own feat, as such there should be no assumption that\
        \ it'll work on a standard universe.Avengers Vol 4 1-6 * Before making any\
        \ changes to this page, please read and follow the Power-scaling Rules for\
        \ Marvel and DC Comics. ==Explanation== Nathaniel Richards is an incredibly\
        \ complicated character as there are multiple divergents of him along the\
        \ timestream. The wiki condenses them as such: * Nathaniel Richards, who was\
        \ to become Rama-Tut, but his life diverged when he was approached by a time-traveling\
        \ Kang at age 16, and became a hero under the name of Iron Lad, and then became\
        \ Kid Immortus. - Iron Lad * Nathaniel Richards, who became Rama-Tut, who\
        \ then became Kang, became Rama-Tut again, and later became Kang and didn't\
        \ change to another identity. There were many of these, but Immortus cleaned\
        \ up his own timeline by manipulating the Kangs into killing each other off\
        \ and then absorbed the memories of all into a single Kang. This Kang was\
        \ then killed by a variant who succeeded him. - Kang the Conqueror (Classic\
        \ Iteration) * Nathaniel Richards, who became Rama-Tut, who then became Kang,\
        \ became Rama-Tut again, and later became Kang and then eventually changed\
        \ to Immortus. This version of Kang was later made into an independent being\
        \ due to Kang\u2019s willpower to not turn, now with his own history - Immortus\
