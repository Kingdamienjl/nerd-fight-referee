      value: 'sorcerers on a far higher scale, in addition to their own spells. *Doctor
        Doom **It was stated by both Morgan Le Fay and Cagliostro that he knows all
        of their spells. Dracula also confirmed that Doom studied under Cagliostro.
        **Also, Kulan Gath repeatedly compared Doom to Doctor Strange and called them
        both Earth''s strongest sorcerers. **Candidate for Sorcerer Supreme, and was
        said by Scarlet Witch to even surpass Strange in magic knowledge (while this
        is not true, it shows how skilled of a sorcerer Doom is). Strange has also
        been concerned about Doom becoming Sorcerer Supreme should the position ever
        become open, having made sure that Clea would get the position in the event
        of his death so that Doom himself could not get it and noting that Doom knows
        some magic arts that even he does not. **Alongside Doctor Strange, Doctor
        Doom was deemed one of Earth''s top candidates for Sorcerer Supreme. **Strange
        himself indicated that the two of them were comparable in sorcery (calling
        himself and Doom "master sorcerers"), but still viewed himself as the better
        sorcerer.Infamous Iron Man #11 **Once portrayed as being comparable to Clea
        in a simulation.X-Men Vol. 6 #15 **Doctor Strange stated that he feared Doom
        more than he feared Tiboro, a mystic warlord and Sorcerer Supreme of the 6th
        Dimension. **Comparable if not superior to his mother Cynthia Von Doom, who
        Doctor Strange praised as an extraordinary mystic of considerable skill, as
        her magic writings and items were how Doctor Doom began to master the mystic
        arts. *Morgan Le Fay **Taught Doctor Doom a sizable portion of his magic skills,
        with Doom himself initially viewing her as one of the greatest magicians in
        history. **Overpowered Doctor Doom in a magic battle, albeit she caught Doom
        by surprise. **Candidate for Sorcerer Supreme **Doctor Strange viewed her
        as a powerful magician. *Baron Mordo **Constant rival to Doctor Strange, and
        can match a serious Doctor Strange in most of their encounters, though without
