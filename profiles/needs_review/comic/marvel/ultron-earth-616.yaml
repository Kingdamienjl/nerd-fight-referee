    - field: weaknesses
      value: 'Destroying his A.I from the inside will shut him down and defeat him
        even with the usage of the Infinity Stones Feats: *His blows altered the space-time
        of the universe he and The Watcher were fighting in. *Stated to be able to
        destroy galaxies with a thought. *Can harm The Watcher, who withstood being
        attacked by Ultron at this size. *Casually destroyed multiple planets with
        a single attack. * Stated to have wiped out all life in the universe in an
        unknown time frame. Notable Attacks/Techniques: *Portal Creation/Teleportation:
        Using the Space Stone, Ultron can open portals or teleport to any location
        in his universe. After becoming aware of the Multiverse, Ultron became capable
        of opening portals and teleporting to various locations in the Multiverse.
        Was able to come back to Uatu''s dimension, which exists outside the Multiverse,
        after Uatu removed him from said dimension. *Reality Warping: Using the Reality
        Stone, Ultron can alter himself or the environment he is in, and create various
        objects with a thought or a gesture. Recreated his legion of Ultron Sentries,
        created a massive spherical transport for him and his legion, altered the
        environment multiple times in his fight against the Watcher with gestures
        or punches, and used it to become larger than a galaxy. * Energy Projection:
        Channeling the energy of the Power Stone or the energy of all Six Infinity
        Stones, Ultron is able to fire beams of energy from his lance where a single
        beam was capable of destroying all of Asgard, enhance the power of his punches
        generating large shockwaves, or release an omnidirectional blast of energy
        capable of destroying multiple planets such as Xandar and its neighboring
        planets. Notes: *WoG states that Thanos was overconfident when he came to
        Earth, and he let his guard down, which allowed Ultron to swiftly kill him.
        WoG proceeds to state in other scenarios that had Thanos been more careful,
        he would''ve simply killed Ultron. Thus, Ultron in Vision''s Body does not
        scale to or above Thanos in speed. *Vision does not scale to Ultron with the
        Mind Stone. This creates several scaling problems and contradictions, as well
        as it being stated that Vision was unable to unlock the Mind Stone''s full
        power, whereas Ultron likely did not have such a problem. ==Others== Notable
        Victories: Notable Losses: Inconclusive Matches: == Statistics Values == Category:StoneKillerz12
        Category:Tier 5 Category:Tier 4 Category:Tier 1'
