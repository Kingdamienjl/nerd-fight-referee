        how to use it. When Graviton essentially became a force of the universe, Black
        Bolt saw that the only way to deal with him is to hit him with antimatter.
        So, he created a plan and transmuted electrons into an antimatter bomb to
        try and get rid of him. Maneuverer swiftly between two hovercrafts and forced
        them to crashMarvel Team-Up Vol 1 11. As soon as he saw the Human Torch while
        hallucinating, he threw water at him, taking him out of the fight. When he
        realised too many enemies were around him, he pretended to be defeated so
        they can come close to him and then hit them with a sound attack. When Maximus
        betrayed his people to the humans, giving them a way to attack them and kill
        them, Black Bolt devised a plan on how to counter him and the humans. He allowed
        the humans to attack freely, making them think they were winning. At the same
        time, he allowed Maximus to move forward with his plans without much resistance,
        enabling him to get rusty with his plans. Thanks to Black Bolt''s planning,
        Maximus kidnapped Medusa and cut off her hair - Black Bolt was anticipating
        that. The idea was to have her hair be cut and test a theory - can Medusa
        control her hair when it''s not attached to her? Turns out she could. She
        was able to destroy the a key machinery powering Attilan, thus rendering it
        defenceless in every sense. The humans used this opportunity to attack them
        with everything they got, but Black Bolt wasn''t done yet. During this commotion
        where humans were attacking them and Maximus gloating about kidnapping his
        wife, Black Bolt strapped his loyal pet to a machine, enhancing it''s abilities
        to be able to transport an entire city. When the defences were down and Maximus
        defeated, the humans made their final and ruthless move. In that moment, Lockjaw
        teleported the whole city to Himalayan mountains, making everyone think the
        whole island was destroyed/gone somehow and it''s secrets lost to them. Around
        the same time, Black Bolt worked with his team to create a device that will
        keep Attilan hidden from anyone''s view in the Himalayan mountains. The Inhumans
        could exist in secret once more. This plan was not known to anyone in their
        island, except for Medusa and Karnak. The idea was to make everyone think
        this was the end, and it was the only way for his plan to eventually work.
        After his return/revival after War of Kings, Black Bolt had changed with a
        purpose. He had become more focused and scheming, as such, relied more on
        using his subjects instead of doing things himself. When he realised their
        plans could conflict with the Council of Reeds'', using Attilan''s resources
        and Inhumans, they were able to kidnap the Reed Richards'' and took them out
        of the play. Instructed Maximus to build newNew Avengers Vol 3 7 deadly weapons
        and equipment for his goals. A lot of Maximus'' plots and plans in modern
        times are orchestrated by Black Bolt himself. Was able to see through Thanos''
        plan - he had come to Earth to kill his son. Black Bolt always wanted to extended
        Inhumanity on Earth, this was always his inevitable goal. In order to achieve
        that, he had instructed Maximus to create a new T-Bomb that will engulf this
        world - and of course, not destroy the universe as an aftermath. This bomb,
        which will blow up with Attilan, will spread Terrigen Mist across the whole
        world, creating new Inhumans. When Thanos came to Earth, Black Bolt used that
        opportunity to slow him down and also create more Inhumans. Black Bolt used
        his Illuminati allies to find Thanos'' son and have them busy there so Black
        Bolt could ensure his Inhumanity plan went ahead. To ensure no one else can
        get in their way, he sent all Inhumans, including his wife, to another place
        on Earth. In an act of "self-sacrifice", Black Bolt showed the world he died
        as he created a new age of Inhumans. This allowed Black Bolt to hide into
        Shadows and ensure he can continue his operations with the Illuminati in secret
        - killing other universes. When everyone was busy trying to figure out how
        they survived an Incursion, only Black Bolt realised that Namor is not accounted
