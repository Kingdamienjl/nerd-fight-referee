      value: Extraordinary Genius (A skilled fighter and master tactician, capable
        of creating extremely advanced technology in all fields of science, and possesses
        vast mystical knowledge. Created a time machine. Improved life in the already
        futuristic planet Rigel-3 in several ways; Such as adding a couple of rungs
        in the beta-soy' genetic ladder to overcome the genetic problem that was limiting
        the plant's production, building new safeguards to better ensure their system's
        security, which he was previously capable of bypassing. He also made their
        planetary teleportation defense come online in half the time as previously
        required, sent them designs that would vastly improve the propulsion systems
        of their star fleet and stated that much of their technology seemed outdated
        compared to their galactic neighbors, which he could help them with) | Nigh-Omniscient
