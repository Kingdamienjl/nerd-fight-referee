- id: claim-weaknesses-ba46e5a8
  section: weaknesses
  axis: weakness
  text: 'She has also been subjected to conditioning in which a specific "trigger
    scent" has been used to send her into a berserker rage, killing anything in sight,
    and injuries such as being hit with blasts of energy from Nimrod that caused her
    to age can''t be healed, if she had been hit with it again she most likely would
    have died Feats: *Dodged Mr. Sinister''s blast point-blank *Cut Frank Castle''s
    gun before he could pull the trigger * Was turned to a skeleton by an explosion,
    and was walking again after a rather brief time: 1 2 3 4 *Kept fighting after
    a headshot *Was Gutted by Lady Deathstrike and managed to fight back. Quite soon
    she was entirely healed, without even a scratch on her stomach. *Her leg was run
    over by a train and it was immediately reset. *Fought several invisible opponents:
    1 2 *Survived for quite some time in the vacuum of space without any protection.
    Notes: *Due to how wielders of sharp adamantium weaponry have consistently been
    depicted as capable of harming characters far above their tiers, we are forced
    to list separate ratings for them to accommodate this. We are well aware that
    this technically does not make sense, but it is likely the least bad available
    option to not ignore this ongoing plot convention. Please note that this does
    not remotely scale to their base statistics/raw energy outputs. *This page only
    covers the Laura Kinney who debuted in NYX #3 as X-23. *Before making any changes
    to this page, please read and follow the Power-scaling Rules for Marvel and DC
    Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a7197c48
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Enhanced Senses (Can smell emotions\
    \ and lies, and could smell that Jubilee was a vampire. Can hear her clone\u2019\
    s heartbeat and piece events together through only sound. Can see heat signatures\
    \ with her suit, and detect the drug used on someone through sight. Can detect\
    \ an invisible person through her senses), Regeneration (Mid; Stated to have superior\
    \ regeneration to the original Wolverine, which was confirmed by Logan himself),\
    \ Immortality (Type 3), Longevity, Adamantium skeleton and claws, Martial Arts\
    \ (Black Widow stated she\u2019s one of the best fighters), Weapon Mastery (Could\
    \ headshot a helicopter pilot at the age of thirteen. Performed a successful shield\
    \ toss, did tricks with Gambit\u2019s staff and landed three headshots), Acrobatics\
    \ (Did a flip off of Captain America), Rage Power and Instinctive Action (Entering\
    \ berserker rage allows her to fight through instinct while gaining a higher resistance\
    \ to telepathy) Resistance to Telepathy (Emma Frost struggled to break her mental\
    \ defenses, and Rachel Summers struggled to disable her mind), Enhanced Senses\
    \ (Logan couldn't find her scent), Poison Manipulation (Could rip apart a group\
    \ of soldiers while unfazed by various chemicals), Sound Manipulation (She was\
    \ able to withstand the scream of a Mutant child that KOed two normal humansand\
    \ blew the windows out of a car. She then withstood a larger scream at close range,\
    \ and only her hand was damaged), Pain Manipulation (Cut off her own hand), Fire\
    \ Manipulation (Walked through fire with no damage whatsoever, came out of a fire\
    \ with minimal injuries and was stated to do so regularly), Disease Manipulation\
    \ (Her system was able to fight off the Legacy virus. Her healing factor allowed\
    \ her to resist a virus\u2019 effects), Cold Manipulation (Showed no discomfort\
    \ from being completely covered in snow. Could very briefly survive the vacuum\
    \ of space)"
  source_ids: *id003
