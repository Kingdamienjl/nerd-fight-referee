power_scale:
  tier:
    text: 9-A, High 3-A with Adamantium claws
    source_ids: &id002
    - mediawiki-127110
    confidence: 0.8
  attack_potency:
    text: "Small Building level (Has defeated Wolverine and Sabretooth. One-shot Nightcrawler,\
      \ defeated Taskmaster and Lady Deathstrike), High Universe level with Adamantium\
      \ claws (Wounded World War Hulk and cut Drax. Can pierce Iron Man\u2019s armor,\
      \ harm Emma Frost with the Phoenix Force and wound Amadeus Cho's Hulk)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Hypersonic combat speed and reactions (Cloned from Wolverine, but is somewhat\
      \ swifter than he is. Fast enough to evade bullets fired from a high-powered\
      \ rifle. Removed Captain America's shield then flipped over his back, while\
      \ dodging darts from a team of S.H.I.E.L.D. agents. Intercepted a bullet. Dodged\
      \ a blast from Mister Sinister that Gambit couldn\u2019tMach 8.23)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class 1 (Ripped a metal door off its hinges. Carried a man in a
      suitcase with one hand and threw him. Snapped off a piece of railing from the
      Eiffel Tower and used it as a weapon, then broke her opponent's arm by twisting
      it. Three grown men struggled to restrain her, even after she was shot in the
      stomach)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: "Small Building level (Can casually smash armored glass), High Universe\
      \ level with Adamantium claws (Wounded World War Hulk, cut Drax and can pierce\
      \ Iron Man\u2019s armor)"
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small Building level (She was still mostly in one piece after being launched
      by a huge explosion and withstanding enough electricity to burn another person
      to ash, and survived the detonation of a high number of grenades from a very
      close distance). Regeneration makes her difficult to kill
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Her muscles constantly repair themselves. She managed to survive
      a blast from Nimrod despite not having her healing factor. Could continue fighting
      despite being reduced down to a skeleton. Didn't even flinch from a shark biting
      her)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Extended Melee Range with Adamantium claws
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (She is very precise and knowledgeable in anatomy and killing tactics.
      She also speaks fluent French and has extensive knowledge of information gathering.
      Has some knowledge of forensics. She is also extremely skilled, as she was able
      to beat Wolverine's time on the Weapon X training at the age of eleven and Domino
      indirectly stated she was more skilled than Logan. Beat her own time on every
      mission for three years straight. Can skin a man like an onion, and think of
      twenty-seven ways to kill someone by looking at them)
    source_ids: *id002
    confidence: 0.8
