        or attack his opponents * Fire Manipulation: In addition to creating a fire
        aura around itself, he can manipulate any fire in the area, causing them to
        grow larger or smaller. He can also project flame as jets, beams, fireballs,
        etc. and form it into complex forms like cages, ropes, discs, and other shapes.
        * Nova Flames: by burning his maximum natural limit, he can create a massively
