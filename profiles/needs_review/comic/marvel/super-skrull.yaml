- id: claim-weaknesses-29751161
  section: weaknesses
  axis: weakness
  text: '*Interfering with or blocking the signal of the Skrull satellite has been
    an effective way to depower the Super-Skrull in several instances. *While he can
    utilize all the combined powers of the Fantastic Four simultaneously, doing so
    taxes his strength and thus he does not utilize them all the time, but rather
    only when he needs them, forcing him to trade vulnerability for power conservation.
    *His flames do not always remain at their highest temperature possible, as demonstrated
    when he actively needed to build-up heat or when his fire was doused by common
    snow, extinguished by Captain Marvel''s Uni-BeamCaptain Marvel Vol 1 2 and Thor''s
    (possibly magical) whirlwind first and downpour then. A powerful concussion following
    the release of a nova-like blast could also turn off his flaming body. *He is
    susceptible to his own hypnotizing gaze, as exemplified by the time Captain Marvel
    made him stare at his own reflection while he was utilizing said power. Some effects
    of his hypnosis (such as fear) cease to be exerted if he loses concentration,
    while mind control needs to be reinforced periodically. Additionally, his mind
    control powers rapidly wear off when exerted on individuals who would experience
    sudden changes of personality, such as Sasquatch being hypnotized during a fit
    of berserk madness and freeing himself instantly, as Kl''rt''s gaze''s drowsing
    effects made him recover his normal persona of Walter Langkowski. *Seemingly vulnerable
    to suffocation by smoke, as a Skrullian energy-sphere designed to extinguish his
    flames and turn them into noxious smoke could render him incapacitated.Avengers
    Vol 1 94 *Often arrogant and overconfident, flaws which emerge in combat and when
    his disguises and deceptions are exposed. These traits have somewhat attenuated
    over the years, as experience turned him into a more level-headed, seasoned and
    wise individual. Limits: *Has battled Thor to an apparent standstill, but never
    truly gained the upper hand and the God quickly disposed of him at the end.Thor
    Vol 1 142Thor used his own godly powers, strength and skill to render the Super-Skrull''s
    own abilities moot and overcome him in physical combat, before banishing him in
    space using Mjolnir''s magic Thor later defeated him with even greater ease.Thor
    Vol 1 465 *Would have been killed by a nuclear explosion, had Captain Marvel not
    prevented it from happening.Captain Marvel Vol 1 3 *Admitted that a berserk Sasquatch
    may have been stronger than him and vowed to approach the battle carefully. *Had
    a few, brief skirmishes with the Silver Surfer but failed to overwhelm him.Silver
    Surfer Annual Vol 1 1Silver Surfer Vol 3 25 In a later encounter, a then-bloodlusted
    Silver Surfer handed the Super-Skrull utter humiliation.Silver Surfer Vol 3 105
    *Was defeated by the Gray Hulk through a combination of skill, ingenuity and comparable
    strength and resilience. *Was grossly overpowered by Thanos in a direct confrontation.Secret
    Defenders Vol 1 12 *Could not break free from Quasar''s forcefield. *Was completely
    powerless against the continent-sized Harvester of Sorrow, an alien weapon designed
    to destroy planets. *Reed Richards threatened him with a Class Four Disintegrator,
    a gun capable of taking out small moons, an act taken by Super-Skrull as a flattering
    compliment. Notes: Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Scroll box|{{reflist|2}}}} ==Notes== {{scroll
    box|content=}} {{discussions}} Category:Characters Category:Marvel Comics Category:Absorption
