    - field: weaknesses
      value: '*Interfering with or blocking the signal of the Skrull satellite has
        been an effective way to depower the Super-Skrull in several instances. *While
        he can utilize all the combined powers of the Fantastic Four simultaneously,
        doing so taxes his strength and thus he does not utilize them all the time,
        but rather only when he needs them, forcing him to trade vulnerability for
        power conservation. *His flames do not always remain at their highest temperature
        possible, as demonstrated when he actively needed to build-up heat or when
        his fire was doused by common snow, extinguished by Captain Marvel''s Uni-BeamCaptain
        Marvel Vol 1 2 and Thor''s (possibly magical) whirlwind first and downpour
        then. A powerful concussion following the release of a nova-like blast could
        also turn off his flaming body. *He is susceptible to his own hypnotizing
        gaze, as exemplified by the time Captain Marvel made him stare at his own
        reflection while he was utilizing said power. Some effects of his hypnosis
        (such as fear) cease to be exerted if he loses concentration, while mind control
        needs to be reinforced periodically. Additionally, his mind control powers
        rapidly wear off when exerted on individuals who would experience sudden changes
        of personality, such as Sasquatch being hypnotized during a fit of berserk
        madness and freeing himself instantly, as Kl''rt''s gaze''s drowsing effects
        made him recover his normal persona of Walter Langkowski. *Seemingly vulnerable
        to suffocation by smoke, as a Skrullian energy-sphere designed to extinguish
        his flames and turn them into noxious smoke could render him incapacitated.Avengers
        Vol 1 94 *Often arrogant and overconfident, flaws which emerge in combat and
