    - field: standard_equipment
      value: 'None notable Standard Tactic: The Super-Skrull is a proud and seasoned
        warrior of the Skrull Empire. Kl''rt constantly brags about his status and
        craves to confront worthy opponents that can meet him in glorious battle.Captain
        Marvel Vol 1 25Alpha Flight Vol 1 10 He rapidly alternates or combines the
        various powers he has been bestowed with, finding himself comfortable both
        at close and at ranged combat thanks to the options at hand, without favoring
        one or the other ability, within the limits of his capabilities. Although
        not stranger to sneak attacks and sucker punches, the Super-Skrull generally
        reserves underhand tactics for infiltrations and other missions for which
        caution is paramount. He utilizes his hypnotizing gaze as a trump card to
        turn the tides of the battle once all other options have proved futile. He
        rarely holds back in battle and killing his opponents, especially in war,
        is common practice to him. He looks down on other individuals or alien species,
        such as humans, and holds absolutely no qualms when it comes to murdering
        in cold blood those he deems expendable or beneath him;Young Avengers Vol
        1 9 nonetheless, Kl''rt is bound by a code of honor which prompts him to recognize,
        respect and even repay warriors he deems worthy or acknowledges as brothers-in-arms,Silver
        Surfer Annual Vol 1 1 and Silver Surfer Vol 3 #20 to 26Young Avengers Vol
        1 11 and to not strike opponents who offer no opposition, unless forced by
        higher authorities, for his loyalty to the Empire is often absoluteCaptain
        Marvel Vol 4 8)'
      source_id: mediawiki-5933
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Exposition= Gifted overall (Kl''rt was selected to become the Super-Skrull
        thanks to his impressive abilities as a soldier and was specially trained
        to master the Fantastic Four''s abilities in order to defeat them,Moon Girl
        and Devil Dinosaur Vol 1 28 a achievement he has accomplished several times,
