        of his life, most notably during the two Kree-Skrull Wars. He claims to have
        collapsed worlds, torn down entire civilizations and conquered beings of cosmic
        scope; his exploits and battles have become stories passed down from fathers
        to sons, such as the Battle of Harkoon, where his troops came out victorious
        in spite of the great losses. Kl''rt has also had a prominent role in other
        cosmic-scale conflicts, opposing the Annihilation Wave, the Phalanx, the Builders
        and more. Although most of his schemes did not succeed, Super-Skrull has recurrently
        been a high-profile enemy of numerous heroes. Aside from being a capable and
        seasoned warrior, Kl''rt has proven himself an excellent leader, spy, diplomat
        and schemer; these skills have earned him relevant positions within the different
        incarnations of th Skrull Empire and other organizations, such as Thanos''s
        army and the Guardians of the Galaxy) higher, possibly up to Extraordinary
        Genius in technological prowess (A skilled and resourceful engineer, Super-Skrull
        has repeteadly produced the means to complete his missions and return home
        even when stranded alone on Earth: he jury-rigged a sensor using the tech
        found in Reed Richard''s laboratory, has claimed to be able to construct a
        spaceship on his own with Earthen resources and has built a makeshift teleportation
        device out of the wreckage of a space station. Most notably, he managed to
        create a portal to the realm between the universes and summon the universe-eater
        Omnipotentis,Moon Girl and Devil Dinosaur Vol 1 #25 to 30 a being superior
