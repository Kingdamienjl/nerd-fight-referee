  intelligence:
    text: 'Exposition= Gifted overall (Kl''rt was selected to become the Super-Skrull
      thanks to his impressive abilities as a soldier and was specially trained to
      master the Fantastic Four''s abilities in order to defeat them,Moon Girl and
      Devil Dinosaur Vol 1 28 a achievement he has accomplished several times, being
      eventually defeated through means different than combat. The Super-Skrull is
      veteran of war who has fought in countless battles throughout the entirety of
      his life, most notably during the two Kree-Skrull Wars. He claims to have collapsed
      worlds, torn down entire civilizations and conquered beings of cosmic scope;
      his exploits and battles have become stories passed down from fathers to sons,
      such as the Battle of Harkoon, where his troops came out victorious in spite
      of the great losses. Kl''rt has also had a prominent role in other cosmic-scale
      conflicts, opposing the Annihilation Wave, the Phalanx, the Builders and more.
      Although most of his schemes did not succeed, Super-Skrull has recurrently been
      a high-profile enemy of numerous heroes. Aside from being a capable and seasoned
      warrior, Kl''rt has proven himself an excellent leader, spy, diplomat and schemer;
      these skills have earned him relevant positions within the different incarnations
      of th Skrull Empire and other organizations, such as Thanos''s army and the
      Guardians of the Galaxy) higher, possibly up to Extraordinary Genius in technological
      prowess (A skilled and resourceful engineer, Super-Skrull has repeteadly produced
      the means to complete his missions and return home even when stranded alone
      on Earth: he jury-rigged a sensor using the tech found in Reed Richard''s laboratory,
      has claimed to be able to construct a spaceship on his own with Earthen resources
      and has built a makeshift teleportation device out of the wreckage of a space
      station. Most notably, he managed to create a portal to the realm between the
      universes and summon the universe-eater Omnipotentis,Moon Girl and Devil Dinosaur
      Vol 1 #25 to 30 a being superior even to Lifebringer Galactus, and he did so
      using raw materials found on EarthConsidering that the Skrulls have an average
      level of technology far more advanced than mankind''s, it is difficult to tell
      whether these feats are truly extraordinary or merit of their society''s collective
      knowledge) |-|Feats= Overall: *Even while deprived of his powers, Super-Skrull
      was insightful enough to pinpoint the Invisible Girl by the pebbles that were
      falling behind her. *Seemingly conceived the plan which allowed him and his
      Skrull underlings to bring havok within the Avengers'' ranks, rally the public
      opinion against Captain Marvel and other heroes, capture Scarlet Witch, Quicksilver
      Captain Marvel himself, and finally land an attack against the Inhuman Great
      Refuge.Avengers Vol 1 #92 to 97 *While disguised as the Thing, Super-Skrull
      murdered a scientist of the research station he was in and then escaped, leaving
      behind a series of false clues to frame an alleged invader from the outside
      and mislead the rest of the crew.Alpha Flight Vol 1 9 *During the time he spent
      on Earth on hyatus from duty and undercover, Super-Skrull managed to reinvent
      himself as a capable special effects master, shooting many movies and growing
      quite popular among the general public.Fantastic Four Vol 3 #37, 51 and 52,
      and Fantastic Four: Foes Vol 1 3 *During Annihilus''s invasion of our dimension,
      Kl''rt correctly guessed that the Negative Zone, which had already been taken
      over, would have been ripe of rebellious cells willing to be recruited in an
      effort against the tyrant.Annihilation: Super-Skrull Vol 1 *Speaks current and
      ancient Skrullian, and isGuardians of the Galaxy Vol 7 13 knowledgeable in ancient
      Skrullian culture, history and religion.Guardians of the Galaxy Vol 7 14 Combat:
      *Although he never abandoned the tendency to look down and underestimate his
      opponents, Super-Skrull claims to have grown wiser and more cautious following
      his first defeats, and is all but stranger to employing strategy when confronting
      a stronger opponent. *Matched Captain Marvel in physical combat and came out
      victorious. *Circumvented Tigra''s greater agility by collapsing on her the
      wall which she was jumping on. *Defeated two other super-powered Skrulls who
      posed as Mister Fantastic and the Invisible Woman, even killing the latter.
      *Has taken on platoons of Annihilation Wave forces, troops of Skrulls and swarms
      of Kree soldiersAnnihilation Vol 1 5 either single-handedly or with the help
      of but a few allies. *Defeated the multiplying Preak by sealing all of their
      clones into a cave and asphyxiating them with his flames. *Bested and killed
      other super-powered Skrulls.Nova Vol 4 16 *Easily defeated She-Hulk in a direct
      confrontation.'
    source_ids:
    - vsbattles-super-skrull-marvel-comics
