        to Jazinda -Super-Skrull''s daughter- normal Skrulls can''t immediately recover
        through shapeshifting, not even from simple cuts and bruises, due to their
        inability to rebuild missing skin, therefore adding further confirmation regarding
        the timeframe Skrulls require to'
