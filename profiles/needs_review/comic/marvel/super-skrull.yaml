      value: 'Super-Skrull inherited the prideful nature of the Skrull race, and tends
        to look down on his opponents.Marvel vs. Capcom: Official Complete Works He
        can only equip up to three card effects at a time. Notable Attacks/Techniques:
        |-|Command Normals= 7jzp39.gif|Stone Smite 7jzor3.gif|Stone Dunk 7jzvz5.gif|Flame
        Kick 7jzt7d.gif|Elastic Punch 7jzqxh.gif|Elastic Uppercut 7jzodd.gif|Brutal
        Pile Bunker 7jzq0m.gif|Rolling Hook 7jzqaa.gif|Worm Squash 7jzurn.gif|Air
        Dash *Stone Smite: Super-Skrull turns his fist into rocks and charges it up
        with fire before striking the opponent, creating a fiery explosion that causes
        a wall bounce. **Stone Dunk: An aerial version of Stone Smite. While mid-air,
        Super-Skrull turns his fist into rocks and charges it up with fire before
        striking the opponent, creating a fiery explosion that causes a ground bounce.
        *Flame Kick: Super-Skrull charges up a fiery sweeping kick that hits low and
        possesses long range. *Elastic Punch: Super-Skrull stretches his arm forward
        horizontally and punches the opponent. **Elastic Uppercut: Similar to Elastic
        Punch, Super-Skrull stretches his arm forward and punches the opponent. This
        attack, however, is aimed upward at a diagonal angle. *Brutal Pile Bunker:
        Super-Skrull dives straight down towards the ground with a lethal punch, causing
        a ground bounce. *Rolling Hook: Super-Skrull rushes forward and performs a
        giant spinning punch that knocks down the opponent. *Worm Squash: Super-Skrull
        stomps down onto the opponent and scrapes his foot on them, inflicting extra
        damage. *Air Dash: Super-Skrull can air dash by propelling his feet with flames.
        |-|Throws= 7jzb7r.gif|Forward & Back Throw 7jzbm9.gif|Air Throw *Forward Throw:
        Super-Skrull grabs the opponent and jumps over them while elongating his arms
        before hurling them over his head. *Back Throw: Similar to his forward throw,
        Super-Skrull grabs the opponent and jumps over them while elongating his arms
        before hurling them over his head. *Aerial Throw: Similar to his ground throws,
        Super-Skrull grabs the opponent mid-air and jumps over them while elongating
        his arms before hurling them over his head. |-|Special Attacks= 7jztwd.gif|Tenderizer
        7jzvr4.gif|Tenderizer (Aerial) (Low) 7jzubh.gif|Tenderizer (Aerial) (Medium)
        7jznw1.gif|Orbital Grudge 7jzo4a.gif|Fatal Buster 7jzpp6.gif|Elastic Slam
        7jzr5p.gif|Elastic Slam (Anti-Air) 7jzrtl.gif|Meteor Smash *Tenderizer: Super-Skrull''s
        fists will turn into rock as he begins a series of punches, ending with a
        hard finishing blow. This attack can also be performed mid-air, and depending
        on attack strength, the attack will be aimed straight forward, diagonally
        downwards, or diagonally upwards. *Orbital Grudge: Turning his arms into burning
        rock, Super-Skrull spins around with his arms stretched out, slightly moving
        forward as he continues to rotate. Depending on attack strength, the attack
        will endure longer, hitting multiple times. **Fatal Buster: A follow-up of
        Orbital Grudge where Super-Skrull will use the momentum from the aforementioned
        move to wallop the opponent with a flaming rock uppercut, causing a wall-bounce.
        *Elastic Slam: Super-Skrull elongates his arms to swiftly grab the opponent.
        If the grab is successful, he will proceed to slam the opponent around before
        lifting them up, and slamming them back into the ground one last time. Depending
        on attack strength, the attack will either be aimed straight forward, or diagonally
        upward, making for a good anti-air attack. *Meteor Smash: Super-Skrull quickly
        uses Invisible Woman''s forcefield power to burst himself into the air, and
        crashes back down to the ground with a rocky fist, creating a shockwave. Depending
        on attack strength, Super-Skrull will land in several different ranges throughout
        the battlefield. As of Ultimate Marvel vs. Capcom 3, this attack can also
        be performed mid-air. |-|Hyper Combos= *Inferno: Super-Skrull engulfs his
        entire body in a large barrier of swirling fire that hits the opponent multiple
        times. This attack can also be performed mid-air. 7jzddg.gif|MvC3-UMvC3 7jzdgj.gif|MvC3-UMvC3
        (Aerial) *Skrull Torch: Super-Skrull encases himself in fire and stretches
