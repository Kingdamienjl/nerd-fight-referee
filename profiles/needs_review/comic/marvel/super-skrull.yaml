- id: claim-powers-and-abilities-4365c417
  section: abilities
  axis: hax
  text: '*Likely Genius Intelligence *Longevity (Skrulls have an approximate lifespan
    of 210 years) *Superhuman Physical Characteristics and Empowerment (Kl''rt has
    been artificially enhanced by the greatest scientists and resources the Skrull
    Empire could muster in order to create their own super soldier.Fantastic Four
    Vol 1 18 He was bestowed with the combined powers of the Fantastic Four and the
    potency of his abilities greatly surpasses the originals''.Such notion is constantly
    reiterated either by Super-Skrull himself or his allies, and backed up by numerous
    feats also presented in this profile Super-Skrull''s power level and capabilities
    are regulated by a satellite which constantly broadcasts a special beam towards
    him across intergalactic distances and automatically increases the power outputMarvel
    Team-Up Vol 1 62 whenever needed; proximity to Skrull power sourcesSilver Surfer
    Vol 3 20 also increases his strength dramatically. The link between Super-Skrull
    and the satellite is fundamental and severing this connection results in a considerable
    power reduction. Nonetheless, exposure to the beam over the years has mutated
    Kl''rt''s very nature, transforming most of his artificial superpowers into real
    ones which don''t require the satellite''s influence. Moreover, Kl''rt has recurrently
    grown stronger since his debutThe satellite remained operative even after Kl''rt
    expulsion from the ranks of the Skrull Empire and was forgotten for a time (Marvel
    Team-Up Vol 1 61). The satellite has even survived the destruction of the Skrull
    throneworld (Alpha Flight Vol 1 10) and a fringe Skrull faction attempted to replicate
    it without success (Fantastic Four Vol 3 37). This satellite has progressively
    ceased to be taken into consideration by the authors, resulting in Super-Skrull
    maintaining his abilities even when venturing into other dimensions ("Annihilation:
    Super-Skrull") or galaxies out of synch with the rest of the universe ("Annihilation:
    Conquest - Wraith")) *Martial Arts (Super-Skrull has fought in hand-to-hand combat
    the likes of the Thing, Thor, Captain Marvel, Hulk and Namor. Could convincingly
    replicate Iron Fist''s martial prowess while disguised as him, impressing even
    Namor.Namor, the Sub-Mariner Vol 1 16 Skrull soldiers, such as Captain R''gars,
    are specifically trained in Skrullian martial artsVenom Vol 6 250 centered around
    their species'' ability to alter their shape) *Weapon Mastery (All Skrull soldiers
    are adept in the use of their military firearms such as energy guns. Although
    the Super-Skrull''s powers make the use of weapons moot to him, he has occasionally
    showed a certain prowess with imperial guns) *Stealth Mastery (Kl''rt is an accomplished
    spy and impersonator who can skillfully combine his various abilities to carry
    out his missions [more details provided by subsequent abilities]. Has used his
    stretching powers to infiltrate a state prison and replace Dr. Storm) *Shapeshifting
    (Deviant Skrulls are widely known for being shapeshifters, as their bodies are
    in a constant state of molecular instability,Fantastic Four Vol 1 32 allowing
    them to thoroughly alter their form, size, length and appearance as a whole. Kl''rt
    is no different from his brethren and retains the same shapeshifting abilities
    of his kind [more details in the Social Influencing section]. Morphing into other
    individuals also does not prevent him from using his other powers) **Camouflage
    (Kl''rt and his fellow soldiers have employed their shapeshifting powers to blend
    themselves with the environment and carry out an ambush.Annihilation: Super-Skrull
    Vol 1 1 Has disguised himself as a piece of space debris to hide himself and his
    alliesAnnihilation: Conquest - Wraith Vol 1 3) **Additional Limbs (Skrulls can
    easily utilize their shapeshifting abilities to grow multiple arms and legs, a
    trait which is apparently common among the communities not affiliated with organized
    warfare, and thus not in need of visual homogeny.Doctor Strange Vol 5 3 Kl''rt
    himself has once employed such tactic when facing multiple enemies) **Non-Standard
    Breathing (Type 1: Skrulls such as Jazinda and Nogor have transformed into fishes
    in order to survive underwater) **Body Control (Even in base form, Super-Skrull
    utilizes his shapeshifting powers to nest his brain in a less obvious spot than
    his head) *Regeneration (Low-Mid over time) and Immortality (Type 3) (The Skrulls''
    combined reptilian ancestry and shapeshifting powers have resulted in augmented
    regenerative abilities, allowing them to regrow lost limbs and enter healing comas
    to recover from lethal injuries.In this specific instance, Super-Skrull was regenerating
    from having his throat mauled away by Captain Reptyl in "Silver Surfer Vol 3 28"According
    to Jazinda -Super-Skrull''s daughter- normal Skrulls can''t immediately recover
    through shapeshifting, not even from simple cuts and bruises, due to their inability
    to rebuild missing skin, therefore adding further confirmation regarding the timeframe
    Skrulls require to'
