  attack_potency:
    text: Varies (Super-Skrull's power level is dependent on the influence of a special
      beam emitted by a Skrull satellite designed to constantly feed him power and
      boost his strength even further in case of need. Being close to Skrull technology
      empowers him even more, while tampering with the satellite's signal reduces
      his power to different degrees), at least Planet level (Said beam has mutated
      the Super-Skrull's body over the years, making most of his artificial powers
      into real ones. Severing his connection to the satellite cuts his strength in
      half and even then it is still superior to Miss Marvel's), Higher on average
      (Kl'rt was stated numerous times, either by himself or others, to be much stronger
      than the ThingOr at least superior to the Skrulls' early records of the Thing,
      considering that Ben Grimm has in turn been stated several times to have grown
      stronger (Fantastic Four Vol 1 177) over the course of his life, and these instances
      occurred after the Super-Skrull's inception and has matched his strength on
      several occasions. The Super-Skrull has grown more powerful multiple times since
      his debut. Stated and shown to be superior to the likes of an early Captain
      Marvel and Tigra. Has fought and matched the Gray Hulk, NamorNamor, the Sub-Mariner
      Vol 1 18 Genis-VellCaptain Marvel Vol 4 9 and She-Hulk. Knocked out Amadeus
      Cho with a single punch and stalemated Hulk, Black Bolt and Black Panther at
      the same time, though he was eventually overwhelmedImperial Vol 1 4) higher
      with the Human Torch's powers (Johnny Storm's flame powers are consistently
      presented as Super-Skrull's greatest power. His anti-matter fireballs could
      destroy the peak of a small mountain and he can increase the power of his flames
      to reach the heat of a nova which, according to Thor, threatened to destroy
      planet EarthSuper-Skrull himself has stated to have "detonated stars and collapsed
      worlds" but the means and timeframe through which he has performed such feats
      are unknown and may be related to his flame powers being consistently stated
      to equal the power of a nova)
