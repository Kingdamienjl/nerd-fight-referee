  intelligence:
    text: Genius (Blessed by the goddess Athena to be skilled in every discipline,
      Diana is the finest warrior the Amazons have ever produced, being trained in
      the use of every weapon known to man as well as all of the exotic combat styles
      known to the Amazons. She has proven herself time and again to be among the
      greatest hand-to-hand combatants in the world, frequently outmatching the few
      beings that exceed her in might through sheer skill, having bested immortals
      in battle and can take on multiple members of the Justice League at once. She
      is also gifted with incredible insight and empathy, allowing her to understand
      her opponents and their movements as well as their intentions with ease. Her
      blessings have also granted her a natural gift for leadership, diplomacy, and
      strategy, being the ambassador of Themiscyra and frequently matching wits with
      that of Batman and other intellectuals of the DC Universe, possessing a particularly
      profound knowledge of the occult and mythology.)
