    - field: powers_and_abilities
      value: ": Thor is one of the most trained and most experienced warriors in the\
        \ entire Marvel Universe. Even when Thor was stripped of his powers and turned\
        \ into a mortal, he was able to defeat a pack of thugs and also save Captain\
        \ America with his own shield and wield Mjolnir simultaneously. Thor was also\
        \ able to fight Hercules unarmed and was only shown to be a bit below in terms\
        \ of skill. Thor generally prefers to use brawling-type techniques, rather\
        \ than his full versatility of available powers, when fighting beings such\
        \ as Juggernaut, Gladiator, and the Hulk. Despite being a skilled hand-to-hand\
        \ combatant, Thor's greatest feats of skill come from his in weapons. He is\
        \ easily one of the greatest and most versatile weapons experts in the Marvel\
        \ Universe. He is usually seen wielding his hammer but has also demonstrated\
        \ great dexterity using weapons such as axe, , , shields, and clubs. Outside\
        \ of Mjolnir, Thor's most commonly used weapon is the Jarnbjorn axe, which\
        \ he obtained before Mjolnir. Gifted Intelligence: Thor has gifted intelligence.\
        \ He retains the advanced medical knowledge of Donald Blake, one of the world's\
        \ most sk\xEClled neurosurgeons, who also invented a highly intelligent android,\
        \ and he is an excellent due to many thousands of years of combat training\
        \ and experience. : Thor has the ability to resist the mental influence of\
        \ powerful beings. He resisted a mind thrust attack of the Rigellians, the\
        \ magical music of Ares, a mental attack from Glory, Morgana le Fay's attempt\
        \ to dominate his mind, the power of the Eye of Horus, and the mind blast\
        \ of the Man-Beast. Power Restraint: Thor usually greatly restrains the full\
        \ magnitude of his powers, especially when dealing with mortals and less powerful\
        \ superhumans. Diplomatic Immunity: After Thor's rebirth, he used Mjolnir\
        \ to recreate Asgard on Earth in Oklahoma. At this time, Iron Man was head\
        \ of S.H.I.E.L.D. and confronted Thor about his bringing Asgard into U.S.\
        \ territory. After Thor beat down Iron Man, Stark suggested that Asgard be\
        \ treated as a foreign embassy, and with its citizens full diplomatic privileges,\
        \ to which Thor agreed."
      source_id: fandom-marvel-thor-post-crisis
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: weaknesses
      value: '* Warrior''s Madness: The Warrior''s Madness also known as the Sin Unpardonable,
        is the most forbidden malady in Asgard by law of Odin. Any who fall under
        it must pay the penalty, only the most bitter sacrifice can atone for it.
        The Warrior''s madness enable Thor to increase his strength and stamina tenfold.
        Despite this, it threatens Thor''s sanity. The symptoms include berserker
        rage, massive headaches, mentally erratic, savage, animalistic, uncontrollable
        behavior, and unreasoning. * Odinsleep: After receiving the Odinforce, Thor
        must rest in order to recharge the Odinforce once a year.'
      source_id: fandom-marvel-thor-post-crisis
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: standard_equipment
      value: "thumb|right|Thor, Asgardian God of Thunder The Asgardian Warhammer Mjolnir:\
        \ Mjolnir is a symbolic weapon of Thor, a hammer forged from Uru metal, whose\
        \ chief properties are durability, the ability to maintain enchantment, and\
        \ absorb energies. Mjolnir resembles more of a short handle mallet than a\
        \ traditional Warhammer. Mjolnir itself is already extremely durable and combined\
        \ with the various enchantments placed upon it by Odin, is even harder. It\
        \ has survived heat as extreme as the heart of the Sun, and blasts powerful\
        \ enough to destroy planets. Jane Foster, when wielding a copy of the powers\
        \ of Thor, used Mjolnir to neutralise a supernova, and generated a thunderclap\
        \ that shook planets half a universe away in the process. * Worthiness Enchantment:\
        \ This enchantment surrounding Mjolnir prevents it from being wielded by anyone\
        \ save those who have been found worthy. Thus far, this includes Thor, the\
        \ Red Norvell, Beta Ray Bill and Captain America. To anyone else, Mjolnir\
        \ cannot be lifted from the ground nor wrested from Thor's grip. * Transformation:\
        \ When Thor was living on Earth under a mortal guise, he could use Mjolnir\
        \ to transform from his Donald Blake persona into Thor and vice versa. Thor\
