- id: claim-powers-and-abilities-4e09d179
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics (Doesn''t have a heartbeatDaredevil Vol
    1 115, Genius Intelligence, Dimensional Travel (An accident with T-Rays caused
    his permanent existence to be within an interdimensional "timeless limbo".Daredevil
    Vol 1 158 which he can travel to and from for a limited duration.Official Handbook
    of the Marvel Universe Vol 1 13), Teleportation (Can teleport short distancesDaredevil
    Vol 1 114), Intangibility (Can turn himself intangible. See Weaknesses.), Enhanced
    Senses (States a faint glow to him is as perceptive as a glaring headlight to
    his eyesDaredevil Vol 1 128), Extrasensory Perception (Can perceive astral formsDoctor
    Strange Vol 2 29 and could observe Earth from his dimension), Time Travel, Immortality
    (Types 4 and 8), Acausality (Type 3; Death-Stalker dies at the hands of Daredevil
    at some point, but despite this a past version of himself can travel to the future.
    If a version of him dies at a point besides the fated one, he resurrects back
    to the point where he deviates from the timeline, with no memory of the incidentDaredevil
    & Captain America: Dead on Arrival Vol 1 1) and limited Resistance to Enhanced
    Senses (Due to the nature of his being, Death-Stalker blurs the reliability of
    his opponents'' enhanced senses, for he is out of sync with time itself). His
    standard equipment grants him Radiation Manipulation (Via the ''Touch of Death'';
    his gloves emit lethal amounts of radiation that can knockout Man-Thing and stun
    Daredevil), Empowerment (The gloves can transfer this effect onto other objects
    to be used as projectileDaredevil Vol 1 158) and Weapon Control (Death-Stalker
    and his gloves have a symbiotic relationship, with the gloves unable to be activated
    without his presence). His optional equipment grants him Time-based Interdimensional
    BFR (Via T-Rays; Which can forcefully send his opponents to the futureDaredevil
    Vol 1 39. The victim is trapped into an alternate ''time sphere'' in the meantime),
    Energy Projection (Possesses many energy weapons, and T-Ray blasters can switch
    to an energy pistolDaredevil Vol 1 40), Illusion Creation (Possesses the means
    to appear as a ghostly apparition of another), Perception Manipulation and Madness
    Manipulation (Created a concoction which is able to alter the perception of its
    victim, despite being blind, and make them see terrifying distorted visions. It
    also puts them in a rage-fueled frenzy)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
