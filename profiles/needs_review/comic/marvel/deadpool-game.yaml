        of several high-profile teams, most notably X-Force and some iterations of
        the Avengers, as well as a number of mercenary agencies, some even led by
        him. Deadpool is widely (and infamously) renowned within the community of
        metahumans, amongst both heroes and villains, due to having been a recurrent
        ally, foe or close acquaintance of nearly everyone. The many adventures he
        has partaken have led him to every corner of the world and oftentimes even
        across the universe, other dimensions and different time periods. Few are
        the beings with whom Deadpool has not contended, for he has fought (and killed)
        all sorts of superpowered individuals, assassins, monsters, aliens and weird
        creatures in general. Deadpool's antics are misleading of his actual worth
