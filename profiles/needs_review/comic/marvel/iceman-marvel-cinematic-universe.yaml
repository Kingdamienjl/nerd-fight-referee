        one occasion, he has even been shown to make it snow or cause a blizzard.
        Iceman is able to form a rising column of ice beneath his feet, capable of
        lifting him off the ground. The tensile strength of the column is determined
        by its thickness and its steadiness by how well it has been braced. A well-braced
        and regular column, 6 feet in diameter at its base, is able to support his
        weight without toppling for about 85 feet in a 40-mile per hour wind. By forming
        long ice-ramps connected either to his ice-column or to an existing structure
        like a building or a bridge, Iceman is able to travel above the ground by
        sliding down the ramp he is creating. Unless he creates supports periodically,
        the ramp will crack beneath him, unable to support their combined weight.
        Iceman although has shown that he is not limited to creating constructs and
        can fly on his own with his control over moisture. Iceman''s control of his
        powers are so vast that it extends to the molecular level, to the point that
        he can freeze all of the molecules of an object/being with a thought. An example
