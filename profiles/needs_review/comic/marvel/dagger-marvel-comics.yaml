- id: claim-weaknesses-6e64cf60
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Lightforce energy: The energy of
    light that exists in everyone as life force in its pure state is what is called
    Lightforce energy. It''s a power of good that passively purifies what''s dark
    and evil. Dagger passively generates much more than any other human, and unless
    it is consumed by Cloak she will continuously generate it more and more, becoming
    more powerful. Beings without a soul are not affected by the Lifeforce energy
    but robots'' circuits can suffer from short circuitPeter Parker, The Spectacular
    Spider-Man (1976) #70. **Light Daggers: She throws daggers made of pure lightforce
    energy, they are not solid as such they can go through armours and even flesh
    affecting the soul or the blood of the opponent in a huge range of effects. *Solid
    Light: Dagger can create solid light, which despite lacking the purifying effects
    of pure Lightforce it is physical and can be used to create weapons and shields.
    Notes: *Dagger''s attacks are not inherently destructive. Unless explicitly stated
    or shown to be employed with the intent of causing destruction, they should be
    regarded as non-physical in nature and intended solely for purposes of purification.
    *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: *Kai (Gravity
    Circuit) (Gravity Circuit) Kai''s Profile (Kai had the Ultimate Blend Paint and
    his 8-A key was being used, speed is equalized, they started 5 meters apart, sba
    for the rest) Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
    ==Notes/Explanations== {{Scroll box|content=|2}} {{discussions|Dagger Marvel Comics|Dagger
    (Marvel Comics)}} Category:Characters Category:Marvel Comics Category:Comic Book
    Characters Category:Female Characters Category:Adults Category:Good Characters
    Category:Protagonists Category:Primary Protagonists Category:Heroes Category:Superheroes
    Category:Humans Category:Mutates Category:Acrobats Category:Martial Artists Category:Enhanced
    Senses Users Category:Extrasensory Perception Users Category:Light Users Category:Life
    Users Category:Absorption Users Category:Healers Category:Holy Users Category:Purification
    Users Category:Power Nullification Users Category:Durability Negation Users Category:Biology
    Users Category:Soul Users Category:Non-Physical Interaction Users Category:Morality
    Users Category:Danmaku Users Category:Weapon Creation Users Category:Forcefield
    Users Category:Homing Attack Users Category:Philanthropes'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
