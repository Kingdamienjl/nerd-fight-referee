  attack_potency:
    text: Varies up to Planet level physically (Fought Fought the Thing. Fought Fought
      the Hulk. Is the most powerful of Inhumans, physically too as none can match
      his strength. For example, Gorgon and Triton can battle the likes of regular
      Hulk and Thing, but Black Bolt is vastly superior to them. Deflected the Hulk,
      throwing him far away. Fought Shatterstar, a Kree super soldier, who was specifically
      created to defeat him. Fought another Kree super being. Fought the Hulk again
      - and ended up winning after using his energy-based attack on him. Fought the
      Sphinx. Fought an ultra-powerful form of Graviton alongside the Thing. Punched
      an antimatter bomb to space. His physical hits can atomise regular people. Fought
      the ThingThing Vol 1 3. Hurt VoyagerStarblast Vol 1 2), up to at least Planet
      level with Particle & Electron Manipulation (Created a counter explosion in
      space to get rid of a powerful solar flare. Said to have greatest power among
      all Inhumans and is "limitless"Fantastic Four Vol 1 48. Mandarin was scared
      of his power. Fought the Hulk again - and ended up winning after using his energy-based
      attack on him. During his battle against Sphinx, they were equally matched,
      however, when Black Bolt started utilising his energy powers, he was able to
      defeat the Sphix. During an encounter with a Kree super soldier, their mere
      clash generated enough energy to power Attilan city for at least a month. Caused
      an avalanche. Hurt Star Thief (Ditmil Pirvat), who scales to Gorgon and New
      Warriors. Matched Major Victory in a battle of energyGuardians of the Galaxy
      Vol 1 27. Fought and defeated a Kree super soldier who had absorbed a lot of
      power/energy from others. During their battle, the Kree super soldier, who had
      absorbed powers of other Inhumans, couldn't contain the energy he took from
      Black Bolt). From at least City level (As an infant, who was just born, he screamed,
      destroying a large portion of Attilan city. Can shatter mountains and fell cities
      with his voice. Shook the very foundation of Attilan with a one-word whisper.
      Can destroy a whole city with a whisper. Just whispering the word "I" accidently
      caused a ship to sink and created tidal waves in the sea for hundreds of yards.
      For 9 days, Maximus had him chained and forced to watch his people suffer, all
      while he was also getting hurt and humiliated. He was unable to sleep, rest,
      have any sustenance. He was forced to use his voice and destroyed the whole
      of Attilan city. With some help from Karnak, Black Bolt destroyed the very foundation
      of Attilan City in Himalayan mountains, allowing it to ascend to the Moon. Can
      shatter mountains with his voice. Near the blue side of the moon, where there
      is limited air and his voice was heavily muffled, he was still able to create
      a shockwave that threw Crystal away. His smallest vocal sound carries the kinetic
      impact of a bomb. Caused tremors on the moon. His sound is capable of creating
      force superior to nuclear explosions. Destroyed a good portion of Attilan as
      well as the field surrounding it)) to at least Planet level with Sound Manipulation
      (Destroyed the Negative Zone (antimatter) dome that was covering Attilan city,
      which was impregnable from outside and the inside. Karnak was unable to find
      a weakness in this prison of theirs. He shouted, destroying most of the city
      in the process and destroyed the barrier, freeing his people. The power of his
      sound was so strong, it was "incalculable" by human terms. He was struggling
      against the Hulk physically, so used his Sonic attack to free himself from Hulk's
      grip. Broke through an impregnable forcefield that he couldn't break physically,
      and neither could Karnak, Triton, and Gorgon - the latter two who downscales
      from Black Bolt physically - break it. Hurt the Hulk, but had to use a lot of
      energy in the process. Fought a super-charged Absorbing Man with Dazzler. Despite
      being on the moon where his voice was muffled, he was able to harm Vision. Hurt
      a villain with a mere whisperQuasar Vol 1 55), higher with Statistics Amplification
      (Applies to all statistics)
