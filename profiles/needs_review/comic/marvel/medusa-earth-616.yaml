      Massively Hypersonic Flight Speed (Caught up with a missile and destroyed it.
      Deflected a missile to space with a mental blast. Kept up with something moving
      the speed of "Space Missiles", which likely travels over 17,800 miles per hour.
      Flew from Attilan, which is in Himalaya to New York in a short time. Defeated
      the Hulk, throwing him far away. Outrun the collapse of a cave through a tube.
      Dodged military ray guns. Flew from Coney Island to Manhattan-South in a lot
      less than 7-minutes - far faster than Spider-Man could get therePeter Parker,
      The Spectacular Spider-Man Vol 1 11. Flew from Earth to space really quickly
      to deflect a a powerful solar flare - that flew from the sun to earth in an
      extremely short period of time - and then returned back within a short time,
