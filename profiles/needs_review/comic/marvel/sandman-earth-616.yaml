  attack_potency:
    text: Large Building level+ (A long-time foe of Spider-Man, whom he has knocked
      outMarvel Team-Up Vol 1 2 in moreAmazing Spider-Man Vol 1 154 than one occasion
      and is generally portrayed as a a powerhouse among his foes. ClashedSilver Sable
      and the Wild Pack Vol 1 18 with Venom and Rhino multipleWebspinners Tales of
      Spider-Man Vol 1 18 times, although he had to put quite a lot of effort. Shattered
      a giant boulder. Destroyed a tank with ease. Can knock about and trade hits
      with the likes of MettleAvengers Academy Vol 1 14), at most Planet level (Fought
      the Hulk a few times, but ultimately he wasn't a matchIncredible Hulk Vol 1
      138 for him. Rivaled the Thing for a long periodFantastic Four Vol 1 148, but
      failed inFantastic Four Vol 1 177 keeping up with the progression of his strength,
      even though they battled againThing Vol 2 6 after that.), higher by absorbing
      sand
    source_ids:
    - vsbattles-sandman-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
