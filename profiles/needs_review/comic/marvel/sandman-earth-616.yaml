  durability:
    text: Up to Large Building level+ (Can control his density at will, making it
      so soft that any attack just pass through him, or so hard that even his strongest
      foes have troubled damaging him. Withstood an all-out blow from the Rhino, but
      got completely pulverized in another occasion. Even at the beginning of his
      career, he was hard enough to cause Spider-Man to hurt his hand when punching
      him. Clashed many times with the likes of the aforementioned characters and
      others such as Venom, withstanding blows even while not being explicitly in
      a rock-hard state), at most Planet level (Withstood blows from the Hulk and
      the Thing, but can't equal their actual power), higher by absorbing sand
    source_ids:
    - vsbattles-sandman-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: At least Athletic, likely higher (Is in a generally good fit condition and
      can partake in battles and long missions and infiltrations. His susceptibility
      to pain, damage and wounds is difficult to determine, given his unique physiology
      which allows him to endure a good deal of punishment. He was tough enough to
      endure a grievous beating against an opponent who could meddle with his ability
      to reformWeb of Spider-Man Vol 1 108, and got back in seconds once he had a
      moment to recover)
    source_ids:
    - vsbattles-sandman-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Tens of Meters via various abilities, far higher via absorption depending
      on the location.
    source_ids:
    - vsbattles-sandman-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average, possibly Gifted (Sandman is often mistaken for an idiot by
      both allies and foes, mostly because of his harsh and hot-heated attitude, but
      he has demonstrated many times to be much more than just brawn. He is a seasoned
      individual, with many years of experience in either committing or fighting crime.
      Sandman has been part of many groups and their different iterations, most notably
      the Frightfoul Four, the Sinister Six, the Wild Pack, the Avengers and more,
      with his valor being recognized by the likes of the Wizard, Silver Sable and
      Captain America. In his life he clashed with a great variety of metahumans,
      each with their own special abilities. Sandman knows dozens of creative ways
      to employ his powers, and has stated from time to time to having learned new
      tricks and applications, as well as having overcomed some of his weaknesses.
      In just a few minutes, he figured out he could transfer control of sand to others,
      while his alternate self took decades to learn it. Fought evenly with Spider-Man
      many times, and in a couple of occasions he managed to outsmart both Mister
      Fantastic and the Human Torch. Received science lessonsFantastic Four Vol 1
      61 from the Wizard, which allowed him to design his new costume. DisassembledAvengers
      Vol 1 333 a Doombot in moments, immediately understanding its structure. Knows
      how to driveMarvel Team-Up Vol 2 3 a jet plane. Was assigned to the trainingAmazing
      Spider-Man Vol 1 407 of the recruits of the Wild Pack, and personally trainedAmazing
      Spider-Man Vol 1 676 the Rhino. Can manipulate his sand with enough precision
      to interfere with the functioning of technological devices, achieving feats
      such as smotheringFantastic Four Vol 1 41 Trapster's vibro-shock pulsator, defusing
      a bomb,Solo Avengers Vol 1 7 and causing a robot to self-destructThe Amazing
      Spider-Man Vol 1 303)
    source_ids:
    - vsbattles-sandman-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
