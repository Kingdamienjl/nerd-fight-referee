        "a tempest fierce enough to scour the surface of the world down to its bedrock").
        Up to Galaxy level with lightning bolts (Can harm StardustFantastic Four Vol
        1 546). Varies, up to at least Multi-Continent level when accessing ambient
        energies and forces (Storm''s ability to manipulate the weather extends to
        the ambient energies and forces relative to her location, the effects of her
        powers depend on what she has access to. Using power from the galactic core,
        which was composed of millions of suns, Storm was stated to shine with the
        brightness of a star). Up to Outerverse level at her peak and accessing her
        godhead (Storm overpowered The Adversary and was stated to be a bigger god
        than him. Storm fought a group of entities including the Adversary, Bete Noir,
        the First Fallen, the Goblin Force, and the Elder God Annihilation, repelling
