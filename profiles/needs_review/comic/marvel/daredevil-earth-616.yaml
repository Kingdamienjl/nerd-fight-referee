    - field: intelligence
      value: 'Gifted normally, Genius in combat (Murdock not only has exceptional
        physical abilities, but he also has an impressive legal background. As a highly
        skilled and accomplished lawyer, he specializes in criminal justice, and his
        legal career is a major pillar of his emotional stability and relentless fight
        against crime for which the Murdock law firm is known that they engage in
        free labor and an unwavering commitment to eat a wide range of social justice
        issues. Through his legal expertise, Murdock takes on complex cases, including
        rape, hate crimes, police brutality, wrongful death, medical malpractice,
        whistleblower and witness protection issues, workplace violence, corporate
        employment fraud, LGBT abuse and workplace include inequality, child and sexual
        abuse claims, victims of war crimes and terrorism, food safety claims, vehicle
        recalls, anti-GMO food bias, even environmental issues His tireless efforts
        in court make him a strong advocate for those who have been marginalized or
        victimized by societal injustices. In law school, Murdock showed a keen interest
        in the American constitution. He immersed himself in the intricacies of this
        important part of American democracy, further enriching his legal knowledge
        and accurately analyzing complex legal situations Murdock''s broad understanding
        of constitutional principles he takes a different view of upholding justice
        and protecting the rights of the innocent) Standard Tactics: Matt''s behavior
        during a fight will depend on the enemy he is facing. Dealing with human enemies,
        Matt will 100% of the time avoid killing that person, but that doesn''t mean
        he will hold back in any way. He can let loose against enemies where it wouldn''t
        make sense to hold back, such as when facing enemies wearing powerful armor
        or enemies equal to or stronger than him. Dealing with bandits and thieves,
        Matt will always aim in places where he knows it will hurt - but not kill.
        The level of pressure applied to each of his blows is different not only against
        varied enemies, but will also depend on the location hit.Daredevil Vol 6 Issue
        2 When fighting against non-human enemies, such as animals, monsters, or the
        undead, Matt fights to kill.'
