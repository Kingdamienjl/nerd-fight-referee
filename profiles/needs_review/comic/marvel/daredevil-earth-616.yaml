    - field: standard_equipment
      value: '*Billy Club: Daredevil carries a billy club; as Matt Murdock, he carries
        it disguised as a blind man''s cane. The cane separates into two parts. The
        lower section contains a metal shaft and can be used as a weighted fighting
        baton. Daredevil formerly used the top section as a grappling hook, which
        contained a long cable. Variant early versions of Daredevil''s billy club
        could be converted into a boomerang or reconfigured into a rifle. His standard
        billy club housed an extendable "snooperscope" (a directional shotgun microphone
        further augmenting his enhanced hearing), a miniature tape recorder, a spring-reel
        grappling cable, and other items such as lock picks and gas capsules. center|400px
        *Daredevil Suit: Daredevil wears a stretch fabric (Lycra) costume, woven with
        steel fibers,Daredevil Vol 2 Issue 1 and soft leather boots and gloves. For
        a time, he briefly wore a costume composed of biometric materials, woven in
        the code of orb-weaver spiders, with a bricklike crystal pattern in abalone
        shell and twisted wire stands. This costume was gray and red, and protected
        him by both shapr and blunt trauma. Early in his career, daredevil sometimes
        wore a cowl lined with a radio receiver (the cowl''s horns serving as antennae)
        which picked up radio signals and amplified his radar sense. *U.S. Agent shield:
        After defeating John Walker, Daredevil took his shield as his own weapon.
        *Optional'
