  stamina:
    text: "Superhuman (Matt's stamina is similarly enhanced like his body is, since\
      \ he was able to hold his breath underwater for longer periods of time. At peak\
      \ capacity, he can physically exert himself for several hours before showing\
      \ any signs of fatigue. Matt is exceptionally tolerant to pain. He has survived\
      \ being knocked around in a car by Nitro, survived after slowing himself down\
      \ during a multi-story fall and being hit by a car. He kept fighting after being\
      \ immolated by Typhoid Mary while the same attack severely hurt Jessica Jones,\
      \ who has superhuman durability. On one occasion, he was able to continue functioning\
      \ for five days without any sleep, and on another he continued to function despite\
      \ having suffered a gunshot through both his hands that also grazed his head.\
      \ Daredevil has landed on the hood of a taxi uninjured following a controlled\
      \ fall and was able to kick the windshield hard enough to penetrate it and strike\
      \ the driver. After laying outside with no medical assistance, Daredevil passed\
      \ away only to utilize his chi to supercharge his bodily healing with the help\
      \ of Stick, regulating his heart and respiration to revive himself, sealing\
      \ cuts, setting the bone in his right leg and healing other unspecified bone\
      \ injuries. After being found and hospitalized, under demonic attack once more,\
      \ he was strong enough to fend off the assault and actually run from his room\
      \ to join the fight against demons invading New York City yet again. In this\
      \ state, he was able to take on a demon that had formed from the structure of\
      \ a subway train, walk against its blast of soul-attacking \u201Chellfire,\u201D\
      \ then spear it with rebar, hurting and frightening the demon enough to force\
      \ it to flee from him, before collapsing from exhaustion. Has a degree of mental\
      \ training to control his senses, a testament to the level of skill it requires\
      \ Matt to even function would be seen, when he fought Psylocke during the war\
      \ between the Avengers and the X-Men, as she was overwhelmed when she tried\
      \ to read his mind and found herself experiencing all the information he received\
      \ through his superhuman senses, demonstrating the scale of psychological training\
      \ required for Murdock to operate as a normal human)"
    source_ids:
    - vsbattles-daredevil-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
