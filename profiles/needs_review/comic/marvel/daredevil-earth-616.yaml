    - field: weaknesses
      value: "When underwater, his Radar Sense becomes useless and he doesn't know\
        \ where the amplified sound is coming fromSuperior Iron Man Issue 2 and because\
        \ the sound is more than 4 times faster underwater, it's hard for his brain\
        \ to process the information, though both these weaknesses were ignored, as\
        \ he said the advantage of being underwater is the faster sound speed.Daredevil\
        \ Vol 3 Issue 6 When exposed to loud sounds, such as devices made to incapacitate\
        \ him, he will feel pain and likely get knocked out. Attacks on his head renders\
        \ his Radar Sense disabled. His senses won't work very well when in crowded\
        \ places. Notable Attacks/Techniques: *Enhanced Senses: Daredevil\u2019s signature\
        \ Super Hero abilities are rooted in his extraordinary senses. His senses\
        \ of touch, smell, taste, and hearing are all heightened to superhuman levels,\
        \ allowing him to more than compensate for his lack of eyesight. **Radar Sense:\
        \ His greatest attribute. The ability to perceive the world around him despite\
        \ his inability to see, telling him the exact position and distance of what's\
        \ around him, almost akin to a sonar of sorts at its most simplified. Working\
        \ by use of his brain emitting an electromagnetic pulse wave in a sonar-like\
        \ fashion - scanning the environment around him before returning and signaling\
        \ back to him, ultimately relaying everything within range back to him in\
        \ extreme detail as a omnidirectional 3-Dimensional display, albeit with what\
        \ would be considered a low resolution, enabling the visually impaired Daredevil\
        \ to perceive not just what's in front of him but all around him including\
        \ what normally wouldn't be visible for an incredible distance of tens of\
        \ kilometers. This also allows him to tell how much heat something is absorbing\
        \ or reflecting which helps him deduce the coloring of objects based on their\
        \ heat retention, something he otherwise couldn't do due to his inability\
        \ to see, other advantages include its analytical and almost precognitive\
        \ uses such as predicting the future actions of othersDaredevil Vol 6 Issue\
        \ 20 or in extreme cases even sense the activation of Spider-Man's Spider-SenseDaredevil\
        \ Vol 2 Issue 20 (Which in itself is a precognitive sense of a high caliber).\
        \ Furthermore, Daredevil can \"see\" the structural integrity of environment,\
        \ objects and even living things, seeing the internals that comprise them\
        \ allowing him to pinpoint any and all physical flaws within and exploit those\
        \ weaknesses to the fullest as displayed against Absorbing Man while in a\
        \ diamond formDaredevil Vol 1 Issue 360 where he located tiny weak points\
        \ within his body and slowly broke him apart or sensing the stress placed\
        \ upon an enemy's bones and striking them to inflict massive damage.Daredevil\
        \ Vol 3 Issue 6 **Hearing: Arguably his greatest basic sense. Daredevil's\
        \ hearing is one of his best weapons, an ability heightened to such a ludicrously\
        \ large degree that he can hear just about anything and everything around\
        \ him for tens of kilometers and can pick out one sound in particular among\
        \ a sea of them, having trained himself to cut through the innumerable amount\
        \ of noises to find exactly what he's looking forDaredevil Vol 6 Issue 18\
        \ and is capable of manipulating his own auditory acuity to block out noises\
        \ he doesn't want or otherwise wouldn't need to hear such as his own heartbeat.\
        \ His ability to hear extends beyond just the volume, distance and range of\
        \ sounds but even frequency, pitch and more, capable of hearing a acoustic\
        \ change of a single decibel at a pressure of only 7 decibels - far beyond\
        \ human limits. Daredevil's hearing is so expansive that he can hear throughout\
        \ the whole of New York for single wordsDaredevil Yellow Issue 5 and at one\
        \ point he was able to listen into the whole of New York and pick up on criminal\
        \ acts as they were happening to report them to the authorities in rapid succession.Daredevil\
        \ Vol 6 Issue 7 Even before fully mastering his senses he could hear a pair\
        \ of alley cats trading hisses six city blocks away, follow a lover's quarrel\
        \ in a crowded restaurant, isolating voices and not missing a single wordDaredevil:\
        \ The Man Without Fear Issue 1 and later in life he displays such feats as\
        \ hearing an infant's heartbeat from several blocks away, listening to whispers\
        \ and inaudible noises through soundproofed walls,Daredevil Vol 2 Issue 44\
        \ and more. While the utility of this covers the basic utilizations as gathering\
        \ information due to discrepancies between sounds or simply by hearing information,\
        \ its usability extends beyond that as he can also deduce when someone is\
        \ lying or guiltyDaredevil Vol 2 Issue 38 (Despite not even being present),\
        \ distinguish people based on minuscule differences in heartbeat alone, he\
        \ can predict actions and movements even amidst combatDaredevil Vol 6 Issue\
        \ 20 or even the speed of something from the noise it's making. While one\
        \ of his best attributes it's also one of his main weaknesses - if taken by\
        \ surprise by a ridiculously loud sound or extreme stimuli, he can be overwhelmed\
        \ and potent"
