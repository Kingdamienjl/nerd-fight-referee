        \ discomfort when he had a wooden stick and a beer mug break against him,\
        \ respectively.&#91;207&#93; During an altercation with the Roxxon mercenary\
        \ Taskmaster, Miles was thrown through a brick wall without any apparent serious\
        \ injury, though the experience was a little bit painful for him.&#91;69&#93;\
        \ Superhuman Agility: Miles' agility, balance, flexibility, and bodily coordination\
        \ are all enhanced to levels that are far beyond the natural physical limits\
        \ of an Olympic-level gymnast. Superhuman Equilibrium: Miles possesses the\
        \ ability to achieve a state of perfect equilibrium in any position imaginable.\
        \ He seems able to adjust his position by instinct, which enables him to balance\
        \ himself on virtually any object, no matter how small or narrow. Superhuman\
        \ Reflexes: Spider-Man's reflexes are similarly enhanced and are currently\
        \ about 20 times greater than those of an ordinary human. In combination with\
        \ his spider-sense, the speed of his reflexes allows him to dodge almost any\
        \ attack.&#91;citation needed&#93; Wallcrawling: Miles can cling to any surface\
        \ using just his fingertips and feet. The extent to how much pressure he can\
        \ stick to walls is thus far unknown, except that he can handle lifting his\
