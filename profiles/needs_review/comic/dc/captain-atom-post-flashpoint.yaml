power_scale:
  tier:
    text: '{{Varies}}. {{4-B}}, higher in Evolved Form, up to {{High 1-C}} with Absorption
      and in Unrestricted State'
    source_ids: &id002
    - mediawiki-4717251
    confidence: 0.95
  attack_potency:
    text: Varies (Captain Atom's power levels vary greatly, and he has complete control
      over the output of his power levels. He can power himself down and up at will.
      In addition, he is mentally and emotionally somewhat unstable, which also tend
      to mess with his powers. Furthermore, his unstable physical form causes fluctuations
      in his power levels from time to time. And he can control how much power to
      draw from the Quantum Field). Solar System level (In an alternate vision, a
      Quantum-powered gorrila was able to overpower the Justice League. This was a
      vision shown to future Captain Atom who saw potentially different possibilities
      and how his powers could have been used differently. A burst of quantum flare
      proved too much for Hal Jordan to contain with his shield and left a portion
      of the city destroyed. Captain Atom has access to the infinite energies of the
      Quantum Field), higher in Evolved Form (However, it was hinted that in some
      ways, he might be superior to his former, unstable self.The Fall and Rise of
      Captain Atom Vol 1 3 Captain Atom has access to the infinite energies of the
      Quantum Field), up to High Complex Multiverse level with Absorption (Absorbed
      his future selves, who were far more potent than him, and fought his universe-destroying
      self for a brief period of time, before the latter was erased from history)
      and in Unrestricted State (If he were to stop holding back, give up on his humanity,
      and embrace his true power, he can become a space-time eating energy monster)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL+ usually (Can keep up with the Flash and had a long conversation
      in a fraction of a microsecond where everything was frozen. Perceives time at
      a much slower rate), higher in astral form (Caught up to Dr Megala's astral
      form who crossed interstellar distances in an extremely short period of time.
      Outpaced the expansion of energy and matter from the big bang. Kept up with
      the Big Bang as the universe was being created)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Unknown usually, at least Class 5 in evolved form (Lifted a large boudler
      with one hand)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Varies. Solar System level, higher in Evolved Form, up to High Complex Multiverse
      level with Absorption and in Unrestricted State
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Varies. Solar System level, higher in Evolved Form (Can take attacks from
      those whom he can harm. Casually tanked a 100-kiloton bomb), up to High Complex
      Multiverse level with absorption (Survived a few hits from his universe-destroying
      future self) and in Unrestricted State
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite. Never seems to run out of stamina. In addition, he is very closely
      connected to the Quantum Field, so he can draw upon its infinite energies.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Up to Planetary with energy attacks, Interdimensional with dimensional travel
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius. Nathaniel was never a smart person, but after acquiring his power,
      he had no choice but to learn more about the field of science, otherwise he
      would have not been able to use his powers in a proper manner. He needed to
      learn how matter and energy works so he can use his powers efficiently. When
      healing the cancer of Ratina, he followed the instructions of Dr Megala perfectly
      to the point where he was able to create tissues and proteins. Was able to outsmart
      an angry Dr. Megala, albeit in a very small way. Was able to deduce how Megala
      was controlling Firestorm in a matter of seconds.
    source_ids: *id002
    confidence: 0.95
