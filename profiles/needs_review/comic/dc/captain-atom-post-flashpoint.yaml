  name: Present Nathaniel speaking about his future self, Chrono Mota}} ==Summary==
    Nathaniel Adam was an airforce captain before he became part of Doctor Heinrich
    Megala's experiment to prove the M-Theory correct and discover something amazing.
    However, the experiment was a failure and Nathaniel Adam was considered dead for
    a brief period of time. In reality, Nathaniel had become a phantom, a ghost who
    recreated a body for himself from nothing. Once he returned back from the "dead",
    Nathaniel found himself changed on the deepest level possible. With the new found
    power, Nathaniel became the Quantum-powered hero known as Captain Atom. ==Powers
    and Stats
