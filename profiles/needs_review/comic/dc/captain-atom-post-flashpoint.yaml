      value: Genius. Nathaniel was never a smart person, but after acquiring his power,
        he had no choice but to learn more about the field of science, otherwise he
        would have not been able to use his powers in a proper manner. He needed to
        learn how matter and energy works so he can use his powers efficiently. When
        healing the cancer of Ratina, he followed the instructions of Dr Megala perfectly
        to the point where he was able to create tissues and proteins. Was able to
        outsmart an angry Dr. Megala, albeit in a very small way. Was able to deduce
        how Megala was controlling Firestorm in a matter of seconds.
