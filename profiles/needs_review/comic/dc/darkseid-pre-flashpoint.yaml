- id: claim-weaknesses-a86ac919
  section: weaknesses
  axis: weakness
  text: 'Darkseid is vulnerable to radion, a lethal substance to New GodsIt should
    be noted, however, that powerful New Gods like Kalibak are able to easily survive
    normal radion shots. When Darkseid was shot and weakened by the radion bullet
    he was already dying. Moreover, in order to fully incarnate in a lower plane of
    reality by possessing a human body, a noble soul must be corrupted, otherwise
    the process is not fully successful. Feats: Show/Hide * Used his energy to create
    Stayne, a being that proved to be a perfect match against Takion, and possessed
    all his powers * His anger scared the Lords of Chaos * Disintegrated Agogg, a
    being capable of easily overwhelming base Orion * Played around with John Stewart
    and his Darkstar team for exercise (Darkstars are the equals of Green Lanterns)
    * Wiped Vundabar from existence * Darkseid is so powerful that time collapses
    when he''s removed from his proper place in the timestream * Absorbed energy from
    Excalibur and stated he could accidentally destroy his servants that way - said
    servants were comparable to Pre-Crisis Kryptonians. He also absorbed energy from
    the Wand of Mentachem and Orb of Orthanax, as well as from Mordru, the Time Trapper
    (Controller), and the entire Sorcerers'' World * While weakened, controlled 3,000,000,000
    Daxamites at once * While weakened, used Omega Beams to swap Daxam and Apokolips
    (which resided in the mortal universe at the time) * While weakened, no-sold Pre-Crisis
    Mon-El''s attack before beating him instantly * While weakened, completely stomped
    the Legion with a myriad of abilities * Omega Beams easily caught Lightray and
    sent him hurtling through infinity * Omega Beams were able to cause the Spectre
    (Hal Jordan) pain before he began powering through them * Did not even move when
    Mantis blasted him with the full power of a Green Lantern ring * Slew other pantheons
    of gods and stole their power * Darkseid''s consciousness remained active and
    able to channel power despite his body having been destroyed/trapped in limbo
    * Won the war in heaven against New Genesis * [While dying] Broke the Orrery of
    Worlds across all of time and nearly dragged all its contents into a Multiversal
    singularity (that was explicitly Darkseid''s own singularity, not something that
    happened to already be there) that was one with Darkseid * [While dying] Created
    an endless number of realities to torture Shilo Norman * [While dying] Charged
    Batman with enough Omega radiation to destroy time'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
