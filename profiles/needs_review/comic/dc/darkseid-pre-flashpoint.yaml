power_scale:
  tier:
    text: Low 1-C | 1-A
    source_ids: &id002
    - mediawiki-4822030
    confidence: 0.8
  attack_potency:
    text: 'Low Complex Multiverse level (While significantly weakened, he defeated
      both Mordru and Time Trapper (Controller) and absorbed energy from all of the
      Sorcerer''s World, and was still weaker than normal. Highfather stated he was
      capable of destroying TakionTakion Vol 1 #1 who also admitted Darkseid was more
      powerful than he was. Has been show to be somewhat comparable toSuperman/Doomsday:
      Hunter/Prey Vol. 1 #2, May 1994 Post-Crisis Superman, though he generally loses.
      Is as powerful as Infinite-Man,Legion of Super-Heroes Vol. 3 #18, January 1986
      whose power could be used to destroy the Universe, including the timestream,Legionnaires
      Vol. 1 #18, September 1994 and stalemated the Time Trapper,Legion of Super-Heroes
      Vol. 3 #50, September 1988 which is consistent with statements of the Time Trapper
      being comparable to Darkseid.Who''s Who in the Legion of Super-Heroes Vol. 1
      #7, November 1988Who''s Who: The Definitive Directory of the DC Universe Vol.
      1 #23, January 1987 Significantly superior to average New Gods, who can create
      UniversesMister Miracle Vol. 3 #1, April 19965-D) can ignore conventional durability
      in many ways | Outerverse level (Exists in the Sphere of the Gods, an archetypal
      and platonic world, as a living idea,Batman Vol 1 #702 with all evil in the
      Multiverse consolidating into him as its focal point.Justice League Incarnate
      Vol 1 #1 With his power, Darkseid, encompassed the flimsy white fabric behind
      reality where unfold universal creation and destruction and where Psycho Pirate
      watches reality.Infinite Frontier Secret Files Vol 1 #6 Killed the Quintessence
      using his Omega BeamsInfinite Frontier Vol 1 #0)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (52 quintillion times - Flew to the edge of the universe
      in moments, on more than one occasion. Capable of blitzing Post-Crisis Superman)
      | Immeasurable, Multilocation with the Anti-Life Equation (Under the influence
      of the Anti-Life Equation, everyone was an extension of Darkseid's will, all
      one with Darkseid)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Multi-Stellar, possibly higher himself (At least comparable to
      Pre-Crisis Superman), as low as Stellar when operating through avatars (Comparable
      to Post-Crisis Superman) | Immeasurable
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Low Complex Multiverse level (Comparable to Post-Crisis Superman) | Outerverse
      level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: 'Low Complex Multiverse level (Should be comparable to his own power, as
      he survived his own Omega Beams.Action Comics Vol. 1 #586, March 1987 Took no
      damage from a heavily amped Pre-Crisis Superboy and Supergirl. Orion would require
      every bit of his strength to kill DarkseidNew Gods Vol. 3 #19, August 1990)
      | Outerverse level (Should be comparable to his own power)'
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Can fight for long periods of time, even in realms like the
      Source where the concept of time ceases to have meaning. However, Darkseid has
      expended his entire store of Omega energy before, becoming tired and needing
      rest) | Infinite (Non-corporeal abstract being)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Low Complex Multiversal (The range of his power extends from his own universe
      into the mortal one) | At least Outerversal (Capable of affecting the entire
      Orrery)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Supergenius (Has countless years of experience in strategy, military tactics,
      governing, and scientific pursuit. He regularly draws chess matches against
      Eclipso, a cosmic entity and former embodiment of God's Wrath, and built a spaceship
      larger than the state of New York. Darkseid is responsible for some of the most
      advanced scientific breakthroughs in the DCU, creating technology capable of
      penetrating the Source, accessing the realm of Anti-Life, stealing part of the
      Anti-Life Entity's power, combining and manipulating fragments of the Anti-Life
      Equation, and turning Mars into a copy of Apokolips. His mind is also extremely
      adaptable, capable of comprehending the warped dimension of Olympus without
      any effort, while Superman was completely bewildered by it. The Pre-Flashpoint
      emanation of Darkseid even remembers events from erased timelines)
    source_ids: *id002
    confidence: 0.8
