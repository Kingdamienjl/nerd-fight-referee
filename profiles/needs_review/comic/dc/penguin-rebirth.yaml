    - field: powers_and_abilities
      value: '* Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) * Superhuman Athleticism (Can leap inhumanly high)
        * Hand to Hand Combat Mastery (Studied Martial Arts in Asia, to the point
        that he''s become a "master fighter" who can hold his own against Batman,
        the Joker, and the Kabuki Twins. Used a momentum-based throw to get free of
        Joker''s hold) * Weapon Mastery with various umbrellas (Uses his umbrellas
        with great finesse, whether they be his sword/chain-sickle umbrellas or projectile-based
        umbrellas - for example, he has such precise control over his sickle umbrella
        that he can use it to grab a priceless artifact without damaging it whatsoever)
        * Stealth Mastery (Stalked around a room in such a way that Batman couldn''t
        get a bead on him, and appeared behind him) * Acrobatics (Uses flips and other
        such maneuvers while moving around - could even rebound off a wall after being
        thrown to kick back at his opponent) * Preparation (Put together the Sun Channeler
        to hold Gotham hostage during "The Bat, The Bird, and the Very Ugly." Assembled
        a bomb for a heist. Built the Penguin Phoenix to kill Batman. Arranged for
        a volley of rocket umbrellas to level Wayne Manor) Various Umbrellas provide
        him with: * Fire Manipulation (One of his umbrellas can emit a jet of searing-hot
        flame) * Light Manipulation and Energy Projection (with his Laser Umbrella)
        * Explosion Manipulation (One of his umbrellas can release a miniature bomb,
        and his Rocket Launcher umbrella emits explosive rockets) * Electricity Manipulation
        and Paralysis Inducement (His sickle-and-chain umbrella can bind foes in its
        chain and electrify itself) * Sleep Manipulation (with his Knockout Gas Umbrella)
        * Directionally Limited Flight (with his Helicopter Umbrella and Rocket Umbrella)
        Other Optional Equipment provides him with: * His birds have Flight and Natural
        Weaponry with Talons. * Sleep Manipulation (with Knockout Gas Capsules) *
        Large Size and Fire Manipulation (Type 0: The Penguin Phoenix is a huge robot
        which can shoot a large spout of flame from its mouth) * Explosion Manipulation
        (with his Volley of Rocket-propulsed Umbrellas and a Bomb) * Paralysis Inducement
        (with Bola) * Energy Projection and Light Manipulation (with the Sun Channeler)
        * Animal Manipulation (Once used a sonic emitter to control bats) With the
        Green Lantern Ring, Penguin can utilize: * Flight (Utilizes true flight with
        the ring) * Telekinesis (Carried his umbrella using energy) * Energy Projection
        (Should be able to fire beams of Emerald Energy) * Construct Creation (Used
        the ring to create various energy constructs, such as a boot, an electric
        whisker, a hand, a vacuum, an umbrella, a boxing glove, a net, etc) * Forcefield
        Creation (Created a barrier to block attacks) * Vacuum Creation (Created a
        vacuum construct to suck up objects) * Paralysis Inducement (Confined Batman
        and Robin in a net construct)'
      source_id: character-stats-profiles-penguin-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Small Building Level+ physically (Scaling to 0.226 Tons - Is a consistent\
        \ opponent of Batman, harming him on many occasions with melee attacks, including\
        \ a barrage of kicks which seems to have temporarily KO\u2019d the Dark Knight.\
        \ Traded blows with the Joker for a time. Can hold off both the Kabuki Twins\
