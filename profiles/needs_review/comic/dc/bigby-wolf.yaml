- id: claim-weaknesses-df6f1b39
  section: weaknesses
  axis: weakness
  text: 'He can be weakened and killed by silver or powerful magic. Notable Attacks
    and Techniques: *Fable Physiology: As a Fable, Bigby is extremely difficult to
    kill. Fables grow in power the more popular and well-known they are by mundane
    humans, and become extremely hard to kill, or even capable of healing or even
    resurrecting from damage, albeit after some time. As a powerful and very well
    known Fable, Bigby should be equal or greater to the likes of Prince Lawrence
    who was capable of surviving for a week after cutting his wrists and overdosing
    on sleeping spills and even survived for some time after shooting himself in the
    head, and the likes of the Jersey Devil who was able to keep fighting after being
    impaled through the chest and survived having an axe in his skull. *Huff and Puff:
    Bigby''s Huff and Puff is the power he used in the tale of the three little pigs
    (though he was only a pup then, and could easily blow down a brick house now).
    The wind he breathes out is strong enough to knock over all the trees in a massive
    section of forest and cause hurricanes. Additionally, he can use it to "show the
    local winds who''s boss", gaining control over them and allowing him to use them
    to do things like keep his prey downwind so he can smell them without them smelling
    him. Note: Despite being published by Vertigo comics, Fables is not canonically
    part of the wider DC universe.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8fb111a4
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses (In particular, his sense
    of smell and hearing. Were he not constantly dulling his senses through chain
    smoking, he would be able to smell and hear everything across all of New York),
    Regeneration (Low-Mid to Mid normally), Resurrection&nbsp;(Popular Fables are
    capable of eventually resurrecting even after being killed), Air Manipulation
    (Can "huff and puff " powerful winds from his mouth, can intimidate spirits of
    the air into following his commands), limited Self-Sustenance (Type 1. Can hold
    his breath for over three weeks straight, and is described as being "impossible"
    to drown), Shapeshifting (can change form at will, primarily between his human
    worm, wolf form, and werewolf form), Immortality (Type 1, 3 and 4. Popular Fables
    can eventually resurrect), Power Nullification (only in his broken form - he leaks
    raw wild magic into the world, which unravels spell structures, including those
    of Mister Dark), Resistance to Cold Temperatures (swam from Russia to Alaska and
    noted that the cold doesn't get to him), Resistance to Mind and Soul Manipulation
    (returned from the afterlife to the living world, an experience described as taxing
    on mind, body and soul. Was fighting Leigh Douglas's control over him)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
