        \ members of the League of Assassins. Batman has even complimented her skillsBruce\
        \ Wayne: No Road Home - Batgirl, December 2010. Standard Tactics: Stephanie\
        \ is primarily a hand-to-hand fighter, and she tends to open fights with an\
