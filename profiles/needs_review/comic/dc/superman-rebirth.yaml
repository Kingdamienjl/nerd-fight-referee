- id: claim-weaknesses-1cb05569
  section: weaknesses
  axis: weakness
  text: 'Kryptonite (various types), he is entirely dependent on the Stellar Radiation
    of a Yellow Star to sustain his powers (if he''s deprived of Sunlight, he slowly
    loses his powers), the Stellar Radiation of a red star (weakens him due to red
    Stellar Radiation having less energy than that of a yellow or blue star), Magic
    (susceptible to it instead of weak against it, since he resisted a magical blast
    which could destroy a planet to some extent), he cannot see through lead. Notes:
    *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. *After discussion and consideration, we have concluded
    that Superman shouldering the burden of Atlas by lifting the heavens is not a
    proper lifting feat, since it was intended to be metaphorical and powered by hope,
    confirmed by the writer of the story. *We do not consider Superman''s ability
    to harm The World Forger after an unknown number of sun dips to be an outlier.
    However, given that the power-up in question required so extremely situational
    circumstances, with Superman first being elevated to a higher level of existence
    by Mister Mxyzptlk, and then supercharged on top of that, the statistics for it
    are not listed in this profile page, due to our rules regarding such situational
    and temporary amplifications listed here. ==Gallery== Superman Vol 5 1.jpg Mh20hC5C.jpg
    Superman2025.png|2025 ==Notable Matchups== Victories: *Garou (One-Punch Man) Garou''s
    profile (Parallel Timeline Awakened Garou and Post-Rebirth Superman were used.
    Speed was equalized.) *Bowser (Super Mario Bros.) Bowser''s Profile (Both were
    3-C, speed equalized, bloodlusted, had prior knowledge, and the battle took place
    in lake lap cat) Losses: Inconclusive: *Zero (Mega Man) Zero''s profile (Speed
    was equalized) ==References== {{Scroll box|{{Reflist|2}} }} ==Notes/Explanations==
