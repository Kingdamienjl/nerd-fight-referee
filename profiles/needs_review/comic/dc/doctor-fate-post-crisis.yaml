    - field: powers_and_abilities
      value: Superhuman Physical Characteristics (See Speed and Durability), Magic
        (Wields magic, as the world's premiere sorceror), Empowerment (Is empowered
        by the Helmet of Nabu), Flight (Can freely fly via magic), Longevity (Is over
        a hundred years old), Extrasensory Perception (Can perceive disturbances in
        magic, as seen when he perceived Solomon Grundy's rise from the dead and sensed
        Icthultu's presence), Energy Projection (Can fire blasts and beams of magical
        energy - even if his hands are occupied, he can fire beams from his eyes),
        Teleportation (Shown here and here), Forcefield Creation (Shown here, and
        also put a barrier around his temple), Explosion Manipulation (Used a spell
        that caused an old one to explode), Fire Manipulation (Gave these gargoyles
        the power to breathe fire), Paralysis Inducement (Restrained the Flash), Danmaku
        (Fired a scattershot barrage of magic), Pocket Reality Manipulation (Stored
        Hawkgirl's mace in a pocket dimension), Smoke Manipulation (Used smoke alongside
        a spell that depicted the history of the Trident of Poseidon), Duplication
        (Made dozens of clones of himself), Intangibility (Rose through the floor),
        Mind Manipulation (Interfaced with The Flash's mind and accidentally contributed
        to him and Lex Luthor switching brains), Homing Attack (His energy blasts
        changed direction twice in mid-air to hit the tentacles Fate was trying to
        destroy), Memory Manipulation (with a "spell of revelation," gave Grundy his
        memories back), Telekinesis (Lifted a man into the air), Preparation (Prepared
        a spell to fend off the old ones, and prepared a spell to reverse the mind
        swap between the Flash and Lex Luthor), Portal Creation (Created portals and
        sent people across the planet through them), Dimensional Travel (Brought himself,
        Grundy, and three Leaguers to the realm of the Old Ones), BFR (Sent Aquaman
        back to Atlantis), Creation (Created a stone golem, which is also Earth Manipulation.
        Created a bridge construct), Clairvoyance (Saw Solomon Grundy's hidden memories)
      source_id: character-stats-profiles-doctor-fate-post-crisis-dc
