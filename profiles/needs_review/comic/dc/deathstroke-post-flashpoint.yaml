    \ Senses (Can see faster than a normal human,Deathstroke (1991) #2 all of this\
    \ senses are increased by a thousandfold.The New Teen Titans (1980) #10 Can detect\
    \ attacks outside his line of sight by feeling slight shifts in the air.Deathstroke\
    \ Vol 2 #9 Has thermal scanning lenses in his maskTitans (2008) #25), Genius Intelligence,\
    \ Precognition (Deathstroke\u2019s mind is a supercomputer designed to process\
    \ information with superior tactical and strategic thought, allowing him to predict\
    \ an enemy's movements before they make them), Photographic Memory,Deathstroke\
    \ (2016) #36 Acrobatics, Preparation, Underwater Breathing (Type 3Dark Nights:\
