  intelligence:
    text: 'Extraordinary Genius (Despite all of his enhanced physical attributes and
      healing, Slade''s real superpower is his intellect. His strategic genius is
      arguably superior to Batman. Outsmarted Batman on multiple occasions. Easily
      saw through a Teen Titan''s trap that uses Djinn''s magic and had help from
      Jericho. Batman doesn''t even try to understand his real motives. Figured out
      the true person that sent out Damian Wayne''s fake blood test results, while
      even Batman couldn''t. Has eidetic memory, remembered a guy he saw for three
      seconds a decade ago. Nonchalantly figured out Batman''s identity and sneaked
      up on him, putting a gun to his face. Managed to tap into the Speed Force to
      gain superspeed, but later lost it after gaining a higher consciousness. Deathstroke
      enhancements also evolved his brain, granting him an enhanced mental capacity,
      causing his mind to operate at peak efficiency, nine times beyond that of a
      normal man.Batman (Volume 3) #86, p. 11 He describes his mind as a super-computer
      designed to process information and break it down with superior tactical and
      strategic thought.Deathstroke (Volume 2) #9, p. 7)'
