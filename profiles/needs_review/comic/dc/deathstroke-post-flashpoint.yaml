    \ fatal blow from Rose's sword, having every bone in his body break and from third\
    \ degrees burns over 90% of his body. He can recover from bullet wounds in mere\
    \ secondsDeathstroke (2016) #4) and Healing (His healing factor flushed out 1,000\
    \ mL of drain cleaner from his system overnight;Deathstroke (2016) #25-26 and,\
    \ because of his healing factor, anti-rejection medicine was not required after\
