  section: equipment
  axis: equipment
  text: 'Various blades, firearms and explosives. *The Deathstroke: It is an antique
    war blade that Slade won in a poker game. It was later re-cast in Promethium that''s
    capable of absorbing an enormous amount of any kind of energy. *Titanium Staff:
    His titanium staff can fire powerful energy blasts. Its mode can be switched from
    "stun to kill", and it can be split into two to produce ultrasonics. Optional'
