- id: claim-weaknesses-ab939479
  section: weaknesses
  axis: weakness
  text: 'If his armor is sufficiently damaged, his energy may leak out | None notable
    Notes: *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. For information on the cosmological scaling that
    informs the tiering, please refer to the DC Comics Cosmology page. *The destruction
    of infinite universes occurred in a finite amount of time, as the first to be
    destroyed was Earth-Three at the beginning of the story. *The original Anti-matter
    wave was Mobius'' doing. *The Anti-Matter cannon was only built when only 5 of
    the infinite universes had not yet been destroyed because Mar Novu''s dying act
    was to make a netherverse from his energy, absorbing and protecting the remaining
    universes, while his tuning forks partially merged them, fortifying them. *Anti-Monitor
    created his Anti-Matter Wave by taking advantage of the nature between Positive
    and Anti-Matter, and the two being unable to coexist. As such, his Anti-Matter
    Wave shouldn''t be combat applicable within a Versus Match up. *Anti-Monitor was
    barely fully reformed during the Sinestro Corps War story and was still fragile
    inside his armor, a weakness the Guardians of the Universe took advantage of to
    inflict massive damage on him and Superboy-Prime then delivered the final blow.
    As such, Anti-Monitor shouldn''t scale to the Guardians of the Universe. ==Gallery==
    MobiusFirstAppearance.png|Original appearance MobiusRedesignedArmor.png|Second
