  attack_potency:
    text: 'Varies (The Anti-Monitor''s power varies depending on how much energy he
      has within him). Low Complex Multiverse level (Equal to The Monitor. Darkseid
      would not escape him after he''s done with the infinite universes and could
      destroy Apokolips. Defeated Earth-1 Superman. Far superior to normal Green Lanterns,
      and could fight against the Guardians of the Universe. Could kill Cyborg Superman,Green
      Lantern Vol 4 #22, October 2007 and Superboy-Prime had to wait until the Anti-Monitor
      was weakened in order to kill him), higher with Energy Absorption (Absorbed
      the Anti-Matter Universe, which had already absorbed an infinite number of universes.
      After stealing the heroes'' life energies to replenish what he lost upon breaking
      through to the Dawn of Time, he would have become the hand of creation and made
      it so the positive matter multiverse never existed. He battled a heavily-amplified
      Spectre). Low Complex Multiverse level Environmental Destruction via Anti-Matter
      Wave (He caused an Anti-Matter wave that targeted all worlds in all times,Crisis
      on Infinite Earths Vol 1 #10, January 1986 intending on destroying the infinite
      universesCrisis on Infinite Earths Vol 1 #5, August 1985) | Low Complex Multiverse
      level (Comparable to his COIE self. The Anti-Life Equation gave Mobius power
      on a universal scale,Justice League Vol 2 #48, April 2016 and Metron was concerned
      that he would destroy realityJustice League Vol 2 #40, June 2015) | Outerverse
      level+ (The Brothers Three are three of the four most powerful known beings
      in the Sixth Dimension, superior to Mister MxyzptlkJustice League Vol 4 #19)'
    source_ids:
    - vsbattles-anti-monitor-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
