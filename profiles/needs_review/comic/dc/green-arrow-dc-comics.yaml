        work. As a well-built grown man with ample martial arts training and enough
        superhero experience to have had a sidekick, it stands to reason GA would
        be stronger than Rocky Ballentine (a relatively normal woman whose only training
        was a women's self-defense course), who could contend with and harm Jay and
        Lark - the latter two being capable of kicking someone through a wall. He
        should also be stronger than borderline-civilian Kathy Duquesne, who destroyed
        a wooden crate with one kick. Can casually knock grown men out in one hit),
        higher with Impact Arrows (Could injure the Huntress, and were implied to
        be possibly helpful against Wildcat. Ripped through Dark Heart drones, which
        were unhurt by machine gun fire. Oneshot a Parademon), at least Small Building
        Level, possibly higher with Explosive Arrows (Has created massive explosions,
        with one being capable of destroying a military-grade helicopter), far higher
        with Quantum Arrow (Created an explosion this size)
