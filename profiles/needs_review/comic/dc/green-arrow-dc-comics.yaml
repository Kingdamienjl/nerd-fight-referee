        who could keep up with and land hits on Batman, and moved in tandem with a
        Lantern beam at close range, blocking it with his hand. Believed he could
        release his bowstring to fire arrows quicker than Huntress (who could dodge
        attacks from a bloodlusted Wonder Woman and keep up with Roulette, who side-stepped
        a sound wave at close range) could move. Avoided gunfire and attacks from
