    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Genius Intelligence, Natural Weaponry
        (Teeth and Claws), Beyond-Dimensional Physiology & Abstract Existence (Type
        2) (Exists as the embodiment of evil dichotomies and an 'idea' formed by the
        Overvoid, beyond any conceivable mathematical dimension of the multiverse),
        Large Size (Type 11), True Flight, Likely Limited Self-Sustenance (Types 1
        & 2. Though he needs to feed off of story in order to survive, the time frame
        of when he needs to do this is unknown. Though, it's likely he survived off
        of little to no food during his time sealed away), Energy Manipulation, Poison
        Manipulation, Heat Manipulation, and Energy Projection (Can fire energy blasts
        from his hands and laser beams eyes, with the blasts being compared to the
        heat of ten-billion suns and his eyes said to have poison within them), Immortality
        (Types 1, 2, 3, 5, & 9) & Regeneration (True-Godly) (Monitors are immortal
        and cannot age, existing before time itself. It is implied that Mandrakk and
        the Thought Robot would've been capable of keeping up their battle forever.
        Exists as the immaterial idea of evil, the conceptual embodiment of the bad
        side of every dichotomy that maintains a balance with the embodiment of goodness
        and hope across the multiverse, Superman. Even after being impaled, burned
        alive by heat vision, and sent hurdling into the Overvoid by the Thought Robot,
        he survived, and was even able to survive despite being weakened. Returned
        even after being consumed by Rox Ogama. Should be comparable to other Monitors,
        who can regenerate after being conceptually erased out of the multiverse's
        space, time, and history), Cosmic Awareness (Constantly senses the multiverse's
        structure, aware of a new universe being added to the original 52 despite
        being sealed off), Size Manipulation & Dimensional Travel (Capable of altering
        his scale and pitch, allowing for him to cross creation and reach Nil from
        the Dark Multiverse), Plot Manipulation, Absorption, Empowerment, Dimensional
        Manipulation, Conceptual Manipulation, Space-Time Manipulation, and Existence
        Erasure (As a cosmic vampire, he is able to feed off not only the blood of
        other people to grow stronger, but the very essence and lifeblood of whole
        universes. The Overvoid sent him into the multiverse in order to consume every
        story of the DC Multiverse, including that of higher-dimensional realms and
        conceptual realities like Comic Book Limbo. It was stated that Superman is
        "the only story he cannot consume"), Reactive Evolution (Could match the Thought
        Robot's adaptation, the two growing stronger alongside each other as the fight
        progressed), Telepathy & Mind Manipulation (His mental signal which spread
        across all creation can cause intense mental pain, which Mandrakk used to
        lure in victims for him to devour), Biological Manipulation and Corruption
        (Type 2) (Rox Ogama, while using Mandrakk's powers, turned Ultraman into a
        vampire), Possibly Possession (It's implied that the consciousness of Dax
        Novu was carried over when Rox Ogama consumed his body, as he already knew
        who Superman was), Resistance to Narrative Erasure (Survived falling into
        the Overvoid, which erases you out of existence with a potency even greater
        than Comic Book Limbo, which is the equivalent of being 'forgotten' by the
        story), Plot Manipulation (As the strongest of the Monitors, he is beyond
        all stories within the DC Multiverse), and Heat Manipulation (Could withstand
        Superman and Ultraman's respective heat vision amplified through the Thought
        Robot without much trouble)
