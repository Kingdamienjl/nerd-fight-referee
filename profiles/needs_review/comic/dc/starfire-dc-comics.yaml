    text: At least High Universe level (can harm beings comparable to her, slew a titan on the level of titans and olympians that were going to shake the cosmos, the DC Universe consistently stated to be infinite. Was stated to be the only titan able to stop Demon Raven and the strongest titan by Beast Boy with Raven having the capacity to turn the heavens to ashes and having the power within herself to destroy a universe. Crashed through Trigon's skeleton, with the same Trigon being a multiversal entity comparable to the Spectre and even at 1/10th his power was able to destroy a universe), likely Universe level+ (Wields power that defies measure and imagination, Superior to Connor Kent and Cassie Sandsmark, Connor Kent can break Lex Luthor's warsuit, broke free from Pre-Crisis Supergirl and Powergirl 1 2, takes numerous blows from Silver Age Superboy, survived a blow from Kingdom Come Superman, fought against a clone of Doomsday, Orion, and Superboy Prime, Cassie Sandsmark can destroy Superman androids, nearly as strong as Superman himself, fought Devastation who is equal to Wonder Woman and withstands attacks from Lex Luthor's warsuit. Has harmed Firestorm and Etrigan with her strikes. Starfire can overpower Donna Troy and was able to knock back and stated to be able to beat her titaness form Troia, Donna Troy able to get the upper hand on Superwoman, evil universe counterpart to Wonder Woman and survive an explosion that hurt Superboy Prime. Starfire fought Post-Crisis Wonder Woman herself and hurt Silver Age Wonder Woman with a starbolt. Starfire also hurt Envy with Wonder Woman's powers. Harmed Sinestro with her starbolt and has harmed Green Lantern level entities on numerous occasions), Higher with nova (amplifies her power drastically briefly)
