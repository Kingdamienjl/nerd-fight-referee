  intelligence:
    text: "Gifted (Shiva is skilled practitioner of medicine, with Richard Dragon\
      \ claiming that her skills of healing are just as good as her skills of harming.\
      \ She was able to heal the Question from a bullet wound in his headThe Question\
      \ (1987) Comic - Issue #2 and revive him. She also instantly healed his injured\
      \ armQuestion Vol. 1 #29, August 1989 and instantly relieved the pain in Black\
      \ Canary\u2019s neckBirds of Prey Vol. 1 #64, April 2004. Extraordinary Genius\
      \ (Prior to her defeat at the hands of Cassandra Cain, Lady Shiva was hailed\
      \ as the greatest martial artist in the world, with even the likes of Batman\
      \ being unable to beat her in single combat. She is a master of all fighting\
      \ forms and learns a dozen new disciplines every year. Shiva is precise enough\
      \ to shatter bone in a way that will send the shards into the arm\u2019s nerves.\
      \ She is also able to figure things out mid-fight, as she learned the weak points\
      \ of Shadowdragon\u2019s suit during their duel and deduced that Cassandra Cain\
      \ was a former assassin by reading the moves that she didn\u2019t make. Her\
      \ skills have also allowed her to defeat those vastly more powerful than her,\
      \ like SupergirlWonder Woman Vol. 2 #175, December 2001) Standard Tactics: Shiva\
      \ fights with hand-to-hand almost exclusively, although she will occasionally\
      \ wield melee weapons like nunchucks or swords. She always goes for the kill,\
      \ and tends to insult her opponents mid-fight to make them lose their composure\
      \ and fight sloppily."
    source_ids:
    - vsbattles-lady-shiva-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
