    \ that will send the shards into the arm\u2019s nerves. She is also able to figure\
    \ things out mid-fight, as she learned the weak points of Shadowdragon\u2019s\
    \ suit during their duel and deduced that Cassandra Cain was a former assassin\
    \ by reading the moves that she didn\u2019t make. Her skills have also allowed\
    \ her to defeat those vastly more powerful than her, like SupergirlWonder Woman\
    \ Vol. 2 #175, December 2001) Standard Tactics: Shiva fights with hand-to-hand\
    \ almost exclusively, although she will occasionally wield melee weapons like\
    \ nunchucks or swords. She always goes for the kill, and tends to insult her opponents\
    \ mid-fight to make them lose their composure and fight sloppily."
