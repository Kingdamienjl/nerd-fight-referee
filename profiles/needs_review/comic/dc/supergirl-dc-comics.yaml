        knowledge, and imagination of the user. **Rage Plasma: The Red Lantern can
        vomit plasma, which has been described as napalm and acid mixed together,
        it burns away at anything. It can be surmised that is the effect of the internal
        rage on the blood. These flames burn even in space. The effect it has on living
        beings allows it to ignite the flames of rage in a victims'' blood and has
        the effect of burning through an energy aura of an opponent as well as corrupting
        other power rings depleting them at an accelerated rate and greatly weakening
