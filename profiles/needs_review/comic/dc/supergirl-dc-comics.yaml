      value: 'Tier: 2-A | 2-A | High 1-A Name: Lana-El, Lana Loud, Lana-El Prime Origin:
        DC Comics Gender: Female Age: 7 Classification: Kryptonian from Earth-Prime
        Powers and Abilities: Superhuman Physical Characteristics, Heat Vision, Super
        Hearing, X-Ray Vision, Telescopic Vision, Microscopic Vision, Solar Energy
        Absorption, Regeneration (At least Mid-Low, should be comparable to her Post-Crisis
        counterpart, who can heal from having his throat slashed), Flight, Ice Breath,
        Super Breath, Reality Warping (Can alter timelines with her punches, which
        is likely a result of her future self, Resistance to Mind Manipulation, Magic,
        Telepathy, Telekinesis, Soul Manipulation, Death Manipulation, Reality Warping,
        Matter Manipulation, Antimatter Manipulation (withstood attacks from the Anti-Monitor),
        Quantum Manipulation (withstood attacks from Monarch), BFR (escaped the Phantom
        Zone and the Speed Force), and Kryptonite. Attack Potency: Multiverse level+
        (Comparable to Pre-Crisis SuperLuan. Fought Earth-2 SuperLuan and Post-Crisis
        SuperLuan. Scaled to Anti-Monitor Ganon, who unleashed an antimatter wave
        that struck all worlds in all times and reduced infinite Universes into five
        of them. Fought toe to toe with Sodam Yamcha. Affected the entire New Earth''s
        universe with his "retcon punches" in a weakened state. Fought Monarch Mouse,
        and breached his armor while running out of power. Stated that armor contained
        enough quantum energy to destroy the Space-Time Continuum of the Universe
        they were in) | Multiverse level+ (Should be stronger than Lana El-Prime.
        Should be at least as powerful as Time Trapper who would have destroyed all
        time itself across the whole Multiverse) | High Outerverse level (Fought The
        Darkest Metal Knight in a prolonged confrontation. At the latter part, she
        admitted that she couldn''t beat Prime) Speed: Immeasurable (Capable of outpacing
        Jenni Ognat when she was running through time. The only way for Bunnicula
        Allen to beat Prime to the main DCU was for him to absorb the entire Speed
        Force. Dodged and outblitzed Bunnicula, Lana Loud, and Rita Loud. Comparable
        to Post-Crisis SuperLuan, who flew into the Hyperspace, which is beyond the
        Space-Time, she also flew out of the Source after Highfather said that it
        would be impossible to do) | Immeasurable (Is a sentient timeline and exists
        outside of the flow of linear time) | Irrelevant (Kept up with The Darkest
        Metal Knight) Lifting Strength: Immeasurable (Comparable to Pre-Crisis SuperLuan
        and Post-Crisis SuperLuan who lifted Spectre Ganon and removed the Highfather
        Staff from the Source Wall) | Immeasurable | Irrelevant (Comparable to The
        Darkest Metal Knight) Striking Strength: Multiversal+ | Multiversal+ | High
        Outerversal Durability: Multiverse level+ | Multiverse level+ | High Outerverse
        level Stamina: At least Extremely high to an unknown degree | At least Extremely
        High | Irrelevant Range: Multiversal+ | Multiversal+ | High Outerversal Standard
        Equipment: The Anti-Monitor Armor | Unknown Intelligence: At least Above Average.
        Lana El-Prime achieved a high school-level education, but her increasing psychosis
        has left her childlike and unstable, often making irrational decisions and
        coming up with childish retorts and taunts on a regular basis and entering
        psychotic tantrums whenever she is slighted. However, she is fairly skilled
        at hand-to-hand combat and has full mastery of her powers, allowing her to
        overpower most opponents simply by attacking them repeatedly with her overwhelming
        brute strength. Weaknesses: She is susceptible to Red Sunlight (though the
        Anti-Monitor armor negates this weakness). She has an innate fear of the Flashes
        due to being sealed in the Speed Force for a significant amount of time. Lana
        El-Prime is dangerously psychotic and insane and will act irrationally at
        the slightest provocation.'
