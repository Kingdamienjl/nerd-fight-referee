  attack_potency:
    text: Small Building level+ (Comparable to Katana)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Supersonic+ (Casually danced around Killshot and dodged gunfire
      from the Penguin. Dodged a bullet at point-blank range), possibly Hypersonic+
      (Comparable to Batman)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class 1, likely Class 5 (Comparable to Red Hood, able to hold back
      an Orca's bite)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Small Building level+ (Has subdued characters as tough as Bane and Killer
      Croc)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small Building level+
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Can take on packs of thugs single-handedly; even broken ribs
      don't slow him down)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range normally, Extended Melee Range with Escrima Sticks,
      Tens of Meters with Batarangs
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (Nightwing is an incredibly skilled martial artist, having been trained
      by the best in the DC Universe, including Batman, Black Canary, and Lady Shiva.
      He has defeated foes far above his weight class such as Killer Croc, and easily
      takes down scores of henchman non-lethally. Being the world's greatest acrobat,
      he is a supremely agile combatant, frequently making use of parkour to pull
      off improbable and nearly impossible maneuvers to catch foes off guard [such
      as jumping out of a helicopter, grabbing the landing rails, and using his momentum
      to swing back into the helicopter to drop kick someone inside]. While not as
      proficient as Batman or Red Robin, Nightwing is also an incredibly skilled detective,
      solving dozens of crimes weekly as part of Bludhaven's police department and
      in his guise as a superhero. He also is incredibly sociable, amicable, and charismatic,
      having the most connections out of any superhero short of Superman)
    source_ids: *id002
    confidence: 0.8
