    over Superman's entire arsenalAction Comics Vol 1 514), Vehicular Mastery (Seemingly
    skilled with any ship he comes across Piloted his saucer at speeds comparable
    to the speed of light while performing 'impossible' stuntsAction Comics Vol 1
    529), Data Manipulation, Technology Manipulation (Can hook his mind into machines
    and manipulate themAdventure Comics Vol 1 388), Weapon Mastery (Shot the brain
    of a rampaging Tiglor with enough persuasion to lobomize itWorld's Finest Vol
    1 183), Possession, Immortality (Types 3 and 6; Luthor described him as an being
