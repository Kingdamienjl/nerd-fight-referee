  attack_potency:
    text: At least Street level physically (Far superior to Lex Luthor). Solar System
      level, Universe level over time with Preparation and Fusionism (Created and
      became one with the Planet-Eater, an object that can eventually mass-energy
      convert stars and could grow in power to reduce the entire universe to a void,
      where only it exists). Unknown with Mental Powers (Imbued Superman with the
      power to revive a dead sunAction Comics Vol 1 514) | At least Multi-Continent
      level (As Brainiac is effectively one with his ship, he should no doubt be superior
      to a probe which could destroy a planet)
    source_ids:
    - vsbattles-brainiac-pre-crisis-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
