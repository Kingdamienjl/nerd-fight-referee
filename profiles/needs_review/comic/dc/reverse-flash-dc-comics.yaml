    - field: weaknesses
      value: 'Can get cut off from the Speed Force. He also has been shown to get
        mentally overwhelmed in some situations. Feats: *Disarms some soldiers before
        they’re aware they’ve been disarmed. *Searches Manhattan and finds Madam Xanadu
        before Frankenstein is aware the Flash has even left. *Runs through everywhere
        in Manhattan saving civilians from monsters. *Can think at a speed where he
        can see the future and make the best possible choice for every action. *His
        instincts and reflexes allow him to react and move the femtosecond he feels
        even the slightest changes in air pressure. *Flash calls the Watch Tower’s
        computers slow, despite the fact that they can perform over 100 quadrillion
        calculations per second. *Can learn how to use Hal Jordan''s Power Ring in
        seconds. *Can speed up all of time and space and take everything a few seconds
        into the future, choosing who to take with him and who to leave behind, skipping
        a time paradox in the process. Notable Attacks/Techniques: *Accelerated Healing:
        Barry isn''t invulnerable, nor durable enough to sustain damage. However,
        if he is harmed he will heal at high speeds. Any normal wear and tear damage
        to his bodies are almost instantly healed. *Flight: Barry can rotate his arms
        and spin his body like a top to achieve something resembling helicopter flight.
        *Increased Perceptions: Barry travelling at incredibly high speeds may miss
        important events as they run by. The Speed Force grants him enhanced senses
        that allow him to see, hear, smell, touch and/or taste at an increased speed
        and understand it as it is processed. *Phasing: Barry can vibrate his molecules
        so quickly that he can achieve intangibility allowing him to phase through
        objects. *Supercharged Brain Activity: Barry can access superhuman levels
        in his brain further than processing information. He can test theories, understand
        difficult equations and run trial and error in his brain at superhuman speeds.
        Barry can think of an enormous number of outcomes of a situation if he focuses
        the Speed Force on his brain. *Vortex Creation: Barry can rotate his arms
        and cause an incredible amount of wind to burst through his focused funnel.
        Barry uses this ability automatically when he runs, reducing the air currents
        around his body to low enough levels to no longer inhibit their speed. Creatively,
        Barry can create tornadoes and gusts with his arms. *Speed Force Drag: Can
        drag people into the Speed Force and have increased stats and control over
        his power. Barry can even defy gravity and grab things using the Speed Force
        lightning-aura. *Time Shift: Barry is connected to time in a similar way like
        Professor Zoom, but Barry doesn''t slow time down, he can move it forward.
        Note: *Respect thread ==Others== Notable Victories: Notable Losses: Inconclusive
        Matches: Category:StoneKillerz12 Category:Tier 7 Category:Tier 1'
