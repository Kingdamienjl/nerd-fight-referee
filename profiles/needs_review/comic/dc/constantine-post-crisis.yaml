      of Order and Chaos scale to as they can destroy infinite realities and casually
      endanger the entire Multiverse. Superior to Phantom Stranger and Spectre who
      was stated to destroy all of creation if they fought. Doctor Fate also implied
      he could reverse the effects of Zero Hour, which was on a level comparable to
      Crisis on Infinite Earths. Doctor Fate is the strongest of the Lords of Order
      and is comparable to Lords of Chaos like Dominus and Mordru, who can effect
      infinite realities. Each universe was implied to contain an infinite number
      of heroes and concepts alike, as well as infinite higher spatiotemporal dimensions)
      | Outerverse level (Contended and tossed aside Blight, who was the embodiment
      of mankind's evil and was a threat to the Presence. | High Outerverse level
      (Scales above Zatanna who is superior to Upside-Down Man. Was stated to be greater
      than the likes of Spectre. Destroyed Pralaya's mind, who destroyed all of creation
      and threatened to throw it into the Overvoid. Pralaya existed in the void before
      creation and exists beyond it. Can make incantations that probe the World Soul/The
      Soul of Creation. Superior to the likes of Hecate, in which his Synchronicity
      Wave has effected. Casually defeats and contends with angels, demons and platonic
      forms from the Sphere of the Gods. Platonic forms are inherently above the concepts
      of space, time, duality and causality as a whole. Was able to hold off the Great
      Darkness which existed before Presence's creation and defeated the likes of
      Etrigan, Doctor Fate, Phantom Stranger and the Spectre, who can destroy all
      Creation. Killed Zatara, Sargon, Anton Arcane and nearly killed Zatanna. Harmed
      Upside-Down Man with a God Spell. Upside-Down Man is an embodiment of the Great
      Darkness and is the concept of fear, sorrow and hate which mirrors off the hope,
      belief and possibility of magic from the Sphere of the Gods. Existed at the
      end of everything and nothing where Destiny and Death of the Endless resided,
      in which Destiny ultimately died and Death shut off the lights and closed the
      doors of all creation once and for all. Existed on all facets of creation as
      the Laughing Magician at the end of everything.)
