    - field: intelligence
      value: The Spectre, as one of the foremost cosmic beings in creation, possesses
        a vast amount of raw intelligence and knowledge, including encyclopedic knowledge
        of spells and counter-spells, demons, extradimensional realms, etc. He was
        even able to briefly comprehend omniscience when given a glimpse of it by
        the Source. However, due to his nature, he has had difficulties comprehending
        human nature and motivation, and his rage-fueled nature has allowed others
        such as Eclipso to trick him.
      source_id: vsbattles-spectre-prime-earth
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The Spectre can be harmed by artifacts of the Presence, such as the
        Spear of Destiny and Ring of Life, or by certain divinely enchanted weapons
        such as Pandora''s knives. He can also be bound or have his power temporarily
        sealed by special magics wielded by extremely skilled magicians, such as Madame
        Xanadu. When the Spectre judges souls by entering them, he often faces more
        difficulty than if he had simply rendered judgment outside the victim''s soul.
        The Spectre cannot judge souls the Presence does not allow him to. Also, the
        Spectre was shown to be unable to directly affect those who can wield magic
        invoking the Presence. Notable Attacks/Techniques: * Fear-Inducing Stare:
        The Spectre often avoids combat entirely by intimidating his victims with
        a special stare. The victim sees a vision of skulls across the Spectre''s
        eyes, and they feel fear so intense they can''t move. Some have even been
        driven insane. * Judgment: The Spectre''s most-often used technique involves
        reality warping or matter manipulation to create ironic punishments for his
        victims in accordance with their crimes. Oftentimes, this comes after the
        Spectre has entered his victim''s soul and judged what he finds, although
        such is not always the case. Notes: Crisis on Infinite Earths did not serve
        as a true reboot to Jim Corrigan''s continuity as he was one of the beings
        responsible for the changing history. Furthermore, the time period between
        the Crisis and the start of the 1992 Spectre run had the Spectre drastically
        weakened. For information on why JLA/Avengers is canon to DC continuity, see
        here. Before making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. For information about the cosmological scaling
        that informs the tiering, please refer to the DC Comics Cosmology page. ==Notable
        Matchups== Victories: Losses: Inconclusive: ==References== {{Reflist|2}} {{discussions}}
