    - field: powers_and_abilities
      value: "Genius Intelligence, Superhuman Physical Characteristics, Martial Arts,\
        \ Stealth Mastery (Regularly disappears on members of the league, even those\
        \ with senses as powerful as Superman. Can disappear even when people are\
        \ looking at him. Can disguise himself as people of different ethnicities\
        \ or age ranges, regularly bypasses Oracle\u2019s security, which uses air\
        \ pressure change detection and state of the art systems. Superman can't see\
        \ his actions), Weapon Mastery (Has mastered all weapons. Can easily hit foes\
        \ at multiple angles and directions in a single throw), Hacking (Easily hacked\
        \ into Lexcorp and Darkseid\u2019s Hellspores), Extrasensory Perception (Can\
        \ sense Chi. Can sense the presence of Deadman, who is a invisible spirit),\
        \ Clairvoyance (Can see the past, present, and future in his dreams), Limited\
        \ Information Analysis (Is a master detective, Can visualize entire sequences\
        \ of events and plots in his head and analyze them in the middle of combat.\
        \ Easily figured out what was really causing disturbances across Earth, and\
        \ saw through the methods Wonder Woman used to fight the Flash), Instinctive\
        \ Reactions and Precognition (Has a sixth sense that allows him to instinctively\
        \ dodge attacks without knowing about them, warns him of danger, and allows\
        \ him to easily anticipate the attacks of multiple foes. Can predict someone\u2019\
        s movement based on speed and momentum), Mind Manipulation (Can hypnotize\
        \ people), Body Control and Pressure Point Strikes (has methods that allow\
        \ for self-induced comas and nerve attacks, can loosen muscles, slow blood\
        \ flow, and control his adrenaline), Power Nullification (Knows a spell which\
        \ negates magic for a hour), Sealing (Knows magic that allows him to seal\
        \ someone in a crystal), Self-Perception Manipulation (Can manipulate his\
        \ own perception of time), Enhanced Senses (Disarmed a foe on a shot described\
        \ by Deathstroke as impossible. Smelled a fire in Gotham while he was underground\
        \ outside the city. Smells well enough to identify chemicals. Can literally\
        \ smell emotion. Described as having superior vision to Eagles, and easily\
        \ saw Robin spy on him. Hears a dying man\u2019s speech while at the top of\
        \ a building and a alarm from three blocks away), Vehicular Mastery, Magic,\
        \ Preparation Electricity Manipulation with Batsuit and Batarangs (Can run\
        \ up to 200,000 volts through his suit), Status Effect Inducement and Paralysis\
        \ Inducement with tranquilizer darts, flashbangs, cape and taser gun, Ice\
        \ Manipulation with freeze ray and liquid nitrogen capsule, Explosion Manipulation\
        \ with Batarangs, Power Nullification (Has Cold Iron Fillings to disrupt magic,\
        \ has powerful anti-fire gas), Biological Manipulation (Has a chemical that\
        \ hypersaturates a person and can repair DNA), Attack Reflection (Has pellets\
        \ which reflect lasers, can reverse electrical attacks, and reflect sonic\
        \ attacks), Animal Manipulation (Can summon bats that jam detection), Light\
        \ Manipulation (Via Flashbombs), Smoke Manipulation (Uses smoke bombs which\
        \ can mimic his shape and cause pain), Thread Manipulation and Homing Attack\
        \ (Has a gadget that functions in a similar manner to thread based Omega Beams),\
        \ Has various tracking devices, Restraint Pellets, Has Syringe Batarangs to\
        \ deliver chemicals and toxins, Poison Manipulation (Via various poisons and\
        \ nerve toxins), Sound Manipulation (Via sonic Batarangs and hypersonic attacks,\
        \ Acid Manipulation (Via Acid Bombs), Magnetism Manipulation (Via Magnet Batarangs,\
        \ Heat Manipulation (Via Superheated Batarangs), Technopathy (Via EMPs, which\
        \ can take out thousands of O.M.A.C.S.), has a fake circulatory system to\
        \ deceive foes, Camouflage (His suit can camouflage him), Illusion Creation\
        \ (Can create the illusion of a giant bat), Teleportation (Has a teleportation\
        \ device), Extrasensory Perception (Can see in multiple wavelengths with his\
        \ cowl. Can see invisible things), Information Analysis (His cowl automatically\
        \ identifies people, has gadgets that can identify radiation and blood.),\
        \ Fire Manipulation (Via Firebombs), has a gadget that hides his heartbeat\
        \ Sleep Manipulation (Was not affected by sleep inducement), Pain Manipulation\
