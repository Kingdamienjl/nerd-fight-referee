  axis: weakness
  text: 'He weakens if his host receives bodily damage Feats: * Has fought and controlled
    various Green Lanterns, from Kyle Rayner to Hal Jordan. When it took control of
    Kyle, Parallax fought in the Sinestro Corps War and was defeated by two Green
    Lanterns and sealed by The Guardians of the Universe. * Zero Hour Parallax destroyed
    and recreated the universe. He even defeated the Spectre and erased heroes, such
    as Superman, from the timeline. Note: Before making any changes to this page,
    please read and follow the Power-scaling Rules for Marvel and DC Comics.'
