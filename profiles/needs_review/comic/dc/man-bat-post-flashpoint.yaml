  intelligence:
    text: 'Extraordinary Genius. As one of the most renowned scientists on EarthDetective
      Comics Vol 2 21, Kirk is incredibly knowledgeable in the field of biology, having
      created many variations of his Man-Bat formulaDetective Comics Vol 2 23.4: Man-Bat
      and even partial curesDetective Comics Vol 2 19 and eventually fixed it, preventing
      it from turning him into a mindless beastJustice League Dark Vol 2 6. Is able
      to analyze a body''s cellular structure and make great progress in understanding
      the Upside-Down Man''s effect on the universe through those studiesJustice League
      Dark Vol 2 1. Despite having started his studies of magic less than a few days
      before, managed to cast a spell that even Khalid Nassour, a skilled magician
      who would then go on to become Doctor Fate, thought was impressive. Could build
      an advanced sonic cannon meant for subliminal messaging under Scarecrow''s ordersMan-Bat
      Vol 4 4. Varies from Animalistic to Extraordinary Genius as Man-Bat. Sometimes,
      he conserves his mind while transformed, while other times he''s little more
      than a beast, or even its own split personality, although before his death,
      Langstrom could keep his intelligence even when transformed.'
    source_ids: *id002
    confidence: 0.8
