        she should be comparable to Mogo, who can Illuminate a dead Universe, which
        is likely infinite. Fought and staggered Volthoom, Who even in a weakened
        state, was still able to casually stomp Guardians. A weakened, ringless Ganthet
        could easily survive energy blasts from Mogo. Ganthet has also previously
        held back the Blind. Which Kyle Raynar considers comparable to the Big Bang.
        The Guardians should all be relative to each other. Has outputted power greater
        than Atrocitus, who could withstand an onslaught from Volthoom. Lex Luthor,
        when specifically talking about the ring of Volthoom, mentions it as being
        extradimensional. Given the Justice League could also deal with the previous
        host of the Power Ring, It's likely that her standard green lantern ring is
        of similar power. Could Hold back Darkseid with help from the Justice League,
        who consumes universes, can hold open a hole in reality, and could harm the
        Anti-Monitor, who could consume universes. Later temporarily held back a younger,
        somewhat weaker Darkseid all on her own, albeit with massive difficulty) |
        Multiverse Level (After absorbing the Omega Effect into her Ring, she becomes
