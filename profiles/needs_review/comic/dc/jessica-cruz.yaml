    - field: durability
      value: Universe Level+ (Can withstand an onslaught from multiple red lanterns
        at once. Can take hits from Volthoom and is comparable to Atrocitus. Who fought
        and took hits from Volthoom) | Multiverse Level (Survived multiple attacks
        from New Gods)
      source_id: character-stats-profiles-jessica-cruz-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Rings hold a limited charge and need to be recharged with a power battery
        every so often. The ring cannot be used without sufficient willpower. If the
        user is somehow overcome by fear they will be unable to use the ring and will
        become vulnerable to the color yellow. If a Green Lantern loses focus or concentration
        (i.e. through illusions) their power will weaken. Jessica was originally held
        back by massive amounts of anxiety, and survivors guilt. However through her
        training she has learned to overcome this weakness.
