    - field: powers_and_abilities
      value: 'Static''s body on its own possesses:, Superhuman Physical Characteristics
        (See Speed, Lifting Strength and Durability), Acrobatics and Superhuman Athleticism
        (Avoided a robot in the Watchtower in an incredible feat of agility), Stealth
        Mastery (Snuck away from Harley, Ivy and Nails totally undetected after a
        brief light flash), Vehicular Mastery with the Static Saucer (Static, as one
        would expect due to his years of experience with it, is extremely adept at
        flight using his Static Saucer: his expertise is so great that he can do a
        flip to avoid a net in mid-air, dodge projectiles in mid-air with minimum
        movement, et cetera), Social Influencing (Charisma: Talked Permafrost down
        whilst she was seemingly in the throes of a violent behavioral episode, and
        convinced her to seek help instead of creating further snowstorms) Static''s
        power (granted by the Big Bang awakening his Meta-Gene) is Electricity Manipulation,
        which is simply a broad umbrella term - his meta-gene actually grants him
        several different'
      source_id: character-stats-profiles-static-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'Small Building Level to Small Town Level whilst holding back (0.11 Tons
        to 4.55 Kilotons - Even his ultra-casual beams, released from a single finger,
        can create a sizable crater. Has grown tremendously over the years, and as
        such by Season 4 should be able to casually outperform his Season 1 self,
        who could do this. Melted a huge mass of ice very early in his career. His
        own blast, reflected back at him, could put him on the ground despite his
        efforts to block it with his arms. Reduced a storefront to rubble with a single
        blast. Is a rival to Hotstreak (and has fought/defeated him many times) -
        Hotstreak''s powers have created this explosion, blown up a car, and destroyed
        a wall whilst weakened by the Bang Baby cure. Knocked out Harley Quinn and
        The Joker with ease, and oneshotted Batman II. Oneshot Kangor, a bang baby
        powerful enough to completely destroy a police car by simply landing on it,
        kick another police car several stories into the air, and stomp a deep fissure
        into the ground. Overpowered Spectral''s laser, which blew up a large part
        of a ceiling. Comparable to Soul Power (who flattened a building sized robot),
        and contributed to a blast which knocked out Professor Menace, someone capable
        of surviving the building he was inside exploding. Hurt Osebo, who destroyed
        a wall. A practically infinitesimal portion of his power made a Zap Cap powerful
        enough to destroy most of a car. Knocked Batman out with an electric shock.
        Starburst, who derived his powers from Static, could create a crater of this
        magnitude. Totaled a car by throwing a barrel at it. Overpowered and staggered
        Heavyman, who could stomp a massive fissure into the ground. Harmed Tamara
        Lawrence, who could total a car with a punch, destroy a bridge by simply flexing,
        lift a carousel, and uproot a tree. Is a consistent opponent of Onyx, who
        smashed through a wall. Created a large crater. Can knock out Talon, who can
        harm him and take blasts from D-Struct: said blasts could obliterate a small
        building and blast apart the front of a bus. Hurt Tarmac, who could bust through
        a wall and slam a metal door off its hinges. Staggered and held his own against
        Tantrum, a bang baby strong enough to destroy a door, lift and throw a car,
        and lift an entire ferris wheel. Blasted apart a section of some bleachers),
        Large Planet Level at full power (Downscaling from 1.03 Ronnatons - Temporarily
        beam struggled with a bloodlusted, mind controlled Green Lantern, and harmed
        him at a later date - albeit in the latter instance, GL was fatigued and using
        a ring with almost no charge. Dwayne McDuffie implied that the difference
        between Static and GL (as in, the reason Static cannot defeat him) is moreso
        experience rather than raw power. Contributed to recharging the First Watchtower''s
        power core - said core containing enough power to create a barrier that turned
        aside almost all of the impact from a cosmic superstring, a phenomenon that
        packs more energy than a solar flare. Amplified GL to the point that he easily
        overpowered Sinestro, who is his equal in combat under normal circumstances
        - that, and Static gave GL''s ring what seems to be a full charge even before
        amplifying his power), higher during a Sunspot (As established in S2 E5, Static
        becomes far more powerful during a sunspot)'
      source_id: character-stats-profiles-static-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ combat speed and reactions (Scaling to 0.53c - Kept up
        with Sinestro and Green Lantern, reacted to and intercepted a mind-controlled
        Martian Manhunter, and, after moving behind her, attacked Hawkgirl so quickly
        that she couldn't even turn around before being struck. Reacted to and blocked
        a light-based laser from Spectral (a villain who used spectrums of light)
        at close range after it was fired, moving at 0.29c to do so. Similarly, he
        could block a blast from Green Lantern after it was fired, and dodge one on
        another occasion - Lantern Beams overtly move at the Speed of Light. Can consistently
        react to and block/dodge his own lightning. Dodged several thrown Batarangs.
        Alongside Hotstreak, blitzed away from small missiles. Reacted to Talon's
        projectile screech and moved quickly enough to block it with microphones after
        it was fired), with Massively Hypersonic+ attack speed (His electricity beams
        streaked into orbit at incredible speed) and at least Subsonic travel speed
        with the Static Saucer (Dodged Talon's projectile screech. Kept ahead of the
        Flash - whilst Wally is certainly far faster than Static (and thus this is
        an outlier for Wally), he was still running quickly enough to run across water,
        necessitating a speed of about 158 miles per hour. Caught up to a plane, albeit
        he needed to pull out all the stops to do so. Kept up with a speeding sports
        car)
      source_id: character-stats-profiles-static-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: At least Small Building Level (At least 0.11 Tons - Took his own casual
        blast reflected back at him, though it did cause him noticeable pain. Was
        unhurt (if shook up) by this explosion. Took a sound blast from Boom straight
        to his body - Boom's sound blasts could blow up a wall, destroy a large jumbotron,
        and vaporize chairs. Was only winded by a kick from Kangor, who can completely
        destroy a police car by simply landing on it, kick another police car several
        stories into the air, and stomp a deep fissure into the ground. Took a blast
        from D-Struct and was only annoyed - D-Struct's blasts could obliterate a
        kiosk and blow up the front of a bus. Got up after a bodyslam from Carmen
        Dillo which cratered brick walls - Carmen could also destroy store displays
        whilst rampaging inside of said store. Took a hit from Chainlink's arms -
        Chainlink's arms could destroy a wall and a metal floor, as well as a steel
        girder. Remained conscious after being hit by a tire thrown by a villain -
        said villain could easily destroy a wall. Was fine after Rubberband Man made
        a massive vault door fall on him. Whilst fighting imaginary monsters (made
        real by the powers of a Bang Baby), took hits from both of them - said monsters
        could destroy a hot dog cart in one hit and crater a stone pillar. Was fine
        after being sent through the wall of a large vehicle by a blast), and Large
        Planet Level with Barriers (Downscaling from 1.03 Ronnatons - Turned aside
        most of the impact of a blast from a bloodlusted, mind controlled Green Lantern)
