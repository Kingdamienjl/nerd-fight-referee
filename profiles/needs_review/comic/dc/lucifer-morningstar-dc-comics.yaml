- id: claim-weaknesses-5d8b59de
  section: weaknesses
  axis: weakness
  text: 'Lucifer is prideful and narcissistic; he always keeps his word and will never
    lie as he considers it to be degrading and below him. As experience is everything
    to him, Lucifer will not turn back time to correct every mistake and he sometimes
    likes to see how everything plays out (for example, he surrendered to Etrigan
    the demon because of this rather than destroy all opposition). Without his feathers,
    he is greatly weakened and he cannot create matter out of nothing, as he needs
    the Demiurgic force of his brother Michael, and later his niece Elaine. Notes:
    *This is the profile for Lucifer Morningstar specifically. There have been many
    demonic figures throughout DC''s publishing history. Please be careful not to
    add feats performed by other DC characters who go by the name "Lucifer," "Satan,"
    or "The Devil." *Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
