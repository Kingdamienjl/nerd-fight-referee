    \ able to wield power comparable to his, making him an excellent hand-to-hand\
    \ combatant who is able to spar with the likes of Superman and Wonder Woman. However,\
    \ due to being a child, he is often excitable, na\xEFve, and easily distracted,\
    \ which has gotten him into trouble on various occasions)"
