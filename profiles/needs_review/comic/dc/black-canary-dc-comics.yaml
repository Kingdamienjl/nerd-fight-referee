- id: claim-weaknesses-6271fa35
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: * Canary Cry: Dinah possesses a
    metagene that gives her a potent sonic attack, able to damage and stun foes or
    objects, to the point of shattering metal. She possesses an incredible degree
    of control over her vocal cords. This enables her to mimic sounds and generate
    any sound she desires, even developing several abilities. The Canary Cry has been
    able to make a person''s ears start bleeding even if they''re not the attack target.
    Note: Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{discussions|Black Canary Post-Crisis|Black Canary (Post-Crisis)}}
