        of their superpowers as they are contingent upon exposure to solar radiation
        from a yellow sun star system. Their biological makeup includes a number of
        organs that lack analogues in humans and whose functions are unknown. It is
        believed that between one or more of these and their bio-cellular matrix,
        "yellow" solar energy is stored for later use. This allows for the use of
        these powers to fade when yellow solar radiation is not available instead
        of immediate failure. *Heat Vision: Kryptonians can, as a conscious act, fire
        beams of intense heat at a target by looking at it. Typically, the power is
        seen as two beams of red light emanating from the eyes. These beams can be
