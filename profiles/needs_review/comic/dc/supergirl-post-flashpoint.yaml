- id: claim-weaknesses-3097daec
  section: weaknesses
  axis: weakness
  text: 'Kryptonite (various varieties), She is entirely dependent on the Stellar
    Radiation of a Yellow Star/Blue Star to sustain her powers (if she''s deprived
    of Sunlight, she slowly loses her powers), the Stellar Radiation of a red star
    (weakens her due to red Stellar Radiation having less energy than that of a yellow
    or blue star), Magic, she cannot see through lead, Emotion Dependency, Uncontrollable
    Rage, Hope Influence, and Love Influence Notable Attacks/Techniques: *Solar Energy
    Absorption: Under optimal conditions, this is the main source of their superpowers
    as they are contingent upon exposure to solar radiation from a yellow sun star
    system. Their biological makeup includes a number of organs that lack analogues
    in humans and whose functions are unknown. It is believed that between one or
    more of these and their bio-cellular matrix, "yellow" solar energy is stored for
    later use. This allows for the use of these powers to fade when yellow solar radiation
    is not available instead of immediate failure. *Heat Vision: Kryptonians can,
    as a conscious act, fire beams of intense heat at a target by looking at it. Typically,
    the power is seen as two beams of red light emanating from the eyes. These beams
    can be made invisible, allowing the power to be undetectable. The maximum temperature
    of their heat vision is said to be around that of a nuclear detonation. They can
    also consciously determine the area affected, down to the microscopic level. *Super-Hearing:
    Kryptonian hearing is sensitive enough to hear any sound at any volume or pitch.
    With skill, practice, and concentration, they can block out ambient sounds to
    focus on a specific source or frequency. As such, they can identify a person by
    their heartbeat, or pick out a single voice in an entire city. *Enhanced Vision:
    Kryptonian vision processes the entire electromagnetic spectrum as well as allowing
    vast control over selective perception and focus. **Electromagnetic Spectrum Vision:
    Kryptonians can see well into most of the electromagnetic spectrum. They can see
    and identify radio and television signals as well as all other broadcast or transmitted
    frequencies. Using this ability, they can avoid detection by radar or satellite
    monitoring methods. This also allows them to see the aura generated by living
    things. **Telescopic Vision: This is the ability to see something at a great distance,
    without violating the laws of physics. Though limited, the exact extent of the
    ability is undetermined. In function, it is similar to the zoom lens on a camera.
    **X-Ray Vision: This is the ability to see through any volume of matter except
    lead. Kryptonians can see things behind a solid, opaque object as if it were not
    there. They can focus this ability to "peel back" layers of an object, allowing
    hidden image or inner workings to be observed. The exact type of energy perceived
    - such as x-rays, cosmic rays, or some other energy invisible to normal humans
    - is unclear. This ability perceives an ambient energy source though, it does
    not involve the eye projecting a concentrated, possibly toxic, beam to be reflected
    back from objects. **Microscopic Vision: This is the ability to see extremely
    small objects and images down to the atomic level. **Infrared Vision: Kryptonians
    can see with better acuity in darkness, and to a degree in total darkness. *Red
    Energy Conduit: The rings use Red energy, supplied by a Power Battery, which in
    most cases takes the form of red light. A Red Lantern''s ring is one of the most
    powerful weapons in the known Universe. Red Lantern''s ring, has the ability to
    affect and use fundamental forces of the known universe, including electromagnetic
    energies such as gravity, radiation, heat, light, and powerful blasts of concussive
    force. The ring can also create fields of force formed from an unknown energy
    that was bound by the users'' will. The limitations of such use are the skill,
    knowledge, and imagination of the user. **Rage Plasma: The Red Lantern can vomit
    plasma, which has been described as napalm and acid mixed together, it burns away
    at anything. It can be surmised that is the effect of the internal rage on the
    blood. These flames burn even in space. The effect it has on living beings allows
    it to ignite the flames of rage in a victims'' blood and has the effect of burning
    through an energy aura of an opponent as well as corrupting other power rings
    depleting them at an accelerated rate and greatly weakening the structures they
    create. This power is so strong that it can destroy members of the Black Lantern
    Corps by obliterating them faster than they can regenerate. **Energy Projection:
    The ring can be used to fire blasts of Rage energy. This power is unique as it
    takes the form of rage-energized blood. The ring can project this blood as a blast
