        Bleed in the Sphere of the Gods. Flew out of the Source Wall, despite Highfather
        saying it was impossible. Comparable to Wonder Woman, who flew into the Speed
        Force itself. Possibly compares to Silver Age Superman, who a younger Golden
        Age Superman fought, who flew so fast that the Spectre had to stop him from
        flying into realms that "no mortal eye may be permitted to behold") | Immesurable
        in Combat and normally, Irrelevant maximum Flight Speed | Irrelevant (Stated
