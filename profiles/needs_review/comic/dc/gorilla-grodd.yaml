    - field: powers_and_abilities
      value: '* Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) *Genius Intelligence (See Intelligence) *Enhanced
        Senses (Gorillas have senses of hearing and smell a bit beyond that of humans)
        *Mind Manipulation (Over the course of the DCAU, his mental powers develop:
        as of Justice League, he can force his targets to do his bidding and force
        their dormant emotions to emerge. He can also produce devastating mental attacks
        that cause the affected to experience excruciating, mind-breaking pain - these
        attacks can even disrupt the focus of Green Lantern. As of Justice League
        Unlimited, he can place mental blocks in his allies'' brains that cause their
        brains to shut down (resulting in either incapacitation, as with Giganta,
        or death as with Metallo) if they reveal his secrets or even if his secrets
        are revealed through his ally''s mind being probed - these psychic aftershocks
        are potent enough to cause a telepath on Martian Manhunter''s level to double
        over in pain just from reading Giganta''s mind while it was being shut down)
        *Superhuman Athleticism (Performed a superhuman leap over Hawkgirl) *Hand-to-Hand
        Combat Skills (Demonstrates an acrobatic fighting style while beating down
        Lex Luthor) *Acrobatics (Can do flips during combat) *Stealth Mastery (Hid
        from the Flash and got the drop on him) *Preparation (During Secret Society,
        devised methods of surveilling the Justice League for a long time in order
        to best disrupt their team synergy and leave them vulnerable to attack and
        staged an ambush against the Justice League where he lured them to their own
        training camp under false pretenses and rewired it to attack them. Acquired
        nuclear missiles to destroy Gorilla City during Brave and the Bold, and went
        out of his way to deactivate the city''s shield) *Social Influencing (Charisma:
        Manipulated Sara Corwin into becoming his devoted accomplice as of some point
        before Brave and the Bold, and manipulated much of the Legion of Doom, including
        Weather Wizard and Parasite, into being loyal to him) With Preparation, Grodd
        can utilize: *Flight (Used a Gorilla City speeder vehicle) *Energy Projection
        (with various energy blasters) *Explosion Manipulation (Acquired nuclear missiles
        to destroy Gorilla City and gave his minion an energy blaster that caused
        explosions with its blast) *Radiation Manipulation (The explosion of his Nuclear
        Missiles would produce tremendous radioactivity) *Biological Manipulation
        (During Dead Reckoning, invented a device that rewrote DNA and turned all
        humans into apes) *Forcefield Creation (Erected a forcefield around his generator)'
      source_id: character-stats-profiles-gorilla-grodd-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'At least Small Building Level physically (Upscaling from 0.095 Tons
        - Struggled evenly with Hawkgirl and made her yell in pain with a kick - albeit
        her durability is somewhat inconsistent. Completely embarrassed Base-Form
        Lex Luthor in a fistfight and threatened to snap his neck - this same Luthor
        being capable of ripping apart machinery and computer panels with raw strength.
        Knocked out The Flash with a punch, but the Flash himself has inconsistent
        durability. One-shot Solovar, who could break a parking gate in two with one
        blow. Punched through a computer panel), up to City Level with Preparation
        (Acquired nuclear missiles that would have destroyed Gorilla City, as seen
        in "The Brave and the Bold: Part 2") - one of Grodd''s blasters could harm
        Sinestro through his energy barrier, but in that same episode its blasts only
        crack a TV screen (which we know for a fact Sinestro scales above) and practically
        bounces off of Luthor''s gauntlets - this may be an example of Attack Potency
        trumping Destructive Capacity, but it''s certainly debatable and could easily
        be interpreted as this weapon simply being too inconsistent to rate.'
      source_id: character-stats-profiles-gorilla-grodd-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ reactions and combat speed (Scaling to 0.53c - Flipped
        behind Hawkgirl, avoiding her mace swing, and kicked her quicker than she
        could turn around - and immediately afterward he reacted to her charge and
        mental-attacked her before she could complete an attack. Leapt onto Martian
        Manhunter too quickly for him to get out of the way. Blitzed Solovar from
        across a room (dodging an energy blast from an energy gun in the process),
        with Solovar being capable of dodging bullets), and Hypersonic+ attack speed
        with ICBMs (ICBMs make contact at a speed of about 7km/s, or about Mach 20)
      source_id: character-stats-profiles-gorilla-grodd-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: 'At least Small Building Level (Upscaling from 0.095 Tons - Should compare
        to his physical strength. Should be at least as durable as Amanda Waller (who
        tanked a portion of this explosion) and a 13-year-old Tim Drake. Survived
        the vacuum of space, as he reappears in JL Infinity), possibly higher (Has
        taken attacks from Justice Leaguers such as Wonder Woman, Hawkgirl, and Superman,
        but all of these leaguers were most likely holding back as to not kill him,
        considering he is just barely above peak human level in the context of the
        verse - Superman''s attack in this instance was literally flicking Grodd with
        his finger, implying Grodd isn''t much of a physical threat to any of the
        League besides Batman and a Mace-Less Hawkgirl. Survived being crushed in
        Giganta''s hands, but it''s also quite strongly implied she''s trying to torture
        him with constant pain rather than give him a quick death, and as such has
        reason to hold back. However, he survives a punch and being strangled by Bizarro,
        which to be honest I have no explanation for - though you can argue it''s
        inconsistent with the fact that ultra-casual attacks from Leaguers nearly
        KO him), up to at least Planet Level or higher barriers with Preparation (During
        "Brave and the Bold: Part 2," erected a force field exactly like the force
        field that protects Gorilla City, which even blows from Deadman in Superman''s
        body couldn''t break and which was implied to be able to tank nuclear missiles)'
      source_id: character-stats-profiles-gorilla-grodd-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Needs to eat, breathe, and sleep. Note: Bruce Timm has stated that the
        original DCAU tie-in comics are not canon, with the only tie in comics that
        have statements to the contrary (other than Batman: The Adventures Continue,
        which has so many continuity issues that it''s essentially impossible to argue
        it''s canon) being Justice League Infinity, the Batman and Harley Quinn tie
        in comics, and specifically the first annual of Batman Adventures. Ergo, I
        only consider those three comics canon. Note 2: Shoutout to this respect thread
        for providing clips of feats. Category:Goulden1998 Category:Tier 9 Category:Tier
        7'
      source_id: character-stats-profiles-gorilla-grodd-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
