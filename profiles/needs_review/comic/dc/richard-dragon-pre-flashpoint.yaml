  attack_potency:
    text: "Wall level (Destroyed a wooden door alongside Ben Turner and did the same\
      \ by himself on several different occasions. Kicked someone hard enough to destroy\
      \ a display case, shattered a chair, broke a blade in half and ripped a park\
      \ bench slatThe Brave and the Bold Vol. 1 #132, February 1977. Even while heavily\
      \ fatigued, he could one-shot normal peopleRichard Dragon, Kung-Fu Fighter #12,\
      \ November 1976. Can easily shatter bones with his strikes), higher with the\
      \ Dragon\u2019s Claw (One-shot someone that stomped his base formRichard Dragon,\
      \ Kung-Fu Fighter #17, October 1977. Crumbled a shark\u2019s skull and split\
      \ a bo-staff) | Building level (Easily outmatched Renee Montoya52 #41, April\
      \ 2007)"
    source_ids:
    - vsbattles-richard-dragon-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
