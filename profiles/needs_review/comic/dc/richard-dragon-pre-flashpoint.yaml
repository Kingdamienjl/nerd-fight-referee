  intelligence:
    text: "Gifted normally. Studied western history, philosophy and science. Knows\
      \ acupuncture, and how to massage pressure points. Genius in combat. Is stated\
      \ to be one of the greatest martial artists in the world, with mastery of all\
      \ fighting arts. Trained the likes of QuestionQuestion Vol. 1 #35, March 1990,\
      \ Barbara GordonBatman Chronicles #5, June 1996, Helena Bertinelli and Renee\
      \ Montoya. Standard Tactics: Dragon tends to refrain from killing his opponents\
      \ unless he\u2019s enraged. When using the Dragon\u2019s Claw, it is like something\
      \ else is controlling his body and he fights more seriously, usually going silent\
      \ and going for strikes to disarm and subdue his opponents."
    source_ids:
    - vsbattles-richard-dragon-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
