- id: claim-powers-and-abilities-6fac9693
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Master Martial Artist (It is stated\
    \ that no fighting art is unknown to him, and he\u2019d mastered karate, aikido\
    \ and jiu-jitsu. Studied fighting arts for six yearsRichard Dragon, Kung-Fu Fighter\
    \ #1, May 1975. Stated to be one of the finest martial artists in the world, surpassed\
    \ only by the O-SenseiRichard Dragon, Kung-Fu Fighter #2, July 1975. Stated to\
    \ be the deadliest man alive and a master of all fighting artsRichard Dragon,\
    \ Kung-Fu Fighter #4, November 1975. Considered the greatest kung-fu master aliveRichard\
    \ Dragon, Kung-Fu Fighter #8, May 1976), Enhanced Senses (Sensed that people were\
    \ about to sneak up on him. Can dodge attacks while blindfolded and use his hearing\
    \ to fight after being blinded. Detected a silent intruder due to him making a\
    \ candle flutterRichard Dragon, Kung-Fu Fighter #10, July 1976), Weapon Mastery\
    \ (Lady Shiva trained him to use a swordRichard Dragon, Kung-Fu Fighter #15, June\
    \ 1977. Trained in how to use bo-staffs, and he could wield a rifle with just\
    \ as much proficiencyRichard Dragon, Kung-Fu Fighter #16, August 1977), Stealth\
    \ Mastery (Underwent ninja training and snuck into G.O.O.D headquarters on two\
