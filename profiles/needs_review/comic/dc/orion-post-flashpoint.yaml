    - field: weaknesses
      value: 'Orion is vulnerable to radion, a lethal substance to New Gods. It should
        be noted, that Pre-Flashpoint Orion wasn''t even knocked unconscious by multiple
        radion stingers, and Godhead Orion was presumably weakened from fighting Darkseid
        when he was shot with the radion bullet. Orion loses the Astro-Force, despite
        fighting evenly against him moments before. Orion is capable of accessing
        it at will but constantly restrains himself because of his inner conflict
        about his heritage. Astro-Force: Also known as the "Wrath of the Source",
        the Astro-Force is a nearly infinite source of energy that Orion alone is
        capable of wielding. He almost always accesses it either through his harness
        or wristbands, but it was later revealed that both are actually made of pure
        Astro-Force and cannot be destroyed, being part of the Source. Mother Box:
        Orion''s Mother Box can be used to perform a huge number of abilities, energy
        blasts, among others. See Mother Box for full details. Anti-Life Equation:
        Orion absorbed the full Anti-Life Equation from Darkseid''s Bates clones,
        granting him an incredible boost in power as well as the ability to completely
        dominate the minds of those who hear his voice. He later lost the Equation
        after using its entire power to defeat Ecruos, an enemy of the Source. None
        notable. Orion''s Post-Flashpoint Emanation has not demonstrated any of the
        versatility that his Pre-Flashpoint emanation did, boom tubes, and the abilities
        granted by Mother Box. As all instances of Orion seen in lower realms are
        tiny facets of Darkseid''s true being, it stands to reason that Godhead Orion
        possesses all of the abilities demonstrated by them but to a much greater
        degree. Feats:, Caused enormous amounts of destruction on Apokolips, and released
        a massive blast that can be seen from the outer reaches of the planet, Easily
        overpowered a spell from Pre-Crisis Doctor Fate (Kent Nelson), One-shot Pre-Crisis
        Firestorm, Knocked out Superman with a single blast of Astro-Force, Released
        a blast comparable in size to Supertown, Evenly fought against an amped Kalibak,
        with Metron stating that if their full might was unleashed they could lay
        waste to half of Apokolips, Contained the Oblivion Bomb, which would have
        instantly collapsed all of space itself into a colossal black hole, after
        its destructive furies are unleashed, Disintegrated Slig by removing the binding
        force between his atoms, Replaced his eyes with someone else''s and they instantly
        worked, Gave mortals a glimpse of what might be his true form, Embracing the
        Source of the Beast, stomped Kalibak with no effort, Used the Anti-Life Equation
        to heal minds, Brainwashed all of Earth with the Anti-Life Equation, Released
        the entire Anti-Life Equation to defeat Ecruos, The shockwaves of his clash
        with an Nth Metal Golem destroyed a star system, Inflicted fatal wounds on
        Godhead Darkseid, please read and follow the Power-scaling Rules for Marvel
        and DC Comics., While Darkseid let Orion beat him in New Gods Vol. 4New Gods
        Vol. 4 #8, May 1996 as well as in Orion Vol. 1Orion Vol. 1 #13, June 2001,
        Orion still would''ve needed comparable strength to significantly damage Darkseid,
        whether he let him land those blows or not., While Orion''s win over Darkseid
        in Countdown to Final Crisis contradicts what we see happen in Death of the
        New Gods, this only makes it unlikely the events did happen. Considering DC
        Editorial overviewed and released the story with the impression of it being
        the case, it still should be considered within the possibility of what could
        happen, and would reflect the real power levels of characters involved., Grant
        Morrison has referred to The Death of the New Gods as canon but clarified
        that the depictions of Orion vs. Darkseid in both that story and in Countdown
        were "apocryphal attempts to describe an indescribable cosmic event". Also,
        the Source being split in two was retconned by Morrison. Due to this, do not
        attempt to scale Orion to the Source., "Avatar" is a term specifically referring
        to an ability demonstrated by Pre-Flashpoint Darkseid and Highfather, and
        it was never stated that the lesser versions of New Gods were specifically
        created by them to interact with lower planes of reality. The term used by
        Grant Morrison to refer to these lower aspects of the New Gods is "emanation".,
        Like other New Gods, not even Orion''s emanation was affected by Crisis on
        Infinite Earths'
      source_id: vsbattles-orion-post-flashpoint-dc
      provider_id: vsbattles
      authority: high
      confidence: 0.75
