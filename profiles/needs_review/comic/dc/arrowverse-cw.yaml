    - field: standard_equipment
      value: 'Customized hunting arrows: Oliver''s signature weapon of choice, he
        has designed a variety of specially featured arrows. He carries up to 24 arrows
        at a time. After further customizing from Cisco, Oliver''s supply on arrows
        increased noticeably. According to the police reports, Oliver''s arrows are
        comprised of carbon, as they have far less penetrating force than aluminum
        carbon composite arrows., Flechette: Oliver carries on mission these miniature
        projectiles stored on his gauntlets, which are the equivalent of throwing
        knives. In addition to disarming foes, Oliver carries some trick flechettes
        to produce smoke screens to assist in escapes., Green Arrow suit: Oliver wears
        a protective suit as his heroic alter-ego, Green Arrow, to hide his identity
        from his enemies, when he goes out fighting crime. It was designed by Cisco
        Ramon after his previous suit was taken by the police and destroyed., Second
        customized recurve bow: After Adrian Chase''s death, Oliver began using a
        new silver Hoyt Formula Faktor HP recurve bow with black limbs., Trick arrows:
        Oliver has used custom-designed arrows such as incendiary arrows that explode
        on contact. On occasions, he has also been known to use arrows embedded with
        recording and listening devices., Kryptonite arrows: Oliver possesses arrows
        with tips made out of Green Kryptonite on the chance that an evil Supergirl
        would show up., Antimatter arrows: At some point before the Crisis, Oliver
        somehow acquired metaphysical arrows laced with antimatter. He first used
        it to prevent the Monitor from teleporting him off Earth-38 in order to ensure
        the evacuation was complete., Voice filter: Oliver uses a voice filter to
        disguise his voice into a deep and garbled nature, whenever he was talking
        to individuals who do not know his true identity.'
      source_id: mediawiki-14848
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Genius (Oliver is very sharp-witted and methodical man, alert and adaptive
        to the situation. He is a quick learner, having gained great knowledge, if
        not mastery, in various fields, which implies that his academic troubles were
        not because of him lacking in ability, but rather drive or trying. Oliver
        is highly tactical, both in preparation and while in action, able to quickly
        analyze the situation and how best to handle it. He has a considerable degree
        of expertise in fields such as computers, driving/piloting, forensics, explosives,
        interrogation, manipulation, medicine, meditation, multiple languages (Such
        as Russian, Japanese, Arabic, and Mandarin), engineering, and toxicology)
        | Nigh-Omniscient (As the Spectre, Oliver displayed deep knowledge of how
        reality worked, even that his power would poison the Speed Force if he used
        it to boost Barry''s speed.Crisis on Infinite Earths: Part Four''Death of
        the Speed Force Furthermore, Oliver as the Spectre was aware of all the mystical
        and magical artifacts that were scattered across the multiverse including
        the Green Box that was tempting John Diggle. Oliver, with his dying breath,
        told Barry Allen and Sara Lance the future, correctly warned them that the
        Anti-Monitor Crisis is not over yet despite their foe''s apparent defeat.
        Furthermore, after becoming the watchful guardian of the multiverse, post-Crisis,
        Oliver as the Spectre was able to see into everyone''s future including Barry
        Allen''s and John Diggle''s. Using this knowledge he was able to give them
        advice as well as reassure their doubts about their future. He can also see
        the entire multiverse at the same time and Barry said Oliver knows everything
        now.It''s My Party and I''ll Die If I Want To)'
      source_id: mediawiki-14848
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Sometimes emotional, his powers are tied to the Multiverse so if the
