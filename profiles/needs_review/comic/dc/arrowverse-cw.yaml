        \ Canary's sonic scream.), Ice Manipulation with Freeze Arrow (Oliver used\
        \ several to freeze the drones armed by Emiko Adachi and the Ninth Circle.),\
        \ Poison Manipulation with Drug arrow (Used to deliver a spray of an aerosolized\
        \ drug. Oliver used a diazepam-ridden arrow in an attempt to slow down Prometheus.),\
        \ Stealth Mastery"
