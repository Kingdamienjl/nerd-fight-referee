        \ programs and networks. He was capable of hacking a system to transfer money\
        \ from/into bank accounts, set up a network to monitor criminal activity in\
        \ Star City, acquire guarded information, and work around security programs.\
        \ Oliver could also override basic attacks on his system in the Arrowcave.\
        \ Malcolm Merlyn commented that prior to learning Oliver's identity, his associates\
        \ and he thought that the Hood possessed advanced computer skills. Oliver's\
        \ abilities improved overtime due to training from Felicity; while in Slabside\
        \ Maximum Security Prison, he was able to hack into its network using an old\
        \ computer in the library to look up Peter Yorke's profile.), Acid Manipulation\
        \ with Acid Arrow (Used to breach covertly or weaken structurally, this arrow\
        \ was shown to Mia Smoak by Oliver when he was training her), Explosion Manipulation\
        \ with Explosive Arrows and Cluster Bomb Arrow, Explosive Arrows (Explosive\
        \ arrows, both time-delayed, and impact.), Remote Detonator Arrow (An explosive\
        \ arrow that can be detonated by remote control. Oliver used one to distract\
        \ Dr. Webb and escape from being his bounds.), Cluster Bomb Arrow (An arrow\
        \ that releases a small group of bombs midway and detonates on impact.), Power\
        \ Nullification with Nanit Arrow and Sound-Dampening Arrow, Nanit Arrow (Courtesy\
        \ of Ray Palmer, an arrow that emits a pulse strong enough to temporarily\
        \ disable Eobard Thawne's speed. Oliver also used the arrow to shoot nanites\
        \ at Malcolm in order to track him down.), Sound-Dampening Arrow (An arrow\
        \ that is able to cancel out sound waves.), Smoke Manipulation with Smoke\
