      value: "Base \u25BE=, Superhuman Physical Characteristics, Magic, Limited Power\
        \ Nullification (Magic is the manipulation of the primal energies of light\
        \ and darkness and one can be used to negate the effects of the other), Empowerment\
        \ (Star city strengthened itself with the hopes of its citizens.), Acrobatics,\
        \ Master Hand-to-Hand Combatant (His style is proven to be extremely unpredictable,\
        \ displaying highly advanced skill and knowledge in many martial arts, able\
        \ to incorporate Kali, Kenjutsu, Wing Chun, Sambo, Systema, Judo, Taekwondo,\
        \ Hapkido, Capoeria, Pro Wrestling, Silat, and Muay Thai), Weapon Mastery\
        \ (Master Archer, Master Marksman, Master Swordsman, Master Stick fighter,\
        \ Master knive-fighter/thrower), Vehicular Mastery (Expert driver and pilot),\
        \ Status Effect Inducement with various arrows, Electricity Manipulation with\
        \ electric arrow, Magnetism Manipulation with magnetic arrow, Light Manipulation\
        \ with flashbang arrow, Fire Manipulation with flame burst arrow, Hacking\
        \ (During Oliver's time in A.R.G.U.S., he became quite proficient in handling\
        \ programs and networks. He was capable of hacking a system to transfer money\
        \ from/into bank accounts, set up a network to monitor criminal activity in\
        \ Star City, acquire guarded information, and work around security programs.\
        \ Oliver could also override basic attacks on his system in the Arrowcave.\
        \ Malcolm Merlyn commented that prior to learning Oliver's identity, his associates\
        \ and he thought that the Hood possessed advanced computer skills. Oliver's\
        \ abilities improved overtime due to training from Felicity; while in Slabside\
        \ Maximum Security Prison, he was able to hack into its network using an old\
        \ computer in the library to look up Peter Yorke's profile.), Acid Manipulation\
        \ with Acid Arrow (Used to breach covertly or weaken structurally, this arrow\
        \ was shown to Mia Smoak by Oliver when he was training her), Explosion Manipulation\
        \ with Explosive Arrows and Cluster Bomb Arrow, Explosive Arrows (Explosive\
        \ arrows, both time-delayed, and impact.), Remote Detonator Arrow (An explosive\
        \ arrow that can be detonated by remote control. Oliver used one to distract\
        \ Dr. Webb and escape from being his bounds.), Cluster Bomb Arrow (An arrow\
        \ that releases a small group of bombs midway and detonates on impact.), Power\
        \ Nullification with Nanit Arrow and Sound-Dampening Arrow, Nanit Arrow (Courtesy\
        \ of Ray Palmer, an arrow that emits a pulse strong enough to temporarily\
        \ disable Eobard Thawne's speed. Oliver also used the arrow to shoot nanites\
        \ at Malcolm in order to track him down.), Sound-Dampening Arrow (An arrow\
        \ that is able to cancel out sound waves.), Smoke Manipulation with Smoke\
        \ Flechette and Tear Gas Arrow and Smoke Bomb, Smoke Flechette (This type\
        \ has a device that releases a strong puff of smoke after exploding. Oliver\
        \ used one in \"Identity\" to distract and escape the police. He also used\
        \ this flechette to get away from the police when fighting Bronze Tiger.),\
        \ Tear Gas Arrow (An arrow that releases tear gas used to calm down a riot.),\
        \ Smoke bombs (Oliver used a smoke bomb in his fight against Nyssa to temporarily\
        \ blind her.), Forcefield Creation with Shield Arrow (An arrow that releases\
        \ a metallic net which can latch itself to a surface and essentially become\
        \ a bulletproof shield. It can withstand fully automatic firepower.), Sound\
        \ Manipulation with Voice Filter and Sonic Arrow, Voice Filter (Oliver uses\
        \ a voice filter to disguise his voice into a deep and garbled nature; whenever\
