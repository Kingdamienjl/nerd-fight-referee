  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses, Natural Weaponry. Underwater
    Breathing (Is a shark), Magma Manipulation, Temperature Manipulation, Air Manipulation,
    Weather Manipulation, Accelerated Development (Melted a rock into magma and can
    create volcanos. Created a tornado and a stormGreen Lantern Vol 2 24), Mind Manipulation
