- id: claim-weaknesses-8cc17c76
  section: weaknesses
  axis: weakness
  text: 'Radiation can force him back into animal form Standard Tactics: Shark fights
    both telepathically and physically. Though he often uses his telepaths powers
    first, namely his fear inducing powers, he is still a capable physical fighter,
    using his assets as a predator animal to his advantage. Note: The Shark was either
    not affected by Crisis on Infinite Earths, or the affects were so minor that he
    is treated as a singular character with a fluid history. Still, his stats are
    split in two to account for the separate consistencies between the two eras.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
