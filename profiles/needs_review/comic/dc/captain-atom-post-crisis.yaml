    - field: weaknesses
      value: 'If the laws of nature are tampered with, his powers weaken.His eyes
        aren''t as durable as the rest of his body. If his skin is breached, he can
        cause a powerful explosion of quantum force. Two quantum field manipulators
        can cancel out each other''s powers. Often, he tries to hold back his power
        levels due to potential God Complex and fears he is losing his humanity. X-Ionized
        weapons can cut his skin. If Captain Atom absorbs too much energy at once,
        he will be sent hurtling through time. Depending on the type of energy absorbed,
        he either goes forward or backwards. Sometimes after he goes nuclear, it takes
        up to 24 hours for his powers to return. Captain Atom also fears turning into
        his dark side known as Monarch. As Monarch, he was very ruthless and overconfident.
        His Monarch armor is not as sturdy as his Captain Atom shell. If his Armor
        gets breached, it can accidentally release enough energy to destroy an entire
        Universal space-time continuum. Notable Attacks/Techniques *Hold back: Captain
        Atom almost always holds back for various reasons. It can be his mental state,
        his emotional state, or some other inner conflict he is going through. In
        addition, he fears his dark side taking over and getting the better of him.
        Therefore, his power varies greatly and rarely ever go all out. In Captain
        Atom Vol.2 54 - 57 he stopped holding back momentarily, which led to him creating
        and destroying a universe over and over again with but a mere thought. As
        Monarch, he had no such mental weakness and always fought at his full strength.
        *Talk first: Captain Atom is a man with a lot of trauma, and often, he would
        rather talk than go all out and fight someone. He is a kind man and is willing
        to hear them out first rather than hurt them - when possible, of course. And
        even if he attacks, he rarely ever attack first. As Monarch, he likes to emotionally
        hurt his opponents and hold the higher ground intellectually before unleashing
        his power against them. *Energy over matter: Captain Atom''s primary method
        of attack is energy manipulation. He has more control over its output compared
        to his other destructive abilities. Even when battling in melee combat, he
        prefers to employ energy in any way he can. *BFR: As Monarch, sometimes he
        would simply remove his enemies from the battlefield rather than waste time
        on them. *Quantum Field: By manipulating the Quantum Field, Captain Atom is
        able to control time, space, energy, and matter at will. His energy absorption
        is potent enough to overcome foes significantly more powerful than himself,
        such as Nekron. *Big Bang: Captain Atom is also able to control incredible
        amounts of energy, being able to catalyze another Big Bang if he so wished.
        ==Others== Notable Victories: Notable Losses: Inconclusive Matches: Category:Z''s
        Universe Category:Tier 2'
