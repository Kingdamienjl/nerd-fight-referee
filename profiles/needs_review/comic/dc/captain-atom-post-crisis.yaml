      Level (Overpowered the Grip of Pre-DOS Superman amped by the Macrolatts ,The
      Weird #4. 1988 Considered alongside Pre-DOS Superman to be the two most powerful
      heroes of Earth.Captain Atom Vol 2 (1987) #46 Fought against the Klystar alongside
      SupermanCaptain Atom Vol 2 4623 Zettatons) to Galaxy level in restricted state
      (Comparable to his durability. Just a few months into his career, he fought
      Firestorm - twice - and were almost equal to one another.Captain Atom Vol 2
      11 Briefly took on a small group of Justice League. Fought robot versions of
      JL - created by a villain - on Dead World. In a weakened and confused state,
      he overpowered Mr. Majestic who had fought Superman Blue in the past.Captain
      Atom: Armageddon Vol 1 1 Considered one of the most powerful heroes on Earth.
      In Armageddon event, he was hinted at being the most powerful of Earth''s heroes,
      was stated to be one of the four most powerful heroes on Earth alongside Captain
      Marvel, Wonder Woman and Superman.Wonder Woman vol 2 (1987) #173. 2001. Stated
      again.Superman: The Man of Steel vol 1 (1991) #117 Momentarily restrained Dark
      Matter infused Takion. Provided one-fourth of the energy needed to increase
      the size of a Boom TubeZero Hour: Crisis in Time Vol 1 21.7 YottaFoe), Low Complex
      Multiverse level when unrestricted (Casually created his own universe in the
      Quantum Field with its own set of laws, reality, and time. When their family
      dog was killed, he destroyed and recreated the universe so their dog could exist
      once again. Destroyed the universe and recreated it just so he could be the
      first astronaut on the moon. When his family was falling apart, he destroyed
      and recreated the universe so it wasn''t the case. Created his own version of
      DC heroes, including The Spectre. And destroyed it as easily once he lost control
      to his other self. Fought and overpowered his shadow-self who could also create
      and destroy reality with ease and was comparable to Nathaniel in every way.
      When he went nuclear, he killed Jenny Quantum without meaning to. Waverider
      believed Captain Atom was potentially the most powerful man alive. Tackled Starro
