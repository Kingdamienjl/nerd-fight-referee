    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) *Multiple Personalities (Suffers from extreme split
        personality disorder - he has three personas: Harvey Dent, Two-Face aka Big
        Bad Harv, and The Judge) * Weapon Mastery (with firearms, and as The Judge
        with his sword and gavel) *Preparation (Planted bombs two times in attempts
        to kill Batman. Rigged his house with security systems that fired gas. Rigged
        traps that restrained Riddler and his goons) *Social Influencing (Charisma:
        Served as Gotham''s DA for a term and was extremely talented with public relations,
        to the point where he''s implied to be a shoo-in for re-election. Has manipulated
        many criminals into following him) With preparation, Two-Face possesses: *Paralysis
        Inducement (As The Judge, used cuffs that restrained Batman) *Explosion Manipulation
        (Has planted bombs) *Gas Manipulation/Poison Manipulation (His plan in Sins
        of the Father involved creating a toxic gas)'
      source_id: character-stats-profiles-two-face-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
