      confidence: 0.75
    - field: weaknesses
      value: 'Cannot make major decisions without flipping his coin, and will lose
        his composure if he cannot consult it. Note: Bruce Timm has stated that the
        original DCAU tie-in comics are not canon, with the only tie in comics that
