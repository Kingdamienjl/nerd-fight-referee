    - field: intelligence
      value: Gifted. Although he was mutilated and his mind was fractured by his accident,
        Two-Face remained very charismatic and able to keep many criminals around
        him. He uses very effective political campaign tactics to convince new recruits
        and is ready to welcome anyone in his group to Arkham City. Moreover, although
        his group is the smallest and the weakest, he is the boss of the most sympathetic
        crime and is more appreciated by his men than other crime lords. His fragile
        mental state can also be an advantage because he allows Dent to be unpredictable
        and therefore makes him an opponent difficult to fight. Moreover, he has a
        huge determination; even after his humiliation by Catwoman and his defeat
        against Batman, he continued to try to take control of Arkham City and never
        gave up.
      source_id: vsbattles-two-face-post-flashpoint-dc
      provider_id: vsbattles
