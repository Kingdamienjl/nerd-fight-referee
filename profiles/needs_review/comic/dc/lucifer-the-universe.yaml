    - field: attack_potency
      value: High Outerversal Level (Effortlessly destroyed the box holding the Basanos,
        tarot cards containing the powers from Destiny of the Endless' book. Roughly
        equal to Michael Demiurgos. Time and space are extensions of the mind and
        will, which Lucifer embodies as he is the divine will that shape Creation.
        Which means that infinity is a purely local phenomenon to Lucifer. Completely
        transcends Destiny of the Endless and his book, which contains all of the
        Creation, including 1-A realms such as the Sphere of Gods, a metaphysical
        reality of archetypal and platonic concepts, as well as the Source Wall, Monitor
        Sphere, Limbo, etc. Far superior to all of the Endless, conceptual entities
        who exist in "space beneath space", "space beyond space" and the "cracks of
        the real" and existed in every Creations in the Greater Omniverse. Superior
        to Mother Night and Father Time, with the former is boundless and exists beyond
        every horizon. Completely ignored the Source as if it were nothing, an entity
        that is equal in existence to the Overvoid, implying that Lucifer is far greater
        than it. Lucifer's Creation, which he himself created from Michael's Dunamic
        Demiurgos powers, is a multiverse, a totality that rivals that of the Presence
        and "all-encompassing". With his mere presence, completely erased the Mansion
        of Silence, a realm beyond even the reach of the Endless, where all rejected
        Multiverses and Creations are contained. Escape his own function and role
        in the Presence plan and went outside it, which encompasses all of Creation.
        Effortlessly destroyed the Logos with his fire, which is the first word that
        sung all of existence into being. Capable of moving in, and comprehend the
        nature of the Overvoid, which is "infinite", "eternal" and in the end, all
        things and all of Creation filled to zero in it. The Overvoid also transcends
        all notion of space-time, where all things and stories are layered on themselves
