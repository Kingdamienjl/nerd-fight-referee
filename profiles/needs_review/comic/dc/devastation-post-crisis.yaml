    and she can do so rapidly enough that her manipulated memories can catch up to
    the present instance, effectively functioning as Illusion CreationWonder Woman
    Vol 1 146) **Perception Manipulation (Can make creatures forget basic function,
    such as how to see, hear or speakWonder Woman Vol 1 145) **Illusion Creation (Can
    implant false memories of herself remotely to make it seem she was elsewhere **Resistance
