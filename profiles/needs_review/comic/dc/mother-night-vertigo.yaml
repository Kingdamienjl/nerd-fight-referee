    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Immortality (Types 10 and 11),\
        \ Abstract Existence (Type 3; Embodies an aspect of God\u2019s omnipotence\
        \ as a Demiurgic Archangel. In Michael's case, he embodies God\u2019s Omnipotent\
        \ Power), Transduality (Type 1 and 3; Transcend Creation and Concepts), Law\
        \ Manipulation (Shaped existence and its laws into effect), Creation (Michael\u2019\
        s powers are the essential foundation of the DC Omniverse, and the powers\
        \ released from his body allows Lucifer to create a multiverse, a totality),\
        \ Large Size, Acausality (type 5), Regeneration (True-Godly, can only died\
        \ if Michael wished himself to die), Time and Space Manipulation (His powers\
        \ transform Lucifer\u2019s Void into a physical universe), Flight (His angel\
        \ wings allow Michael to fly), Matter Manipulation (Create the matter that\
        \ shapes Creation from absolute nothingness), Biological Manipulation (Turns\
        \ the angel Aztar into the Wrath of God, The Spectre. Control the primal essence\
        \ of The Spectre and send it back to Jim Corrigan), Spatial-Temporal Lock\
        \ (Exists outside the entire DC Comics in its entirety. Even the Endless has\
        \ no power and authority over the Demiurgic Archangels), Higher-Dimensional\
        \ Manipulation, Existence Erasure (Destroy two angels, presumably erasing\
        \ them from existence, with a single glance), Power Nullification, Power Bestowal\
        \ (Turn Aztar into The Spectre), Empowerment (The Dumanis Demiurgos originated\
        \ from God himself, as it is Yahweh\u2019s powers. Though Michael does not\
        \ necessarily rely on his father to sustain his own omnipotence), Life & Death\
        \ Manipulation, Resurrection, Intangibility, Telekinesis, Conceptual Manipulation\
        \ (Type 1; Primal concepts in the DC Verse originated from the Demiurgic powers\
        \ Michael hold. Created the Endless when he, Lucifer and Gabriel shaped Creation),\
        \ Elemental Manipulation, Fire Manipulation, Causality Manipulation, Necromancy\
        \ and Soul manipulation (As the protector of Heaven, Michael can grant passage\
        \ or banishes souls of other creatures), Non-Physical Interaction (Michael\u2019\
        s powers are capable of effortlessly affecting and destroying the Endless,\
        \ which embodies primal truth and concept of Creation, as well as angels,\
        \ species that are essence without shapes. Should also be capable of affecting\
        \ other cosmic entities), Nonexistent Physiology, Non-Corporeality, Pocket\
        \ Reality Manipulation (His powers sustain a pocket dimension for years where\
        \ he was tortured), Reality Warping (Could have ended the Rebellion with a\
        \ gesture. His powers turned the Void into Creation), Shapeshifting, Cosmic\
        \ Magic, Sealing, Mind Manipulation, Teleportation, BFR (Can banish others),\
        \ Dimensional Travel, Beyond-Dimensional Physiology, Energy Manipulation,\
        \ Plot Manipulation (All stories from DC Comics originated from Michael. Exists\
        \ on the Void beyond Creation and can comprehend and even possibly influence\
        \ infinite layers of stories {which is the DC Comics itself} to his own liking),\
        \ Chaos Manipulation (Wielded and shaped the primordial energy from which\
        \ all was created), Darkness Manipulation, Void Manipulation, Light Manipulation,\
        \ Dream Manipulation, Acid Manipulation (Has acidic blood), Precognition,\
        \ Cosmic Awareness, Telepathy, Nigh-Omniscience, Omnipresence, likely many\
        \ other powers. Master Combatant and Swordsmanship (Is a powerful and experience\
        \ warrior), Supernatural Willpower (Resist Sandalphon's torture for eons).,\
        \ Resistance to Death Manipulation (Is beyond death and can resurrect himself\
        \ should he died), Fate Manipulation (Superior to Destiny of the Endless,\
        \ though his jurisdiction does not allow him to forcibly strip Destiny\u2019\
        s Book, and is still under the Presence\u2019s predestination), Conceptual\
        \ Manipulation, Void Manipulation and Existence Erasure (Exist in the Overvoid,\
        \ which is the realm of Void and nothingness outside Creation. The same realm\
        \ destroy Mandrakk the Dark Monitor when the entity enters it), Space-Time\
        \ Manipulation, and all previously stated abilities."
      source_id: character-stats-profiles-mother-night-vertigo-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "High Outerversal Level (The Source, which exists on the same level of\
        \ existence as the Overvoid, is a fraction of God/ the Presence and Michael\
        \ himself. Transcends Destiny of the Endless\u2019 Book, which contains all\
        \ of existence and beyond. Is the most powerful Creation of The Presence and\
        \ embodies all aspects of Yahweh, as well as the entire Creation. Renew every\
        \ moment and atom of the Creation, which should also includes 1-A realms such\
        \ as Limbo, The Source Wall and Monitor Sphere; as well as concepts, logic,\
        \ ideas and beings. Is equal to Lucifer Morningstar and threatened to destroy\
        \ and banish him on different occasions. Far superior to the The Spectre,\
        \ who can become one with the Void and is connected to the Oversoul which\
        \ encompasses DC Comics as a whole via The Logoz, and easily defeated and\
        \ swatted him away like a bug. Should be beyond all known cosmic entities\
        \ in DC Omniverse, even 1-A or High 1-A ones such as The Source, The Endless,\
        \ Father Night and Mother Time, Though Robot and The Dark Monitor Mandrakk.\
        \ Mother Night is also boundless and exists beyond every event horizon. It\
        \ is stated that Lucifer and Michael\u2019s combined might is equal to Yahweh\
        \ himself. As one of the creator of the DC Omniverse, Michael exists in and\
        \ capable of moving in, comprehend and understand the boundless Void which\
        \ is far beyond every definition of space-time and concepts, where all things\
        \ and stories are layered on themselves endlessly and perception twists around\
        \ its own axis until it is blinded by fullness, crippled by infinite repetition;\
        \ to which the entire Creation are nothing but mere stories and narrative\
        \ which Michael, Lucifer and Yahweh can presumably influence at will.)"
      source_id: character-stats-profiles-mother-night-vertigo-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: "Irrelevant, Omnipresence in True Form and via the Dumanis Demiurgos\
