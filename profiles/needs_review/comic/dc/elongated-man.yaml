    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) * Elasticity (Plastic Man''s unique physiology allows
        for the extension of every part of his body, as well as allowing him to flatten
        out and slip through practically infinitesimal cracks, such as a keyhole,
        the space under a door, a pipe, et cetera) *Shapeshifting (Plastic Man can
        uncannily and seemingly limitlessly manipulate his body in order to drastically
        change his appearance - he can imitate other people, animals, and even inanimate
        objects if need be) *Weapon Creation (Plastic Man can shapeshift parts of
        his body into facsimiles of weapons, giving him an advantage in battle) *Regeneration
        (Low-High: Instantly reconstituted himself after being melted into a puddle.
        "Pulled himself together" after being melted into liquid by a chemical agent.
        Reformed his body after being literally sliced into ribbons. Was fine after
        being literally squashed flat) *Mastery of His Own Fighting Style (Not only
        does Plastic Man presumably have some combat training considering his years
        of service with the FBI, but he also uses his unique physiology masterfully
        (thought of as "the master stretch artist of them all"), to attack in extremely
        unconventional ways, making him a very unpredictable and slippery opponent.
        He doesn''t hesitate to attack the more vulnerable points of his opponents''
        bodies, such as poking their eyes out by extending his fingers) *Size Manipulation
        (In various ways, Plastic Man has shown the ability to make parts of, if not
        all of, his body either far larger or far smaller) *Attack Reflection (Projectiles,
        such as bullets, bounce off of him - this has, in the past, resulted in people
        being struck by their own bullets after firing them at Plastic Man. In two
        cases, even striking him with a handheld weapon caused the strike to rebound
        and hit the attacker) *BFR (He can use his stretchiness to essentially become
        a human catapult, sending his foes great distances away when they charge him)
        * Surface Scaling (Capable of using his feet as suction cups) *Stealth Mastery
        (Disappeared on a man when his back was turned for an extremely short time,
        and snuck up on him to attack) *Superhuman Athleticism (Can jump inhumanly
        high via bouncing) *Gliding (Can either turn himself into a propeller to simulate
        flight, or assume the shapes of objects that can utilize limited flight) *Paralysis
        Inducement (Can use his elasticity to wrap parts of himself around a foe,
        immobilizing them) *Preparation (Prepared a sunlight reflector to vaporize
        Mr. Aqua, and acquired itching powder to incapacitate an opponent) * Social
        Influencing (Convinced Woozy Winks to renounce his criminal ways) *Natural
        Weaponry (Can stretch his teeth into snake-like fangs) *Underground Mobility
        (Used his body as a drill, coming up from underground) *Fourth Wall Awareness
        (Depicted as knowing he''s in a comic book, turning and speaking to the audience)
        *Resistance to Electricity Manipulation (Due to his body approximating the
        qualities of rubber, he is completely insulated against electricity - he can
        no-sell electricity of such a high voltage that it could instantly kill a
        normal man and blast through the wall of a bank) *Limited Wind Manipulation
        (By using himself as a propeller, he can create gusts so intense that they
        could completely cool down a lava man - said lava man was so hot he could
        melt steel like butter just by touching it. Can expel huge gusts of air, presumably
        by increasing the size of his lungs) *Limited Resistance to Fire and Extreme
        Heat (Rolled through flames without a singe, withstood a bear hug from a man
        made of lava, and was unhurt by being submerged in boiling taffy)'
