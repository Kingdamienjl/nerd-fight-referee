    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Flight (via the Static Saucer),
        Electricity Manipulation, Magnetism Manipulation (Can use magnetism to lift
        and throw objects, as well as magnetize people to walls and magnetize doors/windows
        to prevent them from opening), Forcefield Creation, Non-Physical Interaction
        (His electricity affected Martian Manhunter while the latter was intangible),
        Statistics Amplification (Can amplify his own stats by tapping into electrical
        power sources. Amplified Terry McGinnis and temporarily made him stronger,
        and later did the same to John Stewart), Technology Manipulation (Has reanimated
        and controlled animatronics, changed TV channels and seized control of subway
        trains with his powers), Radiation Manipulation (Can manipulate radio waves
        in order to eavesdrop on people), Resistance to chemicals (Resisted knockout
        gas), Electricity Manipulation (Being hit with electricity only serves to
        fuel his powers), and Mind Manipulation (Was unaffected by mind control from
        Brainiac's technology. Resisted Madelyn Spaulding's mind control)
      source_id: mediawiki-4559911
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Small Building level normally (Collapsed a small building with his powers.
        Harmed and incapacitated the Joker, who has showcased such durability. Has
        gone toe-to-toe with Hotstreak, another Bang Baby comparable to himself, on
        numerous occasions. Fought and harmed Terry McGinnis), up to Multi-City Block
        level with sufficient electricity absorbed. (Has melted a large section of
        ice the size of a building and knocked out power throughout an entire section
        of Dakota City. However, both of these feats drained him of all of his electricity
        at the time and left him largely powerless)
      source_id: mediawiki-4559911
      provider_id: vsbattles
      authority: high
      confidence: 0.75
