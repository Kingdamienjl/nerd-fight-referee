    - field: attack_potency
      value: 'Universe level+ (Can rapidly disable and defeat most of the JLA with
        minimal effort. Has fought many variations of Superman on level terms, including
        defeating him. Effortlessly defused Firestorm, who could create a Big Bang
        purely through emotional instability. Being removed from the space-time continuum
        of a universe accidentally annihilated it. One-shot Conner Kent, who can fight
        Superboy-Prime. Even a weakened fragment of his previous self is extremely
        strong, capable of thrashing post-Flashpoint Hal Jordan and Superman. This
        Darkseid was also stated to regularly consume and destroy universes. Fodderized
        Alan Scott, despite him being empowered by the all of the Green throughout
        the multiverse. Darkseid is also stronger than ever currently, thanks to having
        merged with all his previous incarnations.) | High Outerverse level (Even
        just by sheer size, Darkseid is so large that his shadow made the multiverse
        look flat. The multiverse itself contains outerversal structures like The
        Bleed, the Speed Force Wall, and the fourth dimension: the outerversal Timestream.
        Far stronger than the vast majority of the New and Old Gods. Is a threat to
        the Source itself. Stomped Eclipso, forcing him to serve Darkseid. Similarly,
        Darkseid stated that the Spectre had no power on Apokolips. Created Stayne,
        a rival in power to Takion, who embodies the Source. Fought evenly with a
        weakened Anti-Monitor, only losing due the Anti-Monitor using the God of Death
        Flash. Cracked the Source Wall in his fight with Highfather. Scales to Sivaa
        through boomtube Superman, who was going to destroy all of creation by dancing.
