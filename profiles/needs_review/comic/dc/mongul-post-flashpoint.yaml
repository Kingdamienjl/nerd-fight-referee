    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Genius Intelligence, Martial Arts
        (Can comfortably fight Orion in hand-to-hand combat), Self-Sustenance (Types
        1 and 2: his abstract origins means he doesn''t need regular biological sustenance),
        Flight, Aura, Magic (can also manipulate others'' magic), Regeneration (Low-Godly:
        Regenerated his eyes effortlessly. Returned to life fully regenerated after
        being killed by the Spectre, as he is a necessary force in existence), Immortality
        (Types 1, 2, 4, 8, possibly 9: Used Orion''s body to ressurrect himself from
        death. Regenerated despite being killed by Spectre as above. Survived in his
        essence form despite literally dying and unable to regenerate his body. Returned
        after being shot by a Radion bullet, and having his essence destroyed. Reincarnated
        after dying again in Darkseid War. Due to his heritage from the Sphere of
        the Gods, he may be unable to be killed unless he is at his true size.), Extrasensory
        Perception (Sensed a sentry approaching him, can see invisible beings and
        souls. He has 18 divine senses, sensed Constantine through cloaking spells,
        from another dimension), Corruption (with the Omega Effect), Portal Creation,
        Dimensional Travel and Size Manipulation (Via boomtubes, which he can open
        at will. Can be used to BFR opponents), Intangibility and Invisibility (They
        are a "force which knows no barriers", and can be cloaked), Homing Attack
        (Notoriously known to seek out his target), Durability Negation, Existence
        Erasure and Causality Manipulation (Can make the target cease to exist, to
        the point where there is "no afterlife, no chance of rebirth or redemption),
        Matter Manipulation (Tuned his beams to Superman''s molecular structure to
        inflict maximum pain), BFR (Can send his target elsewhere or through time;
        as happened to Batman in Final Crisis), Death Manipulation (Can send targets
        to the Omega Sanction, to experience infinite death, each one worse than the
        last), Energy Manipulation (Erased Wildfire''s energy form), Petrification
        (Used on Slo-bo), Fusion Negation (Shown here, also ripped Professor Stein
        out of the Firestorm Matrix), Soul Manipulation (Can shatter souls), Absorption
        (Planet-wide. Has drained extremely powerful Gods to restore his power), Forcefield
        Creation (Can ward himself and can be used to block others), Teleportation
        (By using Omega Beams on himself), Non-Physical Interaction (Could interact
        with the Firestorm Matrix and hit Secret with Omega Beams), Life Manipulation
        (Trapped Cyborg Superman''s essence in a sphere, and animated a statue while
        trapped in the Source Wall. His draining of Zeus also took his life), Resurrection
        (Resurrected a human, many Parademons, one of the furries, and DeSaad), Paralysis
        Inducement (Used on Infinity Man), Healing (Healed Orion after regenerating
        from his body), Duplication (via avatars), Astral Projection (Shown here),
        Power Bestowal (Created Validus from a baby, can grant the Omega Effect to
        others), Power Nullification (Removed Bouncing Boy''s powers), Spatial Manipulation
        (Warped a boomtube, can physically crack the fabric of dimensions. Created
        a hole in space with his hand, which also warped gravity and time around it),
        Time Manipulation (Can accelerate time), Time Travel (Stated by Orion), Creation
        (Created Stayne, the opposite of Takion, with his own power), Telekinesis
        (Restrained Superman and Infinity Man), Telepathy and Mind Manipulation (Contolled
        three million Daxamites, and can probe minds for information, such as with
        Constantine), Empathic Manipulation (Reversed the effects of feeling-altering
        soap), Pain Manipulation (Directly with the Omega Effect), Biological Manipulation
        (Deformed Dream Girl and used a neural disruptor on the JLA), Deconstruction
        (Incinerated Kalibak''s flesh), Weather Manipulation (Ruined Scott Free''s
        wedding with a storm), Summoning (Boomtubed his entire army to Themyscira),
        Technopathy (Tampered with Orion''s Mother Box, took control of Mr. Terrific''s
        boom spheres), Social Influencing (Restored Superman''s will to fight with
        a speech), Conceptual Manipulation (Type 1: Cowed the Black Racer, and can
        summon him at will), Dream Manipulation (Invaded Grail''s dreams)'
      source_id: character-stats-profiles-mongul-post-flashpoint
