  tier:
    text: At least 9-C, likely 8-C, far higher with the Sword of the Night
    source_ids: &id002
    - mediawiki-4714368
    confidence: 0.8
  attack_potency:
    text: At least Street level (Comparable to real life chimpanzees), likely Building
      level (Capable of killing vampires who are stronger than humans and could threaten
      Zatanna, by thrusting thick wooden stakes through their chests), far higher
      with the Sword of the Night (With his sword, cut a monster that seemingly withstood
      attacks from EtriganJustice League Vol 4 66Justice League Vol 4 67)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Peak Human movement speed (Should be at least as fast as regular chimpanzees)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Athletic Human (Lifted Nightwing with one arm while riding on horseback.Justice
      League Vol 4 56 Should be at least as strong as regular chimpanzees)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Street level, likely Building level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Street level, likely Building level
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Athletic. Could stand up after receiving a gunshot to his stomach.Batman
      Secret Files Vol 1 1
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Extended Melee Range with the Sword of Night, Kilometres
      with magic (Affected all of Myrra with a resurrection spell), Interdimensional
      with Dimensional Travel
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Extraordinary Genius. Managed to understand a magic tome that Zatanna could
      not comprehend. Managed to crack the Voynich manuscript, a real life codex that
      nobody has even been able to understand. His memory is so good that he manages
      to remember every single time he's read any word and stores any and all scraps
      of information that he's ever absorbed. Correctly deduced that what he thought
      was a demon messing with him was actually Mister Mxyzptlk. Was the only one
      among the Justice League Dark to realize Wonder Woman was possessed by Eclipso.Justice
      League Dark Vol 2 17 In the span of a single case, Bobo managed to track down
      Batman, correctly guess that the Riddler was behind certain crimes, solve one
      of his riddles and even possibly learn Batman's true identity, all with no other
      tools than a magnifying glass. Hid the coordinates to a place inside the altered
      crystalline architecture of an icicle. Is a member of the Guild of Detection,
      a group that consists of the greatest detectives in the world.Detective Comics
      Vol 1 1000
    source_ids: *id002
    confidence: 0.8
