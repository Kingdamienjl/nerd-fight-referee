        has mostly been ignored in more recent times. Jason needs to utter a short
        spell to summon Etrigan. If Jason is separated from Etrigan, he will rapidly
        age into an old man. Notes: *The Lucifer that Etrigan used to serve under
        and then defeated is a different character from Lucifer Morningstar. *Unlike
        his Post-Crisis self, Etrigan is typically not forced to rhyme. He can speak
        normally and simply chooses to rhyme for his own amusement. *Before making
