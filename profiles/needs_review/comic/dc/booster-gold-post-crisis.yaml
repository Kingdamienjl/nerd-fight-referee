        uncontrolled, yet it does not instantly swallow the planet, which an IRL black
        hole the size of a quarter would), and therefore he wouldn't scale to IRL
        Black Holes. Even normal humans are shown reacting to being sucked in by the
        anomaly, meaning clearly it isn't a real black hole which sucks things up
