      value: At least Building Level, likely Large Building Level physically (Fought
        a sentient building, shifting it backward with his punches - later holding
        himself in place against the pull of a gravitational anomaly that sucked a
        building in even whilst closer to said anomaly than the building was. Defeated
        a building-sized robot, albeit offscreen. Effortlessly knocked doors off their
        hinges), possibly far higher (Managed to hold himself back from getting totally
        sucked in by the "mini black hole" after its pull had become powerful enough
        to seemingly bend several buildings), with at least Small Building Level energy
        beams (Destroyed the awning over a subway station and blasted away the resulting
        rubble. Damaged the exterior of a rock formation), possibly far higher (Possibly
        equal to or greater than the power of his physical strength) - Booster would
        not gain black hole strength scaling from holding back the gravitational anomaly,
        as clearly it isn't as powerful as a normal black hole (it is stated to be
        uncontrolled, yet it does not instantly swallow the planet, which an IRL black
        hole the size of a quarter would), and therefore he wouldn't scale to IRL
        Black Holes.
