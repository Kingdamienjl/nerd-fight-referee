  intelligence:
    text: Gifted. His science skills were largely retconned after COIE, but his knowledge
      of how the cold works is still superb and his skills in fighting superheroes
      much stronger and faster than him should not go understated. Though only having
      a few wins, it's said multiple times that with his skills and tools, he could
      kill The Flash if he wanted to, but simply doesn't, as it would bring to much
      attention (and because he genuinely respects the whole Flash family). Whenever
      he got truly serious, very few foes have been able to defeat him, those who
      have that honor are Eobard Thawne and Superman.
    source_ids: *id002
    confidence: 0.8
