    - field: intelligence
      value: At least Gifted. A master manipulator who can weaponize her situation
        to sway even those with good heads and kind hearts to her side. Her persuasion
        abilities rival that of The Joker and she has been able to pull off feats
        such as taking over an entire prison, causing a large amount of teenagers
        to support her, and convince the public that she was innocent. In terms of
        combat, she's shown to be reasonably skilled in fighting, able to go toe-to-toe
