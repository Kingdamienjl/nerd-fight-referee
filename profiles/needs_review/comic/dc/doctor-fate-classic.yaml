  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Magic, Flight, Telekinesis (Moves a planet
    into the sun, fixes a stoplight), Telepathy (Mystic probes), Size Manipulation,
    Duplication, Reality Warping, Energy Manipulation and Projection (As shown here
    and here), Teleportation, Summoning, Time Travel, Immortality, Soul Manipulation,
    Power Absorption, Matter Manipulation, Intangibility, Transmutation, Can channel
    power from all of humanity, Air Manipulation, Creation, Fire Manipulation, Power
    Bestowal, Resurrection of others, BFR (Can banish beings from the cosmos), Mind
    Control (Can mentally tell others to perform actions), Blood Manipulation, Biological
    Manipulation & Transmutation (Can change the blood types of multiple beings),
    Clairvoyance, Absorption & Attack Reflection (Can absorb and redirect energy),
    Empathy Manipulation, Memory Manipulation, Morality Manipulation (Can remove bad
    acts and memories of others, making them feel better and modifying their intentions.
    Can burn what ails others to make them feel better and change their empathy and
    intentions), Illusion Creation & Perception Manipulation (Can cast illusions and
    trick others' perceptions), Healing (Can "heal" wounds and machines), Astral Projection,
    Weather Manipulation, Invisibility (Can make himself and other things invisible),
    Cosmic Awareness, Incorporeality, Body Control, and Regeneration (High) (Scales
    to Mordru, and has no real body, He is made of energy like all the Lords of Chaos
    and Order). Resistance to Mind Manipulation (Granted by the amulet of Nabu. Resisted
    having his mind invaded by demons of madness)
  source_ids: *id003
