        Thinker Guild. Clark's intelligence was implied at an early age, winning a
        science fair at age 9 and reading "The Republic of Plato" when he was only
        13. As an adult, Clark successfully falsified personal information concerning
        his identity, name and work history, allowing him to stay hidden while traversing
        the world for many years. Clark has displayed basic medical knowledge, knowing
        to cauterize one of Lois Lane's wounds after she was injured. As a reporter
        for the Daily Planet, Clark is exceptionally skilled, receiving the Elliot
        Prize for Investigative Journalism twice after working for a year, being the
        first of any reporters on the Daily Planet staff to earn it. His investigative
        skills, coupled with a convenient instance of his Kryptonian Powers, allowed
        him to deduce Bruce Wayne's identity. Despite not having any formal combat
        training, Superman is a quick improvisational learner and effective brawler,
        as seen when he was pitted against several highly trained Kryptonians, Doomsday,
