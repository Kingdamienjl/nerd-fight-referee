    - field: weaknesses
      value: He is susceptible to red sunlight (though the Anti-Monitor armor negates
        this weakness). He has an innate fear of the Flashes due to being sealed in
        the Speed Force for a significant amount of time. Superboy-Prime is dangerously
        psychotic and insane, Killed 30 Green Lanterns, Tanked punches from Bart Allen
        after the latter absorbed the entirety of the speed force., Punched through
        the body of a weakened Anti-Monitor and tossing the rest of his body into
        space, Defeated people such as Ion (Sodam Yat), Black Adam, Wonder Woman,
        Martian Manhunter, Power Girl, During the Sinestro Corps War, it took a Guardian
        of the Universe to defeat him, sacrificing himself by releasing all the energy
        contained in his body. All the Oan energy released by the Guardian ended up
        being absorbed by Superman-Prime making him even more powerful. With that
        power, he tortured Mr. Mxyzptlk and survived an explosion powerful enough
        to destroy the universe during his fight with Monarch, a cosmic being who
        fought and defeated numerous counterparts of Captain Atom simultaneously and
        Superman and attempted to conquer the Multiverse in Countdown to Final Crisis.,
        After losing the Oan energy and being transported to the 30th Century, he
        proceeded to tank an attack from Mordru and take on the Legion of Super-Heroes
        with ease, Superboy-Prime originally appeared during the Crisis on Infinite
        Earths and was portrayed as roughly on par with Superman and other Pre-Crisis
        Kryptonians, and continuity were not rebooted like most other Pre-Crisis characters.,
        Do not scale Superboy-Prime from his fight with The Darkest Knight. He had
        no official reason for such a ridiculously extreme power-up, has no feats
        of his own anywhere near approaching this scale, our rules forbid listing
        these types of very brief power-ups, for DC Comics and Marvel Comics characters.,
