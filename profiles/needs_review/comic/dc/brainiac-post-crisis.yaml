      Doomsday. Massively FTL+ via his summons. | Massively FTL+ (Has kept pace with
      Superman) | Massively FTL+ (Traded blows with Superman and General Zod within
      his shell, and with Superboy, Krypto, and Lex Luthor outside of it) | Massively
      FTL+ (Could keep up with Supergirl)
    source_ids: *id002
    confidence: 0.8
