- id: claim-powers-and-abilities-bbabf102
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Vril Dox={{Border|Scroll=Yes|Visible=No|Content=
    *Superhuman Physical Characteristics **Immortality (Types 2 & 6; Survive getting
    his neck snappedAction Comics Vol 1 899) **Incorporeality (Exists as a mind, a
    mental parasite that latches itself onto others) **Natural Weaponry (His ship
    has many claws, teeth, and other natural weaponsAdventure Comics Vol 2 8) **Self-Sustenance
    (Battled Luthor in space and can survive with a broken neckAction Comics Vol 1
    899) **Elasticity & Elemental Intangibility (Became a being with fluid physiolgy
    in his Nanite formSuperman/Batman Vol 1 35) *Supergenius Intelligence *Cyborgization
    (Is one with much of his technology, including his ship. This applies to his Bio-Shell
    form as wellAction Comics Vol 1 869) *Hacking (Hacked the entire planet of Colu.R.E.B.E.L.S.
    Vol 2 19 Created and programmed artificial intelligence, such as Indigo. Hacked
    into Superman''s computers and his robotsSuperman Vol 2 219) *Fear Manipulation
    & Dream Manipulation (Entered Milton Fine''s dreams and mind every so oftenAdventures
    of Superman Vo 1 438) *Mind Manipulation (Mind controlled Guy Gardner, Kilowog,
    Matrix, Wally West and Big BardaAction Comics Vol 1 675) *Possession (Possessed
    Milton Fine, Doomsday,Superman: Doomsday Wars and O.M.A.C.Superman/Batman Vol
    1 35) *Flight (Traveled through space while in his true form.Action Comics Vol
    1 648 Fought Luthor in spaceAction Comics Vol 1 899) *Radiation Manipulation &
    Energy Projection (Blasted Superman with red solar radiationSuperman Vol 2 150)
    *Clairvoyance (Can display wherever in the universe with his technology is) *Transmutation
    (Was converting Barbara Gordan into a robot when he was merely a thoughtBirds
    of Prey Vol 1 72-73) *Information Analysis (His brain is seventy-times stronger
    than his spinal station, which can process the information of over seven octodecillion
    beings.Action Comics Vol 1 868 Processed more information in milliseconds that
    took Luthor hoursAdventure Comics Vol 2 3) *Memory Manipulation (Can download
    memories.Action Comics Vol 1 869 Wiped the entire minds of Brainiac 2 and 3R.E.B.E.L.S.
    Vol 2 20) *Instinctive Reaction (Can perform automatic actions, even in a coma)
    }} |-|Milton Fine={{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical
    Characteristics *Telekinesis (Able to levitate and strike with telepathic force
    at the speed of thought. Can put together machinary with his mindAction Comics
    Vol 1 647) *Flight (Can fly) *Morality Manipulation (Was incredibly close to taking
    control of Superman or even eliminating his morality, corrupting himAdventures
    of Superman Vol 1 445) *Mind Manipulation, Pain Manipulation & Power Nullification
    (Caused Superman and Milton immense pain, so great that it nullified Superman''s
    flight) *Astral Projection (Fought Superman on the mental plane) *Dream Manipulation
    (Manipulated Clark Kent''s dreamsSuperman Vol 2 25 multiple timesAction Comics
    Vol 1 647) *Water Manipulation (Controlled water) *Size Manipulation (Grew a monster
    in size) *Illusion Creation (Created an illusion that fooled even Superman.Superman
    Vol 2 26 Created animated several projections at once) *Extrasensory Perception
    (can detect brainwaves) *Astral Projection (Floated out of his physical body)
    *Technology Manipulation (While effectively bed-ridden, he gained full access
    of Luthor''s entire arsenal. Controlled a Coluan war machine from galaxies awayShowcase
    ''96 Vol 1 12) *Attack Reflection (Reflected Superman''s attacks) *Deconstruction
    (Deconstructed a gunAdventures of Superman Vol 1 519) *Vibration Manipulation
    & Air Manipulation (Created shockwaves and wind strong enough to fell the heroes
    of L.E.G.I.O.N.Showcase ''96 Vol 1 11) *Statistics Amplification (Amplified his
    strength) *Madness Manipulation (Nearly drove Superman insane) }} |-|God Machine={{Border|Scroll=Yes|Visible=No|Content=
    All the same powers but amplified, plus: *Natural Weaponry (In his bear formNew
    52: Futures End Vol 1 31) *Energy Manipulation & Duplication (Brainiac Sphere''s
    created a power-grid capable of duplicating his bodyNew 52: Futures End Vol 1
    40) *Void Manipulation & Existence Erasure (Capable of manipulating the Worlds
    which were erased from existence, resulting in the ability to erase individuals
    from existenceNew 52: Futures End Vol 1 41) *Energy Projection (His robot body
    is filled with weaponry, such as energy cannons) *Inorganic Physiology (His body
    is a mechanical monstrosity) *Instinctive Reaction (Batson claimed the energy
    blasts were apart of an automated defenseNew 52: Futures End Vol 1 42) }} |-|With
    Preparations and'
