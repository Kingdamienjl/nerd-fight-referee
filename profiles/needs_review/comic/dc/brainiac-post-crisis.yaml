  intelligence:
    text: Supergenius (Considered the most intelligent being in the universe by SupermanAction
      Comics Annual 10 and Brainiac 5. Naturally a 12th Level Intellect, orders of
      magnitude higher than the 8th Level Intellects of Coluans, and uses technology
      to boost his intelligence even moreR.E.B.E.L.S. Vol 2 18 His brain is leagues
      stronger than machinery that can process information of over seven octodecillion
      beings Astronomically more intelligent than Lex Luthor and has outperformed
      him without trying. Has built machines capable of destroying one thousand years
      of history and eventually, all of time and space. His mind is so vast that Saturn
      Girl, one of the greatest telepaths in the universe, struggled to read it even
      when he was knocked out. Despite his truly vast intellect, he has been shown
      numerous times to be an at-best Average fighter, ironically relying on raw strength
      and brute-force, which has allowed him to be dominated by much more skillful
      fighters such as General Zod and Lex Luthor). Nigh-Omniscient as the God Machine
