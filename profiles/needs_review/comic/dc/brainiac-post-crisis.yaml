power_scale:
  tier:
    text: '{{Varies}} from {{9-B}} to {{Low 1-C}} physically, {{Low 1-C}} via various
      mental powers. Higher via Statistics Amplification. Can ignore durability in
      a number of ways | {{5-A}} | At least {{5-A}}, {{Low 1-C}} within the Bio-Shell.
      Up to {{Low 2-C}} with Preparation | {{Unknown}}. {{5-A}} via Natural Weaponry
      and Energy Projection | {{Low 1-C}}'
    source_ids: &id002
    - mediawiki-1304231
    confidence: 0.8
  attack_potency:
    text: 'Varies via Possession, from Wall level as Milton Fine (Overpowered Brainiac
      5, who can harm him), to Low Complex Multiverse level (Has possessed Doomsday).
      Low Complex Multiverse level via numerous mental powers (Consistently harmed
      Superman, outright defeating him after reaching his peak.Action Comics Vol 1
      649 Defeated Orion and Lightray at onceAction Comics Vol 1 705). Higher with
      Statistics Amplification (Upon using Warworld, he inflicted more pain onto Lightray
      than Darkseid couldSuperman Vol 2 66) | Large Planet level (Has fought Superman)
      | At least Large Planet level (Traded blows with an enraged Superboy and Krypto
      the Superdog, a depowered General Zod,Superman: Last Stand of New Krypton Vol
      1 3 and Lex Luthor), Low Complex Multiverse level within the Bio-Shell (Fought
      with an enraged SupermanAction Comics Vo 1 870 and General Zod,Superman Vol
      1 699). Up to Universe level+ with Preparation (Created a series of black holes
      that were capable of destroying 1,000 years worth of history) | Unknown, Large
      Planet level via Natural Weaponry and Energy Projection (Their claws can cut
      Kryptonians,Adventure Comics Vol 2 9 harmed Mon-El with an energy blastSupergirl
      Vol 5 51) | Low Complex Multiverse level (Superior to Parallax, who was capable
      of replicating Zero-Hour.Convergence Vol 1 8 The convergence was breaking all
      of realityConvergence Vol 1 7)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ attack speed (Attacked Superman before he could react. Affected
