      who was weakened, although he later overpowered her.Dark Crisis: The Dark Army
      Can harm Superboy. While separated from her soul-self, shielded herself from
      her demonic soul''s energy, although it took her a lot of effort), higher with
      Soul Absorption and her Demonic Form (Defeated Trigon by absorbing the souls
      of her sister. Physically ripped out one of the Thing''s tentacles with her
      Demonic Form, which she wasn''t able to do before. Easily restrained and harmed
      Superboy.Titans United: Bloodpact #5 Harmed Donna Troy, and was only killed
      by the combining efforts of all Titans together) | At least Low Complex Multiverse
      level (Merged with Doctor HateTitans (2023) #15, who was considered an extinction
      level threat requiring the help of all the heroes on Earth to stopTitans (2023)
      #14, and got amped by the TitansTitans (2023) #15, thus becoming far stronger
      than before. Stomped and eventually killed a Rebirth TrigonTitans (2023) #15)
      | Outerverse level (Stated to have consumed multiple dimensions, planes as well
      as the most powerful pieces of the universe. Ravaged all of time and tide by
      consumed every thread of existence. Was implied to be able to bring an end to
      all things, which she even stated herself. Destroyed Skyland, New Genesis and
