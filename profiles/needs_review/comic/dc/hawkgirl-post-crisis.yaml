    - field: speed
      value: Relativistic+ combat speed and reactions (Scaling to 0.53c - Scales to
        many feats of characters reacting to, dodging and deflecting lantern beams
        (which move at the Speed of Light), such as keeping up with and parried attacks
        from a bloodlusted Wonder Woman, who moved this fast whilst deflecting Lantern
        Beams. Can keep pace with Hro Talak, who could react to and deflect Lantern
        Beams at close range after they were fired, as well as very consistently tag
        Shadow Thief, who could dodge lantern beams after they were fired. Speaking
        of her scaling to Wonder Woman's combat speed, the amazing Amazon was able
        to deflect both laser beams from Imperium Army Rifles as well as block Laser
        Beams from an Imperium army ship. Should be somewhat comparable in speed to
        Static, who reacted to and blocked a light-based laser after it was fired
        from close range. Swung her mace to deflect the beam from Mongul's planet-busting
        cannon as it came toward her, smacking it down - this beam would have traveled
        an interplanetary distance (to Draaga's planet) in what's strongly implied
        to be a somewhat short timeframe. Parried a bolt of lightning. Intercepted
        an ICBM in its terminal phase. Wove around machine gun fire while flying,
        and could also deflect it. Blocked two sword slashes from and landed a Mace
        Swing on Tsukuri, who could react to and slash at gunfire in midair. Possesses
        inhumanly quick reactions, according to Dwayne McDuffie. Has blitzed Killer
        Frost with attacks on two occasions, with Frost having quick enough reactions
        to react to and freeze fired arrows), with at least Hypersonic+ flight speed
        (At least Mach 20 - Caught up with an ICBM in its terminal phase. Flew to
        intercept an artillery shell. Overtook a WW2 fighter plane) - though it does
        not seem entirely consistent with the rest of her speed scaling, it should
        be noted that Hawkgirl was capable of moving around in a dimension that was
        beyond space and time, which could be interpreted as Immeasurable speed.
      source_id: character-stats-profiles-hawkgirl-post-crisis-dc-comics
      provider_id: character_stats_profiles
