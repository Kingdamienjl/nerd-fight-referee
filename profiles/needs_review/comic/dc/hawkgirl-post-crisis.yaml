    - field: powers_and_abilities
      value: "*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting\
        \ Strength, and Durability) *Flight (Can use her wings to fly at tremendous\
        \ speeds, and demonstrates great expertise in flight - such as weaving between\
        \ laser blasts from the Martian Killers, evading a pursuing spaceship, dancing\
        \ around WW2-era fighter planes, avoiding falling debris while flying out\
        \ of a collapsing cavern, etc. Dwayne McDuffie, one of JLU\u2019s head writers,\
        \ went as far as to call Hawkgirl a \u201Cworld-class aerial combatant\u201D\
        ) *Genius Intelligence (See Intelligence) *Superhuman Athleticism (Leapt to\
        \ the top of a small flight of stairs from a standing position) *Hand-to-Hand\
        \ Combat Mastery (Was one of the foremost warriors on Thanagar, a belligerent\
        \ world, with Dwayne McDuffie referring to Shayera as having undergone \u201C\
        the Thanagarian equivalent of Navy Seal training.\u201D Was able to hold her\
        \ own against the extremely skilled Wonder Woman despite a notable strength\
        \ gap by utilizing her combat expertise during \"Grudge Match.\" Beat up highly\
        \ trained Green Lanterns without using her mace. Countered blows from and\
        \ smacked away Tsukuri, a mercenary with presumable CQC training. Was able\
        \ to competently fight with her hands bound) *Weapon Mastery (with her Mace,\
        \ which she used with such great proficiency that she rose to a high rank\
        \ in Thanagar's military, and she was capable of holding her own in weapon\
        \ combat against Tsukuri, a swordswoman with great enough mastery that Aresia\
        \ specifically hired her as an enforcer and stopping a mace strike an inch\
        \ from someone's face. Her signature moves with her mace are throwing it for\
        \ a long-range attack and spinning it to block attacks) *Acrobatics (Did flips\
        \ to recover from attacks during \"Grudge Match\" as well as to recover from\
        \ a kick from Grodd during \"Secret Society\" and evade an explosion in \"\
        Hunter's Moon\") *Attack Reflection (Redirected Doctor Fate\u2019s beam with\
        \ her mace. Sent Mongul's cannon beam back into the cannon from which it came)\
        \ *Electricity Manipulation (Can electrocute foes as powerful as Doomsday\
        \ with her Mace, and its charge can be lowered so that it functions as a defibrillator.\
        \ Her Justice Lord counterpart's mace could absorb electricity into itself)\
        \ *Energy Projection (In later appearances, is shown firing beams of electricity\
        \ from her Mace) *Shockwave Creation (Her mace strikes create shockwaves with\
        \ their sheer impact) *Stealth Mastery (Snuck up on a mind-controlled Green\
        \ Lantern) *Vehicular Mastery (with a Javelin, and spaceships in general -\
        \ one of her most notable feats is casually out-dogfighting Kanjar Ro, an\
        \ experienced spacefarer, as well as avoiding Star Sapphire's energy beams)\
        \ *Limited Teleportation (Can request to be recalled to the JLU Watchtower)\
        \ *Negation of Intangibility (Her Mace's Nth Metal interferes with dimensional\
        \ shifting) *Negation of all Magic (Nth Metal, the material which makes up\
        \ her mace, naturally negates all magic, regardless of potency) *Indomitable\
        \ Will/Resistance to Mind Manipulation (Resisted Despero's mental powers with\
        \ no aftereffects during \"Hearts and Minds\", which with a similar amount\
        \ of exposure took control of Katma Tui, a Green Lantern. However, powerful\
        \ enough Mind Manipulation can take her over, such as the extremely potent\
        \ Heart of Darkness during \"Eclipsed\") *Resistance to Mind Reading (As a\
        \ Thanagarian Soldier, has a mental block in place that makes Martian Manhunter\
        \ incapable of reading her mind, at least not without pulling out all the\
        \ stops) *Resistance to Extreme Heat (Was unhurt by being caught in this fiery\
        \ explosion as well as this explosion. Being struck by flaming skeletons didn't\
        \ affect her)"
