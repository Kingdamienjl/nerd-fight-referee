    - field: durability
      value: Varies, at least Small Building Level (Upscaling from 0.095 Tons - Shayera's
        durability is almost comically inconsistent, as in some instances she can
        be hurt and staggered by the likes of Black Canary or being slammed into a
        wall, and other times she can take hits from the verse's herald-tiers like
        Wonder Woman and Giganta. Even at her lowest ends, though, her durability
        should scale here due to Newton's third law as well as feats such as tanking
        this explosion. Being sent through a stone wall by a Manhunter only annoyed
        her), at most Large Planet Level (Downscaling from 1.03 Ronnatons - At her
        most durable, she can take several strikes from a bloodlusted Wonder Woman,
        as well as a slap from Giganta, who is Diana's physical rival and has no incentive
        to hold back)
