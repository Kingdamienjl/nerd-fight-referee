    - field: weaknesses
      value: "Needs to breathe and eat. Note: Bruce Timm has stated that the original\
        \ DCAU tie-in comics are not canon, with the only tie in comics that have\
        \ statements to the contrary (other than Batman: The Adventures Continue,\
        \ which has so many continuity issues that it's essentially impossible to\
        \ argue it's canon) being Justice League Infinity, the Batman and Harley Quinn\
        \ tie in comics, and specifically the first annual of Batman Adventures. Ergo,\
        \ I only consider those three comics canon. Note 2: It's true that Nth metal\
        \ is said to have \u201Cenergy dampening properties\u201D during Starcrossed,\
        \ but in the DCAU the only energy it's shown to dampen is magic, with it never\
        \ being even remotely implied that it negates or weakens non-magical energy\
        \ it\u2019s hit, such as Lantern Beams, beams from Brainiac drones, and the\
        \ beam of Mongul's cannon - ergo, this feat should still scale to her swinging\
        \ strength due to how open to interpretation Nth metal is in the DCAU, as\
        \ \u201Cenergy dampening\u201D could, via Occam\u2019s razor, very likely\
        \ just be Paran Dul referring to how it interferes with Magical energy, something\
        \ the Thanagarians are aware of and have defenses against due to their history\
        \ with Icthultu, not a blanket statement that Nth metal dampens every form\
        \ of energy. Even more consistently, Nth Metal in the main DC continuity is\
        \ never noted to have any overall energy dampening, but specifically dampening\
        \ of magic and magic alone - with us being given very little reason to believe\
        \ that the DCAU would take such huge liberties in their adaptation of the\
        \ material. Category:Goulden1998 Category:Tier 5 Category:Tier 9"
      source_id: character-stats-profiles-hawkgirl-post-crisis-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
