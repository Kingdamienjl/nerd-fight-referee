        Knocked Copperhead out in a single punch, with Copperhead being strong enough
        to down Batman temporarily with a kick. Struggled evenly with Gorilla Grodd,
        who easily stomped Lex Luthor in a fistfight. Fought and knocked out gorillas
        with just her legs. Punched Arkkis Chummuck across a bar, sending him through
        a wall. Ragdolled a scavenger with a kick), possibly far higher (Staggered
        Wonder Woman with a kick), Large Planet Level with her Mace (Downscaling from
        1.03 Ronnatons - Redirected a beam that had the power to destroy a planet
        - see Note 2. Though certainly weaker than her teammates, with her mace she
        can still somewhat hold her own against enemies like a bloodlusted, mind-controlled
        Wonder Woman ("Grudge Match"), Star Sapphire ("Injustice for All"), Sinestro
        ("Secret Society"), a Lexo-suit wearing Lex Luthor ("Tabula Rasa"), Queen
        ("Wild Cards"), one of Lexiac's robots ("Divided We Fall"), etc. In addition,
        she could, despite not leaving any overt damage, cause Lobo a bit of pain
        with a mace strike to the top of his head, just barely divert attacks from
        Lexiac's tentacles and over the course of several attacks, manage to destroy
        one of them (these tentacles being capable of temporarily restraining a struggling
        Wonder Woman and Martian Manhunter), knock over (though not actually damage)
        Darkseid with a mace strike, divert a strike from Luthor's mech, which one-shot
        her and thus should scale to her durability - in summary, she's certainly
        weaker than her League teammates (other than Batman), but not to such a great
        extent that she wouldn't share the High 6-A to 5-B scaling that they have
        (that is to say, she isn't a hundred or a thousand times weaker than them),
        independent of her planet-busting-cannon feat. During their bar fight midway
        through "In Blackest Night," she's strongly implied to be at least somewhat
        comparable to fodder Green Lanterns such as Gallius Zed and Arkkis Chummuck,
        whom she was confident in taking on, even with their rings. One-shot a huge
        sea monster. Can smash Brainiac drones. Destroyed Imperium army ships with
        single attacks. Sent Grundy through a city street and into the sewer below.
        Tore through Vandal Savage's heavy gun. Her lower-ends (such as doing less
        damage to a robot than machine guns) are noted, but less consistent than higher
        ends and thus treated as outliers. See here for my reasoning as to why DCAU
        Superman is not Low Complex Multiversal), higher with Spinning Mace Throw
        (Upscaling from 1.03 Ronnatons - Her thrown mace, after she spun it, broke
        the Lexo-suit's outer armor despite the fact that her normal swings couldn't
        so much as dent the suit)
