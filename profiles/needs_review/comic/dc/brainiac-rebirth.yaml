    - field: powers_and_abilities
      value: "With his standard equipment, Superhuman Physical Characteristics (See\
        \ Attack Potency, Speed, Lifting Strength, and Durability), Genius Intelligence\
        \ (See Intelligence), Flight (His drones can fly freely, and his ship is capable\
        \ of MFTL+ flight), Immortality (Type 1. If even a slight bit of his programming\
        \ exists anywhere in the universe, he can and will return), Inorganic Physiology\
        \ (Type 2 - Is a computer program that animates itself through robotic drones),\
        \ Energy Projection (Fires energy beams through several means), Data Manipulation/Information\
        \ Manipulation/Information Analysis (Can implant himself into computers to\
        \ alter the data within them as well as to absorb information), Possession\
        \ (Possessed Gear), Preparation (Implanted his programming into Lex Luthor\u2019\
        s body in order to resurrect himself. Partnered with Darkseid to trap Superman\
        \ during \"Twilight.\" Made a false distress call to distract the Justice\
        \ League. Formulated a plan to use The Flash to incapacitate the rest of the\
        \ League during \"A League of Their Own.\" Made sure to disable Lex Luthor\u2019\
        s missiles during \"Stolen Memories.\" Sought out the Dark Heart drones in\
        \ order to increase his strength during \"Divided We Fall.\" Created an army\
        \ of drones to combat the Justice League and assimilate the entire universe,\
        \ as seen in \"Twilight.\" Controlled Bruce Wayne in order to escape the planet\
        \ during \"Knight Time\"), Hacking/Technopathy (Can overtake and overwhelm\
        \ any computer system. Overtook the computers within the Watchtower, Lexcorp's\
        \ computers, and Gear's backpack), Electricity Manipulation (Electrocuted\
        \ Superman), Biological Manipulation (Cured Luthor's cancer and increased\
        \ his physical strength, even as just a small fragment of himself existing\
        \ within Luthor's body), Forcefield Creation (Put a forcefield around his\
        \ ship and around Superman), Elasticity (Can extend his hands and fingers),\
        \ Paralysis Inducement (His ship in \"Twilight\" has a program that put a\
        \ powerful energy restraint around Superman) With Optional Equipment, Mind\
        \ Manipulation (with his thought-control disks and the Nanites that controlled\
        \ Batman in \"Knight Time\"), Telekinesis (Lifted Superman with his speeder),\
        \ Gravity Manipulation (with this gadget), Matter Manipulation (His beams\
        \ can digitize solid objects), Time Travel (The speeder he created in the\
        \ 30th century can open a portal to the year 2979), Portal Creation/BFR (The\
        \ body he built in the 30th century created a portal to the sun with the push\
        \ of a button), Paralysis Inducement (In his \"Stolen Memories\" ship, used\
        \ a restraint that temporarily held Superman in place)"
      source_id: character-stats-profiles-brainiac-rebirth-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Large Planet Level with his drones and strongest weaponry (Varies between
        at least 1.03 Ronnatons to at least 8.29 Ronnatons - Even his lesser bodies
        fire energy beams that can knock out Hawkgirl in a single hit and send The
        Flash flying across a room. One of his stronger bodies stopped a strike from
        Superman, though it's most probable that Superman wasn't using full strength.
        While inside Lex Luthor's body, he contended with the whole Justice League
        simultaneously, firing energy beams that took out several members. Used a
        beam that sent Superman flying. Some of his robots could temporarily hold
        off Superman. Even just a bunch of scrap metal from his bodies served to make
        someone as powerful as Darkseid slightly more powerful. At some point, one
        of his weapons broke Kalibak's arm. Made an explosion visible from space.
        His prerogative is to destroy planets, and he has done this several times
        over the years. See here for my reasoning as to why DCAU Superman is not Low
        Complex Multiversal)
      source_id: character-stats-profiles-brainiac-rebirth-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: His fastest weaponry and bodies are at least FTL (Scaling to 2.3c - Reacted
        to/tagged a furious Superman and, while in Lex Luthor's body, many members
        of the Justice League), with his ship being capable of Massively FTL+ flight
        speed (131,756c - In only about thirty years since Krypton's destruction,
        he has "roamed the universe")
      source_id: character-stats-profiles-brainiac-rebirth-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Varies wildly (See Note), but his strongest bodies can take hits from
        a furious Superman (Large Planet Level), and one of his lesser bodies can
        remain intact after a swing from a bloodlusted Hawkgirl, which should come
        out to about Small Planet Level durability - at least equal, likely higher
        with Force Fields (Put a force field around his ship that even a furious Superman
        struggled to pry apart. Set up a force field around Superman that didn't even
        budge after attacks from Martian Manhunter and Hawkgirl)
      source_id: character-stats-profiles-brainiac-rebirth-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Electricity shorts out his thought-control disks, whereas others are
        easily torn apart by Hawkgirl and even pierced by Batarangs - in one especially
        embarrassing instance, one of his bodies was pierced by shotgun bullets. Note
        2: Bruce Timm has stated that the original DCAU tie-in comics are not canon,
        with the only tie in comics that have statements to the contrary (other than
        Batman: The Adventures Continue, which has so many continuity issues that
        it''s essentially impossible to argue it''s canon) being Justice League Infinity,
        the Batman and Harley Quinn tie in comics, and specifically the first annual
        of Batman Adventures. Ergo'
      source_id: character-stats-profiles-brainiac-rebirth-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
