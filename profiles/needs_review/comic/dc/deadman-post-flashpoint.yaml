- id: claim-powers-and-abilities-6b3e985a
  section: abilities
  axis: hax
  text: 'Superhuman Speed & Durability, Social Influencing (Managed to outsmart the
    goddess Rama Kushna in a philosophical debate and convince her to renounce her
    control over himDC Universe Presents Vol 1 5), Martial Arts and Weapon Mastery
    (Has shown the ability to defeat groups of enemies with only a sword or "his"
    bare hands.Deadman Vol 5 1Justice League Dark Vol 1 Annual 1 Shot an assassin''s
    guns four times without missing once. Could accurately analyze the wounds he inflicted
    to an enemy mid-fightDeadman Vol 5 2), Possession (Can possess peopleJustice League
    Dark Vol 1 2, and even slip past eventual defenses meant to prevent thisJustice
    League Dark Vol 1 13, as well as dive into quasi-sentient objects such as the
    House of Mystery.Justice League Dark Vol 1 21 With Brahma Dass'' support, he managed
    to affect the collective mind of Pantheon, a fusion of 10.000 gods.Justice League
    Dark Vol 1 34 Temporarily possessed the House of Wonders, a fusion of the House
    of Mystery and the House of Secrets.Justice League Dark Vol 1 Annual 2 Can partially
    control John Constantine, who previously was immune to Deadman''s abilities.Constantine:
    The Hellblazer Vol 1 11 Can possess animals too.Young Monsters in Love He can
    also simply enter beings without possessing themThe Phantom Stranger Vol 4 6),
    Durability Negation (Seemingly able to tear people apart from the inside while
    he''s possessing themJustice League Dark Vol 1 4), Extrasensory Perception (Possessing
    someone lets Deadman see within them, which he has used to search for other beings
    possessing them or simply comb through their memories.The Flash Vol 4 28 He can
    also sense the status of their spirit without doing that.Justice League Dark Vol
    1 18 Sensible to mystical eventsJustice League Dark Vol 1 23), Acrobatics (Used
    to be a circus performer and can pull off incredible showings of acrobatic skill
    even right as he possesses someoneJustice League Dark Vol 1 3, using this ability
    to avoid attacks from multiple enemiesJustice League Dark Vol 1 11), Intangibility
    (Is intangible), Flight (Can hover, even with such precision that he can make
    it look like he''s riding a car while he is in reality moving along with it),
    Dimensional Travel (After being forcefully sent to the land of the dead, Deadman
    managed to return, although the experience was very taxing for him.Justice League
    Dark Vol 1 12 Could reach Wonder Woman when she went to Valhalla, and move across
    other realms of the Sphere of the GodsWonder Woman Vol 1 772Wonder Woman Vol 1
    774), Regeneration (Low-Mid: After being torn apart by an ectoplasmic cage, Deadman
    healed in the span of what must have been at most a couple hoursJustice League
    Dark Vol 1 17), Teleportation (Shown hereJustice League Dark Vol 1 30), Immortality
    (Type 1, 2 and 7: As a spirit, Deadman cannot age, and while his appearance is
    just a reflection of his mind, it is able to withstand damage that would kill
    a normal beingJustice League Dark Vol 1 33), Body Control and Duplication (As
    Deadman''s "body" is really just a reflection of his own imagination, he can believe
    himself to be any shape, and even turn himself into an army of DeadmenJustice
    League Dark Vol 1 39), Mind Manipulation (Can mind control people without possessing
    them), Darkness Manipulation and Sleep Manipulation (Caused everyone in an airplane
    to fall asleep as darkness invaded it), Immersion (Can appear in mirrors and paintingsSecrets
    of Sinister House Vol 2 1), Statistics Amplification (Deadman makes those he possesses
    stronger), Invisibility (Can be invisible when he wishes to beWonder Woman Vol
    5 56, and even do that while simultaneously allow others to see himThe Flash Vol
    4 29), Non-Physical Interaction (Could physically carry Dr. Psycho''s psycheWonder
    Woman Vol 1 773), Self-Sustenance (Likely all types. Boston doesn''t need to rest,
