      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Small Building Level (Downscaling from 0.095 Tons - Should scale to his
        AP as per Newton's Third Law. Got up immediately, only being scuffed from
        dirt, after being a few meters away from the explosion of his and Speedy's
        quantum arrows - however, exactly how much force he took in this instance
