    - field: durability
      value: 'Small Building Level in both keys, since he shouldn''t be any less durable
        in his second key (Scaling to 0.095 Tons - Has taken many hits from Batman
        and his allies. Was only annoyed by slamming into a large wooden table hard
        enough to split it in two. Likewise, Almost Got ''Im shows him being essentially
        unhurt by slamming into a table hard enough to split it in half. Was not notably
        hurt by the bazooka he was holding blowing up in his face. Should be no less
        durable than Amanda Waller, who was essentially uninjured by this explosion.
        Was shaken up, though not seriously injured, after this explosion. Remained
        conscious (though not in fighting condition) after this impact. Should be
        more durable than a 13-year-old Tim Drake, who could shake off a hit from
        an incomplete Clayface: this same incomplete Clayface''s kicks could shatter
        a stone bench)'
      source_id: character-stats-profiles-joker-dc-comics-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The Joker is extremely vain, and will lose his composure if insulted
        - this allowed Terry McGinnis to defeat him. Otherwise, normal human weaknesses.
        Note: Bruce Timm has stated that the original DCAU tie-in comics are not canon,
        with the only tie in comics that have statements to the contrary (other than
        Batman: The Adventures Continue, which has so many continuity issues that
        it''s essentially impossible to argue it''s canon) being Justice League Infinity,
        the Batman and Harley Quinn tie in comics, and specifically the first annual
        of Batman Adventures. Ergo, I only consider those three comics canon. Category:Goulden1998
        Category:Tier 8 Category:Tier 9'
