        \ to instantly incapacitate Solomon Grundy) Given preparation time, The Joker\
        \ can utilize: *Flight (Can access a small plane and a jetpack) *Situational\
        \ Durability Negation and Statistics Reduction (Can come into possession of\
        \ Kryptonite (as seen in STAS' \"World's Finest\"), which has these effects\
        \ on Kryptonians such as Superman) *Mind Manipulation (In BTAS' \"Make 'Em\
