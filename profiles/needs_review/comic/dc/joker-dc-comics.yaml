    - field: attack_potency
      value: Small Building Level physically (Scaling to 0.095 Tons - Though not nearly
        as skilled, the Joker has consistently demonstrated relativity to and harmed
        Batman several times, even drawing blood. Slapped Harley Quinn hard enough
        to knock her out - Harley has taken attacks from Nightwing and Batgirl, and
        fought evenly with Poison Ivy, whose kicks could split a wooden table. Fought
        and temporarily overwhelmed The Phantasm, who could stagger Batman. Should
        not be weaker than The Penguin's henchwomen, who kicked Batwoman through a
        stone wall, making a large crater. Should not be weaker than Dan Turpin, who
        knocked out a Parademon with one punch - this same Parademon was shown to
        be totally unhurt by landing on a car with enough force to total it. Kicked
        a metal truck door off its hinges), higher piercing damage with his Knife
        (Stabbed Batman), Large Building Level to City Block Level with brief Prep
        Time (The Joker often demonstrates the capacity to quickly build very potent
        explosives, as shown in these examples. Built a bomb that was this powerful
        during Wild Cards, and during World's Finest built a bomb that produced a
        massive explosion, blasting a hole in the hull of a ship), up to at least
        City Level with substantial Prep Time (Filled twenty miles of tunnels with
        high explosives. In Harlequinade, he came into possession of an atomic bomb
        that could "turn Gotham into the world's biggest pothole") - can ignore durability
        with Laughing Gas and Knockout Gas | Small Building Level physically (Scaling
        to 0.095 Tons - Is twice stated to be "deadlier" than his original body. Fought
        a suited Batman II and "beat the stuffing out of him", making him go limp
        with his first punch combo and being overtly too strong for Terry to defeat
        hand-to-hand (as made clear by Return of the Joker's screenplay) to the point
        that he needed to resort to fighting dirty and taking advantage of the Joker's
        vanity in order to make any headway in their fight), and Small Town Level
        with Preparation (Commandeered a satellite - this satellite's laser blasts
        could vaporize a cruise ship in one shot)
      source_id: character-stats-profiles-joker-dc-comics-dc
