      value: 'Tier: 9-A physically, Low 7-C via Weapons Name: Adrian Chase Nicknames:
        Vigilante (Hero), DCEU Vigilante (Out of Universe) Origin: DC Extended Universe
        later incorporated into the DC Multiverse Gender/Sex: Male (He/Him/His) Kill
        Count: At Least 10 Age: 29 (August to October 2020; Born June 1991) Height:
        180.3 cm Weight: 78 kg Classification: Human, Mass Serial Murderer, Anti-Hero,
        Superhuman Physical Characteristics, Martial Arts (Beat down a thug with little
        to no effort. Chase is a highly skilled and formidable hand-to-hand combatant
        and martial artist. He is able to fight the master martial artist, Judomaster
        alongside Peacemaker, even managing to outlast Peacemaker before he was defeated
        by the more skilled foe.), Pressure Point Strikes, Acrobatics and Agility,
        Weapon & Armour Mastery, Stealth Mastery (Tracked down and followed Task Force
        X without being noticed.), Preparation (Always equipped with weapons and his
        suit. Found Task Force X with no info.), Natural Weaponry (Fist, Feet, Teeth,
        and Nails), Social Influence, Reputation, Fear Inducing, & Respect, Known
        as a hero. Likely gained respect or fear from other prisoners after beating
        one up., Vehicular Mastery Attack Potency: Small Building Level physically
        (Comparable but inferior to Peacemaker. Can fight White Dragon, who charged
        a blast to destroy part of a van (40.423 MJ), White Dragon could have killed
        him (0.022-0.0838 Tons). Can fight possessed humans who survive shockwaves
        ([https://vsbattles.fandom.com/wiki/User_blog:Spinosaurus75DinosaurFan/Peacemaker_Sonic_Boom
        13,957.2 J]) no problem ([https://character-stats-and-profiles.fandom.com/wiki/User_blog:XxAngel_EditzxX/Feat_Scaling#To_tank_something
        35.65-136.75 KJ]). Possibly comparable to his CW counterpart who can fight
        Green Arrow.), Small Town Level via Weapons (Owns an assortment of guns. Has
        access to a chainsaw. His guns should be comparable to Peacemakers and Harley''s
        Javelin which was used to kill Starro (2.467 Kilotons).) Destructive Capacity:
        Street Level (Can fight regular people.) Physical Strength: Small Building
        Level Striking Strength: Small Building Level (Knocked a man down in a few
        hits.) Travel Speed: Peak Human to Peak Human+ (Can keep up with Peacemaker
        who is faster than most people and likely comparable to a gorilla ([https://a-z-animals.com/animals/western-gorilla/
        11.176 m/s]).) Combat/Reaction/Perception Speed: Peak Human+ (Can attack faster
        than most can react, comparable to Peacemaker and Judomaster), Superhuman
        via Chainsaw (Min 16 m/s), Subsonic to Supersonic via Weapons (100 to 740
        m/s). Hypersonic+ via Grenade Explosion ([https://vsbattles.fandom.com/wiki/MK2_Grenade
        6900 m/s]) Lifting Strength: Class 10+ (Can hold his weight. Can restrain
        people down, can push back White Dragon who ripped a roof of a van off ([https://character-stats-and-profiles.fandom.com/wiki/User_blog:XxAngel_EditzxX/Show_Feats_Scaling#Racist_hates_white_van_(S1_E7)
        7702.14 kg]). Could be comparable to Peacemaker, who wrestled a gorilla who
        can rip off limbs ([https://character-stats-and-profiles.fandom.com/wiki/User_blog:XxAngel_EditzxX/Feat_Scaling#Cutting_an_Arm/Leg
        1019.72 to 8667.59 kgf]).) Durability: Small Building Level (Can survive attacks
        from White Dragon who was trying to kill him. Survived a dangerous van crashing
        which is higher than this (Likely [https://vsbattles.fandom.com/wiki/References_for_Common_Feats#Destroying_a_Car
        50 MJ]). Survived getting a toe cut off.) Stamina: Peak Human [https://fictional-indexing.fandom.com/wiki/Endurance
        Endurance]: Superhuman (Right after a van crash he went to attack and wasn''t
        tired at the end. Can fight multiple thugs at the same time. Can walk around
        with a toe gut off.) Range: Standard Melee Range to Standard Melee Range+
        (Arm is 38.65% of height; 69.7 cm. Leg is 52.15% of height; 94.03 cm), Extended
        Melee Range via Chainsaw, Suit, Knife, Sword, Walther P99, FN P90, Optional
        Equipment: Chainsaw, Colt Single Action Army, Mossberg 500 Cruiser, MasterPiece
        Arms MPA30DMG, Walther PPQ Q5 Match, Dynamite, Grenade Intelligence: Gifted
        (Is a skilled fighter in both armed and unarmed combat. Killed three targets
        in quick succession with a sniper rifle. Purposefully got himself arrested
        to kill Auggie Smith inside the prison and goaded his followers to strike
        first, so it would look like self-defence to passive onlookers, going on to
        stomp said followers in hand-to-hand combat. Deduced the weakspots in White
        Dragon''s armor upon seeing it the first time. Avoided detection from a black-ops
        group.) Weaknesses: Standard Human Limits, Emotions, & Eyesight.'
