    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting\
        \ Strength, and Durability), Superhuman Athleticism (Performed a superhuman\
        \ leap into the air to tackle Superman), Weapon Mastery/Combat Mastery (Is\
        \ so proficient with using his staff in combat that he could defeat the extremely\
        \ skilled Wonder Woman), Portal Creation (with his Mother Box, which creates\
        \ boom tubes), Absorption and Limited Empathic Manipulation (His Mother Box\
        \ should have similar functions to Orion's), Longevity, if not Type 1 Immortality\
        \ (As a new god, his physiology should be the same as Big Barda\u2019s, which\
        \ allowed her to not age a day between JLU and Batman Beyond - however, he\u2019\
        s implied to be extremely old, as the fourth world characters usually are\
        \ in adaptations), Limited Sound Manipulation (Roared so loud it shattered\
        \ nearby glassware), Resistance to Extreme Heat (No-sold the fiery explosion\
        \ of one of the Batwing's missiles)"
      source_id: character-stats-profiles-kalibak-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Brown Dwarf Level (Downscaling from 1.002 Quettatons - See Note as to\
        \ why he isn't listed as scaling to Superman. Is a prominent New God, and\
        \ proved deserving of this title by ragdolling Wonder Woman on two occasions,\
        \ knocking her out in the second clip and knocking her into a skyscraper with\
        \ enough force to bring it tumbling down. Big Barda believed that Kalibak's\
        \ fight with Granny Goodness could \u201Ctake the whole planet with them.\u201D\
        \ See here for my reasoning as to why DCAU Superman is not Low Complex Multiversal)"
      source_id: character-stats-profiles-kalibak-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ reactions and combat speed (Scaling to 0.53c - Attacked
        Wonder Woman before she could react, and fought her evenly during "Hereafter."
        Smacked Batman's thrown Batarangs out of the air with ease)
      source_id: character-stats-profiles-kalibak-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Brown Dwarf Level (Downscaling from 1.002 Quettatons - Should be capable
        of withstanding his own physical power. Recovered from an attack from Lobo)
      source_id: character-stats-profiles-kalibak-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Very slow-witted and overconfident. Weak to electricity, \u201D where\
        \ he put up a decent fight against him, appearing to struggle evenly with\
        \ the Man of Steel. Even putting aside the fact that the fight ends with Superman\
        \ appearing to get serious (as in, tap into more of his full strength) and\
        \ utterly steamrolling Kalibak, there\u2019s ample feats and scaling that\
        \ demonstrate that Superman is consistently far more powerful than Kalibak,\
        \ every single other encounter between Kalibak and Superman ends with Kalibak\
        \ getting stomped - \u201CApokolips Now\u201D shows a fatigued, beat-to-hell\
        \ Superman knocking Kalibak out with one punch, \u201CLegacy\u201D shows Superman\
        \ three-shotting Kalibak, once more, Lobo - who as explained in his page does\
        \ not scale to Superman\u2019s full strength - utterly stomped Kalibak during\
        \ \u201CHereafter\u201D without breaking a sweat. Thirdly, considers Kalibak\
        \ a weak disappointment. Note 2: Bruce Timm has stated that the original DCAU\
        \ tie-in comics are not canon, with the only tie in comics that have statements\
        \ to the contrary (other than Batman: The Adventures Continue, which has so\
        \ many continuity issues that it's essentially impossible to argue it's canon)\
        \ being Justice League Infinity, the Batman and Harley Quinn tie in comics,\
        \ and specifically the first annual of Batman Adventures. Ergo"
      source_id: character-stats-profiles-kalibak-dc-comics
      provider_id: character_stats_profiles
      authority: high
