- id: claim-powers-and-abilities-4e0deed8
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Flight * Self-Sustenance (Type 1,
    as shown hereJLA Vol 1 75) * Shapeshifting (Martians can alter their form all
    the way down to the molecular level and take any shape they wantJLA Vol 1 4) **
    Density Manipulation (Martians can easily control their density and mass, which
    can be used for a variety of tasks such as phasing or growing in strength) **
    Elasticity (Martian''s elasticity is comparable Plastic Man''sMartian Manhunter
    Vol 2 9) ** Size Manipulation, up to Large Size Type 1 (J''onn can grow in size,
    becoming as tall as the kaiju he read about. His ancestor, while deathly weak,
    easily grew to the size of the Sphinx. In the possible future of DC One Million,
    J''onn would reach Large Size Type 4, as The Source allowed him to become Mars
    itself.Martian Manhunter Vol 2 1000000), ** Additional Limbs, Bodily Weaponry
    and Hair Manipulation (Martians can grow additional limbs, hair, teeth, and bodily
    weapons such as tentacles, horns, fangs, etc. Many of his transformations include
    powerful tails, fangs,Martian Manhunter Vol 22 blades, and other natural weapons)
    ** Cloth Manipulation and Plant Manipulation (Martian attire is often an extension
    of their body, created by Zo''ok Plants, which they can freely manipulate. Has
    demonstrated the ability to control his cape as if it were any other part of his
    body.Martian Manhunter Vol 2 27) * Telepathy (J''onn was described as being "immeasurable"
    in his telepathic powers. Scanned the minds of every living person on Earth.Martian
    Manhunter Vol 2 4 J''onn can even use his powers on those without mindsMartian
    Manhunter Vol 2 18) ** Perception Manipulation and Dream Manipulation (Via Mayavana,
    J''onn can create a reality or dream in someone''s mind that is as real as the
    real world, if not more real, however, the ability can only be used once.Justice
    League America Vol 1 40 Can alter others'' perception, such as making them witness
    memories.) ** Self-Perception Manipulation (Can dampen his own ESP powers.) **
    Hive Mind (Type 2; prior to Hronmeer''s Curse, all Martians were connected by
    the ''Great Voice'', a massive network of telepathic communicationMartian Manhunter
    Vol 2 0) ** Power Nullification (Martians can bypass ones mental resistances and
    remove their mind, telepathy, hive mind, ESP, and other mental-related powers)
    ** Memory Manipulation (Martians can remove memories, even of other Martians.
    His race can pass down memories.Martian Manhunter Vol 2 21 Restored the memories
    of Justice League zombiesMartian Manhunter Vol 2 12) ** Astral Projection, Negation,
    Sealing, and Energy Manipulation ([Manipulated Bette Noir''s true form, a mind
    vampire of pure psionic energy, and sealed her to her physical body.Martian Manhunter
    Vol 2 3) ** Information Analysis (Can analyze structures on a molecular levelJLA
    Vol 1 84) ** Soul Manipulation (Could interact with the soul of his ancestor.
    The spiritual battle between J''onn and Fernus lit the Soul Realm entirely on
    fire.JLA Vol 1 88) ** Non-Physical Interaction and Sealing (Could manipulate Bette
    Noir''s astral form, which was "pure psionic energy" and forcefully sealed her
    into her physical form.. His body interacted with the minds of everyone.. His
    otherself, Fernus, sealed away his soul.) ** Mind Negation Nullification (Restored
    Malefic''s telepathy) ** Mind Manipulation (Martians have the ability to rip out
    other minds, which can also be done on humans.Martian Manhunter Vol 2 3 They also
    have the strength to bypass innate mental resistancesMartian Manhunter Vol 2 7)
    * Statistics Amplification (When driven crazy, he enormous muscles.Martian Manhunter
    Vol 2 24) * Supernatural Willpower (Through his willpower, J''onn resisted the
    effects of Hronmeer''s Curse, the plague that wiped out his species.) * Martial
    Arts and Weapon Mastery (J''onn is an highly adept combatant who, given his thousands
    of years as a crime-fighter, has often been pitted as a combat instructor who
    has taught both members of the the Justice League and Justice Society how to fight.JLA
    80-Page Giant Vol 1 1 Even before his career as a superhero, J''onn was a Manhunter
    who was trained in hand-to-hand combatMartian Manhunter Vol 2 33 and weapon use
    by the "Masters of Mars." With these skills, J''onn took down an entire group
    of Parademons and matched Apokolipean Gladiators in combat.Martian Manhunter Vol
    2 34 J''onn has even bested KantoMartian Manhunter Vol 2 19 in sword fights. On
    Earth, he has further trained with expert fighters such as Wonder Woman, Superman,
    Flash, and Green Arrow. A quick learner, J''onn has learned techniques from shonen
    manga he reads in his spare time.Martian Manhunter Vol 2 2) * Fusionism (Martian
    sex involves both parties temporarily fusing. Martian''s can also fuse with inanimate
    objects, such as the Great Sphinx.Martian Manhunter Vol 2 25) * Absorption, Body
