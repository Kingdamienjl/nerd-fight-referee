- id: claim-weaknesses-f9123eaa
  section: weaknesses
  axis: weakness
  text: 'Martians have a fear of fire. Feats: *Scanned the minds of everyone on Earth.
    *Looked through the minds of everyone on Earth again. *Can read minds on a galactic
    range. *Turned the Joker sane temporarily. *Resisted Starro''s mind control and
    shrunk to the size of a blood cell. *Caused Stinton to hallucinate. *Mindwiped
    the entire Justice League at once. *Linked several Lantern minds together to insert
    a memory and erased himself from their minds. *Even while in a coma, was able
    to mind-control John Stewart. *Resisted the mind-control of the En''Tarians when
    every other JLA member failed. *Nine extremely amplified White Martians couldn''t
    break through J''onns telepathic defenses. They were amplified a "millionfold",
    i.e, a million times stronger than normal, but J''onn could still resist them.
    Notable Attacks/Techniques: *Telepathy: Arguably J''onn''s greatest power, his
    telepathy can easily shut down minds, alter memories, read the entire contents
    of a person''s mind, read and affect minds on a planetary scale, communicate across
    vast stretches of space and dimensions, manipulate souls, and affect cosmic beings.
    *Shapeshifting: J''onn has free transformation, he can change his size at will,
    stretch his appendages, increase or decrease his mass (although sometimes this
    requires absorbing nearby inert mass, like that of the ground of a planet), disguise
    himself as a human or other being, or an inanimate object, manipulate his body
    for more effective attacks (such as increasing the size of his lungs for more
    powerful breath attacks) *Martian Vision: J''onn is capable of projecting destructive
    beams of energy from his eyes, these generally aren''t as powerful as Superman''s
    heat vision, but they can do formidable damage and are very accurate. They can
    also be used passively to scan targets with sensory powers. *Linear Vision: An
    obscure ability that allows J''onn to resist time manipulation and reality warping
    to an extent, and also protect his allies from it. However, it requires a great
    amount of concentration and energy and he can only keep it up for so long. Note:
    Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive:
