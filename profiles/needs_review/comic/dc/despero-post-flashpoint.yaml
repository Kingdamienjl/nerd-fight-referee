      value: Superhuman Physical Characteristics (See Striking Strength, Speed, Lifting
        Strength, and Durability), Flight (Can freely fly using Py'tar energies as
        well as levitate), Aura (Surrounds himself in an almost skintight aura of
        Py'tar flame), Mind Manipulation (Uses the mental powers provided by Py'tar
        energies to break the wills of people and bend them to his whims - his mental
        powers could even shatter Green Lantern's will, so much so that he couldn't
        use his ring for a time, as well as control the wills of whole world populations
        and "entrance virtually anyone"), Telepathy (Noted to be a "master telepath"),
        Energy Manipulation and Statistics Amplification (Channels Py'tar energies
        in his body to give himself fantastic strength and speed), Combat Expertise
        (Contended for a decently long while with Green Lantern, who is not only roughly
        equal in power to himself, but also extremely skilled and experienced, as
        well as possessing a substantially more versatile powerset - demonstrating
        a good deal of mastery at using his powers in a combat setting), Energy Projection
        (Can fire beams of powerful Py'tar plasma from his third eye), Plasma Manipulation
        (Channels the flame of Py'tar, which is pure nuclear plasma), Illusion Creation
        (According to Cartoon Network, can project powerful illusions), Limited, Situational
        Power Bestowal (If right next to the flame of Py'tar, he can channel it in
        such a way that it provides his minions with powers similar to his) Whether
        or not Despero has any measure of Social Influencing is impossible to tell,
        as even though he appears to be a very influential and charismatic leader,
        Katma Tui seems to imply that his followers obey him because he used mental
        powers on them rather than because of his sheer charisma.
      source_id: character-stats-profiles-despero-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Brown Dwarf Level (Scaling to 1.002 Quettatons - Fought Green Lantern,
        overpowering him in a beam struggle, repeatedly clashing evenly with him whilst
        he was enraged, and harming him through his barrier. Should be at least equal
        to other Kalanorians who channel the flame of Py'tar, who can cover entire
        planets in pure nuclear plasma almost instantly. Sliced down a huge stone
        pillar in hopes of killing Hawkgirl), far lower when suppressed (As with many
        characters in the DCAU, Despero can lower the power of his attacks - such
        as when he made his beam strong enough to only knock back a depowered GL,
        because he wanted him alive so his life force could be sacrificed to the flame
        of Py'tar)
      source_id: character-stats-profiles-despero-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ combat speed and reactions (Scaling to 0.53c - Kept up
        with a battle-ready Green Lantern, landing blows on him and clashing with
        him exactly), with Massively Hypersonic flight speed in an atmosphere (Scaling
        to Mach 106 - Was shown to be competitive with GL's flight during their battle),
        and likely Speed of Light or far higher flight speed in space (Should compare
        to other wielders of Py'tar, who he intended to spread Py'tar "across the
        galaxy" in an indeterminate amount of time - it's hard to expect how long
        he thought this would take, as we have no idea if he intended to be alive
        to see it nor how old Kalanorians usually live to be, but saying it's probably
        at least 1c seems reasonable)
      source_id: character-stats-profiles-despero-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
