        Shadow of the Bat #88) *Skilled Hand-to-Hand Combatant (Said to be a fierce
        hand-to-hand combatantWho''s Who: The Definitive Directory of the DC Universe
        #5, was able to outmatch Robin in a fight) *Skilled Knife User (Has shown
        skill with a knife to be able to make it stand on his fingertips without supportDetective
        Comics Vol 1 #607 as well as implied to be a good knife throwerSecret Origins
        Vol 2 #44) *Social Influencing (Self-proclaimed as one of the greatest actors
        of our time and able to play the roles of almost anyone, Was able to trick
        Wonder Woman and Donna Troy when disguised as Superman and CheetahWonder Woman
        Vol 2 #161Wonder Woman Vol 2 #160 as well as many others in his other disguises,
        Manipulated Clayface IV into doing his bidding when he was part of the Mudpack),
        *Regeneration (At least High-Mid; Has quickly reconstituted his body from
        being sliced in halfTitans Vol 2 #29 and being blown upBatman Confidential
        #21, Likely Mid-High overtime; Was able to come back offscreen from having
        his whole body be eaten by Poison Ivy''s plants) *Body Control, Elasticity
        & Shapeshifting (Able to morph or shift his body in about any way possible)
        *Weapon Creation (Has shown to be able to create weapons from nets and hooks
        to hammers and chainsawsTitans Vol 2 #30) *Density Manipulation & Elemental
        Intangibility (Can control his density to make attacks pass through him or
        become extremely hard) *Size Manipulation (Able to grow in size to Type 0
        normally at a moments notice and shrink to Type 1, up to Type 1 by absorbing
        people into himself) *Duplication (Able to make a bunch of decoy people out
        of himself each able to act on their own and with different personalitiesJoker''s
        Asylum II: Clayface) *Limited Earth Manipulation (Due to being mostly made
        out of clay) *Stealth Mastery & Camouflage (Able to disguise himself as parts
        of the ground to sneak on the Riddler and Mary MarvelCountdown #42) *Statistics
        Amplification, Power Mimicry & Absorption (Due being partial made of smectites,
        he can absorb properties at a greater rate than any other clay group, which
        was shown when he absorbed other clay types into his body, the power of deep
