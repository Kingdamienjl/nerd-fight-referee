    - field: standard_equipment
      value: '*Bracelets of Submission: Wonder Woman''s indestructible bracelets that
        were forged from the remnants of the Aegis Shield wielded by Zeus. They can
        harmlessly deflect virtually any projectile or attack, even defending against
        the mighty Omega Beams of Darkseid. When crossed, Wonder Woman can create
        a hemispherical barrier positioned in front of her to defend against attacks
        that she would not be able to deflect, such as large explosions. In addition,
        Diana can channel Zeus'' lightning through them to strike her foes by striking
        the bracelets together. *Lasso of Truth: Diana''s most famous and iconic weapon,
        it is a magical lasso forged and blessed by the gods. to be completely indestructible
        even to entities as powerful as Superman. In addition, Hestia blessed it with
        the fires of her hearth so that all caught in its clutches will be forced
        to tell the truth, no matter how much they resist questioning. The Lasso has
        also been known to be able to restore the memories of others, hypnotize others,
        dispel illusions, and offer a measure of protection against magical attacks
        for those within its radius. The lasso seems to be able to alter its length
        according to Diana''s wishes and she can also use it as a whip if necessary.
        *Tiara of Athena: A crown given to the Amazons by the goddess of wisdom, it
        enhances Diana''s senses and strengthens her mind against mental attacks.
        In addition, it can be used as a boomerang-like projectile sharp enough to
        slice the throat of Superman and temporarily incapacitate him.'
      source_id: vsbattles-clayface-rebirth
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Genius (Blessed by the goddess Athena to be skilled in every discipline,
        Diana is the finest warrior the Amazons have ever produced, being trained
        in the use of every weapon known to man as well as all of the exotic combat
        styles known to the Amazons. She has proven herself time and again to be among
        the greatest hand-to-hand combatants in the world, frequently outmatching
        the few beings that exceed her in might through sheer skill, having bested
        immortals in battle and can take on multiple members of the Justice League
        at once. She is also gifted with incredible insight and empathy, allowing
        her to understand her opponents and their movements as well as their intentions
        with ease. Her blessings have also granted her a natural gift for leadership,
        diplomacy, and strategy, being the ambassador of Themiscyra and frequently
        matching wits with that of Batman and other intellectuals of the DC Universe,
        possessing a particularly profound knowledge of the occult and mythology.)
      source_id: vsbattles-clayface-rebirth
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Wonder Woman is weak to sharp objects such as spears, swords, bullets,
