        with his Deadly Touch able to dissolve people into protoplasm by secreting
        a unique enzyme with a touch, also able to corrode through inorganic material
        such as dirt and stone as wellDetective Comics Vol 1 Annual #2) Resistance
        to *Earth Manipulation (Able to be immune to Geo-Force''s geokinesis due to
        being a force of nature unto himself) Same Powers and Resistances as Matt
        Hagen, Preston Payne and Sondra Fuller due to having their blood extracts
        injected into himBatman Vol 1 #550 |-|Post-Cataclysm= Same powers as before
        *Electricity Manipulation (Due to absorbing the properties of deep quartz
        has gained to power of piezoelectricity which allows him the ability to electrocute
        peopleDetective Comics Vol 1 #735) *Heat Manipulation (Can send enough heat
        into the ground to fuse rubble together) *Fire Manipulation (Able to shoot
        out blasts of fire that can harm Batman as well as ignite his whole body with
