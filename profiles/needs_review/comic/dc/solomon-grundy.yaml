    Users Category:Suicide Squad Members Category:Secret Society Members Category:Zombies
    Category:Evil Characters Category:Supervillains Category:Absorption Users Category:Revived
    Characters Category:Monsters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
