- id: claim-weaknesses-63e3eafe
  section: weaknesses
  axis: weakness
  text: 'Solomon Grundy''s resurrection is unusual in its nature. When he is slain,
    he is reconstructed and reborn from Slaughter Swamp, but never perfectly, or even
    the same way twice. The amount of intellect and memory Grundy retains from his
    time as Cyrus Gold varies significantly - he is typically dimwitted and thuggish,
    but on other occasions, he is barely capable of speech, and at points, he has
    even been a highly intelligent and effective crime lord. His level of power also
    varies from resurrection to resurrection, with him at times being battled relatively
    evenly by street-level characters, and at other times overpowering entire teams
    of superpowered beings. Though comic characters are normally highly variable,
    Grundy is one of the few who has an in-universe justification. His resurrections
    usually remove his memory of anything that happened prior and can result in him
    being reborn in a much dumber or weaker form. Though his intellect varies, his
    fighting style is invariably that of a brawler, relying on brute strength to overwhelm
    the opponent. Note: His stats vary wildly between incarnations. Before making
    any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
