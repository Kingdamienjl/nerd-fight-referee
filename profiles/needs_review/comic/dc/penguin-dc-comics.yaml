    - field: attack_potency
      value: Wall Level physically (At least 17 Kilojoules - Overtly far inferior
        to Batman in terms of physical strength. As someone with experience in combat
        and intimidation, should at least equal Doctor Destiny, who is treated as
        a completely normal man. Tore a license plate in two. Possibly helped kick
        a door off its hinges), Small Building Level with Weaponry and his Cassowary
        (Scaling to 0.095 Tons - Implied to be capable of harming Batman with his
        buzzsaw umbrella and blade umbrella - same with his gun umbrella. His energy
        projection umbrella did serious damage to the Batwing. His cassowary's talons
        could harm Batman. The missiles from his missile umbrella could blast away
        and seemingly harm his henchwomen, who could kick Batwoman through a stone
        wall. Though not certain, it's possible one of his umbrellas created this
        crater in a wall), can ignore durability with nerve gas and knockout gas
      source_id: character-stats-profiles-penguin-dc-comics
      provider_id: character_stats_profiles
