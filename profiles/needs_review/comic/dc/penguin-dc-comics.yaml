    - field: powers_and_abilities
      value: "With his body and weaponized umbrellas, Superhuman Physical Characteristics\
        \ (See Durability), Judo Proficiency (Thought of by Alan Burnett, one of the\
        \ DCAU's main producers, as having a notable amount of prowess in Judo), Weapon\
        \ Mastery (with his Weaponized Umbrellas - also seems to be a somewhat proficient\
        \ fencer), Preparation (Rigged the Gotham Zoo's aviary to make it a trap for\
        \ Batman), Flight (Can fly away with his helicopter umbrella), Homing Attack\
        \ (The missiles from his missile umbrella seek out their target, with him\
        \ describing them as \"Bat-seeking\"), Acid Manipulation (Burnt a lock with\
        \ acid from his umbrella), Energy Projection (One of his umbrellas can fire\
        \ white beams of energy), Fire Manipulation (One of his umbrellas can become\
        \ a blowtorch), Gaseous Poison Manipulation (One of his umbrellas can fire\
        \ a potent nerve gas), Sleep Manipulation and Gas Manipulation (One of his\
        \ umbrellas fires knockout gas), Smoke Manipulation (Carried a smoke bomb),\
        \ Possible Electricity Manipulation (One of Batgirl\u2019s dreams, during\
        \ Batgirl Returns, shows him using an umbrella that shoots electricity) With\
        \ Optional Equipment, Poison Manipulation (Prepared hummingbirds with poison-tipped\
        \ beaks)"
      source_id: character-stats-profiles-penguin-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Wall Level physically (At least 17 Kilojoules - Overtly far inferior
        to Batman in terms of physical strength. As someone with experience in combat
        and intimidation, should at least equal Doctor Destiny, who is treated as
        a completely normal man. Tore a license plate in two. Possibly helped kick
        a door off its hinges), Small Building Level with Weaponry and his Cassowary
        (Scaling to 0.095 Tons - Implied to be capable of harming Batman with his
        buzzsaw umbrella and blade umbrella - same with his gun umbrella. His energy
        projection umbrella did serious damage to the Batwing. His cassowary's talons
        could harm Batman. The missiles from his missile umbrella could blast away
        and seemingly harm his henchwomen, who could kick Batwoman through a stone
        wall. Though not certain, it's possible one of his umbrellas created this
        crater in a wall), can ignore durability with nerve gas and knockout gas
      source_id: character-stats-profiles-penguin-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Average Human combat speed (Never demonstrated to be particularly
