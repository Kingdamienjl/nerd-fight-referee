      value: "With his body and weaponized umbrellas, Penguin can use the following:\
        \ *Superhuman Physical Characteristics (See Durability) *Judo Proficiency\
        \ (Thought of by Alan Burnett, one of the DCAU's main producers, as having\
        \ a notable amount of prowess in Judo) *Weapon Mastery (with his Weaponized\
        \ Umbrellas - also seems to be a somewhat proficient fencer) *Preparation\
        \ (Rigged the Gotham Zoo's aviary to make it a trap for Batman) *Flight (Can\
        \ fly away with his helicopter umbrella) * Homing Attack (The missiles from\
        \ his missile umbrella seek out their target, with him describing them as\
        \ \"Bat-seeking\") *Acid Manipulation (Burnt a lock with acid from his umbrella)\
        \ *Energy Projection (One of his umbrellas can fire white beams of energy)\
        \ *Fire Manipulation (One of his umbrellas can become a blowtorch) *Gaseous\
        \ Poison Manipulation (One of his umbrellas can fire a potent nerve gas) *Sleep\
        \ Manipulation and Gas Manipulation (One of his umbrellas fires knockout gas)\
        \ *Smoke Manipulation (Carried a smoke bomb) *Possible Electricity Manipulation\
        \ (One of Batgirl\u2019s dreams, during Batgirl Returns, shows him using an\
        \ umbrella that shoots electricity) With Optional Equipment, he can use: *\
        \ Poison Manipulation (Prepared hummingbirds with poison-tipped beaks)"
