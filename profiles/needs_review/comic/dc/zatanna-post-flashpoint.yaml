      practice in her craft, and has proven to be a far more powerful spell-caster
      than other gifted magicians and powerful magic beings such as John Constantine
      or The Phantom Stranger.Justice League Dark Vol 1 37 Beyond her wide array of
      magic abilities, Zatanna is also a very good illusionist, being able to easily
      escape straitjackets and entertain crowds.
