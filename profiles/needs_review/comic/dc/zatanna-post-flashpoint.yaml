- id: claim-powers-and-abilities-5f2f19f2
  section: abilities
  axis: hax
  text: 'Base= Superhuman Physical Characteristics, Martial Arts (Has been able to
    fend off and defeat many attackers at once even without using her magicCatwoman
    Vol 5 18), Social Influencing (As a professional stage magician, Zatanna is great
    at distracting her audience and making them focus only on what she wants them
    to focus on by making the right monologues in the right wayWonder Woman: Agent
    of Peace Vol 1 15), Extrasensory Perception and Enhanced Senses (Can sense threats
    and dark energy,Justice League Dark Vol 1 12Justice League Dark Vol 1 33 see ghosts
    and find the origin of spellsHarley''s Little Black Book Vol 1 3), Preparation
    (Her house is surrounded by protective charmsConstantine Vol 1 4), Stealth Mastery
    (Is skilled in lockpicking, escapism and sleight of hand, to the point that she
    could already escape from a straightjacket underwater when she was in kindergartenJustice
    League Dark Vol 2 3Detective Comics Vol 1 960), Genius Intelligence, Resistances
    to Mind Manipulation (Could act through the effects of a Pandora''s Pit, which
    normally subjugated those within it to Circe''s willTrinity Vol 2 14Trinity Vol
    2 13) |-|With Magic= Magic, Reality Warping, Subjective Reality and Law Manipulation
    (Zatanna''s magic consists of imposing her will over reality by speaking backwards,Detective
    Comics Vol 1 961Justice League Dark Vol 1 7 and it is powerful enough to alter
    the very laws of physics and nature, such as gravity), Thread Manipulation (Can
    summon spectral silk to bind peopleSideways Vol 1 Annual), Magic Negation (Attempted
    to negate the Enchantress'' hex, although she wasn''t strong enough to, then cast
    a protective spell to defend herself from her.Justice League Dark Vol 1 2 Cast
    a spell around herself and some allies to cancel out Pandora''s Box''s corruption.Justice
    League Dark Vol 1 23 Knows a spell to negate illusions and can dissolve any enchantmentJustice
    League Dark Vol 1 29), Memory Manipulation (Was going to make John Constantine
    forget her magic.Justice League Dark Vol 1 3 Made an entire school forget their
    memories of the last hour and shared one of her memories with SidewaysSideways
    Vol 1 7), Teleportation (Can teleport,Justice League Dark Vol 1 4 and specifically
    aim her teleportations to bring her to someone else''s location), Mind Manipulation
    Negation (Can negate other magicians'' control over peopleJustice League Dark
    Vol 1 5), Air Manipulation (Shot a gust of air), Corrosion Inducement (Can melt
    enemies), Vibration Manipulation (Can shoot magic shockwavesI, Vampire Vol 1 7),
    Deconstruction (Can turn enemies to dust), Death Manipulation (Can user her magic
    to make enemies "drop dead"Justice League Dark Vol 1 8), Paralysis Inducement
    (Can force people to stop walkingAnimal Man Vol 2 10), Earth Manipulation (Can
    summon a stone prison around enemies or bind them in ground and mudJustice League
    Dark Vol 1 9Justice League Dark Vol 2 10), Illusion Creation (Can change people''s
