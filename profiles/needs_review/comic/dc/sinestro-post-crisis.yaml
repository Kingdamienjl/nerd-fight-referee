        \ his ring), Sealing (Sealed Doctor Light in the Central Power Battery), Creation\
        \ and Wood Manipulation (Created wooden bugs), Water Manipulation (Generates\
        \ a tidal wave. Creates a fire hose. Creates a waterspout. Forms a hand of\
