        \ of himself), Duplication (Created several hard-fisted images of himself\
        \ to fight.), Can create copies of the ring), Summoning of other Green Lanterns,\
        \ Memory Manipulation, Limited Ice Manipulation, Power Bestowal (Can construct\
        \ temporary Green Lantern Rings to give to others, and did so to give Wally\
        \ West the powers of a Green Lantern), Heat Manipulation (Creates a miniature\
        \ sun. Melts incoming bullets. Melts guns), Can replicate the heat of the\
        \ sun), Fire Manipulation (Can generate searing flames), Created fire to counter\
        \ Martian Manhunter), Air Manipulation (Can generate tornadoes and gusts of\
        \ wind. Created a fan), Sound Manipulation (Turned off Arisia\u2019s voice),\
        \ Astral Projection (Projected himself to Ice and Fire), Body Control (Seals\
        \ his and Barry Allen\u2019s metabolisms), Non-Physical Interaction and Statistics\
        \ Amplification via Absorption (Absorbs a Guardian\u2019s astral projection\
