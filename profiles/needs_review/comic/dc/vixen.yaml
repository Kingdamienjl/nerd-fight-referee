    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics to varying degrees with different
        animal powers (See Attack Potency, Speed, Lifting Strength, and Durability)
        *Superhuman Athleticism (Can use her heightened speed from Cheetah Power to
        make massive superhuman leaps. However, even without building up speed, it
        seems as if Vixen can leap higher than any IRL human can even without Cheetah
        Power, as in one instance she leapt from ground level to the top of a tree
        branch) * Enhanced Senses (Wields infra-red vision with her Lizard Power)
        *Acrobatics (Performed acrobatic leaps and flips in order to intercept Green
        Lantern. Did what seems to be a quintuple somersault while scaling a cliff-face.
        Backflipped to avoid an explosion) *Natural Weaponry (Conventional: Some of
        her animal powers, like her Puma Power, give her claws she can use in combat)
        *Combat Expertise (Shows proficiency with her powers during her many fights
        in JLU, and in CQC uses a kick and bodyslam-focused style. Judo-threw Wonder
        Woman, using the Amazing Amazon''s own attack momentum against her) *Electricity
        Manipulation (with her Electric Eel Power, which covers her in bioelectricity
        that shocks foes upon contact) *Regeneration (At least Low: Used a reptile''s
        healing power to instantly heal a broken arm) * Surface Scaling (with her
