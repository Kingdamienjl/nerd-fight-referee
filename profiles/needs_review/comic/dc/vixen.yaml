    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics to varying degrees with different
        animal powers (See Attack Potency, Speed, Lifting Strength, and Durability)
        *Superhuman Athleticism (Can use her heightened speed from Cheetah Power to
        make massive superhuman leaps. However, even without building up speed, it
        seems as if Vixen can leap higher than any IRL human can even without Cheetah
        Power, as in one instance she leapt from ground level to the top of a tree
        branch) * Enhanced Senses (Wields infra-red vision with her Lizard Power)
        *Acrobatics (Performed acrobatic leaps and flips in order to intercept Green
        Lantern. Did what seems to be a quintuple somersault while scaling a cliff-face.
        Backflipped to avoid an explosion) *Natural Weaponry (Conventional: Some of
        her animal powers, like her Puma Power, give her claws she can use in combat)
        *Combat Expertise (Shows proficiency with her powers during her many fights
        in JLU, and in CQC uses a kick and bodyslam-focused style. Judo-threw Wonder
        Woman, using the Amazing Amazon''s own attack momentum against her) *Electricity
        Manipulation (with her Electric Eel Power, which covers her in bioelectricity
        that shocks foes upon contact) *Regeneration (At least Low: Used a reptile''s
        healing power to instantly heal a broken arm) * Surface Scaling (with her
        Spider Power, which allows her to adhere to surfaces and scale them with inhuman
        agility) * Weight Manipulation (Can give herself the mass of an elephant with
        her Elephant Power) *Limited Resistance to Fire Manipulation (Was unburnt,
        if staggered, by Dreamslayer''s flame)'
      source_id: character-stats-profiles-vixen-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: At least Small Building Level with her weaker animal powers (Upscaling
        from 0.095 Tons - Restrained Hawkgirl with a boa-constrictor bind and beat
        Paran Dul, an adult female Thanagarian Soldier of a similar rank to Hawkgirl,
        in a fistfight. Knocked over Tracer and knocked him out with a boa-constrictor
        choke, with Tracer being capable of tackling Batman and hurting him with a
        punch. Fought and notably pressed Black Canary. Clawed through the base of
        a statue. Cratered a metal wall by kicking a Thanagarian into it. Burst through
        an elevator door. Slashed through a Dark Heart Drone, which could tank machine
        gun fire), up to Large Planet Level at her absolute strongest (Downscaling
        from 1.03 Ronnatons - Using an unknown animal power, Vixen contributed to
        a combo attack which overtly harmed Overman. Dented the arm of a battle suit
        (which was presumably made of Nth Metal, considering it was a Thanagarian
        weapon) with a kick. Briefly stopped Wonder Woman from attacking Hawkgirl.
        Fought Shadow Thief and smacked him around. Knocked Chaos-Magic Solomon Grundy
        through a few walls with an elephant charge, but seemingly did no actual damage
        and had to take him off-guard to knock him over in the first place)
      source_id: character-stats-profiles-vixen-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ combat speed and reactions with most of her animal powers
        (Scaling to 0.53c - Comparable in speed to a bloodlusted, mind-controlled
        Wonder Woman, expertly evading her stomp attack and turning aside her charging
        punch - on another occasion, Vixen and a furious WW were shown to attack Overman
        in perfect sync. Can fight Shadow Thief, dodging his attacks and tagging him
        with tackles and kicks, with Shadow Thief being capable of dodging Lantern
        Beams (which are SoL) after they were fired - on that note, Vixen could duck
        to avoid a Lantern Beam after it was fired), Peak Human charging speed with
        Elephant Power (Overtly depicted as notably slower than her Base Self), and
        up to Subsonic running speed with Cheetah Power (Cheetahs can achieve running
        speeds of up to 128 km/h)
      source_id: character-stats-profiles-vixen-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Varies (The extent to which her animal powers modify her durability is
        difficult to ascertain, but her durability is undeniably inconsistent in a
        similar way as Hawkgirl's), from at least Small Building Level (Upscaling
        from 0.095 Tons - Should scale to her own AP as per Newton's Third Law. Was
        harmed by, but took, attacks from Black Canary. Withstood slamming into a
        seating section hard enough to shatter a sizable portion of it. Tanked a flame
        blast that sent her through the side of a large truck. Was hurt by a bookcase
        falling on her. Was KO-ed by a dinosaur skeleton falling on her from a great
        height), to as high as Large Planet Level (Downscaling from 1.03 Ronnatons
        - Tanked a Canary Cry, which destroyed something that swings from Hawkgirl's
        mace couldn't, though the CC being that powerful isn't consistent, and it's
        also implied that Vixen would have died if Hawkgirl had hit her in the head
        with her mace. Stayed conscious after an elbow strike from Wonder Woman, but
        another strike KO-ed her)
      source_id: character-stats-profiles-vixen-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Presumably has normal human weaknesses. Note: Bruce Timm has stated
        that the original DCAU tie-in comics are not canon, with the only tie in comics
