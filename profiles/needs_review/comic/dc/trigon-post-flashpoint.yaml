    members of the Teen Titans), Time Manipulation (Controls the flow of time within
    his kingdoms), Hellfire Manipulation (Can shoot hellfire light from his eyes and
    fire blasts of it from his hands), Breath Attack (Can spew hellfire from his mouth),
    Body Control (Can fire extendable, skeletal arms from his hands), Soul Manipulation
    (His arms pierced into Raven's soul; devoured the afterlives of the worlds he
    conquered), Summoning (Can summon a horde of his followers), Portal Creation (Opened
    a portal to bring a woman from another universe to his own), Dimensional Travel
    (Can travel to Earth at certain locations), Shapeshifting (Turned into a human
    to fool Raven's mother), Illusion Creation (Crafted illusions to manipulate the
    Teen Titans, which went much farther than they found out about), Resurrection
