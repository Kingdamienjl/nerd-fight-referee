    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics (See Attack Potency, Speed, and\
        \ Durability), Genius Intelligence (See Intelligence), Social Influencing\
        \ (Charisma and Leadership: Manipulated Harleen Quinzel into choosing a life\
        \ of crime (\u201CMad Love\u201D), and manipulated her into coming back to\
        \ him no matter how many times he wronged her, as shown in episodes like \u201C\
        Harley\u2019s Holiday\u201D and her return to him as of the \u201CReturn of\
        \ the Joker\u201D flashback sequence. Manipulated the Royal Flush Gang into\
        \ following him (\u201CWild Cards\u201D), and did the same with the Meta-Breed\
        \ in Static Shock\u2019s \u201CThe Big Leagues\u201D), Surprising Proficiency\
        \ in Hand-to-Hand Combat (Is a \"great fist fighter,\" as demonstrated when\
        \ he fought a close battle with The Phantasm, whose combat skills have been\
        \ compared to Batman's. Though he's a bit weaker, Joker has held his own against\
        \ Batman, a martial arts master, on many occasions. Worked as an enforcer\
        \ for the Mob), Weapon Mastery with several weapons (Has years of experience\
        \ using firearms, knives and his razor-sharp playing cards), Preparation (Planted\
        \ paralyzing gas in candlesticks. Planted bombs across Vegas. Turned a Christmas\
        \ tree into a functioning rocket in order to escape Arkham. Filled twenty\
        \ miles of tunnels with high explosives), Stealth Mastery (Snuck up on Batman,\
        \ albeit the Dark Knight was distracted at the time), Sleight of Hand Mastery\
        \ (Stored a knife in his sleeve and shunted it into his hand so smoothly the\
        \ extremely observant Batman didn't notice), Acrobatics (Did a flip and a\
        \ back handspring) His standard arsenal (give or take a few items) grants\
        \ him:, Acid Manipulation (His corsage fires acid potent enough to melt The\
        \ Phantasm's blade), Electricity Manipulation (with his high-voltage Joy Buzzer),\
        \ Explosion Manipulation (Is shown to always carry around some sort of explosive\
        \ (though the exact explosive varies), such as a bomb inside a stuffed doll,\
        \ this small explosive capsule, as well as explosive marbles), Sleep Manipulation\
        \ with Knockout Gas (Joker's knockout gas, within his corsage, is potent enough\
        \ to instantly incapacitate Solomon Grundy) Given preparation time, Flight\
        \ (Can access a small plane and a jetpack), Situational Durability Negation\
        \ and Statistics Reduction (Can come into possession of Kryptonite (as seen\
        \ in STAS' \"World's Finest\"), which has these effects on Kryptonians such\
        \ as Superman), Mind Manipulation (In BTAS' \"Make 'Em Laugh\", he stole The\
        \ Mad Hatter's mind-control microchips), Adhesive Manipulation (Created an\
        \ super-strong adhesive to keep Charlie Collins stuck to a door handle), Sound\
        \ Manipulation (During TNBA's \"Holiday Knights,\" Joker came into possession\
        \ of a sonic bomb that would instantly kill anyone in earshot when it went\
        \ off), Radiation Manipulation (In \u201CHarlequinade,\u201D came into possession\
        \ of a nuclear bomb), Paralysis Inducement (Filled candlesticks with a gas\
        \ that froze people in place) Following his Resurrection, Joker retained his\
        \ innate abilities, Hand-to-Hand Combat Mastery (Via access to Tim Drake's\
        \ body and memories, gained intimate knowledge of \"every trick the original\
        \ Batman and Robin knew at their peak\"), Enhanced Senses (Tim Drake could\
        \ hear Terry McGinnis coming despite his stealth training) The resurrected\
        \ Joker can utilize the following abilities with Preparation:, Light Manipulation\
        \ and Energy Projection (with the Laser Satellite), Energy Projection (with\
        \ his Energy Blaster), Explosion Manipulation (with his Grenades), Electricity\
        \ Manipulation (with his Joy Buzzer)"
      source_id: character-stats-profiles-joker-rebirth-dc
