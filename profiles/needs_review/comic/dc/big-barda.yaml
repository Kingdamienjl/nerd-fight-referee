        \ his opponents or inflict pain without killing them - such as when his Omega\
        \ Beam torture didn\u2019t even knock out Kalibak, who consistently gets one-shot\
        \ by Superman), up to Large Star Level at his peak (Scaling to 1.664 Foe -\
        \ Has repeatedly fought and injured a bloodlusted Superman, even drawing blood\
