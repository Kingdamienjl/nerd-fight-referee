        \ article, which was presumably looked over and approved by DC, describes\
        \ Darkseid and Superman\u2019s fight in \u201CTwilight\u201D as a match between\
        \ \u201CSuperman and the Equally Powerful Darkseid.\u201D According to Bruce\
        \ Timm, is a villain powerful enough that Superman can comfortably let loose\
        \ against him without fearing killing him (even in the context of \u201CTwilight\u201D\
        ) and is \u201Cthe most powerful\u2026 villain ever\u201D in the DCAU as of\
        \ right before JL Season 2\u2019s premiere - this would imply he is even stronger\
        \ than Jax-Ur, Solomon Grundy, Sinestro, Star Sapphire, and the like. Regarded\
        \ by the S:TAS writers as an effective villain due to his ability to fight\
        \ evenly with and pose a genuine physical threat to the Man of Steel. His\
        \ Omega Beams (See Note) have one-shot Martian Manhunter and devastated Supergirl.\
        \ Thought of as a villain who could pose a threat to the entire Justice League.\
        \ Considers Kalibak, who easily defeated Wonder Woman, a weak embarrassment\
        \ and devastated him with his Omega Beams. As one of the most powerful New\
        \ Gods (only perhaps equalled by Highfather), is likely comparable to if not\
        \ stronger than the stronger Old Gods, such as Hades) | Varies (Reasoning\
        \ described above), up to Large Star Level at his peak (Scaling to 1.664 Foe\
        \ - Is stronger than before, though according to Bruce Timm this constitutes\
