        \ if not Type 1 Immortality (As a new god, his physiology should be the same\
        \ as Big Barda\u2019s, which allowed her to not age a day between JLU and\
        \ Batman Beyond - however, he\u2019s implied to be extremely old, as the fourth\
        \ world characters usually are in adaptations) *Social Influencing: Two Types\
        \ - *Deception: Is a master deceiver, even convincing those as intelligent\
        \ as Batman and Hawkgirl that he genuinely needed the Justice League\u2019\
        s help. *Charisma: Unconditionally beloved by his people despite his horrible\
        \ actions. * Energy Projection and Homing Attack (with Omega Beams, which\
        \ seek out their target) *BFR (through two means - his Omega Beams can teleport\
        \ foes across vast distances, like when he sent Kalibak to Apokolips with\
        \ them - that, and due to being comparable to Superman he should also be capable\
        \ of physical BFR via throwing his opponent extremely far) *Hand-to-Hand Combat\
        \ Skills (Has kept up in skill with Superman, and is the mightiest person\
        \ on Apokolips, a world of warriors) *Explosion Manipulation (Used his Omega\
        \ Beams in a fashion that caused a large explosion - it\u2019s true that he\
        \ did this whilst amped by Brainiac, but we have no reason to believe Brainiac\
        \ changed the fundamental nature of the Omega Beams) *Portal Creation (Can\
        \ use Boom Tubes) * Absorption and Limited Empathic Manipulation (His Mother\
        \ Box should have similar functions to Orion's) *Technological Manipulation\
        \ and Preparation (Prepared a device that overtook Brainiac\u2019s central\
        \ processing unit) Upon his resurrection, he possesses all his previous abilities,\
        \ as well as: *Partial Cyborgization *Forcefield Creation (Shown here) *Pain\
        \ Manipulation (via the Agony Matrix) *Situational Durability Negation and\
        \ Statistics Reduction (with his Kryptonite knife - Kryptonite has said effects\
        \ on Kryptonians such as Superman) *As well as far more considering he was\
        \ given \u201CBrainiac\u2019s powers\u201D by Tala."
      source_id: character-stats-profiles-big-barda-dc
      provider_id: character_stats_profiles
