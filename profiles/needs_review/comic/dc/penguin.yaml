    - field: powers_and_abilities
      value: "With his body and weaponized umbrellas, Penguin can use the following:\
        \ *Superhuman Physical Characteristics (See Durability) *Judo Proficiency\
        \ (Thought of by Alan Burnett, one of the DCAU's main producers, as having\
        \ a notable amount of prowess in Judo) *Weapon Mastery (with his Weaponized\
