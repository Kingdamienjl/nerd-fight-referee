        \ *Smoke Manipulation (Carried a smoke bomb) *Possible Electricity Manipulation\
        \ (One of Batgirl\u2019s dreams, during Batgirl Returns, shows him using an\
        \ umbrella that shoots electricity) With Optional Equipment, he can use: *\
        \ Poison Manipulation (Prepared hummingbirds with poison-tipped beaks)"
