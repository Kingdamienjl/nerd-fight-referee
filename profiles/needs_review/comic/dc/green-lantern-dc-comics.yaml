      value: 'These are powers or abilities that are commonly displayed amongst members
        of the Green Lantern Corps in order for them to combat their enemies effectively,
        though do keep in mind not every member shares the same hax these are just
        the ones that are inherent byproducts of being a member of the Green Lantern
        Corps...Willpower Manipulation, Emotional Manipulation, Energy Manipulation
