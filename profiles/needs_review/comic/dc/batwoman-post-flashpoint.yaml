        Batman is one of the most intelligent beings in the DC Universe and is the
        second most intelligent human alive, only behind Lex Luthor. Batman is a master
        of a wide variety of fields of science, ranging from engineering, biology,
        physics, chemistry, and computer science, as demonstrated when he designed
        the Hall of Justice, which can transform into a mobile flying fortress, built
        an absolute zero prison, quickly came up with a serum that protected him and
        Selina from Poison Ivy''s planetary pheromones, shut down a high-tech network
        with a device no more advanced than an ordinary cell phone, reverse-engineered
        Green Lantern communication and translation, hacked Apokolyptian computers
        and alien computers using unknown languages, developed a fully sapient Alfred
        AI, and a machine that grows perfect clones of himself complete with memories,
        experiences, training, and intelligence. He has built many different Batsuits
        that are highly versatile, with some of them even capable of singlehandedly
        fighting off the entire Justice League. Batman has also invented a wide variety
        of equipment, such as temporal grenades that affect time, a 10''th Metal bullet
        containing a miniature omniversal wormhole capable of transporting objects
        outside the Source Wall, and the Son Box, a device capable of reading the
        hearts of people, as well as building the Final Batsuit around it. Repeatedly
        creates perfect counters and contingencies which he flawlessly incorporates
        into his equipment and suits. The World Forger considers Batman one of the
        greatest strategic minds in existence. Is the greatest Detective and is one
        of the most skilled martial artists in history, with very few individuals
        being able to match him in a fight, and despite being powerless and alone,
        easily outwitted and defeated AMAZO by teleporting him away. | Nigh-Omniscient.
        With the Mobius Chair, Batman knows everything except who the Anti-Monitor
        is.'
