  axis: hax
  text: 'Firestorm (Pre-Infinite Crisis)=Superhuman Physical Characteristics, Multiple
    Selves (All types), Regeneration (Low-Mid if the person he''s merged with doesn''t
    get used up; Regenerated from being stabbed and being impaled through his chest),
    Flight, Fire Manipulation, Transmutation, Energy Projection, Matter Manipulation,
    Self-Sustenance, Heat Manipulation, Energy Manipulation, Absorption (Can absorb
    anyone near him into the Firestorm Matrix), Danmaku (Melted Killer Frost''s ice
    instantly), Radiation Manipulation (Dampend radiation on a ship with a burst reactor),
    Enhanced Senses and Information Analysis (Can see the molecular structure of things),
    Biological Manipulation (Cured Killer Frost of a terminal illness by using another
    human as a template and superimposing the healthy parts onto herFirestorm (2004)
    #8), Statistics Amplification (Empowered Killer Frost), Ice Manipulation (Turned
    multiple Multiplex clones to ice), Power Absorption (Absorbed Killer Frost''s
    powersFirestorm (2004) #10), minor Precognition (The Firestorm Matrix allows its
    hosts to access the past and future lives of the atoms within it), Shapeshifting
    (Capable of altering his own apperance), Resistance to Extreme Heat, Cold, Radiation,
    Telepathy (Martian Manhunter has difficulty reading his thoughts) and Matter Manipulation
    (Unaffected by a Particle Accelerator) Firestorm (Post-Infinite Crisis)=Same as
    before, Density Manipulation allows him Intangibility, Extrasensory Perception
    (Can see across different dimensional spectrums, so he can see invisible opponents),
    Telepathy (Phased into John Stewarts brain and established a psychic link), Earth
    Manipulation (Controlled the ground to hold Mammoth), Size Manipulation (Can shrink
    his size to a molecular level), Black Hole Creation (The feedback from affecting
    organic material unleashed a dozen or more wormholes that were trapping all heat
    in the vicinity in a quantum loopFirestorm (2004) #32) Firestorm (Jason Rusch
    + Ronnie Raymond)=All previous powers, as well as seemingly all the powers of
    Ronnie Raymond''s Firestorm, Teleportation (Teleported to the Anti-Matter universeBrightest
    Day Vol 1 #10)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
