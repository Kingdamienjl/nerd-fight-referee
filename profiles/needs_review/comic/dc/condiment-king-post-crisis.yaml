  attack_potency:
    text: Athlete level physically (Is in athletic condition, even shown working out
      in Arkham while he would research. Kicked a heavily incapacitated Robin, though
      didn't seem to do any damage, and he is portrayed as weaker than most superheroes),
      Building level with Mustard Gas Bomb (Can make an explosion of this size), Condiment
      Gun and mustard gas ignore conventional durability | At least Street level,
      possibly Wall level (Can fight the military and comparable to the other enhanced
      villains who can do the same, as well as trained cops. Draws blood from the
      Human Flame, and fights him, though he is slightly weaker. Human Flame could
      crush parts of skulls and could take a hit from Clayface as well as knock him
      back, though Human Flame was mostly manhandled by him and was defiantly weaker)
    source_ids:
    - vsbattles-condiment-king-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
