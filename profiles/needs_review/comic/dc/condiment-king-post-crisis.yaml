- id: claim-powers-and-abilities-f80f0f8b
  section: abilities
  axis: hax
  text: Weapon Mastery (Of his various custom weapons), Genius Intelligence, Stealth
    Mastery (Snuck up on the Birds of Prey), Minor Acid Manipulation and Status Effect
    Inducement (via Condiment Gun. Almost instantly incapacitated the Birds of Prey
    with a single spray, due to causing a burning sensation. The sauce fired from
    the gun is one hundred thousand on the Scoville scale. Within moments it induces
    anaphylactic shock in the target, which Mitchell compares to the effects of a
    rattle snake bite. Causes eyes to water and throats to swell. The sauce can cause
    blindness. Will cause victims to pass out, and eventually die. Can even effect
    individuals through their masks), Preparation, Explosion Manipulation and Poison
    Manipulation (With mustard gas bomb, and possibly the Scoville bomb) Peak Human
    Physical Characteristics, possibly Superhuman Physical Characteristics, Weapon
    Mastery, Genius Intelligence, Stealth Mastery, Minor Acrobatics, Skilled Brawler,
    Cyborgization (Partial; Comparable to the other test subjects of Professor Achilles
    Milo), Fire Manipulation (via Hot Sauce; As shown multiple times), Acid Manipulation
    (via Vinegar and Hiss), Resistance to Pain Manipulation (Like all followers of
    Immortus, he was trained to fight through the pain, as shown when he fights after
    having his nose blasted off) and Mind Manipulation (Condiment King resists Seductress's
    Angel Dust, which easily incapacitated a policeman)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
