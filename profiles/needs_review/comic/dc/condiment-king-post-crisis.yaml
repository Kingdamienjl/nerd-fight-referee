      and Black Canary, though this is likely because he caught them by surprise.
      This is backed up since he can't tag Dick Grayson) | Supersonic (Can react to
      and dodge gunfire. Can blitz trained members of the US military, and is comparable
      to the other enhanced who can blitz cops)
