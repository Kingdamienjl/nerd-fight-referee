      (1999) #6. Wally had to resort to racing the Black Flash to the end of time
      in order to defeat it, rather than more direct meansThe Flash (1987) #141. Was
      able to match and fight evenly against Zoom with all 4 of the forcesThe Flash
      (2016) #81. EasilyThe Flash (2016) #76 overpoweredThe Flash (2016) #80 Barry
      Allen multiple times and could stab through himThe Flash (2016) #805-D)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Massively FTL+ (Could keep up with Wally West and nearly caught up to himThe
      Flash (1987) #141. Stated to be the fastest thing Barry had ever encounteredThe
      Flash (2016) #76. Can keep pace with Zoom). Immeasurable via running through
      time. (Followed Wally West all the way to the end of time, nearly catching up
      to him)'
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Peak Human (Overpowered Barry Allen easily)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
