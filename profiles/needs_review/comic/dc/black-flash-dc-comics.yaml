    source_ids: *id002
    confidence: 0.8
  durability:
    text: 'Low Complex Multiverse level (None of the attacks from the Flash family
      had any effect on itThe Flash (1987) #141. Survived multiple hits from Zoom.
      Took little damage from a serious, albeit weakened Barry Allen, who described
      punching the Black Flash like punching DarkseidThe Flash (2016) #76)'
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Infinite (The Black Flash isn't bound by physical restraints of any sorts.
