        of holding her own against Wildcat, who was the Champion of the Meta-Brawl
        - considering Tracer was shown among the Meta-Brawl's contestants, we can
        reasonably infer that Wildcat beat him in a fight at some point. Tracer was
        strong enough to tackle Batman and hurt him with a punch. Fought Vixen and
        harmed her whilst she was using her lesser animal powers, and harmed the (inconsistently
        durable) Hawkgirl with a kick. Once she stopped fooling around, she casually
        stomped Green Arrow without sustaining even a scratch. Kicked a thug into
        a wooden crate hard enough to shatter it, and tossed another man into a crate
        to similar effect), Varies with Canary Cry, from at most Small Building Level
        (Did less damage to Vixen, even at point-blank, than Canary's own physical
        attacks. Totaled a truck) to far higher (Destroyed the Meta-Brawl arena, and
        destroyed something that Hawkgirl's mace couldn't break - however, that is
        in and of itself inconsistent, since the Canary Cry, even when Dinah is clearly
        exerting herself greatly, is shown to not have AP approaching that of Hawkgirl's
        planetary scaling, such as when it didn't even down Mandragora during "Double
