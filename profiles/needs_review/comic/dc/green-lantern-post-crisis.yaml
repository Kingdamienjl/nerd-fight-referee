    - field: weaknesses
      value: 'Rings hold a limited charge, and need to be recharged with a power battery
        every so often, cannot be used without strong enough willpower, if the user
        has too much fear then they are unable to affect things colored yellow. If
        the GL loses focus or concentration their power will weaken (this can be accomplished
        via illusions and telepathic attacks, if said GL is unprepared for such things.)
        Notable Attacks/Techniques: *Auto-aura: A passive ability that activates several
        enhancements simply by wearing the ring. Grants some increase in durability,
        regulates temperature and oxygen, allowing the wielder to survive in space.
        Allows for flight. *Autoshields: A forcefield that activates automatically
        whenever a GL is in danger, independent of their own will. This shield is
        not as strong as a purpose - created forcefield, however. *Constructs: The
        primary method of usage. The GL rings can create energy constructs that can
        easily be larger than planets. These are often used as weapons, restraints,
        or tools. *Scan: GL Rings can analyze a target comprehensively, determining
        its identity, power source, power level, threat level, weaknesses, capabilities,
        etc. This takes a bit of time to complete, though. Notes: *This profile covers
