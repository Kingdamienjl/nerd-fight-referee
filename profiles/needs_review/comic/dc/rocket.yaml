    - field: weaknesses
      value: 'Kryptonite, Magic (Was knocked out by Orm''s lightning in one hit).
        In the beginning of the DCAMU, he was rather cocky and hot-headed, but quickly
        mellowed down as the verse continued. Notable Attacks/Techniques: *Solar Energy
        Absorption: This is the main source of Superman''s powers, his cells act as
        solar batteries that absorb different types of solar energy such as Earth''s
        yellow sun, granting him vast superhuman abilities. *Flight: Superman can
        fly at high speeds by manipulating the graviton particles around his body
        allowing him to defy gravity. *Heat Vision: Superman can fire beams of intense
        heat from his eyes, capable of burning through steel, destroying Parademons
        and bore into Darkseid''s eye sockets. *Accelerated Healing: Superman possesses
        a limited, but rapid healing factor which is further enhanced by his exposure
        to direct sunlight. Despite being fatally wounded by Doomsday, he entered
        a regenerative coma, where he recovered from his wounds. Upon being exposed
        to the sun''s rays, all of the injuries he had sustained during his fight
        with Cyborg Superman had instantaneously healed. *X-Ray Vision: Superman can
        project harmless X-rays from his eyes, allowing him to see through solid objects
        except lead. He used this to see through Batman''s smokescreen and look through
        Batman''s mask to discover his identity. *Underwater Breathing: While his
        physiology appears human, Superman can breathe and speak clearly underwater
        without any aid and can handle the bottom depths pressure of the ocean unfazed.
        *Super Hearing: Superman''s hearing is very sensitive, allowing him to detect
        even the faintest of sounds. ==Notable Matchups== Victories: Losses: Inconclusive:
