        Manipulation (Regressed a sentient humanoid shark back into a regular shark),
        Fear Manipulation (Caused Kordax so much fear that he ended his own life and
        made every animal on the planet experience his fear), Psychometry (Can telepathically
        trace the origin of objects), Perception Manipulation (Made sharks attacking
        a fish look like a man committing suicide). His Hook Hand can channel electricity
        through it, Resist electrical and energy attacks. The Waterbearer Hand grans
        him Enhanced Water Manipulation, Ice Manipulation (Can turn the liquid hand
        into ice), Power Nullification (It negates and deconstructs magical enchantments,
        spells, and items/creatures), Regeneration (High-Low. Brought him back from
        the brink of death), Healing (Can heal others of physical wounds, mental ailments,
        and even resurrect the recently killed), Teleportation to the secret sea,
        Control over the hand's shape and density (Can even send it into machines
        and a man's head), Precognition (Can receive visions of the future), Extrasensory
        Perception (Can perceive spirituality in water), Portal Creation/Dimensional
        Travel (Creates portals to different realities), and purify water. His liquid
        metal hand can shapeshift into whatever shape he wills it. As the elemental
        of water, Arthur gains much more extensive Water Manipulation alongside Logia-Intangibility,
        and Shapeshifting. Resistance to Mind Manipulation (Has broken out of and
        resisted the attacks of other Telepaths), Fear Manipulation (Broke out of
        Shark's induced fear), Pain Manipulation (Ignored pain that could immobilize
        Ocean Man), Extreme Temperatures (Claimed he could withstand most temperature
        extremes. Survived being frozen in ice), and Extreme Pressure (Survives pressures
        at the bottom of the sea)
