        Atlanteans are an offshoot of humanity that is biologically adapted to the
        deep ocean environment. For most Atlanteans, this means that can breathe underwater,
        endure the pressures of the deep (among other adaptations), and can only spend
        a very limited time out of water. He also possesses superhuman levels of strength,
        speed, endurance and durability, all by-products of his body being adapted
        to survive unprotected in the tremendous pressures of the ocean depths. Although
        other Atlanteans possess similar adaptations, Aquaman''s royal lineage makes
