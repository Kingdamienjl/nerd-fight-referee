- id: claim-weaknesses-c3f3875b
  section: weaknesses
  axis: weakness
  text: 'Being without water for over an hour can weaken and eventually kill him,
    although the Waterbearer hand negates this, and he can even hydrate with blood
    if absolutely necessary. Prefers not to use his telepathy to directly control
    others, usually only using it to its full potential when pressed into a corner.
    His telepathy tends to be less effective on beings that are less related to sea-creatures,
    although this is sometimes ignored. Aquaman''s neuroreceptors are much more developed,
    and therefore more vulnerable, than those of a humanJLA Secret Files Vol 1 3 Notable
    Attacks/Techniques: *Atlantean Physiology: The Atlanteans are an offshoot of humanity
    that is biologically adapted to the deep ocean environment. For most Atlanteans,
    this means that can breathe underwater, endure the pressures of the deep (among
    other adaptations), and can only spend a very limited time out of water. He also
    possesses superhuman levels of strength, speed, endurance and durability, all
    by-products of his body being adapted to survive unprotected in the tremendous
    pressures of the ocean depths. Although other Atlanteans possess similar adaptations,
    Aquaman''s royal lineage makes him a super-Atlantean as well as super-human, and
    as such he has greater physical capabilities than does a typical Atlantean. 879f08b5fdb480f15a62f8871c33e5751fb35231
    hq.jpg Aquaman 0110.jpg|Aquaman can control even the smallest Plankton. sVXjnkV.jpg
    K3zmM0f.jpg *Marine Telepathy: Aquaman has the ability to communicate directly
    with sea life and has done so throughout most of his life. Lately he possesses
    a greater range of control that can actually force sea creatures to obey his whims.
    Currently, he requests their assistance and they comply. He has chosen to continue
    to request since, if he forces them to comply, they will ultimately lose respect
    for him. Aquaman is also an accomplished telepath in general and can perform such
    telepathic feats as mind to mind communication, mind probes, mental domination
    of a non-aquatic mind, and mental attacks. His telepathy as of the events of Brightest
    Day also cover the likes of Artificial Intelligences and Undead Sea-Creatures.
    *The Trident of Poseiden: An unbreakable three-pronged leister that serves as
    an extension of the god''s own power. It can be used for base offensive purpose,
    but can also be used for a variety of mystical effects, such as cleaving a spatial
    aperture in the middle of the ocean. The trident is capable of controlling any
    body of water, creating water elementals, speed ships and other water vehicles
    with water, create fogs and storms of high intensity, summon waves of water to
    propel him at great speeds, and create earthquakes by increasing water pressure.
    DavidAQ blog 5b060fbc10c151.57452589.jpg|Harpoon Replacement File:8spilSt.jpg|S.T.A.R.
    Labs Hook 1imxCmA.jpg|Liquid Metal Hand 5026154-aquamanv7 2pg1.gif|Waterbearer
    Hand *Arm Replacements: Over his various adventures, Aquaman has used a variety
    of different implements to take the place of an arm he lost to a group of disobedient
    piranhas. **Harpoon Replacement: Initially affixing his missing hand with the
    tip of a whaling spear he owned, Orin made use of it as a melee weapon both in
