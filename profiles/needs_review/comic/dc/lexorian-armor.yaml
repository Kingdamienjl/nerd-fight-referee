- id: claim-weaknesses-048f6739
  section: weaknesses
  axis: weakness
  text: 'Can''t protect against sound-based attacks Note: Never once does this armor
    injure Superman unless he was already weakened via red-sun radiation. Only once
    does this armor do any combat with a non-explicitly weakened Superman, and does
    not actually harm him during the conflict. In fact, it struggles to harm even
    a weakened Superman. For example, while on Lexor, a planet with a red sun, a very-much
    weakened Superman still managed to shrug off much of the armors attacks. There
    are two instances where the armor has done battle against other characters. The
    first was in Superman Vol 1 401 where the warsuit was used in a ''battle'' against
    Supergirl, however, Supergirl knew the suit was being used by her cousin despite
    an impressive hologram displaying otherwise, and did not truly try to harm Superman.
    Likewise her getting ''injured'' was likely a ruse to make the battle seem believable
    as she showed no signs of injury once she took off the costume. The second confrontation
    happened in Heroes Against Hunger, where the suit was used in a fight against
    The Master, and though it did hold its own, it largely did this in terms of durability
    and abilities, rather then power. Note 2: Any feat originating from the Super
    Powers comic book series, though seemingly identical, is apart of a completely
    different continuity (the Super Friends universe) and is thus not counted here.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-9c236bbb
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Flight, Energy Projection, Temperature
    Manipulation, Energy Manipulation (created a miniature sun)Superman Annual 12,
    Power Absorption ("reconverted" the energy n Superman's attack and turned it into
    a sun), Spatial Manipulation (Converted Superman into a 2-Dimensional figure),
    Telekinesis (As shown hereSuperman Vol 1 385), Intangibility (as seen hereSuperman
