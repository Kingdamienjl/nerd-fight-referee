      value: 'Can''t protect against sound-based attacks, it struggles to harm even
        a weakened Superman. For example, a very-much weakened Superman still managed
        to shrug off much of the armors attacks. There are two instances where the
        armor has done battle against other characters. The first was in Superman
        Vol 1 401 where the warsuit was used in a ''battle'' against Supergirl, Supergirl
        knew the suit was being used by her cousin despite an impressive hologram
        displaying otherwise, and did not truly try to harm Superman. Likewise her
        getting ''injured'' was likely a ruse to make the battle seem believable as
        she showed no signs of injury once she took off the costume. The second confrontation
        happened in Heroes Against Hunger, where the suit was used in a fight against
        The Master, it largely did this in terms of durability and abilities, rather
        then power. Note 2: Any feat originating from the Super Powers comic book
        series, is apart of a completely different continuity (the Super Friends universe)
