  stamina:
    text: 'Superhuman (As a child, she played two-for-flinching with bullets and could
      ignore bullet wounds. Survived being shot with several high-caliber bullets
      that could tear through walls like paper, shrugged off being rammed by a police
      car and breaking more ribs while already injured and could briefly continue
      fighting after being stabbed in the heartBatgirl Vol. 1 #72, March 2006. Watched
