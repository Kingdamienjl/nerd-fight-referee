    - field: intelligence
      value: "Gifted. While she was originally incapable of speech and functionally\
        \ illiterate to the point of not knowing what letters wereBatgirl Vol. 1 #54,\
        \ September 2004, she is considered highly intelligent by Barbara Gordon,\
        \ and she has shown herself to be a skilled detective. She was able to deduce\
        \ that Bruce Wayne was Batman, figure out a detail about Vesper Fairchild\u2019\
        s murder that Tim Drake, Dick Grayson and Barbara Gordon hadn\u2019t noticedBatgirl\
        \ Vol. 1 #27, June 2002, and she figured out another detail that Dick hadn\u2019\
        t seenBatgirl Vol. 1 #29, August 2002. She would later take ESL courses and\
        \ get tutoring, allowing her to overcome her illiteracy. Extraordinary Genius.\
        \ Cassandra is one of the greatest, if not the greatest martial artist in\
        \ the world, and her skills are hailed above many of the greatest fighters\
        \ in the DC universe. As a child, she was trained to master all forms of armed\
        \ and unarmed combat, and even before being trained by Batman, her skills\
        \ were on par with the likes of Nightwing and RobinBatman: Legends of the\
        \ Dark Knight Vol. 1 #120, August 1999. She was able to defeat Lady Shiva,\
        \ something Batman had never been able to do, which caused her to become revered\
        \ in the martial arts community as \u201CThe One Who Is All\u201D. Batman\
        \ has claimed that nobody is as skilled of a fighter as CassandraBatgirl Vol.\
        \ 1 #58, January 2005, and he directly stated that Deathstroke couldn\u2019\
        t beat her in hand-to-hand combat, something that Slade himself implied. Many\
        \ members of the Batfamily have been shown to be inferior to Cassandra, including\
        \ Barbara Gordon, Stephanie BrownBatgirl Vol. 1 #28, July 2002 and Tim Drake,\
        \ and she has been directly stated to be superior to Batman. Standard Tactics:\
        \ Cassandra constantly holds back to avoid killing her opponents, something\
        \ that has been noted on several different occasionsBatgirl Vol. 1 #70, January\
        \ 2006. In combat, she will usually rely on her martial arts skill to defeat\
        \ her opponent, occasionally making use of her batarangs for ranged combat.\
        \ In her Kasumi identity, she uses various kinds of bladed weaponry - typically\
        \ a pair of swords - to fight, and she will use the Dimensiometer when fighting\
        \ opponents far stronger than her, like she did against Hawkgirl."
      source_id: vsbattles-cassandra-cain-dc
      provider_id: vsbattles
      authority: high
      confidence: 0.75
