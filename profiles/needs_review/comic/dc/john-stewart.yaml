        via illusions and telepathic attacks, if said GL is unprepared for such things.)
        Notable Attacks/Techniques: *Auto-aura: A passive ability that activates several
        enhancements simply by wearing the ring. Grants some increase in durability,
        regulates temperature and oxygen, allowing the wielder to survive in space.
        Allows for flight. *Autoshields: A forcefield that activates automatically
        whenever a GL is in danger, independent of their own will. This shield is
        not as strong as a purpose - created forcefield, however. *Constructs: The
        primary method of usage. The GL rings can create energy constructs that can
