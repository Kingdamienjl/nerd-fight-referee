  tier:
    text: High 1-A
    source_ids: &id002
    - mediawiki-24264
    confidence: 0.8
  attack_potency:
    text: High Outerverse level (All members of the Endless are the primal truths
      which compose every aspect of The Presence's creation. His realm is the loom
      on which the fabric of all existence is weaved, and his book contains all of
      existence within it. He has the same nature and affinity as The Basanos and
      is the source of their power. Destiny has been implied to be the personification
      and the side effect of The Presence's deterministic approach on creation, with
      his book being based on the script written by the Presence. Reading aloud from
      the Book makes the book a part of the story it tells which will cause a disaster
      as severe as the one caused by Presence's abdication. The Book has no separate
      existence from Destiny, and not even Michael can forcefully take it away from
      him)
    source_ids: *id002
    confidence: 0.8
