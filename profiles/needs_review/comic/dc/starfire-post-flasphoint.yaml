        (Touching her skin caused Red Hood's gun to melt), Fire Manipulation (Can
        project fire even reaching interplanetary distances), Light Manipulation (can
        create a blinding flash of light), Martial Arts (Trained by the warlords of
        Okaara, beat Donna Troy 4 times in a row, rivals Wonder Woman and equaled
        her in melee, Wonder Woman regularly fighting and equaling Ares, the embodiment
        of war with the martial arts, tactical wisdom, strategy and tactics of every
        battle in history), Acupuncture (Even without her powers can knock people
        unconscious via nerve strikes), Healing (proficient in healing, can cauterize
        a wound) Enhanced Senses (can see through cloaking devices, can hear things
        while unconscious, can feel herself being stimulated on a cellular level),
        Linguistic Assimilation (Can absorb languages via touch, mostly by kissing),
        Enhanced Beauty (Causes even animals and rock based lifeforms to be attracted
        to her), Non-Physical Interaction (Affected Raven's Soul-Self and was stated
        to be able to stop Raven despite her intangibility)., Resistance to Acupuncture
        (human pressure points don't work on her), Fire Manipulation (withstood the
        burning solar attack of the sun titaness Theia), Ice Manipulation (resisted
        being frozen), Knockout gases (knockout gases didn't work on Starfire), Memory
        Manipulation (Starfire's memories are particularly hard to read), Fear Manipulation
