        as Pandora's knives. He can also be bound or have his power temporarily sealed
        by special magics wielded by extremely skilled magicians, such as Madame Xanadu.
        When the Spectre judges souls by entering them, he often faces more difficulty
        than if he had simply rendered judgment outside the victim's soul. The Spectre
        cannot judge souls the Presence does not allow him to. Also, the Spectre was
        shown to be unable to directly affect those who can wield magic invoking the
        Presence.
