      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Constantly shifting energies and molecules can weaken him momentarily
        as he cannot adjust to the ever-changing pattern. However, he was able to
        overcome these obstacles very quickly. Absorbing too much energy or radiation
        has bad side-effects on his body. In addition, absorbing too much leaves him
        weak for a short period of time. Captain Atom has too much power, so he tried
        to help people by being a miracle worker, however, that created a chain reaction
        which led him to reaching his full potential and was going to destroy the
        entirety of the time-space continuum. Therefore, he avoids helping people
        and using too much power in fear of becoming a God again. Radiated bullets
        can temporarily nullify his Quantum aura. Notable Attacks/Techniques *Hold
        back: Captain Atom holds back for a variety of reasons, be it his internal
        conflict, or his fear of becoming a God again. In addition, if he doesn''t
        hold back, he could bring about the death of countless people. *Matter and
        energy over fists: Captain Atom rarely ever fights physically, as he has no
        need for it. Instead, he fights by using his energy and matter-related powers
        as they do the job much better. *Absorption: When faced with attacks, Captain
        Atom will try to absorb as much as of it as he can, so the damage to the people
        and environment around him is minimized. In addition, he can draw upon those
        powers to enhance his own abilities. Notes: *This only covers Captain Atom
        from the Post-Flashpoint timeline, and not his Post-Crisis incarnation or
        the original incarnation of the character from Charlton Comics. *Quantum-powered
        individuals in this continuity share similar physical characteristics, as
        well as similar abilities and weaknesses. Therefore, some of these abilities
        and weaknesses, such as absorption, are interchangeable. *Before making any
        changes to this page, please read and follow the Power-scaling Rules for Marvel
        and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
