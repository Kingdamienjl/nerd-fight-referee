- id: claim-weaknesses-480ac063
  section: weaknesses
  axis: weakness
  text: It has been suggested that Perpetua's source of power is not limitless as
    she has gathered the dark energy of universal fear and chaos every time she has
    destroyed a universe, and this source of power can be redirected through specific
    methods. The Batman Who Laughs believed that Perpetua's power had no effects on
    the energies of the Dark Multiverse and Perpetua stated that the energies of the
    Dark Multiverse posed a danger to her. Crisis Energy is not an unlimited source
    of energy and can run out. Therefore, Perpetua must gather more Crisis Energy
    from the multiverse through the psychic energies of people every time her power
    source is depleted.
  source_ids: *id003
  decisive: false
  status: unverified
