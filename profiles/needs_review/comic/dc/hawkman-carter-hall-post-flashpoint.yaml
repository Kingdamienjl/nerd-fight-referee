    - field: attack_potency
      value: Wall Level physically (Upscaling from 17 Kilojoules - By the time he
        begins operating as Hawkman, fighting supervillains on a regular basis, considering
        his athletic build, he should at least be stronger than Doctor Destiny), at
        least Small Building Level (Upscaling from 0.095 Tons - With his Nth Metal
        Axe, sliced through the same type of restraint that was being used to handily
        restrain Hawkgirl. An Nth Metal spear, used by Hawkman, could slice and pierce
        through mummies which could tank strikes from Batman), very unlikely far higher
        with Nth Metal Weapons (Carter was capable of slicing apart a solid Shadow
        Thief's arm, with Shadow Thief's solid parts, as of "Ancient History," being
        capable of tanking beams from a desperate Green Lantern - however, this would
        imply that Carter, a human who is shown to be a one-shot-difference weaker
        than Hawkgirl, can produce greater force by swinging a random sword than Hawkgirl
        can by swinging an Nth Metal Mace - an idea that is wildly inconsistent and
        on-its-face ridiculous) - See Note for an explanation as to why I don't think
        Carter's struggling with Shadow Thief scales him to ST's physicals.
