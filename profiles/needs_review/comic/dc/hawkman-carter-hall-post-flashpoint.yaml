    - field: weaknesses
      value: 'Normal Human Weaknesses, Carter is a normal human and his Nth Metal
        is never referenced as something that enhances his strength. And yet, he''s
        shown capable of physically overpowering Shadow Thief - Shadow Thief being
        shown capable of casually shattering chains that Hawkgirl couldn''t break
        while attempting to muscle out of and defeating Green Lantern in "Ancient
        History" - this is at total odds with the fact that Carter is a normal human,
        and in fact can''t even stay conscious after a single hit from Hawkgirl. The
        obvious rationale for this is that Shadow Thief, is likely more susceptible
        to Carter''s attacks than the attacks of others, as Carter could quite literally
        force ST back into his soul in that same episode. The only alternative explanation
        is that for some reason, with his bare hands, is substantially stronger than
        the woman who knocked him out in a single hit prior, and so Occam''s razor
        dictates that Carter cannot be thought of as actually scaling to Shadow Thief,
        especially not with base physicals. Note 2: Bruce Timm has stated that the
        original DCAU tie-in comics are not canon, with the only tie in comics that
        have statements to the contrary (other than Batman: The Adventures Continue,
        which has so many continuity issues that it''s essentially impossible to argue
        it''s canon) being Justice League Infinity, the Batman and Harley Quinn tie
        in comics, and specifically the first annual of Batman Adventures. Ergo'
      source_id: character-stats-profiles-hawkman-carter-hall-post-flashpoint-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
