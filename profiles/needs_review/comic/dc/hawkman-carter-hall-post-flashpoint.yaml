- id: claim-powers-and-abilities-2fb54c47
  section: abilities
  axis: hax
  text: "Carter Hall \u25BE= Superhuman Physical Characteristics, Genius Intelligence,\
    \ Weapon Mastery and Martial Arts (Hawkman is a highly skilled soldier with the\
    \ experience of thousands of lives of combat behind him, having lived the lives\
    \ of many different warriors across time, such as a medieval knight or a Wild\
    \ West gunmanHawkman Vol 5 1, perfectly remembering each and every single one\
    \ of themHawkman Vol 5 12. Even without his memories and with only crude weapons,\
    \ Carter Hall could fight multiple Man-Hawks at onceHawkman: Free. Knocked out\
    \ four soldiers in a single moveHawkman Vol 5 2. Defeated an entire army of flying\
    \ enemies in a hours-long battle, all by himself, and was confident he could even\
    \ without his maceHawkman Vol 5 3. Deemed to be the best candidate for teaching\
