      value: 'Superhuman Physical Characteristics, Genius Intelligence, Weapon Mastery
        and Martial Arts (Thanagarians are a species naturally inclined to battle.
        Katar used to be a gladiator, trained since birthThe Savage Hawkman Vol 1
        19 and so skilled that he became a worldwide celebrity and received pardonThe
        Savage Hawkman Vol 1 18. He has fought many opponents at once with various
        kinds of abilities, and has usually come out on top), Enhanced Senses (Thanagarians
        can see better than humansThe Savage Hawkman Vol 1 10), Statistics Amplification
        (By fully giving into the Nth Metal''s influence Hawkman can become much stronger,
        temporarily entering Full Combat ModeThe Savage Hawkman Vol 1 20), Flight
        and Spaceflight (Can fly in spaceJustice League of America Vol 3 14), Fire
        Manipulation (Katar can use the Nth Metal for a powerful fiery attackSavage
        Hawkman Vol 1 2), Instinctive Reaction (Thanagarians are naturally drawn to
        battle, and Hawkman''s armor always drives him to defend himself when it''s
        on, even when he doesn''t wish it to, and will also morph on the spot to block
        attacksThe Savage Hawkman Vol 1 14), Weapon Creation (The Nth Metal armor
        resides under Katar''s skinSavage Hawkman Vol 1 1, and it can appear when
        he wants or form weapons in the shape he prefersSavage Hawkman Vol 1 6, even
        unconventional ones such as a combination of claws and a small shieldThe Savage
        Hawkman Vol 1 8. His wings can also serve as weapons. The armor itself can
        also change in shape, morphing on the spot to block attacks), High Pain Tolerance
        (Doesn''t flinch when facing the extreme pain of summoning his Nth ArmorThe
        Savage Hawkman Vol 1 7), Energy Manipulation and Absorption (Nth Metal works
        by conducting mystical energyDark Days: The Forge. It can absorb energy attacks
        and be used to strike back with the same powerDark Nights: Metal Ch 5), Vibration
        Manipulation (Nth Metal can cause shockwaves when clashing with other Nth
        MetalHawkman Vol 5 27), limited Physics Manipulation (Structures built of
        Nth Metal are said to defy the laws of physicsJustice League Vol 4 14), Non-Physical
        Interaction (Nth Metal can hurt ghostsBatman Eternal 24), Invulnerability
        Negation (Nth Metal is one of the only things that can nullify the invulnerability
        of Dark Multiverse beingsDark Nights: Metal Ch 3), Regeneration (Low-Mid.
        Healed a big wound in his chest in seconds. Healed from a gunshot wound to
        his chest and a deep knife wound in a few seconds despite the assassin who
        attacked him predicting he''d be dead in that much timeThe Savage Hawkman
        Vol 1 12The Savage Hawkman Vol 1 11. After having his arm cut off, he grew
        it backJustice League United Vol 1 1Justice League United Vol 1 2. Regenerated
        from heavy burn scars. Higher over time. After being seemingly killed by an
        explosion, the Nth Metal surrounding Katar formed a cocoon around him and
        healed himJustice League United Vol 1 9), Regeneration Nullification (High-Mid.
        The Nth metal prevented some alien creatures from regenerating, whereas previously
        they could grow back from just a detached head. This nullification happens
        on the cellular level), Limited Power Nullification (Nth Metal caused Morphicius''
        teleportation to fail, and then he used it to hinder Katar''s flight abilities.
        It also cancelled a century-long spell), Limited Empowerment (The Nth Metal
        armor allowed Katar Hol to fight even when he''d otherwise collapse. It is
        also the source of his superhuman strength), Resistance to Poison Manipulation,
        Mind Manipulation and Morality Manipulation (Thanks to her own Nth Metal armor,
        Hawkgirl overcame a dose of Joker''s venomJustice League Vol 4 6. Carter''s
        Nth Armor slowed down the effect of The Batman Who Laughs''s venom meant to
        turn him evilHawkman Vol 5 20 by suppressing his consciousness in favor of
        Sky Tyrant''sHawkman Vol 5 21 and eventually overpowered itHawkman Vol 5 23),
        Disease Manipulation (Former incarnations of Hawkwoman as well as Hawkman''s
        were immune to the plague), Life Manipulation and Absorption (Absorbing Hawkwoman''s
        life essence is painful and difficult because of the Nth Metal''s properties.
        Also, each of the many reincarnations she lived through resides within her,
        and will be affected before she isHawkman Vol 5 26), Resurrection (Katar has
