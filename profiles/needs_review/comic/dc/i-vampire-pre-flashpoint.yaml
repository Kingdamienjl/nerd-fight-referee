power_scale:
  tier:
    text: 9-B | Likely at least 9-A
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level (Can bust down barred doors. Can drag people through windshields,
      toss around carsHouse of Mystery Vol 1 302 and easily leap through windows.
      Far stronger than common vampires, who can threaten and overpower Batman) |
      Likely at least Small Building level+ (Far superior to common vampires, who
      Batman believedDCU Halloween Special 2010 Vol 1 1 could hurt Damian Wayne, and
      was implied to be capable of threatening Damian himself. Smashed a large statue
      into pieces)
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman combat speed (Capable of easily controlling his bat form when
      flying at full speed, and fight those equal to him. Defeated Mary, who in an
      extremely weakened, starving state could react to and outspeed a lunging snake,
      who can attack in roughly 70 milliseconds), Superhuman travel speed as a bat
      (Caught up to and rescued a falling child. Caught up to a running car) | At
      least Supersonic+, possibly Hypersonic+ (Dodged an attack from Damian Wayne)
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class 5 (Can toss around cars, shove his hand through windshields and drag
      people through them. Can temporarily hold the weight of a hearse. Broke two
      vampires' necks with his grip, which is this strong. Halted a falling child)
      | Class K (Threw a large statue hard enough to shatter it, and easily lifted
      a plane wing)
    source_ids: &id002
    - mediawiki-4735561
    confidence: 0.95
  striking_strength:
    text: Wall level | Likely at least Small Building level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level | Likely at least Small Building level+
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Despite being completely paralyzed by a lethal substance he
      assumed, Andrew briefly managed to move again in an attempt to rescue Deborah
      Dancer. Can go for days without nourishmentHouse of Mystery Vol 1 303. Is so
      numb to pain that it looks like attacks have no effect on himDoctor Fate Vol
      2 4
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard melee range (Slightly higher with claws), several meters with hypnosis.
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Above Average. Can assume other people''s identities and pass as a human
      with relative ease, only revealing himself when he accidentally loses control.
      Can come up with ploys to survive dangerous situationsHouse of Mystery Vol 1
      314. Standard Tactics: Andrew is typically unwilling to harm humans, though
      he is far more brutal and aggressive towards vampires, and despises his vampiric
      powers, usually choosing not to use them unless necessary.'
    source_ids:
    - vsbattles-i-vampire-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
