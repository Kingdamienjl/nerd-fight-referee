- id: claim-intelligence-e4a72350
  section: power_scale
  axis: battle_iq
  text: 'Above Average. Can assume other people''s identities and pass as a human
    with relative ease, only revealing himself when he accidentally loses control.
    Can come up with ploys to survive dangerous situationsHouse of Mystery Vol 1 314.
    Standard Tactics: Andrew is typically unwilling to harm humans, though he is far
    more brutal and aggressive towards vampires, and despises his vampiric powers,
    usually choosing not to use them unless necessary.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-5060d26a
  section: weaknesses
  axis: weakness
  text: 'Vampires are hurt by proximity to silverHouse of Mystery Vol 1 316 or holy
    objects or even killed when touched by the latter or wounded by the former in
    a vital location, will be incinerated by sunlight (Though Andrew is powerful enough
    to survive blasts from UV light weapons) and require to drink fresh human blood
    as sustenance. While most vampires can be instantly killed by a wooden stake through
    the heart, this will only paralyze Andrew and slowly kill him. Andrew''s rightful
    spirit often causes him to act impulsively and attack evildoers, and when beginning
    to starve he becomes more violent, weaker and risks to fall victim to his vampiric
    instincts. Typically unwilling to use hypnosis. Note: *Before making any changes
    to this page, please read and follow the Power-scaling Rules for Marvel and DC
    Comics *Although this character was unaffected by the Crisis, due to consistency,
    his tiering was split into both his Pre-Crisis and Post-Crisis keys.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-68a65588
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Used to be a highly
    skilled warrior, when humanHouse of Mystery Vol 1 290), Bodily Weaponry (Has sharp
    fangs and can use his claws to tear apart opponentsHouse of Mystery Vol 1 305),
    Shapeshifting (Capable of shapeshifting into a wolf, a giant bat, mistHouse of
    Mystery Vol 1 291 or a ratHouse of Mystery Vol 1 313), Acrobatics (Can use his
    wolf form to swiftly traverse across rooftops. Can easily scale tall wallsHouse
    of Mystery Vol 1 297), Flight (When taking the form of a bat or mist), Intangibility
    (When taking the form of mist), Mind Manipulation (Vampires are capable of performing
    hypnosis, which Andrew can do even when paralyzedHouse of Mystery Vol 1 304),
    Sleep Manipulation (Can put others to sleep with hypnosis), Memory Manipulation
    (Can wipe memories with hypnosisHouse of Mystery Vol 1 315), Supernatural Willpower
    (When human, broke free of a vampire''s hypnosis through a memory of his beloved
    Mary. Managed to keep his humanity when turned into a vampire, with most people,
    even good ones, losing all their morality after being bittenHouse of Mystery Vol
    1 295. Despite being paralyzed by a lethal substance he assumed, Andrew briefly
    managed to move again to attempt to rescue Deborah DancerHouse of Mystery Vol
    1 319), Immortality (Type 1, 2, 3 and 7. Vampires do not age, with Andrew being
    400 years old yet not looking a day older than the day of his vampirization) and
    Regeneration (At least Mid-High over time: After being reduced to dust and "dying",
    the wind reassembled the dust and his destroyed soul, returning Andrew to life
    againDoctor Fate Vol 2 2. When he attempted suicide by facing sunlight, he was
    burned to dust, but reassembled himself once again, against his will), Corruption
    (Can turns others into vampires with a bite), Berserk Mode (Sometimes enters an
    uncontrollable rage in combat against his kind), Enhanced Senses (Can hear people
    whispering a few meters away, even if they are attempting to hide their conversation
    from him), Fire Manipulation (Set a group of crates ablaze), Extrasensory Perception
    (Can senseHouse of Mystery Vol 1 293 vampires, or the presence of silverThe Brave
    and the Bold Vol 1 195), Self-Sustenance (Type 1. Seemingly does not need to breathe
    underwaterHouse of Mystery Vol 1 308), Minor Light Manipulation (Vampires are
    not seen in reflections), Minor Resistance to Poison Manipulation (Though weakened
    by it, withstood the venom of a large spider creature for hoursHouse of Mystery
    Vol 1 312, despite it being particularly dangerous to vampires) Time Travel (Can
    travel through time with the Ring of Kur-AletHouse of Mystery Vol 1 306), Resurrection
    (The Ring of Kur-Alet resurrects skeletons that wear it), Holy Manipulation (Has
    sometimes used holy water to kill other vampiresHouse of Mystery Vol 1 311)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
