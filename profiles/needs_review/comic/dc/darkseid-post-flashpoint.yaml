        the Antimatter cannon which can destroy the Multiverse. He also consumed multiple
        Universes) | High Outerverse level (Darkseid, being a New God, lives in the
        Sphere of Gods. the Sphere of the Gods is consistently beyond the concepts
        of Space-Time. Use this map for several things I'll reference from this point
        on. The Sphere of the Gods is beyond the Bleed, which contains all dimensions.
        The Sphere of the Gods' position in the cosmology is solidified in the source
        material. Olympus is stated to be between and beyond space and time. One of
        the Gods of the Thirteen Heavens is stated to reside in a place that transcends
        place, on a day that transcends day. Both of these places are in Skyland.
        New Genesis and Apokolips are beyond the bounds of space and time, where no
        words in the human language can describe this place-that-is-not-a-place and
        this time-that-is-not-a-time. The Dreaming and the Nightmare reside in the
        space beneath space and the space beyond space. New Gods consistently being
        powerful, living ideas in a Platonic, archetypal world, and living Platonic
        shapes residing within Heaven. Platonic Forms are inherently transcendent
        to the concepts of time, space, and duality. Within the Sphere of the Gods,
        there are infinite Limbos, and infinite Heavens and Hell. Each one of the
        infinite Heavens in the Sphere of Gods is beyond Space-Time and contains Platonic
        shapes. Darkseid was referred to as the End of Existence during his fights
        where he defeated Highfather. Easily killed the Monitor, who's equal to Anti-Monitor.
        Purposely lost to Orion just so he can corrupt the Source. Darkseid was stated
        by Orion that he would've went on to destroy the Source. Defeated Jimmy Olsen
        with a Soulfire amp. Created Element X, which is the perfect material in the
        Omniverse. Element X can amp simple mortals who have no clue how to use it
        into killing Barbatos. Should scale to Indra, who can destroy all planes of
        creation. Damaged the Spectre, who would destroy all of creation if he fought
        the Phantom Stranger. Shoud scale to Siv'aa who's going to destroy all existence.
        Should scale to Yuga Khan who's gonna punch a hole straight through the Source
        which resides the same level of existence as Monitor-Mind the Overvoid, which
        is the unconscious void of nothingness that lies as the background of all
        creation, standing utterly devoid of definition, beyond the crumbling ledge
        of the Source Wall wherein Thought itself ceases to be and all dual concepts
        are dissolved into unity, it also represents the white canvas of the comicbook
        itself, being the ground of being in which all characters and concepts of
        DC Comics are drawn in, acting as the middle ground between the fictional
        reality occupied by them and the world of the Writer, and it was used by the
        Writer to draw the DC Comic Story. Darkseid and Orion were becoming everything
        which includes the Source) | High Outerverse level (Far greater than base)
        | High Outerverse level (Fought and Overpowered the Source) | High Outerverse
