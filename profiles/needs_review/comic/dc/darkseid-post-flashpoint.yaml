        (Comparable to Orion in martial skill), Immortality (Type 1; Type 4 - After
        truly dying, Darkseid resurrected himself from Orion's body; Type 8 - Returned
        to life after being destroyed by the Spectre, as he is necessary for existence;
        Type 9 - the true Darkseid exists in a higher-dimensional plane), Self-Sustenance
        (Type 1), Flight, Extrasensory Perception (Can see invisible beings and detect
        souls), Portal Creation and Dimensional Travel (Can open boom tubes at will),
        Intangible Homing Attack (Omega Beams seek out their target and can pass through
        physical barriers), Existence Erasure and Durability Negation (Omega Beams
        can erase their target from existence, making it so they never were), BFR
        via boom tubes and the Omega Effect (Can banish others by opening boom tubes
        on them or by teleporting them through space and time with his Omega Beams),
        Energy Manipulation and Matter Manipulation (Dissipated Wildfire's energy
        form in quanta; Can fire energy blasts tuned to his target's molecular structure
        to inflict the most damage), Petrification (Turned Slo-bo to stone), Transmutation
        (Changed Miracle Mister Soap to mud), Soul Manipulation (Shattered souls using
        the Omega Effect), Energy Absorption (Can absorb energy on a planetary scale),
        Forcefield Creation (Can create Omega-energy barriers), Teleportation (Can
        use Omega Beams to teleport himself as well as others), Non-Physical Interaction
        (Pulled Professor Stein out of the Firestorm Matrix; Used Omega Beams to knock
        back Secret, who was intangible), Life Manipulation (Used Omega Beams to trap
        Cyborg Superman's life force in a metal sphere; Animated a giant statue while
        trapped in the Source Wall), Resurrection (Raised a massive army of Parademons
        from the dead; Resurrected Desaad after disintegrating him), Paralysis Inducement
        and Information Analysis (Paralyzed Infinity Man and probed for his weakness),
        Aura (Can enhance physical attacks by cloaking himself in energy), Healing
        (Healed Orion from losing half his body), Duplication (Can create avatars
        from his energy while his main body is busy, such as when he was trapped in
        the Source Wall), Astral Projection (Can create images of his head that he
        can project his Omega Beams through), Power Bestowal (Imbued a baby with some
        of his power to create Validus; Granted some of his Omega Effect to Bedlam),
        Power Nullification (Removed Bouncing Boy's power), Magic (Can manipulate
        magic energy, shown when he contained Black Mary Marvel's power), Size Manipulation
        (Can adjust his size at will), Spatial Manipulation (Warped the path of Vykin's
        boom tube by will; His punch cracked the fabric of the dimension he was in),
        Time Manipulation (Bent time using the Omega Effect to accelerate the growth
        of Desaad's new body), Time Stop (Froze Godwave Ares by hardening both time
        and space around him), Time Travel (Orion stated he can easily move through
        time), Illusion Creation (Made illusions for Superman and Wonder Woman to
        fight; they were fooled until Darkseid gave himself away), Creation (Used
        his energy to create the opposite of Takion, Stayne; Can recreate his followers
        from inanimate objects), Telekinesis (Restrained Superman and Infinity Man
        in the air), Telepathy (Can drain information from minds and read them in
        an instant), Mind Manipulation (Simultaneously controlled three billion Pre-Crisis
        Daxamites), Empathic Manipulation (Reversed the effects of a feeling-altering
        soap), Pain Manipulation (Can use the Omega Effect to cause pain, such as
        with Pre-Crisis Supergirl), Biological Manipulation (Deformed Dream Girl and
        short-circuited the League's brain impulses), Corruption (His clone servants
        were corrupted by his power), Heat Manipulation (Incinerated Kalibak's flesh
        by touching him), Weather Manipulation (Created a tornado and storm), Summoning
        (Can summon forces from Apokolips as well as summon distant targets using
        Omega Beams), Technology Manipulation (His Omega powers can tamper with advanced
        technology) Resistance to Existence Erasure (Stated that his body resists
        the effects of his Omega power and no-sold Lex Luthor's weapon that rips apart
        existence), Sealing (Removed bindings created by the Alpha Effect), Telepathy
        (Resisted being telepathically scanned; Martian Manhunter stated New Gods
        are hard to touch telepathically), Mind Manipulation (The strongest minds
        were ravaged just from seeing the Omega Effect, while Darkseid was able to
        immerse himself in and absorb all of it), Empathic Manipulation (Was immune
        to Bekka's love inducement), Fear Manipulation (Was immune to Desaad's fear-inducing
        machine), Possession (Stated that Eclipso's possession wouldn't work on him),
        Electricity Manipulation (Black Mary Marvel's magic lightning had no effect
        on him), Ice Manipulation (Was unaffected by Superman's freeze breath), Extreme
        Cold and Cosmic Radiation (Can fly in space unharmed) | All previous abilities
