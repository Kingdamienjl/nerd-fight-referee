    Puppetry (Forced Jason Blood to bring forth Etrigan), Ice Manipulation (Froze
    a ninja solid with a touch), Necromancy, Smoke Manipulation and Death Manipulation
    (Dispersed his cigarette smoke into plants, causing them to rapidly grow then
    die. By sclicing off a piace of his soul, cast a spell that could kill everyone
    around him), Illusion Creation (Showed images of events happening across the world.
    Created an animated projection of Mictlantecuhtli from his phone), Portal Creation
    and Sealing (Can open portals to travel to other locations for himself and others.
    Opened the portals leading to Hell in Los Angeles and sealed them again), Astral
    Projection (Sent a projection of himself to Swamp Thing), Invisibility (Made himself
    and the other heroes invisible on Apokolips), Technological Manipulation (Undid
    Darkseid's reprogramming of Cyborg), Creation (Can conjure various objects. Created
    chains to restrain and gag Jason Blood), Sleep Manipulation (Put the Flash to
    sleep), Summoning (Can summon the House of Mysteries, demons and gods), Non-Physical
    Interaction (Used Magic to make the Shrouds, spirits that can drag souls to Hell,
    disappear. Made Deadman visible to human eyes), Absorption (Absorbed his inner
    demons back into himself), Platform Creation (Created a platform made of fire),
    Teleportation (For himself on short range) Holy Manipulation (With Holy Water),
    Explosion Manipulation (With a playing card), Petrification (Turned a Parademon
    to stone), Clairvoyance (Has a special needle in locator spells that can locate
    people across the world), BFR (Can banish spirits with a magical seal), limited
    Dimensional Storage (Can encase himself in a crystal to survive attacks), Dimensional
    Travel (With the Keshanti Key, which allows him to access different planes of
    existence, including memories)
