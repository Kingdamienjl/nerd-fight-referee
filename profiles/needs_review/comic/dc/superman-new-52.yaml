  axis: weakness
  text: 'Kryptonite (various varieties), he is entirely dependent on the Stellar Radiation
    of a Yellow Star to sustain his powers (if he''s deprived of Sunlight, he slowly
    loses his powers), the Stellar Radiation of a red star (weakens him due to red
    Stellar Radiation having less energy than that of a yellow or blue star), Magic
    (susceptible to it instead of weak against it, since he resisted a magical blast
    which could destroy a planet to some extent), he cannot see through lead, and
    is left as vulnerable as a regular human after using Super Flare for 24 hours
    before being able to use his powers again Feats: * Stopped Brainiac''s larger-than-Earth
    ship from crashing into Earth with help from the Martian Manhunter * Pushed a
