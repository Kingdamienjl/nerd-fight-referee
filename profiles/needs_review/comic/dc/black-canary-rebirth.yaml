        to keep up with Vixen and Hawkgirl in combat (dodging attacks from both),
        and was overtly equal in speed to Huntress, who dodged strikes from a bloodlusted,
        mind-controlled Wonder Woman and showed equal combat speed to Roulette, who
        side-stepped the Canary Cry at close range. Could have held her own against
        Wildcat, who repeatedly tagged Green Arrow), Speed of Sound attack speed with
        Canary Cry (The Canary Cry is a projectile sound wave), and Subsonic travel
        speed with her motorcycle (Scaling to high-end IRL motorcycles)
      source_id: character-stats-profiles-black-canary-rebirth-dc
      provider_id: character_stats_profiles
