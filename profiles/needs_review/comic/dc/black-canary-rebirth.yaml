        far above a grown man''s head) *Acrobatics (Demonstrates incredible acrobatic
        prowess, such as doing constant flips and cartwheels, wall running into a
        wrestling drop, etc) *Sound Manipulation via Canary Cry (Her Canary Cry attack
        is a powerful projectile soundwave that devastates all it touches) *Vehicular
