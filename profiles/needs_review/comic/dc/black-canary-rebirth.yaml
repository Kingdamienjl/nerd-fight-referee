    - field: weaknesses
      value: 'Normal Human Weaknesses. Anything that impacts her ability to speak
        seemingly also impacts the force of her Canary Cry. Note: Bruce Timm has stated
        that the original DCAU tie-in comics are not canon, with the only tie in comics
