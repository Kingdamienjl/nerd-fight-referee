        a variety of melee weapons and firearms), Stealth Mastery (Vanished from Deathstroke's
        sight in an eye blink, disappears on the Gotham siblings despite their enhanced
        senses, The JLA, including Superman, Zatanna, Blue Beetle, and Constantine,
        have trouble finding him, can sneak up on Superman), Hacking (Hacked into
        an alien computer despite not even knowing its language), Body Control (Can
        make 10 minutes worth of air last an hour), Social Influencing, Regeneration
        (Mid-Low; His exposure to Dionesium gave him a healing factor that healed
        all of his scars and enhanced his speed), Enhanced Senses, (Can see Deadman
        and smell fear), Extrasensory Perception (Detected the Spectre), Vehicular
        Mastery (Can drive, sail, and fly with incredible efficiency), and Immense
        Willpower Enhanced Senses (His cowl has night vision and optical zoom, as
        well as x-ray vision), Information Analysis (Can scan biology and in seconds
        know details of a foe down to the cellular level), Illusion Creation (Uses
        EMP tech to disguise himself via holograms), Electricity Manipulation (His
        suit can discharge electricity powerful enough to faze Cyborg, and he can
        also discharge AOE blasts), Sound Manipulation (Has sound cannons in his chest,
        which is strong enough to dispel magical constructs), Heat Manipulation (His
        gauntlet can be superheated), Sleep Manipulation (Possesses tranquilizer darts
        in his gauntlet), Absorption (Absorbed energy and sent it back as electricity),
        Attack Reflection (Can send energy attacks right back at opponents with energy
        rejector systems), Energy Projection (Has lasers that can cut through inches
        of metal in seconds), Smoke Manipulation (Has smoke grenades in his teeth,
        and regularly creates smokescreens), Explosion Manipulation (Has explosives
