    - field: powers_and_abilities
      value: Superhuman Physical Characteristics (See Speed), Empowerment (Is empowered
        by her Fuchsia gem), Weapon Mastery (Stated to wield her gem with "the same
        physical and mental dexterity that Green Lantern exhibits with his power ring"),
        Energy Projection (Can fire energy blasts from her gem, which is her main
        mode of attack), Pseudo-Telekinesis (Can lift and carry things with energy
        beams), Forcefield Creation (Can create barriers to protect herself and transport
        things), Resistance to Cosmic Radiations (A barrier she created, which would
        only be an elaboration of the skintight energy barrier she always has around
        her body, seemingly protected her, Grundy, and The Shade from the radiations
        of outer space)
      source_id: character-stats-profiles-star-sapphire-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Varies (Can clearly control the energy of her blasts, as in some instances
        they can harm and contend with high-tier Metahumans, yet in one instance where
        she's fighting Batman (who she knows isn't a Metahuman, and thus probably
        assumes he doesn't merit her wasting her full power against him) all they
        do is chip walls and destroy sections of floors), up to Brown Dwarf Level
        at her peak (Scaling to 1.002 Quettatons - Cancelled out two blasts from Green
        Lantern, beam struggled with him, and broke his construct with a volley of
        8 blasts. Can temporarily down JL Season 1 Superman with a blast to the back
        of the head - despite the fact that Bruce Timm himself admits JL Season 1
        Superman is plot-nerfed, he's still powerful enough to fight evenly with the
        likes of Solomon Grundy and Wonder Woman, and can overpower beams from Manhunters
        who can beam struggle with a serious Green Lantern. One-shot both Wonder Woman
        and Hawkgirl with blasts. Blasted back the Flash. Sliced through a huge metal
        door. Casually burst through a sidewalk)
      source_id: character-stats-profiles-star-sapphire-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Varies (At her lowest ends, she gets blitzed by Batarangs and her own
        beam reflected back at her), likely Relativistic+ reactions and combat speed
        (Scaling to 0.53c - Dodged a swing from Hawkgirl. Reacted to a Lantern beam
        and cancelled it out with her own blast - Lantern Beams being shown to move
        at the Speed of Light. Dodged her own beam reflected back at her. Avoided
        a beam from the JL Javelin. Dodged an energy blast from a Parademon), with
        Speed of Light attack speed with Energy Beams (Her beam could intercept a
        Lantern Beam in flight and cancel it out, is stated to be very similar to
        a lantern beam, and reflects off mirrors as light would), and at least Supersonic
        flight speed (Flew to high orbit in an indeterminate (but implied to be short)
        period of time)
      source_id: character-stats-profiles-star-sapphire-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Varies (If she isn't expecting a certain attack, her energy barrier will
        disappear, resulting in her being hurt by a statue hitting her and a barrel
        of oil blowing up), generally Brown Dwarf Level (Scaling to 1.002 Quettatons
        - Her energy shield that's always around her body should be the same thing
        as the energy that composes her blasts, and allowed her to withstand being
        hit with a massive gun thrown at her by Wonder Woman. Took swings from Hawkgirl,
        though whether or not she was holding back in this instance is difficult to
        determine), Small Star Level with barriers (Scaling to 8.018 Quettatons -
        Should obey the same rules as Green Lantern's, and withstood his beam without
        even slightly cracking)
      source_id: character-stats-profiles-star-sapphire-post-flashpoint-dc
      provider_id: character_stats_profiles
      authority: high
