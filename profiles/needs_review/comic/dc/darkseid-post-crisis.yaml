- id: claim-weaknesses-de048da7
  section: weaknesses
  axis: weakness
  text: 'Darkseid is vulnerable to radion, a lethal substance to New GodsIt should
    be noted, however, that powerful New Gods like Kalibak are able to easily survive
    normal radion shots. When Darkseid was shot and weakened by the radion bullet
    he was already dying. Moreover, in order to fully incarnate in a lower plane of
    reality by possessing a human body, a noble soul must be corrupted, otherwise
    the process is not fully successful. Feats: Show/Hide |-|Base= * Used his energy
    to create Stayne, a being that proved to be a perfect match against Takion, and
    possessed all his powers * His anger scared the Lords of Chaos * Disintegrated
    Agogg, a being capable of easily overwhelming base Orion * Played around with
    John Stewart and his Darkstar team for exercise (Darkstars are the equals of Green
    Lanterns) * Wiped Vundabar from existence * Darkseid is so powerful that time
    collapses when he''s removed from his proper place in the timestream * Absorbed
    energy from Excalibur and stated he could accidentally destroy his servants that
