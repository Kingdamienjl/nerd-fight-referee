    - field: weaknesses
      value: 'Darkseid is vulnerable to radion, a lethal substance to New Gods. It
        should be noted, however, that powerful New Gods like Kalibak are able to
        easily survive normal radion shots. When Darkseid was shot and weakened by
        the radion bullet he was already dying. In order to fully incarnate in a lower
        dimension by possessing a human body, a noble soul must be corrupted, otherwise
        the process is not fully successful. Feats: * Knocked out Superman with a
        single blast of Omega Beams * Destroyed world after world, killing Supermen
        throughout the multiverse * Fought against Earth-2 Alan Scott, who had absorbed
        every Parliament in addition to the Green and unlocked the "potential of the
        multiverse...the true power of the green" * [After power-up] Fought against
        the Anti-Monitor, which threatened to unravel history * [After being reborn]
        Killed Zeus by absorbing all his life force, in order to age himself back
        to adulthood Notable Attacks/Techniques: Omega Effect: The Post-Flashpoint
        emanation of Darkseid gained his Omega powers by absorbing the energies of
        dead Old Gods, although that origin story is somewhat contradicted by the
        one Highfather tells. The Omega Effect is said to be infinite, and granted
        Darkseid a variety of powerful abilities. * Omega Beams: Darkseid can fire
        extremely fast, homing beams of energy from his eyes. It is important to note
        that the Post-Flashpoint emanation of Darkseid has not demonstrated the same
        versatility with Omega Beams that the Pre-Flashpoint emanation did, and they
        seem to simply be powerful energy attacks. * Energy Shockwaves: Darkseid can
        create shockwaves of energy by raising his hands. * Spacetime Warping: Darkseid
        can generate a gravitational pull so intense that space twists and time is
        pulled, so that those inside live days between seconds. Boom Tubes: Darkseid
        can activate boom tubes at any time, which allow him to teleport through space
        and across dimensions. Telepathy: Darkseid is able to force his mind into
        others'' from across dimensional gaps. Notes: *Before making any changes to
        this page, please read and follow the Power-scaling Rules for Marvel and DC
        Comics. *The Post-Flashpoint emanation of Darkseid was stated to be a fragment
        of Godhead Darkseid that resulted from his death in Final Crisis. The Post-Flashpoint
        emanations of New Gods have very different histories, power-sets, and power
        levels than the Pre-Flashpoint emanations. *Prior to the events of Darkseid
        War, Darkseid obtained a powerup of unknown origins. Due to this, do not attempt
        to use Darkseid to scale other Post-Flashpoint 4-B characters to the Anti-Monitor.
