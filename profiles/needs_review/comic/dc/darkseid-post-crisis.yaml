    been destroyed/trapped in limbo |-|Godhead= * Won the war in heaven against New
    Genesis * [While dying] Broke the Orrery of Worlds across all of time and nearly
    dragged all its contents into a Multiversal singularity (that was explicitly Darkseid''s
    own singularity, not something that happened to already be there) that was one
