      larger than the state of New York. Darkseid is responsible for some of the most
      advanced scientific breakthroughs in the DCU, creating technology capable of
      penetrating the Source, accessing the realm of Anti-Life, stealing part of the
      Anti-Life Entity's power, combining and manipulating fragments of the Anti-Life
      Equation, and turning Mars into a copy of Apokolips. His mind is also extremely
