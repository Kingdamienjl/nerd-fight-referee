- id: claim-powers-and-abilities-6749a6fe
  section: abilities
  axis: hax
  text: 'Pre-Cataclysm= *Superhuman Physical Characteristics *Inorganic Physiology
    (Type 2; Similar to Preston Payne, his blood is more akin to mineral virus while
    the rest of his body is made of clayThe Outsiders Vol 4 #22, His biosystem contains
    almost no trace of recognisable human biological materialBatman: Gotham Knights
    #70) **Self-Sustenance (Type 1 & 2; Came back offscreen from being launched into
    space by Mary Marvel, Does not need nutrients to survive anymoreBatman: Shadow
    of the Bat #88) *Skilled Hand-to-Hand Combatant (Said to be a fierce hand-to-hand
    combatantWho''s Who: The Definitive Directory of the DC Universe #5, was able
    to outmatch Robin in a fight) *Skilled Knife User (Has shown skill with a knife
    to be able to make it stand on his fingertips without supportDetective Comics
    Vol 1 #607 as well as implied to be a good knife throwerSecret Origins Vol 2 #44)
    *Social Influencing (Self-proclaimed as one of the greatest actors of our time
    and able to play the roles of almost anyone, Was able to trick Wonder Woman and
    Donna Troy when disguised as Superman and CheetahWonder Woman Vol 2 #161Wonder
    Woman Vol 2 #160 as well as many others in his other disguises, Manipulated Clayface
    IV into doing his bidding when he was part of the Mudpack), *Regeneration (At
    least High-Mid; Has quickly reconstituted his body from being sliced in halfTitans
    Vol 2 #29 and being blown upBatman Confidential #21, Likely Mid-High overtime;
