- id: claim-weaknesses-9d300d6f
  section: weaknesses
  axis: weakness
  text: 'Extreme cold or heat is good at turning his body''s fluidity into solid,
    allowing him to be temporarily subduedGotham City Sirens #24. Heat up to 1,000
    degrees Celsius to his clay core undermines his basic cellular structure. Sufficiently
    powerful sonics is able to disrupt his metabolismArkham Reborn #3. Water can melt
    down his body structureDC Comics Presents: Batman. People that he has absorbed
    is able to be removed through certain poisonous gases. Crowbars are able to trigger
    PTSD within him, making him blind with rageGotham City Sirens #20. Notable Attacks/Techniques:
    *Deadly Touch: Gained from Preston Payne''s blood, Basil is able to surround parts
    of his body with a special enzyme that''s capable of turning whatever organic
    material it comes in contract with into protoplasm whilst inorganic material will
    melt away like butter. *Absorption: Gained from Sondra Fuller''s blood, Basil
    is capable of increasing his strength and size by absorbing others into himself,
    and also capable of gaining unique properties of different minerals or clay via
    absorbing them them into his body as well. Note: Before making any changes to
    this page, please read and follow the Power-scaling Rules for Marvel and DC Comics.
