    - field: attack_potency
      value: Large Planet Level (Upscaling from 1.03 Ronnatons - Obliterated magical
        restraints that Superman couldn't budge, and was a consistent opponent of
        Karkull, a magical being strong enough that Doctor Fate believed Superman
        stood no chance against him - though Superman is weakened by magic, he can
        still defeat magical beings like Solomon Grundy and Captain Marvel with (relative)
        ease. Stated to, alongside Superman and AMAZO, be a "big gun" of a group of
        Leaguers despite said group including Green Lantern, who was not considered
        to be one of said "big guns." Stronger than Inza (who said her powers would
        be essentially useless against Karkull, whereas Fate was a consistent opponent
        of Karkull for many years), who easily created a restraint that totally restrained
        Wonder Woman and was too powerful for Superman to even budge - though his
        magic weakness should be considered here. Should be comparable to, if not
        stronger than, sorcerers like Klarion, Tala, Felix Faust, and the like), possibly
        as high as Large Star Level (Scaling to 1.664 Foe -As mentioned above, consistently
        battled Karkull, whose claws could rip apart Superman's extremely durable
        suit), or even far higher (Stated to have been taught unlimited power, and
        was able to kill several of the "Lovecraftian" old ones. See here for my reasoning
        as to why DCAU Superman is not Low Complex Multiversal)
