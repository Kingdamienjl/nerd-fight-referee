- id: claim-powers-and-abilities-8fd8d77e
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Immortality (Types
    1 and 2), Self-Sustenance (Types 1, 2, and 3), Flight, Energy Manipulation (Can
    surround his hands with energy and channel it into physical strikes), Energy Projection
    (Can fire energy blasts), Aura (Monitors can release a damaging energy aura in
    all directions), Absorption (Monitors can drain others of energy), Forcefield
    Creation (Monitors can make spherical barriers that can shield from mental damage),
    Time Stop (Monitors can stop time using chrono-paralyzers), Teleportation (Monitors
    can teleport themselves and others across dimensions), BFR (Monitors can forcefully
    teleport others away), Telepathy (Monitors can sense others'' hearts), Perception
    Manipulation (Monitors can go unnoticed by others), Sleep Manipulation (Monitors
    can put others to sleep) Cosmic Awareness (Can see what''s happening throughout
    reality), Creation and Space-Time Manipulation (Rebuilt Earth-51 for the Orrery),
    Summoning (Can summon any other being to his side), Radiation Manipulation (Fired
    red sun radiation from a hundred stories), Resurrection (Revived Godhead Darkseid
    after his death in Final Crisis), Resistance to Mind Manipulation and Morality
    Manipulation (Was completely unaffected by Anti-Life even as a powerless human)
    All previous abilities to a much greater degree, plus: Abstract Existence (Type
    1; Monitors are archetypal inhabitants of Nil, a world within the Monitor Sphere,
    a plane of existence that vastly transcends the platonic, archetypal Sphere of
    the Gods), Beyond-Dimensional Existence, Large Size (Type 10), Incorporeality,
    Intangibility, Size Manipulation and Dimensional Travel (Can alter both his scale
    and pitch to enter lower dimensions and traverse the Multiverse), Plot Manipulation
    ("Makes moments" in the story with his power)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
