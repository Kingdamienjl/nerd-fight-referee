      value: 'Explanations about how the power or ability can be applied. ==Types
        of Gods== 1. Old God: The Old Gods of the First World were an ancient race,
        whose annihilation paved the way for the Gods of Earth and other worlds, as
        well as Apokolips and New Genesis in the Fourth World. 2. New God: The New
        Gods, beings born from the ashes and dust of the Old Gods millions of years
        after a long battle, reside within that of The Sphere of Gods otherwise known
        as The God Sphere. Though there are many more areas in the DC Omniverse where
        New Gods might be found, Apokolips and New Genesis are two of the most well-known.'
      source_id: character-stats-profiles-mister-miracle-dc-comics
