    - field: weaknesses
      value: 'Radion: New Gods are vulnerable to a substance called Radion. Its source
        is unknown and its effects are toxic only in sustained amounts or after explosive
        exposure. The average New God can be slain by an application of Radion from
        a Radion blaster or bomb. More advanced beings such as Mister Miracle, protected
        by their mother box, armor, and sheer toughness have been known to take up
        to two hits and survive. Radion, must be hard to come by because if it was
