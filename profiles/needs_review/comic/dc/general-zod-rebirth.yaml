    - field: weaknesses
      value: 'Becomes as vulnerable as a human when exposed to either red suns or
        environments under their effect. Devoted to his duty and "his people" (Kryptonian
        bloodlines deemed by him to be strong) above all else. Initially upon his
        arrival to the Earth, sensory overloads would occur if he did not have his
        protective visor on, however this problem was later dealt with as Zod adapted
        to Earth''s yellow sun environment Notable Attacks/Techniques: *Anti-Gravity
        Field Creation: It is unknown how Zod did this. Upon releasing himself from
        his Battle Armor and levitating, the armor floated around him in the air for
        many centimeters, however this ability does not seem to be useful for battle.
        *Solar Energy Absorption: As a native Kryptonian, Zod''s cells can absorb
        yellow solar energy which fuels all of his powers and abilities. *Heat Vision:
