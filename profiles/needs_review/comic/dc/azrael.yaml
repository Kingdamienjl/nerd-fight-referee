        \ (Not only survived being forcibly encased in ice for two years, but wasn't\
        \ even weakened by the time he got out. Was also trapped in a space between\
        \ dimensions for several days with no food or water without any detriment\
        \ to his health or conditioning), Causality Transcendence, Enhanced Senses\
        \ (The Boundary is a realm of nothing that stands above dimensional space.\
        \ Smelt the blood of individuals that Valkenhayn killed decades before Azrael\
        \ was ever born. Felt Ragna staring at him with murderous intent from miles\
        \ away. Can sense the sensations of supernatural weapons like Nox Nyctores.\
        \ Can also sense if powerful enemies are within his vicinity. Eventually figured\
        \ out that he was fighting an \u201Castral projection\u201D of Hakumen rather\
        \ than the actual individual. Azrael can also feel the motivation behind people's\
        \ attacks. Can detect the presence of those that are blessed with external\
        \ supernatural boons. Was a bit more perceptive that Hades Izanami wasn\u2019\
        t exactly alive. Something that even entities with high level information\
        \ analysis like Lambda couldn't gain a solid grasp on due to Hades' nature\
        \ as the antithesis of existence), Extreme Hand to Hand Combat Skill (Azrael\
        \ has his own set of special moves that increase his strength and immediate\
        \ speed output. Azrael is also skilled enough to evenly combat Observers/Those\
        \ who have matched Observers despite said Observers\u2019 knowledge. Observers\
        \ have an incredible mind\u2019s eye that they use to do things like create\
        \ perfect battle-clones of other beings or even phenomena in history. Hakumen-\
        \ An individual whose mind inadvertently recreates extremely accurate thought-form\
        \ versions of environments/other people has such a great mind's eye that he\
        \ can predict the attacks of people he's fought for the very first time. Azrael\
        \ has stood his ground against the likes of Ragna The Bloodedge. Ragna has\
        \ beaten Yuuki Terumi in a head on fight. Yuuki Terumi is an Observer who\
        \ has not only seen Ragna fight thousands of times but \u201Cremembers\u201D\
        \ every time he's fought Ragna during the Continuum Shift. The Continuum Shift\
        \ was an expansion of the multiverse that was so large that even Takamagahara:\
        \ An entity who kept an iron grip on it in the first game due their pervading\
        \ surveillance over every timeline in the multiverse needed extensive time\
        \ to record all the events of the Continuum Shift), Energy Manipulation, Absorption\
        \ (Has raw energy that uses in combat. Which ranges to absorbing attacks,\
        \ shooting projectiles after said absorptions and unleashing giant blasts\
        \ of raw destructive force), Meta-Spatial Manipulation (through Requiem's\
        \ Phenomenon Intervention time-freeze. Said time freeze was difficult for\
        \ even walking Boundaries like Ragna The Bloodedge to break through due to\
        \ how \u201Cdense\u201D it was. Azrael also used this power to undo Kokonoe's\
        \ Intervention Ars, which taps into another's very nervous system to effectively\
        \ communicate with them from long distances) Non-Physical Interaction, Ontological\
        \ Law/Invulnerability Negation, Deathless, Resurrective, Reliant, and True\
        \ Godly Regenerative Immortality Negation along with Indomitable Willpower\
        \ Negation (Can harm Hades Izanami. Whose invulnerable to to attacks from\
        \ most things/individuals in the BlazBlue franchise due to her being the antithesis\
        \ of possible outcomes in and of themselves. Can kill Uncertain Factors, beings\
        \ who are neither alive or dead due to existing as consciousness itself. Should\
        \ also be able to kill those deeply Outside of Logic, as his reactive levels\
        \ are par with those who can, like Power of Order Users. Is also far above\
        \ individuals like Chronophantasma Platinum The Trinity, who killed Hazama\
        \ despite his Life-Link with Mu-12. Is infinitely above ChronoPhas Ragna in\
        \ terms of being able to permanently kill Nu-13 despite her ability to resurrect\
        \ from having her the beyond dimensional seithr that\u2019s integral to her\
        \ history be erased by a Narrow Space with sheer willpower), Layers of Reactive\
        \ Power Level and Reactive Evolution (Azrael\u2019s body reactively evolved\
        \ so that his memories were not manipulated by the Embryo. The Embryo purposefully\
        \ absorbed the ontological information of the multiverse whilst enhancing\
        \ its own existence to make sure that infinite iterations of individuals like\
        \ Makoto Nanaya, Jubei, and Litchi Faye-Ling wouldn't reactively adapt to\
        \ the Embryo\u2019s memory manipulation across a myriad of timelines. While\
        \ normal humans naturally have a capacity to resist seithr in small doses,\
        \ Litchi resisted the negative effects of the Azure for 2 whole years with\
        \ her natural three-dimensional constitution. As a member of the Beastkin\
        \ race, Jubei's three-dimensional body was naturally capable of growing to\
        \ a level that it produces beyond-dimensional power and has resistance to\
        \ powers on such a scale. Jubei had once even exceeded The Power of Order\u2019\
        s reactive capabilities. The Powe"
      source_id: character-stats-profiles-azrael-dc-comics
