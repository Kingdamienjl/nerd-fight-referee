- id: claim-powers-and-abilities-40bf76a2
  section: abilities
  axis: hax
  text: "Genius Intelligence, Extrasensory Perception, Enhanced Senses (Can see magic\
    \ and souls, the latter in the form of a \"ba\"), Martial Arts (Fought off hordes\
    \ of small demons while nearly depletedFlash #776), Power Modification, Blood\
    \ Manipulation (His blood is unusually powerful due to royal pharaoh heritageDoctor\
    \ Fate (Volume 4) #12), Supernatural Willpower (has demonstrated a supernatural\
    \ willpowerDoctor Fate v4 issue 2) | Superhuman Physical Characteristics, Elemental\
    \ Manipulation (With the power of the helm, Doctor Fate has the ability to control\
    \ the elementsDoctor Fate v4 issue 4), Fire Manipulation, Air Manipulation (Can\
    \ control air and supernaturally move it), Water Manipulation (Can prevent a flood\
    \ from occurring by controlling waterDoctor Fate v4 issue 2),Transmutation, Earth\
    \ Manipulation (Can control the ground and the earth, manipulating its shapeDoctor\
    \ Fate v4 issue 15), Electricity Manipulation (has been shown to freely manipulate\
    \ electricity), Creation, Sealing (Can create locks which indirectly act as a\
    \ method of sealing somethingDoctor Fate v4 issue 14 His wardings around his Tower\
    \ were powerful enough to withstand assault from both Zatanna and Supergirl simultaneously\
    \ as well as Blue Beetle and Cyborg's alien-energyLazarus Planet: Alpha #1), Telepathy\
    \ (Has shown the ability to telepathically communicate), Time Manipulation (Has\
    \ shown the ability to travel through timeDoctor Fate v4 issue 4), Time Stop (with\
    \ the Helm, Doctor Fate can stop time for a whileDoctor Fate (Volume 4) #16),\
    \ Illusion Creation (has demonstrated the ability of create illusionsDoctor Fate\
    \ v4 issue 14), Intangibility (With the help of the helm, Doctor Fate can become\
    \ intangible and even pass through other objectsDoctor Fate v4 issue 4), Healing\
    \ (Under the influence of the helm, Doctor Fate can easily heal himself from injuriesDoctor\
    \ Fate v4 issue 2), Breaking the Fourth Wall (Asked the reader to help guide him\
    \ and Wally West homeThe Flash #776), Precognition, Cosmic Awareness, Soul Manipulation,\
    \ Telekinesis (through his words he can telekinetically control objects), Energy\
    \ Projection (Can project energy blasts from His hands), Deconstruction (His energy\
    \ blasts have been shown to deconstruct thingsDoctor Fate v4 issue 18), Flight\
    \ (Has shown the ability to flyDoctor Fate v4 issue 2), Technology Manipulation\
    \ (The helm has been shown to be able to supernaturally interact with TechnologyDoctor\
    \ Fate v4 Issue 2), Absorption, Energy Manipulation, Explosion Manipulation (Has\
    \ demonstrated the ability to absorb sums of energy from his surroundings, and\
    \ output it in a single concentrated blast causing a large explosionDoctor Fate\
    \ v4 issue 3), Teleportation (Has been show to teleport at timesDoctor Fate v4\
    \ issue 6), Immortality (Type 2; has been shown to survive and roam free while\
    \ his heart is separated from his bodyDoctor Fate v4 issue 7), Clairvoyance (His\
    \ magic can direct him to someone\u2019s exact location if he can imagine what\
    \ they look likeDoctor Fate v4 issue 9), Light Manipulation (Has been shown to\
    \ be able to output a bright lightDoctor Fate v4 issue 10), Forcefield Creation\
    \ (Can create barriers to defend himself with his magic), Statistics Amplification\
    \ (Can use his magic to amplify his physical strengthDoctor Fate v4 issue 14),\
    \ Automatic Translation (His magic allows him to translate foreign languagesDoctor\
    \ Fate v4 issue 17), BFR (Can send god-like beings to their own dimensionsDoctor\
    \ Fate v4 issue 18 With Zatanna's assistance and while granting Superman the Helm,\
    \ managed to banish XanadothSuperman (Volume 5) #24), Resistance to Mind Manipulation\
    \ (Classical powers of the Amulet)"
