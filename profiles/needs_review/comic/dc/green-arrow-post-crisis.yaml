    Canary, he can shoot 26 arrows a minute.Green Arrow Vol 3 12 Shot a man''s nose
    off from a great distance away.Green Arrow Vol 4 1 Took out an entire invading
    force in one sweep.Green Arrow 80th Anniversary 100-Page Super Spectacular Matched
    DeadshotDeadshot Vol 2 5 and trounced Mirror Master, two extremely skilled marksmen.Green
    Arrow Vol 3 55 Shot the hand of Cupid who was situated on top of a dam.Green Arrow
    and Black Canary Vol 1 29 Hit a forcefield device that was 400 meters away.Green
    Arrow and Black Canary Wedding Special Shot a sniper in such a way that his bullet
    struck a faraway canister of acid.Legends of the Dark Knight Vol 1 131 Even while
    rusty, he performed a feat that one of the greatest archers on Earth admitted
    they couldn''t pull of.Green Arrow Vol 2 0 Consistently shootsGreen Arrow Vol
    2 1 objects outLegends of the DC Universe Vol 1 7 of peoplesGreen Arrow Vol 2
    6 hands,Legends of the Dark Knight Vol 1 128 otherGreen Arrow and Black Canary
    Vol 1 16 archersGreen Arrow Vol 3 59 arrows,Black Canary Vol 1 1 andGreen Arrow
    Vol 2 3 movingGreen Arrow Vol 4 7 targets.The Question Vol 1 18 Shot the wick
    of a candlestick without harming the candle itself.Green Arrow Vol 1 1 A recently
    awakened from a coma Ollie was able to bullseye and split his own arrow,Legends
    of the DC Universe Vol 1 8 a feat only the best archers in the world can perform.
    Has fired off numerous arrows at once), Weapon Mastery In addition to arrows,
    he is also a skilled swordsman,Green Arrow Vol 3 71 firearm operator,Green Arrow
    Vol 2 85 and stick fighterRise of Arsenal Vol 1 4), Stealth Mastery (Broke into
