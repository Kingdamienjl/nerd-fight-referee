      value: 'Low Complex Multiverse level (Superior to Nabu. Was able to battle Zero
        Hour Parallax, although he was temporarily defeated), higher with the power
        of Earth''s sorcerers (Overcame the Anti-Monitor at the dawn of time and caused
        the multiverse to be rewritten) | Low Complex Multiverse level (Froze Neron,
        and all of Hell, by removing all hellfire from it, Hell being the reflection
        of Heaven, an infinite multiverse. Kyle Rayner said he made Parallax look
        like a joke) | Low Complex Multiverse level (Casually imprisoned and tortured
        Neron. When Hal first became the Spectre he considered the power far greater
        than he ever had as Parallax) | Low Complex Multiverse level (Fought on par
        with the Butcher and stopped it from taking Atrocitus) | Outerverse level
        (Superior to Phantom Stranger according The Batman Who Laughs.Year of the
        Villain: Hell Arisen Vol 1 2 The Quintessence is the highest order of beings
        in the Multiverse and exists on the same level of existence as the Sphere
        of the Gods.Infinite Frontier Vol 1 0 Overpowered Emerald Knight John Stewart,Justice
        League Vol 4 75 and fought Raven with her being nearly overwhelmed if it wasn''t
        for Jim Corrigan bonding with the Spirit of Vengeance, and the Spectre''s
        power was weakened under Pariah''s controlDark Crisis: War Zone Vol 1 1) |
        Outerverse level+ (The Spectre''s powers are usually limited by his human
        host, but Unbound Spectre is not Spectre Vol 4 10) | High Outerverse level
        (By breaking the constraint of individual identity, the Spectre accessed his
        true nature, a spirit merged with the Logoz. He merged with the Void beyond
        Voids and is directly connected to the Oversoul itself)'
