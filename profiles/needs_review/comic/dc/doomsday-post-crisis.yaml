  origin: '420px|right |-|Modern=420px|right ==Summary== Doomsday was created on prehistoric
    Krypton thousands of years ago by a scientist named Bertron as a bio-mechanical
    super-soldier and living weapon of mass destruction. This process involved Bertron
    cross-breeding the artificial birth of a Kryptonian hybrid, left to fend for itself
    in the harshest environments of the Kryptonian wilderness with the creature killed
    and its genetic material collected to create a more resilient clone. This process,
    along with further cross-breeding with the DNA of the strongest creatures on Krypton,
    was repeated over and over for decades as a form of accelerated natural evolution.
    The agony of these repeated deaths was recorded in the genes of Bertron''s final
    creation, driving the creature insane and following one overwhelming instinct:
    destroy everyone and everything in sight. When the creature proved too difficult
    to control, the Council discontinued Bertron''s experiments and banned all forms
    of cross-breeding while having the creature jettisoned into the Phantom Zone.
    However, the beast acted in his final moments of consciousness to change the stasis
    cell''s trajectory and it eventually crashed on Earth, the force of the impact
    driving it deep underground. The beast slept for centuries before finally reviving
    and bursting free. Dubbed "Doomsday" by Booster Gold, the beast is still motivated
    by his instincts to kill everything around him yet has a greater obsession to
    kill all Kryptonians. ==Powers and Stats'
