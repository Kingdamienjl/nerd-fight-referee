- id: claim-weaknesses-680a85ad
  section: weaknesses
  axis: weakness
  text: 'Kryptonite, though he resisted it better than Superman does. His fear and
    agony can weaken him. Notes: * Before making any changes to this page, please
    read and follow the Power-scaling Rules for Marvel and DC Comics. *After killing
    Superman in Death of Superman, Superman is both mentally and physically depowered
    by being near Doomsday, with him holding back out of fear and losing confidence
    when it''s needed.Superman/Doomsday: Hunter/Prey Vol. 1 #3, June 1994 However,
    Superman is likely not so significantly weakened that he''d drop from his 2-C
    level, as he typically still outperforms characters like Martian Manhunter against
    Doomsday. *While Doomsday Rex had gained a weakness, he was still supposed to
    be extremely powerful,Superman Vol. 2 #179, April 2002 and considering the statements
    implying he gained power, it''s apparent he''s overall superior despite this weakness.
