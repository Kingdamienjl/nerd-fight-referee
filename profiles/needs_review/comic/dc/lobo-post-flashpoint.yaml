    - field: intelligence
      value: Extraordinary Genius (Despite his violent and uncouth nature, Lobo possess
        a remarkable intellect in matters of destruction and violence. He can trace
        any prey across the universe, speak 17,897 different languages from across
        the galaxy, communicate in Morse code, and create complex virulent agents
        and the necessary antidotes to them such as the one he let loose on Czarnia,
        which resulted in the deaths of the entire population in one week. With his
        mechanical aptitude, Lobo was able to scavenge parts from a destroyed time
        hopper and attach them to his own bike, producing a working time machine,
        and he is capable of inventing and devising advanced technology, even reprogramming
        Apokoliptian technology to trick Darkseid. However, even with his genius-level
        intellect, Lobo is usually too drunk to use it properly)
