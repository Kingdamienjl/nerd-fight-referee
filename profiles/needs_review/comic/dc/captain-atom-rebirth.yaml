    - field: weaknesses
      value: 'None notable. | If the laws of nature are tampered with, his powers
        weaken. His eyes aren''t as durable as the rest of his body. If his skin is
        breached, he can cause a powerful explosion of quantum force. Two quantum
        field manipulators can cancel out each other''s powers. Often, he tries to
        hold back his power levels due to potential God Complex and fears he is losing
        his humanity.Captain Atom: Armageddon Vol 1 6 X-Ionized weapons can cut his
        skin. If Captain Atom absorbs too much energy at once, he will be sent hurtling
        through time. Depending on the type of energy absorbed, he either goes forward
        or backwards. Sometimes after he goes nuclear, it takes up to 24 hours for
        his powers to return. Captain Atom also fears turning into his dark side known
        as Monarch.Extreme Justice Vol 1 8 As Monarch, he was very ruthless and overconfident.
        His Monarch armor is not as sturdy as his Captain Atom shell. If his Armor
        gets breached, it can accidentally release enough energy to destroy an entire
        Universal space-time continuum. Notable Attacks/Techniques *Hold back: Captain
        Atom almost always holds back for various reasons. It can be his mental state,
        his emotional state, or some other inner conflict he is going through. In
        addition, he fears his dark side taking over and getting the better of him.
        Therefore, his power varies greatly and rarely ever go all out. In Captain
        Atom Vol.2 54 - 57 he stopped holding back momentarily, which led to him creating
        and destroying a universe over and over again with but a mere thought. As
        Monarch, he had no such mental weakness and always fought at his full strength.
        *Talk first: Captain Atom is a man with a lot of trauma, and often, he would
        rather talk than go all out and fight someone. He is a kind man and is willing
        to hear them out first rather than hurt them - when possible, of course. And
        even if he attacks, he rarely ever attack first. As Monarch, he likes to emotionally
        hurt his opponents and hold the higher ground intellectually before unleashing
        his power against them. *Energy over matter: Captain Atom''s primary method
        of attack is energy manipulation. He has more control over its output compared
        to his other destructive abilities. Even when battling in melee combat, he
        prefers to employ energy in any way he can. *BFR: As Monarch, sometimes he
        would simply remove his enemies from the battlefield rather than waste time
        on them. *Quantum Field: By manipulating the Quantum Field, Captain Atom is
        able to control time, space, energy, and matter at will. His energy absorption
        is potent enough to overcome foes significantly more powerful than himself,
        such as Nekron. *Big Bang: Captain Atom is also able to control incredible
        amounts of energy, being able to catalyze another Big Bang if he so wished.
        Notes: *This file only covers his Post-Crisis incarnation and not the New
        52 or the original from Charlton Comics. *Captain Atom can perform at various
        levels of powers since he has complete control over his destructive capabilities.
        In addition, his emotional and mental state also plays a large role in it.
        To avoid his potential God Complex or evil self from taking control, he tries
        to hold back as much as possible and all of his stats tend to go down with
        him. **If possible, please avoid scaling characters from Captain Atom, sans
        Superboy-Prime. When scaling characters from Captain Atom, please read over
        the context to understand how Captain Atom was acting and feeling beforehand,
        as well as afterwards. **Some writers tend to ignore the character, continuity,
        and many powers of Captain Atom, as well as his power levels, so if he fights
        someone, it does not mean they scale to his Galaxy level or higher level,
        especially since most of them boils down to how out of character Nathaniel
        is written. ***And if you do want to scale characters from him, please only
        scale those who battles him in a prolonged story arcs. One or two page battles
        are often to be ignored due to how his character is written sometimes. *Monarch
        Armor slightly augments his powers according to a back-up story, however,
        the main story arc contradicted the said enhancements. Therefore, the main
        story takes precedence over a back-up issue, which was written to feel like
        a handbook. **In addition, the power levels of Captain Atom aren''t that different
        than his usual self. In this form, he doesn''t hold back at all since he is
        a villain and utilises everything he has in his arsenal.Countdown to Final
        Crisis Vol 1 8 He has many statements and scaling in his usual form which
        doesn''t contradict any potential higher showings with the Monarch armor.
        *Captain Atom was not empowered when the sliver of Void took residence within
        him during Captain Atom: Armageddon story arc. The sliver of Void was merely
        creating a chain reaction inside of him to bring out his destructive power.
        *Before making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses:'
