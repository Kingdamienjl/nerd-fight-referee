      value: Gifted. Nathaniel was a capable soldier, air force officer, and then
        later an intelligence officer and then a major. Using his power efficiently
        requires a certain understanding of the quantum field, as well as matter and
        energy. Has great battle experience, as well as leadership and strategic experience.
        Captain Atom travelled across the multiverse and gained a greater understanding
        of the universe/multiverse. As Monarch, he was easily able to deduce the plan
        of a Monitor, who wanted to be the sole winner of this expansive war.Countdown
        to Final Crisis Vol 1 16 In addition, he entered a long war with the Monitors
        and created an army of superhumans to follow his every command. An adept leader
        of both the JLI, Extreme Justice, and a large team of heroes during the Invasion
        storyline,Invasion! Vol 1 2 as well as a multiversal army of supervillains.
