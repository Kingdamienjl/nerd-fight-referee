power_scale:
  tier:
    text: ', up to at least , likely higher with magic'
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Building level (Cut off the head of one vampire then fought and killed some
      more, with vampires being strong enough to throw cars. Those vampires had their
      strength increased by Cain, and were able to restrain and threaten Batgirl albeit
      in a group. Should be comparable to his durability), up to at least Solar System
      level (Hurt I, Vampire, who stomped Apollo. Madame Xanadu does not have the
      power to contrast John's magic. Was considered to be among the five magicians
      on Earth who could contribute to a powerful spell meant to save the Earth, implying
      him to be at least somewhat comparable to Dr. Fate and Zatanna, though he is
      certainly weaker than either of them.Martian Manhunter Vol 4 11 Hurt Frankenstein
      and Black Orchid with a magic attack), possibly higher (Knows a spell "powerful
      enough to kill a god", who he believed might stop The Upside-Down Man, though
      it ultimately failed to scratch him. Still, it should be much stronger than
      any other attack of hisJustice League Dark Vol 2 3) with magic
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Possibly Peak Human running speed (Could briefly outrun some magic monkeys,
      with most real life monkeys being able to run at 30 km/h or faster), at least
      Supersonic+, possibly Hypersonic+ combat speed (Could fight a group of vampires
      that managed to overpower and surprise Batgirl), up to Massively FTL+ attack
      speed (Can tag Frankenstein and I, Vampire with his spells)
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Building level (Comparable to his striking strength. Survived an attack
      that smashed him against a wallJustice League Dark Vol 1 29), up to Solar System
      level with forcefields and seals
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman. Walked back to his home and performed a spell after being brutally
      beaten and stabbed in the stomach.Justice League Dark Vol 1 2 Performed a 12-hour
      ritual summoning that involved much self-harm. Could fight after being dazed
      by both medical and magical means. Withstood a night of hellish torture without
      breaking a sweat.Constantine: The Hellblazer Vol 1 9 Could calmly hold a conversation
      and weasel his way out of a dangerous situation after being shot with an arrow
      through the shoulder and beaten up by a small gang of criminals.The Hellblazer
      Vol 1 20The Hellblazer Vol 1 21'
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with weapons, Varies, up to Multiversal+
      with magic (Has been able to tap into The Green. However, note that John's spells
      greatly vary in range, with him once struggling to cover New York City with
      a single spell)
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'At least Genius, possibly Extraordinary Genius. John Constantine is very
      knowledgeable in ancient and occult matters,Constantine Vol 1 1 such as obscure
      monsters from various mythologies, not to speak of the many, many spells he
      is able to use and defuse.The Hellblazer Vol 1 15 Learned how to use Zatanna''s
      backwards magic just by having heard her mumble it in her sleep,Justice League
      Dark Vol 1 3 while she had to endure years of incredibly rigid training to master
      it. John''s sheer magic skill is such that he could threaten even powerhouses
      such as The Spectre or Swamp Thing. Was the only one among the Justice League
      Dark to figure out how to seal June Moon and the Enchantress together and that
      Madame Xanadu was the one to split them in the first place. Despite the (mutual)
      hatred that almost everyone in the Justice League Dark has shown towards Constantine,
      he has proven to be a very good leader, coming up with clever plans and being
      able to adapt them on the spot.Trinity of Sin: Pandora Vol 1 7Justice League
      Dark Vol 1 9 Knows all about Shazam''s origin and powers.Justice League Dark
      Vol 1 22 Mostly correctly guessed that The Phantom Stranger was only imitating
      human feelings. Defeated all the Justice League Dark except Zatanna at once
      while drunk. Came up with a plan to turn a madman''s obsession with William
      Blake against him. As better detailed in his Social Influencing section in Powers
      & Abilities, John Constantine is known as the World''s Greatest Con Man for
      a reason, with him having shown the ability to adapt his incredible talking
      and planning skills to basically any situation, to the point that one could
      say that despite his wealth of magical knowledge, John''s best weapon is his
      cunning. Standard Tactics: Constantine is typically not a fighter. If possible,
      he will retreat from a fight to find help or a better strategy. If that is impossible,
      he is a dirty fighter, sometimes completely forgoing flashy magic spells for
      more subtle and sneaky tactics if it fits the situation. Other times, he will
      seek to end the fight as quickly as possible, resorting to techniques that ignore
      durability in favor of incapacitating or even killing the enemy in some other
      way.'
    source_ids:
    - vsbattles-constantine-post-flashpoint-dc
    confidence: 0.6
    notes: auto_repair source extraction
