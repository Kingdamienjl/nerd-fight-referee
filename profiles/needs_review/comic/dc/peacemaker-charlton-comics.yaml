  text: Superhuman Physical Characteristics, Genius Intelligence, Social Influencing
    (He is a highly reputed diplomat who has been a part of multiple peace envoys),
    Vehicular Mastery (Accomplished pilot, can perform quick maneuvers and win dogfights).
    He set the unofficial record on the Lockheed X-17Peacemaker Vol 1 4), Weapon Mastery
    (Experienced spear fisher, he precisely shot down a sniper with a handgun outfitted
    with an infra-red scope) Flight (As shown here), Extrasensory Perception (Can
    intercept and track radio frequencies, and he possesses weapons outfitted with
    infra-red scopes), Laser Projection (Can project lasers from his helmet, which
    can melt weaponry), Sound Manipulation (Can mimic voices of others via technology,
    and possesses an "ultra sonic beam" capable of stunning his opponentsFightin'
    5 Vol 1 41), Poison Manipulation (Utilizes nerve gas in the form of capsules compressed
    gas and medicated bullets), Sleep Manipulation (Carries a sedative capable of
    diffusing in water to knock out underwater opponentsPeacemaker Vol 1 3), Attack
    Reflection (His body armor can deflect bullets and missiles), Explosion Manipulation
    and Fire Manipulation (Possesses multiple emergency weapons that can ignite, explode,
    and combust, as well as grenades) Poison Manipulation (His briefcases are rigged
    with lethal gassesFightin' 5 Vol 1 40), Non-Standard Breathing (Type 3; Possesses
    scuba equipmentPeacemaker Vol 1 1), Ice Manipulation (Using his absolute zero
    gun, he turned lava into ice for brief moments), Resistance to Fire Manipulation
    (Developed a special compound that resists heat and fire, and applied this coating
    to his new suit and helmetPeacemaker Vol 1 5) Flight, Extrasensory Perception
    (His planes possess infra-red filters, being able to track down secret military
    bases), Light Projection (Can launch parachute flares, which also produce considerable
    heat), Explosion Manipulation (Possesses missiles), Poison Manipulation (Can spray
    nerve gas over a cityscape), Resistance to Radar (His black box can avoid radar
    detectionPeacemaker Vol 1 2)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
