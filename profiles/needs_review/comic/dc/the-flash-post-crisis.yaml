    - field: weaknesses
      value: 'Can get easily overwhelmed, emotional, and depressed. Barry can also
        get cut off from the Speed Force. Notable Attacks/Techniques: *Energy Construct
        Creation: Speed Force conduits can use the matter generated by their speed
        to create solid objects such as walls or bridges. This power requires constant
        concentration and reapplication of the construct for it to remain stable.
        Flash''s afterimages are also created constructs. *Flight: Speed Force conduits
        can rotate their arms and spin their bodies like tops to achieve something
        of a kind of helicopter flight. However, with practice conduits can even achieve
        controllable flight if launched at high speeds. Despite their flight abilities,
        they are always faster on their feet. *Phasing: Speed Force conduits can vibrate
        their molecules so quickly that they can achieve intangibility for short bursts
        allowing them to phase through objects. *Sharing the Force: Speed Force conduits
        can allow their friends or family members to run alongside them at their equaled
        speeds. Certain conduits who may only have minor access to the Force may achieve
        full levels of the Force due to the main conduit''s association with it. *Speed
        Force Aura: People who are propelled by the conduits during high-speed situations
        can survive the harsh conditions associated with mach speeds. When the conduit
        must rescue an individual from a burning building these individuals will be
        protected while within the aura. *Vortex Creations: Speed Force conduits that
        plant themselves on the ground and rotate their extremities can cause an incredible
        amount of wind to burst through their focused funnel. Most Speedsters use
        this ability automatically when they run, reducing the air currents around
        their body to low enough levels to no longer inhibit their speed. Creatively,
        Speedsters can create tornadoes and gusts with their arms. Feats: *The Flash
