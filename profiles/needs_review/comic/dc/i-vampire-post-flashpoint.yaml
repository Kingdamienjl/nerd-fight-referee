- id: claim-weaknesses-27f361b8
  section: weaknesses
  axis: weakness
  text: 'Vampires are weakened by sunlight and holy water, although those have much
    less effect on him than the normal vampire, to the point that even anti-vampire
    equipment designed by Batman barely affects those at his level. After his resurrection
    he seems to have completely lost those weaknesses, as he''s completely unaffected
    by Apollo''s solar attacks. Killing a vampire''s sire within the first 72 hours
    lifts the curse, turning them human again. Would rather not kill enemies, even
    vampiric ones, but he will if he believes it necessary. Notes: Before making any
    changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-13ec1770
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Regeneration (Low-Mid) and Immortality
    (Type 1, 3, 7 and 8, The only way a vampire of Andrew''s age can die if he or
    his love choose toI, Vampire Vol 1 3 . Equal to Mary who, after being petrified
    and shattered by Andrew, healed in a few secondsI, Vampire Vol 1 10), Transformation
    (Vampires can turn into mist, wolves, bats and werewolvesI, Vampire Vol 1 1),
    Flight (By turning into mist or bats, he can easily fly across long distances),
    Cloth Manipulation (Has the same abilities as Mary, who can control the clothing
    she wears with enough precision and strength to block a thrown swordI, Vampire
    Vol 1 2), Power Bestowal & Corruption (Vampires can convert others through a bite,I,
    Vampire Vol 1 0 with the newly turned often becoming subservient to their sireI,
    Vampire Vol 1 6), Martial Arts and Weapon Mastery (Killed dozens if not hundreds
    of vampires in minutes. Was said to move in an animalistic yet incredibly precise
    way), Weapon Creation (Can summon weapons of various sorts out of nothing), Mind
    Manipulation (Vampires are capable of performing hypnosisI, Vampire Vol 1 5),
    Extrasensory Perception (Has a psychic connection with his progeny. Can also sense
    who the sire of other vampires is), Social Influencing (Vampires like Andrew are
    incredibly charismatic, to the point of being able to convert foes into allies
    in minutes and turn experiences that should have been traumatic into treasured
    onesI, Vampire Vol 1 14), Sleep Manipulation (Can knock out others with his mist
    formI, Vampire Vol 1 4), Enhanced Senses (Vampires can feel molecular disturbances
    in the air and pheromonesI, Vampire Vol 1 13. Can smell magicTrinity of Sin: Pandora
    Vol 1 13), Acrobatics (Shown hereI, Vampire Vol 1 16), Regeneration Negation (Mid,
    equal in powers to Mary who prevented amped vampires from growing back their headsI,
    Vampire Vol 1 7), Flight (Shown here by MaryI, Vampire Vol 1 11), Stealth Mastery
    (Vampires are naturally hard to notice, as they do not breathe or have a heartbeatTrinity
    of Sin: Pandora Vol 1 14), Self-Sustenance (Type 1, doesn''t breathe) All previous
    abilities to a much greater extent, Regeneration (Low-Godly. Despite his body
    being taken over by Cain, he reformed out of random debrisJustice League Dark
    Vol 1 8. Cain, who has the same powers as him, reformed out of dust after being
    killedI, Vampire Vol 1 8), Magic Negation and Absorption (Has the same abilities
    as Cain, who cancelled Constantine''s attempts at forming a magic seal and passively
    drained the magic of nearby magicians such as ZatannaJustice League Dark Vol 1
    7), Flight, Earth Manipulation (Can control dust), Deconstruction and Mind Manipulation
    (Turned Cain''s vampires to dust and reformed them under his control), Energy
    Projection (Can fire blasts of energy, even AOE ones), Memory Manipulation (Wiped
    Gotham''s memories of the vampire apocalypse), Telekinesis (Magically lifted a
    vampireI, Vampire Vol 1 9), Illusion Creation (Made two people hallucinate their
    heads blowing up), Air Manipulation (Struck Mary with a wind attack when she turned
    into mist), Petrification (Petrified Mary, then shattered her), Forcefield Creation,
    Attack Reflection and Magic (Can create large forcefields by using Zatanna''s
    backwards magic or just with his Energy Projection, and give them reflective propertiesI,
