      \ sleep. A Starro controlled the entirety of New York without drones). Note\
      \ that due to its hive mind status, Starro can cover much more range than its\
      \ statistics suggest, with the Starro species holding control over nine galaxies\
      \ and hundreds of trillions of minds."
    source_ids:
