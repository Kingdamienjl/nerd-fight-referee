  attack_potency:
    text: Multiverse level+ (Defeated the Justice League, even shrugging off attacks
      from Superman and knocking him out cold in return, with Superman later admitting
      that he couldn't beat Starro and being overpowered and immobilized by Starro
      on other occasions. Other Starro have overpowered and KOd Wonder Woman. Even
      Starro drones can threaten the JLA) | Varies from Street level (A Starro's strength
      depends on its age, with newborn still being strong enough to tear humanoid
      children apart. Starro drones can smash through reinforced glass, cannot be
      torn off faces by soldiers and if one with sufficient strength does succeed
      in pulling them off, they will take much of the victim's face with them), up
      to Multiverse level+ (Injured both Orion and Aquaman with one blast. Would have
      defeated and conquered the Justice League, the world and the entire universe
      if not for the Spectre's interventionJLA Secret Files and Origins Vol 1 1Infinite
      Universes) | Multiverse level+ (Far stronger than the Starro that previously
      fought the Justice League, which were only probes meant to look for worthy adversaries,
      and having witnessed the Justice League's power already through the memories
      of his Motherstars, Starro still believed he could beat themR.E.B.E.L.S. Vol
      2 13. Can destroy Black Lanterns, even one that was a resurrected HarbingerR.E.B.E.L.S.
      Vol 2 11. Easily beheaded Despero and could immobilize him with one handR.E.B.E.L.S.
      Vol 2 14. Far stronger than Smite, who Lobo believed could hit nearly as hard
      as SupermanR.E.B.E.L.S. Vol 2 27. Effortlessly overpowered Blackfire, only being
      staggered by a point blank blast to his eye sockets, and then could easily outmatch
      both her and Starfire at onceR.E.B.E.L.S. Vol 2 28)
    source_ids:
    - vsbattles-starro-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
