- id: claim-intelligence-5d0f7d48
  section: power_scale
  axis: battle_iq
  text: 'Unknown, likely Extraordinary Genius. Perfectly capable of human-like thought
    and strategy, The Starro hive mind was described as monstrous in scale by Martian
    Manhunter and some believe it to be far beyond human understanding. Were it given
    reason to, Starro would eventually be able to develop time travel. Standard Tactics:
    Starro usually fight by summoning storms of drones that attempt to latch onto
    enemies and rapidly take control of them, using their other powers if this fails.
    Due to his enjoyment of combat, Cobi likes to fight his opponents directly instead,
    being almost completely unwilling to use other means in single combat though he
    does use his army in wars or desperate situations.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-94ce5be6
  section: weaknesses
  axis: weakness
  text: 'KilledJLA Classified Vol 1 21 by calcium oxide. Will struggle to regenerate
    itself if weakened. Threatened by incredibly cold temperatures, and its mind control
    is undone by them. Beings with impressive willpower can somewhat fight against
    Starro''s controlJustice League Europe Vol 1 28, slowing down their body''s movements
    in a fight. A Starro-possessed individual''s combat patterns are somewhat predictable.
    | Same as before | Starro is a much more skillful fighter than its probes, and
    as such its last weakness no longer applies. Notes: *Before making any changes
    to this page, please read and follow the Power-scaling Rules for Marvel and DC
    Comics *Although Starro was unaffected by the Crisis, due to consistency, its
    tiering was split into both its Pre-Crisis and Post-Crisis keys.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-529df0e7
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, likely Genius Intelligence, Bodily Weaponry
    (Armed with sharp fangs to latch onto facesR.E.B.E.L.S. Vol 2 24, as well as tentacles),
    Large Size (At least Type 0. A grown Starro''s minimum size is 975 cmWho''s Who:
    The Definitive Directory of the DC Universe Vol 1 22, though this varies greatly,
    up to Type 5. Certain Starro can grow to reach a size comparable to that of a
    planetR.E.B.E.L.S. Vol 2 8), Small Size (Usually Type 1, up to Type 3. Starro
    drones are roughly the size of a human face, and Starro can become small enough
    to flow through a human''s bloodstreamJLA Classified Vol 1 16), Animal Manipulation
    (Capable of transforming Earth starfish into other StarrosThe Brave & The Bold
    Vol 1 28), Energy Absorption (Starro are capable of absorbing energy, such as
    that of a nuclear explosion, to power up), Temperature Manipulation (Can fire
    heat beams), Telepathy and Mind Manipulation (Capable of absorbing other beings''
    knowledge, communicate telepathically and mentally control entire crowds of peopleJustice
    League of America Vol 1 189. Overpowered Aquaman''s telepathy, beginning to infiltrate
    his consciousness and requiring Martian Manhunter to fight against himJLA Vol
    1 23), Biological Manipulation, Body Puppetry and Mind Manipulation (A Starro
    drone controls a host''s mind and motor functionsJLA Classified Vol 1 17 by taking
    over their brain with sporesR.E.B.E.L.S. Vol 2 8. Though they typically aim for
    the face this takeover can be done through the neckJustice League of America Vol
    2 4 or even through the bloodstream. They can take over not just humans but also
    any sort of organic alien, such as Martian ManhunterJustice League Europe Vol
    1 27), Technology Manipulation (Capable of taking over living computers such as
    SilicaR.E.B.E.L.S. Vol 2 2 and non-organic beings such as ChemoBooster Gold Vol
    2 13), Accelerated Development (Starro can evolve rapidly even when held in isolationGreen
    Arrow Vol 3 33, being capable of altering themselves in such a way that previous
    cures become uselessJLA Classified Vol 1 19), Disease Manipulation (Starro small
    enough can act the same as a bacterial disease, taking over the body from inside),
    Morality Manipulation (The Starro disease convinced a group of heroes that their
    evil actions were heroic), Paralysis Inducement (Capable of putting others into
    a state of suspended animation), Radiation Manipulation (Can fire nuclear energy
    beams), Body Control (Can change their own color), Forcefield Creation (Can surround
    itself with a forcefield that harms those that touch it), Hacking (Prevented communications
    from the JLA satellite), Duplication (Can create millions of Starro drones in
    mere hoursJustice League of America Vol 1 190), Regeneration (High-Mid overtime.
    Capable of regenerating from a single limbAdventure Comics Vol 1 451, though it
    "miscalculated" in its attempt to cause this regeneration initially, though it
    has since been able to without such restrictionsCaptain Carrot and His Amazing
    Zoo Crew Vol 1 1), Biological Manipulation (Reverted evolved, human-like animals
    into normal beasts), Telekinesis, Teleportation and Metal Manipulation (Overpowered
    and teleported Superman to his base, where he bound him in psychic chains), Social
    Influencing (Starro managed to convince both a rural town and the Justice League
    of Europe of its innocence, hiding his plans of world domination, without using
    its powersJustice League Europe Vol 1 26), Weather Manipulation (Starro can grow
    big enough to cause stormsJLA Vol 1 22), Sleep Manipulation and Dream Manipulation
    (A single Starro put all of North America into a deep sleep, and more would have
    done so to the rest of the planet, locking them into a dream where it ruled over
    them), Energy Projection (Can fire energy blasts), Longevity (Starro can live
    up to at least millions of years of age, possibly longerR.E.B.E.L.S. Vol 2 9),
    Hive Mind (Both types. Starro are all linked to each other through a mental link,
    giving most of them the same conscience. though some beings specifically recruited
    by Starro get to keep their individuality), Spaceflight, Flight, Self-Sustenance
    (Type 1) and Resistance to Radiation Manipulation (Starro are capable of space
    travelR.E.B.E.L.S. Vol 2 10), Fire Manipulation (Can latch onto Brimstone''s flaming
    head with no issueTeen Titans Vol 3 53), Mind Manipulation (Starro''s mind is
    so powerful that even making contact with it is extremely hard and painful, even
    for powerful telepaths like Miss Martian) All abilities of weaker Starro castes,
    Weapon Mastery, Stealth Mastery (Soundlessly flew right behind a trained warrior
    unnoticedR.E.B.E.L.S. Vol 2 Annual 1), Empowerment (Starro''s power grows with
    every mind under his control. He can also draw stamina from the trillions under
    his powerR.E.B.E.L.S. Vol 2 12), Telepathy, Multiple Selves (Type 1 and 3), limited
    Mind Manipulation and Supernatural Willpower (Cobi belonged to a psychic alien
    race that shared part of their consciousness'
  source_ids: *id003
  decisive: true
  status: unverified
