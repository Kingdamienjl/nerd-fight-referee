    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Unknown, likely Extraordinary Genius. Perfectly capable of human-like thought
      and strategy, The Starro hive mind was described as monstrous in scale by Martian
      Manhunter and some believe it to be far beyond human understanding. Were it
      given reason to, Starro would eventually be able to develop time travel. Standard
      Tactics: Starro usually fight by summoning storms of drones that attempt to
      latch onto enemies and rapidly take control of them, using their other powers
      if this fails. Due to his enjoyment of combat, Cobi likes to fight his opponents
      directly instead, being almost completely unwilling to use other means in single
      combat though he does use his army in wars or desperate situations.'
    source_ids:
    - vsbattles-starro-pre-flashpoint-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
