      value: 'Unknown, likely Extraordinary Genius. Perfectly capable of human-like
        thought and strategy, The Starro hive mind was described as monstrous in scale
        by Martian Manhunter and some believe it to be far beyond human understanding.
        Were it given reason to, Starro would eventually be able to develop time travel.
