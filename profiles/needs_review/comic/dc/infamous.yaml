    - field: weaknesses
      value: 'Mandrakk was driven mad by his realization of the truth that Monitors
        were parasites. Despite surviving, he was still vastly weakened after his
        fall through the Overvoid. His weakened self is vulnerable to having his fundamental
        existence rewritten. Note 1: While direct showings have implied Mandrakk is
        no longer at the top of the DC Multiverse, it is likely that this doesn''t
        really matter. He was still an agent of the Overvoid who would''ve devoured
        everything in DC''s creation, no matter how ontologically superior it was
        to the rest of creation. It just makes sense narratively speaking that he
        would still scale to a majority of DC''s cosmology regardless. Note 2: There
        are two Mandrakks, Dax Novu and Rox Ogama. Dax Novu was the original Monitor
        who became corrupted by the Overvoid, Dax Novu. Note 3: In interviews, Grant
        Morrison has said he considers the Overvoid to contain all of stories from
        across all fiction within itself. Some select few individuals have taken this
        to mean CAS and Mandrakk, could affect every verse in all of fiction. However,
        not only is the claim of the Overvoid containing all of fiction extremely
        disingenuous to take at face value (i.e. other extremely metafictional verses
        having excuses for containing "all of IRL fiction" within itself, rights issues,
        etc.), but also it''s hard to scale CAS and Mandrakk to this full extent as
        they are clearly not on the same level as the Overvoid despite being two halves
        of its original probe.'
      source_id: character-stats-profiles-infamous-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
