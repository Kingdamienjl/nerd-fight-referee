- id: claim-powers-and-abilities-e4b19837
  section: abilities
  axis: hax
  text: 'Information Analysis (Can look up and analyze information, using it to tell
    their owner what to do in combat), Matter Manipulation (Can alter appearances
    by weaving atoms and reconstruct matter on an atomic level), Portal Creation &
    Dimensional Travel (Can summon boom tubes), BFR via boom tubes (Metron stated
    that Lightray could have banished the Black Racer), Healing & Regeneration (High;
    Constantly reassembled Orion''s molecular structure to prevent him from being
    completely destroyed; They can heal others'' injuries as well as their owner''s),
    Precognition (Can detect attacks immediately before they happen), Extrasensory
    Perception (Can track targets anywhere and sense potential trouble elsewhere in
    the universe), Energy Projection (Can fire energy blasts), Energy Absorption (Can
    absorb energy attacks), Forcefield Creation (Can generate forcefields around their
    owner''s body as well as make unidirectional shields), Attack Reflection (Can
    reverse the polarity of energy attacks, absorbing and sending them back), Intangibility
    (Enable their owner to phase by thinning out their atomic structure), Statistics
    Amplification (Mother Boxes grow more powerful around radiation), Telepathy (Can
    examine minds), Biological Manipulation (Placed a genetic imprint onto a basic
    life form, altering it according to Lightray''s desire), Mind Manipulation (Can
    mind-control others, heal minds, and subdue others to stop them from harming anyone),
    Memory Manipulation (Removed Swamp Thing''s memories), Smoke Manipulation (Can
    generate smoke screens), Pain Manipulation (Can remove the feeling of pain), Electricity
    Manipulation (Can generate electric fields around their owner which can be discharged
    in blasts), Magnetism Manipulation (Shattered chains with magnetic repulsion),
    Weather Manipulation (Can summon a raging storm with tornadoes and lightning to
    herald the death of a god), Summoning (Can summon their owner''s equipment), Damage
    Boost (Can amplify and augment energy attacks and telekinetic power), Weapon Creation
    (Can arm their owner with New Genesis weaponry, including an energy sword capable
    of cutting into H/P Doomsday and an ultrasonic gun) Resistance to: *Space-Time
    Manipulation (Prevented a spacetime vortex that destroyed everything around its
    center from harming Orion) *Mind Manipulation (Can constantly protect against
    mental attacks) *Fear Manipulation (Lightray''s Mother Box freed him from a Reflektorr''s
    fear inducement) Nigh-Omniscience (Their connection to the Source grants omni-knowledge
    and understanding), Portal Creation, Dimensional Travel & BFR (Can summon boom
    tubes for travel as well as to banish targets), Memory Manipulation & Mind Manipulation
    (Erased Hector Hammond''s memories and set up a barrier in Superman''s mind; Removed
    Bedlam''s mind control), Healing (Can instantly heal severe injuries), Energy
    Manipulation (Can manipulate and transfer energy)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
