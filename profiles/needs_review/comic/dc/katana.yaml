    - field: weaknesses
      value: 'Possesses all general weaknesses possessed by Hybrids, once his transformation
        is undone Katana Man is unable to enter his Hybrid form again for a certain
        period of timeChainsaw Man Chapter 27, he also tends to let his guard down.
        Notable Attacks/Techniques: *Sword-Draw Dash: Katana Man''s special technique,
        it is a quick-draw sword technique (also known as iajitsu) by crouching down
        low and preparing to unleash his swords, Katana Man can dash forward at incredible
        speeds and slash at his opponent as he goes by them, often appearing to simply
        teleport past them before his attacks appear on his opponent''s body. Katana
        Man moves faster than the average human eye can see and he can use this technique
        multiple times in a row without any apparent drawback. While this attack tends
        to only affect a specific part of the enemy''s body, it does so with significant
