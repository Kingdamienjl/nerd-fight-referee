        46 a specialized high-security devil containment facilityChainsaw Man Chapter
        31Chainsaw Man Chapter 159Chainsaw Man Chapter 174 that is explicitly stated
        to have never had a single devil escape since its founding, highlighting the
        exceptional durability of its structureChainsaw Man Chapter 156Public Safety
        maintains specialized containment facilities designed to hold devils. These
        devils are not physically restrained, but are instead confined by the reinforced
        walls and interior structure of these facilities. The Tokyo Detention Centre
        is implied to be one of their most secure locations, as it is emphasized that
        no devil has ever escaped from it since its founding. Pseudo Chainsaw Men
        are another example, as they are not restrained but are confined by the reinforced
        walls and steel doors of this Public Safety detention centre. These Pseudo
        Chainsaw Men are capable of piercing through Public Safety Devil Hunter suits
        with their chainsaws. These suits, particularly the jackets, are notably durable
        and can protect the wearer from being sliced in half by attacks such as Katana
        Man's sword draw dash. Although Katana Man's katanas scale above the durability
        of these suits, his attacks may still fail to completely bisect them in a
        single horizontal cut due to the material's layered durability and the mechanics
        of the attack itself, despite him still being capable of cutting through the
        material. Engaged a fully fresh Post-Training Chainsaw Man in direct combat,
        overpowering him by effortlessly severing his limbs and even shattering the
        chainsaw emerging from his head.Scales to 550 Tons of TNT)
