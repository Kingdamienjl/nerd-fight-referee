        when specifically talking about the ring of Volthoom, mentions it as being
        extradimensional. Given the Justice League could also deal with the previous
        host of the Power Ring, It's likely that her standard green lantern ring is
        of similar power. Could Hold back Darkseid with help from the Justice League,
