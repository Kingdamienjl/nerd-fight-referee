    - field: weaknesses
      value: 'Can be shorted out by water, which incapacitates him. His power is useless
        against wood. He likely possesses most Normal Human Weaknesses. Notable Attacks/Techniques:
        *Electricity Beam: A stream of powerful electricity shot from Static''s palm.
        *Electricity Blast: A spherical blast of potent electricity. * Electric Shield:
        Static creates a shield of electricity to block attacks. *Taser Punch: Static
        supercharges his fist with electricity, empowering his punch. *Nova Ball:
        A sphere of powerful electricity that expands, bathing the surroundings in
        a blinding light. Category:Goulden1998 Category:Tier 9 Category:Tier 5 Category:Superhuman
