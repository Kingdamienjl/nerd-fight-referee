    - field: weaknesses
      value: 'Is vulnerable without his ring. Kyle is at least initially dependent
        on visual feedback to use his powerJLA Secret Files Vol 1 1 Notable Attacks/Techniques:
        Life Energy Conduit: The white ring draws on and is connected to the powers
        of life and creation. *Emotional Spectrum Dominance: The white light is the
        first light and in essence, all of the other colors of the emotional spectrum
        combined. As such, a user of a white ring can generate any color of the emotional
        spectrum and use the powers of each color. The white ring also allows the
        user to access the rings of any member of any of the other corps and observe
        these members. *Energy Blasts: They can fire energy blasts. *Force Field Generation:
        The white power ring can create various forcefields of various sizes and shapes
        to protect the user and others around him/her. These force fields protect
        him/her from the hazards of the void including filtration of stellar radiation
        and microscopic particulate matter which would ordinarily be fatal should
        the space debris strike the ring wielder at high speeds. An atmosphere appropriate
        to the person''s biology is created inside the force-field, body temperature
        is maintained, and waste products are removed. Gravitational stresses which
        could cause injury are stabilized. Theoretically, a white lantern could use
        the ring as his/her/its sole source of life support. *Energy Constructs: The
        white ring can form constructs of white energy. The primary function of the
        Power Ring is to provide a weapon capable of transforming the wearer''s thoughts
        into physical constructs through the wearer''s mastery of life and the entire
        emotional spectrum. A white lantern can create any particular items or construct
        that they can imagine as long as they have the mastery of emotions necessary
        to will it into existence. The constructs are made out of white energy, which
        is a tangible form of pure life, and they exist only as long as a white lantern
        is fueling it with their mastery of life energy. Items created by the rings
        are not indestructible and are only as powerful as the force of emotions of
        the white lantern that created them. *Phasing: A white power ring allows the
        wielder to pass through certain solid objects, such as walls. Which objects
        that are not penetrable are not known, but it may depend upon the strength
        of the user and the density of the object''s molecular structure. *Environmental
        Playback: Upon their will, the white lantern can recreate a holographic environment
        based on data in its memory banks. *Invisibility & Light Refraction: A white
        lantern can render him/her/itself invisible by willing themselves to bend
        light waves around his/her/its form. *Energy Absorption: The white ring can
        absorb and store most other energies including the energy of the other colors
        in the emotional spectrum. *Flight: By the manipulation of anti-gravitons
        and directed molecular movement, they can fly at incredible speeds. In an
        atmosphere, a white lantern has been known to fly as fast as Mach 10 in the
        atmosphere by creating an aerodynamic envelope around his body. Towing others,
        usually within a bubble, his/her speed is limited to twice the speed of sound
        or 1440 mph. In space, a white lantern speed can be significantly greater
        and has been known to approach 80% of lightspeed in normal space. Flight is
        possible at velocities exceeding light speed. In atmospheres, air friction
        is not a hindrance, since heat is either absorbed or reflected by the ring''s
        field. *Wormholes & Spatial Warps: Their power grants its wearer access to
        wormholes in space, enabling them to rapidly cut time and distance needed
        for transport. *Healing: The white rings can heal almost any injury, initial
        complete cellular regeneration, and in some instances resurrect the dead.
        *Connection to Life: The white ring uses the energy of life and so is connected
        to all life. The ring can allow users to see the footprints of life and see
        the past and present conditions of all life in a limited area around the user
        and even the "souls" or essence of those who have recently died. Notes: Before
        making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive:
        ==References== {{Scroll box|{{Reflist|2}}}} ==Notes/Explanations== {{discussions|Green
