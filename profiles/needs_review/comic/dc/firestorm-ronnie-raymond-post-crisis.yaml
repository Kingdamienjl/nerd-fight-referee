- id: claim-weaknesses-9bc24fde
  section: weaknesses
  axis: weakness
  text: 'Needs to concentrate really hard to know what structure he needs to make.
    Cannot affect organic matter, and if he tries, he gets harmed by harmful energy
    feedback | An agitated state will increase the chances of triggering a New Big
    Bang Notable Attacks/Techniques * Molecular Reconstruction: Firestorm has one
    main ability which all other stem from. Firestorm can break down and reapply subatomic
    particles as well as break up the molecular structure of elements and rearrange
    them. To do this the element must know the exact elemental make-up of the object
    or human. Most Firestorms cannot affect living tissue but it is possible though
    very unstable. * Density Control: Firestorm has complete control over molecules
    and as such can change the density of solids, liquids and gases to as light as
    hydrogen or as heavy as uranium. Although he has direct control over an object''s
    density he can use this ability on himself and only himself and affect living
    tissue to pass through objects. * Matrix Memory Recall: Elements tied to the Firestorm
    Matrix can access the memories of each and every single being that has ever been
    fused into the Matrix. New elements are allowed to automatically download surface
    information. *Energy Manipulation: **Energy Projection: Firestorm can project
    massive amounts of different amount of energies. Naturally occurring energy projected
    by Firestorm are "Nuclear Blasts" however elements can project a number of different
    energies at will, such as Kryptonite energy. **Energy Absorption: Firestorm can
    absorb massive amounts of energy as well as being able to absorb many different
    types of energy. Most commonly the elements and energies associate with life and
    the human body are absorbed. **Forcefield Creation: Firestorm can create energy
    shields and energy forcefields to deflect and stop attacks, like energy beams
    and punches *Quark Vision: The ability to see extremely small objects and images
    down to the subatomic level. *Self-Sustenance: Elements tied to the Firestorm
    Matrix can survive in space unaided, never need to eat to sustain life and never
    truly need another element to be processed or broken down by their bodies. Notes:
    *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. *At emotional equilibrium, the chances of a Big
    Bang are near zero. If agitated, the chances are one in a million, maybe one in
    a hundred thousand. *Due to Ronnie''s and Jason''s merging as Firestorm having
    limited appearances before the New 52, he is unable to scale to those he did prior.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-242c2f40
  section: abilities
  axis: hax
  text: 'Limited Teleportation, Transformation and Fusionism (Via Instantaneous Fusion;
    Elements tied to the Firestorm Matrix can transform from their normal human forms
    into Firestorm) Firestorm (Ronnie Raymond + Other Person)=Superhuman Physical
    Characteristics, Flight, Fire Manipulation, Transmutation, Energy Projection,
    Matter Manipulation, Telepathy, Self-Sustenance, Heat Manipulation, Energy Manipulation
    and Absorption, Forcefield Creation, Danmaku (Melted Killer Frost''s ice instantly),
    Density Manipulation allows him Intangibility, Extrasensory Perception, Enhanced
    Senses and Information Analysis, Explosion Manipulation, Air Manipulation (Suffocated
    Multiplex, and his clones), Sleep Manipulation (Can fire out blasts that can put
    someone to sleep), Earth Manipulation (Controlled the ground to hold Mammoth),
    Biological Manipulation (Cured Killer Frost of a terminal illness by using another
    human as a template and superimposing the healthy parts onto her), Ice Manipulation,
    Power Nullification (Cancelled out an energy blast), Size Manipulation (Can shrink
    his size to a molecular level), Power Absorption (Absorbed Killer Frost''s powers),
    Resistance to Extreme Heat and Cold Firestorm (Jason Rusch + Ronnie Raymond)=All
    previous powers, as well as seemingly all the powers of Jason Rusch''s Firestorm,
    Teleportation (Teleported to the Anti-Matter universeBrightest Day Vol 1 #10)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
