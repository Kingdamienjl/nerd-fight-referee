    by enough fear gas to panic a herd of elephants), Poison Manipulation (Claims
    he is immune to poison), Sleep Manipulation (Unaffected by sleep-inducing drugs),
    Mind Manipulation (Resisted being controlled by 90 million minds and broke free
    from Jarro''s control), Telepathy (Can make erratic thoughts to fool telepaths
    and his cowl has psychic dampeners that block out telepathic attacks), Empathic
    Manipulation (Resisted Psycho Pirate), Ill'
