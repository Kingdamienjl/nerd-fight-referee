    5 27), Limited Physics Manipulation (Structures built of Nth Metal are said to
    defy the laws of physicsJustice League Vol 4 14), Invulnerability Negation (Nth
    Metal is one of the only things that can nullify the invulnerability of Dark Multiverse
    beingsDark Nights: Metal Ch 3), Regeneration Nullification (High-Mid. The Nth
    metal prevented some alien creatures from regenerating, whereas previously they
    could grow back from just a detached head.Savage Hawkman Vol 1 1 This nullification
    happens on the cellular levelSavage Hawkman Vol 1 2), Limited Power Nullification
    (Nth Metal caused Morphicius'' teleportation to fail, and then he used it to hinder
    Katar Hol''s flight abilities. It also cancelled a century-long spellSavage Hawkman
    Vol 1 6) |-|Resistances= Resistance to Ice Manipulation (Broke out of Mr. Freeze''s
    ice), Fire Manipulation (Unfazed by a flamethrower), Electricity Manipulation
