- id: claim-powers-and-abilities-1f30b8c4
  section: abilities
  axis: hax
  text: 'Skills and Techniques= Superhuman Physical Characteristics, Genius Intelligence
    (Ozymandias considers him to be the second smartest person on Earth, just behind
    Lex Luthor), Master Hand-to-Hand Combatant (One of the greatest martial artists
    in the DC Universe. Defeated 100 people and 4 metahumans, Evenly matched with
    Deathstroke, defeated a Talon member while starved, sleep-deprived, and weakened,
    swats Batwoman aside despite being ambushed, can contend with Lady Shiva, and
    evenly matched with future Tim Drake despite not having any gear or equipment),
    Pressure Points (Subdued a drug-enhanced foe with pressure points), Weapon Mastery
    (Skilled with batarangs, bolas and grappling hooks, explosives, and a variety
    of melee weapons and firearms), Stealth Mastery (Vanished from Deathstroke''s
    sight in an eye blink, disappears on the Gotham siblings despite their enhanced
    senses, The JLA, including Superman, Zatanna, Blue Beetle, and Constantine, have
    trouble finding him, can sneak up on Superman), Hacking (Hacked into an alien
    computer despite not even knowing its language), Body Control (Can make 10 minutes
    worth of air last an hour), Social Influencing, Regeneration (Mid-Low; His exposure
    to Dionesium gave him a healing factor that healed all of his scars and enhanced
    his speed), Enhanced Senses (Can fight foes using quantum stealth to make themselves
    invisibleAll Star Batman Vol 1 7 or even while blindfoldedBatman Vol 3 97. Can
    identify various types of explosive or wood by the smellAll Star Batman Vol 1
    14Harley Quinn Vol 3 57. Sensed Scarecrow by the smell of fearBatman Vol 3 70.
    Can hear extremely subtle movements of his bats'' wingsSuperman: Unchained Vol
    1 2), Extrasensory Perception (Detected the Spectre), Vehicular Mastery (Can drive,
    sail, and fly with incredible efficiency), and Immense Willpower |-|Standard Arsenal=
    Enhanced Senses (His cowl has night vision and optical zoom, as well as x-ray
    vision), Information Analysis (Can scan biology and in seconds know details of
    a foe down to the cellular level), Illusion Creation (Uses EMP tech to disguise
    himself via holograms), Electricity Manipulation (His suit can discharge electricity
    powerful enough to faze Cyborg, and he can also discharge AOE blasts), Sound Manipulation
    (Has sound cannons in his chest, which is strong enough to dispel magical constructs),
    Heat Manipulation (His gauntlet can be superheated), Sleep Manipulation (Possesses
    tranquilizer darts in his gauntlet), Absorption (Absorbed energy and sent it back
    as electricity), Attack Reflection (Can send energy attacks right back at opponents
    with energy rejector systems), Energy Projection (Has lasers that can cut through
    inches of metal in seconds), Smoke Manipulation (Has smoke grenades in his teeth,
    and regularly creates smokescreens), Explosion Manipulation (Has explosives strong
    enough to throw Superman out of a building), Status Effect Inducement (With flashbangs
    and sleeping gas, all of which are kept in his gauntlet, capes, boots, and his
    belt), Immense Pain Tolerance (Can fight even after being shot in the stomach),
    Surface Scaling (Can walk on ceilings with his boots), and Preparation, Non-Physical
    Interaction (Carries at least one Nth Metal batarang, which can hurt ghostsBatman
    Eternal 24), Energy Manipulation and Absorption (Nth Metal works by conducting
    mystical energyDark Days: The Forge. It can absorb energy attacks and be used
    to strike back with the same powerDark Nights: Metal Ch 5), Vibration Manipulation
    (Nth Metal can cause shockwaves when clashing with other Nth MetalHawkman Vol
    5 27), Limited Physics Manipulation (Structures built of Nth Metal are said to
    defy the laws of physicsJustice League Vol 4 14), Invulnerability Negation (Nth
    Metal is one of the only things that can nullify the invulnerability of Dark Multiverse
    beingsDark Nights: Metal Ch 3), Regeneration Nullification (High-Mid. The Nth
    metal prevented some alien creatures from regenerating, whereas previously they
    could grow back from just a detached head.Savage Hawkman Vol 1 1 This nullification
    happens on the cellular levelSavage Hawkman Vol 1 2), Limited Power Nullification
    (Nth Metal caused Morphicius'' teleportation to fail, and then he used it to hinder
    Katar Hol''s flight abilities. It also cancelled a century-long spellSavage Hawkman
    Vol 1 6) |-|Resistances= Resistance to Ice Manipulation (Broke out of Mr. Freeze''s
    ice), Fire Manipulation (Unfazed by a flamethrower), Electricity Manipulation
    (Tanked an electrical discharge from Luthor''s warsuit), Fear Manipulation (Unfazed
    by enough fear gas to panic a herd of elephants), Poison Manipulation (Claims
    he is immune to poison), Sleep Manipulation (Unaffected by sleep-inducing drugs),
    Mind Manipulation (Resisted being controlled by 90 million minds and broke free
    from Jarro''s control), Telepathy (Can make erratic thoughts to fool telepaths
    and his cowl has psychic dampeners that block out telepathic attacks), Empathic
    Manipulation (Resisted Psycho Pirate), Ill'
