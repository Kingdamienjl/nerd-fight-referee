    swats Batwoman aside despite being ambushed, can contend with Lady Shiva, and
    evenly matched with future Tim Drake despite not having any gear or equipment),
    Pressure Points (Subdued a drug-enhanced foe with pressure points), Weapon Mastery
    (Skilled with batarangs, bolas and grappling hooks, explosives, and a variety
    of melee weapons and firearms), Stealth Mastery (Vanished from Deathstroke''s
    sight in an eye blink, disappears on the Gotham siblings despite their enhanced
    senses, The JLA, including Superman, Zatanna, Blue Beetle, and Constantine, have
    trouble finding him, can sneak up on Superman), Hacking (Hacked into an alien
    computer despite not even knowing its language), Body Control (Can make 10 minutes
    worth of air last an hour), Social Influencing, Regeneration (Mid-Low; His exposure
    to Dionesium gave him a healing factor that healed all of his scars and enhanced
    his speed), Enhanced Senses (Can fight foes using quantum stealth to make themselves
    invisibleAll Star Batman Vol 1 7 or even while blindfoldedBatman Vol 3 97. Can
    identify various types of explosive or wood by the smellAll Star Batman Vol 1
    14Harley Quinn Vol 3 57. Sensed Scarecrow by the smell of fearBatman Vol 3 70.
    Can hear extremely subtle movements of his bats'' wingsSuperman: Unchained Vol
    1 2), Extrasensory Perception (Detected the Spectre), Vehicular Mastery (Can drive,
    sail, and fly with incredible efficiency), and Immense Willpower |-|Standard Arsenal=
    Enhanced Senses (His cowl has night vision and optical zoom, as well as x-ray
    vision), Information Analysis (Can scan biology and in seconds know details of
    a foe down to the cellular level), Illusion Creation (Uses EMP tech to disguise
    himself via holograms), Electricity Manipulation (His suit can discharge electricity
    powerful enough to faze Cyborg, and he can also discharge AOE blasts), Sound Manipulation
    (Has sound cannons in his chest, which is strong enough to dispel magical constructs),
    Heat Manipulation (His gauntlet can be superheated), Sleep Manipulation (Possesses
    tranquilizer darts in his gauntlet), Absorption (Absorbed energy and sent it back
    as electricity), Attack Reflection (Can send energy attacks right back at opponents
    with energy rejector systems), Energy Projection (Has lasers that can cut through
    inches of metal in seconds), Smoke Manipulation (Has smoke grenades in his teeth,
    and regularly creates smokescreens), Explosion Manipulation (Has explosives strong
    enough to throw Superman out of a building), Status Effect Inducement (With flashbangs
