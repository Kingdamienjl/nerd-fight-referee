    - field: powers_and_abilities
      value: Superhuman Physical Characteristics (See Attack Potency, Speed, and Durability),
        Hand-to-Hand Combat Mastery (Has months to years of training under Batman,
        and is playable in Rise of Sin Tzu - every single playable character in Rise
        of Sin Tzu is regarded by the game's manual as wielding "extraordinary martial
        arts abilities." Even Batman admired his "natural fighting skills." Has "natural
        athletic skills now honed by combat" and "plenty of combat experience," which
        Robin demonstrates by showcasing an acrobatic fighting style, with moves such
        as Flip Kick, Overhead Hammer (A spinning uppercut), Arm Sweep, a rush of
        flips and kicks, a leg-sweep, a breakdance-style kick, and momentum-based
        throws that use an enemy's own weight against them), Acrobatics (Is a "superb
        acrobat", performing flips and acrobatic maneuvers to traverse his environment,
        avoid attacks from his enemies, recover from attacks, and facilitate his own
        attacks), Superhuman Athleticism (Leapt inhumanly high to evade Talon's projectile
        screech. Made a large leap between a platform and a moving vehicle), Stealth
        Mastery (Alongside Batman, snuck into Ferret's hospital room totally silently,
        to the point that Static had no idea the Dynamic Duo had entered the room.
        Easily snuck past Scarecrow goons and snuck up on Scarecrow without him noticing
        at all. Has seemingly taken very well to the stealth aspect of being a vigilante,
        describing it as "half the fun" of being Robin), Paralysis Inducement (with
        the Batrope and Bola), Electricity Manipulation (with Electrified Batarangs),
        Smoke Manipulation (Every playable character in Rise of Sin Tzu wields smoke
        pellets as an on-hand gadget), Weapon Mastery (with Batarangs, which he can
        throw precisely so that the return arc sliced cables above Two-Face, easily
        disarm gun-toting thugs, etc), Bomb Defusal (Within Rise of Sin Tzu, Robin
        is one of the playable characters capable of defusing bombs) Later on, from
        Mystery of the Batwoman to Return of the Joker's flashback, Robin begins to
        display new abilities and gadgets, which makes sense considering the passage
        of several years:, Far Greater Hand-to-Hand Combat Mastery (Has kept up with
        his hand-to-hand combat training, and eventually trains himself to the point
        that his body is well-versed in "every trick the original Batman and Robin
        knew at their peak") With Optional Equipment, Sleep Manipulation (with the
        Tranq Darts he used in "Critters"), Acid Manipulation (with Herbicide) Due
        to being a close ally of Batman who has access to the Batcave, it stands to
        reason that his optional equipment could include all of Batman's equipment,
        as he could reasonably access it and use it in battle, which would give him
        a tremendous amount of additional abilities.
      source_id: character-stats-profiles-robin-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: At most Small Building Level (Downscaling from 39.7 Megajoules - Though
        a bit younger, his comparable (if not more intense, on-the-job) training from
        Batman should allow him to be at least somewhat compare to a suitless Batman
        II, who is between 16 and 17. Despite being generally portrayed as the physically
        weakest member of the Bat-family, Robin is trusted to fend for himself by
        Batman, and his attacks can utterly obliterate a wooden barrel with a metal
        frame and knock a foe into a metal dumpster hard enough to total it. Slammed
        a man into a concrete street with enough force to crater it. Can fight and
        knock out goons in Rise of Sin Tzu - random fodder enemies in that game can
        get up after having a giant wooden crate slammed on their head hard enough
        to completely obliterate it (with Robin also being capable of shattering these
        wooden crates with a simple parry) - which would come out to about 530 KJ.
        In addition, during one story mission, common enemies in Rise of Sin Tzu are
        shown to, over time and with several minutes of constant attack, wear down
        and damage the Batcave's thick metal security doors. Can consistently knock
        criminals out in single attacks), possibly higher (With difficulty, karate-chopped
        through the Bat-cuffs, which have successfully restrained many Bat-rogues
        over the years - however, he did this by striking a single link in the chain.
        Harmed this goon, who earlier was not knocked out by a swing kick from Batman.
        Shown to have leg-swept and temporarily beaten down a Freeze goon who got
        up after a kick from Batgirl. Threw film reels hard enough to harm Two-Face.
        However, Robin scaling to those characters has its own share of antifeats.
        For example, during "Knight Time," Robin cannot even budge Bruce Wayne, and
        is casually restrained by the latter with one arm, even when Wayne was literally
        not cognizant of his actions. Furthermore, during "Growing Pains," Robin is
        completely incapable of budging an incomplete Clayface with his attacks) |
        Small Building Level (Scaling to 0.095 Tons - Several years older and more
        experienced than his 13-year-old counterpart. At the time of Return of the
        Jokers flashback, since Robin was still active as a hero, he should be at
        least as strong as himself when he is several-decades-retired, a state in
        which his body was still a strong enough vessel for The Joker to inhabit,
        making Batman II go limp with a punch combo (generally trouncing him throughout
        their fight, as confirmed by the notes in ROTJ's screenplay) and being called
        a "deadlier" version of the Clown Prince of Crime, tossing Batman through
        a wooden table. The Joker instructed Harley Quinn to fake a mugging to take
        Robin off guard in order to capture him, implying at least some lack of confidence
        in Harley defeating the Teen Wonder head-on)
      source_id: character-stats-profiles-robin-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
