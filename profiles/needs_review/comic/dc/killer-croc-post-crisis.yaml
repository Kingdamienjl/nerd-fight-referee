power_scale:
  tier:
    text: At least | At least
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: At least Small Building level+, possibly higher (Slightly stronger than
      Batman and comparable to a venomless Bane and was beating him up at first. Knocked
      out an off guard Batman with a single punch in the back of the head, tore apart
      a jail cell made for regular prisoners, ripped or busted open a metal door,
      did something similar with an elevator's metal frame, can easily punch through
      glass, walls and even the roof of a train, bit through Batman's bulletproof
      cowl, killed two other meta-humans, snapping the neck of one of them) | At least
      Building level (Much stronger than before and comparable to those who can hurt
      him. Busted out of a cell made for his unmutated self, scratched through his
      own skull, his own jaws are strong enough to bite through his tough hide)
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Supersonic+, possibly Hypersonic+ reaction/combat speed (Comparable
      to Batman, could keep up with venomless Bane, sneaks up on Batman while he's
      talking with Ivy, Supergirl complimented his speed, given his size, kept up
      with Katana underwater) | At least Supersonic+, possibly Hypersonic+ reaction/combat
      speed (Faster than before according to himself and Batman as he caught one of
      Robin's kicks from behind, called Batman slow and was shown to be faster than
      Catwoman), Unknown travel speed (Shoulder tackled the Batmobile and made it
      crash)
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class 5 (Flipped a car upside down, sent a moderately sized gator flying,
      lifted several wooden crates including a big one that was quite heavy even for
      him) | At least Class 10 to Class 25 (Easily lifted a car over his head and
      threw it off-screen, tore a bank vault door off the vault [which likely weighed
      20 tons or more], easily lifted Solomon Grundy's 1000 lb body with his jaws),
      possibly Class K (In a fit of rage, he ripped out the head and spine of one
      of Black Mask's thugs, which would require around 1 million newtons, or 101~102
      tons-force)
    source_ids: &id002
    - mediawiki-402918
    confidence: 0.95
  striking_strength:
    text: At least Small Building level+, possibly higher | At least Building level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Small Building level+, possibly higher (Fell a good height and
      shrugged it off, tasers didn't hurt him, Tim Drake sneak attacked him with a
      metal bar to the back of the head and all it did was break the bar, survived
      a punch from Supergirl which sent him flying though it left him knocked out,
      survived a tackle from an angry Aquaman, chose to fall off a 52nd floor into
      the water and has survived and shrugged off a few huge falls off buildings,
      Axe-Man's axe bounced off his hide as if it were made out of metal, tanked this
      huge crash, as shown during this fight with Harley Quinn, his skin is at least
      few centimeters thick) | At least Building level, possibly higher (Explicitly
      stated to be tougher than before, and Batman even needed an explosive to take
      him down, tanked gunfire from what appears to be a modified Apache's gatling
      gun)
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Comparable to Batman, Batman used a spear-like metal fencepost
      to stab him but Croc pushed it on Bats himself, stabbing him with the other
      end, climbed 52 floors non-stop by sticking to the side of a building with his
      claws, repeatedly got stabbed from Katana underwater and kept on fighting, felt
      nothing after Huntress shot three arrows through his arm, ignored bullets strong
      enough to penetrate his hide) | Superhuman (Replicated a similar feat from earlier,
      climbing up a skyscraper with his claws, scratched his head until he reached
      the brain and then ran across Gotham towards the one responsible for turning
      him into a puppet, bit his own hands off in order to escape from Arkham)
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range (Is 6'5" or 1.95 m tall) | Extended Melee Range due
      to increased size (Is 7'5" or 2.26 m tall)
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Varies from Below Average (Has shown signs of slight speech impediment)
      to Above Average (Could keep up with Bane and even broke his venom device and
      snuck up on Batman once, defeated Huntress underwater and trapped her there
      so she could drown, all while under the effects of the Joker virus which slowly
      killed whoever had it, tried to convince Creeper that he was just as much of
      a freak as him and that he should free him, Wonder Woman finds his fighting
      expertise valuable) | Varies from Below Average to Above Average (Though his
      mind became consumed by hunger and he's still a bit thuggish, he's shown some
      signs of intelligence, like when he set up a trap for Batman or when he escaped
      Arkham by biting his own hands off)
    source_ids:
    - vsbattles-killer-croc-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
