        on it) *Fire Manipulation (Griffins can shoot flame)'
      source_id: character-stats-profiles-riddler-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: At most Small Building Level physically (Downscaling from 39.7 Megajoules
        - Harmed a 13-year-old Robin with a kick, sending him flying - even early
        in his career, Robin could shake off a punch from an incomplete Clayface,
        whose kicks could shatter a stone bench), possibly higher (Even at 13, Robin
        can be argued to scale low-end relative to fighters such as Batgirl. Speculated
        to be capable of posing a physical threat if he entered a fight with Batman),
        Small Building Level with his staff (Scaling to 0.095 Tons - Smacked around
        Batman in the B:TAS Sega CD game), higher with Preparation (Planted a bomb
        that would have killed Batman if he hadn't locked himself in the safe. The
        traps he set up in the amusement park maze were remarkably powerful; the Griffin's
        flame, which was implied to be capable of killing Batman and Robin, could
        also vaporize parts of walls and vaporize another Griffin's metal head. The
        blades he prepared were implied to be capable of slicing through Batman and
        Robin, and embedded themselves deeply in stone walls. The Hand of Fate could
        slam the Minotaur through a stone wall. The Minotaur destroyed a table, sliced
        through stone, and is strongly implied to be capable of killing Batman and
        Robin)
      source_id: character-stats-profiles-riddler-rebirth-dc
