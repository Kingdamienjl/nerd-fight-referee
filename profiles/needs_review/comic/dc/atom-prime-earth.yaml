        Big Bang: Captain Atom is also able to control incredible amounts of energy,
        being able to catalyze another Big Bang if he so wished., Dilustel Armor:
        Captain Atom''s metallic shell, or "skin", is composed of a portion of the
        alien being known as Silver Shield, and is called Dilustel. Pieces of the
        alien''s metal body were used in the Captain Atom Project, Project Major Force
        and similar projects thereafter. Nathaniel is able to coat himself with the
        metal, either partially or totally. Atom''s symbiosis with the metal is such
        that even partially armored, he is able to access the Quantum Field., Quantum
        Field Manipulation: Captain Atom''s metal skin is tied into the Quantum Field,
