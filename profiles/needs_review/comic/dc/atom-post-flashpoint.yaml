        alien being known as Silver Shield, and is called Dilustel. Pieces of the
        alien''s metal body were used in the Captain Atom Project, Project Major Force
        and similar projects thereafter. Nathaniel is able to coat himself with the
        metal, either partially or totally. Atom''s symbiosis with the metal is such
        that even partially armored, he is able to access the Quantum Field., Quantum
        Field Manipulation: Captain Atom''s metal skin is tied into the Quantum Field,
        which enables him to absorb and manipulate incredible amounts of energy for
        a wide variety of applications. As a result, he is able to create an exact
        replica of Earth, complete with life, with a thought, as well as duplicates
        of Superman, Firestorm and even the Spectre with ease. His power is such,
        he was able to instantaneously create an entire universe out of nothing, but
        he has never used this level of power again as a result of him mentally limiting
        himself. Captain Atom is also able to absorb potentially harmful energy into
        himself, but absorbing too much can overload him and send him hurtling through
        time. Captain Atom can fire and control energy of any form. He commonly manipulates
        his energy into forcefield bubbles, or explosive ''bombs'', as well as simple
        blasts of kinetic force. While he usually aims with his hands, he is able
        to emit energy from any point on his body. Several times he has "detonated",
        releasing a massive amount of energy at once, destroying objects within an
        certain radius. On more than one occasion, he has used his ability to manipulate
        all forms of energy to prevent a foe using their own powers'
