    - field: attack_potency
      value: Varies (Captain Atom's power levels vary greatly, and he has complete
        control over the output of his power levels. He can power himself down and
        up at will. In addition, he is mentally and emotionally somewhat unstable,
        which also tend to mess with his powers. Furthermore, his unstable physical
        form causes fluctuations in his power levels from time to time. And he can
        control how much power to draw from the Quantum Field). Solar System level
        (In an alternate vision, a Quantum-powered gorrila was able to overpower the
        Justice League. This was a vision shown to future Captain Atom who saw potentially
        different possibilities and how his powers could have been used differently.
        A burst of quantum flare proved too much for Hal Jordan to contain with his
        shield and left a portion of the city destroyed. Captain Atom has access to
        the infinite energies of the Quantum Field), higher in Evolved Form (However,
        it was hinted that in some ways, he might be superior to his former, unstable
        self.The Fall and Rise of Captain Atom Vol 1 3 Captain Atom has access to
        the infinite energies of the Quantum Field), up to High Complex Multiverse
