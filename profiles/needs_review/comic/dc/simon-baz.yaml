    - field: powers_and_abilities
      value: 'These are powers or abilities that are commonly displayed amongst members
        of the Green Lantern Corps in order for them to combat their enemies effectively,
        though do keep in mind not every member shares the same hax these are just
        the ones that are inherent byproducts of being a member of the Green Lantern
        Corps...Willpower Manipulation, Emotional Manipulation, Energy Manipulation
        via Emotional Energy Manipulation (Members of the Green Lantern Corps harness
        the power of willpower from the Emotional Energy Spectrum in order to fuel
        their ringsGreen Lantern: Rebirth #3 (February, 2005), it''s also stated hereGreen
        Lantern Vol 5 #21 (August, 2013)), Indomitable Will, Flight, Creation (By
        using their imaginations members of the Green Lantern Corps can create constructs
        using their rings, Two-Six states this to be an akin to an equation with an
        infinite amount of possible outcomes), Telepathy (Members of The Green Lantern
        Corps can communicate with other members via telepathic sub-channels),'
      source_id: character-stats-profiles-simon-baz-dc-comics
