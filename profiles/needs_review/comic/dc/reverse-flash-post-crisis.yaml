        his strongest attacks could deform space-time itselfDark Crisis: Big Bang,
        December 2022), Resistance to Mind Control (Hard to control by Gorilla Grodd),
        Mind Manipulation (Can phase to avoid Trickster''s mind tricks), Reality Warping,
        Empathic Manipulation (Kissed Iris and removed the effects of the Anti-Life
        Equation), Limited Memory Manipulation (Remembers Wally West and gets him
        from the Speed Force despite his memories of him being erased), Energy Manipulation,
        Life Manipulation, Absorption (Broke free from Turtle''s blast), Absolute
        Zero (Obstructed Captain Cold''s Absolute Zero gun) With Negative Speed Force,
        he gains the following: Aura, Damage Boost (His aura can incinerate bullet''s,
        cause explosions making contact with things, and the more punches he takes,
        the more his aura build''s up to explode his oppenent)'
