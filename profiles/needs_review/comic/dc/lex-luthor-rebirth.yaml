        due to his fear of killing Luthor, which could affect the extent to which
        he allows himself to not hold back) | Brown Dwarf Level, possibly far higher
        (Upscaling from 8.018 Quettatons - Should be much stronger than his prior
        state, even with several tentacles. Essentially 1v7''d the Justice League
        until The Flash used his full power to defeat him. His beams could more-or-less
        oneshot Superman, Green Lantern, Martian Manhunter, Hawkgirl, and Wonder Woman,
        albeit Superman was arguably weakened at the time. With a fraction of his
        power, he created pseudo-clones of the League: though several of the clones,
        notably Flash''s (who the genuine article blitzed) and Superman''s, are weaker
        than the people they''re meant to imitate, one of these clones could struggle
        with Martian Manhunter. While this could easily be untrue and simply Goldface
        being ignorant, Goldface references a fully fused "Lexiac" as "more powerful
        than (the Legion of Doom) put together" - with the Legion of Doom, at the
        time, containing Bizarro, Rampage, Sinestro, Volcana, Star Sapphire, Tala,
        and Giganta, among others. See here for my reasoning as to why DCAU Superman
        is not Low Complex Multiversal)'
