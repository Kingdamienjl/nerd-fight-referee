    - field: powers_and_abilities
      value: "Base: * Superhuman Physical Characteristics (See Attack Potency, Lifting\
        \ Strength, and Durability) * Genius Intelligence (See Intelligence) * Preparation\
        \ (Prepared traps for Kryptonians and AMAZO, and built a nanotech disruptor\
        \ weapon to dismantle AMAZO during \"The Return.\" Prepared missiles to destroy\
        \ Brainiac. Made a plan to get Superman into the vicinity of Kryptonite in\
        \ order to defeat him. Installed overrides into dozens of members of the Legion\
        \ of Doom to make sure their powers would be ineffective against him. Built\
        \ a Kryptonite-infused nuclear warhead to kill Superman, as depicted in \u201C\
        Legacy.\u201D Prepared a getaway vehicle with missiles while confronting the\
        \ League. Built the Energy Disruptor to de-power the Justice League. Often\
        \ provides his associates with weapons) * Social Influencing (Charisma and\
        \ Deception: Is an almost peerlessly shrewd businessman known for his ability\
        \ to charm and influence others. Easily manipulated AMAZO during \u201CTabula\
        \ Rasa,\u201D and during \"The Return,\" when AMAZO despised him, Lex was\
        \ still so compelling that he could talk AMAZO out of killing him. Convinced\
        \ several members of the Legion of Doom (including Sinestro, who holds basically\
        \ no loyalty to anyone) to join him instead of Grodd) * Archery Skill (Hit\
        \ a bullseye from a distance) If given preparation time, Lex can utilize:\
        \ * Energy Projection (With his energy pistol, his military drones, etc) *\
        \ Situational Durability Negation and Statistics Reduction (with Kryptonite,\
        \ which has these effects on Kryptonians such as Superman) * Hacking (Hacked\
        \ the JL Watchtower to make it fire the fusion cannon) * Flight (with several\
        \ vehicles such as the Lex-wing, his helicopter, and the police battlesuit)\
        \ * Statistics Amplification and Mind Manipulation (Given time, he made dozens\
        \ of members of the Legion of Doom more powerful and re-wired Bizarro\u2019\
        s brain to make him totally loyal to him. Built a mind control device for\
        \ Grodd) * Explosion Manipulation (Prepared missiles to destroy Brainiac.\
        \ The Lexo-skel and Police Battlesuit both have grenade launchers. Built a\
        \ bomb to blow up the JL Watchtower. Planted bombs beneath his cloning lab)\
        \ * Fire Manipulation (His mech could shoot fireballs) * Light Manipulation\
        \ (The police battlesuit fires Blacklight Lasers) * Homing Attack (The Lexwing\
        \ fires homing missiles) * Electricity Manipulation (With these gauntlets.\
        \ His crony used a taser powerful enough to knock out Bizarro. The Lexo-skel\
        \ can also electrify its exterior) * Power Nullification (with the Energy\
        \ Disruptor, which depowered the Justice Lords) * Large Size (Many of his\
        \ robots possess this) * Attack Reflection against Magic (with this artifact)\
        \ * Resistance to and Reversal of Mind Manipulation (Turned Grodd's mind manipulation\
        \ back onto him), as well as Negation/Reversal of Metal Manipulation (Created\
        \ a contingency to override and reverse Dr. Polaris' ferrokinesis) Slightly\
        \ Brainiac Enhanced: All previous abilities, as well as: * A greater degree\
        \ of Superhuman Physical Characteristics * Limited Biological Manipulation\
        \ (Brainiac's influence within his body cured his cancer and increased his\
        \ strength) * Resistance to Extreme Heat (His hand was completely unaffected\
        \ by containing the fiery explosion of an explosive Batarang) Lexo-suit: All\
        \ previous non-preparation-based abilities, as well as: * Energy Projection\
        \ (with this beam) * Electricity Manipulation (Electrocuted Wonder Woman upon\
        \ contact) * Flight (Can freely fly through the air) Fused with Brainiac (Pre-Dark\
        \ Heart Absorption): All previous non-preparation based abilities, as well\
        \ as: * Explosion Manipulation (Caused this huge explosion) * Regeneration\
        \ (Mid-Low: Healed from being shot repeatedly) * Additional Limbs (with his\
        \ tentacles) * Multiple Selves (Brainiac also inhabits his body) * Paralysis\
        \ Inducement (with his tentacles) * Matter Manipulation (Turned the Lexcorp\
        \ building into a ship) * Resistance to Extreme Heat (Brainiac's prior enhancements\
        \ gave him this) Fused with Brainiac (Post-Dark Heart Absorption): All previous\
