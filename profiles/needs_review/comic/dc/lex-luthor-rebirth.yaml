    - field: attack_potency
      value: 'Small Building Level physically (Downscaling from 0.095 Tons - While
        certainly weaker to some extent, hurt Batman with a headbutt and punch, though
        he didn''t succeed in doing much but momentarily staggering the Dark Knight.
        Smashed machinery with his bare hands), far higher with weaponry and preparation
        (Built a mech that oneshot Hawkgirl and defeated Green Lantern. Though seemingly
        weaker, the Lexcorp police battlesuit seems to have kept up with and slightly
        harmed Superman. Prepared a 6.5 megaton payload of missiles to destroy Brainiac.
        Put a half kiloton of explosives under his cloning lab. The Lexo-Skel could
        blow up a tank in one shot and nuke a building with its grenades. His mechanical
        dinosaur should be at least Small Building Level due to sheer size and (presumable)
        mass) | At least Small Building Level physically (Upscaling from 0.095 Tons
        - Stronger than before due to Brainiac enhancing his physical strength. Effortlessly
        stomped The Question, slapping him across a room and slamming him into a large
        wooden desk with enough force to split it in half. Easily kept up with and
        is implied to be stronger than Batman), far higher with Weaponry and Preparation
        (Should have access to the same arsenal as his base form) | Brown Dwarf Level
        (Scaling to [https://character-stats-and-profiles.fandom.com/wiki/User_blog:Xanadude72/DC_Animated_Universe_(DCAU)_Upgrade_Calculations_(Part_1)#RECALCULATION::~:text=**3.4680853e%2B37%20Joules,I%20stand%20corrected.]1.002
        Quettatons - His beam could beam struggle with Green Lantern, harm GL despite
        GL''s energy aura being up, and harm Season 1 Superman. Though JL Season 1
        Superman is plot nerfed (even in the opinion of Bruce Timm himself), he was
        still strong enough to take hits from the likes of Solomon Grundy and Star
        Sapphire and keep fighting, as well as completely no-sell blade attacks from
        Metamorpho that sliced apart Martian Manhunter) | Brown Dwarf Level with individual
        tentacles (Downscaling from [https://character-stats-and-profiles.fandom.com/wiki/User_blog:Xanadude72/DC_Animated_Universe_(DCAU)_Upgrade_Calculations_(Part_1)#RECALCULATION::~:text=**3.4680853e%2B37%20Joules,I%20stand%20corrected.]1.002
        Quettatons - His tentacles could harm and restrain Martian Manhunter, as well
        as Wonder Woman), far higher with multiple tentacles (Upscaling from 8.018
        Quettatons - Put enough pressure on Green Lantern''s shield to shatter it,
        though this did cause the tentacles performing this feat to be torn apart.
