    - field: intelligence
      value: 'At least Genius. John is very knowledgeable in occult matters, and is
        expert in various kinds of magic, such as clairvoyance, summoning voodoo,
        necromancy and many others, and can even combine them in spells of his own
        creation. As better detailed in his Social Influencing and Preparation sections
        in his Powers & Abilities, John is an incredibly clever talker and planner,
        with his sheer ability to convince people bordering on the supernatural and
        his wit in coming up with ploys being second to no one, not to mention a skilled
        detective, as shown when he tracked down a criminal that had evaded the police
        for his whole life in seemingly less than a day. Standard Tactics: Despite
        his breadth of magical techniques and knowledge, John has typically been portrayed
        as unimpressive in direct fights, preferring to attempt to defeat assailants
        in hand to hand combat over using any more supernatural ability.'
