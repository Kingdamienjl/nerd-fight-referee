        regenerate. Can outrace the Black Racer and restore himself into reality,
        and will continue to exist within the speed-force) Flight, Dimensional Travel,
        BFR (At will took Gorilla Grodd with him into the Speed Force), Regeneration
        (Varies, up to High-Godly through the speed-force. Brought himself back after
        being erased from existence on a temporal scale by Anti-Monitor Heat Manipulation
        (Defrost a man out of ice), Time Manipulation (Can accelerate his own time),
        Electricity Manipulation, Biological Manipulation (Helps save someone from
        cyanide poisoning), Accelerated Development (Uses Speed Mind to instantly
        learn how to use Hal Jordan''s Green Lantern Ring), Limited Instinctive Reaction
        (Instinctively dodged a bullet hitting his forehead at the femtosecond his
        body felt it, something he briefly forgot he did), Limited Power Nullification
        (Vibration dissipate energy), Limited Power Absorption (Channel Daniel West
        power''s), Aura (Has a aura that protect''s him from not hitting the ground
        hard), Density Manipulation (Speed Force allows him to control the density
        of metals), Enhanced Senses, Portal Creation (Ran so fast that he created
        a portal to the Speed Force), Regeneration (Low-Mid, though it works almost
        instantaneously), limited Plot Manipulation (Caused the creation of the New
        52 cosmology by saving his mother from death, which is an entirely retconned,
        rebooted interpretation of DC''s cosmology. Can theoretically perform the
        retcon punch. Should possess the same abilities as Reverse-Flash) Resistance
        to Absorption (Broke out Reverse Flash attemping to absorb him) and Possession
        (Can control spirits possessing him by vibrating) With Negative Speed Force,
        he gains the following: Enhanced Time Travel (Time travelled on multiple occasions
        without the need of the Cosmic Treadmill), Limited Power Nullification and
        Electricity Manipulation, Resistance to Plot Manipulation, Immortality Negation,
        and Existence Erasure (Should be comparable to Wally. Unaffected by Darkseid''s
        omega beams), Higher-Dimensional Manipulation (Through altering his vibrational
        frequencies and phasing), Beyond-Dimensional Physiology (By virtue of being
        a vessel of the speed force) |-|Rebirth=All previous abilities, Limited Astral
        Projection (Can mentally send his consciousness into the Speed Force to check
        other timelines), Light Manipulation (Can use lightning to produce blinding
        amounts of light), Dimensional Travel, BFR (Was able to punch the Anti-Monitor
        into other universesDark Crisis: Big Bang, December 2022), Power Bestowal
        (Can give other''s more speed and here), Spatial Manipulation, Time Manipulation
        (Moved Time and Space a few seconds ahead of the Still Force. At his peak,
