    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Enhanced Senses (Designed sound
        receptors to aid in hearing while moving over the speed of sound), Extrasensory
        Perception (Can sense everyone touched by the Speed Force), Surface Scaling
        (Can run up an ocean tide), Air Manipulation, Intangibility, Time Travel,
        Precognition, Immortality (Types 1, 3, 5, 8, and 9. Possesses temporally-eternal
        life via being anchored to the speed-force. Can instaneously regenerate. Can
        outrace the Black Racer and restore himself into reality, and will continue
        to exist within the speed-force) Flight, Dimensional Travel, BFR (At will
        took Gorilla Grodd with him into the Speed Force), Regeneration (Varies, up
        to High-Godly through the speed-force. Brought himself back after being erased
        from existence on a temporal scale by Anti-Monitor Heat Manipulation (Defrost
        a man out of ice), Time Manipulation (Can accelerate his own time), Electricity
        Manipulation, Biological Manipulation (Helps save someone from cyanide poisoning),
        Accelerated Development (Uses Speed Mind to instantly learn how to use Hal
        Jordan''s Green Lantern Ring), Limited Instinctive Reaction (Instinctively
        dodged a bullet hitting his forehead at the femtosecond his body felt it,
        something he briefly forgot he did), Limited Power Nullification (Vibration
        dissipate energy), Limited Power Absorption (Channel Daniel West power''s),
        Aura (Has a aura that protect''s him from not hitting the ground hard), Density
        Manipulation (Speed Force allows him to control the density of metals), Enhanced
        Senses, Portal Creation (Ran so fast that he created a portal to the Speed
        Force), Regeneration (Low-Mid, though it works almost instantaneously), limited
        Plot Manipulation (Caused the creation of the New 52 cosmology by saving his
        mother from death, which is an entirely retconned, rebooted interpretation
        of DC''s cosmology. Can theoretically perform the retcon punch. Should possess
        the same abilities as Reverse-Flash) Resistance to Absorption (Broke out Reverse
        Flash attemping to absorb him) and Possession (Can control spirits possessing
        him by vibrating) With Negative Speed Force, he gains the following: Enhanced
        Time Travel (Time travelled on multiple occasions without the need of the
        Cosmic Treadmill), Limited Power Nullification and Electricity Manipulation,
        Resistance to Plot Manipulation, Immortality Negation, and Existence Erasure
        (Should be comparable to Wally. Unaffected by Darkseid''s omega beams), Higher-Dimensional
        Manipulation (Through altering his vibrational frequencies and phasing), Beyond-Dimensional
        Physiology (By virtue of being a vessel of the speed force) All previous abilities,
        Limited Astral Projection (Can mentally send his consciousness into the Speed
        Force to check other timelines), Light Manipulation (Can use lightning to
        produce blinding amounts of light), Dimensional Travel, BFR (Was able to punch
        the Anti-Monitor into other universesDark Crisis: Big Bang, December 2022),
        Power Bestowal (Can give other''s more speed and here), Spatial Manipulation,
        Time Manipulation (Moved Time and Space a few seconds ahead of the Still Force.
        At his peak, his strongest attacks could deform space-time itselfDark Crisis:
        Big Bang, December 2022), Resistance to Mind Control (Hard to control by Gorilla
        Grodd), Mind Manipulation (Can phase to avoid Trickster''s mind tricks), Reality
        Warping, Empathic Manipulation (Kissed Iris and removed the effects of the
        Anti-Life Equation), Limited Memory Manipulation (Remembers Wally West and
        gets him from the Speed Force despite his memories of him being erased), Energy
        Manipulation, Life Manipulation, Absorption (Broke free from Turtle''s blast),
        Absolute Zero (Obstructed Captain Cold''s Absolute Zero gun) With Negative
        Speed Force, he gains the following: Aura, Damage Boost (His aura can incinerate
        bullet''s, cause explosions making contact with things, and the more punches
        he takes, the more his aura build''s up to explode his oppenent)'
