        to the battle brought him to travel all around the world, on a path of constant
        improvement and to battle all kind of opponents and fighting styles. While
        not academically educated in a conventional way, Ryu was taught much by his
        master Gouken and his flaws are only due to his disattachment and uninterest
        in society and modernities. Ryu also expands his knowledge on his own, absorbing
