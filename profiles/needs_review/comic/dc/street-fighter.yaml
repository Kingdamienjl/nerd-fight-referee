        who is not lacking in any one area, with his specialty being a very strong
        defense and an optimal usege of projectiles. As a result, Ryu is a flexible
        fighter, with an unbreakable spirit and a mind that is completely calm in
        battle. This attitude allows him to stay focused during a fight, read his
        adversaries, learn from them, take advantage of their mistakes and analyze
        their style.Ultra Street Fighter IV - Ryu''s Versus Mode Quotes (vs. Sakura)Street
