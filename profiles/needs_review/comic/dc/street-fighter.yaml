    - field: intelligence
      value: 'Gifted (Ryu is an extraordinarily talented martial artist, being singled
        out by Akuma as a worthy foe and by M. Bison as a strong vessel to seize as
        his own. Has completely mastered Ansatsuken and always learns techniques from
        other styles, adding his own innovations to them.All About Street Fighter
        ZERO 3 His style of fighting designates him as an "All-Rounder", a jack-of-all-trades
