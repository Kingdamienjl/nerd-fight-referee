    - field: powers_and_abilities
      value: 'Tier: 9-A physically, Low 7-C via Weapons Name: Adrian Chase Nicknames:
        Vigilante (Hero), DCEU Vigilante (Out of Universe) Origin: DC Extended Universe
        later incorporated into the DC Multiverse Gender/Sex: Male (He/Him/His) Kill
        Count: At Least 10 Age: 29 (August to October 2020; Born June 1991) Height:
        180.3 cm Weight: 78 kg Classification: Human, Mass Serial Murderer, Anti-Hero
        * Status: Alive (Active) Powers and Abilities: * Superhuman Physical Characteristics
        * Martial Arts (Beat down a thug with little to no effort. Chase is a highly
        skilled and formidable hand-to-hand combatant and martial artist. He is able
        to fight the master martial artist, Judomaster alongside Peacemaker, even
        managing to outlast Peacemaker before he was defeated by the more skilled
        foe.) ** Pressure Point Strikes * Acrobatics and Agility * Weapon & Armour
        Mastery * Stealth Mastery (Tracked down and followed Task Force X without
        being noticed.) * Preparation (Always equipped with weapons and his suit.
        Found Task Force X with no info.) * Natural Weaponry (Fist, Feet, Teeth, and
        Nails) * Social Influence ** Reputation, Fear Inducing, & Respect; Known as
        a hero. Likely gained respect or fear from other prisoners after beating one
        up. * Vehicular Mastery Attack Potency: Small Building Level physically (Comparable
        but inferior to Peacemaker. Can fight White Dragon, who charged a blast to
        destroy part of a van (40.423 MJ), White Dragon could have killed him (0.022-0.0838
        Tons). Can fight possessed humans who survive shockwaves ([https://vsbattles.fandom.com/wiki/User_blog:Spinosaurus75DinosaurFan/Peacemaker_Sonic_Boom
