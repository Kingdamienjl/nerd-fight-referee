power_scale:
  tier:
    text: 2-A normally, 1-A at his peak
    source_ids:
    - character-stats-profiles-doomsday-rebirth-dc
    confidence: 0.9
    notes: auto_repair source extraction
  attack_potency:
    text: Multiverse level+ normally (Portrayed as being comparable to Superman, who
      in his clash against Jaxon the Mighty generated enough energy to counter the
      combined power of the future Green Lantern Corps, which destroyed multiple timelines.
      Superior to the likes of Wonder Woman, who restrained Firstborn, a monstrous
      being capable of destroying all of the underworld - an infinite plane of reality
      and Wonder Woman destroyed the Chronus Scepter, which contains the power of
      the Godwave that surrounds the multiverse.), Outerverse level at his peak (Doomsday
      defeated True Form Darkseid, which was confirmed by writers of DC Comics. Darkseid
      was ending all of existence during one of his fights where he defeated Highfather.
      Darkseid, being a New God, should be an incredibly powerful, living idea from
      a kind of Platonic, archetypal world. New Gods exist within the Sphere of the
      Gods, The Sphere of the Gods is consistently beyond the concepts of space and
      time. Within the Sphere of the Gods, there are infinite limbos, and infinite
      heavens and hell. Doomsday have also broken The Phantom Zone. The Phantom Zone
      is described as a boundless dimensionless dimension between being and nothingness
      and it resides within the Sphere of the Gods, described multiple times as a
      Platonic, archetypal world, beyond the Bleed, which contains all dimensions,
      in which there are an infinite number of. The Phantom Zone exists at the same
      level as New Genesis, which is beyond the bounds of space and time.)
    source_ids:
    - character-stats-profiles-doomsday-rebirth-dc
    confidence: 0.9
    notes: auto_repair source extraction
  speed:
    text: Immeasurable normally, Irrelevant at his peak (Can keep up with the likes
      of Superman, who flew into Hyperspace, which is a realm that exists beyond space
      and time, who flew back in time through the timestream until he flew through
      a timeless, placeless dimension, Superman flew out of the Source after Highfather
      said that it would be impossible to do.)
    source_ids:
    - character-stats-profiles-doomsday-rebirth-dc
    confidence: 0.9
    notes: auto_repair source extraction
