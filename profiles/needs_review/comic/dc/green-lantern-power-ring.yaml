      value: "Superhuman Physical Characteristics (At least Striking Strength, Speed,\
        \ and Durability), Empowerment (The GL Ring empowers its wearer), Enhanced\
        \ Senses (Only a Lantern can hear a certain frequency emitted by their ring),\
        \ Flight (Lanterns are capable of free flight, at Massively Hypersonic speeds\
        \ in an atmosphere and MFTL+ speeds in space), Energy Projection (The GL ring\
        \ allows its users to fire beams and blasts of emerald light to damage enemies\
        \ - these beams can be wide and destructive, focused laser cutters, or take\
        \ the form of omnidirectional energy bursts), Creation (The GL ring can cause\
        \ its energy to take any shape, such as bubbles to encase and transport things,\
        \ a catapult, large fists, various hands, a bridge, a large maze, an apparition\
        \ of a ghost, a large lantern, a hand, a fake ring, a ramp, a mattress, a\
        \ surfboard, a pincer hand, chains, a giant baseball glove, glasses that actually\
        \ work, a cast for one's arm, among many others - the ring can create essentially\
        \ anything the wielder can imagine, so this list is far from all-encompassing),\
        \ Forcefield Creation (Said constructs include barriers and other such force\
        \ fields), Weapon Creation (Can create an axe, a hammer, a buzzsaw, a sword,\
        \ a scalpel, a scythe, a mech suit that could fire missiles, a huge sledgehammer,\
        \ a cylindrical hammer, among other weapons), Paralysis Inducement (Can restrain\
        \ foes with various constructs - it can create a restraint that gags opponents,\
        \ which could prove useful when fighting enemies whose powers depend on their\
        \ speech), BFR (Ring users can catapult things into the distance, and a brainwashed\
        \ John Stewart was capable of putting a shield around an item and then propelling\
        \ it far away), Phasing (Kyle Rayner's ring allowed him to phase through a\
        \ building), Pseudo-Telekinesis (Wielders can surround things with emerald\
        \ energy, letting them lift and move things), Acausality (Type 1: John Stewart,\
        \ as well as his teammates who were enveloped in his ring energy, were unaffected\
        \ by Vandal Savage drastically altering the past), Danmaku (AMAZO, upon recreating\
        \ John Stewart's ring, demonstrated the ability to fire dozens of blasts instantly),\
        \ Explosion Manipulation (John Stewart created RPG round constructs that released\
        \ fiery explosions upon detonation. Kyle Rayner created a construct that blew\
        \ up), Heat Manipulation (Kilowog's lantern beam melted metal, sealing a large\
        \ door, and Justice Lord John Stewart's ring beam could weld metal to the\
        \ Watchtower), Cloth Manipulation (John Stewart's ring can create his uniform\
        \ and another set of clothes), Automatic Translation (GL rings automatically\
        \ translate any and all languages in its database for the wielder's convenience),\
        \ Decoy Creation (John Stewart created a decoy construct of himself to distract\
        \ Sinestro and Killer Frost), Negation of Darkness Manipulation (John Stewart's\
        \ beam negated The Shade\u2019s sentient shadows, absorbing them), Limited\
        \ Technopathy (John Stewart's ring beam could boost the signal of a distress\
        \ call from the Watchtower), Limited Energy Absorption (John Stewart's ring\
        \ absorbed all the power contained within Oa's Central Power Battery, and\
        \ took in Static's electricity as a substitute for typical ring energy), Possible\
        \ Illusion Creation (The GL ring should behave similarly to Sinestro's, which\
        \ could make him appear to be John Stewart), Possible Light Manipulation (Lantern\
        \ energy is implied to be light several times, as detailed here) GL Constructs\
        \ (including the skintight energy barrier Lanterns place upon themselves)\
        \ can resist:, Existence Erasure (John Stewart could shield himself and a\
        \ few other Leaguers from the Anti-Life Equation, which erases things from\
        \ existence), Matter Manipulation (John Stewart's shield construct withstood\
        \ a beam from Brainiac's mothership, which digitized solid objects), Sound\
        \ Manipulation (One of John Stewart's constructs endured Silver Banshee\u2019\
        s screech), Extreme Heat (Jessica Cruz' constructs were unaffected by being\
        \ extremely close to the sun. John Stewart's constructs were capable of holding\
        \ back a wall of flames, as well as Volcana's blasts of fire and Dreamslayer's\
        \ flame), Radiation Manipulation (GL constructs are unaffected by the ambient\
        \ radiations of space, as seen in John Stewart's spaceflights like at the\
        \ end of \u201CIn Blackest Night\u201D or his journey to Kalanor in \u201C\
        Hearts and Minds,\" or the GL Corps' exodus to Earth during \"The Return.\"\
        \ John Stewart's barrier effectively insulated Supergirl against Kryptonite\
        \ radiation), Electricity Manipulation (John Stewart's barrier could shield\
        \ against electricity from Static)"
