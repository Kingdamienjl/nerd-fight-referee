      of creating shields that can protect against attacks of this level, as well
      as perform feats of this caliber) to Galaxy level (Green Lantern Driq could
      contain an entire galaxy within his his fold and destroyed it. Can create solar
      systems.25 Green Lanterns working together could contain an explosion that would've
      destroyed the galaxyGreen Lantern Vol 4 25), up to Low Complex Multiverse level
      (Capable of harming foes such as Cyborg SupermanGreen Lantern Vol 4 12 and Solomon
      Grundy at his peakSuperman Vol 1 676. The collective power of the rings could
      collapse Oa into a blackhole capable of destroying the universe. Anarky was
      able to shrink down an entire universe to the size of a plank length and defeated
