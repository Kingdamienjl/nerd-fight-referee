    - field: attack_potency
      value: Large Planet Level (Downscaling from 1.03 Ronnatons - Can keep JL Season
        1 Superman off his feet and give him pause, though when this Superman is more
        prepared he's depicted as savagely pummeling Grundy into unconsciousness and
        is referred to as being so strong that Grundy is "no match" for him. During
        "The Terror Beyond," is somewhat capable of scrapping with JL Season 2 Superman,
        who's been restored to his proper strength level, even putting him in a hold
        and knocking him away with attacks - however, the fact that Superman is overtly
        totally unhurt by his attacks, strongly implies he's holding back out of sympathy
        for Grundy, refers to Pre-Resurrection Grundy as "not having a chance" against
        him, and during "Wake the Dead" is able to show low-end relativity to a far
        more powerful Grundy than was in "Terror Beyond," makes me conclude he shouldn't
        really scale to a full-strength Superman. Slammed Martian Manhunter back with
        a palm strike, knocked him off his feet by charging through stone, is thought
        of by Superman as "as strong" as J'onn, and knocked him out cold with a weapon
        strike to the head. Regarded as "tough" by Green Lantern, who at the time
        only knew of his pre-resurrection state. Killed Icthultu, albeit by attacking
        him from the inside. Referred to by promotional material as having "the muscle
        to crush any of our heroes" - though we know this isn't necessarily true of
        Superman, we have no reason to assume the statement is *entirely* invalid
        - ergo, this statement implies he could harm or even defeat the likes of Martian
