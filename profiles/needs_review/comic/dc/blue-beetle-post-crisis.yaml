        \ can see the location and track any person Jaime has met since they bonded,\
        \ even if they are cloaked. The Scarab probes the Phantom Stranger against\
        \ his will. Easily analyzes Dani Garrett\u2019s ancestry, state of health,\
        \ and threat level, which was implied to have been based on her knowledge),\
        \ Technology Manipulation, Hacking, Energy Manipulation and Absorption (Drained\
        \ the energy from The Bottom Feeder. Overpowered Livewire\u2019s drain with\
        \ his own), Energy Projection via weaponry Reactive Evolution and Adaptation\
        \ (Reach Infiltrators are constantly evolving and adapting to situations.\
        \ This ranges from spontaneously reconfiguring itself to release energy that\
        \ negates magnetism to reconfiguring his weapons to use kryptonite radiation\
        \ to better harm Supergirl to creating a device that manipulates and reflects\
        \ signals to the point where anything attempting to use them to judge his\
        \ location will believe they are fighting him), Teleportation, Time Dilation,\
        \ Invisibility, and Psuedo-Causality Manipulation with Dimension Shifting\
        \ (The Reach can move into the bleed in order to go invisible and intangible,\
        \ as well as avoid detection. This allows him to go completely undetected,\
        \ even to other Reach Tech. This allows him to appear near simultaneously\
        \ in multiple places at once, and can use this to talk to his past self and\
        \ move free from normal causality), Time Travel, Explosion Manipulation, Electricity\
        \ Manipulation, Forcefield Creation (Can create forcefields that can\u2019\
        t be phased through), Radiation Manipulation, Telekinesis, Telepathy, Sound\
        \ Manipulation, Body Control and Weapon Creation (Can create weaponry and\
        \ shields out of his body and control it), Non-Physical Interaction (Harmed\
        \ Typhoon, whose body is made of wind, fought with and hacked a group of foes\
        \ with dimension shifted armor), Acausality (Type 3; Can talk to his past\
        \ self without issue, Black Beetle, his evil future self, caused his own turn\
        \ to evil), Spatial Manipulation (Can pull things from in between reality\
        \ and outside 3 dimensions into 3-D), Power Nullification (Can negate magic\
        \ and Probability Manipulation. Negated the magic of an amplified Eclipso),\
        \ Status Effect Inducement (Has a particle cannon which can shoot out gluons,\
        \ which can induce nausea, extreme pain and insomnia. He uses this on Doctor\
        \ Polaris), Extrasensory Perception (Can see things that have shifted outside\
        \ of three dimensions into N-Space or The Bleed), Resurrection Negation (The\
        \ Bottom Feeder, a being cursed by God to never die, claimed that God had\
        \ sent him to kill him forever. The Scarab also found a way to kill him permanently.\
