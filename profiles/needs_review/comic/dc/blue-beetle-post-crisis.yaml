        \ Beetle was the only thing capable of killing him permanently), Resistance\
        \ to Telepathy, Information Analysis, Empathic Manipulation, Technology Manipulation,\
        \ Hacking, limited Power Absorption and Memory Manipulation, possibly Acid\
        \ Manipulation (Parasite did not passively absorb all his power and memories.\
        \ Resisted the attempts by The Reach to shut him down. Unaffected by an acid\
        \ spray. Breaks through Bonita\u2019s attempt to use her powers on him. Blocks\
        \ Probe\u2019s power to read minds and powers. The Scarab can also fry the\
        \ brain of anyone who manages to actually get in), limited Radiation Manipulation\
        \ (Survived some radiation from Magog which killed 381 people in 1 day), Fire\
        \ Manipulation (Did not take much damage from fireBlue Beetle 2006 #35), Cold\
        \ Temperatures (Can survive in places with temperatures below -25 degrees\
        \ Fahrenheit), Pain Manipulation (Survived Maxwell Lord's painful torture\
        \ and survived hours worth of pain in a second and a half), Gas Manipulation,\
        \ Poison Manipulation (Unaffected by anesthetic nerve gas),"
