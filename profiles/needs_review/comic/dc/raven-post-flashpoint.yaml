    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Genius (Raven has a vast knowledge over magic and her own powers. She is
      among the smartest and wisest members of the Teen Titans, easily on par with
      Robin. Raven is also a genius combatant, using her powers and abilities for
      different tactics, such as when she teleported Dove so she would hit Hawk instead
      of her,Titans: Burning Rage #5 effectively dodging her attack, when she use
      her portal abilties to banish an enemy to another dimensionShazam! 2023 #1 or
      when she banished a horde of villains surrounding her and the Titans to a desertTeen
      Titans 2016 #7)'
    source_ids: *id002
    confidence: 0.8
