    - field: speed
      value: Varies from Massively Hypersonic+ to Massively FTL+ (Outraced his father
        at one point, who raced Wally West but was still being caught off guard by
        Robin, Nobody, and Goliath. He later caught up to a speeding train and briefly
        managed to run and hide from Lex Luthor while the latter was using a set of
        armour imbued with New God technology. Defeated five supervillains that were
        battling the Teen Titans before Kid Flash, who is on par with Barry Allen,
        could react) | Massively FTL+ (Can operate and move in super speed mode alongside
        Superman and Jor-El and have a conversation with them, before laser blasts
        and missiles from multiple warships hit the ship they were on)
      source_id: character-stats-profiles-raven-post-flashpoint
