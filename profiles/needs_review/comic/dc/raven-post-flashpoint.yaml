  section: weaknesses
  axis: weakness
  text: 'She usually holds back her true power in case her demonic self takes control
    of her.Titans: Burning Rage #2 She cannot heal people from death. Has shown to
    struggle to heal powerful infections.Titans: Titans Together #4 Struggled to search
    an area with her empathic powers due to Starfire and Robin''s emotions being too
    strong.Teen Titans 2016 #11 Being very close to a crowd with too many conflicting
    emotions makes it hard for her to concentrate, albeit she has shown to be able
    to withstand this later on. | None Notable {| class="mw-collapsible mw-collapsed"
    align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%" |
    colspan="2" style="text-align: left; " |Notable Attacks/Techniques: |- | *Emotion
    Manipulation: Raven often uses her emotion powers to sneak up inside places supervised
    by guards. She can also use the empathic strength of people around her to empower
    herself, or force others to befriend her. K50pYal.jpeg|Raven forces some high
    school students to befriend her Raven Empathic hax.jpg|Raven devourers a security
    guard''s emotions to sneak inside a museum freely Raven Empathic Powers 1.jpeg|Raven
    amplifies herself via emotions Raven Empathic Powers 2.jpeg|Raven amplifies herself
    via emotions *Fear Manipulation: Raven often uses her fear manipulation in offensive
    way, such as inducing enemies with nightmares or their own fears. Raven Fear Inducement.jpeg|Raven
    induces nightmares in two terrorists to scare them away Raven Snake thingy.jpeg|Raven
    uses her enemies'' fears to incapacitate them *Teleportation: Raven often uses
    her teleportation skills in combat to evade attacks, make the enemy attack another
    enemy or get out of life threatening situations. She also use this ability to
    launch sneak attacks on her foes. Raven Teleportation in combat.jpeg|Raven uses
    her teleportation powers to evade attacks from Psimon Raven Teleportation 2.png|Raven
    launches a sneak attack on the Disruptor along with the Titans Raven Teleportation
    3.jpeg|Raven uses her teleportation to evade an attack from Plague Raven Teleportation
    4.png|Raven uses her teleportation to escape the Fearsome Five, who, according
    to her, would''ve killed them at their current state Raven vs Dove.jpeg|Raven
    uses her teleportation skills to make Dove attack someone else *Mind Manipulation:
    Raven uses her mind manipulations powers in a variety of ways, such as forcing
    her enemies to attack each other and taking control of them. Raven Mind hax 1.jpg|Raven
    forces Dawnbreaker''s bat constructs to attack him Raven Mind Hax 2.jpeg|Raven
    takes over Beast Boy''s mind Raven Mind hax 3.jpeg|Raven wipes the minds of two
    guards and makes them think Beast Boy is normal *Telepathy: Raven uses her telepathic
    powers to read the thoughts of both humans and robots. She can also use that power
    to distract her enemies. Raven Telepathy 1.jpg|Raven distracts the Titans using
    her telepathic powers Raven Telepathy 2.jpg|Raven reads Tim Drake''s thoughts
    from a distance Raven Telepathy 3.jpg|Raven reads a robot''s thoughts *Memories
    Manipulation: Raven often uses her powers to wipe out the memories of others,
    or to show others their own thoughts Raven Memories 1.jpeg|Raven erases the memories
    of 27000 civilians about the Thing Raven Memories 2.jpeg|Raven shows Baron Winter
    his memories about Trigon Raven Memories 3.jpeg|Raven erases the memories of two
    doctors Raven Memories 4.jpeg|Raven erases Madison''s memories *Healing: Raven
    can use her healing powers to heal various wounds, such as near skeletonization
    or wounds Raven healing 1.jpeg|Raven heals a girl from skeletonization Raven Healing
    2.jpeg|Raven heals a girl''s leg Raven Healing 3.jpeg|Raven heals Damian Wayne''s
    stab *BFR: Raven often use her powers to banish enemies to another place or dimension,
    effectively winning battles against them Raven BFR 1.jpeg|Raven banishes a demon
    back to Hell Raven BFR 2.jpeg|Raven banishes a spirit back to the Spirit World
    Raven BFR 3.jpg|Raven banishes Mammoth to a purgatory dimension *Sleep Inducement:
    Raven often uses her powers to quickly put her enemies to sleep Raven Sleep 1.jpg|Raven
