    - field: durability
      value: Varies from Building level+ to Solar System level (Knives and forks being
        tossed around by gale-force winds shatter against his skin. He also was thrown
        into a building without harm and traded blows with his father while under
        the control of Manchester Black) | Solar System Level (Withstood an onslot
        from General Zod)
      source_id: character-stats-profiles-raven-post-flashpoint
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Due to being half-Kryptonian, he does not have full control over his
        Solar Flare ability, which can potentially kill him if used twice in succession.
        Due to his Kryptonian heritage, he can be weakened and potentially killed
        by constant exposure to Kryptonite. He seems to still be subject to nausea
        when spinning rapidly, Heat Vision: Like his father, Jon is able to emit concentrated
        solar energy through his eyes, allowing him to blast targets with searing
        energy beams. Those who are able to resist them are sent flying backwards
        instead. Jon''s Heat Vision is powerful enough to badly singe his father''s
        back and even a misfire was powerful enough to push back Wonder Woman as she
        blocked it with her bracelets. After Black Dawn, Jon has enough fine control
        over this ability to heat up firearms at a distance to the point that they''re
        impossible for normal people to hold and incapacitate someone by burning minuscule
        holes through their legs., Freeze Breath: Jon is also able to exhale large
        amounts of frigid air, flash freezing anything caught in range. However, it
        seems to be less potent than his father''s, as Goliath was able to break free
        to catch both Jon and Maya soon afterwards. It was later shown to be potent
        enough to freeze a sludge monster created from genetic samples in the Batcave
        to the point that the monster shattered as plain ice when kicked by Damian
        Wayne. He has also demonstrated the ability to use simple Super-Breath, blowing
        his foes away with a powerful gust of wind. In Super Sons #8, he demonstrated
        the ability to reduce a magic clay statue back to normal by blowing all of
        the surface clay off of it., Solar Flare: When pushed to the emotional brink,
        Jon can unleash his pent up solar energy in a massive burst that can annihilate
        his surroundings. This ability is powerful enough to deal severe structural
        damage to Titans Tower and render it uninhabitable even after Jon attempted
        to limit collateral by flying out of it while Raven erected a psychic forcefield
        around it. The second time this ability was triggered, Jon created a "super-storm"
        of energy that required the combined efforts of Superman, Kid Flash, Beast
        Boy, Cassandra Sandsmark, eventually forcing Savior to redirect it into a
        hypertime wormhole to dissipate it. However, Jon''s young age and Half-Kryptonian
        nature prevent him from fully controlling this ability, and single usage of
        this ability weakened his body enough such that a second burst would kill
        him.'
      source_id: character-stats-profiles-raven-post-flashpoint
