    - field: attack_potency
      value: Varies from Building level+ to Solar System level (Able to one-shot Damian,
        Can easily barrel through doors and punch through walls, stagger fully grown
        dinosaurs, force Wonder Woman and badly burned Superman's back with his Heat
        vision by accident, and damaged the Eradicator, who went toe-to-toe with Superman,
        albeit while the latter was admittedly weakened by the Rebirth continuity.
        Batman stated that Jon will be even more powerful than his father once he
        reaches his full potential, which he briefly accessed while being controlled
        by Manchester Black and could visibly harm his father with his blows. Jon's
        unrestrained energy output required the combined efforts of Superman, Kid
        Flash, Beast Boy, Raven, Starfire, and the Titans Tomorrow versions of Conner
        Kent, Cassandra Sandsmark, and Bart Allen to contain, but even then it needed
        to be sucked into hypertime by Savior to nullify it) | Solar System Level,
