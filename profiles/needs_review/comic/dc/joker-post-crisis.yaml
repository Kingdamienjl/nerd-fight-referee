        asset by making him unpredictable, he is speculated by Martian Manhunter to
        be a form of super-insanity as even he was unable to render Joker sane for
        more than a few minutes) | Didn''t take anything too serious, including using
        his power in a way that would have kill him and the fact that he was losing
