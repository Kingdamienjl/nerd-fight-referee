    - field: attack_potency
      value: 'Small Building level+ (Has traded blows with the Dark Knight on numerous
        occasions but is usually depicted as being physically weaker), higher with
        preparation (His resources vary based on incarnation, but he has hijacked
        satellite lasers, nuclear bombs and other powerful equipment in the past)
        | Varies, up to Multiverse level+ physically (Emperor Joker physically overpowered
        SupermanSuperman: Emperor Joker), up to Outerverse level+ with powers (Possessed
        99% of Mister Mxyzptlk''s power, from which he was able to utilize enough
        to initially reshape the universe at his image. Grows more powerful every
        moment by becoming more comfortable with his power. Later destroyed the universe
        and put it back together. By destroying the universe, he would have unraveled/annihilated
        not just Earth and the "universe -- but everything that is, was, or will be",
        which is portrayed with several of the infinite Earths there are. Emperor
        Joker with his powers was able to warp the universe, hell and heaven, as well
        as the Sphere of Gods in his image and overpowered residents of the Sphere
        of Gods, such as Darkseid, High Father, Phantom Stranger, etc. And was able
        to overpower Hal-Spectre as well as Doctor Fate and Takion. He did all of
        this with extreme ease, and it was implied that he could do far more if he
        tried, but it seems like he wasn''t interested), able to ignore durability
        in many ways'
