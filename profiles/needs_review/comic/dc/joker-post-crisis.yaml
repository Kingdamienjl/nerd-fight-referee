      value: 'Like the Joker, he suffered from insanity, which eliminates all facets
        of his personality that made him a good person, leaving only madness and bloodlust
        while transforming his personality into like that of the Joker. This however
        has shown little if any effect in being a barrier for his cunning and well-schemed
        plans. Note: The "With The Abilities of Dr Manhattan (Jon Osterman)" tab currently
