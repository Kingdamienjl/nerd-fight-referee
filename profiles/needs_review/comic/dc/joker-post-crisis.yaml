    - field: standard_equipment
      value: A deck of razor-sharp playing cards, an acid-spewing flower, cyanide
        pies, exploding cigars filled with nitroglycerin, harpoon guns that utilize
        razor-sharp BANG!-flags, and a lethally electric joy buzzer. His most prominent
        weapon is his Joker venom, a deadly poison that infects his victims with a
        ghoulish rictus grin as they die while laughing uncontrollably Intelligence
        Genius (He is almost as dangerous as Batman, captured the entire Bat family
        and is implied to have deduced Batman's identity in the Death of the Family
        story arc. He has also been shown to be a terrifyingly skilled chemist, cooking
        up a plethora of variations of his trademark Joker Toxin, such as lacing a
        strain with Hahnium just so that the formula would be full of "HaHaHaHaHa...")
      source_id: vsbattles-joker-post-crisis-dc
      provider_id: vsbattles
      authority: high
