    - field: powers_and_abilities
      value: of Dr Manhattan (Jon Osterman)= Bruce had his brain transferred into
        a new body after being killed resulting in the Darkest Knight he now the Body
        Composition, Intelligence, and Abilities of Dr Manhattan which should grant
        him... Self-Sustenance (Types 1, 2 and 3; Jon has no need for food, sleep
        or oxygen), Immortality (Types 1 and 3; Jon no longer ages and can regenerate
        from any injury), Nigh-Omniscience, Cosmic Awareness (Jon possesses an understanding
        of the workings of the universe on a cosmic scale), Flight, Reality Warping
        (Is far superior to Mister Mxyzptlk's powers), Existence Erasure (Ended everything,
        which Manhattan foresaw that he would do), Precognition (Jon is able to look
        into the future, having seen a month, year, century and millennium into it),
        Matter Manipulation (Macro-Quantum level), Deconstruction (This is Jon's main
        method of attacking), Causality Manipulation (Returned the Metaverse to how
        it was before his interference and removed 10 years from the universes' timeline,
        creating the New 52), Time Travel (Travelled back in time and saved Jor-El
        right before Krypton's destruction), Acausality (Types 1 and 3; Experiences
        first-hand the reboots in DC Continuity and yet he remains unaffected, and
        additionally, Jon exists in every timeline simultaneously), Duplication (Can
        duplicate himself via bio-fission), Dimensional Travel (Travelled from his
        universe to Earth Prime), Elemental Manipulation (Created a ring of blue fire,
        produced an oxygen field for Laurie, created water, and commonly produces
        electricity with his actions), Enhanced Senses (Can read atoms, sense tachyons,
        knew Adrian didn't have cancer with a glance and heard a heartbeat from Marionette's
        womb), Transmutation (Blake claimed he could have turned the gun into steam,
        the bullets into mercury, or the bottle into snowflakes), Extrasensory Perception
        (Viewed a timeline where Jon was never vaporized and had a long happy life
        with Janey Slater), Size Manipulation (Can control his size), Telekinesis
        (Can disassemble objects with his thoughts and levitated his fortress), Intangibility,
        Surface Scaling and Water Walking (Walks on water and walls and phases through
        them), possibly Creation (Jon states he might create human life), Forcefield
        Creation (Created a forcefield to shield Laurie), Attack Reflection (Made
        the Shazam family's lightning backfire on them), Regeneration (High; regenerated
        from nothing in a matter of moments, Light Manipulation and Illusion Creation
        (By shifting the light color frequency around him, he can make himself look
        different to others), Life Manipulation and Plant Manipulation (Made plants
        grow), Power Bestowal (Transferred his powers to Clark Dreiberg and imbued
        the Mobius Chair with a portion of his powers), Telepathy (Showed Firestorm
        this in his head), Teleportation and BFR (Sent an entire crowd away and sent
        protestors home), Spatial Manipulation (Jon's teleportation works by moving
        space), Information Analysis (Instantly analyzed and learned magic after being
        attacked with it), Magic (Used magic against the JLA), Absorption (Absorbed
        energy from a Green Lantern ring and absorbed magical attacks from the Justice
        League Dark), Energy Manipulation (Wally West stated that Jon was full of
        Connective Energy, which is essentially a form of positive cosmic energy,
        opposite in nature to the negative Crisis energy wielded by beings like Perpetua)
        |-|Resistances= Third tab content goes here.
