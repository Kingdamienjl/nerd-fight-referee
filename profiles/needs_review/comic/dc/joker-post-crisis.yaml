        the what his controlled victims are thinking in the form of captions) *Clairvoyance
        (Observed Superman''s actions through a sphere) *Reality Warping **Matter
        Manipulation and Transmutation (Reshaped most of the universe at his image.
        Momentarily turned the opposing heroes into animals and Mr. Mxyzptlk into
        energy. Turned Harley into a constellation) ***Petrification (Shown here)
        **Life Manipulation, Mind Manipulation & Memory Manipulation (Made almost
        everyone believe changes in history and changed some of their attitudes. Although,
        while massive, everyone was still able to remember bits of how things used
        to be. Got the Anti-Life Equation and used it to control Darkseid (Pre-Flashpoint)
        and The Spectre) **Probability Manipulation (Placed Mxyzptlk''s astral projection
        in a repeated pattern of getting a lethal accident) **Healing & Resurrection
        of others (Was repeatedly healing & reviving those he killed to keep having
        fun with them) **Plot Manipulation (Wrote the characters he was manipulating,
        claimed that everything they think, say, do, feel and see is because he makes
        it so) **Creation **Telekinesis **Shapeshifting **Energy Manipulation **Biological
        Manipulation (Shown here) **Size Manipulation (Repeatedly increased his own
