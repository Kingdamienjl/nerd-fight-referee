- id: claim-powers-and-abilities-1a0b5071
  section: abilities
  axis: hax
  text: 'It is implied [https://imgur.com/a/kryptonians-stuff-with-yellow-sun-BG5iFyr
    here], [https://imgur.com/a/72yn3OA here] and [https://imgur.com/a/kryptonians-get-supermans-powers-3W5drWd
    here] that Kryptonians gain the same abilities as Superman under a yellow Sun.
    They should thus share the same physiology as Superman. This would all grant them:
    *Superhuman Physical Characteristics *Healing & Statistics Amplification (It is
    consistanly shown that Kryptonians can [https://imgur.com/a/one-punch-2VmRBVV
    heal back their cells and amp themselves when they dive into a Sun]) *Absorption
    ([https://imgur.com/a/8VhTndT Kryptonians cells are implied to absorb Solar Radiation].
    They also possess [https://imgur.com/a/4T2uJA8 solar receptors capable of absorbing
    energy]) **Solar Energy Amplification (The more yellow suns are present, [https://imgur.com/a/iN3QYSQ
    the more the powers of Kryptonians are multiplied]) *Flight (Kryptonians have
    displayed the ability to fly many times, such as [https://imgur.com/a/takes-blanque-into-space-5DZAvwI
    here], [https://imgur.com/r8iS7SP here], [https://imgur.com/6JTfIrJ here], [https://imgur.com/a/f8QCCtA
    here] and [https://imgur.com/UgsBpVC here]) *Heat Vision (Kryptonians are shown
    to be capable of using heat vision such as [https://imgur.com/8XlNBjv here] and
    [https://imgur.com/a/melts-deathstrokes-titanium-staff-XRUI06I here]) **Durability
    Negation (Using Heat Vision, [https://imgur.com/a/burns-tracking-chip-out-of-batmans-skull-Ewk0wXi
    Superman could burn away a chip inside Batman''s head without piercing it]) *Breath
    Attack & Ice Manipulation (Using their super-breath, Kryptonians are capable of
    freezing various [https://imgur.com/a/9x4M68L liquids], [https://imgur.com/a/jon-uses-his-freeze-breath-to-freeze-mister-squish-Eo6xnhn
    living beings] and [https://imgur.com/a/threw-canisters-containing-several-hundred-thousand-gallons-of-water-V2f8S4L
    structures]) **Air Manipulation (Using their super breath, Kryptonians can create
    gusts of wind as shown by [https://imgur.com/a/EzAFXgp Power Girl] and [https://imgur.com/ocw7sFN
    Laurel Kent]) **Non-Physical Interaction (Intangability; Using super breath, [https://imgur.com/a/pUxxAnk
    Kryptonians can negate intangibility by freezing their particles]) *Enhanced Senses
    **Super Hearing: Kryptonians are capable of using their super hearing to [https://imgur.com/a/MkattOL
    hear all kinds of sounds around them that people wouldn''t be able to normally
    perceive]. As shown with Superman, [https://imgur.com/a/1VIah78 they are capable
    of seeing Yellow Lantern Radiation]. **X-Ray Vision: Using their X ray vision
    ability, Kryptonians can see through [https://imgur.com/a/cc7lIix skin] and [https://imgur.com/a/nS0nJCr
    muscles] **Thermal Vision: They are also [https://imgur.com/a/oiYMIg5 shown to
    possess thermal vision] **Telescopic Vision: Kryptonians also possess microscopic
    vision, allowing them to [https://imgur.com/a/mzhvaY8 see planets far away from
    them] **Microscopic Vision: Kryptonians possess microscopic vision, allowing them
    to see [https://imgur.com/a/telescopic-vision-dna-ranges-D0lWLxi through someone''s
    DNA], [https://imgur.com/a/superman-can-see-cells-Bs7IkIq cells] and other things
    to [https://imgur.com/a/seeing-down-subatomic-level-qMPyl a subatomic] and [https://imgur.com/a/views-molecular-chains-eMxkS91
    a molecular level] *Regeneration (Mid-Low; As shown by [https://imgur.com/a/supermans-regen-lSwddaN
    Superman], Kryptonians can regenerate from near death state thanks to sunlight)
    *Energy Manipulation, Heat Manipulation, Radiation Manipulation & Statistics Amplification
    (As shown with [https://imgur.com/a/7UWf54e Superman], [https://imgur.com/a/3n9Mu7G
    Super-Man Zero], [https://imgur.com/a/TVxVjrm Jonathan Samuel Kent] and [https://imgur.com/a/supergirl-superflare-E3ElXKd
    Supergirl], Kryptonians are capable of using their Superflare, an ability that
    allows them to create [https://imgur.com/a/superflare-is-omnidirectional-vADwWoV
    a gigantic omnidirectional blast of solar radiation around them]. This ability
    is stated to be [https://imgur.com/a/6bg5CY9 comparable to a supernova]. The Superflare
    [https://imgur.com/a/hnHtTg0 is thousands of time more powerful than Heat Vision])
    *Self-Sustenance (All Types; As stated by Superboy, [https://imgur.com/J4G9Ekj
    Kryptonians don''t need to eat or sleep]. They are also [https://imgur.com/a/mZq4umB
    shown] [https://imgur.com/a/pushes-spaceship-away-from-earth-into-sun-back-out-5062gXh
    multiple] [https://imgur.com/a/space-sun-stuff-h9eEBoV times] to be able to survive
    in space without oxygen) *Shockwave Creation (As shown with [https://imgur.com/a/6j2wlrv
    Supergirl], [https://imgur.com/a/JCqMH4H Power Girl] and [https://imgur.com/a/supes-claps-kmqtXWu
    Superman], Kryptonians can create powerful shockwaves by clapping their hands
    hard enough) *Intangibility (As shown by [https://imgur.com/zNUxLeF Superman]
    and [https://imgur.com/a/7zG28wE Supergirl]) *Invisibility (Kryptonians are capable
    of turning invisible'
