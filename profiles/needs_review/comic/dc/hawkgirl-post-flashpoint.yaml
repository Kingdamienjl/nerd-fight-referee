      value: Please do not edit this page under any circumstance unless you are a
        moderator or are listed as an Authorized Contributor within the DC Page.,
        displaying a profound regard for life even in the midst of combat, is an example
        of her unwavering commitment to justice. She freely admits, in Wonder Woman
        Vol. 1 issue 600, to purposefully reducing the force of her blows in order
        to prevent killing her opponents. The Wonder Woman Vol. 3 issue 25 illustrates
        how deeply ingrained this ethos is in the warrior culture of the Amazon, where
        it is established that killing is not done unless it is absolutely necessary.
        This idea goes beyond just physical prowess, as Wonder Woman Vol. 3 issue
        14 demonstrates when she displays restraint even against opponents who are
        noticeably weaker than her. Her unwavering compassion and determination to
        save lives whenever possible are demonstrated in Wonder Woman Vol. 3 issue
        15, where she is shown to be committed to non-lethal solutions even when facing
        formidable opponents such as Captain Nazi. This is shown in a number of incarnations
        of her character, as even her Post-Flashpoint Self exhibits the same degree
        of restraint by sparring the lives of mass shooters who had already fired
        at her and refusing to kill a Minotaur who had just tried to kill her
