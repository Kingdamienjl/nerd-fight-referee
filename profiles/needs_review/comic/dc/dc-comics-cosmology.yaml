  name: "New Genesis is beyond time and space, and without measure.Jack Kirby\u2019\
    s Fourth World Vol 1 #2 Wollywoo.webp"
  source_field: keys
- id: the-worlds-of-the-gods-are-where-the-stars-are-born-and-beyond-any-measure-of-space-and-time-jack-kirby-s-fourth-world-vol-1-18-august-1998-now-it-is-very-important-to-note-that-even-though-the-gods-and-deities-were-living-ideas-or-platonic-forms-they-were-all-given-forms-by-the-beliefs-of-mortals-worshiping-them-through-the-collective-unconscious-as-mentioned-below-collective-unconscious-the-collective-unconscious-is-the-ideal-collective-form-of-mortal-souls-above-the-sphere-of-the-gods-from-which-all-telepaths-and-greatest-minds-draw-their-abilities-it-houses-hecate-s-personal-realm-the-witch-s-moon-a-metaphor-for-the-first-mystery-gazed-upon-by-man-all-gods-and-divine-realms-were-born-from-the-collective-beliefs-and-imaginations-of-humanity-in-this-way-all-the-realms-of-the-sphere-of-the-gods-are-fictions-collectiveunconscious1-png
  name: "The worlds of the gods are where the stars are born and beyond any measure\
    \ of space and time.Jack Kirby\u2019s Fourth World Vol 1 #18, August 1998 Now,\
    \ it is very important to note that even though the gods and deities were living\
    \ ideas or platonic forms, they were all given forms by the beliefs of mortals\
    \ worshiping them through the Collective Unconscious as mentioned below. Collective\
    \ Unconscious The Collective Unconscious is the ideal \"collective\" form of mortal\
    \ souls above the Sphere of the Gods from which all telepaths and greatest minds\
    \ draw their abilities. It houses Hecate's personal realm, the Witch's Moon, a\
    \ metaphor for the first mystery gazed upon by man. All gods and divine realms\
    \ were born from the collective beliefs and imaginations of humanity. In this\
    \ way, all the realms of the Sphere of the Gods are \u201Cfictions\u201D. CollectiveUnconscious1.png"
  source_field: keys
- id: the-crest-of-the-collective-unconscious-lies-above-the-sphere-of-the-gods-justice-league-dark-vol-2-15-november-2019-collectiveunconscious2-png
  name: 'The crest of the Collective Unconscious lies above the Sphere of the Gods.Justice
    League Dark Vol 2 #15, November 2019 CollectiveUnconscious2.png'
  source_field: keys
- id: the-collective-unconscious-houses-hecate-s-personal-realm-the-witch-s-moon-a-metaphor-for-the-first-mystery-gazed-upon-by-man-wonder-woman-vol-5-57-december-2018-in-the-relaunch-of-justice-league-dark-james-tynion-iv-and-ram-v-introduced-a-very-old-concept-that-of-beliefs-defining-creation-from-mike-carey-s-lucifer-series-and-applied-it-to-cosmology-the-idea-is-that-the-collective-beliefs-change-reality-and-form-gods-and-deities-that-are-worshiped-or-feared-by-said-believers-through-the-collective-unconscious-metron-explains-this-further-in-a-tie-in-to-death-metal-explaining-that-the-multiverse-is-built-on-beliefs-and-that-as-mortals-believe-in-gods-they-exist-who-in-turn-believes-in-the-source-it-exists-although-the-source-exists-beyond-the-collective-unconscious-rco027-1603799918-jpg
  name: 'The Collective Unconscious houses Hecate''s personal realm, the Witch''s
    Moon, a metaphor for the first mystery gazed upon by man.Wonder Woman Vol 5 #57,
    December 2018 In the relaunch of Justice League Dark, James Tynion IV and Ram
    V introduced a very old concept, that of beliefs defining creation from Mike Carey''s
    Lucifer series, and applied it to cosmology. The idea is that the collective beliefs
    change reality and form gods and deities that are worshiped or feared by said
    believers through the Collective Unconscious. Metron explains this further in
    a tie-in to Death Metal, explaining that the multiverse is built on beliefs and
    that as mortals believe in gods they exist, who in turn believes in the Source
    it exists, although the Source exists beyond the Collective Unconscious. RCO027
    1603799918.jpg'
  source_field: keys
- id: metron-explains-that-beliefs-are-the-key-to-this-multiverse-and-that-little-mortals-believe-in-the-gods-and-therefore-they-exist-just-like-him-and-the-gods-believe-in-the-source-therefore-the-source-exists-dark-nights-death-metal-rise-of-a-new-god-vol-1-1-ag1ht4t-imgur-jpg
  name: 'Metron explains that beliefs are the key to this multiverse and that little
    mortals believe in the gods, and therefore they exist, just like him, and the
    gods believe in the Source, therefore the Source exists.Dark Nights Death Metal:
    Rise of a New God Vol 1 #1 AG1hT4t - Imgur.jpg'
  source_field: keys
- id: as-humanity-grew-their-beliefs-grew-in-tandem-hardening-into-stricter-forms-which-divided-the-realms-above-into-the-divine-and-magical-realms-housing-pantheons-of-gods-and-deities-each-believing-their-own-myths-of-creation-justice-league-dark-and-wonder-woman-the-witching-hour-december-2018-mu9uux1-imgur-jpg
  name: 'As humanity grew, their beliefs grew in tandem, hardening into stricter forms
    which divided the realms above into the divine and magical realms housing pantheons
    of gods and deities, each believing their own myths of creation.Justice League
    Dark and Wonder Woman: The Witching Hour, December 2018 Mu9UUx1 - Imgur.jpg'
  source_field: keys
- id: when-hecate-looked-into-her-dark-reflection-her-beliefs-formed-the-upside-down-man-and-the-otherkinds-justice-league-dark-vol-2-28-mortals-and-the-sphere-of-the-gods-without-special-metho
  name: 'When Hecate looked into her dark reflection, her beliefs formed the Upside-Down
    Man and the Otherkinds.Justice League Dark Vol 2 #28 Mortals and the Sphere of
    the Gods Without special metho'
  source_field: keys
