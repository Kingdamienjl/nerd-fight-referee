- id: claim-weaknesses-0deb298c
  section: weaknesses
  axis: weakness
  text: 'Etrigan used to grow weaker if he spent too much time away from Hell, requiring
    him to swap back to Jason every once in a while, although this weakness has mostly
    been ignored in more recent times. Jason needs to utter a short spell to summon
    Etrigan. If Jason is separated from Etrigan, he will rapidly age into an old man.
    Notes: *The Lucifer that Etrigan used to serve under and then defeated is a different
    character from Lucifer Morningstar. *Unlike his Post-Crisis self, Etrigan is typically
    not forced to rhyme. He can speak normally and simply chooses to rhyme for his
    own amusement. *Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics ==References== {{scroll box|content={{reflist|2}}}}
