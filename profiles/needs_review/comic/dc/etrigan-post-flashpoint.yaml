- id: claim-powers-and-abilities-02bf5739
  section: abilities
  axis: hax
  text: "Etrigan \u25BE= {{#tag:tabber|Before \"The Demon: Hell is Earth\"= Superhuman\
    \ Physical Characteristics, Weapon Mastery, Martial Arts (Defeated many of the\
    \ prose demons, the strongest warriors in Hell, in a single battleDemon Knights\
    \ Vol 1 0. Killing a thousand demons in a single battle albeit with some help\
    \ was considered almost trivial for him, and he has blazed through entire armies\
    \ of Hell multiple timesThe Demon: Hell is Earth Vol 1 5Young Monsters in Love\
    \ Vol 1 1), Regeneration (Mid; Regenerated off-screen from many impalement wounds,\
    \ including one through the headSwamp Thing Annual Vol 5 3), Body Control, Flight\
    \ (Can sprout wingsDemon Knights Vol 1 2), Breath Attack, Unholy Manipulation\
    \ (As a demon, Etrigan wields Hell's unholy power), Fire Manipulation (Can breathe\
    \ hellfire, enough to torch many enemies at onceJustice League United Vol 1 12.\
    \ However, beyond its extreme heat, hellfire's properties are unknown. Etrigan\
    \ doesn't actually need to breathe it out however, and can just set objects on\
    \ fire with a snap of his fingers), Smoke Manipulation (Can also breathe out smoke),\
    \ Corrosion Inducement, BFR (Etrigan's claws melt people with a touch and send\
    \ them to HellDemon Knights Vol 1 6Demon Knights Vol 1 3), Transformation, Dimensional\
    \ Travel (When Jason transforms into Etrigan and viceversa, they are actually\
    \ swapping positions, with one being on Earth and the other in HellDemon Knights\
    \ Vol 1 5), Immortality (Type 1 and 3), Non-Physical Interaction (Can hurt astral\
    \ projections), Immersion (Can appear to Jason through mirrorsThe Demon: Hell\
    \ is Earth Vol 1 1), Self-Sustenance (Type 1), Spaceflight (Able to move around\
    \ in space unimpededBatwoman Vol 2 35), Extrasensory Perception (Can sense magic\
    \ eventsConstantine Vol 1 7), Telepathy, Illusion Creation (Showed Kamandi a vision\
    \ of his humanity's past by forcing him to look into his eyesJoe Kubert Presents\
