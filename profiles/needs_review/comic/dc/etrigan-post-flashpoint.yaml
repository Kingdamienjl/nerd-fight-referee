    text: 'Likely Solar System level (Hurt Apollo albeit during the night and would
      have killed him if he hadn''t used a forcefield. Batman thought the Hellbat
      suit was necessary to deal with EtriganDetective Comics Vol 1 998. Was considered
      to be among the five magicians on Earth who could contribute to a powerful spell
      to save the Earth, implying him to be at least somewhat comparable to Dr. Fate
      and Zatanna, although he is definitely inferior to them. Traded blows with someone
      with the same powers as Swamp Thing, although he eventually lost when they used
      their Plant Manipulation abilities. Overpowered RavenTeen Titans Vol 4 24) |
      Solar System level (Received two seemingly permanent power-upsThe Demon: Hell
      is Earth Vol 1 6. Stomped Lucifer, who was previously superior to Etrigan to
      the point of viewing his attempts of revolt as amusing and could overpower Cain,
      who stomped Zatanna and Madame XanaduI, Vampire Vol 1 19Justice League Dark
      Vol 1 8. Defeated Belial, who also beat and overthrew Lucifer) | Likely Wall
      level (Able to kill Cain''s vampires, who are much stronger than regular vampires
      that can lift and throw carsDemon Knights Vol 1 18I, Vampire Vol 1 18), At least
