    - field: weaknesses
      value: 'Eco can run out pretty fast, before he was not able to control Dark
        Eco but in the later games this was not an issue. Heavily reliant on firearms
        and eco. Notable Attacks/Techniques: Base, Dark, and Light Jak all have powerful
        abilities they can use in their forms. Base: *Life Siphon: Jak can steal the
        health of his enemies and heal himself by hitting them with a melee attack.
        *Spin Diffuse/Reflect: By spinning, Jak can either defuse and/or reflect enemy
        projectiles. *Eco Teleport: Allows Jak to teleport short distances that are
        too far to jump. He can also use this to go through windows or even bypass
        forcefields. *Eco Reflexes: With this, Jak can completely stop time with a
        clap of his hands. *Eco Regen: Jak can regenerate eco over time. *SEE MORE:
        Eco Powers and Eco Skills. Dark Jak: *Dark Blast: Jak spins in the air and
        shoots rays of dark eco at his foes. It can also destroy machines and vehicles.
        *Dark Bomb: Jak slams into the ground to create a powerful shockwave that
        wipes out any nearby enemies. *Dark Strike: A large and powerful projectile
        made of Dark Eco. *Dark Giant: Jak grows 3 times his size, making him faster
        and stronger. *Invincibility: Jak becomes immune to taking damage as long
        as he remains in this form. *Dark Invisibility: Dark Jak can temporarily become
        invisible Light Jak: *Flash Freeze: Light Jak can slow down time significantly
        for a short period of time. *Light Flight: Light Jak is capable of growing
        bright wings and flying. *Light Regeneration: Light Jak can completely recover
        all his health. *Light Shield: A shield that not only protects Jak from taking
        damage but also harms those who try and damage him. Category:Tonygameman Category:Tier
        5 Category:Tier 2'
