    - field: attack_potency
      value: (Team Wide) Universal+ Destructive Capacity via Green Lantern Ring (Any
        Lantern whom uses a power ring is continuously draining the finite emotional
        spectrum of their universe which upon emptying ultimately results in the complete
        destruction of the universe itself, this is stated on multiple occasions)
        ==Standard Member Paraphernalia== |-|Green Lantern Power Ring= Depending on
        the skill and willpower of the wearer, it can do almost anything. The first
        Green Lantern Ring on Earth in modern times was crafted and worn by Alan Scott
        and powered by the mystical Starheart. His proved to be the exception, the
        by-product of the efforts of the Guardians of the Universe to contain the
        magic of the universe. The Guardians also created the more widespread version,
        powered by individual Green Lantern Power Batteries through a connection to
        the Central Power Battery on Oa. With the exception of the ring worn by Alan
        Scott, the current rings are based on the one given to Kyle Rayner when he
        was the only Green Lantern in existence. All power rings need periodic recharging.
        The process is not instantaneous so many Green Lanterns recite an oath while
        the ring charges. The oath is not required to charge the ring, but is recited
        to reaffirm the person's commitment to the Green Lantern Corps, and to measure
        the time it takes the ring to charge. While many Green Lanterns create their
        own oath, the majority use the Corps' official oath as a sign of respect.
        In the interests of political correctness on the part of DC (or, in context,
        Hal Jordan), the word "blackest" was replaced by "darkest"; this practice
        has been abandoned with the reinstating of the Green Lantern Corps due in
        part to the significance of the Blackest Night comic event. Particularily
        alien Green Lanterns may have modified oaths. For example, Rot Lop Fan, a
        Green Lantern from a starless sector, replaces light with sound in his oath.
        |-|Green Lantern Central Power Battery= The Central Power Battery is the reservoir
        of power for the emotional spectrum of willpower, and channels the energy
        used to empower the Green Lantern Corps. All of the green energy housed within
        a Green Lantern ring comes from a smaller battery, which in turn, functions
        as a conduit to the Central Power Battery on Oa. It was built billions of
        years ago, when the highly evolved Maltusians (now known as the Guardians
        of the Universe) united their powerful minds to create a green crystal - green
        because it was a mixture of their blue mental energy and a yellow impurity
        "necessary to fix its form." They grew the crystal and carved it into the
        shape of a giant battery, and from the same crystal carved smaller batteries
        and power rings. The Central Power Battery has been destroyed and rebuilt
        several times. It was first destroyed several years ago by the forces of Krona.
        Unfortunately, the battery exploded during an assemblage of all 3,600 members
        of the Green Lantern Corps, several of whom were killed instantly. The surviving
        members struggled valiantly to put out the rampaging inferno of green energy
        that swept across the Oan Citadel. The next cataclysmic event occurred after
        Sinestro's execution, which resulted in the renegade being imprisoned inside
        the battery. The energy of the Green Lanterns' power source started to drain
        their rings, stripping most of them of their power. In the end, it took the
        combined efforts of Hal Jordan and Appa Ali Apsa to stop the battery from
        exploding and creating a black hole. However, the damage caused to the battery
        rendered the Green Lantern Corps almost useless, with only a few Green Lanterns
        with active power rings scattered throughout the universe.
