    - field: standard_equipment
      value: '*Armor: Wonder Woman wears a red armor body plate that bears a gold
        eagle-shaped breastplate, and a matching golden W-shaped belt plate. Below
        this is a blue skirt and knee-high dark red armored combat boots. The armor
        helps her compensate for any possible vulnerability to bullets and sharp objects
        . *General Antiope''s Tiara: Wonder Woman would wear it in loving memory of
        her beloved aunt and mentor Antiope, with Diana striving to be worthy of it,
        as the tiara signifies that its wearer is the greatest Amazon warrior of them
        all. The tiara can be used as a throwing weapon, similar to that of a boomerang.
        *Asteria''s Armor: Wonder Woman''s magical Amazon combat armor, which helps
        compensate for her vulnerability to sharp objects and bullets. *Bracelets
        of Submission: Two specialized incredibly durable gauntlets that Wonder Woman
        wears, to compensate for her vulnerability to sharp objects and bullets. They
        are incredibly durable, capable of deflecting even a tremendously powerful
        and destructive energy attack from the monster Doomsday, creating a massive
        wave of energy outwards. Also, by clashing her bracelets together, Wonder
        Woman can release a huge blast of energy herself, with it being powerful enough
        to make even Doomsday stagger back from the force of it. *Lasso of Hestia:
        A specialized unbreakable magical weapon, with the ability to force anyone
        it captures to obey the lasso''s wielder and tell the truth. Wonder Woman
        successfully wielded it against Doomsday, even managing to temporarily restrain
        him while Superman delivered the finishing blow. *God Killer: Wonder Woman''s
        extremely sharp and durable sword forged in Themyscira that she wielded in
        battle during World War I, which Hippolyta claimed to be capable of killing
        Ares. However, the God Killer was ultimately destroyed by Ares. *Amazonian
        Shield: During World War I, Wonder Woman used an Amazon shield that she used
        to protect herself from bullets and other attacks when she entered no man''s
        land. However, Wonder Woman lost the shield during the battles and several
        years later replaced it with a new one. *Sword of Athena: A legendary Amazonian
        sword that Diana frequently wields in battle. Due to its nature, it is one
        of the few weapons that can injure the otherwise invulnerable Superman and
        Doomsday, with her having used it to cut off one of the latter''s arms. *Eagle
        shield: A magical Amazonian shield that Wonder Woman uses to protect herself
        from other weapons and energy blasts (in tandem with her bracelets). It is
        incredibly durable, capable of deflecting even a tremendously powerful and
        destructive energy attack from the monster Doomsday. It can also be used as
        an offensive weapon, with Wonder Woman smashing it hard into the legs of Doomsday,
        thus momentarily managing to knock him down. She was also able to withstand
        the massive blows of the Steppenwolf''s axe. *E-Class Cabriolet: Diana''s
        personal car, used for her travels.'
