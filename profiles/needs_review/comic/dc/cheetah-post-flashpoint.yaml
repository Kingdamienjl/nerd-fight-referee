    normal people near instantly and killing them in seconds, and those strong enough
    to survive Cheetah''s bite transform others into cheetah-hybrids like herself,
    giving them a cheetah-like appearance and animalistic traitsJustice League (Volume
    2) #14) *Limited Regeneration Negation (Her claws were able to partially nullify
    Flash''s regeneration, causing his wounds to heal improperly) |-|Rebirth= {{#tag:tabber|
    {{!}}-{{!}}Base= All previous abilities plus: *Longevity (The host of Urzkartaga''s
