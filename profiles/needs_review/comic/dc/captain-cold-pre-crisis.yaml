- id: claim-standard-equipment-172e5db1
  section: equipment
  axis: equipment
  text: 'Cold Gun, his utility belt, and his suit. * Cold Gun: A gun capable of shooting
    Absolute Zero, and after its upgrade, even below that burst of cold energy. Capable
    of freezing entire lakes, buildings, steel, and most commonly, any type of floor.
    Moreover, the Cold Gun can freeze humans or severely slow them down, reducing
    even The Flash to an utter crawl. Over the years, the Cold Gun got a variety of
    upgrades and special powers, allowing it to de-age individuals, manipulate matter,
    creating animate objects * Utility Belt: Not gone into as much detail as the Cold-Gun,
    but Captain Cold''s utility belt is filled with many gadgets to aid him in his
    adventures. Most notably, the ability to freeze much larger areas with the press
    of a button and create radiation-based force-fields to protect him against said
    cold. * Cold Suit: His Cold-Suit allows him to protect himself against the cold
    that he creates. It also protects against fire to some extent. Optional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-1452ad78
  section: power_scale
  axis: battle_iq
  text: Extraordinary Genius (Although initially a lowly crook, Captain Cold exposure
    to the Cold Gun has, over time, made him an expert in all things relating to the
    cold. This extended to him modifying the Cold Gun to perform feats that even modern
    scientist struggles with, such as going below Absolute Zero, as well to him creating
