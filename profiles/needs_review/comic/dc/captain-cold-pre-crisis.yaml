    one's mentality in subtle ways. He is, however, not a great fighter (though skilled
    in battling Flash) and very gullible (especially if women is involved))
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-8f941e3f
  section: weaknesses
  axis: weakness
  text: 'A hopeless romantic, Captain Cold will try to woo any beautiful lady in his
    presence. This has, at times, been used to his advantage as it has inspired him
    to craft up devious schemes and innovate his ice powers, but has also been a detriment
    as well, distracting him and causing great misery if betrayed by said woman of
    his affections. Notes: *Although this is technically the same Captain Cold used
    in the Post-Crisis continuity, for the sake of keeping both profiles concise,
    they will be split at Crisis on Infinite Earths. *It should be noted that Captain
    Cold does not scale in speed to The Flash or any other fast characters he''s fought
    (such as Mantis). He manages to fight Flash via predicting their movements and
    placement based off their tactics and location and fires there. Likewise, he''ll
    often make a wide-area attack in hopes that it snags Flash (as if often does).'
