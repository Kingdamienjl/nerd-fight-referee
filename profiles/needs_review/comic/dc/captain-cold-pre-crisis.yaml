  intelligence:
    text: Extraordinary Genius (Although initially a lowly crook, Captain Cold exposure
      to the Cold Gun has, over time, made him an expert in all things relating to
      the cold. This extended to him modifying the Cold Gun to perform feats that
      even modern scientist struggles with, such as going below Absolute Zero, as
      well to him creating other cold-based weapons, sometimes within prison with
      incredibly limited reasons. After he briefly retired as a superhero, he gained
      a job at a prestigious college as a lecturer on thermodynamics. In addition,
      he created a disease that affects one's mentality in subtle ways. He is, however,
      not a great fighter (though skilled in battling Flash) and very gullible (especially
      if women is involved))
