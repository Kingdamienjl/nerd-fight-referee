    - field: standard_equipment
      value: 'Cold Gun, his utility belt, Cold Gun: A gun capable of shooting Absolute
        Zero, even below that burst of cold energy. Capable of freezing entire lakes,
        buildings, steel, any type of floor. Moreover, the Cold Gun can freeze humans
        or severely slow them down, reducing even The Flash to an utter crawl. Over
        the years, the Cold Gun got a variety of upgrades and special powers, allowing
        it to de-age individuals, manipulate matter, creating animate objects, Utility
        Belt: Not gone into as much detail as the Cold-Gun, but Captain Cold''s utility
        belt is filled with many gadgets to aid him in his adventures. Most notably,
        the ability to freeze much larger areas with the press of a button and create
        radiation-based force-fields to protect him against said cold., Cold Suit:
        His Cold-Suit allows him to protect himself against the cold that he creates.
        It also protects against fire to some extent. Optional'
      source_id: vsbattles-captain-cold-pre-crisis-dc
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Extraordinary Genius (Although initially a lowly crook, Captain Cold
        exposure to the Cold Gun has, over time, made him an expert in all things
        relating to the cold. This extended to him modifying the Cold Gun to perform
        feats that even modern scientist struggles with, such as going below Absolute
        Zero, as well to him creating other cold-based weapons, sometimes within prison
        with incredibly limited reasons. After he briefly retired as a superhero,
        he gained a job at a prestigious college as a lecturer on thermodynamics.
        In addition, he created a disease that affects one's mentality in subtle ways.
        He is, however, not a great fighter (though skilled in battling Flash) and
        very gullible (especially if women is involved))
      source_id: vsbattles-captain-cold-pre-crisis-dc
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: A hopeless romantic, at times, been used to his advantage as it has inspired
        him to craft up devious schemes and innovate his ice powers, Although this
        is technically the same Captain Cold used in the Post-Crisis continuity, for
        the sake of keeping both profiles concise, they will be split at Crisis on
        Infinite Earths., It should be noted that Captain Cold does not scale in speed
        to The Flash or any other fast characters he's fought (such as Mantis). He
        manages to fight Flash via predicting their movements and placement based
        off their tactics and location and fires there. Likewise, he'll often make
        a wide-area attack in hopes that it snags Flash (as if often does).
      source_id: vsbattles-captain-cold-pre-crisis-dc
      provider_id: vsbattles
      authority: high
      confidence: 0.75
