      value: '*Cannot harm anything that is yellow. *Rings only hold a limited energy
        and must be recharged with a power source on a regular basis. *If the user
        is filled with dread, they will be unable to use the ring and become vulnerable
        to the hue yellow. *If Green Lantern loses focus or concentration (for example,
        due to illusions), his strength weakens. Note: This article is protected.
        Any unauthorized modifications, alterations, or revisions are strictly prohibited.
        Unauthorized editing may compromise the accuracy, integrity, and reliability
        of the content. If you have suggestions or concerns regarding the information
        presented herein, please contact the designated administrator for assistance.
        (Basically don''t edit my page without my consent) ==Explanations & Related
        Blog Posts== *Emotional Energy Spectrum: Green occupies the central position
        in the spectrum and symbolizes the emotion of willpower. It holds the distinction
        of exerting the least influence on its wielder and can only be mastered by
        individuals with an indomitable will capable of overcoming great fear. The
        embodiment of this emotion is Ion. The Maltusians initially harnessed this
        energy, which later passed on to the Oans, male Maltusians who aspired to
        establish order in the universe. After the Controllers departed, those remaining
        on Oa evolved into the Guardians of the Universe. They utilized the green
        light as the power source for the Green Lantern Corps, an organization committed
        to combating evil wherever and whenever it emerged to threaten the universe.
