        Lantern Vol 5 #21 (August, 2013)), Indomitable Will, Flight, Creation (By
        using their imaginations members of the Green Lantern Corps can create constructs
        using their rings, Two-Six states this to be an akin to an equation with an
        infinite amount of possible outcomes), Telepathy (Members of The Green Lantern
        Corps can communicate with other members via telepathic sub-channels),'
