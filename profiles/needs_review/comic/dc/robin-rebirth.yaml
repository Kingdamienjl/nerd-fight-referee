      value: At most Small Building Level (Downscaling from 39.7 Megajoules - Though
        a bit younger, his comparable (if not more intense, on-the-job) training from
        Batman should allow him to be at least somewhat compare to a suitless Batman
        II, who is between 16 and 17. Despite being generally portrayed as the physically
        weakest member of the Bat-family, Robin is trusted to fend for himself by
        Batman, and his attacks can utterly obliterate a wooden barrel with a metal
        frame and knock a foe into a metal dumpster hard enough to total it. Slammed
        a man into a concrete street with enough force to crater it. Can fight and
        knock out goons in Rise of Sin Tzu - random fodder enemies in that game can
        get up after having a giant wooden crate slammed on their head hard enough
        to completely obliterate it (with Robin also being capable of shattering these
        wooden crates with a simple parry) - which would come out to about 530 KJ.
        In addition, during one story mission, common enemies in Rise of Sin Tzu are
        shown to, over time and with several minutes of constant attack, wear down
        and damage the Batcave's thick metal security doors. Can consistently knock
        criminals out in single attacks), possibly higher (With difficulty, karate-chopped
        through the Bat-cuffs, which have successfully restrained many Bat-rogues
        over the years - however, he did this by striking a single link in the chain.
        Harmed this goon, who earlier was not knocked out by a swing kick from Batman.
        Shown to have leg-swept and temporarily beaten down a Freeze goon who got
        up after a kick from Batgirl. Threw film reels hard enough to harm Two-Face.
        However, Robin scaling to those characters has its own share of antifeats.
        For example, during "Knight Time," Robin cannot even budge Bruce Wayne, and
        is casually restrained by the latter with one arm, even when Wayne was literally
        not cognizant of his actions. Furthermore, during "Growing Pains," Robin is
        completely incapable of budging an incomplete Clayface with his attacks) |
        Small Building Level (Scaling to 0.095 Tons - Several years older and more
        experienced than his 13-year-old counterpart. At the time of Return of the
        Jokers flashback, since Robin was still active as a hero, he should be at
        least as strong as himself when he is several-decades-retired, a state in
        which his body was still a strong enough vessel for The Joker to inhabit,
        making Batman II go limp with a punch combo (generally trouncing him throughout
        their fight, as confirmed by the notes in ROTJ's screenplay) and being called
        a "deadlier" version of the Clown Prince of Crime, tossing Batman through
        a wooden table. The Joker instructed Harley Quinn to fake a mugging to take
        Robin off guard in order to capture him, implying at least some lack of confidence
        in Harley defeating the Teen Wonder head-on)
