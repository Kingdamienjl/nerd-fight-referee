        \ (Performed a death-defying rescue despite being infected by Scarecrow's\
        \ crippling fear toxin during \"Fear of Victory\") *Acrobatics (Has excelled\
        \ in acrobatics since childhood, using his \"tremendous gymnastic abilities\"\
        \ for traversal of his environment and for avoiding attacks from enemies)\
        \ *Enhanced Senses (Was trained by Bruce Wayne, and as such should have received\
        \ the same training that granted Tim Drake inhumanly sharp hearing) *Gliding\
        \ (Uses his suit's wings to defy gravity) *Hand-to-Hand Combat Mastery (Is\
        \ a \"master combatant,\" and is playable in Rise of Sin Tzu - every single\
        \ playable character in Rise of Sin Tzu is regarded by the game's manual as\
        \ wielding \"extraordinary martial arts abilities.\" Has been instructed by\
        \ Bruce Wayne, an exceptionally skilled martial artist, for years in order\
        \ to make him the most effective crime-fighter possible, and is implied to\
        \ regularly spar with him in a manner similar to this scene from \"Night of\
        \ the Ninja.\" Dodged attacks from and even landed a hit on Kyodai Ken, a\
        \ martial arts master. Thought of as \u201Ca skilled and quick-minded fighter\
        \ in his own right\u2026\u201D Forced Bane to the ground using a creative\
        \ throw that involved swinging through his legs, pulling his arm downward)\
        \ *Weapon Mastery (With the escrima sticks he began using as of some point\
        \ prior to Batman and Harley Quinn, as well as with his various gadgets -\
        \ he's demonstrated great expertise with Batarang/Shuriken-type weapons, like\
        \ when he expertly pinned a man to some crates, disarmed Kyodai Ken from a\
        \ distance, disarmed two men in a single throw, cut Batgirl's restraints from\
        \ a distance, etc. He's also great at using a sling, such as when he precisely\
        \ hit a small hook from a good distance away. Additionally, it's very strongly\
        \ implied that Bruce taught him fencing. Demonstrated perfect marksmanship\
        \ with his audio-device gun, planting a bug in a doorway from a distance)\
        \ *Stealth Mastery (Was instructed for years by Bruce Wayne, who is \"second\
