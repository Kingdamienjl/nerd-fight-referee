    - field: powers_and_abilities
      value: 'Resistance to Absorption (Broke out Reverse Flash attemping to absorb
        him) and Possession (Can control spirits possessing him by vibrating) With
        Negative Speed Force, he gains the following: Enhanced Time Travel (Time travelled
        on multiple occasions without the need of the Cosmic Treadmill), Limited Power
        Nullification and Electricity Manipulation, Resistance to Plot Manipulation,
        Immortality Negation, and Existence Erasure (Should be comparable to Wally.
        Unaffected by Darkseid''s omega beams), Higher-Dimensional Manipulation (Through
        altering his vibrational frequencies and phasing), Beyond-Dimensional Physiology
        (By virtue of being a vessel of the speed force) All previous abilities, Limited
        Astral Projection (Can mentally send his consciousness into the Speed Force
        to check other timelines), Light Manipulation (Can use lightning to produce
        blinding amounts of light), Dimensional Travel, BFR (Was able to punch the
        Anti-Monitor into other universesDark Crisis: Big Bang, December 2022), Power
        Bestowal (Can give other''s more speed and here), Spatial Manipulation, Time
        Manipulation (Moved Time and Space a few seconds ahead of the Still Force.
        At his peak, his strongest attacks could deform space-time itselfDark Crisis:
        Big Bang, December 2022), Resistance to Mind Control (Hard to control by Gorilla
        Grodd), Mind Manipulation (Can phase to avoid Trickster''s mind tricks), Reality
        Warping, Empathic Manipulation (Kissed Iris and removed the effects of the
        Anti-Life Equation), Limited Memory Manipulation (Remembers Wally West and
        gets him from the Speed Force despite his memories of him being erased), Energy
        Manipulation, Life Manipulation, Absorption (Broke free from Turtle''s blast),
        Absolute Zero (Obstructed Captain Cold''s Absolute Zero gun) With Negative
        Speed Force, he gains the following: Aura, Damage Boost (His aura can incinerate
        bullet''s, cause explosions making contact with things, and the more punches
        he takes, the more his aura build''s up to explode his oppenent)'
      source_id: character-stats-profiles-rocket-post-flashpoint-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'At least Small City level (Much stronger than Batman). Varies with speed,
        up to Hyperverse level (Contended with Supergirl, was able to send Superman
        flying, harm Martian Manhunter, and draw blood from Wonder Woman. Is capable
        of performing the infinite mass punch, which should generate this much energy
        just by virtue of generating infinite mass. Should be comparable to Kyle Rayner),
        Outerverse level environmental destruction (Retconned DC''s Multiverse into
        the New 52 cosmology. Assisted Pandora in merging the New Earth, Wildstorm,
        and Vertigo universes. Is capable of drawing in the entirety of the speed-force).
        Can bypass durability with phasing | At least Small City level (Comparable
        to Rebirth Wally West). Varies with speed, up to Hyperverse level normally
        (With Wally West, he shattered a light construct made by Green Lantern and
        nearly broke his ring.DC Rebirth, The Flash Vol 5 #49, August 2018 Casually
        beat several Daxamites,Justice League #42, March 2020 who were as strong as
        SupermanJustice League #41, March 2020), up to Outerverse level when no longer
        holding back (Unlike Wally, Bart, and other speedsters, Barry is the only
        one who actually physically generates the speed force with every step he runs.
        The speed force touches all realities, universes, and dimensions simultaneously,
        and resides beyond the boundaries of the bleed, which is an infinite-dimensional
        structure in-between dimensions and spatially connected and transcendant over
        the multiverse. While racing Wally across all of existence, their race nearly
        tore apart the entirety of the multiverse, sending shockwaves that could be
        felt even in the Sphere of The Gods, a platonic archetypal world on the same
        level of existence as other dimensionless realms such as the phantom zone).
        At least Outerverse level with Environmental Destruction (Broke the Force
        Barrier alongside Wally)'
      source_id: character-stats-profiles-rocket-post-flashpoint-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'Immeasurable, Irrelevant when not holding back (Far faster than the
        heavy hitters of the JLA such as Superman and Wonder Woman) | Immeasurable
        normally (Consistently portrayed as easily being the fastest member of the
        Justice League, placing him significantly above Superman, Wonder Woman, Martian
        Manhunter, etc.), Irrelevant when not holding back (Has outraced Darkseid''s
        omega beams when going all out, which should be relative if not superior to
        Darkseid''s physical movement speed, which has been shown to be able to move
        to the source wall through movement alone, which also exists at the very edge
        of DC''s multiverse map. Was only barely defeated by Wally by a single footstep,
        who has ran fast enough to travel outside creation into the overvoid to where
        the concept of Death no longer exists, achieve trans-time velocity, and has
        also outran the speed-force itself. Barry has similarily outraced the Black
        Flash as well. While going all out and approaching infinite mass, Barry was
        able to knock around the Anti-Monitor and damage his armor, as well as knock
        him through several universesDark Crisis: Big Bang, December 2022.)'
      source_id: character-stats-profiles-rocket-post-flashpoint-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: 'At least Small City level. Varies with speed, up to Hyperverse level
        | At least Small City level. Varies with speed, up to Hyperverse level normally
        (Can survive the recoil of his own attacks), up to Outerverse level at his
        peak (Survived multiple attacks from the Anti-MonitorDark Crisis: Big Bang,
        December 2022)'
      source_id: character-stats-profiles-rocket-post-flashpoint-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Can get cut off from the Speed Force. He also has been shown to get\
        \ mentally overwhelmed in some situations. Feats:, Disarms some soldiers before\
        \ they\u2019re aware they\u2019ve been disarmed., Searches Manhattan and finds\
        \ Madam Xanadu before Frankenstein is aware the Flash has even left., Runs\
        \ through everywhere in Manhattan saving civilians from monsters., Can think\
        \ at a speed where he can see the future and make the best possible choice\
        \ for every action., His instincts and reflexes allow him to react and move\
        \ the femtosecond he feels even the slightest changes in air pressure., Flash\
        \ calls the Watch Tower\u2019s computers slow, despite the fact that they\
        \ can perform over 100 quadrillion calculations per second., Can learn how\
        \ to use Hal Jordan's Power Ring in seconds., Can speed up all of time and\
        \ space and take everything a few seconds into the future, choosing who to\
        \ take with him and who to leave behind, Accelerated Healing: Barry isn't\
        \ invulnerable, nor durable enough to sustain damage. However, if he is harmed\
        \ he will heal at high speeds. Any normal wear and tear damage to his bodies\
        \ are almost instantly healed., Flight: Barry can rotate his arms and spin\
        \ his body like a top to achieve something resembling helicopter flight.,\
        \ Increased Perceptions: Barry travelling at incredibly high speeds may miss\
        \ important events as they run by. The Speed Force grants him enhanced senses\
        \ that allow him to see, touch and/or taste at an increased speed and understand\
        \ it as it is processed., Phasing: Barry can vibrate his molecules so quickly\
        \ that he can achieve intangibility allowing him to phase through objects.,\
        \ Supercharged Brain Activity: Barry can access superhuman levels in his brain\
        \ further than processing information. He can test theories, understand difficult\
        \ equations and run trial and error in his brain at superhuman speeds. Barry\
        \ can think of an enormous number of outcomes of a situation if he focuses\
        \ the Speed Force on his brain., Vortex Creation: Barry can rotate his arms\
        \ and cause an incredible amount of wind to burst through his focused funnel.\
        \ Barry uses this ability automatically when he runs, reducing the air currents\
        \ around his body to low enough levels to no longer inhibit their speed. Creatively,\
        \ Barry can create tornadoes and gusts with his arms., Speed Force Drag: Can\
        \ drag people into the Speed Force and have increased stats and control over\
        \ his power. Barry can even defy gravity and grab things using the Speed Force\
        \ lightning-aura., Time Shift: Barry is connected to time in a similar way\
        \ like Professor Zoom, but Barry doesn't slow time down, he can move it forward"
