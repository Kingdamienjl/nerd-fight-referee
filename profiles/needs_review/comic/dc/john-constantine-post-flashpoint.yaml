  section: weaknesses
  axis: weakness
  text: 'Suffers from lung cancer now that his Demon Blood has been removed. Most
    of his magic has a cost he will eventually have to pay, though this cost will
    often not be physical, but end up making his life worse by hurting those close
    to him instead. Notes: *Before making any changes to this page, please read and
    follow the Power-scaling Rules for Marvel and DC Comics *In Justice League Dark
    Vol 2 3, John lost access to his Demon Blood, which allowed him to ignore some
    of the cost of his spells. In future appearances, however, he hasn''t been shown
    to struggle more than before with his magic. As this leaves it uncertain whether
    he could use the great majority of his abilities, thus making it impossible to
    know how he might perform in any certain fight, it is advised to give John access
    to his Demon Blood in VS Threads.'
