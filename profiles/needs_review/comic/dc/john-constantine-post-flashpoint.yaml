    magic just by having heard her mumble it in her sleep,Justice League Dark Vol
    1 3 while she had to endure years of incredibly rigid training to master it. John''s
    sheer magic skill is such that he could threaten even powerhouses such as The
    Spectre or Swamp Thing. Was the only one among the Justice League Dark to figure
    out how to seal June Moon and the Enchantress together and that Madame Xanadu
    was the one to split them in the first place. Despite the (mutual) hatred that
    almost everyone in the Justice League Dark has shown towards Constantine, he has
    proven to be a very good leader, coming up with clever plans and being able to
    adapt them on the spot.Trinity of Sin: Pandora Vol 1 7Justice League Dark Vol
    1 9 Knows all about Shazam''s origin and powers.Justice League Dark Vol 1 22 Mostly
    correctly guessed that The Phantom Stranger was only imitating human feelings.
    Defeated all the Justice League Dark except Zatanna at once while drunk. Came
    up with a plan to turn a madman''s obsession with William Blake against him. As
    better detailed in his Social Influencing section in Powers & Abilities, John
    Constantine is known as the World''s Greatest Con Man for a reason, with him having
    shown the ability to adapt his incredible talking and planning skills to basically
    any situation, to the point that one could say that despite his wealth of magical
    knowledge, John''s best weapon is his cunning. Standard Tactics: Constantine is
    typically not a fighter. If possible, he will retreat from a fight to find help
    or a better strategy. If that is impossible, he is a dirty fighter, sometimes
    completely forgoing flashy magic spells for more subtle and sneaky tactics if
    it fits the situation. Other times, he will seek to end the fight as quickly as
    possible, resorting to techniques that ignore durability in favor of incapacitating
    or even killing the enemy in some other way.'
