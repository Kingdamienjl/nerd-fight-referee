- id: claim-intelligence-9fd37f1e
  section: power_scale
  axis: battle_iq
  text: "Gifted. While she was originally incapable of speech and functionally illiterate\
    \ to the point of not knowing what letters wereBatgirl Vol. 1 #54, September 2004,\
    \ she is considered highly intelligent by Barbara Gordon, and she has shown herself\
    \ to be a skilled detective. She was able to deduce that Bruce Wayne was Batman,\
    \ figure out a detail about Vesper Fairchild\u2019s murder that Tim Drake, Dick\
    \ Grayson and Barbara Gordon hadn\u2019t noticedBatgirl Vol. 1 #27, June 2002,\
    \ and she figured out another detail that Dick hadn\u2019t seenBatgirl Vol. 1\
    \ #29, August 2002. She would later take ESL courses and get tutoring, allowing\
    \ her to overcome her illiteracy. Extraordinary Genius. Cassandra is one of the\
    \ greatest, if not the greatest martial artist in the world, and her skills are\
    \ hailed above many of the greatest fighters in the DC universe. As a child, she\
    \ was trained to master all forms of armed and unarmed combat, and even before\
    \ being trained by Batman, her skills were on par with the likes of Nightwing\
    \ and RobinBatman: Legends of the Dark Knight Vol. 1 #120, August 1999. She was\
    \ able to defeat Lady Shiva, something Batman had never been able to do, which\
    \ caused her to become revered in the martial arts community as \u201CThe One\
    \ Who Is All\u201D. Batman has claimed that nobody is as skilled of a fighter\
    \ as CassandraBatgirl Vol. 1 #58, January 2005, and he directly stated that Deathstroke\
    \ couldn\u2019t beat her in hand-to-hand combat, something that Slade himself\
    \ implied. Many members of the Batfamily have been shown to be inferior to Cassandra,\
    \ including Barbara Gordon, Stephanie BrownBatgirl Vol. 1 #28, July 2002 and Tim\
    \ Drake, and she has been directly stated to be superior to Batman. Standard Tactics:\
    \ Cassandra constantly holds back to avoid killing her opponents, something that\
    \ has been noted on several different occasionsBatgirl Vol. 1 #70, January 2006.\
    \ In combat, she will usually rely on her martial arts skill to defeat her opponent,\
    \ occasionally making use of her batarangs for ranged combat. In her Kasumi identity,\
    \ she uses various kinds of bladed weaponry - typically a pair of swords - to\
    \ fight, and she will use the Dimensiometer when fighting opponents far stronger\
    \ than her, like she did against Hawkgirl."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-28b2b182
  section: weaknesses
  axis: weakness
  text: "Her ability to read body language is less effective against opponents like\
    \ the Joker or Deathstroke, as the former\u2019s body language comes out as gibberish\
    \ and the latter\u2019s is too much for her to followBatgirl Vol. 1 #63, June\
    \ 2005. She used to be illiterate and limited in speech due to her childhood,\
    \ but she has since overcome this. Note: Her first key ends with Batman: Gotham\
    \ Knights #2 (April 2000). Her second key ends with her death and subsequent resurrection\
    \ at the hands of Lady Shiva in Batgirl Vol. 1 #25 (April 2002)."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-74916059
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Enhanced Senses (Detected that a seemingly\
    \ random person was the shapeshifter she and Batman were looking forBatgirl Annual\
    \ #1, August 2000. Picked out the smell of a corpse over gasoline and above the\
    \ nearby riverBatgirl Vol. 1 #61, April 2005. Used her sense of smell to accurately\
    \ determine Camorouge\u2019s location, despite her being invisibleBatman and the\
    \ Outsiders Vol. 2 #5, May 2008), Master Martial Artist (As a child, she mastered\
    \ nearly all forms of unarmed combatBatman Allies Secret Files and Origins 2005,\
    \ August 2005 and she is stated to be proficient in virtually all known forms\
    \ of combatBatman: Gotham City Secret Files, April 2000. Was the first person\
    \ in history to defeat Lady ShivaBatgirl Vol. 1 #26, May 2006, and is superior\
    \ to the likes of BatmanBatgirl Vol. 1 #56, November 2004World War III #2, June\
    \ 2007, DeathstrokeBatgirl Vol. 2 #1, September 2008, Tim DrakeRobin Vol. 2 #148,\
    \ May 2006 and Black CanaryBirds of Prey Vol. 1 #61, January 2004 in hand-to-hand\
    \ combat. Her fighting abilities are stated to be unsurpassedBatgirl Secret Files\
    \ and Origins, August 2002, and she became recognized as the greatest martial\
    \ artist in the world), Weapon Mastery (As a child, she mastered nearly all forms\
    \ of armed combat and was trained to master every known weapon), Stealth Mastery\
    \ (Disappeared without being noticed onAzrael: Agent of the Bat #56, September\
    \ 1999 severalBatman Vol. 1 #569, September 1999 differentBatgirl Vol. 1 #1, April\
    \ 2000 occasionsBatman Vol. 1 #605, September 2002. Snuck into Arkham Asylum and\
    \ got into the Joker\u2019s cell without being detectedDC First: Batgirl/Joker,\
    \ July 2002. Broke into a federal complex, evading a guard and thirty-two security\
    \ cameras in the processBatgirl Vol. 1 #17, August 2001. Evaded Renee Montoya\
    \ and other detectivesBatgirl Vol. 1 #24, March 2002. Escaped Catwoman\u2019s\
    \ sight and got behind her without being noticed), Acrobatics (FrequentlyBatgirl\
    \ Vol. #21, December 2001 performs flipsCatwoman Vol. 2 #90, March 2001 and acrobaticBatgirl\
    \ Vol. 1 #43, October 2003 maneuversRobin Vol. 2 #73, Feburary 2000), Analytical\
    \ Prediction (Can read body language, which allows her to know what her opponent\
    \ is going to do before they do it. According to Batman, she already knows what\
    \ her opponents had just started to think about doingBatgirl Vol. 1 #4, July 2000.\
    \ Reads her opponent\u2019s intentionsBatgirl Vol. 1 #25, April 2002. Can tell\
    \ if someone is lying or being truthful, tell their feelings and maybe even their\
    \ thoughtsBatgirl Vol. 1 #47, Feburary 2004), Body Control (Can stop her own heart),\
    \ Accelerated Development (Training; Abilities, Learned stick fighting in five\
    \ minutes and regained her body-reading ability after training with Shiva for\
    \ seemingly a single nightBatgirl Vol. 1 #9, December 2000), Technique Mimicry\
    \ (Copied Shadow Thief\u2019s secret koga-ryu techniques just by watching and\
    \ fighting him), Pressure Points (Knows moves meant to disable people and she\
    \ can stop heartbeatsBatgirl Vol. 1 #6, September 2000. Is one of the only three\
    \ people in the world that know the Falling Leaf nerve pinchBatgirl Vol. 1 #49,\
    \ April 2004), Paralysis Inducement (Paralyzed Oracle\u2019s upper body), Sleep\
    \ Inducement (Put a metahuman to sleepBatgirl Vol. 1 #45, December 2003) Explosion\
    \ Manipulation (Via explosivesBatgirl Vol. 1 #52, July 2004), Fire Manipulation\
    \ (Via lighter), Fragrance Manipulation (Via smelling saltsSupergirl Vol. 4 #63,\
    \ December 2001), Intangibility (Via Shadow Thief\u2019s DimensiometerJustice\
    \ League Elite #6, February 2005, which allows the user to turn into a living\
    \ shadowHawkworld Vol. 2 #5, October 1990), Resistance to Cold Temperatures (Her\
    \ Batgirl suit insulates and protects her from suffering lethal hypothermia while\
    \ encased in iceBatgirl Vol. 1 #69, December 2005)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
