  attack_potency:
    text: "Small Building level+ (As a child, she could draw blood from Bronze TigerBatgirl\
      \ Vol. 1 #67, October 2005. ConsistentlyBatman Vol. 1 #567, July 1999 harmedBatgirl\
      \ Vol. 1 #11, Feburary 2001 David Cain, who could fight BatmanDetective Comics\
      \ Vol. 1 #734, July 1999 on two separate occasions) | Small Building level+\
      \ (Should be stronger than before. Harmed Harley QuinnBirds of Prey Vol. 1 #27,\
      \ March 2001) | Building level (Fought and defeated Lady Shiva, and was the\
      \ first person in history to have ever done so. Was compared to Killer Croc\
      \ on amphetamines. Fought Deathstroke twice and seemed to have the advantage\
      \ during their first fightNightwing Vol. 2 #81, July 2003, although she is noted\
      \ to be physically weaker than him. Fought on par with RavagerBatgirl Vol. 1\
      \ #64, July 2005. Drew blood from the ScarebeastBatman Vol. 1 #633, December\
      \ 2004 and Monsieur Mallah, who could harm Gorilla GroddSalvation Run Vol. 1\
      \ #4, April 2008. One-shot the Joker, stomped a hologram of Barbara Gordon multiple\
      \ times in under a second and stomped David CainBatgirl Vol. 2 #6, Feburary\
      \ 2009 while recovering from an injuryBatgirl Vol. 2 #4, December 2008. Deathstroke\
      \ claimed that Batman couldn\u2019t beat Cassandra, even on his best day. Fought\
      \ Lady Shiva a second timeBatgirl Vol. 1 #73, April 2006, with Shiva having\
      \ trained since their last fightBatgirl Vol. 1 #68, November 2005, and ultimately\
      \ snapped her neck)"
    source_ids:
    - vsbattles-cassandra-cain-post-crisis-dc
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Subsonic movement speed (Can move this fast). At least Supersonic+ (Can\
