    - field: stamina
      value: 'Superhuman (As a child, she played two-for-flinching with bullets and
        could ignore bullet wounds. Survived being shot with several high-caliber
        bullets that could tear through walls like paper, shrugged off being rammed
        by a police car and breaking more ribs while already injured and could briefly
        continue fighting after being stabbed in the heartBatgirl Vol. 1 #72, March
        2006. Watched a projection of Batman for a day or two without eating or sleepingBatgirl
        Vol. 1 #7, October 2004 and could still fight the League of Assasins after
        going through multiple days without eating or sleepingBatgirl Vol. 1 #71,
        Feburary 2006. Smashed a bunch of mannequins as a daily routine, and was implied
        to have been doing so for ten hours straight)'
