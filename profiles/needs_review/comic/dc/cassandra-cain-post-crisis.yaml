      \ 1 #22, January 2002) | Subsonic movement speed (Should be faster than before.\
      \ Comparable to Tim DrakeBatgirl Vol. 1 #18, September 2001). Hypersonic+ combat\
      \ speed and reactions (Dodged a sniper bullet inches from her face. Casually\
      \ dodged attacks from Batman, and when not holding back, she struck Batman so\
      \ fast that he didn\u2019t perceive it) | Hypersonic movement speed (Outran\
