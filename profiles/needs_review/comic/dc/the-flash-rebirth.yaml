    - field: weaknesses
      value: "Uncontrollably discharges lightning when he becomes emotionally overwhelmed.\
        \ Using the Speed Force excessively and recklessly can result in him being\
        \ permanently trapped in it. He cannot alter the kinetic energy of objects\
        \ that gain their speed from time manipulation. He also needs a massive amount\
        \ of food to compensate for his greatly accelerated metabolism. Lacks complete\
        \ control over his time manipulative powers. Feats: *Can perceive picoseconds\
        \ *Accelerates far beyond light-speed to the point of entering the Speed Force\
        \ *Beats Ultraman into submission, hitting him hundreds of thousands of times\
        \ before he could react *Easily knocks out H.I.V.E. agents that were previously\
        \ overpowering the Titans, including Donna Troy and Tempest *Harms Troia,\
        \ an alternate future counterpart of Donna TroyTitans (Volume 3) #18 Notable\
        \ Attacks/Techniques: *Phasing: Wally can vibrate his molecules so quickly\
        \ that he can achieve an intangible state, allowing him to harmlessly pass\
        \ through objects and attacks. *Speed Steal: Wally can absorb the speed, kinetic\
        \ energy and momentum from anyone or anything, adding them to his own. In\
        \ addition to being able to slow the targets down, he is also able to immobilize\
        \ them indefinitely, making them frozen like statues. This technique can be\
        \ used to stop projectiles in midair. *Time Freezing: Wally developed the\
        \ ability to pause the flow of time when he gained a heart condition.Titans\
