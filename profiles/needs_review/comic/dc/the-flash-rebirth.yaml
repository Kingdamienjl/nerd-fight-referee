power_scale:
  tier:
    text: At least Low 7-B. Varies with speed, up to 1-B. 1-A Environmental Destruction
      | At least Low 7-B. Varies with speed, up to 1-B normally, up to 1-A when no
      longer holding back. At least 1-A with Environmental Destruction
    source_ids:
    - character-stats-profiles-the-flash-rebirth
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'At least Small City level (Much stronger than Batman). Varies with speed,
      up to Hyperverse level (Contended with Supergirl, was able to send Superman
      flying, harm Martian Manhunter, and draw blood from Wonder Woman. Is capable
      of performing the infinite mass punch, which should generate this much energy
      just by virtue of generating infinite mass. Should be comparable to Kyle Rayner),
      Outerverse level environmental destruction (Retconned DC''s Multiverse into
      the New 52 cosmology. Assisted Pandora in merging the New Earth, Wildstorm,
      and Vertigo universes. Is capable of drawing in the entirety of the speed-force).
      Can bypass durability with phasing | At least Small City level (Comparable to
      Rebirth Wally West). Varies with speed, up to Hyperverse level normally (With
      Wally West, he shattered a light construct made by Green Lantern and nearly
      broke his ring.DC Rebirth, The Flash Vol 5 #49, August 2018 Casually beat several
      Daxamites,Justice League #42, March 2020 who were as strong as SupermanJustice
      League #41, March 2020), up to Outerverse level when no longer holding back
      (Unlike Wally, Bart, and other speedsters, Barry is the only one who actually
      physically generates the speed force with every step he runs. The speed force
      touches all realities, universes, and dimensions simultaneously, and resides
      beyond the boundaries of the bleed, which is an infinite-dimensional structure
      in-between dimensions and spatially connected and transcendant over the multiverse.
      While racing Wally across all of existence, their race nearly tore apart the
      entirety of the multiverse, sending shockwaves that could be felt even in the
      Sphere of The Gods, a platonic archetypal world on the same level of existence
      as other dimensionless realms such as the phantom zone). At least Outerverse
      level with Environmental Destruction (Broke the Force Barrier alongside Wally)'
    source_ids:
    - character-stats-profiles-the-flash-rebirth
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Immeasurable, Irrelevant when not holding back (Far faster than the heavy
      hitters of the JLA such as Superman and Wonder Woman) | Immeasurable normally
      (Consistently portrayed as easily being the fastest member of the Justice League,
      placing him significantly above Superman, Wonder Woman, Martian Manhunter, etc.),
      Irrelevant when not holding back (Has outraced Darkseid''s omega beams when
      going all out, which should be relative if not superior to Darkseid''s physical
      movement speed, which has been shown to be able to move to the source wall through
      movement alone, which also exists at the very edge of DC''s multiverse map.
      Was only barely defeated by Wally by a single footstep, who has ran fast enough
      to travel outside creation into the overvoid to where the concept of Death no
      longer exists, achieve trans-time velocity, and has also outran the speed-force
      itself. Barry has similarily outraced the Black Flash as well. While going all
      out and approaching infinite mass, Barry was able to knock around the Anti-Monitor
      and damage his armor, as well as knock him through several universesDark Crisis:
      Big Bang, December 2022.)'
    source_ids:
    - character-stats-profiles-the-flash-rebirth
    confidence: 0.6
    notes: auto_repair source extraction
