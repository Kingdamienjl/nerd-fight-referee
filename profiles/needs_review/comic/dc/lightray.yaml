        easily survive normal radion shots. Notable Attacks/Techniques: *Nova Burst:
        Described as "total solar power", Lightray channels a light aura around his
        body while charging at the enemy like a meteor. *Light Mirage Effect: Lightray
        manipulates light to create illusions realistic enough to fool Apokoliptian
        hunting dogs. Notes: *Before making any changes to this page, please read
        and follow the Power-scaling Rules for Marvel and DC Comics. *"Avatar" is
        a term specifically referring to an ability demonstrated by Pre-Flashpoint
        Darkseid and Highfather, and it was never stated that the lesser versions
        of New Gods were specifically created by them to interact with lower planes
        of reality. The term used by Grant Morrison to refer to these lower aspects
        of the New Gods is "emanation". * Like other New Gods, the Pre-Flashpoint
