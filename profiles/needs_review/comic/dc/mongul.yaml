    - field: powers_and_abilities
      value: 'His powers and abilities don''t vary in the same way his statistics
        do, and as such they can be listed all together. *Superhuman Physical Characteristics
        (See Attack Potency, Speed, Lifting Strength, and Durability) *Combat Expertise
        (Was an experienced gladiator, managing to contend skill-wise with Superman
        and Draaga) * Stealth Mastery (Snuck up on Wonder Woman, defeating her "before
        she knew (he) was there") *Preparation (Seems to have sought out the Black
        Mercy to incapacitate Superman, allowing for an easier victory) With Preparation,
        he can utilize: *Energy Projection (with his Planet-Busting Energy Cannon)
        *Illusion Creation (The Black Mercy latches onto its target, trapping them
        in an illusion of their greatest desire)'
      source_id: character-stats-profiles-mongul-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Varies (Mongul's power level is overtly somewhat inconsistent. In "War
        World," he is overtly relative to (if not slightly weaker than) JL Season
        1 Superman - whereas during "For the Man who has Everything," which is during
        JLU, he is capable of holding his own against a furious Superman. This is
        plainly inconsistent, considering JL Season 1 Superman is far weaker than
        his other DCAU appearances, even in the words of Bruce Timm himself), from
        Large Planet Level (Scaling to 1.03 Ronnatons - Was overtly equal to Draaga
        (only losing their fistfight presumably because he was already exhausted from
        fighting Superman), who fought JL Season 1 Superman and could even inflict
        small flesh wounds on him with strikes - with Mongul similarly fighting Superman
        and having a temporary upper hand, albeit Superman was unable to truly fight
        back because he believed Mongul would destroy Draaga's planet if he did. Despite
        being weaker than he is during STAS, JL Season 2, and JLU, JL Season 1 Superman
        is still powerful enough to overpower the beam of a Manhunter, which can beam
        struggle with a serious Green Lantern), up to Large Star Level at his peak
        (Scaling to 1.664 Foe - Fought a furious, standard-strength Superman during
        "For the Man who has Everything," and despite being overtly somewhat weaker
        (at one point, he himself admitted a volley of punches from Superman could
        have killed him had Superman not regained his wits), he was able to hurt him
        and temporarily gain the upper hand at a few points during their fight despite
        Superman being so furious during this battle that it's strongly implied he
        would have broken his no-kill code had he not stopped himself - Batman even
        believed Mongul could kill Superman if Superman was left defenseless by the
        Black Mercy. Soundly overpowered a furious Wonder Woman, viewing her as little
        more than an annoyance (despite Diana being able to budge his head with blows
        - however, said blows did no actual damage and, in reality, only hurt Wonder
        Woman's hands) - with producer Dwayne McDuffie referring to this fight as
        Wonder Woman getting an "ass-whupping" and Batman being sure Mongul could
        kill her)
      source_id: character-stats-profiles-mongul-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Varies, from Relativistic+ (Scaling to 0.53c - Scales (via Draaga) in
        speed to JL Season 1 Superman, who despite having his powers lessened could
        keep up with a battle-ready Wonder Woman) to FTL (Scaling to 2.3c - Kept up
        with an enraged standard-strength Superman, landing attacks on him, and landed
        attacks on an alert Wonder Woman)
      source_id: character-stats-profiles-mongul-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Varies, from Large Planet Level (Scaling to 1.03 Ronnatons - Should scale
        to his own durability as per Newton's Third Law, and could keep fighting after
        several blows from a bloodlusted Draaga - Draaga being capable of giving JL
        Season 1 Superman small flesh wounds with his attacks), up to up to Large
        Star Level at his peak (Scaling to 1.664 Foe - Got up and performed a knee
        strike after several blows to the face from a furious Superman (with Superman
        being so enraged at the time that it's all but stated that he nearly broke
        his no-kill code against Mongul), even staying in the fight, albeit with injury,
        after taking a blast of Heat Vision to the chest. Was so durable that an enraged
        Wonder Woman striking him twice in the face hurt her hands more than it hurt
        Mongul himself, with the furious strikes doing little more than budging Mongul's
        head, with none of WW's other attacks doing anything more than annoying him)
      source_id: character-stats-profiles-mongul-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Is extremely cocky and prideful. Note: Mongul appears in the novel "Wild
        at Heart," which at the time was meant to be a tie-in to the DCAU continuity.
        However, the fact that Hawkgirl very clearly meets Lobo for the first time
        during JL Season 2''s "Hereafter" does not mesh with the fact that she clearly
        does not know him and is meeting him for the first time during the novel -
        there''s no way Hawkgirl could have met Lobo for the first time twice. Since
        the onscreen episode naturally takes precedent, it logically follows that
        the novel is not canon and his feats within said novel can be disregarded.
        Category:Goulden1998 Category:Tier 5'
      source_id: character-stats-profiles-mongul-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
