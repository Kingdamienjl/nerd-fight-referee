    - field: powers_and_abilities
      value: Peak Human Physical Characteristics, Illusion Creation (Created an illusion
        that Doctor Fate believed to be real, which led to his death). Created an
        illusion on all divine senses that tricked Darkseid into believing he was
        dead and finished his mission), Extrasensory Perception, Astral Projection
        (Can enter the Collective Unconscious and manipulate dream logic bigger than
        belief), Exorcism/Spiritual Purification, Genius Intelligence, Telepathy,
        Memory Manipulation, Dimensional Travel, Sleep Manipulation that even works
        on elemental forces, Unholy Manipulation, Probability Manipulation and Fate
        Manipulation with Synchronicity Wave; Constantine rides the waves of Synchronicity,
        which allow him to be in the right place at the right time, control the fate
        of himself and others and manipulate events that have no place for causation.
        Synchronicity is tied to concepts such as the Collective Unconscious, which
        is the collective beliefs, hopes and dreams of humanity that shape reality
        and creates a hierarchy of Gods, concepts and creation itself. Synchronicity
        in magic is the belief the universe is guiding you. Resistance to Telepathy
        and Possession, Magic; Magic is creation itself. Manipulating magic is manipulating
        creation. You alter time and space, you warp reality, you make objects appear
        by pure force of will. It's a frequency that vibrates on every facet of existence.
        But there is no magic without belief. Belief is what allows the impossible
        to become possible. To allow something you believe come into fruition. You
        believe your power to be infinite, it will be more powerful. You believe magic
        has a cost, it will cost you. You make a coin disappear. You take a rabbit
        from a hat. You saw a lady in half. Is it magic or is it a trick? The trick
        is always to be learned. It is science. It is craft and skill. Then where
        is magic? The magic is in getting people to believe in another reality despite
        what they know to be true. That is where magic comes from. Belief. Belief
        is also tied directly to the Collective Unconscious as a foundational source
        in DC Comics. Belief from humanity powers the likes of The Presence. Energy
        Manipulation, Teleportation, Attack Reflection, Portal Creation (Can open
        portals between Heaven and Hell and other realities), Forcefield Creation
        and Magic Resistance (Protection Circles and Wards, which Presence could not
        break through, Casted the Rings of Dolus which held off Darkseid's attack
        which was crushing him on every level), Illusion Creation, Resistance to Possession
        (Resisted Deadman's possession. Resistance to Corruption (Resisted the effects
        of Pandora's Box), Ice Manipulation, BFR to other realities, Curse Manipulation,
        Sealing, Summoning (Can summon demons, spirits, Angels, Djinn, and other magical
        creatures. Summoned the Trinity of Sin against their will. Summoned Phantom
        Stranger against his will and casted him across creation), Soul Mutilation,
        Abstract Existence, Conceptual Manipulation (Can create living ideas such
        as angels, demons, mythical creatures and concepts). Plot Manipulation (Constantine
        is the puppet master of his own story and all events that have transpired
        in his life were at the will of his subconscious mind), Backwards Magic (Constantine
        can use Zatanna's backwards magic better than her), Soul Bind (Can bind the
        souls of angels, demons and Witchmark Wonder Woman), Power Nullification &
        Immortality Negation (Type 8 ,9 and True Godly. Can cut off Swamp Thing from
        the Green while connected to the Parliament of Worlds and had the Voice of
        God. Can shut off magic as a whole), Reality Warping (With the Books of Magic,
        he was stated to destroy all of existence), Resistance to Divinity (Resisted
        the belief of The Presence and denied his existence). Mathematics Manipulation
        (Can manipulate his brain alpha's waves to move through a pure mathematical
        realm, which exists in the 5th dimension). Precognition (Predicted the events
        of Crisis on Infinite Earths and predicted the coming of the Otherkind invading
        the Multiverse).
      source_id: character-stats-profiles-constantine-rebirth-dc
      provider_id: character_stats_profiles
