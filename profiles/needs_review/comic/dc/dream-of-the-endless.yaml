        thought itself ceases to exist(Preface; Page 5) The Sandman: Book of Dreams
        by Neil Gaiman), Dream Manipulation, Light Manipulation (Has shown the ability
        to cast light from the palm of his hand), Weather Manipulation (Delirium implies
        that the weather is based on Dreams mood(Issue 42; Page #15) The Sandman (1989)),
        Creation (Creates a tissue out of thin air(Issue 42; Page #17) The Sandman
        (1989)), Animal Manipulation (Randomly created this large flock of pigeons)'
