        \ exists beyond space and time, in the space beyond space and space beneath\
        \ space. His ship, which is made from a piece of The Dreaming sails outside\
        \ of space or time, in nowhere and nothing outside of Destiny's Book. The\
        \ aspects of Dream exist in a notional place, neither real or unreal) | High\
        \ Outerverse level (Exists outside of space and time and is a part of the\
        \ eldritch abominations that exists in \"space beneath space and space beyond\
        \ space\") | Outerverse level, possibly Outerverse level+ (Should be superior\
        \ to Mister Mxyzptlk, as the ruler of the Dreaming, a place of imagination\
        \ and story within the Sphere of the Gods, an archetypal and platonic world.\
        \ A section of the Dreaming contains Lucien's library which contains all the\
        \ stories of the Dark Multiverse and whose destruction could result in the\
        \ destruction of the Dreaming and the Multiverse) | High Outerverse level\
        \ (Dream of the Endless is part of a dysfunctional family of conceptual entities\
        \ that each represents an aspect of reality. In each iteration of Creation,\
        \ Dream has an individual aspect overseeing said reality. However, Morpheus\
        \ himself expresses that he is just one small glinting light from an endless\
        \ perfect jewel, representing that he is just a glimpse of what Dream as a\
        \ true abstraction is. This would be the case for all Dreams\u2019 in each\
        \ version of Creation because they're all heirs of Night and Time and each\
        \ viewpoint is connected. Seeing as Daniel knew everything Morpheus knew as\
        \ the \u201CDream of the Endless\u201D and unlike said viewpoint, this abstraction\
        \ is pure, non-tangible, and isn\u2019t limited to Creation.)"
