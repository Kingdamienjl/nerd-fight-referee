        the denizens of the Sphere. However, through the power of belief the power
        that any Lord of Order, or any being for that matter, possesses is greatly
        enhanced. Hence why the attack potency and range of Nabu are Outerverse level+
        and Outerversal+, but this is due to the potential being greater throughs
