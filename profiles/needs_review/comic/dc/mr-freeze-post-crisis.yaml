- id: claim-weaknesses-2e481021
  section: weaknesses
  axis: weakness
  text: 'Cannot survive more than an hour without his suit and helmet. His glass helmet
    is his weak spot. His body must remain in cold temperatures or he will die if
    removed from his suit. Notable Attacks/Techniques: *Freeze Shattering- Mr. Freeze
    uses his ice based weaponry to freeze a foe into a solid block of ice. He than
    breaks the ice block, causing the foe''s body to shatter. This can be used as
    a form of Durability Negation, provided his freezing abilities would even work
    on the foe. If the ice block is not shattered, the person will remain trapped
    until they either thaw out or freeze to death. Even normal humans can last a while,
    though they will die after some time. Note: Before making any changes to this
    page, please read and follow the Power-scaling Rules for Marvel and DC Comics.
    ==Notable Matchups== Victories: The Tall Man (Phantasm) The Tall Man''s Profile
    (Speed Unequalized and Mr. Freeze faced tens of thousands of The Tall Man) Losses:
    Inconclusive: ==References== {{Reflist}} {{discussions|Mr Freeze Post-Crisis|Mr.
    Freeze (Post-Crisis)}} Category:Characters Category:DC Comics Category:Animal
    Users Category:Armor Users Category:Armor Users Category:Aura Users Category:Comic
    Book Characters Category:Durability Negation Users Category:Geniuses Category:Gun
    Users Category:Humans Category:Ice Users Category:Male Characters Category:Preparation
    Users Category:Temperature Users Category:Villains Category:Weapon Masters Category:Tragic
    Characters Category:Antagonists Category:Criminals Category:Marksmen Category:Weapon
    Users Category:Bomb Users Category:Flamethrower Users Category:Jet Pack Users
    Category:Helmet Users Category:Disabled Characters Category:Anti-villains Category:Mutants'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7fcad2a7
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= *Superhuman Physical
