    - field: powers_and_abilities
      value: "*Superhuman Physical Characteristics (See Speed and Durability) *Indomitable\
        \ Will (Served as a Green Lantern) *Empowerment (Empowered by his Yellow Power\
        \ ring) *Flight (Can fly at tremendous speeds, even through space) *Weapon\
        \ Mastery (with his ring) *Energy Projection (Can fire beams and blasts of\
        \ Yellow Energy) *Psuedo-Telekinesis (Can lift and move things with his constructs)\
        \ *Creation/Weapon Creation (Has created various constructs, such as a mace,\
        \ a huge sword, axes, a buzzsaw, a giant hammer, a pitchfork, a dragon, a\
        \ drill, a huge alien beast, et cetera) *Forcefield Creation (Can create barriers\
        \ to block attacks) *Paralysis Inducement (Created restraint constructs to\
        \ contain Superman) *Explosion Manipulation (Created a construct that blew\
        \ up) *Illusion Creation (Disguised himself as John Stewart) *Light Manipulation\
        \ (Used his ring as an X-Ray) *Electricity Manipulation (Gave microchips an\
        \ electric charge) *BFR (Blasted Kyle Rayner from a mountain range to the\
        \ Ferris Airfield) *Resistance to Electricity Manipulation (Blocked a blast\
        \ from Static) *Resistance to Radiation Manipulation (Made Luthor's ship radiation-proof)\
        \ *Resistance to Cosmic Radiations (Flew through space, as seen in \u201C\
        In Brightest Day\u201D) - as well as possibly many more abilities depending\
        \ on whether or not his ring is identical in function to a normal Green Lantern\
        \ Ring"
      source_id: character-stats-profiles-sinestro-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Brown Dwarf Level (Scaling to 1.002 Quettatons - Demonstrably evenly\
        \ matched with Green Lantern, even knocking him out with a continuous blast\
        \ (despite GL's energy barrier being active) and swatting him away with a\
        \ mace construct. Stated to be able to destroy planets. Kept Superman off\
        \ his feet with his attacks, though notably never doing any meaningful damage\
        \ and being decidedly outperformed in their second encounter, when he didn't\
        \ have the advantage of taking him off guard. Temporarily KO\u2019d Hawkgirl\
        \ in one attack. Pulverized a huge wall of ice with one blow - while this\
        \ episode implies Sinestro couldn't have done this to a stone wall, the preponderance\
        \ of higher scaling he has make this one of the DCAU's many easy-to-dismiss\
        \ low ends, especially considering the fact that Sinestro performs a feat\
        \ roughly equivalent to destroying a stone wall just moments later without\
        \ breaking a sweat)"
      source_id: character-stats-profiles-sinestro-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: "Relativistic+ reactions and combat speed (Scaling to 0.53c - Can fight\
        \ close battles with (and is clearly about as fast as) the likes of Green\
        \ Lantern, Kyle Rayner (both of which can react to and block his light-speed\
        \ beams), and Static. Has a feat of dodging a Lantern Beam, and is comparable\
        \ to many others who have similar feats - all these feats compiled here. Reacted\
        \ to and blocked electricity from Static at point-blank - Static's electricity\
        \ blasts being this fast), with Speed of Light attack speed with Lantern Beams\
        \ (Explained here), Massively FTL+ flight speed in space (Considering his\
        \ ring (in the comics the DCAU is taking from) is intended to be a replica\
        \ of the Green Lantern ring without the need to charge it, his flight speed\
        \ shouldn\u2019t be any slower than he was as a prominent Green Lantern, wherein\
        \ he was presumably comparable in flight speed to the likes of Jessica Cruz,\
        \ Salakk, and Katma Tui), and Massively Hypersonic flight speed in an atmosphere\
        \ (Upscales from Mach 106 - Pursued and kept pace with Kyle Rayner while the\
        \ latter was desperately trying to fly away from him, and as such logically\
        \ would have been using his full flight speed)"
      source_id: character-stats-profiles-sinestro-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: "Brown Dwarf Level physically (Scaling to 1.002 Quettatons - Similar\
        \ to Green Lantern, surrounds himself in a skintight barrier of Lantern Energy),\
        \ Small Star Level with constructs (Scaling to 8.018 Quettatons - His other\
        \ constructs should be comparable to Green Lantern\u2019s, and have withstood\
        \ punches from Wonder Woman, temporarily restrained Superman, blocked a blast\
        \ from a furious Static, among other feats)"
      source_id: character-stats-profiles-sinestro-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
