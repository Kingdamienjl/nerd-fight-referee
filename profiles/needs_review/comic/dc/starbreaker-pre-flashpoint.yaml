    his clones. Blew up a tiny spaceship and absorbed its energy. He absorbs emotions.
    Feeds on fearJustice League America Issue 63, whichJustice League America Issue
    64 empowers himJustice League of America Vol 2 Issue 29 Absorbed Fire and Booster''s
    powers. Can eat soulsAdam Strange Vol 2 Issue 6. Can eat lightJustice League of
    America Vol 2 32. Can absorb kinetic energy. Absorbed Firestorm''s power to empower
    himself.), Preparation (Prepares for his enemies beforehand to always have the
    upper hand in a fight. Prepared for Flash''s speed, countering him. Prepared for
    Superman, attacking him with red sun radiation.), Immortality (Type 1 and Type
    3/4), Flight (Shown here), Magic (Mixed magic and science to become the most powerful
    man in the Galaxy), Energy Manipulation, Energy Projection, and Radiation Manipulation
