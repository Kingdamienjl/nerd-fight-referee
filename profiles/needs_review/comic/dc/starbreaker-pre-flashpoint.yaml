  attack_potency:
    text: Varies (His power levels depend entirely on his focus level. If he is focused,
      he would be extremely powerful, however, if he loses focuses, he can become
      extremely weak. In addition, his power levels rely on how much energy, life
      force, emotions, and powers, he has absorbed, which can allow him to go up or
      down. Darker emotions empower him greatly, however, good emotions tend to counter
      that power), up to Low Complex Multiverse level (Comparable to his durability.
      A weaker clone of his restrained Barry and Hal. His clone was able to harm Superman,
      however, it is likely it could have been magic that did the most damage. Considered
      the most powerful being in the Galaxy, putting him above the likes of Lanterns
      and Superman), higher with Absorption (Can grow even more powerful after absorbing
      more energy5-D), Large Planet level (He can push planets into the sun, destroying
      the entire solar system as a chain reaction, usually attacking their biggest
      planet) to Low Complex Multiverse level with Preparation and Technology (His
      mechanical minions, Mechanix, are capable of battling and overpowering the likes
      of Superman and Green Lantern5-D) | Varies, up to Low Complex Multiverse level
      (At his weakest, was capable of defeating Maxima and harmed Superman (Pre-Death
      era). Also beat Martian ManhunterJustice League America Vol 1 65. Upon his return,
      when he was weakened once again, he was able to overpower Firestorm and Dr Light.
      After absorbing just one star, he easily overpowered John's forcefield, held
      back Icon, who was capable of harming Superman (Post-Eradicator Absorption),
      claiming he has never been hit as hardJustice League of America Vol 2 28. Even
      at this state, claimed he was more powerful than the Sun Eater. Despite his
      energies being sucked out of him, he was too much for John/GL5-D), likely far
      higher with Absorption and at his peak (Grows more powerful with Absorption.
      Has limitless absorption capability, and if left unchecked, would become the
      most powerful being in the universe. After absorbing a single star, he killed
      someone who was holding the entire universe togetherJustice League of America
      Vol 2 33 and had merged two universes not too long before that. Starbreaker's
      plan was to use Zeta Beam to transform the entire universe into energy and absorb
      it, becoming it. Was going to absorb stars to end the universe. Claimed to be
      able to end the universe, including being able to affect histories and futures.
      Considered the most powerful being according to intelligence gathered by Rann.
      Was going to end the multiverse. Can end all things)
    source_ids:
