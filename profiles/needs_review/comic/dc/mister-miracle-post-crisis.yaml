    - field: weaknesses
      value: 'Darkseid is vulnerable to Radion, which is a lethal substance to New
        Gods., Omega Effect: Uxas was reborn as Darkseid when he absorbed the full
        power of the Omega Effect from the Infinity Pit. Thanks to the Omega energies
        he gained incredible power and a wide array of abilities., Omega Beams: Darkseid''s
        signature technique involves firing a thin, red energy beam from each eye.
        These beams, also known as "Finder Beams", are extremely fast and home in
        on their target, passing through physical barriers if needed. Once contact
        is made, they can either erase the target from existence, or transport them
        through time and space according to Darkseid''s will. He can also use them
        to recreate dead beings, or paralyze his target while probing their weakness.,
        Omega Sanction: Also known as the Life Trap, the Omega Sanction can take two
        completely different forms depending on Darkseid''s intent. The first simply
        sends his target back in time, forcing them to live out their life in the
        past. The second, stated by Grant Morrison to happen when Darkseid decides
        on being crueler than normal, was only displayed by Godhead Darkseid. It traps
        the victim in a never-ending series of horrible realities that force them
        to live out worse and worse lives, until their soul breaks., Energy Absorption:
        Darkseid is an immensely powerful energy absorber, capable of completely draining
        the energies of powerful beings like Mordru and all of Sorcerers'' World to
        help restore his own power. His absorption is so powerful that he ordered
        his servants to get away from him lest they be killed, and some of his servants
        were capable of taking on Pre-Crisis Kryptonians and Daxamites., Energy Shockwaves:
        Darkseid can create shockwaves of energy by raising his hands., Spacetime
        Warping: Darkseid can generate a gravitational pull so intense that space
        twists and time is pulled, so that those inside live days between seconds.,
        Boom Tubes: Darkseid can summon boom tubes at will, as well as control the
        paths of others'' boom tubes. These portals can transport their user throughout
        space and between dimensions. They automatically adjust the size of their
        user to be suitable for their destination, which is why Darkseid appears human-sized
        rather than star-sized when travelling to the mortal universe., Telepathy:
        Darkseid has incredibly powerful telepathic abilities. He can forcefully drain
        information out of his target''s mind as well as control others with his will.
        While in a weakened state during the Great Darkness Saga, he controlled three
        billion Daxamites at once. He was able to force his mind into others'' from
        across dimensional gaps., Avatars: Darkseid can create duplicate bodies from
        portions of his energy that can function autonomously. They are significantly
        weaker than his real body but otherwise seem to retain his intellect and abilities.
        As all instances of Darkseid seen in lower-dimensional realms are infinitesimally
        small parts of Darkseid''s true being, it stands to reason that Godhead Darkseid
        possesses all of the abilities demonstrated by them but to a much greater
        degree. Furthermore, he also possessed the Anti-Life Equation, using it to
        dominate much of Earth''s populace in the moments before everything would
        be destroyed., Omega Beams: A single use of the Omega Beams, used when Darkseid
        was dying and possessing the body of a cancer-ridden Dan Turpin, contained
