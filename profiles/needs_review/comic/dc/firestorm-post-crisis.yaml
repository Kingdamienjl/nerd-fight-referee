    - field: attack_potency
      value: "Universe level+ (Post-Crisis Superman's fight with Golden Age Superman\
        \ rewrote timelines and shattered a space-time continuum. It was repeatedly\
        \ stated that they would destroy each others\u2019 universes and then eventually\
        \ they started shattering the universe again, and they were again shown rewriting\
        \ timelines. The DC Comics website confirms that the two were shaking the\
        \ space-time continuum apart. Superman punched back Orion and fought on par\
        \ with him on another occasion, who tanked a weapon capable of annihilating\
        \ the universe, as well as having one fifth the power of a Big Bang. Superman's\
        \ heat vision made up one fourth of the power capable of creating a universe\
        \ and causing the defeat of Hal Jordan, who was going to create a new universe,\
        \ and the attack caused a Big Bang to occur. Superman has fought Brainiac\
        \ 13 on three different occasions, who can ravage timelines and rewrite the\
        \ universe. Post-Crisis Superman defeated Superboy-Prime alongside Golden\
        \ Age Superman, who can withstand a Big Bang, and who was considered on par\
        \ with the Silver Age Anti-Monitor, who was going to consume the universe\
        \ and was defeated by Golden Age Superman and Superboy-Prime even after absorbing\
        \ all energy from the antimatter universe and using it to fight them. Post-Crisis\
        \ Superman was shown earlier to stalemate Golden Age Superman, who stalemated\
        \ Silver Age Superman, who caused a universe to be created following the death\
        \ of Maaldor, tanked the Big Bang, bursted through the bounds of infinity,\
        \ shattered the barriers of space and time casually while flying, delivered\
        \ a blow greater than any force in the universe, and fought against Blackstarr,\
        \ a woman capable of destroying the universe and attacking him with the gravitational\
        \ force of the whole universe, who also has absolute control over all aspects\
        \ of the cosmos and all forces that created the universe. Superman is stronger\
        \ than Doctor Sivana, who had the power of Shazam, who fought and stalemated\
        \ the Invincible Man for several hours, who wields the power of the Big Bang.\
        \ Superman fought against Nebula Man, who is a universe. Superman fought 30th\
        \ century Mordru who had all of the magical power of a universe. Superman\
        \ fought the Time Trapper, who is a sentient timeline capable of shattering\
        \ timelines. Superman fought Monarch, whose quantum power is like the Big\
        \ Bang, and whose fight with Captain Atom was twisting space and time and\
        \ causing compressed universes to explode. Captain Atom has destroyed and\
        \ recreated the universe and can freely control it, and was going to destroy\
        \ several universes, and oneshotted Jenny Quantum, who created a universe,\
        \ tear apart a reality, contain a universe with her powers, and annihilated\
        \ the Doctor, who can create a universe, and yet is weaker than Superman.\
        \ Superman survived an encounter with a tesseract swarm. Superman defeats\
        \ Black Adam, who survived a tesseract expanding in his head. Superman stalemates\
        \ amped Shazam right after fighting Black Adam, who tanked a tesseract bomb\
        \ in his base. Superman tanked a punch from Icon, who killed Starbreaker,\
        \ who killed someone who was holding the universe together. Superman fights\
        \ Wonder Woman on multiple occasions, and even killed her once, who can recreate\
        \ the timeline with her Lasso of Truth, can fight the Queen of Fables, who\
        \ is an extra-dimensional embodiment of evil folklore, and can withstand attacks\
        \ from 4-D when she's utilising four-dimensional energy. Superman fought the\
        \ Red King, who can reshape the universe and destroy possibilities containing\
        \ universes one by one, as well as having created the universe with his dreams.\
        \ Superman fought Imperiex probes for several days, who can individually fight\
        \ against and mortally wound Aquaman, who was causing the universe to collapse\
        \ on itself. Superman fought and overwhelmed the Kryptonian God Cythonna,\
        \ who warred for a long time against the Kryptonian God Rao, who created the\
        \ universe. Superman pushed through the barriers of space and time, and then\
        \ defeated the embodiment of his own Death, who caused the universe to compress\
        \ on Superman, only for him to overcome it. Superman tanked Aztek's self-destruction\
        \ of four-dimensional energy. Superman can withstand attacks from and damage\
        \ the Lord of Time, who is four-dimensional. Superman tanks attacks from Firestorm,\
        \ who has the power of a Big Bang. Superman has overwhelmed Kyle Rayner on\
        \ multiple occasions, who defeated an aberration that was breaking down the\
        \ laws of space and time and the universe, remaking it into a world devoid\
