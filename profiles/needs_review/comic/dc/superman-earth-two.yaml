  axis: weakness
  text: 'Kryptonite, Red Suns, Magic Notes: *Before making any changes to this page,
    please read and follow the Power-scaling Rules for Marvel and DC Comics. *The
    reason why Justice League of America Issue #73 is listed as Superman''s retroactive
    debut, is because of his universe being written out as an alternate reality of
    the main DC universe Earth-One, making Pre-Crisis Superman be the character that
    started his debut on Action Comics #1, but by only following the general narrative
    of the comic book story.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d8557b63
  section: abilities
  axis: hax
  text: Originally only Superhuman Physical Characteristics. By the end of the Golden
    Age he had basically all his known powers, such as Flight, Self-Sustenance (Type
    1), Time Travel, Regeneration (At least Mid-Low; scales to his Post-Crisis counterpart),
    Telescopic Vision, Microscopic Vision, X-Ray Vision, Heat Vision, and Freeze Breath.
    In addition, his powers include Mind Manipulation (Can telepathically control
    opponents with his will and hypnotize opponents), Photographic Memory (Demonstrated
    here), Limited Shapeshifting (Can alter his features and size to a certain extent),
    Minor Body Control (Can temporarily stop his heart), Pressure Points (Knocked
    a man out for hours with a precise nerve strike), Construction (Built a ship in
    minutes; built a giant, self-supporting underground city in seconds), Heat Manipulation
    (His X-ray vision produces heat capable of melting bullets), Intimidation(Seen
    here), Underground Mobility (As shown here.Superman Vol 1 46), Automatic Translation
    (Could understand a mermaid's language), Limited Air Manipulation via Super Breath
    (Blew out a star), Limited Vibration Manipulation (Destroyed a building by singing
    to match its resonance frequency), Limited Sound Manipulation (Projected his voice
