    - field: weaknesses
      value: 'If he says his own name backwards, it will forcefully shun him back
        to his original dimension. He cannot return within 90 days. In addition, as
        a wish maker, he always likes to play by the rules. Lois Lane forced him to
        turn himself 3-Dimensional and seal himself within a concrete and lost his
        powers. He is rather gullible and has a bit of ego, which often leads to him
        being outwitted by Superman and his cast. | Same as before. In addition, he
        has been outsmarted by even Krypto. Whatever he does in the lower worlds often
        wears off once he leaves for his own dimension. Even if a recording of his
        name backward is played, he gets sent to his own dimension. It is likely,
        his voice is the key to his powers. | He appears to lack the former weaknesses.
        Saying his name backwards no longer shuns him to the Fifth Dimension and returning
        to his home dimension no longer reverts the changes he made to the lower ones,
        instead he does it by himself. However, he does like to play games. So, if
        he loses - any game - he will return to his dimension willingly and stay there
        for a period of time. He never lies and always keeps his word. However, the
        lying part was rectified later on after he learned from his mistakes. Negative
        Space nulls his powers. Notes: *While the versions of Mister Mxyzptlk are
        essentially the same, there are some distinct differences between them. Especially
        between the modern and the original version. While there might be slight differences,
        he is overall the same person, and powers and abilities of his are the same
        across his incarnations. *Reason for his varied'
