    - field: durability
      value: Small Building level+ (Bruce was not only trained in various disciplines
        but also ingrained with the vital skill of safeguarding his own body, treating
        self-protection as seriously as any other form of training. This meticulous
        conditioning allows him to endure injuries that would cripple or kill ordinary
        humans. Even with his suit nearly destroyed, [https://imgur.com/a/3q5ZN he
        survived multiple falls after being beaten nearly to death] by Bane. He has
        withstood blows from superhuman opponents such as Clayface on unprotected
        areas like [https://imgur.com/a/c34GO his jaw] and endured severe internal
        damage while continuing to fight. Despite heavy blood loss and exhaustion,
        Batman routinely [https://imgur.com/a/TymcdJX pushes himself to keep fighting
        until his body gives out]. His endurance further extends to resisting explosions
        and extreme impacts; the Batsuit itself greatly enhances his survivability.
        It has withstood [https://imgur.com/a/FEWkqjM massive blasts and collapsing
        debris], [https://imgur.com/a/sb09n6s explosions that obliterate several floors
        of a building], and [https://imgur.com/a/o1ovvDM direct RPG detonations].
        Even without armor, Bruce's conditioning allows him to take bone-shattering
        impacts and remain functional.)
