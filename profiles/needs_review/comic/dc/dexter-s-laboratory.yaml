    - field: intelligence
      value: "At least Extraordinary Genius (Dexter has built many extremely advanced\
        \ and even reality warping inventions. He was stated by an alien in Go Dexter\
        \ Family Go to have the most intelligent mind in the universe. In Critical\
        \ Gas, Dexter ended all war, repaired the ozone layer, solved world hunger,\
        \ built a bowling alley, and proved existence of life on other planets all\
        \ in less than half an hour. He made mankind go from literal primitives to\
        \ a perfect utopia in Ego Trip and is capable of creating a giant potato that\
        \ he launched into space to serve as a power source for his laboratory in\
        \ Tuber Time. He is also incredibly skilled in various forms of unarmed combat,\
        \ being a quick thinker, adapter and strategist even in the most dire fights,\
        \ such as in Smells Like Victory, where he singlehandedly defeated the entire\
        \ U.S. Army in his underwear while wielding nothing more than a cleanser bottle.\
        \ When Dexter was born, he was already capable of speaking coherently, walking\
        \ and inventing, and numerous doctors declared him a genius, amazed at his\
        \ intelligence. In Dyno-Might, his intelligence was relied upon by the iconic\
        \ Hanna-Barbera superhero, Blue Falcon, who stated Dexter was the only one\
        \ who could help him repair his sidekick, Dynomutt. However, he is somewhat\
        \ na\xEFve and lacks common sense in some areas. He did not know what clowns,\
        \ chickenpox, or whack-a-moles were)"
      source_id: mediawiki-4487
      provider_id: vsbattles
      authority: high
      confidence: 0.75
