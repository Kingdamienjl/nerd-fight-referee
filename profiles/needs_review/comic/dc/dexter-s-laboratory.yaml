    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Martial Arts (He is proficient in
        karate, and in Smells Like Victory, he was extremely capable of defeating
        the entire U.S. Army barehanded, wielding nothing more than a cleanser bottle),
        Genius Intelligence, Preparation, Toon Force, Limited Attack Reflection with
        his wrench and his glasses (His glasses could deflect lasers), Vehicular Mastery,
        Weapon Mastery (Can utilize his inventions and a wrench), Social Influencing,
        Charisma - Befriended the US Army and its general after a misunderstanding
        involving him being an alien, he made the entire student body fall in love
        with him, received a perfect score in math class, caused a group of bloodlusted
        bullies to leave him alone, and became a worldwide celebrity just by saying
        "omelette du fromage"., Leadership - Served as an ambassador to other alien
        species., Self-Sustenance (Type 2 & 3. Dug for years to get out of Mandark's
        Tower), Immortality (Types 2 and 3) and Regeneration (High-Mid, was still
        alive after being reduced to, and regenerated from, a pile of dust and his
        eyes/glasses in School Girl Crushed), Enhanced Senses (Able to view spirits
        and Koosalagoopagoop when Dee Dee is the only one who should be able to see
        him), Fourth Wall Awareness (Acknowledged the "THE END" card when he wasn't
        finished speaking. The audience helped him find his remote and he later asked
        them to help him down), possibly Empowerment (Dee Dee implies that Saturn's
        rays give Dexter's scientific abilities a boost, as he is a Capricorn), Non-Physical
        Interaction (Was able to plunge Dee Dee's spirit out), Hacking (Rebuilt and
        reprogrammed Mandark's robot army with his bare hands), Photographic Memory
        (Able to see Mandark's fighting techniques like pictures in his head and connect
        them to the comic book they were based on), Magic (Has shown the capability
        to use magic, but refused to believe in it at the time), Plot Manipulation
        (Can edit Dee Dee out of the panel), Negation to Subjective Reality (Was able
        to "imagine away" someone else's imaginary friend)
      source_id: mediawiki-4487
      provider_id: vsbattles
      authority: high
