    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting\
        \ Strength, and Durability), Flight (Can use her wings to fly at tremendous\
        \ speeds, and demonstrates great expertise in flight - such as weaving between\
        \ laser blasts from the Martian Killers, evading a pursuing spaceship, dancing\
        \ around WW2-era fighter planes, avoiding falling debris while flying out\
        \ of a collapsing cavern, etc. Dwayne McDuffie, one of JLU\u2019s head writers,\
        \ went as far as to call Hawkgirl a \u201Cworld-class aerial combatant\u201D\
        ), Genius Intelligence (See Intelligence), Superhuman Athleticism (Leapt to\
        \ the top of a small flight of stairs from a standing position), Hand-to-Hand\
        \ Combat Mastery (Was one of the foremost warriors on Thanagar, a belligerent\
        \ world, with Dwayne McDuffie referring to Shayera as having undergone \u201C\
        the Thanagarian equivalent of Navy Seal training.\u201D Was able to hold her\
        \ own against the extremely skilled Wonder Woman despite a notable strength\
        \ gap by utilizing her combat expertise during \"Grudge Match.\" Beat up highly\
        \ trained Green Lanterns without using her mace. Countered blows from and\
        \ smacked away Tsukuri, a mercenary with presumable CQC training. Was able\
        \ to competently fight with her hands bound), Weapon Mastery (with her Mace,\
        \ which she used with such great proficiency that she rose to a high rank\
        \ in Thanagar's military, and she was capable of holding her own in weapon\
        \ combat against Tsukuri, a swordswoman with great enough mastery that Aresia\
        \ specifically hired her as an enforcer and stopping a mace strike an inch\
        \ from someone's face. Her signature moves with her mace are throwing it for\
        \ a long-range attack and spinning it to block attacks), Acrobatics (Did flips\
        \ to recover from attacks during \"Grudge Match\" as well as to recover from\
        \ a kick from Grodd during \"Secret Society\" and evade an explosion in \"\
        Hunter's Moon\"), Attack Reflection (Redirected Doctor Fate\u2019s beam with\
        \ her mace. Sent Mongul's cannon beam back into the cannon from which it came),\
        \ Electricity Manipulation (Can electrocute foes as powerful as Doomsday with\
        \ her Mace, and its charge can be lowered so that it functions as a defibrillator.\
        \ Her Justice Lord counterpart's mace could absorb electricity into itself),\
        \ Energy Projection (In later appearances, is shown firing beams of electricity\
        \ from her Mace), Shockwave Creation (Her mace strikes create shockwaves with\
        \ their sheer impact), Stealth Mastery (Snuck up on a mind-controlled Green\
        \ Lantern), Vehicular Mastery (with a Javelin, and spaceships in general -\
        \ one of her most notable feats is casually out-dogfighting Kanjar Ro, an\
        \ experienced spacefarer, as well as avoiding Star Sapphire's energy beams),\
        \ Limited Teleportation (Can request to be recalled to the JLU Watchtower),\
        \ Negation of Intangibility (Her Mace's Nth Metal interferes with dimensional\
        \ shifting), Negation of all Magic (Nth Metal, the material which makes up\
        \ her mace, naturally negates all magic, regardless of potency), Indomitable\
        \ Will/, Resistance to Mind Manipulation (Resisted Despero's mental powers\
        \ with no aftereffects during \"Hearts and Minds\", which with a similar amount\
        \ of exposure took control of Katma Tui, a Green Lantern. However, powerful\
        \ enough Mind Manipulation can take her over, such as the extremely potent\
        \ Heart of Darkness during \"Eclipsed\") *Resistance to Mind Reading (As a\
        \ Thanagarian Soldier, has a mental block in place that makes Martian Manhunter\
        \ incapable of reading her mind, at least not without pulling out all the\
        \ stops) *Resistance to Extreme Heat (Was unhurt by being caught in this fiery\
        \ explosion as well as this explosion. Being struck by flaming skeletons didn't\
        \ affect her)"
      source_id: character-stats-profiles-hawkgirl-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: At least Small Building Level physically (Upscaling from 0.095 Tons -
        Knocked Copperhead out in a single punch, with Copperhead being strong enough
        to down Batman temporarily with a kick. Struggled evenly with Gorilla Grodd,
        who easily stomped Lex Luthor in a fistfight. Fought and knocked out gorillas
        with just her legs. Punched Arkkis Chummuck across a bar, sending him through
        a wall. Ragdolled a scavenger with a kick), possibly far higher (Staggered
        Wonder Woman with a kick), Brown Dwarf Level with her Mace (Downscaling from
        1.002 Quettatons - Redirected a beam that had the power to destroy a planet
        - see Note 2. Though certainly weaker than her teammates, with her mace she
        can still somewhat hold her own against enemies like a bloodlusted, mind-controlled
        Wonder Woman ("Grudge Match"), Star Sapphire ("Injustice for All"), Sinestro
        ("Secret Society"), a Lexo-suit wearing Lex Luthor ("Tabula Rasa"), Queen
        ("Wild Cards"), one of Lexiac's robots ("Divided We Fall"), etc. In addition,
        she could, despite not leaving any overt damage, cause Lobo a bit of pain
        with a mace strike to the top of his head, just barely divert attacks from
        Lexiac's tentacles and over the course of several attacks, manage to destroy
        one of them (these tentacles being capable of temporarily restraining a struggling
        Wonder Woman and Martian Manhunter), knock over (though not actually damage)
        Darkseid with a mace strike, divert a strike from Luthor's mech, which one-shot
        her and thus should scale to her durability - in summary, she's certainly
        weaker than her League teammates (other than Batman), but not to such a great
        extent that she wouldn't share the High 6-A to 5-B scaling that they have
        (that is to say, she isn't a hundred or a thousand times weaker than them),
        independent of her planet-busting-cannon feat. During their bar fight midway
        through "In Blackest Night," she's strongly implied to be at least somewhat
        comparable to fodder Green Lanterns such as Gallius Zed and Arkkis Chummuck,
        whom she was confident in taking on, even with their rings. One-shot a huge
        sea monster. Can smash Brainiac drones. Destroyed Imperium army ships with
        single attacks. Sent Grundy through a city street and into the sewer below.
        Tore through Vandal Savage's heavy gun. Her lower-ends (such as doing less
        damage to a robot than machine guns) are noted, but less consistent than higher
        ends and thus treated as outliers. See here for my reasoning as to why DCAU
        Superman is not Low Complex Multiversal), higher with Spinning Mace Throw
        (Upscaling from 1.002 Quettatons - Her thrown mace, after she spun it, broke
        the Lexo-suit's outer armor despite the fact that her normal swings couldn't
        so much as dent the suit)
      source_id: character-stats-profiles-hawkgirl-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ combat speed and reactions (Scaling to 0.53c - Scales to
        many feats of characters reacting to, dodging and deflecting lantern beams
        (which move at the Speed of Light), such as keeping up with and parried attacks
        from a bloodlusted Wonder Woman, who moved this fast whilst deflecting Lantern
        Beams. Can keep pace with Hro Talak, who could react to and deflect Lantern
        Beams at close range after they were fired, as well as very consistently tag
        Shadow Thief, who could dodge lantern beams after they were fired. Speaking
        of her scaling to Wonder Woman's combat speed, the amazing Amazon was able
        to deflect both laser beams from Imperium Army Rifles as well as block Laser
        Beams from an Imperium army ship. Should be somewhat comparable in speed to
        Static, who reacted to and blocked a light-based laser after it was fired
