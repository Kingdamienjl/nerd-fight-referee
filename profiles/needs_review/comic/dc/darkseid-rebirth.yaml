        full power, only being encountered in what Grant Morrison referred to as a
        "Projection." In reality, the New Gods entirely dwarf all of the universes
        of the Orrery of Worlds in size, and are shrunk down by Boomtubes when entering
        a universe. Likewise, characters like Superman are grown to the scale of the
        New Gods when they enter Apokolips or New Genesis. In this state, Darkseid
        is shown to be comparable to Post-Crisis Superman, albeit slightly weaker,
        as he has been defeated by Superman multiple times and was thoroughly defeated
        by Doomsday. Comparable to Pre-Crisis Superman, as Darkseid was unaffected
        by the Crisis on Infinite Earths) | Outerverse level (The New Gods entirely
        dwarf all of the universes of the Orrery of Worlds in size. In Final Crisis,
        Darkseid's true power was encountered for the very first time, where Darkseid's
        shadow covered the Multiverse and severely damaged the Orrery of Worlds. Darkseid's
        Darkseid exists in the Sphere of the Gods, a higher dimensional space beyond
        the regular multiverse. Batman described the New Gods as "Incredibly powerful
        living ideas from a kind of platonic, archetypal world.") | Solar System level
        (Following the death of his Godhead in Final Crisis, Darkseid's essence was
        fragmented across the multiverse into "Emanations." His New 52 Emanation was
        greatly diminished from his original power, but was nonetheless vastly superior
        to the New 52 incarnation of Superman and the rest of the Justice League)
        | Multiverse level+ (After killing Zeus, Darkseid restored his godhood and
