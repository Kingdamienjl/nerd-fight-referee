        tactics, governing, and scientific pursuit. He regularly draws chess matches
        against Eclipso, a cosmic entity and former embodiment of God's Wrath, and
        built a spaceship larger than the state of New York. Darkseid is responsible
        for some of the most advanced scientific breakthroughs in the DCU, creating
        technology capable of penetrating the Source, accessing the realm of Anti-Life,
        stealing part of the Anti-Life Entity's power, combining and manipulating
        fragments of the Anti-Life Equation, and turning Mars into a copy of Apokolips.
        His mind is also extremely adaptable, capable of comprehending the warped
        dimension of Olympus without any effort, while Superman was completely bewildered
        by it. The Pre-Flashpoint emanation of Darkseid even remembers events from
        erased timelines)
