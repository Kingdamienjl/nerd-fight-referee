        happening in Apokolips while trapped in the Promethean Galaxy for several
        millenia), Energy Manipulation, Non-Physical Interaction, Spatial Manipulation
        (Caused space to loop around to make Desaad return to his throne room even
        as he attempted to run away from it), Time Manipulation, Power Nullification
        (Interfered with Darkseid''s Omega Effect while in the Promethean Galaxy,
        and later took away all of his powers. Severed the New Gods'' connection to
        the Source, rendering much of their powers and technology useless), Death
        Manipulation (Desaad stated that Yuga Khan had the power to kill him so irrevocably
        that not even Darkseid would be able to bring him back to life), Large Size
