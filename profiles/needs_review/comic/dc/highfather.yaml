        * Immortality (Type 1, 4 - When gods die, they return to the Source, but sometimes
        have the power to escape it and return to life. Type 9 - the true Highfather
        exists in a higher plane of existence) * Self-Sustenance (Type 1) * Extrasensory
        Perception (Can sense targets throughout time and space) * Stealth Mastery
        (Prevented a Mother Box from detecting him) * Matter Manipulation (Turned
        Lightray into slime and threatened to scatter him across the sky as stardust;
        Reconstructed Barda''s cooking) * Energy Manipulation (Can manipulate energy
        around himself, even freezing Darkseid''s Omega Beams; Restored Wildfire from
        being dissipated in quanta) * Energy Projection (Can fire energy blasts on
        a massive scale) * Energy Absorption (Can drain energy out of targets) * Homing
        Attack (Can split his attacks into multiple parts to seek out targets) * Forcefield
        Creation (Made a large cone of protective light and a spherical barrier around
        himself) * Spatial Manipulation (Fused Apokolips and New Genesis so that they
        were spatially warped together) * Life Manipulation (Drew out latent strength
        from Beautiful Dreamer''s soul to help her in childbirth) * Creation (Made
        toys for children) * Teleportation and Dimensional Travel (His Wonder Staff
        can achieve teleportation without a boom tube, and he can summon boom tubes
        without a Mother Box) * BFR (Banished Parademons) * Time Travel (Orion stated
        that any god can easily move through time) * Summoning (His Alpha Bullets
        can summon anyone to him, even across time and dimensions; Can also intercept
        other teleportation beams) * Pocket Reality Manipulation (Began spinning Orion
        into a cosmos of torment) * Intangibility (Can phase through solid matter)
        * Telekinesis (Took the Black Racer''s ski pole from Scott Free) * Telepathy
        (Can link minds together using Source energy and instantly read minds with
        a touch) * Memory Manipulation (Can remove memories and implant fake ones)
        * Biological Manipulation (Restored the people of Scott Free''s neighborhood
        from being devolved into beasts) * Sound Manipulation (Can howl forcefully
        enough to shake the cosmos) * Technology Manipulation (His Wonder Staff can
        interact with basic technology) * Water Manipulation (Can use water to view
        faraway events) * Shapeshifting (Can alter his and others'' appearances) *
        Astral Projection (Can make large projections across interdimensional distances)
        * Perception Manipulation (Cloaked himself from detection) * Healing (Can
