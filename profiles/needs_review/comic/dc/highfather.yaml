- id: claim-weaknesses-5d2ebd3d
  section: weaknesses
  axis: weakness
  text: "Highfather is vulnerable to radion, a lethal substance to New Gods. It should\
    \ be noted, however, that powerful New Gods like Kalibak are able to easily survive\
    \ normal radion shots Notable Attacks/Techniques: |-|Pre-Flashpoint Emanation=\
    \ Alpha Effect: Highfather's innate power is heavily implied to be the same as\
    \ Scott Free's, the opposite to Darkseid's Omega Effect. However, he has only\
    \ shown one ability that can be specifically attributed to this power. * Alpha\
    \ Bullets: A similar-looking ability to Darkseid's Omega Beams, Highfather uses\
    \ this power to summon targets to him rather than banish them away, as the Omega\
    \ Beams do. Source Energies: Highfather possesses an innate connection to the\
    \ Source through his Wonder Staff. He is never without the staff, and uses it\
    \ to access an enormous variety of abilities. |-|Post-Flashpoint Emanation= Highfather's\
    \ Post-Flashpoint emanation lacks a huge amount of the variety of his Pre-Flashpoint\
    \ emanation. He has no connection to the Source, and relies on boom tubes to teleport.\
    \ |-|Godhead= As all instances of Highfather seen in lower realms are tiny facets\
    \ of Highfather's true being, it stands to reason that Godhead Highfather possesses\
    \ all of the abilities demonstrated by them but to a much greater degree. Notes:\
    \ *Before making any changes to this page, please read and follow the Power-scaling\
    \ Rules for Marvel and DC Comics. *\"Avatar\" is a term specifically referring\
    \ to an ability demonstrated by Pre-Flashpoint Darkseid and Highfather, and it\
    \ was never stated that the lesser versions of New Gods were specifically created\
    \ by them to interact with lower planes of reality. The term used by Grant Morrison\
    \ to refer to these lower aspects of the New Gods is \"emanation\". *Like other\
    \ New Gods, the Pre-Flashpoint emanation of Orion was unaffected by Crisis on\
    \ Infinite Earths, as the Fourth World universe was not destroyed and recreated.\
    \ *The Post-Flashpoint emanations of New Gods have very different histories, power-sets,\
    \ and power levels than the Pre-Flashpoint emanations. * While Highfather has\
    \ a similar connection to the Source and more experience with it compared to Takion,\
    \ as well as the latter being described as a avatar of his power, certain abilities\
    \ of Takion\u2019s are exclusive to him. Thus, while Highfather likely has many\
    \ of his powers, they have not been listed here due to lack of information. ==Notable\
