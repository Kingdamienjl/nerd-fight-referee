- id: claim-powers-and-abilities-c022dadb
  section: abilities
  axis: hax
  text: 'Pre-Flashpoint Emanation= * New God Physiology * Superhuman Physical Characteristics
    * Genius Intelligence * Weapon Mastery and Martial Arts (As Izaya, was a master
    of weaponry and a "superb" hand-to-hand combatant) * Flight * Immortality (Type
    1, 4 - When gods die, they return to the Source, but sometimes have the power
    to escape it and return to life. Type 9 - the true Highfather exists in a higher
    plane of existence) * Self-Sustenance (Type 1) * Extrasensory Perception (Can
    sense targets throughout time and space) * Stealth Mastery (Prevented a Mother
    Box from detecting him) * Matter Manipulation (Turned Lightray into slime and
    threatened to scatter him across the sky as stardust; Reconstructed Barda''s cooking)
    * Energy Manipulation (Can manipulate energy around himself, even freezing Darkseid''s
    Omega Beams; Restored Wildfire from being dissipated in quanta) * Energy Projection
    (Can fire energy blasts on a massive scale) * Energy Absorption (Can drain energy
    out of targets) * Homing Attack (Can split his attacks into multiple parts to
    seek out targets) * Forcefield Creation (Made a large cone of protective light
    and a spherical barrier around himself) * Spatial Manipulation (Fused Apokolips
    and New Genesis so that they were spatially warped together) * Life Manipulation
    (Drew out latent strength from Beautiful Dreamer''s soul to help her in childbirth)
    * Creation (Made toys for children) * Teleportation and Dimensional Travel (His
    Wonder Staff can achieve teleportation without a boom tube, and he can summon
    boom tubes without a Mother Box) * BFR (Banished Parademons) * Time Travel (Orion
    stated that any god can easily move through time) * Summoning (His Alpha Bullets
    can summon anyone to him, even across time and dimensions; Can also intercept
    other teleportation beams) * Pocket Reality Manipulation (Began spinning Orion
    into a cosmos of torment) * Intangibility (Can phase through solid matter) * Telekinesis
    (Took the Black Racer''s ski pole from Scott Free) * Telepathy (Can link minds
    together using Source energy and instantly read minds with a touch) * Memory Manipulation
    (Can remove memories and implant fake ones) * Biological Manipulation (Restored
    the people of Scott Free''s neighborhood from being devolved into beasts) * Sound
    Manipulation (Can howl forcefully enough to shake the cosmos) * Technology Manipulation
    (His Wonder Staff can interact with basic technology) * Water Manipulation (Can
    use water to view faraway events) * Shapeshifting (Can alter his and others''
    appearances) * Astral Projection (Can make large projections across interdimensional
    distances) * Perception Manipulation (Cloaked himself from detection) * Healing
    (Can channel Source energy to heal others) * Avatar Creation (Made an avatar,
    similarly to Darkseid, while he was trapped in the Source Wall) * Statistics Amplification
    (Can channel the mystic force of New Genesis to increase the power of his blasts)
    * Sealing (Used the "core of his omnipotence" to seal off the god asylum) * Power
    Bestowal (Passed his power to Atinai to help her construct Supertown and restored
    Bouncing Boy''s powers after Darkseid removed them) * Power Modification (While
    weakened, made Pre-Crisis Superboy and Supergirl able to ignore red solar radiation)
    * Fusionism (Fused himself and four others into The One) * Resurrection (The Alpha
    Effect can be used to revive the dead) * Conceptual Manipulation (Type 1 - Scott
    Free used the Alpha Effect to depower and banish the Black Racer) Resistance to:
    * Corruption (While heavily weakened, instantly restored Darkseid''s corrupted
    Orion clone to normal) * Disease Manipulation (Can shield himself from a god-killing
    plague) * Telepathy (Martian Manhunter stated New Gods are hard to touch telepathically)
    * Extreme Cold and Cosmic Radiation (Can fly unharmed in space) |-|Post-Flashpoint
    Emanation= * New God Physiology * Superhuman Physical Characteristics * Genius
    Intelligence * Extrasensory Perception (Should possess the same 18 divine senses
    Darkseid does) * Immortality (Type 1) * Self-Sustenance (Types 1 and 2) * Flight
    * Energy Manipulation (Bound Wonder Woman''s hands with energy and channeled White
    Lantern Kyle''s reality warping wave away) * Energy Projection (Can fire blasts
    from his staff) * Danmaku * Portal Creation and Dimensional Travel (Can summon
    boom tubes) * BFR (Banished the Templar Guardians with a boom tube) * Astral Projection
    Resistance to: * Disease Manipulation (New God physiology makes them immune to
    disease) * Reality Warping (Walked unharmed through White Lantern Kyle''s reality
    warping wave) * Extreme Cold and Cosmic Radiation (Can fly unharmed in space)
    |-|Godhead= All previous abilities to a much greater degree, plus: * Abstract
    Existence (Type 1 - New Gods are living ideas from a platonic, archetypal world)
    * Self-Sustenance (Type 3) * Incorporeality * Large Size (Type 9 - Comparable
    in size to Godhead Darkseid)'
  source_ids: *id005
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
