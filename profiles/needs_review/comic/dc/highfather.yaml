- id: claim-powers-and-abilities-c022dadb
  section: abilities
  axis: hax
  text: 'Pre-Flashpoint Emanation= * New God Physiology * Superhuman Physical Characteristics
    * Genius Intelligence * Weapon Mastery and Martial Arts (As Izaya, was a master
    of weaponry and a "superb" hand-to-hand combatant) * Flight * Immortality (Type
    1, 4 - When gods die, they return to the Source, but sometimes have the power
    to escape it and return to life. Type 9 - the true Highfather exists in a higher
    plane of existence) * Self-Sustenance (Type 1) * Extrasensory Perception (Can
    sense targets throughout time and space) * Stealth Mastery (Prevented a Mother
    Box from detecting him) * Matter Manipulation (Turned Lightray into slime and
    threatened to scatter him across the sky as stardust; Reconstructed Barda''s cooking)
    * Energy Manipulation (Can manipulate energy around himself, even freezing Darkseid''s
    Omega Beams; Restored Wildfire from being dissipated in quanta) * Energy Projection
    (Can fire energy blasts on a massive scale) * Energy Absorption (Can drain energy
    out of targets) * Homing Attack (Can split his attacks into multiple parts to
