        \ as well as allowing vast control over selective perception and focus. This\
        \ umbrella ability includes the following: ***Electromagnetic Spectrum Vision:\
        \ Superman can see well into most of the electromagnetic spectrum. He can\
        \ see and identify radio and television signals as well as all other broadcast\
        \ or transmitted frequencies. Using this ability, he can avoid detection by\
        \ radar or satellite monitoring methods. This also allows him to see the aura\
        \ generated by living thing. ***Telescopic Vision: This is the ability to\
        \ see something at a great distance, without violating the laws of physics.\
        \ Though limited, the exact extent of the ability is undetermined. In function,\
        \ it is similar to the zoom lens on a camera. ***X-Ray Vision: This is the\
        \ ability to see through any volume of matter except lead. Supermans can see\
        \ things behind a solid, opaque object as if it were not there. He can focus\
        \ this ability to \"peel back\" layers of an object, allowing hidden image\
        \ or inner workings to be observed. The exact type of energy perceived\u2014\
        such as x-rays, cosmic rays, or some other energy invisible to normal humans\u2014\
        is unclear. This ability perceives an ambient energy source though, it does\
        \ not involve the eye projecting a concentrated, possibly toxic, beam to be\
        \ reflected back from objects. ***Microscopic Vision: This is the ability\
        \ to see extremely small objects and images down to the atomic level. ***Infrared\
