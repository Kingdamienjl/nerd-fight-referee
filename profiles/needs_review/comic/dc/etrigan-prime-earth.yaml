  intelligence:
    text: Above Average for Etrigan. Despite his brutal appearance and demeanor, Etrigan
      is both an experienced fighter and a devious schemer, able to convince his fellow
      demons to rise up against Lucifer and turn Jason's life into a living hell with
      his continuous taunting. Gifted for Jason Blood, who is a very skilled magician
      with centuries of experience.
