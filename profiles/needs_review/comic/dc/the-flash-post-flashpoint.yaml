abilities:
- id: powers-and-abilities-resistance-to-absorption-broke-out-reverse-flash-attemping-
  name: Resistance to Absorption (Broke out Reverse Flash attemping to absorb him)
    and Possession (Can control spirits possessin
  description: 'Resistance to Absorption (Broke out Reverse Flash attemping to absorb
    him) and Possession (Can control spirits possessing him by vibrating) With Negative
    Speed Force, he gains the following: Enhanced Time Travel (Time travelled on multiple
    occasions without the need of the Cosmic Treadmill), Limited Power Nullification
    and Electricity Manipulation, Resistance to Plot Manipulation, Immortality Negation,
    and Existence Erasure (Should be comparable to Wally. Unaffected by Darkseid''s
    omega beams), Higher-Dimensional Manipulation (Through altering his vibrational
    frequencies and phasing), Beyond-Dimensional Physiology (By virtue of being a
    vessel of the speed force) All previous abilities, Limited Astral Projection (Can
    mentally send his consciousness into the Speed Force to check other timelines),
    Light Manipulation (Can use lightning to produce blinding amounts of light), Dimensional
    Travel, BFR (Was able to punch the Anti-Monitor into other universesDark Crisis:
    Big Bang, December 2022), Power Bestowal (Can give other''s more speed and here),
    Spatial Manipulation, Time Manipulation (Moved Time and Space a few seconds ahead
    of the Still Force. At his peak, his strongest attacks could deform space-time
    itselfDark Crisis: Big Bang, December 2022), Resistance to Mind Control (Hard
    to control by Gorilla Grodd), Mind Manipulation (Can phase to avoid Trickster''s
    mind tricks), Reality Warping, Empathic Manipulation (Kissed Iris and removed
    the effects of the Anti-Life Equation), Limited Memory Manipulation (Remembers
    Wally West and gets him from the Speed Force despite his memories of him being
    erased), Energy Manipulation, Life Manipulation, Absorption (Broke free from Turtle''s
    blast), Absolute Zero (Obstructed Captain Cold''s Absolute Zero gun) With Negative
    Speed Force, he gains the following: Aura, Damage Boost (His aura can incinerate
    bullet''s, cause explosions making contact with things, and the more punches he
    takes, the more his aura build''s up to explode his oppenent)'
  source_ids:
