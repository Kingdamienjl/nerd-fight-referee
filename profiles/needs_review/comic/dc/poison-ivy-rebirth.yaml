    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) *Genius Intelligence (See Intelligence) *Superhuman
        Athleticism and Limited Acrobatics (Almost instantly scaled a small structure
        with no effort whatsoever) *Plant Manipulation (Despite the fact that, in
        her early appearances, she only exhibited the ability to control plants she
        made herself, by the time of Batman and Harley Quinn her chlorokinetic powers
        have become so advanced that she can control even plants she has not created
        herself - this can take the form of tendril-like plants she uses to restrain
        foes, vines she uses as platforms to raise herself upward, among other things.
        Made common houseplants secrete mind-manipulating chemicals) *Paralysis Inducement
        (Frequently uses plants to wrap around and restrain things) *Poison Manipulation
        (Despite needing Poisonous Lipstick during B:TAS, by the time of TNBA her
        kisses had become "Chernobyl-level toxic." Her crossbow bolts are poison-tipped)
        *Life Creation (Created sentient plant creatures, as seen here and here) *Preparation
        (Has rigged traps to take out Batman, as shown here and here. Rigged hundreds
        of pumpkins to secrete Poison Ivy gas when lit) *Life Manipulation (With just
        a snap of her fingers, turned a stick into a living plant monster) *Weapon
        Mastery (with her Crossbow) *Hand-to-Hand Combat Skills (Is skilled in various
        forms of combat, as evidenced in her fight with Harley Quinn) *Social Influencing
        (Charisma: Seduced an Arkham Asylum orderly in order to get into close proximity
        to a plant) *Resistance to Poison Manipulation, Radiation Manipulation, and
        Disease Manipulation (Her body instantly rejects any infection, poison, or
        outside contamination, something stated by Ivy herself not once, but twice.
        Totally unaffected by The Joker''s laughing gas. Lived on a toxic waste dump
        (which she estimated would kill a normal person within ten minutes) without
        the slightest issue) With Optional Equipment, she can use: *Age Manipulation
        (A special pollen dust she has can age people back into toddlers) *Gas Manipulation
        and Poison Manipulation (Made a poisonous gas to bring down Batman) *Poison
        Manipulation and Natural Weaponry (Configured her plant beasts so that it
        poisoned people with its claws) *Wood Manipulation and Paralysis Inducement
        (Using an unspecified powder, encased Batman and Static in wood in moments)
        *Mind Manipulation (With her Reversal Powder (which turns good people evil
        and evil people good) and Mind-Manipulating Lipstick, which turns anyone she
        kisses into her slave) *Life Creation (Created sentient plant creatures, as
        seen here and here) *Transmutation and Paralysis Inducement (with Demetrite,
        which paralyzes people upon contact with their skin and turns them into trees)'
