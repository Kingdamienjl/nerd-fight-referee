    - field: weaknesses
      value: 'Requires sufficient CO2 and sunlight to survive otherwise death (Though
        water can revive her). Feels the pain of her plants when harmed. Cannot control
        plant beings with consciousness, such as Harvest. Her plants are extremely
        susceptible to fire and bladed weapons Feats: Respect Thread Notable Attacks/Techniques:
        *Pheromones: Ivy''s body produces pheromones that make people susceptible
        to mind control around her, although people with resistance to mind-control
        and strong will like Batman are usually capable of resisting. She was even
        once able to control Superman with the help of Kryptonite, though considering
        he has resisted mind control from insanely more powerful beings, this is most
        likely an outlier. *Toxins: Often these toxins are secreted from her lips
        and administered in her preferred way, a poisonous kiss, usually after professing
        false love or affection for her victim. They come in a number of varieties,
        from mind-controlling drugs, high-level hallucinogens and paralysis to instantly
        fatal toxins. These toxins are all around her body, to the point she can kill
        people just by touching them. They are even able to create hallucinations
        to her foes. *Resistances: Poison Ivy has a resistance to all matter of poison,
        hallucinogenics, bacterial disease and can overall not be affected by any
