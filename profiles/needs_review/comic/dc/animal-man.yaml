      value: 'Irrelevant |-|House of Mystery= The House of Mystery''s origins are
        unknown, yet it appears to exist simultaneously in both The Dreaming and Earth,
        near to a graveyard. The House appears to be sentient and serves as a repository
        for stories, usually extremely awful ones. Cain has cared after the House
        for endless years, much as his brother Abel looks for the House of Secrets.
        Cain went absent briefly a few years ago, and the House nominated Elvira as
        its new caretaker until he returned; the House appears to require a caretaker,
        despite the fact that it is perfectly capable of looking after itself, and
        indeed of totally rebuilding itself at will.Elvira''s House of Mystery #1
        Cain eventually confessed that he had been lurking inside the House all along,
        and Elvira went on to host horror stories elsewhere.Elvira''s House of Mystery
        #11 Shortly later, Morpheus, the Lord of the Dreaming, returned to his domain
        after over a century in jail and staggered to the House of Mystery''s door,
        where Cain and Abel nursed him to health. Following Morpheus'' return, the
        House focused mostly on the Dreaming, where Cain frequently entertained other
        supernatural storytellers.Sandman (Volume 2) #2 More recently, the House has
        vanished from its usual location(s) and transformed into a coaching inn in
        an extradimensional realm; Cain spent several months searching for it. John
        Constantine won the House in a card game, but when the Justice League Dark
        battled Blight, he lost it to Zatanna. The House eventually called on John
        Constantine to return to the land, and he restored control. |-|Second Tab
