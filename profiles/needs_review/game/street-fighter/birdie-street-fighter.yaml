  intelligence:
    text: 'Average, Above Average in combat (Not very cunning and impulsive at times.
      Is fairly skilled in criminal activities and knew that Shadaloo was just using
      him. Has masterful control over his chains, which are used for many complex
      techniques. Stated to be a great fighter and his style is mostly self-made.
      Karin considers him a good training partner. Has proven his worth against formidable
      opponents, including more than ten trained assassins sent after him.) Notable
      Attacks and Techniques: *Bull Drop: Birdie puts his hands in his pockets and
      kicks upward, then brings the heel down for a second hit. *Bull Charge: Birdie
      enters a three-point stance and tackles the opponent. *Bull Slider: Birdie dives
      forward and slides on his belly to headbutt the opponent''s legs. *Bad Hammer:
      Birdie clenches his fists together and uppercuts the opponent. He then swings
      his hands down, hammering the opponent onto the floor. *Body Press: Birdie leaps
      and dives above the opponent with his whole body. BullDrop.gif|Bull Drop BullCharge.gif|Bull
      Charge BullSlider.gif|Bull Slider BadHammer.gif|Bad Hammer BirdiePress.gif|Body
      Press *Bad Skull: Birdie grabs the opponent by the collar, lifts them up and
      knocks them down with a powerful headbutt. *Bad Chain: Birdie wraps the opponent
      up with his chains and kicks them in the gut. He then turns around and flips
      them over his shoulder. *Unnamed: Birdie uses several throws which lack an official'
    source_ids: *id002
    confidence: 0.95
