      value: At most Small Town level (Comparable to Chun-li) (Can withstand the recoil
        of his Bolshoi Storm Buster. Incredibly proud of the strength and hardness
        of his muscles, which allowed him to shield R. Mika from falling debris, withstand
        a powerful punch from Balrog and shatter Satsuki's katana without taking any
        damage. Took a powerful uppercut from Ken and kept standing, and it was stated
        that hitting Zangief's jaw felt more like hitting steel than flesh. Was caught
        in a tornado and violently hurled into the ground head-first without flinching.
        Comparable to past CWA wrestlers, who could withstand each other's most powerful
        techniques)
      source_id: character-stats-profiles-guy-street-fighter
