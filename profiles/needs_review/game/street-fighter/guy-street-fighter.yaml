        Bolshoi Storm Buster forms large craters. As a world-class wrestling champion
        who is occasionally hosted by the CWA for matches, he should be comparable
        to past top class fighters of the same organization, all of whom could slam
        each other through the stage, leaving large holes behind. Oftendepicted as
        comparable to Mike Haggar, who used to be a CWA champion. Fought with Balrog,
        Rashid,Karin, El Fuerte and Abel. Easily defeated one of Seth's weaker clones.
