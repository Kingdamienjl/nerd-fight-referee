      of already established techniques and merge them into a new style in constant
      improvement. As Unit #15, he has acquired the fighting styles of Ryu, Chun-Li,
      Guile, Dhalsim and Zangief, with some techniques somehow resembling those of
      Urien. As the Doll Unit Zero, his mind is clouded by madness and hallucinations
      due to programming errors, undermining his reasoning capability and memory,
