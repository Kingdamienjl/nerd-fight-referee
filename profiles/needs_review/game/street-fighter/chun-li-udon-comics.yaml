    - field: intelligence
      value: 'Gifted; A professional Interpol agent of the Hong Kong division, who
        graduated the police accademy with flying colors.Street Fighter Legends: Chun-Li
        - Issue #2 Chun-Li and her teammate Po Lin maintained a positive performance
        record in their early years. The Hong Kong Interpol chief holds her in high
        regard and usually assigns her highly sensible cases concerning large criminal
        organizations such as Shadaloo and the Secret Society. Shut down more Shadaloo
        cellsStreet Fighter (2003) - Issue #8 in Hong Kong than the rest of the city
        agents combined. Carried on several investigations and attacks against Shadaloo
        together with other characters, such as Guile, Fei Long and the Delta Red
        team. Gifted; Master of chinese martial arts, a talent she displayed since
        childhood and that was praisedStreet Fighter (2003) - Issue #10 by her master
        Gen. Her fighting style is in fact a mixtureStreet Fighter II - Issue #2 of
        her father''s Tai Chi, Gen''s arts and many other innovations she developed
        on her own. Stalemated CammyStreet Fighter (2003) - Issue #2 and defeatedStreet
        Fighter (2003) - Issue #11 her about a year later. Used to take on even multiple
        opponents at once, even against opponents such asStreet Fighter Unlimited
        - Issue #4 Twelve. Disarmed Keith Wolfman before he could react. Was among
        the few fighters who qualified for the second Street Fighter tournament despite
        the hundredsStreet Fighter II Turbo - Issue #1 of candidates that were chosen
        from the world''s top martial artists. Dominated five expert fighters on her
        own, and after being blinded she still claimed victory by following only Yun
        and Yang''s leads. Set up a convincing mock battleStreet Fighter II Turbo
        - Issue #9 with Fei Long. Devised a creative way to incapacitate Won Won.
        Could hold her own against DarkstalkersStreet Fighter VS Darkstalkers - Issue
        #1 such as Jon Talbain, the Man-Eating Bugs and Lord Raptor.Street Fighter
        VS Darkstalkers - Issue #3 Genius. Acquired all of Gen''s skill, knowledge
        and techniques by spending the equivalent of a lifetime training with him.
        Gen himself implied that she was already superior to how he ever was. Overwhelmed
        Bishamon, bested Morrigan and matched Shin Ryu, even though the latter didn''t
        show his true power until the very end, when their fight was already over.
        Became a good kung fu teacher, with a full grasp of some of its fundamental
        philosophical concepts. Grabbed a falling rice bowl and caught its content
        without spilling it.'
