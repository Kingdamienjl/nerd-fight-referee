- id: claim-powers-and-abilities-652c95ad
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Master Martial Artist, Chi Manipulation
    and Projection (Chi is a spiritual force that resides deeply within one''s self
    and is strongly tied to their emotions. When projecting Chi outwards as an attack,
    the user draws energy not only from themselves, but also from the air, the ground,
    the trees and moreStreet Fighter (2003) - Issue #11), Vibration Manipulation and
    Damage Boost (Via Kikosho), Enhanced Senses (Parried Yun and Yang''s attacks with
    her eyes closed and upon entering a dark room, even stating to having heard them
    well before. Even though she still needs her sight in order to fight properly,
    she managed to defeat five pro fighters while blinded and forced to rely on quick
    leads from Yun and YangStreet Fighter II Turbo - Issue #4), Extrasensory Perception
    (Though not as developed as that of the likes of Ryu, Chun-Li possesses a ki-sensitivity
    that gives her complete awareness of the internal and external presence of kiStreet
    Fighter Legends: Cammy - Issue #1), Acrobatics (Can perform many acrobatic techniques,
    handstand kicks, backflips,Street Fighter (2003) - Issue #9 frontflips, spinning
    jumps, and throws with her legs. Landed on her feet after falling off a building.
    ParkouredStreet Fighter Legends: Chun-Li - Issue #1 through a traffic jam to catch
    a criminal. Swung on the wire rope of a crane and entered the control cabin with
    a flying kick) Weapon Mastery (Set up a new record in a shooting course at the
    police accademy) Same as before, Pressure Points and Deconstruction (Learned Gen''s
    techniques, which find and attackStreet Fighter vs. Darkstalkers - Issue #5 the
    weakest point of the target and destroy them from within with the distilled sum
    of their negative ki. These techniques worked even on Bishamon''s body, which
    was made of spiritual energy, and destroyed itStreet Fighter VS Darkstalkers -
    Issue #6 completely), Paralysis Inducement (Gen could paralyse someone''s limbs
    with a gentle tap alone and could affect even an undeadStreet Fighter Legends:
    Cammy - Issue #4 such as Hsien-Ko), enhanced Extrasensory Perception (Can feel
    and pinpoint the weakest point of someone''s body and even that of a universe),
    Spatial Manipulation, BFR and Portal Creation (Can open breaches into space by
    focusing the killing intent into the weakest point of reality, opening portals
    to other universes or banishing the opponentAkuma VS Hell to the void between
    dimensions), Power Nullification (Gen used the Shitenketsu to nullify Akuma''s
    Tenchi Sokaigen), Explosion Manipulation (Released a large chi blast all around
    her), possibly Cloth Manipulation and Teleportation (Appeared from nowhere and
    with her classic clothes on, although it is unknown whether it was her own doing
    or because of the Majigen, where time, space and reality bend), Supernatural Willpower
    and Resistance to Corruption (Wields the killing intentStreet Fighter 100 - Ryu
    VS Chun-Li without being subjugated by it. Even controlling one''s own darkness
    was deemed virtually impossible, as most of the characters who experienced it
    failed to maintain their sanity. Even one such as Gouken knew he would have lost
    himself had he tried to wield the Dark Hado)'
