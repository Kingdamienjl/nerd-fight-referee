- id: claim-powers-and-abilities-e118a5fe
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Negative Energy Manipulation, Passive
    Perception Manipulation (Garuda''s form is said to change from the perspective
    of who he''s fighting), Morality Manipulation and Madness Manipulation (Was able
    to influence Doctrine Dark''s behavior, making him more violent and insane than
    he already was), Passive Status Effect Inducement (His very brainwaves are enough
    to mesmerize opponents), Ki Manipulation (Able to draw upon the power of the Satsui
    no Hado), Transformation (Can transform into Shin Garuda), Acrobatics, Abstract
    Existence (Exists through the power of negative emotions; is an accumulation of
    the negative energy felt by every living creature: hatred, disappointment, anger,
    envy, and betrayal), Fusionism (Can fuse his form with souls), Reactive Power
    Level (His power fluctuates based on who he''s fighting, becoming stronger against
    those who seek to become stronger), Enhanced Senses (Able to sense the difference
    in Kairi''s spirit and senses during their fight. Sensed a burst of energy from
    far away. Sensed that Ryu had returned), Immortality (Type 1, 4, 6 and 8) (Stated
    that he would be capable of wandering for all of eternity. Can be resurrected
    by resonating with the hadou of a powerful warrior through use of his Soul Fires,
    even when sealed away. Able to possess Hayate''s body), Passive Empathic Manipulation
    (Passively feeds on the negative emotions of his opponents), Supernatural Willpower
    (His desire to keep fighting allowed him to continue living as a demon, even when
    on the verge of death), Corruption (Type 1) (Corrupted Hayate''s body after being
    sealed in it and did the same to Doctrine Dark), Non-Physical Interaction, Soul
    Manipulation (Can devour the souls of powerful fighters and control the souls
    of those he''s absorbed), Power Bestowal (With Gougi), Possession, Sword Mastery,
    Summoning (Can summon spirits to attack for him), Martial Arts, Body Control (Can
    force blade-like thorns to pop out of his body, which can be extended to his liking),
    Empowerment (Empowered by negative emotions), Air Manipulation, Pseudo-Flight
    (Can hover slightly above the ground with a spinning kick), Fire Manipulation
    (Can create three circling green flames around him), Energy Projection, Invisibility
    (With the Ghost Gougi, turning him invisible after avoiding enemy attacks for
    over 6 seconds), Statistics Amplification, Damage Boost (With M. Power, Critical
    and Power Reversal Gougi), Absorption (With Soul Drain Gougi, which can drain
    energy from the soul as well as the enemy''s health. Can also naturally absorb
    negative energy, including that of M. Bison''s Pyscho Power), Teleportation, Invulnerability
    (With the Hades Gougi, which grants Super Armor), Illusion Creation (With Illusion
    Gougi), Self-Sustenance (Type 1), Resistance to Extreme Cold and Cosmic Radiation,
    Sealing (Broke out of Hayate''s seals on many occasions), Soul Manipulation, Corruption
    (The effects of attacks fueled by the Satsui no Hado would have been utterly useless
    on him) Same as before, plus Telekinesis, Mind Manipulation, and Portal Creation
    (Due to absorbing M. Bison''s Psycho Power)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
