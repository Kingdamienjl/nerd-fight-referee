- id: claim-powers-and-abilities-cdac574e
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Highly trained master of Kobujutsu, Memory
    Manipulation (Was able to seal off the memories of her sister Nanase so she could
    live a normal life), Ki Manipulation, Acrobatics, Transformation, Statistics Amplification
    and Berserk Mode (When the seal on her is broken, she will enter a much more powerful,
    albeit corrupted, state as Bloody Hokuto), Naginata, Bow, and Fan Mastery, Energy
    Projection, Electricity Manipulation, Light Manipulation, Fire Manipulation (Shirase
    Gatana lights her naginata on fire and leaves whoever comes into contact with
    it burned), Darkness Manipulation (Can engulf her fists in dark energy), Hovering,
    Weapon Creation (Using Ki, she can manifest a bow and arrow and pull a gigantic
    naginata from out of nowhere), Invisibility (With the Ghost Gougi, turning her
    invisible after avoiding enemy attacks for over 6 seconds), Damage Boost (With
    M. Power, Critical and Power Reversal Gougi), Soul Manipulation, Absorption (With
    Soul Drain Gougi, which can drain energy from the soul as well as the enemy's
    health), Teleportation (With Teleport Gougi), Invulnerability (With the Hades
    Gougi, which grants Super Armor), Illusion Creation (With Illusion Gougi), Self-Sustenance
    (Type 1), Resistance to Extreme Cold and Cosmic Radiation, Mind Manipulation,
    Morality Manipulation and Corruption (Type 1) (Was able to break out of her corrupted
    state as Bloody Hokuto and can now freely control when she uses its power due
    to her having broken free from the Seal Of Blood. Can use Gougi without falling
    to Garuda's influence)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
