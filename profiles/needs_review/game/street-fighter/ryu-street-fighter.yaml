- id: claim-weaknesses-ad249f17
  section: weaknesses
  axis: weakness
  text: 'Ryu can lose his calm sometimes, especially when unleashing the Satsui no
    Hado, which turns him into a berserker blinded by rage. He believes in showing
    true mercy to his opponents, and does not believe in killing his opponent. He
    is also afraid of spiders (he once woke up with one in his mouth). Note: Although
    SFIII Ryu seemingly struggled to lift a large boulder, the context of the scene
    implies he had been doing it for a prolonged time as part of his training, which
    could have undermined his stamina and made it difficult to keep the boulder above
    his head after awhile.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
