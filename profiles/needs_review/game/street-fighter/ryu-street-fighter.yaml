        defense and an optimal usege of projectiles. As a result, Ryu is a flexible
        fighter, with an unbreakable spirit and a mind that is completely calm in
        battle. This attitude allows him to stay focused during a fight, read his
        adversaries, learn from them, take advantage of their mistakes and analyze
        their style.Ultra Street Fighter IV - Ryu''s Versus Mode Quotes (vs. Sakura)Street
        Fighter III: 2nd Impact - Ryu''s Versus Mode Quotes (vs. Necro) A good fight
        can rile him as he enjoys facing a worthy opponent. His complete dedication
        to the battle brought him to travel all around the world, on a path of constant
        improvement and to battle all kind of opponents and fighting styles. While
        not academically educated in a conventional way, Ryu was taught much by his
        master Gouken and his flaws are only due to his disattachment and uninterest
        in society and modernities. Ryu also expands his knowledge on his own, absorbing
        things as he travels and meets new people. He is quite good at cooking, is
        deeply interested in cultural and historical aspects of the countries he visits,
        has rudiments of many languages and has performed a variety of jobs and gigs,
        most notably solving local crises.Street Fighter VI - World Tour - Ryu''s
