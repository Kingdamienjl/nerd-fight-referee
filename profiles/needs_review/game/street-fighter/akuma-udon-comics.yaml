- id: claim-stamina-d123ea4b
  section: power_scale
  axis: stamina
  text: Superhuman (As a kid he was already tough enough to challenge a wild bear
    and keep fighting despite suffering severe injuries. To complete his training,
    he was sent starving without food and water for 14 days inside a cave in a snowy
    mountain, with only few embers to keep him warm; after receiving the minimum supply
    of food and water to keep him from dying on the last day, Akuma had already sufficient
    strength to bring an onslaught in the nearby village and then best Goutetsu in
    combat the day after. Being stabbed in the shoulder didn't bother him at all.
    Retired to hermitic life in a place almost impossible to reach, living only on
    the offerings given to him by the very few fighters who could reach him and remained
    undefeated. Used to let his opponents beat him to the brink of defeat before retaliating.
    His body endured the destructive effects of Gen's Zanei. | Superhuman (Better
    than before. Fought Gouken in a prolonged battle across many different environments.
    Uses to train in harsh places such as active volcanoes and the arctic. Oni's demon
    body exceeds all limitations humans have to unspecified degrees. Furthermore,
    he should be an enormous source of Satsui no Hado akin to Evil Ryu) | Superhuman
    (With his true power unlocked, he outclasses his previous self in every aspect)
    | Superhuman (Better than his SF-SSF self. Adapted to living in the inhospitable
    environments of Makai entirely alone while fighting hordes of monsters over and
    over) | Superhuman (Greater than ever before. Undergone being confined in the
    void outside of reality for an unquantifiable time and simply emerged stronger.
    Endured traveling across space and crash-landing on Earth)
