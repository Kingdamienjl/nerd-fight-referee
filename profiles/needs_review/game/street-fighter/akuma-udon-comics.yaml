  intelligence:
    text: 'At least Average (Akuma was taught the ways of life of a farmer by his
      father in his early years, then was raised as a martial monk by Goutetsu. Later
      in life, he adapted to live in Tokyo on his own, even though he had never left
      the countryside and didn''t formally exist for the government. Demonstrated
      a good amount of survivalism knowledge through his never-ending travels around
      the world barefoot, until he retired to a life of hermitism on the peak of a
      mountain which Retsu described as nearly impossible to trek; there, he made
      his home with a house, stairs sculpted in rock and a boundary wall. Moreover,
      in just a matter of days, he returned to health a fighter he had defeated. Unable
      to convince Ryu to accept the Dark Hado, Akuma lured Sakura into embracing it
      herself, leading Ryu to save her by absorbing her darkness and become the evil
      warrior Akuma always wanted him to be. Demonstrated many times to not have any
      troubles accommodating himself in habitats such as deserts and even a world
      such as the Makai) Genius (Trained for five years under Goutetsu, the fabled
      master of Ansatsuken karate, learning almost everything he could teach him.
      Goutetsu himself described Akuma as his fastest learner, while some of the dojo''s
      best former students look up to him as the most dangerous fighter they had ever
      seen. Recognized the true abilities of an expert fighter who was only pretending
      to be weak and proceeded to beat him to unconsciousness with ease. Killed an
      opponent in just three moves. After awakening the Dark Hado, Akuma acquired
      a new arsenal of techniques he instinctively knew how to use which helped him
      murder Goutetsu after besting him in combat. In the following years, his fame
      spread throughout the martial artists of Japan, reaching the proportions of
      a legend and earning him the title of a demonic warrior of whom many tales are
      told. Set an open challenge that only the world''s best fighters have been able
      to undergo and never lost once. Gen states he had never met an opponent as capable
      as Akuma before, if he had yet to master the Satsui no Hado. Battled Gouken
      twiceStreet Fighter (2003) - Issue #2 and Oro once, but couldn''t defeat either
      of them) Genius (Spent several years perfecting his art and mastering his control
      over the Satsui no Hado. Finally managed to claim victoryStreet Fighter II -
      Issue #1 over his brother and equaled him in severalStreet Fighter IV - Issue
      #1 subsequent confrontantions.Super Street Fighter - Vol. 2 Would have been
      a truly worthy opponent to Gen, were he still in his prime. RivaledStreet Fighter
      II Turbo - Issue #12 Ryu and M. Bison once they had covered the gap in strength
      and speed. Seth regards him being the greatest store of fighting techniques
      he has encountered, despite him having already assimilated the Ansatsuken and
      the fighting styles of Zangief, Chun-Li, Dhalsim, Guile, and others; in turn,
      Akuma assessed his skills and found them disappointing. Evolving into Oni granted
      him even more abilities, which he used to stalemate Evil Ryu.) Genius (With
      his true power unlocked, Oni can match Shin Ryu in a direct confrontation, although
      he ultimately fails to defeat him) Genius (Suffering a humble defeat at the
      hands of Ryu pushed him to intensify his training and overcome his limitations
      and weaknesses. Aided in the defeat of Jedah and demonstrated to be one of the
      most valuable assets of the alliance between humans and Darkstalkers. Went on
      a training journey across the cursed lands of Makai, slaughtering every monster
      that stood on his path, regardless of kind and size. At last, he met his final
      challenge in the revenant Gen, who could now fight at full power and more.Akuma
      VS Hell) Genius (Has not yet displayed his achievements, but possesses a better
      understanding of the Satsui no Hado than he ever did, which should theoretically
      have expanded his skills to greater heights) Note: Despite covering material
      from Street Fighter Origins: Akuma, Akuma''s first key also includes several
      flashbacks of Akuma''s past that were shown throughout the whole series. Therefore,
      such a key encompasses every moment up to Akuma murdering Gouken at the beginning
      of Street Fighter (2003), at which point Akuma enters his second key. Standard
      Tactics: The Ansatsuken is an ancient form of karate rooted in assassination
      arts. Although Akuma was taught a non-lethal version intended to direct the
      user towards self-improvement, Akuma progressively shifted towards a violent
      style bent on murder. He first lost the hesitation to kill, and eventually tapped
      into the force known as Satsui no Hado, the negative side of ki and representation
      of the killing intent, which fundamentally exists within everyone, but manifests
      as a powerful energy in exceptionally talented martial artists. While most try
      to suppress it, Akuma abandons himself to it wholly, fighting ruthlessly and
      without reservation or mercy. Whether he goes for a hand-to-hand exchange or
