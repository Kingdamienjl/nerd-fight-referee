- id: claim-powers-and-abilities-aa27fad6
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Master Martial Artist, Genius Intelligence,
    Chi Manipulation and Projection (Chi is a spiritual force that resides deeply
    within one''s self and is strongly tied to their emotions. When projecting Chi
    outwards as an attack, the user draws energy not only from themselves but also
    from the air, the ground, the trees, and more.Street Fighter (2003) - Issue #11
    Specifically, Akuma wields the Satsui no Hado, the negative side of ki that lies
    in every living being, but that only few can harness to such level), Acrobatics
    (Can perform many acrobatic techniques and jumping attacks. Should be able to
    nullify throws in a fashion similar to Goutetsu and Gouken''s), Accelerated Development
    (Goutetsu regarded Akuma as his fastest learner and it took him only five years
    to become the best student he has ever had up to that point. In just a few years
    of solo training, Akuma had already surpassed Goutetsu in skill and strength),
    Information Analysis (Saw through the acting a fighter had put up in order to
    pretend being weak, while no one else could), Teleportation (Can teleport at will,
    even in the midst of battle), Intangibility, Speed Amplification and Afterimage
    Creation (Via Ashura Senku), Resistance to High Temperatures and Poison (Survived
    a volcanic eruption, emerging from the lava unscathed and with only his clothes
    having burned awayStreet Fighter Unlimited - Issue #5), Pressure Points (Is the
    only person to ever having survivedStreet Fighter II - Issue #4 Gen''s killing
    techniques, which find and attackStreet Fighter vs. Darkstalkers - Issue #5 the
    weakest point of the target and destroy them from within with the distilled sum
    of their negative ki) Same as before to a higher degree, Soul Banishment (Via
    the Shun Goku Satsu), Fire Manipulation (Via Shakunetsu Hadoken), Light Manipulation
    (Can turn the sky redStreet Fighter (2003) - Issue #5 with his mere presenceSuper
    Street Fighter - Vol. 1), Extrasensory Perception (Able to sense ki and tell its
    approximate magnitude, but not its owner. Sensed Abel''s troubled mindStreet Fighter
    IV - Issue #3Street Fighter IV - Issue #4), enhanced Teleportation and possibly
    BFR (Battled Gouken across many parts of the planet, possibly as a result of his
    teleportation abilities. Went from a snowy region to a forest in Japan, and later
    from Antarctica to Australia.Street Fighter Unlimited - Issue #11 As Oni, he could
    even teleport while being thrown to avoid the impact), Clairvoyance (Teleported
    to Sakura''s location even though he had no means of knowing where she was. This
    could also explain his recurrent ability to track down the people he is interested
    in and reach them at crucial moments), Attack Reflection (Sent Sakura''s Hadoken
    back to her), Transformation (The Satsui no Hado within Akuma intensified so much
    that he eventually shed his humanity and irreversibly evolved into an actual demon,
    increasing his strength and abilities to the utmost. Only higher powers, such
    as Gill and Shin Ryu''s, could return him to human form), minor Telekinesis (Oni''s
    praying beads constantly levitate around him), Weapon Control (Can remotely control
    Dhylec because of his affinity with its energies), possibly Regeneration (Limited,
    Mid-Low; Turning into Oni for the second time seemingly healed a large wound he
    had sustained moments prior), Supernatural Willpower (Tied to his Resistance to
    Mind Manipulation), Resistance to Cold (Unbothered by the climate of AntarcticaStreet
    Fighter Legends: Cammy - Issue #2 despite wearing only light clothing) and Mind
    Manipulation (Has no troubles wielding Dhylec, which always tries to take over
    those who grab a hold of it. Only someone with a powerful fortitude of spirit
    and mindDarkstalkers - Issue #1 can overcome its will) Same as before to a higher
    degree Same as before, save for the abilities belonging to Oni. Dimensional Travel
    and enhanced Fire Manipulation (Via Sekia Kuretsuha), Vibration Manipulation (Via
    Ryusokyaku) All previous abilities, further Dimensional Travel and limited Spaceflight
    (Returned from being confined in the void between universes, appearing in the
    depth of space and driving himself back on Earth), Supernatural Willpower and
    Awakened Power (Spent the equivalent of days to decades in a completely dark void
    without losing his sanity, and instead used such time to explore his inner self
    and become one with the Satsui no Hado), possibly Longevity (Doesn''t seem to
    have aged at all, even though the lack of time and space in the void might be
    the reason for it), Explosion Manipulation (Generated a huge explosion simply
    by releasing his power upon returning on Earth), further Resistance to Heat (Unaffected
    by the aerodynamic heating of atmospheric entry)'
