      value: Superhuman (As a kid he was already tough enough to challenge a wild
        bear and keep fighting despite suffering severe injuries. To complete his
        training, he was sent starving without food and water for 14 days inside a
        cave in a snowy mountain, with only few embers to keep him warm; after receiving
        the minimum supply of food and water to keep him from dying on the last day,
        Akuma had already sufficient strength to bring an onslaught in the nearby
        village and then best Goutetsu in combat the day after. Being stabbed in the
        shoulder didn't bother him at all. Retired to hermitic life in a place almost
        impossible to reach, living only on the offerings given to him by the very
