  section: weaknesses
  axis: weakness
  text: 'Used to jump to conclusions too early in SFV, although it is unknown if it''s
    still valid for his SFIII self. Note: *Alex''s victory against Gill is only considered
    as "possibly" because of the lack of solid evidences and details. *Due to the
    questionable canonicity of the SFV Arcade Endings, Alex''s victory against Zangief
    may have not actually occurred in-canon, although it wouldn''t be inconsistent
    with the overall depiction of Alex''s strength. Fighting Style: AlexChop.gif|Chop
    AlexLariat.gif|Lariat FlyingChop.gif|Flying Cross Chop *Chop: A downward knifehand
    strike. *Lariat: Alex wings his right arm at a 45 degree angle, spinning in place
    to complete the move. *Flying Cross Chop: Alex jumps forward, then alters his
    momentum and dives over the opponent with his hands crossed. Upon touching the
    ground, Alex performs a small roll and returns on his feet. FaceCrushChop.gif|Face-Crush
    Chop LegTomahawk.gif|Leg Tomahawk AlexSlam.gif|Body Slam *Face-Crush Chop: Alex
    pushes the opponent to make them lose balance, then strikes their face with a
    powerful chop that knocks them down. *Leg Tomahawk: Alex switches sides with the
    opponent and performs an Enzuigiri, kicking their temple and causing them to fall
    on their stomach. *Body Slam: Alex lifts the opponent with both hands and slams
    them face-first on the ground. FlashChop.gif|Flash Chop ExFlashChop.gif|EX Flash
    Chop AlexPB.gif|Power Bomb ExAlexPB.gif|EX Power Bomb AlexPD.gif|Power Drop ExAlexPD.gif|EX
    Power Drop AirKneeSmash.gif|Air Knee Smash ExAirKneeSmash.gif|EX Air Knee Smash
    SlashElbow.gif|Slash Elbow ExSlashElbow.gif|EX Slash Elbow AirStampede.gif|Air
    Stampede ExAirStampede.gif|EX Air Stampede HeadCrush.gif|Head Crush ExHeadCrush.gif|EX
    Head Crush *Flash Chop: A long-reaching, horizontal knifehand strike. With this
    attack, Alex can also destroy incoming projectiles, something he wouldn''t normally
    be able to do. The EX version is stronger and faster. *Power Bomb: Alex places
    his opponent''s head in between his legs, putting them in a standing headscissors
    position. With his arms around their waist, Alex jumps and lifts his opponent
    up on his shoulders. As Alex drops down, he slams his opponent back-first on to
    the ground. With the EX version, Alex rotates on himself while in the air, to
    build momentum and deal even more damage. *Power Drop: After delivering a Flash
    Chop, Alex wraps his arms around the opponent''s waist, lifts them up and falls
    backwards while bridging his back and legs, slamming them back-first on the ground.
    With the EX version, the first suplex is followed by Alex rolling over the opponent
    and jumping backwards, in order to slam them on the ground once again. *Air Knee
    Smash: A technique used to counter airborne opponents. Alex leaps at an upward
    angle towards the opponent, planting his knee in their body. He then drives them
    down and crushes them between his knee and the floor. The EX version is stronger.
    *Slash Elbow: Alex dashes forward and attacks with a rising elbow strike. The
    EX version is stronger, faster and allows Alex to endure hits and avoid the interruption
    of the move. *Air Stampede: Alex jumps diagonally and dives over the opponent
    to stomp them. The EX version is stronger and allows Alex to endure hits and reach
    even far opponents. *Head Crush: Alex performs a flying somersault and lands in
    front of his opponent. He grabs their head and delivers a powerful headbutt that
    stuns them and makes them stumble backwards. The EX version is faster and allows
    Alex to jump farther. *Hyper Bomb: Alex grabs the opponent and performs two Power
    Drops and a Power Bomb. *Backdrop Bomb: A Flash Chop followed by five Power Drops.
    *Boomerang Raid: Alex alternates twice between punches and Flash Chops, ending
    the combo with a Power Drop. *Stun Gun Headbutt: A stronger version of his Head
    Crush. Alex headbutts the opponent four times. This move always causes the Stun
    status. HyperBomb.gif|Hyper Bomb BackdropBomb.gif|Backdrop Bomb BoomerangRaid.gif|Boomerang
    Raid StunGun.gif|Stun Gun Headbutt *Heavy Hammer: Alex starts with a Flash Chop
    that makes the opponent spin in place. While still staggered, they are caught
    and slammed down by a Power Bomb. Alex rolls over and jumps high into the air,
    with the opponent still on his shoulder. Once he reaches the peak, Alex dives
    down at high speed and violently drives the opponent head-first into the ground.
    The opponent is then left stuck within the destroyed floor, with their legs pointing
    upwards. center|335px AlexWarHammer.gif|War Hammer AlexBigBoot.gif|Big Boot AlexOverhaul.gif|Overhaul
    Overchain.gif|Overchain RageShift.gif|Rage Shift AlexHammer.gif|Sledge Hammer
