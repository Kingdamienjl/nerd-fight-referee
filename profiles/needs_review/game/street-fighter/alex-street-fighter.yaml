    - field: weaknesses
      value: 'Used to jump to conclusions too early in SFV, although it is unknown
        if it''s still valid for his SFIII self, Alex''s victory against Gill is only
        considered as "possibly" because of the lack of solid evidences and details.,
        Due to the questionable canonicity of the SFV Arcade Endings, Alex''s victory
        against Zangief may have not actually occurred in-canon, Chop: A downward
        knifehand strike., Lariat: Alex wings his right arm at a 45 degree angle,
        Flying Cross Chop: Alex jumps forward, then alters his momentum and dives
        over the opponent with his hands crossed. Upon touching the ground, Face-Crush
        Chop: Alex pushes the opponent to make them lose balance, then strikes their
        face with a powerful chop that knocks them down., Leg Tomahawk: Alex switches
        sides with the opponent and performs an Enzuigiri, EX Head Crush, Flash Chop:
        A long-reaching, horizontal knifehand strike. With this attack, Alex can also
        destroy incoming projectiles, Power Bomb: Alex places his opponent''s head
        in between his legs, putting them in a standing headscissors position. With
        his arms around their waist, he slams his opponent back-first on to the ground.
        With the EX version, Alex rotates on himself while in the air, Alex wraps
        his arms around the opponent''s waist, lifts them up and falls backwards while
        bridging his back and legs, the first suplex is followed by Alex rolling over
        the opponent and jumping backwards, Air Knee Smash: A technique used to counter
        airborne opponents. Alex leaps at an upward angle towards the opponent, planting
        his knee in their body. He then drives them down and crushes them between
        his knee and the floor. The EX version is stronger., Slash Elbow: Alex dashes
        forward and attacks with a rising elbow strike. The EX version is stronger,
        faster and allows Alex to endure hits and avoid the interruption of the move.,
        Air Stampede: Alex jumps diagonally and dives over the opponent to stomp them.
        The EX version is stronger and allows Alex to endure hits and reach even far
        opponents., Head Crush: Alex performs a flying somersault and lands in front
        of his opponent. He grabs their head and delivers a powerful headbutt that
        stuns them and makes them stumble backwards. The EX version is faster and
        allows Alex to jump farther., Hyper Bomb: Alex grabs the opponent and performs
        two Power Drops and a Power Bomb., Backdrop Bomb: A Flash Chop followed by
        five Power Drops., Boomerang Raid: Alex alternates twice between punches and
        Flash Chops, they are caught and slammed down by a Power Bomb. Alex rolls
        over and jumps high into the air, Alex dives down at high speed and violently
        drives the opponent head-first into the ground. The opponent is then left
        stuck within the destroyed floor, with their legs pointing upwards. center,
        Choke Sleeper'
      source_id: vsbattles-alex-street-fighter
      provider_id: vsbattles
      authority: high
      confidence: 0.75
