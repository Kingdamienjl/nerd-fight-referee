    - field: weaknesses
      value: 'Water of sufficient volumes will douse their flames, though it''s unknown
        if this has much effect on them beyond this | None notable Notable Attacks/Techniques:
        Like all Ainur, the Balrogs have access to a wide range of dangerous powers,
        mostly related to the elements. *Throng of flame: The Balrogs can create throngs
        of flame to entrap and burn their enemies. One of them used this strategy
        to ensure the victory of Gothmog over Fingon. *Powers of the Ainur: As Maia,
        Balrogs has access to wide variety of potent and devastating supernatural
        abilities, for the Ainur were created as elemental spirits, and each have
        divine authority and absolute control over a certain aspect of nature. Each
        and every one of the Ainur is also able to manipulate magical energies and
        reality to serve their needs, and take any form they wish, even intangible
        and non-corporeal spiritual forms. **Elemental Manipulation: The Balrogs were
        demons of flame and darkness first and foremost, wielding fire and shadow
        the defeat their opponents. Once this flame was banished, however, they appeared
        to become monsters of slime. **Foresight/Hindsight: The Ainur can see the
        past and the future (Though the latter is fallible). However, whether the
        Balrogs ever used it was unconfirmed. **Empathy: The Ainur are surrounded
        by an a powerful aura, which can affect those around them, bringing joy and
        presumably sorrow to those near him: "In Beleriand King Thingol upon his throne
        was as the lords of the Maiar, whose power is at rest, whose joy is as an
        air that they breathe in all their days, whose thought flows in a tide untroubled
        from the heights to the deeps." **Shapeshifting: As Ainur, it was highly likely
        that the Balrogs possessed the famous Ainur ability to transform and reshape
        the form of one''s body, appearing in whatever form he desired (Though there
        is a chance they lost it after enough time as Morgoth''s lieutenants). They
        can also appear as inanimate objects, such as when Yavanna appeared as a tree.
        **Spirit'
