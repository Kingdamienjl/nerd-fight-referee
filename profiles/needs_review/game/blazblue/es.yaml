- id: claim-weaknesses-bae844a3
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: *Phenomenon Intervention: Is an\
    \ ability that is called \"The Power of the God\". It can change its target's\
    \ state from \"exist\" to \"not exist\" and vice versa. If it cannot be determined\
    \ if the target actually \"exists\" or not, it is almost impossible to perform\
    \ a Phenomenon Intervention. Since a sudden disappearance of the target would\
    \ shock those surrounding it, their memories are altered. Phenomenon Intervention\
    \ also allows the user to erase one reality and overwrite it with another (a different\
    \ world that is a result of an existing possibility). In other words, it imposes\
    \ a result of a certain phenomenon from a parallel world into the current world.\
    \ It changes a possibility into reality. *Crest Arts: Summons a Crest on the trajectory\
    \ of the slash; for setups, additional damage, and execution. *Type: Amplifier\
    \ \u2013 \u201CAvalon\u201D: A form of amp which doubles the number of hits of\
    \ Crests. *Type: Braver \u2013 \u201CLancelot\u201D: Es slashes the opponent into\
    \ the air, Then smashing down finishing them with a massive Crest. *Type: Shooter\
    \ \u2013 \u201CBreunor\u201D: Launches a projectile. Ground version flies forward,\
    \ air version flies diagonally forward and down. Es can project another projectile\
    \ from the first one afterwards. *Type: Slasher \u2013 \u201CGawain\u201D: Hops\
    \ forwards to slash heavily onto her opponent. Enchanted version will follow-up\
    \ with a crest attack. *Type: Slasher \u2013 \u201CMordred\u201D: Es performs\
    \ a dashing slash creating a crest ring. Enchanted version projects crests from\
    \ the ring. Capable of adding an upward flip slash, creating a second ring. *Type:\
    \ Slasher \u2013 \u201CGriflet\u201D: Es slashes forward invulnerably into a rising\
    \ slash covered with crests. Enhanced version will follow-up with an additional\
    \ crest spike attack that brings the opponent to the ground. *Type: Assaulter\
    \ \u2013 \u201CErec\u201D: Hops forwards to land upon opponent. If lands, she\
    \ then launches the opponent upward with a kick. *Type: Enchanter \u2013 \u201C\
    Bors\u201D: Makes Es\u2019 specials create additional Crest attack add-ons. Special\
    \ attacks will be enhanced a single time. *Type: Assaulter \u2013 \u201CTristan\u201D\
    : Es spikes the opponent with a hop-kick of small crests. *Type: Shooter \u2013\
    \ \u201CPalomides\u201D: Es spins with her sword, then unleashes a massive projectile.\
    \ *Type: Slasher \u2013 \u201CGalahad\u201D: Es envelopes herself into a crest\
    \ circle then powerfully charges at the opponent. On hit, it will pierce the opponent\
    \ for massive damage. *Type: Enchanter \u2013 \u201CPercival\u201D: Enhances Drive\
    \ attacks and her specials. Unlike Bors, it enhances all of her attacks. *Type:\
    \ Exterminator \u2013 \u201CArtorius\u201D: Es unlocks her Legacy Weapon\u2019\
    s true form. Performs an incredibly powerful slashing attack that consumes all\
    \ the magic element in the surrounding area. The slash will instantly destroy\
    \ the opponent, destroying space alongside it. *Discover Call: A standard ability\
    \ for Unions. Whenever Unions use an ability or become hostile, they emit a mysterious\
    \ sound frequency that no machines or ears can hear, except for other unions.\
    \ *Berserk Mode: A standard ability for Unions. Over time, Unions get corrupted\
    \ by their crystals, increasing their strength and agility at the cost of their\
    \ rational thinking. *Seithr Absorption: A standard ability for Unions. Unions\
    \ absorb seithr in the atmosphere to increase their power, or to use their Drive,\
    \ their unique abilities as Unions. **Drive: Hekatonkheires: Akira's special Drive.\
    \ With this ability, Es can create strings which she can control at will. The\
    \ strings are very powerful, able to strangle a person to near-death without any\
    \ problem. **Drive: Iron Shooter: Akio's special Drive, it is an ability to fire\
    \ any materials made out of metal with only a snap of a finger. It has fairly\
    \ decent firing power and it gave her the ability to even lift and fire electric\
    \ tower. **Drive: Screaming Jaw: Goro's special Drive. It is an ability to fire\
    \ energy beams and sonic waves as a weapon. It can be used to fire these from\
    \ her mouth. The said projectile can fragment walls with ease and able to punch\
    \ a hole through a human. ==Gallery== {{Scroll box|content= BlazBlue Central Fiction\
    \ Es Crest.png|Emblem of Es. XBlaze Es Avatar Normal Pose 1(A).png|Es' portrait\
    \ during Code Embryo XBlaze Es Avatar Dress Pose 1(A).png|Es'portrait during Lost\
    \ Memories 800px-BlazBlue Cross Tag Battle Es Main.png|Es' select portrait in\
    \ Cross Tag Battle 800px-BlazBlue Central Fiction Es Chibi.png|Es' chibi portrait\
    \ Screenshot 20190604-070847.png|Es after inheriting Embryo from Hinata Screenshot\
    \ 20190604-070940.png|Es using Phantom Grymoire XBlaze Code Embyro OST - 03 -\
    \ XBLAZE (Es Theme)|XBlaze, the theme of Es during Code Embryo. BlazBlue CentralFiction\
    \ - Conciliation (Es theme)|Conciliation, the theme of Es during Central Fiction.\
    \ BBTAG BBCF X BLAZE OST END GAZER|End Gazer, the theme of Lost Memories and fight\
    \ between Nine and Celica. }} ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ {{Discussions}} Category:Characters Category:BlazBlue Category:Absorption Users\
    \ Category:Acausal Characters Category:Adults Category:Artificia"
