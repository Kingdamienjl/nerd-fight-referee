  axis: equipment
  text: "*Signati Gladio Crystalis: Murakumo: A giant blade capable of cutting Union's\
    \ crystal, which is impossible to break, in one single slash. It is also capable\
    \ of storing seithr in its sheath and use it project energy. It also seemingly\
    \ breaks space when used at full power. *Phantom Grymoire: Grymoire that temporarily\
    \ resided in Es\u2019 left eye. It has access to the XBlaze ability. Nine explained\
    \ Es that she has the power to shape her feelings, and the stronger her desire\
    \ is, the more power she will gain. However, it\u2019s a miracle and can be used\
    \ only once. It was used to nullify Freaks' singularity."
