        \u5E30\u308A\u30FB\u5927\u86C7\u65AC\u982D\u70C8\u5C01\u9913, Kamigaeri: Orochizant\u014D\
        \ Repp\u016Bga, lit. \"God's Return: Serpent's Beheading Violent Hunger Seal\"\
        ): Terumi throws two chains of Ouroboros to trap the opponent, creating a\
        \ red portal and binding them. Terumi then opens a portal and assaults them\
        \ with dozens of energy snakes. He then transforms into the \"Black Susanoo\"\
        , and finishes them with a single mighty slash from his dark blade. |-|As\
        \ Susano'o= *Sundering Claws (\u8599\u30AE\u88C2\u30AF\u30FB\u72C2\u722A,\
        \ Nagisaku: Ky\u014Ds\u014D, lit. \"Tearing Down: Mad Claw\"): Susano'o dashes\
        \ forward headfirst to butt the opponent. He can follow this move up by slashing\
        \ his opponent with his claw. *Towering Flame (\u707C\u30AD\u5674\u30AF\u30FB\
        \u697C\u7114, Yakifuku: R\u014Den, lit. \"Miraculous Emitting: Towering Flame\"\
        ): Susano'o punches the ground, erupting spikes of glowing green energy around\
