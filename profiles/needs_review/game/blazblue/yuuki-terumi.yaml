    - field: standard_equipment
      value: '*Butterfly Knives: The knives he uses often for combat purposes. He
        has a large quantity of them, hiding some of them in his boots for further
        damage to his kicks. He mainly uses them to slash his opponent to pieces and
        while Ouroboros is technically his main weapon, he uses the knives just as
        much. *Geminus Anguium: Ouroboros: Eighth Nox Nyctores, appeared as two chains
        with black snakeheads for each. Ouroboros'' main ability is to manipulate
        the mind, memory, and emotion of the opponent, either by contact or just sight
        of the user. It is summoned from special portal and fires it wherever the
        user wants. Ouroboros can also be used for trapping or sending the opponent
        to the boundary using the said portal. Ouroboros'' chain is said to be unending,
        making an escape from the weapon very difficult. It''s capable of mind-shattering
        Murakumo Units, which are clones of Amaterasu and were built and born inside
        the boundary, a place filled with infinite memories and information, which
        means it can bypass 4-Dimensional mind hax resistances. *Susano''o Unit: A
        suit of armor that is the original body of Terumi. Susano''o is capable of
        slashing time, create light and most importantly, erase someone from the timeline.
        By utilizing a technique called Time Killer, it is able to erase the opponent''s
        past, present, and future at once without causing a paradox.'
      source_id: vsbattles-yuuki-terumi-blazblue
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Supergenius (as he was able to foil a nigh-Omniscient supercomputer and
        is one of the brains behind the major events of virtually everything in the
        BlazBlue reality, such as having a hand informing both the NOL and Sector
        7 and playing both sides against each other, manipulating Trinity into freeing
        him from Nine's Mind Eater spell, and then killing them both, and being the
        one ultimately responsible for the Prime Field War, which allowed him to break
        free of the Susano'o Unit that at the time was binding him to the Master Unit,
        as well as being the one who invented the Azure grimoire.)
