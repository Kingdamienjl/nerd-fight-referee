- id: claim-weaknesses-4f741f89
  section: weaknesses
  axis: weakness
  text: "He is arrogant to a fault. He additionally loves provoking and upsetting\
    \ others both in-combat and out, often leading to either his benefit or to his\
    \ detriment, however, he loses both his tendency to panic and playful manner while\
    \ he is in the Susano'o unit. His power is dependent on the hate and fear felt\
    \ towards him. As such, he will be weaker if his opponent doesn't hate/fear him,\
    \ and drastically so if no one does. Notable Attacks/Techniques: |-|As Terumi=\
    \ *Terumi can perform some attacks resembling that of Hazama's. Such attacks include:\
    \ **He can extend a spike of energy not unlike that of Hazama's Venom Sword. **He\
    \ can perform a scooping slash similar to, but not alike Hazama's Devouring Fang.\
    \ **He possesses an overhead slam resembling Hazama's Falling Fang. Mainly used\
    \ by Terumi while he is in the air as a combo ender, slamming his opponent to\
    \ the ground. *Snakebite (\u86C7\u984E, Jagaku, lit. \"Snakejaw\"): Terumi rushes\
    \ forward with his hand extended, flinging the opponent into the air and then\
    \ pulling them back into the ground. *Retaliating Fang (\u7259\u7A7F\u885D, Gasensh\u014D\
    , lit. \"Fang Piercing Stab\"): Terumi swings Ouroboros at the opponent, binding\
    \ them in a coil of chains in mid-air and launching them afterwards. *Cleaving\
    \ Fang (\u7259\u938C\u6483, Garengeki, lit. \"Fang Sickle Strike\"): Terumi stomps\
    \ a downed opponent several times, and then kicks them away. *Agonizing Fang (\u589C\
    \u885D\u7259, Tsuish\u014Dga, lit. \"Falling Stabbing Fang\"): Terumi headbutts\
    \ the opponent with an overhead strike, while trailed by a snake-shaped energy\
    \ aura. *Gleaming Fang (\u86C7\u5883\u6EC5\u9583\u7259, Jaky\u014D Messenga, lit.\
    \ \"Snake's Border Destroying Flash Fang\"): Terumi charges straight at the opponent\
    \ while coated in the aura of a dark snake, when done in mid air he will dive\
    \ diagonally toward the opponent. *Divine Twin Blades (\u8F5F\u7259\u53CC\u5929\
    \u5203, G\u014Dga S\u014Dtenjin, lit. \"Roaring Fang's Twin Heaven Blades\"):\
    \ Terumi kicks the opponent into the air and follows it up with a rising kick\
    \ trailed by two snake shaped energy auras. *Serpent's Laceration (\u5927\u86C7\
    \u6B66\u932C\u6BB2, Orochi Burensen, lit. \"Serpent's Martial Tempering Massacre\"\
    ): Terumi kicks his opponent down and stomps them multiple times, then finishes\
    \ with a backward kick trailed by a snake shaped aura. The alternate version of\
    \ this attack has him stomp once to grind his foot on the opponent's head, and\
    \ then following it up with the kick. *Venomous Bite (\u7687\u86C7\u61FA\u7262\
    \u7259, \u014Cja Zanr\u014Dga, lit. \"Imperial Snake's Repenting Fang Poison\"\
    ): Terumi walks forward while swinging Ouroboros. If the opponent attacks him,\
    \ he will jump over them and slash them with Ouroboros' coils, crushing them and\
    \ inflicting massive damage. *Serpent's Cursed Sting (\u86C7\u7E1B\u5C01\u7109\
    \u5875, Jabaku F\u016Benjin, lit. \"Snake's Binding Dust Seal\"): Terumi slashes\
    \ his opponent with Ouroboros' hook, then grabs them with both of his hands to\
    \ inject his energy into the ensnared foe, draining their power as a result. After\
    \ doing so, he will release the opponent, kicking them away or grind his foot\
    \ on their head. *Screeches of the Condemned (\u86C7\u9E9F\u7149\u7FD4\u7259,\
    \ Jarin Rensh\u014Dga, lit. \"Snake's Shining Refined Soaring Fang\"): Terumi\
    \ shoots two chains, either straight ahead or at an angle. If he ensnares the\
    \ opponent, he will follow that by launching them into the air, kicking and slashing\
    \ them several times, and finishing with a diving attack while wrapped in the\
    \ aura of a massive snake. *Unholy Wrath of the Basilisk (\u795E\u5E30\u308A\u30FB\
    \u5927\u86C7\u65AC\u982D\u70C8\u5C01\u9913, Kamigaeri: Orochizant\u014D Repp\u016B\
    ga, lit. \"God's Return: Serpent's Beheading Violent Hunger Seal\"): Terumi throws\
    \ two chains of Ouroboros to trap the opponent, creating a red portal and binding\
    \ them. Terumi then opens a portal and assaults them with dozens of energy snakes.\
    \ He then transforms into the \"Black Susanoo\", and finishes them with a single\
    \ mighty slash from his dark blade. |-|As Susano'o= *Sundering Claws (\u8599\u30AE\
    \u88C2\u30AF\u30FB\u72C2\u722A, Nagisaku: Ky\u014Ds\u014D, lit. \"Tearing Down:\
    \ Mad Claw\"): Susano'o dashes forward headfirst to butt the opponent. He can\
    \ follow this move up by slashing his opponent with his claw. *Towering Flame\
    \ (\u707C\u30AD\u5674\u30AF\u30FB\u697C\u7114, Yakifuku: R\u014Den, lit. \"Miraculous\
    \ Emitting: Towering Flame\"): Susano'o punches the ground, erupting spikes of\
    \ glowing green energy around him. *Megalith (\u6563\u30EA\u6BBA\u30B0\u30FB\u792B\
    \u5DCC, Chirisogu: Rekigan, lit. \"Scattering Off: Small Rock\"): Susano'o kicks\
    \ up a burst of dark energy, breaking the ground itself as a result. *Hunter's\
    \ Fang (\u72E9\u30EA\u7D76\u30C4\u30FB\u8972\u7259, Karitatsu: Sh\u016Bga, lit.\
    \ \"Hunting Off: Assault Fang\"): Susano'o performs a spinning flip jump surrounded\
    \ by his energy, knocking the opponent downward and then bouncing them. He can\
    \ follow this move with a rising pillar of dark energy. *Dancing Dual Kick (\u9019\
    \u30A4\u821E\u30A6\u30FB\u53CC\u811A, Haimau: S\u014Dkyaku, lit. \"Crawling Dance:\
    \ Twin Leg\"): Susano'o rips up the ground as he dashes into his opponent, then\
    \ kicks them into the air while accompanied by a rising pillar of his dark energy.\
    \ *Inevitable Calamity (\u5727\u30B7\u713C\u30AF\u30FB\u60E8\u798D, Oshiyaku:\
    \ Zanka, lit. \"Oshiyaku: Zanka\"): Susano'o discharges dark electricity from\
    \ his hands. The electricity created can also absorb incoming projectiles. *Splintering\
    \ Thrust (\u885D\u30AD\u523A\u30B9\u30FB\u7D76\u638C, Tsukisasu: Zessh\u014D,\
    \ lit. \"Thrusting: Sup"
