        it so hard that one of its heads popped out of its neck. Killed Nine by nice
        kick to the jaw. Also killed Tomonori who is comparable to Jubei, by piercing
        him with Ouroboros. Treated Valkenhayn like a dog, stomping his body multiple
        times while shouting him to play dead), possibly higher when feared/hated
        by large amounts of people (Stated that in the worlds he would have created,
