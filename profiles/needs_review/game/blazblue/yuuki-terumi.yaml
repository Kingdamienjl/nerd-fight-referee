        , Oshiyaku: Zanka, lit. \"Oshiyaku: Zanka\"): Susano'o discharges dark electricity\
        \ from his hands. The electricity created can also absorb incoming projectiles.\
        \ *Splintering Thrust (\u885D\u30AD\u523A\u30B9\u30FB\u7D76\u638C, Tsukisasu:\
        \ Zessh\u014D, lit. \"Thrusting: Sup"
