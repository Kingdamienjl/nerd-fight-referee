  name: "Terumi to Valkenhayn}} ==Summary== The man known only as Y\u016Bki Terumi\
    \ (\u30E6\u30A6\u30AD\uFF1D\u30C6\u30EB\u30DF) is the true main antagonist of\
    \ the BlazBlue series and a former member of the Six Heroes alongside Hakumen,\
    \ Valkenhayn, Nine, Jubei and Trinity Glassfille, as well as the creator of the\
    \ Azure Grimoire. He is also the founder of both the Novus Orbis Librarium and\
    \ Sector Seven, often manipulating both sides to reach his goals. In Centralfiction,\
    \ Terumi's true self is revealed to be the god Takehaya Susano'o, whose true original\
    \ form is the Susano'o Unit. ==Powers and Stats"
