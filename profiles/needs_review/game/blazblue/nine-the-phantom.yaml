- id: claim-weaknesses-18ac0c09
  section: weaknesses
  axis: weakness
  text: "Can be overconfident sometimes. Notable Attacks/Techniques: *Phenomenon Intervention:\
    \ Is an ability that is called \"The Power of the God\". It can change its target's\
    \ state from \"exist\" to \"not exist\" and vice versa. If it cannot be determined\
    \ if the target actually \"exists\" or not, it is almost impossible to perform\
    \ a Phenomenon Intervention. Since a sudden disappearance of the target would\
    \ shock those surrounding it, their memories are altered. Phenomenon Intervention\
    \ also allows the user to erase one reality and overwrite it with another (a different\
    \ world that is a result of an existing possibility). In other words, it imposes\
    \ a result of a certain phenomenon from a parallel world into the current world.\
    \ It changes a possibility into reality. *The Abyss Diver: Nine casts a random\
    \ spell that attacks enemies. *Everlasting Schorl: Summons a trident in front\
    \ of her. *Lapis Lazuli of Lamentation: Nine conjures a block of ice. Capable\
    \ of freezing on hit. *Sapphire or Sorrow: Nine conjures a block of ice. The block\
    \ is larger than Lapis Lazuli, deals more damage. *Tanzanite of Torment: Nine\
    \ conjures a block of ice. The block is larger than Sapphire, deals more damage.\
    \ *Emerald of Enmity: Attacks with a horizontal air stream. *Peridot of Poverty:\
    \ Attacks with a horizontal air stream. Deals more damage than Emerald. *Malachite\
    \ of Malice: Attacks with a horizontal air stream. Deals more damage than Peridot.\
    \ *Coral of Catastrophe: Summons an exploding fire skull in front of her. *Garnet\
    \ of Gall: Summons an exploding fire skull in front of her. The skull is larger\
    \ than Coral, deals more damage. *Rubellite of Rage: Summons an exploding fire\
    \ skull in front of her. The skull is larger than Garnet, deals more damage. *Heliodor\
    \ of Humility: Summons a ram skull. The skull protects Nine from attacks while\
    \ she is attacking. *Amethyst of Annihilation: Nine casts a large sphere of lightning\
    \ energy. *Citrine of Change: Summons a mirror in front of her. The mirror reflects\
    \ all projectiles. It slowly moves forward, and can push Nine and her opponent.\
    \ *Celestite of the Covenant: Places a gravity field on the ground. *Taaffeite\
    \ of Temptation: Nine summons a fairy that casts three small purple bolts of magic\
    \ with a certain delay. *Andradite of Accord: Summons a dark red sphere on a certain\
    \ distance from Nine. After a certain amount of time it explodes in a cross-shaped\
    \ formation, but it does not deal any damage before the explosion. The sphere\
    \ can be destroyed by the opponent before the explosion. *Uvorite of Undoing:\
    \ Nine conjures a mass of energy above the field that seeks the opponent. Once\
    \ it locks onto the opponent\u2019s position, it sends down balls of fire to strike\
    \ her opponents down. *Kunzite of Keep Breaker: Nine summons a boulder embedded\
    \ with gems above the opponent and sends it crashing down on them. *Morganite\
    \ of Malice: Nine plants a seed into the ground and accelerates its growth, willing\
    \ it to travel across the field and strike her opponent from below. *Nephrite\
    \ of Nullification: Nine conjures a timer that will only stop if she is hit and\
    \ will continue on block. If the timer reaches the end, her opponent is pinned\
    \ to the ground with a magic circle and pillars of energy erupt from the ground\
    \ beneath them. *Burning Red: An amp that increases the capabilities of her spells.\
    \ *Scarlet Vein: Nine launches her opponent into the air, then commands Hi no\
    \ Kagutsuchi to crush them in between its fists. *Crimson Raider: Nine dashes\
    \ toward her opponent while wreathed in flames. *Mauvette Roar: Nine summons one\
    \ of Hi no Kagutsuchi\u2019s legs diagonally upwards to attack the opponent. *Navy\
    \ Pressure: Nine summons one of Hi no Kagutsuchi\u2019s fists to crush the opponent.\
    \ *Seamoss Gate: Changes the order of her incoming spells. *Flax Nurture: Nine\
    \ buffs herself with the last element she used to her opponent. *Flame Punisher:\
    \ Nine fires two beams of dark energy, one after the other, from her hand and\
    \ foot. *Cardinal Nova: Nine creates a big explosion that engulfs the opponent.\
    \ *Azurite Inferno: Nine kicks the opponent, crucifies them, and fires magical\
    \ orbs at them. *Colorless Void: Nine summons Hi no Kagutsuchi, who devours the\
    \ opponent and traps them in a cage of fire. Nine then rises into the air and\
    \ creates a giant portal with a pentagram, raining down several meteors to finish\
    \ the opponent off. ==Gallery== {{Scroll box|content= Nine the Phantom's emblem.png|Nine's\
    \ emblem Cross Tag Nine the Phantom.png|Nine's Cross Tag Battle portrait Chibi\
    \ Nine the Phantom.png|Nine's chibi portrait 703px-BlazBlue Phase 0 Novel Illustration\
    \ 11.jpg|Nine during Dark War. cM5W7QE.png|Nine during Lost Memories. BlazBlue\
    \ CentralFiction - Walpurgisnacht (Nine the Phantom theme)|Walpurgisnacht, the\
    \ theme of Nine. Reincarnation (Nine vs Celica Kokonoe theme) BlazBlue Central\
    \ Fiction|Reincarnation, the theme of fight between Nine and Kokonoe/Celica. BBTAG\
    \ BBCF X BLAZE OST END GAZER|End Gazer, the theme of Lost Memories and fight between\
    \ Nine and Es. BlazBlue Chrono"
  source_ids: *id005
  decisive: false
  status: unverified
