        \ Nine the Phantom.png|Nine's chibi portrait 703px-BlazBlue Phase 0 Novel\
        \ Illustration 11.jpg|Nine during Dark War. cM5W7QE.png|Nine during Lost Memories.\
        \ BlazBlue CentralFiction - Walpurgisnacht (Nine the Phantom theme)|Walpurgisnacht,\
        \ the theme of Nine. Reincarnation (Nine vs Celica Kokonoe theme) BlazBlue\
        \ Central Fiction|Reincarnation, the theme of fight between Nine and Kokonoe/Celica.\
        \ BBTAG BBCF X BLAZE OST END GAZER|End Gazer, the theme of Lost Memories and\
        \ fight between Nine and Es. BlazBlue Chrono"
