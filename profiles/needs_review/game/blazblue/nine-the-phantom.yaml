    - field: attack_potency
      value: "Extraverse Level (Became immeasurably above a common Black Beast by\
        \ the end of Central Fiction. To make explaining easier we\u2019ll start from\
        \ the bottom of the scaling chain and work up to the top. A common Black Beast\
        \ is capable of destroying a multiverse created by The Master Unit: Amaterasu.\
        \ In every human timeline created by Amaterasu, Earth has 24 Cauldrons connected\
        \ to the very underlayer of the Earth. As Cauldrons are the primary method\
        \ of travel to alternating worlds for most beings. Cauldrons are also the\
        \ \"important points\" of and gateways to Boundaries. Which contains infinite\
        \ seithr, memories and information. Meaning there are infinite worlds of conscious\
        \ beings existing and experiencing within the setting of BlazBlue. And every\
        \ defined thing in the physical world has multiple information/seithr layers\
        \ that is the core of its existence. Such as the multiverse being the \"world\"\
        . During the Continuum Shift, Makoto Nanaya; Who was at least somewhat comparable\
        \ to Ragna The Bloodedge during Remix Heart \u2013 Ragna: individual whose\
        \ entire body has adapted to becoming as strong as the Black Beast fragment\
        \ on his arm \u2013 became vastly more powerful than before during the Continuum\
        \ Shift as Makoto went from being susceptible to the effects of the finite\
        \ seithr from the Cauldron of Ibukido from tanking the entire Boundary with\
        \ little side effects. All other relevant characters in the cast like Noel\
        \ and Relius Clover rose to her level, and Relius even showed that he was\
        \ far superior to her. Relius at that point was on even terms with a Full\
        \ Power Post Boundary Trapped Hakumen, who was on even terms with Hazama.\
        \ Hazama is a byproduct of Yuuki Terumi's Self-Observation after Terumi and\
        \ his prior vessel, Kazuma Kval were erased by a Narrow Space. Hazama has\
        \ traveled through the same narrow spaces that were capable of erasing the\
        \ Dark War era Six Heroes with no problem, meaning Hazama and Terumi complete\
        \ physical prowess and ability potency spiked on the same level as their existence\
        \ erasure resistance. Thus even before their immense power increase in power\
        \ Hazama and Terumi\u2019s power was far above a common Black Beast. Terumi's\
        \ power by itself was far above Hazama\u2019s. As Terumi held his own against\
        \ CS Relius after being beaten to near-death by a boosted Ragna. And believed\
        \ he was legitimately capable of simultaneously killing Mu-12, Jin Kisaragi\
        \ and Hakumen at the end of Continuum Shift. Kagura survived multiple hits\
        \ from Hades Izanami in Chronophantasma. Hades Izanami is far stronger than\
        \ CS-CP Yuuki Terumi with his Green Azure Grimoire Boost; During one of their\
        \ conversations when Terumi was growing increasingly irritated at Hades\u2019\
        \ lack of priority in killing people such as Ragna and Noel Terumi insulted\
        \ the trauma Hades experienced in her life. Thus she threatened Terumi with\
        \ the statement that she can end his existence without much effort, pacifying\
        \ the latter's spiteful nature.] Trouncing Terumi at this point means that\
        \ Hades would likely have to take into account his Green Azure Grimoire as\
        \ the latter can use it at any time. Rachel, who also claimed she can \"best\
        \ Terumi\" showed that she was capable of matching the latter with the aforementioned\
        \ grimoire boost. Kagura's power then grew to far exceed Ragna's inside Hades'\
        \ Embryo during Early Central Fiction. Ragna at that point was capable of\
        \ standing his ground against Chapter 8 Nirvana. Who reactively evolved to\
