- id: claim-powers-and-abilities-54419c48
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Self-Sustenance (Type 1; Can withstand\
    \ the Edge, which has no oxygen), Expert Hand-to-hand Combatant, Magic, Alchemy,\
    \ Sorcery and Ars Magus User, Acausality (Type 1; Is unaffected by the effects\
    \ from a Phenomena Intervention, which can reset an entire timeline), Psychometry\
    \ (Alchemists are capable of gathering information on their surroundings as shown\
    \ in Xblaze), Flight, Presence Concealment (Can hide her presence inside the Embryo),\
    \ Alternate Future Display (Showed Hakumen alternate realities in their fight),\
    \ Extrasensory Perception (Can sense killing intent, as well as being able to\
    \ sense Relius), Stealth Mastery (Magic users are stated to hide their tracks\
    \ easily), Shockwave Generation (Capable of blowing people away by bursting),\
    \ Shapeshifting (Can swap between her Phantom and normal form), Weapon Creation,\
    \ Void Manipulation, and Durability Negation (Can create blades of voids that\
    \ can sever anything), Explosion Manipulation, Non-Physical Interaction (Can harm\
    \ Arakune and hit abstracts), Invulnerability (Is a being that exist outside of\
    \ Logic; the fundamental rules of the world; meaning any abilities/weapons/and\
    \ powers that are restrained by Logic cannot harm them), Intangibility (Can phase\
    \ through attacks), Energy Manipulation, Energy Projection, Fire Manipulation,\
    \ Air Manipulation, Water Manipulation and Ice Manipulation (is part of her most\
    \ basic attacks), Chain Manipulation (Was able to bind Izanami in chains), Resistance\
    \ Negation (Can affect beings who are naturally immune to phenomena intervention\
    \ with said ability), Telepathy (Communicated to all the chosen), Summoning (Can\
    \ summon familiars to aid her in battle), Light Manipulation, Electricity Manipulation\
    \ (via Amethyst of Annihilation), Attack Reflection (via Citrine of Change), Teleportation,\
    \ Paralysis Inducement (Can paralyze Ragna), Sleep Manipulation (A superior alchemist\
    \ than Cipher, who can put people to sleep by a mere touch), Creation, Forcefield\
    \ Creation, Absorption and Statistics Reduction (A superior alchemist than Cipher,\
    \ who can create a barrier that absorbs the opponent's strength, can also absorb\
    \ magic in the atmosphere as shown in Phase Shift), Transmutation, Earth Manipulation\
    \ (Superior alchemist than Cipher, who can manipulate the earth and change the\
    \ shape of any objects), Plant Manipulation (via Morganite of Malice), Soul Manipulation,\
    \ Healing and Regeneration Negation (up to High-Godly; Nox Nyctores, Azure Grimoire\
    \ and Magic can damage the soul, negating any form of recovery, even when the\
    \ reality is warped by multiversal entity, magic's regeneration negating factor\
    \ is also superior to Ars Magus, a weapon capable of killing the Black Beast,\
    \ a creature that has the ability of Self Observation, which is what Terumi used\
    \ to regenerate from Hakumen's Time Killer), Telekinesis and Gravity Manipulation\
    \ (Slammed Nago and Gii with a gesture and pinned Rachel with gravity), Illusion\
    \ Creation (Can manipulate illusions inside the embryo), Black Hole Creation (Scales\
    \ from Kokonoe, who can create one), Duplication (Can make another clone of herself),\
    \ Dimensional Travel, BFR (Sent Hakumen to somewhere else), Status Effect Inducement\
    \ (Can make a restraining field), Power Nullification (Rachel couldn't teleport),\
    \ Perception Manipulation (Tager couldn't visualize anything during his fight\
    \ with her), Mind Manipulation (Used the Mind Eater spell on Terumi), Technology\
    \ Manipulation (Can shut down Tager's comms inside her pocket dimension), Phenomena\
    \ Intervention (She can create Phenomena Interventions), Spatial Manipulation\
    \ (Can compress space), Pocket Reality Manipulation (Is stated to have her own\
    \ world), Darkness Manipulation (Can restrain Hakumen and Rachel in darkness),\
    \ Mathematics Manipulation (Helped created the Phantom Virus, which has countless\
    \ unsolvable equations), Preparation, Sealing (Taught Kokonoe the Infinite Gravity\
    \ spell), Statistics Amplification, All of T\u014Dya Kagari's abilities (Due to\
    \ her having exact copy of Original Grimoire) |-|Resistance=Resistant to the Following:\
    \ Poison Manipulation, Madness Manipulation, Biological Manipulation and Statistics\
    \ Reduction (Can resist the effects of Seithr, which is poisonous, can induce\
    \ addiction and deteriorate bodies, as well as reducing the power of others),\
    \ Memory Manipulation (Can resist the effects of Cauldron and/or Boundary, which\
    \ erases memories), Chaos Manipulation (Resist the Boundary, which turns everything\
    \ into a spiraling chaos), Void Manipulation/Existence Erasure and Corruption\
    \ (Type 2) (Can resist the effects of the boundary, which can erase those that\
    \ enters it, and corrupt them beyond recovery in a similar fashion to what happened\
    \ to Arakune), Technology Manipulation (Is unaffected by the effects of Seithr,\
    \ which can mess with technology), Corrosion Inducement (Resists getting corroded\
    \ by the Cauldron), Time Manipulation (Can resist the effects of Cauldron and/or\
