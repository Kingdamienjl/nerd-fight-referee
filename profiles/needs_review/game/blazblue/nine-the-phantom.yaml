      \ by her daughter, Kokonoe, who inherited her magical abilities. Created Requiem\
      \ and powers it with her very life force. Fought Jubei and was implied to have\
      \ defeated him between the events of Chronophantasma and Central Fiction), Low\
      \ Complex Multiverse level with prep (Was capable to create Requiem, a replacement\
      \ god for Amaterasu, who can effortlessly warp the Boundary, a realm that transcends\
