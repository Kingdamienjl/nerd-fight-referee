- id: claim-weaknesses-ed472a42
  section: weaknesses
  axis: weakness
  text: "Due to his whole body being his grimoire, if its Seithr based powers are\
    \ nullified, he will be severely weakened, almost to a crippled state, but still\
    \ able to fight. Is a sadist and masochist. Notable Attacks/Techniques: *Phenomenon\
    \ Intervention: Is an ability that is called \"The Power of the God.\" It can\
    \ change its target's state from \"exist\" to \"not exist\" and vice versa. If\
    \ it cannot be determined if the target actually \"exists\" or not, it is almost\
    \ impossible to perform a Phenomenon Intervention. Since a sudden disappearance\
    \ of the target would shock those surrounding it, their memories are altered.\
    \ Phenomenon Intervention also allows the user to erase one reality and overwrite\
    \ it with another (a different world that is a result of an existing possibility).\
    \ In other words, it imposes a result of a certain phenomenon from a parallel\
    \ world into the current world. It changes a possibility into reality. *Venom\
    \ Sword (\u86C7\u5203\u7259, Jabaki, lit. \"Snake Fang Blade\"): Hazama extends\
    \ a spike of energy in the shape of a snake's head. *Vengeful Viper (\u86C7\u9AB8\
    , Jagai, lit. \"Snake Corpse\"): Hazama side swings with his hand, trailed by\
    \ a snake-shaped aura. He can then perform weaker versions of Falling Fang, Rising\
    \ Fang, or Devouring Fang immediately after to mix-up his attack, or enter his\
    \ Serpent's Benediction stance. *Serpent's Benediction (\u86C7\u5239, Jasetsu,\
    \ lit. \"Snake Temple\"): Hazama enters a stance while gathering energy on his\
    \ arm. He can cancel this stance, or follow it up with these moves: **Falling\
    \ Fang (\u88C2\u9583\u7259, Ressenga, lit. \"Rending Flash Fang\"): Hazama slams\
    \ his opponent with an overhead strike, trailed by a snake-shaped aura. **Rising\
    \ Fang (\u7259\u6607\u811A, Gash\u014Dkyaku, lit. \"Fang Rising Leg\"): Hazama\
    \ extends a knife hidden in his shoe, performing a rising crescent kick, trailed\
    \ by a snake-shaped aura. **Devouring Fang (\u6B8B\u5F71\u7259, Zan'eiga, lit.\
    \ \"Tracing Fang\"): Hazama twirls his knife then scoop slashes his opponent low,\
    \ trailed by a snaked shaped aura. **Serpent's Redemption (\u86C7\u6ED1, Jakatsu,\
    \ lit. \"Snake Slide\"): Hazama dashes forward/backward during Serpent's Benediction.\
    \ **Serpent's Haste (\u69CB\u3048\u4E2D\u65AD, Kamae Ch\u016Bdan, lit. \"Stance\
    \ Break\"): Hazama breaks his stance during Serpent's Benediction. **The Serpent's\
    \ Unholy Wrath (\u5927\u86C7\u6B66\u932C\u846C, Orochi Burens\u014D, lit. \"Serpent\u2019\
    s Martial Tempering Burial\"): Hazama dashes forward and grabs the opponent, removing\
    \ his hat to reveal his Terumi persona. He then binds the opponent and then kicks\
    \ them down to stomp them several times, finishing with a backward kick trailed\
    \ by a snake-shaped aura. *Wind Serpent's Fang (\u98DB\u938C\u7A81, Hirentotsu,\
    \ lit. \"Flying Sickle Thrust\"): Hazama swing kicks downward while in the air,\
    \ trailed by a snake-shaped aura. *Shadow Serpent (\u86C7\u51A5\u8FC5, Jameijin,\
    \ lit. \"Dark Swift Snake\"): Hazama drops straight down with a leg revealing\
    \ a knife on his heel out, trailed by afterimages. *Bloody Fangs (\u7259\u7815\
    \u885D, Gasaish\u014D, lit. \"Fang Smash\"): Hazama grabs the opponent while twirling\
    \ his knife, stunning them. When his Grimoire is active, he follows the grab with\
    \ a series of slashes, then having three dark serpents knock them away. *Hungry\
    \ Coils (\u86C7\u54AC, Jak\u014D, lit. \"Snake Bite\"): Hazama extends Ouroboros\
    \ at an angle into the air, if it connects to the opponent, he will swing them\
    \ in the opposite direction forcefully. *Serpent's Infernal Rapture (\u86C7\u7FFC\
    \u5D29\u5929\u5203, Jayoku H\u014Dtenjin, lit. \"Snake\u2019s Heaven Crumbling\
    \ Wing\"): Hazama vanishes, leaving an after-image, then kicks the opponent high\
    \ into the air with an energy pillar that reaches into the heavens. When his Grimoire\
    \ is active, he can perform a lesser version of this move. *Eternal Coils of the\
    \ Dragon Serpent (\u86DF\u7ADC\u70C8\u83EF\u65AC, Mizuchi Rekkazan, lit. \"Violent\
    \ Gorgeous Slash of the Rain Dragon\"): Hazama conjures a portal to grab the opponent,\
    \ reeling them in with Ouroboros to slash them repeatedly with his knives, then\
    \ summons three dark serpents to strike his target away. *Den of Hungry Snakes:\
    \ Can only be used when his Grimoire is active. Hazama seemingly vanishes, then\
    \ strikes his target from above with a swinging kick trailed by an energy snake,\
    \ following it with a scooping slash trailed by another energy snake to launch\
    \ them into the air. He then pulls them down with his chain and launches them,\
    \ doing this repeatedly, then finishing it by kicking his downed opponent and\
    \ laughing, holding his hat. ==Gallery== {{Scroll box|content= Hazama_(Continuum_Shift,_Character_Select_Artwork).png|Hazama's\
    \ select portrait in Continuum Shift. Hazama_(Chronophantasma,_Character_Select_Artwork).png|Hazama's\
    \ select portrait in Chronophantasma. Hazama_(BlazBlue_Cross_Tag_Battle,_Character_Select_Artwork).png|Hazama's\
    \ select portrait in Cross Tag Battle. Hazama_(Emblem,_Crest).png|Emblem of Hazama.\
    \ Continuum_Shift_Hazama-Terumi.png|Y\u016Bki Terumi in Hazama's body during Continuum\
    \ Shift Hazama_(Chronophantasma,_Character_Select_Artwork,_2).png|Y\u016Bki Terumi,\
    \ in Hazama's body during Chronophantasma image (5).png|Hazama's Chibi portrait\
    \ BB - Hazama's Theme Gluttony Fang-0|Gluttony Fang, the theme of Hazama. BlazBlue\
    \ Chrono P"
