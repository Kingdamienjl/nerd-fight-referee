    - field: powers_and_abilities
      value: "{{#tag:tabber|{{!}}-{{!}}Acknowledgment=Subjective Reality, Existence\
        \ Manipulation and Passive Causality Manipulation (Terumi has the power to\
        \ Observe. When Terumi \"Observes\" another individual, phenomena or space,\
        \ he acknowledges their/its existence with his mind and can manipulate their\
        \ existence with his will. Just observing one's existence and of itself can\
        \ prolong, contradict, and make it more difficult for certain phenomena to\
        \ occur. For example: Amane Nishiki could've slowed down Ragna's gradual transformation\
        \ into a full Black Beast by \"Observing Ragna.\" As Amane would observe and\
        \ concentrate his willpower into acknowledging/sustaining the existence of\
        \ Ragna's very identity, thus making it harder for the Black Beast transformation\
        \ to happen, as said transformation overrides Ragna's identity and sense of\
        \ self. Minerva made Amane battle herself and Celica to force Amane to constantly\
        \ recognize and assert Celica's existence. Said assertion prolonged Celica's\
        \ time limit before her inevitable disappearance. Kokonoe also would've indefinitely\
        \ sustained the existence of Arakune\u2019s soul if not for him being \"killed\"\
        \ by Doomsday. As Arakune would've died months after becoming a seithr made\
        \ being, but was alive for years due to Kokonoe recognizing him. Noel\u2019\
        s observation helped Tsubaki Yayoi use the full power of the Izayoi due to\
        \ her acknowledging it and seeing Tsubaki\u2019s potential form before she\
        \ ever used it. Amaterasu acknowledged Doomsday as an event, it became a permanent\
        \ phenomenon that was sustained by Amaterasu's form of consciousness. Making\
        \ the existence of Hades Izanami entirely irrelevant to the continuation of\
        \ the event. Hades Izanami was the original being who maintained Doomsday\
        \ with just her existence), Memory Scrying, Forced Memory Manifestation, Willpower\
        \ Collapse, Resistance Information Analysis, Clairvoyance and Cosmic Awareness\
        \ via Observing (Terumi can read through the memories of others by touching\
        \ them. Whether to look through their past or gain information about others\
        \ to be several steps ahead of them. Terumi can also gain pure information\
        \ about what he observes. As Noel Vermillion gained information from the \"\
        Boundary\" itself that memory scrying is the power of an observer. Terumi\
        \ also has the power to force one to see their own memories, Relius Clover\
        \ also had a solid grasp on Yuuki Terumi's Self-Observation by fighting and\
        \ simultaneously observing him. Terumi himself relied on Relius's observation\
        \ to fully understand how long he would last before permanently disappearing.)\
        \ {{!}}-{{!}}Phenomenon Intervention=Meta Space-Time Manipulation, Possibility\
        \ Manipulation and Fate Manipulation (As aforementioned, Phenomenon Intervention\
        \ manipulates one's \"space\" and \"time\" on a meta level and brings forward/erases\
        \ possible outcomes by nature of the power. Phenomenon Intervention naturally\
        \ manipulates one's fate as well, as the system of fate is linked to the essence\
        \ of Phenomenon Intervention. Say there's universe \"A\" where Ragna falls\
        \ off a cliff and dies, then there's universe \"B\" where Ragna doesn't fall\
        \ off a cliff and is completely unharmed, and universe \"C\" where Ragna is\
        \ falls but is severely injured and alive. With the power of Phenomenon Intervention\
        \ Terumi can make reality \"B\" or \"C\" happen which auto erases/replaces\
        \ universe \"A\". Or Terumi creates another entirely different scenario known\
        \ as universe \"D\" and so on. Phenomenon Intervention allows the user to\
        \ create new possible pathways and shape the future to their liking. On top\
        \ of that with Noel Vermillion absorbed Terumi\u2019s intervention is many\
        \ many times stronger than baseline Phenomenon Intervention, as she can affect\
        \ those like Ragna who can heal from magical damage, and layers upon layers\
        \ of said damage), Quantum Manipulation, and Existence Manipulation (Those\
        \ with the power to Observe can form \"astral\" replications of one's being.\
        \ By acknowledging one's consciousness/sentience being Terumi can \"replicate\"\
        \ said sentience and self-awareness of being. Making him capable of projecting\
        \ it manifesting it any location within is affectable range. Terumi also alters\
        \ one's quantum superposition for this creation. Quantum particles are in\
        \ an \"A\" or \"B\" state while they're in flux. Observing the A state causes\
        \ one possible outcome while observing the B state cause a differing one.\
        \ As the \"DNA\" of both worlds are different, thus Terumi creates another\
        \ equal existence without issue), Manual Meta-Causality Manipulation (Terumi\
