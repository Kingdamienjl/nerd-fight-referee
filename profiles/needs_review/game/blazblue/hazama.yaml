    - field: standard_equipment
      value: '*Butterfly Knives: The knives he often used for combat purposes. He
        has a large quantity of them, and he mainly uses them to slash his opponent
        to pieces. While Ouroboros is technically his main weapon, he uses the knives
        just as much. *Geminus Anguium: Ouroboros: Eighth Nox Nyctores, appeared as
        two chains with black snake heads for each. Ouroboros'' main ability is to
        manipulate the mind, memory, and emotion of the opponent, either by contact
        or just sight of the user. It is summoned from a special portal and fires
        it wherever the user wants. Ouroboros can also be used for trapping or sending
        the opponent to the boundary using the said portal. Ouroboros'' chain is said
        to be unending, making an escape from the weapon very difficult. It''s capable
        of mind-shattering Murakumo Units, which are clones of Amaterasu and were
        built and born inside the boundary, a place filled with infinite memories
        and information, which means it can bypass 5-Dimensional mind hax resistances.
        *Azure Grimoire: Azure Grimoire is an inferior imitation of the real BlazBlue.
        The so-called "Strongest Grimoire," the wielder of this weapon is feared by
        many. The Grimoire gives the user the ability to absorb souls to replenish
        their health, either by aura or contact. Grimoire can absorb objects and dreams
        as well and also has a nullification mechanism.'
      source_id: vsbattles-hazama-game
      provider_id: vsbattles
      authority: high
