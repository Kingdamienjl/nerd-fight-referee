        \ during Continuum Shift Hazama_(Chronophantasma,_Character_Select_Artwork,_2).png|Y\u016B\
        ki Terumi, in Hazama's body during Chronophantasma image (5).png|Hazama's\
        \ Chibi portrait BB - Hazama's Theme Gluttony Fang-0|Gluttony Fang, the theme\
        \ of Hazama. BlazBlue Chrono P"
