    - field: powers_and_abilities
      value: 'Magic, Superhuman Physical Characteristics, Enhanced Senses (Stated
        that he could hear the heartbeats of the Pirate and their crew.), Non-Physical
        Interaction, Summoning, Immortality (Type 5, likely Type 8 as well, as a servant
        of Death directly.), Death Manipulation, Chaos Manipulation (Through Death
        Magic.), (Hades''s role is to rule over the dead residing in the Underworld.
        Was able to attack the souls of the Pirate and their crew and would''ve killed
        them had Death not intervened.), Willpower Manipulation, Glyph Creation &
        Law Manipulation (Can summon Duel Circles to engage in combat and bypass the
        rules imposed upon them, such as acting out-of-turn despite the Duel Circles
        enforcing turn-based combat.), Transmutation, Healing, Aura (Can utilize auras
        to damage opponents overtime, heal himself and others overtime, to decrease
        the potency of Healing and to increase the potency of spells.), Damage Reduction,
        Attack Boost, Status Effect Inducement, Statistics Amplification, Statistics
        Reduction, Probability Manipulation, (Through the Black Mantle spell, which
        places a negative accuracy charm on an opponent, and the Vengeance spell,
        which increases the chances of casting a critical spell.), Fate Manipulation
        (Rendered prophecy for the Pirate to allow them to reunite with their parents''
        spirits again.), Mind Manipulation, Life Manipulation, Absorption, (Can absorb
        an opponent''s life force through Death Magic spells.), Necromancy, Summoning,
        Earth Manipulation (Ripped the earth on Pompeii to swallow the city into the
        abyss, where it now resides in the Underworld.), Abstract Existence (Type
        3; Exists as the lord of the dead watching over the Underworld of Tartarus,
        directly under the management of Death himself, and is a descendent of Chronus,
        a spirit of chaos and hunger.), Power Nullification, Resurrection, Energy
        Manipulation, Resistance Negation, likely Disassembly (It''s greatly implied
        that Hades shattered Charon''s boat to delay or prevent the Wizard from arriving
        at Hades''s palace.), Shapeshifting (Through Moon Magic: Can shift himself
        into a Wraith to attack an opponent, leaving a negative healing charm onto
        them.), Flight, Possession (Type 1: Aspect 1; Possessed a statue of himself
        to communicate with the Pirate.), Fear Manipulation, Curse Manipulation, Power
        Bestowal, Resistance to Magic, Sand Manipulation, Transmutation, Heat Manipulation,
        Astroremkinesis, Energy Manipulation, Mind Manipulation, Paralysis Inducement,
        Petrification, Elemental Manipulation, Chaos Manipulation, Willpower Manipulation,
        Fear Manipulation, Death Manipulation, Life Manipulation, Subjective Reality,
        etc. (Is heavily resistant towards Balance Magic in-general and can shield
        himself against the Elemental and Spiritual Schools of Magic through spells.)'
      source_id: character-stats-profiles-theseus-hades
      provider_id: character_stats_profiles
