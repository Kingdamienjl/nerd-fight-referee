        sense and evaluate Zagreus' divine blessings), Immortality (Type 1, 3, 4,
        and 8; As a non-minor god he doesn't age and will reappaer alive if killed
        even if his body was destroyed. When dead Zagreus' body will disappear and
        reemerge in the House of Hades from the Pool of Styx, a fountain of blood
        reserved for the resurrection of house staff and guests of honor. He is bound
        to the Underworld by fate, which cannot by changed even by Nyx who once altered
        fate to save Zagreus from stillbirth), Resurrection (Able to defy death and
        revive himself on the spot without returning to the House of Hades up to three
        times in a row normally, or at least once per encounter), Self-Sustenance
        (Type 1 and 2; Can exist and function within a void of nothingness. Comparable
        to the gods of Olympus who are stated to have no need to nourish themselves
        to survive, and only consume food and drink for the sake of tradition or revelry),
        Acrobatics, Dimensional Storage (Can summon and dispel his Infernal Arms at
        will), Accelerated Development (Becomes more resistant to damage when he dies.
        Developed his abilities and surpassed Achilles' skills within a short time),
        Instinctive Reaction (His reflexes allows him to automatically dodge attacks),
        Clairvoyance (Gains insight about what he had encountered based on Achilles'
        knowledge and wisdom with Codex of the Underworld. Has access to the Fated
        List of Minor Prophecies, which informs him of the future the Three Sisters
        of Fate has designed for him and would have warned him if the Three Fates
        had something cruel in store for him), Darkness Absorption and Limited Darkness
