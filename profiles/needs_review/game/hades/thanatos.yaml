    - field: weaknesses
      value: "Thanatos is extremely overconfident, prone to lose his temper and act\
        \ without any regard for consequences Notable Attacks/Techniques: As the god\
        \ of death, Thanatos is able to cause death to any kind of living creature,\
        \ no matter the distance with nothing but a mere thought as shown when he\
        \ killed Pandora. He is able to find his intended target, and attack him/her\
        \ without the need of physical contact, using powerful blasts of energy. He\
        \ is able to inflict excruciating pain on his victim, and cause instant death.\
        \ Being a wielder of the \"Big Will\", the divine Cosmo of the Gods, Thanatos\
        \ was able to completely smash five Gold Cloths with a single attack, an unprecedented\
        \ feat. He is seemingly capable of psychokinesis, as stated by Ophiuchus Shaina,\
        \ when she, along the Bronze Saints, Eagle Marin and Aries Mu's apprentice\
        \ Kiki were attacked by the god, and were unable to detect the origin of the\
        \ attack. The only one capable of detecting his energy blasts was Kiki, because\
        \ he is skilled at psychokinesis. However, this may be only due to the fact\
        \ that Thanatos' shots are invisible to mere mortals, as death itself has\
        \ no visible form. * Terrible Providence (\u30C6\u30EA\u30D6\u30EB\u30D7\u30ED\
        \u30D3\u30C7\u30F3\u30B9, Teriburu Purobidensu, the English \"Terrible Providence\"\
        ): Thanatos concentrates his cosmos releasing it into the hands against the\
        \ opponent as a dense ball of energy capable of breaking the dimensional planes.\
        \ Taking the form of an energy wave of gigantic proportions and explodes to\
        \ the touch in a devastating attack that is easily able to shatter even Gold\
        \ Cloths. This attack was able to completely shatter five gold cloths at the\
        \ same time.This attack disables the five senses at once and shows illusions\
        \ of your body being torn apart which can cause insanity. * Gate of Hell (Shigen-Shiki):Thanatos\
        \ opens a crack that leads to a dimension uninhabited by humans or any life,\
        \ any life not of divine origin or possessing divine protection has its existence\
        \ instantly rejected by the dimension. The Death God uses this attack in The\
        \ Lost Canvas against Cancer Manigoldo and Grand Pope Sage. * Phobia of Tartarus\
        \ (\u30BF\u30EB\u30BF\u30ED\u30BA\u30D5\u30A9\u30D3\u30A2, Tarutarozu Phobia,\
        \ the English \"Tartaros' Phobia\"): Thanatos is capable of summoning souls\
        \ from the deepest layer of hell, where only the most vile and evil souls\
        \ are cast after death. These souls are capable of being a significant enough\
        \ threat to a gold saint as Cancer Manigoldo resorted to igniting them with\
        \ his flames rather than face them head on. ==Gallery== File:God - Thanatos.jpeg\
        \ File:Thanatos render by dbzandsm-d72oxfq.png ==Notable Matchups== Victories:\
