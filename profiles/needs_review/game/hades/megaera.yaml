        belongs to the Barbarian Warriors from the East, passed down to king from
        king. It is stained with the blood of over 1000 warriors and can summon the
        soul of each of them to battle. It gets stronger the more souls it kills.
        * Blade of Artemis: Carried into Battle by Artemis herself to fight the Titans.
        * Cerberus Blade: A blade created using the teeth of Cerberus itself. It can
        spray a wave of flames with a single swing. * Phobos Spear: A spear that is
        etched with symbols that leak otherworldly, terrific energy. It is able to
        induce fear into the heart of its foes and create explosions of dark energy
        as well as barriers. * Cronos Blade: A blade crafted from the chains of the
        Titan Cronos, it can call forward electric attacks. * Gauntlets of Jason:
        A pair of gauntlets enchanted by the flames of the witch Medea to be able
        to reflect melee and projectile attacks, as well as expel powerful fire. *
        Gauntlets of the Furies: Gauntlets forged using the Leviathan''s thick hide.
