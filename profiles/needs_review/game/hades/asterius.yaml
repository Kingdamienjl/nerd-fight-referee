        Masters Category:Magic Users Category:Illusionists Category:Elasticity Users
        Category:Pocket Reality Users Category:Energy Users Category:Intangibility
        Users Category:Empowerment Users Category:Supernatural Willpower Users Category:Accelerated
        Development Users Category:Reactive Evolution Users'
      source_id: vsbattles-asterius-hades
      provider_id: vsbattles
      authority: high
