    - field: weaknesses
      value: 'Unknown. Notable Attacks/Techniques: Persona Summoning: The ability
        to utilize Personas, powerful manifestations of the mind and soul. Personas
        can move and attack independently of their users, allowing for double-teaming
        between their user and the equipped Persona. Each Persona has a set of elemental
        affinities, which also apply to their user while the Persona is equipped.
        Labrys'' Persona is Ariadne, while Shadow Labrys'' Persona is Asterius. |-|Ariadne=
        *Weaver''s Art - Sword: Ariadne summons a sword from the ground, which rises
        up to skewer enemies. *Weaver''s Art - Orb: Ariadne forms an orb that travels
        around to catch and damage opponents. *Weaver''s Art - Beast: Also known as
        "Beast Weaver" in its appearance as DLC in Persona 5. Ariadne forms the front
        of a bull before charging forward to gore opponents with its horns. In Persona
        5, this deals Colossal Physical damage at the cost of an extreme decrease
        in attack power as soon as the move is completed. *Weaver''s Art - Breaking
        Wheel: Ariadne creates two bladed wheels on the ground that shred opponents
        caught in their rotation. It disappears after some time, but sustains itself
        without the need for Labrys'' focus while around. *Weaver''s Art - Inquisition:
        Ariadne fires threads that pin the enemy to a wall in a web formation. Labrys
        then launches her axe like a boomerang at the opponent using her extendable
        arms, slashing them multiple times until the threads fall apart, before cleaving
        them in half once they fall to the ground. |-|Asterius= *Knuckle Train: Asterius
        lunges forward and delivers a punch with its giant fist. *Cliff of Creta:
        Asterius shields Labrys with its arm, displaying far greater durability compared
        to normal Personas. *Terra''s Eruption: Asterius spouts a wave of dark flames
        from its horns. *Hammer Uppercut: Asterius dives into the ground, taking advantage
        of a Persona''s intangibility, before delivering a massive uppercut out of
        nowhere. *Buffalo Hammer: Asterius roars and slams its fists onto the opponent.
        *Flame of Hades: Asterius roars and unleashes a beam of energy from its mouth.
        *Massive Slaughter: Asterius grabs the opponent and drags them underground
        before tearing into them with its teeth and claws. *Public Execution: Asterius
        lunges skyward, catching air-borne opponents and beating them repeatedly into
        the air before catching them and flinging them away. Instead of throwing them,
        Asterius sometimes follows up with Titanomachia. *Challenge Authority: Asterius
        throws a wide hook at the opponent with enough force to break the fourth wall...
        literally. *Titanomachia: Asterius charges for a moment, before unleashing
        a great wave of hellfire that surges all around Shadow Labrys. *Labyrinthos
        Gate: Shadow Labrys grabs the opponent and throws them into a portal leading
        into Asterius'' labyrinth, who then rises and pulls them into the depths before
        the gate closes. ==Gallery== File:Labrys_battle_faces.jpg|Battle portrait
        File:Labrys_character_artwork.jpg|Artwork from the Persona 4 The Ultimate
        Mayonaka Arena Official Book ==Notable Matchups== Victories: Losses: Inconclusive:
