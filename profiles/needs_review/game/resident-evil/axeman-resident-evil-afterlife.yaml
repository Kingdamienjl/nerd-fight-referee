- id: claim-weaknesses-2bc20c24
  section: weaknesses
  axis: weakness
  text: 'Vulnerable to headshots and massive trauma to the brain (destroying the head
    kills it permanently); slow recovery from direct hits allows openings for counterattacks;
    can be outmaneuvered by agile opponents in close quarters; axe can become lodged
    in objects, temporarily disarming it. Feats: * Breached the fortified main gate
    of the Citadel Correctional Facility with repeated axe strikes, allowing zombie
    hordes to invade. * Sliced survivor Kim Yong in half with a single axe swing and
    knocked out Alice (a superhuman with enhanced abilities) with a blow from the
    axe''s flat side. * Withstood a close-range shotgun blast to the head from Claire
    Redfield, regaining consciousness shortly after. * Threw its massive axe with
    precision, nearly hitting Claire during the shower room battle. * In Retribution,
    two Axemen pursued Alice and Ada Wong through a simulated New York, lodging axes
    in a vehicle before being crushed by an explosion. * Demonstrated punches capable
    of sending adult humans flying, showcasing raw physical power beyond normal zombies.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
