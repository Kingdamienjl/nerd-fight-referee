    someone was watching her and Ada from the house. Sensed that Cerberus undead dogs
    stalking her and her group) *Minor Superhuman Precision (Slammed a surgical table,
    then kicked a scalpel tray towards Wesker in midair, so all scalpels hit the place
    where Wesker was. Kicked a pistol magazine into Undead head in midair) *Preparation
    (Planted a Purge Bomb on the plane in advance, on which Wesker later flew away.
    Led the preparation of survivors in Raccoon City for defense against attack of
    Umbrella soldiers) *Limited Resistance to Information Analysis & Analytical Prediction
    (Despite being inferior to Alexander Isaac in combat. And the program in his head
    could analyze and predict her movements and attacks. Sometimes she could still
    harm him, and even outwit and mortally injure, despite his predictive combat software,
    which can show and predict possible attack options and defensive options against
    them. Stated that this program can show every potencial move,Resident Evil The
    Final Chapter 2017 (movie novelization) and gather, calculate, and analyze data
    with unimaginable speed, before attack reaches to the owner of the program) All
    previous abilities enhanced, plus *Stealth Mastery (Sneaked up on Umbrella''s
    sniper) *Regeneration (Low; After she snapped broken finger back in place, it
    quickly recovered and she could use this finger without pain in further fightsResident
    Evil Apocalypse 2004) *Resistance to Disease Manipulation (T-Virus somehow bonded
    with her DNA in a way that was not seen in others who were infected (like mutation).
    She gains all of the T-virus'' "positive" effects and none of its negative effects
    like the deceasing of higher brain function, cannibalistic cravings, and eventual
    decomposing or rotting flesh. Therefore, she must be immune to Undeads bites that
    cause other people to transform. Wesker, who injected himself with T-Virus, could
    not fully control it, which caused him to some mutations and thirst for human
    flesh. Therefore, he wanted to devour Alice to obtain her DNA in order to completely
    subjugate T-Virus) All previous abilities enhanced plus *Telekinesis (Lifted her
    motocycle and several rocks while dreaming.Resident Evil Extinction 2007 Stopped
    the fire and controlled it to burn zombie crows. Stopped Tyrant attack and sent
    him flying through the wall. Shattered part of a large room and made trucks explode)
    *Blood Manipulation & Durability Negation (Caused man to bleed and killed him
    by looking at him through the camera) *Technology Manipulation (Made her face
    appear on every screen in the guardroom. She broke connection with satellite)
    *Resistance to Electricity Manipulation (Unfazed being tasered)'
