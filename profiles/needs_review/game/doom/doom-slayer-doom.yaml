      value: 'None notable Feats: *Prior to obtaining his Praetor Armor, he fought
        and killed The Titan with his fists and his weapons. *In-game lore and the
        writers state that none of the forces of Hell were strong enough to defeat
        him. * The Praetor armor stated to be almost impervious to damage from everything
        in the UAC''s possession; this includes a "2 Megakelvin cutting laser." *
        Using his empowered weapons, he is able to harm the Icon of Sin, despite weaker
        titans being so resilient that they are considered indestructible to the conventional
        weaponry of ARC. *Withstood the power surge of a minimum 30,000 Megawatt Hour
        battery. ==Respect Threads== *Doom Slayer (DOOM)/Gewsbumpz dude ==Gallery==
