    - field: weaknesses
      value: 'Dante''s regeneration will become less effective once Dante starts to
        lose stamina, Dante is cocky and constantly underestimates his opponents Notable
        Attacks/Techniques: * Rebellion: Rebellion is the sword that was given to
        Dante by his later father. It is a massive claymore sword which Dante is so
        good at using he can wield it with one hand. * Ebony and Ivory: Ebony and
        Ivory are Dante''s dual pistols. They have infinite ammo, can be fired as
        if they were machine guns and can kill powerful demons with one shot. * Yamato:
        Yamato is the sword that was given to Vergil by their later father. It is
        a katana which has the ability to cut through space itself. * Nevan: Nevan
        is an electric guitar which can fire off electrical bats as projectiles. *
        Pandora: Pandora is a suitcase which can transform into 666 different weapons
        that Dante can use. These weapons include a giant shuriken, a Gatling gun,
        a rocket launcher and a turret which fires off a large amount of missiles.
        * Lucifer: Lucifer is a backpack which creates explosive needles which Dante
        can detonate whenever he wants. * Devil Trigger: The Devil Trigger is a transformation
        that Dante can use. It increases his strength, speed, durability and regeneration
        and can allow him to fly. * Styles: Styles are extra abilities that Dante
        can use. ** Swordmaster: Swordmaster increases Dante''s proficiency with his
        melee weapons. ** Gunslinger: Gunslinger increases Dante''s proficiency with
        his melee weapons. ** Trickster: Trickster increases Dante''s evasive abilities,
        allowing him to dash both on the ground and in mid-air and allows him to teleport
        short distances. ** Royal Guard: Royal Guard increases Dante''s defensive
        abilities ** Doppelganger: Doppelganger allows Dante to create a clone of
        himself that he can use. ** Quicksilver: Quicksilver allows Dante to stop
        time for a short period of time. Note: This profile is based on what is in
        Death Battles video, any information displayed on any profile based on Death
        Battle are solely based on whatever is said in their videos and not my own
        opinion. So if a character is weaker or stronger on a profile than they actually
        are then it isn''t my fault. == Others == Notable Victories: Notable Losses:
        Inconclusive Matches: Category:Unbacked0 Category:Tier 8'
