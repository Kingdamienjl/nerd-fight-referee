    - field: weaknesses
      value: "Can underestimate those who are mortals, will succumb to the Demon King\
        \ and corrupt if unable to stop its resurrection. Notable Attacks/Techniques:\
        \ Solo Hissatsu: *Heaven\u2019s Drive: Sein\u2019s signature shoot hissatsu,\
        \ of which he kicks a soccer ball through dark summoned storm clouds, trailing\
        \ a staircase and sending it to Heaven. The ball then comes back down surrounded\
        \ by massive spherical light energy, to which crashes down and heads straight\
        \ for the goal. This shoot was able to easily break through Ijigen the Hand\
        \ Kai, and was capable of damaging Edgar Valtinas in direct contact. *Excalibur:\
        \ A shoot hissatsu, of which Sein\u2019s aura is projected with the holy sword\
        \ Excalibur that appears from his foot. Once striking the ball with this sword,\
        \ the sword rends the field in two and is shot directly at the goal. The further\
        \ away it is from a target, the stronger the shot becomes and therefore the\
        \ power varies from different ranges. *Angel Ball: A dribble hissatsu, of\
        \ which Sein kicks the ball and make sit grow wings and a halo. The ball will\
        \ then be given life, as it flutters around the opponents and can be controlled\
        \ by him. The wings will disappear once Sein is able to kick it again. *Ultra\
        \ Moon: A dribble hissatsu, of which Sein acrobatically flips over the opponent\
        \ with the ball trapped between his feet as a large moon projection appears\
        \ in the sky, in order to get past the defense. *Saints Flash: A Hissatsu\
        \ tactic used by the Tenkuu no Shito, of which Sein is able to directly amp\
        \ his speed within the match temporarily. Though not shown in the anime, it\
        \ is the opposite to Black Thunder, a tactic that instead slows the opponents\
        \ to the point it appears that time is stopped and lightning is static, and\
        \ can therefore be assumed to able to amp their speed to the degree that Black\
        \ Thunder slows. Combination Hissatsu: *Shadow Ray: A combination shoot hissatsu\
        \ shot by Sein and Desuta, which combines both of their power of Dark Matter\
        \ and Heaven\u2019s Drive. Desuta spins the ball as Sein kicks it towards\
        \ the goal in a stream of light and dark energy. This hissatsu easily broke\
        \ through Ijigen the Hand Kai, and initially required weakening from both\
        \ Kabeyama\u2019s The Mountain and Tobitaka\u2019s Shinkuuma in order for\
        \ Endou to stop it with his hissatsu. ==Notable Matchups== Victories: Losses:\
