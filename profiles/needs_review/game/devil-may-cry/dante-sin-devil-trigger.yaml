        \ this, Vergil has numerous ways to use his summoned swords, whether for attacking\
        \ his enemies from a distance, surrounding them with it or from atop, or having\
        \ the blades move around himself for defense and attack enemies get too close\
        \ to him. Judgement Cut: A signature move Vergil performs with his Yamato.\
        \ By using the space-cutting properties of the sword, Vergil can attack his\
        \ enemies from a distance by cutting through the air, where it sends a dark\
        \ distortion that is then covered in slashes, cutting anyone caught in it\
        \ to shreds. Vergil can also send multiple Judgement Cuts in rapid succession.\
        \ * Judgement Cut End: A more powerful variation of Judgement Cut, where Vergil\
        \ readies up his sword and then moves forward at such speeds to leave after-images\
        \ behind. Such a move allows him to cover the area in his slashes, allowing\
        \ him to take out large numbers of enemies in one full sweep. Hell on Earth:\
        \ By concentrating his demonic/magic powers on his hand and slamming than\
        \ in the ground with a mighty punch, Vergil can create a powerful AOE attack\
        \ that can cause devastating attacks on his enemies. Deep Stinger: A forward\
