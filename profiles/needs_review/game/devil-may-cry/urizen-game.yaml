    - field: attack_potency
      value: At least Low Complex Multiversal (6D; Superior to Nightmare who can Destroy
        the Entire Demon World. The Demon World is Superior to to the Mirror world
        in a sense that it embeds it within itself and has Higher Dimensional Properties,
        thus making the Demon world by default infinitely greater in Volume to the
        Mirror World. The Omniscient God of Time and Space is viewed as fiction compared
        to the Mirror World, hence why it's completely powerless in this Dimension,
        granting it R>F Transcendence, making the Mirror world 5D). | Complex Multiversal
        (7D; Upscales from Urizen who was amped by the Qliphoth Fruit. The Tree of
