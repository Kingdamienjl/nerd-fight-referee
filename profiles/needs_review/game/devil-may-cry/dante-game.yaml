  intelligence:
    text: 'Extraordinary Genius |-|General=The Sparda bloodline are almost perfect
      beings capable of achieving anything, conquering tasks they had yet to master
      in a few seconds and mastering any moveset in mere moments of observation.Devil
      May Cry: Peak of Combat Gilver, a clone of Vergil, became familiar with a gun
      in seconds despite not knowing much about firearms and be uncomfortable with
      them in the first place.Devil May Cry: Volume 1 Dante can blend art and science
      in his movesets and has shown to be able to quickly master all the objects,
      weapons and vehicles he uses. |-|Swordsmanship= Pre-DMC2: Inherited Sparda''s
      swordsmanship. Easily defeated the Black Knights, demons made with Sparda and
      the twin''s combat data, and fought Gilver, the most powerful of them. Fought
      Vergil several times. Easily defeated Baul and Modeus. Held his own against
      Chen, who had precognitive powers and Sparda''s skills. Post-DMC2: Surpassed
      Sparda''s swordsmanship. Fought Vergil several times again. Defeated Bolverk
      twice, who was Argosax''s most skilled fighter and a rival of Sparda.'
    source_ids:
    - mediawiki-dante-game
