        on top of its barrel that can be used as a grappling hook. Lady uses it as
        a firearm at long distances, as a melee weapon in close combat and uses its
        grappling hook to reach longer distances or even to latch into enemies. It
        fires large rockets out of its barrel, a barrage of smaller target-seeking
        rockets out of the launchers on the base, as well as being able to charge
        it''s main missiles in later installments. *Handguns: Lady has 3 handguns,
        which are loaded with 9mm ammunition. *Submachine Gun: Lady has small submachine
        guns with a small bayonet attached to it. *Grenades: Lady has access to some
