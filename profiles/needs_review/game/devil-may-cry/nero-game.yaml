    - field: standard_equipment
      value: "Red Queen= thumb|250x250px|Devil May Cry 4, Nero's Arms File \u2014\
        \ Red Queen: \"A mechanical sword with a powerful fuel injection system. The\
        \ fuel sprayed onto the blade allows it to unleash attacks of great power;\
        \ however, the Red Queen\u2019s complex customizations mean only Nero is capable\
        \ of controlling it.\" {{Quote|This blade's the best companion a swordsman\
        \ could wish for!}} * Red Queen: Nero's customized version of a Durandal,\
        \ the blade wielded by the members of The Order of the Sword, which is modeled\
        \ after the German Gro\xDFes Messer (en. Great Sword). It's modified with\
        \ the motorcycle-like gear shift, which, when pulled, sprays a flammable propellant\
        \ across the sword and opponent, increasing the power of its strikes. This\
        \ system is known as \"Exceed.\" It's strong enough for Nero to be able to\
        \ use it as a jet. This and few other modifications make Red Queen comparable\
        \ to Devil Arms in power (despite it not being one) and nearly impossible\
        \ for anyone but Nero to wield. |-|Blue Rose= centre|thumb|250x250px| Devil\
        \ May Cry 4, Nero's Arms File \u2014 Blue Rose: \"A unique, specially constructed\
        \ revolver with two barrels, allowing two shots to be fired nearly simultaneously.\
        \ A product of Nero\u2019s own hand.\" {{Quote|That's one way to get yourself\
        \ shot!}} * Blue Rose: A heavily modified version of the Smith & Wesson Model\
        \ 500, crafted by Nero himself. Capable of shooting two bullets with one pull\
        \ of the trigger. The differences are: ** 6-shot cylinder as opposed to the\
        \ original 5-shot cylinder. ** Extra barrel underneath, allowing for a double\
        \ shot. ** Got targeting sights and porting on each barrel to reduce recoil\
        \ and muzzle flip. ** There's also a split-lag between first and second bullets.\
        \ Thanks to that, the first bullet breaks the enemy's armor while the second\
        \ pierce through the damaged surface and inflicts actual damage. ** Blue Rose\
        \ also can shoot one bullet at a time. ** Its shots can also be charged with\
        \ demonic energy for a higher damage input. |-| Devil Bringer= centre|thumb|220x220px\
        \ {{Quote|Now I know... This arm was created to send guys like you back to\
        \ hell!}} * Devil Bringer: Nero's right arm, manifestation of his demonic\
        \ power. It can manifest through its larger spectral version. Devil Bringer\
        \ can be used for lifting, striking, and throwing objects way larger than\
        \ Nero. It is also able to pull objects towards its owner or bring Nero towards\
        \ them instead. Proved to be highly durable, which, combined with its strength,\
        \ can be very useful for blocking enemy attacks. |-| Yamato= centre|thumb|300x400px|\
        \ Devil May Cry 4, Nero's Arms File \u2014 Yamato: \"A sword imbued with tremendous\
        \ magic, it unleashes the latent power within Nero.\" * Yamato: Sharper and\
        \ dark-forged variation of katana. It can cut through virtually anything,\
        \ even the very fabric of space itself. Despite its power, Nero was unable\
        \ to unleash its full potential, but he managed to awake his own Devil Trigger.\
        \ It allows him to summon and fire phantom swords, as well as a spectral demon\
        \ avatar which mimics Nero's movements and attacks with Yamato. In that state,\
        \ Nero's physical characteristics and healing factor are also amplified. |-|Devil\
        \ Breakers= center|400px The Devil Breaker is a specialized artificial appendage\
        \ that has eight different types of which Nero can use. Each Devil Breaker\
        \ connects to the base of his arm, making them easily replaceable. The bottom\
        \ of the Devil Breaker contains the wire, which is used for the Wire Snatch\
        \ ability, which behaves similarly as the Devil Bringer's Snatch ability.\
        \ In essence, it pulls small enemies onto Nero but pushes Nero toward larger\
        \ enemies. This move is available by default even if Nero has no Devil Breaker\
        \ equipped. thumb|left|100px Overture was forged from a Blitz. After Nero's\
        \ battle with it, Nico asked him to take its corpse so she could research\
        \ how it produces electricity and then use that as a reference to build the\
        \ Overture. thumb|left|100px Punch Line was created from a chunk of material\
        \ recovered after Nero defeats Goliath. When in action, Punch Line telescopes\
        \ out, the side-fins unfolding into a pair of small wings and a set of tailfins\
        \ unfolding at the rear. The wrist and hand remain largely unchanged, save\
        \ for a set of red spikes flipping up from the knuckles and thumb. thumb|left|100px\
        \ Gerbera is a green and black Devil Breaker arm with a forearm made of diagonal\
        \ slat segments. An emitter is present in the palm, which closes up when not\
        \ in use. When in its fully deployed state, the forearm unfolds into a circular\
        \ focusing array thumb|left|100px Helter Skelter was created at the same time\
        \ as Punch Line after Nero defeats the demon Goliath, it is a tapered gold\
        \ spiral with a three-pronged claw hand at the tip. When in use, it unfolds\
        \ into a series of vicious curved blades mounted to a central spindle via\
        \ assemblies resembling propellors. thumb|left|100px Tomboy was created at\
        \ the same time as the Buster Arm. With Red Queen, it opens out to rest against\
        \ the sword's fuel injection system during Ner"
      source_id: vsbattles-nero-game-devil-may-cry
