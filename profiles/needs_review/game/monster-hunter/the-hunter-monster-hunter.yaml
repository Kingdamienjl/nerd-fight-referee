- id: claim-powers-and-abilities-3c8e8229
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses (Scoutflies can track
    monsters across entire ecosystems. Paintballs allow the Hunter to track the target),
    Extrasensory Perception (Autotracker can sense monsters without having to mark
    it), Weapon Mastery, Lightning Manipulation, Fire Manipulation, Ice Manipulation,
    Water Manipulation, Explosion Manipulation (via Blast, Slime, Explosive Barrels),
    Presence Concealment (via Ghillie Mantle), Self-Sustenance (Type 1), Flight (via
    Glide Mantle and weapons like Airship Hammer), Empathic Manipulation (via Challenger
    Mantle and weapons like Fatalis Menace and Aladdin's Wand), Life Manipulation
    (Able to double his own life by Vitality Mantle), Stealth Mastery, Healing (Various
    items such as potions can restore health), Mind Attacks (Dragon Element attacks
    the mind, dealing damage the more intelligent the target is), Power Nullification
    (via Dragon Element and Elderseal), Poison Manipulation, Insect Manipulation (Can
    use the Kinsect which can sap essence of the target and use it to strengthen the
    Hunter, as well as produce dust that can apply Status effects when attacked),
    Sound Manipulation (via Scream pods and Hunting Horn), Information Analysis (via
    Psychic Vision), Light Manipulation (via flash pods), Statistics Amplification,
    Damage Reduction (Via Divine Blessing), Status Effect Inducement (Such as Paralysis,
    Sleep, Stun, Poison, Blast), Regeneration (Low, can slowly regain some health
    over time during a hunt; Mid-Low, via Super Recovery and Recovery Speed), Probability
    Manipulation (Via Good Luck, various specialized tools and skills), Minor Physics
    Manipulation (Weapons like Arachnoscale reduces friction), Creation (Via Alchemy
    Style), Smoke Manipulation (Weapons like Anubis can create large pillar of smoke,
    can create poison fog with a poison smoke bomb), Energy Projection (Able to fire
    Dragon Element blasts by weapons like Altheos Alteria), Magnetism Manipulation
    (Able to propel himself to the opponent by Magnet Spike), Pain Negation (Able
    to negate the pain of his attacks by Aloe Stenyo), limited Duplication, Aura (Able
    to create dangerous aura by utilizing equipments like Aim of Magic), Sleep Manipulation
    (Weapons like Addled Beers can put enemies to sleep), Vibration Manipulation (Weapons
    like Accursed Wail can create destructive impulses), Earth Manipulation (Weapons
    like Accursed Striker can create earthquakes), Shockwave Generation (Weapons like
    Accursed Slicers can create shockwaves), Summoning (Can summon Grimalkynes to
    the battle to aid himself with various commands), Invulnerability (To Fire, Water,
    Ice, Thunder, Tremor, Sound, Blunt Force and Wind depending on the tool being
    used), Instinctive Reaction (via Temporal Mantle). Resistance to Mind Manipulation
    (Immune to the mind controlling properties of Effluvium and the Frenzy Virus),
    Hunger (via Hunger Resistance), Matter Manipulation, Elements, Sound (via Earplugs),
    Wind (via Wind Proof), Tremor (Tremor Resistance prevents the Hunter from losing
    his footing when the earth quakes), Debuffs and Blights (Blight Resistance makes
    the Hunter resistant to blights, which are Status Effects, Iron Skin protects
    from defense down), Biological Manipulation (With certain armor. Resisted the
    Effilivium of Vaal Hazak), Sleep Manipulation (with energy drink and certain armor),
    Extreme Heat, Disease Manipulation (can overcome Shagaru and Gore Magala's Frenzy
    Virus), Blunt Force Injury (some accessories grants resistance to stunning), Perception
    Manipulation (can wear confusion, dark and bubbleblight off over time), Telepathy,
    BFR, Death Manipulation, Absorption, Dream Manipulation, Possession, Illusion
    Creation, Memory Manipulation, Darkness Manipulation, Soul Manipulation (Able
    to resist the effects of the Fatalis armor), Poison Manipulation (Able to wear
    out poisons), Statistics Reduction (Able to resist the effects of various effects
    like Fatigue by various items and armory), Empathic Manipulation (Able to resist
    the effects of the sounds of weaponry like Fatalis Menace and effects of Confusion),
    Magnetism Manipulation (Able to resist the effects of the magnetic effects of
    Gougarf by Laviente Blood), Acid Manipulation (Able to stand in a pool of acid
    for a period of time), Light Manipulation (Able to withstand light that can blind
    monsters without going blind), Bleeding (Via Bleeding Resistance), Power Nullification
    (Via Dragon Resistance and Nulberries), Stealing (Some skill grant resistance
    to Chameleos' stealing), Spatial and Temporal Attacks (Able to take safe hits
    from Alatreon, whose wings and horn can cut through space and time)
  source_ids: *id003
  decisive: true
  status: unverified
