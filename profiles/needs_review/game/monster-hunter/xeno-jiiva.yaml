    two large wings that it can use to fly by channeling bioenergy into them), Light
    Manipulation (Its body produces such great energy and bright light as to appear
    translucent from the inside out), Mind Manipulation (It manipulated dying Elder
    Dragons from the Old World to travel to the Everstream rather than the Rotten
    Vale), Statistics Amplification (It can enter Critical Mode to increase its energy
    attack output at the cost of making its body more vulnerable to damage), Energy
    Manipulation and Absorption (It is able to absorb, store and release energy from
    the Everstream), Heat Manipulation (It is able to release heat that turns Everstream
    crystals molten), Breath Attack (It can emit globules of bioenergy and thick,
    searing energy beams from its mouth), Fire Manipulation and Explosion Manipulation
    (It can leave scorched sections of terrain where its beams land, its beam attacks
    inflict Fire damage, and it can create immense blue explosions by plunging its
    energy-infused limbs into the ground), Status Effect Inducement (Its breath inflicts
    Fireblight, which inflicts damage over time), Resistance to Disease | All base
    abilities plus Greater Energy Manipulation (Its arsenal of energy attacks is vastly
    improved, now capable of intentionally overloading the ground with bioenergy,
    exhaling consecutive energy beams, and focusing its breath to generate a massive
    explosion), Healing (It can absorb energy from the earth to accelerate its metabolism,
    restoring its energy and recovering from its wounds), and Biological Manipulation
    (Its bioenergy control powers are far more precise than its immature form's, allowing
    it to reshape and drain entire ecosystems to suit its needs)
  source_ids: *id003
  decisive: true
