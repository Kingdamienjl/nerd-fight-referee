  section: power_scale
  axis: battle_iq
  text: 'Average (Has an unremarkable reaction to Dragon Element), High for Espinas
    Rare Species (Has a high weakness to Dragon Element) Standard Tactics: *Rage State:
    In combat, Espinas alternates between two states: standard and enraged. It begins
    encounters in its standard state where its attacks and movements are sluggish.
    After receiving enough damage, it transitions into its rage state, bright red
    blood vessels now visible through its skin. In its rage state, it becomes much
    faster, much stronger, and able to chain its attacks more fluidly. Its rage state
    lasts for several minutes before petering out and it must again receive a certain
    amount of damage to return to its rage state.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
