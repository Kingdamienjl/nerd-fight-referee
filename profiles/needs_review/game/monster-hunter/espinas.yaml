- id: claim-powers-and-abilities-809cb7d1
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Bodily Weaponry (Via its horn, jaws,
    foot talons, thorned carapace, and spiked tail) *Rage Power (It becomes incredibly
    strong and fast when enraged, even more so than a typical monster) *Sound Manipulation
    (Its roar can briefly stun hunters) *Large Size (Type 1 by length; a typical specimen
    is around 20 meters long) *Flight (It possesses two heavily armored wings that
    it can use to fly despite its weight) *Breath Attack (It can spit poisonous, paralyzing
    fireballs from its mouth) *Fire Manipulation and Explosion Manipulation (It can
    spit explosive fireballs from its mouth) *Poison Manipulation (Its bodily thorns
    and fireballs inflict Poison on foes, damaging their health over time) *Paralysis
    Inducement (Its fireballs temporarily paralyze those that they hit) *Status Effect
    Inducement (Its thorns and horn can inflict Poison, while its fireballs inflict
    Fireblight, Poison, and Paralysis) *Resistance to Poison and Fire All base abilities,
    minus Paralysis Inducement but plus: *Stronger Explosion Manipulation (As seen
    here) *Acid Manipulation (Monsters that can inflict Defense Down typically do
    so via biological acid) *Statistics Reduction (It can inflict Defense Down, a
    status that weakens one''s defenses, and Silked, a status that reduces one''s
    movement speed) All base abilities, plus: *Stronger Poison Manipulation (It possesses
    Extreme Poison, a far more virulent version of Poison that can kill hunters in
    seconds) *Smoke Manipulation (It can create lingering poison clouds) All base
    abilities, plus: *Stronger Fire Manipulation and Poison Manipulation (As seen
    here) *Air Manipulation (Its stomp attacks produce tremendous gusts of air that
    can damage hunters and reposition its patches of fire and poison)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
