- id: claim-powers-and-abilities-66bbcc57
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Bodily Weaponry (Conventional; Jaws,
    wings and tail) **Additional Limbs **Large Size (Type 0) **Winged Flight **Extrasensory
