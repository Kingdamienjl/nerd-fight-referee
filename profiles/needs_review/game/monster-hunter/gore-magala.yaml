    its pollen-like scales to detect threats. As it scatters more scales, Gore Magala''s
    senses will gradually become sharper) **Statistics Amplification (At the peak
    of their senses, can enter an Frenzy state where their strength and speed are
    increased) *Rage Power (It grows stronger and faster when enraged) *Sound Manipulation
    (Their powerful and loud roars can blow back airborne Hunters and stun them) *Disease
    Manipulation (Uses the Frenzy Virus) **Breath Attack, Energy Projection and Explosion
    Manipulation (Can spew the Frenzy Virus as explosive energy) **Limited Empathic
    Manipulation, Statistics Amplification and Death Inducement (Monsters inflicted
    with the virus become frenzied, have their speed and strength heightened and are
    able to transmit the virus to other beings, a majority of Monsters infected will
    die within a matter of daysMonster Hunter 4) **Statistics Reduction and Regeneration
    Negation (Low; Can inflict Frenzy Virus on Hunters, temporarily canceling their
    natural health recovery and severely reduces their defense after a short incubation
    period is completedMonster Hunter Rise: Sunbreak) *Transformation (The strongest
    of Gore Magala can enter a further enhanced state known as True Frenzy StateMonster
    Hunter Frontier Z) **Limited Earth Manipulation (Those in True Frenzy state can
    slam on the ground in front of it to cause rocks to erupt) **Explosion Manipulation
    (Strong individuals, as in those that can reach True Frenzy state, are able to
    unleash explosive Frenzy orbs in all directions surrounding it) Resistance to:
    *Water Manipulation (Resistant to Water-based attacks) *Ice Manipulation (Resistant
    to Ice-based attacks) All previous abilities enhanced such as: *Energy Projection
    (Can enhance its clawed wingarm swipe with Frenzy energy, from which a line of
    energy will erupt) **Damage Boost (Can build up more Frenzy energy in its clawed
    wingarms to unleash an enhanced attack) *Breath Attack (Can fire a beam of Frenzy
    energy while in Frenzy state) **Explosion Manipulation (Can fire a shot Frenzy
    energy that burst in two additional directions than the ones from standard''s
    Frenzy state. Can unleash a large and powerful explosion) All previous abilities
    enhanced such as: *Disease Manipulation, Biological Manipulation and Corruption
    (Type 1; Uses its Frenzy virus to reproduce by infecting other monsters, suitable
    host become a new Gore MagalaHAUNTING OF THE SUN "Monster Hunter Rise: Sunbreak")
    *Rage Power (Its enraged state is its standard Frenzy state, will enter a more
    enhanced state if enraged even furtherMonster Hunter Rise: Sunbreak) **Breath
    Attack (Can fire a beam of Frenzy energy in its enhanced Frenzy state) **Energy
    Projection (Can summon eruptions of Frenzy energy) *Transformation, Explosion
    Manipulation and Aura (Stronger individuals can transform into a more powerful
    state known as True Frenzy State, unleashing an explosive aura in its transformationMonster
    Hunter Frontier Z) All previous abilities enhanced and: *Rage Power, Explosion
    Manipulation and Transformation (When their anger reaches its peak, they''ll enter
    into their Risen state with an explosion and their body will begin to glow) Resistance
    to: *Disease Manipulation, Corruption and Madness Manipulation (Type 1; Overcame
    the Qurio virus, a disease that drives Monsters mad in addition to making them
    more powerful, and obtained greater power)'
