- id: claim-powers-and-abilities-67378fce
  section: abilities
  axis: hax
  text: Passive * Superhuman Physical Characteristics * Large Size (Type 3; Skeleton
    found in Rotten Vale dwarfs the entire ecosystem) * Longevity (Like many other
    Elder Dragons, Dalamadur is capable of becoming ancient in terms of age) Activated
    * Rage Power & Statistics Amplification (Becomes stronger, faster and more durable
    when enraged) * Sound Manipulation * Body Control (Has control over its metabolism
    and capable of increasing its internal temperatures) * Breath Attack (Capable
    of spewing out a massive flamethrower-like breath attack) * Earth Manipulation
    (Capable of digging, can cause earthquakes with its immense size, can cause crustal
    movement due to its immense size) * Energy Manipulation (Capable of utilizing
    a weird energy which can be found in its chest and is used for several of its
    attacks) * Energy Projection (Capable of utilizing the weird energy it possesses
    for several attacks) * Fire Manipulation (Many of its attacks have fiery properties
    to them and has high internal temperatures which can cause the ground it touches
    to become scorched and cause Fireblight) * Light Manipulation (Produces light
    from its chest vents) * Status Effect Inducement (Capable of causing Paralysis
    with its tongue when foes are to close to its head) * Possible Telekinesis (It's
    unknown how it calls down its meteors, but it's thought that they are falling
    stars called down by the Dalamadur) * Water Manipulation (Produces steam from
    its chest vents when enraged) * Explosion Manipulation and Biological Manipulation
    (Upon death, the body explodes) Resistance to * Fire, Water and Disease Manipulation
    Same as before, except * Body Control (Has no control over its metabolism and
    internal temperatures) Addition of * Magma Manipulation (Despite having no control
    over its internal temperatures, they're constantly higher than normal in some
    body parts and are even high enough to turn the ground into molten lava with those
    body parts)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
