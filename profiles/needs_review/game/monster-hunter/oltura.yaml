- id: claim-powers-and-abilities-a3cc8bb7
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity, Large Size (Type 2), Natural
    Weaponry (Teeth), Absorption (Can consume foes to gain strength and energy), Light
    Manipulation (Produces a light from its mouth) and Mind Manipulation (These lights
    cause Monsters to go mad and causes people to worship it as shown with Zellard
    and his cult even going to the point where Zellard would sacrifice himself for
    it), Statistics Amplification (Monsters affected by its lights become stronger),
    Smoke Manipulation and Weather Manipulation (Oltura caused a massive storm to
    appear over Hakolo Island) Resistance to Disease Manipulation (Monsters can overcome
    the Frenzy Virus) and Mind Manipulation (Is unaffected by its own lights which
    causes monsters like itself to go mad) All previous plus minus Large Size (Type
    2), Large Size (Type 0), Immortality (Type 3 and 4: Oltura is stated to be able
    to regenerate its broken wings, Oltura can revive itself if it perishes), Regeneration
    (High-Low), Paralysis Inducement (Oltura is capable of inflicting paralysis),
    Statistics Reduction (Oltura has shown to be able to reduce its opponent''s speed),
    Power Nullification (Oltura is capable of inflicting Skillseal which makes the
    inflicted unable to use their abilities, can also inflict Techseal which negates
    the actions of those inflicted), Passive Deconstruction and Aura (Oltura emmits
    an aura with causes objects to break down when close), Flight, Reactive Evolution
    (Oltura constantly evolves allowing it to develop new appendages or new abilities
    to best suit the situation), Elemental Manipulation (Of Fire, Water, Lightning
    and Ice), Durability Negation (Oltura''s Elemental Tempest attacks leave foes
    with 1 HP), Enhanced Mind Manipulation and Madness Manipulation (Type 2; The Dragon
    Element attacks the mind and causes the victim to go mad if exposed to too much,
    is also capable of affecting Ratha despite Ratha resisting it prior) Same as before
    plus, Resistance to Poison Manipulation, Sleep Manipulation, Paralysis Inducement,
    Death Manipulation, Perception Manipulation, Power Nullification, Statistics Reduction,
    Sound Manipulation and Status Effect Inducement (Is resistant to all status effects),
    Deconstruction (Can withstand its own Aura)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
