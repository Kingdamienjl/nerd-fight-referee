- id: claim-powers-and-abilities-4af1a64d
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Bodily Weaponry (Conventional; Jaws,
    wings and tail) **Large Size (Type 0) **Winged Flight *Sound Manipulation (Their
    powerful and loud roars can blow back airborne Hunters and stun themMonster Hunter
    Rise: Sunbreak) *Rage Power (It grows stronger and faster when enraged) *Fire
    Manipulation **Breath Attack (Can breathe out a stream of fire) **Aura and Limited
    Forcefield Creation (Can coat its body in a aura of flames which the mere heat
    of damages those who approach it. Its aura of flames protect it against bullets
    and arrowsMonster Hunter Rise: Sunbreak) *Explosion Manipulation (Can generate
    explosive powder that it can detonate by gnashing its teeth to create sparks)
    **Status Effect Inducement (Can inflict Blastblight, covering the opponent in
    explosive powder that will detonate if struckMonster Hunter Rise: Sunbreak) Resistance
    to: *Fire Manipulation and Extreme Heat (Highly resistant to Fire and is unaffected
    by its own heat or by standing in lava) *Disease Manipulation (Immune to the Frenzy
    Virus) All previous abilities enhanced and: *Rage Power, Explosion Manipulation
    and Transformation (When their anger reaches its peak, they''ll enter into their
    Risen state with an explosion and their body will begin to glow) Resistance to:
    *Disease Manipulation, Corruption and Madness Manipulation (Type 1; Overcame the
    Qurio virus, a disease that drives Monsters mad in addition to making them more
    powerful) *Superhuman Physical Characteristics **Bodily Weaponry (Conventional;
    Horns, jaws, claws and tail) **Large Size (Type 0) **Winged Flight *Sound Manipulation
    (Their powerful and loud roars can blow back airborne Hunters and stun themMonster
    Hunter Frontier Z) *Rage Power (It grows stronger and faster when enraged) *Ice
    Manipulation (Can manipulate Ice to cause eruptions and create large blocks to
    drop on the opponent) **Weather Manipulation and Temperature Manipulation (When
    enraged, it will cover the entire area in a intense blizzard) **Breath Attack
    (Expels a freezing breath) **Status Effect Inducement, Stamina Reduction (Can
    inflict Frostbite, causing stamina consumption to double and their max to decreaseMonster
    Hunter Frontier Z) Resistance to: *Ice Manipulation and Extreme Cold (Resistant
    to Ice-based attacks and is unaffected by freezing environments) *Disease Manipulation
    (Immune to the Frenzy Virus)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
