- id: claim-powers-and-abilities-9ec6e4ea
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Bodily Weaponry (Via its jaws, foreclaws,
    spikes, and tail) * Rage Power (It becomes stronger and faster when enraged) *
    Sound Manipulation (Its roar can briefly stun hunters) * Large Size (Type 1 by
    length; a typical specimen is around 17 meters long) * Animal Manipulation and
    Absorption (It can call Thunderbugs from the environment to lend it their generated
    electricity, and keep the gathered charge in its back shells to discharge later
    in attacks; furthermore, it can direct clouds of Thunderbugs to hit its foes)
    * Transformation and Electricity Manipulation (When it collects enough Thunderbugs,
    it enters a supercharged state, in which all of its attacks use electricity; it
    can use gathered charge to cause lightning to explode from its claw strikes, wreathe
    its whole body in lightning, or conjure lightning bolts) * Status Effect Inducement
    (Its electricity attacks induce Thunderblight, increasing the victim''s susceptibility
    to being stunned and disoriented) * Resistance to Electricity Manipulation * Superhuman
    Physical Characteristics * Bodily Weaponry (Via its jaws, foreclaws, spikes, and
    tail) * Rage Power (It becomes stronger and faster when enraged) * Sound Manipulation
    (Its roar can briefly stun hunters) * Large Size (Type 1 by length; a typical
    specimen is around 17 meters long) *Animal Manipulation and Absorption (In a similar
    fashion to its base species, it can call Dracophage Bugs from the environment
    to lend it their red energy, and keep the gathered charge in its back shells to
    discharge later in attacks; furthermore, it can direct clouds of Dracophage Bugs
    to generate vertical bolts of Dragon Element) *Transformation and Energy Projection
    (When it collects enough Dracophage Bugs, it enters a supercharged state, in which
    all of its attacks use Dragon Element; it can use gathered charge to rake foes
    with red energy or wreathe its whole body in red lightning, and it flings Dracophage
    Bugs with almost every physical attack) *Mind Manipulation and Madness Manipulation
    (Type 2; Dragon Element is said to attack the mind and drive monsters mad) * Status
    Effect Inducement (Its Dragon Element attacks induce Dragonblight) * Statistics
    Reduction and Power Nullification (Dragonblight nullifies the victim''s elemental
    and status attack properties) *Resistance to Dragon Element All base abilities
    to a greater extent, plus: * Empathic Manipulation (Its call causes nearby monsters
    to be driven into a frenzy) * Resistance to Body Puppetry (As an Apex Monster,
    it is immune to being ridden and manipulated by Hunters with Wirebugs) All base
    abilities to a greater extent, plus: * Statistics Amplification (Its charged state
    originates from itself, not from the Thunderbugs nesting in its body)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
