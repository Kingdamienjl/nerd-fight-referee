- id: claim-powers-and-abilities-1c734446
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Superhuman Physical Characteristics
    **Cyborgization (Likely Full; Has a completely cybernetic body, the only biological
    part is the brain, and we don''t know to what extent it''s been modified, although
    Doktor noted that her breasts might be organic) **Self-Sustenance (All Types;
    Cyborgs can operate for short periods of time without breathing, but in case they
    are unable to breathe for whatever reason, they are equipped with a supply of
    liquid oxygen in their bloodstream to keep them going. Their nanomachines should
    be unfathomably superior to those of Solid Snake) **Immortality (Type 2; As a
    member of the Winds of Destruction, she should scale vastly above two common cyborgs
    such as the Gemini, who survived after being sliced into pieces and decapitated.
    Doktor states that the Winds of Destruction are capable of surviving complete
    physical destruction and their brain can be transferred to another body if need
    be. their consciousness stays alive for a few minutes and they can communicate
    even after their brain has been turned into complete paste) **Nanotechnology **Enhanced
    Senses (Knew that Raiden was spying on her from far away) **Acrobatics (Hypermobility,
    Self Momentum, All-Terrain Mobility & Mid-Air Jump) *Martial Arts Mastery *Weapon
    Mastery *Social Influencing (Deception; manipulated Blade Wolf and framed Khamsin''s
    death) *Durability Negation, Vibration Manipulation & Matter Manipulation (High-Frequency
    weapons vibrate extremely fast, allowing them to disrupt atoms with ease by shrinking
    their electron clouds. High-Frequency weapons can also cause changes to their
    blades particles at a quantum level, as well as cause quantum decoherence in the
    plank scale) *Summoning (Can call in Dwarf Gekkos for assistance) **Explosion
    Manipulation (With Dwarf Gekkos) **Weapon Control (Her polearm can be constructed
    right on the spot from the arms of Dwarf Gekkos, this also grants it the ability
    to bend and change shape) **Additional Arms **Elasticity (with Gekko Arms) Resistance
    to: *Matter Manipulation & Vibration Manipulation (Can resist the effects of HF
    Blades due to having a body made of carbon nanotube fiber) *Empathic Manipulation
    & Pain Manipulation (Nanomachines can suppress hormones in order to suppress emotions,
    along with neutralizing pain, Sam stated that nanomachines grant resistance to
    fear and battlefield emotions, whilst still feeling them deep inside their mind,
    cyborgs are unaffected by them physically and are still fully capable of fighting)
    }}'
  source_ids: *id005
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
