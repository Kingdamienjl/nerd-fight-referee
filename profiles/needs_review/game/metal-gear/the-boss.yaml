      source_id: vsbattles-the-boss-metal-gear
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable. Notable Attacks/Techniques: * CQC: Unique and highly efficient
        martial arts allowing a soldier a variety of options while not denying them
        the use of weapons. It generally has the user taking a stance with a knife
        and a handgun; thus, he/she could grab/throw opponents in melee, threaten/execute
        people with the sharp blade or shoot down opponents who are otherwise outside
        the user''s range. CQC mostly focuses on grabs, throws, and other methods
        to disarm the target, allowing one to take down enemies without killing them
        or use them as a human shield. A skilled practitioner can even "chain" throws,
        allowing to rapidly neutralize an entire group of soldiers. The Boss was one
        of the creators of the technique and developed it while training with Naked
        Snake. She used these techniques to overcome several situations until Naked
        Snake surpassed her in their final confrontation. TheBossBreaksTheSnake.gif|The
