- id: claim-weaknesses-b77248a7
  section: weaknesses
  axis: weakness
  text: "Sam enjoys taunting his opponents more often than not, which can anger them\
    \ to the point of backfiring, even making them stronger. His body is almost entirely\
    \ human; thus, he could be killed by what would be just superficial damage to\
    \ cyborgs. He enjoys the thrill of a fight and may drag it out if he finds it\
    \ enjoyable. He can sometimes be arrogant and complacent, as he was so sure of\
    \ his victory over Armstrong and caught off guard when the latter continued to\
    \ persist. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
    1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"\
    text-align: left; |Notable Attacks/Techniques: |- | *Blade Mode: Like Raiden,\
    \ Sam can enter a \"Blade Mode,\" drastically increasing his reactions and combat\
    \ speed to the point that his surrounding time seems to slow down, allowing him\
    \ to deliver numerous precise attacks before his opponent can respond. *Quick\
    \ Draw: Murasama's sheath contained a rifle device with a loaded magazine and\
    \ a trigger below the sword's grip. Sam could use an explosive batt\u014Djutsu\
    \ by triggering this mechanism, capable of outpacing Armstrong's nanomachine enhancement\
    \ and cutting off his arm. It also sliced off Raiden's arm before he could react.\
    \ Quickdraw.gif|Sam using Quick Draw on Raiden *Vacuum Slashes: Sam's unnamed\
    \ technique. It creates numerous slashes in the air to cut through his opponents.\
    \ vacuumslashes.gif|Vacuum Slashes *{{Nihongo|Zandatsu|{{Ruby|\u65AC\u596A|\u3093\
    }}||\"cut and take\"}}: A special technique used by Sam to extract fuel cell electrolytes\
    \ from enemy cyborgs and unmanned weapons. By targeting their weak points in Blade\
    \ Mode, Sam can grab their power cores and instantly recharge his fuel cells and\
    \ health. |} Note: The equipment section also details the equipment he procured\
    \ during his raid at World Marshall's HQ, which occurred two years before the\
    \ main story of Metal Gear Rising. It is uncertain if he carries anything besides\
    \ his sword during the main game's events, and as such, the OP is advised to specify\
