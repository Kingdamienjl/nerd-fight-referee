    - field: standard_equipment
      value: '*High-Frequency Murasama: A 16th-century katana that had been passed
        down through the Rodrigues family for generations and was later upgraded with
        High-Frequency technology. Thanks to the exceptional quality of the original
        weapon, the High-Frequency Murasama boasts durability and cutting power far
        beyond that of standard HF blades. Its sheath also has a rifle mechanism and
        trigger that can be used to unsheathe the blade at high speeds for rapid attacks.
        *Jam Grenade: An electronic attack device that deploys countless metal strips
        along with an active jammer to temporarily disable radio communications and
        electronic equipment such as cameras, radar, missile guidance, and lock-on
        systems as well as stun AI controlled weapons and early model Cyborgs. *Red
        Phosphorus Grenade: A smoke grenade that burns phosphorous pentoxide and other
        additives to create a screen that impairs standard infrared sensors. *Electro-Magnetic
        Grenade: A disposable electronic attack device that emits electromagnetic
        pulses for a limited time, disabling any UGs and Cyborgs in the area. Because
        recent-model UGs and Cyborgs immediately shut down all circuitry when an electrical
        surge is detected, no permanent damage is done. *Repair Nanopaste Substance
        UGs and Cyborgs use to recover from sustained injuries, akin to how an average
        human regenerates from wounds but at a much faster rate. It can be used to
        restore Sam''s Life Gauge immediately. *Electrolyte Pack: A container of molten
        carbonate electrolytes used to power military cyborgs'' fuel cells. It can
        be used to restore Sam''s Fuel Cell Gauge immediately.'
      source_id: vsbattles-jetstream-sam-metal-gear
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted generally, Genius Combatant (Sam is a highly versatile fighter
        thanks to his mastery of "Rodrigues New Shadow School," a unique Brazilian-Japanese
        fighting style that includes ruthless efficiency swordsmanship, as well as
        his proficiency in hand-to-hand combat. Despite having substantially less
        enhancement, he defeated Raiden in their first encounter, severed Armstrong's
        arm during their duel and defeated Blade Wolf, a super computer with 90 Billion
        optical IQ and brain's processing speed of 60 megabytes/minute with no cybernetics
        whatsoever. Sam was skilled enough to kill ten armed mobsters with only his
        sword before receiving any enhancements years prior. Aside from his combat
        prowess, he also possesses a sharp wit and a remarkably sarcastic sense of
        humor, making accurate inferences about Raiden's past and hidden personality
        as Jack the Ripper and taunting his opponents into charging him recklessly
        before executing them)
      source_id: vsbattles-jetstream-sam-metal-gear
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Sam enjoys taunting his opponents more often than not, which can anger\
        \ them to the point of backfiring, even making them stronger. His body is\
        \ almost entirely human; thus, he could be killed by what would be just superficial\
        \ damage to cyborgs. He enjoys the thrill of a fight and may drag it out if\
        \ he finds it enjoyable. He can sometimes be arrogant and complacent, as he\
        \ was so sure of his victory over Armstrong and caught off guard when the\
        \ latter continued to persist. {| class=\"mw-collapsible mw-collapsed\" align=\"\
        center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
        \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques: |-\
        \ | *Blade Mode: Like Raiden, Sam can enter a \"Blade Mode,\" drastically\
        \ increasing his reactions and combat speed to the point that his surrounding\
        \ time seems to slow down, allowing him to deliver numerous precise attacks\
        \ before his opponent can respond. *Quick Draw: Murasama's sheath contained\
        \ a rifle device with a loaded magazine and a trigger below the sword's grip.\
        \ Sam could use an explosive batt\u014Djutsu by triggering this mechanism,\
        \ capable of outpacing Armstrong's nanomachine enhancement and cutting off\
        \ his arm. It also sliced off Raiden's arm before he could react. Quickdraw.gif|Sam\
        \ using Quick Draw on Raiden *Vacuum Slashes: Sam's unnamed technique. It\
        \ creates numerous slashes in the air to cut through his opponents. vacuumslashes.gif|Vacuum\
        \ Slashes *{{Nihongo|Zandatsu|{{Ruby|\u65AC\u596A|\u3093}}||\"cut and take\"\
        }}: A special technique used by Sam to extract fuel cell electrolytes from\
        \ enemy cyborgs and unmanned weapons. By targeting their weak points in Blade\
        \ Mode, Sam can grab their power cores and instantly recharge his fuel cells\
        \ and health. |} Note: The equipment section also details the equipment he\
        \ procured during his raid at World Marshall's HQ, which occurred two years\
        \ before the main story of Metal Gear Rising. It is uncertain if he carries\
        \ anything besides his sword during the main game's events, and as such, the\
        \ OP is advised to specify if he has access to it during a match. ==Gallery==\
