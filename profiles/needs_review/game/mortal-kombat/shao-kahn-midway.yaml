      \ who was created by an Edenian sorceress. His initial purpose was to wander\
      \ the realms and keep an eye out for super powered warriors: Shang Tsung, Shao\
      \ Kahn, even Raiden. The sorceress had a vision that eventually there would\
      \ be too many of these superpowered warriors and eventually will cause Armageddon\u201D\
      \ Oneshot Jax and several other kombatants during the massive battle in Edenia.Mortal\
