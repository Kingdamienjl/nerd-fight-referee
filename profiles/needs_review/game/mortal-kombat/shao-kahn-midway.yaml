      \ superior to a resurrected Onaga.Onaga still needed to merge the Kamidogu to\
      \ achieve ultimate power over the Elder Gods, as seen in Li Mei's Ending. Fought\
      \ against an enraged Liu KangMortal Kombat 3 - Liu Kang's Ending)Downscales\
      \ 8 Universes | Low Multiverse level (While not as strong as before, was considered\
      \ to be one of the super-powered warriors by the time of Armageddon.Mortal Kombat:\
