        a basic attack, stacking up to 6 times. * Leap Strike: Jax dashes to the target
        unit or allied ward. If his target is an enemy, he deals them physical damage.
        * Empower: Jax''s next basic attack or Leap Strike within 10 seconds deals
        bonus magic damage. Empower resets Jax''s autoattack timer. * Counter Strike:
        Jax enters a defensive stance for up to 2 seconds, reducing physical damage
        from basic attacks by 100% and area of effect abilities by 25% for the duration.
        At the end of the duration or if Counter Strike is activated again, Jax stuns
        all nearby enemies for 1 second and deals them physical damage, increased
        by 20% for each attack dodged, up to a maximum 100% increase. * Grandmaster''s
        Might: Jax deals bonus magic damage on every third basic attack within 2.5
        seconds. When activated, Jax gains bonus armor and magic resistance for 8
        seconds. Category:DarkNoble Category:Tier 6'
