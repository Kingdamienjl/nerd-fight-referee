        as a side effect), Resistance to Soul Manipulation and Mind Manipulation (Trapped
        inside him are the many souls that he has consumed, likely numbering in the
        millions or billions. Ermac, who has a larger amount of souls in him, was
        able to resist Takeda's attempts to read his mind due to the latter being
