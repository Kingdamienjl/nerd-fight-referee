    claw strikes), Stealth Mastery (Although he usually relies on his invisibility,
    he is also well known for being a capable spy and assassin without cloaking himself,
    preferring to observe/strike from hidden vantages), Enhanced Senses (Has a good
    sense of smell), Surface Scaling (Can adhere to surfaces with his reptilian hands
    and feet), Acrobatics (Hypermobility, Self-Momentum, Surface Running. Can do cartwheels
    from low awkward stances, run off of walls before leaping off of them, etc.),
    Can interact with his past self, but will share with it irreparable damage and
    death (As shown throughout MK11, but he should scale due to not existing outside
    the normal laws of time), Adhesive Manipulation (Can generate slime from his body,
    turning it into a projectile or as a propellant when sliding on it), Acid Manipulation
    (Can spit acid in varying amounts, from a small globule to an acid spray that
    can create pools. When applied in large amounts, it is corrosive enough to melt
    metal and an entire human body. Can create a wall of acidic mist that functions
    as a shield), Invisibility (Can enter several states of invisibility, the highest
    state completely cloaks him without reflecting light), Perception Manipulation
    (Basilisk appears to boost his perception, making his opponent appear slower while
    being faster than them), Aura (Can emit a noxious cloud of poison gas that intoxicates
    anyone too close to him)
  source_ids: *id003
  decisive: true
