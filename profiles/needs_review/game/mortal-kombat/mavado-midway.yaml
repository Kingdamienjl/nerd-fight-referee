  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Grapple Hook Strike: Mavado catapults
    himself with his ropes at the opponent, kicking his opponent. *Change Sides Hook:
    Mavado uses his ropes to evade the opponent''s attack by swinging to the side.
    *Anger Management: A power-up move that adds strength to Mavado''s physical attacks.
    *Low Grapple Slide: Mavado flies forward with a low kick, using a grapple hook
    to anchor himself. This attack causes the opponent to trip face down to the ground.
    *Escape Grapple: Mavado uses his grapple hooks to pull himself backward and out
    of harm''s way.'
