    - field: intelligence
      value: "In general= Above Average. Part of the generation of the Lin Kuei that\
        \ utilizes modern technology, such as hover jets and surveillance devices.\
        \ Thorougly studied the culture of his ancestors, a lost race of people with\
        \ master over the cold, through the ancient ruins of a holy structure belonging\
        \ to said race and then he concluded from his thorough study that he and Frost\
        \ are their descendants. |-|Kombat= Gifted. Seemingly at his fifties or older,\
        \ Sub-Zero is a powerful warrior with dozens of years of experience. He possesses\
        \ secrets passed down to him by his elder brother that are said to hold the\
        \ key to stopping Shinnok. He has mastered three fighting styles: Shotokan,\
        \ Dragon Kung Fu, and Yuan Yang (a fighting style with kicks that are reputed\
        \ to be effective and thus adopted by many Chinese styles, a style whose attacks\
        \ have nuances that he's knowledgeable on, and an art he taught extensively\
        \ to his student Frost), plus he is versed in the technique of performing\
        \ a Neijin in the Yuan Yang and Dragon Kung Fu styles, not to mention he is\
        \ experienced enough to teach this technique properly to his apprentices.\
        \ He is also proficient in swordsmanship that gives him the talents to use\
        \ his Kori blade. What truly cements him as a skilled warrior is his ability\
        \ to switch between multiple fighting styles, which forces opponents to keep\
        \ predicting his ever changing fighting style or fail to catch up and be defeated.\
        \ With his strength and skill ever increasing, Sub-Zero can accelerate his\
        \ martial growth by developing new powerful moves within his fighting style\
        \ with the Medallion's energy. Also, he is a trained Lin Kuei assassin who\
        \ can evade capture from the Cyber Lin Kuei, plan stealth attacks by using\
        \ his allies as distractions to deliver a sneak attack with \u201Cstartling\
        \ perfection\u201D in his moves, etc. Sub-Zero possesses the abilities required\
        \ to be a powerful cryomancer. He has the experience garnered from years of\
        \ training to hone this ability to freeze and possesses the mental concentration\
        \ required to form an intricately designed sword made of ice. He has perfected\
        \ moves like his Slide which he deems a \u201Cnovice move\u201D and a \u201C\
        basic maneuver\u201D that he has progressed beyond and perfected many years\
        \ ago. He is also a great leader who rebuilt the Lin Kuei and organized it\
        \ as the superior ninja clan in and beyond its territory in Arctika, training\
        \ a legion of fearsome but honorable assassins dedicated to Earthrealm's defense.\
        \ They have a feared reputation with their rival clans, such as the Tengu\
        \ clan whose leader Wu Lae regards them as warriors so powerful and talented\
        \ that he mistook Taven (who defeated his entire clan) for a Lin Kuei due\
        \ to his power and fighting skill. So that says a lot about how the Grandmaster\
        \ of the Lin Kuei trained his men and women."
      source_id: vsbattles-younger-sub-zero-midway-mortal-kombat
      provider_id: vsbattles
      authority: high
      confidence: 0.75
