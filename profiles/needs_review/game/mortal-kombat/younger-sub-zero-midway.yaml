    - field: powers_and_abilities
      value: "Base= Sub-Zero's powers in his Base form., Superhuman Physical Characteristics,\
        \ Martial Arts (Possesses unrivaled mastery of Shotokan and Dragon Kung Fu\
        \ fighting styles), Weapon Mastery (A skilled wielder of his ice scepter,\
        \ which wields the power of ice like him), Acrobatics (Very agile fighter\
        \ capable of doing an aerial somersault during kombat), Stealth Mastery (Trained\
        \ in the art of stealth and subtlety as a Lin Kuei assassin, such as sneak\
        \ attacks, evading capture, etc.), Ice Manipulation (A modern descendant of\
        \ the ancient race of Cryomancers, he inherits their ability to manipulate\
        \ ice and cold), Breath Attack (In the same vein as Scorpion but without the\
        \ hellfire, Sub-Zero has a freezing breath in his Frosty! Fatality), Explosion\
        \ Manipulation (Can form an explosive ice orb and throw it as a projectile\
        \ in his Ice Grenade Fatality), Statistics Amplification via his [https://www.youtube.com/watch?v=undHsHwWAJI&t=571s\
        \ Brutality ability], Armageddon= All previous abilities enhanced, Flight\
        \ (Restricted flight via the air kombat system, allowing fighters to [https://www.youtube.com/watch?v=yNmg66B-SSQ&t=74s\
        \ engage in prolonged kombat with others while airborne]), Minor Reality Warping\
        \ (All kombatants will grow as strong as what WoG calls \u201Csuperpowered\
        \ warriors\u201D or \u201Csuperior kombatants\u201D and gain the ability to\
        \ tap into the forces that bind the realms through sheer kombat. In practice,\
        \ this allows them to weaken the bond between realms whenever they engage\
        \ in battle, said weakening becoming stronger the more intense the battle\
        \ they're participating in is, like a war. This will eventually undo all realms\
        \ and destroy existence through an accumulated effort, as in more kombatants\
        \ must fight to eventually destroy the realms.), Air Manipulation, Aura (Explosive.\
        \ His Ice Shaker attack surrounds him with a super-chilled barrier that flash-freezes\
        \ anyone within its range), Weapon Creation (By freezing surrounding water\
        \ vapor into solid ice, he can form complex objects like his sword or Kori\
        \ Blade), Chi Manipulation (Can channel energy from his medallion to perform\
        \ a Neijin, which boosts his attack power for a limited duration), Statistics\
        \ Amplification (His ancestral armor speaks to him on a spiritual level, perhaps\
        \ the spirits of his ancestors, while guiding and strengthening his blows),\
        \ Resistances= Resistances. Applies to both keys., Ice Manipulation (Possessed\
        \ the power to control the Dragon Medallion, which freezes the weak and unskilled\
        \ with their own ability, like Frost), The effects of being exposed to the\
        \ dark energies permeating the torturous fifth plane of the Netherrealm, Transmutation\
        \ (Endured staying in the Netherrealm's fifth plane, which is said to twist\
        \ any being into a vicious monster by twisting their soul, like what happened\
        \ to Drahmin. For instance, Sareena could not sustain and maintain her human\
        \ form after a fight in the fifth plane drained her while the fifth plane\
        \ was already twisting her soul, causing her to lose control of her human\
        \ form and revert back to her demonic form), Finishers= Most of these finishers\
        \ are comical and nonsensical to the lore, so they aren't included in their\
        \ base set of powers. But one can choose to include them in VS threads., Shapeshifting\
        \ (Can turn into a polar bear in his Animality), Age Manipulation (Can turn\
        \ his opponent into a harmless baby with a Babality)"
