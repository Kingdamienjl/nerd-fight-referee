  section: equipment
  axis: equipment
  text: Sub-Zero's standard equipment that he always keeps on himself. *The Dragon
    Medallion that he claimed from Sektor after defeating him in a fight that would
    determine the Lin Kuei's future leadership. It is a source of great power. *His
    ancestral armor which he acquired during the events of Mortal Kombat Deception.
    It speaks to him on a spiritual level as it guides and strengthens his blows.
    Optional equipment used by Sub-Zero who made use of these items a few times. *A
    business card introducing himself as the Lin Kuei assassin named Sub-Zero that
    he presented to Liu Kang and Kung Lao.Mortal Kombat 2 Collector's Edition Comic
    Book, page 13 *Sub-Zero once wielded an ice scepter in MK4 as his weapon. It freezes
    enemies upon contact and can unleash a freezing wave when slammed on the floor.
    Stuff that Sub-Zero can conjure into battle or outside of it. *Using his agility
    and his cryomancy, Sub-Zero can hop back to leave an immobile ice statue of himself.
    Known as his Ice Clone, it freezes anyone who touches it. *His enhanced Kori abilities
    have given him the ability to form a Kori Blade by freezing the surrounding water
    vapor for immediate and convenient access to a weapon.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
