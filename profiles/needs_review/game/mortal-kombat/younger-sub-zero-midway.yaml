- id: claim-powers-and-abilities-ad687761
  section: abilities
  axis: hax
  text: "Sub-Zero's powers in his Base form. *Superhuman Physical Characteristics\
    \ *Martial Arts (Possesses unrivaled mastery of Shotokan and Dragon Kung Fu fighting\
    \ styles) *Weapon Mastery (A skilled wielder of his ice scepter, which wields\
    \ the power of ice like him) *Acrobatics (Very agile fighter capable of doing\
    \ an aerial somersault during kombat) *Stealth Mastery (Trained in the art of\
    \ stealth and subtlety as a Lin Kuei assassin, such as sneak attacks, evading\
    \ capture, etc.) *Ice Manipulation (A modern descendant of the ancient race of\
    \ Cryomancers, he inherits their ability to manipulate ice and cold) **Breath\
    \ Attack (In the same vein as Scorpion but without the hellfire, Sub-Zero has\
    \ a freezing breath in his Frosty! Fatality) **Explosion Manipulation (Can form\
    \ an explosive ice orb and throw it as a projectile in his Ice Grenade Fatality)\
    \ *Statistics Amplification via his Brutality abilityMortal Kombat: Shaolin Monks\
    \ All previous abilities enhanced, plus the following: *Flight (Restricted flight\
    \ via the air kombat system, allowing fighters to engage in prolonged kombat with\
    \ others while airborneMortal Kombat: Armageddon's Teaser Trailer\u201CLong ago,\
    \ the Gods foresaw that the fury of Mortal Kombat would lead to the destruction\
    \ of the realm. [...] They said that battle will not be confined to the ground...\u201D\
    ) *Minor Reality Warping (All kombatants will grow as strong as what WoG calls\
    \ \u201Csuperpowered warriors\u201D or \u201Csuperior kombatants\u201D and gain\
    \ the ability to tap into the forces that bind the realms through sheer kombat.Mortal\
    \ Kombat: Unchained - Blaze's biography\u201CFor millennia I existed for one purpose...\
    \ to monitor the strength of the world's kombatants. My creator foresaw a time\
    \ when warriors would become too powerful and threaten all of existence.\u201D\
    Mortal Kombat: Unchained - Blaze's biography\u201CDuring my quest, I was overpowered\
    \ by holy men who served Onaga. For ages I was bound by their sorcery and oblivious\
    \ to the growing strength of Ki Chao warriors. Finally free, I have emerged to\
    \ discover beings whose power and numbers exceed that which the realms can sustain.\u201D\
    Mortal Kombat: Armageddon - Blaze's biography\u201CI searched the realms to find\
    \ a concentration of warriors with the ability to tap into the forces that bind\
    \ the realms. What I discovered alarmed me! The number of kombatants had grown\
    \ since I last walked among them. [...] I could feel the strain upon the realms\
    \ and concluded that the time had come: I would awaken the brothers and begin\
    \ the second phase of the quest.\u201D In practice, this allows them to weaken\
    \ the bond between realms whenever they engage in battle, said weakening becoming\
    \ stronger the more intense the battle they're participating in is, like a war.\
    \ This will eventually undo all realms and destroy existence through an accumulated\
    \ effort, as in more kombatants must fight to eventually destroy the realms.Mortal\
    \ Kombat: Armageddon - Konquest ModeBlaze: \u201CYour mother, my creator, foresaw\
    \ the coming Armageddon: that through Mortal Kombat, warriors would unknowingly\
    \ tap into the very forces that make reality possible. Those warriors are in the\
    \ crator [sic] below, engaged in Mortal Kombat.\u201DTaven: \u201CAll of them?\
    \ But with that many fighting in one place...\u201DBlaze: \u201CThis crater will\
    \ be the origin of the Apocalypse unless something is done to prevent it.\u201D\
    ) *Air Manipulation, Aura (Explosive. His Ice Shaker attack surrounds him with\
    \ a super-chilled barrier that flash-freezes anyone within its rangeMortal Kombat:\
    \ Deadly Aliiance - Sub-Zero's Konquest ModeAn interesting new attack the medallion\
    \ has unlocked for Sub-Zero is his Ice Shaker attack. Both offensive and defensive,\
    \ this attack surrounds him with a super-chilled barrier that flash-freezes any\
    \ opponent within range.) *Weapon Creation (By freezing surrounding water vapor\
    \ into solid ice, he can form complex objects like his sword or Kori BladeMortal\
    \ Kombat: Deadly Aliiance - Sub-Zero's Konquest ModeThe Dragon Medallion has amplified\
    \ Sub-Zero's freezing abilities, or Kori, in such a way that he can form complex\
    \ objects out of solid ice from surrounding water vapor. One such object is his\
    \ Kori Blade.) *Chi Manipulation (Can channel energy from his medallion to perform\
    \ a Neijin, which boosts his attack power for a limited durationMortal Kombat:\
    \ Deadly Aliiance - Sub-Zero's Konquest ModeBy channeling energy from the medallion\
    \ through his Dragon fighting style, Sub-Zero is able to perform a Neijin. A Neijin\
    \ allows Sub-Zero to increase the power of his attacks for a limited period of\
    \ time.) *Statistics Amplification (His ancestral armor speaks to him on a spiritual\
    \ level, perhaps the spirits of his ancestors, while guiding and strengthening\
    \ his blowsMortal Kombat: Deception - Konquest Mode's backwards messageSub-Zero's\
    \ ancestral armor responds to him on a spiritual level.Mortal Kombat: Deception\
    \ - Sub-Zero's ending) Resistances. Applies to both keys. *Ice Manipulation (Possessed\
    \ the power to control the Dragon Medallion, which freezes the weak and unskilled\
    \ with their"
