  attack_potency:
    text: "Building level+ (Comparable to the weaker Black Dragon members, like Jarek\
      \ and Kobra. Comparable to Jade1.96 Tons of TNT) | Low Multiverse level (Due\
      \ to the kombatants of the realms inevitably growing as powerful as \"superpowered\
      \ warriors\" like Shao Kahn and Raiden, allowing even lesser fighters to fight\
      \ equally with them in Armageddon,Mortal Kombat: Armageddon - Blaze's Trading\
      \ Kard (Bio) John Vogel: \u201CBlaze is a firespawn who was created by an Edenian\
      \ sorceress. His initial purpose was to wander the realms and keep an eye out\
      \ for super powered warriors: Shang Tsung, Shao Kahn, even Raiden. The sorceress\
      \ had a vision that eventually there would be too many of these superpowered\
      \ warriors and eventually will cause Armageddon\u201D such as Jax fighting Quan\
      \ Chi, despite the former being overwhelmed by Tarkatan hordes before his death\
      \ in Deadly Alliance.Mortal Kombat: Deadly Alliance - Jax's biography \u201C\
      During our assault on the Deadly Alliance, we were overwhelmed by Tarkatan hordes.\
      \ The last thing I remember seeing was Raiden blasting his way into the main\
      \ hall. I was later resurrected by Onaga...\u201D Scaling to Blaze who can displace\
      \ storm clouds that he formed when the Pyramid of Argus that he was on burst\
      \ from the earth, since Argus anticipated a plan that would make use of the\
      \ kombatants' growing power,Mortal Kombat: Armageddon - Intro cinematic Narrator:\
      \ \u201CThere have been many powerful warriors throughout the millennia. But\
      \ ages of Mortal Kombat have begun to tear at the fabric of the realms. The\
      \ critical point has finally been reached. It was foreseen that kombatants would\
      \ one day grow too powerful and too numerous. If left unchecked, their intensifying\
      \ kombat would weaken and shatter the realms... and bring about... the apocalypse.\
      \ The Elder Gods demanded a safeguard be put in place to avoid total destruction.\
      \ One that would make use of the kombatants' insatiable bloodlust. Like moths\
      \ to flame, they would be drawn to battle.\u201D plus Blaze certainly believed\
      \ that he could be defeated by any one of them,Mortal Kombat: Armageddon - Konquest\
      \ Mode Blaze: \u201CThe quest has been corrupted. All did not go exactly as\
      \ my creator had foreseen it. You are in the wrong location. I will transport\
      \ you to the rim of the crater where the final battle will take place. The quest\
      \ will conclude when one of you defeats me there in kombat. We must make haste!\
      \ Many warriors are gathering. If I am defeated by one of them, they will steal\
      \ the prize and the true purpose of the quest will have failed. Armageddon will\
      \ be upon you all.\u201D meaning they scale to BlazeMassively downscales 8 Universes)"
