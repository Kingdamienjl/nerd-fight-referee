- id: claim-powers-and-abilities-ca60349d
  section: abilities
  axis: hax
  text: "Darrius' powers in his Base form in addition to: *Superhuman Physical Characteristics\
    \ *Martial Arts (A martial artist skilled in the figthting styles of Shinto Ryu,\
    \ Goju Ryu, and Leopard to fight competently in kombat) *Weapon Mastery (Wields\
    \ a pair of deadly bladed gauntlets to inflict grievous injuries in close quarters\
    \ kombat) *Stealth Mastery (While not actively attacking Orderrealm's authorities\
    \ and enforcers, Darrius stays hidden from them to plot his schemesMortal Kombat:\
    \ Deception - Darrius' first biographyMortal Kombat: Deception - Darrius' bio\
    \ kard) *Acrobatics (Can perform various acrobatic maneuvers, execute jump/aerial\
    \ attacks, etc.) *Energy Manipulation (His attacks have blue energy which has\
    \ some propulsive force to it. Can fire a harmful orb of blue energy) All previous\
    \ abilities enhanced, plus the following: *Flight (Restricted flight via the air\
    \ kombat system, allowing fighters to engage in prolonged kombat with others while\
    \ airborneMortal Kombat: Armageddon's Teaser Trailer\u201CLong ago, the Gods foresaw\
    \ that the fury of Mortal Kombat would lead to the destruction of the realm. [...]\
    \ They said that battle will not be confined to the ground...\u201D) *Minor Reality\
    \ Warping (All kombatants will grow as strong as what WoG calls \u201Csuperpowered\
    \ warriors\u201D or \u201Csuperior kombatants\u201D and gain the ability to tap\
    \ into the forces that bind the realms through sheer kombat.Mortal Kombat: Unchained\
    \ - Blaze's biography\u201CFor millennia I existed for one purpose... to monitor\
    \ the strength of the world's kombatants. My creator foresaw a time when warriors\
    \ would become too powerful and threaten all of existence.\u201DMortal Kombat:\
    \ Unchained - Blaze's biography\u201CDuring my quest, I was overpowered by holy\
    \ men who served Onaga. For ages I was bound by their sorcery and oblivious to\
    \ the growing strength of Ki Chao warriors. Finally free, I have emerged to discover\
    \ beings whose power and numbers exceed that which the realms can sustain.\u201D\
    Mortal Kombat: Armageddon - Blaze's biography\u201CI searched the realms to find\
    \ a concentration of warriors with the ability to tap into the forces that bind\
    \ the realms. What I discovered alarmed me! The number of kombatants had grown\
    \ since I last walked among them. [...] I could feel the strain upon the realms\
    \ and concluded that the time had come: I would awaken the brothers and begin\
    \ the second phase of the quest.\u201D In practice, this allows them to weaken\
    \ the bond between realms whenever they engage in battle, said weakening becoming\
    \ stronger the more intense the battle they're participating in is, like a war.\
    \ This will eventually undo all realms and destroy existence through an accumulated\
    \ effort, as in more kombatants must fight to eventually destroy the realms.Mortal\
    \ Kombat: Armageddon - Konquest ModeBlaze: \u201CYour mother, my creator, foresaw\
    \ the coming Armageddon: that through Mortal Kombat, warriors would unknowingly\
    \ tap into the very forces that make reality possible. Those warriors are in the\
    \ crator [sic] below, engaged in Mortal Kombat.\u201DTaven: \u201CAll of them?\
    \ But with that many fighting in one place...\u201DBlaze: \u201CThis crater will\
    \ be the origin of the Apocalypse unless something is done to prevent it.\u201D\
    )"
  source_ids: *id003
  decisive: true
  status: unverified
