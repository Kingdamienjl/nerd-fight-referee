        flew towards Johnny Cage. After defeating Fire God Liu Kang, he was nowhere
        to be seen until reappearing behind him. Frequently uses stealth in combination
        with his deceptive shapeshifting, catching his enemies off guard), Extrasensory
        Perception (Can sense the presence of souls several meters away from him),
        Acrobatics, Magic (Arguably one of the most skilled sorcerers in MK), Flight
        (True flight), Longevity (His long life comes from the life force that he
        steals), Social Influencing (Shang Tsung is well known for his trickery and
        deceit towards others), Soul Manipulation (His soul magic is his most versatile
        ability, as most of his abilities come from or are a side effect of soul magic.
        By itself however, he uses it to steal and consume souls, usually against
        a vulnerable opponent. Stealing souls increases his overall power, restores
        his health, absorbs its memories [thus absorbing their knowledge], and absorbs
        their "attributes" and powers, allowing him to mimic their abilities and appearance.
        When he fully consumes someone's soul, he can absorb their powers to his own.
        Can weaponize souls in various ways), Shapeshifting (Usually linked to his
        soul stealing, but he can shapeshift into almost anyone without stealing a
        soul beforehand. Can also turn into a giant, fire serpent), Energy Manipulation
        (Linked to his soul magic. He can fire projectiles made of pure soul energy
        and conjure energy constructs, including shields and chains), Fire Manipulation
        (While not as versatile as his soul magic, it is one of his more prominent
        magic and his main element. His fire is hot enough to melt through a Lin Kuei
        cyborg's armor. Stated to use hellfire as well), Magma Manipulation (Can manipulate
        scalding lava as an attack), Explosion Manipulation (Can detonate his summoned
        corpses with a blast of fire. His Scatter Souls attack involves him crushing
        a soul urn, causing it to explode), Summoning (Can summon a variety of familiars,
        including a massive fire serpent, undead Shaolin monks, and bloated corpses
        from the Flesh Pits), Teleportation (Can teleport by himself and swap his
        position with others. Can create a fiery portal that allows him to travel
        between realms and banish opponents, and a lava portal that scorches those
        who pass through it before teleporting them), Telekinesis (Likely a side effect
        of him gaining so much souls, Shang Tsung has the ability to manipulate opponents
        and objects from a short distance), Curse Manipulation (Can use his scrolls
        to apply a curse on his opponent, one that decreases their attack damage and
        another that increases the damage they take from him), Sealing (Sometimes,
        the souls he takes are contained in his urn rather than immediately consuming
        them), Healing (Low-Mid. Healed Kabal from third degree burns all over his
        body. Also healed himself after sustaining a puncture wound in his chest from
        Baraka's arm blade), Resurrection (Can resurrect others from their souls,
        allowing them to regain a pristine physical form. This usually puts them under
        Shang Tsung's control), Intangibility (Can phase his hands into someone to
        rip their soul out Can also turn into a wisp of green energy), Resistance
        to Soul Manipulation and Mind Manipulation (Trapped inside him are the many
