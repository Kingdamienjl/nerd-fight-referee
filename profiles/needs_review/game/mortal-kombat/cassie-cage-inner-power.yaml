    - field: weaknesses
      value: 'Loved ones have to be in danger for her to go into the Inner Power state
        Notable Attacks/Techniques: *Single Shot: Cassie draws one of her handguns
        and fires off a single round at her opponent. *Akimbo: Cassie draws both of
        her handguns and fire off six shots rapidly. *Glow Kick: Cassie launches a
        high kick that carries her into the air while her body glows with green Shadow
        Energy. *Diving Glow Kick: Cassie follows up with a dive kick. *Getaway Flip:
        Cassie cartwheels back, kicking her opponent. *Power Kick: Cassie does a full
        backflip and hits her opponent with both feet. *(Air) Bullet Barrage: Cassie
        gains the ability to shoot her BA pistols while in the air *Nut Kracker: Cassie
        drops to her knees and slams her cupped fists into her opponent''s groin.
        *Take Down: Cassie tackles her opponent, knocks them to the ground and punches
        them in the face before getting off them. *Bow Breaker: Cassie snatches her
        opponent''s arm, breaks it, then flips them over into the opposite position.
        *Air Power Slam: Cassie grabs her opponent in midair and flips them over while
        kicking them down with both feet. The enhanced version adds more damage. *Air
        Assault: Cassie calls on her earpiece and has a missile drop down on the arena
        at either close, medium or far ranges. *Target Paint: Cassie locks onto her
        enemy with a green laser sight to hit them with the missile. *The American
        Way: Cassie salutes her opponent while trumpet horn flares. *Dual Wielding:
        Cassie quickdraws two guns and shoots one round from both of them. She can
        charge the bullets with green energy to increase the damage the longer she
        charges it. *Ball Buster: Cassie does a low kick to her opponent''s groin,
        stunning them. *Shoulder Charge: Just like Shao Kahn, Cassie charges at the
        opponent with her shoulder with green energy. *Flying Glow Kick: Cassie holds
        on to her flying drone and uses it to propel her towards the opponent with
        an energy kick. *Control BLB-118: Cassie totes gains the ability to control
        BLB-118 with her celly and BLB-118, like, gets a bunch of new moves. **BLB-118
        fires a wicked blue laser down at its opponent. **BLB-118 emits an electric
        burst that electrocutes whatever comes in contact with it. **BLB-118 drops
        an explosive green energy bomb. *Kneecappin'': Cassie flips forward and fires
        multiple shots on her opponent while she''s airborne. *Flippin'' Out: Cassie
        gains the ability to perform a super cool flip and unload some quick shots.
        *Air BLB-181 Advance: Cassie gains the ability to grab onto BLB-118 and peace
        out away from her opponent. *BLB-118 Bullet Ricochet: Cassie gains the ability
        to ricochet bullets off her robo pal BLB. *BLB-118 Energy Bounce: Cassie gains
        the ability to bounce energy off her buddy BLB. *BLB-118 Energy Burst: BLB
        gains the ability to wow out and send a burst of energy outward. *BLB-118
        B#tchin'' Bubble: BLB creates a wick energy bubble that totally f#cks up her
        opponent with damage-over-time when they are in the bubble. *Testi-Kill: Cassie
        throws a flare at her opponent, blinding them, before doing a split and delivering
        a powerful punch to their groin, making it explode (if male) or strain (if
        female). While her opponent goes to relieve their pain, Cassie takes out her
        handguns and smashes both sides of their skull (as well as the jaw) inwards,
        breaking it and stunning them. Cassie then shoots two bullets into their eye
        sockets, sending them blasting off. *Fatal Blow: Cassie flies towards the
        opponent with her drone and stuns them with an energy divekick. She punches
        them thrice with energy coated fists before whipping them in the face with
        the butt of her pistol. She pulls out another pistol and whips them again
        before shooting them in the knees. She then grabs the opponent and shoots
        them three times with energy bullets. ==Gallery== Cassie cage.png green-cassie-cage.jpg|Inner
