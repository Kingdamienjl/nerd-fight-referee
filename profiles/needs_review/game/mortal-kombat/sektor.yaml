    \ Analysis (Scanned Cyber Sub-Zero's neural net), Cyborgization (Normal, only\
    \ organs are intact), Energy Manipulation (Can infuse his strikes with blue energy)\
    \ Immunity to Soul Manipulation (No longer has a soul as a result of the cyberization\
    \ process) |-|White Sektor= All previous abilities greatly enhanced, Energy Projection\
