- id: claim-weaknesses-1d5e110e
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: |-|Basic Attacks/Kombos= *Afterburn:
    Sektor fires a short range propulsive blast from his palm. *Gut Crusher: Sektor
    steps forth and kneels to punch the opponent''s gut with a bluish energy coated
    fist. *Leg Lift: Sektor enters a stance where he lifts his legs, gaining access
    to two kick attacks. **Toe Kick: **Sneaky Kicks: |-|Special Moves= *Straight Missile:
    Sektor fires a missile directly at his opponent. *Flame Burner: Sektor unleashes
    a stream of scorching flames. *Teleport Uppercut: Sektor teleports behind the
    opponent with a rising uppercut. *Up Missile: Sektor fires a missile upwards which
    crashes down on the opponent. **Homing Missile: Amplifying it causes the missile
    to home in on the opponent''s location. |-|Throws= *Sektor grabs the opponent
    and swings them over his head to slam their back on the floor. |-|Super Moves=
    *X-Ray (Massive Missile): Sektor fires a powerful missile from his chest at his
    opponent, then immediately performs a Rocket Punch that breaks his opponent''s
    jaw, skull, and knocks teeth out. As they fall, he charges up a powerful force
    palm and targets the opponent''s back, which is enough to break their spine and
    close bones. Note: Sektor destroying Earth in his fatality is considered to be
    an outlier. ==Gallery== File:Sektor MK3.png|Original Timeline Sektor. File:Sektor
    MKA.png|MKA Sektor. File:Sektor Human.png|Human Sektor. File:Sektor.png|Cyborg
