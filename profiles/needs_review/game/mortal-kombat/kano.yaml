    Instead of his eye laser, Kano places a grenade on their gut before it explodes.
    ***Miss Me?: He follows it up with a spinning spinebuster. *Low Spike: While crouched,
    Kano swings his elbow spike at the opponent. *Pointy Uppercut: Kano does a rising
    elbow strike with his elbow spikes retracted. *Kombat Boots: Kano kicks at the
    opponent and slices them with his elbow spike. **Wood Chipper: Adds a third attack
    to the combo where Kano does a spinning spinebuster. *Mean Machine: Kano breaks
    the opponent''s shins with a low front kick and headbutts them twice. *Sneaky
    Blade: Kano swings his butterfly knives downwards while taking a step back. **Bloodthirsty:
    Following Sneaky Blade, he rushes forward with a blade swipe and stabs the opponent''s
    knee. *Terminated: Kano does a spinning blade swipe. **Attitude Problem: After
    doing Terminated, Kano swings his knife downwards and upwards. *Power Plant: Kano
    rushes forward and stabs the opponent''s gut with an elbow spike. **Black Market:
    After performing Power Plant, Kano throws a roundhouse and grabs the opponent
    to fire a continuous blast from his eye laser. ***Gut Blast: Instead of his eye
    laser, Kano places a grenade on their gut before it explodes. *Burner: Kano does
    a side kick and grabs the opponent to fire a continuous blast from his eye laser.
    **Big Boom: Instead of his eye laser, Kano places a grenade on their gut before
    it explodes. *Blade Evade: Kano pulls out his boot knife and slashes it across
    the opponent while stepping back. *Dirty Hit: Kano grabs the opponent and performs
    a powerbomb on them. **Blown Away: He then stabs a boot blade into their groin
    before pulling it out. *Enzuigiri: Kano performs an Enzuigiri, except his boot
    blades are retracted to stab the opponent. *Under Kick: Kano rolls forward and
    hits the opponent with an extended leg. *Wheel Kick: Kano does a Kyokushin Wheel
    Kick. **Penal Colony: After downing the opponent with a Wheel Kick, he kicks them
    away. *G''Day Mate: After hopping up, Kano does a descending headbutt. *Cheeky
    Swipes: While recovering from a knockdown/successfully blocking an attack, Kano
    swings both knives upwards in a circular motion. *Quick Burn: While recovering
    from a knockdown/successfully blocking an attack, Kano does his Chemical Burn
    attack. *Blood Worth Bottling: Kano does two fast back hands to the face and chest
    before slashing his knives across the opponent''s chest. *Fair Suck Of The Sav:
    Kano rushes forward with a hook punch and spits at the opponent''s face. He finishes
    the combo with a headbutt. *Figjam: Kano swings a knife and stabs it into their
    abdomen. He climbs on their back with an axe kick and jumps off of them to perform
    a diving elbow drop. **He can extend the combo with more moves. Kano can keep
    the opponent downed by slamming his elbow on their face and backstabbing them.
    *Takedown: Kano swings a knife and does a low kick aimed for the shins. He stabs
    a knife into their gut and throws them over his head. |-|Special Moves= *Black
    Dragon Ball: Kano tucks into a ball and flies towards the opponent. *Blade Toss:
    Kano throws a knife straight at his opponent. *Blade Slice: Kano pulls out a knife
    and slashes it upwards. *Power Up: Kano pounds on his cybernetic heart, activating
    a buff that increases his damage but slowly drains his health. *Eye Burst: Kano
    fires a short range burst from his cybernetic eye. *Upward Laser: Kano aims high
    and fires a laser beam from his cybernetic eye. *Choke: A command grab where Kano
    chokes the opponent, forcing them to kneel. **Kano may add an additional attack
    after the grab. He can send them away with a knee strike... **...or stab them
    in the gut thrice before lifting them with the knife to punch them away. *Rib
    Strike: Another command grab where Kano grabs his opponent and knees them in the
    chest thrice. *Power Slam: Yet another command grab where Kano performs a jumping
    suplex on his opponent. *Parry: Kano enters a parry stance where he taunts the
    opponent. If he is struck while it''s active, he can counter the attack with his
    own. **Kano pushes the opponent and delivers a powerful clothesline. **Kano pushes
    the opponent to the floor and stabs his elbow spike into their gut. **Kano shoves
    a knife into their biceps and fires a continuous blast from his eye laser. *Bio-Magnetic
    Pull: Using his cybernetic heart, Kano pulls the opponent in with a magnetic force.
    *Bio-Magnetic Trap: Kano deploys his cybernetic heart as a trap, activating a
