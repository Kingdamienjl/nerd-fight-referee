    and build up massive damage to his strikes. In MKX, he has the ability to create
    two energy clones to assist him in kombat), Awakened Power (Unintentionally summoned
    his green aura when protecting a loved one) Explosion Manipulation (Has a pair
    of explosive, throwing shades), Light Manipulation (Wields a mundane-looking mundane
    looking camera that emits a disorienting flash when used), Summoning (He can call
    in a stunt double with his earpiece) All previous abilities, Instinctive Reaction
    (His power automatically protects himself from attacks without him even being
    aware of this ability at all), Forcefield Creation (Can create a full body forcefield)
  source_ids: *id003
  decisive: true
