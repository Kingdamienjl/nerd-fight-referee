- id: claim-powers-and-abilities-3f162883
  section: abilities
  axis: hax
  text: Base= Superhuman Physical Characteristics, Martial Arts (Utilizes a mix of
    Eastern martial arts styles, specifically Chinese fighting styles), Weapon Mastery
    (Prefers to wield long range weapons), Enhanced Senses (Likely as potent as Raiden's,
    since he was aware of an "Earthrealm force" in the Netherrealm while sealed in
    his own amulet), Extrasensory Perception (Can sense emotions, scaling to Cetrion),
    Acrobatics, Magic (Uses dark magic), Flight (True flight), Immortality (Types
    1 and 2), Acausality (Type 1. As an immortal, he exists outside the normal laws
    of time. In practice, this is the reason why the likes of Fire God Liu Kang was
    unaffected by his past self's injuries and why Dark Raiden was erased when his
    past self was brought forth into the timeline), Self-Sustenance (Types 1 and 2),
    Wields and is familiar with all of his amulet's powers, Unholy Manipulation (All
    of his powers are from the Netherrealm), Energy Projection (Can fire red colored
    beams that usually disintegrate targets, but it can also burn them if he chooses
    to do so. This beams can also activate the amulet from afar), Telekinesis (Can
    manipulate objects and opponents from afar, usually throwing them away from him),
    Teleportation (Can instantly teleport in a burst of magic. Can also turn into
    a dark, gaslike form before reappearing as a pair of skeletal hands that crushes
    those in his destination), Bone Manipulation (Can summon a pair of giant skeletal
    hands to attack opponents from afar), Forcefield Creation (Can summon a frontal
    shield to deflect incoming attacks), Corruption (Type 1. Corrupted the Jinsei
    with his dark essence once he touched it reversing its life giving effects to
    the opposite), Weather Manipulation (The side effects of him corrupting the Jinsei
    released dark clouds and a shockwave that disabled the tech on Jacqui's plane),
    Telepathy (Created a mental projection of himself on Earthrealm while trapped
    in the Netherrealm to communicate with Quan Chi), Soul Manipulation (Said and
    demonstrated by Revenant Liu Kang to be able to consume souls, which in turn increases
    his strength), Necromancy (Scaling to Revenant Jade who mentioned him when she
    summoned reanimated dead Shaolin monks, likely using his magic), Weapon Creation
    (Can create bone weapons from his hands or scepter. When copying an opponent's
    special move, he may create an energy construct of the weapon used in that move),
    Explosion Manipulation (Can cause a spontaneous explosion on his opponent), Power
    Mimicry (Can steal one move from his opponent and copy it for a limited time),
    Shapeshifting (If the stolen move requires a different form to perform, he can
    simply morph into a suitable form for it), Power Bestowal (Some of his powers
    are seen in the hands of his followers, which might've been given to them by himself),
    Resistance to Time Manipulation (Shinnok's incapacitation was stated to be irreversible.
    Even though he was restored back to his place in his Bone Temple [located deep
    in the Netherrealm castle] by Kronika's time powers, he still remained as a decapitated
    head. Only a full rewind of the universe via the Hourglass can restore him back
    to his original form) |-|Corrupted= All previous abilities greatly enhanced, Can
    channel the amulet's power without holding it (It is fused with his body, and
    he can project its power through his hands), Damage Reduction (Takes less damage
    in this form), Hellfire Manipulation (Can generate hellfire through his entire
    body), Magma Manipulation (Able to generate hot lava), Earth Manipulation (Can
    conjure rocks from thin air)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
