  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Martial Arts (Skilled in Edenian fighting\
    \ styles, an ancient acrobatic fighting style with a hint of Capoeira and Chinese\
    \ wushu), Weapon Mastery (Skilled b\u014Djutsu user, also uses glaives. Her weapon\
    \ can somehow deflect projectiles), Stealth Mastery (Infiltrated the Tarkatan\
    \ War Kamp, were it not for a frightened Tarkatan woman. Remained undetected from\
    \ Kitana until the latter sensed her presence despite being out of her sight),\
    \ Acrobatics, Longevity (Edenians have long lifespans, even after ~10,000 years\
    \ they have still remained as adults), Can interact with her past self, but will\
    \ share with it irreparable damage and death (As shown throughout MK11), Magic\
    \ (Her powers are that of Edenian magic), Energy Manipulation (Her green energy\
    \ allows her to temporarily boost her speed in short bursts [usually adding to\
    \ the kinetic energy of her boosted attacks], teleport herself over short distances,\
    \ and conjure grounded waves of magic), Intangibility (Can activate an aura that\
    \ allows her to phase through projectiles) All previous abilities, Magic (Has\
    \ a form of dark magic in her arsenal, allowing her to reanimate the corpses around\
    \ her), Immortality (Type 7), Self-Sustenance (Type 2)"
  source_ids: *id003
