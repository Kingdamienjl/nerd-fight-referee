  intelligence:
    text: 'Gifted (Constantly scheming his next move in his long life, schemes and
      plots always spring forth from his dark mind. He was responsible for hatching
      the scheme that started the events of Mortal Kombat 2, coming up with a plan
      that allowed Outworld to challenge Earthrealm in a Mortal Kombat tournament
      that they hosted in their realm, which served as a distraction for the champions
      of Earthrealm to let Shao invade it in Mortal Kombat 3 and many other schemes
      that were initially successful. He also retains the thoughts and memories of
      the souls of those he has taken them from. As such, he has accumulated countless
      categories of miscellaneous knowledge that has proven useful to him, such as
      the knowledge of the location of the secret Map of Elements that he gained from
      consuming the Great Kung Lao''s soul) Gifted (Shang Tsung has consumed an uncounted
      amount of souls from warriors to gain their martial knowledge, such as an unnamed
      Shaolin monk whence he took his Snake style from and the soul of Muso Gonnosuke,
      the founder of Jojutsu who [in the MK universe] beat the legendary swordsman
      Miyamoto Musashi in their second duel.>Mortal Kombat: Deadly Alliance - Bo''
      Rai Cho''s Konquest ModeJojutsu is the Japanese art of the short staff. It was
      first used by Muso Gonnosuke in the early 1600''s after his loss to the swordsman,
      Miyamoto Musashi, while using a long staff of 6 feet. With assistance from Master
      Bo'' Rai Cho, he subsequently developed a style with a shorter staff of 4 feet.
      Although he beat Musashi in a second duel, he was later defeated in his first
      Mortal Kombat tournament. Gonnosuke''s soul was consumed by the sorcerer Shang
      Tsung. As such, he has accumulated hundreds of lifetimes'' worth of kombat skill)'
    source_ids: *id002
    confidence: 0.8
