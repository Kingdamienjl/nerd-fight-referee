    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics (Has immense physical strength allowing\
        \ him to lift opponents over him, send people flying with his strikes, shatter\
        \ stone, etc.), Martial Arts (Jujutsu, Nan Chuan, B\u014Djutsu. Has mastered\
        \ all 750 varieties of Jujutsu), Weapon Mastery (Uses staves, spears, blades\
        \ and a hammer), Immortality (Types 1 and 2), Electricity Manipulation (Able\
        \ to generate and manipulate electricity in a myriad of ways), Teleportation\
        \ (Can instantly teleport himself and others), Flight (True flight), Weather\
        \ Manipulation (Can create storms), Time Manipulation (Shown to have reset\
        \ the timeline before getting killed by Shao Kahn) Paralysis Inducement (Can\
        \ paralyze others with electricity), Aura (Able to cover himself in electricity),\
        \ Portal Creation (Can create interrealm portals), Air Manipulation (Able\
        \ to harness the invisible power of wind), Telekinesis (Operated a ship far\
        \ away from him. Can use this in conjunction with electricity) Creation (Created\
        \ the Temple of Elements), Telepathy (Able to transmit telepathic messages\
        \ to his past self), Stealth Mastery (Skilled in infiltration and sneaking\
        \ on others), Light Manipulation (Able to generate a burst of blinding light\
        \ from his eyes), Healing (Low-Mid. Can heal others. Can also teleport and\
        \ go to the Jinsei Chamber to heal himself within reasonable amounts of time),\
        \ Enhanced Senses (Can sense presences in an entire realm), Extrasensory Perception\
        \ (Senses souls and energy signatures), Precognition (Able to view visions\
        \ of the future, not applicable during combat), Clairvoyance (Unlocked memories\
        \ of him and Liu Kang fighting each other in different timelines. Intro dialogues\
        \ suggests that he dreamed about his unexplored visit to the Injustice universe),\
        \ Spatial Manipulation (Can destroy interrealm dimensional gates and manipulate\
        \ cosmic barriers), Regeneration (Low), Absorption (Can absorb energies),\
        \ Power Nullification (Able to nullify projectiles. Reverted Corrupted Shinnok\
        \ back to his original form), Body Puppetry (Able to manipulate the opponent's\
        \ movements with electricity), Technological Manipulation (Shut down Frost\
        \ and her cyborg army), Power Bestowal and Fusionism (Can fuse with others,\
        \ bestowing his powers in the process), BFR (Using portals/teleportation),\
        \ Damage Reduction (Can reduce damage received by using his powers over lightning),\
        \ Forcefield Creation (Able to make electric forcefields), Self-Destruction\
        \ (Via releasing his godly essence to create a massive explosion that destroys\
        \ himself and others), Self-Sustenance (Types 1, 2), Purification (Type 2.\
        \ Able to purge corrupted Blood Magik from his blood), Resistance to Electricity\
        \ Manipulation (Could not be harmed by his own element when touching water\
        \ that conducts electricity), Death Manipulation (Didn't die after he absorbed\
        \ the corrupted essence of Shinnok which reversed the Jinsei's healing effects\
        \ to death), Time Manipulation (Resisted the Hourglass' powers with Fire God\
        \ Liu Kang, who possesses his gift, protecting him from its powers. Resisted\
        \ to Kronika's time stop), Corruption (Broke free from the influence of Shinnok's\
        \ Amulet), Soul Manipulation (Was unaffected by Shao Kahn's planetary soul\
        \ steal. Gave this protection to the champions of Earthrealm), Laws of time\
        \ (As an immortal, he \"exists outside\" the normal laws of time. What this\
        \ means in the practice is unexplored) All previous abilities, Now has the\
        \ Amulet of Shinnok which can give: Deconstruction (Can shoot disintegrating\
        \ beams and imbue his blades with the same effects), Sealing (Can capture\
        \ opponents inside the amulet), Magic (Said beams are magical in nature),\
        \ Energy Projection (The amulet fires orange, pinkish beams of energy resembling\
        \ his electricity), Necromancy (Revived and controlled the corpse of Liu Kang\
        \ with a bolt of lightning), Weapon Creation (Can conjure electric blades),\
        \ likely many other abilities All previous abilities, Immortality (Types 1,\
        \ 2 and 3), Regeneration (Low-Godly), Incorporeality, Non-Physical Interaction,\
        \ Shapeshifting, Self-Sustenance (Types 1, 2 and 3)"
