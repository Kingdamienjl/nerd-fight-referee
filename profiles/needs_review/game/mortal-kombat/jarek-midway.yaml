      \ them in Armageddon,Mortal Kombat: Armageddon - Blaze's Trading Kard (Bio)\
      \ John Vogel: \u201CBlaze is a firespawn who was created by an Edenian sorceress.\
      \ His initial purpose was to wander the realms and keep an eye out for super\
      \ powered warriors: Shang Tsung, Shao Kahn, even Raiden. The sorceress had a\
      \ vision that eventually there would be too many of these superpowered warriors\
      \ and eventually will cause Armageddon\u201D such as Jax fighting Quan Chi,\
      \ despite the former being overwhelmed by Tarkatan hordes before his death in\
      \ Deadly Alliance.Mortal Kombat: Deadly Alliance - Jax's biography \u201CDuring\
      \ our assault on the Deadly Alliance, we were overwhelmed by Tarkatan hordes.\
      \ The last thing I remember seeing was Raiden blasting his way into the main\
      \ hall. I was later resurrected by Onaga...\u201D Scaling to Blaze who can displace\
      \ storm clouds that he formed when the Pyramid of Argus that he was on burst\
      \ from the earth, since Argus anticipated a plan that would make use of the\
      \ kombatants' growing power,Mortal Kombat: Armageddon - Intro cinematic Narrator:\
      \ \u201CThere have been many powerful warriors throughout the millennia. But\
      \ ages of Mortal Kombat have begun to tear at the fabric of the realms. The\
      \ critical point has finally been reached. It was foreseen that kombatants would\
      \ one day grow too powerful and too numerous. If left unchecked, their intensifying\
      \ kombat would weaken and shatter the realms... and bring about... the apocalypse.\
      \ The Elder Gods demanded a safeguard be put in place to avoid total destruction.\
      \ One that would make use of the kombatants' insatiable bloodlust. Like moths\
      \ to flame, they would be drawn to battle.\u201D plus Blaze certainly believed\
      \ that he could be defeated by any one of them,Mortal Kombat: Armageddon - Konquest\
