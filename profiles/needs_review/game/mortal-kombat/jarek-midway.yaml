    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics (Has immense physical strength allowing\
        \ him to lift opponents over him, send people flying with his strikes, shatter\
        \ stone, etc.), Martial Arts (Jujutsu, Nan Chuan, B\u014Djutsu. Has mastered\
        \ all 750 varieties of Jujutsu), Weapon Mastery (Uses staves, spears, blades\
        \ and a hammer), Immortality (Types 1, 2 and 3), Regeneration (Low-Godly,\
        \ after committing suicide move to destroy Onaga, destroying his body, soul\
        \ and energy; Raiden managed to reform himself, albeit corrupted from Onaga\u2019\
        s tainted aura), Electricity Manipulation (As the God of Thunder, Raiden has\
        \ absolute divine authority over electricity. Able to generate and manipulate\
        \ electricity in a myriad of ways. These ways include summon lightning bolts\
        \ with a thought, project electricity from his hands that can paralyze, incapacitate,\
        \ kill, or force an opponent's body to move wherever he chooses, create forcefields\
        \ and blades made of electricity, summon electric orbs that act as shocking\
        \ traps, use electricity in conjunction with telekinesis to move objects without\
        \ physically touching them, form massive thunderstorms that shapes the weather\
        \ and channel electricity through his limbs to strengthen his strikes.), Teleportation\
        \ (Can instantly teleport himself and others with a burst of lightning. Can\
        \ also transverse through realms with this ability), Flight (True flight),\
        \ Weather Manipulation (Can create storms and thunderstorms as he has divine\
        \ authority over them), Limited Time Manipulation (Shown to have reset the\
        \ timeline before getting killed by Shao Kahn), Paralysis Inducement (Can\
        \ paralyze others with electricity), Aura (Able to cover himself in electricity),\
        \ Portal Creation (Can create interrealm portals. Destroy Shao Kahn\u2019\
        s inter-realm portal which was merging Outworld and Earthrealm), Air Manipulation\
        \ (Able to harness the invisible power of wind, though to a far lesser extend\
