- id: claim-weaknesses-8766dd88
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Tri-Blade: Jarek throws a star-shaped
    exotic blade at his opponent. *Cannonball Roll: Jarek curls himself to a ball
    and hurls himself to his opponent. Jarek also has a vertical version of this attack
    in which he launches himself upwards. *Rhino Stomp: Jarek slams his body to the
    ground, creating a small tremor and damaging the opponent. *Lasso Snatch: Jarek
    snatches a lasso towards the enemy, and if it connects, he brings the enemy over
    his body and slams them down, making them bounce. *Tricky Switch: Jarek attempts
    to grab the enemy, and if successful, he will push him to his side and then kick
    his back. *Flying Legs: Anchoring himself to the ground with his rope, Jarek lunges
    feet-first towards his opponent.'
