- id: claim-weaknesses-0fd3257c
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Downward Fire Ball: Kai shoots a
    fireball into the ground, juggling his opponent. This move can also be performed
    in the air. *Fire Ball From Above: Kai launches a ball of fire into the sky, where
    it then slams down onto his opponent''s head. *Renegade Kick: Kai charges up and
    unleashes a powerful flaming kick that knocks his opponent down. *Rising Heel:
    Kai ducks to the ground then slides, unleashing a powerful flaming kick that launches
    his opponent up and back. *Air Fist: Kai rises and punches his opponent while
    they are in the air. *Hand Stand: Kai moves into a handstand position and can
    kick his opponent''s stomach or face. Kai can also rotate on one hand and spin
    his legs like propellers, kicking his opponent repeatedly. *Lunging Roundhouse:
    Kai lunges forward and finishes with a roundhouse kick, sending his opponent flipping
    sideways a half-screen distance away. Note: Not to be confused with the similarly
    named characters from Dragon Ball and E''s.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
