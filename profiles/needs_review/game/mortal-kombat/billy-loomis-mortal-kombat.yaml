    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Limited Sound Manipulation (Via
        voice changer), Weapon Mastery (Had been able to shot an gun with one arm
        only, something that requires good dexterity due to its recoil. Can disembowel
        people with a knife. Noticed that Stu had left the safety trigger on when
        held at gunpoint by Gale, which allowed him to disarm her. Both he and Stu
        had a plan on how to exactly stab each other so as to not cause fatal injury.),
        Social Influencing (Charisma - Conviced the police and Sidney he was not the
        killer, along with subtly manipulating the latter to make her feel selfish
        about griefing over her own mother's death. Conviced Stu to help on his killing
        spree. Deception - Was able to hide his true nature for his own girlfriend.
        Faked his death with Stu's help, and when he reappeared later, he had managed
        to fool Sidney by playing the 'wounded survivor'), Stealth Mastery (Had entered
        on principal Himbry's room and had hidden behind his door undetected. Had
        been the likely responsible for stalking Sidney and Tatum during daytime without
        being noticed.), Preparation
      source_id: character-stats-profiles-billy-loomis-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Street Level (Traded stabs with Stu Macher;Scream 1 (1996) whom he is
        implied to have had peer pressured into joining the killing spree, and also
        seeming to fear him, possibly making him stronger than him. Overpowered a
        weakened Gale Weathers before sending her flying against a pillar, generating
        this much energy in the process. Physically overwhelmed Sidney Prescott while
        he was injured from being stabbed. Captured Steven Orth and roughed him up
        to the point of giving him a nosebleed; with the same being a football player.),
        Higher with weapons (Stabbed Stu Macher into a bloody pulp. Disembowled Arthur
        Himbry, which should yield this much energy. Incapacitated Dewey Riley by
        stabbing him in his back, which severed a nerve and caused him to have a limp.)
      source_id: character-stats-profiles-billy-loomis-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Superhuman (Disappeared after knocking on Himbry's door. Cut
        Sidney Prescott off before she could leave the kitchen even when she had a
        head start and he took the longer way around. Disappeared from the van he
        was in and changed his clothes, and got upstairs without anyone noticing it.),
        up to Supersonic attack speed via Berreta M9 (A berreta M9 can shot at this
        velocity.)
      source_id: character-stats-profiles-billy-loomis-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Street Level (Fell down a flight of stairs unharmed; which would normally
        result in broken bones, which would include broken ankles. Withstood being
        stabbed into his stomach by Stu Macher. Withstood being stabbed into his shoulder
        twice by an umbella; albeit he was incapacitated for a considerable amount
        of time. Withstood being shot on his shoulder. Had multiple glass bottles
        smashed at his head and groin. Withstood having a fridge door slammed into
        him.)
      source_id: character-stats-profiles-billy-loomis-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
