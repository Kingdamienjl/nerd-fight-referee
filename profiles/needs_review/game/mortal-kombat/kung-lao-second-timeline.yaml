- id: claim-weaknesses-5ec303f4
  section: weaknesses
  axis: weakness
  text: 'Arrogant and overconfident, especially when he thinks that he has already
    won. Notable Attacks/Techniques Coming soon... *Chops: Lao performs a windmill
    chop attack, swinging his hands around like a windmill. **Healing Wind (MK9):
    After his Chops attack, he swings the move in the opposite direction. *Rolling
    Thunder: Lao rolls towards the opponent with an extended foot to hit them. *Rising
    Hat: Lao takes his hat and swipes it upwards. **This move returns in MK11, known
    as Rising Rim. He turns around before performing the move for more style. *Spinning
    Hat: Lao does a sweep kick while slashing his hat along with it. *Sweeping Razor:
    Lao crouches and throws his hat, causing it to fly low in a circle before rising
    back to his hand. *Vicious Slice: After hopping up, Lao swings his hat down in
    a semi-circular arc. *Rising Hat: While recovering from a knockdown/successfully
    blocking an attack, Lao counters back by swinging his hat around him in a rising,
    semi-circular arc. *Flip Kick: When recovering from a knockdown/successfully blocking
    an attack, Lao counters back by performing a backflip kick. *Chain Fist: Lao does
    a back fist strike at the opponent''s face and gut, before performing a 3 hit
    chain punch. He then throws a high kick. *Lead The Way: Lao chops high and swings
    an overhead chop with the rear arm. He finishes the combo with a U shaped punch.
    *Razor Rim: Lao swings his hat down and pivots around with another overhead hat
    swing. *Dragon Step: Lao lunges with two knife hand strikes and throws his hat
    at the opponent''s legs. *Butterfly Kick: Lao does a hook kick and a butterfly
    kick. *Order Of Light: Lao throws a jab and another jab using his rear hand. He
    shuffles behind the opponent and strikes them with a knife hand swing. **Fatal
    Blow: Instead of a shuffle, he chops down and kicks the opponent''s knee. *Monk
    Dunk: Lao widens his stance and throws a straight punch. Lao steps forth and swings
    his elbow down. *Deadly Path: Uses the same first hit of Monk Dunk, but he throws
    his hat down causing it to bounce up before retrieving it. He jumps up and performs
    a spinning hat slash. *Kung Tang: Lao throws a punch from his rear hand and throws
    his hat before recalling it. He does a 5 hit chain punch and kicks them away.
    *Flowing Water: Lao spins low to slash his hat on the opponent''s legs and rises
    up with an open palm strike. He drops the hat and kicks it towards them. *Iron
    Broom: Lao steps on the opponent''s foot and throws his hat up before catching
    it to perform 2 low side slashes. *Hat Toss: Lao throws his hat straight at the
    opponent. Its trajectory can also be changed mid-flight. *Ground Hat: Lao throws
    his hat into the ground, causing it to spin towards the opponent. *Spin: Lao rapidly
    spins in place, creating a small tornado around him. **He can modify the attack
    by spinning towards a certain direction for more mobility. *Dive Kick: While airborne,
    Lao dives down with a powerful kick. *Teleport: Lao dives into a portal on the
    floor, reappearing in another one in a certain location. From there he may delay
    his appearance for a surprise attack and he can choose from a series of attacks:
    **Hammer Punch: Despite the name, he actually swipes his hat down on the opponent.
    **Teleport Kick: Lao does a simple push kick. **Drop Kick: Lao does a drop kick,
    but he perfectly lands on his feet, which doesn''t make it a drop kick. **Teleport
    Throw: Lao grabs their shoulders and flips over them, shifting his weight to throw
    them down. *Hat Spin: Lao places his hat around him, causing it to orbit around
    his body and hits anyone too close. *Hat Grinder: Similar to his Hat Toss, but
    his hat saws through the opponent, hence the name. It can be thrown upwards or
    downwards similar to his Ground Hat. *Hat Trap: Lao throws his hat in a certain
    direction, but it floats in place until a command is issued. **Hat Call Back:
    Lao recalls his hat, causing it zip in the opposite direction it was thrown in.
    *Possessed Hat: Lao throws his hat and it flies in a sine pattern. **The move
    can be enhanced, causing a second ghost hat to appear. *Z Hat: Lao waves his hand
    in a Z motion, causing his hat to zip in a Z motion as well. *Buzz Saw: Lao places
    his hat in front of him, allowing him to freely move his hat around before it
    darts towards the opponent. *Vortex: Lao performs his Spin, but it creates a massive
    whirlwind that he can send forth. *Spiritual Guidance: Lao enters a stance, summoning
    the spirit of his great ancestor. While it''s active, he may perform several spiritual
    attacks he can choose from: **Soul Burst: Lao points his palms, releasing several
    bursts of power. **Upward Soul Burst: Lao points his palm up, releasing short
    range bursts. **Ground Soul Burst: Lao slams his palm down, summoning bursts below
    the opponent. *Hat Possession: Lao throws his hat behind the opponent, causing
    it to orbit around them. *Lao grabs the opponent and places their back on his
    lap. He pummels them with a 15 hit chain punch and slams his elbow on'
