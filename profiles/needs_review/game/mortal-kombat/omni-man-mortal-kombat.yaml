    - field: weaknesses
      value: The Smart Atoms of Viltrumites cannot withstand high temperatures for
        long periods of time, with prolonged exposure heavily weakening their strength
        and durability as the atomic bonds are ripped apart. Pinpoint high frequency
        sound waves can disrupt a Viltrumite's inner ears and highly sensitize equilibrium,
        causing intense pain or potentially death. The Scourge Virus is a specially
        engineered virus that infects Viltrumites and severely hampers their strength
        and invulnerability, usually resulting in death. The Klaxus Plant will poison
        and weaken the species.
      source_id: character-stats-profiles-omni-man-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Enhanced Senses (Showcases here.
        Caught an invisible Cecil spying on him, and was able to sense invisible covert-ops
        GDA agents sneaking around), Longevity (The older viltrumites get the slower
        they age, allowing them to live for thousands of years), Regeneration (High-Low,
        Low-Mid over time) & Immortality (Types 2 & 3; As long as the brain and heart
        remain mostly intact the viltrumite body will repair itself, healing from
        severe [https://imgur.com/a/FqBom87 head trauma] and [https://imgur.com/a/vyYsOIv
        bone and organ damage]. Their physiology allows them to recover from physical
        damage at an extremely accelerated rate, enabling them in fights with injuries
