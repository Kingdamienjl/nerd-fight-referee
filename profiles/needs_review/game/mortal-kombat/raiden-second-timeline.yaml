        \ a spell that sends his past self visions of the future, and a spell that\
        \ reversed Quan Chi's revenant creation spell), Flight (True flight), Immortality\
        \ (Type 1), Acausality (Type 1. As an immortal, he exists outside the normal\
        \ laws of time. In practice, this is the reason why the likes of Fire God\
        \ Liu Kang was unaffected by his past self's injuries and why Dark Raiden\
        \ was erased when his past self was brought forth into the timeline), Self-Sustenance\
        \ (Types 1 and 2), Electricity Manipulation (Raiden has great mastery over\
        \ the element of lightning to the point where most of his powers are linked\
        \ to it. Electrocuting his opponents paralyzes them and sometimes allows him\
        \ to forcefully control their movements), Teleportation (Can instantly teleport\
        \ himself, others, and even an object from someone's hand. Can create portals\
        \ that resemble storm clouds), Weather Manipulation (Can create storms of\
