        \ himself, others, and even an object from someone's hand. Can create portals\
        \ that resemble storm clouds), Weather Manipulation (Can create storms of\
        \ varying intensity, from mist clouds to thunderstorms), Light Manipulation\
        \ (His eyes can emit a blinding light), Healing (Low-Mid. Using his electricity,\
        \ he can heal injuries as deep as a puncture wound through the chest. Can\
        \ also teleport to the Jinsei Chamber to recover his health and stamina within\
        \ reasonable amounts of time), Absorption (Absorbed the corrupted Jinsei and\
        \ Corrupted Shinnok's dark magic, which in turn reverted him back to his base\
        \ form), Forcefield Creation (Some examples here), Weapon Creation (Can create\
        \ two electric blades protruding from his fist. These blades can disintegrate\
        \ Netherrealm demons upon contact), Clairvoyance (Each time his present self\
