- id: claim-powers-and-abilities-02de9150
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Martial Arts (His fighting style is\
    \ a mix of Chinese and Japanese martial arts), Weapon Mastery (His main weapon\
    \ is a b\u014D staff, but he also uses two electric blades), Weapon Control (Can\
    \ summon his B\u014D at will), Stealth Mastery (Along with Liu Kang and Kung Lao,\
    \ they spied on Baraka, D'Vorah, and several Tarkatans who were transporting kidnapped\
    \ Shaolin monks), Enhanced Senses (Potent enough to cover an entire realm), Extrasensory\
    \ Perception (Can sense energy signatures), Acrobatics (Surface Running. Can run\
    \ up on walls before leaping off of it. Casually did a jump while keeping himself\
    \ straight and his hands folded), Magic (Can use a variety of spells, including\
    \ a reviving spell, a spell that sends his past self visions of the future, and\
    \ a spell that reversed Quan Chi's revenant creation spell), Flight (True flight),\
    \ Immortality (Type 1), Acausality (Type 1. As an immortal, he exists outside\
    \ the normal laws of time. In practice, this is the reason why the likes of Fire\
    \ God Liu Kang was unaffected by his past self's injuries and why Dark Raiden\
    \ was erased when his past self was brought forth into the timeline), Self-Sustenance\
    \ (Types 1 and 2), Electricity Manipulation (Raiden has great mastery over the\
    \ element of lightning to the point where most of his powers are linked to it.\
    \ Electrocuting his opponents paralyzes them and sometimes allows him to forcefully\
    \ control their movements), Teleportation (Can instantly teleport himself, others,\
    \ and even an object from someone's hand. Can create portals that resemble storm\
    \ clouds), Weather Manipulation (Can create storms of varying intensity, from\
    \ mist clouds to thunderstorms), Light Manipulation (His eyes can emit a blinding\
    \ light), Healing (Low-Mid. Using his electricity, he can heal injuries as deep\
    \ as a puncture wound through the chest. Can also teleport to the Jinsei Chamber\
    \ to recover his health and stamina within reasonable amounts of time), Absorption\
    \ (Absorbed the corrupted Jinsei and Corrupted Shinnok's dark magic, which in\
    \ turn reverted him back to his base form), Forcefield Creation (Some examples\
    \ here), Weapon Creation (Can create two electric blades protruding from his fist.\
    \ These blades can disintegrate Netherrealm demons upon contact), Clairvoyance\
    \ (Each time his present self reenacts his battle with Liu Kang in a timeline,\
    \ he unlocks memories of the same fights that happened in past timelines. Pre-battle\
    \ dialogues suggests that he dreamed about his unexplored visit to the Injustice\
    \ universe), Fusionism (Can fuse himself with a suitable candidate, relinquishing\
    \ his powers upon them. The process also places his mind and soul into the target\
    \ as well as the mind and soul of their other version, creating a combined being),\
    \ Resistance to Electricity Manipulation (Not affected by his own powers when\
    \ he touches water), Death Manipulation (He didn't die from absorbing the corrupted\
    \ Jinsei and Shinnok's dark magic, which was stated to reverse its life giving\
    \ effects to death), Time Manipulation (Initially frozen in time by Kronika's\
    \ powers, before he managed to break free), Fire Manipulation (Can endure a continuous\
    \ stream of Liu Kang's fire without being burned), Corruption (While he initially\
    \ succumbed to the Amulet of Shinnok's dark influence, his past self was able\
    \ to overcome it and rid its influence on his powers) All previous abilities,\
    \ Now has the Amulet of Shinnok which can give: Deconstruction (The amulet can\
    \ shoot disintegrating beams in multiple directions), Sealing (Can capture opponents\
    \ inside the amulet), Energy Projection (The amulet fires orange, pinkish beams\
    \ of energy resembling his electricity), Necromancy (Revived and controlled the\
    \ corpse of Liu Kang with a bolt of lightning), likely many other abilities"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
