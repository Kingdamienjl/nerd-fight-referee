        in wielding his hammer and spear), Acrobatics (Can leap forward for several
        meters), Magic (Implied to have great knowledge on sorcery, including Skarlet's
        blood magic, but he isn't seen using them as he usually prefers hand-to-hand
        combat), Longevity (Outworlders have naturally long lifespans spany over 1000
        years), Regeneration (Low-Mid over time. Healed from Liu Kang's fist going
        through his chest but needed Quan Chi to accelerate his recovery), Can interact
        with his past self, but will share with it irreparable damage and death (As
        shown throughout MK11), Social Influencing, Energy Manipulation (Most of his
        attacks possess a green colored aura, which is the magic that he uses to boost
        the move speed of his attacks [and in turn increase their impact]. He can
        also shoot scorching, energy beams from his hands), Soul Manipulation (Shao
        Kahn is an unparalleled master of soul magic, even the likes of Shang Tsung
        hoped to surpass his emperor's magic with his own. Besides draining and consuming
        many souls at once while receiving their benefits (bonus strength, memories/knowledge,
        health replenishment, etc.), he can fuse the souls of others to create a singular
        being that's under his control), Weapon Creation (Can create energy spears
        out of thin air), Weapon Control (Can summon the Wrath Hammer out of thin
        air. As of MK11, he summons his spear [which is now a physical weapon] rather
        than creating it), Summoning (Can summon his Dark Priests to enchant his weapon
        and assist him in kombat), Telekinesis (Likely a side effect of him gaining
        so much souls, Shao Kahn has the ability to manipulate opponents and objects
        from a short distance), Portal Creation (After claiming his right to merge
        realms via winning ten MK tournaments or simply breaking their rules, he may
        summon a green portal to travel to the realm that he wishes to claim. Also
        uses it to summon the bones and skulls of his enemies, simply for the heck
        of it), Power Bestowal (Responsible for giving Skarlet her powers and strengthening
        Sindel with Shang Tsung's souls, while giving her the ability to drain souls
        as a side effect), Resistance to Soul Manipulation and Mind Manipulation (Trapped
        inside him are the many souls that he has consumed, likely numbering in the
        millions or billions. Ermac, who has a larger amount of souls in him, was
        able to resist Takeda's attempts to read his mind due to the latter being
        unable to telepathically read all of them at once, so Shao Kahn should scale
        to this feat) | Same as Before but Higher | Same as Before, Regeneration (Low-Godly),
        Immortality (Type 1, 3 and 6, scaling from both Shao Kahn and Darkseid, his
        consciousness will still exist and attempt to possesses others body), Self-Sustenance
        (Types 1, 2 and 3), Magma Manipulation (can blast opponents with molten rock
        projectiles), Light and Sound Manipulation (capable of generating blinding
        yellow flashes of light and deafening thunderclaps), Limited Invulnerability
        (via kombat rage, Dark Kahn can make himself invincible for a short duration
        of time), Telepathy and Empathic Manipulation (can talk telepathically with
        others in their head and through his kombat rage, he can manipulate others
        minds to turn against even their allies and succumb them into madness, has
        done it on all heroes and villains of both universes, can even do it on a
        whole race, like the Tarkatans, from which Baraka is a part of), Perception
        Manipulation (made Sonya believe that Jax was Kano, as well as Liu Kang think
        that Batman was Shang Tsung), Flight (shown the capability of flying), Reality
        Warping (was warping both the Mortal Kombat and DC universes into one by his
