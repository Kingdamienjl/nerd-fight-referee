- id: claim-powers-and-abilities-6c279bd9
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Martial Arts (Uses a mix of Shotokan\
    \ style karate and Dragon Kung Fu. Some of his fighting styles use Pressure Points\
    \ to temporarily stun opponents), Weapon Mastery (He is one of the most versatile\
    \ weapon users in MK, wielding a variety of swords, hammers, daggers, axes, etc.),\
    \ Stealth Mastery (Skilled in infiltration), Acrobatics, Can interact with his\
    \ past self, but will share with it irreparable damage and death (As shown throughout\
    \ MK11), Ice Manipulation (Sub-Zero's ice powers are known as cryomancy. It allows\
    \ him to manipulate ice and cold for various purposes, specific ones include creating\
    \ ice objects, turning into ice [Elemental, Type 1] then teleporting, generating\
    \ cold air, forming ice around him, etc.), Hacking (Accessed Sektor's encrypted\
    \ memories as a cyborg. He might've learned how to operate technology before he\
    \ was turned into a cyborg, since he was still able to do that as the Lin Kuei's\
    \ new leader), Resistance to Soul Manipulation (His soul remained intact when\
    \ he was turned into cyborg, implying that it was an innate resistance that he\
    \ had. His cyborg form shares this resistance, as he was initially unaffected\
    \ by the Soulnado when it was recently activated) All previous abilities, Enhanced\
    \ Senses (Was able to sense the Cyber Lin Kuei teleporting into the cathedral\
    \ he was in), Cyborgization (Normal, only his vital organs are intact), Flight\
    \ (His suit has an integrated, jet propulsion system on his palms and feet), Information\
    \ Analysis (Can scan lifeforms to gain basic info: their name, realm of origin,\
    \ and signature abilities, provided that they are in his database), Self-Destruction\
    \ (Upon entering a code on his wrist console, he will begin to freeze himself\
    \ and anyone touching him before shattering), Body Control (Can disassemble and\
    \ reassemble his body at will) All previous abilities in his Human key, Immortality\
    \ (Type 7), Self-Sustenance (Type 2) All previous abilities in his Human key,\
    \ Weather Manipulation (Can summon localized snowstorms), Forcefield Creation\
    \ (Can summon a bubble shield that can also emit a freezing blast), Flight (Restricted\
    \ flight), Clairvoyance (Intro dialogues suggests that he dreamed about his unexplored\
    \ visit to the Injustice universe), Resistance to Fire Manipulation (Resists the\
    \ flames of Sektor's flamethrower burning oxyhydro fuel at 3000\xB0), Ice Manipulation\
    \ (Resists Frost's ice powers)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
