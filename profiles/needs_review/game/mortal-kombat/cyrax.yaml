- id: claim-weaknesses-7193120f
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: |-|Special Moves= *Net: Cyrax fires
    an energy net, restraining the opponent. **His cyborg form fires it from his chest,
    while his human form throws the net from his hands. *Bomb: Cyrax drops a bomb
    that detonates after a short delay. *Teleport: Cyrax gains the ability to teleport.
    **His cyborg form disassembles himself before reforming in another place while
    his human form uses a smoke bomb to cover his escape. **Bangport: Cyrax''s explosive
    teleport will now damage nearby opponents. *Reverse Kick: Cyrax performs a spin
    hook kick. **Ragdoll: A follow up attack that involves Cyrax throwing the flying
    opponent down. *Anti-Air: Cyrax grabs an opponent out of the air and hurls them
    away. *Buzzsaw: Cyrax releases his buzzsaw at the opponent. **Saw Blade: Amplifying
    it causes Cyrax to fire the buzzsaw as a projectile. *Throw: Cyrax grabs the opponent
    and bashes the opponent over their head three times with a bomb before swinging
    it to their face, causing it to detonate OR Cyrax grabs the opponent and bashes
    the opponent over their head two times with a bomb before climbing onto their
    back and leaping away to throw the bomb at them. The bomb explodes and sends them
    flying. |-|Super Moves= *Cyberdriver: Cyrax launches his opponent up into the
    air with a bomb, which causes them to flip upside down. He then teleports up to
    them and kicks them causing the spine and ribs to break. He then grabs the opponent,
    while they are still upside down, and pile-drives them into the ground, shattering
    pieces of their skull and neck with his foot on top of their head. Note: Cyrax
    destroying the Earth in one of his fatalities is an outlier and gag feat. ==Gallery==
    File:Cyrax MK3.png|Original Timeline Cyrax. File:Cyrax Deadly.png|MKDA Alt. Cyrax.
    File:Cyrax Human.jpg|Human Cyrax. File:Cyrax.png|Cyborg Cyrax. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==Statistics Values== {{Discussions}} Category:Characters
    Category:Game Characters Category:Mortal Kombat Category:Protagonists Category:Heroes
    Category:Good Characters Category:Male Characters Category:Fighting Game Characters
    Category:Playable Characters Category:Comic Book Characters Category:Adults Category:Ninjas
    Category:Mercenaries Category:Reformed Characters Category:Honorable Characters
    Category:Tragic Characters Category:Assassins Category:Loyal Characters Category:Cyborgs
    Category:Humans Category:Martial Artists Category:Wrestlers Category:Acrobats
    Category:Stealth Masters Category:Weapon Masters Category:Blade Users Category:Explosion
    Users Category:Energy Users Category:Smoke Users Category:Thrown Weapon Users
    Category:Chi Users Category:Enhanced Senses Users Category:Transformation Users
    Category:Body Control Users Category:Teleportation Users Category:Self-Destruction
    Users Category:Bomb Users Category:Saw Users Category:Net Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
