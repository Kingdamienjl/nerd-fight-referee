    \ Body Control (Can detach and rotate his body parts and control them from afar),\
    \ Teleportation (Via disassembly & reassembly or instant teleportation), Acrobatics,\
    \ Self-Destruction (Can start a self-destruct mode that utterly obliterates his\
    \ surroundings), Resistance to Soul Manipulation (Kept his soul intact after undergoing\
    \ the Cyber Initiative which causes its candidates to lose their soul after the\
    \ cyberization process), Fire Manipulation (Withstood Sektor's 3000\xB0 flames)"
