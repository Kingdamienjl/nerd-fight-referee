  attack_potency:
    text: At least Large Building level2.41 tons of TNT normally (Defeated all of
      his opponents in the first (tenth) Mortal Kombat tournament including the likes
      of Ermac, Kitana, Scorpion, Quan Chi, Goro and Shang Tsung. Had a prolonged
      fight with Sheeva in Outworld), Universe level+Downscales 1 Universe when enraged
      (Upon the death of Kung Lao, he nearly killed Shao Kahn in the second tournament.
      Destined to fight against Raiden in every timeline) | At least Large Building
      level (Relies on a power source and is weakened without it. Fought Jax even
      with Shinnok sealed during that time and later managed to fight Cassie Cage),
      likely Universe level+ (With Shinnok's presence, he managed to put up a fight
      against Raiden and also hurt him in MKX, later absorbed the powers of his alive
      self) | Universe level+ (At this state, Liu Kang has the combined might of his
      both versions and Raiden. Easily destroyed the gate defending Kronika's Keep,
      a feat that Fujin could only do the Krown's power.), higher upon tapping into
      the Jinsei (After initially losing to the White Revenants, upon tapping into
      the Jinsei, he defeated them, Dark Cetrion, and Kronika. While channeling his
      lightning powers, destroyed Netherrealm demon army, which carved a crater. While
      he does scale to Cetrion and others similar or above her in power, all of his
      feats against them were done after a "temporal Armageddon", an event that was
      stated by Cetrion and the Elder Gods to weaken their power and eventually erase
      all beings, including the Elder Gods. This means that he has fought a weaker
      version of Cetrion, but he later surpasses her and even her superior, implying
      that he may be more powerful than their versions before that event), up to Multiverse
      level+ at his peak (His fight with Keeper of Time Shang Tsung in Aftermath broke
      time's fabric, creating separate timelines where both of them defeated the other.
      It is later revealed that more than two timelines were created, explicitly a
      result of the rip in space-time. Liu Kang states that each timeline represents
      different outcome of MK11, and that the number of possibilities are endlessMortal
      Kombat 1)Infinite Universes
    source_ids:
    - vsbattles-liu-kang-second-timeline-mortal-kombat
    confidence: 0.6
    notes: auto_repair source extraction
