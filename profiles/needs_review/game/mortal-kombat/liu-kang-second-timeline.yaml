- id: claim-powers-and-abilities-b73fadd5
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts (His fighting style is based
    on JKD with a combination of Muay Thai and Wing Chun. Can perform a One Inch Death
    Strike that causes the opponent's chest to explode), Weapon Mastery (Wields a
    nunchaku), Stealth Mastery, (Along with Raiden and Kung Lao, they spied on Baraka,
    D'Vorah, and several Tarkatans who were transporting kidnapped Shaolin monks.
    Almost infiltrated the Tarkatan War Kamp disguised as Kotal's soldiers), Acrobatics
    (Hypermobility, Self-Momentum, and Surface Running. Can run up on walls before
    leaping off of them. Can perform long jumps halt his flight by rolling, etc.),
    Can interact with his past self, but will share with it irreparable damage and
    death (As shown throughout MK11), Fire Manipulation (Liu Kang's primary and only
    element is dragon fire. Most of his powers come from or possess this fire, including
    Teleportation, Aura, and Damage Boost), Shapeshifting (Can turn into a flaming
    dragon resembling the MK logo), Summoning (Can summon the aformentioned dragon),
    Light Manipulation (In the Yang state, Liu has access to searing orbs of light
    and a channeled healing ability), Darkness Manipulation (In the Yin state, Liu
    has access to dark orbs of fire and a channeled ability that boosts the damage
    of his dark orbs), Limited Resistance to Poison Manipulation (Can survive a dosage
    of poison gas without receiving treatment afterwards but can be killed if he's
    exposed to the gas long enough) All previous abilities, plus Magic (His Revenant
    form has mastered Shinnok's dark sorcery), Immortality (Type 7), Self-Sustenance
    (Type 2), Soul Manipulation (Can consume souls, which restores his health and
    increases his strength. He can also use these souls to create fire skulls to use
    as projectiles), Can summon hellish tentacles with the Talisman of Kafallah Warlocks
    Has the combined powers of his pure self and Raiden's powers, including Flight
    (True flight), Longevity (After regaining his power as the Keeper of Time, Liu
    Kang lost his immortality. However, despite this his lifespan would still stretch
    across eons), Acausality (Type 1. As an immortal, he exists outside the normal
    laws of time. In practice, this is the reason why he was unaffected by his past
    self's injuries and why Dark Raiden was erased when his past self was brought
    forth into the timeline), Self-Sustenance (Types 1 and 2), Electricity Manipulation
    (Now uses Raiden's lightning), Weather Manipulation (Summoned a fiery storm),
    Transmutation (With his fire, he turned Kronika and everything on her body into
    a glass statue), Resistance to Time Manipulation ("Raiden's Gift" protected him
    from the Hourglass' powers, which rewinded time back to the Chaotian Age). Can
    also use the Hourglass and its powers
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
