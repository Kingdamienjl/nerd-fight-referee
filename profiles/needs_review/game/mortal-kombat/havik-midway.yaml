      although this never came to fruition in canonMortal Kombat: Deception - Havik''s
      endingThe others had defeated the Dragon King, but left his broken body unattended
      on the floor of his throne room. Not long ago, a similar fate had befallen his
      former advisor, Shao Kahn. Havik ripped the still-warm heart from the carcass
      and consumed it, thus absorbing Onaga''s power to reanimate the dead.Had the
      Dragon King succeeded in his plans for total domination, the never-ending turmoil
      of life would have come to a stifling halt. Those who defeated him believed
      that the realms were at rest once more, but Havik vowed to restore the Chaos
      that once ravaged Outworld. Shao Kahn would rule again!) A skilled combatant
      (A capable martial artist who knows enough about his fighting styles to competently
