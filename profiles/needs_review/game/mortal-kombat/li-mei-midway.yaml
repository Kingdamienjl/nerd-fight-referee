        \ weakened state from Shinnok\u2019s torture, Raiden managed to reverse Shinnok\u2019\
        s dark power over Earthrealm.) Higher with Shinnok\u2019s amulet (Easily torture\
        \ and decapacitated Shinnok) | At least High Universal level+, likely Universal\
