    text: "Building level+ (Comparable to Jade1.96 Tons of TNT) | Low Multiverse level\
      \ (Due to the kombatants of the realms inevitably growing as powerful as \"\
      superpowered warriors\" like Shao Kahn and Raiden, allowing even lesser fighters\
      \ to fight equally with them in Armageddon,Mortal Kombat: Armageddon - Blaze's\
      \ Trading Kard (Bio) John Vogel: \u201CBlaze is a firespawn who was created\
      \ by an Edenian sorceress. His initial purpose was to wander the realms and\
      \ keep an eye out for super powered warriors: Shang Tsung, Shao Kahn, even Raiden.\
      \ The sorceress had a vision that eventually there would be too many of these\
      \ superpowered warriors and eventually will cause Armageddon\u201D such as Jax\
      \ fighting Quan Chi, despite the former being overwhelmed by Tarkatan hordes\
      \ before his death in Deadly Alliance.Mortal Kombat: Deadly Alliance - Jax's\
      \ biography \u201CDuring our assault on the Deadly Alliance, we were overwhelmed\
      \ by Tarkatan hordes. The last thing I remember seeing was Raiden blasting his\
      \ way into the main hall. I was later resurrected by Onaga...\u201D Blaze stated\
      \ that all the warriors around the Pyramid of Argus had tapped into the powers\
      \ that made creation possible through combat, which cascaded into Armageddon\
      \ resulting in the destruction of all the realms, indicating that each of those\
      \ 59 fighters contributed to such destructive energy)Massively downscales 8\
