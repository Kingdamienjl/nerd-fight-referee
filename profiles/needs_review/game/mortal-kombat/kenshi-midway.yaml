    text: "Large Building level (Killed Hotaru, should be at least comparable to other\
      \ OIA agents3.92 Tons of TNT) | Low Multiverse level (Could briefly trade sword\
      \ strikes with Quan Chi and only lost due to a lucky hitMortal Kombat Armageddon\
