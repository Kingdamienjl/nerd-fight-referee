        \ after committing suicide move to destroy Onaga, destroying his body, soul\
        \ and energy; Raiden managed to reform himself, albeit corrupted from Onaga\u2019\
        s tainted aura), Electricity Manipulation (As the God of Thunder, Raiden has\
        \ absolute divine authority over electricity. Able to generate and manipulate\
        \ electricity in a myriad of ways. These ways include summon lightning bolts\
        \ with a thought, project electricity from his hands that can paralyze, incapacitate,\
        \ kill, or force an opponent's body to move wherever he chooses, create forcefields\
        \ and blades made of electricity, summon electric orbs that act as shocking\
        \ traps, use electricity in conjunction with telekinesis to move objects without\
        \ physically touching them, form massive thunderstorms that shapes the weather\
        \ and channel electricity through his limbs to strengthen his strikes.), Teleportation\
        \ (Can instantly teleport himself and others with a burst of lightning. Can\
        \ also transverse through realms with this ability), Flight (True flight),\
        \ Weather Manipulation (Can create storms and thunderstorms as he has divine\
        \ authority over them), Limited Time Manipulation (Shown to have reset the\
        \ timeline before getting killed by Shao Kahn), Paralysis Inducement (Can\
        \ paralyze others with electricity), Aura (Able to cover himself in electricity),\
        \ Portal Creation (Can create interrealm portals. Destroy Shao Kahn\u2019\
        s inter-realm portal which was merging Outworld and Earthrealm), Air Manipulation\
        \ (Able to harness the invisible power of wind, though to a far lesser extend\
        \ that his younger brother Fujin), Telekinesis (Operated a ship far away from\
        \ him. Can use this in conjunction with electricity), Creation (Created the\
        \ Temple of Elements), Telepathy (Able to transmit telepathic messages to\
        \ his past self to prevent Shao Kahn\u2019s Armageddon rule), Stealth Mastery\
        \ (Skilled in infiltration and sneaking on others), Light Manipulation (Able\
        \ to generate a burst of blinding light from his eyes), Healing (Low-Mid.\
        \ Can heal others. Can also teleport and go to the Jinsei Chamber to heal\
        \ himself within reasonable amounts of time), Enhanced Senses (Can sense presences\
        \ in an entire realm), Extrasensory Perception (Senses souls and energy signatures),\
        \ Precognition (Able to view visions of the future, not applicable during\
        \ combat), Clairvoyance (Unlocked memories of him and Liu Kang fighting each\
        \ other in different timelines. Intro dialogues suggests that he dreamed about\
        \ his unexplored visit to the Injustice universe), Spatial Manipulation (Can\
        \ destroy interrealm dimensional gates and manipulate cosmic barriers), Absorption\
        \ (Can absorb energies), Power Nullification (Able to nullify projectiles.\
        \ Reverted Corrupted Shinnok back to his original form), Body Puppetry (Able\
        \ to manipulate the opponent's movements with electricity), Technological\
        \ Manipulation (Shut down Frost and her cyborg army), Power Bestowal and Fusionism\
        \ (Can fuse with others, bestowing his powers in the process.), BFR (Using\
        \ portals/teleportation), Damage Reduction (Can reduce damage received by\
        \ using his powers over lightning), Forcefield Creation (Able to make electrical\
        \ force-fields), Self-Destruction (Via releasing his godly essence to create\
        \ a massive explosion that destroys himself and others), Self-Sustenance (Types\
        \ 1, 2), Purification (Type 2. Able to purge corrupted Blood Magik from his\
        \ blood), Non-Physical Interaction, Shapeshifting, Incorporeal (In true form\
        \ only)"
