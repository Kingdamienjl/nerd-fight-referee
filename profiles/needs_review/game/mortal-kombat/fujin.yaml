    source_ids: *id002
    confidence: 0.95
  durability:
    text: Universe level+ (Hardly affected by his attacks being reflected back to
      him by Geras. Compared to Nightwolf and Shang Tsung who quickly succumbed to
      the Talisman of the Kafallah Warlocks [wielded by Revenant Liu Kang], he was
      able to resist its grasp for a short time. However, it's unknown if the weapon
      relied on AP or hax abilities)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Athletic, possibly Peak Human (Due to the generally violent tone of the
      battles, fighters can keep going even after deep cuts and lacerations)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range with hand-to-hand combat and melee weapons (Can further
      increase the range of his weapons by controlling them from a distance). Tens
      of Meters with air powers.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (Unlike his immortal kin who do not see life through the eyes
      of mortals and their affairs, Fujin has taken a liking to mortals, giving him
      a different perspective on life. Because of this, he is affable and lighthearted
      compared to the more stoic kin. This personality has given him the capacity
      to inspire his allies' inner goodness to give them a reason to live and fight
      for the future); a skilled combatant (Fought Geras, Kabal, Noob-Saibot, Jax,
      Scorpion, Sub-Zero, and Raiden. A user of the wind element, displaying unique
      techniques to suit all of his needs in battle)
    source_ids: *id002
