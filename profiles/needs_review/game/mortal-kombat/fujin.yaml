        A low kick to the shin. *Flick Kick: A short crouching kick. *Spinning Kick:
        A high roundhouse kick to the head. *Low Kutter: A wristblades slash to the
        ankles. *Brutal Kick: A strong advancing push kick. *Combi Strike: A fast
        crouching combistick slash to the ankles. *Throw: The Predator grabs the opponent
        by the neck, lifts them up and stabs them in the stomach with his wristblades.
        He then slowly carves them up to the chest and pulls the blades away while
        simultaneously slashing downward. Showcase here. *Come On: Two Klaw Swipes
        and a headbutt. *Payback Time: A Low Lunge and Low Kutter. *CONTAAAAACT: A
        Fatal Backhand, a Low Lunge and a shoulder tackle. *Meat Grinder: A Fatal
        Backhand, a Low Lunge and standing sweep done with the combistick. *Pleasure
        Kill: A Gut Strike, an overhead punch a Rising Scimitar. *Bleed Bastard: A
