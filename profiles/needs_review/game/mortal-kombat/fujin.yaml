    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Martial Arts (Fujin\u2019s fighting\
        \ styles consist of Chinese martial arts), Weapon Mastery (Wields a Kusanagi\
        \ no Tsurugi and a short pistol crossbow), Acrobatics (Can perform complicated\
        \ jumps and maneuvers), Immortality (Type 1), Regeneration (Low-Godly. In\
        \ MK mythologies: Sub-Zero, after accidentally ripped his body apart with\
        \ a giant tornado, Fujin returned (off-screen) in MK4), Self-Sustenance, Acausality\
        \ (Type 1. As an immortal, he exists \"outside\" the normal laws of time.\
        \ This notion allows Fujin to resist Kronika\u2019s temporal powers and time\
        \ stop), Air Manipulation (Fujin has absolute divine authority over the element\
        \ of wind, allowing him to manipulate it in both offensive, defensive, and\
        \ other methods that specializes in other areas. He can levitate by manipulating\
        \ the wind around him, allowing him to strike the opponent from a safe distance.\
        \ He can also send miniature tornadoes at his opponents that spin them around\
        \ several times and leave them vulnerable to follow-up attacks. Additionally,\
        \ he can levitate the opponent and slam them down on the ground and surround\
        \ himself into a tornado to heave them towards him. His wind powers also allow\
        \ him to trap opponents in vacuums, shooting invisible air bullets from his\
        \ fists and even sucking the oxygen out of his opponent and weaponizing it),\
        \ Limited Weather Manipulation (Can manipulate tornado and any wind-related\
        \ weather or storms), Flight (Can freely move through the air in different\
        \ ways, from levitating himself and walking on air to true flight), Magic,\
        \ Telekinesis (Via his power over wind, Fujin is capable of moving objects\
        \ mid-air, affecting matter or attacks his enemies from a distance), Forcefield\
        \ Creation (Can create wind barriers for offense and defense. Offensively,\
        \ he uses them to ricochet his bolts. Defensively, he uses them to block attacks),\
        \ Attack Reflection (Can deflect attacks back to the attacker with a blast\
        \ of wind), Attack Negation (Can suspend attacks mid-air), Empowerment (Fujin\
        \ can use the Jinsei to heal himself and become stronger), Healing (Only with\
        \ Jinsei essence, which he can manipulate to heal others with a touch), Power\
        \ Bestowal (Can bestow a limited form of flight to his allies. MK11 intro\
        \ dialogue implies that Fujin was one of the God that granted the Cage family\
        \ and their ancestors their supernatural power, allowing them to defeat even\
        \ the Fallen Elder God Shinnok), Social Influencing (Is a charismatic individual\
        \ due to his sentimental nature, and demonstrate this by convincing Future\
        \ Jax to leave Kronika\u2019s side and rejoin the forces of good), Limited\
        \ Astroremkinesis (Fujin and Raiden\u2019s combined might was causing the\
        \ entire universe to shake to its foundation. The narration also stated that\
        \ it can move worlds, destroy galaxies and impact the infinite realms. Pry\
        \ open a black hole created by Noob Saibot with a cyclone). Possibly Non-Corporeal\
        \ and Shapeshifting (As a God of the same vein as Raiden, it can be presumed\
        \ that Fujin\u2019s true form is formless and ethereal represent his element,\
        \ Wind. As a result, Fujin has to take a human form in order to make contact\
        \ within the mortal plane). Resistance to Time Manipulation and Time Stop\
        \ (Is partially immune to Kronika\u2019s powers as an immortal God, moving\
        \ even in Kronika\u2019s time stop), Gravity Manipulation (Break out of Bi-Han's\
        \ black hole)"
      source_id: character-stats-profiles-fujin-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Large Planet level+ (Comparable to Raiden, who caused the Cretaceous-Paleogene\
        \ extinction event in his battle with Shinnok, forcing the remaining Saurian\
        \ race (which were dinosaurs at the time) to flee from Earthrealm. Furthermore,\
        \ it was implied that all Earthrealm Gods, including Fujin, did participate\
        \ in the battle which cause the devastating extinction and drove the Saurian\
        \ race to Zaterra. In MK4, Fujin and Raiden were two of Earthrealm Gods that\
        \ survived Shinnok's onslaught, while other Elemental Gods died. Later in\
        \ MK11, Fujin managed to defeat Dark Raiden, who was wielding Shinnok's Amulet\
        \ and gained much more powers than before, with some help from Shang Tsung.\
        \ Despite being defeated by Bi-Han once via the Elemental Icons and trickery,\
        \ Fujin later shown that he could defeated Bi-Han/ Noob Saibot, even after\
        \ the latter got amped by the Soulnado, and even commented that Bi-Han\u2019\
        s black hole is at most amusing) | At least High Universal level+, likely\
        \ Universal level+ (Fujin and Raiden\u2019s battle with Shinnok was causing\
        \ the entire universe to shake to its foundation and impact the infinite realms.\
        \ The powers emanating from Raiden and Fujin amidst the battle was capable\
        \ of moving worlds, undoing galaxies, and even the Big Bang explosion led\
        \ to the creation of the universe cannot match it. Should be able to fight\
        \ Blaze, who could end reality)"
      source_id: character-stats-profiles-fujin-mortal-kombat
      provider_id: character_stats_profiles
      authority: high
