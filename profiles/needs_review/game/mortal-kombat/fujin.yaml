  attack_potency:
    text: Universe level+ (Alongside Shang Tsung, he managed to defeat his brother
      Raiden while he was under the influence of Shinnok's Amulet, who can do this.
      Casually skinned a large Outworld feline with his whirlwind. Played a big role
      in the defeat of Dark Cetrion by impaling her with propelled rock shards and
      trapping her in a cyclone before she was banished. With a single crossbow bolt,
      he broke the layer of ice that trapped Shang Tsung [courtesy of a confused Sub-Zero],
      which he couldn't break out of without his assistance)Downscales 1 Universe
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic+ movement speed (Should be equal to the likes of Raiden, who
      can fly this fast. His whirlwinds can also move this fast, and it should be
      safe to assume that he can move at these speeds as well due to having complete
      mastery over wind)mach 21.78 with Massively Hypersonic+ reactions and combat
      speed (Slightly slower than Shinnok who can react to and block Raiden's lightning,
      but still around his level)mach 5,103
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class K (Should be equal or even superior to the likes of Sub-Zero
      and Scorpion who can casually rip out spines with 101-102 tons of force)346.89
