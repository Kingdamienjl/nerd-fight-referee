    - field: powers_and_abilities
      value: "Abstract Existence (Type 3; Is the Embodiment of the Wind, Direction\
        \ and Sky across all of existence), Superhuman Physical Characteristics (As\
        \ a God and formerly an Oni, Fujin's physical form has far superior physical\
        \ capabilities in comparison to mortals. He can smash stones and thick walls\
        \ with a kick, destroying a large statue, causing minor tremor with a single\
        \ punch and lifting large boulders with ease. He is also capable of ripping\
        \ human and Oni apart with ease), Cosmic Awareness, Advanced Martial Arts\
        \ (Fujin\u2019s fighting styles consist of Japanese and Shaolin martial arts.\
        \ Due to his powers over air, Fujin's fighting styles are also based on the\
        \ exaggerated and gravity-defying movements of wire fu moves), Weapon Mastery\
        \ (Wields a Kusanagi no Tsurugi, Crescent Moon Spade and a short pistol crossbow),\
        \ Acrobatics (Can perform complicated or outrightly impossible jumps and manoeuvres\
        \ for human to purposes. Fujin can also jump and leap at great height due\
        \ to his inhuman strength), Immortality (Type 1, 3 & 5; As a God, Fujin is\
        \ completely immortal and unable to die, and can continue to exist even beyond\
        \ death. As he is already born in the World of the Dead, Fujin is beyond the\
        \ conventional death known to mortals and deities), Regeneration (Low-Godly.\
        \ After accidentally ripped his body apart with a giant tornado, Fujin managed\
        \ to regenerate his physical body. Stated that he can reform his physical\
        \ body even when he is erased from existence), Self-Sustenance (Type 1 & 2),\
        \ Transcendent Physiology, Acausality (Type 1 & 4; As an immortal, Fujin exists\
        \ \"outside\" the normal laws of time. Being the ethereal entity that resides\
        \ beyond the Mortal Realm, Fujin completely exists beyond space-time continuum),\
        \ Air Manipulation (As the God of Wind, Fujin completely personifies and has\
        \ absolute divine authority over the wind and air. He can utilize the invisible\
        \ force of the air for many purposes. This include levitate by manipulating\
        \ the wind around him, lifting his opponents up the air, surround himself\
        \ into a tornado to heave them towards him. His wind powers also allow him\
        \ to trap opponents in vacuums, shooting invisible air bullets from his fists\
        \ and even sucking the oxygen out of his opponent and weaponizing it to straight\
        \ up rip apart living beings or objects with a strong pressurized wind. Being\
        \ the God of Wind, Fujin is responsible for regulating wind and air of the\
        \ entire world, being the one to birth wind and atmosphere itself when he\
        \ ascended to godhood, and is powerful enough to create wind even without\
        \ atmosphere or the presence of matter), Temperature Manipulation (Can manipulate\
        \ the temperature of the atmosphere at will, allowing Fujin to summon icicle\
        \ or fiery whirlwinds), Weather Manipulation (Can manipulate tornado and any\
        \ wind-related weather or storms. As the master of storm, Fujin can easily\
        \ conjure any type of storm, natural phenomenon and disasters, Electricity\
        \ Manipulation (As the master of storm, Fujin can summon and use lightning\
        \ at will. Nevertheless, his power over lightning is far inferior to his brother\
        \ Raijin as while his lightning bolt can easily disintegrate most things,\
        \ it cannot harm gods one bit), Flight (Can freely move through the air in\
        \ different ways, from levitating himself and walking on air to true flight),\
        \ Space-Time Manipulation & Dimensional Manipulation (As the God of Direction\
        \ & Sky, Fujin can control direction and space. Cause the position of stars\
        \ across Heaven, and the Heaven itself, to shift. His powers hold and sustain\
        \ the upper position of sky, and thus keep the Heaven and Earth apart. Created\
        \ a universe filled with its own space-time continuum), Magic, Telekinesis\
        \ (Via his power over wind, Fujin is capable of moving objects mid-air or\
        \ attacks his enemies from a distance. Fujin can also use his telekinesis\
        \ to rip apart large structures or objects with ease and reconstruct them\
        \ entirely, showing that he can affect matter with his powers. Operate a ship\
        \ that is far away from him), Forcefield Creation (Can create wind barriers\
        \ for offense and defense. This includes ricocheting, blocking and deflecting\
        \ attacks), Attack Reflection (Can deflect attacks back to the attacker with\
        \ a blast of wind), Attack Negation (Can suspend attacks mid-air), Astral\
        \ Projection (As a God, Fujin can project his primal spirit into an ethereal\
        \ form made of energy to unleash the entirety of his power), Accelerated Development\
        \ (As a God, Fujin passively grow in powers over time), Empowerment (Fujin\
        \ can use the spiritual and divine energy of the Heaven to heal himself and\
        \ become stronger. While unnecessary, Fujin can use worshippers to become\
        \ stronger and rejuvenated his powers), Energy Manipulation (As a god, Fujin\
        \ has access to divine and spiritual energy, which take on the form of blue-white\
