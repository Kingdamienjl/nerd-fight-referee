  attack_potency:
    text: Universe level+ (Alongside Shang Tsung, he managed to defeat his brother
      Raiden while he was under the influence of Shinnok's Amulet, who can do this.
      Casually skinned a large Outworld feline with his whirlwind. Played a big role
      in the defeat of Dark Cetrion by impaling her with propelled rock shards and
      trapping her in a cyclone before she was banished. With a single crossbow bolt,
      he broke the layer of ice that trapped Shang Tsung [courtesy of a confused Sub-Zero],
      which he couldn't break out of without his assistance)Downscales 1 Universe
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic+ movement speed (Should be equal to the likes of Raiden, who
      can fly this fast. His whirlwinds can also move this fast, and it should be
      safe to assume that he can move at these speeds as well due to having complete
      mastery over wind)mach 21.78 with Massively Hypersonic+ reactions and combat
      speed (Slightly slower than Shinnok who can react to and block Raiden's lightning,
      but still around his level)mach 5,103
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class K (Should be equal or even superior to the likes of Sub-Zero
      and Scorpion who can casually rip out spines with 101-102 tons of force)346.89
      Tons of Force
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Universe level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Universe level+ (Hardly affected by his attacks being reflected back to
      him by Geras. Compared to Nightwolf and Shang Tsung who quickly succumbed to
      the Talisman of the Kafallah Warlocks [wielded by Revenant Liu Kang], he was
      able to resist its grasp for a short time. However, it's unknown if the weapon
      relied on AP or hax abilities)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Athletic, possibly Peak Human (Due to the generally violent tone of the
      battles, fighters can keep going even after deep cuts and lacerations)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range with hand-to-hand combat and melee weapons (Can further
      increase the range of his weapons by controlling them from a distance). Tens
      of Meters with air powers.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (Unlike his immortal kin who do not see life through the eyes
      of mortals and their affairs, Fujin has taken a liking to mortals, giving him
      a different perspective on life. Because of this, he is affable and lighthearted
      compared to the more stoic kin. This personality has given him the capacity
      to inspire his allies' inner goodness to give them a reason to live and fight
      for the future); a skilled combatant (Fought Geras, Kabal, Noob-Saibot, Jax,
      Scorpion, Sub-Zero, and Raiden. A user of the wind element, displaying unique
      techniques to suit all of his needs in battle)
    source_ids: *id002
    confidence: 0.95
