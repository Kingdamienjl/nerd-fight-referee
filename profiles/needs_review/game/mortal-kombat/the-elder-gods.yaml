- id: claim-powers-and-abilities-73cf1411
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Weapon Mastery, Immortality
    (Types 1 and 3, gods can not truly dieMortal Kombat Deception - Backwards Dialogue),
    Incorporeality (They completely lack a physical form), True Flight (Seen hereMortal
    Kombat 4 - Raiden''s Ending), Teleportation (Seen here), Portal Creation (Seen
    hereMortal Kombat Mythologies: Sub-Zero), BFR, Elemental Manipulation, Energy
    Manipulation, Energy Projection, Power Mimicry (Shinnok can imitate the abilities
    of other warriorsMortal Kombat 4), Regeneration (Low-Godly, Raiden could reform
    his body from just his soulMortal Kombat Armageddon - Fujin''s Bio "It is unclear
    to me what has caused the transformation in our friend and ally Raiden. I have
    conversed with gods from other realms about the possible reasons for his madness.
    Rumors abound that he may have sacrificed himself to defeat Onaga. But if that
    were true, his energies would have dispersed and then reformed in Earthrealm.
    His spirit would have been reborn, having no memories of the past."), Necromancy
    (Resurrected the Shirai Ryu as undead), Summoning (Shinnok can summon large skeleton
    hands), Forcefield Creation (Seen here), Creation (Shinnok could create apparitions
    of various kombatants that could fight Taven), Transformation (Can appear in different
    forms, such as humanoids or dragons), Resistance to Void Manipulation (Fought
    the One Being in the timeless void that predates the realms) | Superhuman Physical
    Characteristics, Immortality (Types 1 and 3), Martial Arts, Weapon Mastery, Regeneration
    (Low-Mid overtime, Cetrion could regenerate from being impaled through the torso
    by several rocksMortal Kombat 11 Aftermath), Teleportation, Portal Creation (Seen
    here), BFR, Astral Projection, Restricted Flight (Seen here), Power Bestowal and
    light Healing via Possession (Collectively possessed Raiden to defeat Shao Kahn,
    which healed his injuriesMortal Kombat (2011)), Creation (Cetrion could create
    a massive bridge with her powersMortal Kombat 11), Power Mimicry (Shinnok can
    copy the abilities of other warriorsMortal Kombat X), Energy Manipulation, Energy
    Projection, Weapon Creation (Seen here), Teleportation (Seen here), Summoning
    (Shinnok can summon large skeleton hands), Clairvoyance (Intro dialogues suggests
    that Cetrion knows about Sub-Zero''s dream of being in the Injustice universe,
    as well as knowing that it wasn''t a dreamMortal Kombat 11 - Cetrion fight-intro
    dialogue), Acausality (As immortals, the Elder Gods exist outside the normal laws
    of time. In practice, this is the reason why the likes of Fire God Liu Kang was
    unaffected by his past self''s injuries and why Dark Raiden was erased when his
    past self was brought forth into the timeline), Extrasensory Perception (Shinnok
    can sense emotionsMortal Kombat X - Shinnok''s fight-intro dialogue), Enhanced
    Senses (Despite being sealed within his amulet, Shinnok was aware of an "Earthrealm
    force" in the Netherrealm), Telekinesis (Cetrion can manipulate opponents and
    objects from a short distance), Life Manipulation (Cetrion''s presence can give
    life to plants and animals), Light Manipulation (Not combat applicable, but Cetrion
    can emit a blinding light from herself), Weather Manipulation (Seen here), Elemental
    Manipulation, Body Control, Bodily Weaponry and Elasticity for Cetrion''s tendrils
    (Cetrion can extend her tendrils and use them as weapons), Forcefield Creation
    (Seen here), Resistance to Time Manipulation (Shinnok''s incapacitation was stated
    to be irreversible. Even though he was restored back to his place in his Bone
    Temple [located deep in the Netherrealm castle] by Kronika''s time powers, he
    still remained as a decapitated head. Only a full rewind of the universe via the
    Hourglass can restore him back to his original form. Cetrion was immune to Kronika''s
    time reversal)'
  source_ids: *id003
  decisive: true
  status: unverified
