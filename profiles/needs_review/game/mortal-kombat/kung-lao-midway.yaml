      level (Implied to be comparable to Liu Kang.MK3 - Kung Lao''s Ending Was depicted
      to fight Shao Kahn alongside Liu Kang in Mortal Kombat: Shaolin Monks, each
      crediting the other for the victoryThe additions Shaolin Monks contributes to
      the lore are considered to be canon to the Midway timeline, however, there are
      no references to Kung Lao''s contribution to Shao Kahn''s defeat in the Outworld
      tournament, despite MK3 specifying Liu Kang defeating Kahn. This is likely because
      Shaolin Monks was one of the last Mortal Kombat games released before the reboot
      timeline and thus the lore was not updated in time. For those reasons, Kung
      Lao only receives a "possibly" rating due to the ambiguous nature of the scaling.Massively
