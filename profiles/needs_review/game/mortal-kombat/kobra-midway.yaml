  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Windmill Kick: Kobra slides forward
    a bit and performs a devastating arching Axe Kick which causes the opponent to
    bounce off the ground allowing for a juggle. *Burning Fist: Kobra dashes forward
    with his fist (on fire) extended forward, which knocks his opponents down. *Tele-Punch:
    Kobra disappears, leaving a trail of smoke behind, then reappears behind his opponent
    and punches them down. *Chi-Blast: Kobra gathers chi and releases a ball of flame
    forward from the palms of his hands. **Crouching Chi-Blast: Kobra crouches, then
    gathers chi and releases a flaming projectile forward from the palm of his hands.'
