- id: claim-weaknesses-266449cb
  section: weaknesses
  axis: weakness
  text: 'None Notable | The Shokan curse that stripped him and his race of the two
    extra legs came with some unwanted side effects on their end like his skin no
    longer possessing reflective properties Notable Attack/Techniques *Tail Projectile:
    Motaro fires an energy blast from his tail at the opponent. *Grab and Punch: Motaro
    lifts his opponent up by the throat with one hand and then smashes his fist into
    their face, sending them sailing across the arena. *Teleport: Motaro vaporizes
    in a wavy fashion and reappears behind his opponent in the same manner (or, in
    Armageddon, in a wavy puff of green smoke). *Mount Stance: Motaro lowers himself,
    standing on both arms and legs. This stance allows him three other moves. **Bull
    Charge: Motaro charges at his opponent, knocking him/her down. **Propel: Motaro
    charges at his opponent, flying toward his/her legs, knocking him/her down. **Donkey
    Kick: Motaro kicks his opponent with his two legs, like a horse, sending him/her
    upwards.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
