    - field: weaknesses
      value: 'Sumire''s physical and spiritual vitality is drained by using physical
        and magical skills respectively. Notable Attacks/Techniques: Persona Summoning:
        The ability to summon and utilize Personas. Personas can move and attack independently
        of their users, allowing for concurrent attacks to be performed. They are
        summoned and directed through thought and instinct, and most attacks manifest
        just as quickly and are controlled through the same means; and it should be
        noted that Personas do not need to be summoned in order to use their skills.
        Each Persona has a unique set of statistics and elemental affinities, which
        also apply to their user while the Persona is equipped. Persona Skills: Personas
        are all able to use certain skills and spells related to the stories/mythologies
        of the figure they are based on. Persona-users and their Personas can use
        skills and spells independently of each other. These skills range from amplified
        physical attacks, highly-malleable elemental attacks, status buffs and debuffs,
        ailment infliction, passive defenses and more, can manifest instantly and
        with a thought, as well as affect the mind, soul, information and concept
        of the target. |-|Cendrillon= *Apt Pupil: Increase critical rate. *Vorpal
        Blade: Severe Physical damage to all foes. *Kougaon: Heavy Bless damage to
        1 foe. *Sword Dance: Colossal Physical damage to 1 foe, high critical rate.
        *Makougaon: Heavy Bless damage to all foes. *Diarahan: Fully restore HP of
        1 ally. *Bless Amp: Strengthen (non instant death) Bless attacks by 50%. *Ali
        Dance: Half hit rate of all incoming attacks. *Brave Step: Increase critical
        rate of party for 3 turns. |-|Vandis= All Previous Abilities, plus the following:
        *Evade Curse Triple evasion rate against Curse attacks. *Tetrakarn: Erects
        a physically-reflective shield. *Makarakarn: Erects a magically-reflective
        shield *Heat Riser: Boosts attack power, defenses, speed, and agility of one
        ally. *Debilitate: Cripples attack power, defenses, speed and agility of one
        enemy. *Arms/Spell Master: Halves the costs of physical/magical skills. |-|Ella=
        All Previous Abilities, plus the following: *Masquerade: Severe physical damage
        to 1 foe 2x Cognition: According to Morgana, the entire world is a product
        of Cognition; that is, what is real is only determined by humanity''s perception.
        It is effectively a form of collective Subjective Reality possessed by humanity.
        Within the Metaverse, this effect is taken to its extremes, resulting in things
        such as fake guns becoming real just by someone believing that it is, and
        said guns being always loaded due to the enemy''s logical assumption that
        a gun being held with hostile intent would naturally be so. More subtle displays
        of Cognition are also shown, such as when Ryuji Sakamoto managed to harm Shadows
        prior to awakening to his Persona, despite Shadows being invulnerable to all
        forms of standard physical interaction, simply because he believed that those
        Shadows were normal people playing a cruel prank. Will of Rebellion: The Phantom
        Thieves'' outfits take the form of one''s image of rebellion, and reflect
        the strength of their will to rebel against others'' desire to control them.
        This will of rebellion manifests as the aforementioned outfits, which protect
        the Phantom Thieves from the effects of Cognitive Distortions. Naturally,
        the stronger the will, the greater the extent of their resistance to the effects
        of Cognition. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
