- id: claim-powers-and-abilities-18e52de5
  section: abilities
  axis: hax
  text: 'Mid-Game= {{#tag:tabber|{{!}}-{{!}}Base= Superhuman Physical Characteristics,
    Martial Arts, Weapon Mastery (Revolvers), Vehicular Mastery, Stealth Mastery,
    Acrobatics, Regeneration (Mid-Low, speed depends on willpower), Summoning (Makoto
    is capable of summoning items from her inventory for use in battle, as shown on
    multiple occasions where large items and equipment are pulled out of nowhere and
    used despite being missing in both gameplay and cutscenes), Superhuman Charisma
    (can assist Ren in Shadow Negotiation) and Supernatural Willpower, Empowerment,
    Accelerated Development, Reactive Power Level, and Reactive Evolution (Battle,
    Leveling, and Training; Physical Stats, Magic, and Improved Resistances. Humans
    are able to get more powerful after defeating strong demons or even as they are
    in the middle of battle, even against opponents ontologically superior to them,
    and are able to grow massively in strength in the span of merely a day''s time
    or less, either through resolve, the threat of death, or training, or the bonds
    they hold dear, Non-Physical Interaction, Durability Negation, Healing Nullification,
    Immortality Negation (Type 2, 3, and 7), and Invulnerability Negation (Capable
    of interacting with Demons, which are invisible beings comprised of data and information,
    the fulcrum of the entire verse proper, a concept synonymous to souls, minds,
    and even concepts. Even entities devoid of time and space, and nonexistent bodies
    such as The White can be struck down. Can completely negate their invulnerability
    to conventional weaponry, and the requirement of needing to be on a specific informational
    frequency to harm, as well as Septentriones, which require spiritual attacks to
    harm, and as well as killing undead beings and regenerative entities, such as
    Nagas and Blobs) {{!}}-{{!}}With Persona= Cognitive Physiology (Persona), Magic,
    consisting of: Nuke and Explosion Manipulation. Resistance Negation (with Break
    skills), Healing and Purification (with various support spells), Statistics Reduction
    (with various support spells), Damage Boost (with critical hits), Damage Reduction
