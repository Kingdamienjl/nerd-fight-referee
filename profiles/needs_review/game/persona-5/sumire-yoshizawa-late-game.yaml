    - field: weaknesses
      value: 'His Personas are weak to electricity-based attacks. Notable Attacks/Techniques:
        *Garu: Deals Light Wind damage to a single enemy. Deals extra damage to burned
        enemies. **Garula: Deals Medium Wind damage to a single enemy. Deals extra
        damage to burned enemies. **Garudyne: Deals Heavy Wind damage to a single
        enemy. Deals extra damage to burned enemies. *Magaru: Deals Light Wind damage
        to all enemies. **Magarula: Deals Medium Wind damage to all enemies. **Magarudyne:
        Deals Heavy Wind damage to all enemies. *Wind Break: Negates an enemy''s resistance
        to Wind-based attacks. *Wind Boost: Passively strengthens Wind-based attacks
        by 25%. **Wind Amp: Passively strengthens Wind-based attacks by 50%. Stacks
        with Wind Boost. *Lucky Punch: Deals Miniscule Physical damage to a single
        enemy. High chance of dealing extra damage and knocking down the enemy. Deals
        bonus damage to dizzy, frozen or shocked enemies. **Miracle Punch: Deals Medium
        Physical damage to a single enemy. High chance of dealing extra damage and
        knocking down the enemy. Deals bonus damage to dizzy, frozen or shocked enemies.
        *Dia: Slightly recovers his or an ally''s HP. **Diarama: Moderately recovers
        his or an ally''s HP. **Diarahan: Fully recovers his or an ally''s HP. *Media:
        Slightly recovers the entire party''s HP. **Mediarama: Moderately recovers
        the entire party''s HP. **Mediarahan: Fully recovers the entire party''s HP.
        **Salvation: Fully recovers the entire party''s HP, and cures all physical
        and mental status ailments. *Patra: Cures the Dizzy/Forget/Sleep/Hunger status
        ailments for himself or an ally. **Me Patra: Cures the Dizzy/Forget/Sleep/Hunger
        status ailments for himself and all allies. *Recarm: Revives a fallen ally
        with half their HP. **Samarecarm: Revives a fallen ally with full HP. *Masukunda:
        Reduces all enemies'' accuracy and evasion for some time. *Evade Elec: Passively
        triples evasion against all Electricity-based attacks.'
