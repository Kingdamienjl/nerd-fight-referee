- id: claim-powers-and-abilities-075ebbab
  section: abilities
  axis: hax
  text: 'Late-Game= {{#tag:tabber| {{!}}-{{!}}Base= Superhuman Physical Characteristics,
    Weapon Mastery (One-handed swords and pistols), Stealth Mastery, Acrobatics, Regeneration
    (Mid-Low, speed depends on willpower), Summoning (Goro is capable of summoning
    items from the Phantom Thieves'' inventory for use in battle), Superhuman Charisma
    (Goro is capable of assisting Ren Amamiya in Shadow Negotiation), Supernatural
    Willpower, Empowerment, Accelerated Development and Reactive Evolution (Battle,
    Leveling, and Training; Physical Stats, Magic, and Improved Resistances. (Humans
    are able to get more powerful after defeating strong demons or even as they are
    in the middle of battle, even against opponents ontologically superior to them,
    and are able to grow massively in strength in the span of merely a day''s time
    or less, either through resolve, the threat of death, or training, or the bonds
    they hold dear), Information Analysis (Sleuthing Mastery, an ability which Goro
    taught to Ren, allows him to immediately discern the elemental affinities of a
    single target) and Cognition (Type 1), Non-Physical Interaction, Durability Negation,
    Healing Nullification, Immortality Negation (Type 2, 3, and 7), and Invulnerability
    Negation (Capable of interacting with Demons, which are invisible beings comprised
    of data and information, the fulcrum of the entire verse proper, a concept synonymous
    to souls, minds, and even concepts. Even entities devoid of time and space, and
    nonexistent bodies such as The White can be struck down. Can completely negate
    their invulnerability to conventional weaponry, and the requirement of needing
    to be on a specific informational frequency to harm, as well as Septentriones,
    which require spiritual attacks to harm, and as well as killing undead beings
    and regenerative entities, such as Nagas and Blobs). {{!}}-{{!}}With Persona=
    Cognitive Physiology (Persona), Magic, consisting of: Fire, Energy, Holy, Light,
    Curse, Darkness and Light/Dark-based Death Manipulation. Berserk Mode (with Call
    of Chaos), Resistance Negation and Existence Erasure (Can use Almighty Attacks,
    which bypass all barriers and reflectors, invulnerability, and resistances. Can
    even negate an opponents resistance to resistance negation with Pierce. Almighty
    attacks are able to hurt someone wielding the Omnipotent Orb, which bends the
    rules of reality to defend the user from attacks, and Reason Bearers, who are
    able to enforce rules into reality to protect themselves from attacks. The Megi-
    line of spells is capable of obliterating opponents with a light that erases them
    "beyond death"), Healing, Purification and Resurrection (with various support
    spells), Statistics Amplification and Statistics Reduction (with Physical skills
    and various support spells), Buff and Debuff Negation (with Dekaja and Dekunda),
    Damage Boost (with critical hits), Damage Reduction (with Guard), Forcefield Creation
    and Attack Reflection (with Tetrakarn and Makarakarn), Limited Precognition (with
    Evade Bless), Status Effect Inducement, which includes, Madness Manipulation (with
    Call of Chaos), Empathic Manipulation (with Negative Pile) and Power Nullification
    (with various Binds). {{!}}-{{!}}With Skill Accessories= Through equipping certain
    accessories, Goro can possess any of the following: Enhanced Regeneration, Statistics
    Amplification, Attack Reflection, Forcefield Creation, Attack Absorption, Limited
    Precognition, Healing, Purification, Fire Manipulation, Electricity Manipulation,
    Air Manipulation, Radiation Manipulation, Explosion Manipulation, Light Manipulation,
    Holy Manipulation, Darkness Manipulation and Curse Manipulation. Invulnerability
    to Memory Manipulation and Sleep Manipulation. {{!}}-{{!}}Resistances and Affinities=
    Time Manipulation (should be able to move in stopped time, similar to Ren), Cognition
    (the Phantom Thieves'' wills of rebellion serve as protection against the effects
    of Cognition). With Robin Hood, Resistance to Light Manipulation and Holy Manipulation,
    with Loki, Invulnerability to Darkness Manipulation and Curse Manipulation, BFR,
    Absolute Zero, Existence Erasure, Information Manipulation, Mind Manipulation,
    Soul Manipulation, Fusionism and Memory Manipulation (Simply having the potential
    to awaken a Persona grants one a will firm enough to maintain their own existence
    and individuality in the unconscious world, where the concept of the ego does
