    - field: weaknesses
      value: 'Goro''s physical and spiritual vitality is drained by using physical
        and magical skills respectively. Using Call of Chaos on himself causes him
        to go berserk, which causes his skill and tactical prowess to deteriorate
        in exchange for the massive increase in power. Notable Attacks/Techniques:
        Persona Summoning: The ability to summon and utilize Personas. Personas can
        move and attack independently of their users, allowing for concurrent attacks
        to be performed. They are summoned and directed through thought and instinct,
        and most attacks manifest just as quickly and are controlled through the same
        means; and it should be noted that Personas do not need to be summoned in
        order to use their skills. Each Persona has a unique set of statistics and
        elemental affinities, which also apply to their user while the Persona is
        equipped. Goro''s initial Persona is Robin Hood, his evolved Persona is Loki,
        and his ultimate Persona is Hereward. Persona Skills: Personas are all able
        to use certain skills and spells related to the stories/mythologies of the
        figure they are based on. Persona-users and their Personas can use skills
        and spells independently of each other. These skills range from amplified
        physical attacks, highly-malleable elemental attacks, status buffs and debuffs,
        ailment infliction, passive defenses and more, can manifest instantly and
        with a thought, as well as affect the mind, soul, information and concept
        of the target. |-|Robin Hood= *Megidolaon: Severe Almighty damage to all foes.
        *Megaton Raid: Severe Physical damage to one foe. *Kougaon: Heavy Bless damage
        to one foe. *Makougaon: Heavy Bless damage to all foes. *Eigaon: Heavy Curse
        damage to one foe. *(Ma)Hamaon: Inflicts Bless-based instant death to one/all
        foes. *(Ma)Mudoon: Inflicts Curse-based instant death to one/all foes. *Fortify
        Spirit: Passively increases resistance to ailments. *Attack Master: Automatically
        casts Tarukaja on user at the start of battle. *Samarecarm: Revives one ally.
        *Debilitate: Cripples attack power, defenses, speed and agility of one enemy.
        *Charge: Multiplies the power of the next physical attack by 2.5x. *Refresh:
        Heals all allies within a short range by a small amount, while curing all
        ailments. *Holy Touch: Medium Physical damage to one foe. Inflicts Magic Bind.
        *Arrow Rain: Summons a rain of arrows to deal medium Physical damage to all
        foes several times. *Detective''s Ban: Inflicts Strength, Magic and/or Agility
        Bind on all enemies. |-|Loki= All Previous Abilities, plus the following:
        *Laevateinn: Colossal Physical damage to one foe. *Brave Blade: Colossal Physical
        damage to one foe. *Negative Pile: Heavy Physical damage to one foe. Inflicts
        Despair. *Deathbound: Summons a wave of flailing, shadowy arms from the ground
        to inflicts medium Physical damage to all foes several times. *Riot Gun: Severe
        Gun-based damage to all foes. *Dekaja: Negates all stat buffs on enemy side.
        *Dekunda: Negates all stat debuffs on ally side. *Heat Riser: Increases attack
        power, defenses, speed and agility of one ally. *Tetrakarn: Erects a physically-reflective
        shield. *Makarakarn: Erects a magically-reflective shield. *Maeiga: Medium
        Curse damage to all foes. *Maragion: Medium Fire damage to all foes. *Desperation:
        Increases self attack power at the cost of defense being lowered. Cannot be
        negated. *Evade Bless: Triples evasion against Bless attacks. |-|Hereward=
        All Previous Abilities, plus the following: *Rebellion Blade: Colossal Almighty
        damage to one foe. Highly effective on downed enemies. *Debilitate: Cripples
        attack power, defenses, speed and agility of one enemy. *Arms/Spell Master:
        Halves the costs of physical/magical skills. Cognition: According to Morgana,
        the entire world is a product of Cognition; that is, what is real is only
        determined by humanity''s perception. It is effectively a form of collective
        Subjective Reality possessed by humanity. Within the Metaverse, this effect
        is taken to its extremes, resulting in things such as fake guns becoming real
        just by someone subconsciously believing that it is, and said guns being always
        loaded due to the enemy''s subconscious assumption that a gun being held with
        hostile intent would naturally be so. More subtle displays of Cognition are
        also shown, such as when Ryuji Sakamoto managed to harm Shadows prior to awakening
        to his Persona, despite Shadows being invulnerable to all forms of standard
        physical interaction, simply because he believed that those Shadows were normal
        people playing a cruel prank. Will of Rebellion: The Phantom Thieves'' outfits
