- id: claim-powers-and-abilities-b2e0fd13
  section: abilities
  axis: hax
  text: 'Early to Mid-Game= {{#tag:tabber| {{!}}-{{!}}Base= Superhuman Physical Characteristics,
    Martial Arts, Weapon Mastery (Blunt Weapons), Stealth Mastery, Acrobatics, Regeneration
    (Mid-Low, speed depends on willpower), Summoning (Ryuji is capable of summoning
    items from his inventory for use in battle, as shown on multiple occasions where
    large items and equipment are pulled out of nowhere and used despite being missing
    in both gameplay and cutscenes), Superhuman Charisma (Ryuji can assist Ren in
    Shadow Negotiation) and Supernatural Willpower, Empowerment, Reactive Power Level,
    and Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic,
    and Improved Resistances. Humans are able to get more powerful after defeating
    strong demons or even as they are in the middle of battle, even against opponents
    ontologically superior to them, and are able to grow massively in strength in
    the span of merely a day''s time or less, either through resolve, the threat of
    death, or training, or the bonds they hold dear, Non-Physical Interaction, Durability
    Negation, Healing Nullification, Immortality Negation (Type 2, 3, and 7), and
    Invulnerability Negation (Capable of interacting with Demons, which are invisible
    beings comprised of data and information, the fulcrum of the entire verse proper,
    a concept synonymous to souls, minds, and even concepts. Even entities devoid
    of time and space, and nonexistent bodies such as The White can be struck down.
    Can completely negate their invulnerability to conventional weaponry, and the
    requirement of needing to be on a specific informational frequency to harm, as
    well as Septentriones, which require spiritual attacks to harm, and as well as
    killing undead beings and regenerative entities, such as Nagas and Blobs) {{!}}-{{!}}With
    Persona= Cognitive Physiology (Persona), Magic, consisting of: Electricity Manipulation.
    Resistance Negation (with Break skills), Statistics Amplification, Damage Boost
    (with critical hits), Damage Reduction (with Guard), Status Effect Inducement,
    which includes: Empathic Manipulation (Despair and Confusion) and Memory Manipulation
    {{!}}-{{!}}With Skill Accessories= Through equipping certain items, Ryuji can
    possess any of the following: Enhanced Regeneration, Statistics Amplification,
    Attack Reflection, Forcefield Creation, Attack Absorption, Limited Precognition,
    Healing, Purification, Fire Manipulation, Electricity Manipulation, Air Manipulation,
    Radiation Manipulation, Explosion Manipulation, Light Manipulation, Holy Manipulation,
    Darkness Manipulation and Curse Manipulation. Invulnerability to Memory Manipulation
    and Sleep Manipulation {{!}}-{{!}}Resistances and Affinities= Resistance to Cognition
    (the Phantom Thieves'' wills of rebellion serve as protection against the effects
    of Cognition). With Captain Kidd, Resistance to Electricity Manipulation, Cognition
    (the Phantom Thieves'' wills of rebellion serve as protection against the effects
    of Cognition). Existence Erasure, Information Manipulation, Mind Manipulation,
    Soul Manipulation, Fusionism and Memory Manipulation (Simply having the potential
    to awaken a Persona grants one a will firm enough to maintain their own existence
    and individuality in the unconscious world, where the concept of the ego does
    not exist and all individuality dissolves into oneness, with ordinary people being
    immediately overwhelmed by the nothingness and scattered throughout all possible
    worlds by stepping into it), Fate Manipulation and Curse Manipulation (Like the
    other protagonists, she is likely able to fight and defeat White Rider, the abstract
    embodiment of victory and conquest whose crown assures his success in all battles
    and wars. Unbothered by interactions with Pisacas, which fate humans to die in
    the span of nine months), Disease Manipulation, Probability Manipulation, Madness
    Manipulation and Chaos Manipulation (Unaffected by the act of looking into Girimehkala''s
    eye, which inflicts incurable sickness and misfortune into individuals, and by
    the gaze of Yakkha, which is said to inflict disease and madness), Petrification
    and Poison Manipulation (Can easily do battle against Basilisk and Cockatrice,
    both of whom turn normal people into stone simply by being touched or looked at,
    and have a gaze and breath so poisonous that any mortal being near them instantly
    dies, turning their surroundings into a desert), Life and Death Manipulation (Can
    fight Liches, whose presence drains the life of those who see them, and is not
    affected by Balor''s gaze, which instantly kills enemies, and Chatterskull''s
    laughter, which dooms whoever hears it to death, immediately stopping their heart)
    }} |-|Mid to Late-Game= {{#tag:tabber| {{!}}-{{!}}Base= All previous abilities
    to a greater extent. Enhanced Stealth Mastery (with Stealth Dash, which he taught
    Ren) {{!}}-{{!}}With Persona= All previous abilities to a greater extent. Weapon
    Creation (with God''s Hand), Earth Manipulation and Summoning (can summon meteors
    with Agneyastra), Lim'
