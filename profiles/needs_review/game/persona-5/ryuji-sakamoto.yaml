  description: 'resistant to Electrical attacks but is vulnerable to Wind-based attacks.
    Seiten Taisei: Ryuji''s evolved Persona and a famed trickster of myth. Better
    known as the Monkey King, Sun Wukong, he wields a staff that supposedly weighs
    8,000 kg to crush his foes underneath. He is resistant to Fire attacks and can
    completely nullify most Electricity-based attacks, but is vulnerable to wind-based
    attacks. William: Ryuji''s ultimate Persona. William Kidd was a Scottish pirate
    and privateer in the 17th century. His early career was spent in the Caribbean,
    where he aided the besieged English colony of Nevis by ransacking the attacking
    French. In recognition of his actions, the King of England awarded him a letter
    of marque, granting him legal protection so long as he remained loyal. However,
    during a voyage to the Indian Ocean, his crew plundered a neutral ship without
    his knowledge, branding him an outlaw once more. *Zio: Inflicts light electric
    damage to one enemy, potentially paralyzing the target. This paralysis can be
    spread through physical contact, even to Ryuji himself. *Lunge: Inflicts light
    physical damage to one enemy. *Tarukaja: Enhances the attack power of one party
    member for a time. *Headbutt: Inflicts light physical damage to one enemy. Medium
    chance to inflict Forget, which prevents afflicted enemies from using any special
    abilities. *Adverse Resolve: Passively enhances Ryuji''s chance to deal critical
    damage when ambushed. *Rampage: Rapidly inflicts light physical damage up to 3
    times to one enemy. *Mazio: Inflicts light electric damage to all enemies, potentially
    paralyzing the target. This paralysis can be spread through physical contact,
    even to Ryuji himself. *Bad Beat: Inflicts moderate physical damage to all enemies,
    potentially inflicting them with Despair. This renders the victim completely incapable
    of any action for a short time, after which they will take their own life. *Assault
    Dive: Inflicts heavy physical damage to one enemy. *Zionga: Inflicts moderate
    electric damage to one enemy, potentially paralyzing them. This paralysis can
    be spread through physical contact, even to Ryuji himself. *Swift Strike: Rapidly
    inflicts light physical damage between 3 to 4 times to one enemy. *Elec Break:
    Negates one enemy''s resistance to electrical attacks for a time. *Mazionga: Inflicts
    moderate electric damage to all enemies, potentially paralyzing the target. This
    paralysis can be spread through physical contact, even to Ryuji himself. *Deathbound:
    Rapidly inflicts moderate physical damage up to 2 times to all enemies. *Elec
    Boost: Passively enhances Ryuji''s electrical attacks by 25%. *Megaton Raid: Inflicts
    severe physical damage to one enemy. *Ziodyne: Inflicts heavy electric damage
    to one enemy, potentially paralyzing them. This paralysis can be spread through
    physical contact, even to Ryuji himself. *Matarukaja: Enhances the attack power
    of all party members for a time. *Charge: Multiplies the power of Ryuji''s next
