  description: "resistance to fire. *Diarama: Restores a moderate amount of health\
    \ to one member of the party. *Tentarafoo: Inflicts Confuse to all foes. *Ambient\
    \ Aid: Greatly increase the chance of inflicting ailments in rain or special weather.\
    \ *Maragion: Inflicts a moderate amount of Fire damage to all enemies. Inflicts\
    \ Burn. *Fire Boost: Enhances Fire attacks by 25%. *Matarunda: Decreases the enemy\
    \ team's attack by 25%. *Agidyne: Inflicts heavy fire damage to a single opponent.\
    \ Inflicts Burn. *Burn Boost: Enhance chance of inflicting Burn status. *Maragidyne:\
    \ Inflicts heavy fire damage on all enemies. Inflicts Burn. *Diarahan: Fully restores\
    \ the health of a single party member. *Concentrate: The next magic based attack\
    \ made by Ann deals 2.5x damage. *Fire Amp: Enhances Fire attacks by 50%. *Masochist\
    \ Lash: Additional attack when a target is bound. *Mind Charge:: Triple magic\
    \ attack for next hit. Lasts for 3 attacks. *Blazing Hell: Severe Fire damage\
    \ to all foes. Inflicts Burn. *Evade Ice: Triples evasion chance against Ice attacks.\
    \ *High Energy: Next magical attack inflicts 2.5x damage for party. Unique to\
    \ C\xE9lestine. Cognition: According to Morgana, the entire world is a product\
    \ of Cognition; that is, what is real is only determined by humanity's perception.\
    \ It is effectively a form of collective Subjective Reality possessed by humanity.\
    \ Within the Metaverse, this effect is taken to its extremes, resulting in things\
    \ such as fake guns becoming real just by someone believing that it is, and said\
    \ guns being always loaded due to the enemy's logical assumption that a gun being\
    \ held with hostile intent would naturally be so. More subtle displays of Cognition\
    \ are also shown, such as when Ryuji Sakamoto managed to harm Shadows prior to\
    \ awakening to his Persona, despite Shadows being invulnerable to all forms of\
    \ standard physical interaction, simply because he believed that those Shadows\
    \ were normal people playing a cruel prank. Will of Rebellion: The Phantom Thieves'\
    \ outfits take the form of one's image of rebellion, and reflect the strength\
    \ of their will to rebel against others' desire to control them. This will of\
    \ rebellion manifests as the aforementioned outfits, which protect the Phantom\
    \ Thieves from the effects of Cognitive Distortions. Naturally, the stronger the\
    \ will, the greater the extent of their resistance to the effects of Cognition.\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Persona\
