        \ Users Category:Flight Users Category:Game Characters Category:Gun Users\
        \ Category:Healers Category:Humans Category:Immortals Category:Incorporeal\
        \ Characters Category:Invulnerability Users Category:Magic Users Category:Mind\
        \ Users Category:Non-Physical Interaction Users Category:Playable Characters\
        \ Category:Power Nullification Users Category:Protagonists Category:Regeneration\
        \ Users Category:Resistance Negation Users Category:Role-playing Characters\
