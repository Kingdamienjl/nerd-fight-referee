- id: claim-standard-equipment-9b9d824e
  section: equipment
  axis: equipment
  text: '| |-|Various= Phantom Thief Outfit, Knives, Pistols, Grappling Hook, various
    equipment, as well as various battle and consumable items. Some items are only
    accessible past certain points in the game, and as such, the more notable items
    are listed below. |-|Early to Mid-Game= *Regent: Grants Attack Master. *Orlov:
    Grants High Counter. *Queen''s Necklace: Grants Mana Surge. *Stone of Scone: Grants
    Dodge Phys. *Ring of Lust: Grants use of Champion''s Cup, which moderately heals
    as well as increases the attack power of a single target. *Ring of Vanity: Grants
    use of Bleeding Dry Brush, which erects a barrier around the user that absorbs
    a single incoming attack; while passively negating the user''s weaknesses. *Ring
    of Gluttony: Grants use of Vault Guardian, which increases the defenses of all
    allies. *Aid Charm/Spiral Aid Charm: Grants use of Dia/Media. *Energy Charm/Spiral
    Energy Charm: Grants use of Energy Drop/Energy Shower. *Magnetic Necklace: Grants
    Fast Heal. *Nuisance Belt: Grants Ambient Aid. *Cat Brooch: Grants use of Sukukaja.
    *Lucky Belt: Grants use of Lucky Punch. *Assault Belt: Grants use of Assault Dive.
    *Rush Belt: Grant use of Kill Rush. *Giant Slice Belt: Grants use of Giant Slice.
