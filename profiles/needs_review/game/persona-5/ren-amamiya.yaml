- id: claim-weaknesses-ba626aba
  section: weaknesses
  axis: weakness
  text: 'Ren''s physical and spiritual vitality is drained by using physical and magical
    skills respectively. Notable Attacks/Techniques: Persona Summoning: The ability
    to summon and utilize Personas. Personas can move and attack independently of
    their users, allowing for concurrent attacks to be performed. They are summoned
    and directed through thought and instinct, and most attacks manifest just as quickly
    and are controlled through the same means; and it should be noted that Personas
    do not need to be summoned in order to use their skills. Each Persona has a unique
    set of statistics and elemental affinities, which also apply to their user while
    the Persona is equipped. The Personas that Ren has access to are listed here.
    Persona Traits: As shown in P5R, all Personas possess inherent traits that assist
    in combat or support. The complete list of traits available are listed here. Persona
    Skills: Personas are all able to use certain skills and spells related to the
    stories/mythologies of the figure they are based on. Persona-users and their Personas
    can use skills and spells independently of each other. These skills range from
    amplified physical attacks, highly-malleable elemental attacks, status buffs and
    debuffs, ailment infliction, passive defenses and more, can manifest instantly
    and with a thought, as well as affect the mind, soul, information and concept
    of the target. The complete list of skills that Ren has access to are here. The
    skills listed below are particularly notable. |-|Offensive= *Armor Breaker/Armor
    Destroyer: Physical attacks that lower defenses on contact. *Kidney Smash/Weapon
    Crusher: Physical attacks that lower attack power on contact. *Arm Chopper/Arm
    Crusher: Physical attacks that inflict Strength Bind. *Holy Touch/Saint''s Touch:
    Physical attacks that inflict Magic Bind. *Leg Reaper/Achilles Reaper: Physical
    attacks that inflict Agility Bind. *Dream Needle/Dormin Rush: Physical attacks
    that inflict Sleep. *Calm Blade: Physical attacks that inflict Hex. *Terror Claw/Bloodbath/Death
    Scythe: Physical attacks that inflict Fear. *Headbutt/Memory Blow: Physical attacks
    that inflict Forget. *Hysterical Slap/Oni Kagura: Physical attacks that inflict
    Rage. *Brain Shake/Brain Buster: Physical attacks that inflict Brainwash. *Sledgehammer/Flash
    Bomb: Physical attacks that inflict Dizzy. *Skull Cracker: Physical attacks that
    inflict Confusion. *Negative Pile/Bad Beat: Physical attacks that inflict Despair.
    *Lucky/Miracle Punch/One-Shot Kill: Physical attacks that have a high critical
    rate. *Hassou Tobi: A physical attack that multiplies speed by 8x to perform.
    *Hamaon/Mudoon/Samsara/Die For Me: Death spells. *Divine Judgement/Demonic Decree:
    Life-halving spells. *Pralaya: A powerful Almighty attack that inflicts Death.
    *Stagnant Air: Changes the air in the environment to make targets more susceptible
    to ailments. *Ghastly Wail: An Almighty-based Death spell that instantly kills
    all enemies afflicted with Fear. |-|Ailments/Binds/Circles= *Makajama/Makajamaon:
    Inflicts Magic Bind to one/all enemies. *Disarm: Inflicts Strength Bind to all
    enemies. *Scarecrow: Inflicts Agility Bind to all enemies. *Salome''s Kiss: Inflicts
    Strength, Magic and Agility Binds to all enemies. *Dormina/Lullaby: Inflicts Sleep.
    *Evil Touch/Evil Smile: Inflicts Fear. *Ominous Words/Abysmal Surge: Inflicts
    Despair. *Marin Karin/Brain Jack: Inflicts Brainwash. *Poisma/Poison Breath: Inflicts
    Poison. *Pulinpa/Tentarafoo: Inflicts Confusion. *Dazzler/Nocturnal Flash: Inflicts
    Dizzy. *Taunt/Wage War: Inflicts Rage. *Sleep Circle: Casts a persisting wide-area
    magic circle that inflicts Sleep to all enemies inside. *Poison Circle: Casts
    a persisting wide-area magic circle that inflicts Poison to all enemies inside.
    *Confusion Circle: Casts a persisting wide-area magic circle that inflicts Confusion
    to all enemies inside. *Stun Circle: Casts a persisting wide-area magic circle
    that inflicts Paralysis to all enemies inside. *Decay Circle: Casts a persisting
    wide-area magic circle that inflicts Strength Bind to all enemies inside. *Silence
    Circle: Casts a persisting wide-area magic circle that inflicts Magic Bind to
    all enemies inside. *Lethargy Circle: Casts a persisting wide-area magic circle
    that inflicts Agility Bind to all enemies inside. |-|Support= *Diarahan: Instantly
    heals all injuries and damage. *Amrita Drop: Instantly cures all negative afflictions.
    *Salvation: Instantly heals all injuries and negative afflictions for all allies.
    *Samarecarm: Revives a target at full health. *Holy Benevolence: Revives all allies
    at full health. *Heat Riser: Amplifies attack power, defenses, speed and agility.
    *Thermopylae: Amplifies attack power, defenses, speed and agility of all allies
    when disadvantaged. *Debilitate: Cripples attack power, defenses, speed and agility
    of one enemy. *Charge/Concentrate: Multiplies next physical/magical attack power
    by 2.5x. *Tetrakarn/Makarakarn: Erects a shield that reflects one physical/magical
    attack. *Tetraja:'
