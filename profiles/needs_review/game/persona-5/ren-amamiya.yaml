    - field: weaknesses
      value: "Several of his techniques can cause damage to him or require SP to use,\
        \ If his Persona is damaged, so will he, and vice versa. Notable Attacks/Techniques:\
        \ Persona Summoning: Ren's main ability consists of being able to summon his\
        \ Persona, a powerful spirit of legend. Since he was chosen to be the Trickster,\
        \ he has the power of the Wild Card, which allows him to summons multiple\
        \ Persona with varying levels of power and skills. *Arsene: Ren's initial\
        \ Persona, which represents his personality and philosophy. It is based on\
        \ Maurice Leblanc's gentleman thief, Ars\xE8ne Lupin. Arsene is resistant\
        \ towards Darkness-based skills, and vulnerable to Ice and Light based ones.\
        \ **Eiha: A Curse-based skill that deals minor damage to one foe. **Cleave:\
        \ Arsene slashes the foe, dealing light physical damage. **Sukunda: Lowers\
        \ the enemy's precision and agility. **Dream Needle: A physical attack that\
        \ has chances of putting the opponent to sleep. **Adverse Resolve: A passive\
        \ ability that increases Ren's chances of dealing critical damage after being\
        \ ambushed. *Vishnu: The Ultimate Persona of the Fool Arcana (discounting\
        \ Satanael). Based on the Hindu deity of the same name. It's immune to light\
        \ and darkness, and has the ability to absorb Ice-based attacks. **Ali Dance:\
        \ Automatically halves the opponent's chances of hitting the user. **Magarudyne:\
        \ Strong Wind-based attack that deals heavy damage to all enemies. **Megidolaon:\
        \ Non-elemental magic attack that deals massive damage to all foes. **Vacuum\
        \ Wave: Wind-based attack that deals massive damage to all foes. **Charge:\
        \ Increases the power of the next physical attack by 2.5 times its original\
        \ power. **Repel Fire: Automatically deflects all fire-based attacks. **Wind\
        \ Amp: Automatically strengthens the power of Wind-based attacks. **Riot Gun:\
        \ A gun-based attack that deals massive damage to all foes. *Futsunushi: The\
        \ Ultimate Persona of the Magician Arcana. Based on Futsunushi-no-kami, the\
        \ Shintoist god of swords. Vulnerable to nuclear attacks, but resistant towards\
        \ physical damage. **Ali Dance: Automatically halves the opponent's chances\
        \ of hitting the user. **Matarukaja: Increases the strength of all allies.\
        \ **Myriad Slashes: A physical attack that deals medium damage multiple times.\
        \ **Charge: Increases the power of the next physical attack by 2.5 times its\
        \ original power. **Regenerate 3: Automatically restores the user's health\
        \ after every turn. **Apt Pupil: Automatically increases the user's chances\
        \ of dealing critical damage. **Firm Stance: Doubles the user's defense, but\
        \ nullifies his evasion. **Brave Blade: An attack that deals colossal physical\
        \ damage to one foe. *Cybele: The Ultimate Persona of the High Priestess Arcana.\
        \ Based on a deity that was considered to be the mother of all deities. Resistant\
        \ against Light-based skills, but vulnerable to Nuclear ones. **Makougaon:\
        \ Light-based attack that deals heavy damage to all foes. **Mediarahan: Fully\
        \ restores the health of all party members. **Samarecarm: Revives a fallen\
        \ ally with full health. **Bless Amp: Automatically strengthens the power\
        \ of Bless-based attacks. **Auto-Mataru: Automatically increases the strength\
        \ of all party members. **Absorb Bless: Automatically absorbs Bless-based\
        \ skills. **Salvation: Fully heals the party and removes status ailments.\
        \ *Mother Harlot: The Ultimate Persona of the Empress Arcana. Based on the\
        \ Whore of Babylon, mother of all abominations that roam the Earth. Immune\
        \ to light and darkness-based attacks, and able to deflect electricity-based\
        \ ones. **Mabufudyne: Attack that deals heavy Ice damage to multiple foes\
