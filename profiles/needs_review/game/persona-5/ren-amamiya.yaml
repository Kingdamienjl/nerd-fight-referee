      his Palace, an entire parallel universe), higher with Willpower | Low Complex
      Multiverse level (Able to fight and defeat Thor, who is vastly superior to the
      combined forces of the Four Heavenly Kings, which are capable of sustaining
      a barrier separating the Human World from the Expanse. The latter being a plane
      that transcends the past, present and future across the multiverse, by himself),
      higher with Willpower | Outerverse level (Both assisted and fought alone against
      Masayoshi Shido, who should be superior to Parvati, a Shadow within his Palace,
      who is an entity that holds the aspect of Kali Ma within herself, who is stronger
      than the likes of Baal), higher with Willpower | Outerverse level (Assisted
      in the defeat of the Holy Grail, the Administrator of the Collective Unconscious,
      who began the gradual fusion of Assiah and Kadath, and is superior to the likes
      of Enlil, who in turn is above Masakado), higher with Willpower | Outerverse
      level (Assisted in the defeat of Yaldabaoth, who was stated to be on a totally
      different level than the Holy Grail, and was ultimately the one to defeat him),
      higher with Willpower, far higher with Satanael (One-shotted Yaldabaoth with
      a Sinful Shell) | Outerverse level (Assisted in the defeat of Azathoth and Maruki,
      the former being stated to be on a whole other level than Yaldabaoth and is
