- id: claim-powers-and-abilities-54d599ae
  section: abilities
  axis: hax
  text: 'Mid-Game= {{#tag:tabber| {{!}}-{{!}}Base= Superhuman Physical Characteristics,
    Martial Arts, Weapon Mastery (Whips), Stealth Mastery, Acrobatics, Regeneration
    (Mid-Low, speed depends on willpower), Summoning (Haru is capable of summoning
    items from her inventory for use in battle, as shown on multiple occasions where
    large items and equipment are pulled out of nowhere and used despite being missing
    in both gameplay and cutscenes), Superhuman Charisma (can assist Ren in Shadow
    Negotiation) and Supernatural Willpower, Empowerment, Accelerated Development,
    Reactive Power Level, and Reactive Evolution(Battle, Leveling, and Training; Physical
    Stats, Magic, and Improved Resistances. Humans are able to get more powerful after
    defeating strong demons or even as they are in the middle of battle, even against
    opponents ontologically superior to them, and are able to grow massively in strength
    in the span of merely a day''s time or less, either through resolve, the threat
