    - field: weaknesses
      value: 'She and her Personas are weak to nuclear attacks. Notable Attacks/Techniques:
        Persona Summoning: The ability to utilize Personas, powerful manifestations
        of the mind and soul. Personas can move and attack independently of their
        users, allowing for double-teaming between their user and the equipped Persona.
        Each Persona has a set of elemental affinities, which also apply to their
        user while the Persona is equipped. Persona Traits: As shown in P5R, all Personas
        possess inherent traits that assist in combat or support. The complete list
        of traits available are listed here. Persona Skills: Personas are all able
        to use certain skills and spells related to the stories/mythologies of the
        figure they are based on. Persona-users and their Personas can use skills
        and spells independently of each other. These skills range from amplified
        physical attacks, highly-malleable elemental attacks, status buffs and debuffs,
        ailment infliction, passive defenses and more, can manifest instantly and
        with a thought, as well as affect the mind, soul, information and concept
        of the target. The complete list of skills that Ren has access to are listed
        here. The skills listed below are particularly notable. *Psio: A psychic-based
        attack that deals medium damage to one foe. It deals more damage to those
        that are affected by any sort of mental ailment. *Mapsio: A psychic attack
        that deals medium damage to all foes. It deals more damage to those that are
        affected by any sort of mental ailment. *Triple Down: A gun-based attack that
        deals light damage a total of three times. *Amrita Drop: A healing move that
        cures herself or any ally of all types of status ailments. *Psy Break: A passive/aggressive
        skill which temporarily dispels an enemy''s resistance to psychic attacks.
        *Tetrakarn: Milady creates a shield that returns all physical and gun-based
        damage to the enemy once. *Psy Boost: A passive ability that automatically
        strengthens the power of psychic skills by 25%. *Makarakarn: Milady creates
        a shield that returns all magic-based damage to the enemy once. *Climate Decorum:
        A passive ability that automatically doubles Haru''s evasion when it''s raining
        or there''s any sort of special weather condition. *Psiodyne: A psychic attack
        that deals high damage to one foe. It deals more damage to those that are
        affected by any sort of mental ailment. *Snipe: A passive ability that automatically
        strengthens the power of gun-based skills by 25%. *One-Shot Kill: A gun-based
        skill that deals massive damage to the enemy while also having an increased
        critical rate. *Amrita Shower: A healing move that cures herself and all her
        allies of all types of ailments. *Mapsiodyne: A psychic attack that deals
        high damage to all foes. It deals more damage to those that are affected by
        any sort of mental ailment. *Cripple: A passive ability that automatically
        strengthens the power of gun-based skills by 50%. *Psy Amp: A passive ability
        that automatically strengthens the power of psychic skills by 50%. *Heat Riser:
        A temporary buff that increases all of Haru''s stats for some time. *Evade
        Nuke: Exclusive to Astarte. A passive ability which automatically triples
        the evasion rate against Nuke-based Attacks. *Life Wall: Erect a shield on
        party to repel 1 (non-Almighty) attack. Milady: Haru''s initial Persona, who
        is based on Milady de Winter, from Dumas'' "The Three Musketeers". She hides
        several types of guns and cannons under her skirt, specializes in Psychic
        skills, and is resistant towards psychic attacks, but vulnerable to nuclear
        explosions. Astarte: Haru''s evolved Persona, who is based on a Goddess of
        fertility and love from several cultures in the world. She retains all of
        Milady''s skills, is resistant towards ice-based Attacks and highly resistant
        to psychic attacks, but is vulnerable to nuclear attacks. However, she compensates
        for this weakness somewhat with her Evade Nuke skill. Lucy: Haru''s ultimate
        Persona, who is based off of Lucy Hay, Countess of Carlisle, an English courtier
        who was active during the reign of Charles I and the Second Civil War. She
        is notable for aiding both sides at different times Cognition: According to
        Morgana, the entire world is a product of Cognition; that is, what is real
        is only determined by humanity''s perception. It is effectively a form of
        collective Subjective Reality possessed by humanity. Within the Metaverse,
        this effect is taken to its extremes, resulting in things such as fake guns
        becoming real just by someone believing that it is, and said guns being always
        loaded due to the enemy''s logical assumption that a gun being held with hostile
        intent would naturally be so. More subtle displays of Cognition are also shown,
        such as when Ryuji Sakamoto managed to harm Shadows prior to awakening to
