    - field: weaknesses
      value: 'He and his Personas are vulnerable to ice-based attacks. Although this
        can be made irrelevant through items or his later Persona awakenings. Notable
        Attacks/Techniques: Persona Summoning: The ability to utilize Personas, powerful
        manifestations of the mind and soul. Personas can move and attack independently
        of their users, allowing for double-teaming between their user and the equipped
        Persona. Each Persona has a set of elemental affinities, which also apply
        to their user while the Persona is equipped. Yusuke''s initial Persona is
        Goemon, his evolved Persona is Kamu Susano''o and his ultimate Persona is
        Gorokichi. *Bufu: Light Ice damage to 1 foe. Rare chance of inflicting Freeze.
        *Giant Slice: Medium physical damage to 1 foe. *Sukukaja: Buff agility of
        1 ally for 3 turns. *Vicious Strike: Medium physical damage to all foes. *Mabufu:
        Light Ice damage to all foes. Rare chance of inflicting Freeze. *Rising Slash:
        Heavy physical damage to 1 foe. Stronger when used during teamwork. *Mind
        Slice: Medium physical damage to all foes. Low chance of inflicting Confuse.
        *Bufula: Medium Ice damage to 1 foe. Rare chance of inflicting Freeze. *Speed
        Master: Automatic speed boost at the start of battle. *Tempest Slash: Minuscule
        physical damage to 1 foe 3-5 times. *Mabufula: Medium Ice damage to all foes.
        Rare chance of inflicting Freeze. *Heat Wave: Heavy physical damage to all
        foes. *Deadly Fury: Severe physical damage to 1 foe. Stronger when used during
        teamwork. *Masukukaja: Buffs party agility for 3 turns. *Bufudyne: Heavy Ice
