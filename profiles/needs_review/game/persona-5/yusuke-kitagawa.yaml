- id: claim-weaknesses-fc5f99f5
  section: weaknesses
  axis: weakness
  text: 'He and his Personas are vulnerable to ice-based attacks. Although this can
    be made irrelevant through items or his later Persona awakenings. Notable Attacks/Techniques:
    Persona Summoning: The ability to utilize Personas, powerful manifestations of
    the mind and soul. Personas can move and attack independently of their users,
    allowing for double-teaming between their user and the equipped Persona. Each
    Persona has a set of elemental affinities, which also apply to their user while
    the Persona is equipped. Yusuke''s initial Persona is Goemon, his evolved Persona
    is Kamu Susano''o and his ultimate Persona is Gorokichi. *Bufu: Light Ice damage
    to 1 foe. Rare chance of inflicting Freeze. *Giant Slice: Medium physical damage
    to 1 foe. *Sukukaja: Buff agility of 1 ally for 3 turns. *Vicious Strike: Medium
    physical damage to all foes. *Mabufu: Light Ice damage to all foes. Rare chance
    of inflicting Freeze. *Rising Slash: Heavy physical damage to 1 foe. Stronger
    when used during teamwork. *Mind Slice: Medium physical damage to all foes. Low
    chance of inflicting Confuse. *Bufula: Medium Ice damage to 1 foe. Rare chance
    of inflicting Freeze. *Speed Master: Automatic speed boost at the start of battle.
    *Tempest Slash: Minuscule physical damage to 1 foe 3-5 times. *Mabufula: Medium
    Ice damage to all foes. Rare chance of inflicting Freeze. *Heat Wave: Heavy physical
    damage to all foes. *Deadly Fury: Severe physical damage to 1 foe. Stronger when
    used during teamwork. *Masukukaja: Buffs party agility for 3 turns. *Bufudyne:
    Heavy Ice damage to 1 foe. Rare chance of inflicting Freeze. *High Counter: 20%
    chance of reflecting a physical attack. *Myriad Slashes: Medium physical damage
    to 1 foe 2-3 times. *Mabufudyne: Heavy Ice damage to all foes. Rare chance of
    inflicting Freeze. *Vorpal Blade: Severe physical damage to all foes. *Brave Blade:
    Colossal physical damage to 1 foe. *Evade Fire: Exclusive to Kamu Susano''o. Triples
    evasion chance against Fire-based attacks. *Hyakka Ryouran: Increase Attack/Defense/Agility
    of party for 3 turns. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
    Category:Characters Category:Persona Category:Male Characters Category:Ice Users
    Category:Statistics Amplification Users Category:Status Effect Users Category:Summoners
    Category:Sword Users Category:Gun Users Category:Attack Reflection Users Category:Antiheroes
    Category:Humans Category:Criminals Category:Teenagers Category:Weapon Masters
    Category:Death Users Category:Mind Users Category:Teleportation Users Category:Role-playing
    Characters Category:Martial Artists'
  source_ids: *id005
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-842896e0
  section: abilities
  axis: hax
  text: 'Early to Mid-Game= {{#tag:tabber| {{!}}-{{!}}Base= Superhuman Physical Characteristics,
    Martial Arts, Weapon Mastery (Swords and Guns), Stealth Mastery, Acrobatics, Regeneration
    (Mid-Low, speed depends on willpower), Summoning (Yusuke is capable of summoning
    items from his inventory for use in battle, as shown on multiple occasions where
    large items and equipment are pulled out of nowhere and used despite being missing
    in both gameplay and cutscenes), Superhuman Charisma (can assist Ren in Shadow
    Negotiation) and Supernatural Willpower, Empowerment, Accelerated Development,
    Reactive Power Level, and Reactive Evolution(Battle, Leveling, and Training; Physical
    Stats, Magic, and Improved Resistances. Humans are able to get more powerful after
    defeating strong demons or even as they are in the middle of battle, even against
    opponents ontologically superior to them, and are able to grow massively in strength
    in the span of merely a day''s time or less, either through resolve, the threat
    of death, or training, or the bonds they hold dear, Non-Physical Interaction,
    Durability Negation, Healing Nullification, Immortality Negation (Type 2, 3, and
    7), and Invulnerability Negation (Capable of interacting with Demons, which are
    invisible beings comprised of data and information, the fulcrum of the entire
    verse proper, a concept synonymous to souls, minds, and even concepts. Even entities
    devoid of time and space, and nonexistent bodies such as The White can be struck
    down. Can completely negate their invulnerability to conventional weaponry, and
    the requirement of needing to be on a specific informational frequency to harm,
    as well as Septentriones, which require spiritual attacks to harm, and as well
    as killing undead beings and regenerative entities, such as Nagas and Blobs) {{!}}-{{!}}Persona=
    Cognitive Physiology (Persona), Magic, consisting of: Ice and Probability Manipulation.
    Resistance Negation (with Break skills), Statistics Reduction (with various support
    spells), Damage Boost (with critical hits), Damage Reduction (with Guard), Status
    Effect Inducement, which includes, Empathic Manipulation (Confusion) and Sleep
    Manipulation (with Dormina and Lullaby) {{!}}-{{!}}Skill Accessories= Through
    equipping certain items, Yusuke can possess any of the following: Enhanced Regeneration,
    Statistics Amplification, Attack Reflection, Forcefield Creation, Attack Absorption,
    Limited Precognition, Healing, Purification, Fire Manipulation, Electricity Manipulation,
    Air Manipulation, Radiation Manipulation, Explosion Manipulation, Light Manipulation,
    Holy Manipulation, Darkness Manipulation and Curse Manipulation. Invulnerability
    to Memory Manipulation and Sleep Manipulation {{!}}-{{!}}Resistances and Affinities=
    Resistance to Cognition (the Phantom Thieves'' wills of rebellion serve as protection
    against the effects of Cognition and Air Manipulation, Cognition (the Phantom
    Thieves'' wills of rebellion serve as protection against the effects of Cognition).
