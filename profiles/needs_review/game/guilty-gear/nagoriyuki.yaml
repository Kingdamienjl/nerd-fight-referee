    - field: weaknesses
      value: "Has lost the use of her left eye and right arm, although this doesn't\
        \ seem to greatly impede her in battle. Notable Attacks/Techniques: *Tatami\
        \ Gaeshi: Baiken conjures a tatami mat, then stamps on the edge of it, flipping\
        \ it upward. *Youzansen: Baiken rapidly swings her sword in a circle around\
        \ her body. *Kabari: Baiken attacks with a grappling hook. She can follow\
        \ up with a strike or by attaching the opponent to herself with a short rope.\
        \ * Hiiragi: Baiken assumes a defensive stance with her arm ahead of herself.\
        \ If she is struck in this state, she whips the opponent over her head before\
        \ slamming them onto the ground. *Baku: Baiken summons a folding screen from\
        \ a magic sigil, covering the opponent, then cuts through both the screen\
        \ and the opponent. Depending on the sigil she conjures, she can stop the\
        \ opponent from running or jumping, greatly increase the power of her attacks\
        \ for a short time, or stop her opponent from blocking. * Azami: Baiken assumes\
        \ a different defensive stance with her sword ahead of herself. If she is\
        \ struck in this state, she parries with her sword, briefly stunning the opponent,\
        \ which she can follow with any of several follow-ups. *Suzuran: Baiken runs\
        \ forward, low to the ground. She can transition to a follow-up attack at\
        \ any point. Azami/Suzuran follow-ups: * Sakura: Baiken stabs the opponent,\
        \ holding the sword in a reverse grip. *Rokkonsogi: Baiken lunges forward\
        \ with a long-ranged quick draw. *Tsubaki: Baiken jumps forward, spinning\
        \ her sword in front of herself. *Kikyou: Baiken swings her sword straight\
        \ downward. Overdrives: *Tsurane Sanzu-Watashi: A three-hit combo of rapid,\
        \ powerful strikes. *Kenjyu: Baiken fires an exploding firework from the cannon\
        \ attachment on her arm. *Metsudo Kush\u014Dd\u014D: Baiken kicks the opponent\
