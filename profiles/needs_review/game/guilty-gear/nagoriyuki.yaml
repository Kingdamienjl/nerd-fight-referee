        his stamina. He also leaves himself very open upon its activation. He holds
        himself to the code of bushido and will not use underhanded techniques in
        combat. Notable Attacks/Techniques: * Fukyo: Nagoriyuki moves forward or backward
        along the ground at a speed imperceptible to the naked eye. Increases the
        Blood Gauge, which, when full, activates Blood Rage. * Zarameyuki: Nagoriyuki
        sends an afterimage to attack with a dashing strike. Greatly increases the
        Blood Gauge. * Kamuriyuki: Nagoriyuki delivers a high sword strike, then spins
        around and delivers a low sword strike from a sitting position. Greatly increases
        the Blood Gauge. * Shizuriyuki: Nagoriyuki swings his sword in a crescent
        upward, then downward, ahead of himself. Greatly increases the Blood Gauge.
        * Bloodsucking Universe: Nagoriyuki grabs his opponent and drains their vitality.
        Immediately halts any ongoing increases to the Blood Gauge and decreases it
        to zero. * Blood Rage: A burst of blood explodes from Nagoriyuki''s face as
        his mask shatters. Deals no damage, only knocking opponents away, and leaves
        him very open. Overdrives: * Wasureyuki: Nagoriyuki strikes the opponent with
        a sudden slash, then rises into the air with consecutive slashes. Greatly
        decreases the Blood Gauge. He cannot use it in Blood Rage. * Zansetsu: Nagoriyuki
