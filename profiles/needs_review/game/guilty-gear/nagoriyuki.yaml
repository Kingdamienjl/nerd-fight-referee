- id: claim-weaknesses-c105723d
  section: weaknesses
  axis: weakness
  text: 'If he spills too much blood without feeding he will enter Blood Rage, which
    increases his range and damage but impairs his judgement, limiting his ability
    to use his most advanced technique, Wasureyuki, and rapidly drains his stamina.
    He also leaves himself very open upon its activation. He holds himself to the
    code of bushido and will not use underhanded techniques in combat. Notable Attacks/Techniques:
    * Fukyo: Nagoriyuki moves forward or backward along the ground at a speed imperceptible
    to the naked eye. Increases the Blood Gauge, which, when full, activates Blood
    Rage. * Zarameyuki: Nagoriyuki sends an afterimage to attack with a dashing strike.
    Greatly increases the Blood Gauge. * Kamuriyuki: Nagoriyuki delivers a high sword
    strike, then spins around and delivers a low sword strike from a sitting position.
    Greatly increases the Blood Gauge. * Shizuriyuki: Nagoriyuki swings his sword
    in a crescent upward, then downward, ahead of himself. Greatly increases the Blood
    Gauge. * Bloodsucking Universe: Nagoriyuki grabs his opponent and drains their
    vitality. Immediately halts any ongoing increases to the Blood Gauge and decreases
    it to zero. * Blood Rage: A burst of blood explodes from Nagoriyuki''s face as
    his mask shatters. Deals no damage, only knocking opponents away, and leaves him
    very open. Overdrives: * Wasureyuki: Nagoriyuki strikes the opponent with a sudden
    slash, then rises into the air with consecutive slashes. Greatly decreases the
    Blood Gauge. He cannot use it in Blood Rage. * Zansetsu: Nagoriyuki winds up and
    delivers one enormous strike with his sword. Usable only in Blood Rage and ends
    it immediately. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Reflist}} {{Discussions}} Category:Characters Category:Guilty Gear Category:Vampires
    Category:Samurai Category:Rage Users Category:Afterimage Users Category:Blood
    Users Category:Sword Users Category:Immortals Category:Information Analysis Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0e8efc53
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery, Afterimage Creation,
    Absorption and limited Regeneration with vampirism (Should work the same as Slayer,
    who claims he can absorb anything that constitutes a "source of vitality", not
    just blood), Immortality (Types 1, 3 and 7), Rage Power, Blood Manipulation (Can
    increase the length of his sword with an opponent''s shed blood), can negate regeneration
    with his sword strikes, limited Energy Projection of an unknown nature, Information
    Analysis (Able to sense weak points), Resistance to Mind Manipulation (Broke free
    of Happy Chaos'' mind control for a short time, which normal people were unable
    to do) | All previous abilities, plus Higher-Dimensional Existence (4-D. As a
    Nightless, Nagoriyuki is a demi-human, an existence that lacks an IDGuilty Gear:
    STRIVE - Happy Chaos Story Mode, making him a multi-dimensional being due to Bedman
    becoming one as a result of deleting his own ID), Acausality (Types 3 & 4) and
    Resistance to Biological Manipulation, Physics Manipulation, and Time Manipulation
    (As a Nightless, Nagoriyuki is a demi-human, an existence that is the same across
    Independent Segments and dwells across infinite timelines due to lacking an ID,
    along with transcending genetics, physics, and even time)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
