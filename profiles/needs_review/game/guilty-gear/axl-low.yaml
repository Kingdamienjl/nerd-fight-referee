- id: claim-powers-and-abilities-275d80d0
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery, Immortality (Type 1),
    Self-Sustenance (Type 1 and 2), Magic as Information Manipulation, Fire Manipulation,
    Metal Manipulation (Can create countless chains with his Instant Kill), Explosion
    Manipulation, Time Manipulation, Time Travel, and Time Stop (The main abilities
    of a time slipper are to travel through time and manipulate it, including erasing
    timelines by leaving them, returning them to a "potential" state) Non-Physical
    Interaction (Able to hit Zappa's spirits), Can enter different planes of reality,
    Reality Warping, Causality Manipulation and Existence Erasure (Presences like
    his can disturb the flow of reality, influence cause and effect and erase timelines),
    Telepathy (Telepathically spoke with Sol), Physics Manipulation (Time slippers
    are able to interfere with physical phenomena), Acausality (Type 2 and 4; Through
    a quirk of the Backyard, he has no past or future, existing only in the present),
    BFR (Can send someone to Backyard or different points in time), Portal Creation
    (Can create portals that connect through the timestream), Teleportation (Able
    to teleport through space and time), Spatial Manipulation, Enhanced Senses (Can
    sense people from different points in time and dimensions), Matter Manipulation
    and Creation (Can manipulate matter to an extent, and has created clocks and tables),
    Resistance to Extreme Cold, Cosmic Radiations, Information Manipulation and Transmutation,
    and Material, Spiritual and Mental attacks (Able to survive within the Backyard,
