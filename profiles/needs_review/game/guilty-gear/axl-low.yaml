- id: claim-weaknesses-45720821
  section: weaknesses
  axis: weakness
  text: "The nature of Axl's weapon renders him vulnerable up close. Axl has a strict\
    \ code against killing, and is uncomfortable at even the idea of death. Notable\
    \ Attacks/Techniques: *Time Manipulation: Axl possesses the unique ability to\
    \ transport to different periods of time, including alternate timelines, seemingly\
    \ through his own subconscious will. While he previously lacked the ability to\
    \ properly control this power, as of STRIVE, he has mastered it, discovering that\
    \ the level of power he currently possesses can alter the very state of this world\
    \ as he sees fit, though it is primarily based in the flow of time itself. This\
    \ ability also grants Axl eternal life. *Artemis Hunter: Axl spins his chain in\
    \ front of himself while conjuring flames in front of it. *Thunder Shadow Chain:\
    \ Axl leaps over the opponent's head and throws his kusarigama at the back of\
    \ their head. *Spindle Spinner: Axl tangles the opponent in his chain and conjures\
    \ an explosion to attack them while they're trapped. *Axl Bomber: Axl rises into\
    \ the air brandishing both sickles, surrounded by a trail of flames. *Winter Mantis:\
    \ Axl snags the opponent on his sickle, then does a lariat while drawing them\
    \ back in. *Rainwater: Axl leaps backwards into the air while slinging a sickle\
    \ diagonally downward. *Sickle Flash: Axl's signature technique. He throws one\
    \ sickle forward a long distance. **Soaring Chain Strike: Follow-up to Sickle\
    \ Flash. Axl pulls the chain back in through the air. **Spinning Chain Strike:\
    \ Follow-up to Sickle Flash. Axl pulls the chain back and spins one sickle in\
    \ front of himself. **Winter Cherry: Follow-up to Sickle Flash. Axl detonates\
    \ an explosion at the sickle's location and pulls it back in. Overdrives: *Sickle\
    \ Storm: Axl whirls both chains around himself in a storm of fire before letting\
    \ one fly forward, surrounded by flames. *One Vision: Axl stops the flow of time.\
    \ He is not stopped and can choose to let time flow for any number of others as\
    \ well. As of STRIVE he can stop time for long enough to singlehandedly evacuate\
    \ an entire apartment building. Instant Kill: *Amphora Conflagration: Axl conjures\
    \ a multitude of chains, wrapping the opponent in them before detonating a large\
    \ explosion with a snap of his fingers. ==Gallery == File:Gg cs ax.png|Axl in\
    \ the first Guilty Gear. File:Ggxxr cs1 ax.png|Axl in Guilty Gear XX \u266FReload.\
    \ File:Ggxxac cs ax.png|Axl in Guilty Gear XX \u039B Core. File:AxlRev.png|Axl\
    \ in Guilty Gear Xrd Revelator. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== {{Reflist|2}} {{Discussions}} Category:Characters Category:Guilty\
    \ Gear Category:Time Travelers Category:Magic Users Category:Fighting Game Characters\
    \ Category:Fire Users Category:Time Users Category:Male Characters Category:Game\
    \ Characters Category:Dimensional Travel Users Category:Reality Warpers Category:Existence\
    \ Erasure Users Category:Acausal Characters Category:BFR Users Category:Portal\
    \ Users Category:Teleportation Users Category:Information Users Category:Immortals\
    \ Category:Self-Sustenance Users Category:Weapon Masters Category:Non-Physical\
    \ Interaction Users Category:Playable Characters Category:Causality Users Category:Space\
    \ Users Category:Enhanced Senses Users Category:Creation Users Category:Telepaths\
    \ Category:Physics Users Category:Explosion Users Category:Chain Users Category:Matter\
    \ Users Category:Durability Negation Users"
  source_ids: *id005
  decisive: false
  status: unverified
  policy_flags:
