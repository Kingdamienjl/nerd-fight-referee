      value: 'The nature of Axl''s weapon renders him vulnerable up close. Axl has
        a strict code against killing, and is uncomfortable at even the idea of death.
        Notable Attacks/Techniques: *Time Manipulation: Axl possesses the unique ability
        to transport to different periods of time, including alternate timelines,
        seemingly through his own subconscious will. While he previously lacked the
        ability to properly control this power, as of STRIVE, he has mastered it,
        discovering that the level of power he currently possesses can alter the very
        state of this world as he sees fit, though it is primarily based in the flow
        of time itself. This ability also grants Axl eternal life. *Artemis Hunter:
        Axl spins his chain in front of himself while conjuring flames in front of
        it. *Thunder Shadow Chain:Axl leaps over the opponent''s head and throws his
        kusarigama at the back of their head. *Spindle Spinner: Axl tangles the opponent
        in his chain and conjures an explosion to attack them while they''re trapped.
        *Axl Bomber: Axl rises into the air brandishing both sickles, surrounded by
        a trail of flames. *Winter Mantis: Axl snags the opponent on his sickle, then
        does a lariat while drawing them back in. *Rainwater: Axl leaps backwards
        into the air while slinging a sickle diagonally downward. *Sickle Flash:Axl''s
        signature technique. He throws one sickle forward a long distance. **Soaring
        Chain Strike:Follow-up to Sickle Flash. Axl pulls the chain back in through
        the air. **Spinning Chain Strike: Follow-up to Sickle Flash. Axl pulls the
        chain back and spins one sickle in front of himself. **Winter Cherry: Follow-up
        to Sickle Flash. Axl detonates an explosion at the sickle''s location and
        pulls it back in. Overdrives: *Sickle Storm: Axl channels fire into his kusarigama,
        then throws one forward. Both the initial circle of fire and the thrown kusarigama
        deal damage. *One Vision: Axl stops the flow of time. He is not stopped and
        can choose to let time flow for any number of others as well. As of STRIVE
        he can stop time for long enough to singlehandedly evacuate an entire apartment
        building. Instant Kill: *Rengoku Renzan: During the attack, Axl wraps his
        opponent from head to toe with chains from his Kusarigama weapon. He then
        pulls on the chain, spinning and cutting his victim to death swiftly. *Rensen
        Ougi: Midare Gami: Axl makes a hand gesture forming an X while his chains
        from his Kusarigama form a circle on the ground. When stepped upon it catches
        the opponent. If the opponent is caught, multiple sickles will hit the foe
        in alternating directions, forcing his/her body upward before even more sickles
        attack. After a few moments, the body bursts into flames and falls to the
        ground. *Amphora Conflagration: Axl uses his Kusarigama to trap his opponent
        in a series of chains, starting by the hands, then neck and then entire body.
        Axl turns his back to his opponent and snaps his fingers, using his Fire magic
        and causing the chains to explode along with his target. It shares its animation
        with the first hit of Byakue Renshou. ==Others== Notable Victories: Notable
        Losses: Inconclusive Matches: Category:Tier 4 Category:Tier 1 Category:Eldrazi
