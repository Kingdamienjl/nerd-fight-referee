    field_candidates:
    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Enhanced Senses, Natural Weaponry
        (Teeth and claws), Small Size (Type 1), Social Influencing (Charisma; Able
        to charm non-pets with her cute appearance. She's done this to catch someone
        off guard and steal from them. Made Sunil fall for her by doing nothing),
        Dimensional Travel (Can send herself and others into the Alternate Musical
        Reality. And is a particularly skilled user of the AMR), Subjective Reality
        (The AMR is a place where characters' fantasies become real), Creation (Characters
        constantly create brand new objects of all types and sorts within the Alternate
        Musical Reality. In one instance, a pet was able to even have a created microphone
        in the AMR appear in the real world. They can create objects that don't even
        exist in the real world to begin with), Elemental Manipulation (Due to their
        Creation ability being simply tied to their imaginations, and through various
        instances of water, fire, earth, and air being created in the AMR, they should
        have this ability), Summoning (Characters can create life in the AMR, usually
        crowds of people, but can also include other animals as well, even extinct
        ones, or mythical creatures and aliens), Teleportation (Characters in the
        AMR can teleport to other parts of the world), Plot Manipulation (Can change
        the scene and affect what is happening within the AMR. Can easily end the
        episode), Cloth Manipulation (Characters can change, or even put clothes on
        others instantly, even surprising those who have the clothes on, like Russell
        in this scene. Zoe has also done this by touching others to suddenly change
        their clothes. Characters can instantly do this in a flash), Duplication (Characters
        are constantly shown to be able to duplicate themselves. Can duplicate themselves
        and others enough to sustain an ecosystem. Can duplicate objects), Life Manipulation
        (Characters are able to bring life to inanimate objects, such as when Zoe
        made a statue of herself able to live. Once brought an aurora borealis to
        life), Transmutation (Characters can transmutate objects, such as when Zoe
        turned a streetlamp into crystals, and when Russell turned the Moon into the
        Earth. Turned a hula-hoop into a magic wand. Can also turn living people into
        objects, like turning people into mere costumes), Acrobatics (Characters can
        make themselves swing across ledges, and parkour on the fly against danger),
        Enhanced Senses (Characters can have messages sent to their heads through
        messages sent from space, which work on a sub-atomic level), Magic (Sometimes
        applicable to some abilities, but most of the time, characters' abilities
        are just their imagination coming into reality, and not magic, and characters
        tend to choose whether what they do is magical or not), Explosion Manipulation
        (Can suddenly induce explosions to happen), Transformation (Characters, such
        as the pets were able to "wolf-ify" themselves, transforming and changing
        their own appearance. Can also turn themselves into stronger beings like dinosaurs.
        Can turn themselves into superheroes), Natural Weaponry (Can give themselves
        sharper claws and teeth), Retrocognition (Can see and make other characters,
        as well as the viewer perceive previous events that happened in the past),
        Smoke Manipulation (Some musical sequences start of with the generate of a
        giant cloud of smoke, which those in the song create), Flight (Via the creation
        of balloons, which can lift up the pets into the air, and are immediately
        tied to them. Can give themselves wings to fly to the clouds), Immersion (Can
        put themselves on paintings, television and even newspaper articles), Non-Physical
        Interaction (Able to sit on clouds, and even able to kill ghosts who are intangible),
        Spatial Manipulation (Can create a hole in a musical set that wasn't there
        before, to peek out of. Can make several rooms in a building that copy themselves.
        Created an unknown space seemingly moving, which seems to be endless), Darkness
        Manipulation (Can change the entire scene to be completely enveloped in darkness
        besides parts they want to keep lit up), Light Manipulation (Characters can
        create spotlights within the AMR, even without making the scenery overly dark.
        Can create rainbows), Sealing (Type 1; Can seal other characters into objects,
        such as when Penny sealed her friends inside of hearts), Platform Creation
        (Often a byproduct of their Creation ability, characters can create platforms
        to stop their fall, like when Penny created heart-shaped platforms for her
        and her friends, or when Sunil made a platform to stand in space), Sound Manipulation
        (Via Creation, characters can create megaphones to shout really loud into,
        which is loud enough to shift Blythe's head to the side from the sheer force),
        Electricity Manipulation (Via Creation, characters can give themselves joy
        buzzers strapped to their hands which can electrocute someone into preventing
        them from doing anything besides twitch before getting send flying)
