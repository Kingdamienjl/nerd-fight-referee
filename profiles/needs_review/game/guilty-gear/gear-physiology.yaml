    field_candidates:
    - field: powers_and_abilities
      value: 'right, 50pxStar Powers are passive abilities that often increase statistics
        or increase the utility of pre-existing abilities of Brawlers or even introduce
        new passive abilities. Every Brawler has two Star Powers unique to themselves.
        Only one Star Power can be equipped by a Brawler at a time., Gears: right,
        50pxGears are passive abilities that are often times only statistic amplifications
        that last for a long time. There are 6 Super Rare Gears, which every Brawler
        has access to. That''s the Speed Gear, which makes Brawlers move faster by
        15% when moving in bushes, the Damage Gear that boosts a Brawler''s damage
        by 15% when they are under half their health, the Health Gear that makes Brawlers
        heal 50% more each second, the Vision Gear that allow Brawlers to see enemies
        hiding in bushes for two seconds after hitting them, the Shield Gear that
        grants a Brawler a shield that blocks some damage and can regenerate, which
        reduces the cooldown of their Gadget by 15%. There are Epic Gears that are
        stronger Gears that can be equipped by a select group of Brawlers each, and
        Mythic Gears that are all each exclusive to one single Brawler. Two gears
        can be equipped at a time., Hypercharges: right, 50pxHypercharges are a chargeable
        ability similar to Supers, however canonically, Brawlers only have to train
        hard enough before they can harness the power of their Hypercharges. Hypercharge
        always creates a purple aura of flames around a Brawler, makes them glow purple
        with glowing eyes, and electricity pulsing around their body. Hypercharges
        often come with a boost to a Brawler''s speed, damage, different from the
        Shield Gear, since the Hypercharge''s shield reduces the amount of damage
        the Brawler takes when hit by a certain percentage. Hypercharges also provide
        a special boost to a Brawler''s other stat or increases the utility of their
        abilities depending on the Brawler. Hypercharges boost damage by 5%, reduce
        damage by 5%, and increase movement speed by 20% for the duration. All Brawlers
        are meant to canonically have a Hypercharge. Hypercharges can also canonically
        become active in a Brawler if they experience heightened emotions, confirmed
        when Angelo states that Jae-Yong had never been able to make Pam "Hypercharge",
        of course meant to be sexual innuendo. This is backed up by Pearl, when distressed
        about Sam and Belle, activates her Hypercharge in anger, or Mr. P instantly
        activating his Hypercharge when enraged., Buffies: right, 50pxBuffies are
        small little pets that can appear when a Brawler stands still, and vanish
        into the Brawler when they are on the move. They bestow amplifications to
        the various other abilities Brawlers have. Each Brawler has 3 Buffies that
        they can equip all at once. A Gadget Buffie, a Star Buffie and a Hyper Buffie,
        which boost the Brawler''s Gadgets, Star Powers and Hypercharge respectively,
        even adding new components to them. Having a Buffie is officially known as
        being "Buffied". The Buffie the Brawler has is dependent and specific to the
        Brawler. Buffies are imbued with Starr Park Gems.'
      source_id: character-stats-profiles-gear-physiology
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'Gear, their movement speed is increased when running through bushes
        by 15%. * Aura: Explosive. Hypercharge will grant the Brawler boosted by them
        recieve an aura of purple flames signifying their Hypercharged state. Hypercharged
        Brawlers'' attacks become electrified. * Rage Power: Brawlers can instantly
        activate their Hypercharge ability if they simply become enraged, without
        having to charge it. * Indomitable Will: Brawlers who are at their peak performance
        can choose to no-sell attacks thrown by other Brawlers through sheer will
        and training alone. Brawlers in-game can keep fighting at top performance
        even with very low health. * Blessed: Buffies are small little pets that grant
        a boon to the ability type that a Brawler has, which can include granting
        that ability with a new special property or ability, with Gadget Buffies empowering
        a Brawler''s Gadgets, Star Buffies empowering their Star Powers, and Hyper
        Buffies empowering their Hypercharge. * Power Bestowal: Buffies in of themselves
        are imbued with Starr Park Gems, making those who merely have them at all
        being given new abilities and powers, seemingly at random, with some inducing
        body horror onto people. * Enhanced Senses: Enhanced Vision, Spirits, Non-Existence,
        Beyond-Dimensional Existence (Type 1); The Vision Gear lets Brawlers see hidden
        enemies in bushes for 2 seconds after hitting them even once, which also reveals
        them to everyone else as well. The duration increases with each hit. Can see
        and perceive spirits and ghosts such as Gus''s spirits or Colette''s soul.
        In the Soul Collector game mode, Brawlers can visibly see and pick up the
        souls of defeated opponents, which are stated to be souls in the gamemode
        description. Can see Gray''s attacks, which are finger-guns, and are heavily
        implied to not even be real. Capable of fully seeing Shade even in its Incorporeal
        Form, which is stated to make Shade exit the physical world. * Extrasensory
        Perception: All Brawlers are capable of seeing where and which location Finx
        is able to physically go back to if he uses his Gadget to time travel back
        to that location. * Damage Boost: Their Damage Gear makes them deal 15% more
        damage when using any ability, if the Brawler ever so happens to ever be below
        50% their full health. * Forcefield Creation: With the Shield Gear, Brawlers
        recieve a shield that they start off with in a fight that blocks a decent
        amount of damage before breaking, in which case the damage dealt to the Brawler
        will reduce their health instead of damaging their shield. If a Brawler is
        at full health, they will begin regenerating their shield back if they don''t
        have it, but if under below full health, the shield will not be able to regenerate.
        The Shield Gear stacks with damage-reduction abilities like forcefield shields
        like Rosa''s Super, simple damage reduction like Gray''s Star Power, or bubble
        shields like Edgar''s Gadget. * Regeneration: Low-High. Brawlers are able
        to come back and stay alive even when liquified. Brawlers will heal from damage
        even if at very low health. The passive healing is automatic and only works
        if a Brawler doesn''t attack/gets hurt. * Immortality: Type 2 and 4. Brawlers
        have displayed the ability to survive lethal damage multiple times. Brawlers
        can withstand getting flattened. Regular people who recently become Brawlers
        are capable of being alive even when melted into a puddle of goo. * Self-Resurrection:
        Mid-Godly. Brawlers are able to canonically respawn from being turned into
        mere puffs of smoke when destroyed, and are shown to come back from absolutely
        nothing. Brawlers are never truly dying due to this. This is supported by
        the second WKBRL live stream confirming Brawlers can fight and respawn. This
        is supported by this animation, involving Edgar dying in various ways, being
        unfazed. When Pierce made Mr. P explode, Pierce states that Mr. P will simply
        respawn after having died. * Invulnerability: Brawlers will have an immunity
        shield to protect them from any damage or status effects of any kind for a
        short duration when respawning. The immunity also makes them immune to even
        being moved in any way. * Soul Absorption: Brawlers can absorb Gus'' spirits
        to heal themselves. In the Soul Collector game mode, Brawlers can pick up
        the souls of defeated opponents, which are stated to be souls in the gamemode
        description. Mortis can absorb the life essence of Brawlers * Non-Physical
        Interaction: Souls, Ghosts, Immaterial, Beyond-Dimensional Existence (Type
        1); Can absorb souls and spirits. Can attack Shade even when he is in his
        Incorporeal Form, though Shade can pass through physical objects otherwise.
        His Incorporeal Form is stated to make Shade exit the physical world. * Limited
        Paint Manipulation: All Brawlers can canonically use Sprays, which are cosmetics
        that instantly spray an image on the ground, which are around 2 meters in
        length and width. Brawlers can unspray and spray the ground however many times
        they want. * Resistance to... ** Electricity Manipulation:'
