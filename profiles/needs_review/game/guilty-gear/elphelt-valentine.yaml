- id: claim-weaknesses-71bca182
  section: weaknesses
  axis: weakness
  text: 'Elphelt is easily distracted by the prospect of marriage, and her emotions
    tend to get the better of her, although by Revelator she seems to have mastered
    herself somewhat. Notable Attacks/Techniques: * Bridal Express: Elphelt enlarges
    her bouquet, jumps on top of it, and moves it forward at a fast speed. * Miss
    Confille: Elphelt aims a shot from her sniper rifle. She can release it immediately
    or charge it up to increase the shot''s power. * Miss Travailler: Elphelt draws
    her shotgun and fires a burst of energy, the damage of which can increase when
    it is charged. * Self-Destruct: While Elphelt has never done so, the Valentine
    units are capable of self-destructing, creating a huge explosion. Overdrives:
    * Judge Better Half: Elphelt launches her opponent into the air with a gigantic
    wedding cake that appears underfoot, then performs an upward slash with her sword.
    * Genoverse: Elphelt draws a gigantic bazooka and fires an oversized bullet, which
    pierces the opponent and explodes. Instant Kill: * Magnum Wedding: Elphelt loads
    her sniper rifle with a special bullet. When the opponent is struck, they don''t
    sustain any damage, instead instantly falling in love with Elphelt. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== {{reflist}} {{Discussions}}
    Category:Characters Category:Guilty Gear Category:Female Characters Category:Game
    Characters Category:Clones Category:Sword Users Category:Neutral Characters Category:Gun
    Users Category:Fighting Game Characters Category:Game Bosses Category:Weapon Masters
    Category:Playable Characters Category:Self-Destruction Users Category:Creation
    Users Category:Empathic Manipulation Users Category:Danmaku Users Category:Information
    Users Category:Summoners Category:Forcefield Users Category:Fusionism Users Category:Self-Sustenance
    Users Category:Power Nullification Users Category:Flight Users Category:Regeneration
    Users Category:Incorporeal Characters Category:Durability Negation Users Category:Accelerated
    Development Users Category:Longevity Users Category:Good Characters Category:Heroes'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-923a83c7
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Skilled gunslinger, Skilled swordsman,
    Can detect anyone with Gear cells, Self-Destruction (Valentines usually can self-destruct),
    Creation (Able to create wedding cakes out of nowhere), Empathic Manipulation
    (Able to make someone fall in love with her), Self-Sustenance (Type 1), Danmaku,
    Magic as Information Manipulation, Energy Projection, Summoning (Able to summon
    swords, guns, and grenades), Plant Manipulation (Can change the size of her bouquet
    and move it around at will), Explosion Manipulation with her grenades, Energy
    Manipulation with Miss Travailler's fire, Forcefield Creation (Able to create
    Felion, an absolute defense which not even Sol can break), Fusionism (Can fuse
    with Justice), Power Nullification (Normal magic will be nullified by people who
    can use magic beyond twelve steps), Flight (Shown to be able to fly when she rescued
    Sol), Regeneration (Low-Mid), Longevity (Gears are able to live longer than humans),
    Accelerated Development (Capable of quickly absorbing information), Formerly Incorporeality
    (Formerly nothing more than a set of data), Resistance to Extreme Cold, Cosmic
    Radiations, Information Manipulation and Transmutation (Resists having her information
    rewritten), Empathic Manipulation (Capable of determining her own emotion and
    resisting external tampering), Power Nullification (Able to damage people with
    magic beyond twelve steps without being nullified), Sleep Manipulation (Wasn't
    put into a coma during the time of Justice's inactivity), Extrasensory Perception
    (Zato couldn't "see" her with his senses), Diseases (Gear cells are able to cure
    diseases), Material, Mental and Spiritual attacks (Actively resides in the Backyard,
    which constantly assaults one's body, mind and soul)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
