    - field: weaknesses
      value: 'Elphelt is easily distracted by the prospect of marriage, and her emotions
        tend to get the better of her, although by Revelator she seems to have mastered
        herself somewhat. Notable Attacks/Techniques: * Bridal Express: Elphelt enlarges
        her bouquet, jumps on top of it, and moves it forward at a fast speed. * Miss
        Confille: Elphelt aims a shot from her sniper rifle. She can release it immediately
        or charge it up to increase the shot''s power. * Miss Travailler: Elphelt
        draws her shotgun and fires a burst of energy, the damage of which can increase
        when it is charged. * Self-Destruct: While Elphelt has never done so, the
        Valentine units are capable of self-destructing, creating a huge explosion.
        Overdrives: * Judge Better Half: Elphelt launches her opponent into the air
        with a gigantic wedding cake that appears underfoot, then performs an upward
        slash with her sword. * Genoverse: Elphelt draws a gigantic bazooka and fires
        an oversized bullet, which pierces the opponent and explodes. Instant Kill:
        * Magnum Wedding: Elphelt loads her sniper rifle with a special bullet. When
