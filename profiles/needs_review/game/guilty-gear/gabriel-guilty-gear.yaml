- id: claim-weaknesses-6c1d61b4
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques Gabriel Pawnch.gif|Agni used against
    Bedman Gabriel Agni.gif|Agni X used against Bedman Agni: The first move Gabriel
    utilizes onscreen, and his opener in the fight against Bedman. By thrusting his
    fist forward in a punching motion, Gabriel releases a fist-shaped burst of energy
    as a powerful projectile that Bedman narrowly managed to dodge, and even then
    only because Gabriel had forgotten about his opponent''s ability to teleport out
    of danger. Agni X: A move that Gabriel utilized to counteract Bedman''s teleportation
    abilities, and the first move in the series capable of cracking his bedframe.
    Surrounding himself in a flaming aura, Gabriel sends a multi-directional hail
    of Agni punches out into the environment to strike everything around him. He has
    also shown the ability to precisely aim an individual projectile at an opponent
    who manages to dodge the initial barrage, even targeting opponents directly behind
    him out of the corner of his eye while maintaining his overall assault. He confidently
    states that any living thing within 8 meters of him will be pulverized when he
    activates this attack, no matter how well they dodge or guard, with Bedman''s
    ability to barely do so being seen as an impressive testament to his own strength.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
