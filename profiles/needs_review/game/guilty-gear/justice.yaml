    - field: weaknesses
      value: 'Not able to cause Absolute World without Sol Badguy present, as he is
        the bearer of Adam''s Seed. Omega Shift is risky to use, since it leaves Justice
        very vulnerable when it ends. Notable Attacks/Techniques: *Valkyrie Arc: Justice
        grabs the opponent with the sharp point on the end of her tail and flips them
        over her head. *Michael Sword: Justice lengthens her claws and channels electricity
        into them, then swipes forward with one hand. *Strike Back Tail: Justice flips
        backward, creating an arc of lightning in front of herself. *Nuclear Blast:
        Justice launches a missile that explodes upon impact with a target. *Saperia
        Trance: Justice engages the rocket boosters on her shoulders and flies forward
        at high speed as an attack. *Body control: Justice can morph the shape of
        her body to create spikes, drills, and large claws to attack. Overdrives:
        * Michael Blade: An enhanced version of Michael Sword that covers more distance
        and is more powerful. * Imperial Ray: Justice fires a laser beam from the
        cannons on her shoulders. * Gamma Ray: Justice charges up before firing a
        powerful blast of gamma radiation from the cannons on her shoulders. This
        attack was used to destroy the entirety of Japan. * Omega Shift: Justice expends
        some power to briefly enter a heightened state of speed, maneuverability,
        and power. She must take a moment to recharge when it ends, during which time
        she is vulnerable to attack. Instant Kill: * X Laser: Justice picks up the
        opponent and carries them into space before bombarding them with explosions.
