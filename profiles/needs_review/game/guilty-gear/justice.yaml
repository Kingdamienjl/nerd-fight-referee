        cannons on her shoulders. * Gamma Ray: Justice charges up before firing a
        powerful blast of gamma radiation from the cannons on her shoulders. This
        attack was used to destroy the entirety of Japan. * Omega Shift: Justice expends
        some power to briefly enter a heightened state of speed, maneuverability,
        and power. She must take a moment to recharge when it ends, during which time
        she is vulnerable to attack. Instant Kill: * X Laser: Justice picks up the
