- id: claim-powers-and-abilities-a284c7c5
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Forcefield Creation,
    Energy Projection, Flight, able to summon various minions which can fly, project
    force fields and self-destruct, able to change the shape and size of her pumpkin
    flail, Self-Sustenance (Type 1), Telepathy (Showed I-No her true self within her
    mind), Magic as Information Manipulation, Can trap a target inside her pumpkin
    ball and chain, Power Nullification (Passively nullifies standard magic), Dimensional
    Teleportation (Can teleport to Heaven's Edge), Regeneration (Low-Mid; described
    as being able to rapidly regenerate from any wound that is not "instant and fatal"),
    Immortality (Type 1 and 3; Jack-O argued that Adam and Eve are immortals), Extrasensory
    Perception (Can sense Gears and secondary cosmic rays), Absorption (Absorbed Saint
    Oratorio's energy during Revelator), Limited Physics Manipulation (Can nullify
    the friction of her attacks), Reality Warping, Biological Manipulation, Spatial
    Manipulation, Matter Manipulation and Disease Manipulation (Can create information
    flares due to being the Scale of Juno, which floods an area with information,
    breaks through space, destroys matter, warps reality, creates diseases and mutations
    and rewrites the information of other people), Soul Manipulation and Mind Manipulation
    (Designed to download and restore missing information from the souls of other
    individuals), Death Manipulation, Existence Erasure and Deconstruction (As the
    Scale of Juno, she can induce Absolute World, which kills all lifeforms in the
    universe instantly, erases everything within the universe, deconstructs matter
    at the sub-atomic to macro-quantum scale, and merges the Backyard, an universe
    of information that assaults one's body, mind and soul, with reality), Accelerated
    Development (Capable of quickly absorbing information), Formerly Incorporeality
    (Was nothing more than a set of information), Resistance to Extreme Cold, Cosmic
    Radiations, Power Nullification (Her magic is not nullified by those who possess
    magic beyond the twelve Divine Steps), Diseases (Gear cells are able to cure diseases),
    Information Manipulation and Transmutation, Material, Mental and Spiritual attacks
    (Actively resides in the Backyard which assaults body, mind and soul), Sleep Manipulation
    (Wasn't put into a coma during Justice's inactivity), Reality Warping, Existence
    Erasure, Death Manipulation, Deconstruction and Spatial Manipulation (Can survive
    Absolute World due to being the Scale of Juno) and Time Manipulation (Was able
    to move during Axl's One Vision, which stops time)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
