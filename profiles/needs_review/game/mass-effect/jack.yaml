        is an Sin, and so they are an undead being, and can withstand and regenerate
        from their head being cut off. It has also been repeatedly stated that Hell
        will "respawn" murdered Sins and generally anyone there. Beings who live in
        Heaven can live for an infinite amount of time, and damned souls in Hell can
        participate in death games countless of times, dying each time, and Angels
        can live for countless amounts of lifetimes, and people in Hell can live for
        over 300 years without any change to their appearance. Respawning can be beneficial,
        since damned souls can kill themselves to reform their bodies and not have
        to deal with injuries. Sins, and Reapers, can stay alive even as a mere head
        in a jar. Jack has been a Sin ever since the restructuring of society and
        civilization, which had to start from scratch. Those in Hell can stay alive
        there as long as their soul exists, though in Mr. Smith''s case, his soul
        was sealed inside of a hat) * Acausality (Type 4; Hell lacks time in of itself,
        which made the Precognition powers of a lady not work anymore, due to the
        future and the past seemingly not existing in Hell to begin with, however,
        this is confirmed to only be because Hell has a messy form of how time works,
        and operates under different laws) * Self-Sustenance (Type 1 and 2; the afterlife
        doesn''t have air, and being an undead being, he''s lived several years without
        needing it. People can experience the sensation of suffocation, but they will
        not die from it. Those in Hell seemingly don''t need nutrition or hydration,
        since Megan in Hell can sleep for 5 days straight and not starve or be too
        thirsty, and still have enough energy to run away from a monster, however
        they can still experience the sensation of hunger after enough time) * Limited
        Afterimage Creation (Superior to regular Angels, who can swing their arms
        fast enough to generate afterimages with their arms) * Pocket Reality Manipulation
        (Jack can create an area in reality called a "Sufferance Zone", in which characters''
        souls can "bend the perception of reality" and create objects out of nowhere
        or transport them to the person if that person''s soul is in a moment of need.
        This pocket reality can be accessed through making a portal, meaning Jack
        in the scene in which he created one, would have sent them through there)
        ** Subjective Reality *** Creation (Sufferance Zones allow for the creation
        of objects that the character there desires) *** Summoning (Sufferance Zones
        can cause living things to be manifested into reality) *** Limited Mind Manipulation
        (Sufferance Zones are able to make those within them start to remember their
        lives when they were alive more clearly) * Mind Reading (Can read others''
        minds. Sins do this by linking their minds with others) * Regeneration (Mid;
        Scales to Gluttony, who can regenerate their head being cut off and have his
        chest pierced. Note that his head turning into nothing is him being sent back
        to Hell. Sins are stated to have regenerative properties) * Non-Physical Interaction
        (Jack is able to force souls out of people''s corporeal bodies, and his cloak
