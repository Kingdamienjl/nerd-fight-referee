        his body is infused with, showing the ability to utilize all of his powers
        extremely tactfully, utilizing the environment to its fullest advantage, setting
        traps, and using misdirection to constantly keep his opponents off-balance
        in any given situation. He is also a naturally skilled hacker, displaying
        the ability to hack things ranging from locks and safes to vending machines
        and turrets to complex security systems and drones, and shows the ability
        to build advanced technology as well as hack it, such as an experimental electromagnetic
        bomb. His intelligence is further augmented by Gene Tonics, allowing him to
        implant the knowledge of a number of different skills directly into his genetic
        code, granting him skills ranging from maximizing the yield of constructing
        items from bare minimum components to even mundane skills such as being a
        master piano player)
