    - field: standard_equipment
      value: '*Rhino Armor: The Rhino wears a 500 pounds suit modularly aligned and
        composed of two polymers originating from the manipulation of actual rhinoceros
        DNA and a material similar to kevlar or adamantium. Depending on the various
        models he donned over the years, the suit is either connected to his body
        at a molecular or entirely removable by hands. The suit is chemically and
        radioactively treated so to work in conjunction with Rhino''s gamma-based
        powers, increasing his strength and durability beyond their original levels.
        The costume has been destroyed on multiple occasions, but various characters
        such as the Leader and Justin Hammer have restored and improved its design
        over time.'
      source_id: mediawiki-4664654
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Average (Rhino is often and unfairly accused of subpar intelligence
        by the people around him, mostly because of his apparent lack of formal education
        and his brutish personality, which hide a quite level-minded person, when
        not subjected to stress and humiliation. The various experiments meant to
        increase his strength have also incidentally made him smarter. Rhino''s criminal
        portfolio contains a colorful record, as during his long career as an enforcer
        many different parties hired him to carry out a variety of jobs. Additionally,
        Rhino has also been part of several teams, most notably the Sinister Syndicate,
        the Sinister Six and the Savage Six. In combat Rhino makes up for his lack
        of conventional skill with his experience fighting a variety of foes and with
        occasional clever strategies. One time, he even double-crossed his treacherous
        partners in crime of the Sinister Syndicate by secretly working for the Kingpin,
        thus deceiving them and other characters such as Spider-Man, for an extended
        period of time; he then turned on the Kingpin himself and succeeded, albeit
        briefly, in playing him as well.Deadly Foes of Spider-Man Vol 1 4 With suggestions
        from a third party, Rhino successfully sneaked within wakandan borders by
        disguising himself as an actual animal and blending within a pack of rhinoceros)
        Standard Tactics: The Rhino employs hit-and-run tactics against his opponents,
        favoring his overwhelming strength over strategy, an example being his iconic
        charge or his habit of using massive objects as projectiles. This approach
        has recurrently made it easy for his enemies to predict and outmaneuver him.
        Nonetheless, Rhino''s surprising speed and impenetrable hide have often compensated,
        allowing him to turn the tides of battle in his favor with just few, well-landed
        attacks. Moreover, he is not completely extraneous to using his wit to gain
        the upper hand and to learn from his mistakes. He is generally reluctantDeadly
        Foes of Spider-Man Vol 1 1 to killSensational Spider-Man Vol 2 34 other people,Punisher
        War Journal Vol 2 15 although not stranger to it,Daredevil Vol 6 19 for such
        tendency has suffered from shiftings depending on different depictions. Other
        recurring traits include the refusal to harm childrenAvengers Academy Vol
        1 14Amazing Spider-Man Vol 1 644Devil''s Reign: Villains for Hire Vol 1 3
        and remaining loyal to his allies in combat.Defenders Vol 1 43 During certain
        periods of absolute despair, such as the aftermath of the Gauntlet and to
        the Clone Conspiracy, Rhino had become a much grimmer person, wishing to kill
        Spider-Man and willing to and employing suicidal tactics to defeat his opponents.Amazing
        Spider-Man Vol 1 676 However, since then Rhino''s mental health has considerably
        improved and he returned to be a much more stable person.'
      source_id: mediawiki-4664654
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'When charging he has trouble stopping himself and changing directions.
