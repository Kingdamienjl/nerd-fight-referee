    - field: weaknesses
      value: "Rarely takes things seriously and is overconfident. Notable Attacks/Techniques:\
        \ *72 Bian (72 Earthly Transformations): Sun Wukong is capable of assuming\
        \ 72 different forms. For each of said transformations, he holds an extra\
        \ life. *Shen Wai Shen Fa (Body Outside of Body): Wukong is capable of transforming\
        \ each of his body's 84,000 hairs into another form, be it an animal, person\
        \ or inanimate object. He can also transform each of his hair's into a duplicate\
        \ of himself. When he does such a thing, his Ruyi Jingu Bang also multiplies\
        \ into thousands of itself. *Limb Multiplication: Sun Wukong can increase\
        \ the number of his heads and arms, typically assuming a three-headed, six-armed\
        \ form. During his battle against Nezha, he assumed a form with tens of thousands\
        \ of limbs. *Body Freezing Spell: One of Sun Wukong\u2019s most important\
        \ powers, which allows him of magically freezing others into immobility with\
        \ a single syllable and a point of his finger. He has only seem using this\
        \ Spell against minor demons and monsters, so it most likely doesn't work\
        \ against comparable beings. *Bi Shui Jue (Water Avoidance Charm): Allows\
        \ Wukong to survive in deep waters without drowning, though renders him incapable\
        \ of flight. *Bi Huo Jue (Fire Avoidance Charm): Makes Wukong incapable of\
        \ being burned by any fire. *Jie Suo Fa (Lock Breaking Spell): With this spell,\
        \ Wukong can instantly open any lock by pointing his finger or staff at it.\
        \ *Protective Circle: With this ability, Sun Wukong can create an invisible\
        \ protective wall around himself, drawing a circle around him on the ground\
        \ with his staff. Anyone staying inside the circle will be safe from all harm.\
        \ *Huo Yan Jin Jing (Fiery Golden Eyes): When he was burnt in Lao Zi\u2019\
        s furnace for 49 days, he sat in a place where there was only smoke, but no\
        \ fire. Thus he managed to survive the burning, but his eyes were smoked into\
        \ Fiery Golden Eyes. This enables him to see as far as a thousand li in the\
        \ day and six hundred li at night. Furthermore, he can see through any disguise,\
        \ illusion, or transformation."
