    - field: weaknesses
      value: 'Sun Wukong is extremely confident in his own abilities, leading to him
        act very prideful and arrogantly, usually getting him into all sorts of bad
        situations. Along with this, despite being incapable of drowning, he sinks
        and has difficulty moving when submerged in water. This can lead to him having
        issues while fighting if he does not use any spells. However even then Sun
        Wukong cannot fight while using his Water Avoidance Charm. Despite his Invincibility
        Sun Wukong can be hurt by True Samadhi Fire and his eyes are very vulnerable
        to smoke. | None | None Notable Attacks/Techniques: *The 72 Earthly Transformations
        (This gives Sun Wukong the ability to shapeshift into 72 different things,
        having an extra life for each one of those transformations. This also gives
        Sun Wukong complete control over his body, being able to create extra limbs
        or modify his size) *Body Outside of Body (Sun Wukong can transform each of
        his 84,000 Body Hairs into anything he wants including exact clones of himself,
        objects, animals or even other people. He can bite these hairs into smaller
        bits to create even more clones) *Body Freezing (By pointing Sun Wukong can
