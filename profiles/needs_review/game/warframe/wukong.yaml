        warframes to always be equipped with weapons that match the threats they have
        to face. Mods: Mods can be used to increase/alter the function of both a Warframe
        and their weapons; Damage reduction, Elemental resistances, and Stat increases
        are all benefits mods commonly give to a Warframe. When weapons can have multiple
        elements at a time but some elements will fuse to create more complex forces.
        10 mods can be installed at a time on warframes while weapons can only equip
        8. Arcanes: Arcanes serve a similar purpose to mods as both provide boosts
        to Warframe and weapon stats but unlike mods who give their buffs immediately
        arcanes have conditions that will need to be met before the buff starts. Warframes
        can equip 2 Arcanes and weapons only get 1. Parazon: The Parazon is a deadly
        blade concealed in a Warframes wrist that allows them to instantly interface
