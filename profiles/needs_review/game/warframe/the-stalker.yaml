power_scale:
  tier:
    text: 9-B physically and with Zombies | 9-B physically and with Zombies, higher
      with abilities
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level15 Kilojoules physically (Can kill Combines with just a few punches.
      Can damage Stalker Sensors and cause them to violently explode) and with Zombies
      (Weaker than the Stalker but can still harm and kill Combines with their attacks)
      | Wall level6.3 Megajoules physically (Can kill and dismember Combines whose
      durability should be comparable to the AP of their weapons. Can damage Sentry
      Turrets and cause them to violently explode) and with Zombies (Weaker than the
      Stalker but can still harm and kill Combines with their attacks), higher with
      abilities (Can instantly destroy multiple Combines with Telekinesis, obliterating
      their bodies the same way as when they're crushed underneath a dropship. Deals
      50% more damage for 4 seconds while using Rage which allows it to kill Combines
      much quicker)
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human, likely Superhuman (Considerably faster than standard Combines
      and can move fast enough to avoid their gunshots), higher with abilities (Becomes
      50% faster for 4 seconds while using Rage. Can easily outspeed Combines even
      when they are equipped with the Speedy and Wildcard upgrades which can make
      them 25% faster and allow them to keep up with its normal speed. Can throw objects
      fast enough to blitz Combines with Telekinesis). Athletic Human with Zombies
      (Can keep up with a standard Combine)
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Wall level physically (Can withstand 40 M4 Carbine bullets from Combines
      without needing to heal) and and with Zombies (Can withstand attacks from Combines)
      | Wall level physically (Has 4x the health of standard Combines and can withstand
      a lot of their gunshots and attacks which can destroy metal Dummies. Takes no
      damage from falls that would be fatal to Combines) and with Zombies (Can withstand
      attacks from Combines)
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman physically (Can survive and continue fighting at full capacity
      even after receiving substantial damage to its body. Can regain all of its psychic
      energy in about 20 seconds even with heavy injuries) and with Zombies (Unaffected
      by severe blood loss and only die after receiving substantial damage to the
      point that their bodies physically fall apart)
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range physically, up to Tens of Meters with abilities, Hundreds
      of Meters with Extrasensory Perception
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (A smart and cunning predator who seems to possess human levels
      of intelligence as it can understand and speak human language. Consistently
      shown to use its abilities effectively to defeat the Unit 8 who were trained
      as elite soldiers serving in the most advanced and largest standing military
      in the galaxy), Instinctive with Zombies (Corpses that no longer retain any
      semblance of their former abilities and intelligence. Likely know nothing but
      to pursue and attack their targets)
    source_ids:
    - vsbattles-the-stalker
    confidence: 0.6
    notes: auto_repair source extraction
