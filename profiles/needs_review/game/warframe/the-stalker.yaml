    - field: powers_and_abilities
      value: '* Superhuman strength, speed, durability and agility * Energy Manipulation
        (Similarly to Warframes, the Stalker likely contains and manipulates Void
        energy to fuel his powers) * Weapon Master (Is proficient in the use of his
        Bow, Kunai and Scythe, and is proficient in using a Greatsword) * Longevity,
        possibly Immortality (Type 1) (It is stated that he existed during the age
        of the Orokin and is possibly a Tenno himself, but given his lack of backstory
        and multiple contradictions, this seems unlikely) * Expert infiltrator (Is
        arguably superior to most Tenno in this regard, as he can suddenly appear
        in the middle of a Tenno group during a mission, without warning) * Levitation
        and Pseudo-Flight (With the Aim Glide technique) * Regeneration (Mid-low)
        * Invisibility (Can become invisible with Smoke Screen) * Teleportation (Can
        teleport into the middle of a Tenno group seeminly out of nowhere, and can
        utilise Teleportation with Smoke Screen to to move erratically across the
        battlefield.) * Energy Absorption (Like the Tenno, the Stalker should be able
        to absorb the Health and Energy of fallen foes) * Power Nullification (With
        Dispel, he can negate the abilities of enemy Warframes, both those that affect
        the Stalker or those that benefit the Tenno) * Magnetism Manipulation (With
        Pull, he can pull enemies towards him, preventing them from retreating) *
        Energy Absorption and Energy Projection (With Absorb, the Stalker can absorb
        all attacks coming towards him, both kinetic and energy, and release them
        back to his opponents) * Resistant to (Heat, Electricity, Poison, Cold, Radiation)
        * Resistant to Mind Control, Matter Manipulation As the Shadow Stalker, he
        gains access to: * Adaptability'
      source_id: vsbattles-the-stalker-warframe
      provider_id: vsbattles
      authority: high
      confidence: 0.75
