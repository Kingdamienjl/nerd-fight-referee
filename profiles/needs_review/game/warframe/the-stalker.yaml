    - field: weaknesses
      value: 'Overzealous and grudge bearing; tending to fight outnumbered and will
        only fight with a certain target in mind. He tends to use Absorb as a last
        resort when low on health. Notable Attacks/Techniques: * Slash Dash - Stalker
        will usually start the fight by charging at his target with his melee weapon,
        heavily damaging any targets in the way. * Shuriken - Stalker launches a deadly
        projectile capable of pinning enemies to walls, this projectile will penetrate
        armor and cause heavy bleeding * Smoke Screen - Stalker will disappear in
        a cloud of smoke, going completely invisible. * Reckoning - This ability will
        create a shock wave that will stagger opponents for a brief period of time,
        giving Stalker the opportunity to attack. * Pull - Stalker will use this ability
        mainly to prevent escape or stop their opponent from travelling long distances,
        keeping the match close-quarters. * Absorb - Stalker will absorb all kinetic
        energy he is struck with and release it into a radius. * Dispel - Stalker
        will negate any support or special ability the opponent has, rendering them
        useless. * Channeling - Channeling is a technique all Tenno and former Tenno
        alike should be capable of. While charging additional energy through their
        Warframe, they potentially double their AP with their melee strikes, in addition
        to making their opponents disintegrate on contact. ==Notable Matchups== Victories:
