    - field: standard_equipment
      value: 'Warframes always come equipped with a primary weapon, a secondary sidearm,
        and a melee weapon. Their weapons can vary wildly in form and function, allowing
        warframes to always be equipped with weapons that match the threats they have
        to face. Mods: Mods can be used to increase/alter the function of both a Warframe
        and their weapons, Damage reduction, Elemental resistances, and Stat increases
        are all benefits mods commonly give to a Warframe. When weapons can have multiple
        elements at a time but some elements will fuse to create more complex forces.
        10 mods can be installed at a time on warframes while weapons can only equip
        8. Arcanes: Arcanes serve a similar purpose to mods as both provide boosts
        to Warframe and weapon stats but unlike mods who give their buffs immediately
        arcanes have conditions that will need to be met before the buff starts. Warframes
        can equip 2 Arcanes and weapons only get 1. Parazon: The Parazon is a deadly
        blade concealed in a Warframes wrist that allows them to instantly interface
        and hack any electronic system, Official warframe wiki, Lotus Jackal Boss
        fight dialogue grapple onto far off objects'
      source_id: mediawiki-315600
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Mindless (Without their Operator piloting them the warframes are simply
        empty husks), Gifted (While Their Operator is piloting them. Capable of easily
        completing the numerous missions they receive regardless of the complexity
        of the task. Additionally, they are able to solve the hall of ascension puzzles,
        Complex tests made to gauge the agility,power and cunning of the challengers)
        The Tenno are immensely skilled warriors, having been made solely to face
        off against the constantly evolving SentientsWarframe: The Sacrifice(2018)
        by utilizing not only their many abilities but the numerous weapons they have
        mastered. Warframes were described as "miracles" on the battlefield, having
        devastated many sentient strongholdsfrom Browse.wf, a website that compiles
        and displays internal game data from Warframe. and were the singular reason
