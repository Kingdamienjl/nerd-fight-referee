  section: weaknesses
  axis: weakness
  text: 'Advanced, concentrated EMPs can restrict the use of her powers. Notable Attacks/Techniques:
    * Ballistic Battery - Mesa stores raw energy from her weapons and channels it
    into a single, powerful shot. * Shooting Gallery - Mesa releases an energy lasso
    that increases her damage output whilst lashing out at opponents within a radius,
    stunning them and jamming their weapons. If with a team, this ability will switch
    to other members of the party. * Shatter Shield - Mesa envelops herself in a barrier
    of energy that reflects back enemy gunfire. * Peacemaker - With intense focus,
    Mesa draws her Regulator pistols, shooting down her foes in rapid succession.
