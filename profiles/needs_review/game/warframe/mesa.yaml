      Voice Message: WARFRAMES A single Warframe could effortlessly slaughter entire
      armies of Orokin soldiers,Warframe: Awakening(2020) all of which were equipped
      with weapons capable of mass destruction.Warframe: The Teacher(2025) Mesa can
      defeat Orowyrms, which are biomechanical dragons capable of ramming into the
      floating islands of duviri with enough force to shatter them to pieces4.4918
      Kilotons), likely City level (Warframes like Mesa were created for the main
      purpose of fighting powerful Sentients like Hunhow, who had destroyed many cities
      during the time of the old war.Warframe: The Sacrifice(2018)Warframe.com: The
      Reapers lament Can defeat the Ropalolyst, a Sentient capable of survive being
      hit by its own "city frying" lasers.20.1132 to 62.41 Megatons Mesa should be
      relative to Excalibur Prime who can casually spar with the Hunhullus, which
      was considered the Sentients greatest weaponWarframe: The Old Peace(2025)),
      higher with Mods and Arcanes (Warframes can equip various upgrades that boost/augment
      the power of their weapons and abilitiesCodex Training: Upgrades/Mods), far
      higher with Tauron Strikes (Tauron Strikes are the ultimate techniques of the
      Tenno focus schools created by mixing their techniques with Sentient teachings,
      resulting in a massive power increase. Tauron Strikes can completely destroy
      the makvos cannon in a single hit, while even fully modded weapons needed to
      target the cannons weak-points in order to do any damageWarframe: The Old Peace(2025))
      | Small Town level+, Likely City level (Stronger than their base variant), higher
      with Mods and Arcanes, far higher with Tauron Strikes (Same as before)'
