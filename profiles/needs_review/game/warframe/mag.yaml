- id: claim-weaknesses-028e2621
  section: weaknesses
  axis: weakness
  text: 'Advanced, concentrated EMPs can restrict the use of her powers. Notable Attacks/Techniques:
    *Pull - Mag pulls her enemies towards her with a strong magnetic force to bring
    them into melee range, stunning and possibly incapacitating them in the process.
    *Polarize - Mag emits an energy pulse that depletes enemy shields and armor, creating
    deadly shards within the radius of the pulse, allies who come in contact with
    this pulse will have their shields restored. *Magnetize - Mag creates a strong
    magnetic field around the target, encompassing them and anchoring them in place,
    the field will drag bullets and shards created by Polarize into the target. Upon
    the death of the target, the field destabilizes and causes a large explosion.
    *Crush - Mag magnetizes the bones of enemies within a radius and suspends them
    in the air, forcefully compressing their bodies and making them collapse on themselves.
