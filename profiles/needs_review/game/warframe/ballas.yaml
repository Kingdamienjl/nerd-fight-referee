    - field: weaknesses
      value: 'Hot tempered. Tony has a short fuse and is quick to rely on violence
        as a solution which can result in him ending up in situations that could have
        been avoided. Notable Attacks/Techniques: *Balls: The game features a Balls
        Meter that can be activated by shooting certain spots on the enemy''s body
        (example: head, right shoulder, groin), after Tony kills somebody he can taunt
        them to increase his balls meter. This balls meter, when full, will allow
        you to go into Blind Ragemode, where the game temporarily shifts to a "first-person
        shooter" perspective. While in this mode, Tony is impervious to attack, has
        unlimited ammo, and every kill gives him 200 health. Not only can he use any
        type of gun but also use melee weapons, in addition, the balls meter can also
        be refilled through other means, such as hitting another car while driving
        and immediately taunting them, or talking in conversations with citizens and
        NPCs. Also, there are hidden "Sperm Banks" in the game, these look just like
        the "blood banks" (which are used to refill health) however, the player can
        sell his sperm from his balls meter for cash, the amount of cash the player
        receives depends on Reputation Level. *Blind Rage is a feature in Scarface:
        The World is Yours. When Tony goes into a total rage for a short period of
        time, the perspective will turn from third person into first person view and
        gives him the power to be invincible and have unlimited ammo, also putting
        a target on his enemies. This can be done with any weapon, though it seems
        to last longer with melee weapons. It also gives 200 health for every kill
        performed (filling the meter with 4 kills). Blind rage can be used once Tony''s
        balls meter has become full. When the Blind Rage finishes, the player''s view
        will resume back to third person perspective view. ==Notable Matchups== Victories:
