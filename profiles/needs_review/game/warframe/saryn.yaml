- id: claim-standard-equipment-e1d23692
  section: equipment
  axis: equipment
  text: '*Information Analysis (Scanners allow the tenno to scan objects and creature
    for later analysis) *Duplication (By deploying a specter the tenno can create
    a preset clone of any warframe. Warframe specters have only the base power of
    the original and will disappear when destroyed) *Paralysis Inducement (kinetic
    siphon traps can halt a target movements completely for several seconds) *Flight
    , Teleportation & Space Survival (Archwings are flight harnesses that a warframe
    can summon in open spaces; there are multiple archwing models each with their
    own unique form and function but all are capable of providing the warframe with
    the means to survive in the vacuum of space for long periods and teleportation
    with a range of 800 meters) **Amesha ***Technology Manipulation (Amesha''s 1st
    and 2nd abilities creates decoy drones that draw enemy fire to themselves) ***Purification
    ((Type 3 ;)Amesha''s Warding Grace prevents status effects in a 400 meter radius)
    ***Statistics Amplification & Absorption (Amesha''s Vengeful Rush absorbs damage
    done to it and convert it to energy that is used to boost its other abilities
    strength, range, and duration) **Itzal ***Thread Manipulation (Itzal''s 1st ability
    launches a grappling line that either drags enemies towards the warframe or pulls
    the wearer to a stationary object) ***Invisibility (Itzal''s 2nd ability creates
    a 76 meter cloaking field that renders stationary objects invisible) ***Gravity
    Manipulation (Itzal''s 3rd ability launches a gravity well that pulls and crushes
    enemies in a 140 meter radius before exploding) ***Explosion Manipulation (Fighter
    escort deploys a swarm of small drones which will attack enemies before exploding
    when destroyed) **Odonata ***Forcefield Creation & Fire Manipulation (Odonata''s
    1st ability creates an energy shield that blocks projectiles. Guns fired from
    behind the shield will do additional heat damage) ***Explosion Manipulation (Odonata''s
    3rd ability fires homing missiles) ***Energy Projection (Odonata''s 4th ability
    produces a concussive burst of energy that stuns anyone in range) **Elytron ***Explosion
    Manipulation (All of Elytron''s abilities fires various explosives of varying
    strength) }}'
