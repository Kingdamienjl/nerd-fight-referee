  section: weaknesses
  axis: weakness
  text: 'Advanced, concentrated EMPs can restrict the use of her powers. Notable Attacks/Techniques:
    * Spores - Saryn will infect a target with deadly toxic spores that will severely
    weaken the opponent''s stamina while slowly killing them, these spores can be
    popped by Saryn and will spread the disease to other hostile opponents in the
    area. * Molt - Saryn will shed her skin and create a poisonous decoy to take fire
    for her, Saryn will quickly regenerate after casting. * Toxic Lash - Saryn will
    imbue her melee weapon with a lethal toxin, if attacking an enemy inflicted with
    Spores all of them will burst at once. * Miasma - Saryn pollutes the atmosphere
    with a poisonous mist that will corrode enemies who are exposed to it. ==Gallery==
