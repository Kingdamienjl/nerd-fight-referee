  intelligence:
    text: "Extraordinary Genius (Albedo mastered the numerous alchemical forms. He\
      \ is a genius far above that of Sucrose; a bright young alchemist said to be\
      \ 20 years ahead of Timaeus, an alchemy instructor recognized by Albedo. Jean\
      \ also thinks Albedo is a genuine genius.Jean\u2019s Voice-Line: About Albedo\
      \ Sucrose further says that Albedo attracts many Teyvat academics to study under\
      \ him.Story Quest Act, Albedo, Princeps Cretaceus Chapter: Act I: Traveler Observation\
      \ Report He is even described as a \u201Cteacher-teacher\u201D, as he taught\
      \ both Sucrose and Timaeus.Story Quest Act, Albedo, Princeps Cretaceus Chapter:\
      \ Act I: Traveler Observation Report Albedo is so outstanding that he came to\
      \ understand life and physic laws from a different world in less than a day\
      \ of study.Story Quest Act, Albedo, Princeps Cretaceus Chapter: Act I: Traveler\
      \ Observation Report Additionally, an alchemical formula that the combined efforts\
      \ of Sucrose and Timaeus could not decipher was immediately grasped by Albedo.Event\
      \ The Chalk Prince and the Dragon Quest: Act I: Festering Desire Furthermore,\
      \ Albedo, followed by Diluc, are the only persons who recognize Alice's pranks\
      \ in Midsummer Island Adventure.Event Midsummer Island Adventure Quest: Part\
      \ IV: The Final Riddle: A Secret Uncovered Created a potion that can channel\
      \ elemental power into the Traveler\u2019s body, to determine any differences\
      \ between the Traveler and ordinary humans of Teyvat.Story Quest Act, Albedo,\
      \ Princeps Cretaceus Chapter: Act I: Traveler Observation Report After finding\
      \ the Festering Desire, he made some alchemical touches to the sword, and unexpectedly\
      \ discovered its true origins in the process of his experiments.Event The Chalk\
      \ Prince and the Dragon Quest: Act I: Festering Desire Mondstadt was never a\
      \ nation known for its alchemy, but since Albedo\u2019s arrival, the Knight\u2019\
      s achievements sit only behind those of Sumeru\u2019s top scholarsCollected\
      \ Miscellany - \"Albedo: Kreideprinz\" | Genshin Impact)"
    source_ids:
    - vsbattles-albedo-piazzolla-xenosaga
    confidence: 0.8
    notes: auto_repair source extraction
