        \ Alchemists go a step further, gathering, storing, and controlling pure elemental\
        \ energy, such as with Timaeus; creating potions and mechanisms with various\
        \ effects, such as with Lisa; and even permanently altering the genetic makeup\
        \ of all forms of life, such as with Sucrose. *Art of Khemia: The Art of Khemia\
        \ is a form of alchemy that focuses on creating life due to originating from\
        \ the underground nation of Khaenri'ah, where natural life was scarce. This\
        \ style of alchemy is vastly different from the alchemical arts practiced\
        \ in Teyvat. Rhinedottir used this alchemy to create Black Dragon Durin, a\
        \ monstrous being, and artificial humans such as Albedo. Geo Vision: A Vision\
        \ is a gift from the gods of Teyvat that allows humans to wield elemental\
        \ powers, turning them into Allogenes. Albedo's Vision is Geo-attributed,\
        \ thus granting him the ability to freely manipulate all forms of earth and\
