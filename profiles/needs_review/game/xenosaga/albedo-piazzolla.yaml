    - field: weaknesses
      value: In almost all of his appearances, Albedo's own arrogance is often the
        source of his downfall and he always underestimates the intelligence and skill
        of those that oppose him, specifically Azmuth and Ben. His obsession and desire
        to get revenge on them can also lead him into getting into situations that
        end in his defeat and make him overlook the potential of others, such as when
        he all but completely ignored Blukic and Driba (due to their bumbling antics)
        while they successfully restored Azmuth after he had been destroyed by Albedo.
        He has developed an uncontrollable craving for Chili Fries. This at times
        gets the better of him, such as side tracking him during or in-between his
        plans to pick some up. Another case is that he also has a hard time controlling
        himself eating them when he hasn't eaten any for a long period of time; when
        he is given some if this happens, he loses his self-control and eats them
        in a rather messy manner. He needs his Ultimatrix (which is a stabilizer)
        in order to maintain his transformations and to turn into Ultimate Forms.
        Without it, he turns back into a human. Despite his enhanced intelligence
        he doesn't judge people properly, seeing how he teamed up with Vilgax thrice
        despite being betrayed by him on two occasions. == Notes == == Statistic Values
