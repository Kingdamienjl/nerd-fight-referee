        \ Achilles is considered second only to Heracles, who is said to be close\
        \ to being the strongest Heroic Spirit. As such he is a naturally gifted warrior,\
        \ being able to easily fight multiple Servants at once, even when at a disadvantage\
        \ he can quickly adapt to an opponent\u2019s fighting style. His exceptional\
        \ combat abilities allowed him to kill the strongest warrior of the Trojan\
        \ army, Hector in single combat. Jeanne and Shirou Kotomine believes that\
        \ Achilles is the only servant summoned in the Great Holy Grail War capable\
        \ of matching Karna, a demigod said to be on par with the King of Heroes.\
        \ He is a very proficient spearman, being able to fight Siegfried in close\
        \ combat without relying on his invulnerability. He is also very skilled at\
        \ using his spear as a throwing weapon, with his spear throws being stated\
        \ to be close to impossible to evade even for Servants. In addition, Achilles\
        \ is an expert at the world\u2019s oldest mixed martial art, Pankration. With\
        \ it, he was able to kill Chiron in their barehanded duel to death even though\
        \ the centaur was a master himself and was the one who taught it to him in\
