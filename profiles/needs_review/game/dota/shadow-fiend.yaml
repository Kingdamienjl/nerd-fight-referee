    - field: intelligence
      value: Genius in stealth and combat (He is the best assassin in the land, being
        hired to hunt down the truly exceptional of warriors. His fighting and stealth
        talent has also led him to become the leader of the Assassins' Order. Even
        when he faced Ghost, one of his personal bodyguards, Lynx was able to outsmart
        him by making Ghost fight a dummy the entire fight. Titan himself considered
        Lynx one of the best fighters in the land, and chose him to be the host of
        one of his Shadow Demons. As a Herald, Lynx can overcome the many anomalies
        around the Dome, one of them being his darker side doppelganger, who he can
        supposedly beat in combat; has his brain boosted to unprecedented levels with
        the help of Shadow Energy, his intelligence being similar to that of scientist
        Heralds; and having spent years learning the nature of Shadow Energy, he knows
        about it a lot more than others, which frightens both the Dynasty and the
        Legion warriors)
      source_id: mediawiki-shadow-fiend
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Losing his link with his weapon strips him of the ability to use his
        weapon''s Shadow Ability. Lynx cannot accumulate Shadow Energy in worlds in
        which Shadow Energy does not exist. Like most people of his world, Lynx is
        not aware of his power to change the fate of the world via the Historical
        Importance Index mechanism, and thus he doesn''t make full use of it by, for
        example, the possibility of giving up on a specific objective/wish way too
        easily and early after a few failures. Notable Attacks/Techniques: ===Perks===
        *50px Head Hit: Landing a strike on the enemy''s head triggers a Head Hit,
        making it deal 60% more damage. *50px Critical Hit: Any unblocked hit has
        a chance to be a Critical Hit, which deals 50% more damage and makes the enemy
        fall to the ground. *50px Block: Lynx can enter defensive stances to block
        incoming attacks from the enemy, greatly reducing their damage dealt. *Sadist:
        Other people''s pain feeds the demon''s shadow power: Lynx receives Shadow
        Energy only for attacks against the opponent. Thus the Shadow Energy he accumulates
        for successful hits is multiplied by 42%. *50px Shadow Energy: Lynx has learned
        to make use of the Shadow Energy present in the world, harnessing it as a
        weapon to his advantage in battle. With its help, he can become faster, with
        more stamina and more spectacular moves in defiance of the very laws of physics.
        *50px Shadow'
      source_id: mediawiki-shadow-fiend
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: 'Lynx Invisibility.gif|Hunter in the Shadows Lynx Bomb Explodes.gif|Mark
        of the Order Lynx Demonic Power.gif|Demonic Power *50px Hunter in the Shadows:
        Lynx''s Ranged Weapon of choice is a shadow bomb. Lynx can throw said weapon
        to the ground at his location, causing a shadow Smoke Veil explosion that
        he uses to become temporarily invisible. Any successful attack while invisible
        breaks the opponent''s block. *50px Mark of the Order: Each successful Lynx
        attack leaves a temporary Mark on the opponent. When the Lynx enters Shadow
        Form, the Mark explodes. *50px Demonic Power: When entering Shadow Form, Lynx
        awakens his Demonic Power - the size of his claws increase significantly.
        This effect lasts for a while after the Shadow Form. ===Talents=== *50px Tactical
        Retreat: The size and damage of the explosion when activating the Hunter in
        the Shadows ability is increased. *50px Perfect Stealth: The duration of the
        Hunter in the Shadows ability is increased. *50px Body of a Demon: The Demonic
        Power duration is increased. *50px Mark of the Order''s Leader: The Mark of
        the Order duration is increased. *50px Titan''s Whispers: Titan''s whispers
        amplify the first Demonic Power of the round - all Lynx attacks deal bonus
        damage. *50px Sharpest Blades: Each successful claw attack has a chance to
        deal increased damage. *50px Insatiable Demon: When Demonic Power is active,
        all Lynx''s attacks restore his health, in proportion to 40% of the damage
        dealt. *50px Egoist: As long as the opponent bears the Mark of the Order,
        he cannot gain any Shadow Energy. *50px Demonic Prince: During the duration
        of the Demonic Power, Lynx receives additional Shadow Energy for his attacks.
        *50px Unrivaled Assassin: A successful attack while invisible greatly reduces
        the cooldown time of the Hunter in the Shadows ability by 8 seconds. *Level
        3: Increases Lynx''s attack damage and shadow damage by +5%. *Level 5: Increases
        Lynx''s defense by +10%. *Level 7: Increases Lynx''s attack damage and shadow
        damage by +5%. *Level 9: Increases Lynx''s defense by +10%. *Level 11: Increases
        Lynx''s attack damage and shadow damage by +5%. *Level 12: Increases Lynx''s
        attack damage and shadow damage by +5%. *Level 13: Increases Lynx''s attack
        damage, defense and shadow damage by +5%. === Historical Importance Index
        Mechanism === Historical Importance Index is a mechanism in the Shadow Fight
        world which allows all people to change the course of world history processes
        with their wishes, thus being able to influence the world timeline and change
        the face of the world based on their personality. Because everybody has access
        to this power, more often than not their wishes will intercept and clash with
        each other over which one gets to become reality. The winner whose wish will
        triumph over the one of his adversary is the one who is simply more important
        to the world than the other. This is why people who are very important will
        change the fate of the world with their wishes so suddenly they won''t even
        know how they succeeded so easily, because they don''t even have to try much,
        while those who are less important than the previously mentioned won''t be
        able to change the world with their wishes even if they try harder than the
        more important people to make them reality, their wishes getting completely
        overwritten by those of the more important individuals. Stranger explains
        how the index of importance works using a simple example. One''s historical
        importance index is as high as how many other lives they impacted, and how
        dramatically. The higher the index of historical importance of a person is,
        the more "luck" they get in all their plans, the more of their wishes will
        come true. ==Gallery== AppIcon 1024.png Emote hero Lynx Sharpening.png|Sharpening
