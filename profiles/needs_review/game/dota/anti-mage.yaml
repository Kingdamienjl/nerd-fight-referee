    - field: intelligence
      value: 'Above Average (Manages to keep his cool in tough situations) Notable
        Attacks/Techniques: Wave: A form of Magic which gives Yuka the ability to
        dispel other Magic, making him the "Anti-Mage" par excellence, Wave manifests
        itself in the form of massive masses of transparent energy, which nullifies
        any spell on contact, making it an extremely effective form of defense against
        all Mages, but also possesses remarkable destructive power when directed at
        foes, granting Yuka a useful means of offense, which, as an added advantage,
        can''t be defended against with Magic. As a form of defense, Wave can be used
        to create a shield that nullifies all incoming magical attacks and zaps the
        attacker should they try and encroach upon the barrier. However, Magic can
        be still be used outside the barrier to enhance the power of the part of the
        body trapped inside the barrier. The Lamia Scale Mage is also shown able to
        momentarily seal away an opponent''s Magic without the need to directly strike
        them, making Wave a very versatile set of skills. *Wave Boost: Yuka, while
        running forward, extends both arms behind him, releasing elongated masses
        of energy from his palms. These move backwards in large spirals, creating
        an immaterial, conical tunnel-like trail. This technique does not only prevent
        all those behind Yuka from using Magic, but, as the name itself suggests,
        also boosts the Mage''s movement speed, granting him additional momentum.
        Wave Boost was employed by Yuka during the Grand Magic Games'' Chariot event
        in an attempt to gain an advantage while slowing down other competitors. Alternatively,
        Yuka can surround one of his open hands with a relatively small, elongated
        sphere of energy. This allows him to momentarily "seal" the Magic of a target,
        preventing them from casting spell. This comes in useful whenever Yuka is
        partnered with another Mage (This usually being Toby), who can thus attack
        the defenseless foe without the risk of becoming caught in Yuka''s "waves".
        The range at which the Lamia Scale Mage can affect opponents with this technique
        is unknown, though it appears to measure at least some meters. Wave_Shield.gif|Wave
        Wave_Boost.gif|Wave Boost ==Notable Matchups== Victories: Losses: Inconclusive:
