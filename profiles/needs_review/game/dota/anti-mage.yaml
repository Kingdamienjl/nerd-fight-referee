        Users Category:Anime Characters Category:Empowerment Users Category:Energy
        Users Category:Magic Users Category:Male Characters Category:Manga Characters
        Category:Power Nullification Users'
      source_id: mediawiki-anti-mage
      provider_id: vsbattles
      authority: high
      confidence: 0.75
