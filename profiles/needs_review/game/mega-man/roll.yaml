        Intangibility (Robot Masters are capable of transforming themselves into a
        beam of light which allows him to teleport into somewhere else, which includes
        interplanetary distances. This is also combat applicable and Robot Masters
        while in this state are completely invulnerable), Weapon Mastery (She can
        use her own broom as a weapon, using it to fight and defeat formidable enemies
