        (All shown here), Darkness Manipulation (Can create forcefields of darkness),
        Portal Creation and Summoning (Can create portals which summon enemies), Regeneration
        Negation and Immortality Negation (High-Godly and Types 3 and 8: Completely
        erased the Sigma Virus from existence, despite the fact that he has already
