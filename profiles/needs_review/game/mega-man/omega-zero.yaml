        Self-Sustenance (Types 1, 2 and 3), Martial Arts, Resistance to Absolute Zero
        and Cosmic Radiations, Corrosion Inducement, Transmutation, Hacking, Magnetism
        Manipulation and Corruption (Should be far superior to Classic Era robots
        such as Mega Man) All previous abilities plus the abilities of the Dark Elf
        which includes: Existence Erasure (Completely erased the Sigma Virus), Soul
        Manipulation, Statistics Amplification (Cyber Elves such as Winkie allows
        it''s users to increase their vitality, others such as Croire can even quadruple
        it. Cyber-Elves such as Turbo as the name implies, massively enhanches the
        speed of it''s user. Croire can also increase the durability of others), Healing
        (Morick is capable of fully healing it''s users), Damage Transferal (Motolar
        is capable of transfering enemy damage and turning it to health energy to
        heal it''s users), Time Manipulation (Clocka is capable of slowing down time),
        Paralysis Inducement (Stiker can be used to stun enemies), Homing Attack (Can
        create an attack which will follow their target), Duplication (Cyber-Elves
        such as Byse is capable of duplicating items that the Player gets), Energy
        Manipulation and Projection (Capable of launching energy attacks), Information
        Manipulation and Reality Warping (If a Cyber-Elf''s power is used in Cyberspace,
        their power will also affect the real world counterpart, making them able
        to operate all of the real world''s phenomena while there), Forcefield Creation
        and Explosion Manipulation (Cyber Elves such as Bomga can explode on enemies
        and then turn it into a damage shield. Totten is capable of creating forcefields
        over spikes), Fire Manipulation, Absolute Zero Ice and Electricity Manipulation
        (Croire possesses all of these abilities), Status Effect Inducement, Invulnerability
        (Cyber-Elves such as Jackson can also make their user invulnerable), Creation
        (Cyber-Elves such as Hapitan can turn themselves into and create Sub-Tanks
        for their users), Sleep Manipulation (Scaling to Cyber Elf X who was able
        to incapacitate everyone on the resistance with a single flash), Probability
        Manipulation (Cyber-Elves such as Itecle maes the chance of an enemy dropping
        an item 100%), Biological Manipulation, Transmutation, Matter Manipulation
        and Data Manipulation (The Mother Elf is capable of turning others into Cyber-Elves,
        beings of pure energy. Can rewrite Reploid DNA), Flight (Cyber-Elves such
        as Birsky can save others from falling down), Darkness Manipulation, Life
        Manipulation and Power Nullification (Cyber-Elves such as Halfmargo is capable
        of dropping the enemy''s health bar by half of it''s original amount), Time
        Stop (Cyber-Elves such as Stochu is capable of freezing all enemies in the
        area), Transmutation (Cyber-Elves such as M-orell is capable of turning all
        enemies into pathetically weak Mets), Purification (Can purify others from
        the effects of the Sigma Virus), Minor Gravity Manipulation (Cyber-Elves such
        as Ribbit can make your sliding speed slower), Corruption and Madness Manipulation
