        for himself or other Reploids. He becomes increasingly insane and unstable
        as time goes by, where he acts like a mindless beast, Possession: After merging
        with the Maverick Virus, Sigma exists as an incorporeal being that uses physical
        bodies to interact with the world directly (But can still fire energy and
        virus blasts to damage foes). As a result, he''s nearly impossible to kill
        without a weapon specifically designed for eradicating the Maverick Virus
