    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Genius Intelligence, Inorganic
        Physiology (Type 2), Weapon Mastery (Sigma can wield various types of weapons),
        Natural Weaponry (Has a buster cannon on his arm which allows him to fire
        several attacks. Also has claws build in), Accelerated Development (As Sigma
        is a Reploid, he also has the limitless potential that X has. Sigma also stated
        that he can get final forms stronger and stronger), Invisibility (Sigma''s
        true form cannot be seen or analyzed like normal data due to his nature. Also
        scales to the Nightmare who has the same nature), Large Size (Up to Type 1),
        Afterimage Creation (Consistenly shown to be capable of creating afterimages),
        Danmaku (Can create countless blastes at the same time), Homing Attack (Can
        create attacks which follow up it''s targets), Intangibility (Is naturally
        intagible. Can even render himself completely intangible to characters with
        NPI such as X), Non-Physical Interaction (He can completely destroy a soul.
        Scales to other characters who are capable of directly interacting with and
        destroy Data, which is a Robot''s true existence at an informational level),
        Pocket Reality Manipulation and BFR (Created his own pocket reality and teleported
        X, Zero and Axl to there), Resurrection (Can resurrect deceased Reploids.
        Sigma has consistenly came back from getting his soul destroyed), Dimensional
        Travel (Teleported away out of his dimension in X7), Weather Manipulation
        (Changed the weather from sunny into a storm by simply appearing), Flight
        (Can fly around as seen here), Creation (Can create several enemies), Duplication
        (Can create several duplicates of the Sigma Virus), Darkness Manipulation
        (Scaling to the Nightmare who can cause darkness in levels), Fire Manipulation
        (Can consistenly create fire attacks), Elemental Manipulation, Organic Manipulation
        (Shown here), Invulnerability and Aura (Can create an aura around himself
        in which he becomes invulnerable for a short time), Technology Manipulation
        (Took full control of the Final Weapon), Power Nullification (The Maverick
        Virus can take away it''s enemies powers), Explosion Manipulation (Can create
        countless explosions), Air Manipulation (Can create several tornados to hold
        X and Zero back off), Magnetism Manipulation (Can magnetically attract objects
        and then throw them away), Acrobatics, Martial Arts (Shown to be a physically
        capable fighter skilled in physical combat), Light Manipulation (Can blast
        off eye lasers), Electricity Manipulation (Can create many electric blastes),
        Possession (Reploids souls are capable of returning to their original bodies
        in case they aren''t destroyed. Sigma can take new bodies for himself and
        even attempt to conquer others'' body forcefully), Magma Manipulation (Spawned
        large amounts of lava), Absolute Zero Ice (Sigma can spawn a huge burst of
        ice to freeze others, which should scale far above the Classic era, which
        can freeze at absolute zero), Metal Manipulation (Scales to the Nightmare
        who created large blocks of metal around the stages), Acid Manipulation and
        Corrosion Inducement (Scales to the Nightmare who is capable of creating an
        enormous acid rain on Rainy Turtloid''s stage), Water Manipulation (Scaling
        to the Nightmare Mother who is capable of creating water based projectiles),
        Portal Creation (Scaling to the Nightmare who created portals to their dimensions),
        Regeneration (High-Godly: Sigma has consistenly came back from getting his
        soul destroyed, which is pure data. Sigma should also scale to the Nightmare
        who are capable of regenerating after their bodies are completely destroyed,
        which seems to be the case with Sigma as well), Immersion (Can enter and leave
        the Computer in Mega Man Xtreme), Vibration Manipulation (Can create shockwaves),
        Soul Manipulation (Is the one behind the Erasure incident, with him stating
        that he was going to completely erase X''s soul. He also scales to the Nightmare
        who are capable of completely erasing Reploid Souls), Biological Manipulation
        (Scales to the Nightmare who are capable of rewriting Reploid DNA. The Sigma
        Virus is also capable of affecting nature itself), Mind Manipulation, Corruption
        (Type 2) and Madness Manipulation (The Sigma Virus is a virus which is capable
        of quickly spreading through the whole planet whose main ability is to twist
        the mind of Reploids to his own control. Said effects of the virus includes
        corrupting the victims he infects and causing to them to become completely
        lunatic and lose their sense of reality. Said Virus also likely works on humans
        as the Sigma Virus affected nature and the Baby Elves are stated to twist
        human minds and are clones of the Mother Elf, which was made from Zero''s
        Maverick Virus data. Is also far above the likes of the Evil Energy and the
        Roboenza), Perception Manipulation (The Sigma Virus can put illusions on their
        victims), Reactive Power Level (Through each defeat, Sigma gains more strength),
        Transformation ([Can consistenly transform into gigantic forms), Attack Refle'
      source_id: character-stats-profiles-sigma-mega-man
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
