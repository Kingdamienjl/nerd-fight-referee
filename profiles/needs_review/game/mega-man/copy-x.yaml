- id: claim-weaknesses-cbc0f368
  section: weaknesses
  axis: weakness
  text: 'Copy X is both highly overconfident and vain and lacks major combat experience.
    Notable Attacks/Techniques: |-|Ultimate Armor= {{{!}} class="fandom-table" {{!}}+Offensive/Defensive
    Techniques !Ability !Description !Visual {{!}}- {{!}}Raging EX Charge {{!}}Creates
    an damaging aura around himself that regenerates his health. {{!}}N/A {{!}}- {{!}}Nova
    Strike {{!}}According to Rockman Zero Hisshou Kouryakuhou, since X has this version
    of the Ultimate Armor, he can use the Nova Strike as seen in the games, and often
    uses it as his main mode of travel across the arena before firing an elemental
    shot. He renders himself invulnerable for the duration. It can be executed on
    both the ground and in mid-air. Copy X has shown the ability to steer this attack
    somewhat, allowing him greater accuracy. {{!}}N/A {{!}}- {{!}}Reflect Laser {{!}}Fires
    an energy shot that reflects off of walls, becoming ideal for indoor combat. {{!}}N/A
    {{!}}- {{!}}Mode Change {{!}}Similar to Zero''s Chips, X can change elemental
    modes between Thunder, Flame, Ice- giving access to different types of energy
    shots. {{!}}N/A {{!}}- {{!}}Elemental Shot {{!}}Depending on the Mode, X can fire
    projectiles from his Buster with varying properties. *Thunder Shots are slow moving
    orbs, similar to Electric Spark, that track the target. The charged version conducts
    electricity through the terrain. *Flame Shots are large longitudinal flames similar
    to Fire Wave that travel in an arc. The charged version shoots a shot upwards,
    spreading down like a shower. *Ice Shots shatter into pieces rebounding the opposite
    direction, identical to Shotgun Ice. The charged version launches a sweeping blizzard
    forward. {{!}}N/A {{!}}- {{!}}} |-|Armed Phenomenon= A powerful transformation-
    which boasts wings for flight, multi-directional lasers fired in a storm, binding
    projectiles, and an overall increase in strength. 400px|center *Bind Ring: A halo
    of energy that binds opponents in one place leaving them open to attacks. *Giga
    Punisher: Slams the spiked platforms he creates while simultaneously shooting
    Bind Rings to immobilyze, crush and impale his foes. ==Gallery== center|200px
    ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Game Characters Category:Robots Category:Antagonists Category:Primary
    Antagonists Category:Evil Characters Category:Mega Man Category:Weapon Masters
    Category:Armor Users Category:Energy Users Category:Forcefield Users Category:Flight
    Users Category:Element Users Category:Game Bosses Category:Male Characters Category:Fire
    Users Category:Light Users Category:Electricity Users Category:Water Users Category:Earth
    Users Category:Ice Users Category:Final Bosses Category:Regeneration Users Category:Self-Sustenance
    Users Category:Absolute Zero Users Category:Video Game Characters Category:Reploids
    Category:Inorganic Beings Category:Narcissists'
  source_ids: *id004
