- id: claim-powers-and-abilities-e92c8d83
  section: abilities
  axis: hax
  text: '*Copy X should possess all of X''s powers during the Elf Wars, created after
    the formation of Neo Arcadia and said Elf Wars- as a replacement for the real
    one after he sealed himself away along with the Dark Elf. Shown abilities include:
    **Superhuman Physical Characteristics, Inorganic Physiology (Type 2), Self-Sustenance
    (Types 1, 2 and 3) **Elemental Weapons (Of the Lightning, Fire, and Absolute Zero
    Ice, Light variety) **Flight, Invulnerability through the Nova Strike and by unleashing
    a Self-Healing Aura, Regeneration (High-Low), and Transformation (via Armed Phenomenon)
    **Being built with X''s DNA, he should have Dimensional Travel and all of his
    resistances like Resistance to EMPs, Absolute Zero, Mind Manipulation, Soul Manipulation,
    Biological Manipulation, Matter Manipulation, Space-Time Manipulation and more'
