        includes Wily Machine Number 8 whose energy laser could overpower Duo and
        leave him paralyzed. Can inflict great harm to the Wily Star''s defenses,
        which are part of the overall battle station. As an "imperfect machine", he
        can completely destroy the universe and leave nothing out of it. Defeated
        all the enemies empowered by the Evil Energy, which is stated to have greater
        energy than anything that ever existed on Earth up to that point, which includes
        the Wily Teleport System. Defeated Air Man, who can make Tengu Man struggleRockman
        Perfect Memories. Defeated all the Robot Masters in Super Adventure Rockman,
        who should be stronger than their appereances in Mega Man 2: The Power Fighters4
        Universes), higher with Adaptors (By fusing with Rush, he can gain many transformations
        which increase his power and makes him able to fly) | Low Multiverse level
        (Fought with and destroyed Ra Thor, a robot who was capable of easily no-selling
        his attacks and then proceeded to casually overpower and ragdoll him around,
        with his strength and speed being many times above that of Mega Man. Ra Thor
        is also treated as Wily''s greatest creation around the time, making him scale
        far above machinery which is amped by infinite amounts of energy. Fought and
        defeated Rockman Shadow who destroyed the entire planet and became so powerful
        that nobody in the future was able to challenge him 3 times above 4 Universes
        ), higher with Adaptors, far higher with Empowerment (Was capable of absorbing
        the energy of the Robot Masters and was capable of easily overpowering New
        Yellow Devil with this newfound power, who is far above Mega Man and the other
        Robot Masters Including Ra Thor. He was later able to use the Double Mega
        Buster to overwhelm and destroy Ra Moon, but it is so powerful it can short
        circuit him) and Double Gear System (This upgrade is designed to push robots
        far above their normal strength and speed, with Light noting Rock that he
        wouldn''t be able to stand a chance against robots using the Double Gear System
        if he doesn''t use it himself, which would imply it''s far above any of the
        prior power increases incluiding the Double Mega Buster. The Double Gear System
        also amplifies his power to become many times more powerful)'
