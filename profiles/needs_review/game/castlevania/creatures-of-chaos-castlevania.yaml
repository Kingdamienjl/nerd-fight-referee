claims:
- id: claim-powers-and-abilities-44db446b
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=No|Content=All prior abilities on a higher level,
    plus the following: *Self-Sustenance (Type 2; Vampires and those related to them
    [https://www.youtube.com/watch?v=5HvyWqFR7r4&t=400s don''t need to feast on human
    blood to sustain their needs to live] [https://www.youtube.com/watch?v=mTrIqtz4FS0&t=835s
    shifting into other forms]) *Stealth Mastery, Temperature Manipulation & Passive
    Soul Manipulation (Vampires are shown to be incapable of making any [https://imgur.com/a/N3O2FGc
    noise for anyone to hear, and is capable of freezing someone down to their very
    soul by touching them] [https://imgur.com/a/06VZfXv Vampires can take people''s
    souls akin to Death.]) *Enhanced Reactive Evolution (Vampires are capable of adapting
    new abilities on the fly to ensure their survival like [https://www.youtube.com/watch?v=eFWosLLCZwg&t=750s
    when Alucard who''s] [https://www.youtube.com/watch?v=y6ExOE-tSvM&t=455s resistance
    grew stronger]) *Paralysis Inducement ([https://imgur.com/a/KAXDGYa Vampires can
    paralyze anyone they see] and Glyph users can absorb and [https://www.youtube.com/watch?v=t0u8kox_1Tc&t=405s
    analyze the ability they take in naturally]. a newly created vampire only for
    said creature to shrug off its effects and attack the individual.'
