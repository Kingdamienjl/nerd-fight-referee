        has a wide range of effective area. *Spirit Summon: Occasionally, Death can
        summon a variety of spirits in many different forms to attack and destroy
        his opponents. One popular summon is his personal minions. *Dimensional Rift:
        Sometimes Death can open a dimensional rift to confuse and damage his enemies.
