        to support in battle or to create a diversion while he goes for reaping. Death
        can create small to big sickles to large scythes that cover a wide area. *Deadly
        Tempest: It is a fire-based spell that burns enemies with a wave of fire and
        has a wide range of effective area. *Spirit Summon: Occasionally, Death can
        summon a variety of spirits in many different forms to attack and destroy
        his opponents. One popular summon is his personal minions. *Dimensional Rift:
        Sometimes Death can open a dimensional rift to confuse and damage his enemies.
        It is an alternate realm which boosts Death''s powers significantly. *Hell''s
        Gate: Death can open the gates of Hell, containing the demons of the deepest
        of the underworld. He does this to supply an army for Dracula, and also to
