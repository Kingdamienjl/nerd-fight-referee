    - field: weaknesses
      value: "Sunlight: The light of the sun makes vampires combust into flames almost\
        \ immediately after being fully exposed, burning their skin and flesh away,\
        \ and leaving only their steaming skeletons. Olrox and Drolta imply that vampires\
        \ feel a natural sense of dread as the sun rises, being able to tell when\
        \ the dawn is near even before the first lights of day appear in the sky.,\
        \ Fire: Immolation is also one the most effective ways to end a vampire, being\
        \ mainly used by Sypha Belnades and Richter Belmont through their pyrokinesis.\
        \ However, fire won't work on some extremely powerful vampires such as Dracula,\
        \ Olrox or Erzsebet B\xE1thory., Stakes: Generally, piercing a vampire's heart\
        \ will make their bodies turn into dried up husks almost instantly, though\
        \ this is not always the case, Godbrand and Ratko for instance, started to\
        \ burn until they were reduced to ashes, and Carmilla caused a massive explosion\
        \ that destroyed part of her castle., Holy Water: Holy water burns vampires\
        \ like acid and makes them catch fire. The water of the river blessed by the\
        \ resurrected Bishop at Braila proves to be lethal as great part of Dracula's\
        \ army burns and disintegrates when immersed in it., Crosses: Trevor Belmont\
        \ states that crosses affect vampires because they're an evolved predatory\
        \ species and their eyesight works different than that of humans, with geometrical\
        \ shapes confusing their brains and making them panic. However, this is proved\
        \ to be wrong, as the vampire Vaublanc is not only repelled by Annette using\
        \ crosses, but also burns his hand upon touching one of them. Their natural\
        \ aversion to religion is further reaffirmed as vampires are also affected\
        \ by holy water and consecrated weapons. This, also contradicts Dracula pointing\
        \ out that fear of crosses for vampires is a mere superstition. Since original\
        \ show and spin off were created by different writers, it is also possible\
        \ their approaches are inconsistent with each other, meaning that settings\
        \ of each show can have different rules about it., Consecrated weapons: The\
        \ consecrated whips of the Belmont Clan can effectively hurt and kill vampires,\
        \ having been the main weapon the family has used for centuries to hunt these\
        \ creatures. The leather whip has been shown to burn vampire skin upon contact,\
        \ and could make night creatures like Blue Fangs explode. In the case of the\
        \ Morning Star, it can instantly destroy both vampires and night creatures\
        \ alike by making them explode upon their flesh being damaged by it. However,\
        \ a powerful vampires like Dracula was proved"
