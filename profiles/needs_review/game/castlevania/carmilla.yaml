    - field: weaknesses
      value: 'Specific holy weapons can bypass her invulnerability. Notable Attacks/Techniques:
        *Bat Swarm: Carmilla unleashes a swarm of bats that drains the life from its
        victims. *Gravity Circle: Carmilla creates a gravity field around the target
        to pin them to the ground. *Poisonous Blow: Carmilla creates a poisonous cloud
        that inflicts poison on the target. *Sweet Torture: Carmilla dashes towards
        her opponent, and with one movement but pushes them onto the floor and performs
        a backwards somersault. Then, she lands on her opponent, piercing her bladed
        heels into their flesh with full force. *Wicked Game: Carmilla leaps onto
        the air and swirls her chained blade around her in a circular motion, slicing
        all around her. *Bloody Heel: Carmilla leaps onto the air and performs a spinning
        dive kick, slicing her opponent with her heel at full force. *Merciless Dance:
        Carmilla stabs the floor with her blade and uses it as support to perform
        a rapid, whirlwind-like spinning kick, slicing her opponent apart with the
        blade of her heel. *Sacrifice: Carmilla fires the blade of her weapon as a
        harpoon, piercing her opponent from a distance. Subsequently, the chain retracts
        pulling the opponent towards her, which she takes advantage of to perform
        a spinning kick attack. *Maiden Pull: Carmilla dashes towards her foe, performing
        a swirling combo that culminates with her piercing her opponent with her weapon
        and throwing him away. *Maiden''s Feast: Carmilla''s finishing move. She detaches
        her weapon from her arm, which quickly grows and alters its shape. She dashes
        towards her opponent at incredible speed, hitting them with a vicious array
        of punches and kicks. As her opponent lays beaten they are quickly trapped
        by an Iron Maiden torture device, which is in fact Carmilla''s own weapon.
