      value: "Carmilla cannot fight in spirit form, is incredibly arrogant and suffers\
        \ from crippling claustrophobia due to her death in life. ===Noble Phantasms===\
        \ Phantom_Maiden_NP.jpg|Phantom Maiden: Phantasmal Iron Maiden Phantom Maiden.gif|Phantom\
        \ Maiden in Fate/Grand Order Phantom_Maiden_Arcade.gif|Arcade ver. {{Quote|Blood,\
        \ blood, blood...! Immortal beauty, an eternal feast, unsightly age shall\
        \ find me at the ends of time... Phantom Maiden! Fwa, hahahahaha, Ahahahahahahah!\
        \ Ahahahaha...!|Carmilla using Phantom Maiden}} Phantom Maiden: Phantasmal\
        \ Iron Maiden: Carmilla's Noble Phantasm, the famous torture tool said to\
        \ have been used by Elizabeth B\xE1thory, an iron maiden born from the imaginations\
        \ of the masses, who remember it as an esteemed killing weapon used to slaughter\
        \ young girls. With its activation, Carmilla manifests a massive iron maiden\
        \ above her opponent, which swings shut on them, impaling them on its spikes\
        \ before it moves to open above her, covering her in the blood of her victim\
        \ and rejuvenating her thanks to her Blood-Sucking skill. Due to Carmilla's\
        \ legend as one who preyed on women, it is extra effective against female\
        \ opponents. ===Class Skills=== Presence Concealment: The ability to hide\
        \ one's presence as a Servant. Carmilla, more of a serial killer than an assassin,\
        \ has a low rank of D, as the reason that her murders did not come to light\
        \ much earlier was because of the size of her territory and her position as\
        \ a noble. While it remains suitable for spying, other Servants can immediately\
        \ detect Carmilla even when it's active. ===Personal Skills=== Blood Bath:\
        \ A skill whose canonical effects are unknown. Blood-Sucking: The ability\
        \ to drink another's blood to replenish one's health and magical energy. An\
        \ inherently vampiric ability that Carmilla can use to recover her strength\
        \ and even rejuvenate her skin. Torture Techniques: The possession of exceptional\
        \ skill in torture, granting bonus modifiers to damage when using torture\
        \ tools, and adding more and more damage due to the bleeding it causes. In\
        \ Carmilla's case, it further boosts her damage when she's fighting women,\
