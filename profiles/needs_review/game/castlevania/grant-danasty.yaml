      value: 'Superhuman Physical Characteristics, Supernatural Senses, Martial Arts
        Mastery, Weapon Mastery, Self-Sustenance (Type 1: Can survive without oxygen),
        Energy Manipulation, Holy Magic, Attack Reflection and Power Nullification
        (The Belmonts can completely nullify or reflect magic, projectiles and abillities
        used against them through their power and the Vampire Killer, The Vampire
        Killer through its presence alone weakened Dracula''s disembodied Soul and
        powers so much that he was unable to resurrect himself or escape from the
        sealed castle for several years), Immortality Negation (Type 1, 3, 6 & 7;
        Capable of killing Dracula, however unable to sever his connection to Chaos),
        Regeneration Negation (Mid-Godly; Capable of successfully killing Dracula,
        who can reform even if his soul is destroyed and his existence is erased),
        Non-Physical Interaction and Soul Manipulation (Can hit and destroy Souls
        directly, can interact with intangible beings like Ghosts), Elemental Manipulation
        (Fire, Ice, Thunder and Wind), Time Manipulation and Time Stop (With the Stopwatch),
        Light Manipulation and Levitation (With Grand Cross), Darkness Manipulation,
        Magic Barriers, Statistics Amplification and Aura (Via Flaming Fist, which
        covers Trevor''s body with fire which enhances his physical strength, and
        Golden Aura, which greatly enhances his durability), Homing Attack (With Energy
        Wave Item Crash), Danmaku (With Blade Serpent Item Crash), Vibration Manipulation
        (With Destruction Item Crash) |-|Resistances=Resistance to the following:
        Time Stop, Soul Manipulation, Reality Warping, Void Manipulation / Existence
        Erasing and Chaos Manipulation, Mind Manipulation, Dream Manipulation, Illusions,
        Petrification, Blood Manipulation and Poison Manipulation, Madness Manipulation,
        Fear Manipulation, Empathic Manipulation, Death Manipulation, Darkness Manipulation,
        Paralysis Inducement, Sleep Manipulation, Body Puppetry, Memory Manipulation,
        Curse Manipulation (Which can prevent the target to use their weapons, cast
        spells or use items, and rapidly drain magic) and Hellfire Manipulation (Should
        be able to resist the powers of minor demons), Resistance to the Castle''s
        Influence/Effect''s: (Transmutation, Possession, Law Manipulation and Corruption),
        Resistance to Holy Manipulation (Holy weapons and attacks are always ineffective
        against the Belmonts), Attack Reflection and Power Nullification (The Belmonts
        attacks cannot be nullified or reflected)'
      source_id: character-stats-profiles-grant-danasty-castlevania
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Low Multiverse level (Defeated Alucard and later killed Dracula alongside
        him, Sypha Belnades and Grant Danasty. Dracula is higly superior to Olrox,
        who created a infinite sized dimension and his presence sustains the existence
        of The Abyss, which is composed of 6 different universes, is able to merge
        2 universes as merely a spirit and is also superior to Galamoth, who could
        rule all of existence if he didn't had Dracula as opposition and is stronger
        than the Time Reaper, who would have destroyed the entire Castlevania timeline.
        Should also be noted that only the Vampire Killer was capable of hurting Dracula
        inside the canon, therefore Sypha and Grant would not have helped much in
        the fight)
      source_id: character-stats-profiles-grant-danasty-castlevania
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'Massively FTL+ (Can keep up with Alucard, who managed to escape The
        Abyss alongside Soma Cruz), possibly Infinite (Can keep up with Dracula, who
        should be superior to the Sky Fish, a creature that is so fast that it can
        move in stopped time without having any time stop immunity) Lifting Strenght:
        Class 10 (Comparable to Dracula''s reincarnation, Soma Cruz, who can move
        large boulders) Striking Strenght: Low Multiversal Class (Can hurt the likes
        of Isaac and Hector with his physical attacks, who are comparable to Death,
        who''s second only to Dracula)'
      source_id: character-stats-profiles-grant-danasty-castlevania
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Low Multiverse level (Can take attacks from Death and Dracula, almost
        unharmed by Isaac's attacks)
      source_id: character-stats-profiles-grant-danasty-castlevania
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: * Belmont Clan: Trevor is a
        descendant of the legendary Belmont Clan. The Belmonts are renowned as the
        most powerful Vampire Hunters of all, and it is their destiny to face the
        Vampire King Dracula every century. As a Belmont, Trevor possesses incredible
        superhuman abilities which allow him to defeat most creatures of the Night
        with ease. * Holy Magic: As a Belmont, Trevor possesses control over Holy
        Magic. This trait has been present in the Belmont Clan since its inception,
        though its potency became greatly increased as a result of the marriage ancestor
        Trevor and the witch Sypha Belnades. Ever since then, the Belmonts have displayed
        great offensive magical powers, and the wizards of the Belnades Clan have
        been their close allies in Vampire-hunting. Years after marrying Sypha, Trevor
        demonstrated a great improvement in his magical powers, both in variety and
        potency. ** Flaming Fist: Trevor covers himself in a fire aura, which enhances
        his physical power to deliver devastating punches and kicks ** Golden Aura:
        Trevor covers himself ina golden aura, which greatly enhances his durability
        * Item Crashes: Trevor is capable of performing what is known as an Item Crash,
        a devastating combination of his Magical strength with his arsenal of Sub-Weapons.
        Each weapon has its own Item Crash, all unique yet equally devastating. **
        Blade Serpent: The Dagger''s Item Crash. Trevor unleashes a torrent of Silver
        Daggers that swarm onto his enemies, dashing through the air with a serpent-like
        pattern. ** Destruction: The Axe''s Item Crash. Trevor joins both hands above
        his head, summoning a gigantic axe and slamming it onto the ground, provoking
        a quake that pushes all enemies away from him. ** Grand Cross: The Holy Cross''
        Item Crash. Trevor floats and releases immense magical power in the form of
        a pillar of light. Soon after, giant crosses manifest which begin swirling
        around the pillar, destroying all nearby enemies. ** Energy Wave: The Holy
        Water''s Item Crash. Trevor casts his Holy Water onto the ground, producing
        holy flames that chase his opponent. ** Time Stop Lv.2: The Stopwatch''s Item
        Crash. Allows Trevor to stop time for a longer period of time. * Combat'
      source_id: character-stats-profiles-grant-danasty-castlevania
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
