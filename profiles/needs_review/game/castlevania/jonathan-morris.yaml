  axis: hax
  text: 'Superhuman Physical Characteristics (Can fight supernatural creatures of
    the night with nothing more than hand to hand, the Morris Clan are a distant relative
    to the Belmonts, and share their superhuman power), Martial Arts (With the Rampage,
    can out skill most of the creatures of the night, with most of them being rather
    skilled fighters), Extrasensory Perception (Can sense the presence of other beingsCastlevania:
    Portrait of Ruin), Deconstruction (via Various Holy weaponsCastlevania The Belmont
    Legacy Issue 3), Enhanced Senses (With the Eye for Decay, can fight invisible
    enemiesCastlevania: Portrait of Ruins BradyGames strategy guide page 133Castlevania:
    Portrait of Ruins BradyGames strategy guide page 143), Underwater Breathing (Type
    2, can breathe underwater), Summoning (Alongside Charlotte,Castlevania: Portrait
    of Ruins BradyGames strategy guide page 95 Jonathan can summon the past Belmonts
    power to aide him in battle), Telekinesis (Can control his weapons midair), Explosion
    Manipulation (With the Grenade), Limited Invulnerability and Attack Reflection
    (With the Stonewall, which can reflect attacks at the cost of a small damageCastlevania:
    Portrait of Ruins BradyGames strategy guide page 13), Statistics Amplification
    (With the Offensive Form), Empathic Manipulation (With the Taunt, which make them
    prioritize him as target), Aura (With the Aura Blast), Immortality, Resurrection
    and Regeneration Negation (Low-High and Types 2, 3, 4, 6, and 7. Just like the
    Belmonts, Jonathan is capable of negating the creatures of chaos'' regeneration,History
    of Castlevania - Crescent of the moon page 69 who are capable of forming back
    their bodies with no issues Jonathan can also nulify Undead''s regeneration and
    immortality with the Undead KillerCastlevania: Portrait of Ruins BradyGames strategy
    guide page 121, which can survive lethal blows easily, possess other objects to
    exist, and are largely undead, with some of them being souls and evil spirits.)
    Regeneration (Mid-Low), Enhanced Senses (Can see a monster''s aura that is invisible
    for the normal eye), Information Manipulation (Type 1; Magic is capable of extracting
    information of someone in order to manifest it into a new being.), Biological
    Manipulation (Magic is capable of warping one''s body like what happened to Gergoth),
    Non-Physical Interaction (Intangibility - Elemental, Immaterial, and Phasing -
