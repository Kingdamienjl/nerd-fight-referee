- id: claim-standard-equipment-74348335
  section: equipment
  axis: equipment
  text: 'center|350px The Vampire Killer is the legendary Heirloom Whip of the Belmont
    Clan, which has been wielded by several heroes throughout the centuries in their
    quests to stop the Dark Lord Dracula. The Vampire Killer is intrinsically connected
    to the Belmont Bloodline, and only a member of their clan can wield it. If one
    who isn''t a Belmont attempts to wield it, the whip will simply slowly drain their
    life away. Long ago, it was known simply as the Whip of Alchemy, and was a much
    weaker magical weapon developed by the alchemist Rinaldo Gandolfi. The Whip was
    transformed into its current state with the sacrifice of Sara Trantoul, betrothed
    of Leon Belmont. Sara had been cursed with vampirism, though her heart was still
    pure. Through a ritual, her soul was infused within the whip, allowing the weapon
    to awaken to its true potential. Empowered by a soul both tainted and pure, the
    Vampire Killer is simultaneously a Holy and Vampiric Weapon, and its power is
    lethal to all demonic entities. The Vampire Killer is able to nullify or reflect
    Magic and projectiles with its touch alone, it also weakened Dracula''s powers
    so much that he was unable to ressurect himself or use his powers to escape for
    several years. * Strength Glove: A relic that increases Johnathan''s pushing strength.
    * Stone of Flight: A relic that allows Johnathan to jump again mid-air * Immunity
    Ring: Makes the wearer immune to poison. * Blessed Ring: Makes the wearer immune
    to curses. * Magnus Ring: Restores MP in a matter of seconds. * Undead Killer:
    A whip that while weaker than the Vampire Killer, can kill the undead as well
    as those who can resurrect themselves back (Like the Red Skeletons and Red Axe
    Armors). Can also cure vampirism of those who are not complete vampires yet (Like
    Vincent). Critical Art: Flames burst around the whip attack, increasing its damage.
    * Cinquedea: A dagger that Johnathan can thrust swiftly; encrusted with jewels.
    * Assassin Blade: A Sword that is capable of poisoning the enemy. * Stellar Sword:
    A Holy-Based sword once owned by Maxim Kischine.Critical Art: Simultaneously appear
    in front of all enemies onscreen and deliver a fast, empowered slash. * Damascus
    Sword: A Sword that is made from Damascus steel. * Royal Sword: A two-handed greatsword
    made for kings (yet Johnathan is swinging with one arm). * Holy Claymore: A Holy-Based
    greatsword that is shaped like a cross. * Alucard Spear: A spear created by Alucard
    and was wielded by Eric Lacarde himself. Jonathan Knife.gif|Knife Jonathan Axe.gif|Axe
    Jonathan Cross.gif|Cross Jonathan Holy Water.gif|Holy Water Jonathan Bible.gif|Bible
    * Golden Axe: Axe that is crafted by Gold and has astounding destructive power.
    Critical Art: Johnathan leaps up high in the air, dives down, and slams his weapon
    to the ground. * Kaiser Knuckle: Brass knuckles that allow Johnathan to jab multiple
    times swiftly with just one arm. Critical Art: Johnthan moves forward while jabbing.
    * Knife: A Slash-based sub-weapon that the user throws three knives at the same
    time. * Axe: A Slash-based sub-weapon that the user throws a giant axe in an ark.
    * Cross: An Holy-based sub-weapon that the user throws a giant cross, and comes
    back to its user. * Holy Water: A Fire and Holy-based sub-weapon that the user
    throws a canister of holy water at the ground and unleashes a holy fire that moves
    forward. * Bible: A Holy-based sub-weapon that the user spirals around the user,
    damaging enemies nearby. Jonathan Javelin.gif|Javelin Jonathan Ricochet Rock.gif|Ricochet
    Rock Jonathan Boomerang.gif|Boomerang Jonathan Bwaka Knife.gif|Bwaka Knife Jonathan
    Shuriken.gif|Shuriken Jonathan Yagyu Shuriken.gif|Yagyu Shuriken Jonathan Discus.gif|Discus
    Jonathan Kunimitsu.gif|Kunimitsu Jonathan Kunai.gif|Kunai Jonathan Paper Airplane.gif|Paper
    Airplane Jonathan Cream Pie.gif|Cream Pie Jonathan Crossbow.gif|Crossbow Jonathan
    Dart.gif|Dart Jonathan Grenade.gif|Grenade Jonathan Steel Ball.gif|Steel Ball
    * Javelin: A Slash-based sub-weapon that the user throws a long, giant javelin
    in a curved downward way and sticks to the ground. * Ricochet Rock: A Slash-based
    sub-weapon that the user throws two rocks, one goes down while the other goes
    upwards, and ricochets from walls. * Boomerang: A Slash-based sub-weapon that
    the user throws a boomerang in an arc and then moves backward overhead of him
    * Bwake Knife: A Slash-based sub-weapon that the user throws a knife forward that
    rotates while in motion that hits multiple times. * Shuriken: A Slash-based sub-weapon
    that the user throws four large shurikens in a downward arc. * Yagyu Shuriken:
    A Slash-based sub-weapon that the user throws Yagyu shuriken forward. * Discus:
    A Slash-based sub-weapon that the user throws two discus that moves in different
    directions across the floor. * Kunimitsu: A Slash-based sub-weapon that the user
    throws four knives forward; goes through enemies and geometry. * Kunai: A Slash-based
    sub-weapon that the user throws a spread of kunai at different directions. *'
