    - field: standard_equipment
      value: 'center, 350px The Vampire Killer is the legendary Heirloom Whip of the
        Belmont Clan, which has been wielded by several heroes throughout the centuries
        in their quests to stop the Dark Lord Dracula. The Vampire Killer is intrinsically
        connected to the Belmont Bloodline, and only a member of their clan can wield
        it. If one who isn''t a Belmont attempts to wield it, the whip will simply
        slowly drain their life away. Long ago, it was known simply as the Whip of
        Alchemy, and was a much weaker magical weapon developed by the alchemist Rinaldo
        Gandolfi. The Whip was transformed into its current state with the sacrifice
        of Sara Trantoul, betrothed of Leon Belmont. Sara had been cursed with vampirism,
        though her heart was still pure. Through a ritual, her soul was infused within
        the whip, allowing the weapon to awaken to its true potential. Empowered by
        a soul both tainted and pure, the Vampire Killer is simultaneously a Holy
        and Vampiric Weapon, and its power is lethal to all demonic entities. The
        Vampire Killer is able to nullify or reflect Magic and projectiles with its
        touch alone, it also weakened Dracula''s powers so much that he was unable
        to ressurect himself or use his powers to escape for several years., Strength
        Glove: A relic that increases Johnathan''s pushing strength., Stone of Flight:
