        Killer through its presence alone weakened Dracula''s disembodied Soul and
        powers so much that he was unable to resurrect himself or escape from the
        sealed castle for several years), Immortality Negation (Type 1, 3, 6 & 7;
        Capable of killing Dracula, however unable to sever his connection to Chaos),
        Regeneration Negation (Mid-Godly; Capable of successfully killing Dracula,
        who can reform even if his soul is destroyed and his existence is erased),
        Non-Physical Interaction and Soul Manipulation (Can hit and destroy Souls
        directly, can interact with intangible beings like Ghosts), Elemental Manipulation
        (Fire, Ice, Thunder and Wind), Time Manipulation and Time Stop (With the Stopwatch),
        Light Manipulation and Levitation (With Grand Cross), Darkness Manipulation,
        Magic Barriers, Statistics Amplification and Aura (Via Flaming Fist, which
        covers Trevor''s body with fire which enhances his physical strength, and
        Golden Aura, which greatly enhances his durability), Homing Attack (With Energy
        Wave Item Crash), Danmaku (With Blade Serpent Item Crash), Vibration Manipulation
        (With Destruction Item Crash), Resistance to the following: Time Stop, Soul
        Manipulation, Reality Warping, Void Manipulation / Existence Erasing and Chaos
        Manipulation, Mind Manipulation, Dream Manipulation, Illusions, Petrification,
        Blood Manipulation and Poison Manipulation, Madness Manipulation, Fear Manipulation,
