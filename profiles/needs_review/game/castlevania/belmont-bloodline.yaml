        Holy Manipulation (Holy weapons and attacks are always ineffective against
        the Belmonts), Attack Reflection and Power Nullification (The Belmonts attacks
        cannot be nullified or reflected)'
      source_id: character-stats-profiles-belmont-bloodline-castlevania
