        of blood or dust. Low-Godly overtime - Regenerated his whole physical form
        but it took years), Self-Sustenance (Type 1. Vampires don't need breath),
        Stealth Mastery, Holy Manipulation and Unholy Manipulation (He maintains the
        sacred powers he received when he was part of the Brotherhood of Light, as
        he is "the chosen one" of God. As well as possessing the demonic powers of
        The Forgotten One), Blood Manipulation, Power Absorption (Able to thief the
        power of someone if suck their blood), Power Bestowal (Turned Trevor Belmont
        into Alucard after give his own blood to him), Magic, Martial Arts (Trained
        and master in military combat), Sealing (Has methods to imprison the Daemon
        Lord and Chupacabra) Cloth Manipulation (Can make cloths from his blood),
        Weapon Creation (Created the void sword from the empty in his heart. Created
        the Chaos Claws from the heatred in his mind. Created the black whip from
        his own blood), Summoning, Ice Manipulation, Healing, Life Manipulation (Void
        Sword can absorb the vital energy of those who are hit by it, that energy
        goes directly to Dracula, making him heal), Air Manipulation, Forcefield Creation
        (Via Void Shield), Electricity Manipulation, Statistics Amplification (Chaos
        Claws increase this strength), Fire Manipulation, Danmaku, Soul Manipulation
        (The flames of Chaos Claws can directly burn the soul of those who are hit),
        Explosion Manipulation, Teleportation, Power Mimicry (The demonic wings are
        a copy of the Seraphim wings that Carmilla wielded), Reactive Evolution (Vampires
        can adapt new abilities to ensure their survival) Pocket Reality Manipulation
        (His mental castle is a sub-dimension linked to his consciousness, inside
        Dracula has supreme power and the beings of the "real world" have their powers
        reduced to something "pathetic"), BFR (Can send beings to the mental dimension
        of his Castle), Non-Physical Interaction (Able to interact with the specters
        of Satan, whose are materially free), Attack Reflection (Via Chaos Shield.
        Able to summon dozens of bats that circle his body, these bats reflect part
        of the damage received back to the attacker), Poison Manipulation (His blood
        is toxic and poisonous, being able to corrupt sacred artifacts), Intangibility
        (Can turn into mist and blood), Energy Manipulation and Shockwave Creation
        (Can trigger red energy waves as well as shock waves), Shapeshifting (He is
        capable of transforming himself into a dragon, rats and several other animals.
        He can also take on his younger form, like the shape of other people), Large
        Size (Type 0 in Dragon Form), Size Manipulation (Can make his weapons bigger
        at will), Flight, Animal Manipulation (Can summon and control bats), Telekinesis,
        Smoke Manipulation, Matter Manipulation (Turned The Forgotten One into dust
        with a slash of his hand and can throw projectiles of different matter), Resurrection
        (Resurrected Trevor Belmont as Alucard), Mind Manipulation (Controlled Simon's
