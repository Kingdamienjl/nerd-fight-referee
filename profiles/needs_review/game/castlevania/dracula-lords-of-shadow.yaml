    - field: intelligence
      value: Genius (Dracula is a combat genius, being thousands of times more experienced
        than his human version, when he was already considered to be the best warrior
        of the entire Brotherhood of Light of his day. He is also a master in the
        use of mystical powers, having been easily able to adapt to and wield his
        abilities even after thousands of years without using them. His strategic
        mind allows him to outthink and overpower even the most formidable supernatural
        foes, employing centuries of battle knowledge, magic, and manipulation to
        control conflicts across generations. He demonstrates mastery in both physical
        and magical combat, seamlessly integrating swordplay, unarmed techniques,
        and advanced sorcery to exploit any opponent's weaknesses).
