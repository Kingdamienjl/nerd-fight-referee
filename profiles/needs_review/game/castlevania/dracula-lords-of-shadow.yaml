- id: claim-powers-and-abilities-37a76bd4
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Type 2, 3 and 4; The spirits
    are capable of bringingCastlevania: Lords of Shadow Chapter 12: Final Fight him
    back to complete his mission), Flight (Can fly), Non-Physical Interaction (Can
    interact with and destroyCastlevania: Lords of Shadow Chapter 7: Chromatic observatory
    incorporeal and abstractCastlevania: Lords of Shadow - Mirror of Fate Act 3 beingsCastlevania:
    Lords of Shadow - Mirror of Fate), Regeneration (At least Low-Mid; Can regenerate
    from a hole in the chest, possibly far higher; due to his immortality with the
    souls, he could''ve regenerated from self destruction against Satan, though it''s
    not clear), Immortality, Resurrection and Regeneration Negation (High-Godly -
    Conceptual and Narrative and Types 2, 3, 4, 5, 6, 7, 8 and 9. Is capable of negating
    the creatures of chaos'' regeneration, which is capable of regenerating any damageSymphony
    of the Night Prima Guide page 33 to their being, with their soul being destroyed
    only to come back very easily; said soul is filled with darkness/chaos itselfCastlevania:
    Circle of the Moon and said beings can be the embodiment of the magic from the
    narratives they come from, with lesser beings like the Innocent DevilsCurse of
    darkness manga chapter 2 absorbing the magic around them to reform their beingCastlevania:
    Curse of Darkness alongside those with access to the castle''s magic being used
    to reform their existence, to even lesser forms of damage like slashing wounds,
    and melting into the groundHistory of Castlevania - Crescent of the moon page
    69 to regenerate back up. Is also capable of permanently killing the Creatures
    of Chaos and can permanently end his immortality as the Prince of Darkness with
    his Vampire Killer which can survive lethal blows easily,Castlevania: The Belmont
    Legacy Issue 3 Can revive endlessly, are beyond life and death,Demon Castle Dracula:
    Demon''s Blood, Bloody Nightmare page 44, 126, 202 can possess other objects to
    exist, most of them are undead, some of them are souls and evil spirits, and they
    all are reliant onCastlevania: Portrait of Ruins BradyGames strategy guide page
    2 the Chaos Entity, and bounded by it, always returning after being killed, with
    Chaos existing in an alternate dimension beyond the normal world), Sleep Manipulation
    and Power Nullification (The vampire killer can put others into a deep sleep and
    remove their powers), Accelerated Development (Grows stronger with every stepCastlevania:
    Lords of Shadow Chapter 2: Underground Caves he takesCastlevania: Lords of Shadow
    Chapter 6: Castle Courtyard), Sealing (Can seal other beingsCastlevania: Lords
    of Shadow - Mirror of Fate Prologue), Pain Manipulation and Paralysis Inducement
    (Can inflict agony upon others and paralyze them with the Vampire KillerCastlevania:
    Lords of Shadow 2 - Revelations: Crissaegrim), Sound Manipulation (Can make a
    deafening sound attackCastlevania: Lords of Shadow - Mirror of Fate), Extrasensory
    Perception (Can sense other beingsCastlevania: Lords of Shadow Chapter 8: Outer
    Wall), Weapon Mastery (is skilled with numerous different weapons), Magic, Martial
    Arts (Trained and master in military combat), Power Absorption (IsCastlevania:
    Lords of Shadow Chapter 1: Oblivion Lake capableCastlevania: Lords of Shadow Chapter
    2: The Black Knight of absorbingCastlevania: Lords of Shadow Chapter 3: The Dark
    Lord of the Lycans the powersCastlevania: Lords of Shadow Chapter 5: Wygol Village
    of othersCastlevania: Lords of Shadow Chapter 8: The Throne Room and useCastlevania:
    Lords of Shadow Chapter 11: The Dracolith it for his ownCastlevania: Lords of
    Shadow Resurrection: The Underworld), Explosion Manipulation (via numerousCastlevania:
    Lords of Shadow weapons), Holy Manipulation (has access to holy powers), Forcefield
    Creation and Attack Reflection (via Divine Shield), Absorption and Light Manipulation
    (through Light magic), Perception Manipulation (via Light attacks), Fire Manipulation
    (via Shadow Flames), Statistics Amplification (via Shadow Magic), Soul Manipulation
    (through the Black Knight''s power), Mind Manipulation (via FaeriesCastlevania:
    Lords of Shadow Chapter 3: The Three Towers), Power Nullification (Can nullify
    magic with shadow and light magicCastlevania: Lords of Shadow Chapter 10: Fire
    Pinnacle), Void Manipulation,, Death Manipulation and Chaos Magic (via the Dark
    Crystal, which just like the Ensnared Demon,Castlevania: Lords of Shadow Chapter
    2: Dark Dungeon houses an trapped demon that can give chaos and void powers through
    its influence alone) Resistance to the Following: Illusion Creation (Can resist
    the effects of the castle which can create illusionsCastlevania: Harmony of Dissonance),
    Mind Manipulation and Disease Manipulation (Can resistCastlevania Lords of Shadow:
    Lesser Lycanthrope the mental effects of a werewolf bite, which can inflictCastlevania
    Lords of Shadow - Mirror of Fate Act 2 diseases upon others), BFR (Can resist
    the Castle''s power to send one to another dimensionHaunt'
