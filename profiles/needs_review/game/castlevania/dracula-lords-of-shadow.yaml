    - field: standard_equipment
      value: 'Dark Crystal, Combat Cross: Gabriel''s primary weapon that''s used to
        slay creatures of the night. Throughout his journey he gained numerous augments
        for his combat cross thanks to Rinaldo Gandolfi''s ingenuity, making it superior
        to other Combat Crosses as it can slay himself permanently as the Lord of
        Darkness when other Brotherhood members with their combat crosses failed.,
        Silver Daggers: Strong daggers that''s made to be deadly against any lycans.
        They can be further amped with Shadow Magic to cause explosions on contact
        with any target., Faeries: Small creatures that can aid Gabriel by mesmerizing
        any targets with their presence, leaving them exposed for Gabriel to attack
        them. They can be amped by Light Magic by doing a suicide attack to deal massive
        damage to their targets., Holy Water Flasks: Bottles of Holy Water that''s
        powered by the sun itself. Its powers can repel any creature of the night
        and burn anything that comes to contact with the flames. It can be amped by
        Light magic to create a defensive barrier that reflects any and all attacks
        for the user., Dark Crystal: A crystal that summons a demoness when used.
        Once utilized, the entire area becomes dark and the demon swirls around the
        entire battlefield, Mirror of Fate, Shadow Whip: A supernatural whip-like
        weapon, which Dracula creates from his own vampiric blood. He maintains many
        of the Vampire Killer''s moves and attacks and serves as his main weapon.,
        Void Sword: Dracula is capable of generating this powerful mystical sword,
        which represents the void in his heart and the magic in it, capable of stealing
        life and healing it. It works in a similar way to the Magic of Light. It has
        the longest range between Dracula''s weapons. When he retrieves the Primordial
        Gem of the Void, he can fire Projections of the Void that can freeze waterfalls
        and fires and gain access to a multitude of adaptive techniques and powers
        like wave explosions, an explosion of Magic Void and a whirlwind during the
        which the sword emits electrical explosions. It can also instantly freeze
        enemies that are affected., Chaos Claws: Dracula is able to manifest Chaos
        Claws that burn red gauntlets and are used in a similar way to Shadow Magic.
        They are the representation of Dracula''s fierce anger and hatred against
        Satan, Zobek and the Brotherhood of Light. They are Dracula''s strongest weapon
        and do extreme amounts of damage. His claw attacks and punches combined with
        the element of fire allow him to crush enemy armor through heat and crushing
        strength. They also allow Dracula to pass through enemy guards or boss blocks
        more quickly. Dracula is capable of firing Chaos Bombs and expands the powers
        of the Chaos Claws, summoning explosions from the ground or creating waves
        of fire that damage large crowds of enemies, vertical whirlpools of fire,
        vortexes of fire, in addition to firing fireballs that can damage distant
        enemies. With the gauntlet, Dracula can burn even the souls of his enemies.,
        Seal of Alastor: A seal of a legendary warrior that when released, will grant
        the user advance knowledge in combat and further master their innate abilities
        to the limit for a brief period of time., Ensnared Demon: A demon trapped
        inside of a magical core which is used normally to power other devices. Once
        the demon is released, it will bless the user with infinite chaos and void
        powers for a brief period of time through its influence alone., Stolas'' Clock:
        The demon prince, Stolas encased the ashes of a thousand corpses in these
        twisted hourglasses. Dracula can break them to slow down time. Enemies must
        be hit to slow down in time. While in effect, Dracula also gains more experience.,
        Dracul''s Heart: Dracula can use this artifact, filled with the blood of his
        victims, to restore his lost health., Tears of a Saint: Dracula can use these
        artifacts to completely restore his stamina and will also increase his current
        stamina by 200%., Mirror of Fate: A powerful artifact that allows the user
        to see into the past and future of themselves or others.'
