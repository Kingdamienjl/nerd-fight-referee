      value: 'Superhuman Physical Characteristics: Vampires possess superhuman strength,
        speed, agility, stamina, durability that are beyond all human limits., Martial
        Arts: Vampires are shown to have skilled hand to hand combatant, at least
        during the fight., Immortality (Type 1): Vampires are an immortal beings and
        thus cannot die of old age., Longevity: Vampires have extremely long life
        spans, when compared to humans., Natural Weaponry: Vampires possess nearly
        indestructible razor-sharp fangs and claws that can easily bite and tear flesh,
        as well as to even carve into metal. Their claws can also serve them as formidable
        weapons in combat., Regeneration (At least Mid-Low): Vampires can heal themselves
        from deep injuries and stab wounds., Flight: Vampires have the ability to
        fly. Some of them manifest their wings, such as Dragan or Drolta., Acrobatics:
        Vampires have the ability to perform superhuman jumps or even backflips.,
        Enhanced Senses: As stated by Hector, Vampires have amazing enhanced senses
        and can hear their prey from many meters., Supernatural Willpower: Vampires
        are capable of performing inhuman feats that are beyond human standards.'
      source_id: character-stats-profiles-carmilla-castlevania
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Sunlight: The light of the sun makes vampires combust into flames almost\
        \ immediately after being fully exposed, and leaving only their steaming skeletons.\
        \ Olrox and Drolta imply that vampires feel a natural sense of dread as the\
        \ sun rises, Fire: Immolation is also one the most effective ways to end a\
        \ vampire, being mainly used by Sypha Belnades and Richter Belmont through\
        \ their pyrokinesis. However, fire won't work on some extremely powerful vampires\
        \ such as Dracula, Olrox or Erzsebet B\xE1thory., Stakes: Generally, piercing\
        \ a vampire's heart will make their bodies turn into dried up husks almost\
        \ instantly, started to burn until they were reduced to ashes, Holy Water:\
        \ Holy water burns vampires like acid and makes them catch fire. The water\
        \ of the river blessed by the resurrected Bishop at Braila proves to be lethal\
        \ as great part of Dracula's army burns and disintegrates when immersed in\
        \ it., Crosses: Trevor Belmont states that crosses affect vampires because\
        \ they're an evolved predatory species and their eyesight works different\
        \ than that of humans, with geometrical shapes confusing their brains and\
        \ making them panic. However, this is proved to be wrong, as the vampire Vaublanc\
        \ is not only repelled by Annette using crosses, but also burns his hand upon\
        \ touching one of them. Their natural aversion to religion is further reaffirmed\
        \ as vampires are also affected by holy water and consecrated weapons. This,\
        \ also contradicts Dracula pointing out that fear of crosses for vampires\
        \ is a mere superstition. Since original show and spin off were created by\
        \ different writers, it is also possible their approaches are inconsistent\
