    Alchemy, it has the power to trap the souls of powerful vampires within it, bestowing
    he who wields it with immense dark forces. However, it also brings the curse of
    Vampirism with it, meaning that he who wears the stone shall lose his humanity
    and become a vampire too. Mathias Cronqvist used the Crimson Stone to absorb the
    powers of the Vampire Lord Walter Bernhard and become Dracula. *Ebony Stone: The
    second greatest treasure of Dracula, the Ebony Stone makes it so that Dracula''s
