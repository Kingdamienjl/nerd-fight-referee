- id: claim-standard-equipment-958bc765
  section: equipment
  axis: equipment
  text: "Combat Cross Travel Book.png|Combat Cross Boomerang MoF.png|Boomerang Electric\
    \ Bomb Trevor.gif|Electric Bomb Speed Boots Trevor.gif|Speed Boots *Combat Cross:\
    \ Trevor's primary weapon that\u2019s used to slay creatures of the night. Made\
    \ by the alchemist Rinaldo Gandolfi, this weapons is very versatile when it comes\
    \ to combat and traversal. *Boomerang: A set of Boomerangs that when thrown, sticks\
    \ onto any incoming target and explode within a few seconds. *Electric Bomb: A\
    \ metallic orb made by the Toy Maker. When thrown, it creates an electric field\
    \ that shocks any enemy near its range. *Speed Boots: A pair of boots that allows\
    \ Trevor to run great distances and leap massive bounds. DarkPainArt02.webp|Dark\
    \ Pain Crissaegrim Book of Dracul.png|Crissaegrim Glaciem Blade Book of Dracul.png|Glaciem\
    \ Blade Igneas Blade Book of Dracul.png|Igneas Blade Ensnared Demon Book of Dracul.png|Ensnared\
    \ Demon Stolas Clock Book of Dracul.png|Stolas Clock Tears of a Saint Book of\
    \ Dracul.png|Tears of a Saint *Dark Pain: A dark replica of the Combat Cross made\
    \ by the Toy Maker, it's only made to be used by a creature of the night to access\
    \ its full power. *Crissaegrim: A blade forged by the shattered remains of the\
    \ Vampire Killer, the Igneas Blade, and Glaciem Blade. Alucard made this in an\
    \ attempt to subdue his father in a plan to lure out Satan and Zobek in order\
    \ to permanently end their reign of terror once and for all. *Glaciem Blade: An\
    \ ice blade with little to no history on who made it or where it came from, it\
    \ has the ability to drain the vitality of those struck by its body. Alucard took\
    \ the pieces of this blade to forge the Crissaegrim. *Igneas Blade: A blade forged\
    \ from the Demon King Igneas, who made a deal with a king to consume all and destroy\
    \ an entire city. Alucard found the broken remains of the blade to forge the Crissaegrim.\
    \ *Seal of Alastor: A seal of a legendary warrior that when released, will grant\
    \ the user advance knowledge in combat and further master their innate abilities\
    \ to the limit for a brief period of time. *Ensnared Demon: A demon trapped inside\
    \ of a magical core which is used normally to power other devices. Once the demon\
    \ is released, it will bless the user with infinite chaos and void powers for\
    \ a brief period of time through its influence alone. *Stolas' Clock: The demon\
    \ prince, Stolas encased the ashes of a thousand corpses in these twisted hourglasses.\
    \ Dracula can break them to slow down time. Enemies must be hit to slow down in\
    \ time. While in effect, Dracula also gains more experience. *Dracul's Heart:\
    \ Alucard can use this artifact, filled with the blood of his victims, to restore\
    \ his lost health. *Tears of a Saint: Alucard can use these artifacts to completely\
    \ restore his stamina and will also increase his current stamina by 200%."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
