        \ shattered remains of the Vampire Killer, the Igneas Blade, and Glaciem Blade.\
        \ Alucard made this in an attempt to subdue his father in a plan to lure out\
        \ Satan and Zobek in order to permanently end their reign of terror once and\
        \ for all., Glaciem Blade: An ice blade with little to no history on who made\
        \ it or where it came from, it has the ability to drain the vitality of those\
        \ struck by its body. Alucard took the pieces of this blade to forge the Crissaegrim.,\
        \ Igneas Blade: A blade forged from the Demon King Igneas, who made a deal\
        \ with a king to consume all and destroy an entire city. Alucard found the\
        \ broken remains of the blade to forge the Crissaegrim., Seal of Alastor:\
        \ A seal of a legendary warrior that when released, will grant the user advance\
