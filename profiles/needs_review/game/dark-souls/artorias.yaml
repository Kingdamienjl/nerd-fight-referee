    - field: intelligence
      value: "Saber is an extremely accomplished swordswoman suitable for her class,\
        \ clashing with even the strongest heroes in swordplay. Few laying claims\
        \ to have better swordsmanship than her. Becoming the king of a prosperous\
        \ nation at the age of fourteen, she is a skilled politician and an able leader.\
        \ She can effectively lead armies into battle and governing most of Britain\
        \ by the end of her rule. She is also knowledgeable of magic, having been\
        \ Merlin's apprentice in her youth, and is familiar with most European Heroic\
        \ Spirits, quickly recognizing C\xFA Chulainn and Diarmuid Ua Duibhne after\
        \ seeing their Noble Phantasms once."
      source_id: vsbattles-artorias-game
