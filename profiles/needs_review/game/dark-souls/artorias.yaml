        The fire damage caused by fireballs makes them effective against corporeal
        beasts and Undead, who by nature fear flame. *Fire Orb: Pyromancy which improves
        upon Fireball. Hurl fire orb. The flaming fire orb explodes upon impact, causing
        fire splash damage in a spectacle which seems to symbolize the strength of
        the fire-manipulating pyromancers. *Great Fireball: Ultimate fireball pyromancy.
        Hurl giant fireball. Salaman the Master Pyromancer, also called Great Fireball
        after this spell, believed pyromancy was rooted in an adoration of fire. Those
        who acquire this spell usually agree. *Great Chaos Fireball: Art of the Flame
        of Chaos, which engulfed the Witch of Izalith and her daughters. Hurl giant
        chaos fireball. The Flames of Chaos can melt stone, producing a short-lived
        lava glob. *Firestorm: Primal pyromancy taught by Quelana of Izalith. Erect
        fire pillars in vicinity. The storm of flame is indiscriminate, and incinerates
        all nearby life. *Fire Tempest: Primal pyromancy of Quelana of Izalith. Erect
        giant fire pillars in vicinity. The tempestuous raging flames resemble those
        summoned by the Daughters of Chaos when they challenged the ancient dragons
        and scorched the very earth. *Chaos Storm: Art of the Flame of Chaos, which
        engulfed the Witch of Izalith and her daughters. Erects localized chaos fire
        pillars and leave localized pools of lava in their wake. *Combustion: Elementary
        pyromancy. Create powerful flame in hand. One of the most basic pyromancies.
        For this very reason, the flame thus created is fierce. *Great Combustion:
        Pyromancy which improves upon Combustion. Create powerful, giant flame in
        hand. Great Combustion creates a powerful flame, but many sorcerers mock the
        simplicity of this spell. *Fire Surge: Pyromancy foreign of the Great Swamp.
        Creates a surge of flame from palm to hand. *Fire Whip: Primal pyromancy taught
        by Quelana of Izalith. Sweep foes with fire whip. The root pyromancy of Combustion,
        but much more difficult to wield. *Chaos Fire Whip: Art of the Flame of Chaos,
        which engulfed the Witch of Izalith and her daughters. Sweep foes with chaos
        fire whip. This spell was wielded by the eldest of The Daughters of Chaos.
        *Poison Mist: Unique pyromancy crafted by Eingyi, considered a heretic even
