      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "The chivalric code binds Saber as a knight, and she'd thus never rely\
        \ on underhanded or more pragmatic tactics. Her sixth sense can be fooled\
        \ by things that Saber has never experienced. Unlike other Servants, Saber\
        \ isn't a proper Heroic Spirit, possessing a physical body that cannot go\
        \ into spirit form though she does not have this in the world of Fate/Grand\
        \ Order. She harbors a great deal of self-loathing and regrets over her actions\
        \ and perceived failures as the King of Britain, which can be exploited to\
        \ rile her up or break her mentally. Losing the ability to use one of her\
        \ hands properly will prevent her from using Excalibur to its fullest potential,\
        \ reducing its range to that of an Anti-Unit Noble Phantasm and weakening\
        \ it considerably. {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
        \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" |\
        \ colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques: |-\
        \ | ===Noble Phantasms=== ezgif-2-c19da832e2e9.gif|Activation in Heaven's\
        \ Feel movie adaptation Releaseia.jpg|Invisible Air in the Fate/stay night\
        \ visual novel IAboost.gif|Activation in Fate/Zero {{Nihongo|Invisible Air:\
        \ Bounded Field of the Wind King|{{Ruby|\u98A8\u738B\u7D50\u754C|\u3075\u3046\
        \u304A\u3046\u3051\u3063\u304B\u3044}}\u300C\u30A4\u30F3\u30D3\u30B8\u30D6\
        \u30EB\u30FB\u30A8\u30A2\u300D|F\u016B'\u014C Kekkai: Inbijiburu Ea}}: A mysterious\
        \ wind that hides Excalibur's identity. It is a Bounded Field, closer to regular\
        \ magic than a Noble Phantasm, presumably created by Merlin. The powerful\
        \ winds around the blade distort light, rendering Excalibur completely invisible\
        \ and its shape near-impossible to discern, keeping her opponents confused\
        \ and unable to properly gauge its size and length, or even what kind of weapon\
        \ it is. Once they figure it out, however, it becomes useless in this regard.\
        \ It takes on Excalibur's sharp edge, and Saber can use it to form a defensive\
        \ wall of wind large enough to envelop a building. Once the barrier is released,\
        \ the compressed wind surges around her and can be released as a single-shot\
        \ weapon, known as Strike Air: Hammer of the Wind King. She can also use it\
        \ to propel herself forwards at greater speeds. Saber's Excalibur.gif|Saber\
        \ using Excalibur against Caster's Gigantic Horror Small-Scale Excalibur Attack.gif|A\
        \ partial activation in the Unlimited Blade Works anime Excalibur FSN.jpg|Excalibur\
        \ in the Fate/stay night Visual Novel ExcaliburFGO.gif|Excalibur in Fate/Grand\
        \ Order Excalibur_FGOA.gif|Excalibur in Fate/Grand Order Arcade Excalibur\
        \ Extella.gif|Excalibur in Fate/Extella UcAvalon.gif|Saber using Avalon in\
        \ conjunction with Excalibur in Fate/Unlimited Codes {{Nihongo|Excalibur:\
        \ Sword of Promised Victory|{{Ruby|\u7D04\u675F|\u3084\u304F\u305D\u304F}}\u3055\
        \u308C\u305F{{Ruby|\u52DD|\u3057\u3087\u3046}}{{Ruby|\u5229|\u308A}}\u306E\
        {{Ruby|\u5263|\u3051\u3093}}\u300C\u30A8\u30AF\u30B9\u30AB\u30EA\u30D0\u30FC\
        \u300D|Yakusokusareta Sh\u014Dri no Ken: Ekusukariba}} King Arthur's most\
        \ famous divine sword. It is a crystallization of humanity's wishes forged\
        \ by the planet itself. Much like Excalibur Proto, it is a weapon designed\
        \ to protect the earth from the threat of chaos and destruction. Due to its\
        \ incredible potential for devastation, its real power is restricted by multiple\
        \ oaths. When activated, it converts Saber's magical power into light that\
        \ is then released as a destructive wave of energy on the level of Divine\
        \ Thaumaturgy. Despite this function's appearance, only the tip of this energy\
        \ wave can do damage, as the rest of the light emitted by Excalibur is the\
        \ dislocation of everything it has destroyed along its path. Excalibur also\
        \ boasts one of the fastest activation speeds among Noble Phantasms, matching\
        \ the charging speed of both the original Pegasus and Iskandar's chariot,\
        \ completing its activation in less than a second. Saber has also demonstrated\
        \ the ability to partially invoke Excalibur's power in both melee combat and\
