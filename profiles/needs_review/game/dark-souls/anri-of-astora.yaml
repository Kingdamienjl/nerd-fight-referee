    - field: attack_potency
      value: 'Universe level+ (Fought and defeated the Soul of Cinder, the manifestation
        of the power of every Lord of Cinder. Gwyn, the First Lord of Cinder, bequeathed
        most of his soul to the Gods, with the rest fueling the first flame for millenia.
        The First Flame created the concept of duality: light/dark, hot/cold, and
        life/death. In Dark Souls, "light is time" with the First Flame creating the
        concept of light and thus time, and the fading of the First Flame resulting
        in the complete extinguishing of light with darkness covering the world. Ludleth
        described this scenario as a "barren plane of endless darkness." Solaire described
        how "the flow of time itself is convoluted...the very fabric wavers," and
        how it has drawn his world close to the player''s own world. This is repeated
        in Dark Souls II, and in Dark Souls III, with Sauldren describing how there
        are schisms in time. The fading of the First Flame drew together the Dreg
        Heap which is the amalgamation of mangled remnants from every age and every
        land. This means that Gwyn''s soul is powerful enough to maintain the time-space
        of the universe for millenia, with the Ashen One upscaling from this. The
        strength of one''s soul determines their power, as souls are used to level
        up and the Emerald Herald believed that the Bearer of the Curse would need
        to grow their soul to challenge the souls of the Old Ones. In the Usurpation
        of Fire Ending, the Ashen One absorbs the First Flame itself, meaning they
        directly scale to the sustaining of the universe)'
