    - field: weaknesses
      value: 'Weak to sorceries, lightning, and darkness based attacks. Notable Attacks/Techniques:
        *Power Within: A pyromancy that, when cast, significantly raises the caster''s
        attack rating, as well as providing a large boost to stamina regeneration.
        This does, however, come at the cost of eating away at the Soul of Cinder,
        resulting in their HP being drained rapidly for the duration. *Great Combustion:
        A large, powerful blast of flames launched from the Soul of Cinder''s hands.
        *Great Chaos Fire Orb: Hurls a great chaos fire orb at the target, dealing
        Fire damage. After the initial impact, a pool of lava will remain for three
        seconds, dealing additional damage to the target if stepped in. *Poison Mist:
        When cast, a mist is released in front of the Soul of Cinder, causing gradual
        Poison buildup to foes that stand in it. Once contracted, Poison causes three
        damage per second for the duration. *Sacred Oath: Provides a 10% physical
        damage and elemental damage absorption buff and increases physical damage
        dealt by 10% for 60 seconds. *Heal: Restores HP for the caster and nearby
        allies equal to 3 times the Spell Buff of the catalyst. *Bountiful Light:
        Gradually restores a large amount of HP. *Crystal Soul Spear: Fires a piercing
        crystal soul spear that can go through a line of enemies. Once fired, this
        spell has limited homing abilities. *Farron Hail: Fires a cascade of soul
        darts at the target, dealing Magic damage. *Homing Crystal Soulmass: Releases
        a homing crystal soulmass with piercing qualities. *Soul Stream: Fires a torrential
        volley of souls dealing Magic damage to any enemy within it. *Soul Greatsword:
        Creates a soul greatsword in front of the caster, dealing Magic damage to
        any enemy within the cone of attack. *Great Farron Dart: Fires a powerful
        soul dart at the target, dealing Magic damage. *Sunlight Spear: Hurls a sunlight
        spear at the target to inflicting heavy lightning damage to anything struck
        by it, and to any enemies that were directly beside the target. *Splintering
        Lightning Spear: The Soul of Cinder hurls a lightning spear into the sky,
        causing other lightning bolts to rain down in the vicinity. *Lightning Stake:
        Deals heavy lightning damage to anything struck by the immediate impact of
        the bolt, as well as sundering their poise. ==Gallery== Render dark souls
