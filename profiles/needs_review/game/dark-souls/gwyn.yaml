    - field: weaknesses
      value: 'Insane and has lost a significant portion of his power after linking
        the First Flame. Takes additonal damage from Dark based attacks. Notable Attacks/Techniques:
        * Dashing Thrust: Used by Gwyn while he''s dashing. Although it is one of
        his linear attacks, it is possible he may switch to a slashing combo midway.
        It is also one of his best attacks in terms of tracking the player. * Quad-Slash
        Combo: Gwyn performs this attack in quick succession and solid tracking. It
        begins with an angled slash, then a horizontal one, another angled and finally
        a horizontal slash once more. The angled attacks can be sidestepped if the
        player moves early enough. * Kick: Rarely used, however, it causes a large
        drain of stamina if it connects while blocking. * Slash and Thrust: Occasionally
        Gwyn will interrupt his normal slash combo with a quick thrust afterward.
        If it hits, the player will be stunned, leaving them open for further combos.
        * Slashing Upper Combo: Starts with a powerful horizontal slash, which takes
        a large portion of stamina, followed by two more hits. The first two slashes
        can be difficult to evade. * Charging Slash: A powerful slash used by Gwyn
        to break the player''s guard. * Instant Dash/Double Slash: A very fast attack,
        which comes out of Gwyn''s instant dash when he glides towards the player
        before slashing twice. * Explosive Hand: An unblockable grab attack that deals
        massive fire damage. It has a high horizontal hitbox, so it is possible to
        roll under it to avoid it. After knocking the player away, Gwyn will follow
        up with a jumping slash or dashing slash. It also leaves Gwyn open to attacks
        for a short time. ==Notable Matchups== Victories: Maui (Disney) Maui''s Profile
