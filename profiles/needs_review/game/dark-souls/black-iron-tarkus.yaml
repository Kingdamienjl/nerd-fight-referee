- id: claim-standard-equipment-a02dd660
  section: equipment
  axis: equipment
  text: '*Greatsword: One of the gigantic straight greatswords. Very few have what
    it takes to wield this incredibly heavy, damage-dealing monster. A favorite of
    the Knights Berenike, known for their heavy armor, and Black Iron Tarkus. *Black
    Iron Greatshield: Greatshield of the mighty knight Tarkus. Built of special black
    iron and even heavier than Knight Berenike''s tower shield. Especially resistant
    to fire attacks and effective for shield bashing. *Black Iron Set: Armor of Black
    Iron Tarkus, a knight known for his great strength. Built of a special black iron
    and providing strong defense, notably against fire, but so terrible heavy to be
    unwieldy to all but Tarkus himself. *Havel''s Ring: This ring was named after
    Havel the Rock, Lord Gwyn''s old battlefield compatriot. Havel''s men wore the
    ring to express faith in their leader and to carry a heavier load. *Estus Flask:
    The Undead treasure these dull green flasks. Fill with Estus at bonfire. Fills
    HP. The Estus Flasks are linked to the Fire Keepers. The Dark Tales also make
    reference: An emerald flask, from the Keeper''s soul. She lives to protect the
    flame, and dies to protect it further. *White Sign Soapstone: Leave summon sign.
    Be summoned to another world as a phantom through your sign, and defeat the area
    boss to acquire humanity. In Lordran, the flow of time is distorted, and the White
    Sign Soapstone allows Undead to assist one another.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
