    damage is heavily associated with the gods), Soul Manipulation and Power Absorption
    (Absorbed Stormdrake''s soul and absorbed its power), Immortality (Types 1; Has
    been alive for thousands of years), Spear-Sword Mastery, Statistics Amplification
    and Damage Reduction (Should have access to Sacred Oath), Resistance to Electricity
    Manipulation, Ice Manipulation, Poison Manipulation, Bleeding, Mind Manipulation
    (Despite being in a hollowed state his mind isn''t affected and also he isn''t
    affected by Rapport) and Soul Manipulation (Can resist soul-based attacks), Lesser
    Resistance to Curse Manipulation, Petrification and Magic. The Stormdrake possesses:
    Superhuman Physical Characteristics, Flight,Fire Manipulation, Air Manipulation,
    Weather Manipulation, Resistance to Fire Manipulation, Poison Manipulation and
    Bleeding Same as before on a higher level minus the Stormdrake''s abilities'
  source_ids: *id003
