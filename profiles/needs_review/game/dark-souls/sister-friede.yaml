      value: '* Superhuman Physical Characteristics (Stanley is only a normal, somewhat
        dim human, and I can easily trap him inside scenarios he can''t escape from),
        * Non-Corporeal (Within the Mariella Ending, I''m stated to be a voice inside
        of Stanley''s head, implying that I''m a purely mental idea that can telepathically
        communicate with Stanley), * Fourth Wall Awareness (I am fully aware that
        The Stanley Parable is a video game, and address the player directly and force
        him into a cut-scene in the Incorrect Ending) * Madness Manipulation (Within
        the Mariella ending, I''m shown to drive Stanley insane and have partial control
        of his mind, even being able to give him the power to fly, see stars in a
        dream like state and die from revelation, possibly giving me Illusion Creation,
        Power Bestowal, Death Manipulation and Dream Manipulation as well, and even
        allowed to escape my commands, as well as the users in the Freedom Ending,
        granting him exactly what he wanted.), * Teleportation (Within the Playtest
        Ending, I can transport Stanley and myself to other games, or into the Serious
        Room if I catch them cheating, where it''s impossible for them escape in a
        similar method, which could lead to Battlefield Removal.), * Spatial Manipulation
        (I can trap Stanley inside never-ending looping hallways to never escape),
        * Plot Manipulation (Depending on how far off track Stanley went in the game,
        I can reform the plot to fix an... issue, such as setting off a nuclear missile
        inside the Mind Control Facility.), * Sound Manipulation (In case things get
        too grim or confusing, I can always play some music to lighten the mood or
        set the tone.), * Acausality (In the Confusion ending, I''m fully aware of
        the many restarts each time Stanley or the game itself went too far off track),
        * Existence Erasure (As a way to start Stanley''s story, I was the one to
        erase his co-workers and boss) * Creation (My greatest power of all, is the
        ability to cause whatever I desire to spawn, such as Fire, The Adventure Line,
        Bombs, Stanley''s Workplace, A lack of a wife, a leader-board, and presumably
        a lot more.)'
      source_id: character-stats-profiles-sister-friede-game
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Unless you count resetting or destroying the Stanley Parable game as
        Destroying an entire universe, which doesn't make much sense considering I've
        never programmed things like galaxies in the game, I have very few physical
        feats of my own, however I can cause a Nuke to go off in Stanley's office
        building, which is not only a building with a massive mind control facility,
        a light show and a large dome that leads to the outside world that logically
        should be rather large, but the weakest nuclear bomb, the W54, had a destructive
        range of 10 tons of TNT at lowest, but if you want to be generous and assume
        the bomb was comparable to Tsar Bomba, the strongest Nuke ever build, then
        it would increase to 50 Megatons. If you do consider creating, resetting or
        destroying my game as a physical feat, then it's worth noting that it contains
        a few mountains and a sky, implying that Stanley lived on a planet comparable
        to the Earth in size, and therefore, being able to destroy or create it would
        be Planet Level, although I do feel like mentioning that it will collapse
        in on itself, if someone makes too wrong of a choice. I also created the Memory
        Zone, a section of the Ultra Deluxe addition of my game, consisting of it's
        own star, and being able to create a space with the Earth, the Sun, and a
        comparable distance, would be Large Star Level... the time frame as to how
        long it took is unknown, but still worth mentioning.
      source_id: character-stats-profiles-sister-friede-game
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Due to transcending The Stanley Parable, I am not confound by it's physical
        boundaries, and as such, how much punishment I can physically take is Unknown,
        however if you count me surviving the destruction of the game, the same rules
        from above apply, Large Building Level at lowest, Large Star Level at Highest.
        However it is worth mentioning, that one ending establishes me as a voice
        inside of Stanley's mind, telling him what to do and how he felt, implying
        that I exist inside the mental plane, as opposed to the physical.
      source_id: character-stats-profiles-sister-friede-game
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Once again, I have not shown off any physical speed feats, other than
        potentially traversing to another game alongside Stanley, which would be a
        bit hard and too vauge to determine, likely making this Unknown, however I
        should be above the Stanley Parable Adventure Line, which Stanley was capable
        of traversing in the span of two minutes and six point nine four seconds,
        and assuming that Stanley walks as fast as an average person, and has reactions
        of a tenth of a second (He likely doesn't, but my notes don't list any slower
        reaction times), leaving the line to move faster than Stanley could react,
        then it means that the line can travel at six thousand three hundred forty
        seven meters per second, or roughly eighteen point five zero four three seven
        times the speed of sound, a Hypersonic+ speed feat.
      source_id: character-stats-profiles-sister-friede-game
