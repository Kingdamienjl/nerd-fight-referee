        Blue Truth as a lightning bolt), Large Size (Type 10), Higher-Dimensional
        Existence, Non-Corporeal, Acausality (Type 4), Invulnerability and Power Nullification
        with Endless Nine, Red and Blue Truths All previous powers and abilities to
        far greater extents, as well as: Beyond-Dimensional Physiology, Transduality
        (Type 2. Completely transcendent of all concepts of the Human Domain, including
        all of its dualities), Immortality (Types 1, 2, 3, 4, 5, and 8. His life and
        existence are both sustained by Beatrice as part of the world of her gameboard),
        Regeneration (High-Godly. Capable of recovering and preserving his existence
        by maintaining his ability to think and remembering his own form, even if
        it is conceptually erased and sent to the nothingness beyond all stories and
        layers), Teleportation, Dimensional Travel (Can willfully manifest in various
        layers of existence, both higher and lower, adapting his own existence to
        the atmospheric pressure of higher worlds), Spatial Manipulation, Quantum
        Manipulation (Used the "Multi-Layered Worlds Collapsation" technique to deny
        that the battle between Beatrice and Virgilia happened in the first place,
        collapsing infinite possibilities into a single scenario where it never occurred),
        Fate Manipulation, Void Manipulation, Mind Manipulation, Soul Manipulation,
        Plot Manipulation (Can manipulate Fragments, which are crystallizations of
        lower worlds that record and contain infinite possibilities, as well as their
        fate and plot, encompassing higher dimensional structures alongside countless
        spiritual / mental realms, as well as nothingness devoid of space and time
        entirely), Astral Projection, Non-Physical Interaction, Reactive Evolution
        and Adaptation, Cosmic Awareness (Can look into infinite possibilities by
        touching Fragments), Shapeshifting, Causality Manipulation (Controls the flow
        of cause and effect in the world of pieces, seeing its denizens as pawns on
        a game board and events as chess moves), Possession, Conceptual Manipulation
        (Type 1. Can manipulate the concepts of the Human Domain, which are visualized
        as physical objects on his level of existence, and create several concepts
        on the level of a higher-order world, such as gravity, out of his thoughts),
        Nonexistent Physiology (Type 2. Exists as an entity of nothingness at the
        core of his being, with his physical form being constructed and defined solely
        by his thoughts), Resurrection (Can easily return from death by regaining
        his interest and will to live, as the concept of time does not exist in the
        higher domains. Resurrected after being killed by the Red Key, which negates
        the concept of revivals), Abstract Existence (As a meta being, Battler is
        purely conceptual in existence), 4th Wall Awareness (Directly addressed the
        player during the EP 1 Tea Party), Light Manipulation, Non-Corporeal, Fusionism,
        Avatar Creation, Acausality (Type 5. Exists completely outside of the chessboard
        and is unrestrained by the limitations of the Human Domain, including that
        of fate, time and causality), Blue Truths., Resistance to Void Manipulation,
        Mind Manipulation and Soul Manipulation All previous powers and abilities
        to immensely higher degrees, in addition to: Magic, Mathematics Manipulation,
        Size Manipulation, Duplication, Telekinesis, Resistance Negation, Law Manipulation,
        Probability Manipulation, BFR (Threatened to kick Bernkastel off of his game
        board, and almost fired EVA-Beatrice from Umineko altogether. Can take pieces
        in and out of the chess board at will), Information Manipulation, Life Manipulation
