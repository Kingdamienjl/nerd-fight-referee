- id: claim-standard-equipment-104194a6
  section: equipment
  axis: equipment
  text: '*Shotel: Curved sword with sharply curved blade. Created by Arstor, Earl
    of Carim. Requires great skill to wield, but evades shield defense to sneak in
    damage. Lautrec wields a pair of these weapons. *Parrying Dagger: This dagger
    is useful after parrying and is normally equipped in the left hand. A favorite
    of the knights of Carim, who are famous for fighting without a shield. *Favor
    Set: Armor of Lautrec the Embraced, representing the goddess Fina''s love. During
    his solitude, he forsook everything, for he believed in the goddess''s love for
    him. The goddess''s arms wrap around this armor, as if to embrace the wearer.
    *Ring of Favor and Protection: A ring symbolizing the favor and protection of
    the goddess Fina, known in legend to possess "fateful beauty". This ring boosts
    its wearer''s HP, stamina, and max equipment load, but breaks if ever removed.
    *Red Tearstone Ring: The rare gem called tearstone has the uncanny ability to
    sense imminent death. This red tearstone from Carim boosts the attack of its wearer
    by 50% when in danger. *Estus Flask: The Undead treasure these dull green flasks.
    Fill with Estus at bonfire. Fills HP. The Estus Flasks are linked to the Fire
    Keepers. The Dark Tales also make reference: An emerald flask, from the Keeper''s
    soul. She lives to protect the flame, and dies to protect it further. *White Sign
    Soapstone: Leave summon sign. Be summoned to another world as a phantom through
    your sign, and defeat the area boss to acquire humanity. In Lordran, the flow
    of time is distorted, and the White Sign Soapstone allows Undead to assist one
    another. |}'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-93981546
  section: power_scale
  axis: battle_iq
  text: Combat expert and manipulator
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-61898265
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Weapon Mastery (Skilled Swordsman)
    *Martial Arts (Skilled in hand-to-hand combat) *Immortality (Types 1, 2 [Able
    to function unimpeded after receiving injuries as severe as being impaled through
    the skull and torso], 4, 7, and 8 [Reliant on the Undead Curse and will constantly
    revive when killed so long as it persists]) *Resurrection (So long as Tarkus remains
    afflicted with the Undead Curse, he shall continually resurrect upon death, retaining
    all memories and experiences) *Soul Manipulation/Absorption (Due to nature of
    being undead he can absorb the souls of nearby fallen enemies) *Empowerment/Statistics
    Amplification (Undead are passively empowered by the strength of their souls,
    and are able to amplify their strength through larger and larger amounts of Souls,
    though they cannot do so in combat) *Limited Dimensional Travel/Time Travel/Teleportation
    (Able to travel to different points of the world through his White Sign Soapstone
    summon sign) *Healing (Low-Mid, Estus Flasks can instantly heal the user from
    wounds as severe as being impaled through the torso or having their skull pierced.)
    *Damage Reduction (All weapons and shields grant a small, varying amount of damage
    reduction against physical, magic, fire, and lightning damage) *Statistics Amplification/Damage
    Reduction (All Armor grants the wearer varying degrees of increased physical durability
    and varying degrees of damage reduction against blunt and bladed/piercing attacks)
    *Reactive Power Level (Via Red Tearstone Ring) *Statistics Amplification (Via
    Ring of Favor and Protection) *Poison Manipulation/Disease Manipulation (Possesses
    an innate resistance to both Poison and Toxic which is further bolstered by his
    armor.) *Fire Manipulation, Temperature Manipulation, Magma Manipulation, Explosion
    Manipulation (Possesses an innate resistance to fire damage which is further bolstered
    by his armor.) *Electricity Manipulation (Possesses an innate resistance to electricity
    [Lightning] which is further bolstered by his armor.) *Magic (Possesses an innate
    resistance to Magic damage which is further bolstered by his armor.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
