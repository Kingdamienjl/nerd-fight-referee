    - field: intelligence
      value: 'Above Average (Has the knowledge and memories that would be expected
        of her mythological version. Has extensive knowledge on terraforming.) Standard
        Tactics: In battle Shifu will typically make use of Gullhaddr to fight. During
        the fighting she will then set up Gull-Elding for a devastating finishing
        blow. She will also use Gullhaddr to slip the golden blades in-between gaps
        in armor and weapons to destroy them from the inside.'
      source_id: vsbattles-sif-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "As they were born from mythology, gods can't neglect their mythology\
        \ or they will cease being gods. In the worst case that could even destroy\
        \ them. Notable Attacks/Techniques: *Ether Manipulation: Gods in general have\
        \ some amount of control over Ether, which is how they cast their Auth Spells\
        \ and use their Authority. Ether makes up space itself and also the things\
        \ in it. As such Ether is everywhere, but the large flows of it are referred\
        \ to as ley lines. In order for Ether to make up an object it has to be kept\
        \ in place by a mold, which a god can likewise control. Without that, the\
        \ object would immediately dissolve. A mold of a large terrain is called a\
        \ phase. Molds and phases are often linked to being the information and data\
        \ making up an object. Ether isn't simply a fundamental substance either.\
        \ Ether actually makes up the laws of nature as well, being on a higher levelShort:\
        \ On a Godless Planet - Ether and Ley Lines. The usual laws of nature are\
        \ simply like an operating system running on the ley lines and gods can use\
        \ their Auth Spells and Authority to overwrite that. As such they are, for\
        \ example, able to create water that doesn't vaporize at 300\xB0C and that\
        \ is just a basic task. Phases and molds are so fundamental, that the fact\
        \ that a human can make a comparison to something else when viewing something\
        \ is proof of it having a mold or phase. Ether was added to the world when\
        \ the concepts of different worlds were added to the universe. Of particular\
        \ relevance was the concept of contradiction allowance, as that turned the\
        \ world into one in which anything is possible. *Revelation Board: A useful\
        \ screen, which a god can manifest at any time. It allows them to communicate\
        \ each other without using words, look certain things up similar as to how\
        \ one would on the internet and check on the status of their human partners\
        \ within certain limits. *Divine Rank: Every god has a Divine Rank. The Divine\
        \ Rank roughly equates to the power of a god, although various factors play\
        \ into that which causes exceptions to exist. Divine Rank weakens the effects\
        \ of Ether based effects on gods, which are all attacks as Ether composes\
        \ everything. While Divine Rank can't negate Auth Spells and Authorities,\
        \ as these can't be negated, it can weaken them to the point of their effect\
        \ being insignificant. However, Divine Rank only protects the god itself.\
        \ If a god, for example, can't life in a vacuum, then another god could still\
        \ kill them by turning their surroundings into that. Some factors that play\
        \ into divine rank are size of the sovereignty they can control with their\
        \ authorities, the number of worshipers and their historical rank.On a Godless\
        \ Planet: Planet Crafting with Senpai and Me (1-B) If two gods have vastly\
        \ different divine rank, the stronger god can control the weaker god should\
        \ a connection between them be established. Such a connection could be created\
        \ if they as much as engage in conversation with each other.On a Godless Planet:\
        \ Splashy Fun with Senpai and Me (2-A) **Historical Rank: The historical rank\
        \ quantifies how old a mythology is. Generally, an older mythology will have\
        \ an advantage against a newer one, as the newer one usually to some extent\
        \ is a derivative from the older one. This shows in the form of a temporary\
        \ increase in Divine Rank for those with the higher Historical Rank and with\
        \ that an increase in power. Two generations difference has shown to be enough\
        \ to advance from Country Rank to Region Rank. The generation are as follows.\
        \ 0th Generation: Mythology created with the Solar System; 1st Generation:\
        \ Mythology created with the Planet; 2nd Generation: The mythology of all\
        \ living creatures when the came to be on the planet; 3rd Generation: The\
        \ first mythologies of humanity (Pangaea Mythology); 4th Generation: Laurasian\
        \ Mythologies, Gondwanan Mythologies and Out of Africa Mythologies; 5th Generation:\
        \ The first mythologies with written records, such as 'He who Saw the Deep';\
        \ 6th Generation: A lost generation. Humans simplified and specialized the\
        \ gods; 7th Generation: Norse Mythology etc.; 10th or later: Shinto. *Combat\
        \ Barrier: Gods can create combat barriers, which virtualize what is inside\
        \ of them. The purpose of this barriers is to keep the damage of their battle\
        \ confined to the area enclosed by them and to make it possible to reset all\
        \ damage done to the area and fighters after the battle is over. More specifically,\
        \ it is made so that the damage never happened by reverting the Ether to its\
        \ prior form. *Nature Support: Gods get supported by the local gods and spirits\
        \ embodying the nature around them, provided the nature is aligned to them.\
        \ As such, Shinto gods or those allied with them would be able to do things\
        \ like walk on water or have pillars of earth grow from rivers to allow them\
        \ to pass over without losing their step. Likewise, they might hinder opponents\
        \ by worsening their footing. *Blessing: As a god, she can grant divine protection\
        \ to her believers. These divine protection do not only increase t"
