- id: claim-powers-and-abilities-db789c9c
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Immortality (Types 1, 2 [Able to function
    unimpeded after receiving injuries as severe as being impaled through the skull
    and torso], 4, 7, and 8 [Reliant on the Undead Curse and will constantly revive
    when killed so long as it persists]) *Resurrection (So long as Beatrice remains
    afflicted with the Undead Curse, she shall continually resurrect upon death, retaining
    all memories and experiences) *Soul Manipulation/Absorption (Due to nature of
    being undead she can absorb the souls of nearby fallen enemies. Projected Sorcery
    draws power from the user''s soul) *Empowerment/Statistics Amplification (Undead
    are passively empowered by the strength of their souls, and are able to amplify
    their strength through larger and larger amounts of Souls, though they cannot
    do so in combat) *Limited Dimensional Travel/Time Travel/Teleportation (Able to
    travel to different points of the world through his White Sign Soapstone summon
    sign) *Healing (Low-Mid, Estus Flasks can instantly heal the user from wounds
    as severe as being impaled through the torso or having their skull pierced) *Damage
    Reduction (All weapons and shields grant a small, varying amount of damage reduction
    against physical, magic, fire, and lightning damage) *Statistics Amplification/Damage
    Reduction (All Armor grants the wearer varying degrees of increased physical durability
    and varying degrees of damage reduction against blunt and bladed/piercing attacks)*Limited
    Dimensional Travel/Time Travel/Teleportation (Able to travel to different points
    of the world through his White Sign Soapstone summon sign) *Magic *Energy Projection
    (Via Great Heavy Soul Arrow and Homing Soulmass) *Homing Attack (Via Homing Soulmass)
    *Poison Manipulation/Disease Manipulation (Possesses an innate resistance to both
    Poison and Toxic which is further bolstered by her armor) *Fire Manipulation,
    Temperature Manipulation, Magma Manipulation, Explosion Manipulation (Possesses
    an innate resistance to fire damage which is further bolstered by her armor) *Electricity
    Manipulation (Possesses an innate resistance to electricity [Lightning] which
    is further bolstered by her armor) *Magic (Possesses an innate resistance to Magic
    damage which is further bolstered by her armor)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
