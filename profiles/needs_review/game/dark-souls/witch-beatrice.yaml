- id: claim-standard-equipment-969c69d1
  section: equipment
  axis: equipment
  text: '*Beatrice''s Catalyst: Catalyst belonging to Beatrice, the rogue witch. Contrasts
    with Vinheim catalysts. This ancient catalyst shows signs of being used for age-old
    sorceries. It has passed the hands of many generations to get here. *Cracked Round
    Shield: Round wooden shield. Cracked and nearly broken. Wood shields are lighter
    than metal shields, but this one has lower physical damage reduction stability,
    partly due to cracking. *Witch Set: Cloak of the rogue witch Beatrice. Almost
    all magic users that employ catalysts studied at Dragon School, but Beatrice is
    one of the few exceptions. She braved the Abyss but did not live to tell of her
    ordeal. *Estus Flask: The Undead treasure these dull green flasks. Fill with Estus
    at bonfire. Fills HP. The Estus Flasks are linked to the Fire Keepers. The Dark
    Tales also make reference: An emerald flask, from the Keeper''s soul. She lives
    to protect the flame, and dies to protect it further. *White Sign Soapstone: Leave
    summon sign. Be summoned to another world as a phantom through your sign, and
    defeat the area boss to acquire humanity. In Lordran, the flow of time is distorted,
    and the White Sign Soapstone allows Undead to assist one another. |}'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-1f4dd39b
  section: power_scale
  axis: battle_iq
  text: Gifted (Beatrice is implied to be a natural talent in the field of sorcery.
    As one of the few known sorcerers who was entirely self-taught and did not attend
    the Vinheim Dragon School she demonstrates magic skill on par with Vinheim scholars
    in terms of intelligence, which is further supported by her capacity to use moderately
    advanced offensive spells such as Homing Soulmass and Great Heavy Soul Arrow)
  source_ids: *id003
