      value: "Suffers from the lingering pains of an old woundFatal Fury: City of\
        \ the Wolves - Episodes of South Town: Nightmare Geese dealt to him in the\
        \ past, as a sudden seizure prevented him from launchingReal Bout Fatal Fury\
        \ the Raging Storm meant to counterattack Terry's Power Geyser. Had been careless\
        \ during his first fight with Terry. Fighting Style: Geese practices a unique\
        \ fighting style he developed, combining every knowledge he acquired over\
        \ the years. In their youth Geese and Jeff Bogard were taught the art of Hakkyokuseiken\
        \ (\"Eight Extremes Holy Fist\") by Tung Fue RueFatal Fury Special - Game\
        \ Manual, a style that seems to borrow from chinese martial arts, with the\
        \ addition of unique techniques and the ability to control the flow of Ki.\
        \ At some point in his life, Geese also trained under Blue Mary's grandfather,\
        \ Fatal Fury 3 - Game Manual who taughtFatal Fury 15th Anniversary Website\
        \ him Ko-ry\u016B styles (\"Old School\"/\"Ancient Martial Arts\").A freelance\
        \ agent who goes to South Town when she's commissioned to investigate the\
        \ Jin scrolls. Her father is the one who taught Geese the ancient arts. A\
        \ master of the unique arts of Combat Sambo, she corners her opponents with\
        \ dance-like movements... Few know of Mary's full name. She's a freelance\
        \ agent. She stands her ground in a field dominated by harshness and coldness.\
        \ Mary's past, feelings and memories are blue colored, but not a word about\
        \ it is spoken by her. Mary surely still thinks about that day... the day\
        \ she lost who she loved. How many tears would it take to leave something\
        \ like that behind and only look to the future? But reality is harsh: one\
        \ can't live if they get lost in what they feel. So, Mary herself doesn't\
        \ allow herself to live chained to past. The strictness professionals have\
        \ is evident in her just by looking. Even at times her life is at peril, she\
        \ doesn't flinch... that's how the father she lost had taught her to live.\
        \ The presence of her strict father and kind lover, along the love they gave\
        \ her, protect Mary in her journey, and in that she finds support in her daily\
        \ life. The pride she has in them, and her pride as an agent... embracing\
        \ her sealed feelings in her chest, Mary gives it her all. Mary's full name,\
        \ few know. But there's no need to know it. What one may want to know is how\
        \ to deal with the great skill she's known for, how to evade or counter her\
        \ moves, Geese managed to learn and master all kinds of martial arts, he utilizes\
        \ many techniques resembling Aikido, based on predicting the opponent's attacks\
        \ and reversing them via different types of counters and throws. Ruthless\
        \ and prideful, Geese fights to destroy his opponent at any cost, and will\
        \ gladly use underhanded tactics and everything necessary to snatch the victory."
