        About Fatal Fury 3Martial Arts: Kobujutsu (ancient martial arts) Nationality:
        American Occupation: Head of Howard Connection Birthday: 21st January 1953
        (42 years old) Height: 183cm (6ft) Weight: 82kg (13 stone, 1 pound) Blood
        Type: B Hobbies: Unspecified ([meticulous] but easily bored) Favourite Food:
