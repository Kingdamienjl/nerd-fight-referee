        fragments of memory may come to his mind in certain situations, but they inevitably
        fade away, even though they seemingly stir something inside him, directing
        his actions accordingly to what they meant to him, in attempt of guiding him
        towards his last destination. This shadow seemingly acquired free will only
        in his final moments, after the fateful confrontation with his son, which
