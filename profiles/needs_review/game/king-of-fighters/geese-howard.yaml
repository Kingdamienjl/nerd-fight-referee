      value: 'Base= Genius (A cunning crime lord and master martial artist. Geese''s
        rise to power quickly excalated until he became the undisputed ruler of South
        Town, with every criminal activity and public institution under his jurisdiction.
        His management was so tight and effective that South Town plunged into chaosAll
        About Fatal Fury 3Martial Arts: Kobujutsu (ancient martial arts) Nationality:
        American Occupation: Head of Howard Connection Birthday: 21st January 1953
        (42 years old) Height: 183cm (6ft) Weight: 82kg (13 stone, 1 pound) Blood
        Type: B Hobbies: Unspecified ([meticulous] but easily bored) Favourite Food:
        Steak (Rare) Dislikes: Nuisances who get in the way of his ambitions Things
        he considers important: Himself Sport he specialises in: None (if you count
        sports he''s strong at, billiards) Favourite Music: Godfather. Theme of love
        Special Skill: Resolving everything by force. Defeated by the Bogard brothers,
        Geese decides to return to Southtown and start over from Geese Tower. First,
        he must clean up the outlaws that have begun to nest in the city. When realizing
        one''s desires, there are two words that can express it. "Ideal" and "Ambition"...
        The name used changes depending on the course of action those desires point
        towards. Geese Howard... To those who desire a tranquil life, the name is
        one of infamy. Money, Drugs, Political Power, Murder. He used every means
        available, balking at nothing. Geese rose up in the world, and finally took
        hold of Southtown. Those acts were more than enough to call him a despicable
        villain. But with Geese gone, the reality of the city ironically shows just
        how enormous his power was. The deterioration in public order has people afraid,
        the situation has become more chaotic, almost like the city itself was seeking
        a new saviour. And as if to answer that call, Geese, thought to have died
        at the hands of the Bogard brothers, has returned after biding his time. Looking
        down at the city from a room on the top floor of the building that bears his
        name, Geese takes a step towards his new ambition. "This city cannot carry
        on without me" -- Thus Southtown summoned another hero. The true protagonist
        of the "Fatal Fury" series. The man no-one asked for, but the man they absolutely
        need. Every story begins with Geese Howard. Translation by WarpedHaiku and
        jodanj on Reddit after his defeat at the hands of Terry Bogard, and it is
        said that the influence of his half-brother Krauser was the only thingFatal
        Fury 2 - Virtual Console Website preventing him from expanding his control
        on a global scale. After making a sudden return, he managed to re-establish
        his hold on South Town with seemingly little effort. He mastered all martial
        arts stylesFatal Fury - Virtual Console Website, used to be the US champion,
        managed to defeat a genius fighter such as Jeff Bogard and match Ryo Sakazaki,
