    - field: intelligence
      value: Genius (In his youth, Geese Howard honed his martial arts skills in Hakkyoku
        Seiken under Tung Fu Rue, demonstrating considerable talent. During a period
        of training in Japan, he further expanded his knowledge by learning ancient
        martial arts from Blue Mary's grandfatherThe King of Fighters Official Portal
        Website; Character Database. However, Geese's ambitions extended beyond martial
        arts mastery; he sought to dominate "South Town," a city shrouded in darkness.
        To achieve this, he directly confronted and challenged the ruling organization
        of South Town, steadily amassing power. Ultimately, he established the Howard
        Connection, seizing control of South Town through force and wealth. Furthermore,
        his ruthless ascent to power included the elimination of Jeff Bogard, his
        former training partner and a renowned martial artist considered among the
        world's strongest)
      source_id: vsbattles-geese-howard-king-of-fighters
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "None notable. Notable Attacks/Techniques: |-|Unique Attacks= *Raikou\
        \ Mawashi Geri: Geese leaps a bit and then performs a spinning roundhouse\
        \ kick. *Fudou Sakkatsu Uraken: Geese steps forward as he performs a elbow\
        \ smash, which knocks the opponent away. Only used in The King of Fighters\
        \ 2002. *Tendoh Kudaki: Geese steps forward whlist turning and then spreads\
        \ his arms to either side of him, while performing a spnning backhand. Only\
        \ used in The King of Fighters XIV and XV. |-|Throws= *Satsujin Katate Nage:\
        \ Geese grabs the opponent by the neck, lifting them up and then ferociously\
        \ slams their head over his shoulder into the ground. *Ko Satsu Shou: Geese\
        \ grabs the opponent by the neck and then punches them, launching them into\
        \ the air. *Shink\u016B Nage: Geese grabs the opponent and quickly tosses\
        \ them backwards high into the air as he rotates his arms. |-|Special Attacks=\
        \ *Reppuken: Geese slashes his hand upwards, summoning a chi projectile that\
        \ travels along the ground. Alternatively, he creates a close-ranged blade\
        \ of wind in-front of him which cancels any projectile it hits. *Double Reppuken:\
        \ Same as before, but Geese quickly creates two wind blades in succession,\
        \ with a second Reppuken being slightly larger. In some games, Geese will\
        \ first create a stationary energy projectile before quickly performing a\
        \ second Reppuken to send a large chi wave forward which explodes. *Shippuken:\
        \ While in the air, Geese fires a chi-based projectile angled downwards from\
        \ his hands. The move also has a variant called Double Shippuken, which allows\
        \ Geese to launch two fireballs at once. *Explosion Ball: Geese summons a\
        \ energy orb, which floats a bit with an opponent when hit and then strikes\
        \ with a powerful uppercut, causing an explosion which sends the opponent\
        \ flying high into the air. Only used in The King of Fighters Neowave. *Hish\u014D\
        \ Nichirinzan: Geese performs a quick, short-ranged shoulder tackle, then\
        \ leaps into the air and creates a blade of wind by slashing his hand. If\
        \ an opponent gets hit by the tackle, they will be launched into the air and\
        \ get hit by the blade. *Ja'ei Ken: Geese dashes towards the opponent. If\
        \ he hits, he will perform a 3-hit combo which he ends with a palm strike.\
        \ He sometimes ends a combo with a large chi explosion or grabbing the opponent\
        \ and throwing them far behind him instead. *Fudou Ken: Geese delivers a swift\
        \ palm strike to the opponent. If it connects, he'll either follow up by either\
        \ a double palm attack (A), an overhead kick (Un), or a sweeping kick (Ba).\
        \ The attack's purpose is meant to disrupt enemy defenses. Only used in The\
        \ King of Fighters XIV. *J\u014Ddan Atemi Nage: One of Geese's infamous counter\
        \ moves, in which when he's attacked with overhead/high attacks or from the\
        \ air, he grabs the opponent above and then slams them onto the ground behind\
        \ him. *Ch\u016Bdan Atemi Nage: When attacked while performing a stance at\
        \ normal height, Geese grabs the opponent in-front of him and then turns around\
        \ as he slams them, much like his J\u014Ddan Atemi Nage. *Gedan Atemi Nage:\
        \ When attacked while crouching, Geese blocks a low attack and backhands the\
        \ opponent away. *Raimei G\u014Dha Nage: When a opponent is downed, Geese\
        \ grabs them from the ground, lifting them by their neck and then turns around\
        \ while slamming them back onto the ground as a lightning bolt strikes them.\
        \ *Ura Kumogakushi: Geese grabs the opponent and then tosses them behind him,\
        \ setting them up for a combo. |-|Desperation/Super Special Moves= *Raging\
        \ Storm: A powerful chi-based attack where Geese channels his power and creates\
        \ a shockwave around him by slamming his hands onto the ground, forming large\
        \ spikes of chi that heavily damage the opponent in-front of him. A move has\
        \ stronger variants, in which chi spikes has a reddish hue, or replaced with\
        \ light pillars or a hurricane. *Raig\u014D Reppuken: Geese creates a stronger\
        \ Reppuken infused with the power of electricity, that moves along the ground\
        \ and can hit up to 4 times. The MAX variant makes the projectile a bit larger\
        \ and deal more damage. Only used in The King of Fighters XIV. *Asura Whirlwind\
        \ Slam: Geese charges at the opponent while surrounded by chi, before leaping\
        \ up and repeatedly launching waves of chi down at them from above. *Oni Hammon:\
        \ Geese strikes a pose. If the opponent hits him during a pose, Geese will\
        \ grab them by the head and then slams them into the ground, causing a shockwave\
        \ from the resulting force. Only used in The King of Fighters XIV and XV.\
        \ *Deadly Rave: Geese lunges at the opponent. If the lunge hits, he performs\
        \ a quick and strong 7-hit combo, before finishing with an explosive chi/energy\
        \ blast. He has a stronger variant, which becomes a 17-hit combo and a energy\
        \ blast hits 3 times, which also deals much more damage. *Rashomon: One of\
        \ Geese's strongest moves, in which he taunts the opponent before uppercutting\
        \ them into the air. He then swings both arms in opposing directions while\
        \ charging his chi into them. As the opponent falls, he strikes them with\
        \ a two-handed palm s"
