    - field: intelligence
      value: "Gifted |-|Chapter of NESTS Saga (KOF '99 to KOF 2001)= Kula Diamond\
        \ was designed specifically to combat K'The King of Fighters Official Portal\
        \ Website; Character Database, which necessitates combat proficiency equal\
        \ to his abilities. Kula competed as part of the NESTS Team (Foxy, \xC1ngel,\
        \ and K9999) in the KOF 2001 tournament, against other fighters. Furthermore,\
        \ her unique intros to various characters hint at possible confrontations\
        \ with her intended target, K', as well as Maxima, Whip, Vanessa, Foxy, K9999,\
        \ \xC1ngel, and fighters such as Kim Kaphwan, May Lee, Clone Zero, the original\
        \ Zero, and Igniz. |-|Chapter of Ash Saga (KOF 2003 to KOF XIII)= Kula competed\
        \ in the KOF XI and XIII tournaments as K' Team, where she faced several other\
        \ teamsThe King of Fighters XIII Pre-Battle Dialogues; K' Team Vs. Ikari TeamThe\
        \ King of Fighters XIII Pre-Battle Dialogues; K' Team Vs. Japan TeamThe King\
        \ of Fighters XIII Pre-Battle Dialogues; K' Team Vs. Yagami TeamThe King of\
        \ Fighters XIII Pre-Battle Dialogues; K' Team Vs. Women Fighters Team."
