    - field: weaknesses
      value: 'He cannot control flames he did not create. In his Orochi form, his
        ego would collapse, rendering his combat motivation purely to instinctual
        aggression and hatred directed toward Kyo Kusanagi. In KOF XIII, Iori lost
        his flame abilities after Ash stole the Yasakani Jewel, the source of his
        power. However, he regained them by the end of the tournament after Ash disappeared
        from the timeline. Notable Attacks/Techniques: *Yagami Style: Iori specializes
        in this ancient martial art passed down for generations within his clan, it
        consists mainly of fast slashing strikes and grabbing techniques which can
        be imbued with the purple flames inherited by members of the Yagami clan.
        thumb *Pyrokinesis: Due to his Yagami heritage, Iori can control fire. He
        can create a bright purple fire from thin air, create fireballs, deliver punches
        of fire, create pillars of fire and put his own body on fire. His fire also
        has the sacred ability to put enemies in a stasis-like state. He is not immune
        to other types of fire. He cannot control other fires that he didn''t create.
        Iori can also occasionally wield crimson flames due to the presence of the
        former Yasakani clan''s power, although he cannot create them intentionally
        (they appear at random times, usually when Iori is using his sacred ability
        to seal Orochi (as in KOF ''96 and his LDM in KOF 2003). This power was stolen
        by Ash Crimson in The King of Fighters XI; however, Iori regained it in The
        King of Fighters XIII. *Shiki Ya Sakazuki Iori charges up a purple flame in
        his hand which he releases as multiple fire pillars that cause immobilization
        and damage on contact. *Shiki Ya Otome A fierce rush attack that consisting
        of an eight-hit melee combo followed by an explosive headbutt or a slashing
        chokehold. *Riot of the Blood: Thanks to the pact his clan made with Orochi,
        Iori goes into this state whenever Orochi''s presence is strong. While in
        this form, his eyes are dilated, his back is hunched, and his skin adopts
        a shade of violet. He is mostly incoherent, frequently screaming "Kyooo!"
        during fights. He becomes stronger and faster in exchange for his sanity.
