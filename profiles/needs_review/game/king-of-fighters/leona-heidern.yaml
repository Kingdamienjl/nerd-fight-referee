      more skilled and experienced than before, stating that she has improved over
      the years, and strives in continuing to do so. Heidern went on to comment that
      the Silent Soldier had reached a new level and was continuing to learn as she
      fought. Impressively, she has been training to improve her control over the
      Riot of the Blood, visibly lacking the shakiness she once had regarding it,
      and supposedly yielding promising enough results to where Shun'ei sought out
      her advice and receiving training from the Silent Soldier on how to control
      his own power.
