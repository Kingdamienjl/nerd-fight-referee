    - field: intelligence
      value: Gifted |-|Chapter of Orochi Saga (KOF '96 to KOF '97)= The members of
        the Ikari Team were all instructed in a battlefield killing art known as "assassination
        arts" by their commanding officer, HeidernThe King of Fighters Characters;
        KOF '94-97 Complete Collection of All 45 Character Setting MaterialsThe King
        of Fighters Official Portal Website; Character Database. Leona in particular
        underwent military training from a young age, mastering all of Heidern's assassination
        techniques, which she integrates with her energy-based attacks and acrobatics.
        Furthermore, Clark Still deemed her a competent soldier despite only meeting
        for the first timeThe King of Fighters '96 Team Stories; Ikari Team. Her participation
        in two consecutive KOF tournaments provided her with opportunities to engage
        with various highly-skilled combatants. She also should have received standard
        military firearm expertiseThe King of Fighters XIII Team Stories; Ikari Team.
        |-|Chapter of NESTS Saga (KOF '99 to KOF 2001)= More skilled and experienced
        than before. Leona continued her annual participation in KOF from '99 to 2001.
        In the KOF 2001 tournament, her team is one of the potential winners who would
        have eventually confronted the original Zero and eventually the syndicate's
        leader, Igniz. |-|Chapter of Ash Saga (KOF 2003 to KOF XIII)= More skilled
        and experienced than before, to the point where she views the idea of honing
        additional martial arts skills as unnecessary for her own improvement. Terry
        Bogard, Nagase, and Maxima all view her as a fighting machine. Leona continued
        to participate in KOF 2003 and XIII as a member of the Ikari Team, facing
        off against various teamsThe King of Fighters XIII Pre-Battle Dialogues; Ikari
        Team Vs. Japan TeamThe King of Fighters XIII Pre-Battle Dialogues; Ikari Team
        Vs. K' TeamThe King of Fighters XIII Pre-Battle Dialogues; Ikari Team Vs.
        Elisabeth TeamThe King of Fighters XIII Pre-Battle Dialogues; Ikari Team Vs.
        Yagami Team. Alongside her teammates, Leona impressively stands as an official
        winner of the King of Fighters 2003 Tournament. |-|New Chapter (KOF XIV and
        XV)= Once again, Leona has become more skilled and experienced than before,
        stating that she has improved over the years, and strives in continuing to
        do so. Heidern went on to comment that the Silent Soldier had reached a new
        level and was continuing to learn as she fought. Impressively, she has been
        training to improve her control over the Riot of the Blood, visibly lacking
        the shakiness she once had regarding it, and supposedly yielding promising
        enough results to where Shun'ei sought out her advice and receiving training
        from the Silent Soldier on how to control his own power.
      source_id: mediawiki-471140
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Leona loses all sense of control when using the Riot of Blood. However,
        she steadily gains control over this power and uses it to her advantage. She
        initially experiences trauma upon recalling her childhood memories, which
        renders her susceptible to mental dissociation and vulnerability to attacksThe
        King of Fighters ''97 Team Stories; Ikari Team, however, by the conclusion
        of KOF ''97, she eventually overcomes this trauma with the help of her teammates
        and is no longer negatively affected by its recollection. Notable Attacks/Techniques:
        *Earring Bomb: Leona detaches a small bomb from her earring and tossed it
        at her foe. thumb *Baltic Launcher: Leona will create a ball of energy surrounded
        by several energy blades. *Moon Slasher: Leona slashes around herself with
        her hands embedded with energy. *I-Slasher: Leona backflips and throws a crescent-shaped
        projectile at the opponent which returns to her like a boomerang. *Grand Saber:
        Leona rushes to the opponent and slashes him/her with her energy-infused hand.
        *X-Caliber: Leona will perform a cross-chop in mid-air, launching an X-shaped
        energy projectile from her hands. *V-Slasher: Leona slashes her opponent in
        a V-shaped fashion from mid-air, creating an explosion afterward. *Slash Saber:
        Leona dashes to her opponent and slashes them with her energy-infused hands
        from multiple angles at high speed, making the opponent explode when she''s
        done. *Leona Blade: The energy emitting from Leona''s arms will extend into
        a blade and glow red. She then swings it at the opponent, creating an explosion
        upon contact. *Riot of the Blood: Thanks to her part Orochi heritage, Leona
        goes into this state whenever Orochi''s presence is strong. While in this
        form, her eyes are dilated, her skin adopts a darker shade and her hair changes
        into a reddish hue, and often vomits and spits blood. She is mostly incoherent
        and frequently screams. She becomes stronger and faster but loses her sanity.
        Throughout the series, however, she managed to gain steady control over it.
