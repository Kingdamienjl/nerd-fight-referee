      value: Gifted Chapter of Ash Saga (KOF 2003 to KOF XIII)= Ash Crimson is a cunning
        individual who manipulates others to achieve his goals. For years, he played
        the role of a flamboyant, selfish villain who stole the powers of the Sacred
        Treasures (Chizuru Kagura and Iori Yagami) and deceived othersThe King of
        Fighters XI; Kyo & Iori Team Ending, including setting up Shen and Oswald
        to kill each otherThe King of Fighters XI; Hero Team Ending. His true goal
        was to infiltrate the ranks of "Those From the Past" to destroy them and assassinate
        his ancestor, Saiki. In combat, Ash Crimson uses a self-developed style that
        in conjunction with his flame ability, displaying technical and aesthetic
        similarities to the French martial art of SavateThe King of Fighters Official
        Portal Website; Character Database. By the events of KOF XIII, his moveset
        was dramatically expanded to include techniques derived from the absorbed
        powers of the Sacred Treasures, specifically those of Iori and Chizuru.
