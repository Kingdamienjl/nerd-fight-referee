- id: claim-weaknesses-cfa5f833
  section: weaknesses
  axis: weakness
  text: "None notable. Notable Attacks/Techniques: *Thermidor: Ash shoots a fireball\
    \ that moves slowly towards his opponent. *Pluvi\xF4se: Ash does several somersault\
    \ kicks embedded with his flames. *Sans-culotte: Ash's version of Chizuru's sealing\
    \ technique, stops people from using any form of special attacks or their powers.\
    \ *Fructidor: Ash grabs his opponent and burns him with the use of Iori's purple\
    \ flames, similar to the technique Iori used to restrain Orochi. *Power Steal:\
    \ Ash can rob people of their powers and add them to his own. *Fiery Zone: Evil\
    \ Ash can fill the area around him with damaging dark fire. Note: Evil Ash is\
    \ a form acquired after he steals Saiki's powers, the main differences between\
    \ this and his previous state are the fact that he is surrounded by a visible\
    \ dark aura, his flames are now black instead of green and his consciousness is\
