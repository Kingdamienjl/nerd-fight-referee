    - field: intelligence
      value: Gifted Prologue Chapter to Chapter of NESTS Saga (KOF '94 to KOF 2001)=
        Athena's fighting style combines her psychic abilities and Chinese Kung Fu,
        which she uses in conjunction with her jumping ability and quick movements
        to achieve high mobility. Under the tutelage of Master Chin Gentsai and Sie
        Kensou, Athena underwent training in preparation for a worst-case scenario.
        Their goal was to strengthen their powers in order to save as many people
        as possible while combating evildoers who sought to exploit the KOF tournament
        for their own gain. Their annual participation in tournaments has allowed
        them to gain a variety of experiences from competing against skilled fighters,
        resulting in their steady growth. Athena also demonstrates the ability to
        balance her multiple roles as a high school student, idol, and combatant.
        In KOF '99, Athena was able to fight Whip, who single-handedly defeated the
        Korea Team. Chapter of Ash Saga (KOF 2003 to KOF XIII)= Athena competed in
        KOF 2003 as a High School Girls Team, attempting to face Mukai on her own,
        and in the XI and XIII tournaments as a Psycho Soldier Team, facing several
        opposing teams and reaching the finalsThe King of Fighters XIII Pre-Battle
        Dialogues; Psycho Soldier Team Vs. Japan TeamThe King of Fighters XIII Pre-Battle
        Dialogues; Psycho Soldier Team Vs. Elisabeth TeamThe King of Fighters XIII
        Pre-Battle Dialogues; Psycho Soldier Team Vs. Women Fighters TeamThe King
        of Fighters XIII Pre-Battle Dialogues; Psycho Soldier Team Vs. Women Fighters
        TeamThe King of Fighters XIII Pre-Battle Dialogues; Psycho Soldier Team Vs.
        Kim Team.
