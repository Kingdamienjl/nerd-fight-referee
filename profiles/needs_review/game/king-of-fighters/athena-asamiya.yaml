    - field: weaknesses
      value: 'Athena is generally kind-hearted and won''t go all out against an opponent
        she sympathises with Notable Attacks/Techniques: * Kung Fu: The fighting style
        Athena uses to help her master and control her Psycho Power is Chinese Kung
        Fu that was taught to her by her master Chin Gentsai. Athena uses her Kung
        Fu to deliver fast and surprising strikes, using her Psycho Power to damage
        an opponent while her martial arts is used to catch an opponent off guard
        or they break their guard. :* Psycho Power: Due to being a descendant of the
        Goddess Athena, Athena Asamiya is able to use a psionic power known as Psycho
        Power. Psycho Power allows Athena to create and control psionic energy, either
        by shooting it out, teleporting around the area, creating a blade, duplicating
        herself, creating portals, changing her appearance or by transforming into
        the Goddess Athena herself. ::* MAX Mode: MAX Mode is a power-up all fighters
        can access. In exchange for their Super Meter depleting quickly over time,
        the fighter gets enhanced strength and durability for a limited amount of
        time as well as access to enhanced versions of their strongest techniques
        and the ability to use their strongest technique. Once their Super Meter is
        empty, MAX Mode will end. :::* Extra Mode: Extra Mode is an advanced version
        of MAX Mode where after it runs out, all of the advantages gained from using
        MAX Mode are kept for the rest of the fight. ::* Armour Mode: Armour Mode
        is a power-up all fighters can access. In exchange for their Super Metre depleting
        quickly over time, the fighter gets greatly enhanced durability. Once their
        Super Meter is empty, Armour Mode will end. ::* Counter Mode: Counter Mode
        is a power-up all fighters can access. In exchange for their Super Meter depleting
        quickly over time, the fighter gets enhanced strength as well as the ability
        to use Guard Cancels and Guard Escapes as much as they want. Once their Super
        Meter is empty, Counter Mode will end. ::* Critical Counter Mode: Critical
        Counter Mode is a power-up all fighters can access. When a fighter has filled
        out their Critical Counter gauge and lands a counter with a heavy attack,
        they will enter Critical Counter Mode. In Critical Counter Mode, the fighter
        is able to string together attacks and techniques better making them a better
        fighter, when Critical Counter Mode is nearly over, the fighter can choose
        to end it with an enhanced version of their strongest move. Once the Critical
        Counter gauge is empty, Critical Counter Mode will end. ::* Hyperdrive Mode:
        Hyperdrive Mode is a power-up all fighters can access. In exchange for their
        Super Meter depleting quickly over time, the fighter gets the ability to cancel
        every one of their moves and techniques, allowing them to combo all of their
        moves and techniques together better. Once their Super Meter is empty, Hyperdrive
        Mode will end. Psychic Throw.gif|Psychic Throw Psychic Shoot.gif|Psychic Shoot
        Bit Throw.gif|Bit Throw Psychic Attack.gif|Psychic'
