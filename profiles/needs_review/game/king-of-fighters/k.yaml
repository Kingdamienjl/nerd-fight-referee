      value: 'K'' is short-tempered and would often lack the motivation to fight.
        Notable Attacks/Techniques: *Ein Trigger: K will create a burst of fire right
        on the spot. *Second Shoot: K will launch the fire he created at his foes.
        *Second Shell: K will deliver a rising kick embedded with fire. *Blackout:
        Warps behind the opponent. *Crow Bite: K delivers a rising flaming uppercut
        to send his opponent into the air. He occasionally follows it with a kick
        that slams his opponent down to the floor. *Minute Spike: K'' will leap forward
        into his opponent with a kick. *Heat Drive: K'' dashes at high speed with
