      value: Gifted Chapter of NESTS Saga (KOF '99 to KOF 2001)= Upon his introduction
        to the Hero Team, K' immediately demonstrated his formidable combat proficiency
        by defeating Benimaru Nikaido, a veteran and highly skilled fighter. He later
        encountered a clone of Kyo Kusanagi and easily overpowered him after discerning
        that the opponent was an imposter and deciding to fight seriously. K's mission
        culminated in a victory at the KOF '99 tournament with his team, after which
        he was then faced with Krizalid, an NESTS executive who had absorbed the battle
        data from the tournament directly into his bodyThe King of Fighters Official
        Portal Website; Character Database. K' continued his participation in the
        KOF 2000 and 2001 tournaments, facing numerous other fighters while actively
        hunting down the NESTS cartelThe King of Fighters 2001 Team Stories; Hero
        Team. During his campaign, he fought Clone ZeroThe King of Fighters 2000;
        Hero Team Ending, followed by the original Zero, whose power far surpassed
        that of his clone. At the climax of KOF 2001, he faced Igniz in a final confrontation,
        a mastermind whose ultimate objective was to defeat the world's strongest
        fighters to become a god. Chapter of Ash Saga (KOF 2003 to KOF XIII)= K' competed
        in the KOF 2003 to XIII tournaments as K' Team, where he faced several other
        teamsThe King of Fighters XIII Pre-Battle Dialogues; K' Team Vs. Ikari TeamThe
