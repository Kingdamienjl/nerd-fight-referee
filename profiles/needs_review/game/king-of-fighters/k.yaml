- id: claim-weaknesses-d15cc45e
  section: weaknesses
  axis: weakness
  text: 'K'' is short-tempered and would often lack the motivation to fight. Notable
    Attacks/Techniques: *Ein Trigger: K will create a burst of fire right on the spot.
    *Second Shoot: K will launch the fire he created at his foes. *Second Shell: K
    will deliver a rising kick embedded with fire. *Blackout: Warps behind the opponent.
    *Crow Bite: K delivers a rising flaming uppercut to send his opponent into the
    air. He occasionally follows it with a kick that slams his opponent down to the
    floor. *Minute Spike: K'' will leap forward into his opponent with a kick. *Heat
    Drive: K'' dashes at high speed with a flaming punch. *Chain Drive: K'' cloaks
    his sunglasses with fire and throws it at the opponent. Once it hits, he immediately
    warps in front of his opponents while elbow-checking him/her and putting his glasses
    back very quickly before unleashing a devastating combo on them. *Hyper Chain
    Drive: K'' places his fist into the ground and creates a massive pillar of fire
    around him. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
