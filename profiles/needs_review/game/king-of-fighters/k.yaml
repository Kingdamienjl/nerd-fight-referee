        own created martial arts based around pure violence and combined it with Jeet
        Kune Do), Weapon Mastery (Is able to use his sunglasses as an effective weapon),
        Self-Sustenance (Type 1, Scales to Kula Diamond who was able to survive in
        space with no issue), Chi Manipulation, Explosion Manipulation, Fire Manipulation
        (K' is able to produce flames from his body), Sealing, Soul Manipulation,
        Purification (It has been stated throughout the series that K' has a copy
        of the Sacred Kusanagi Flames which have the ability to seal away beings like
        Orochi and purify souls), Teleportation (With Blackout, K' is able to teleport
        around the area with ease), Instinctive Reactions (Has been stated by NESTS
        himself that K' had his memories taken so he could fight without thinking),
        Non-Physical Interaction (Is able to interact with Vice and Mature who are
        ghostly spectres, Can physical mold his flames with his bare hands), Statistics
        Amplification (With MAX Mode, K' can increase his attack power and his durability),
        Resistance to Heat Manipulation, Magma Manipulation, Ice Manipulation (Is
        unaffected by Kula Diamond's ice powers which can instantly freeze the area
        around her when activated despite Kula being specifically designed to kill
        K' and is unaffected by the extreme heat from Orochi Yashiro's magma filled
        arena), Fire Manipulation (Is barely effected by powerful fire attacks from
        the likes of Mai Shiranui, Kyo Kusanagi, Iori Yagami and Krizalid), Electricity
        Manipulation (Can shake of electricity based attacks from the likes of Benimaru
        Nikaido and Blue Mary), Soul Manipulation (Can survive Orochi and Zero ripping
        out and destroying his soul), Time Stop (Can fight Saiki in stopped time),
        Space-Time Manipulation, Reality Warping (Was unaffected by Saiki warping
        Space and Time), Biological Manipulation (Can survive being hit by Saiki who
        can instantly kill someone and rot their corpse by touching someone), Power
        Nullification (Can negate the effects of Ash Crimson's ability sealing technique),
        Gravity Manipulation, Black Hole Generation (Can survive being sealed into
        a black hole by Zero One), Petrification (Can return to normal after being
        turned to stone by Mukai), Matter Manipulation (Can take hits from Igniz who
        can casually turn someone into dust just by putting his hand on them), Analytical
        Prediction (Maxima has stated that the fighters in the King of Fighters tournament
        never behave the way his analytical data suggests they will), Law Manipulation,
        Logic Manipulation (Was unaffected by Otoma=Raga's attacks that can twist
        the laws of reason of the world)
