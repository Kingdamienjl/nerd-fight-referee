    - field: weaknesses
      value: 'K'' is generally short-tempered and lacks the motivation to fight under
        most circumstances, Ks control over his fire is a lot more limited than Kyo
        or Iori''s control over their fire Notable Attacks/Techniques: * Pure Violence:
        K fighting style is one of pure violence where K'' fights based purely on
        his instincts that he honed during his time at NESTS, allowing him to be acrobatic
        and have fakeouts moves to keep his opponent on their guard while K'' keeps
        up his aggressive tactics. Later K'' would combine his violence with Jeet
        Kune Do so he can adapt to others fighting styles better than he could before.
        K'' is also able to teleport due to this martial arts, this teleportation
        has been depicted both as moving faster than the eye can track and actual
        teleportation across the series and in other mediums and adaptations. :* Pyrokinesis:
        Due to K'' having Kyo Kusanagi''s DNA, he is able to produce flames from his
        body. While K'' doesn''t have as much control over his flames as Kyo can with
        K'' only being able to make a small wave of fire from his hand, K'' is able
        to use his flames in unique ways such as hitting the flames he makes with
        his arms and legs to varying effects such as making a wave, setting his arm
        on fire by punching it or making it into a fireball by kicking it towards
        the opponent. When pushed to his limit, K'' is able to make large explosions
        when he comes into contact with the opponent or makes a large pillar of fire
        by pressing his hand against the ground. Seemingly K'' can only make fire
        appear from his right hand, whether this is a limitation or a preference for
        K'' is unknown. It has been mentioned throughout the series that K'' pyrokinesis
        is a "Spare Sacred Treasure" meaning that it is very possible that K'' has
        the ability to seal away opponents like Orochi and purify souls like Kyo can.
        :* MAX Mode: MAX Mode is a power-up all fighters can access. In exchange for
        their Super Meter depleting quickly over time, the fighter gets enhanced strength
        and durability for a limited amount of time as well as access to enhanced
        versions of their strongest techniques and the ability to use their strongest
        technique. Once their Super Meter is empty, MAX Mode will end. ::* Extra Mode:
        Extra Mode is an advanced version of MAX Mode where after it runs out, all
        of the advantages gained from using MAX Mode are kept for the rest of the
        fight. :* Armour Mode: Armour Mode is a power-up all fighters can access.
        In exchange for their Super Metre depleting quickly over time, the fighter
        gets greatly enhanced durability. Once their Super Meter is empty, Armour
        Mode will end. :* Counter Mode: Counter Mode is a power-up all fighters can
        access. In exchange for their Super Meter depleting quickly over time, the
        fighter gets enhanced strength as well as the ability to use Guard Cancels
        and Guard Escapes as much as they want. Once their Super Meter is empty, Counter
        Mode will end. :* Critical Counter Mode: Critical Counter Mode is a power-up
        all fighters can access. When a fighter has filled out their Critical Counter
        gauge and lands a counter with a heavy attack, they will enter Critical Counter
        Mode. In Critical Counter Mode, the fighter is able to string together attacks
        and techniques better making them a better fighter, when Critical Counter
        Mode is nearly over, the fighter can choose to end it with an enhanced version
        of their strongest move. Once the Critical Counter gauge is empty, Critical
        Counter Mode will end. :* Hyperdrive Mode: Hyperdrive Mode is a power-up all
