        \ arts style that was originally used to seal away Orochi by the founder of\
        \ the Kusanagi Clan. It was originally a weapons-based fighting style, however,\
        \ over the centuries it shifted to focus on martial arts which would use the\
        \ Kusanagi Flames to enhance the user's abilities. Later on in life, Kyo would\
        \ put his own spin on the Kusanagi-ry\u016B Kobujutsu by incorporating Chinese\
        \ Kenpo into the style. One of the major downsides to the fighting style is\
        \ that those who use it may fall off into a darker path, becoming more violent\
        \ much like those affected by the Riot of the Blood. Kusanagi Flames.gif|Kyo\
        \ is able to freely produce Kyo flamethrower.gif|Kyo is able to launch his\
        \ projectiles out as a weapon Kyo on fire.gif|Kyo's flames can engulf his\
        \ entire body and cause him no harm * Kusanagi Flames: As a member of the\
        \ Kusanagi Clan, Kyo is able to produce the Sacred Kusanagi Flames from his\
        \ body. :* Flame Generation: From any part of Kyo's body, he can make a scorching\
        \ hot flame appear, whether they be a small flame the size of his finger,\
        \ a flame that fits in the palm of his hand, an explosive flame the size of\
        \ a person, a massive flaming tornado or a giant pillar of flames that reach\
        \ up to the clouds. These flames are hot enough that extreme cold and fast\
        \ winds can easily put them out. :* Flame Projection: Kyo is able to shoot\
        \ out his flames a distance much further than he could ever reach. Typically,\
