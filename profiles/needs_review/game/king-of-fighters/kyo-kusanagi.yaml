  intelligence:
    text: Gifted Prologue Chapter to Chapter of Orochi Saga (KOF '94 to KOF '97)=
      Kyo was trained and mastered in the "art of fire manipulation," a martial art
      passed down through generations of his family by his father at a young age,
      and is said to have innate fighting abilitiesVideo Game Magazine GAMEST MOOK
      Vol.2 - The King of Fighters '94The King of Fighters Official Portal Website;
      Character Database. By the age of 15, he was said to have surpassed his father,
      demonstrating his extraordinary talent; then, at the age of 18, he won the All-Japan
      Mixed Martial Arts Tournament, defeating Benimaru Nikaido and Goro Daimon, both
      skilled martial artists. A year later, his team won the The King of Fighters
      '94 tournament and defeated Rugal Bernstein, who mastered all fighting styles
      and has defeated numerous KOF champions before them. From 95 to 97, he regularly
      participated in the KOF tournament as Team Hero, fighting against other fighters
      and the threats of the Orochi clan. Chapter of NESTS Saga (KOF '99 to KOF 2001)=
      Quickly deduce that he was being used as a template for cloning based on the
      nature of his interrogation and a room filled with numerous corpses of himselfThe
      King of Fighters '99 Team Stories; Kyo Kusanagi. He continued his participation
      in the KOF tournaments from '99 to 2001, where he was one of the potential fighters
      who would fight Clone Zero, followed by the original Zero, and ultimately Igniz.
      Chapter of Ash Saga (KOF 2003 to KOF XIII)= After being defeated by Orochi Iori
      in KOF XI, Kyo resolved to hone his skills in order to overcome the defeat and
      grow stronger. Despite being caught off guard, he dodged Shroom's attack and
      even made an extremely accurate counterattack that would have killed Shroom
      if he was serious. Kyo and Iori are regarded as world-class fightersThe King
      of Fighters 2003 Team Stories; Benimaru Team New Chapter (KOF XIV and XV)= His
      team is implied to be the winner of the KOF XIV tournament, which means they
      would have defeated Antonov and Verse.
    source_ids:
    - vsbattles-kyo-kusanagi-king-of-fighters
    confidence: 0.6
    notes: auto_repair source extraction
