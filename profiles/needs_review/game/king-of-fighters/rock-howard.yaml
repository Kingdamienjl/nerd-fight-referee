        deadly projectiles. Geese can make projectiles such as energy waves that travel
        across the floor, pillars of energy that come out of the ground, surround
        his fist with energy which can explode to increase the power of his strikes
        and to fire off a powerful beam. :, Chi Absorption: Because of his training
        in Hakkyokuseiken, Rock is able to absorb chi from the Earth around him, using
        it as fuel for his chi techniques or to power himself up. ::, Chi Projection:
        Rock is able to use the chi he absorbs as fiery projectiles that travel across
        the floor, as harmful energy that surrounds Rock''s fists or as a projectile
        that Rock can shoot out from his hands. :::, MAX Mode: MAX Mode is a power-up
        all fighters can access. In exchange for their Super Meter depleting quickly
        over time, the fighter gets enhanced strength and durability for a limited
        amount of time as well as access to enhanced versions of their strongest techniques
        and the ability to use their strongest technique. Once their Super Meter is
        empty, Extra Mode: Extra Mode is an advanced version of MAX Mode where after
        it runs out, all of the advantages gained from using MAX Mode are kept for
        the rest of the fight. :::, Armour Mode: Armour Mode is a power-up all fighters
        can access. In exchange for their Super Metre depleting quickly over time,
        the fighter gets greatly enhanced durability. Once their Super Meter is empty,
        Counter Mode: Counter Mode is a power-up all fighters can access. In exchange
        for their Super Meter depleting quickly over time, the fighter gets enhanced
        strength as well as the ability to use Guard Cancels and Guard Escapes as
        much as they want. Once their Super Meter is empty, Critical Counter Mode:
        Critical Counter Mode is a power-up all fighters can access. When a fighter
        has filled out their Critical Counter gauge and lands a counter with a heavy
        attack, they will enter Critical Counter Mode. In Critical Counter Mode, the
        fighter is able to string together attacks and techniques better making them
        a better fighter, when Critical Counter Mode is nearly over, the fighter can
        choose to end it with an enhanced version of their strongest move. Once the
        Critical Counter gauge is empty, Hyperdrive Mode: Hyperdrive Mode is a power-up
