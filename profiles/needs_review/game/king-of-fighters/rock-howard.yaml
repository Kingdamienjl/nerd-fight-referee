    - field: weaknesses
      value: 'Crack Counter: A counter move that''s combines Geese and Terry''s fighting
        styles. Rock waits for the opponent to make a move on him, he retaliates with
        an acrobatic kick. The enhanced version adds another flip kick., Hard Edge:
        Rock charges forward and strikes the enemy with his palm while a Chi wing
        appears behind him., Reppuuken: A technique inherited from his father. Rock
        shoots a wave of Chi that travels across the ground. Can perform a double
        version of it., Shinkuu Nage: A technique inherited from his father. Rock
        quickly tosses the enemy behind him. Can be followed up with a blast of Chi.,
        Rage Run: Rock''s version of Terry''s Power Dunk. Rock leaps forward and dunks
        on the enemy with his fist while a pair of wings appear behind his back. Can
        use an alternate version that cancels out the blow and allows him to shift
        behind the opponent., Rising Tackle: A technique inherited from Terry. An
        acrobatic spinning kick., Raging Storm: A technique inherited from his father.
        Rock creates a blast of Chi that surrounds him and hurts those who touch it.
        He has an enhanced version called Evil Raging Storm., Shine Knuckle: Rock''s
        version of the Buster Wolf. Rock charges forward with his fist charged with
        Chi. Can perform an enhanced version that follows the attack up with a quick
        uppercut and a Rage Run or a Rising Tackle.'
