    - field: weaknesses
      value: 'Orochi can be sealed by the three sacred treasures (The Yata Mirror,
        the Yasakani Jewel and the Kusanagi Sword). Even after being freed from the
        seal, Orochi took several years to reincarnateThe King of Fighters XIII Team
        Stories; Ash Crimson. It also needs a catalyst to manifest himself and can
        be stopped before awakening. Notable Attacks/Techniques: Kon-Marukare.gif|Kon/Marukare
        Destroy Souls.gif|Ookami/Oomiwa *Kon/Marukare (Blend/Rounding Reaper): Orochi
        generates holy light that damages any foe. *Ookami/Oomiwa (Great God/Great
        Survey): Orochi glows with pale purple energy and pulls the opponent towards
        itself until Oomiwa wears off. If the enemy gets too close, Orochi will immediately
        stab them with its hand and pull out a piece of their life force, in the form
        of a purple orb. It will then crush the orb, inflicting severe damage as the
        victim is blasted away. *Kaijo/Harae (Cancellation/Exorcism): Orochi casts
        a mote of bluish-white light forward that creates a void rift as it travels.
        *Karankou/Ho no Susori (Fire Orchid Descent/Rinse of Fire): Orochi creates
        a pillar of energy from the ground up and vice-versa. *Elemental/Orochi Empowerment:
        Orochi can grant control of the elements to any of his followers on top of
        superhuman stats, while he can grant use of his powers to humans, the prolonged
        use of his powers without a blood relation to him is fatal, as shown in Rugal
        Bernstein''s case. *Telepathy: Orochi can project thoughts and talk to people
        with his mind. He can freely read the minds of his enemies, with no hindrances.
        *Telekinesis: Orochi can move objects with his mind. *Translocation: Orochi
        can translocate himself. *Teleportation: Orochi can teleport people from a
        different dimension. *Possession: Orochi can fully possess any of his followers.
        *Regeneration: Orochi can regenerate and heal himself. ==Gallery== Full Original
