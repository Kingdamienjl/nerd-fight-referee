    - field: weaknesses
      value: "Can be somewhat ditzy at times. Her cocky attitude during battle will\
        \ often lead to her prolonging the fight (though she has shown that she knows\
        \ when to drop it and get serious). Notable Attacks/Techniques: *Fire Manipulation:\
        \ Mai's main skill. Allows her to generate flames from out of nowhere. Makes\
        \ her resistant to her own fire, but not other people's fire attacks. *Shiranui-Ryuu\
        \ Style: Mai's fighting style. It consists of 18 disciplines: spiritual refinement,\
        \ unarmed combat, sword techniques, stick and staff techniques, spear techniques,\
        \ naginata techniques, kusarigama techniques, throwing weapons techniques,\
        \ pyrotechnics, disguise and impersonation, stealth and entering methods,\
        \ horsemanship, water training, tactics, espionage, escaping and concealment,\
        \ meteorology, and geography. *Hammerspace: Mai can pull out all sorts of\
        \ objects from out of nowhere. She can somehow keep an infinite amount of\
        \ fans in her cleavage. She's capable of pulling out entirely different outfits\
        \ from an umbrella and change into them instantly. *Aerial Control: Mai has\
        \ the ability to temporarily stay airborne and control her movements in the\
        \ air. This allows her to float, glide, change directions in mid-air or gain\
        \ temporary flight. *Bushin: Mai can temporarily project shadow images of\
        \ herself and her weapon. ===Normal Moves=== *Kachousen: Mai launches one\
        \ of her fans at the enemy. Some variations involve the fans being covered\
        \ in flames. *Sui Chou no Mai: Mai launches multiple consecutive fans at the\
        \ enemy. Said fans can be covered in flames. *Ryuenbu: Mai imbues the tail\
        \ of her kimono with flames and strikes the enemy with it. *Hakuro no Mai:\
        \ Mai performs a quick dance move where she strikes the enemy with her fans.\
        \ *Hishou Ryuuenjin: Mai performs a frontflip kick while covering her foot\
        \ with fire. *Hissatsu Shinobi-Bachi: Mai performs a cartwheel kick before\
        \ striking the opponent with her elbow. Has an enhanced version where Mai\
        \ covers her body in flames to deal more damage. *Musasabi no Mai: Mai leaps\
        \ up and dives toward the enemy. *Houou no Mai: Mai leaps into the air and\
        \ performs a spinning move while covered in flames. *Kagerou no Mai: Mai creates\
        \ a spiral of flames around herself. Has an alternate version that creates\
        \ two clones of her made of fire. *Hanaarashi: A spinning melee move where\
        \ Mai strikes the enemy with her fans before rising to the sky. *Sayo Chidori:\
        \ Mai performs a heavy swing with her fans. Can be used to negate projectiles.\
        \ *Burning Mai: Mai unleashes a torrent of flame that sends her opponent flying\
        \ back. *Swallow Saturnalia: Mai performs a flipping blade kick. *Dragon Flame\
        \ Romp: Mai spins through the air, repeatedly striking her opponent with fire-infused\
        \ Kachousen. *Blossom Storm: Mai begins spinning rapidly, producing a miniature\
        \ hurricane. Can only be used in water. *Shiranui-Ryuu Kyuubi no Kitsune:\
        \ Mai pounces on the enemy and blitzes them while covering them in flames.\
        \ Said flames explode in an instant. *Shiranui-Ryuu Kunoichi no Mai: Mai's\
        \ ultimate move. Mai quickly dashes around while producing flames in the shape\
