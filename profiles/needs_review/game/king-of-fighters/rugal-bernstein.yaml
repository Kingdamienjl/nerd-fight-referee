  intelligence:
    text: Genius (Rugal Bernstein's fighting style is a composite of mastery of all
      fighting styles, which he likely assimilates from his defeated opponents. This
      is shown in his winning dialogue against the Art of Fighting Team, which implies
      he would copy Kyokugenryu Karate after defeating them. The KOF '94 tournament
      only served as a ploy to gather the world's strongest fighters, whom he intended
      to defeat and turn into bronze statues. It is said he could single-handedly
      wipe out 100 guerrillas, a claim substantiated by his solo massacre of 50 elite
      members of Heidern's former mercenary unit, an encounter that resulted in Heidern
      losing his eye. Beyond his combat abilities, Rugal is a renowned crime lord
      who controls the black market in arms and drugs, and his involvement in various
      global conflicts has placed him on Interpol's radar. It has also been noted
      that he possesses an effortless proficiency in all sports)
    source_ids:
    - vsbattles-rugal-bernstein-king-of-fighters
