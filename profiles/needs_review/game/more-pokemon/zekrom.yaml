- id: claim-weaknesses-35af6a73
  section: weaknesses
  axis: weakness
  text: "Zekrom is weak Ground, Dragon, Ice and Fairy-type moves. Outrage leaves Zekrom\
    \ confused although it will eventually snap out of it. The Dragon Gem is single-use.\
    \ Notable Attacks/Techniques: *Teravolt: Moves can be used on the target regardless\
    \ of its Abilities. *Fusion Bolt: One of Zekrom's signature moves. Zekrom surrounds\
    \ itself in a giant sphere of light blue electricity and slams into the opponent.\
    \ This move\u2019s power is increased when influenced by Fusion Flare or Blue\
    \ Flare. *Bolt Strike: One of Zekrom's signature moves. Zekrom surrounds itself\
    \ with a great amount of yellow electricity and charges its target. This may also\
    \ leave the target with paralysis. *Thunder: Zekrom fires off a massive bolt of\
    \ electricity from its body. It may also cause paralysis. Its accuracy is increased\
    \ under rain but decreased under sunny conditions. *Charge Beam: Zekrom fires\
    \ off a beam of electricity. It may raise its special attack. *Dragon Breath:\
    \ Zekrom fires off a hazy stream of purple energy from its mouth. It may also\
    \ cause paralysis. *Zen Headbutt: Zekrom focuses some psychic power into an orb\
    \ just above its head and headbutts the opponent. It may also cause them to flinch.\
    \ *Thunder Fang: Zekrom coats its fang with electricity and bites the opponent.\
    \ It may cause paralysis and also cause the opponent to flinch. *Dragon Claw:\
    \ Zekrom coats its claws with energy and then slashes at the opponent with them.\
    \ *Imprison: Using a psychic power, Zekrom creates a seal on itself that prevents\
    \ the opponent from using any moves they share with it. *Hyper Voice: Zekrom lets\
    \ off an extremely loud roar that damages the opponent. It also bypasses moves\
    \ like Substitute. *Crunch: Zekrom coats its fangs in a dark energy and crunches\
    \ the opponent with them. It may also lower their defense. *Thunderbolt: Zekrom\
    \ fires off a bolt of electricity that may paralyze the opponent. *Dragon Rage:\
    \ Zekrom fires off a blue flame of energy that deals consistent damage. *Slash:\
    \ Zekrom slashes at the opponent with its claws. It has a high chance of dealing\
    \ critical damage. *Outrage: Zekrom attacks and rampages for a while. If there\
    \ are multiple opponents each series of attacks will directed to one at random.\
    \ It leaves Zekrom confused afterwards. *Ancient Power: Zekrom manipulates nearby\
    \ rocks with an ancient power and hurls them at the opponent. This may also raise\
    \ all of its stats. *Noble Roar: Zekrom lets out a noble roar which intimidates\
    \ the opponent causing their offenses to drop. *Giga Impact: Zekrom surrounds\
    \ itself with energy and tackles the foe with extreme force. Given that the likes\
    \ of Kyogre and Groudon lack the need to recharge after Hyper Beam, Zekrom may\
    \ very well be capable of the same with this attack. *Light Screen: Zekrom sets\
    \ up a psychic screen around itself and its allies which halves the damage of\
    \ incoming non-physically based attacks. ==Gallery== sample 1c303945v08ce6d0f18f8a99452548c99.jpg|Zekrom\
    \ with N maxresdgefault (1).jpg 1469906818625.gif 453px-644Zekrom-Activated.png\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters\
    \ Category:Game Characters Category:Anime Characters Category:Pok\xE9mon Category:Legendary\
    \ Pok\xE9mon Category:Electricity Users Category:Dragons Category:Flight Users\
    \ Category:Monsters Category:Psychics Category:Telekinesis Users Category:Telepaths\
    \ Category:Weather Users Category:Earth Users Category:Darkness Users Category:Manga\
    \ Characters Category:Sound Users Category:Energy Users Category:Statistics Amplification\
    \ Users Category:Rage Users Category:Status Effect Users Category:Durability Negation\
    \ Users Category:Berserkers Category:Genderless Characters Category:Absorption\
    \ Users Category:Power Nullification Users Category:Resistance Negation Users\
    \ Category:Statistics Reduction Users Category:Breath Attack Users Category:Paralysis\
    \ Users Category:Role-playing Characters Category:Loyal Characters Category:Longevity\
    \ Users Category:Wing Users Category:Bodily Weaponry Users Category:Honorable\
    \ Characters"
  source_ids: *id003
  decisive: false
  status: unverified
