- id: claim-weaknesses-47e65b1f
  section: weaknesses
  axis: weakness
  text: "Ground, Rock, Ghost, Water, and Dark-type attacks Notable Attacks/Techniques:\
    \ ===Ability=== *Victory Star: Victini's energy gives a boost in accuracy to it\
    \ and its allies. ===Moves=== *V-create: One of Victini's signature moves. Victini\
    \ creates a burst of fire on the V-shaped crest on its head and charges the opponent\
    \ at full power, doing devastating damage. This is Victini's strongest move, and\
    \ it doesn't seem to suffer the drawbacks of using it. *Searing Shot: Victini's\
    \ other signature move. Victini launches an inferno of flames that burn anything\
    \ in range. This has a chance to burn. *Fusion Flare: Another of Victini\u2019\
    s signature moves. Victini creates a giant sphere of fire with two flaming rings\
    \ and then fires it at the opponent. Its power is doubled if used immediately\
    \ after Fusion Bolt. *Focus Energy: Victini focuses its energy, which ups its\
    \ chances of dealing critical damage. *Incinerate: Victini shoots a burst of flame\
    \ that damages the opponent and burns up their held item if it is a Berry. *Confusion:\
    \ Victini attacks with a burst of psychokinetic energy that does damage and can\
    \ confuse the opponent. It acts similarly to the move Psychic. *Quick"
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-fc8817b3
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Longevity, Self-Sustenance (Types 2\
    \ and 3), Flight, Fire Manipulation, Invisibility (Uses it to sneak up on othersPok\xE9\
    mon the Movie: Black\u2014Victini and Reshiram), Possible Hellfire Manipulation\
    \ (Via Inferno), Telepathy (Shares its vision with Ash), Supernatural Luck, Passive\
    \ Probability Manipulation (Can be used to boost the power of othersPok\xE9mon\
    \ the Movie: White\u2014Victini and Zekrom), Mind Manipulation, Status Effect\
    \ Inducement (Burns, flinching, and confusion), Weather Manipulation, Passive\
    \ Accuracy Amplification, Aura, Resistance to Fighting, Steel, Fire, Grass, Psychic,\
    \ Ice, and Fairy-type moves, Immunity to burns, Energy Manipulation, Telekinesis,\
    \ Statistics Amplification"
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
