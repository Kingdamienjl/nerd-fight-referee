  name: 'immune to the effects of abilities or attacks that lower its stats. *Sunsteel
    Strike: Solgaleo''s signature move. Solgale'
  description: "immune to the effects of abilities or attacks that lower its stats.\
    \ *Sunsteel Strike: Solgaleo's signature move. Solgaleo envelops itself in energy\
    \ and charges at its opponent, ramming them with the force of a meteor and ignoring\
    \ abilities that would impede or stop its charge. **Searing Sunraze Smash: Solgaleo's\
    \ signature Z-Move. While ignoring the target's Ability, Solgaleo charges at the\
    \ enemy and rolls into a ball with full force after transporting them to Ultra\
    \ Space. *Splash: Solgaleo hops around which does absolutely nothing. *Teleport:\
    \ Solgaleo teleports elsewhere. *Cosmic Power: Solgaleo absorbs a cosmic power\
    \ to boost its defense and special defense. *Wake-Up Slap: Solgaleo slaps the\
    \ opponent with enough force to wake them up. If they were asleep its power is\
    \ doubled. *Metal Claw: Solgaleo coats its claws in metal and slashes at the opponent.\
    \ This may raise Solgaleo's attack. *Iron Head: Solgaleo coats its head in metal,\
    \ presumably iron, and hits the opponent possibly making them flinch. *Metal Sound:\
    \ Solgaleo releases a metallic screeching sound that lowers the opponent's special\
    \ defense. *Zen Headbutt: Solgaleo focuses some psychic energy into its head and\
    \ headbutts the opponent possibly making them flinch. *Flash Cannon: Solgaleo\
    \ fires off a silvery beam of energy that may lower the opponent's special defense.\
    \ *Morning Sun: Using the power of sunlight Solgaleo heals itself. The amount\
    \ of health restored increases under sunny conditions but is decreased under rain,\
    \ hail, sandstorms, and other weather conditions. *Crunch: Solgaleo coats its\
    \ fangs in dark energy and then crunches the opponent with them. It may also lower\
    \ their defense. *Metal Burst: Solgaleo retaliates against the opponent who last\
    \ dealt damage to it with much greater force. *Solar Beam: Solgaleo charges up\
    \ solar energy and fires it off as a beam. It charges more quickly under sunny\
    \ conditions. *Flare Blitz: Solgaleo coats itself with flames and recklessly charges\
    \ the opponent possibly causing a burn. Solgaleo takes recoil damage from this\
    \ move, however. *Noble Roar: Solgaleo roars at the opponent lowering their attack\
    \ and special attack. *Wide Guard: Solgaleo sets up a forcefield that protects\
    \ it and its allies from widespread attacks. *Giga Impact: Solgaleo charges at\
    \ the opponent with destructive force equal to Hyper Beam. Given that the likes\
    \ of Kyogre and Groudon don't need to rest after Hyper Beam, it's likely Solgaleo\
    \ doesn't need to either after Giga Impact. *Fire Spin: Solgaleo surrounds the\
    \ opponent in a spiraling flame that does continuous damage while they are trapped\
    \ in it. *Iron Tail: Solgaleo coats its tail in a metal, presumably iron, and\
    \ strikes the opponent with it. It may lower the target's physical defense. *Wild\
    \ Charge: Solgaleo shrouds itself in electricity and charges the opponent. This\
    \ also deals recoil damage to Solgaleo. ==Gallery== Sample bcebf07bdd0a6486kcb8a84eeb43bf5e9.jpg\
