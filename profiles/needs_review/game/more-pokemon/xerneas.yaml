    - field: weaknesses
      value: 'Steel and Poison Type moves. Fairy Aura''s effects can be reversed if
        a fighter has Aura Break. Notable Attacks/Techniques: *Fairy Aura: Xerneas
        can increase the damage of Fairy Type attacks in battle. *Geomancy: Xerneas''
        signature move. Xerneas charges up sharply increasing its special attack,
        special defense, and speed. It can also be used to restore those who have
        perished to Yveltal''s Oblivion Wing. However it cannot restore them if too
        much time has passed since they perished. *Aurora Beam: Xerneas fires a multicolored
        beam of energy from its antlers. It may lower the opponent''s attack. *Horn
        Leech: Xerneas jabs the opponent with its antlers. This also restores its
        health by half of the damage dealt. *Gravity: Xerneas increases gravity in
        the area forcfully grounding those in the air and preventing them from taking
        off. *Heal Pulse: Xerneas releases a pulse of energy that heals who ever Xerneas
        chooses. *Aromatherapy: Xerneas releases a soothing scent that cures itself
        and its allies of status conditions. *Ingrain: Xerneas roots itself in place
        to gradually restore health over time. *Take Down: Xerneas recklessly charges
        the opponent. This also causes some recoil damage to Xerneas. *Light Screen:
        Xerneas sets up a protective psychic screen around itself and its allies that
        halves the damage of special attacks. *Moonblast: Xerneas draws power from
        the moon into a sphere and fires it at the opponent. It may also lower their
        special attack. *Megahorn: Xerneas harshly stabs its opponents with its antlers.
        *Night Slash: Xerneas coats its antlers with a dark energy and slashes at
        the opponent with the them. It has a high chance of dealing critical damage.
        *Psych Up: Xerneas copies the opponent''s stat changes. *Misty Terrain: Xerneas
        fills the terrain with a mist that protects all those who are grounded from
        status conditions and halves the damage of Dragon Type moves. * Nature Power:
        Xerneas draws power from nature and attacks. Its secondary effects depend
        upon the current environment. *Close Combat: Xerneas throws a barrage of attacks
        the opponent up close. This also lowers Xerneas'' defense and special defense.
        *Giga Impact: Xerneas charges the opponent with immense force. Seeing as its
        counterpart, Yveltal, lacks the need to recharge after Hyper Beam it is possible
        that Xerneas lacks the need to do so itself after using Giga Impact. *Outrage:
        Xerneas attacks and rampages for a while. If there are multiple opponents
        each series of attacks will be directed to one at random. It leaves Xerneas
        confused afterwards. ==Gallery== Ca6a4bbd9c0dd1fb8fe5c465c881b75e.jpg sample_35e0f78175a7f79c57410c64bf2ab962.jpg
