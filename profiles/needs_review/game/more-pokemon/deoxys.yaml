  section: weaknesses
  axis: weakness
  text: 'It is weak to Ghost, Dark, and Bug Type moves. While its different Formes
    raise certain attributes, they also lower other ones, as the Attack Forme lowers
    durability, the Defense Forme lowers attack potency and the Speed Forme lowers
    both attack potency and durability albeit not to the extent the Attack Forme and
    Defense Forme lower their individual attributes; in Normal Forme stats are pretty
    well-balanced. Its brain (the purple crystal in its chest) is exposed. Life Orb
    causes 10% recoil with every successful offensive attack Notable Attacks/Techniques:
    ===Ability=== *Pressure: Deoxys'' power exerts a certain amount of psychological
    pressure on its foes, causing their stamina to wane more quickly. ===Moves===
    *Hyper Beam: Deoxys fires an energy beam of pure destruction at its targets. It
    may have to recharge afterwards. *Psycho Boost: Deoxys''s signature move. Deoxys
    fires an extremely powerful psychic energy sphere at the foe. *Extreme'
