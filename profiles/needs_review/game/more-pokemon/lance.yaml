    - field: intelligence
      value: "Extraordinary Genius. As one of the only Trainers to have ever defeated\
        \ Red in an official battle, Ethan is one of the greatest Trainers known in\
        \ all of Pok\xE9mon. On top of that, he has defeated all 16 Indigo League\
        \ Gym Leaders (one of them being Blue), the Elite Four and current Champion\
        \ Lance, as well as a past version of Giovanni thanks to Celebi\u2019s meddling.\
        \ Even before he fought the Elite Four, he defeated Pryce, who has been training\
        \ Pok\xE9mon for roughly 50 yearsMahogany Town Gym. Casually beats trainers\
        \ who have earned 8 Gym Badges, including Pryce's. He passed the Dragon\u2019\
        s Den challenge with flying colors, meanwhile Clair, a Dragon type Gym Leader\
        \ with mastery comparable to an Elite Four member, was unable to clear it\
        \ at all. According to official art, he has encountered and even caught multiple\
        \ exceptionally rare Shiny Pok\xE9mon (as Gold/Silver were the games to introduce\
        \ them in real life). As an expert Pok\xE9athlete, Ethan can draw out the\
        \ abilities and eternal trust of any Pok\xE9mon he uses flawlessly, having\
        \ done this with dozens of Pok\xE9mon, and making such an impact on the Pok\xE9\
        athlon that the Hall of Fame for Pok\xE9athletes is basically a museum dedicated\
        \ to him, due to having beaten every possible record for all 10 minigames.\
        \ Can win under Pok\xE9mon Swap conditions in the Battle Arcade, where the\
        \ opponent uses Ethan's Pok\xE9mon themselves. Can battle expertly with Pok\xE9\
        mon he's never seen before in the Battle Factory, and win against Thorton's\
        \ team with them. Singlehandedly figured out every single mystery related\
        \ to the Ruins of Alph even when an entire team of scientists were stumped,\
        \ as well as being the one to originally discover Unown ! and Unown ?. Is\
        \ a frequent radio personnel, being able to consistently memorize and repeat\
        \ Buena\u2019s Password of the day. Suicune saw him as a trainer worthy of\
        \ appearing to. Has mastered the game Voltorb Flip, and played it well enough\
        \ to afford all the best prizes."
