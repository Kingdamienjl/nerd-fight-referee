        \ Sycamore, after a bunch of misunderstandings. He's level 38 and his characteristic\
        \ is that he likes to nod off a lot. *Blaze: Salam\xE8's ability. When at\
        \ low health, the power of Salame's fire attacks increase. *Tough Claws: Salam\xE8\
        's ability upon Mega Evolving. The power of Salame's contact moves increase\
        \ by 1.5x. *Ember: Salam\xE8 fires embers at the opponent. *Incinerate: Salam\xE8\
        \ fires a powerful stream of fire at the opponent. Anything the opponent was\
        \ holding gets incinerated. *Flare Blitz: Salam\xE8 ignites itself and launches\
