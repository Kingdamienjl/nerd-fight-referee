    - field: weaknesses
      value: "Normal human weaknesses. Mega Evolving all his Pokemon at once puts\
        \ severe strain on him and he can only focus on the task at hand. | Each Pokemon\
        \ has specific weaknesses. See these profiles for their weaknesses. Notable\
        \ Attacks/Techniques: ===X=== thumb|332px|center *Mega Evolution: With his\
        \ Mega Stone, X is capable of evolving his Pokemon even further. X also has\
        \ a never before seen ability to Mega Evolve all of his team at once (except\
        \ Marisso). This however, puts immense strain on his mind. ===Kanga and Li'l\
        \ Kanga=== |-|Kanga=thumb |-|Li'l Kanga=thumb |-|Mega Kanga and Lil'Kanga=thumb\
        \ A Kangaskhan and her baby. They're X's main Pokemon, and the ones he's known\
        \ the longest, having helped him win the aforementioned tournament. They're\
        \ level 49 and share the characteristic of being very finicky. *Scrappy: Kanga's\
        \ abilility. She has the ability to hit intangible beings with normal moves.\
        \ *Parental Bond: Kanga's and Li'l Kanga's ability upon Mega Evolving. Li'l\
        \ Kanga becomes big enough to fight on his own, and chooses to fight alongside\
        \ its mother. However, his attacks only does half as much as his mother's,\
        \ though the chance of effects doesn't change. *Outrage: The Kangaskhan attack\
        \ in an all out draconic rage for a period of time. After a set period of\
        \ time, they stop using the move and wind up confused. *Mega Punch: Kanga\
        \ punches with extreme force. Only Kanga knows this move. Li'l Kanga can't\
        \ use it. *Thunderbolt: The Kangaskhan launch powerful bolts of lightning\
        \ at the opponent. ===Marisso=== thumb A Chesnaught. This is X's first \"\
        starter\" Pokemon. He receives Marisso as a Chespin from Professor Sycamore\
        \ in an attempt to get him out of his rut. He's level 59 and has the characteristic\
        \ of being pretty stubborn. He's the only one of X's Pokemon that can't Mega\
        \ Evolve. *Overgrow: Marisso's ability. When low on health, Marisso's grass\
        \ attacks gain a boost in power. *Pin Missile: Marisso launches a flurry of\
        \ pins and needles like missiles two to five times in a row. *Rollout: Marisso\
        \ rolls into the opponent repeatedly, with each hit doing more and more damage\
        \ until it misses. *Bite: Marisso bites the opponent with dark energy. This\
        \ attack can cause the opponent to flinch. *Vine Whip: Marisso whips the opponent\
        \ with a vine. *Spiky Shield: Marisso forms a shield with its forearms, which\
        \ blocks damage and hurts those who make physical contact with the shield.\
        \ ===Salam\xE8=== |-|Salam\xE8=thumb |-|Mega Salam\xE8=thumb A Charizard and\
        \ X's third Pokemon overall. He was received as a Charmander, also from Professor\
        \ Sycamore, after a bunch of misunderstandings. He's level 38 and his characteristic\
        \ is that he likes to nod off a lot. *Blaze: Salam\xE8's ability. When at\
        \ low health, the power of Salame's fire attacks increase. *Tough Claws: Salam\xE8\
        's ability upon Mega Evolving. The power of Salame's contact moves increase\
        \ by 1.5x. *Ember: Salam\xE8 fires embers at the opponent. *Incinerate: Salam\xE8\
        \ fires a powerful stream of fire at the opponent. Anything the opponent was\
        \ holding gets incinerated. *Flare Blitz: Salam\xE8 ignites itself and launches\
        \ itself at the opponent in a burning tackle. This attack is so powerful that\
        \ it does recoil damage back at the Charizard. ===\xC9lec=== |-|\xC9lec=thumb\
        \ |-|Mega \xC9lec=thumb A Manectric, and X's fourth Pokemon. Met as an Electrike,\
        \ he was caught after a side adventure to try to get him a Manectricite, his\
        \ species' Mega Stone. He's level 48 and his characteristic is mischievous.\
        \ *Lightningrod: \xC9lec's ability. All electric attacks are drawn to and\
        \ absorbed by \xC9lec, which subsequently raises its special attack. *Intimidate:\
        \ \xC9lec's ability upon Mega Evolution. It passively imbues fear into its\
        \ opponents, which causes the lowering of physical attack of its enemies *Wild\
        \ Charge: \xC9lec charges the opponent covered in electricity to cause severe\
        \ damage. It does so much damage that \xC9lec hurts itself in recoil a little.\
        \ *Discharge:\xC9lec releases a widespread charge of electricity from its\
        \ mane at the target. It has a chance of causing paralysis. *Thunder: \xC9\
        lec drops a wicked bolt of lightning on the opponent. It has a chance of causing\
        \ paralysis. ===Garma=== |-|Garma=thumb |-|Mega Garma=thumb Garma is a Gengar\
        \ received from Gurkin. He's X's fifth Pokemon on his main team. By appealing\
        \ to his showboat nature, X was able to convince him to join his team. Garma\
        \ is level 48 and his characteristic is that he's somewhat of a clown. *Cursed\
        \ Body: Garma's ability. Upon physical contact with Garma, the opponent may\
        \ have the move that hit Garma become disabled and unable to be used. *Shadow\
        \ Tag: Garma's ability upon Mega Evolution. Garma's presence prevents the\
        \ opponent from retreating. *Shadow Punch: Garma sneaks through shadows and\
        \ punches the opponent as a shadow. This move has a really hard time missing.\
        \ *Confuse Ray: Garma releases a light that confuses the opponent. *Dark Pulse:\
