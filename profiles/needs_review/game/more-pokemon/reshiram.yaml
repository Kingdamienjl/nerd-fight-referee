    - field: weaknesses
      value: "Weak to Dragon, Rock, and Ground Type moves. Outrage leaves Reshiram\
        \ confused afterwards although it will eventually snap out of it. Notable\
        \ Attacks/Techniques: * Turboblaze: Moves can be used on the target regardless\
        \ of its Abilities. * Fusion Flare: One of Reshiram's signature moves. Reshiram\
        \ fires off a massive sphere of flames at the opponent. This move\u2019s power\
        \ is increased when influenced by Fusion Bolt or Bolt Strike. Should Reshiram\
        \ be frozen it will be able to thaw out. * Blue Flare: One of Reshiram's signature\
        \ moves. Reshiram fires off a powerful stream of intense, yet beautiful blue\
        \ fire at the opponent. This may also leave the target with a burn. * Flamethrower:\
        \ Reshriam fires off a stream of flames from its mouth. It may also cause\
        \ a burn. * Dragon Claw: Reshiram coats its claws with energy and slashes\
        \ at the opponent with them. * Fire Fang: Reshiram coats its fangs with flames\
        \ and the bites the opponent. It also has a chance of causing a burn and a\
        \ chance of making the opponent flinch * Ancient Power: Reshiram manipulates\
        \ nearby rocks with an ancient power and hurls them at the opponent. It may\
        \ also raise all of its stats. * Imprison: Using some psychic power, Reshiram\
        \ creates a seal on itself that prevents its opponents from using any moves\
        \ that they share with it. * Dragon Rage: Reshiram fires off a blue flame\
        \ that deals consistent damage. * Hyper Voice: Reshiram lets off an extremely\
        \ loud roar that damages the opponent. It also bypasses moves like Substitute.\
        \ * Dragon Breath: Reshiram fires off a hazy purple flame that may paralyze\
        \ the opponent. * Slash: Reshiram slashes at the opponent with its claws.\
        \ It has a high chance of dealing critical damage. * Extrasensory: Reshiram\
        \ attacks with a telekinesis that may make the opponent flinch. Its power\
        \ doubles if the opponent has made themselves smaller such as through Minimize.\
        \ * Dragon Pulse: Reshiram fires off a multicolored beam of dragon-shaped\
        \ energy. * Crunch: Reshiram coats its fangs in a dark energy and then crunches\
        \ the opponent with them. It may also lower their defense. * Outrage: Reshiram\
        \ attacks and rampages for a while. If there are multiple opponents each series\
        \ of attacks will directed to one at random. It leaves Reshiram confused afterwards.\
