- id: claim-powers-and-abilities-790d3c0d
  section: abilities
  axis: hax
  text: "Lugia=Superhuman Physical Characteristics, Large Size (Type 0), Bodily Weaponry\
    \ (Teeth), Telepathy, Flight, Enhanced Senses, Damage Reduction (Via Multiscale),\
    \ Self-Healing (Via Self-Curer and Recover), Limited Accelerated Development (Via\
    \ Exp. Elite), Limited Probability Manipulation (Via Type-Advantage Master and\
    \ Sharpshooter), Telekinesis, Non-Physical Interaction, Status Effect Inducement\
    \ (Via Dragon Rush, Extrasensory, Sky Attack, Ice Beam, and Hurricane), Statistics\
    \ Amplification (Via Max Airstream, Ancient Power, Calm Mind, and Tailwind), Statistics\
    \ Reduction (Via Psychic, Feather Dance, and Defog), Empowerment (Able to empower\
    \ its attacks with energy, and Via Max Mindstorm), Elemental Manipulation, Air\
    \ Manipulation (Via Gust, Whirlwind, Hurricane, Defog, and Tailwind), Earth Manipulation\
    \ (Via Ancient Power and Earthquake), Ice Manipulation (Via Ice Beam), Power Modification\
    \ (Via Weather Ball, Natural Gift, and Skill Swap), Weather Manipulation (Via\
    \ Hurricane, Rain Dance, and Mist), Power Nullification (Via Mist and Defog),\
    \ Forcefield Creation (Via Safeguard), Energy Projection (Via Aeroblast and Hyper\
    \ Beam), Water Manipulation (Via Hydro Pump and Whirlpool), Precognition, Time\
    \ Manipulation (Future Sight allows the user to observe and attack the target\
    \ in the future, bypassing Force fields and Precognition in the process), Homing\
    \ Attack (Via Swift), Reactive Power Level (Via Punishment), Dynamax, Resistance\
    \ to Chi Manipulation, Plant Manipulation, Mind Manipulation, Telekinesis, Telepathy,\
    \ Energy Manipulation, and Sleep Manipulation |-|Shadow Lugia=All previous abilities\
    \ plus Darkness Manipulation, Berserk Mode (All Shadow Pok\xE9mon are in a constant\
    \ berserk state), Damage Boost (Shadow Moves deal double damage to non-Shadow\
    \ Pok\xE9mon), Resistance to Empathic Manipulation (Shadow Pok\xE9mon are created\
    \ by removing their emotions and closing off the doors to their hearts, turning\
    \ them into a soulless fighting machine), Purification (Shadow Lugia is completely\
    \ unaffected by all normal means of purifying Shadow Pok\xE9mon)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
