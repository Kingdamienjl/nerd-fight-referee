        go berserk if sufficiently provoked. Is weak to Electric-type, Rock-type,
        Ghost-type, Dark-type, and Ice-type moves. Notable Attacks/Techniques: *Pressure:
        Lugia exerts a pressure on the opponent which makes them expend twice as much
        energy tiring them out twice as quickly. *Multiscale: So long as Lugia remains
        at full health any direct damage it receives is reduced by 50%. *Dragon Rush:
        Lugia covers its body in a light blue dragon-shaped energy and rushes the
        opponent. It may also cause them to flinch. *Gust: Lugia blows a damaging
        gust of wind *Whirlwind: Lugia blows a whirlwind at the opponent to blow them
        away. *Weather Ball: Lugia gathers a ball of energy that is influenced by
        the weather. The weather changes its Type accordingly and doubles its power.
        *Ancient Power: Lugia manipulates nearby rocks with an ancient power and hurls
        them at the opponent. It may also raise all of Lugia''s stats. *Mist: Lugia
        cloaks itself and its allies in a protective mist that prevents opponents
        from lowering their stats. *Safeguard: Lugia sets up a protective barrier
        around itself and its allies which protects against status conditions. *Calm
        Mind: Lugia calms its mind to raise its special attack and special defense.
        *Extrasensory: Lugia attacks using a telekinetic force that may cause the
        opponent to flinch. Its power doubles if the opponent has somehow made themselves
        smaller such as through Minimize. *Recover: Lugia rapidly heals itself of
        any damage it may have received by up to half of its maximum health. *Aeroblast:
        Lugia''s signature move. Lugia gathers a light blue transparent ball of energy
        in its mouth which it then fires as a beam. It has a high chance of dealing
        critical damage. *Rain Dance: Lugia causes it to rain. This increases the
        power of Water Type moves and decreases the power of Fire Type moves. It also
        increases the accuracy of Thunder and Hurricane. *Hydro Pump: Lugia fires
        off a powerful stream of highly pressurized water. *Future Sight: Lugia prepares
        a psychic blast that hits the opponent later on in the fight. It also ignores
        moves like Protect and Detect. *Sky'
