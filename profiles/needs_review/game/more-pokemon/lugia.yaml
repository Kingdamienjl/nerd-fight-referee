    - field: weaknesses
      value: 'It has a gentle, almost pacifistic nature, who tends to hold back to
        avoid damaging the world, and is implied to have a tendency to lose control
        and go berserk if sufficiently provoked. Shadow Lugia lacks these gentle,
        pacifistic tendencies, however. Lugia is weak to Electric, Rock, Ghost, Dark,
        and Ice Type moves. Notable Attacks/Techniques: Lugia: * Pressure: Lugia exerts
        a pressure on the opponent which makes them expend twice as energy tiring
        them out twice as quickly. * Multiscale: So long as Lugia remains at full
        health any direct damage it receives is reduced by 50%. * Aeroblast: Lugia''s
        signature move. Lugia gathers a light blue transparent ball of energy in its
        mouth which it then fires as a beam. It has a high chance of dealing critical
        damage. * Whirlwind: Lugia blows a whirlwind at the opponent to blow them
        away. * Weather Ball: Lugia gathers a ball of energy that is influenced by
        the weather. The weather changes its Type accordingly and doubles its power.
        * Gust: Lugia blows a damaging gust of wind. * Dragon Rush: Lugia covers its
        body in a light blue dragon-shaped energy and rushes the opponent. It may
        also cause them to flinch. * Extrasensory: Lugia attacks using a telekinetic
        force that may cause the opponent to flinch. Its power doubles if the opponent
        has somehow made themselves smaller such as through Minimize. * Rain Dance:
        Lugia causes it to rain. This increase the power of Water Type moves and decreases
        the power of Fire Type moves. It also increases the accuracy of Thunder and
        Hurricane. * Hydro Pump: Lugia fires off a powerful stream of highly pressurized
        water. * Punishment: Lugia physically strikes the opponent with a dark attack
        that increases in power the more the opponent boosts their stats. * Ancient
        Power: Lugia manipulates nearby rocks with an ancient power and hurls them
        at the opponent. It may also raise all of Lugia''s stats. * Safeguard: Lugia
        sets up a protective barrier around itself and its allies which protects against
        status conditions. * Recover: Lugia rapidly heals itself of any damage it
        may have received by up to half of its maximum health. * Future Sight: Lugia
        prepares a psychic blast that hits the opponent later on in the fight. It
        also ignores moves like Protect and Detect. * Natural Gift: Lugia attacks
        by drawing power from its held berry. The Type and power are dependent on
        the berry in question. This also consumes the berry. * Calm Mind: Lugia calms
        its mind to raise its special attack an special defense. * Sky'
      source_id: character-stats-profiles-lugia-more-pokemon
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
