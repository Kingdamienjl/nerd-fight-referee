        \ signature move. Mewtwo fires off a powerful psychic projectile which targets\
        \ defense instead of special defense. *Laser Focus: Mewtwo concentrates intensely\
        \ ensuring that its next move hits. *Psywave: Mewtwo fires off a wave of psychic\
        \ energy. *Confusion: Mewtwo attacks with a telekinetic force, similar to\
        \ Psychic, which can cause confusion. *Disable: Mewtwo disables the opponent's\
        \ last move entirely. *Safeguard: Mewtwo creates a protective barrier around\
        \ itself and its allies that protects against status conditions. *Swift: Mewtwo\
        \ fires off a series of homing stars at the opponent. Some iterations bypass\
        \ resistances and the skills and abilities of the opponent. *Future Sight:\
        \ Mewtwo prepares a powerful psychic attack which strikes the opponent later\
        \ on. It ignores moves like Protect and Detect, meaning barriers and precog\
        \ don't help against it. *Psych Up: Mewtwo copies the opponent's stat changes.\
        \ *Miracle Eye: This move allows Mewtwo to hit those immune to Psychic Type\
        \ moves with Psychic Type moves and it also allows it to ignore evasion. Pokk\xE8\
        n Tournament introduces a \"reset\" effect to the move in which the last attack\
        \ used by Mewtwo gets replayed, even if it already hit or dispersed. *Psycho\
        \ Cut: Mewtwo fires off blades of psychic energy which have a high chance\
        \ of dealing critical damage. *Power Swap: Mewtwo uses its psychic powers\
        \ to swap attack and specia attack with the opponent. *Guard Swap: Mewtwo\
        \ uses its psychic powers to swap defense and special defense with the opponent.\
        \ *Recover: Mewtwo heals itself of any damage it may have received by up to\
        \ half of its maximum health. *Psychic: Mewtwo uses a strong psychokinesis\
        \ for offensive, defensive, and supplemnentary means such as lifting the target\
        \ in question or simply blasting them. It may also lower their special defense.\
        \ *Barrier: Mewtwo sets up a psychic barrier to boost its defense. This also\
        \ has been used as a forcefield, and some iterations prevent any outside effect,\
