- id: claim-powers-and-abilities-fbe3f1db
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Expert Wrestler *Acrobatics *Chi Manipulation
    (Via Banishing Flat) *Extrasensory Perception (Should be able to sense chi, just
    like other expert chi users) *Limited Air Manipulation (Via Cyclone Lariat) *Body
    Control (Via Iron Muscle and Super Russian Kick) *Social Influencing (Animal Charming:
    Could tame a pack of bears in an extremely short time and teach them wrestling
    poses.Super Street Fighter IV - Zangief''s Prologue) *Technique Mimicry (Replicated
    Karin''s Ruler''s Staying Hand, an extremely difficult technique to perform, after
    seeing it once.Street Fighter V - Karin''s Character Story) *Vibration Manipulation
    (The Ruler''s Staying Hand overwhelmes the opponents with the rythmic movement
    of its user''s muscles) *Limited Power Nullification (Head Butt and Banishing
    Flat cancel out normal projectiles. Iron Body nullifies incoming attacks) *Damage
    Boost (Can perform enhanced versions of his Special Attacks. Cossack Muscles enhances
    his Screw Pile Drive and Borscht Dynamite) *Status Effect Inducement (By hitting
    the opponent repeteadly, without them being able to recover, he can cause them
    to enter the "Stun" status, which leaves them unable to react. His Focus Attack
    causes the opponent to enter a "crumpling" status.) *Empowerment (His Bolshoi
    Storm Buster turns into a stronger technique when Zangief is at low health.) *Limited
    Fate Manipulation (Fighters can fight against their destiny.) Resistance to: *Temperature
    Manipulation (Unaffected by the cold of a blizzard despite being almost naked.
    Resisting to cold is listed as one of his special abilities.Street Fighter 30th
    Anniversary CollectionStreet Fighter V Champion Edition: Official Website Standing
    in front of an open furnace with a burning anchor in his hand only made him sweating.All
    About Street Fighter ZERO 3)'
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
