    Punch Zangieffocus.gif|Focus Attack *Head Butt: Zangief steps forward and unleashes
    a monstrous headbutt. This move cancels out normal projectiles. *Flying Head Butt:
    Zangief unleashes a short-ranged, yet monstrous headbutt in midair. *Flying Body
    Press: Zangief spreads his arms and legs out wide and lands stomach-first on top
    of the opponent. *Knee Hammer: Zangief performs a short, jumping knee strike.
    *Double Knee Drop: Zangief shifts his body back during a jump, then he drops his
    knees down, hitting his opponent. *Long Kick: Zangief crouches and stretches his
    leg, delivering a kick on the opponent''s ankles. *Chrome Head: Zangief performs
    a short jump and delivers a quick headbutt. *Dynamite Punch: Zangief delivers
    a powerful hook with his right arm. *Focus'
  source_ids: *id004
