        are able to command lesser robots in any way they desire for as long as their
        orders do not conflict with the aforementioned three laws. Mega Man is by
        far the most famous Robot Master, along with his brother Proto Man and his
        rival, Bass. Reploids: A series of robots that were based on X''s blueprints.
