- id: claim-weaknesses-87145dec
  section: weaknesses
  axis: weakness
  text: 'As an android she is affected by electromagnetic waves and Logic Viruses.
    The body she is currently in dies if the OS chip is removed. Will lose her Type
    8 immortality if the YoRHa network is destroyed. The Pod lasers can only damage
    through heat and thus certain materials including heat resistant materials can
    take reduced to no damage from them. Notable Attacks/Techniques: ===Logic Virus
    Trap=== Within 2B is a closed circuit logic virus trap. Was designed to combat
    9S. Anyone who tries to hack her will be infected and destroyed by the Logic Virus.
    ===Pods=== thumb|250px Pods are small robots that follow and support the main
    Characters of NieR:Automata. The number of pods accompanying an android is three
    (Pod A, Pod B and Pod C). The Pods are capable of flight and are extremely useful
    in combat in various ways: - The pod can provide information. It can access the
    YoRHa network and draw knowledge from its vast archives. Additionally it can scan
    the surroundings and observe and analyze opponents. - It can use its respective
    weapon to perform long range attacks on the enemy. The pod is able to lock on
    to its target in order to greatly improve accuracy and trace enemy movements automatically.
    Those three pods each hold a different one of the three following'
  source_ids: *id003
  decisive: false
