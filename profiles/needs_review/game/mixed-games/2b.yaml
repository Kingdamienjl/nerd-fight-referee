    and draw knowledge from its vast archives. Additionally it can scan the surroundings
    and observe and analyze opponents. - It can use its respective weapon to perform
    long range attacks on the enemy. The pod is able to lock on to its target in order
    to greatly improve accuracy and trace enemy movements automatically. Those three
    pods each hold a different one of the three following'
