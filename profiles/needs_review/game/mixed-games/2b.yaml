- id: claim-powers-and-abilities-88827c16
  section: abilities
  axis: hax
  text: '2B= {{#tag:tabber| {{!}}-{{!}}Base= *Superhuman Physical Characteristics
    **Inorganic Physiology (Type 2) **Enhanced Senses **Regeneration (High-Low;NieR
    Automata; 2017; Ch 17-05: 9S Self-repairs (C) via nanomachines) **Space Survival
    & Self-Sustenance (Type 1 & 2; Androids don''t need oxygen to breathe. Was perfectly
    fine in the vacuum of space.NieR Automata; 2017; Ch 11-05: 2B Escape the Bunker
    (Loss) (C) YoRHa androids also don''t need fuelNieR Automata; 2017; YoRHa Stage
    Play) **Immortality (Type 4 & 8; Cannot die as long as her memory data exists
    in the YoRHa Network) ***Resurrection (Should the active body be destroyed her
    memory data from the YoRHa Network will automatically be put into a replacement
    body) *Weapon Mastery & Martial Arts *Information Analysis (Culmination of the
    knowledge and skills of previous and current generation of androids) *Telekinesis
    (via Near Field and Far Field Controls) *Afterimage Creation (Can form afterimages
    whenever she dodges an attack) *Matter Manipulation (Is able to convert matter
    into data and save it in her inventory and vice versa) *Self-Destruction with
    Black Box *Heads-up display on the combat visor (With minimap, enemy location,
    data on enemies, various other informationYoRHa: Pearl Harbor Descent Record -
    A NieR:Automata Story; Vol 02) *Weapon Control *Energy Manipulation (Able to make
    solid constructs out of energy the most notable being a fishing chair) *Acrobatics
    *Magic (All characters wield maso, an extradimensional element that allows the
    wielder to warp reality and break laws of physics, an ability that was termed
    magic) *Non-Physical Interaction (Data; Capable of interacting with data-based
    entities) {{!}}-{{!}}Plug-in Chips= *Shockwave Creation (attacks in the air will
    create phantom strikes that will fly several meters out via Shockwave Chip) *Statistics
    Amplification (Increase of attack power, defense and speed. Significant boost
    of attack power when health is in critical condition via Last Stand Chip) *Invulnerability
    (Gains invulnerability for 6 seconds after taking damage via Anti Chain Damage
    Chip) *Healing (Heals a percentage of the damage dealt via Offensive Heal, Heal
    slowly over time via Auto Heal, Heal on kill via Deadly Heal, heal instead of
    take damage via Damage Absorb) *Damage Absorption (heal instead of take damage
    via Damage Absorb) *Potential Instant Resurrection (Each body has a 50% chance
    of reviving in top condition after being killed via Reset Chip) *Damage Reflection
    (Each damage taken has a 50% chance of being dealt back to the enemy with power
    doubled via Vengeance Chip, Can reflect up to 250% damage on block via Counter
    chip) {{!}}-{{!}}'
