  intelligence:
    text: 'Gifted (Number 2 personality types were noted to have exceptional analytical
      and decision making skills.NieR Automata; 2017; Archives | Saved Machine Records
      | [Top Secret] Model No.2 Even combat models have exceptional technical knowledge
      and can direct a fusion reactor bypass in the field and have the skills to hack
      alien technology.Nier Automata: YoRHa Shinjuwan Kouka Sakusen Kiroku Vol.2 Chapter
      5 Though they are still subpar when compared to types like the Scanner and Healer.
      While she was in denial of it, 2B was able to figure out YoRHa''s secret that
      humanity was in fact extinct. The only other character to have done so is Adam.NieR
      Automata - Volume 01 - Long Story Short; Chapter 05 While 9S or the Red Girls
      may have learned the truth, they usually did so by accessing the data directly
      as opposed to putting the clues together. Is trusted enough to be put into positions
      of leadership such as during her operation to take out a goliath weapons platform,
      she assumed captain''s duties immediately after the death of their commanding
      officer.NieR Automata; 2017; Ch 01-01_1: 2B''s Aerial Battle (A) Master combatant
      and pilot. Androids pass along knowledge and skills by sharing data. Making
      each android a culmination of the skills and knowledge of past generations of
      androids. Androids were first conceived over ten thousand years ago and have
      been at constant war against multiple faction since. For the past 5 thousand
      years their enemies have been the aliens and their living weapons, the Machine
      Lifeforms. Their enemies, the machines, are constantly evolving new weapons
      and tactics to counter the weapons and tactics used against them with an evolution
      being triggered every 30 that are killed,YoRHa: Pearl Harbor Descent Record
      - A NieR:Automata Story; Vol 07 causing the resistance to only fight during
      certain times of the year when their evolution speed is slower. In order to
      turn the tides of the war, the YoRHa were created. YoRHa are expected to kill
      thousands of machines per YoRHa android without regard to the evolution.YoRHa:
      Pearl Harbor Descent Record - A NieR:Automata Story; Vol 01 As an executioner
      model, 2B is the strongest YoRHa type. Despite being undercover, 9S managed
      to deduce her identity because of how much her battle capabilities exceeded
      other YoRHa.NieR Automata - Volume 01 - Long Story Short; Chapter 10 This was
      demonstrated during a descent to Earth where the invading force was corrupted
      by a logic virus. Despite the virus removing the limiters on their bodies, making
      them both stronger and faster, 2B battled and killed several dozen corrupted
      YoRHa combat models at the same timeNieR Automata; 2017; Ch 11-04: Contaminated
      YoRHa by herself with 9S abandoning the area so she could fight without fear
      of hitting him.NieR Automata - Volume 01 - Long Story Short; Chapter 07 The
      machines birthed Adam and Eve, powerful machines that could learn and evolve
      so quickly that Adam could learn anything instantlyNieR Automata - Volume 01
      - Long Story Short; Chapter 1 and could fight on par with 2B and 9S a few seconds
      after being born.NieR Automata; 2017; Ch 03-03: Battle with Adam And they would
      continue learning and evolving in the months after as well as killing numerous
      YoRHa. Despite this, neither Adam nor Eve could learn enough to actually defeat
      2B in any of their confrontations with 2B killing Adam in a one on one battle.
      9S has also admitted to being unable to defeat 2B normally, calling it a "One
      sided fight", and resorted to ambushing and hacking her in order to gain an
      upper handNieR Automata Memory Cage; Chapter 5)'
