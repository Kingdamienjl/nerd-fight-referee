        operation to take out a goliath weapons platform, she assumed captain''s duties
        immediately after the death of their commanding officer.NieR Automata; 2017;
        Ch 01-01_1: 2B''s Aerial Battle (A) Master combatant and pilot. Androids pass
        along knowledge and skills by sharing data. Making each android a culmination
        of the skills and knowledge of past generations of androids. Androids were
        first conceived over ten thousand years ago and have been at constant war
        against multiple faction since. For the past 5 thousand years their enemies
        have been the aliens and their living weapons, the Machine Lifeforms. Their
        enemies, the machines, are constantly evolving new weapons and tactics to
        counter the weapons and tactics used against them with an evolution being
        triggered every 30 that are killed,YoRHa: Pearl Harbor Descent Record - A
