        *Big Swipe: Swipes self quickly. *Dual Poke: Pokes the air twice, having more
        power the second time. *Finger Bullet: Fires one to three bullets from his
        fingers. *Finger Drill: Flies into the opponent and spins around like a drill
        to attack. *Finger Walk: Walks to an enemy and flicks them. Has fire involved
        in some cases. *Floor Sweep: Sweeps across length of the area. *Flying Punch:
        Flies in from behind to punch. *Flying Slap: Flies in from behind to slap.
        *Jetstream: Flies behind, then rockets forward like a jet. *Power Punch: Punches
        the opponent with electricity. *Side Punch: Flies from side to side in a punch.
        *Laser Nail: Shoots several lasers downward. *Reverse Throw: Grabs the opponent
        and throws them backwards. *Squeeze: Squeezes the opponent. *Tri-Poke: Pokes
        the air thrice, having more power the third time. *Vertical Throw: Throws
        the opponent downwards with extreme force. *Fake-Out Slap: Pretends to punch,
        but actually slaps. *Fireball Blitz: Squeezes and destroys a large fireball,
        causing smaller fireballs to fly. *Icy Wind: Spins around, creating a powerful
        wind with freezing ice cubes. *Platform Dealer: Throws several platforms that
        rise upward. *Sleeper Grab: Squeezes the opponent to sleep. *Snapper: Snaps,
        stunning the opponent if they are on the ground. *Toss Grab: Throws the opponent
        to the side. * Spawns two additional arms with glowing hands. These arms will
        sweep the stage, then merge into its chest. If the player is grabbed by a
        glowing hand, they will be consumed by the ''head'', taking damage and ending
        with a downwards launch * Moves its arm quickly across the screen horizontally.
        The movement itself does nothing, but a second later a horizontal slash will
        appear across the stage, dealing damage. The slash can penetrate through shields.
        * Creates six electric orbs that fly around the top part of the screen. Master
        Giant will then pick up the entire stage and lift it to the level of the orbs,
        before dropping it back down. This attack can be avoided by jumping off the
        stage, then jumping back on once it is dropped back down. If the player was
        just KO''d by one of Master Core''s previous attacks and is in the middle
        of respawning, the act of Master Core lifting the stage can cause the player
        to be trapped underneath it and be KO''d a second time. * Master Giant''s
        head will split apart, creating a vacuum effect around it. During this move,
        large electric orbs will travel across the stage horizontally. If the player
        is caught by the head or an electric orb, they will be ''swallowed'', taking
        damage then being launched downward in the same manner as the ''arms'' attack.
        The electric orbs can be avoided by perfect shielding or dodging/rolling,
        though it''s the safest to stay away from them until Master Giant ends the
        attack. * Master Giant''s head will transform, then attempt to headbutt the
        player. If this attack lands, the player will be buried. After the headbutt,
        4 orbs are created in random locations, detonating after a delay and creating
        a cross-shaped explosion in the shape of the Smash logo. The explosions deals
        huge damage if more than one hits. * Master Giant will scream, creating a
        massive shockwave that pushes players away from the center of the stage, potentially
        knocking them off. Players are pushed much farther if they are in the air.
        The player gets hit, causing damage, if the player is very close; however,
        the player will not be pushed far toward the edge of the stage. Ignores Counter
