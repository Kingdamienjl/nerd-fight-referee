    - field: attack_potency
      value: 'When Sonic has his own Chao, as shown when he partnered with Cream in
        Sonic Advanced 3, he can command his Chao to home in on any nearby enemies
        and attack them. *Cross Slash: Sonic moves around the enemy in an arc, letting
        loose a stream of shockwaves as he hovers through the air. *Cyclone Kick:
        A powerful cyclone that hits anything near Sonic as he ascends through the
        air. *Dash Spin: Sonic runs at his opponent before carrying his momentum into
        a Spin Attack. *Dodge Spin: After dodging an attack, Sonic immediately retaliates
        with a high speed Spin Attack that barrels through his opponent and sends
        them flying into the air. **Dodge Spin Dive: Rather than dodging and doing
        a Spin Attack, Sonic dodges before curling into a ball and launching himself
        up into the air before slamming into his enemy with concussive force. *Double
        Kick: Sonic sends two consecutive kicks towards his opponent. **Triple Kick:
        Sonic follows up with an additional kick in a quick flurry that sends the
        opponent flying back. *Double Spin: Sonic jumps into the air as he curls into
        a ball, hitting his opponent once before landing in front of them while in
        position to immediately perform a Spin Attack. *Flying Kick: For particularly
        sturdy enemies that are impervious to Sonic''s normal attacks, this is an
        alternate and much more powerful method. Sonic zips towards an enemy like
        he would for a Homing Attack, and then immediately strikes them with a mid-air
        kick to sending them flying. If another enemy is caught in the path of the
        enemy initially kicked away, they will be sent flying and take damage as well.
        *Foot Crush: Sonic brings up a foot, smashing it down onto the foot of the
        other opponent to leave them reeling in pain. *Foot Sweep: Sonic drops to
        the ground, balances on one hand, and then sweeps one of his legs around in
        a 360 degree circle that resembles break-dancing, damaging anything he comes
        into contact with. *Grand Slam: A powerful Spin Attack with a follow-up kick
        to launch the enemy away. *Hammer'
