    on the user. Without Starline''s glove it is hard to gain precise control on the
    Topaz opening portals becomes more difficult |-| Darkspine Sonic = More violent
    than before |-| Sonic the Werehog = His Werehog form trades in a large bulk of
    his speed in favor of natural raw strength, and he transforms into this form involuntarily
    at night only to change back in the day |-| Shatter Sonic= When using 4 Prism
    Shards of the Paradox Prism his power quickly runs out |-| Excalibur Sonic, Super
    Sonic & Starfall Super Sonic = None notable Notable Attacks/Techniques: {{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content=
