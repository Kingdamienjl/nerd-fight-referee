    - field: weaknesses
      value: 'He could not control his Devil Gene until Tekken 4. Devil Gene users
        are weak against light when used by the members of the Kazama clan, Archers
        of Sirius and characters such as Angel, whom were shown and stated to be effective
        on them several times before. There are also specifically made chains that
        can neutralize the Devil Gene''s powers, though Heihachi is the only one known
        to have access to them. Notable Attacks/Techniques: *Tsunami Kick: Kazuya
        rises his leg and kicks the opponent in the face, then said kick comes down
        right on the opponent head. *Electric Wind Godfist: Kazuya charges while crouching,
        then rises his first upwards sending the opponent in the air. *Spinning Demon:
        Kazuya crouches down and begins to spin around with his leg, damaging the
        opponent. *Lightning Screw Uppercut: Kazuya charges and surrounds himself
        with electricity, then he performs a powerful left handed punch which knocks
        the opponent away. *Inferno: Kazuya is capable of emitting an energy laser
        from the third eye in his forehead (attacks can be both single or not). *Rage
        Art: Kazuya staggers his opponent with a Glorious Demon God Fist, then he
        launches them with an Electric Wind Godfist, as the opponent falls he transforms
        into Devil Kazuya and fires a strong forehead laser into his opponent. - Devil'
      source_id: mediawiki-13816
