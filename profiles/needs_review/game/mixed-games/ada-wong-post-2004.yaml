    - field: weaknesses
      value: "She can't see scenes that happened before she was born. The allure ability\
        \ doesn't work against blood relatives and \u014Ctsutsuki. She also isn't\
        \ able to use her Senrigan to see into spiritual or mental planes. Her \"\
        Omnipotence\" ability can only activate when she is under emotional distress\
        \ and not regurally in combat. Notable Attacks/Techniques: *Omnipotence: Omnipotence\
        \ is the most powerful shinjutsu, accessible only to omnipotent and omniscient\
        \ gods. It's said to be a programming language that the gods used to create\
        \ worlds and that can make anything real. While not being an \u014Ctsutsuki,\
        \ Ada was granted this ability by having Shibai \u014Ctsutsuki's DNA infused\
        \ into her through his remains, but due to the nature of the ability, Ada\
        \ is unable to control it, manifesting it only through her subconscious desires.\
        \ Ada has also shown to be able to manifest this ability to grant others'\
        \ wishes, as seen how Kawaki invoked omnipotence to grant his wish. Blood\
        \ relatives and \u014Ctsutsuki are immune to Omnipotence and its known applications.\
        \ *Senrigan (Clairvoyance): Using this ability, Ada can project her consciousness\
        \ to any location to see and hear any present event, as well as any past event\
        \ up to the moment of her birth. * *Allure: Ada's very presence makes all\
        \ who sees her, man or woman, with the exception of blood relatives and \u014C\
        tsutsuki, automatically infatuated with her to the point they cannot hurt\
        \ her. Category:Slappyjoe056 Category:Unknown Tier Category:Tier 4 Category:Tier\
        \ 2"
      source_id: character-stats-profiles-ada-wong-post-2004
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Chakra Manipulation, Statistics\
        \ Amplification (Can use chakra to augment her physical capabilities), Surface\
        \ Scaling, Water Walking (Channels Chakra at the soles of her feet to walk\
        \ on water and scale vertical surfaces), Dimensional Travel, Flight, Cyborgization\
        \ (Normal - Like with all other members of Kara, Ada's body had been modified\
        \ with Scientific Ninja Tools by AmadoBoruto: Chapter 56), Reality Warping,\
        \ Mind Reading, Power Bestowal and Information Manipulation, (Type 2 Information.\
        \ Ada's true ability is the divine Jutsu \"Omnipotence\" that allows her to\
        \ manifest the desires of herself and others bringing them forth into reality,\
        \ Momoshiki claims that it was used in the creation of worlds and refers to\
        \ it as a \"progamming language of creation\". With it she manifested her\
        \ love charm ability and Kawaki's desires), Mind Manipulation and Memory Manipulation\
        \ with Kawaki's desires (Additionally with the jutsu she was able to manipulate\
        \ the memories of everyone in the word with the exception of Sarada, Sumire\
        \ and \u014Ctsutsukified beings into thinking that Boruto was the enemy of\
        \ Konaha and that Kawaki was the son of Naruto, essentially switching their\
        \ roles in the narrative. It should be noted that this ability can only be\
        \ used when Ada is under extreme emotional distress and not regurally in combat.\
        \ She is also not powerful enough to control the power properly), Passive\
        \ Empathic Manipulation, Mind Manipulation, Paralysis Inducement and Limited"
