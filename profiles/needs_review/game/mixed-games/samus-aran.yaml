      value: 'Samus'' Thermal and X-Ray visors can be [https://youtu.be/7Yh_C7Cdkq0?si=D5g0Oh7epFfJgyaQ&t=1218
        overloaded] by massive bursts of temperature and energy respectively, forcing
        her to temporarily switch back to another Visor. If Samus'' suit [https://youtu.be/F710WBfa0sY?si=AYuYDsIPPIkMHMUk&t=511
        receives incredible damage], it can permanently lose access to some of its
        functions, depowering Samus and requiring her to find them again, or even
        [https://youtu.be/2_cToWXwcaQ?si=jGLXeJ5GWLdmGOvL&t=4633 be temporarily disabled]
        altogether. Though this isn''t immediately obvious, the Screw Attack can be
        countered by [https://imgur.com/a/QL64e6q striking along the axis of its rotation].
        Cannot control the [https://imgur.com/a/8HBMMAQ blast radius] of her explosive
        weapons. Notable Attacks/Techniques: Standard= {{#tag:tabber|-Default= *Chozo
        Blood: Samus was genetically modified by the Chozo at a young age, receiving
        DNA from the Mawkin and Thoha clans, respectively donated by Raven Beak and
        Gray Voice, one of her caretakers growing up. This alteration to her genetic
        make-up grants Samus superhuman physical abilities, the ability to suppress
        of her eventual Metroid powers and likely Samus'' clairvoyant abilities. It
        also enabled Samus [https://i.imgur.com/uOA21kw.png to survive on Zebes] despite
        its difficult conditions, [https://i.imgur.com/fAxWI4Y.png enduring its acid
        rains and other inhospitable conditions]. *Zero Suit: A form-fitting flexible
        attire Samus wears beneath her Power Suit. While it lacks the innate protection
        and boosted defenses of her general armor, it''s still capable of utilizing
        Energy Tanks and grants Samus extra means of protection when she is unable
        to access the Power Suit. **Paralyzer Pistol: An emergency pistol Samus keeps
        on hand in case she is rendered unable to utilize her usual arsenal. Its main
        function against stronger foes is to [https://youtu.be/WINinwf6_Yc?si=aY5eGFcDyyeYjZBg&t=5816
        stun them for long enough for Samus to disengage] ensure continuous protection
        and functionality even should it sustain damage. Other features include automatic
        rebooting when shut-down or struck with an EMP, as well as thrusters on its
        back that enable Samus to enhance her jumping capabilities, make quick high-speed
        movements to dodge incoming attacks or perform acrobatic actions. Most importantly,
        the Power Suit is a highly adaptable piece of technology that has the capacity
        to interface with technology and weaponry, "upgrading" itself with new additional
        weapons, features, and data. **Varia Suit: Samus'' iconic [https://imgur.com/a/OmuQj53
        Varia Suit] and freezing attacks. **Gravity Suit: The [https://imgur.com/a/QlBzDWE
        Gravity Suit], and more, allowing her to move about as if she were on land.
        In addition to this, the Gravity Suit also boasts enhanced protective properties,
        further enhancing her resistance to temperatures and acids and bolstering
        her overall defense to even greater levels compared to the Varia Suit. ***Energy
        Tanks: Energy Tanks are essential items that increase Samus'' maximum "health"
        capacity. [https://imgur.com/a/OmuQj53 Her suit uses an energy-based shielding
        system]. ***Reserve Tanks: Serving as backup energy storage, Reserve Tanks
        provide an emergency energy refill when Samus'' energy is depleted. They can
        be manually filled by collecting energy pickups when Samus'' health is full,
        or they can be filled automatically as Samus finds more energy along her journey,
        and activated automatically when her energy is low or manually whenever Samus
        wishes to. **Power Grip: The Power Grip is a key upgrade in Metroid: Zero
        Mission, and later a base feature within her suit. With this ability, Samus
        can cling to and pull herself up onto edges that are too high for her to reach
        otherwise, greatly enhancing her mobility. **Hi-Jump Boots: The Hi-Jump Boots
        magnify Samus'' jumping capabilities, enabling her to jump further and higher
        than she otherwise would be able. *Visors: **Combat Visor: The [https://imgur.com/a/GI5jaPj
        Combat Visor]. **Scan Visor: The Scan Visor is one of Samus''s most crucial
        tools, designed to [https://imgur.com/a/VcWrxox uncover a range of information
        from her surroundings]. Initially her maps start off with little detail, but
        as she explores further her suit will automatically update in response, fleshing
        out her maps with geography, obstacles and details. The suit is also capable
        of downloading map data from external sources, as well as track ongoing activity
        on a planetary scale, keeping her aware of things such as seismic activity
        or even the potential locations of useful items. Additionally, Samus has shown
        the ability to register bioforms and automatically track their numbers and
        position in real time, a feature utilized to exterminate the Metroids on SR-388.
        *Arm Cannon: center|780px *Power Beam: The Power Beam is Samus'' default weapon,
