    - field: weaknesses
      value: 'If Samus'' suit receives incredible damage, it can permanently lose
        access to some of its functions, depowering Samus and requiring her to find
        them againMetroid Prime 2: Echoes (2004) - Samus chases Dark Samus into Dark
        Aether, or even be temporarily disabled altogetherMetroid: Other M (2010)
        - Adam''s sacrifice [cutscene]. Though this isn''t immediately obvious, the
        Screw Attack can be countered by striking along the axis of its rotationSamus
        and Joey: Metroid Extreme (2004) - Chapter 2. Cannot control the blast radiusSamus
        & Joey (2002) - Chapter 1 of her explosive weapons. Samus is very vulnerable
        to extreme cold, thanks to her Metroid DNAMetroid Fusion (2002) - ADAM, Sector
        2 [ADAM tells Samus about the SA-X]. While the Varia and Gravity suit mitigate
        this weakness of hers, her cellular makeup would still reject the Ice BeamMetroid
        Fusion (2002) - ADAM, Sector 6 [ADAM briefs Samus after she obtains the Varia
        Suit]. Samus'' Ice Missiles are turned into normal missiles by extreme heat.
        Notable Attacks/Techniques: Standard= {{#tag:tabber|{{!}}-{{!}}Default= *Chozo
        Blood: Samus was genetically modified by the Chozo at a young age, receiving
        DNA from the Mawkin and Thoha clans, respectively donated by Raven Beak and
        Gray Voice, one of her caretakers growing up. This alteration to her genetic
        make-up grants Samus superhuman physical abilities, the ability to suppress
        her Metroid powers and likely Samus'' clairvoyant abilities. It also enabled
        Samus to survive on Zebes despite its difficult conditionsMetroid Manga (2002)
        - Chapter 2, enduring its acid rains and other inhospitable conditionsMetroid
        Manga (2002) - Chapter 11. **Metroid Physiology: Infected by the X Parasite
        and nearly killed, Samus'' life was saved with a vaccine created from the
        Infant Metroid she''d rescued from SR-388. This vaccine altered her DNA, granting
        her Metroid DNA alongside her Human and Chozo strands. Samus is now not only
        immune to the X''s deadly absorptionMetroid Fusion (2002) - Intro, but she
        in turn absorbs them on contact, draining their life force to replenish her
        own. An unfortunate side effect of this mutation is a newfound weakness to
        extreme cold; much like normal Metroids, Samus is vulnerable to extreme coldMetroid
        Fusion (2002) - ADAM, Sector 2 [ADAM tells Samus about the SA-X], and though
        the Varia Suit and Gravity Suit both offset this weakness her cellular makeup
        would still reject the cold-based Ice Beam upgradeMetroid Fusion (2002) -
        ADAM, Sector 6 [ADAM briefs Samus after she obtains the Varia Suit]. While
        it remains dormant throughout the events of Metroid Fusion, Samus'' Metroid
        DNA begins to awaken in Metroid Dread triggered by the attack of a Mawkin
        warrior. From then, it enables her to absorb the powers from devicesMetroid
        Dread (2021) - Samus finds E.M.M.I.-01P''s Central Unit and itemsMetroid Dread
        (2021) - Corpus Boss Battle, and eventually even directly siphon foes'' life
        energy, killing them in seconds and restoring her health as she does soMetroid
        Dread (2021) - Samus encounters E.M.M.I.-07PB and fights a Red Chozo Soldier.
        *Zero Suit: A form-fitting flexible attire Samus wears beneath her Power Suit.
        While it lacks the innate protection and boosted defenses of her general armor,
        it''s still capable of utilizing Energy Tanks and grants Samus extra means
        of protection when she is unable to access the Power Suit. **Paralyzer Pistol:
        An emergency pistol Samus keeps on hand in case she is rendered unable to
        utilize her usual arsenal. Its main function against stronger foes is to stun
        them for long enough for Samus to disengage safely and while it pales in comparison
        to Samus'' usual weaponry and is relatively harmless to her typical foes,
        it is still capable of powering electrical machinery or destroying weaker
        targets and obstacles. The Paralyzer has infinite ammunition and is capable
        of firing rapidly, but needs to recharge briefly for shots to have a paralyzing
        effect. *Concentration: By focusing for a few seconds Samus is capable of
        healing herself while in the suitMetroid: Other M (2010), replenishing some
        energy and even missile ammunition. Samus must briefly pause to use this ability,
        forcing her to briefly break away from immediate danger or wait until her
        foes have been vanquished before making use of it. {{!}}-{{!}}'
