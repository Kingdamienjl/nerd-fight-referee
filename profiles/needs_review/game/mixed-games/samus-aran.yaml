        She has saved the galaxy multiple times from otherwise invincible threats
        of various kinds, won the Galactic Federation entire wars with her actions
        and become universally dreaded by the otherwise fierce Space Pirates. **Marksmanship:
        Samus'' suits enhance her aiming capabilities with a targeting systemMetroid
        Prime (2002) - Logbook, Thardus, though she is capable of manually surpassing
        their level of accuracy when neededMetroid Manga (2002) - Chapter 12. Shot
        down two ricocheting bullets out of the air at once to prevent them from hitting
