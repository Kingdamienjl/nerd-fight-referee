    - field: intelligence
      value: 'Genius. [https://imgur.com/a/TiKDtsj Designed the gunship] she uses
        in Metroid Prime 3, combining both Federation and Chozo technology. [https://imgur.com/a/LPg4QGo
        Won an infamous inter-planetary spaceship race] through the hardest course
        in the galaxy, against some of the galaxy''s most skilled pilots, despite
        all of them being out to kill her, her ship being sabotaged and the top competitor
        being armed with her Speed Booster. Hijacked and [https://youtu.be/JW26nBX8-Ac?si=ZPlKROtwpbsq3TZt&t=991
        learned how to pilot a Space Pirate ship in seconds]. * Combat Skill: Even
        by her first game outing, Samus was thought to be [https://imgur.com/a/NIcHLqy
        the greatest bounty hunter] [https://imgur.com/a/M8sZOK3 in the universe],
        a hotly contested title that she has held onto ever since. She has saved the
        galaxy multiple times from otherwise invincible threats of various kinds,
        won the Galactic Federation entire wars with her actions and become universally
        dreaded by the otherwise fierce Space Pirates. ** Marksmanship: Samus'' suits
        [https://imgur.com/a/oFsUid4 enhance her aiming capabilities] with a targeting
        system, though she is capable of [https://imgur.com/a/JHCNsOo manually surpassing
        their level of accuracy] when needed. [https://imgur.com/a/eTfNpqW Shot down
        two ricocheting bullets out of the air at once] to prevent them from hitting
        civilians, from outside of the building, through a saloon door. Even as a
        teenager, Samus'' aim was good enough to [https://imgur.com/a/hu8zGm8 rapid-fire
        disarm] an entire group of hostiles without harming a single one of them.
        Shot a large gear she flipped into the air, causing it to be [https://youtu.be/MXEcnEkOfkg?si=aFdV073JClF4j-mc&t=6449
        launched precisely onto a mechanism and locking it in place]. Blasted a foe''s
        [https://imgur.com/a/FLfweX5 whipping tongue out of the air]. ** Hand to Hand
        Combat: Samus is a skilled hand-to-hand combatant, capable of [https://imgur.com/a/ysWVuef
        overwhelming and disarming multiple armed opponents], [https://imgur.com/a/Sa3lFve
        easily defeating comparable foes] and incorporating [https://www.youtube.com/watch?v=1xemotUspDw
        acrobatic hand-to-hand combat and grappling] in her fighting style, as well
        as the ability to perform Melee Counters, quick parries that [https://youtu.be/9BCPx2SX7Hk?si=wyG3HcCJV8lSa0gs&t=171
        stun the attacking foe] for a [https://youtu.be/kSyOXnzdNdA?si=WLWujI-mvly8d1e0&t=8982
        few seconds], [https://youtu.be/P3PCgYn3aj8?si=IG3sTVko5IHkSKUH&t=15 halt
        foes'' attacks or grapple them] to give herself an opening to shoot them at
        point-blank range. ** Acrobatics: Samus'' Power Suit [https://imgur.com/a/IByKK2L
        enhances her natural acrobatic abilities], though even without it she can
        perform incredible feats such as quick dodges in any direction, repeating
        [https://imgur.com/a/RsCLksB somersaults], [https://youtu.be/mK6rxqrOofc?si=3_vw6Y9MRNb6tEgu&t=2206
        wall-jumps]. [https://imgur.com/a/5oNANLC Climbed up Kraid''s body] on [https://youtu.be/D6FkqTzmDvk?t=5932
        two separate occasions], using her own Power Bomb to boost herself up in the
        first and avoiding several attacks in the second. Can [https://youtu.be/kSyOXnzdNdA?si=iR3XpMAfgKbyMUQT&t=23903
        use the boosters on her back] to change her momentum in midair. Dodged [https://imgur.com/a/A3gHeSQ
        through a rain of a thousand attacks], Swiftly [https://imgur.com/a/UJTxvLP
        dodged over the attack of a foe behind her] without looking and is overall
        capable of [https://youtu.be/WibJxvfutBc?si=4RSg4gnEIovCukyM&t=97 repeating
        somersaults], [https://www.youtube.com/watch?v=4G9horOsFEY&t=422s upwards
        kicks while sliding]. Shown to use [https://youtu.be/D6FkqTzmDvk?t=344 the
        jets on her back to halt] or enhance her momentum when necessary. ** Strategy:
        See Standard Tactics. Standard Tactics: Samus is an extremely strategic combatant,
        usually utilizing her Scan Visor to gain information on enemy weaknesses to
        then methodically exploit them, and coming up with ingenious strategies such
        as overwhelming a foe''s resistance to extreme temperatures by [https://imgur.com/a/6Q6n432
        first heating them up with the Plasma Beam, and then rapidly cooling them
        with the Ice Beam], [https://imgur.com/a/bZqxmk1 surviving a gravity attack
        by turning into a sphere to withstand the pressure better]. At the same time,
        she is very much capable of [https://youtu.be/1xemotUspDw?si=O7RiXZqYlTeuU2MN&t=312
        overwhelming opponents], [https://youtu.be/P3PCgYn3aj8?si=DAgxSQGXvbE9hScn&t=134
        climbing onto their bodies] or [https://youtu.be/P3PCgYn3aj8?si=alsRfsKll4yl1sNC&t=195
        weaving between their attacks] as she delivers her own. Often, Samus [https://youtu.be/hJTzs6JRxUQ?si=JVJGMQZYtgYV62tx&t=245
        will aim for the inside of a monstrous foe''s mouth] to inflict more damage
