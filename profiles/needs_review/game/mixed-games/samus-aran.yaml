        & Joey (2002) - Chapter 1 of her explosive weapons. Notable Attacks/Techniques:
        Zero Suit= *Chozo Blood: Samus was genetically modified by the Chozo at a
        young age, receiving DNA from the Mawkin and Thoha clans, respectively donated
        by Raven Beak and Gray Voice, one of her caretakers growing up. This alteration
        to her genetic make-up grants Samus superhuman physical abilities, the ability
        to suppress of her eventual Metroid powers and likely Samus'' clairvoyant
        abilities. It also enabled Samus to survive on Zebes despite its difficult
        conditions,Metroid Manga (2002) - Chapter 2 enduring its acid rains and other
        inhospitable conditions.Metroid Manga (2002) - Chapter 11 *Zero Suit: A form-fitting
        flexible attire Samus wears beneath her Power Suit. While it lacks the innate
        protection and boosted defenses of her general armor, it''s still capable
        of utilizing Energy Tanks and grants Samus extra means of protection when
        she is unable to access the Power Suit. **Paralyzer Pistol: An emergency pistol
        Samus keeps on hand in case she is rendered unable to utilize her usual arsenal.
        Its main function against stronger foes is to stun them for long enough for
        Samus to disengage safely and while it pales in comparison to Samus'' usual
        weaponry and is relatively harmless to her typical foes, it is still capable
        of powering electrical machinery or destroying weaker targets and obstacles.
        The Paralyzer has infinite ammunition and is capable of firing rapidly, but
        needs to recharge briefly for shots to have a paralyzing effect. *Concentration:
        By focusing for a few seconds Samus is capable of healing herself while in
        the suit,Metroid: Other M (2010) replenishing some energy and even missile
        ammunition. Samus must briefly pause to use this ability, forcing her to briefly
        break away from immediate danger or wait until her foes have been vanquished
        before making use of it. |-|Power Suit= *Power Suit: Samus'' Power Suit is
        a highly advanced bio-mechanical armor designed by the Chozo. Its protective
        features include Energy Shields stored in Energy Tanks that absorb damage
        before it impacts her physically, alongside durable armor that not only mitigates
        and disperses impacts and energy, but also withstands extreme conditions such
        as extreme heat, underwater pressure, acids, the vacuum of space and enemy
        attacks. Enhanced physical strength and agility allow Samus to navigate hostile
        environments and battle powerful foes with ease. Other features include automatic
        rebooting when shut-down or struck with an EMP, as well as thrusters on its
        back that enable Samus to enhance her jumping capabilities, make quick high-speed
        movements to dodge incoming attacks or perform acrobatic actions. Most importantly,
        the Power Suit is a highly adaptable piece of technology that has the capacity
        to interface with technology and weaponry, "upgrading" itself with new additional
        weapons, features, and data. **Energy Tanks: Energy Tanks are essential items
        that increase Samus'' maximum "health" capacity. Her suit uses an energy-based
        shielding system to protect from damage of all kinds, whether it be physical,
        environmental, or unconventional. Every time Samus takes damage the suit expends
        energy units proportional to the damage she would have taken instead, protecting
        her and the suit from harm as long as energy remains. Each Energy Tank provides
        an additional 100 units of energy (Which has rejuvenating properties for both
        organic and technological targets), allowing Samus to shoulder even more damage
        before her suit''s integrity is compromised. Energy Tanks are permanently
        added to Samus'' health bar upon collection, and multiple tanks can be stacked
        to significantly extend her total energy pool, with the total amount varying
        between appearances.4 in Power Suit | 9 in Varia Suit | 12 in Gravity Suit.
        **Power Grip: Increases Samus'' grip strength while in the suit enabling her
        to cling to and pull herself up onto edges that are too high for her to reach
        otherwise, greatly enhancing her mobility. **Hi-Jump Boots: The Hi-Jump Boots
        magnify Samus'' jumping capabilities, enabling her to jump further and higher
