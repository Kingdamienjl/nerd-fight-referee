        flipped into the air, causing it to be launched precisely onto a mechanism
        and locking it in placeMetroid Prime 3: Corruption (2007), Elysia, Powerworks.
        Blasted a foe''s whipping tongue out of the air.Samus and Joey: Metroid Extreme
        (2004) - Chapter 2 **Hand to Hand Combat: Samus is a skilled hand-to-hand
        combatant, capable of overwhelming and disarming multiple armed opponentsMetroid
        Manga (2002) - Chapter 13, easily defeating comparable foesSamus & Joey (2002)
        - Chapter 5 and incorporating acrobatic hand-to-hand combat and grappling
        in her fighting styleMetroid: Other M (2010), as well as the ability to perform
        Melee Counters, quick parries that stun the attacking foe for a few seconds,
        even while crouching, in Morph Ball form or in the air. She has also been
