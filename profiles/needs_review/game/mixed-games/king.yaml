      value: Gifted Prologue Chapter to Chapter of Orochi Saga (KOF '94 to KOF '97)=
        King's martial arts style is a self-developed form of Muay Thai kickboxingThe
        King of Fighters Official Portal Website; Character Database, which she was
        taught by a former Thai Muay Thai championThe King of Fighters Characters;
        KOF '94-97 Complete Collection of All 45 Character Setting Materials. Her
        skill proved to be so impressive that Mr. Big, a prominent figure in the criminal
        underworld, hired her as a bouncer. Subsequently, Chizuru would find her strength
        formidable to form a team with her. King herself has participated in KOF tournament
        for four consecutive years, facing numerous skilled opponents with her team,
        for which she is usually recognized as a leader among the female fighters.
        In addition to her fighting career, she is also the owner of the successful
        Illusion bar in England. Chapter of NESTS Saga (KOF '99 to KOF 2001)= King
        continued her annual participation in KOF from '99 to 2001. She was able to
        match against Robert and stalemate him countless times. In the KOF 2001 tournament,
        her team is one of the potential winners who would have eventually confronted
        the original Zero, followed by the syndicate's leader, Igniz. Chapter of Ash
        Saga (KOF 2003 to KOF XIII)= King competed in KOF 2003 and KOF XIII as part
        of the Women Fighters Team and in KOF XI as the Art of Fighting Team, facing
        off against several teams as the Women Fighters TeamThe King of Fighters XIII
