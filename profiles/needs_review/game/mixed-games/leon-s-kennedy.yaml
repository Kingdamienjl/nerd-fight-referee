    - field: weaknesses
      value: "Has feelings for Ada Wong. Leon also seems to have little sense of self-preservation\
        \ and only thinks of others' safety in times of crisis. ==Gallery== ==Notable\
        \ Matchups== Victories: *Falco Lombardi (Star Fox) Falco\u2019s Profile *Dante\
        \ (Netflix Devil May Cry) Dante\u2019s Profile (Base Dante but he could enter\
        \ Devil Trigger and Post-2004 Leon were used, Leon was restricted to low calliber\
        \ weapons and fight took place on Dante's office) *The Prototype (Poppy Playtime)\
        \ The Prototype's Profile (Both are 9-B; Speed is Equalized; Battle takes\
        \ place on a moving train; Distance is 5m with the Prototype on top of the\
        \ train, while Leon is inside it) *Homelander (The Boys) Homelander's Profile\
        \ (Speed was equalized. Post 2002 Leon was used and had access to all of his\
        \ equipment. The battle took place at the Raccoon City Police Station. Homelander\
        \ was bloodlusted) Losses: *Fulgore (Classic) (Killer Instinct) Fulgore's\
        \ Profile (Mark II Fulgore was used, Leon's 9-A and High 8-C weapons were\
        \ restricted, speed was equalized and the battle took place at the Budokai\
        \ Tenkaichi Arena from Dragon Ball) *Dante (Devil May Cry) Dante's Profile\
        \ (Dante was \"Tony Redgrave\" from DMC Volume 1 and Post-2002 \"Death Island\"\
        \ Leon were used; Leon had all of his equipment, speed was equalized, both\
        \ were in character and started 20m away from each other w/ cover) Inconclusive:\
        \ *Leon S. Kennedy (Resident Evil (Remake Timeline)) Leon's Profile (Both\
        \ were at the first key and had 8 inventory slots; Fight was at Dust 2, they\
        \ started with no line of sight and in opposite sides of the map with speed\
