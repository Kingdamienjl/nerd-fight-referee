    have become first-class and can use most guns without any difficulty.Biohazard
    6 Official Complete Guide: Page 6 He demonstrates an extremely high accuracy when
    throwing knives, evidenced by his ability to hit Salazar''s hand from the opposite
    side of a large room, freeing Ada by cutting the ropes that bound her and hitting
    Curtis Miller''s mutated eye directly in the pupilResident Evil: Degeneration)
    *Vehicular Mastery (Capable of riding his motorcycle, dodging attacks from the
    dogs while also shooting, Leon is also capable of performing tricks with a Jet
    Ski) *Acrobatics (Has shown great parkour skills. Can dodge lasers by performing
    flips, able to dodge numerous attacks from Verdugo through backflips, able to
    land properly after being launched in the air.) *Enhanced Senses (With Infrared
    Scope and Binoculars) *Light Manipulation (Via Flash Grenade and P.R.L 412) *Sound
    Manipulation (Via Flash Grenade) *Homing Attack (Mine Thrower''s exclusive upgrade
    turn mine darts into homing projectiles) *Limited Supernatural Luck (When his
    Handgun unlocks its exclusive upgrade, its chances to hit criticals have increased
