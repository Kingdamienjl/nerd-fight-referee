    - field: weaknesses
      value: "Due to Dragon breath attacks being purely elemental, they aren't treated\
        \ as either physical or magical attacks as such Diablo\u2019s magic reflection\
        \ and damage reducing abilities don\u2019t activate against them. His high\
        \ tiered magic's like White Nova consume a lot of mana, though it isn't much\
        \ of an issue due to him having a lot of mp recovery potions. Notable Attacks/Techniques:\
        \ *Explosion: A magic ability which collects the hydrogen within the atmosphere,\
        \ which is then ignited using magical power. *Freezia: Level 80 magic which\
        \ freeze the target\u2019s range. It stops the motion within his targets molecules\
        \ making them freeze. *White Nova: Level 150 magic which creates a sphere\
        \ of pure white, about the size of a ping-pong ball, from the tip of his staff\
        \ which slowly and softly drifts to the ground. The instant the sphere touches\
        \ the ground, it bursts into blinding white light causing everything within\
        \ the spell\u2019s AoE to repeatedly break down on a molecular level. *Return:\
        \ A magic ability which warps him back to the last town he visited. *Dark\
        \ Bullet: A dark-elemental spell which shoots pitch-black bullets of darkness\
        \ towards his opponent. *Dark Press: A spell which creates a black sphere\
        \ about the size of a basketball appeared from the tip of his Tenma Staff\
        \ which he tosses at his opponent, increasing the gravity of his opponent\
        \ causing them to sink into the ground. *Naraka: A level 130 dark-elemental\
        \ spell which only activates if he is touching his opponent. His opponent\
        \ is sucked into the spot where Diablo touches them with Tenma Staff. The\
        \ ability is a miniature black hole, it is a spell that takes his enemies\
        \ and forcibly traps them within a realm of darkness. *Volcanic Wall: A level\
        \ 80 Earth and Fire-type magic that causes a wall of fire to erupt from the\
        \ ground. *Heaven\u2019s Fall: A level 100 spell which spawns a large number\
        \ of meteorites and deal damage to a wide area. *Matoi Izuna: A combination\
        \ Wind and Light elemental spell that creates a condensed mass of lightning\
        \ from the tip of his staff, which he sent flying towards his opponent. The\
        \ instant the shining ball of light make contact with its target, their body\
        \ starts to quake, spasming continuously as lightning poures forth from their\
        \ eyes and mouths. Matoi Izuna lodges itself inside the target, tearing them\
        \ apart from the inside. *Freeze Zone: A level 90 Ice-elemental spell that\
        \ freezes a small targeted area, applying the Freeze status effect to his\
        \ opponent, slowing their movement. *Apocalypse Abyss: A Forbidden Spell which\
        \ establishes magical power points in thirteen spots. Its power is high but\
        \ has a long preparation time, making it only useful against an opponent that\
        \ moves in a limited space. Within the set range, pillars of light rise up\
        \ from the thirteen magical power points, creating a fierce tornado which\
        \ contains the four basic elements, turning everything it touches to dust.\
        \ The spell creates flashes of lightning, throws magma into the air, and shatters\
        \ everything it freezes in an instant. It has a high effect against a being\
        \ of the Darkness attribute. *Black Hole Arrow: An ability which creates a\
        \ black sphere at the tip of the staff which swallows anything and everything\
        \ including light. *Grand Mine: An Earth attribute Elementary Magic which\
        \ causes an explosion when a specified spot on the ground was stepped on.\
        \ *Absolute Zero: One of the Water Attributes strongest magics, it freezes\
        \ its targets by causing them to completely and forever lose any and all kinetic\
        \ energy. The targets are limited to one person, and the spell won\u2019t\
        \ activate unless done at zero distance. *Darkness Cannon: A high ranking\
        \ magic of the Darkness Attribute, that fires a jet black cannonball of condensed\
        \ magic power. *Virius Cloud: A level 110 Wind and Darkness Attribute Magic\
        \ which spreads a dark cloud that poisons his opponents. *Cross Blizzard:\
        \ A level 110 Water and Wind attribute magic, which creates two tornadoes\
        \ that freeze everything they touch, and in addition to that, smash and scatter\
        \ what they have frozen with their gales. *Rust Burst: An ability which corrodes\
        \ whatever it touches. *Press Shredder: A level 110 Wind attribute magic which\
        \ condenses the air to create a gigantic sword. *Demon Squeeze: A Darkness\
        \ attribute Magic learned at level 120, and the highest version of Dark Press.\
        \ It creates black ivy that tightens up on the things caught it. *Sword Smite\
        \ III: A Martial Art where after closing the distance in one go, it would\
        \ slash at the enemy. *Heat Sonic: A Martial Art learned at level 80. It is\
        \ a powerful technique that makes the edge of his weapon go red hot, and cuts\
        \ eight times in an instant. *Iron Wall: A Martial Art learned after surpassing\
        \ level 100 as a Warrior. It is a Martial Art which allows him to endure attacks\
        \ with his SP. *Lightning Storm: A level 140 magic that possessed Light and\
        \ Wind attributes. It creates a tornado that holds down the opponent\u2019\
        s movements, and strikes them at the same time with lightning. *Prism Wall:\
        \ A magic barrier mad"
