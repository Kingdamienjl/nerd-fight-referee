    - field: intelligence
      value: 'Gifted (Diablo and his fellow gods are extremely ancient beings who
        ruled over the Earth during the Mesozoic Era, establishing their respective
        domains over different parts of the planet and grouping together vast numbers
        of prehistoric creatures into semi-civilized societies. The feud between the
        gods lasted for 15 millions years, a time during which they constantly waged
        war on each other to conquer and claim ultimate supremacy. Being utterly evenPrimal
        Rage: The Avatars - pp. 34 in all major aspects, neither god has ever managed
        to truly prevail over the other, in spite of the many alliances and truces
        that have risen and crumbled over the years. Once awoken in the post-apocalyptic
        modern world, the gods resumed their old ways for another millennia with large
        tribes of human worshippers under their command. The gods even adapted to
        human ruling customs, organizing their new realms in kingdoms, stratocracies,
        theocracies and more, administrated according to their respective politics
        and philosophies. The gods are all extremely capable and experienced combatants,
        having fought with each other and their respective underlings on even grounds
        for ages. When Necrosan invaded Urth, the gods and their tribes agreed to
        join forces and, although not without sparse difficulties, eventually managed
        to vanquish their common foe. Their unified ingenuity allowed the coalition
        to annihilate one third of Necrosan''s army of zombies in just a few days
        through ambushed and hit-and-run strategies.Primal Rage: The Avatars - pp.
        65 to 70 and 86 The brutish behavior and appearance of the gods hides a certain
        degree of gallantry, as they came to set up specific rulesPrimal Rage: The
        Avatars - pp. 53 and 54 for combat and on rare occasions have been eager to
        engage in all-out brawlsPrimal Rage: The Avatars - pp. 136 and 245 simply
        for the joy of it. Diablo himself is a very capable god, sly and cunning in
        his ways of dealing with his followers and enemies. In the past the numbers
        of his subordinates were the highest next to Blizzard''s and during the war
        with Necrosan he correctly foreshadowed betrayalPrimal Rage: The Avatars -
        pp. 142 from his own shaman Sinjin. In order to turn the tides in his favor
        once again, he skillfully utilized his telepathic abilities to sway Sinjin,
        feeding him lies under the belief of them being his own thoughts)'
      source_id: mediawiki-4749492
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Fireball: Diablo launches
        a flaming projectile from his mouth. *Torch: Diablo breathes an incredibly
        hot flame from his mouth, sacrificing range for power, in order to singe and
        daze the opponent. *Hot Foot: Diablo lowers his head, breathing a huge burst
        of flames at his opponent''s feet, inflicting damage and knocking them over.
        *Mega Lunge: Diablo ducks down, charging the enemy before raising his head
        up and violently ramming it into them. *Pulverizer: Diablo leaps into the
        air, landing on his foe before brutally stomping on them. *Inferno Flash:
        Diablo instantly vanishes in a burst of fire before reappearing somewhere
        else. Any enemy too close to him when he teleports will be horribly burnt
        as well as stunned, for a brief period of time. Finishers: *Incinerator: After
        rearing back his head, Diablo launches a massive stream of fire at the opponent,
        reducing them to nothing but a pile of burnt bones. *Fireball (Finisher):
        Diablo launches a colossal version of his fireball attack which explodes on
        impact, burning any unlucky enemy to a crisp. *Infernal: Diablo stomps the
        ground, creating a fiery fissure which drags the victim down to the depths
        of the Urth. Torch.gif|Torch DiabloFireball.gif|Fireball HotFoot.gif|Hot Foot
