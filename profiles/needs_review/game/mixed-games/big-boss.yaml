    - field: standard_equipment
      value: "|Many weapons, such as a knife, pistols, rifles, sniper rifles, grenades,\
        \ mines, C4, and rocket launchers. Other equipment includes a cardboard box,\
        \ stealth mats, mine detectors, thermal and night vision goggles, and binoculars.\
        \ *iDroid: Holographic interface device that provides Snake with live info\
        \ on the terrain, weather, and position of objectives and marked targets.\
        \ It also serves as a communication device that keeps Snake in touch with\
        \ Militaires Sans Fronti\xE8res' staff, allowing Snake to call-in requests\
        \ for airstrikes, chopper support, and airdrops to change or re-supply his\
        \ current equipment. *Analyzer: Electronic device that allows Snake to analyze\
        \ the skills and abilities of soldiers he focuses on. *Fulton Recovery System:\
        \ Surface-to-air recovery system, it allows Snake to extract supplies, weaponry,\
        \ vehicles, animals, and people from the area and transport them to Mother\
        \ Base. *Sneaking Suit:: A unique military garment made of highly-resistant\
        \ aramid weave that offers superb damage resistance. It clings tightly to\
        \ specific parts of the body, speeding up recovery from wounds and increasing\
        \ the user's endurance. Like other models before it, it provides insulation\
        \ that protects the body from dangerous substances and allows the user to\
        \ operate in extreme climates and damp conditions. It also incorporates noise-dampening\
        \ soles that will enable the user to run without making a sound. *Camouflages:\
        \ During Operation Snake Eater, Naked Snake acquired several unique camo uniforms,\
        \ some of which possessed special abilities. **Moss: Gained from the End,\
        \ the Moss Camo is very useful in grassy and forested areas and recharges\
        \ Snake's stamina so long as he is exposed to light, with sunlight giving\
        \ the most. **Spider: Gained from the Fear, the Spider Camo is an early form\
        \ of stealth camouflage that bends light to render him virtually invisible,\
        \ making him incredibly difficult to detect, but it does so at the expense\
        \ of his stamina. **Spirit: A \"gift\" from the Sorrow, the Spirit Camo eliminates\
        \ the sound of Snake's footsteps and allows him to drain the stamina of others\
        \ while he has them in his grip. *Soliton Radar: A highly advanced radar system\
        \ developed by MSF's R&D team. It utilizes electromagnetic waves originating\
        \ from living beings to map out the location and provide live info of enemy\
        \ soldiers' position and field of view. It also can detect ghosts. *Active\
        \ Sonar: A portable device that uses sound waves to detect nearby objects\
        \ and beings, making it useful for stealth operations. However, the sound\
        \ it makes can give Big Boss' position away. *Anti-personnel Sensor: A small\
        \ personal device that can detect the heartbeats and electromagnetic fields\
        \ of nearby lifeforms. *Sonic Eye: A tool that allows Big Boss to visualize\
        \ sounds and detect their locations easily. *Motion Detector: A portable device\
        \ that can detect nearby moving objects. *Fake Death Pill: A small potassium\
        \ cyanide capsule that Big Boss can take to put himself into a deathlike state\
        \ as a ploy to fool enemies. The revival pill can counteract its effects on\
        \ one of his teeth, but he will die if he is in the condition for too long.\
        \ *Chaff Grenade: An electronic attack device that deploys countless metal\
        \ strips along with an active jammer to temporarily disable radio communications\
        \ and electronic equipment such as cameras, radar, missile guidance, and lock-on\
        \ systems as well as stun AI-controlled weapons and early model Cyborgs *The\
        \ Patriot: A distinctive assault rifle specially made for The Boss, which\
        \ she passed onto her successor upon her death. While it is relatively lightweight,\
        \ it has a strong recoil and is incredibly challenging to handle. Its internal\
        \ feed mechanism, shaped like an infinity symbol, has infinite ammunition\
        \ and can be fired indefinitely without reload. |}"
