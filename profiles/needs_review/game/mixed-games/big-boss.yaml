      value: 'Is missing an eye, Is haunted by how he had to kill The Boss Notable
        Attacks/Techniques: * CQC: CQC, short for Close Quarters Combat, is a form
        of CQB created by Big Boss and The Boss. It allows Big Boss to fight in close
        quarters while using both a knife and a handgun, allowing him to switch between
        fighting at short range and shooting an opponent in the distance. * Reflex
        Mode: When Big Boss is spotted by an opponent, he automatically enters Reflex
        Mode, a mode where Big Boss'' perception of time slows down while he still
        moves at normal speeds, allowing him to easily shoot an opponent while they
        are surprised by him. * Fulton Recovery System: Once an opponent is knocked
        out or surrenders, Big Boss you can use a Fulton on them, sending them flying
        into the air to be picked up and sent to Mother Base, they can carry large
        metal containers filled with minerals. Upgraded versions of the Fulton Recovery
        System to use Wormholes to teleport the person to Mother Base rather than
        using a balloon which can be popped by someone before the person is carried
        away. Big Boss can use these Wormholes to teleport himself. * Camouflage:
        Big Boss can use various camouflages to blend into his environment, there
        are various camouflages that can be used to do various abilities that Big
        Boss couldn''t do normally. ** Hornet Stripe Camo: The Hornet Stripe Camo
        is given to Big Boss by The Pain, it makes it so insects like leeches and
        spiders won''t harm Big Boss and hornets attack any opponent that is near
        Big Boss. ** Spider Camo: The Spider Camo is given to Big Boss by The Fear,
        it makes Big Boss almost fully invisible, however, using it rapidly drains
        his stamina. ** Moss Camo: The Moss Camo is given to Big Boss by The End,
        it gives Big Boss the ability to heal and gain stamina just by laying in the
        sunlight as well as making him nearly invisible when lying in moss. ** Fire
        Camo: The Fire Camo is given to Big Boss by The Fury, it prevents Big Boss
        from being set on fire or taking damage from fire. ** Spirit Camo: The Spirit
        Camo is given to Big Boss by The Sorrow, it makes Big Boss'' footsteps entirely
        silent and allows him to drain the stamina of anyone he gets into a choke
        hold. * Stun Rod: The Stun Rod is a knife like Rod which can generate a current
        of 1.5 million volts which can be used to shock an opponent into being unconscious.
        * Tanegashima: The Tanegashima is a musket that has been around since the
        era of the samurai, it is a special musket that has a one-in-three chance
        of producing a tornado when fired, this tornado will send an opponent to Mother
        Base. * The Patriot: The Patriot is The Boss'' weapon that she gives to Big
        Boss before her death. The Patriot is a machine gun that, due to it''s infinite
        shaped barrel, it has infinite ammo. * Dark Matter Generator: The Dark Matter
        Generator is a small placeable generator that lets out a giant ball of Dark
        Matter that travels 100 metres while damaging anything it comes in contact
        with. * Stealth Suit: Big Boss can equip the Stealth Suit, a full body suit
        that makes his footsteps completely silent, protect his body from external
        temperatures as cold as liquid nitrogen and external poisons and makes his
        body heat to be able to be detected by thermal goggles. * Parasite Suit: The
        Parasite Suit is a suit that can use cartridges to give Big Boss the abilities
        of the Skull Unit. With them, he can release a large amount of mist, make
        himself invisible or encase himself in a thick layer of armour. * Energy Wall:
        The Energy Wall is a portable forcefield generator that forms a ball around
        Big Boss that makes him invincible for a few seconds. * Infinity Bandana:
        The Infinity Bandana is a bandana that Big Boss can wear to give every gun,
        grenade or other items, infinite ammo allowing them to always be used. * Stealth
        Camouflage: The Stealth Camouflage is a small device that makes Big Boss invisible
        by refracting light to make him invisible, however, it has a short battery
        life. * Soliton Radar: The Soliton Radar is a radar that determines a layout
        of a location as well as if anyone is in the area by using electromagnetic
        waves. * D-Walker: D-Walker is a small walking robot that Big Boss can pilot
        from the back, it can be equipped with Miniguns, Missile Launchers, Flamethrowers,
        a high-voltage electrical shocker, a grenade launcher that shoots out Fultons
        to carry away opponents and standard sidearms like the WU Silenced Pistol,
