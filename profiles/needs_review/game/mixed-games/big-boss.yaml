    - field: weaknesses
      value: 'Big Boss is missing an eye and is haunted by the memory of his mentor,
        The Boss. Notable Attacks/Techniques: *CQC: Unique and highly efficient martial
        arts, allowing a soldier a variety of options while not denying them the use
        of weapons. It generally has the user taking a stance with a knife and a handgun;
        thus, they could grab/throw opponents in melee, threaten/execute people with
        the sharp blade or shoot down opponents who''re otherwise outside the user''s
        range. CQC mostly focuses on grabs, throws, and other methods to disarm the
        target, allowing one to take down enemies without killing them or use them
        as a human shield. A skilled practitioner can even "chain" throws, allowing
