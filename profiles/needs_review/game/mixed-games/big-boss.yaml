    - field: intelligence
      value: Genius (Big Boss is regarded as the best soldier in the world, which
        is reflected perfectly through his achievements. Having been trained since
        a young age in combat, espionage, and survival by the Boss, Big Boss is a
        genius fluent in many languages and with extensive knowledge in subjects such
        as psychology. He is exceedingly skilled in CQC, having developed the art
        alongside the Boss herself. He has used it to disarm and defeat others, ranging
        from the likes of Volgin to fellow masters of the art, such as Ocelot, Solid
        Snake, and the Boss herself. He can analyze situations quickly and act intelligently
        even under pressure, working to heal his injuries while on the battlefield
        and treating EVA with Para-Medic's guidance, and can expertly lead his nation
        of Outer Heaven and all its soldiers)
      source_id: mediawiki-196555
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Big Boss is missing an eye and is haunted by the memory of his mentor,
        The Boss. Notable Attacks/Techniques: *CQC: Unique and highly efficient martial
        arts, allowing a soldier a variety of options while not denying them the use
        of weapons. It generally has the user taking a stance with a knife and a handgun;
        thus, they could grab/throw opponents in melee, threaten/execute people with
        the sharp blade or shoot down opponents who''re otherwise outside the user''s
        range. CQC mostly focuses on grabs, throws, and other methods to disarm the
        target, allowing one to take down enemies without killing them or use them
        as a human shield. A skilled practitioner can even "chain" throws, allowing
        them to rapidly neutralise entire groups of soldiers in close proximity of
        each other. Being a co-developer of the technique, Big Boss is exceptionally
        skilled at CQC and overtime, during ''Operation Snake Eater'', grew to match
        and likely surpass the Boss'' mastery of it. naked snake cqc.gif|Naked Snake
