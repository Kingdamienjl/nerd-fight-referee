        can also use a Machete and even a Machete used by the Skull Unit which is
        encased in Metallic Archaea which corrodes metals. * Support Helicopter: Big
        Boss can call down his Support Helicopter at any time. He can use this helicopter
        as a method of escape, to drop off ammo, weapons, vehicles or allies and to
        get some suppressing'
