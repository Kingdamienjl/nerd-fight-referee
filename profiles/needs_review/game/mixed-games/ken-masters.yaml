    counter his Shoryuken.All About Street Fighter ZERO 2 Won many martial arts tournaments
    until he became the undisputed american champion, gaining worldwide fame and attention
    from numerous people, such as Rufus, who wants to claim the title from him, and
    Sean, Ken''s future pupil.All About Street Fighter ZERO 3 During his career he
    traded fists with a pletora of professional fighters, with some notable ones being
    Chun-Li, Cammy, Guile, Laura, Karin, Zangief, F.A.N.G, Sakura, Luke and, most
    importantly, Ryu, his eternal rival. Ken also efficiently runs the Masters Foundation,
    one of the wealthiest companies in the world, which he inherited from his family.
    Despite his occasional cockyness, Ken is overall a level-headed and reasonable
    person, who takes in great care the safety of his beloved ones. He is also particularly
    skilled in cooking pasta.Street Fighter V: Champion Edition - Official Website)
    Note: Violent Ken is a non-canonical character featured only in Ultra Street Fighter
    II: The Final Challengers Notable Attacks/Techniques: |-|Unique Attacks= Inazuma.gif|Inazuma
    Kick Thunderkick.gif|Thunder Kick KenFeint.gif|Thunder Kick - Feint ChinBuster.gif|Chin
