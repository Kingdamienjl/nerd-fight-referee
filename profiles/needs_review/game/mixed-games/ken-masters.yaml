      value: 'When he was younger, Ken was somewhat of a slacker.Marvel Super Heroes
        vs. Street Fighter Displays a noticeably cocky attitude towards his opponents.
        That said, he usually only exhibits this attitude after battles and it has
        never prevented him from fighting seriously.X-Men vs. Street FighterMarvel
        Super Heroes vs. Street Fighter Notable Attacks/Techniques: |-|Command Normals=
        *Inazuma Kakato Wari: A vertical split kick on startup that acts as an overhead
        attack. *Senpuu Kyaku: Ken jumps into the air performs a spinning kick. *Mae
        Geri: Ken steps forward and then launches a fast kick at the opponent. |-|Throws=
        *Knee Bash: Ken grabs his opponent, delivers multiple knee strikes to their
        face and finishes off with a kick to the chin that sends them off the ground.
        *Hell Wheel: Ken grabs his opponent, falling backwards into two rolls in the
        process before applying pressure accordingly after the second roll, causing
        the opponent to flip back and land on the ground. This move can be performed
        in the air as well. |-|Special Attacks= *Hadouken: A Chi-based wave of energy
        that travels towards the opponent. *Zanku Hadouken: An airborne Hadouken fired
        downwards at the opponent. The attack also slows down his fall to the ground.
        *Shoryuken: Ken performs a powerful jumping uppercut while his fist is enveloped
        in flames. *Tatsumaki Senpukyaku: Ken jumps and performs a powerful spinning
        kick, striking the opponent multiple times while flying diagonally upwards.
        This move can also be performed while in the air, to strike the opponent while
        descending. Additionally, Ken can use a version of this attack that boasts
        greater range. *Zenpou Tenshin: Ken quickly rolls along the ground. If used
        close to his opponent, Ken can reposition himself behind them. While a simple
        move in it premise, it provides a helpful means of escape when cornered. |-|Hyper
        Combos= *Shoryureppa: Ken unleashes a series of multi-hitting Shoryuken while
        his fist is engulfed in flames. *Shinryuken: A powerful Shoryuken paired with
        high magnitude flames that corkscrews vertically into the air, causing a vacuum
        effect that sucks in the opponent and strikes him multiple times. *Shippuujinrai
        Kyaku: Ken moves forward and delivers a low roundhouse kick, two high ones,
        and another low one, following up with a knee hit. He then launches into a
        vertical Tatsumaki Senpukyaku to finish off the attack. *Shinku Hadouken:
        A charged up Hadouken that unleashes in the form of a massive beam. This attack
        is rarely used by Ken, though he has been seen using it in combination with
