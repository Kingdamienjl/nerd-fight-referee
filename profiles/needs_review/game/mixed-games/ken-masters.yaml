    Flash Kicks FlameStrike.gif|Flame Strike LightningCrack.gif|Lighting Crack KenStepKick.gif|Forward
    Step Kick Focus Ken.gif|Focus Attack *Inazuma Kick: Ken performs an overhead following-legged
    axe kick that hits the opponent two times via his heel. *Thunder Kick: Ken slightly
    rushes forward and delivers an overhead axe kick with his leading leg. Ken can
    also suddenly interrupt the move, performing a feint. *Chin Buster: Ken delivers
    a punch into the chest region. *Chin Buster 2nd: Ken delivers a punch into the
    chest, followed by an uppercut to the chin, launching the opponent into the air.
    *Lion Breaker: Ken hits his opponent with a high roundhouse kick to the head,
    followed by a crescent kick which will launch the opponent into the air. *Triple
    Flash Kicks: A sequence of three, long-reaching roundhouse kicks. *Flame Strike:
    Ken lunges forward with a heavy hook. *Lighting Crack: Ken blocks an incoming
    attack and replies with a powerful knee. *Forward Step Kick: Ken steps forward
    and then launches a fast kick at the opponent. *Focus'
