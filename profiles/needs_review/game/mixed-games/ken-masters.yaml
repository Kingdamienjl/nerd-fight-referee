- id: claim-powers-and-abilities-a3dd64a4
  section: abilities
  axis: hax
  text: 'Base= *Superhuman Physical Characteristics, *Martial Arts (Master of Shotokan
    Karate and Ansatsuken.) *Acrobatics (Hypermobility and Self-Momentum) *Chi Manipulation
    *Fire Manipulation *Status Effect Inducement (By hitting the opponent repeteadly,
    without them being able to recover, he can cause them to enter the "Stun" status,
    which leaves them unable to react. His Focus Attack causes the opponent to enter
    a "crumpling" status) *Damage Boost (Can empower his physical blows with fire
    via Heat Rush. He is also able to perform enhanced versions of his Special Attacks.)
    *Empowerment (Shinryu Reppa turns into a stronger attack whenever Ken is at low
    health) *Enhanced Senses (Possesses finely-tuned battle senses, which allowed
    him to spot, but not recognize, Zangief and R. Mika in almost pitch-black darkness,
    and could tell that his punch didn''t knock out the former.Side Readers: 03 Unexpected
    Guests (Part II)) *Extrasensory Perception (Should be able to sense chi, just
    like other expert chi users.) *Limited Fate Manipulation (Fighters can fight against
    their destiny.) *Resistance to Electricity Manipulation (Unaffected by C. Viper''s
    electricity, which could hurt Ryu.Street Fighter IV: The Ties That Bind) |-|Violent
    Ken= *Same as before to a greater extent *Rage Power *Teleportation (Via Rasetsu
    Kiaku) Resistance to: *Same as before to a greater extent, plus: Mind Manipulation
    (Resisted M. Bison''s attempt to control him and eventually snapped out of the
    brainwash.Ultra Street Fighter II: The Final Challengers - Violent Ken''s Arcade
    Ending) |-|Base'
