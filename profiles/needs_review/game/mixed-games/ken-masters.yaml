  intelligence:
    text: 'Gifted (Ken is an extremely skilled martial artist, having trained for
      many years together with Ryu under Gouken. He developed his own variation of
      the Ansatsuken style, combining kicks, rapid movements and a particular attention
      and focus on the Shoryuken. Invented his Shoryureppa on the fly to defeat an
      opponent who could counter his Shoryuken.All About Street Fighter ZERO 2 Won
      many martial arts tournaments until he became the undisputed american champion,
      gaining worldwide fame and attention from numerous people, such as Rufus, who
      wants to claim the title from him, and Sean, Ken''s future pupil.All About Street
      Fighter ZERO 3 During his career he traded fists with a pletora of professional
      fighters, with some notable ones being Chun-Li, Cammy, Guile, Laura, Karin,
      Zangief, F.A.N.G, Sakura, Luke and, most importantly, Ryu, his eternal rival.
      Ken also efficiently runs the Masters Foundation, one of the wealthiest companies
      in the world, which he inherited from his family. Despite his occasional cockyness,
      Ken is overall a level-headed and reasonable person, who takes in great care
      the safety of his beloved ones. He is also particularly skilled in cooking pasta.Street
      Fighter V: Champion Edition - Official Website) Note: Violent Ken is a non-canonical
      character featured only in Ultra Street Fighter II: The Final Challengers Notable
      Attacks/Techniques: |-|Unique Attacks= Inazuma.gif|Inazuma Kick Thunderkick.gif|Thunder
      Kick KenFeint.gif|Thunder Kick - Feint ChinBuster.gif|Chin Buster ChinBuster2nd.gif|Chin
      Buster 2nd LionBreaker.gif|Lion Breaker TripleFlashKicks.gif|Triple Flash Kicks
      FlameStrike.gif|Flame Strike LightningCrack.gif|Lighting Crack KenStepKick.gif|Forward
      Step Kick Focus Ken.gif|Focus Attack *Inazuma Kick: Ken performs an overhead
      following-legged axe kick that hits the opponent two times via his heel. *Thunder
      Kick: Ken slightly rushes forward and delivers an overhead axe kick with his
      leading leg. Ken can also suddenly interrupt the move, performing a feint. *Chin
      Buster: Ken delivers a punch into the chest region. *Chin Buster 2nd: Ken delivers
      a punch into the chest, followed by an uppercut to the chin, launching the opponent
      into the air. *Lion Breaker: Ken hits his opponent with a high roundhouse kick
      to the head, followed by a crescent kick which will launch the opponent into
      the air. *Triple Flash Kicks: A sequence of three, long-reaching roundhouse
      kicks. *Flame Strike: Ken lunges forward with a heavy hook. *Lighting Crack:
      Ken blocks an incoming attack and replies with a powerful knee. *Forward Step
      Kick: Ken steps forward and then launches a fast kick at the opponent. *Focus'
    source_ids:
    - vsbattles-ken-masters-mixed-games
    confidence: 0.6
    notes: auto_repair source extraction
