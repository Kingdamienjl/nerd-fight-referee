    - field: weaknesses
      value: 'Cannot subject the wills of others unless his victim submits. Is not
        particularly powerful when outside of Hell, and gets weaker the longer he''s
        out of it. Feats: *Completely absorbed the Silver Surfer''s energy, willpower,
        and body. *Tortured young Doctor Doom in his dreams. *Drained a man''s mind
        and memory. *Stopped time and said he can resurrect the dead. Stopped time
        again. *Transported the New Mutants to a different dimension. *Regenerated
        after being blown to pieces by Dr Doom''s anti-matter beam. *Can become intangible.
        *Rewrote history, making it so Mary Jane and Peter were never married. *Summoned
        Valeria in Hell and possessed her without Doom noticing it. Note: *Before
        making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. *When Mephisto faced Galactus, the latter
        was not fed. Also, Mephisto was being amplified when he confronted Franklin
