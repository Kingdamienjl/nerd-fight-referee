    to abandon themMetroid: Samus Returns (2017) - Post-Credits Scene, only to show
    up later in Super Metroid, fully healed. Shown to regain his usual coloration
    moments after having his life force sucked out by the infant Metroid. Survived
    injuries that would be lethal even to him by feeding on human corpses), Plasma
    Manipulation, Fire Manipulation and Breath Attack (Ridley is capable of unleashing
    a wide variety of flaming plasma attacksMetroid Manga (2002) - Chapter 16 from
    his mouth), Explosion Manipulation (Can shoot fireballsMetroid: Other M (2010)
    - Ridley Boss Battle that explode across the ground), Bodily Weaponry (Ridley
    uses his fangs, claws and sharp tail, which is dexterous enough to grab and strangle
    foesMetroid Manga (2002) - Chapter 9, in battle), Flight, Stealth Mastery (Capable
    of concealing his presence from SamusMetroid Prime 3: Corruption (2007) - Intro,
    NorionSuper Metroid (1994) - Ridley Boss Battle [Ceres Space Colony]), Enhanced
    Senses (Could smell Samus'' noradrenaline through the Power SuitMetroid Manga
    (2002) - Chapter 8), minor Animal Manipulation (Ridley''s screeches are capableMetroid:
    Other M (2010) - "Prey" [cutscene] of sending other creatures into a berserk stateMetroid:
