        can shoot powerful magic blasts when Link is at full health. **Fire Sword:
        A fully upgraded sword that can now fire powerful bursts of fire, even when
        Link isn''t at full health. *Shield: An item Link uses to protect himself
        from enemy attacks. **Reflecting Shield: An upgraded shield that reflects
        projectiles and magic. *Winged Helmet: Allows Link to jump higher and longer
        distances, at the cost of 5 rupees per use. *Bell: An item that freezes airborne
        enemies in place for 8 seconds. *Lantern: Allows Link to see in the dark for
        a brief period of time, but requires lantern oil in order to be used. **Its
        upgrade, the Magic Lantern, extends the duration of the light. **Its final
        upgrade, the Lantern of Vision, extends it even further without the need of
        lantern oil and can also reveal invisible opponents. *Bombs: Explosives that
        Link can use to attack enemies and clear out obstacles. *Ropes: Link can use
        these ropes to climb ledges. They''re typically purchased in packs of 3 for
        10 rupees. *Book of Koridai: A book that was stated to be the only thing capable
        of defeating Ganon. The exact purpose of the book is unknown, but it is stated
        to yield secrets and sacred power able to defeat and imprison enemies within
        its pages.'
