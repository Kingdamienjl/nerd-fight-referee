    - field: weaknesses
      value: 'She instantly dies if her soul gem is destroyed or is at least 100 meters
        away from her body. Juri isn''t good at calculating and she doesn''t enjoy
        plotting, but she likes to fight her opponents head-on. She is also a troublemaker
        who won''t esitate to fight if things don''t go her way. The more she has
        to wait for something, the more she''ll explode at the end. Notable Attacks/Techniques:
        yunamemo1.png|"Crimson Resolve" Memoria. jurimemo2.png|"Feigning Innocence
        School Time" Memoria. jurimemo3.png|"The Great Father" Memoria. jurimemo4.png|"Medals
        of Respect, Gratitude, and Determination" Memoria. aomemo5.webp|"My Beloved
        Partners in Crime" Memoria. *Magical Girl Physiology: The physiology of a
        Magical Girl, who formed a contract with a messenger of magic, and in exchange
        gained the power of magic. Magical Girls are charged with the task of combating
        Witches, beings born from negative emotions and who spread despair and sadness
        to the world. Unlike Witches, Magical Girls bring hope to the world by destroying
        Witches. When a girl accepts to make a contract with a messenger of magic,
        her soul is materialized and becomes a Soul Gem, the source of a Magical Girl''s
        power. If a Soul Gem is destroyed or is at least 100 meters away from a Magical
        Girl''s body, the girl dies. However, in the second case, the Magical Girl
        can come back to life if the Soul Gem is brought near her again. Every time
        a Magical Girl uses her magical powers, her Soul Gem becomes "tainted". The
        only way to rid the Soul Gem of its "taint" is to use a Grief Seed, achievable
        by defeating a Witch. **Telepathy: Magical Girls can communicate with one
        another through telepathic communication. The range of the ability depends
        on the Magical Girl using it, but it is usually at least a hundred meters.
        Kyoko, for example, was able to telepathically communicate with Madoka from
        the roof of a building which was very far away from the park path where Madoka
        was walking. **Object Enchantment: Magical Girls are able to enchant objects
        with magic, giving them many abilities and sometimes changing their appearance.
        Mami was able to enhance Sayaka''s bat, giving it the ability to defeat Familiars
        and create barriers. Kyoko enchanted a pair of binoculars, making them see
        further and clearly. **Magic Detection: Magical Girls are able to sense magical
        energy or traces of magical energy nearby. They can recognize if the magical
        energy they sense is from another Magical Girl, a Witch or other enemies,
        like Wraiths and Uwasa. Since the various Magical Girls and Witches have different
        magical patterns, a Magical Girl can find a specific ally or enemy if she
        knows their specific pattern. *Lat''s Play with Them: Every Magical Girl has
        a connect skill. Every attack that a Magical Girl initiates charges up her
        connect gauge, which stores up to 3 charges. Once a Magical Girl''s connect
        skill is full, it may execute a Connect. Juri''s Connect allows her to increase
        the damage dealt by her ally''s blast attacks and gives them a change to deal
        the "Burn" status ailment on attacks. *Infinite Dragon Blaze: Juri''s Magia
        allows her to shoot a huge fire beam from her flamethrower to attack her enemies.
        It also allows her to increase the attack of Fire-attribute Magical Girls,
        gives Juri a change to deal the "Burn" status ailment on attacks and allows
        her to ignore Damage Cut. *Doppel Lakehurst: When her soul gem turns black,
        Juri transforms into her Doppel, Lakehurst. This Doppel encourages Juri to
        immediately act on every thought that comes into her head, to the point of
        considering self-control an outright evil, and it likewise never holds back
        for a single moment. After being summoned, the Doppel shoots multiple fire
        beams and then makes them explode to harm its enemies. It also allows her
        to increase the attack of Fire-attribute Magical Girls, gives Juri a change
        to deal the "Burn" status ailment on attacks and allows her to ignore Damage
        Cut. *Memoria: Memoriae are the crystallized memories of magical girls. They
        are equipable items, each providing different bonus stats and abilities to
        a magical girl. There are two different kinds of Memoriae: Active Memoriae
        and Passive Memoriae. Each magical girl can use different kinds of Memoriae,
        but she can only use up to 4 Memoriae at a time. **Crimson Resolve: Allows
        Juri to increase the damage inflicted by her blast discs and charge discs.
        (Passive Memoria) **Feigning Innocence School Time: Increases Juri''s attack
        and gives her resistance to the "Stun" status ailment. (Passive Memoria) **My
        Beloved Partners in Crime: Increases the damage dealt by Juri''s attacks and
        allows her to ignore Evade effect on enemies. (Passive Memoria) **The Great
        Father: Increases the damage dealt by Juri''s blast attacks. (Active Memoria)
        **Medals of Respect, Gratitude, and Determination: Increases Juri''s attack
        and gives her resistance to the "Burn" status ailment. (Passive Memoria) ==
        Gallery == Juri_Doppel_Card.png|Doppel Lakehurst''s official description.
        Juri_'
