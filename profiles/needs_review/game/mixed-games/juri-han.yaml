      value: Gifted (An exceptional martial artist and special agent. She became champion
        of Tae Kwon Do at the age of 15 and was considered a genius child. Could block,
        evade and counter attacks from Chun-Li, Guile and Cammy without effort, and
        then going toe with toe with other expert fighters such as Balrog, Vega, Rashid
        and even M. Bison, although only briefly with the latter. She also managed
        to overwhelm and toy with all the Dolls, Shadaloo's elite guards and assassins.
        She can perform many acrobatic maneuvers with her motorcycle and demonstrated
        to be well-versed in stealth, taking out an entire group of soldiers from
        the shadows. She was hired by Seth, Kolin and another unnamed organization
        to be their agent. Has a good memory and never forgets a route she has taken.
        Controls half the criminal underworld of Metro City and could take over the
        whole city if she wanted. Became extremely rich by teaming up with C. Viper
        and double-crossing a number of organizations. Manipulated the ICPO, forcing
        Chun-Li into retirement. In spite of her attitude, Juri is an effective teacher,
        passing her fighting style onto the Player)
