- id: claim-weaknesses-cef15b04
  section: weaknesses
  axis: weakness
  text: 'Arrogant Notable Attacks/Techniques: Few swords and a gun *Dragon Uppercut:
    Heihachi performs an all-out uppercut that sends the opponent straight up in the
    air. *Hell Axle: Heihachi jumps and attacks the opponent with a horizontal kick
    with the left feet followed by a right roundhouse kick. *Broken Toy: Heihachi
    will grab the opponent by the neck, and then will send the opponent away with
    a powerful left-handed throw. *Geta Stomp: Heihachi will stomp the opponent in
    the ground with his foot. *Shockwaves: Heihachi proceeds to punch the ground,
    creating a shockwave that stuns the opponent. *Lightning Hammer: Heihachi charges
    and attacks the opponent with a powerful electric chop. *Rage Art: Heihachi strikes
    the opponent once and launches them into the air with a Rising Uppercut, then
    he finishes with his Demon Breath attack as the opponent falls to the ground.
    This move is more powerful and effective when he is at full power. ==Gallery==
