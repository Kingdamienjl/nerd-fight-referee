  name: '*Verse universal abilities *Superhuman Physical Characteristics *Acrobatics
    *Extrasensory Perception (Power Reading) (multiple characters can sense through
    the others fists their negative desire and if they have some power or not) *Possibly
    Non Physical Interaction (fighters are capable of interacting with Kazumi like
    normal despite being a ghost, Heihachi is capable to fight a shadow version of
    his evil self as well as if physical) *Skilled in Martial Arts (mastered the Mishima
    style fighting karate) *Automatic Translation (all characters in the cast can
    understand each other speaking their respective languages) *Limited Fourth Wall
    Break (the clash shockwave with Kazuya makes the "Cameraman" camera to shake before
    it stabilizes, along him turning at the "Cameraman" for who is next) *Limited
    Body Control (can increase his muscles in his body, abnormally, like the other
    male characters) *Chi Manipulation and Durability Negation (scales from Kazuya,
    who used his ki to punch Heihachi to the chest all the way outside of his back
    with it, causing his heart to eventually stop beating, they can enhance the strength
    of their attacks) *Electricity Manipulation (Mishimas can generate electricity,
    which was used before to stun people, they can also nullify energy based attacks
    like ki as well with it, their ability is good enough to control actual lightning
    from the sky in tandem with their own attacks) *Aura (explosive) (Mishimas can
    generate auras out of their body, with Warrior Instinct, his aura can get very
    explosive when in use) *Limited Life Manipulation (Warrior Instinct gives him
    the capability to take away someone life energy, as well as giving himself more
    life energy to recover himself from) *Healing (capable of healing himself) *Non
    Physical Interaction and Energy Projection (can hold the electricity from a lightning
    bolt in his fist and punch a projection of their fist made out of it out of the
    opponent back) *Pocket Reality Manipulation (created his own personal dimension)
    *Limited Power Nullification and Negation (he can nullify physical blows thrown
    at him, even negate the armor status effect of his opponent) *Vibration Manipulation
    (can stumble opponents or launch opponents in the air from standing up or laying
    on the ground) *Surface Scaling (climbed a flat surface all the way back after
    falling down in it) *Self-Sustenance (Type 1 and 2) and Possibly Space Survival
    (scales from Jin and Kazuya, whom survived in outer space as normal humans, after
    falling from orbit without their devil gene, scales from Jin, whom didnt drown
    when descending down in the ocean and also has survived days in the desert, was
    knocked unconscious after the Jack ambush till the 5th tournament was over, which
    was announced around 1-2 months ago in-universe) *Fire Manipulation (ignites fire
    out of his attacks)'
