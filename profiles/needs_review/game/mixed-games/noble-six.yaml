      value: Island level (Has A-rank strength, making him comparable to Heracles.
        Traded blows with Saber using an iron pole. While alive, he was able to crush
        Gareth's skull), Small Country level with Arondight (While a Berserker, Lancelot's
        Noble Phantasm is boosted to A++ rank, making it comparable to Excalibur)
      source_id: character-stats-profiles-noble-six
