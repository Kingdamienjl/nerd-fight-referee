    - field: weaknesses
      value: 'Berserker is completely insane, and seeks death, preferably at King
        Arthur''s hands. Drawing Arondight will seal Knight of Owner and For Someone''s
        Glory. Cannot fight in Spirit Form. Notable Attacks/Techniques: === Noble
        Phantasms === For Someone''s Glory: Not For One''s Own Glory: A black fog
        that shrouds Berserker, materialized from Lancelot''s tradition of winning
        fame under disguises. Combined with his armor, which covers all of his body,
        this ability passively conceals his identity, making it impossible to discern
        his statistics, true name, and Noble Phantasms. His outline constantly shifts,
        making it impossible to identify him or see his face even if he takes off
        his helmet, and he appears almost like a hallucination. The true use of this
        ability would be in imitating other Heroic Spirits with great military exploits,
        taking their form, but due to Lancelot''s insanity, he cannot use it properly,
        requiring the use of a Command Spell to do so, and he can only use it once.
        Even so, his insanity remains, along with his furious blood-red eyes. Knight
        of Owner: A Knight Does Not Die with Empty Hands: The embodiment of the legend
        where Lancelot had to fight Phelot unarmed and defeated him with an elm branch.
        As opposed to a weapon, it manifests as an ability retained by his body. It
        allows him to wield anything that he recognizes as a weapon - a branch, chopsticks,
        logs, an iron pole, a sword, a fighter jet, firearms - as a Noble Phantasm.
        Even the Noble Phantasm of other Servants are subject to this ability, allowing
        him to take ownership of them by grabbing them best demonstrated in his fight
        against Gilgamesh where he took hold a few of his treasury that was thrown
        and using them against many others. Normal weapons are transformed into D-rank
        Noble Phantasms, while the Noble Phantasms of other Servants retain superior
        ranks. His bloodthirst and hate taint the weapons he wields, shrouding them
        in darkness and covering them in pulsating black veins. His mastery of combat
        allows him to wield any weapon he takes control of with Knight of Owner as
        if it were an extension of his own body. This ability even applies to jets,
        allowing him to pilot an F-15J Fighter Jet and take full control of all its
        systems with ease. It gains the ability to far surpass its original capabilities,
        keeping up with Gilgamesh''s Vimana while Berserker piloted it masterfully,
        executing otherwise impossible feats of piloting prowess. He can take control
        of the missiles it launches so that they track down opponents, and while the
        bullets of a fighter jet would generally be easily avoided or outright ignored
        by a Servant, they become fast and powerful enough to be a serious threat
        under the effects of Knight of Owner. Any firearms wielded by Berserker are
        similarly boosted in strength. Arondight: The Unfading Light of the Lake:
        Lancelot''s holy sword, the counterpart of the greatest holy sword, Excalibur.
        It is a Divine Construct as well, engraved with Fairy Letters. It was only
        given to the strongest, bravest, and truest knight of its time, the Knight
        of the Lake, Lancelot. After Lancelot used it to slay his fellow knights to
        rescue Guinevere, it has lost its status as a holy sword, and his madness
        has stained it black. It is still his truest Noble Phantasm, however, sealing
        his other two and increasing all of his parameters once drawn, on top of doubling
        the success rate of his saving throws. Arondight is also a dragon-slaying
        weapon due to the anecdote of Lancelot slaying a dragon, making it extra effective
        against those with a Draconic attribute. === Class Skills === Mad Enhancement:
        The source of the Berserker class''s power, raising their statistics in exchange
        for a loss of sanity. Lancelot''s C rank Mad Enhancement boosts all his skills
        save for his Luck and Mana, but it renders him incapable of speaking or thinking
        clearly. === Personal Skills === Eternal Arms Mastership: An ability born
        from one''s extreme skill in combat. Lancelot, the greatest Knight of the
        Round, is an unrivaled battle master in his era. His technique is ingrained
        into every aspect of his body, a complete merger of his body, mind, and skills
        that allow him to make perfect use of his abilities even when under the effects
        of mental interference. Magic Resistance: An innate ability that grants protection
        against magical effects. Unlike the Resistance effect that merely rejects
        Magical Energy, this ability cancels the spells altogether. Originally D-rank
        due to a magic amulet, Berserker''s Magic Resistance has degraded to E due
        to his insanity, doing nothing more than just negating some of the damage
        dealt by magical attacks and leaving him unable to cancel even the most minor
        and basic spells. Protection of the Fairies: A blessing from Elementals that
        raises Berserker''s Luck in dangerous situations on the battlefield. Reverse
        Flow of Mana: A skill whose canon effects are currently unknown. == Others
        == Notable Victories: Notable Losses: Inconclusive Matches: Category:Dura'
