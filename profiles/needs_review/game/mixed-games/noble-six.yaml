        \ Oscuras: A powerful Cero that can only be used by the Espada in their Resurrecci\xF3\
        n. It increases the attack power by an order of magnitude. Bala: An Arrancar\
        \ ability similar to Cero, except it's weaker and 20 times faster. Descorrer:\
        \ A technique used by Arrancar to travel between Hueco Mundo and other worlds,\
        \ creating a spiritual pathway called a Garganta with a gesture, walking through\
        \ this portal to arrive at their destination in an instant. Hierro: A defensive\
        \ technique used by Arrancar that toughens their skin by reinforcing it with\
        \ condensed Reiryoku, allowing an Arrancar to confront an armed Shinigami\
        \ with their bare hands. All Arrancar use this ability in some form to gain\
        \ their supernatural toughness, but even an exceptionally powerful Hierro\
        \ can be bypassed by focusing one's Reiryoku to a finer, sharper point. Pesquisa:\
        \ A perception technique used by Arrancar, which sends out a pulse that detects\
        \ nearby sources of Reiatsu and gauging their power. Son\xEDdo: A technique\
        \ used by Arrancar that allows for high-speed movement, effectively analogous\
        \ to the Shunpo used by Shinigami, and used in bursts to traverse distances\
        \ quickly and fight at these high speeds. Resurrecci\xF3n: The Arrancar equivalent\
        \ of a Shikai/Bankai, this form allows an Arrancar to unleash their true power\
        \ as a Hollow. Tibur\xF3n: Harribel's Resurrecci\xF3n. It's release command\
        \ is Destroy, and when released, it surrounds her in a surge of water from\
        \ which she exits, with the remains of her mask growing to become a collar\
        \ and transforming Tibur\xF3n into a large, broad pata resembling a shark's\
        \ tooth. This transformation allows Harribel to create and control water,\
        \ producing it from the gill slits on the sides of her sword. Her physicals\
        \ are greatly increased as well. * Ola Azul: A technique used by Harribel\
        \ prior to releasing her Zanpakut\u014D, which gathers Reiryoku within the\
        \ hollow part of blade, which she releases with a slash, firing a blade of\
        \ energy at her target. She can concentrate this energy within her blade to\
        \ release it in close combat while attacking. * Cascada: Harribel releases\
        \ a violent surge of water at her target, a torrent that can travel over and\
        \ flood multiple city blocks. * Hirviendo: Harribel points Tibur\xF3n forwards,\
        \ boiling any water around it, including ice, and dissipating it around herself\
        \ harmlessly. * La Gota: Condensing large amounts of water around her blade,\
        \ Harribel then fires it as a concentrated blast shaped similarly to a shark's\
        \ tooth. She can fire multiple of these blasts in quick succession. * Trident:\
        \ Harribel infuses her sword with energy, and then releases it in a rapid\
        \ series of three shots with a slash, an attack powerful enough to cleave\
        \ an opponent in half. Caja Negaci\xF3n: A device provided to the Espada by\
        \ Sosuke Aizen, the Caja Negaci\xF3n can be used to isolate a target, trapping\
        \ them in in a separate dimension from which they cannot escape, but it cannot\
        \ hold those of Espada-level strength for long. Category:J989 Category:Tier\
