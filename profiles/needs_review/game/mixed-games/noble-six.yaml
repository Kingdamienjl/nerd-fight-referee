    - field: speed
      value: Speed of Light, with possibly FTL reaction and combat speed (Kept up
        with Saber. Caught weapons from the Gate of Babylon and kept up with Gilgamesh
        when he was piloting Vimana)
      source_id: character-stats-profiles-noble-six
