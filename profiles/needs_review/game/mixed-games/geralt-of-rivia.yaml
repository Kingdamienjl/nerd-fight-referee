    have abnormal pain resistance) *Limited Resistance to Magic (As Yennefer stated
    in The Last Wish, Geralt has "quite a bit of resistance to magic", however it''s
    unknown what specific magic she has meant) *Ice Manipulation, Heat Manipulation
