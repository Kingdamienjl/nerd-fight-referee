        \ way a human thinks.] This is the peak of all things and the peak of intelligence.\
        \ So high that the lower ladder of concepts has lost its meaning. All that\
        \ was below disappeared. The feeling of footing is already lost, an independent\
        \ return to human nature is no longer possible. This should also be the boundary\
