        \ upward multiple times, not with just time. After undergoing various forces,\
        \ these are the steps where you are no longer functionally human. Even ideas\
        \ such as love are this high up. Concepts like non-dualisms are irrelevant.\
        \ Passing through ideas of infinity. Reaching a layer that he can't comprehend,\
        \ this is the level that is the pinnacle of human conceptualization. The visitor\
        \ is already beginning to understand the problem of boredom, which is characteristic\
