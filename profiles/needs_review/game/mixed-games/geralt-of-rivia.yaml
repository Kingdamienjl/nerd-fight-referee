    text: Superhuman. Able to keep fighting with many opponents at once and can still
      cast signs even while poisoned by potions and damaged for a long time. Has a
      very high tolerance for pain that lets him keep fighting, ignoring his wounds,
      and can survive for a long time with wounds that would kill a normal man. Went
      through rigorous swordsmanship training in Kaer Morhen and survived the Trial
      of the Grasses. Eskel explains that only four out of ten children usually survive
      it. Fought for a long time during the Battle of Kaer Morhen and even after this,
      he wasn't showing any signs of being tired. Could also act for weeks during
      the war with little to no rest. Has traveled for several decades to hunt monsters.
      Scales to a witcher named Kiyan, who was forced to participate in a mage's experiment
      that tested how much physical and mental endurance witchers have, even though
      he was mentally broken and didn't eat or drink anything in years, he could still
      fight with Geralt.
