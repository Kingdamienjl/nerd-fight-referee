        life per hit, healing Geralt) *Statistics Amplification (With Olgierd''s sword,
        Iris. At cost of Geralt''s vitality he can increase his attack power greatly
        by charging Iris with his life energy) *Fire Manipulation, Status Effect Inducement
        and Statistics Amplification (With Aerondight. Each blow of Aerondight increases
        its attack power by 10%. Charges are lost over time or when receiving damage.
