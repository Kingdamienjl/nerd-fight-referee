  intelligence:
    text: 'Gifted. Incredibly skilled monster hunter and alchemist with many decades
      of experience trained and carefully developed from birth for combat and missions.
      He was trained by Vesemir, a witcher with over a century of experience at the
      time. As a witcher, Geralt is highly knowledgeable about the anatomy and weaknesses
      of humans and monsters. He is also a wise individual, intelligent in handling
      social situations and bargaining. Could also find a way to win a game with Gaunter
      O''Dimm and find out where to find him in his world with his own rules to save
      Olgierd von Everec. Even as a younger man, Geralt has proved to be a talented
      monster hunter, developing his abilities and wisdom about the world and has
      always been shown to learn from his mistakes. Across his adventure, Geralt has
      met and dealt with hundreds of leaders, generals, kings, monarchs et cetera.
      Despite not being much into politics, he knows more about it than average witchers.
      He took parts in many diplomatic situations and has assisted a few kings/queens
      like Foltest and Meve during their battles. As a monster hunter, and one of
      the most experienced and skilled at that, Geralt knows possibly every genre
      of monsters in his own world, ranging from wraiths, spirits, vampires, werewolves,
      succubi, elementals, insectoids, necrophages to even genies like Djinns and
      many more. Not only that, but he also had fought with and defeated countless
      powerful sorcerers, warriors with unique abilities, and vastly intelligent humanoids,
      and has fought with a plethora of men at once plenty of times (for example,
      when he fought with the army of Wild Hunt with his fellow witchers and stalemated
      them and infiltrated the Nilfgaardian base in TW2 during the war. Yet, it''s
      only a small chunk of impressive feats he has done in the series). He has extensive
      knowledge about alchemy (mainly for creating potions and oils for each battle
      he goes into), lifting various curses, and most importantly, weapon usage (As
      every witcher not only must know the art of swordplay, which is the main strength
      of Geralt, but also many other weapons, like battleaxes, picks, crossbows or
      slingshots). His swordsmanship is very versatile, as he is like a "dancer" in
      battle with many developed sword styles. Witchers use unique style, commonly
      named "spins, pirouettes and feints", for example shown here, here and here,
      and never dares to lose his skill by training in spare time. This level of skill,
      combined with his superhuman speed, strength, agility, and reflexes, is marvelously
      effective in combat and often allowed him to defeat his enemies, even if they
      were comparable or even superior physically. Geralt has also shown to be a quite
      decent leader during Battle for the Bridge on the Yaruga and an excellent and
      precise detective many times in the series when he needed to find traces of
      monsters to find and kill them, most notably during Mandragora Party, where
      he was able to correctly deduce the whole event, using only what was left of
      the room, such as broken mirrors, bloodstains on the floor and walls, positions
      of objects (which should not be in such a position) and objects left in random
      places. Standard Tactics: Geralt''s strategy and fighting style heavily depend
      on what type of opponent he is fighting against and what his opponent is using
      against him. This includes the choice of his Signs, potions, oils, and elixirs
      according to his situation. This means that Geralt is adapting to his opponents,
      essentially in such ways: *Humans and Warrior type enemies: Geralt usually begins
      a fight against this type of opponent by using his steel sword. Depending on
      the situation, Geralt kills his opponent at his first opportunity. If he needs
      any information or favor, he tries to defeat that enemy without killing him.
      Against normal humans, he rarely uses his Signs (If he already uses his Signs
      against humans, his most common choice are Aard and Igni signs, and if he doesn''t
      want to fight his opponent or specifically sneak to him, Axii, but it mainly
      happens in regular conversations), unless such an opponent has abilities that
      any ordinary human would not have, such as magic or supernatural powers. The
      same applies to his potions. *Monsters and enemies with supernatural'
    source_ids: *id002
    confidence: 0.8
