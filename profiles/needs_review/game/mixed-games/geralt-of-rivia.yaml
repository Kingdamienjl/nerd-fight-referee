        *Statistics Amplification (Euphoria mutation can increase strength and sign
        intensity by over 3x as he gets more poisoned by his own potions. Mutated
        Skin mutation increases durability as more adrenaline is flowing) *Ice Manipulation
        (Can casually freeze up to four humans solid with Piercing Cold) }} |-|Resistances=
        *Disease Manipulation (Witchers have a very high resistance, if not practicality
        immune to all known diseases) *Mind Manipulation (It was stated that witchers
        cannot be bewitched by a mage, and they''re proven to be highly resistant
        to psionic spells. It took a mage half an hour to take complete control of
        a witchers mind) *Poison Manipulation and Acid Manipulation (Witchers are
        stated to be immune to poison, with only few being able to harm them. His
        mutated body quickly manages to neutralize the harmful alkaloids) *Extremely
        high pain tolerance (Geralt after being cut many times or having his blood
        sucked by Unseen Elder isn''t showing any signs of suffering. Also he completely
        ignored slice on his chest and witchers overall are known to have abnormal
        pain resistance) *Limited Resistance to Magic (As Yennefer stated in The Last
        Wish, Geralt has "quite a bit of resistance to magic", however it''s unknown
        what specific magic she has meant) *Ice Manipulation, Heat Manipulation and
        Fire Manipulation (As said in Kiyan questline in the Laboratory Notebook,
        the Kiyan witcher was subjected to inhumane experiments "The subject has been
        tortured, poisoned, burnt, frozen, starved and dehydrated, and despite it
        all his body continues to function", which Geralt scales to) ===With potions:
        === *Hypnosis (With Enhanced Cat potion) *Enhanced Resistance to Acid Manipulation
        (With Bindweed potion) *Stunning (With Chort decoction) *Near-Immunity to
        Pain Manipulation (Can become immune to pain with his potions)'
