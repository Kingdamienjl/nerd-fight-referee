    - field: weaknesses
      value: 'Boredom Notable Attacks/Techniques: |-|Beatrice=As the Endless Witch,
        Beatrice has the ability to control life and death and can revive and kill
        people as she pleases. She can also repair damaged objects and served as alchemical
        advisor to the Ushiromiya family, rumored to be the one who gave Kinzo the
        ten tons of gold. Beatrice is also shown levitating in the air, teleporting,
        and turning into a swarm of golden butterflies. In the 4th game, she is shown
        burning Kinzo to death just by thinking about it. She uses her golden pipe
        as a wand and in Twilight of the Golden Witch can transform it into a golden
        duel sword, as seen when she fights Erika. Beatrice also has outstanding resilience
        and defense, as seen during her duel with Virgilia when she gets impaled by
        several spears only to heal herself soon after. Though she is said to be a
        witch in a beginner class, it is possible that she would be no match for anybody
        were she fully aware of her powers. EVA is also able to materialize Red Truth
        in the form of a sticky spider web that she can use to immobilize her victims
        or to lock them up in a bubble attached to the stick, so as to beat them senseless.
        |-|Ange=Ange inherited the titles of Golden Witch and Endless Witch from Eva,
        as well as the name Beatrice, thereby becoming ANGE-Beatrice. She was taught
        magic by MARIA through Maria''s diary.When ANGE-Beatrice''s magical abilities
        manifest, she is recognized as the Witch of Resurrection, as she was able
        to resurrect Sakutarou from the remainders of his vessel; Beatrice was unable
        to accomplish this, as she believed Rosa destroyed Sakutarou by denying his
        existence. Ange is also able to summon the Seven Stakes of Purgatory as well,
        even in areas full of anti-magic toxin. Because she hails from 12 years in
        the future, ANGE-Beatrice has developed a high-magical resistance, making
        her dangerous to witches, who see her as the ideal witch-hunting witch. While
        Ange herself denies the existence of magic, she admits that it can exist for
        others. Endless Magic: The signature magical system utilized by the Endless
        Witch, whose foundations lie upon the concept of infinity, be it as an endless
        repetition or an infinite expansion, hence allowing him to revert anything
        back to its original state by making them remember the form which they used
        to hold, repairing broken objects and resurrecting people from the dead, as
        well as allowing Beatrice to recover from fatal injuries by rewinding his
        body back to its original state, and creating infinity out of any number so
        long as it is not 0, modifying finite quantities so that they expand infinitely.
        Game Master: As Game Master, Beatrice exists on a higher plane of existence
        than everything else in her territory, and the world shapes itself to her
        will under this state, with even attacking her through conventional means
        being impossible without her direct permission, and she can similarly decide
        who enters and who leaves it. In addition, she can weave stories and tales
        on a far more advanced scale than other higher-order beings, being able to
        manipulate countless fragments to piece together her own plotline, as well
        as rewriting the resulting structure at will. Truths: Special moves utilized
        in debates between Witches and Humans taking place in the Meta-World, being
        statements denoted by specific colors which often manifest as conceptual weapons
        that directly target the enemy''s very existence in an attempt to deny it,
        and are thus impossible to physically avoid, forcing opponents to counter
        the attacker''s arguments with another truth. As the damage dealt by the Truths
        is conceptual, rather than strictly physical, they completely bypass conventional
        durability and allow Beatrice to skewer and even kill opponents much more
        powerful than herself. *Red Truth: Irrefutable, objective truth that needs
        no evidence or proof to demonstrate its validity. In essence, the Red Truth
        takes an unobserved possibility existing alongside infinitely many and asserts
        it as the ultimate truth, being capable of completely denying an opponent''s
        existence, body and soul, and sending them to the depths of oblivion without
        hope of recovery. *Blue Truth: A theoretical scenario made with the purpose
        of directly denying the enemy''s arguments and existence, whose true validity
        is unclear but nonetheless takes precedence over any statements spoken in
        basic white text, while being inferior to the Red Truth. It normally assumes
        the form of several stakes which skewer and impale opponents, damaging them
        on a conceptual level and being impossible to remove unless their falsehood
        is directly declared with the Red Truth; otherwise, that which is spoken in
        blue will be asserted as the truth and grant victory to the attacker, while
        erasing their opponent''s concept entirely. **Purple Truth: A new Truth introduced
        by Bernkastel for her game. This Truth has power comparable to the Red Truth
        in that all words spoken in this color are deemed automatically true without
        any evide'
