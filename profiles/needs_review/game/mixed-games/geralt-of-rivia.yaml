    at the time of his death and was just barely an old man by witcher standards)
    **Self-Sustenance (Type 2 - A witcher named Kiyan who was subjected to mage experiments
    didn''t eat anything for years and could still fight, and was described to "eat
    and drink by himself") **Regeneration (Low-Mid - can regenerate a big hole in
    his neck in a few months. healed from getting brutally bitten in the neck by Dettlaff.
    Eskel explains that witcher''s wounds heal much faster than normal humans'') **Limited
    Body Control (As stated in The Witcher 3 Universe Compendium, witchers are able
    to regulate the speed of their pulse and the flow of adrenaline, giving them unparalleled
    reflexes and strength) **Enhanced Senses (Vision, Hearing, and Smell - Has night
    vision, highly enhanced senses of smell and hearing, and can see through walls
    with certain potions. Could casually notice that Scoia''tael members are aiming
    arrows at him and Zoltan without even seeing them and hear them breathing, knowing
    their condition, and can detect the scent of things used long ago. Straining his
    senses allows him to smell and hear things hundreds to thousands of meters away.
    His Medallion can sense Places of Power, magic and nearby items. Can even see,
    hear and interact with ghosts, as seen when he talks with the von Everec ghosts
    in Hearts of Stone. Normal humans like Shani couldn''t sense them) ***Minor Instinctive
    Reaction (Could instinctively block an unexpected blow in the dark, instantly
    dodged a creature''s swing in sleep) **Acrobatics (Hypermobility, All-Terrain
    Mobility, and Self-Momentum - Geralt is incredibly agile, and can jump off castle
    walls with taking no damage. Expert at rolling and using complex maneuvers in
    battle, which he uses a lot) *Supernatural Willpower (Has lasted more than a century
    fighting monsters and bandits for a few crowns and barely living. Has experienced
    the death of his friends, loved ones and himself but it hasn''t demoralized him
    from still protecting the ones he still has. Fought the entire armada of the wild
    Hunt with the help of Letho of Gulet and a few other witchers and didn''t give
    up until the battle ended in a stalemate, all of which was made so he could rescue
    Yennefer of Vengerberg. Other countless examples) *Weapon Mastery (Geralt is one
    of, if not the greatest swordsman in entire series, with skill matched only by
    a limited few. He also gained the reputation of "the best swordsman the North
    has ever seen". Is also a proficient and precise user of a crossbow) *Martial
    Arts (Completely outdone Striga in a fistfight, won many fistfights with fighting
    masters in tournaments around the world) *Non-Physical Interaction (Can harm the
    ghosts of the von Everecs, which are now mere souls and also intangible. Can also
    attack spirits while they are intangible with certain oils/materials, and attack
    beings with Elemental Intangibility) *Analytical Prediction (Easily kept up with
    a speedy and powerful creature by predicting its movements, immediately knew Ciri''s
    wrong move right before she failed it) *Information Analysis and Preparation (Every
    witcher prepares to their fights by creating potions/sword oils and analyzing
    opponent''s weaknesses and powers. Geralt''s preparation allows him to create
    numerous potions, oils and improve in physical aspects by training and mutations)
    *Stealth Mastery (Witchers are known for not leaving sound with their footsteps.Also
    Geralt can sneak to soldiers to stun them) *Magic (Can perform rudimentary but
    effective magic with his signs) *Pseudo-Time Slow (With Heliotrope, can slow down
    time in a bubble-shaped area) *Forcefield Creation, Purification, and Attack Reflection
    with Quen (Reflects 50% of the damage it takes back at the attacker. Geralt can
    cast Quen as a body shield and bubble forcefield as described below and can remove
    status effects like burning, poison, or acid from him) *Fire Manipulation (With
    Igni) *Mind Manipulation (With Axii) *Telekinesis (With Aard) *Statistics Reduction,
    Poison Manipulation and Electricity Manipulation with Yrden (Yrden significantly
    slows down enemies, and also can poison and shoot lightning, as well as force
    spirits to become tangible) *Sleep Manipulation and possibly Limited Memory Manipulation
    with Somne (Somne is a sign that puts enemies under sleep and can possibly erase
    memories of that. After Geralt used it on Nimue, she couldn''t remember meeting
    and talking to him) *Sound Manipulation (With Supirre) *Illusion Negation (With
    the Eye of Nehaleni) ===With bombs:=== *Explosion Manipulation (with Grapeshot)
    *Light Manipulation and Status Effect Inducement (with Zerrikanian Sun) *Fear
    Manipulation (with King and Queen) *Madness Manipulation (with Red haze) *Possibly
    Power Nullification (with Moon Dust and Dimeritium'
