    3x as he gets more poisoned by his own potions. Mutated Skin mutation increases
    durability as more adrenaline is flowing) *Ice Manipulation (Can casually freeze
    up to four humans solid with Piercing Cold) }} |-|Resistances= *Disease Manipulation
    (Witchers have a very high resistance, if not practicality immune to all known
    diseases) *Mind Manipulation (It was stated that witchers cannot be bewitched
    by a mage, and they''re proven to be highly resistant to psionic spells. It took
    a mage half an hour to take complete control of a witchers mind) *Poison Manipulation
    and Acid Manipulation (Witchers are stated to be immune to poison, with only few
    being able to harm them. His mutated body quickly manages to neutralize the harmful
    alkaloids) *Extremely high pain tolerance (Geralt after being cut many times or
    having his blood sucked by Unseen Elder isn''t showing any signs of suffering.
