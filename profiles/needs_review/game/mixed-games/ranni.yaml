    - field: weaknesses
      value: 'The small scar-like spot on its body serve as a weak point, otherwise
        none notable Notable Attacks/Techniques: *Hand Slams: The Elden Beast slams
        its left hand into the ground. *Yellow Fire Breath: The Elden Beast spews
        out yellow fire, which spreads in a wide area. *Sword Swing: The Beast backs
        a short distance away and swings its sword. *Swimming Sword Swing: The Elden
        Beast swims away before returning with a large sword swing. *Black Hole Teleport:
        The Elden Beast quickly swims into a black hole, which teleports it away before
        exploding. *Sparkling Dust: Its hand starts glowing and it swipes in a forward
        arc, leaving behind a cloud of glittering magic that explodes. *Magic Grab:
        Its left hand will begin glowing with magic energy, and it will attempt to
        grab the player. If successful, many glowing spikes will be shot into the
        player, dealing massive damage. *Elden Ring Blast: The Elden Beast swims away
        and begins levitating in the air, forming the Elden Ring in the sky, and another
        one on the ground that closes in before exploding. *Golden Wing Spears: The
        Elden Beast shoots many magical spears from its wings, which chase after the
        player before crashing into the ground. *Flying Flame Sword: The Elden Beast
        flies through the air shortly before its sword catches on fire, after which
        it crashes into the ground and swings. *Chasing Stars: The Elden Beast shoots
        out a large amount of small magic orbs that chase after the player for a long
        period of time. *Flying Chasing Stars: The Elden Beast dives into the ground
        and comes out flying, doing the Chasing Stars attack as it flies. *Sword-Swing
        Smash: The Elden Beast swings its sword twice before grabbing the blade and
        smashing it into the ground. *Divebomb: The Elden Beast flops on its belly,
        flies for a short bit, then crashes into the ground. *Sparkling Dust Line:
        The Elden Beast shoots out a long row of clouds that looks like a galaxy,
        which then explode one after the other. *Flying Sword Crescents: Its sword
        catches on fire and it swings forward 4 times, sending a crescent of magic
        with each swing. The last two swings will be delayed. (The last crescent can
        diverge and hit the cooperator/Ash summon). *Flaming Stab: The Elden Beast
        sets its sword on fire and stabs the ground, creating an explosion when it
        pulls the sword out again. *Spin Swing: The Elden Beast spins in a circle
        and swings its sword. *Flaming Sword Combo: The Elden Beast sets its sword
        on fire and alternates between rapid swings and downward stabs before doing
        a large, angular spin-swing. *Wave of Gold: The Elden Beast charges sword,
        swings and puts a large amount of damage in the shape of a cone at the player.
