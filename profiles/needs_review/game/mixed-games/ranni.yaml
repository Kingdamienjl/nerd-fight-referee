    - field: weaknesses
      value: 'Has almost completely lost her mind by the time the Tarnished reaches
        her in the Academy and is barely a shadow of her former self | None notable
        Notable Attacks/Techniques: *Phase 1 **Light''s AoE: When she is recovering
        after her bubble has been broken, Rennala charges light into her hand and
        unleashes a powerful AoE attack on her location. **Scholar Tomes: Rennala
        will levitate a few Juvenile Scholars into the air and transform them into
        tomes, then send them after the player. * Phase 2 **Comet Azur: Legendary
        sorcery devised by Azur, primeval sorcerer. Fires a tremendous comet in a
        torrent akin to the distant starry expanse, the place said to be the origin
        of glintstone. Rennala casts a powerful horizontal energy beam. **Glinstone
        Stars: Rennala arches her staff to drop 4 energy drops from over her head
        as she moves back **Glinstone Cometshard: One of the glintstone sorceries
        of the Academy of Raya Lucaria. Fires a magical comet with a trailing tail.
        **Star Shower: The most difficult to master of the Olivinus Conspectus sorceries.
        Swings her staff in an arc, summoning magical stars which fly at the player
        after a short delay.. **Glintstone Pebbles: One of the most basic glintstone
        sorceries developed by the Academy. Summons a line of crystals in front of
        her, then sends them flying at the player **Shattering Crystal: Rennala creates
        a mass of crystal, then shatters it in a forward burst in a shotgun-like blast.
        **Renalla''s Full Moon: Rennala summons a small moon and curls up into it,
        before jumping back and sending it towards the player. The moon will explode
        after a short period. **Summon Creature: Rennala summons one of four creatures:
        a pack of four wolves, a Troll, a Bloodhound Knight, or a dragon. **Spinning
        Weapon: Defensive skill employed by Carian princesses. Channel magic into
