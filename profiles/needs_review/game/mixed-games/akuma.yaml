        combat applications without succumbing to its influence, something no one
        before could do. Has felled hundreds of opponents, exchanging thousands of
        strikes and engraving every moment into his every being.Street Fighter VI
        - Akuma's Character Story Has sculpted innumerous statues as keepsakes of
        each battle to the death he has fought. Has entered several tournaments and
        has always been unsatisfied by anything short of a battle to the death. His
        journey began with the defeat and killing of his master Goutetsu, the man
        who at the time stood at the pinnacle of the "Assassin's Fist". Over the course
        of his life Akuma has proved himself against other extraordinary martial artists
        such as Gouken, Gen and Oro, even defeating the first two on at least one
        occasion each. Always proved himself beyond Ryu's reach, who failed to provide
        him with an enjoyable battle until the events of Street Fighter VI. Is implied
        to have fought M. Bison in a fair match to test his skill.Street Fighter Alpha
        2 - Akuma's Ending Belittled the skills of the Player, who at that point had
