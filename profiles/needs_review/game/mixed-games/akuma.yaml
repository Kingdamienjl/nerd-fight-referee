  intelligence:
    text: Genius in combat (Akuma is widely renown as a legendary martial artist,
      to the point of having earned the title of "Master of the Fist". He has refined
      his own version of Ansatsuken to terrifying perfection, not having any hint
      of inexperience to show in regards to battle and never ceasing to improve as
      time goes on. Flawlessly controls the Satsui no Hado, harnessing its several
      combat applications without succumbing to its influence, something no one before
      could do. Has felled hundreds of opponents, exchanging thousands of strikes
      and engraving every moment into his every being.Street Fighter VI - Akuma's
      Character Story Has sculpted innumerous statues as keepsakes of each battle
      to the death he has fought. Has entered several tournaments and has always been
      unsatisfied by anything short of a battle to the death. His journey began with
      the defeat and killing of his master Goutetsu, the man who at the time stood
      at the pinnacle of the "Assassin's Fist". Over the course of his life Akuma
      has proved himself against other extraordinary martial artists such as Gouken,
      Gen and Oro, even defeating the first two on at least one occasion each. Always
      proved himself beyond Ryu's reach, who failed to provide him with an enjoyable
      battle until the events of Street Fighter VI. Is implied to have fought M. Bison
      in a fair match to test his skill.Street Fighter Alpha 2 - Akuma's Ending Belittled
      the skills of the Player, who at that point had already went through the events
      of the main story, acquired the fighting styles of at least three fighters (and
      potentially of all the other characters available) and was repeteadly stated
      to be a prodigy at performing techniques and learning fighting styles. Quite
      knowledgeable in mysticism and philosophy, as displayed by his speeches and
      musings)
    source_ids: *id002
    confidence: 0.95
