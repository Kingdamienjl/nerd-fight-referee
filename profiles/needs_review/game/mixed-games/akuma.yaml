  axis: weakness
  text: 'None notable Notable Victories: *Defeated and killed Goutetsu. *Defeated
    and almost killed Gouken.Street Fighter IV *Defeated Gen, twice. *Defeated and
    killed M. Bison.Street Fighter II *Killed Gill.Street Fighter III: 2nd Impact
    *Defeated and killed Torrent of Power Necalli. *Effortlessly defeated Power of
    Nothingness Ryu, stating that he wasn''t even equal to him. *Contended with Oro.Street
    Fighter 30th Anniversary Collection Notable Attacks/Techniques: |-|Unique Attacks=
    *Zugaihasatsu ("Cranium Crush Killer") / Skull Splitter: An open palm chop to
    the opponent''s head. *Resso Snap Kick: A long-reaching snap kick. *Rago High
    Kick: A vertical kick that sends the opponent flying upward. *Viscera Piercer:
    A quick punch to the midsection followed by a high chop. *Bone Crusher Axe Kick:
    A short-ranged knee followed by an axe kick to the head. *Kikoku Combination:
    A combination consisting of a straight punch, a short uppercut and a roundhouse
    kick. *Tenmakujinkyaku ("Sky Demon Air Blade Leg") / Tenmaku Blade Kick: A diving
    kick from above. *Oni Goroshi: A powerful lunging punch to the gut. *Souha Double
    Palm: A strong double palm strike delivered after blocking an incoming attack.
    *Kikokurenzan: A double roundhouse kick to the head. *Kongoken: Akuma delivers
    a straight punch, then pivots forward and hammers downward with his other fist.
    *Sekiseiken: Akuma leaps into the air and descends with a strong chop. *Tenha:
    An upward palm strike that hits vertically. *Kikoku Rentotsu: Akuma delivers a
    palm strike with his left hand, followed by another one with his other hand, knocking
    the opponent down. *Focus'
