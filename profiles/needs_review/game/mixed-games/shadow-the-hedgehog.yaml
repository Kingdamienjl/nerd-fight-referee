    - field: weaknesses
      value: 'His uncertainty regarding his past after Sonic Heroes made him somewhat
        vulnerable to manipulation, but is resolved by the end of Shadow the Hedgehog.
        Chaos Control drains Hero Mode quicker, and Chaos Blast does the same with
        Dark Mode. Removing his Inhibitors will drain his stamina quickly, but it
        takes a decent amount of time for him to burn out. He is prone to taking risks,
        dabbling with danger,Sonic the Hedgehog Zappar 2014 Interactive Annual App
        and will take extreme measures to achieve his goals; though he is not above
        tactical retreats when need be. His past would sometimes cause inner turmoil,
        but no longer becomes an issue by the end of Sonic Battle. | Same as before.
        Chaos Boost lasts for a limited amount of time, and drains even faster for
        each level. | If Shadow attempts to remove his Inhibitor Rings while in his
        Evolved state, the surge in power will likely cause him to explode. | Same
        as his Base Weaknesses before. As Zombot Shadow, he''s mindless and thus unable
        to make use of his Air Shoes or perform his techniques. | None notable {|
