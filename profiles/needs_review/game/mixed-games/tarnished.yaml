    - field: weaknesses
      value: "Completely devoted to the Golden Order and the Greater Will to the point\
        \ of refusing to allow anyone to reach the Erdtree. Margit's Shackles can\
        \ be used to pin him on the ground for some time in both forms. Due to his\
        \ hatred for his Omen curse, he will only unleash his cursed blood and his\
        \ Blood-related skills if he deems it absolutely necessary, otherwise he will\
        \ limit himself to using his light-based abilities. Notable Attacks/Techniques:\
        \ As Margit \u25BE= Phase 2=Same as before but with the additions of: *Hammer\
        \ Slam: Margit raises his left leg, before slamming his hammer down at anything\
        \ in front of him *Hammer Strike: Margit summons the spectral hammer onto\
        \ his shoulder, where he'll spin around slashing at his opponent with his\
        \ staff followed by his hammer *Hammer Leap: Margit jumps into the air and\
        \ slams his hammer down, generating a shockwave in front of him. This attack\
        \ is nearly identical to his Phase Change but it can now happen at any time\
        \ without warning *Weapon Combo: Margit will rapidly switch between his staff,\
        \ sword, and hammer in an all-out combo. *Sword Swing: Margit slashes his\
        \ sword at anyone in front of him *Sword Spin: Margit holds his spectral sword\
        \ above his head, where he'll spin around and attack with his sword and staff\
        \ in an orderly manner As Morgott \u25BE= Note: The intro implies Morgott\
