- id: claim-weaknesses-84e70604
  section: weaknesses
  axis: weakness
  text: 'Needs spirit points for some of his weapons, cannot spam his ninpo, healing
    takes time for him Feats: Respect threads Notable Attacks/Techniques: *Transformation:
    Ryu can transform into a falcon. *Wind Run Technique: Able to blindly sense where
    his enemies are, Ryu will quickly home in on the nearest enemy, even if out of
    his line of sight. *Wind Path: Ryu uses his opponent''s head as a footstool to
    jump off of. He also shows an adapted version of this move during the DOA tournaments,
    jumping off his opponent''s head with such force that it sends his opponent face
    planting head first into the ground. *Guillotine Throw: Ryu jumps over his opponent,
    grabbing them by the head against his shoulder and then does a centrifugal flip,
    throwing his opponent a long-distance or slamming hard into a wall. It can also
    be initiated through the use of his Wind Run Technique. *Thunderclap Kick: Ryu
    jumps kicks forward two times while dashing, knocking his opponent over. *Double
    Jump: After his first jump, Ryu can jump again without a need for physical structures
    to push off of. *Flying Bird Flip: While running up a wall, Ryu does a backflip
    jumping up further, he uses this technique to scale walls by jumping in between
    two walls until he reaches the top. During the Dead Or Alive tournament, he adapted
    this move by jumping on top of his opponent and locking his feet on the head and
    then backflipping his opponent. This variation is similar to the Guillotine Throw,
    but instead of tossing his opponent, Ryu slams them into the ground while standing
    above them with his arms crossed. *Water Running: Ryu''s ability to run and fight
    on the surface of deep bodies of water, similar to a Basilisk Lizard. *Shadowless
    Footsteps: Better known as wall-running, it is a basic ninja technique. *The Invisible
    Path: Wall running and then jumping from one wall to the other while still wall
    running. *Unrivaled Soaring: Similar to the Invisible Path Technique, except Ryu
    wall runs around a room from corner to corner scaling a tall building''s interior.
    *Reverse Wind Technique: A dodging maneuver, it originally started as a roll,
    but evolved into a ninja dash technique. It is now a ninja slide that Ryu can
    use offensively to initiate an attack, capable of stunning weaker enemies. *Furious
    Wind Technique: Similar to the Reverse Wind Technique, while blocking an attack
    that is landing, Ryu can quickly dodge the attack. This technique is used by Ryu
    when his guard is broken to avoid any further attacks. *Counter Attack/Sabaki:
    While blocking an attack, Ryu quickly launches a counterattack, attacking when
    his enemy is still recoiling from the strike. *Intercept: A unique technique where
    Ryu intercepts an attack just as it is about to land, resulting in a slight blue
    flash and preventing him from receiving any damage. This technique is even able
    to cancel damage from fireballs, flying pillars, and rockets. It is also able
    to charge an instant Ultimate Technique if there is enough essence floating around
    to fuel it, making it the final counterattack. *Projectile Deflection: Carefully
    timing a slash, Ryu can deflect projectiles such as arrows and fireballs back
    at his enemies. *Violent Wind: While running, Ryu quickly does a ninja dash and
    slashes his enemy at blinding speed. Ryu does a similar move during the Dead Or
    Alive tournament, using his arm instead of a sword to cut his opponent as he dashes
    through them, he also does a double dash as a tag team move if his partner is
    Kasumi. *Violent Gale: Multiples of the Violent Wind Technique, Ryu slashes over
    and over with blinding speed. *Flying Swallow: A swift lighting attack that can
    cut many enemies in an instant *Flock of Flying Swallows: Multiples of the Flying
    Swallows Technique, Ryu attacks with lightning-fast aerial slashes. The True Dragon
    Gleam Ultimate Technique features an advanced version of this technique where
    Ryu launches his enemy into the air and relentlessly flies at his enemy, slashing
    over and over. *Raptor: A variation of the Flying Swallow. During a Falcon Dive
    or Flying Swallow, Ryu will grab the enemy by the head for support, land behind
    them, and stab them with his sword. *Izuna Drop: A signature move of the Hayabusa
    clan, Ryu does this technique by launching his opponent into the air and then
    doing a spinning pile driver and slamming his enemy headfirst into the ground,
    creating a shockwave that damages any enemies nearby. Depending on the force Ryu
    uses, his enemy''s head may explode upon impact. Ryu has mastered this technique
    so well that he has adapted it to any weapon he happens to be using, creating
    many variations of the Izuna Drop, such as the River Styx Drop with the Eclipse
    Scythe and the Underworld Drop with the dual-wielded Blade of the Archfiend and
    True Dragon Sword. When performing this move without using weapons, Ryu launches
    the opponent to the air and teleport next to them to perform the Drop. *Underworld
    Drop: A technique used by Genshin, Ryu learned it after acqui'
