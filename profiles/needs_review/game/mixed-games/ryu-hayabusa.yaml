- id: claim-powers-and-abilities-5dc4d5fb
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses (Can use a 6th sense
    to sense new enemies, incoming attacks and directions for him to reach his goal.
    Has sharpened senses and thought process), Regeneration (Mid-Low; Healed slashes
    that critically harmed him by the Hayabusa Spirit. However, he cannot heal all
    his wounds and need to rest in order to happen), Teleportation (Can teleport short
    distances via Blink), Weapon Mastery (Is a master swordfighter and archer. Is
    amaster of virtually every type of weapon), Stealth Mastery, Martial Arts, Acrobatics,
    Surface Scaling (Can cling, climb on and run up walls), Magic (Is a master level
    in the art of ninja magic, also known as Ninpo), Projectile Reflection (When carefully
    timed, Ryu can deflect projectiles back at enemies with a sword slash), Invisibility
    (Can turn himself invisible in a smoke-filled area), Elemental Manipulation (Ryu
    learned to channel his inner body heat into a fireball projectile, he can gather
    the cold elements of the air creating big tornadoes of ice, summon huge fireballs
    or magnify his own bio-electricity and shoot outward towards surrounding targets),
    Fire Manipulation, Ice Manipulation, Electricity Manipulation, Telekinesis (Used
    to lift a platform), Summoning, Healing (Can summon several blue healing essence
    orbs in order to heal himself), Air Manipulation (Can summon tornadoes and swing
    his sword fast enough to produce vacuum wave cuts), Time Stop (Can use a hourglass
    that stops time around him. Lasts for 5 seconds), Duplication (Can summon a phantom
    double of himself, which will follow all of his movements and mimic his actions
    as a result), Illusion Creation (Via Art of Substitution), Power Mimicry (Ryu
    has also gained the ability to assume the powers, abilities, and form of anyone
    he sees, these are some of the arts of Ninpo that Ryu has mastered completely,
    Ryu is able to make himself immune to everything whilst casting Ninpo, Smoke Manipulation
    (Via Smoke Bomb), Transformation/Shapeshifting (Can transform into a tornado or
    a falcon, enabling him to travel anywhere around the world), Resurrection (Is
    able to tap into his guardian animal spirit "Hayabusa Spirit", that resurrects
    Ryu after he dies. Via Talisman of Rebirth), Statistics Amplification (Can increase
    his attack power and defence via Armlets), Resistance to Life-Force Absorption
    (Was still fine when the Sword of Chaos attacked him. The Sword of Chaos has been
    stated to suck up the life force), The Hayabusa Spirit grants Time Stop (Can stop
    the flow of time), Black Hole Creation (Is capable of creating small-scale black
    holes that quickly dissipate), jumping thousands of feet in the air, etc)
  source_ids: *id003
  decisive: true
  status: unverified
