- id: claim-weaknesses-2495eba3
  section: weaknesses
  axis: weakness
  text: "Needs to maintain a constant dose of a special serum to keep his Progenitor\
    \ virus (that gives him his superhuman powers) stable; however, overdosing on\
    \ the serum causes him to show symptoms of poisoning. Extremely arrogant to the\
    \ point of a god complex. With Uroboros, his weak point is located on the heart\
    \ in his chest. ==Gallery== File:Code Veronica_Wesker.png|Albert Wesker in Resident\
    \ Evil Code: Veronica File:The Mercenaries - Wesker - Resident Evil 4 Music Extended\
    \ File:Resident Evil 5 - Winds Of Madness (Extended & Looped) ==Notable Matchups==\
    \ Victories: Homelander (Dynamite Entertainment) Homelander's Profile (Speed was\
    \ equalized and Uroboros Wesker used. 8-B Homelander were used. Homelander had\
    \ prior knowledge and was bloodlusted. They started 6 meters apart, in Raccoon\
    \ Police Station.) Luke Skywalker (Canon) (Star Wars) Luke Skywalker's Profile\
    \ (Post A New Hope - Star Wars (Marvel 2015) comics Luke was used and speed was\
    \ equalized) The Joker (DCAU) The Joker's Profile (Speed was equalized. Post Virus\
    \ Wesker and Normal Joker was used) Yokai (Big Hero 6) Yokai's Profile (9-A versions\
    \ used and speed was equalized) Losses: Zhu Yuan (Zenless Zone Zero) Zhu Yuan's\
