- id: claim-powers-and-abilities-adebe16b
  section: abilities
  axis: hax
  text: 'Pre-Virus= *Superhuman Physical Characteristics *Martial Arts and Weapon
    Mastery *Social Influencing (Deception and Coercion: Tricked S.T.A.R.S Alpha team
    into the mansion in the Arklay Mountains in order get combat data for B.O.Ws,
    never getting suspected until the end. Threatened Barry Burton''s family to force
    Barry to work for himResident Evil 1) *Healing (Green Herbs and First Aid Spray
    are able to heal, Green Herbs mixed with Red Herbs boosts the healing effects)
    *Adaptation and Immunity to Disease Manipulation and Poison Manipulation (Wesker''s
    genetics allow him to be immune and adapt to most virus'') *Genius Intelligence
    |-|Post-Virus= Same as before, to a greater extent, including *Longevity (The
    Prototype virus allows Wesker to age slowly, similar to Jill) *Acrobatics (Hypermobility
    & Self-Momentum; Incorporates flips and spins in his attacks) *Afterimage Creation
    (Can run fast enough to leave afterimages behind) *Pseudo-Teleportation (Moves
    so fast that he appears to be teleporting) *Regeneration (Low-Mid normally; Can
    reattach his arm and regenerate from disembowelment even when severely exhausted.
    High-Mid Overtime; It''s suggested by Birkin that Wesker could regenerate from
    just a tissue fragment) *Limited Telepathy (Can command B.O.Ws that are infected
    with the T-Virus, can even delve into someone''s memories) *Resistant to Pain
    Manipulation (Can feel a B.O.W''s pain, able to endure and have it under control)
    *Resistant to Fire Manipulation (Endures Alexia Ashford''s fire) With Uroboros
    *Disease Manipulation and Poison Manipulation (Can infect others with Uroboros)
    *Bodily Weaponry and Body Control (Uses tentacles to attack and shoot with) *Absorption
    (Can assimilate organic tissue) *Possible Resistance to Heat Manipulation (Can
    stay in lava and endure it)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
