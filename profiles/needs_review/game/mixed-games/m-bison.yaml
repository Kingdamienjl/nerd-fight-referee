- id: claim-weaknesses-1e26eea7
  section: weaknesses
  axis: weakness
  text: Highly arrogant. His Psycho Power at a point started to become too great for
    his body to handle (Hence his desire to find a stronger one). He seemingly cannot
    possess any person at will, as the host needs to be either be infused first with
    Psycho Power and brainwashed (Ryu), be specifically engineered for it (Seth and
    other spare bodies), be a clone of M. Bison himself (Cammy, Decapre, Ed and Falke)
    or possess his same power (Rose) |-|Amp by the Psycho Drive
