- id: claim-powers-and-abilities-2af93b60
  section: abilities
  axis: hax
  text: 'Inherent= *Superhuman Physical Characteristics *Master Martial Artist *Acrobatics
    (Superhumanly agile and able to perform a number of acrobatic techniques and several
    jumping attacks. Moreover, he utilizes such skills to nullify throws, maintain
    his balance in mid-air and regain his footing after a knock down.Street Fighter
    Series - Gameplay) *Genius Intelligence *Analytical Prediction (Could correctly
    predict the unfolding of many future events, as better detailed in the intelligence
    section below) *Preparation (Can use Shadaloo''s scientific and military resources
    to set up plans and develop machinery such as the Psycho Drive and the Black Moons)
    *Chi Manipulation, Projection and Aura (M. Bison is the discoverer and most proficient
    user of Psycho Power, a form of energy heavily connected to Ki.Shadaloo C.R.I
    The Side Readers: Musings on a Still Night (Part 2) Bison was initially one of
    the few individuals capable of using Soul Power, a power that resonates with and
    pacifies the Ki that permeates the world. His dark intent and ambition led drew
    him towards the other side of Soul Power, a source of chaos which he embraced
    and baptized Psycho Power. M. Bison can utilizes the malleability of Psycho Power
    to a masterful degree, applying it for combat and in a variety of other applications)
    *Immortality (Types 3, 6, 7 and 8) **Possession (Can transfer his soul into the
    body of other people, effectively possessing them, although such power is bound
    to certain conditions [better detailed in the weaknesses section]. Planned to
    take over Ryu''s body, before moving on to the development of Seth and his replicas,
    meant to be artificial hosts to inhabit.Street Fighter Alpha 3 - M. Bison''s Arcade
    Story Clones of M. Bison such as Cammy, or modified humans such as Ed and Falke
    have specifically been engineered to act as spare bodies for him.Shadaloo C.R.I.
    - Character Guide 092: Ed After his first death in SF Alpha 3, M. Bison survived
    by entering Rose''s body and utilizing it until his scientists completed a new
    body.Shadaloo C.R.I. - Character Guide 092: EdStreet Fighter IV - Rose''s Prologue
    Temporarily inhabited a machine meant to contain his spirit.Street Fighter IV
    - M. Bison''s Prologue M. Bison''s very will exists within Psycho Power itself,
    which grabs a hold of its users'' mind and gradually eats away at it until their
    personally fades away and is replaced with M. Bison''s, thus granting him a new
    body.Street Fighter VI - Ed''s World Tour Conversations This was experienced first-hand
    by Ed, who had to wrest control of his own body after the events of A Shadow Fall
    multiple times.Street Fighter V - Ed''s Character Story Psycho Power is stored
    in many facilities around the world and as better detailed below, each of them
    allows M. Bison''s essence to persist and thrive.) **Fissionism and Fusionism
    (After his apparent demise at the hands of Ryu, a portion of M. Bison''s Psycho
    Power that was stored in machine gained consciousness, merging with the digital
    data of the computer and manifesting itself as an independent entity. SFVI M.
    Bison leaves open the possibility of himself being a rogue unit of the many backup
    bodies he had at disposal and that some of them could be at large.) **Incorporeality
    (As Phantom Bison, the form he takes while lacking a physical body.Shadaloo C.R.I.
    - Character Guide 200: Phantom Bison As detailed above, M. Bison''s will can potentially
    manifest as a digital entity of pure Psycho Power) **Light Manipulation (His disembodied
    consciousness can manifest as a flashing mass of purple lightStreet Fighter IV
    Official Website (archived)) *Possibly Regeneration (Low-Godly: Over the course
    of a few years he managed to somehow come back after having been reduced to nothing
    but energy by Ryu''s Power of Nothingness.Street Fighter VI - Guile''s Conversations
    during M. Bison World Tour quests Due to Ryu stating that Bison was consumed by
    his own power, which still threatens to destroy him once again (refer to the weaknesses
    section), this might suggest that the only thing left of him was Psycho Power
    which, as detailed above, contains his very soul and will.Street Fighter VI -
    Ryu''s Conversations during M. Bison World Tour quests While SFVI M. Bison himself
    states he could be a spare body and not the real one, Word of God directly refutes
    such notion and M. Bison himself writhes before Ryu''s power in memory of their
    last encounter, with his scars also tracing the way his body had crumbled apart.Famitsu
    - TranslatedStreet Fighter VI - M. Bison''s Win Quote (Vs. Ryu) However, in-universe
    the new M. Bison put himself apart from the original Sagat identified him as one
    of his clones, a notion M. Bison did not refute) *Enhanced Senses (Spotted C.
    Viper hiding behind a container while no other could.Street Fighter V - M. Bison''s
    Character Story) *Extrasensory Perception (Should be able to sense chi, just like
    other expert chi users. A dormant part of his Psycho Power could perceive and
    resonate with other Psycho Power an'
