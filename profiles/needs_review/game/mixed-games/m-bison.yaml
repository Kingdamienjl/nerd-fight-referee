  intelligence:
    text: 'Genius |-|Overall= M. Bison is a great strategist and leader, being the
      founder and commander of Shadaloo, the most powerful criminal organization on
      the planet, which he even recreated anew after its first downfall. M. Bison
      raised his organization through an unyielding pursue for power, wresting it
      from the hands of his rivals in an endless storm of battles against the many
      who desired to kill him. Eventually, he gained control over all the other organizations
      of the underworld.Side Readers: Toxicity (Part 1) Shadaloo and its divisions,
      such as S.I.N., possess advanced technology,extensive military resources,Ultra
      Street Fighter IV - Rolento''s Prologue several bases all around the world and
      have their fingers in every type of activity, legal or illegal, ranging from
      drug trafficking, arms manifacturing and human experiments, to controlling the
      high ranks of the US military, which take orders directly from M. Bison.Super
      Street Fighter IV Original Video AnimationStreet Fighter 30th Anniversary CollectionStreet
      Fighter V - Nash''s Character Story He could correctly predict how a number
      of events would unfold over the years, such as the time he manipulated Seth
      and S.I.N.''s actions from behind the scenes, stating that everything had gone
      according to his plan.Street Fighter IV: The Ties That Bind He even predicted
      Necalli''s arrival, his defeat by the hands of Ryu and the fact that the latter
      would have eventually faced him; even his own defeat may have been part of his
      schemes. Conducted various projects for world conquest and to increase his power,
      representing a constant threat and often going close to achieving his goals.
      Has always a backup plan and a number of contingencies in case something would
      befall him, hence why he managed to cheat death on several occasions. |-|Combat=
      M. Bison was a talented martial artist in his youth, one of the few in possession
      of Soul Power. Upon discovering the alluring Psycho Power, he swiftly surpassed
      his master and killed him. He used Psycho Power to develop his personal fighting
      style mold a great vaeriety of abilities and techniques. Ryu considers him one
      of the greatest martial artists to ever live, belittling only his evil heart
      and power. His skill allows him to frequently hold back and toy with expert
      fighters of the caliber of Chun-Li, Guile, Juri Han, Charlie Nash and F.A.N.G,
      even countering all of the latter''s countless killing techniques. Has often
      traded fists with the likes of Ryu, Rose and others. Could hold his own against
      Power of Nothingness Ryu and even Akuma recognized him as a worthy opponent,
      despite the difference in strength.Street Fighter Alpha 2 - Akuma''s Ending
      Notes: *Despite having been canonically defeated by Charlie Nash in Street Fighter
      Alpha 2, their fight has been subject to a retcon in Street Fighter V.Street
      Fighter Alpha 2 - Charlie Nash''s Ending In fact, it was stated that Bison''s
      power had already surpassed far beyond the bounds of Nash''s imagination. *The
      Black Moons don''t charge M. Bison with their energy. Instead, they are meant
      to cause destruction all around the world and bring out extreme negative emotions,
      then channel them into M. Bison, as they are what his Psycho Power feeds on.
      *M. Bison''s profile from All About Street Fighter Zero 2 states that he can''t
      get any stronger from the opponent''s fear. However, this notion was subject
      to a retcon in the following game, where he himself states to receive power
      from both hatred and fear. Street Fighter V supports this notion, as his Psycho
      Power is empowered by all kinds of negative emotions. Notable Attacks/Techniques:
      |-|Unique Attacks= {{#tag:tabber| {{!}}-{{!}}SF II-V= HellAttack.gif|Hell Attack
      PsychoAxe.gif|Psycho Axe ShadowAxe.gif|Shadow Axe PsychoBeak.gif|Psycho Break
      DeadlyKick.gif|Deadly Middle Kick FocusBison.gif|Focus Attack *Hell'
    source_ids: *id002
    confidence: 0.8
