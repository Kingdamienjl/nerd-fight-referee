      value: Binah possesses an extremely extensive collection of abilities derived
        from her existence as an Arbiter, Sephirah, and Librarian. === General
      source_id: character-stats-profiles-arbiter-mixed-games
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Arbiter === Small Country level+, possibly higher with E.G.O. and Abnormality
        Pages. As an Arbiter, Binah ranks among the most powerful individuals in The
        City. She was capable of tearing off Kali's arm and ultimately killing her.
        After regaining her full Arbiter power following the events of Library of
        Ruina, Binah was capable of fighting another Arbiter, Zena, whose attacks
        were powerful enough to create a massive crater with a shockwave. ---- ===
        Sephirah === At least Large Town level+, likely Small Country level. Although
        Binah's Sephirah body was intentionally weakened, she remained capable of
        damaging employees equipped with ALEPH-level equipment and was classified
        at a threat level comparable to Apocalypse Bird. She was also capable of defeating
        Sephirah Gebura. ---- === Librarian === At least Large Town level+, likely
        Small Country level, higher with E.G.O. and Abnormality Pages. Despite being
        considered degraded and incomplete compared to her original form, Binah remained
        capable of fighting extremely powerful opponents, including Color Fixers,
        Distortions, Bloodfiends, and other high-level combatants. Her access to E.G.O.
        equipment and Abnormality Pages can further increase her overall power. ----
      source_id: character-stats-profiles-arbiter-mixed-games
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Massively Hypersonic, possibly Relativistic+. Binah is comparable
        to Kali/Gebura in combat speed, although she is generally portrayed as somewhat
        slower. Her speed can be further enhanced through various passive abilities
        and Abnormality Pages. With The Strongest, Binah can directly obtain Kali/Gebura's
        speed. ----
      source_id: character-stats-profiles-arbiter-mixed-games
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Binah possesses durability comparable to her offensive capabilities.
        Her clothing can function as highly effective protective equipment, while
        her various Abnormality Pages and E.G.O. equipment can further increase her
        defensive capabilities. During her third phase in Library of Ruina, Binah
        can temporarily become immune to all forms of damage. ----
      source_id: character-stats-profiles-arbiter-mixed-games
      provider_id: character_stats_profiles
      authority: high
