power_scale:
  tier:
    text: '{{9-A}} physically; {{9-B}} to {{8-C}} with weaponry'
    source_ids: &id002
    - mediawiki-26503
    confidence: 0.95
  attack_potency:
    text: 'Small Building level+ physically (Fought with and traded blows with Jai-006,
      a SPARTAN-II supersoldier and even considered Jai to be equal to him, Halo:
      The Cole Protocol which should make him comparable to other SPARTAN-IIs such
      as Master Chief); Wall level (Weapons such as his Plasma Pistol is capable of
      firing with an output of 45 kW normally and 450 kW when charged) to Building
      level with weaponry (Energy Swords are capable of slicing battle-armored ODSTs
      in half and gouge gaping wounds in Titanium-A armor plating. Halo: First Strike
      Plasma Grenade explosions are this powerful)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman, with Supersonic combat speed (Can keep up with Master Chief
      in combat); Subsonic to Supersonic Attack Speed with ranged weaponry
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 10 (Comparable to SPARTAN-IIs such as Master Chief. Bent the barrel
      of a MA5 Assault Rifle with his bare hands)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level+ physically, Building level with energy shields (His
      energy shield should be comparable to Master Chief's, which withstood this explosion)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (From a young age, Thel was able to withstand beatings from training
      with elders. Was able to continue moving without slowing down even while in
      pain from breaking a rib)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Extended Melee Range with Energy Sword; Tens of Meters
      to Hundreds of Meters with ranged weaponry
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (Thel was one of the youngest to ever achieve his status as Shipmaster,
      let alone Supreme Commander. Halo 2: Anniversary He is a tactical genius, with
      him being responsible for over one billion total casualties and the loss of
      at least seven human planets, including the Fall of Reach while he was Supreme
      Commander. The UNSC has admitted that he had repeatedly been able to catch UNSC
      forces completely by surprise and ONI and UNSC strategic AI reported a zero
      percent confidence that the Navy could stop Thel through traditional means.
      The UNSC considered him as the most dangerous Covenant military asset on the
      field, and they couldn''t predict he would do next and feared he would dismantle
      all remaining UNSC strongholds) *Combat Skill: Thel was trained in combat by
      his house since a young age, meeting all the incredibly high expectations of
      his family. Is an incredibly skilled fighter, being able to defeat Sangheili
      assassins who came to kill him with little issue and without injury, with him
      even expecting more from them. During his time as Supreme Commander, he would
      often go down on ground assaults with groups of elite and wipe out Battalions
      with ease, and is stated to have done this across many human systems. As The
      Arbiter, The Prophets put Thel on missions which were considered perilous and
      suicidal; Thel would suppress a heretic uprising and fight through hordes of
      Flood on two occasions, (and would do this several more times against a far
      more powerful Flood horde with Master Chief) both of which he survived and returned
      from, even with The Prophets'' sanctioned genocide against him and his race.'
    source_ids: *id002
    confidence: 0.95
