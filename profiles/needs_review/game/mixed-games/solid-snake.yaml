    - field: standard_equipment
      value: '|Many weapons, such as his Stun Knife, pistols, rifles, sniper rifles,
        grenades, mines, C4, and rocket launchers. Other equipment includes a cardboard
        box, stealth mats, mine detectors, thermal and night vision goggles, and binoculars.
        DBZSnakeEquipment1.webp|Stealth Camouflage DBZSnakeEquipment2.webp|OctoCamo
        DBZSnakeEquipment3.webp|FaceCamo DBZSnakeEquipment4.webp|Soliton Radar DBZSnakeEquipment5.webp|Anti-personnel
        Sensor DBZSnakeEquipment6.webp|Solid Eye DBZSnakeEquipment7.jpeg|Codec DBZSnakeEquipment8.webp|Metal
        Gear Mk. II/III DBZSnakeEquipment9.webp|Chaff Grenade DBZSnakeEquipment10.webp|Screaming
        Mantis'' dolls DBZSnakeEquipment11.webp|Infinity Bandana *Stealth Camouflage:
        An electronic device that allows Snake to become virtually invisible by bending
        light around his body, making it appear as if he was not there. *Sneaking
        Suit: A unique military garment with highly advanced electronic weaving technology.
        It clings tightly to Snake''s body, acting as a second layer of muscle tissues
        and amplifying his endurance, strength, and rate of recovery. It provides
        insulation that protects Snake''s body from dangerous substances such as nerve
        gas and allows him to operate in extreme climates and damp conditions. It
        also incorporates noise-dampening soles that will enable the user to run without
        making a sound. *OctoCamo: An advanced form of smart camouflage utilized by
        Old Snake that replicates the texture and appearance of Snake''s surroundings
        to allow him to blend into them. It also regulates his body temperature to
        avoid detection by thermal imaging. **FaceCamo: A mask that uses OctoCamo
        to disguise Snake''s face and make it appear to be someone else''s. *Soliton
        Radar: A highly advanced radar system that utilizes electromagnetic waves
        originating from living beings to map out the location as well as provide
        live info of the position and field of view of enemy soldiers. It also can
        detect ghosts. *Anti-personnel Sensor: A small personal device that can detect
        the heartbeats and electromagnetic fields of nearby lifeforms. *Solid Eye:
        A device worn by Old Snake like an eyepatch that grants him night vision and
        capacity for binocular sight, though not at the same time. It allows Snake
        to make out footprints easily and determine the emotional and mental states
        of others by recording their body temperature, heart rate, and sweat secretions.
        *Codec: A highly advanced real-time communications system. Originally built
        into his ear, Snake''s Codec is now nanomachine based, allowing him to communicate
        through his nanomachines while remaining silent. *Metal Gear Mk. II/III: A
        miniature Metal Gear created by Otacon and Sunny that can be used for surveillance
        and object/weapon transport utilized by Old Snake. It is also equipped with
        stealth camouflage technology and is immune to harmful electromagnetic radiation.
        The second model also has a Geiger counter. *Chaff Grenade: An electronic
        attack device that deploys countless metal strips along with an active jammer
        to temporarily disable radio communications and electronic equipment such
        as cameras, radar, missile guidance, and lock-on systems as well as stun AI-controlled
        weapons and early model Cyborgs *Screaming Mantis'' dolls: A pair of puppets
        taken from Screaming Mantis that allow Snake to manipulate the nanomachines
        of living and dead soldiers to force them to move. *Infinity Bandana: A bandana
        that Snake received from Meryl with an infinity symbol sewed into the fabric.
        It provides him with infinite ammunition, which Snake has referenced before.
        |}'
