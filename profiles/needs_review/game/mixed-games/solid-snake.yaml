- id: claim-weaknesses-c5848a66
  section: weaknesses
  axis: weakness
  text: "Snake struggles with PTSD, and his genes were designed to make him age rapidly\
    \ after 40. Old Snake's accelerated ageing significantly reduces his strength,\
    \ stamina and afflicts him with the regular issues of old age. Snake is also known\
    \ to self-handicap, and will refrain from using certain equipment and techniques,\
    \ most notably refraining from using the CQC Big Boss taught him since it \"never\
    \ felt right using techniques learned from a man who'd betrayed his unit\". Notable\
    \ Attacks/Techniques: *CQC: Unique and highly efficient martial arts, allowing\
    \ a soldier a variety of options while not denying them the use of weapons. It\
    \ generally has the user taking a stance with a knife and a handgun; thus, they\
    \ could grab/throw opponents in melee, threaten/execute people with the sharp\
    \ blade or shoot down opponents who're otherwise outside the user's range. CQC\
    \ mostly focuses on grabs, throws, and other methods to disarm the target, allowing\
    \ one to take down enemies without killing them or use them as a human shield.\
    \ A skilled practitioner can even \"chain\" throws, allowing them to rapidly neutralise\
    \ entire groups of soldiers in close proximity of each other. Snake, having been\
    \ instructed by Big Boss himself during his time as a member of FOXHOUND, is highly\
    \ proficient in the use of CQC. However, after the events of Outer Heaven, Snake\
    \ restricted himself from using it; not feeling right utilising the technique\
    \ of someone who betrayed his unit. He would never use CQC in actual combat until\
    \ 2014 when the Pentagon declassified Big Boss' file, causing the technique to\
    \ become popular among soldiers. Though Snake notes that their use of CQC is only\
    \ a \"pale imitation\" learned from reading about it. old snake cqc.gif|Old Snake\
    \ using CQC on Johnny Sasaki ==Gallery== snake twin snakes.png|Snake in Metal\
    \ Gear Solid: The Twin Snakes Solid snake.png|Snake in Super Smash Bros. Brawl\
    \ Solid.png|Snake in Super Smash Bros. Ultimate Metal Gear Solid 4 OST Metal Gear\
    \ Saga Metal Gear Solid OST Encounter ==Notable Matchups== |-|Victories=Victories:\
    \ *Kamen Rider Ixa (Kamen Rider) Kamen Rider Ixa's Profile (Speed equalized. Snake\
    \ has access to all his equipment and 8-B keys are used for both) *Optimus Prime\
    \ (Transformers (DS Games 2007)) Optimus Prime (2007 DS Game)'s Profile (Speed\
    \ equalized, Snake had access to all his equipment, fight took place on Dite)\
    \ *Izetta (Izetta: The Last Witch) Izetta's Profile (Izetta with the magic stone\
    \ was used, speed was equalized) *The Seven (The Boys) The Seven's Profile (Speed\
    \ was equalized. MGS2 Snake was teamed up with MGS2 Raiden and both had all of\
    \ their gear. The Season 2 incarnation of the Seven was used) *Alta\xEFr (Summoners\
    \ War) Alta\xEFr's profile (MGS4 Snake was used, had the Altair costume and the\
    \ Infinity Bandana was restricted, speed was equalized. Battle took place in the\
    \ MGS4 Graveyard and starting distance was 50 meters) *Doctor Doofensmirtz (Phineas\
