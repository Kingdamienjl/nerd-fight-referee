      value: 'Struggles with PTSD, In his later years, he began to age rapidly which
        caused his heart to have issues and made him have seizures Notable Attacks/Techniques:
        * CQC: CQC, short for Close Quarters Combat, is a form of CQB created by Big
        Boss and The Boss. It allows Solid Snake to fight in close quarters while
        using both a knife and a handgun, allowing him to switch between fighting
        at short range and shooting an opponent in the distance. While Snake refuses
        to use it usually, his body forces him to use it. * Nanomachines: Snake has
        been injected with Nanomachines, tiny machines that assist his body and give
        him various abilities such as his Codec, the ability to hack highly advanced
        computers in a few seconds with just a touch, regulating his emotions so he
        doesn''t suffer from fear or PTSD and administering adrenalin, nutrients,
        sugar, nootropics and benzedrine so Snake can stay awake longer without needing
        to sleep, his body won''t freeze at sub-artic temperatures, his made smarter
        and be given all of the nutrients that he needs to function without eating.
        * FOXDIE: FOXDIE is a lethal controlled disease injected into Snake''s body
        that is programmed to kill certain people when Snake meets them face to face
        by infecting them and simulating a heart attack. This later goes out of control
        and threatens to infect millions of people at random until Snake was injected
        with some new FOXDIE which started to kill the old FOXDIE. * Stun Knife: The
        Stun Knife is a knife that can be used as a taser to shock someone, allowing
        Snake to non-lethally defeat an opponent by knocking them out with the shocks.
        * Tanegashima: The Tanegashima is a musket that has been around since the
        era of the samurai, it is a special musket that has a one-in-three chance
        of producing a tornado when fired. * Solar Gun: The Solar Gun is a high-tech
        pistol that absorbs natural sunlight from the area around Snake to fire it
        off as energy projectiles to non-lethally take down an opponent. * The Patriot:
        The Patriot is The Boss'' weapon, The Patriot is a machine gun that, due to
        its infinite shaped barrel, has infinite ammo. * Rail Gun: The Rail Gun is
        a weapon Snake acquired from Crying Wolf, it is a portable rail cannon that
        fires large pieces of metal using electro-magnetic waves to shoot them like
        a bullet. * Mantis Doll: The Mantis Doll is a doll that Snake took from Screaming
        Mantis, it allows him to use Psycho Mantis'' psychokinetic powers to lift
        someone with Nanomachines up and throw them around until they die. * Sorrow
        Doll: The Sorrow Doll is a doll that Snake took from Screaming Mantis, it
        allows him to use The Sorrow''s connections to ghosts in order to lift the
        dead body of someone with Nanomachines up and throw them around to grab items.
        * Stealth Suit: Solid Snake can equip the Stealth Suit, a full-body suit that
        makes his footsteps completely silent, protect his body from external temperatures
        as cold as liquid nitrogen and external poisons and makes his body heat to
        be able to be detected by thermal goggles. * Infinite Bandana: Solid Snake
        can equip the Infinite Bandana, a bandana that, when worn, gives every single
        one of Snake''s weapons infinite ammo. * Stealth Camouflage: Solid Snake can
        equip the Stealth Camouflage, a piece of electronic equipment that, when worn,
        bends light around Snake making him invisible to the naked eye but can be
        seen by other means such as Thermal Vision. * Octo Camo: Solid Snake can wear
        the Octo Camo, an upgraded version of his Stealth Suit which regulates his
        temperature as well as match his exterior temperature to his surroundings
        while creating a camouflage that makes him blend into his environment. It
        also generates a light electrical current that makes Snake''s body regenerate
        from light injuries better than it could before and increases his muscle strength.
        :* Face Camo: After defeating Laughing Octopus, Snake gets Face Camo, a mask
        that allows Snake to appear as if he was someone else and trick others into
