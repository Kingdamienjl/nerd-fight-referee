    - field: intelligence
      value: Genius (As a former elite soldier tasked with functioning alone in enemy
        territory for long periods of time, would need this sort of intelligence to
        conduct his operations. In present, he is a renowned assassin with an impeccable
        record who is capable of wiping out entire military fortifications with just
        his katana even while suffering severe Chronos withdrawal.Bunker Part 1Bunker
        Part 2 He's able to learn more of the Chronos and NULL project conspiracy
        on his own despite steps being taken to keep him in the dark by his government
        overseers, and can use his precognition to become privy to much more information
        than he should be able to. In terms of combat, NULL soldiers were said to
        have slaughtered villages and thousands of soldiers without batting an eye,Mansion
        HideoutBunker Part 2 - Ending even while undergoing withdrawal Zero is near
        untouchable in combat against numerous armed assailants all at once, and he
        defeated Headhunter despite her superior equipment and assistance from others.Bunker
        Part 2 - Headhunter Boss Fight In every battle Zero uses his precognition
        to know the possibilities of his actions and after finding the solution to
        win he performs perfectly every movement in exact detail. Able to manipulate
        V's head into not killing him after understanding the situation. As a Gamma
        NULL,Zero's dossier Zero is far more skilled than an Alpha NULL and an Beta
        NULL, who have only a 7% to 13% chance to win Leon's skill test, while a Gamma
        NULL has 100%.Slaughterhouse - Leon Von Alvensleben's Test Can memorize everything
        that is going to happen within his precognition, no matter how many enemies,
        traps, machines, lasers and bullets are in his way, with Zero's greatest feat
        being memorizing everything that was going to happen on several different
        levels of a bunker in a single glance and ultimately doing every needed move
        in exact detailBunker Part 1)
