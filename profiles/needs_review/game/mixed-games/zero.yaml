    - field: weaknesses
      value: 'Suffers from psychopathy and vivid nightmares thanks to his reliance
        on Chronos. If he doesn''t get his daily dose of Chronos, he will go through
        withdrawal, go crazy, start to hallucinate, his powers will start to fade
        away, and it is described that it will feel like he''s "stuck in time". Is
        addicted to Chronos and has no real access to it outside of his Psychiatrist.
        Lost all of his past memories during the war, and Is still human. Notable
        Attack/Techniques: *Sword Slash (Zero quickly unsheathes his blade, strikes
        forward in any direction he chooses, and sheaths it back in. Depending which
        direction he slashes, it will give him a little boost in the air.) *Stealth
        (Is stealthy enough to get past groups of trained cops and swat team members,
        in a crowded night club or even in a silent empty prison.) *Roll (A simple
        roll on the ground that allows Zero to get past danger, such as explosions,
        bullets, lasers, and other humans. When he does so, he is followed by a trail
        of light.) *Walljumping (Zero is able to cling onto walls and jump off them
        at a great speed, just like when he rolls, he is followed by a trail of light.
        When he walljumps, he is able to dodge past bullets, lasers, and explosions.)
        *Chronos (Chronos is a drug that Zero takes, he''s taken Chronos so much that
        he depends on it. If he doesn''t get his daily dose from his Psychiatrist,
        he will go through withdrawal, hallucinate, and it is said that it will feel
        like he''s "stuck in time". One dose of Chronos lasts about 24 hours. Chronos
        gives Zero a multitude of different abilities, such as . . .) **Precognition
        **Time Manipulation (Zero is able to slow down time to deal with projectiles
        and other things better, he can slow them down to the point where it seems
        like everything around him as stopped.) **Resurrection (Zero is able to come
        back immediately after death, rewinding back to the point before he died,
        thanks to Chronos'' traits having to do with time. Zero is able to comeback
        from things ranging from lethal gunshots, all to even having his entire body
        vaporized by lasers. When he comes back, he carries all knowledge he had,
        such as the things he did before death, and what killed him so he cannot make
        the same mistake twice.) Category:Cr33ver Category:Tier 7'
