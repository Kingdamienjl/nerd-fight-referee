    - field: intelligence
      value: "Extraordinary Genius |- | As Wily\u2019s magnum opus, he is built to\
        \ surpassMega Man 2 - The Power Fighters the likes of Rock and Bass as well\
        \ as all of Wily's other Robot Masters in every capacity, including combat\
        \ skill. Mega Man has fought up to at least 88 Robot Masters, robots comparable\
        \ or superior to himself, and can potentially fight them all with just a simple\
        \ Mega Buster and lacking the movement options of Mega Man X. Notable of these\
        \ Robot Masters include: *Tengu Man, who reads air flow with his sheer skill,\
        \ meaning Zero is also capable of such. *Mega Man beat Sunstar and Ra Moon,\
        \ the former having thousands of years in combat experience, and the latter\
        \ being a supercomputer of similar age- who created a Ra Thor that was two\
        \ times faster than Quick Man, and thus Rock at that point in time. *Zero\
        \ should also be superior to Tomahawk Man, a Robot Master designed for combat\
        \ that can throw an axe so accurately it can cut a candle wick, extinguishing\
        \ its flame, 100 meters away. Immediately upon being unsealed, he began \"\
        tearing up entire Hunter units\"Maverick Hunter Field Guide before proceeding\
        \ to fight Sigma, the strongest, most advanced Reploid and leader of the Maverick\
        \ Hunters, stated to have genius-level intellect and the world's greatest\
        \ combat abilitiesRockman X Chou Hyakka (Mega Man X Super Encyclopedia). In\
        \ that fight, he was able to (literally) disarm him, a feat attributed to\
        \ his mastery over improvised weapons, and would have killed him had he not\
        \ been paralyzed by a sudden jolt of pain immediately before the end of the\
        \ fight. *Maverick Hunters fight a variety of Mechaloids with various abilities\
        \ superior to their own, and often train against Magma Dragoon using his data,\
        \ who is a master martial artist to combat. Even outside of combat, he is\
        \ able to look at Mega Man X's damaged X-Buster and use its schematics and\
        \ parts to upgrade his own Z-Buster- despite X and Zero's bodies being technology\
        \ that Gate failed to analyze completely. Yet, Gate was able to build Infinity\
        \ Mijinion, who analyzes information with the accuracy and speed of multiple\
        \ supercomputers. However, since Zero is primarily designed to be a combat\
        \ robot, most of his intelligence is allocated to combat. |-|Combat Skill=\
        \ *Fought and defeated Dynamo on multiple occasionsMega Man X6, a Reploid\
        \ so skilled at fighting that even while playing around, he's superior to\
        \ most Special A-Class Maverick Hunters, the highest rank within the organization\
        \ that only 0.01% of members reachRockman X: Origins *Is constantly depicted\
        \ as a match for X \u2014 having fought him on two separate occasions \u2014\
        \ who himself is a skilled fighter capable of defeating a physically comparable\
        \ copy of both himself in his Ultimate Armor and Awakened Zero at the same\
        \ time.X Challenge *As he traverses throughout the games' stages he annihilates\
        \ enemies of all kinds and numbers in his wake, including the many, many Nightmare\
        \ Viruses that swarm the bases, outnumbering him massively. *Stated to be\
        \ a master of weapons, capable of using all weapons to their maximum potential\u2014\
        \ including swords, glaives, fans, hammers, knucklesMega Man X8, daggers and\
        \ boomerangs, or improvised weapons such as a rusted pipe torn from the environment,\
        \ effectively upon first use. *Many Mavericks add to Zero's experience- most\
        \ of which have an extreme range advantage in addition to many having flight,\
        \ making Zero an expert at weaving into close range to even land a single\
        \ hit. *Can fight Mega Man X on multiple occasions, who possess many hax abilities\
        \ and armors all at once to change fighting styles on a dime. **X can also\
        \ fight and defeat multiple Mavericks comparable to him, including a more\
        \ powerful Awakened Black Zero and Ultimate Armor X at the same time. *Constantly\
        \ beats back Sigma several times, with Sigma being portrayed to be superior\
        \ to him in raw physical statistics and a more diverse moveset, without the\
        \ need for his techniques learned throughout a single game using just his\
        \ Z-Saber and sometimes Z-Buster. *Deduced the culprit of a crime scene was\
        \ Sigma based on purely the fact that the Reploids destroyed were hit in weak\
        \ points. With this little information, he managed to defend against a sneak\
        \ attack from Sigma, correctly predicting how he would attack and grab his\
        \ arm. *Defeats master martial artists like Magma Dragoon, who's so proficient\
        \ in fighting skill that his data is used to teach future Maverick Hunters\
        \ hand-to-hand |-|Experience= * Has accumulated decades of experience fighting\
        \ Sigma and Mavericks, each wielding a wide variety of abilities in his time.\
        \ * He's fought through stages where hordes of enemies attack while constantly\
        \ being fired at by lasers from various angles as well as fought the likes\
        \ of Blaze Heatnix even in spite of his mobility being severely limited by\
        \ the area-spanning instant death flames. * He's dealt with flyers like Dark\
        \ Necrobat who possesses massive AoE attacks that take up large portions of\
        \ the screenMega Man X5 as well as the ability to stop time *"
      source_id: vsbattles-zero-mixed-games
