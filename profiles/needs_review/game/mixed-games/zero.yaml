        around him whilst not being sucked up into it. With this white hole, Zero
        can use it to either hit the opponent with the white energy which gets sucked
        into the white hole. * Strikers: Zero is able to summon various fighters to
        help him in battle. :* Krizalid: Zero can summon Krizalid to his side in battle.
        Krizalid will jump in a kick a small tornado from his feet. :* Ron: Zero can
        summon Ron to his side in battle. Ron will form out of the dust and strike
        the opponent with his fists. Ron will also remove the opponent''s soul from
        their body, leaving the opponent vulnerable. :* Glugan: Zero can summon Glugan,
        his pet lion, to his side in battle. Glugan will jump in a slash the opponent
        with his claws. * MAX Mode: MAX Mode is a power-up all fighters can access.
        In exchange for their Super Meter depleting quickly over time, the fighter
        gets enhanced strength and durability for a limited amount of time as well
        as access to enhanced versions of their strongest techniques and the ability
        to use their strongest technique. Once their Super Meter is empty, MAX Mode
        will end. :* Extra Mode: Extra Mode is an advanced version of MAX Mode where
        after it runs out, all of the advantages gained from using MAX Mode are kept
        for the rest of the fight. * Armour Mode: Armour Mode is a power-up all fighters
        can access. In exchange for their Super Metre depleting quickly over time,
        the fighter gets greatly enhanced durability. Once their Super Meter is empty,
        Armour Mode will end. * Counter Mode: Counter Mode is a power-up all fighters
        can access. In exchange for their Super Meter depleting quickly over time,
        the fighter gets enhanced strength as well as the ability to use Guard Cancels
        and Guard Escapes as much as they want. Once their Super Meter is empty, Counter
        Mode will end. * Critical Counter Mode: Critical Counter Mode is a power-up
        all fighters can access. When a fighter has filled out their Critical Counter
        gauge and lands a counter with a heavy attack, they will enter Critical Counter
        Mode. In Critical Counter Mode, the fighter is able to string together attacks
        and techniques better making them a better fighter, when Critical Counter
        Mode is nearly over, the fighter can choose to end it with an enhanced version
