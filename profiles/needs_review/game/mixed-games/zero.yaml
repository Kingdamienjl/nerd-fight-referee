    - field: standard_equipment
      value: '| Katana: it''s Zero''s standard weapon at the beginning of the game
        and the only one used until the final chapter of the main campaign. It particularly
        shows no special features other than an abnormal durability. File:DrawSword
        1.gif|Katana PrismSword.gif|Prism Sword *The Prism Sword is literally identical
        to the standard katana, possessing totally no real change within combat, however,
        it''s cut causes spilled blood to be turned into ink, poetically taking the
        description of "The world is your canvas and blood is the paint".Prism Sword
        Description SwordofMaster.gif|Sword of Masters *The Sword of Masters has a
        similar range as the standard katana and doesn''t show great slowness if compared
        to swords like The Phoenix Edge and Claymore Prototype. it''s special feature
        is the fact that after a certain timeframe the sword will launch a otherwordly
        beamSword of Masters Description capable of piercing several enemies at once.
        SavantKnife.gif|Savant Knife *The Savant Knife is the only sword that cannot
        truly be considered a sword, but rather a knife. It has the shortest reach,
        extending to not even half of the standard katana, yet with it Zero proves
        able to cut at a vastly faster speedSavant Knife Description than with any
        other equipment as well as having much greater control mid-air. Undefined
        - Imgur.gif|Claymore Prototype *Claymore Prototype is mechanically the strongest
        sword in the game, being described as capable to crush defenses and bullets,Claymore
        Prototype Description as well as having an unstoppable cut (Skinny Rickies
        cannot remotely stop the attack), also having the longest physical reach,
        however, probably as a consequence of it''s weight, Zero is not able to attack
        as fast as with other swords. PhoenixSword (1).gif|Phoenix Edge *The Phoenix
        Edge has a slower cut than the standard katana, however, it has a remarkably
        greater range. When used, it creates a small wave of fire ("The phoenix''s
        flame slice"Phoenix Edge Description) that extends a few meters from Zero,
        being used to detonate oil barrels and kill enemies at greater distances.
        |}'
