    - field: weaknesses
      value: "Mentioning Iris is a sore spot for him ==Notable Attacks and Technique==\
        \ Learning System: Similarly to X and his Variable Weapon System, Zero is\
        \ able to gain access to new attacks by defeating foes in combat with the\
        \ Learning System, sometimes known as the Saber Tactic System. Unlike X, Zero\
        \ rarely copies the attacks of his opponents but instead creates new attacks\
        \ based on his opponent's affinities. For example, defeating Web Spider allowed\
        \ Zero to develop the Raijingeki, a powerful stab with the Z-Saber that's\
        \ charged with electricity. Due to the fact that these tend to be sword techniques\
        \ inherent to Zero rather than copied weapons, the majority of them do not\
        \ require additional Weapon Energy and thus can be used as often as Zero likes.\
        \ {| class=\"fandom-table\" |+Offensive Techniques !Technique !Applied Element\
        \ !Weapon Involved !Description !Visual |- |Ittou Ryoudan: Genmurei (Cleaving\
        \ in a Single Strike: Phantasm Zero) |Non-Elemental |Z-Saber |Zero has been\
        \ shown to launch all sorts of energy beams from his saber, but his most powerful\
        \ is this technique, also known as \u201CGenmu Zero\u201D. Zero leaps into\
        \ the air with a spin or simply charges up his blade above his head before\
        \ launching a massive wave of energy that is nearly impossible to dodge. It\
        \ is powerful enough to destroy X in one shot even with the protection of\
        \ the Ultimate Armor. When in his \"Awakened\" form he can fire this attack\
        \ infinitely while remaining completely invulnerable any attack X can muster,\
        \ rendering it incredibly difficult to fight, much less hurt Zero while using\
        \ this attack. He can fire up to two of these per swing in a slight fan pattern,\
        \ causing the waves to separate and cover a wider area. |https://static.wikia.nocookie.net/megaman/images/9/91/MMX5_ZeroA_GenmuZero.gif/revision/latest/scale-to-width-down/220\
        \ |- |Rekkoha (Rending Light Supremacy) |Non-Elemental / Light |Unarmed |Similarly\
        \ to the Rakukouha and Messenkou, Zero charges up energy in his fist before\
