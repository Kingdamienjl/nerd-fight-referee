    - field: weaknesses
      value: "Mentioning Iris is a sore spot for him {{scroll box|content=}} ==Notable\
        \ Attacks and Technique== |-|Techniques= Learning System: Similarly to X and\
        \ his Variable Weapon System, Zero is able to gain access to new attacks by\
        \ defeating foes in combat with the Learning System, sometimes known as the\
        \ Saber Tactic System. Unlike X, Zero rarely copies the attacks of his opponents\
        \ but instead creates new attacks based on his opponent's affinities. For\
        \ example, defeating Web Spider allowed Zero to develop the Raijingeki, a\
        \ powerful stab with the Z-Saber that's charged with electricity. Due to the\
        \ fact that these tend to be sword techniques inherent to Zero rather than\
        \ copied weapons, the majority of them do not require additional Weapon Energy\
        \ and thus can be used as often as Zero likes. {{{!}} class=\"fandom-table\"\
        \ {{!}}+Offensive Techniques !Technique !Applied Element !Weapon Involved\
        \ !Description !Visual {{!}}- {{!}}Ittou Ryoudan: Genmurei (Cleaving in a\
        \ Single Strike: Phantasm Zero) {{!}}Non-Elemental {{!}}Z-Saber {{!}}Zero\
        \ has been shown to launch all sorts of energy beams from his saber, but his\
        \ most powerful is this technique, also known as \u201CGenmu Zero\u201D. Zero\
        \ leaps into the air with a spin or simply charges up his blade above his\
        \ head before launching a massive wave of energy that is nearly impossible\
        \ to dodge. It is powerful enough to destroy X in one shot even with the protection\
        \ of the Ultimate Armor. When in his \"Awakened\" form he can fire this attack\
        \ infinitely while remaining completely invulnerable any attack X can muster,\
        \ rendering it incredibly difficult to fight, much less hurt Zero while using\
        \ this attack. He can fire up to two of these per swing in a slight fan pattern,\
        \ causing the waves to separate and cover a wider area. {{!}}https://static.wikia.nocookie.net/megaman/images/9/91/MMX5_ZeroA_GenmuZero.gif/revision/latest/scale-to-width-down/220\
        \ {{!}}- {{!}}Rekkoha (Rending Light Supremacy) {{!}}Non-Elemental / Light\
        \ {{!}}Unarmed {{!}}Similarly to the Rakukouha and Messenkou, Zero charges\
        \ up energy in his fist before slamming the ground, causing extremely damaging\
        \ beams of light to erupt all around him, destroying all but the strongest\
        \ of foes instantly. At his strongest he can use this attack infinitely, only\
        \ with a brief pause in between attacks. {{!}}https://static.wikia.nocookie.net/megaman/images/a/a9/X6_Rekkouha.gif/revision/latest/scale-to-width-down/220\
        \ {{!}}- {{!}}Rising {{!}}Non-Elemental / Fire / Thunder / Ice {{!}}Z-Saber\
        \ / K-Knuckle {{!}}Some of Zero's most recognizable attacks involve an uppercut\
        \ with his Saber imbued with multiple elements or no element at all. The most\
        \ famous example being the Ryuenjin and Hyouryushou, being exactly that with\
        \ fire and ice. Other techniques can involve walls of flame with Shoenzan,\
        \ vertical lightning projectiles with Denjin, electric tornados with Raijinshou.\
        \ There are other variants of these moves involving Zero's K-Knuckle, embuing\
        \ his fists with ice and lightning using Raijinken and Shoryuken {{!}}https://static.wikia.nocookie.net/megaman/images/1/1d/Xtr2_Rising.gif/revision/latest\
        \ https://static.wikia.nocookie.net/megaman/images/4/4a/X4_Ryuuenjin.gif/revision/latest/scale-to-width-down/220\
        \ https://static.wikia.nocookie.net/megaman/images/5/54/X6_Shoenzan.gif/revision/latest\
        \ https://static.wikia.nocookie.net/megaman/images/e/e2/X5_Denjin.gif/revision/latest\
        \ https://static.wikia.nocookie.net/megaman/images/5/54/X7_Raijinshou.gif/revision/latest/scale-to-width-down/110\
        \ https://static.wikia.nocookie.net/megaman/images/f/fb/Raijinken.png/revision/latest/scale-to-width-down/120\
        \ https://static.wikia.nocookie.net/megaman/images/6/68/X8_Hyouryuushou.gif/revision/latest/scale-to-width-down/110\
        \ https://static.wikia.nocookie.net/megaman/images/9/99/X8_Shoryuken%28Z%29.gif/revision/latest/scale-to-width-down/110\
        \ {{!}}- {{!}}Drill Crush {{!}}Non-Elemental / Fire / Ice / Metal {{!}}Z-Saber\
        \ {{!}}Zero sports a myriad of different techniques involving plunging his\
        \ Saber downward towards the ground, such as the ice elemental Hyouretsuzan.\
        \ Danchien and Enkoujin being fire elemental, leaving an explosion behind,\
        \ and Rakukoujin projecting a metallic projectile forward. {{!}}https://static.wikia.nocookie.net/megaman/images/f/fb/Xtr2_DrillCrush.gif/revision/latest\
        \ https://static.wikia.nocookie.net/megaman/images/f/fa/X4_Hyouretsuzan.gif/revision/latest\
        \ https://static.wikia.nocookie.net/megaman/images/9/9e/X5_Danchien.gif/revision/latest/scale-to-width-down/220\
        \ https://static.wikia.nocookie.net/megaman/images/6/6b/X6_Rakukoujin.gif/revision/latest\
        \ {{!}}- {{!}}Saber Shot / Hadangeki {{!}}Non-Elemental {{!}}Z-Saber {{!}}Zero's\
        \ standard blade beam from his Z-Saber he has used ever since the Z-Saber's\
        \ first appearance in Mega Man X2. In Mega Man X7, Zero utilizes another variant\
        \ called Hadangeki. {{!}}https://static.wikia.nocookie.net/megaman/images/1/14/MMX5_Zero_SaberShot.gif/revision/latest/scale-to-width-down/220\
        \ {{!}}- {{!}}Saber Thrust {{!}}Lightning / Water / Leaf {{!}}"
