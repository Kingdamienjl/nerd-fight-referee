    - field: weaknesses
      value: 'Chronos withdrawal is an unpleasant process. If starved of Chronos,
        the user''s mental health degenerates to the point of near constant hallucination,ChinatownMansion
        Hideout their precognition fails them,Mansion Hideout and eventually time
        slows to a halt as they''re forever trapped in the prison of their own mind.Mansion
        HideoutChinatown NULLs are supposed to receive multiple Chronos dosages per
        day. Zero is a diagnosed sociopath,Bunker Part 2 - The Psychiatrist''s last
        sentence in the normal ending with his mental health problems exacerbated
        by Chronos. He cannot kill children.Bunker Part 2 - Headhunter Boss Fight
        A NULL can be defeated as Zero managed to "kill" Headhunter with a fatal attack
        that caused her to lose a lot of blood before death,Bunker Part 2 - Headhunter
        Boss Fight and therefore, losing Chronos, making her unable to reset the universe
        when killed and bringing her into complete withdrawal.However, it''s worth
        noting that it was established earlier that both Headhunter and Zero were
        low on Chronos, so it''s difficult to say how much blood must be lost for
        this method to work if both were at their 100%. Zero can''t control his killer
        instinct propely {| class="wikitable mw-collapsible mw-collapsed" !Notable
        Attacks/Techniques: |- | File:Katana-zero-katana0.gif Chronos: Chronos is
        a combat drug created for use by NULL soldiers. It grants the user precognitive
        and temporal abilities,Mutual-Nil Prision making it''s users into effectively
        unstoppable killing machines. However, Chronos withdrawal is an unpleasant
        process. If starved of Chronos, the user''s mental health degenerates to the
        point of near constant hallucination, their precog fails them, and eventually
        time slows to a halt as they''re forever trapped in the prison of their own
        mind. *Precognition: it''s the most powerful ability of a NULL. With it Zero
        can foresee every minimal moment and it''s infinite fractal of possibilitiesBunker
        Part 2 - Headhunter Boss Fight until he finds a route to overcome the fight
        without a scratch, being able to stay for all eternity inside his mind while
        predicting all the alternativesBunker Part 2 - Headhunter Boss Fight and then
        execute it perfectly. Zero is not only able to predict simple movements but
        also able to see the various possibilities of a card game,Chinatown a trap
        explosion,Bunker Part 1 a person''s dialogueFactory Hideout and a person''s
        suicide.Murdower Hotel Zero can even foresee hallucinations that will happen.Bunker
        Part 1 Can use precongation inside is own head while in the effects of Mind
        Manipulation, Sleep Manipulation, Illusion Manipulation and Perception Manipulation
        even when his mind is completely collapsed thanks to the lack of Chronos in
        his blood.Bunker Part 2 - The Psychiatrist''s boss fight If he fights an opponent
        who has resistance to precognition Zero is still capable to enhance his foresse
        hundreds and hundreds of times, better and better, as he did in his fight
        against Headhunter,Bunker Part 2 - Headhunter Boss Fight who besides having
        resistance to precognition also has the same ability.Chinatown The only time
        his prediction failed was in a trap created by V,Mansion Hideout however,
        that''s because the Chronos in Zero''s body was collapsing at the time.Mansion
        Hideout File:Katana-zero.gif|Zero using pregonation in a battle File:AcceptableAbleDavidstiger-size
        restricted.gif|Zero using pregonation in a dialog *Perception Amplification:
        One of the characteristics of the Chronos is that it makes Zero have a completely
        different perception of time than the rest of the world,Mutual-Nil Prision
        where everything is in slow motion, including his opponent''s movements and
        his own. This allows him to analyze the situation much more easily and avoid
        the trajectory of attacks even at close range. It should be noted that even
        though the ability is useful in combat, it bothers the the user''s mind a
        lot since everything seems to last several and several times longer than normal,
        to the point where some days can seem like years.Mansion Hideout Not only
        that, but if the Chronos runs out time stops completely from the user''s perspective,Mansion
        Hideout leaving him forever in the nightmares of one''s own mind.Chinatown
        Unlike in gameplay, the time slow is not something that is turned on and off,
        but rather something that is active all the time.Mansion HideoutClub Neon
        KSM19.gif KatanaZeroTimeSlow.gif *Temporal Reset: A simple ability, yet very
        useful on many occasions. If the Chronos user dies, time will rewind to a
        point in the timeline where the user was still alive.Mansion HideoutClub Neon
        The Chronos supply time travels along with the rest of the world, as Headhunter
        go back in time for fun several hundred times although she is absolutely afraid
        and prefer to fight forever while die several times than give up and lose
