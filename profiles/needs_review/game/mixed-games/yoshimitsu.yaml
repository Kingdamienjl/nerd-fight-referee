    - field: weaknesses
      value: 'Coward, and gets hungry easily Notable Attacks/Techniques: *Flutter
        Jump: Yoshi kicks his feet beneath him, allowing him to achieve even greater
        air than normal. **Flutter Stomp: An offensive variation. Yoshi kicks his
        feet rapidly, which allows him to rapidly kick a foe that is underneath him.
        *Megastrike: Yoshi utilizes tremendous re-entry force to send a metal soccerball
        through the air with re-entry force of its own and splitting into six. *Ground
        Pound: A slam that can sometimes contain re-entry force, as seen in Sunshine.
        Yoshi''s version is unique from others within the franchise, as Yoshi''s sends
        out stars after hitting the ground. Said stars harm any foe Yoshi''s actual
        slam might''ve missed. *Pinpoint: Yoshi aims extremely precise with a target
        marker. He''ll normally throw eggs using this. *Egg Attacks: Yoshi has numerous
        egg-based attacks. **Egg Lay: Yoshi snags a foe with his tongue and swallows
        them whole. He then turns them into eggs. Weaker characters are transformed
        like this permanently. Stronger ones can escape. **Egg Throw: Yoshi summons
        an egg from nowhere and throws it at his foe. Normally with the use of "Pinpoint."
        This attack also has a limited amount of eggs. **Egg Roll: Yoshi encases himself
        in an egg and rolls towards his foe with suprisingly great speed. **Egg Shield:
        Yoshi encases himself, once more, in an egg. But this time, he sits there
        and uses the outer shell to absorb attacks, thus evading harms way. *Energy
        Attacks: Yoshi can manipulate and bend his energy into multiple attacks. **Sphere:
        Yoshi forms a sphere of energy above his head, and throws it at his foe, which
        then homes in on the foe. The sphere can sometimes split into multiple, which
        all then home in on the foe. **Weapon: Yoshi forges a weapon of pure energy.
        Most notable is a hockey stick, which he can use to smack foes with. *Egg
        Beater: The second Yoshi lays eyes on someone, his reaction speed multiplies
        itself several times over, making the character look nearly frozen, and allowing
        Yoshi himself to move at much greater speeds, allowing him to effortlessly
        land attacks he normally couldn''t. *Super Chance: Yoshi enhances his luck
        as well as his allies within his vicinity, allowing their weapons to, no matter
        what, regardless of the percentage possibility, trigger Super Conditions such
        as Ink, Honey and Bounce during their next attack. *Rumblebangs: Yoshi has
        many Rumblebangs he carries around. They do their job best at moderate distances.
        **Egg Creamer: A weak and basic Rumblebang. **Last Dance: A weak Rumblebang
        with a 30% chance of inflicting Freeze, freezing the foe solid, as well as
        a 30% increase of damage towards brutes. **Bwahrmageddon: A weak Rumblebang
        with a 30% chance of inflicting Ink, blinding the foe and drenching them in
        black ink, as well as a 30% increase of damage towards brutes. **Surly Temple:
        A decently powered Rumblebang with a 30% chance of inflicting Freeze. **Crossfire
        Castle: A decently powered Rumblebang with a 30% chance of inflicting Ink.
        **Rainbow Roaster: A weak Rumblebang with a 30% chance of inflicting Freeze.
        **Calavera Cannon: A moderately powered Rumblebang with a 30% chance of inflicting
        Freeze. **Eye of The Kraken: A moderately powered Rumblebang with a 30% chance
        of inflicting Ink. **Luau Launcher: A moderately powered Rumblebang with a
        30% chance of inflicting Freeze as well as a 30% increase of damage towards
        bandits/thieves. **Prey of Kitsune: A moderately powered Rumblebang with a
        30% chance of inflicting Ink as well as a 30% increase of damage towards bandits/thieves.
        **Golden Rule: A moderately powered Rumblebang with a 30% chance of inflicting
        Freeze as well as a 10% increase of damage against stronger foes. *Rockets:
        Yoshi has many Rockets he carries around. These have a wide area of effect,
        making them good for clearing out debris, or, cover. **Supa Bwahzooka: A weak
        and basic Rocket. **Brush With Mortality: A decently powered Rocket with a
        60% chance of inflicting Ink. **Song of Kong: A decently powered Rocket with
        a 60% chance of inflicting Freeze. **Candy Striper Sniper: A decently powered
        Rocket with a 60% chance of inflicting Ink. **Torpedo: A decently powered
        Rocket with a 60% chance of inflicting Freeze as well as a 10% increase of
        damage against larger enemies. **Blooper Shooter: A decently powered Rocket
        with a 60% chance of inflicting Ink as well as a 30% increase of damage towards
        bandits/thieves. **Timber!: A moderately powered Rocket with a 60% chance
        of inflicting Ink. **First Responder: A moderately powered Rocket with a 60%
        chance of inflicting Freeze. **Eat Lead: A moderately powered Rocket with
        a 60% chance of inflicting Ink as well as a 30% increase of damage towards
        knights. **Pastel Farewell: A moderately powered Rocket with a 60% chance
        of inflicting Freeze as well as a 30% increase of damage towards knights.
        **Golden Tongue: A moderately powered Rocket with a 60% chance of inflicting
        Ink as well as a 15% increase of damage towards stronger foe'
