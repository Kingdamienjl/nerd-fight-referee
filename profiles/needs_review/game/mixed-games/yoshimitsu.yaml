        point of the E Ring. That is 1,818,806.2172398892566485166108894 miles. Since
        they cover the entire thing in 14 seconds, we divide the distance by the time,
        and that means they were going at exactly 129,914.7298028492326177511864921
        miles per second. Light moves at 186,282 miles per second, so they were moving
        at roughly 0.69740744084975148098c, or around 70% of the speed of light, which
        makes them this speed) | Immeasurable (Bowser was traversing all of Dream
        Depot and wiping out each dream one by one--which are universes--casually,
        as evidenced by how he's talking about his plan and such, before destroying
        Dream Depot itself. Misstar then says "at this rate, he'll destroy the dream
        worlds one by one." She goes on to say that Yoshi must protect everyone's
        dreams. This means Bowser was casually moving at a rate that would allow him
        to destroy an uncountable set of uncountably infinite universes. Not only
        does Yoshi fight Bowser in this game, but during the story, he's actively
        chasing Bowser through Dream Depot, so Mario accomplished a toned down version
