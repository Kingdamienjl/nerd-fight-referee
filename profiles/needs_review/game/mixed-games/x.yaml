      value: 'Nigh-Omnipotence (X possesses infinite abilities) Specific applications
        include: *Shapeshifting & Transformation (2011, Faker, Lore X. X has three
        primary forms, with its Faker form being a disguise with a similar appearance
        to Sonic the Hedgehog. It can also take on other miscellaneous forms. X has
        access to stronger transformations) ** Small Size (Type 0. X in 2011 is 3''7",
        Whereas Lord X is 3''3"/100 cm, 77 lbs/35 kg) * Reality Warping, Spatial Manipulation,
        Time Manipulation, Causality Manipulation, Physics Manipulation, Matter Manipulation,
        Quantum Manipulation (X created its own universe right beside the universe
        of Earth, as well as possessing complete mastery over it on both a macrocosmic,
        microcosmic, atomic, subatomic, and quantum level) * Flight * Teleportation
        * Illusion Creation * Telekinesis * Technology Manipulation & Data Manipulation
        (Can leave messages on the player''s desktop & actively manipulate windows)
        ** Portal Creation & Limited Dimensional Travel (Via the its game disc. X
        can open an interdimensional portal through a computer monitor in order for
        it to cross over to Earth for a limited amount of time) * Restoration & Resurrection
        (Physical. Can restore and heal vessels back to full health. Created the Life
        Monitors, which resurrects vessels back to full health a certain amount of
        times) * Life Manipulation, Biological Manipulation, Plant Manipulation &
        Necromancy (X can mutate and alter the plants around Hill Zone. Stated to
        distort organic materials to "create art") ** Avatar Creation, Emotional Manipulation
        & Power Bestowal (X can create vessels of the Sonic characters with human
        souls inside them, as well as one for for itself. These vessels also possess
        all the powers shown by the Sonic characters, including their superhuman strength.
        By fusing part of itself with human emotions, X managed to create its Seven
        Guardians) * Existence Erasure (Using the vortex inside its mouth, X can unmake
        the fundamental forces of those that it feeds into its vortex) * Body Puppetry
        * Soul Manipulation * Mind Manipulation * Clairvoyance (X is able to know
        its victims and the player at a personal level) * Elemental Manipulation (Fire,
        Fog, Weather, Electricity & Darkness. X engulfed HIDE AND SEEK in flames and
        can dissipate flames as well. Created fog in GO BACK. Can control darkness.
        Created a thunderstorm in YOU CAN''T RUN) * Blood Manipulation and Metal Manipulation
        (Caused blood and rust to appear across the floor of YOU CAN''T RUN) * Acrobatics,
        Body Control, Elasticity, Additional Limbs & Bodily Weaponry (Has sharp teeth
        and claws. Can utilize the Spin Attack. Can spin its neck around, open its
        jaw unnaturally wide to leading to a vortex in its mouth, it can make hands
        crawl out of its throat, it can stretch its limbs, it can change its body''s
        coloring, and remove its skin like a suit) * Social Influencing (Social Position,
        Instigating Fear, Deception, Leadership, Charisma and Coercion. X is extremely
        manipulative and deceptive. It commands the Seven Guardians. Its mere presence
        caused Alan to become fearful) * Limited Cosmic Awareness & Breaking the Fourth
        Wall (Canonically aware of different universes. X knows about the player''s
