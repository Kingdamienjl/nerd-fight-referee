    - field: standard_equipment
      value: '{{{!}} class="fandom-table" {{!}}+Base Weapons !Weapons !Description
        !Visual {{!}}- {{!}}X-Buster {{!}}Also known as the Mega Buster Mark 17, it
        comes equiped with an energy amplifier and the Variable Weapons System. On
        its own, the X-Buster fires solar energy shots, and can charge its shot to
        deal more damage. By Mega Man X7, it can increase its charge level from three
        stages to four. {{!}} https://static.wikia.nocookie.net/megaman/images/1/1c/X1_XBuster1.png/revision/latest/scale-to-width-down/220
        https://static.wikia.nocookie.net/megaman/images/a/ae/X1_XBuster2.png/revision/latest/scale-to-width-down/220
        https://static.wikia.nocookie.net/megaman/images/0/0a/X3_XBuster3.png/revision/latest/scale-to-width-down/220
        https://static.wikia.nocookie.net/megaman/images/9/9d/X7_XBuster4.png/revision/latest/scale-to-width-down/220
        {{!}}- {{!}}Z-Saber {{!}}Taken from Zero after the events of Mega Man X5,
        X is nowhere nearly as skilled with the Saber as his Buster. However, the
        blade is significantly more powerful than his Buster in most cases. There
        are several armors designed to take advantage of the Z-Saber and make X more
        dangerous wielding it, such as the Blade Armor and Shadow Armor. {{!}}https://static.wikia.nocookie.net/megaman/images/a/ac/MMX3_X_ZSaber.gif/revision/latest/scale-to-width-down/220
        https://static.wikia.nocookie.net/megaman/images/7/76/MMX6_X_ZSaber.gif/revision/latest/scale-to-width-down/220
        {{!}}- {{!}}} ===Armors=== X has adopted many armors for use over the years,
        all with multiple different functions to serve different purposes. One notable
        thing about them is that X possesses the ability to switch between them at
        a moments notice. |-|Mega Man X= {{{!}} class="fandom-table" {{!}}+Armor(s)
        in Mega Man X !Armor !Description !Visual {{!}}- {{!}}First Armor {{!}}X''s
        first armor- able to add an extra charge to his Buster- along with the ability
        to charge Special Weapons, reduce damage by half, and the addition of the
        dash which would be implemented into his base abilities afterwards. {{!}}https://static.wikia.nocookie.net/megaman/images/c/c7/Mega_Man_X_DiVE_Hunter_Program_First_Armor_X.png/revision/latest/scale-to-width-down/220
        {{!}}- {{!}}} |-|Mega Man X2= {{{!}} class="fandom-table" {{!}}+Armor(s) in
        Mega Man X2 !Armor !Description !Visual {{!}}- {{!}}Second Armor {{!}}In this
        armor, X gains the ability to store a second fully charged shot, even more
        powerful than his normal full charge shot. In addition, he also gains an air
        dash ability, a scanner to find hidden areas, and the first iteration of his
        ultimate attacks- the "Giga Attack", a screen-clearing energy blast usable
        after taking accumulated damage- which is already reduced by 50%. {{!}}https://static.wikia.nocookie.net/megaman/images/8/80/Mega_Man_X_DiVE_Hunter_Program_Second_Armor_X.png/revision/latest/scale-to-width-down/220
        {{!}}- {{!}}} |-|Mega Man X3= {{{!}} class="fandom-table" {{!}}+Armor(s) in
        Mega Man X3 !Armor !Description !Visual {{!}}- {{!}}Max Armor {{!}}An armor
        that features multiple functions. His fully charged Buster Shot is two-fold,
        ending in a spread shot formation. He also gains access to the Variable Air
        Dash which lets him dash in any direction and the Item Radar which does as
        its name suggests. Most unique is his Body Part''s ability to create a Defense
        Shield around himself to reduce further damage dealt by 25% to after being
        hit on top of the 50% damage reduction. {{!}}https://static.wikia.nocookie.net/megaman/images/d/de/Mega_Man_X_DiVE_Hunter_Program_Third_Armor_X.png/revision/latest/scale-to-width-down/220
        {{!}}- {{!}}Hyper Chip {{!}}The "golden" armor of the game gives X a further
        boost to his Max Armor''s abilities, namely the ability to heal while standing
        still, unlimited charge shots as long as he has weapon energy- and an upgrade
        to his Defense Shield to half damage instead. {{!}}right|220px {{!}}- {{!}}}
        |-|Mega Man X4= {{{!}} class="fandom-table" {{!}}+Armor(s) in Mega Man X4
        !Armor !Description !Visual {{!}}- {{!}}Force Armor {{!}}One of X''s most
        formidable armors. He can utilize Special Weapons indefinitely, with consumption
        halved when he uses charged shots. The armor features two different Buster
        parts, one allowing to store up to four fully charged shots, and another named
        the "Plasma Shot", which is a massively large shot that leaves behind a plasma
        ball on contact to deal continous damage. It also features air dashing, and
        jet boots. While equipped with the Fourth Armor. X is able to store up energy
        from the damage he takes to charge up this attack, which launches him into
        a flying tackle that destroys all normal enemies in its path and grievously
        injuring stronger foes. It is so powerful that nearly any foe in the game
        can be felled in two well-placed uses of this attack. In addition, he is completely
        invulnerable to any and all attacks while using this attack, even shrugging
        off Zero''s instant-kill Ittou Ryoudan: Genmurei. {{!}}https://static.wikia.nocookie.net/megaman/images/9/9c/Mega_Man_'
