    - field: weaknesses
      value: 'Rick is genuinely insane, alcoholic, has a serious drug addiction, and
        is often reckless. | Pickle Rick will die after a few hours Notable Attacks/Techniques:
        His Inventions: *Portal Gun: A gun that rips a hole in space-time, allowing
        travel to any point in any universe. Rick can also use this as a makeshift
        weapon, as opening a portal inside another being rips them in two. *Meeseeks
        Button: Summons a bunch of immortal creatures that will perform one task before
        dying. Become more insane the longer they exist due to hours seeming like
        an eternity, to them. Meeseeks are apparently completely unable to die until
        their task is completed, and giving them a task which is seemingly impossible
        to complete will eventually result in the summoned Meeseeks resorting to the
        most drastic measures to complete the task by technicality. *Size Shifting:
        Able to affect people and objects, either making them tiny enough to fit inside
        someone or making them grow to the size of a continent. *Love Potions/Diseases:
        Created a virus that made whoever it was used on fall in love with Morty (Except
        those genetically related to him), but due to it being flu season, the substance
        piggybacked on the flu and began to spread; he created two others to counter
        that. The first turned everyone on the planet into praying mantis monsters,
        while the second turned everyone into Cronenberg monsters. *Time Freeze: Freezes
        time on a universal scale. Due to technology stolen from the 4th dimension,
        Rick can do this with the press of a button. *Concentrated Dark Matter: A
        method used for travelling faster than anyone else in the universe; similar
        chemical reactions cause massive explosions. A handful of the components mixed
        incorrectly resulted in an explosion the size of Jupiter. *Anti-Matter Gun:
        A pistol that shoots anti-matter. Capable of even killing trans-dimensional
        higher beings immune to traditional matter and energy based attacks. *Particle
        Watch: A wristwatch that fires a concentrated particle beam. Completely destroys
        the target on a subatomic level. *Freeze Ray: Completely freezes organic targets,
        turning them into incredibly fragile icy statues. Since the affects can be
        undone, this is used in the rare case of nonviolent neutralization. Comes
        in taser and gun form. *Curse Remover: A device which can remove magical properties
        from a wide variety of different things. Since it is able to remove certain
        effects while leaving others intact, Rick used this device to turn cursed
        objects into completely beneficial ones (i.e. turning a pair of boxing gloves
        which would cause the wearer to be stuck reliving a single fight for all eternity
        into a pair of time traveling mittens). *Dream Inceptors: A small device which,
        when implanted into the ear of an unconscious sentient being, allows the user
        to travel into the being''s dreams, potentially implanting new thoughts and
        influencing the behavior of the target once they wake up.'
