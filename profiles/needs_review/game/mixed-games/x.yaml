    - field: weaknesses
      value: 'X is powered by sunlight so remaining without it for extended periods
        of time could prove dangerous (though he has large reserves). He can be pacifistic
        to a fault at times. His special weapons have a limited number of shots, but
        this can be averted if composite X is used, as the fourth game''s iteration
        of the Ultimate Armor eliminates energy costs. ===Notable Attacks/Techniques:===
        Final Strike: A conjunction attack with his allies (most commonly Zero and
        Axl) that unleashes a powerful barrage of energy blasts on a number of opponents,
        dealing immense damage if not outright killing the targets in question. This
        attack completely ignores all defenses and recharges the weapon energy of
        X and his allies after use. This was the attack used to finish off Omega in
        the Elf Wars. Variable Weapons System: Like the Mega Man before him, X has
        the ability to copy weapons of defeated Mavericks, gaining some of their powers.
        The following is a list of these weapons found throughout the games. {| class="fandom-table"
