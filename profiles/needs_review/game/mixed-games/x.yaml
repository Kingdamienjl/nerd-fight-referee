- id: claim-weaknesses-a37d9e6d
  section: weaknesses
  axis: weakness
  text: 'X is powered by sunlight so remaining without it for extended periods of
    time could prove dangerous (though he has large reserves). He can be pacifistic
    to a fault at times. His special weapons have a limited number of shots, but this
    can be averted if composite X is used, as the fourth game''s iteration of the
    Ultimate Armor eliminates energy costs. {{scroll box|content=}} ===Notable Attacks/Techniques:===
    Final Strike: A conjunction attack with his allies (most commonly Zero and Axl)
    that unleashes a powerful barrage of energy blasts on a number of opponents, dealing
    immense damage if not outright killing the targets in question. This attack completely
    ignores all defenses and recharges the weapon energy of X and his allies after
    use. This was the attack used to finish off Omega in the Elf Wars. Variable Weapons
    System: Like the Mega Man before him, X has the ability to copy weapons of defeated
    Mavericks, gaining some of their powers. The following is a list of these weapons
    found throughout the games. |-|Mega Man X= {{{!}} class="fandom-table" {{!}}+Weapons
    from Mega Man X !Weapon !Description !Visual {{!}}- {{!}}Charmeleon Sting {{!}}Fires
    three needle like lasers at three different angles. When charged, X becomes intangible
    for a period of time, while still being able to attack himself. {{!}}https://static.wikia.nocookie.net/megaman/images/4/40/X1_ChameleonSting.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/4/4d/X1_ChameleonSting2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Shotgun Ice {{!}}Fires a shot of ice that fragments and scatters shrapnel
    the other direction. When charged it created a sled that X can use as an alternative
    mode of transportation. This weapon is superior to Tundra Man''s Tundra Storm,
    which reaches Absolute Zero temperatures. {{!}}https://static.wikia.nocookie.net/megaman/images/2/24/X1_ShotgunIce.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/5/5e/X1_ShotgunIce2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Fire Wave {{!}}Fires a continous wave of flame. When charged, the
    wave becomes its own ground based projectile. This weapon is superior to Heat
    Man''s Atomic Fire, which reaches temperatures hotter than the sun at 12,000 Degrees
    Celciu. {{!}}https://static.wikia.nocookie.net/megaman/images/1/18/X1_FireWave.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/8/84/X1_FireWave2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Rolling Shield {{!}}Launches a barrier at foes, when charged, creates
    a damaging forcefield around himself. {{!}}https://static.wikia.nocookie.net/megaman/images/d/d8/X1_RollingShield.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/2/2e/X1_RollingShield2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Homing Torpedo {{!}}Launches missiles that home into enemies. When
    charged, fires multiple torpedoes at once. {{!}}https://static.wikia.nocookie.net/megaman/images/f/fe/X1_HomingTorpedo.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/0/05/X1_HomingTorpedo2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Storm Tornado {{!}}Fires a tornado at enemies, and when charged, the
    tornado launches vertically. {{!}}https://static.wikia.nocookie.net/megaman/images/6/66/X1_StormTornado.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/4/4c/X1_StormTornado2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Electric Spark {{!}}Fires a purple sphere of electricity. When charged,
    it becomes a "fence" of electricity that affects a wide area. {{!}}https://static.wikia.nocookie.net/megaman/images/a/a4/X1_ElectricSpark.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/b/b8/X1_ElectricSpark2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}Boomerang Cutter {{!}}Launches boomerangs that can catch items for
    X. When charged, fires off boomerangs in all directions. {{!}}https://static.wikia.nocookie.net/megaman/images/5/51/X1_BoomerangCutter.gif/revision/latest/scale-to-width-down/220
    https://static.wikia.nocookie.net/megaman/images/5/5a/X1_BoomerangCutter2.gif/revision/latest/scale-to-width-down/220
    {{!}}- {{!}}} |-|Mega Man X2= {{{!}} class="fandom-table" {{!}}+Weapons from Mega
    Man X2 !Weapon !Description !Visual {{!}}- {{!}}Crystal Hunter {{!}}Fires a gravity
    based shot that incases enemies in crystal, which can be used as stepping stones-
    and dashing into these brittle enemies shatters them. The charged variant forces
    time to resonate with vibration of the crystals, slowing it down by half, causing
    enemies and X alike to move at half speed. {{!}}N/A {{!}}- {{!}}Magnet Mine {{!}}Fires
    a mine that magnetically sticks to walls which he can manipulate the trajectory
    of, before exploding. The charged variant fires a small black'
  source_ids: *id003
