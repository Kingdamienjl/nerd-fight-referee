    - field: weaknesses
      value: 'Djinn need to be reset after being used, or given time to recover entirely
        after summons are used. While in these states, the Djinn don''t give the adept
        boosts and need to be managed carefully. Notable Attacks and Techniques: |-|Mars=
        * Mars Psynergy: As a Mars Adept, Tyrell specializes in the manipulation of
        fire, heat, lava, and strength. ** Planet Diver: Tyrell leaps into the sky
        and lunges onto the foe, resulting in an exploding impact. ** Planetary: Tyrell
        strike a foe with a dragon made of heavenly fire. ** Debilitate: Tyrell halves
        several opponents'' durability. ** Supernova: Tyrell attacks the opponent
        with a massive explosion. ** Fiery Blast: Tyrell attacks the opponents with
        an explosive blast. ** Carpet Bomb: Tyrell attacks the opponent with a barrage
        of bombs. ** Protector: Tyrell boosts the durability of him and his allies
        by a tremendous amount. ** Magma Storm: Tyrell triggers an eruption to happen
        under the opponent, attacking with the volcano''s might. ** Epicenter: Tyrell
        attacks the opponent with a Dragon Cloud. It causes a fiery explosion that
        knocks the opponent back. ** Flare Storm: Tyrell attacks multiple foes with
        incinerating flames. ** Inferno: Tyrell summons a scorching fireball to attack.
        ** Searing Beam: Tyrell shoots a massive heat beam. ** Pyroclasm: Tyrell unleashes
        a massive volcano blast. ** Dragon Fume: Tyrell attacks with a large plume
        of flames. |-|Venus= * Venus Psynergy: Through the aid of Djinn, Tyrell is
        able to use Venus Psynergy, granting him control over earth, the environment,
        energy, and life. ** Quake Sphere: Tyrell triggers an earthquake in his vicinity
        to deal earth-elemental damage to multiple foes at once. ** Wild Growth: Tyrell
        causes plants to suddenly grow into thick vines to attack his foes, dealing
        nature-elemental damage. ** Avalanche: Tyrell triggers a massive avalanche
        to bury his foes in rock. ** Nettle: Tyrell causes massive briars to erupt
        from the ground to impale his foes. ** Stone Spire: Tyrell drops huge stalactites
        unto his foes. ** Grand Gaia: Tyrell causes the earth itself to open up and
        unleash its might upon his foes. ** Punji Strike: Tyrell causes huge spears
        of sharpened bamboo to impale his foes from below. ** Thorny Grave: Tyrell
        summons a wave of loathsome fiends to attack his foes. ** Helm Splitter: Tyrell
        attacks his target''s head with Psynergy, potentially paralyzing them. **
        Skull Splitter: Tyrell attacks his target''s head with even more potent Psynergy,
        potentially killing them outright. ** Odyssey: Tyrell manifests a colossal
        sword out of Psynergy and plunges it into his foe to deal massive damage.
        ** Potent Cure: Tyrell greatly heals himself or an ally. ** Revive: Tyrell
        raises an ally back up from the dead. ** Haunt: Tyrell summons spirits to
        continuously harm the opponent over time, ignoring durability. ** Curse: Tyrell
        curses the opponent, slowly causing Instant Death. ** Condemn: Tyrell summons
        a reaper to instantly kill the opponent. ** Annihilation: An attack that instantly
        kills the foe, and if it fails to do so, still afflicts massive damage. |-|Jupiter=
        * Jupiter Psynergy: Through the aid of Djinn, Tyrell is able to use Jupiter
        Psynergy, granting him control over air, wind, and lightning, and the mind.
        ** Delude/Mist: Tyrell summons a mist that makes it much harder for the opponent
        to hit or target him. ** High Impact/Angel Spear: Tyrell boosts the attack
        potency of him and his allies by a tremendous amount. ** Resist/Magic Shield:
        Tyrell boosts the durability of him and his allies by a large amount. ** Astral
        Blast: Tyrell attacks the opponent with a celestial force. ** Thunder Mine:
        Tyrell attacks the opponent with a ball of lightning. ** Enfeeble: Tyrell
        lowers the durability of his opponents by a large amount. ** Drain: Tyrell
        drains the life force of his opponent, adding it to his own. ** Psy Drain:
        Tyrell drains the spiritual, mental, physical, magical, psychic, and elemental
        energy of his opponent, adding it to his own. ** Blue Bolt: Tyrell attacks
        the opponent with a powerful lightning bolt. ** Bind: Tyrell seals the usage
        of the opponent''s spiritual, mental, physical, magical, psychic, and elemental
        abilities. ** Hurricane: Tyrell attacks the opponent with a hurricane, using
        the wind''s might. ** Thunderhead: Tyrell conjures a thunderstorm, attacking
        the opponent with the storm''s fury. ** Death Leap: Tyrell conjures a strange
        and powerful fan to attack the opponent with. ** Shuriken: Tyrell throws several
        giant shuriken at the opponents. |-|Mercury= * Mercury Psynergy: Through the
        aid of Djinn, Tyrell is able to use Mercury Psynergy, granting him control
        over water, ice, and compassion. ** Pure Ply: Tyrell uses his faith to greatly
        heal himself or an ally. ** Pure Wish: Tyrell makes a wish that greatly heals
        his entire party. ** Break: Tyrell eliminates the status boosts of his opponent.
        ** Cutting Edge: Tyrell attacks the opponent with a shockwave. ** Plume Edge:
        Tyrell attacks the opponent with a geyser erupt'
