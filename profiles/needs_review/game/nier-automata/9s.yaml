    - field: intelligence
      value: At least Gifted. Even combat models have exceptional technical knowledge
        and can direct a fusion reactor bypass. In an organization of tech experts
        able to hack alien technology, 9S is the best. So much so his very existence
        posed a threat to YoRHa so he was assigned an undercover executioner type
        android to watch him and kill him if he ever gleaned information he should
        not. However, he was able to consistently deduce the identity of the E-Type
        android. He's demonstrated his hacking skills saving 2B and himself from getting
        caught up in YoRHa's network corruption and resulting destruction. Temporarily
        neutralized a Logic Virus infection within himself, which is extremely difficult
        and at times impossible for other androids to do without the use of a vaccine
        program. During his battle with Eve, he hacked and severed Eve's connection
        to the machine network, a network that spanned the entire planet and was deemed
        to be impossible by Pod 042. Backed up his data and consciousness into the
        network of surrounding defunct machines to save himself after contracting
        a Logic Virus infection he was unable to combat. Despite all attempts to stop
        him, 9S always breaches the Bunker's security and discovers the truth about
        humanity. A skilled pilot and combatant, although below the level of 2B and
        A2. Androids pass along knowledge and skills by sharing data. Making each
        android a culmination of the skills and knowledge of past generations of androids.
        However 9S is not a combat unit, instead meant for scouting and reconnaissance.
        In combat usually relies on his technical knowledge to defeat his opponents.
        This also means the combat data he's been given is not as extensive as dedicated
        combat units. However he is still shown to be a capable fighter. After the
        destruction of YoRHa he went on a warpath against the machines. Has admitted
        to being unable to defeat 2B in direct combat, calling it a "One-sided fight",
        and resorted to ambushing and hacking her in order to gain an upper hand.
        Was able to match A2 in one on one combat but this was after he was infected
        by a logic virus which would remove his limiters, making him stronger and
        faster, and A2 was also abiding by the final wishes of 2B to take care of
        9S. In the Tower, 9S defeats several copies of 2B controlled by the machines
        but he acknowledges they were not as skilled as she was.
      source_id: vsbattles-9s-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Scanner Models are not optimized for battle, although this hasn''t really
        affected him. As an android he is affected by electromagnetic waves and Logic
        Viruses, and hacking, although his barriers give him heightened protection
        from electromagnetic waves and his skill at hacking gives him an advantage
        in defending himself from viruses and hacking. The body he is currently in
        dies if the OS chip is removed. He will lose his Type 8 immortality if the
        YoRHa network is destroyed. His mental stability was impacted severely by
        the death of 2B, and caused him to become deranged, violent, and lack a sense
        of self-preservation. The Pod lasers can only damage through heat and thus
        certain materials including heat resistant materials can take reduced to no
        damage from them. Note: A2 surviving the destruction of Mt. Ka''ala cannot
        be considered at full strength because of her distance from Number 4. The
        inverse square law must be applied to calculate the energy. Notable Attacks/Techniques:
        ===Hacking=== Can easily hack into machines, electronics, and even himself.
        Able to bypass all of the Bunker''s security. ===Pods=== thumb|250px Pods
        are small robots that follow and support the main Characters of NieR:Automata.
        The number of pods accompanying an android is three (Pod A, Pod B and Pod
        C). The Pods are capable of flight and are extremely useful in combat in various
        ways: - The pod can provide information. It can access the YoRHa network and
        draw knowledge from its vast archives. Additionally it can scan the surroundings
        and observe and analyze opponents. - It can use its respective weapon to perform
        long range attacks on the enemy. The pod is able to lock on to its target
        in order to greatly improve accuracy and trace enemy movements automatically.
        Those three pods each hold a different one of the three following'
      source_id: vsbattles-9s-game
      provider_id: vsbattles
      authority: high
