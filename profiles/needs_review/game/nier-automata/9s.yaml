    - field: weaknesses
      value: 'Scanner models like 9S are not optimized for battle, though 9S seems
        to be an exception to this as this does not seem to hinder him. As an android
        he is affected by electromagnetic waves and Logic Viruses. The body he is
        currently in dies if the OS chip is removed. Will lose his Types 4 & 8 immortalities
        if the YoRHa network is destroyed. The Pod lasers can only damage through
        heat and thus certain materials including heat resistant materials can take
        reduced to no damage from them. 9S is obsessed with 2B and loves her dearly,
        so much so that when she died right in front of his eyes, his mentality slowly
        corroded, being obsessed with killing all the Machine Lifeforms and A2, consumed
        by violence, Hacking: Scanner models has the ability to hack into machine
        lifeforms, take control over them and even impair their senses. 9S has shown
        the capability of hacking even organic people, such as Emil. Given the fact
        that this hacking ability is initiated through the manipulation of Maso, this
        would mean that this hacking ability is a magical ability, and is not limited
        to be used on machines and can be used on living organisms., R010: Laser:
        Fires a powerful laser in the direction that the Pod is facing. The charged
        version adds an additional laser per Pod., R020 Mirage: Analyzes all enemies
        in a fixed radius, allowing combatants to deliver a series of deadly slashes
        to all who are caught within. The charged version increases the AOE of the
        program spell., R030 Hammer: Summons a mass of energy in the shape of a large
        hammer that unleashes a devastating blow upon its target. The charged version
        adds an additional hammer per Pod., R040 Blade: Creates a blade and spins
        the Pod holding it around the player at high speed, wreaking havoc on any
        enemies it touches. The charged version adds an additional blade per Pod.,
        R050 Spear: Produces a mass of energy that sprouts from the ground in the
        shape of deadly spears. The charged version adds additional spears on the
        left and right and then all four diagonals., A060 P Shield: Deploys a protective
        barrier that blocks melee attacks. The shield is strong enough to completely
        block all melee attacks performed by the enemies and bosses in the game. The
        duration is dependent on the charge (1 Pod: 4.5s, 2 Pods: 6.5s, 3 Pods: 8.5s).
