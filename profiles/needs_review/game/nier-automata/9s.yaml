    - field: powers_and_abilities
      value: '9S= {{#tag:tabber| {{!}}-{{!}}Base= *Superhuman Physical Characteristics
        **Enhanced Senses **Inorganic Physiology (Type 2; Is an Android that was created
        to simulate humans by exerting blood and other bodily fluids) **Expert user
        of close range weapons **Martial Arts **Acrobatics *Afterimage Creation (Can
        form afterimages whenever he dodges an attack) **Information Analysis (Culmination
        of the knowledge and skills of previous and current generation of androids)
        **Telekinesis (Via Near Field and Far Field Controls. His method of usage
        of weapons is through manipulating them telekinetically) **Enhanced Senses
        **Regeneration (High-Low;NieR Automata; 2017; Ch 17-05: 9S Self-repairs (C)
        via nanomachines) **Space Survival & Self-Sustenance (Types 1 & 2; Androids
        don''t need oxygen to breathe. Was perfectly fine in the vacuum of space.NieR
        Automata; 2017; Ch 11-05: 2B Escape the Bunker (Loss) (C) YoRHa androids also
        don''t need fuel NieR Automata; 2017; YoRHa Stage Play) *Immortality (Types
        4, 5, 6 & 8; To machine lifeforms and androids, death--even the concept of
        death--is meaningless. YoRHa units can upload data to the Bunker to retain
        their memories. When they die, they simply replace themselves with another
        unit of the same model from the Bunker. There are multiple units of the same
        model, e.g. 2B, that exist simultaneously--they can replace each other or
        even be deployed simultaneously. Transport devices set up by YoRHa also contain
        materials that can build a YoRHa unit and deploy them immediately in various
        locations. Cannot die as long as her memory data exists in the YoRHa Network.
        9S can also transfer his own consciousness into any machine, computer or digital
        network. Was able to survive 2B killing his body that was infected by the
        Logic Virus by transferring his consciousness to a nearby Machine Lifeform)
        **Resurrection (Should the active body be destroyed her memory data from the
        YoRHa Network will automatically be put into a replacement body) *Soullessness
        (All Androids are void of souls, which is the reason why both them & Replicants
        were used to fight off Legions without the fear of being inflicted by the
        White Chlorination Syndrome, which turns any being with a soul into a salt
        statue and forces them into a Pact with the god of Midgard to turn them into
        Legions) *Hacking (As an S Model, He can hack any machine, computer, etc.
        wirelessly over a distance of multiple meters) *Technopathy & Possession (Can
        transfer his consciousness into any machine, computer or digital network)
        *Matter Manipulation (Able to convert matter into data and save it in his
        inventory and vice versa) *Self-Destruction & Explosion Manipulation (Via
        Black Box) *Heads-up display on the combat visor (With minimap, enemy location,
        data on enemies, various other informationYoRHa: Pearl Harbor Descent Record
        - A NieR:Automata Story; Vol 02) * Reactive Evolution, Reactive Power Level,
        Empowerment & Indomitable Will (Androids, like humans, can evolve when exposed
        to pressure. The YoRHa stage plays continuously show how, in many ways, androids
        are similar to humans, able to dream, feel emotions, and achieve extraordinary
        things thanks to that. Jackass says that android battle fever is similar to
        the human emotion of love, with androids having an algorithm identical to
        the pleasure center in the human brain that lets them derive pleasure from
        battle, without which they would have probably stopped fighting a long time
        ago. It''s possible for machines to develop a human heart. Conviction, hope,
        and emotions can massively fuel a fighter, to the point they manage to defeat
        much stronger enemies who view them as ants. The Heart is one''s spirit, the
        strength that resides in people, the intangible strength of one''s soul, an
        inconstant and immeasurable factor behind people''s victories against their
        opponents. The soul is endlessly transforming and seeking its own source,
        meaning it evolves and ascends constantly) *Magic, Energy Manipulation, Creation,
        Reality Warping, Law Manipulation, Physics Manipulation, Mind Manipulation
        & Memory Manipulation (9S can manipulate magic particles that are known as
        Maso. Maso is a mystical, extra-dimensional element that can be manipulated
        to harness energy from other worlds, allows the wielder to warp reality and
        break the laws of physics. In addition, this process, known as "magic," allows
        for the creation of "something from nothing". Magic works by drawing the magic
        particles by drawing on energy from across the multiverse, so it is fundamentally
        different from what we typically call magic. In addition, magic uses the naturally
