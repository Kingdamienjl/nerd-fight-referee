        cameras, turrets and robots as well as weakening opponents in exo-suits. **Concussion:
        Erupts in a flash of blinding light, staggering anyone in range of it and
        causing them to lose their vision and hear loud ringing noises for a few seconds.
        **Smoke: Emits a thick smokescreen around itself. **Gas: Emits gas around
        itself, which knocks out anybody in range. *Zenith CA-40: A standard sidearm.
        Holds up to 38 rounds when upgraded. Can fire Regular and EMP bullets in Semi-Auto
        or Full-Auto fire modes. Can be modified with a Laser Sight and Silencer.
        *Mustang Arms .357 Magnum: A rapid fire revolver, which can hold up to 12
        rounds when upgraded. Can be modified with a Silencer. *Diamond Back .357:
        A revolver, can hold 7 rounds at maximum. Can be upgraded to fire explosive
        rounds *Zenith ZAP: A non-lethal single-shot Stun Gun with a built-in Silencer.
        Has a very limited range. Can be modified with a Laser Sight. *Hurricane TMP-18:
        A capable machine pistol, which can hold up to 60 rounds when upgraded. Can
        be modified with a Silencer, Laser Sight and Holosight. *FR-27 S.F.W.: A firearm
        described as a jack-of-all-trades. Holds up to 48 rounds when upgraded. Can
        fire Regular or Armor-Piercing bullets. Can be modified with a Silencer, Laser
        Sight, 4x Scope and Holosight. *Huntsman Silverback: A double-barreled shotgun,
        each shot of which releases five pellets. *Widowmaker TX Tech-1: A devastating
        shotgun with Semi-Auto and Burst fire modes. Holds up to 12 shells when upgraded.
        Can fire Regular or EMP rounds. Can be modified with a Silencer and Laser
        Sight. The Devastator is a full auto variant of this shotgun which is even
        more dangerous as it carries 32 shells instead of the 12 normal max and uses
        armor piercing ammo instead. However it loses the versatility of its normal
        counterpart as it can no longer use regular and emp ammo. *HawkEye Xbow XH-II:
        A foldable, silent crossbow, which fires Guillaume Tell Golden Arrows - polycarbonate,
        carbide-tipped, fin-stabilized bolts. Can be modified with a Holosight. *Steiner-Bisley
        Model 762 Battle Rifle: A semi-automatic, but weak, sniper rifle. Can hold
        up to 10 rounds when upgraded. Can fire Regular or Armor-Piercing Rounds.
        Can be modified with a Silencer, Laser Sight, 4x Scope and Holosight. *Longsword
        II 203 ERSR: A semi-automatic sniper rifle. Can hold up to 11 rounds when
        upgraded. Can fire Regular or Armor-Piercing Rounds. can be modified with
        a Laser Sight. *TRQ 203-C Longsword: A non-lethal, bolt action sniper rifle
        that can penetrate light armor. Fires .50 cal PPS darts that release torpor-inducing
        drugs on impact, incapacitating humans and animals. *Hi-NRG Plasma Lance:
        One of the most advanced weapons of the 2020s. Fires a large, but inaccurate,
        plasma projectile. Has a low firing rate and can overheat. Magazine can allow
        for up to 50 shots when upgraded. Can be modified with a Laser Sight and Cooling
        System. *M404 Heavy Rifle: A Gatling-Style Multi-Barrel machine gun. Fires
        5.56x45mm ammunition. Can overheat. Can hold up to 200 rounds when upgraded.
        Can be modified with a Laser Sight and Cooling System. *Linebacker G-87 MSLG:
        A powerful grenade launcher. Can hold up to 6 grenades. Can fire Fragmentation,
        EMP, Concussion and Gas Grenades. *329-Series Man-Portable Rocket System (MPRS):
        A powerful rocket launcher, which can destroy large mechs in a few shots.
        Fires smart rockets that the user can slightly control using the crosshair.
        *LS-66 Sabre Direct Energy Rifle (DER): A heavy laser gun, which fires a beam
        in a straight line. Can hold up to 900 battery charge, which lasts for about
        18 seconds of continuous fire. Penetrates walls and other cover with ease.
