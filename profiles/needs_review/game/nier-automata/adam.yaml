    - field: intelligence
      value: "Gifted. He is an experienced fighter, and attended 3 universities and\
        \ obtained Criminal Justice degrees. (Adam is a part human part cyborg and\
        \ an expert hacker and stealth master. Jensen is not only a master in direct\
        \ confrontation, but he also knows how to sneak into highly-secured facilities.\
        \ Many times has he done so without being noticed and was even able to sneak\
        \ into the morgue of a police station, as well as into the office of the Head\
        \ of Tarvos Security in Prague. Jensen himself said that Tarvos is \"the best\
        \ private security company in the world\". Adam's ex-boss, Sarif admits that\
        \ he's a natural when it comes to detective work. This proves to be true when\
        \ Jensen solves multiple mysterious throughout the Human Revolution game and\
        \ later on solved the mystery of the R\u016F\u017Ei\u010Dka Station bombing\
        \ and was able to hacked into global top secret military FEMA organization\
        \ and single handely defeated their military expert bosse being undetected\
        \ by camera every corner and bypassing the heavy security guards, Jensen can\
        \ hack into every single top military tech he came across with and gain access\
        \ into their base and compunds and uploading viruses to breach firewall of\
        \ enemy organization's internet and shutting down their cameras)"
      source_id: vsbattles-adam-game
