    - field: intelligence
      value: 'Extraordinary Genius. During the early stages of the invasion, the machine
        network absorbed the totality of Earth''s knowledge which can be accessed
        by any machine connected to the network. Combined with their rapid learning
        and evolution, the machine network''s knowledge surpassed even the aliens
        that created them. Unlike other machines, Adam is able to make proper use
        of what he knows and learns. Adam was able to deduce the truth that humanity
        was extinct, a secret only one other character was able to figure out.NieR
        Automata - Volume 01 - Long Story Short; Chapter 05 The machines have an enormous
        propensity for learning and evolving. Can learn anything instantly including
        fighting. Despite a single YoRHa android being able to kill several thousand
        machines with no regards to their evolutionYoRHa: Pearl Harbor Descent Record
        - A NieR:Automata Story; Vol 01, after being born Adam was able to learn so
        quickly he went from being barely conscious to being able to defeat YoRHa
