    - field: weaknesses
      value: 'His augmentations are capable of being abused, for example, his enhancements
        were hijacked during the events of Deus Ex: Human Revolution {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; " |Notable Attacks/Techniques: |- |
        {{Border|Scroll=Yes|Visible=No|Content= Adam Jensen being a part cyborg he
        has various enhancements/agumentations, powers, weapory installed on each
        part of his body which he uses in combat that are mentioned below. *Cranium:
        Augmentations built into Jensen''s cranium. Grants mainly hacking and increased
        social capabilities. **Social Enhancer: Utilizes the Computer Assisted Social
        Intelligence Enhancer, or C.A.S.I.E. implant by analyzing the behavior of
        conversation partners and providing psychological data. Also creates a psychological
        profile based on facial expressions, body language and environmental cues.
        It may, as well, detect whenever it is best to interrupt someone. Finally,
        provides the user with tools and strategies to assist in persuading the target
        according to their personality, which is divided into three types: ***Alpha:
        Strives for personal gain and will prefer the options, which benefit them
        best. ***Beta: Enjoys being superior to others and praised for their achievements.
        ***Omega: Easily caves in under pressure. ****Personality type may change
        multiple times during a conversation. **Hacking: Types of special abilities
        given to Jensen in order to hack into various systems and electronics. While
        hacking, he may be detected and shut out of the program by safeguards. ***Capture:
        Utilizes the MHD-995 Hacking Device, a 9 GHz processor with software and hardware
        custom-designed for intrusion of computer networks. It is used to commandeer
        network hubs and launch further attacks on the system. ****Hacking Capture
        Lv. 2: Allows the user to hack into Level 2 terminals while allowing the processor
        to achieve the clock speed of 9.8 GHz. ****Hacking Capture Lv. 3: Allows the
        user to hack into Level 3 terminals while allowing the processor to achieve
        the clock speed of 10.6 GHz. ****Hacking Capture Lv. 4: Allows the user to
        hack into Level 4 terminals while allowing the processor to achieve the clock
        speed of 11.2 GHz. Taps additional power from the part of the brain responsible
        for breathing, heart rate and blood pressure, putting any user who lacks a
        cybernetic heart in danger. ****Hacking Capture Lv. 5: Allows the user to
        hack into Level 5 terminals while allowing the processor to achieve the clock
        speed of 12 GHz. Only achievable through fully annexing the mentioned above
        important part of the brain, leaving the vital actions to be performed by
        other augmentations. ****Camera Domination: Allows the user to control or
        disable cameras by taking over deeper sub-systems via specialized code. ****Turret
        Domination: Contains a specialized code that controls and inhibits a variety
        of anti-personnel, fixed-based, multi-sensory turret stations, allowing the
        user to have it attack its allies or disable it. ****Robot Domination: Allows
        the user to penetrate mobile, high-functioning, limited AI robotic defenses,
        giving the hacker the ability to disable them or have them attack their allies.
        ***Fortify: Utilizes the Costikyan NeuralOptics Node Fortifier to upgrade
        already captured nodes'' defenses against detection and intrusion. ****Hacking
        Fortify Ver. 1.1: Upgrades the defense rating of a node by a factor of one.
        ****Hacking Fortify Ver. 1.2: Upgrades the defense rating of a node by a factor
        of two. ****Hacking Fortify Ver. 1.3: Upgrades the defense rating of a node
        by a factor of three. ***Stealth: Utilizes the Informational Warfare Obfuscation
        (IWO) by releasing an array of anti-detection rootkit processes, decreasing
        the chances of detection during the capture of a node. ****Code-Level Rootkit
        Ver. 1.0: Seeks out vulnerable security subroutines, blinding them to the
        hacking process and decreasing the chance of detection by 15%. ****Code-Level
        Rootkit Ver. 2.0: Most systems identify the hacking as a false alarm, decreasing
        the chance of detection by 30%. **** Code-Level Rootkit Ver. 3.0: Causes the
        system to continuously self-scramble, decreasing the chance of detection by
        45%. **Infolink: Utilizes the Infolink Communications Package. Allows the
        user to receive and transmit messages by using tight-band microwave signals.
        Adam himself claims it''s the most secure communication service he knows,
        although it has been hacked into before. ***Cochlear Implant: Sends incoming
        audio transmissions directly into the user''s inner ear. ***Subvocalization:
        A microprobe placed on the vocal folds allows the user to send vocal messages
        beyond the range of human hearing. **Micro-Assembler Allows breaking down
        weapons, ammo, and other items into weapon parts from the Inventory. ***Upgrade
        Optimizer Reduces the cost of upgrades and crafting using Weapon Parts. ***Upgrade
        Maximizer Further reduces the cost'
