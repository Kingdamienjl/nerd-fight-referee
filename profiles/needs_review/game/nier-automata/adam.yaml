        \ Eyes of the Lord causes great wear and tear on Adam's body and using this\
        \ ability beyond its limits caused a permanent blindness in him. *Indomitable\
        \ Will: Adam possesses one of the strongest wills of all humanity, his unshakeable\
        \ conviction can be appreciated when he did not waver for a second during\
        \ his fight against Zeus, even after his death Adam stood firm and never bowed\
        \ before Zeus. *Meteor Jabs: An attack which consists of a constant rain of\
        \ rapid blows, which gradually increase in speed, reaching the speed of light\
        \ which can completely overwhelm the opponent. Adam was able to copy this\
        \ technique from Zeus after seeing it with his Eyes of the Lord. *Divine Ax:\
        \ A powerful low kick very fast and powerful, according to Ares this kick\
        \ is able to easily cut the legs of his opponent before they have time to\
        \ react. Adam was able to copy this technique from Zeus after seeing it with\
        \ his Eyes of the Lord. *The Fist That Overcomes Time: A technique in which\
        \ the user begins to accumulate a large amount of divine energy in his fist,\
        \ then the user is able to move at high speed, when this happens time \"stops\"\
        \ for all others, while the user takes the opportunity to attack the adversary\
        \ who is completely defenseless. Originally this technique belonged to the\
        \ Father of Zeus, Cronos the King of the Titans, Zeus took this technique\
        \ after defeating his father during the Titanomachy and later it would be\
        \ copied by Adam thanks to his Eyes of the Lord. == Others == Notable Victories:\
        \ Notable Losses: Inconclusive Matches: Category:Maruchan con Taj\xEDn Category:Tier\
