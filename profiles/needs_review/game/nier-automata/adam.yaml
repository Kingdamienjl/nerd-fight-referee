        \ a human vessel, named Kaworu Nagisa), Acrobatics (The Eva Units, which are\
        \ clones of Adam, are portrayed as being very agile and acrobatic for their\
        \ large size), Accelerated Development & Reactive Evolution (Upscaled from\
        \ Sandalphon, who is adapted to the high heat and high pressure environment\
        \ of a volcano, and metamorphosed into an adult from larval form in seconds,\
        \ and Ireul, who adapted to high concentrations of ozone and even began to\
        \ absorb it to grow stronger. Angels are capable of learning and evolving),\
        \ Light Emission (Adam's body glows a bright white hue, as seem from clips\
        \ of him during the flashback of the Second Impact), Body Control (Adam manifested\
        \ 4 Wings of Light during the Second Impact, which stretched to the stratosphere),\
        \ Forcefield Creation (While the A.T. Fields of the Lilin are weak and only\
        \ help to keep their form, those of the angels can manifest as a powerful\
        \ barrier that cannot be penetrated by any conventional weapon. Only another\
        \ A.T. Field can bypass the latter), Shockwave Generation (Angels can use\
        \ their A.T. Fields offensively in the form of shockwaves), Self-Quantum Manipulation\
