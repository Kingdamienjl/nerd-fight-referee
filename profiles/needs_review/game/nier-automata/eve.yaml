        Aya''s health and cures her of status effects. *LIBERATE: This ability liberates
        Aya''s mitochondria, transforming her. Aya becomes a powerful blue-green mitochondrial
        creature with wing-like appendages sprouting from her arms. She can only maintain
        this form temporarily but increases attack potency and defense while in use.
        Powers (Parasite Eve 2)= *Healing: Allows Aya to directly convert mitochondria
        to energy to promote rapid healing. *Metabolism: Heightens metabolic rate
        allowing Aya to neutralize poisons, diseases and venom. *Lifedrain: Control
        local mitochondria within opponents to generate an electric field that boost
