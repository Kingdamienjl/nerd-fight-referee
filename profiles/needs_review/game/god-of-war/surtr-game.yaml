        rule all worlds. Of which there is an infinite amount. As for feats, Surtr
        not only wanted to destroy the universe Askr is in, but destroy everything
        in existence and leave just one kingdom, with just one king--himself. Infinite
        worlds, infinite kingdoms--it's 2-A irregardless of whether or not he'd destroy
