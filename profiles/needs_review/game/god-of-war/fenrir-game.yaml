        \ unarmed hand-to-hand combat and wielding Mj\xF6lnir, Thor masterfully combines\
        \ both proficient martial arts, such as boxing, wrestling, and grappling,\
        \ and expert handling of his hammer, capable of contending with even the likes\
        \ of Kratos, an extraordinary warrior who was \"without equal\" back in Greece\
        \ and who had killed all the Gods in Greece and slew Magni and Baldur, both\
