    headings_detected:
    - 'Summary:'
    - "Kratos (Greek: \u039A\u03C1\u03AC\u03C4\u03BF\u03C2) is the titular playable\
      \ protagonist of Sony Santa Monica Studio's acclaimed God of War series. Born\
      \ and raised among the violent Spartans, Kratos rose through the ranks to become\
      \ a fearsome general, winning many wars under his command. However, they eventually\
      \ encountered their mortal enemies, the Barbarians, and were nearly wiped off\
      \ the map in the ensuing battle. A desperate Kratos begged Ares, the God of\
      \ War, to help him win the war. Ares listened and bestowed power upon Kratos,\
      \ leading the Spartans to victory. In exchange, however, ''Ares'' demanded Kratos'\
      \ unflinching loyalty. To this end, the God of War tricked Kratos into murdering\
      \ his wife and daughter in the ensuing chaos. As a result, their ashes were\
      \ permanently bonded to Kratos' skin, earning him the moniker \"Ghost of Sparta.\"\
      \ Enraged and consumed by grief, Kratos renounced his servitude to Ares and\
      \ sought vengeance on him, eventually killing Ares and ascending to godhood\
      \ as the new God of War. However, Kratos' struggle did not end there; he had\
      \ to face ''his father'', the rest of the Olympians, and the Titans on the next\
      \ journey."
    - After defeating the Olympians and cleansing Greece through chaos, Kratos fled
      to the Norse homeland where he married Faye and had a son named ''Atreus''.
      Following Faye's death, Atreus and Kratos would embark on a journey to fulfil
      her final wishes, scattering her ashes at the highest peak in all the realms.
      Many obstacles along the way, including fighting several monsters as well as
      opposing the Norse gods themselves.
