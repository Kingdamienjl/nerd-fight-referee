        \ master and showcases a great mastery of the different weapons he manifests)\
        \ Standard Tactics: Mixed use of his summoned weapons, duplication, and teleportation\
        \ for melee options, which we will supplement with blood magics, Bifr\xF6\
        st, and magical blasts. Can use the darkness spell to support his combat and\
        \ catch enemies unaware as well as summon foes to fight for him."
      source_id: vsbattles-tyr-game-god-of-war
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Blood for Blood, Dreyra!:
        A blood sacrifice spell learned from Tyr''s travels to the Mayan pantheon.
        Tyr cuts himself on his weapon and creates a ring of blood orbs that expands
        outwards to his targets. *Those Who Have Fallen, Carry Me!: A more advanced
        blood sacrifice spell, in which targets give their blood and life energy to
        Tyr, allowing him to heal at the cost of their vitality. *Darkness Come, Myrkyr!:
        An Egyptian curse of darkness. Tyr shrouds all of his surroundings in darkness
        save for a few small pockets of light. Even gods with enhanced sensory abilities
        are unable to see within its area of effect. *Um-Huxan!: A spell of presumably
