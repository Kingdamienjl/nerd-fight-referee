  stamina:
    text: Superhuman (Can keep up with Kratos, Atreus, and Freya in an intense battle
      while sustaining brutal wounds, Stalemated the Vanir during the Aesir-Vanir
      war for centuries without tiring out)
    source_ids:
    - vsbattles-odin-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: "Complex Multiversal (Killed the first Giant Ymir and created six of the\
      \ Nine Realms from his body. Capable of traveling between the Nine Realms via\
      \ the Bifrost or his ravens. Sensed Groa having a vision despite her being in\
      \ another realm while he was seated in Asgard. Used the Roots of Yggdrasil to\
      \ seal Freya's curse all the way to Vanaheim.God of War: Ragnar\xF6k (2022)-\
      \ The Reckoning Healed Hrist and Mist while they were in the Spark of the World)"
    source_ids:
    - vsbattles-odin-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Genius (Odin is one of the most powerful and knowledgeable magic users\
      \ in the Nine Realms, having mastered several forms of magic including Sei\xF0\
      r witchcraft. Learned Freya's vulnerabilities and crafted Sei\xF0r curses so\
      \ potent that even she had no counter to them. Is extremely knowledgeable of\
      \ the realms due to having his ravens fly across them and relay anything back\
      \ to him and because he collects prophecies, with Mimir stating that Odin is\
      \ almost as clever as he thinks he is, with Odin liking to view himself as \"\
      all knowing\". Bound the source of his curse on Freya to the roots of Yggdrasil\
      \ knowing that should anyone try to break the curse Nidhogg would appear and\
      \ defend the roots. Above all else Odin is a master manipulator, often being\
      \ able to get his allies and his foes to do what he wants, such as when he disguised\
      \ himself as Tyr to gain the trust of Kratos and his allies. Praised Atreus\
      \ and intentionally began to set a rift between him and Kratos to make Atreus\
      \ go to Ironwood. Brought Atreus outside the walls of Asgard to force a meeting\
      \ between him and Heimdall, knowing the latter would antagonize the former and\
      \ giving him a chance to appear and scold Heimdall, making himself appear more\
      \ likable to Atreus, was able to get everyone including Kratos to accept his\
      \ plan of going into Asgard by lying to them that they'd sneak in undetected\
      \ with only Brok questioning him)"
    source_ids:
    - vsbattles-odin-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
