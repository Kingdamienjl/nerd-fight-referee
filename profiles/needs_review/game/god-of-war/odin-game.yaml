        the Celestials,Thor; Vol 1; #203 let Thor fight Surtur unaided so that the
        battle would weaken Surtur before Odin began his attack,Thor: Vol 1; #351
        allowed himself to be transformed into Surtur as part of a planThor; Vol 1;
        #424 that would result in Thor banishing Surtur and Ymir and leaving them
        in suspended animation,Thor; Vol 1; 425 laid out a plan to defeat the Dark
        Gods, going as far as wiping his own contingency plan from his memory to ensure
        it works out,Thor; Vol 2; #13 was called a master manipulator by Loki, who
        relayed Odins plan of using the World Tree''s weakened condition to his advantage
        by banishing all Asgardians to earth and stripping them of their memories
        to trick Yggdrasil into thinking Ragnarok had already occurred and thus allow
