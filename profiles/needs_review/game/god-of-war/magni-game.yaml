      value: At least Large Planet level to Solar System level9.225 Yottatons of TNT
        - 13 GigaFoe (Uses Solar Fragments to craft weapons and armor, with them containing
        the "fury of the universe" within each fragment. Creates weapons and armor
        out of several Nebula Fragments, each of which stated to have a power of an
        entire galaxy within them which is very powerful. The Lunar Pillars are capable
        of moving planets closer to the Terraria planet, and also get rid of the Sun
        in the process, and the Terrarian can use pieces of them to make armor and
        weapons with their power. The Night's Edge is stated to cut any object in
        half), likely Universe level+ (Defeats Moon Lord, and the mechanical bosses
        plus Mechdusa. Moon Lord at his peak who is stated to seemingly threaten the
        very fabric of the universe itselfIt should be noted that "Terraria", in the
        context of this statement, is likely referring to the universe (saying it's
        referring to the planet isn't a phrase that is very commonly used as opposed
        to the "fabric of reality", and using "Terraria" to refer to the universe
        is commonly seen in the pages). As a bonus, the Terraria wiki also subscribes
        to this interpretation, with the text saying the same thing on the .gg official
        wiki that is promoted on the official website to the game, and is promoted
        by Redigit himself. It also logically makes the most sense, given the Dryads
        had only waged war against Cthulhu when he was threatening reality itself,
        when hope seemed lost. It begs to question, "why would the Dryads, the beings
        consistently referred to being one with nature, only show up to stop Moon
        Lord when he was nearing his goal if his only intent was to threaten the planet
        specifically?" In addition, the fight the Dryads had with Moon Lord is referred
        to as "the Great Celestial War", confirming that it is a war the Dryads had
        waged against Moon Lord after he threatened reality. In addition, the lore
        is said to only exist to aid the protagonist in defeating Moon Lord and saving
        the world, and the lore then continues explaining the universe, aspects that
        are not utilized by the player to complete the game. It thematically makes
        more sense for Moon Lord to threaten the universe if the universe itself was
        to be primarily mentioned in an important scripture to aid the hero.. The
        mechanical bosses were created as organ replicas for Moon Lord to power him
        back to full power, due to his organs being torn out by Dryad civilization
        using their accumulated powers. By the time the Terrarian fights Moon Lord
        however, Moon Lord appears to have healed back his eyes, spine, skull, and
        brain back when he was regaining power back. This heavily suggests that the
        Terrarian fought Moon Lord when he was at the same power as Cthulhu. Stardust
        Pillar's summons are stated to use limitless energy. Moon Lord is stated to
        have unlimited power. Can survive light and fire-based attacks from the Torch
        God, a being stated to be the source of the endless, eternal light given by
        torches. Moon Lord drops Luminite, which is stated to "come from the heavens",
        with materials made with Luminite stated to be "from beyond")
