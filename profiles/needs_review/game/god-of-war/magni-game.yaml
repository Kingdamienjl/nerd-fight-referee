        intercept the Martian Probes which can perform the same feat. Can dodge and
        move faster than Lunar Flares. Can keep up with enemies amplified by an abundant
        amount of the Celestial Pillars' energy. A small amount of which was used
        to move exoplanets close to the planet within seconds, and Terrarian is implied
        to pull moons down at a similar speed with the Lunar Hook. Can dodge and move
        faster than the Empress of Light's light projectiles, and dodge Last Prism,
        which is far faster than light. Can control a literal rainbow projectile.
        Can dodge attacks from the Beam Sword and Gastropods. Defeated Moon Lord,
        who drops the S.D.M.G., an item stated to have come from the edge of spaceTooltips
        that intentionally reference a quote from another media were questioned in
        the making of this profile. The Lunar Hook however, likely is literal in its
        tooltip despite its reference, since the original quote is changed from "You
        want the moon? Just say the word and I'll throw a lasso around it and pull
        it down!" to, "You want the moon? Just grapple it and pull it down!". The
        developers had intentionally changed the dialogue to fit in with the game
        itself. Given the name of the hook, and the fact that it requires ultra-powerful
        fragments to create, this is likely meant to suggest that it has the capacity
        to literally pull down the Moon. Similarly, the S.D.M.G.'s tooltip was also
        considered, despite the tooltip being a reference. The name of the game it
        is referencing is named Edge of Space, and the tooltip states, "It came from
        the edge of space". The lack of capitalization and the purposeful addition
        of the item being said to come from there, suggests that it is both a reference,
        and intended that the item literally came from the edge of space, which is
        backed up by it being dropped by Moon Lord, who was able to move to the blind
        spot of the universe to reach the Terrarian's world.. Can dodge and fight
        enemies who dodge and deflect bullets, meteors and lightspeed lasers)
