    - field: weaknesses
      value: 'Extremely easy to anger Notable Attacks/Techniques: Armor: Armor grants
        percentage-base damage reduction(ex: 20 armor is 20% damage reduction), and
        vice versa for Armor Reduction *Valorous Brand: Each Basic Ability marks enemy
        Heroes hit for 10 seconds. Basic Attacks consume the target''s marks, dealing
        20% bonus damage per mark and healing for 75 per mark. *Celestial Charge:
        Imperius lunges toward a targeted direction and stabs Solarian forward, dealing
        damage. If an enemy is hit, Imperius Stun them for 1 second and deals additional
        damage when it finishes. *Solarion''s Fire: Imperius swings Solarian low to
        the ground, releasing a fiery wave that deals damage. Enemies hit by the center
        take 50% bonus damage and are Slowed by 40% for 3 seconds. *Molten Armor:
        Imperius shrouds himself in flames for 3 seconds, making his armor white-hot,
        striking a nearby enemy for damage every 0.25 seconds. Imperius heals for
        50% of the damage dealt, increased to 100% against Heroes. *Angelic Armaments:
        Imperius summons a ring of blazing swords that grants a large Shield for 3
        seconds. If the Shield lasts the full duration, this Ability can be reactivated
        within 5 seconds to launch 6 swords toward an area, each dealing heavy damage
        to the first enemy hit. *Wrath of the Angiris: After 0.75 seconds of charging
        a hand with lignt, Imperius charges in a target direction, lifting the first
        enemy Hero hit into the Heavens. While in the air, Imperius can steer the
        landing location by moving and showing a light circle showing where they will
        land. After 2 seconds, slam the target into the ground, dealing 375 damage
        and Stunning them for 1 second. *Level 1 **Impaling Light: Celestial Charge''s
        final damage is increased by 75% and cooldown is reduced by 1.25 seconds for
        each Valorous Brand on the target when the Stun completes. **Consuming Flame:
        Increase the center damage of Solarion''s Fire by an additional 125% and its
        Slow amount by 15%. The first enemy Hero hit by Solarion''s Fire refunds 30
        Mana. **Burn The Impure: Consuming a Valorous Brand mark deals bonus damage
        equal to 2.5% of the Hero''s maximum Health. *Level 4 **Sovereign Armor: Molten
        Armor grants 20 Armor for 1.5 seconds. Damaging an enemy Hero with Molten
        Armor increases the duration of the Armor by 0.5 seconds. **Battle Hunger:
        Increase the healing of Valorous Brand by 80%. **Press Forward: Gain 10 Armor
        while being healed by a Regeneration Globe. Damaging an enemy Hero sets the
        duration of an active Regeneration Globe on Imperius to 8 seconds (unless
        it is already higher). *Level 7 **Flash of Anger: Consuming a mark from Celestial
        Charge deals damage around the target and grants Imperius a decent point Shield
        for 4 seconds. **Blaze of Glory: Solarion''s Fire leaves a line of scorched
        earth along its center that explodes after 2 seconds for good damage, dealing
        bonus damage with Valorous Brand marks. **Holy Fervor: ***Active: Activate
        to cause the next 4 Basic Attacks within 10 seconds to cleave for 30% additional
        damage. ***Passive: Casting Molten Armor grants Holy Fervor for 2 Basic Attacks.
        *Level 13 **Pathetic Mortals: Stunning enemy Heroes with Celestial Charge
        reduces their Movement Speed by 25% and damage by 50% for 4 seconds. **Divine
        Rage: Consuming a Valorous Brand mark reduces the cooldown of Molten Armor
        by 1 second. **Heat of Battle: Increase Molten Armor''s healing against Heroes
        by 2% for every 1% of health Imperius is Missing. *Level 16 **Celestial Swiftness:
        Imperius gains 20% Movement Speed for 5 seconds after casting Celestial Charge.
        Gain 40% Attack Speed for 5 seconds for each enemy Hero stunned with Celestial
        Charge. **Melting Touch: Consuming a Molten Armor mark reduces the target''s
        Armor by 25 for 4 seconds. **Valorous Pursuit: Active: Activate to teleport
        to an enemy that has been marked by Valorous Brand and gain 25 Armor for 3
        seconds. *Level 20 **Heavenly Host: Nearby allied Heroes gain 600 Shield for
        3 seconds. If the Shield lasts the full duration, fire a sword at the nearest
        enemy Hero, dealing 140 damage. **Unrelenting Descent: Descending from the
        Heavens restores 30% of Imperius'' maximum Health and Mana. Consuming a Valorous
        Brand reduces the cooldown of Wrath of the Angiris by 10 seconds. **Brand
        of Solarion: Reduce the duration of Valorous Brand to 5 seconds, but it is
        no longer consumed when triggered. **Impervious: Activate to become Unstoppable
        and gain 75 Spell Armor for 3 seconds. Hitting Heroes with the center of Solarion''s
        Fire reduces this cooldown by 5 seconds. ==Notable Matchups== Victories: Losses:
