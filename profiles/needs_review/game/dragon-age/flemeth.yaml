- id: claim-powers-and-abilities-fe76a536
  section: abilities
  axis: hax
  text: 'Flemeth= Staff Mastery, Magic, Reality Warping (Mages draw forth the essence
    of the Fade, and can use it to warp reality), Teleportation, possibly Transmutation
    (It is implied that mages can turn enemies into animals, like toads and the likes),
    Elemental Manipulation (Fire, earth, ice and lightning), Petrification, Status
    Effect Inducement (Can paralyse her enemies with a bolt of lightning or with a
    specific spell. Can paralyse a greater number of enemies with little more effort),
    Statistics Reduction (Can drain her enemies of their stamina, slow them down and
    inflict penalties to their attack and defense), Statistics Amplification (Can
    amplify the stamina of allies; amplify the speed of allies and of herself; amplify
    her allies strength; can amplify her physical durability), Power Bestowal (Can
    grant resistances to her allies. Granted Morrigan the ability to transform into
    a dragon and the power to match Corypheus'' Red-Lyrium dragon), Energy Manipulation,
    Perception Manipulation (Can manipulate one''s perception of time), Physics Manipulation
    (Can manipulate the forces of repulsion), Soul Manipulation (Can damage the spirits
    of her enemies with her attacks, and even steal some of the spiritual energy of
    enemies. Can absorb souls into herself), Forcefield Creation (Can create shields
    against physical and magical attacks), Mystical Negation (Can negate any magical
    effects generated by a hostile creature within a determined field; can dispel
    magical effects from determined targets, can neutralize any and all magic within
    certain borders), Resistance Negation (Can negate resistances to fire, ice, lightning,
    nature or soul her enemies might have. Can negate these resistances to a wider
    number of enemies too, spreading it through the air like a virus), Healing, Summoning,
    Negation, Absorption (Can drain her enemies of their magic; can drain the residual
    lifeforce of nearby corpses; can drain lifeforce from her enemies), Necromancy
    (Can raise the dead), Poison, Acid and Disease Manipulation (Can inject the target
    with corrosive poison that hurts their spirit, and may infect nearby enemies as
    well), Mind Manipulation (Can telepathically stun nearby enemies; can disorient
    her enemies by mentally assaulting them), Telekinesis (Can crush the bodies of
    her enemies with a telekinetical cage), Aura (Radiates an aura of weakness, hindering
    nearby enemies with penalties to attack, defense and speed), Probability Manipulation
    (Can cause her enemies to misdirect all attacks; can cause incredible bad luck
    to her enemies), Fear Manipulation (She can force an enemy&nbsp;to cower in fear,
    unable to move. This spell can cause massive damage to the spirit of a sleeping
    enemy), Sleep Inducement (Can cause all nearby enemies to fall asleep with a spell),
    Dream Manipulation (Can cause enemies to live a "waking nightmare"), Curse Manipulation
    (Can curse a target with the inevitability of death. This spell does also negate
    any form of Regeneration or Healing), Animal Manipulation (Scaled to her daughter,
    she should be able to control dragons), Empathic Manipulation (Can drain her enemies
    of their will), Extrasensory Perception, Clairvoyance |-|Mythal= All of the former
    powers to a incredibly higher scale, Power Nullification, Shapeshifting (Can turn
    into a variety of beings, such as a spider, a serpent, a bear, and a flying wasp
    swarm and a crow. Remarkably, she is able to turn into a giant, fire-breathing
    dragon, and is arguably the most powerful dragon shown so far), Possession (Can
    possess the weak-minded or those under mental disturbance, such as a mind-wiped
    Morrigan), Longevity (The bodies Flemeth possesses can live up to a thousand years),
    Immortality (Types 3 and 6), Precognition (Predicted the possibility of being
    betrayed by Morrigan and attacked by the Warden), Astral Projection and Incorporeality
    (Apparently dismisses bodies and finds them limiting), possibly Telepathy (Apparently
    read Fenris'' mind), Regeneration (Low-Godly: is capable of rebuilding herself
    from a single piece of her soul), Resistance to: Magic, Mind Manipulation, Diseases
    as strong as the Blight, Fire, Soul Manipulation, Sleep Inducement, Paralysis
    Inducement, Petrification, Extrasensory Perception/Clairvoyance (Can shut down
    her presence, as shown when Morrigan was unable to sense her), and likely some
    others'
  source_ids: *id005
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
