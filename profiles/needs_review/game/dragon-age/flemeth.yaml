    - field: powers_and_abilities
      value: 'Admonition: Meliodas can extract the commandments of others, summon
        them at will, and absorb them into himself. Full Counter: Meliodas can reflect
        magic attacks back at his opponent with at least double the original power,
        provided he properly times his counter. Meliodas has shown to be able to reflect
        several attacks at once, provided they are all coming directly to him. For
        simultaneous spaced out attacks, Meliodas can take advantage of Lostvayne''s
        clone ability to counter them all at once. Counter Vanish: Rather than reflecting
        an attack, Meliodas can disperse it, nullifying it. He used his palm to do
        it rather than his sword, although there is no indication that he has to use
        his palm. Revenge Counter: Meliodas lowers his magic power so that he can
        take as much damage as he can handle. After he has "charged" himself with
        enough damage he returns all of it in a single massive energy attack aimed
        directly at his opponent. It is shown to be his last resort. Hellblaze: Meliodas
        can generate the black purgatory fire of the Demon Clan, capable of nullifying
        the regeneration of "immortals" like Ban. Hellblaze can be coated on Meliodas''
        body or weapon through Enchant: Hellblaze to enhance his strikes. He can also
        create fireballs in his hands that explode into large infernos and releases
        large blasts from his sword. The black fire cannot be put out normally and
        was able to burn down the Fairy King''s Forest despite the Forest being immune
        to natural fire. Divine Slayer: One of Meliodas'' more powerful techniques
        that requires him to heighten his senses and power to their limit. He coats
        his sword in black flames and unleashes a large slash of fire at his target.
        Divine 1,000 Slices: A derivative technique of Divine Slayer (the two are
        written the same in Japanese) Meliodas releases an aura of purgatory fire
        around his entire body and charges his opponent, quickly slicing them repeatedly.
        Trillion Dark: Meliodas launches a barrage of small spheres of high concentrated
        darkness at the opponent. Lostvayne: Meliodas'' Sacred Treasure is a curved
        sword far superior to normal weapons. At the same power level, Lostvayne could
        cut through an Albion with air slashes while a normal blade couldn''t make
        a dent in it. * Physical Clone: Lostvayne allows Meliodas to make physical
        clones of himself. The number of clones determines the power level of each
        one. For instance, a single clone has half of Meliodas'' power level, and
        that halved power level is divided evenly among each individual clone. So
        four clones would each have one-eighth the power level of the original Meliodas.
        The clones can fight on Meliodas'' behalf, serve as distractions, as well
        as use Full Counter. Note that Meliodas is not weakened at all by making clones.
        Category:Ndpeeler Category:Tier 7 Category:Tier 6 Category:Tier 5 Category:Tier
        4'
      source_id: character-stats-profiles-flemeth-dragon-age
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
