  name: Flemeth to Alistair}} ==Summary== Flemeth is a shapeshifter, more commonly
    known as the Witch of the Wilds, also known as Mother of Vengeance (among the
    Chasind) or Asha'bellanar ("woman of many years" in Elvish). She is widely recognized
    as the eponymous character of an age-old legend, described variously as extremely
    powerful and long-lived (or even immortal), and having many daughters, all of
    whom are witches like their mother. She is, actually, Mythal, the Protector and
    the All-Mother, the elven goddess of love and the patron of motherhood and justice
    (the opposite of vengeance), which has inhabited the body of a mortal woman, known
    as Flemeth. Carrying Mythal through the ages, she seeks to grant the elven goddess
    the justice that was denied to her. A reckoning that she claims will shake the
    very heavens, literally. ==Powers and Stats
