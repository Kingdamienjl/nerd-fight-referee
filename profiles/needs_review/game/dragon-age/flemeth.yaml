        of lightning or with a specific spell. Can paralyse a greater number of enemies
        with little more effort), Statistics Reduction (Can drain her enemies of their
        stamina, slow them down and inflict penalties to their attack and defense),
        Statistics Amplification (Can amplify the stamina of allies; amplify the speed
        of allies and of herself; amplify her allies strength; can amplify her physical
        durability), Power Bestowal (Can grant resistances to her allies. Granted
        Morrigan the ability to transform into a dragon and the power to match Corypheus''
        Red-Lyrium dragon), Energy Manipulation, Perception Manipulation (Can manipulate
        one''s perception of time), Physics Manipulation (Can manipulate the forces
        of repulsion), Soul Manipulation (Can damage the spirits of her enemies with
        her attacks, and even steal some of the spiritual energy of enemies. Can absorb
        souls into herself), Forcefield Creation (Can create shields against physical
        and magical attacks), Mystical Negation (Can negate any magical effects generated
        by a hostile creature within a determined field; can dispel magical effects
        from determined targets, can neutralize any and all magic within certain borders),
        Resistance Negation (Can negate resistances to fire, ice, lightning, nature
        or soul her enemies might have. Can negate these resistances to a wider number
        of enemies too, spreading it through the air like a virus), Healing, Summoning,
        Negation, Absorption (Can drain her enemies of their magic; can drain the
        residual lifeforce of nearby corpses; can drain lifeforce from her enemies),
        Necromancy (Can raise the dead), Poison, Acid and Disease Manipulation (Can
        inject the target with corrosive poison that hurts their spirit, and may infect
        nearby enemies as well), Mind Manipulation (Can telepathically stun nearby
        enemies; can disorient her enemies by mentally assaulting them), Telekinesis
        (Can crush the bodies of her enemies with a telekinetical cage), Aura (Radiates
        an aura of weakness, hindering nearby enemies with penalties to attack, defense
        and speed), Probability Manipulation (Can cause her enemies to misdirect all
        attacks; can cause incredible bad luck to her enemies), Fear Manipulation
