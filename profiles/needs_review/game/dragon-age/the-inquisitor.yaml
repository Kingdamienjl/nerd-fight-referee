- id: claim-weaknesses-dc3d5fcf
  section: weaknesses
  axis: weakness
  text: 'The knuckle bow of his specialized lightsaber is a potential target for lightsaber-wielding
    foes, and a well-placed hit can cripple the weapon. Notable Attacks/Techniques:
    *Telekinesis: The Grand Inquisitor can use this through the Force to put his mind
    literally over matter, capable of blasting opponents, shielding himself, or disarming
    people; its limits are only those of the creativity that Force User has. The Grand
    Inquisitor has demonstrated considerable prowess with the power, proving capable
    of pinning Kanan Jarrus against a wall and incapacitating him through the Force.
    *Telepathy: Can easily manipulate others mentally with the Force to trick, deceive,
    maim, or even kill outright. The Grand Inquisitor attempted to use this unsuccessfully
    against Kanan Jarrus. Note: Asajj Ventress is skilled in Form IV of lightsaber
    combat, emphasizing force-augmented speed, agility, and rapid attacks in quick
    succession. This is evidenced by her practising of acrobatic moves under Ky Narec,
    her skill with Jar''Kai, her skill in hand-to-hand combat [and in particular,
    a style that emphasizes swift and accurate consecutive strikes rather than power
    blows], and also her general speed & agility on the battlefield. She has also
    consistently proven herself capable of keeping up with Councillor-level combatants
    such as the likes of Anakin Skywalker and Obi-Wan Kenobi, and even Dooku. The
    Grand Inquisitor has not shown the same inclinations in combat. He was quickly
    overwhelmed by Vader during their first meeting, unable to react to his strikes
    when he got truly serious [this was Vader long before his prime]. As such, the
    Grand Inquisitor''s speed is not scaled from Ventress. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{Discussions}} Category:Star Wars Category:Characters Category:Cartoon
    Characters Category:Comic Book Characters Category:Telekinesis Users Category:Telepaths
    Category:Sword Users Category:Martial Artists Category:Mind Users Category:Energy
    Users Category:Primary Antagonists Category:Antagonists Category:Evil Characters
    Category:Male Characters Category:Aliens Category:Science Fantasy Characters Category:Geniuses
    Category:Traitors Category:Enhanced Senses Users Category:Weapon Masters Category:Precognition
    Users Category:Attack Reflection Users Category:Absorption Users Category:Adults
    Category:Murderers Category:Terrorists Category:Villains Category:Fallen Jedi'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
