    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Unknown
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with lightsaber, Tens of Meters with telekinesis, Galactic
      and Interdimensional with Force sense (Was able to sense when Kanan and Ezra
      had left a planetary system)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (A highly skilled and experienced combatant. Is capable of effectively
