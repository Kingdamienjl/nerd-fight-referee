  attack_potency:
    text: City level+ (Word of God states that he's only slightly weaker than Asajj
      Ventress, placing him as a peer or superior to Clone Wars era Ahsoka Tano. As
      a fully-fledged Jedi Knight and Temple Guard, he should be more powerful than
      High-Republic knights, who stopped debris that destroyed moons in the Great
      Hyperspace Disaster. Also more powerful than Season 1 and 2 of Rebels Kanan
      Jarrus)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic (He was a full-fledged Knight of the Jedi Order before his
      fall to the Dark Side. This places him as a peer or superior to Clone Wars era
      Ahsoka Tano, who can fight defensive battles against Asajj Ventress and General
      Grievous, and close to Obi-Wan in the same era, who deflected laser. He should
      therefore be capable of such speeds. He is also superior to the likes of the
      Eighth Brother, who has deflected starfighter cannon fire. Refer to the Note
      at the bottom of the profile)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human naturally, up to Class M with Force Amplification and Telekinesis
      (More powerful than Season 1 of Rebels Kanan Jarrus and High-Republic knights,
      who stopped debris that destroyed moons in the Great Hyperspace Disaster)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: City level+ with Force amplification (Superior to the Seventh Sister, who
      is able to briefly trade blows with Rebels Ahsoka Tano. Is a peer of Clone Wars
      Ahsoka Tano, who can briefly trade blows with Asajj Ventress and General Grievous)
    source_ids: *id002
    confidence: 0.95
  durability:
