        elements, objects, beings (animals, aliens, mythical beings, etc.), etc into
        anything else, either completely or partially, permanently or temporarily.
        Reality Warping: Morrigan can create, shape, and manipulate reality, the sum
        or aggregate of all that is real or existent within a system, just by thinking
        about it; while weaker users are limited to what is already considered "real,"
        stronger ones like SmashingRewind can make changes from nothing. Depending
        on the power of a reality warper, they may alter something as tangible as
        physics and the universe to something inconceivable like logic. Teleportation:
        Morrigan can teleport, or transfer matter (beings/objects, including themselves)
        or energy from one point to another without traversing the physical space
        between them. This can be achieved by various means, including causing the
        atoms/molecules to travel at light-speed, warping the space, or use quantum
        superposition, in which the user teleports by spatially rearranging the subatomic
        contents of a system. Durability Negation: Morrigan can damage the target
        regardless of its durability, bypassing or negating durability, even if they
        lack destructive attack power.'
