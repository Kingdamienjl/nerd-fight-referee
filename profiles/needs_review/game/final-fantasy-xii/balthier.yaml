        techniques to cure basic maladies such as Poison, Blind and Silence. *Chant:
        Sacrifice one''s own HP to restore double the amount sacrificed to an ally.
        *Tailwind: Words of encouragement spoken to an ally or one''s self increase
        one''s speed and thus their rate of receiving turns. *Steel: Words of encouragement
        spoken to an ally or one''s self increase one''s Bravery and thus their chance
        to react to events, as well as raising their physical attack potential. *Shout:
        A powerful bellow, which increases Luso''s attack, magick, speed, and Bravery
        dramatically. *Ultima: Attacks a foe from a considerable distance with absolute
        magickal energy. Note that FFT''s variation of Ultima is neither the ultimate
        magick spell nor more powerful than spells such as Firaga or Flare; its main
