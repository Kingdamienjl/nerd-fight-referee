    - field: standard_equipment
      value: 'ElenaAim.jpg|Elena taking aim BCTurkPhone.jpg|Standard Turk''s Cellphone
        Model as seen in Before Crisis *Explosives: During combat, Elena uses two
        different kinds of explosives to attack the party. While the exact nature,
        design or model of these is unknown, the explosives can be used for a localized
        explosion or to cause a carpet bomb effect. *Handgun: While not seen properly
        in the games, Elena is shown to be a proficient shot in the side novel The
        Kids Are Alright: A Turks Side Story written by Kazuhige Nojima, displaying
        quick and precise aim with her firearms. *Cell Phone: Elena, like all Shinra
        personnel, carries a mobile phone to contact his colleagues or his teammates
        during missions and plan properly his next course of action.'
      source_id: mediawiki-balthier
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. Just being a Turk is a demonstration of Elena's skill
        and knowledge regarding several areas, such as combat, espionage, gathering
        information, use of different weapons and vehicles, among other abilities.
        However, the lack of experience that comes with Elena's status as a newcomer
        and her many times impulsive approach to her duties, born out of her desire
        to uphold the Turk's name and prestige, leads her to make glaring mistakes
        such as revealing confidential information to enemies, let her guard down
        around opponents she would have no trouble with normally or prevent herself
        from solving situations for which she is skilled enough to handle.
      source_id: mediawiki-balthier
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'As mentioned above, Elena''s lack of experience, impulsive nature and
        even occasional naivety can hinder her performance in situations she could
        have under control normally. Notable Attacks/Techniques: *Throw (Single-Target
        Variant): Elena throws an explosive that causes a small but powerful energy
        explosion on a single enemy. *Throw (Multi-Target Variant): Elena''s explosive
        sets off a chain of bursts that cover a large area, striking all her opponents.
        *Bewildered: Presumably, using her Spirit Energy like Reno''s Turk Light or
        Rude''s Grand Spark, in conjunction with her own allure, Elena releases a
        charming aura in the shape of a heart that messes with the opponent''s mind,
