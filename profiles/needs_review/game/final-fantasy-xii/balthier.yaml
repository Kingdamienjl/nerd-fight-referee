    - field: intelligence
      value: Above Average. Just being a Turk is a demonstration of Elena's skill
        and knowledge regarding several areas, such as combat, espionage, gathering
        information, use of different weapons and vehicles, among other abilities.
        However, the lack of experience that comes with Elena's status as a newcomer
        and her many times impulsive approach to her duties, born out of her desire
        to uphold the Turk's name and prestige, leads her to make glaring mistakes
        such as revealing confidential information to enemies, let her guard down
        around opponents she would have no trouble with normally or prevent herself
        from solving situations for which she is skilled enough to handle.
