    - field: powers_and_abilities
      value: 'Base (Pre-Omega1)= * Superhuman Characteristics and Physiology * EVO
        Physiology (Type 1) * Martial Arts * Acrobatics * Genius Intelligence * Invisibility,
        Camouflage & Stealth Mastery (With providence suit) * Nanotechnology (Article
        about Nanites) * Enhanced Senses (Extra Senses: Feels a buzzing sensation
        whenever he is in the presence of a particularly dangerous EVO. Infrared,
        X-Ray, Microscopic and Nano-vision via his Goggles) * Regeneration (Mid-Low;
        His Nanites are able to restart his heart should it stop for any particular
        reason, possibly far higher, nanites were designed to regenerate bones & stop
        any diseases and they saved his life from extreme conditions, Rex was never
        shown to have critical injuries so it''s unknown if he can regenerate limbs,
        but he can regrow his builds nearly instantly, which should be at least Mid;
        Mid regeneration for his builds) * Supernatural Willpower (He was capable
        of separating the 5 Meta Nanites through pure willpower alone and denying
        the universe code. Willpower also plays a role in his resistance to mind manipulation
        as well as his nanites) * Pain Tolerance (Smack Hands are partially connected
        to his nervous system, and he can take their destruction with no reaction)
        * Weapon Creation, Organic Constructs & Cyborgization (Rex Salazar can build
        a variety of machines with his nanites at will. Dubbed as ''builds'', Rex''s
        machines can be utilized for transportation or offensive attacks. They are
        infused with his limbs and add to his enhanced physical condition. Starting
        off with six original builds, he was granted with the Omega-1 Nanite and gained
        the ability to build five more. He also took on multiple full EVO forms as
        well) ** Smack Hands *** Enhanced Superhuman Characteristics (It''s Rex''s
        main build for physical combat) *** Drill Transformation & Burrowing (Rex
        learns to use the smack hands as a drill, for underground mobility or additional
        offense) *** Surface Scaling (Via easy climbing) *** Shockwave Creation **
        Boogie Pack *** Flight *** Limited Air Manipulation (Can use them to either
        propel air or suck people closer to him, as well use compressed air attacks)
        *** Thread Manipulation (Rex learns to use Boogie Pack''s turbins as Bola
        propelers, like most of his original builds) ** Slam Cannon *** Limited Danmaku
        (Similar to a rocket launcher, it is positioned to rest on his shoulder. However,
        it does not produce its own ammo; instead, a maw on the back end of the slam
        cannon can extend into the ground and reload solid material for ammunition.
        It then proceeds to fire the balled material at its target with great force)
        ** Rex Ride *** Vehicle Transformation (Rex summons a motor-like vihicle overing
        over ground that gives him high speeds, which can also work as a ram) ** Punk
        Busters *** Natural Weaponry (Powerfull boots that make him jump with high
        force, which can retract spikes or enhance itself with boosters for extra
        offense) ** BFS *** Expert Swordsmanship (Big Fat Sword is... a Big fat sword)
        ***'
