      value: Gifted (Even when he was only 15 years old, Rex is considerably more
        intelligent than given credit for. He's exceptionally skilled in the use of
        various weapons, ranging from swords of all kinds, spears, gauntlets, cannons,
        hammers, and even what could be considered soccer balls, to the point where
        he can go toe-to-toe with foes that possess centuries worth of combat experience
        and doing so mere seconds after obtaining them. Aside from that, he also managed
        to learn the Topple skill in seconds, which took Vandham, an experienced war
        veteran, and mercenary, a couple of years to learn. He also showed that he
        can make up strategies on the fly on occasion, such as when he used a water
        tower to exploit Brighid's weakness towards the water, allowing Rex and the
        others to escape)
