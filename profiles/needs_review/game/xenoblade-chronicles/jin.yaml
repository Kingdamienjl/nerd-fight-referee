    - field: weaknesses
      value: 'If his core is destroyed, he will die. | Same as before, and he is slowly
        dying thanks to his nature as a Flesh Eater. Every time he uses his powers,
        it shortens his already very short remaining lifespan. Notable Attacks/Techniques:
        * Ice Manipulation: As a Blade with control over the Ice element, Jin is able
        to lower the ambient energy of his environment, cooling the air and freezing
        ambient moisture. He uses this to encase his opponents in ice, create fields
        of damaging cold, and fire spikes of ice at his enemies. Even before becoming
        a Flesh Eater, he was easily able to chill the air to absolute zero. * Stunned
        Swallow: Jin slowly moves his sword in a circle. If he is struck while in
        this stance, he retaliates by launching his opponent into the air. * Empty
        Moment: Jin moves faster than the eye can see, delivering a barrage of slashes
        over a wide area. * Elementary Particle Control: In his final form, Jin''s
        power evolves to give him control over all elementary particles. This gives
        Jin the ability to bypass friction, allowing him to move at the speed of light
        without needing infinite energy. He is also able to nullify and redirect attacks
        that consist of particle energy, including Ether particles, which compose
        most living beings and energy attacks in the Xenoblade universe, or traditional
        matter. This ability has only been overcome by warping reality to outspeed
        Jin and strike when he cannot retaliate. ==Gallery== File:XC2-Jin-Artwork.png|Masked
