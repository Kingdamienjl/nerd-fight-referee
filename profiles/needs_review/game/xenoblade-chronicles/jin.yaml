    - field: weaknesses
      value: 'For a long time he could not control his Devil Gene (As of Tekken 6,
        this is no longer a problem). Devil Gene users are weak against light when
        used by the members of the Kazama clan, Archers of Sirius and characters such
        as Angel, whom were shown and stated to be effective on them several times
        before. There are also specifically made chains that can neutralize the Devil
        Gene''s powers, Heihachi Mishima is the only one to have access to these chains
        so far. Notable Attacks/Techniques: *Power Stance: Jin goes into a stance
        which also grants Ki Power, that will enhance his strength. *Avenger: Jin
        takes a step back and does a supercharge powerful punch that knocks the enemy
        across the stage. *Double Chamber Punch: Jin lands a weak punch, which is
        then quickly followed by a second one that sends the opponent away. *Penetrating
        Fist: Jin creates two static orbs at close range and mid-range. *Hellfire
        Blast: Jin is capable of emitting an energy laser from the crystal in his
        forehead (attacks can be both single or not). *Rage Art: Strikes the opponent
        with a right punch and follows up with a flurry of jabs. He finishes with
        a more powerful version of the Median Line Destruction. -Devil'
      source_id: mediawiki-4749645
