    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Concept Manipulation: Noah
        has a concept creation and management facility. She can create concept spaces,
        that are pocket dimensions in which different concepts apply than usual, which
        are not spatially separated from the world, but by the things in them having
        different concepts applied to them. With her concept creation device Noah
        can create entirely new concepts and recreate concepts she has data on. These
        concepts are then stored in philosopher stones or concepts cores, where they
        can be activated and deactivated at will, to create concept spaces. At its
        peak Noah has and can use all positive and negative concepts of the multiverse
        and has created the concept of immortality. As Noah is the source of the concepts
        of all powers that are used in the series, she can nullify them by not releasing
        the corresponding concepts unless the opponents can reinsert the concepts
        for their abilities on their own. The following are most known concepts Noah
        has and their effects: **Contradiction Allowance Concept: A concept that makes
        it possible for logical paradoxes to exist. It for example makes it possible
        to exist in non-existence. This concept is necessary for the process of creating
        concepts, as without it the created concepts would destroy the universe. **Information
        Concealing Concept: A concept that makes it so that information from inside
        a concept space can not be communicated anyone outside the concept space,
        that doesn''t already know them. If one where to try to do so, be it via speech,
        writing, video footage or anything else, the person outside would be incapable
        of comprehending any of it. **Stealth Concept: A concept originally used by
        mechanical dragons, which renders the user invisible. **Everything leads to
        a single point: A concept which twists the world around the Leviathan. It
        makes it so that the world is separated into various regions. This regions
        are then rearranged so that a target has the run through all of them to reach
        the Leviathan. Once one person does that the world returns to normal. While
        the World is rearranged for everyone else the Leviathan has direct access
        the each of the regions, being able to attack and send out its forces unhindered.
        This concept is used to prevent an enemy from charging past the Leviathan''s
        army without fighting it. **Mind Control Concept: A concept which grants the
        user the ability to control others minds. **Reflection Concept: A concept
        which allows the user to create a shield that reflects opponents attacks.
        This reflects even mind control attempts. **Residual Thought Concept: A concept
        that gives form to residual thoughts. This allows the user to create something
        like ghost, which can move things, steal information on contact and possess
        digital systems, or even automatons. **High-Speed Regeneration Concept: A
        powerful regeneration concept developed in Top-Gear and given to Mikoku in
        form of a philosopher stone implanted in her. Mikoku can with it regenerate
        from any damage as long as the philosopher stone in her isn''t destroyed and
        even then the philosopher stone itself also has some regeneration power. Noah
        copied and replicated this concept from Mikoku and uses it herself now. As
        long as what is holding this concept in Noah isn''t destroy Noah will be able
        to quickly regenerate from any damage. As it demonstrated even if the concept
        cores inside it are shattered and dispersed with a concept weapon it can still
        regenerate. **Immortality Concept: A concept Noah created on Mikoku''s command.
        This concept turns this under its influence immortal and resurrects the dead.
        It would even revive Noah after the universe was destroyed through the release
        of the concept. **Evolution Concept: A concept that allows Noah to rapidly
        evolve and adapt to new requirements. At its peak transformations of evolution
        occurred every few hundred meters, while it was flying at high speed (So likely
        more than once per second). **Precious metals possess power: A concept which
        grants precious metals power. That goes from weapons made from silver weapons
        dealing more damage, over gold dynamos producing more energy, to the light
        from mercury lamps functioning as damage dealing laser. **Writing Possesses
        Power: This allows anyone in a space with this concept to make the things
        they write happen and by that freely modify objects they write on. This technique
        is not without limits, though, as the amount of power used to accomplish something
        written is dependent on how well it is written. **On this planet, south is
        down: This concepts makes it so that gravity pulls everything south instead
        of down. Whether one can stand or just drops to the edge of the concept space
        with this concept active hence depends on ones position on the planet. **Names
        Provide Power: A concept which makes it so that names grant power. In general
        something without a name can not hurt something that possesses a name when
        this concept is active, meaning that for example a name'
