        \ that symbolizes \"evolution\" and \"infinity\" in reality, which is synchronized\
        \ with thought and emotion. All that is spiral-shaped within the universe,\
        \ lifeforms with helical DNA, spiral galaxies, and even the branching spiral\
        \ multiverse, is amplified by Spiral Power to infinite levels. Spiral Power\
        \ is the very force which binds all lifeforms and the universe, with a single\
        \ individual harnessing it allowing them to draw on the power of the infinite\
        \ universe) **Supernatural Willpower (Spiral Power is equated to being the\
        \ very will of Spiral Beings, this is further proven when Lordgenome converts\
        \ the energy of the Infinity Big Bang Storm into Spiral Energy to owhich it's\
        \ referred to as hiss will) **Empowerment (Fighting spirit is what allows\
        \ one to bring out the potential of their Spiral Power, which is accelerated\
        \ by hopes, dreams and willpower which in the form of a double helix, pierce\
        \ the heavens. One's Spiral power can be strengthened by the power/belief\
        \ from someone else) **Reactive Evolution & Adaptation (Spiral Power is the\
        \ power of evolution itself, with beings becoming more capable of handling\
        \ the threats they face the further they're pushed to their limits. Spiral\
        \ Power connects Spiral Lifeforms with the Universe itself, granting them\
        \ the power to grow infinitely in both their potential and applications of\
        \ Spiral Power so that may push them beyond their limits in order to overcome\
        \ impossibilities) **Instinctive Reactions (Non-Combat Applicable; Spiral\
        \ Lifeforms are driven by the Spiral instinct to reach the heavens at all\
        \ costs) **Technology Manipulation (Simon can utilize Spiral Power, but only\
        \ within Gunmen and can control Lagann via Spiral Power. Can summon Lagann\
        \ to himself with Core Drill) **Limited Shapeshifting & Fusionism (Could fix\
        \ his broken Hand Drill, by using his Core Drill, which can change its shape\
