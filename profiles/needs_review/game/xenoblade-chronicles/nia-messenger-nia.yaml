- id: claim-powers-and-abilities-727eae44
  section: abilities
  axis: hax
  text: "Same as before, Physical Combat (Easily dominated Viral in a fist fight,\
    \ in prison), Instinctive Reaction (Dodged Yoko's bullet, seemingly without any\
    \ knowledge of her presence), Energy Projection (Can shoot lasers, similar to\
    \ the Antispiral's own lasers), Flight, Teleportation, Dimensional Travel, Portal\
    \ Creation and Limited Space-Time Manipulation (Teleportation works by recognizing\
    \ beings or objects and can instantly jump by thinking about it. Shown to be able\
    \ to teleport instantly. Can travel through dimensions with portals. Her teleportation\
    \ was stated to twist time and space), Light Manipulation (Showed Simon a projection\
    \ of the moon crashing to the Earth), Technology Manipulation (Projected a live\
    \ broadcast onto all the screens of Kamina City) Electricity Manipulation (Can\
    \ manipulate any electric currents, that run through her body), Regeneration Negation\
    \ (Mid-Low. Nia made Viral incapable of regenerating the damage he took from her),\
    \ Self-Sustenance (Type 1), Non-Physical Interaction and Enhanced Senses (In Antispiral's\
    \ universe she was shown to be capable of physically touching and seeing Antispiral;\
    \ a being stated to be invisible to humans), Limited Memory Manipulation and Regeneration\
    \ (Low-Mid. Was desperately trying to regenerate, while Antispiral was examining\
    \ her, by wrapping her memory around her. Regenerated from her belly, her breasts,\
    \ her neck, and her face disappearing. Regenerated her entire body seemingly instantly,\
    \ after becoming free of Antispiral), Information Manipulation (Can plant false\
    \ information), Limited Explosion Manipulation, Limited Deconstruction (She is\
    \ composed of the same energy blocks as the Mugann. After being damaged, she deconstructs\
    \ into explosive blocks), Resistance to Electricity Manipulation and Paralysis\
    \ Inducement (Remained unaffected by a blitzkrieg, which paralyze an opponent's\
    \ actions), Pain Manipulation (Could move her arms, which were severed), Information\
    \ Analysis (Can prevent others from reading her information, by creating false\
    \ information) and Existence Erasure via Regeneration (Continuously regenerated\
    \ from Antispiral analyzing her. Was supposed to disappear along with Antispiral\
    \ right after his death, but kept regenerating her body until she reached her\
    \ regeneration\u2019s limit) |-"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
