    - field: weaknesses
      value: 'She instantly dies if her soul gem is destroyed or is at least 100 meters
        away from her body. However, in the second case, she can come back to life
        if the Soul Gem is brought near her again. Notable Attacks/Techniques: *Magical
        Girl Physiology: The physiology of a Magical Girl, who has formed a contract
        with a messenger of magic, and in exchange gained the power of magic. Magical
        Girls are charged with the task of combating Witches, beings born from negative
        emotions and who spread despair and sadness to the world. Unlike Witches,
        Magical Girls bring hope to the world by destroying Witches. When a girl accepts
        to make a contract with a messenger of magic, her soul is materialized and
        become a Soul Gem, the source of a Magical Girl''s power. If a Soul Gem is
        destroyed or is at least 100 meters away from a Magical Girl''s body, she
        dies. However, in the second case, the Magical Girl can come back to life
        if the Soul Gem is brought near her again. Every time a Magical Girl uses
        her magical powers, her Soul Gem becomes "tainted". The only way to rid the
        Soul Gem of its "taint" is to use a Grief Seed, achievable by defeating a
        Witch. ==Gallery== Orikosadness8.png|Mio with her team. ==Others== Notable
        Victories: Notable Losses: Inconclusive Matches: Category:ZeroTwo64 Category:Tier
        2'
      source_id: character-stats-profiles-mio-xenoblade-chronicles
      provider_id: character_stats_profiles
      authority: high
