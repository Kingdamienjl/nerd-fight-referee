      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The Ouroboros forms generate heat overtime, if not managed properly
        this heat will draw in black dog and cause an Annihilation Event which will
        kill the user. Notable Attacks/Techniques: right|300px *Interlinking: The
        main ability of a completed Ouroboros, it allows for two Ouroboros to fuse
        into a singular being granting them a significant power increase and new abilities.
        Although the form is incredibly powerful, interlinked beings generate large
        amounts of heat the longer they are used and when reaching it''s limit black
        fog will engulf the interlinked being and cause an annihilation event. right|300px
        *Class Change: A unique ability of Noah and co.''s Ouroboros. It allows for
        them to copy the class of those they are around (typically fighting with or
        even fighting against as evident by Triton) and gain that class'' arts and
        abilities. The speed of which various depending on how adept the user is with
        said class (for example, Noah is adept with swords and thus would copy other
        sword classes fairly quickly). When obtaining these classes, users becomes
        immediately adept at using them the classes as all they can do with it flashes
        in front of their eyes with uses describing it as if they have always known
        how to use the class. Mastered classes have their abilities arts and abilities
        unlocked for any class which allows for users to use a multitude of weapons
        and abilities at once. Class Arts: |-|Zephyr= *Gemini Strike: Gemini Strike
        is the Talent Art of the Zephyr class. It is a powerful technique to evade
        enemy attacks while at the same time gathering the enemy''s aim. With this
        move, the user can attract the attention of enemies and protect their friends
        at once. *Butterfly Blade: Butterfly Blade is one of the arts of the Zephyr
        class. The user does a clockwise spin forward before slashing with the right
        weapon, then the left. *Air Fang: Air Fang is one of the arts of the Zephyr
        class. The user slashes upward from a down-right angle with both weapons before
        performing a counterclockwise spin forward as they slash with the right weapon.
        *Wide Slash: Wide Slash is one of the arts of the Zephyr class. The user performs
        a counterclockwise spin forward before performing a cross-slash. *Glow Ring:
        Glow Ring is one of the arts of the Zephyr class. It strikes the opponent
        once as it inflicts target lock on it''s target. *Speed Demon: Speed Demon
        is one the arts of the Zephyr class. It boosts the user''s speed by 30% at
        the cost of lowering their damage by 15%. |-|Swordfighter= *Overclock Buster:
        Overclock Buster is the Talent Art of the Swordfighter class. It delivers
        a powerful blow to the enemy. It can inflict heavy damage when an enemy is
        dazed, so it is more powerful to coordinate with companions who have daze-inflicting
        arts. *Ground Beat: Ground Beat is one of the Swordfighter class''s arts.
        It sends out a heavy frontward area of effect strike towards forward foes.
        *Air Slash: Air Slash is one of the Swordfighter class''s arts. The user hits
        their foe with an upward strike as they perform a backflip. The art deals
        much more damage when cancelled into. *Shadow Eye: Shadow Eye is one of the
        Swordfighter class''s arts. It lessens how aggro the foe is to the user and
        boosts the user''s attack. *Sword Strike: Sword Strike is one of the Swordfighter
        class''s arts. It can inflict Break to an enemy when attacking from the side.
        *Edge Thrust: Edge Thrust is one of the Swordfighter class''s arts. It can
        also inflict heavy damage when attacking from the back. |-|Medic Gunner= *Healing
        Ring: Healing Ring is the Talent Art of the Medic Gunner class. When used,
        the user places a green ring below them. This ring grants Regenerate to any
        allies standing inside of it. *Myopic Screen: Myopic Screen is one of the
        arts of the Medic Gunner class. It hits the enemy while inflicting daze to
        topped foes. *Group Heal: Group Heal is one of the arts of the Medic Gunner
        class. It heals both the user and allies in a radius around the user. *Ether
        Cannon: Ether Cannon is one of the arts of the Medic Gunner class. It fires
        a powerful ether shot at the enemies while also inflicting Accuracy Down.
        *Power Ring: Power Ring is one of the arts of the Medic Gunner class. Much
        like Healing Ring the art places a ring on the ground with allies within this
        ring gaining a power boost. *Vortex: Vortex is one of the arts of the Medic
        Gunner class. It heals nearby allies when Art hits, to max of 100% of Healing
        Power. |-|Tactician= *Tidal Wave: Tidal Wave is the Talent Art of the Tactician
        class. It heals all allies when Art hits, to a maximum of 150% of Healing
        Power. *Dark Banner: Dark Banner is one of the arts of the Tactician class.
        It hits in an area of effect in front of the user and inflicts sleep. *Overfall:
        Overfall is one of the arts of the Tactician class. It strikes at a single
        target while also inflicting Ether Defence Down. *Stormy Skies: Stormy Skies
        is one of the arts of the Tactician class. It heals allies in a radius around
        the user. *Hazy Figure:'
