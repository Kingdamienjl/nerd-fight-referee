    - field: weaknesses
      value: 'As a Chojin, Crowman is incredibly weak to a special type of light called
        the Capillaria Rays which poison a Chojin with incredibly minor contact and
        fully melt their bodies into dust when exposed for much longer Notable Attacks/Techniques:
        |-|Wrestling Techniques= * Lock Up of Judgement: The Lock-Up of Judgement
        is a special technique that all Perfect Chojin know where Crowman grapples
        with the opponent in order to accurately measure an opponent''s physical strength
        as well as see all of their abilities and techniques. * Raven Wing Strike:
        The Raven Wing Strike is a special technique where Crowman strikes the opponent
        with both of his wings by slamming them on both sides of the opponent. * Crow
        Beak: The Crow Beak is a special technique where Crowman stabs the opponent''s
        chest with his incredibly sharp beak. * Crows Bombs Away: The Crows Bombs
        Away is a special technique where Crowman grabs the opponent''s arms with
        his hands, spreading them out before flying the opponent up into the air and
        slamming them to the ground and stabbing the opponent''s chest with his beak,
        aiming to impale their heart. * Peacock Feather Blade: The Peacock Feather
        Blade is a special technique where Crowman slashes the opponent with the edges
        of his two wings by spinning around. * Crow''s Prey Skewer: The Crow''s Prey
        Skewer is a special technique where Crowman, after using his Crow Beak Scissors
        to make a stone skewer, grabs the opponent''s arms with his hands, spreading
        them out before flying the opponent up into the air and slamming them down
        onto the stone skewer, impaling their back and stabbing the opponent''s chest
        with his beak, aiming to impale their heart.'
