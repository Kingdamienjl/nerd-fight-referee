    - field: weaknesses
      value: 'Raven Beak X is most likely not in control of his actions and does not
        have access to any of the Power Suit''s abilities. Notable Attacks/Techniques:
        * Flash Shift: An Aeion technique that immediately transports him a small
        distance in any direction and can be chained up to 4 times. Unlike Samus,
        Raven Beak''s Flash Shift is red in color and can move diagonally up and down
        while Samus can only move left and right with her Flash Shift. * Lightning
        Armor: An Aeion technique. When active it covers Raven Beak with a force field
        that protects against all of Samus'' attacks. Unlike Samus'' Lightning Armor
        from Samus Returns, Raven Beak''s doesn''t have an observable time limit,
        it can only be deactivated when Samus successfully performs a Melee Counter
        on Raven Beak. Raven Beak''s variant changes color as it is damaged, starting
        with a blue color and slowing becoming red as it absorbs damage. Once the
        Lightning Armor is red, Raven Beak can release that energy in the form of
        an omnidirectional energy blast that leaves a small opening around three feet
        above ground level. Releasing this energy blast reverts the Lightning Armor
        to it''s initial blue color. Raven Beak is also capable of changing his Lightning
        Armor to be gold in color after being Melee Countered by Samus, In this state,
        the Lightning Armor is unaffected by Samus'' attacks, only a Melee Counter
        can deactivate it. *Beam Burst: An Aeion technique. Allows Raven Beak to fire
        his beam in the form of full auto shots like Samus'' beam instead of a concentrated
        beam of energy. Raven Beak''s variation can be fired much longer than Samus''
        from Samus Returns. Raven Beak can also use this ability multiple time in
        succession if he desires. *Shinespark: An extremely damaging rush attack in
        any direction. Unlike Samus, Raven Beak does not seem to need to charge this
        ability with the Speed Booster and can change direction with the Shinespark
        in sudden, 45 degree angles. ==Notable Matchups== Victories: Losses: Inconclusive:
