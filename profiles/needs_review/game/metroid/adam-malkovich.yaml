    - field: powers_and_abilities
      value: 'A set of unique powers that Samus has access to in Metroid: Samus Returns,
        gained from channeling a "mystical and powerful energy source" known as Aeion.
        She gains these powers from Aeion Ability Artifacts and can replenish her
        limited supply of Aeion from downed and slain opponents., Phantom Cloak: While
        used, Samus'' drains her Aeion to become invisible to regular detection.,
        Flash Shift: Samus can travel a set distance, either forward or backward,
        up to three times. Frequently used to avoid attacks or exploration., Beam
        Burst: This ability enhances Samus'' beam weapons so that she can fire a machine
        gun-like barrage of beam shots rather than charge her attacks. Every shot
        made drains her Aeion., Lightning Armor: Samus surrounds herself with a field
        of green electricity, protecting herself from harm by absorbing attacks directed
        at her, draining her Aeion instead of her energy. This ability also empowers
        her Melee Counter into a more powerful and longer ranged Lightning Counter.,
        Phase Drift: The final Aeion ability, which, when used, slows down time for
        all things around Samus by 50%, allowing her to move as quickly as usual while
        everyone else is left to catch up., Scan Pulse: When used, at the cost of
        a small amount of Aeion, this ability envelops Samus in a blue field that
        dissipates throughout her surroundings, revealing Map data for them and exposing
        any breakable obstacles., Concentration: A technique that Samus can use when
        low on health to replenish her energy by focusing power in her Arm Cannon,
        restoring a tank of energy and some of her missiles. The amount of energy
        she can regain in this way can be increased by "E-Recovery Tanks"., Crystal
        Flash: A secret technique that Samus can use to replenish her health at the
        cost of her ammunition, taught to her by the Chozo and performed using technology
        integrated into the Power Suit. By laying a Power Bomb, Samus wreathes herself
        in a cocoon of energy, using the power of the bomb to completely replenish
        her energy supplies., Hypermode: A highly powerful but temporary state in
        which Samus is powered up by exposure to Phazon, draining her energy to greatly
        increase her firepower and render herself nearly invulnerable to harm. While
        in Hypermode, Samus must vent her Phazon so that she doesn''t damage herself
        and suffer terminal corruption, dying and becoming another Dark Samus., Phazon
        / Hyper Beam: An incredibly powerful upgrade for Samus'' beam that instead
        fires blue bolts of electricity with high power, draining her supply of Phazon
        if none is available nearby. It can be charged to instead rapidly fire multiple
        beams one after another., Hyper Ball: A Phazon-powered Morph Ball strike that
        releases a burst of blue electricity in all directions, seeking and damaging
        all opponents caught in the blast but constantly draining Samus'' Phazon as
        long as it''s active., Hyper Grapple: An enhanced Grapple Beam, empowered
