- id: claim-powers-and-abilities-ba508388
  section: abilities
  axis: hax
  text: 'Metroid: Zero Mission=Superhuman Physical Characteristics, Genius Intelligence
    (Mother Brain was a Chozo supercomputer designed to oversee the entirety of Zebes''
    environmentMetroid Manga (2002) - Chapter 2, and inherited much of the Chozo''s
    knowledge, leading the entire Galactic Federation into prosperityMetroid Manga
    (2002) - Chapter 7), Earth Manipulation (Affected the entirety of Zebes'' ecosystem,
    transforming all of it into a fortressMetroid Manga (2002) - Chapter 14), Telepathy,
    Mind Manipulation and Animal Manipulation (Using her telepathyMetroid: Other M
    (2010) - "Madeline... Bergman." [cutscene], Mother Brain turned all of the creatures
    of Zebes creatures into her guardsMetroid Manga (2002) - Chapter 15. Later, the
    Galactic Federation wanted to harness her powers to take control over their cloned
    versions of Space PiratesMetroid: Other M (2010) - "You will all be judged." [cutscene]),
    Analytical Prediction (Gray Voice implied that Mother Brain could reliably predict
    the actions of most people, though not Samus AranMetroid Manga (2002) - Chapter
    12), Energy Projection (Mother Brain is capable of shooting energy from her eye,
    and her lair is equipped with various energy turrets), Homing Attack (Rinkas,
    the donut-shaped hazardsSuper Metroid (1994) - Mother Brain Boss Battle found
    in Mother Brain''s lairMetroid: Zero Mission (2004) - Mother Brain Boss Battle,
    are homing energy attacksMetroid: Other M (2010) - Bioweapon Research Center),
    Telekinesis (MB, an AI created to inherit Mother Brain''s intellect and psychic
    powers, could use them to create telekinetic shockwaves), Self-Destruction (When
    Mother Brain is defeated in Zero Mission and Super Metroid, she will activate
    a self-destruct mechanism capable of destroying Tourian or the entire planet of
    Zebes, respectively), Resistance to Ice Manipulation, Paralysis Inducement, Electricity
    Manipulation, Temperature Manipulation (Can withstand attacks from Samus Aran''s
    weapons such as the Ice BeamMetroid Prime (2002), Wave BeamMetroid Dread (2021)
    - E.M.M.I.-06WB and Power BombMetroid: Other M (2010) - "Clearly, this facility
    is in complete disorder." [cutscene]) |-|Super Metroid= All previous abilities,
    Large Size (Type 0), Regeneration (At least Mid-Low. Shown quickly regaining her
    lost health, symbolized by her coloration, as with all Super Metroid bosses, upon
    connecting with her new body, and after being nearly killed by the baby Metroid''s
    life absorption), Energy Projection and Technology Manipulation (Can unleash an
    incredibly powerful continuous beam from its eye, strong enough to incapacitate
    Samus Aran and drain all of her ammunition while being effectively impossible
    for her to dodge), Breath Attack (Can spit out blue orbs to attack foes), Explosion
    Manipulation (Can spit out explosive spheres, as well as launch explosive beams
    from its hands), Resistance to Life Absorption (Narrowly survived the baby Metroid''s
    life absorption, which was shown to quickly kill most other creaturesSuper Metroid
    (1994) - Tourian)'
  source_ids: *id003
  decisive: true
  status: unverified
