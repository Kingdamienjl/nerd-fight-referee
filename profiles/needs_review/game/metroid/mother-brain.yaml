  name: And I, to support the Chozo's martial strength, made the Power Suit. In other
    words, I gave birth to you!}} ==Summary== Mother Brain is a hyper-advanced artificial
    intelligence created by the Chozo species. Intended for peaceful purposes, it
    developed a superiority complex and a desire for galactic domination, earning
    the fealty of the Space Pirates and turning against the Chozo, nearly wiping them
    out. Mother Brain's quest for power was ultimately stopped by Samus Aran, who
    also was the one to finally bring her to a permanent end after her return. ==Powers
    and Stats
