        (Once Nodens reaches critically low HP, a barrier that either reflects or
        negates all incoming attacks will automatically erect itself around him, persisting
        for a short time), Resistance to Fire Manipulation, Water Manipulation, Air
        Manipulation, Earth Manipulation, Ice Manipulation, Electricity Manipulation,
        Radiation Manipulation, Explosion Manipulation, Holy Manipulation, Light Manipulation,
        Curse Manipulation, Darkness Manipulation, Resistance Negation, Energy Manipulation,
        Biological Manipulation and Mind Manipulation All previous abilities to a
        far greater extent. Magic, which now includes: Energy Manipulation, Light
        Manipulation, Holy Manipulation, and depending on the result of Spectra Force,
        potentially Water Manipulation, Air Manipulation, Earth Manipulation, Ice
        Manipulation, Electricity Manipulation, or Radiation and Explosion Manipulation.
        Martial Arts (Fights without weaponry, and should be superior in skill to
        the Velvet Room Attendants, who are equal, if not superior in skill to martial
        prodigies and geniuses), Damage Boost and Limited Durability Negation (With
        Guard Punish, which functions such that defending targets receive double the
        damage they would''ve received had they not been guarding at all), Creation
        (Philemon created the Velvet Room, a place that exists between reality and
        imagination, as well as the Extra Dungeon Labyrinth that is formed from the
        memories of the Persona 2 characters) and Cognition (Type 2. Can directly
        change the cognitions of other sentient beings, as Philemon was stated to
        be capable of directly entering the hearts of humans, and is himself one of
        the fundamental units of thought through which the phenomenon takes effect
        to begin with.), Summoning (Can easily summon and control all kinds of demons,
        even ones as powerful as Yog-Sothoth, who appears as nothing but a random
        encounter in the Labyrinth he created) All previous abilities to a far greater
        extent. Invulnerability to Darkness Manipulation, Curse Manipulation, Light/Dark-based
        Death Manipulation, Energy Manipulation, Resistance Negation and Mind Manipulation'
