- id: claim-powers-and-abilities-dab18995
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Telekinesis, Teleportation,
    Cognitive Physiology (At least Mid-Tier, likely Archetype), Magic which includes:
    Forcefield Creation and Attack Reflection of Elemental, and Physical Attacks (With
    Shell of Denial and Alienation Wall, the former can negate Almighty Attacks, which
    bypasses forcefields and attack reflection), Resistance Negation and Existence
    Erasure (Can use Almighty Attacks, which bypass all barriers and reflectors, invulnerability,
    and resistances. Can even negate an opponents resistance to resistance negation
    with Pierce. Almighty attacks are able to hurt someone wielding the Omnipotent
    Orb, which bends the rules of reality to defend the user from attacks, and Reason
    Bearers, who are able to enforce rules into reality to protect themselves from
    attacks. The Megi- line of spells is capable of obliterating opponents with a
    light that erases them "beyond death"), Electricity Manipulation (Capable of raining
    large strikes of lightning from the sky with Hot Lightning), Statistics Amplification
    (with Mind Charge), Summoning (Capable of summoning Shadows to assist her in combat),
    Mind Manipulation, Life Manipulation and Soul Manipulation (The Hollow Forest
    drains the physical and spiritual vitality of those who enter, is capable of making
    enemies completely exhausted after a few fights), Law Manipulation and Existence
    Erasure (The Hollow Forest prevents any external help from being used, as items
    not from there will simply disappear), Weather Manipulation, Nonexistent Physiology
    (Nature Type 1; Aspect Type 1, 2, and 3. A resident of the Velvet Room, a nonexistent
    space, Marie doesn''t conventionally exist, existing in the state between mind
    & matter, only giving herself physical form upon her will), Absorption (Capable
    of absorbing a large amount of fog), Status Effect Inducement which includes Mind
    Manipulation and Paralysis Inducement (Can inflict Dizzy with Hot Lightning) Resistance
    to Physical Attacks. Reflection of Light Manipulation, Darkness Manipulation,
    Holy Manipulation, Curse Manipulation, and Death Manipulation. Resistance to Death
    Manipulation, BFR, Probability Manipulation, Existence Erasure, Information Manipulation,
    Mind Manipulation, Soul Manipulation, Fusionism and Memory Manipulation (Simply
    having the potential to awaken a Persona grants one a will firm enough to maintain
    their own existence and individuality in the unconscious world, where the concept
    of the ego does not exist and all individuality dissolves into oneness, with ordinary
    people being immediately overwhelmed by the nothingness and scattered throughout
    all possible worlds by stepping into it), Curse Manipulation and Fate Manipulation
    (Like other characters, likely able to fight and defeat White Rider, the abstract
    embodiment of victory and conquest whose crown assures his success in all battles
    and wars. Unbothered by interactions with Pisacas, which fate humans to die in
    the span of nine months), Disease Manipulation, Probability Manipulation, Madness
    Manipulation and Chaos Manipulation (Unaffected by the act of looking into Girimehkala''s
    eye, which inflicts incurable sickness and misfortune into individuals, and by
    the gaze of Yakkha, which is said to inflict disease and madness. The team glasses
    block out the fog, which can induce sickness), Petrification and Poison Manipulation
    (Can easily do battle against Basilisk and Cockatrice, both of whom turn normal
    people into stone simply by being touched or looked at, and have a gaze and breath
    so poisonous that any mortal being near them instantly dies, turning their surroundings
    into a desert), Life and Death Manipulation (Can fight Liches, whose presence
    drains the life of those who see them, and is not affected by Balor''s gaze, which
    instantly kills enemies, and Chatterskull''s laughter, which dooms whoever hears
    it to death, immediately stopping their heart). All previous, along with Elemental
    Manipulation which includes: Magic, consisting of: Fire, Ice Manipulation, Lightning,
    Wind. Power Nullification and Sound Manipulation (Can nullify reductions in statistics
    and silence enemies with Cry of Denial), Shockwave Generation (Can slam the ground
    to create shockwaves) All previous, along with Attack Reflection of Fire, Ice,
    Lightning, and Wind (Reflects nearly every element in the game, making her immune
    to conventional attacks) All previous greatly enhanced, along with Cognitive Physiology
    (Archetype), Understanding (Type 2), Illusion Creation and Fog Manipulation, Perception
    Manipulation, Transmutation, Mind and Soul Manipulation, Disease Manipulation,
    and Subjective Reality (Should be capable of manipulating the Fog, which is capable
    of warping people''s perceptions, transmuting people into Shadows, causing sickness
    and manipulating reality as people see fit), Shapeshifting (Should be capable
    of shifting her form), Buff and Debuff Negation (with Dekaja and Dekunda), Healing
    (via Diarama), Energy Projection, Invulnerability'
