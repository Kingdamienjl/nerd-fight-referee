        \ ( Assassins can take on other people's roles or entirely new personas, enter\
        \ unfamiliar social settings, act disecretely, and move through even the most\
        \ guarded of areas. They can also suppress their natural sounds, completely\
        \ dampen their presence,camouflage themselves even inside objects. They can\
        \ even engage in unconventional guerilla and covert combat and close in on\
        \ their opponents on their blind side mid-combat, allowing them to connect\
        \ eight slashes even when their target is superior to them in terms of physical\
        \ strength and any experience or skill competition. Nagisa can also loot others\
