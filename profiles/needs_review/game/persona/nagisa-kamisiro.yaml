- id: claim-powers-and-abilities-bebd5077
  section: abilities
  axis: hax
  text: '*Precognition (One of Nagisa''s primary abilities is seeing visions of the
    future or alternate events.) *Superhuman Physical Characteristics *Martial Arts
    *Weapon Mastery (Knives and Grappling Hooks) *Stealth Mastery *Acrobatics *Regeneration
    (Mid-Low. Healing speed depends on willpower) *Supernatural Willpower *Empowerment
    *Accelerated Development and Reactive Evolution (Battle, Leveling, and Training;
    Physical Stats, Magic, and Improved Resistances.(Humans are able to get more powerful
    after defeating strong demons or even as they are in the middle of battle, even
    against opponents ontologically superior to them, and are able to grow massively
    in strength in the span of merely a day''s time or less, either through resolve,
    the threat of death, or training, or the bonds they hold dear) *Sealing and Power
    Absorption (After defeating a Shadow, Wonder seals his once-foes and they become
    a new mask) *Information Analysis and Extrasensory Perception (With Third Eye,
    which allows Nagisa (like Ren) to single-out anything relevant to his current
    objectives, spot details invisible to the naked eye, as well as sense the strength
    of an opponent relative to himself) *Perception Manipulation (Like Ren, Third
    Eye can slow down Nagisa''s perception of time) *Non-Physical Interaction *Durability
    Negation *Cognitive Physiology *Magic, consisting of: Fire, Ice Manipulation,
    Lightning, Wind, Radiation, Explosion, Psychokinetic, Energy, Holy, Light, Curse,
    Darkness, Petrification, Death Manipulation * Resistance Negation and Existence
    Erasure (Can use Almighty Attacks, which bypass all barriers and reflectors, invulnerability,
    and resistances. Can even negate an opponent''s resistance to resistance negation
    with Pierce. Almighty attacks are able to hurt someone wielding the Omnipotent
    Orb, which bends the rules of reality to defend the user from attacks, and Reason
    Bearers, who are able to enforce rules into reality to protect themselves from
    attacks. The Megi-line of spells is capable of obliterating opponents with a light
    that erases them "beyond death") * Absorption (Can drain vitality and spiritual
    energy with Spirit Drain and Life Drain. * Healing * Purification * Statistics
    Amplification and Statistics Reduction (With Physical skills and various support
    spells) * Damage Boost (With critical hits) * Damage Reduction (With Guard) *
    Status Effect Inducement which includes: Empathic Manipulation (With Dizziness
    and Rage) Memory Manipulation (With Makajama and Makajamaon) Sleep Manipulation
    (With Dormina and Lullaby) * Depending on the equipped Persona, Resistance of:
    Fire, Ice, Lightning, Wind, Radiation, Explosion, Psychokinetic, Energy, Holy,
    Light, Curse, Darkness, Death Manipulation, Existence Erasure, Information Manipulation,
    Mind Manipulation, Soul Manipulation, Fusionism Memory Manipulation (Simply having
    the potential to awaken a Persona grants one a will firm enough to maintain their
    own existence and individuality in the unconscious world, where the concept of
    the ego does not exist and all individuality dissolves into oneness, with ordinary
    people being immediately overwhelmed by the nothingness and scattered throughout
    all possible worlds by stepping into it) * Curse Manipulation (Like the other
    protagonists, he is likely able to fight and defeat White Rider, the abstract
    embodiment of victory and conquest whose crown assures his success in all battles
    and wars. Unbothered by interactions with Pisacas, which fate humans to die in
    the span of nine months) * Disease Manipulation * Probability Manipulation * Madness
    Manipulation and Chaos Manipulation (Unaffected by the act of looking into Girimehkala''s
    eye, which inflicts incurable sickness and misfortune into individuals, and by
    the gaze of Yakkha, which is said to inflict disease and madness) * Petrification
    and Poison Manipulation (Can easily do battle against Basilisk and Cockatrice,
    both of whom turn normal people into stone simply by being touched or looked at,
    and have a gaze and breath so poisonous that any mortal being near them instantly
    dies, turning their surroundings into a desert) * Life and Death Manipulation
    (Can fight Liches, whose presence drains the life of those who see them, and is
    not affected by Balor''s gaze, which instantly kills enemies, and Chatterskull''s
    laughter, which dooms whoever hears it to death, immediately stopping their heart)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
