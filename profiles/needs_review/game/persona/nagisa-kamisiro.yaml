    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Extrasensory Perception, Superhuman\
        \ Athleticism, Acrobatics, Bloodlust Projection ( Intimidating & Hallucination-Inducing:\
        \ When bloodlust is exposed, it has varying side effects on others; being\
        \ able to unconditionally frighten people, regardless of whether the target\
        \ is superior to you in terms of physical strength and any experience or skill\
        \ competition, or is looking down on you in every way due to heavily infused\
        \ socio-hierarchical upstanding. Other uses of bloodlust include causing others\
        \ to believe that they got sliced by a katana with a simple touch,cracking\
        \ and breaking the objects around you, and coating your weapon with it to\
        \ use it as a bait), Weapon Mastery, Martial Arts (Skilled In Assassination.\
        \ Has a \"Close Quarters Assassination\" rating of 3.5.), Stealth Mastery\
        \ ( Assassins can take on other people's roles or entirely new personas, enter\
        \ unfamiliar social settings, act disecretely, and move through even the most\
        \ guarded of areas. They can also suppress their natural sounds, completely\
        \ dampen their presence,camouflage themselves even inside objects. They can\
        \ even engage in unconventional guerilla and covert combat and close in on\
        \ their opponents on their blind side mid-combat, allowing them to connect\
        \ eight slashes even when their target is superior to them in terms of physical\
        \ strength and any experience or skill competition. Nagisa can also loot others\
        \ while walking past them, evading detection.), Preparation (Preparation is\
        \ an essential skill for all who call themselves assassins, be they apprentices\
        \ or professionals; assassins are capable of creating intricate schemes and\
        \ carrying out assassinations under a variety of circumstances and conditions\
        \ entirely on their own, along with backups for any unforeseen complications,\
        \ leaving their targets with no possibility of escaping. Depending on the\
        \ type of assassin, the type of assassination also changes, from building\
        \ a giant pudding to distract the target to isolating an entire mountain with\
        \ special types of lasers that extend underground to seal the target in one\
        \ place and firing specially made national weapons.), Paralysis Inducement,\
        \ Perception Manipulation (He can erase his presence.), Sound Manipulation,\
        \ Mind Manipulation, and possible limited Quantum Manipulation (via Nekodomashi\
        \ Clap. The attack disrupts the wavelength of one\u2019s consciousness once\
        \ the wavelength has reached its peak. The closer a wavelength to it\u2019\
        s peak, the more reactive a person can be to a stimulus. This could be a part\
        \ of Quantum superposition, which is a part of the quantum Mind/consciousness\
        \ theory, and this is further shown through Nagisa\u2019s ability to sense\
        \ emotions.), Fourth Wall Awareness and minor Toon Force (Assassination Classroom\
        \ is a series in which the characters are aware of their fictional nature,\
        \ the existence of an author, and their panel usage, with cartoonish events\
        \ like eyeballs poking out of their sockets, birds flying on their heads on\
        \ a K.O., and other such things being acknowledged happenings in the series,\
        \ as evidenced by Irina's character profile), Social Influencing, Emotional\
        \ Manipulation, Information Analysis (via People Reading), Text Manipulation\
        \ (Comparable to Karasuma, who crushed a speech bubble), Minor Analytical\
        \ Prediction, Memory Manipulation and limited Power Nullification (Negated\
        \ Kayano\u2019s bloodlust and made her forget it by kissing her.), Camouflage,\
        \ Enhanced Senses, Photographic Memory (Memorized an entire blueprint of a\
        \ very large building within 3 minutes), Explosives, Smoke Manipulation (with\
        \ capsule smoke screen), Tasers, Laxatives, Tranquilizers, Tear Gases, Resistance\
        \ to Electricity Manipulation and Fire Manipulation (via P.E clothes.), H"
