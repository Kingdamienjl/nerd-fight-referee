        \ aforementioned, was far above Luna/Sena, who utterly trounced Ragna during\
        \ CS. Ragna\u2019s Azure Grimoire boost is even stronger than it was in Continuum\
        \ Shift. In early CF Ragna\u2019s Pale Azure Grimoire casually and permanently\
        \ increased Ragna\u2019s strength to the point he could evenly match Hakumen\
        \ when the latter had far superior strength, whereas in the first game, Ragna\
        \ had to fully activate the grimoire to overcome the same kind of strength\
        \ difference between him and Hakumen in Calamity Trigger. And even without\
