- id: claim-powers-and-abilities-ad232692
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Stealth Mastery, Summoning, Supernatural
    Willpower, Empowerment, Accelerated Development, Reactive Power Level, and Reactive
    Evolution (Battle, Leveling, and Training; Physical Stats, Magic, and Improved
    Resistances. Humans are able to get more powerful after defeating strong demons
    or even as they are in the middle of battle, even against opponents ontologically
    superior to them, and are able to grow massively in strength in the span of merely
    a day''s time or less, either through resolve, the threat of death, or training,
    or the bonds they hold dear, Non-Physical Interaction, Durability Negation, Healing
    Nullification, Immortality Negation (Type 2, 3, and 7), and Invulnerability Negation
    (Capable of interacting with Demons, which are invisible beings comprised of data
    and information, the fulcrum of the entire verse proper, a concept synonymous
    to souls, minds, and even concepts. Even entities devoid of time and space, and
    nonexistent bodies such as The White can be struck down. Can completely negate
    their invulnerability to conventional weaponry, and the requirement of needing
    to be on a specific informational frequency to harm, as well as Septentriones,
    which require spiritual attacks to harm, and as well as killing undead beings
    and regenerative entities, such as Nagas and Blobs) Cognitive Physiology (Persona),
    Magic, consisting of: Clairvoyance (Capable of scanning floors for enemies and
    treasure and determining their location), Healing (via Healing Wave), Information
    Analysis (Capable of scanning and analyzing enemies to determine their statistics,
    affinities, and abilities), Precognition (Capable of reading and predicting incoming
    attacks), Statistics Amplification (Capable of increasing the damage of allies
    significantly) Resistance to Death Manipulation, BFR, Probability Manipulation,
    Existence Erasure, Information Manipulation, Mind Manipulation, Soul Manipulation,
    Fusionism and Memory Manipulation (Simply having the potential to awaken a Persona
    grants one a will firm enough to maintain their own existence and individuality
    in the unconscious world, where the concept of the ego does not exist and all
    individuality dissolves into oneness, with ordinary people being immediately overwhelmed
    by the nothingness and scattered throughout all possible worlds by stepping into
    it), Perception Manipulation (via Team Glasses), Fate Manipulation and Curse Manipulation
    (Like the other protagonists, he is likely able to fight and defeat White Rider,
    the abstract embodiment of victory and conquest whose crown assures his success
    in all battles and wars. Unbothered by interactions with Pisacas, which fate humans
    to die in the span of nine months), Disease Manipulation, Probability Manipulation,
