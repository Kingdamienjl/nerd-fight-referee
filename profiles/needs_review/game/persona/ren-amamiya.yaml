    talented teenager, quickly mastering stealth, infiltration, martial arts, strategy
    and tactics, craftsmanship, the handling of firearms, speech, and of course, thievery.
    For a year, he led the Phantom Thieves to track down well-hidden criminals and
    trace them back to their source, matching wits with geniuses such as Goro Akechi
    and Sae Niijima, and eventually dismantling a supernatural conspiracy taking place
    throughout Japan, all while maintaining "an honest student life")
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-8a82cae2
  section: weaknesses
  axis: weakness
  text: Ren's physical and spiritual vitality is drained by using physical and magical
    skills respectively.
  source_ids: *id003
  decisive: false
  status: unverified
