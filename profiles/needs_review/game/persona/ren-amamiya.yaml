- id: claim-powers-and-abilities-41ec75a6
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Weapon Mastery (Knives
    and Grappling Hooks), Stealth Mastery, Acrobatics, Regeneration (Mid-Low. Healing
    speed depends on willpower), Summoning (Ren is capable of summoning items from
    his inventory for use in battle, as shown on multiple occasions where large items
    and equipment are pulled out of nowhere and used despite being missing in both
    gameplay and cutscenes), Supernatural Willpower, Empowerment, Accelerated Development
    and Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic,
    and Improved Resistances. (Humans are able to get more powerful after defeating
    strong demons or even as they are in the middle of battle, even against opponents
    ontologically superior to them, and are able to grow massively in strength in
    the span of merely a day''s time or less, either through resolve, the threat of
    death, or training, or the bonds they hold dear), Superhuman Charisma (As shown
    through Shadow Negotiation, Ren is charismatic enough to break the mind control
    that a Palace Ruler passively possesses over the Shadows in their Palace), Sealing
    and Power Absorption (After persuading a Shadow to become apart of him, Joker
    seals his once-foes and they become a new mask), Information Analysis and Extrasensory
    Perception (With Third Eye, which allows Ren to single-out anything relevant to
    his current objectives, spot details invisible to the naked eye, as well as sense
    the strength of an opponent relative to himself), Perception Manipulation (Third
    Eye can slow down Ren''s perception of time), Cognition (Type 1) and Passive Fate
    Manipulation (Ren is the Trickster, a being capable of defying and changing fate
    in the Megami Tensei multiverse, that binds even the gods which inherently exist
    under an irregular system of causality. The smallest intervention on Ren''s part
    is capable of dramatically changing predetermined fates. This is further observed
    by Chihaya Mifune, who can perceive fates through Tarot readings with complete
    accuracy, to the point of receiving accurate visions of the future, such as Ren''s
    death in the police interrogation room. Ren was capable of defying his predetermined
    fate of losing to Yaldabaoth, who had hijacked his journey as a Wild Card and
    rigged everything against his success. Furthermore, an effectively-deified Takuto
    Maruki has stated that even if he were to retry his final battle with the Phantom
    Thieves, it would be impossible for him to win), Non-Physical Interaction, Durability
    Negation, Healing Nullification, Immortality Negation (Types 2, 3, and 7), and
    Invulnerability Negation (Capable of interacting with Demons, which are invisible
    beings comprised of data and information, the fulcrum of the entire verse proper,
    a concept synonymous to souls, minds, and even concepts. Even entities devoid
    of time and space, and nonexistent bodies such as The White can be struck down.
    Can completely negate their invulnerability to conventional weaponry, and the
    requirement of needing to be on a specific informational frequency to harm, including
    Septentriones, which require spiritual attacks to harm, as well as killing undead
    beings and regenerative entities, such as Nagas and Blobs) Cognitive Physiology,
    Magic, consisting of: Fire, Water Manipulation, Ice Manipulation, Lightning, Earth
    Manipulation, Wind, Radiation, Explosion, Psychokinetic, Energy, Holy, Light,
    Curse, Darkness, Petrification, Gravity Manipulation and Death Manipulation. Resistance
    Negation and Existence Erasure (Can use Almighty Attacks, which bypass all barriers
    and reflectors, invulnerability, and resistances. Can even negate an opponents
    resistance to resistance negation with Pierce. Almighty attacks are able to hurt
    someone wielding the Omnipotent Orb, which bends the rules of reality to defend
    the user from attacks, and Reason Bearers, who are able to enforce rules into
    reality to protect themselves from attacks. The Megi- line of spells is capable
    of obliterating opponents with a light that erases them "beyond death"), Absorption
    (Can drain vitality and spiritual energy with Deathtouch, Spirit Drain, Life Drain,
    Energy Drain, and passive Absorb skills), BFR (With Omni-Dimension, sends an enemy
    to another realm which can kill them upon entering it), Healing, Purification
    and Resurrection (With various support spells), Statistics Amplification and Statistics
    Reduction (With Physical skills and various support spells), Damage Boost (With
    critical hits), Damage Reduction (With Guard), Status Effect Inducement which
    includes Empathic Manipulation (With Dizziness/Nausea, Confusion, Despair and
    Rage), Fear Manipulation (With Evil Touch and Evil Smile), Memory Manipulation
    (With Makajama and Makajamaon), Sleep Manipulation (With Dormina and Lullaby),
    Mind Control (With Marin Karin and Brain Jack), and Petrification (With Petra)
    Through equipping certain items, Ren can possess any of the following: Enhanced
    Regeneration, Statistics Amplification, Attack Reflection, Fo'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
