- id: claim-powers-and-abilities-95ddf0d5
  section: abilities
  axis: hax
  text: 'Cognitive Physiology (Archetype), Cognition (Type 2) (Can create a realm
    that transcends all of the Persona multiverse and which can be viewed as film
    in her Cinema), Superhuman Physical Characteristics, Weapon Mastery (Rapier),
    Weapon Creation, Telekinesis, Teleportation, Portal Creation, BFR, Matter Manipulation,
    Shapeshifting, Possession (Should scale to weaker Persona avatars, which can possess
    the minds that they occupy). Magic, consisting of: Air Manipulation, Electricity
    Manipulation, and Water Manipulation. Resistances and Affinities: Air Manipulation,
    Electricity Manipulation, Invulnerability to Sleep Manipulation, Poison Manipulation,
    Petrification, Curse Manipulation (specific to curses that inflict damage their
    targets when attacking), Paralysis Inducement, Power Nullification & Statistics
    Reduction (specific to abilities that would bind her physical strength and/or
    disable her ability to utilize magic), Death Manipulation, and Mind Manipulation
    (specifically the ability to be put in a state of confusion).'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
