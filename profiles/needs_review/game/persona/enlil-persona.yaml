  attack_potency:
    text: Outerverse level (As an Administrator of the Collective Unconscious Enlil
      was able to control and manipulate the Akashic Record, a medium recording every
      possible event and memory in the Persona multiverse, to her end of trapping
      an infinite amount of souls in her Cinema Labyrinth and making them experience
      false realities and drain them of all hope in order to end human suffering.
      Said Cinema Labyrinth housing the Akashic Record as film reels which can be
      played and viewed as projections of alternate realities in her individual theatres.
      Enlil is superior to Masakado) | Outerverse level (stronger than her previous
      form as she was able to push the collective party of PQ2 much further than her
      previous form and utilized much more deadly techniques.).
    source_ids:
    - mediawiki-4667681
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immeasurable while incarnated. Omnipresent otherwise (Those who inhabit
