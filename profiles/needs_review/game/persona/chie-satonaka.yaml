  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Stealth Mastery, Summoning, Supernatural
    Willpower, Empowerment, Accelerated Development, Reactive Power Level, and Reactive
    Evolution (Battle, Leveling, and Training; Physical Stats, Magic, and Improved
    Resistances. Humans are able to get more powerful after defeating strong demons
    or even as they are in the middle of battle, even against opponents ontologically
    superior to them, and are able to grow massively in strength in the span of merely
    a day''s time or less, either through resolve, the threat of death, or training,
    or the bonds they hold dear, Non-Physical Interaction, Durability Negation, Healing
    Nullification, Immortality Negation (Type 2, 3, and 7), and Invulnerability Negation
    (Capable of interacting with Demons, which are invisible beings comprised of data
    and information, the fulcrum of the entire verse proper, a concept synonymous
    to souls, minds, and even concepts. Even entities devoid of time and space, and
    nonexistent bodies such as The White can be struck down. Can completely negate
    their invulnerability to conventional weaponry, and the requirement of needing
    to be on a specific informational frequency to harm, as well as Septentriones,
    which require spiritual attacks to harm, and as well as killing undead beings
    and regenerative entities, such as Nagas and Blobs) Cognitive Physiology (Persona),
    Magic, consisting of: Ice Manipulation (via Bufu- spells), Light Manipulation,
    Holy Manipulation, and Death Manipulation (via Hama skills), Forcefield Negation
    (via Tetra Break), Attack Reflection (Can reflect physical attacks with Counter
    and Counterstrike), Creation (via God''s Hand), Summoning (Capable of creating
    meteors with Agneyastra), Damage Reduction (via Guard), Damage Boost (via critical
    hits), Air Manipulation (via Gale Slash), Statistics Amplification (with Dragon
    Hustle, Power Charge, and Tarukaja), Status Effect Inducement which includes Mind
    Manipulation (Can inflict Confuse with Skull Cracker) Through equipping certain
    items, Chie can possess any of the following: Regeneration (Mid-Low), Statistics
    Amplification, Attack Reflection, Forcefield Creation, Attack Absorption, Limited
    Precognition, Healing, Purification, Fire Manipulation, Damage Boost, Electricity
    Manipulation, Smoke Manipulation, Teleportation, Air Manipulation, Light Manipulation,
    Darkness Manipulation, Resistance Negation, Fear Manipulation, Empathic Manipulation,
    Sound Manipulation, Supernatural Luck. Resistance to Poison Manipulation, Empathic
    Manipulation, Fear Manipulation and Age Manipulation Resistance to Death Manipulation,
    BFR, Probability Manipulation, Existence Erasure, Information Manipulation, Mind
    Manipulation, Soul Manipulation, Fusionism and Memory Manipulation (Simply having
    the potential to awaken a Persona grants one a will firm enough to maintain their
