        to proceed due to his own desire to do battle in the flesh, whereas they had
        previously defeated Umr at-Tawil. Stated to exist at the root of the Outer
        Gods that exist past the Ultimate Gate, being the manifestation of their collective
        will and consciousness) | Outerverse level (Nyarlathotep is the shadow of
        humanity and the archetype of existential destruction that resides on a domain
