  attack_potency:
    text: Outerverse level (Can do battle with the entire end-game cast of Innocent
      Sin simultaneously, and, although defeated, ultimately put up a fight against
      them, meaning he is likely superior to Personas such as Sakya) | Outerverse
      level (Far more powerful than Hitler, being an entity created with the purpose
      of serving as "the ultimate obstacle" for Tatsuya's party to overcome as part
      of a trial to showcase their worth) | Outerverse level (The most powerful of
      all Trapezohedron Demons and the final one to be faced by the Eternal Punishment
      cast during their journey through Kadath Mandala, able to easily toy with them
      in a battle and casually laughing off his own defeat, only allowing them to
      proceed due to his own desire to do battle in the flesh, whereas they had previously
      defeated Umr at-Tawil. Stated to exist at the root of the Outer Gods that exist
      past the Ultimate Gate, being the manifestation of their collective will and
      consciousness) | Outerverse level (Nyarlathotep is the shadow of humanity and
      the archetype of existential destruction that resides on a domain even deeper
      than Kadath Mandala, acting as the foil to Philemon and the dark side of the
      Collective Unconscious, with the two forming "one unified existence" from which
      all human souls, alongside the world itself, and all infinite archetypes, are
      born, as they are personifications of humanity as a whole, giving birth to all
      gods and demons. Warped his entire realm into the shape of a cube, giving it
      form and structure so the Eternal Punishment cast could travel through it, and
      easily caught a sword strike from Tatsuya during their first meeting in Monado
      Mandala), higher with transformations (The Moon Howler is considerably more
      powerful than his human avatars, being, out of infinitely-many, the form which
      Nyarlathotep assumes when in need to engage in direct combat against threatening
      opponents, and his final form is even more so, being his true self of which
      all others are mere parts or "embodiments")
