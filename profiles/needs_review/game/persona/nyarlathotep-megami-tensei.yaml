- id: claim-weaknesses-079f2218
  section: weaknesses
  axis: weakness
  text: Nyarlathotep draws power from the negative thoughts and emotions of humanity,
    and thus he can be both strengthened and weakened by the masses' state of mind,
    although this seems to work in reverse as well, as his own defeat led to the hearts
    and souls of the people being changed en masse.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-bbd91e34
  section: abilities
  axis: hax
  text: 'Base: Superhuman Physical Characteristics, Expert Spear Wielder, Supernatural
    Willpower, Flight, Reactive Power Level, and Reactive Evolution (In times of dire
    need, Persona users can massively increase their strength to the point where those
    who previously stomped them can be overwhelmed by their sheer aura. Persona users
    can manifest new abilities and force their Persona''s to evolve mid-fight, and
    change the tides of battle), Power Nullification and Sealing (The Spear of Destiny
    can inflict wounds that never heal, either naturally or by magic, and take effect
    instantly, and even degraded copies of it can seal away Personas and magical abilities),
    Invulnerability (Can grant himself general invulnerability over a variable amount
    of time with the Holy Grail), Darkness Manipulation, Death Manipulation and possibly
    Existence Erasure (Omega Cluster inflicts instant death on an enemy party, starting
    with its weakest member, and, in his own words, returns them to nothing), Electricity
    Manipulation, Resistance Negation Resistances and Affinities: Darkness Manipulation
    and Light Manipulation, as well as Existence Erasure, Information Manipulation,
    Mind Manipulation, Soul Manipulation, Fusionism and Memory Manipulation (Simply
    having the potential to awaken a Persona grants one a will firm enough to maintain
    their own existence and individuality in the unconscious world, where the concept
    of the ego does not exist and all individuality dissolves into oneness, with ordinary
    people being immediately overwhelmed by the nothingness and scattered throughout
    all possible worlds by stepping into it)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
