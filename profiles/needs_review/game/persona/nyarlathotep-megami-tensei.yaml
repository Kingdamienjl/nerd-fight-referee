- id: claim-standard-equipment-384d543c
  section: equipment
  axis: equipment
  text: 'The Spear of Destiny: A legendary lance said to have once belonged to Saint
    Longinus, an alleged Roman soldier who, during the site of Jesus'' crucifixion,
    sought to confirm the Son of God''s death by piercing his side, creating a wound
    that spilled blood endlessly, never to be healed, and which later came to be known
    as the fifth and final of the Holy Wounds of Christ. In truth, this story was
    entirely fabricated by Nyarlathotep, but as human thoughts and beliefs shaped
    and influenced the flow of reality, so did the Holy Lance itself come into being,
    with its mythical background causing human cognition to grace it with the ability
    to grant certain death to those pierced by it, creating wounds that take effect
    instantly and are incapable of being healed, either naturally or by magic. The
    spear is also able to seal off an individual''s Persona, preventing them from
    utilizing their powers for an uncertain duration.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
