    - field: powers_and_abilities
      value: 'Base: Superhuman Physical Characteristics, Expert Spear Wielder, Supernatural
        Willpower, Flight, Reactive Power Level, and Reactive Evolution (In times
        of dire need, Persona users can massively increase their strength to the point
        where those who previously stomped them can be overwhelmed by their sheer
        aura. Persona users can manifest new abilities and force their Persona''s
        to evolve mid-fight, and change the tides of battle), Power Nullification
        and Sealing (The Spear of Destiny can inflict wounds that never heal, either
        naturally or by magic, and take effect instantly, and even degraded copies
        of it can seal away Personas and magical abilities), Invulnerability (Can
        grant himself general invulnerability over a variable amount of time with
        the Holy Grail), Darkness Manipulation, Death Manipulation and possibly Existence
        Erasure (Omega Cluster inflicts instant death on an enemy party, starting
        with its weakest member, and, in his own words, returns them to nothing),
        Electricity Manipulation, Resistance Negation Resistances and Affinities:
        Darkness Manipulation and Light Manipulation, as well as Existence Erasure,
        Information Manipulation, Mind Manipulation, Soul Manipulation, Fusionism
        and Memory Manipulation (Simply having the potential to awaken a Persona grants
        one a will firm enough to maintain their own existence and individuality in
        the unconscious world, where the concept of the ego does not exist and all
        individuality dissolves into oneness, with ordinary people being immediately
        overwhelmed by the nothingness and scattered throughout all possible worlds
        by stepping into it)'
      source_id: vsbattles-nyarlathotep-megami-tensei-persona
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Outerverse level (Can do battle with the entire end-game cast of Innocent
        Sin simultaneously, and, although defeated, ultimately put up a fight against
        them, meaning he is likely superior to Personas such as Sakya) | Outerverse
        level (Far more powerful than Hitler, being an entity created with the purpose
        of serving as "the ultimate obstacle" for Tatsuya's party to overcome as part
        of a trial to showcase their worth) | Outerverse level (The most powerful
        of all Trapezohedron Demons and the final one to be faced by the Eternal Punishment
        cast during their journey through Kadath Mandala, able to easily toy with
