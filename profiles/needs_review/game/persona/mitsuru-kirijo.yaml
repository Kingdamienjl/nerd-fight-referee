- id: claim-weaknesses-f0c99afb
  section: weaknesses
  axis: weakness
  text: 'She and her Persona are vulnerable to fire attacks Notable Attacks/Techniques
    Persona Summoning: The ability to utilize Personas, powerful manifestations of
    the mind and soul. Personas can move and attack independently of their users,
    allowing for double-teaming between their user and the equipped Persona. Each
    Persona has a set of elemental affinities, which also apply to their user while
    the Persona is equipped. Unlike the respective casts of Persona 4 and 5, the cast
    of Persona 3 can use their Personas in reality. Mitsuru''s initial Persona is
    Penthesilia, and her ultimate Persona is Artemisia. *Bufu: Inflicts a small amount
    of Ice damage to a single opponent. *Bufula: Inflicts a moderate amount of Ice
    damage to a single opponent. *Bufudyne: Inflicts a large amount of Ice damage
    to a single opponent. *Mabufu: Inflicts a small amount of Ice damage to all enemies.
    *Mabufula: Inflicts a moderate amount of Ice damage to all enemies. *Dia: Restores
    a small amount of health to one member of the party. *Diarama: Restores a moderate
    amount of health to one member of the party. *Marin Karin: Charms the target to
    win them over to Mitsuru''s side. *Tentarafoo: Mitsuru instills panic in all of
    her enemies. *Ice Boost: Enhances the effectiveness of ice attacks by 25%. *Spirit
    Drain: Absorbs a little bit of energy from the enemy. *Mind Charge: Following
    a spontaneous or "all-powerful" attack will be 2.5 times stronger. *Ice Break:
    Decreases enemy''s resistance to Ice attacks. *Ice Amp: Enhances Ice attacks by
    50%. *Diarahan: Restores the health of the entire stock of 1st party member. *Mabufudyne:
    Inflicts heavy ice damage on all enemies. *Megidolaon: Deals severe Almighty damage
    to all foes, bypassing all elemental resistances and special defenses. *Vorpal
    Blade: Deals heavy Slash damage to all foes. (1.5x "Great" condition bonus)'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
