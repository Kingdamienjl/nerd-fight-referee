    - field: powers_and_abilities
      value: 'Cognitive Physiology (Archetype), Absolute Zero, Abstract Existence
        (Type 1), Acausality (Type 5), Attack Reflection, Aura, Avatar Creation (Capable
        of shaping semi-independent entities from fragmentary parts of his own essence,
        all of which acts as extensions of his power that lie under his full control,
        with even his many Names manifesting as entities of their own), BFR (Repeatedly
        stated to have banished Lucifer and his forces to the depths of hell, or the
        Expanse, in the past), Biological Manipulation, Blood Manipulation, Causality
        Manipulation, Clairvoyance, Cognition (Type 2), Conceptual Manipulation (Type
        1. Holds full dominion over the realm of Atziluth, where the archetypes of
        all gods and demons slumber, and controls the process through which they are
        summoned and instantiated within the lower worlds), Cosmic Awareness, Creation,
        Curse Manipulation (Cursed all of the gods of old after trampling upon their
        reign in the distant past, turning them into lesser, demonic mockeries of
        their real selves), Darkness Manipulation, Disease Manipulation, Dream Manipulation,
        Duplication, Durability Negation, Elemental Manipulation (Fire, Lightning,
        Ice and Wind Manipulation, all of which pierce right through resistances of
        any kind), Energy Manipulation, Existence Erasure (his power is capable of
        completely negating the existence of Demons, returning them to their natural
        state as formless clumps of information, yet to be shaped by human thought
        and observation), Fate Manipulation, Flight, Fusionism (Merged Ashtar and
        Ishtar, imprisoning them in the form of the demon Astaroth), healing, Holy
        Manipulation, Immortality (Types 1, 4, 5, 8 and 9. his existence is ensured
        by the collective belief and Observation of humanity, as well as his true
        self residing in a higher plane of existence, who will continuously recreate
        him), Incorporeality, Information Manipulation (Holds control over the fundamental
        information which comprises all of reality, down to the conceptual level,
        and himself both personifies and administers the process through which the
        unformed mass of data at the foundation of existence is organized into the
        physical world), Law Manipulation (Exists as the embodiment of law, order
        and structure), Life and Death Manipulation (Capable of both bestowing life
        and ripping it away, and his very breath constantly gives birth to countless
        angels), Light Manipulation, Magic, Matter Manipulation, Memory Manipulation,
        Mind Manipulation (Acts as the source of Zelenin''s song, which is capable
        of brainwashing a great part of the human population into becoming mindless
        slaves who endlessly give praise to God, as well as remove its capacity to
        feel certain emotions, such as spite and hostility), Nigh-Omniscience, Paralysis
        Inducement, Perception Manipulation, Petrification, Physics Manipulation,
        Portal Creation, Power Bestowal (Any power held by the angels under YHVH''s
        command was bestowed upon them by him, and he can easily transform humans
        into angels or divine beings), Power Nullification (his Song was capable of
        imprisoning Mem Aleph, a formless, archetypal entity of pure information,
        within a physical form visible to humans), Probability Manipulation, Purification,
        Reality Warping, Resistance Negation, Resurrection (The Great Will of the
        Universe will continuously resurrect YHVH after death, so long as humans still
        believe him to be The One True God), Sealing, Shapeshifting, Size Manipulation,
        Sleep Manipulation (Placed Seth on a deep slumber from which he would not
        awaken until he was necessary once again), Soul Manipulation (Kagutsuchi,
        one of his lesser aspects, controls the flow of human souls throughout the
        entirety of creation, and YHVH himself has full power over the spirits of
        both humans and demons, having imbued Zayin with the soul of Satan), Spatial
