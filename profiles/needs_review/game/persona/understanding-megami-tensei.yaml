    - field: attack_potency
      value: Outerverse level (Stands in immense superiority over all mythological
        Gods and Demons in the setting of Shin Megami Tensei, having overthrown all
        of them in ancient times and established himself as the highest of all deities
        through the collective Observation of humanity, and with his own power being
        used to summon and control the numerous supernatural entities found throughout
