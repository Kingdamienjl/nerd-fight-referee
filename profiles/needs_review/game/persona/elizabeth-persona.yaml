- id: claim-powers-and-abilities-85204a12
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Weapon Mastery (Cards
    and her Tome), Stealth Mastery, Supernatural Willpower, Empowerment, Accelerated
    Development and Reactive Evolution (Battle, Leveling, and Training; Physical Stats,
    Magic, and Improved Resistances. (Humans are able to get more powerful after defeating
    strong demons or even as they are in the middle of battle, even against opponents
    ontologically superior to them, and are able to grow massively in strength in
    the span of merely a day''s time or less, either through resolve, the threat of
    death, or training, or the bonds they hold dear), Durability Negation, Healing
    Nullification, Immortality Negation (Type 2, 3, and 7), and Invulnerability Negation
    (Capable of interacting with Demons, which are invisible beings comprised of data
    and information, the fulcrum of the entire verse proper, a concept synonymous
    to souls, minds, and even concepts. Even entities devoid of time and space, and
    nonexistent bodies such as The White can be struck down. Can completely negate
    their invulnerability to conventional weaponry, and the requirement of needing
    to be on a specific informational frequency to harm, as well as Septentriones,
    which require spiritual attacks to harm, and as well as killing undead beings
    and regenerative entities, such as Nagas and Blobs), Nonexistent Physiology (Type
    2; As creations of Igor, and a resident of the Velvet Room, a nonexistent space,
    Elizabeth doesn''t conventionally exist, existing in the state between mind &
    matter, only giving herself physical form upon her will), Cognition (Type 1; Scaling
    to Margaret, who can manipulate Kotone''s inner world) Cognitive Physiology (Archetype),
    Magic, consisting of: Fire, Water Manipulation, Ice Manipulation, Lightning, Earth
    Manipulation, Wind, Radiation, Explosion, Psychokinetic, Energy, Holy, Light,
    Curse, Darkness, Petrification with Petra, Gravity Manipulation and Death Manipulation.
    Resistance Negation and Existence Erasure (Can use Almighty Attacks, which bypass
    all barriers and reflectors, invulnerability, and resistances. Can even negate
    an opponents resistance to resistance negation with Pierce. Almighty attacks are
    able to hurt someone wielding the Omnipotent Orb, which bends the rules of reality
    to defend the user from attacks, and Reason Bearers, who are able to enforce rules
    into reality to protect themselves from attacks. The Megi- line of spells is capable
    of obliterating opponents with a light that erases them "beyond death"), Absorption
    (Can drain vitality and spiritual energy with Deathtouch, Spirit Drain, Life Drain,
    Energy Drain, and passive Absorb skills), BFR (With Omni-Dimension, sends an enemy
    to another realm which can kill them upon entering it), Healing, Purification
    and Resurrection (with various support spells), Statistics Amplification and Statistics
    Reduction (with Physical skills and various support spells), Damage Boost (with
    critical hits), Damage Reduction (with Guard), Status Effect Inducement, which
    includes, Empathic Manipulation (Dizziness/Nausea, Confusion, Despair and Rage),
    Fear Manipulation (with Evil Touch and Evil Smile), Memory Manipulation (with
    Makajama and Makajamaon), Sleep Manipulation (with Dormina and Lullaby), Mind
    Control (with Marin Karin and Brain Jack), and Petrification (with Petra), Power
    Nullification (With Binds), Regeneration (High-Godly; Persona-users of this caliber
    are capable of returning after their complete erasure, as shown when Enlil erases
    the combined might of SEES, the Investigation Team, and the Phantom Thieves, in-which
    the same exact event occurred with Yaldabaoth, yet returned) Various Cognitive
    Affinities (Resistance, Invulnerability, Reflection and Absorption of Physical
    and Gun-based attacks, Fire, Ice, Electricity, Wind, Energy, Curse, Darkness,
    Holy, Mind, Light, Death, and Status Effect Inducement), Probability Manipulation,
    Existence Erasure, Information Manipulation, Mind Manipulation, Soul Manipulation,
    Fusionism and Memory Manipulation (Simply having the potential to awaken a Persona
    grants one a will firm enough to maintain their own existence and individuality
    in the unconscious world, where the concept of the ego does not exist and all
    individuality dissolves into oneness, with ordinary people being immediately overwhelmed
    by the nothingness and scattered throughout all possible worlds by stepping into
    it), Curse Manipulation (Like the other protagonists, he is likely able to fight
    and defeat White Rider, the abstract embodiment of victory and conquest whose
    crown assures his success in all battles and wars. Unbothered by interactions
    with Pisacas, which fate humans to die in the span of nine months), Disease Manipulation,
    Probability Manipulation, Madness Manipulation and Chaos Manipulation (Unaffected
    by the act of looking into Girimehkala''s eye, which inflicts incurable sickness
    and misfortune into individuals, and by the gaze of Yakkha, which is said to inflict
    disease and madness), Petrifi'
