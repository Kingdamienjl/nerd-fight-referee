  axis: hax
  text: 'Base: Superhuman Physical Characteristics, Expert Martial Artist and Gunslinger,
    Supernatural Willpower, Empowerment, Accelerated Development and Reactive Evolution
    (Battle, Leveling, and Training; Physical Stats, Magic, and Improved Resistances.
    (Humans are able to get more powerful after defeating strong demons or even as
    they are in the middle of battle, even against opponents ontologically superior
    to them, and are able to grow massively in strength in the span of merely a day''s
    time or less, either through resolve, the threat of death, or training, or the
    bonds they hold dear) With Persona: Cognitive Physiology (Persona), Magic consisting
    of: Fire Manipulation, Water Manipulation, Air Manipulation, Earth Manipulation,
    Ice Manipulation, Electricity Manipulation, Radiation Manipulation, Explosion
    Manipulation, Gravity Manipulation, Light Manipulation, Holy Manipulation, Darkness
    Manipulation, Curse Manipulation, Death Manipulation and Energy Manipulation.
    Summoning (Maya can summon missiles and asteroids to attack), Pressure Points
    (Maya can inflict instant death with a single pressure point strike), Creation
    (Maya can create demonic appendages to perform Havoc skills), Durability Negation
    (with Mind and Nerve attacks that directly target the mind and nervous system
    respectively), Resistance Negation (with Almighty spells, which also bypass Invulnerability,
    Attack Reflection and Attack Absorption), BFR (with Dimension spells), Healing,
    Resurrection (with Revival spells), Illusion Negation (with certain cure spells),
    Statistics Amplification (with Kaja spells and Brave Dance), Buff Negation (with
    Dekaja), Teleportation (with Trafuri), Forcefield Creation (with Tetraja, Tetrakarn
    and Makarakarn) and Life Manipulation (with life-halving spells). Status Effect
    Inducement consisting of: Sleep Manipulation, Empathic Manipulation (Panic/Confusion
    and Fury), Mind Control (with Charm), Poison Manipulation, Paralysis Inducement,
    Power Nullification (with Mute) and Illusion Creation Resistances and Affinities:
    Depending on the equipped Persona, Resistance, Invulnerability, Reflection and/or
    Absorption of: Fire Manipulation, Water Manipulation, Air Manipulation, Earth
    Manipulation, Ice Manipulation, Electricity Manipulation, Radiation Manipulation,
    Explosion Manipulation, Light Manipulation, Holy Manipulation, Darkness Manipulation,
    Curse Manipulation, Death Manipulation and Energy Manipulation Base: All previous
    abilities to a greater extent With Persona: All previous abilities to a greater
    extent, enhanced Forcefield Creation (with Wall spells) Resistances and Affinities:
    All previous abilities to a greater extent'
