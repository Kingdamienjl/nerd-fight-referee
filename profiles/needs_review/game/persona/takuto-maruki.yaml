    Flight (All Persona users are capable of flight through their Personas), Non-Physical
    Interaction (Capable of interacting with Shadows, which are invisible beings comprised
    of data and information, the fulcrum of the entire verse proper, a concept synonymous
    to souls, minds, and even concepts. Even entities devoid of time and space, and
    nonexistent bodies such as The White can be struck down), Negation of Regeneration
    (High-Mid. Can kill Nagas, who are stated to have immortal bodies capable of healing
    from any wound, and Blobs, which can regenerate even after being frozen and shattered),
    Immortality (Types 2 and 7. Can kill undead beings, such as zombies and ghosts),
    Durability and Invulnerability (Can harm demons, who even while materialized are
    described as existing in a different wavelength that makes them immune to conventional
    harm, and attacking on the spiritual level in order to bypass conventional resilience
    and invulnerability to physical attacks), Accelerated Development, Supernatural
    Willpower, and Reactive Evolution (Battle, Leveling, and Training; Physical Stats,
    Magic, and Improved Resistances. Humans are able to get more powerful after defeating
    strong demons or even as they are in the middle of battle, and to grow massively
    in strength in the span of merely a day's time or less, either through resolve,
    the threat of death, or training, or the bonds they hold dear), Dimensional Travel
    (Can travel at will between reality, Mementos, and his Palace), Teleportation
    (Can freely teleport to any location within his Palace), Summoning (can summon
    his Persona, as well as any number of Shadows to his side while within his Palace),
    Extrasensory Perception (Can sense Cognitive effects, and can perceive everything
