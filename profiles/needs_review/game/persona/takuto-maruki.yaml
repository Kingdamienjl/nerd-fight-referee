    possess the same regeneration as the Phantom Thieves, who were able to will themselves
    back into existence after Yaldabaoth erased them), Statistics Amplification (With
    Flow, which increases the power of all of Maruki's attacks by 250% for as long
    as he is in the flow state), Purification (With Detox) and Mental Restoration
    (with Wakefulness, which greatly restores Maruki's mental stamina should he be
    low on it), Information Manipulation Cognitive Physiology (Archetype), Information
    Manipulation (Type 2) and Cognition (Type 2), Magic (Explosion Manipulation, Radiation
    Manipulation, Holy Manipulation, Light Manipulation and Energy Manipulation),
    Resistance Negation (Can use Almighty Attacks, which bypass all barriers and reflectors,
    invulnerability, and resistances. Almighty attacks are able to hurt someone wielding
    the Omnipotent Orb, which bends the rules of reality to defend the user from attacks),
    Existence Erasure (The Megi- line of spells is capable of obliterating opponents
    with a light that erases them "beyond death"), Healing, Regeneration (Mid-Low
    for Maruki via being comparable to the Phantom Thieves, Low-Mid for Azathoth,
    which can regenerate lost tentacles and heal Maruki through Energy Stream), Statistics
    Amplification, Statistics Reduction, Damage Reduction (with Shield Tendril), Status
    Effect Inducement, which includes Empathic Manipulation, Fear Manipulation and
