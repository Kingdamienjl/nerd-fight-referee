- id: claim-powers-and-abilities-36c76539
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Cognitive Physiology (Archetype), Understanding
    (Type 2), Illusion Creation and Fog Manipulation, Perception Manipulation, Transmutation,
    Mind and Soul Manipulation, Weather Manipulation, and Subjective Reality (Izanami''s
    main ability is fog, capable of warping people''s perceptions, transmuting people
    into Shadows, and manipulating reality as people see fit. Her fog in the Midnight
    Channel affects the real world), Teleportation (Can warp herself in, out and around
    the TV World), Shapeshifting (Capable of shifting her form, such as transforming
    into a Gas Station Attendant), Invulnerability (Is impervious to attacks from
    those who cannot see her true form), Power Bestowal (Can grant people Personas),
    Space-Time Manipulation (Created the TV World from the Collective Unconscious,
    and her fog creates the necessary space-time distortions required for Shadows
    to exist), Pocket Reality Manipulation (Can shape the TV World as she sees fit),
    Magic, consisting of: Fire, Ice, Wind, Electricity, Light, Holy, Water, Dark,
    Curse, Energy, and Death Manipulation. Resistance Negation and Existence Erasure
    (Can use Almighty Attacks, which bypass all barriers and reflectors, invulnerability,
    and resistances. Can even negate an opponents resistance to resistance negation
    with Pierce. Almighty attacks are able to hurt someone wielding the Omnipotent
    Orb, which bends the rules of reality to defend the user from attacks, and Reason
    Bearers, who are able to enforce rules into reality to protect themselves from
    attacks. The Megi- line of spells is capable of obliterating opponents with a
    light that erases them "beyond death"), Damage Boost (with Mind Charge), Buff
    and Debuff Negation (with Dekaja and Dekunda), Healing (via Diarama), Energy Projection,
    Absorption (Capable of draining spiritual energy from an enemy), and Life Manipulation
    (Can cut enemy HP in half, absorb enemy lifeforce, or even reduce them to the
    brink of death, with a single spell each), Statistics Reduction (with -kunda spells)
    Status Effect Inducement, consisting of Power Nullification, Sound Manipulation,
    and Memory Manipulation (via Silence), Poison Manipulation (via Poison Mist),
    Mind Manipulation (via Marin Karin), and Sleep Manipulation (via Deadly Needle)
    Invulnerable to Water, Light, Holy, Dark, Curse and Death Manipulation. Cognitive
    Physiology (Various), Magic, consisting of: Fire, Ice, Wind, Electricity, Light,
    Holy, Dark, Curse, Energy, and Death Manipulation. Resistance Negation and Existence
    Erasure (Can use Almighty Attacks, which bypass all barriers and reflectors, invulnerability,
    and resistances), Statistics Amplification and Statistics Reduction (With -kaja
    and -unda Skills), Probability Manipulation (Can increase the chance of critical
    hits), Damage Boost (With Charge, Amp, and Boost Skills), Healing (With Dia skills),
    Absorption, Attack Reflection, Invulnerability to Elemental Manipulation (which
    includes Fire, Ice, Wind, Electricity, Light, Holy, Dark, Curse, Energy, and Death
    Manipulation), Status Effect Inducement which includes Power Nullification, Sound
    Manipulation, and Memory Manipulation (via Makajam), Empathic Manipulation (Can
    inflict Rage, Panic, and Exhaustion), Fear Manipulation (Can inflict fear onto
    enemies), and Age Manipulation (via Ennervation) As before, on a much higher level,
    Life and Age Manipulation (known as Enervation in-game, which halves strength,
    magic and endurance stats, depicted in the anime as forcefully aging a target
    several decades), Summoning and Earth Manipulation (Can summon meteors with Agneyastra).
    BFR, Curse Manipulation and Death Manipulation (with Thousand Curses, can banish
    people to the underworld) As before, on a much higher level, Absorption of Electricity'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
