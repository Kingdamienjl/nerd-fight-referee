- id: claim-powers-and-abilities-7e7d63c2
  section: abilities
  axis: hax
  text: 'Base: Superhuman Physical Characteristics, Weapon Mastery (Katana), Supernatural
    Willpower, Empowerment, and Reactive Power Level (In times of dire need, Persona
    users can massively increase their strength to the point to where those who previously
    stomped them can be overwhelmed by their sheer aura. Persona users can manifest
    new abilities and force their Persona''s to evolve mid-fight, and change the tides
    of battle) With Persona: Cognitive Physiology (Persona), Magic consisting of Fire
    Manipulation, Statistics Amplification (with Rakukaja and Marakukaja), Attack
    Reflection (With Counter and Counterstrike), Damage Transferal (With Calm Blade,
    which inflicts Hex), Power Nullification (Can nullify status ailments, and Arm
    Chopper, which inflicts bind), Probability Manipulation (With Bound Arts, he increases
    the chances of critical hits, and attacking twice with Golden Gemini), Healing
    (With Regeneration), Spatial Manipulation and Durability Negation (With Vorpal
    Blade), Resistance Negation (With Fire Break). Resistance and Affinities: Resistance
    and Invulnerability to Fire Manipulation, Holy Manipulation and Light Manipulation.
    Fire, Ice, Electricity, Wind, Explosion, Energy, Curse, Darkness, Holy, Light,
    and Death Manipulation (w/ various gems), Resistance Negation (w/ Megido gems),
    Status Effect Inducement (w/ various weapons), Healing (w/ various items), Attack
    Reflection (w/ Mirrors), Statistics Amplification (w/ various equipment and Sutras),
    Damage Boost and Empowerment (w/ various equipment), Debuff Negation (w/ Dekaja
    Gem), Statistics Reduction (w/ Dekunda Gem). Invulnerability and Law Manipulation
    (With the Omnipotent Orb, the laws of the universe are warped and manipulated
    to enforce the law that no harm can be enacted on the user). Base: All previous
    abilities to a greater extent. With Persona: All previous abilities to a greater
    extent. Resistance and Affinities: All previous abilities to a greater extent.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
