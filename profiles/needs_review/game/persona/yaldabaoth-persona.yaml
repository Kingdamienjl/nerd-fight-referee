      value: Superhuman Physical Characteristics, Immortality (Types 1, 3 and 8, Any
        damage it suffers is instantly healed by the unconscious wishes of mankind,
        and it will never truly die as long as sentient beings with conscious thought,
        desires and personalities exist), Regeneration (Low-Godly, is able to regenerate
        as long as humanity's collective unconscious exists and can completely negate
        damage on both the physical and mental levels as long as it is connected to
        the unconscious desires of the masses), Elemental Manipulation (Fire and Ice,
        can set enemies on fire, can freeze enemies solid), Dimensional travel (Infiltrated
        the Velvet Room, a pocket reality that exists "between dream and reality,
        mind and matter, consciousness and unconsciousness"), BFR, Sealing, Power
        Nullification (Sent the Phantom Thieves out of Mementos, sealed igor's powers
        and expelled him from the Velvet Room after defeating him, sealed the Velvet
        Room itself outside of existence, sealed the Phantom Thieves inside the Velvet
        Room), Boundary Manipulation (Manipulated the boundary between reality and
        cognition, unifying Mementos - the cognitive world - and the real world into
        a single realm, called the Qliphoth World, which it has complete control over.
        could enter and affect the Velvet Room, which is described as existing "between
        dream and reality, mind and matter, consciousness and unconsciousness"), Reality
        Warping (All of Mementos is under its total control to the point where it
        passively manipulates it, merged Mementos with reality and imposed its order
        onto the resulting "Qliphoth World", in a bad end to the game it unmade the
        Qliphoth World and reset reality to how it was before, modified the Velvet
        Room so that the Thieves could be sealed within it), Existence Erasure (Accomplished
        via reality warping, erased the concept of the Phantom Thieves from humanity's
        cognition and then merged cognition with reality, resulting in the Thieves
        vanishing from the merged reality and all of humanity forgetting about them,
        as if they had never existed at all), Mind Manipulation (It's implied he caused
        the entirety of the public to have a lessened reaction to the Phantom Thieves,
        with Akira's confidants remarking about how it wasn't normal and totally out
        of line with what people thought earlier. Some were even saying strange stuff
        that oddly lined up with Yaldabaoth's decisions to control, and later to purge
        and recreate, humanity. In a bad end to the game it unmade the Qliphoth World
        and instead rewrote humanity's cognition so that the Phantom Thieves were
        praised worldwide, manipulated the cognitions of all of humanity to the point
        where they saw the world differently, no one noticed the abnormalities rampant
        in the city), Memory Manipulation, Soul Manipulation (Split Lavenza into 2
        separate beings, sealed and clouded their memories as well), Can utilize "Almighty"
        attacks which bypass all defenses, Effective Power Nullification (Done via
        Memory manipulation, can cloud the memories of opponents severely to the point
        where they forget how to use their own abilities, including even physical
        attacks), All previous abilities, excluding Immortality (Types 1, 3 and 8)
        and Regeneration (Low-Godly), All previous abilities, Conceptual Manipulation
        (Can control and weaponize the 7 evils of man, imposing their effects onto
        its enemies), Empathic Manipulation (Via Distorted Lust, Distorted Envy and
        Distorted Wrath), Resistance Negation and Weakness Inducement (Via Distorted
        Vanity), Stat Manipulation (Can raise its own durability and lower every enemy's
        durability, also is accomplished via Distorted Wrath), Power Nullification
        (Can negate the positive effects of foes, can negate the negative effects
        on itself), Attack Nullification and Reflection (The Gun of Execution deflects
        projectiles and the Sword of Conviction reflects physical damage), Resistance
        to Elemental Manipulation (The Gun of Execution reflects Wind-based attacks,
        the Bell of Declaration reflects Fire-based attacks, the Sword of Conviction
        reflects electricity-based attacks and the Book of Commandments reflects Ice-based
        attacks), Radiation Manipulation (The Book of Commandments reflects nuclear
        explosions and other radiation-based attacks), Mind and Empathic Manipulation
        (The Bell of Declaration reflects damage on the mental level, is immune to
        all mental ailments)
