      value: Outerverse level (Merged the Metaverse and reality together into a single
        world known as the Qliphoth World. It is the core of Mementos, and sustains
        the entire Metaverse with its mere existence, with its defeat causing it to
        be completely erased and its fusion with reality to be undone. Persona has
        demonstrated numerous connections to Jungian Psychology throughout the series,
        with concepts such as Personas, Shadows and the Collective Unconscious being
        prominent throughout it. These concepts, per their descriptions in the verse,
        follow Carl Jung's philosophy quite closely, with Personas being described
        as the personalities that lie deep within the subconscious of humans, for
        example. But more importantly, the collective unconscious itself exists within
        the cosmology in the form of Mementos. Morgana explains it by saying that,
        deep within every single human's heart is an obscured thought process known
        as the unconscious. Said unconscious of humanity as a whole then melds together
        and forms the aforementioned collective unconscious, indicating that Mementos
        is essentially a shared cognitive world created by the joint distortions of
        society as a whole. Within the collective unconscious exists an infinite number
        of archetypes, completely surpassing and transcending space and time, which
        coincides perfectly with Carl Jung's philosophy. The collective unconscious
        is moreover said to be dimensionless in nature, with its unlimited number
        of archetypes being similar to platonic concepts--beyond space and time, as
        well as trans-spatial and trans-temporal in nature. All of this is supported
        even further by the fact that philosophers such as Plato and Jung, as well
        as Jungian Psychology itself, have been repeatedly mentioned and studied in-detail
        throughout the series. The Holy Grail would obviously scale to this quite
        comfortably, as previously explained) | Outerverse level (Easily defeated
        Igor and Lavenza, both of whom should be superior to Caroline and Justine,
        who "defeated" Joker following his first battle with the Holy Grail. Even
        after a single, extremely casual attack to the Phantom Thieves, Yaldabaoth
        was stated to be on a completely different level, causing Yusuke to doubt
        how they could possibly defeat him. He then proceeded to defeat the Phantom
        Thieves, further proving that the God of Control is vastly superior to the
        Holy Grail)
