    - field: attack_potency
      value: 'Universe Level+ (Alongside the Phantom Thieves, defeated Shadow Kamoshida,
        Shadow Madarame and Shadow Kaneshiro, whom are all capable of distorting and
        passively sustaining their Palaces, as when they leave or die, the entire
        realm collapses, which have been described as a parallel reality to the "Real
        World", which is obviously a universe, being other substantial worlds of substantial
        size, which is supported by the fact that Shido and Okumura''s palaces both
        contain countless stars within them. Okumura''s palace is outer space due
        to being based on The Big Bang. Palaces have even been described as entire
        dimensions on their own. Defeated Cognitive Wakaba, who is relative to Shadow
        Futaba, whom has her own Palace, which she sustains. Also fought Shadow Okumura,
        whom also has his own Palace, and is able to be one-shot by any Phantom Thieves
        member at this point, and fought and defeated Execurobo MDL-ED, Shadow Okumura''s
        strongest cognition.) | Outerverse Level (During the events of PQ2, is most
        definitely comparable to the Origin Bow and Quintessence Bow, which are platonic
        forms, weapons that Yukari Takeba uses. Fought Enlil who fought the combined
        forces of the Investigation Team, Phantom Thieves and S.E.E.S. Scales to the
        Investigation Team and S.E.E.S, whom fought Chronos, who created a realm where
        space and time are meaningless. Defeated Shadow Sae, Black Mask Goro Akechi,
        and fought Shadow Shido (defeating him one on one), who can contend with an
        even stronger Phantom Thieves as compared to the events of PQ2.) | Outerverse
        Level (Fought the Holy Grail and it''s true form, God of Control, Yaldabaoth,
        whom embodies, merged, warped and sustains Mementos. Lucifer even states that
        Ren transcends the Metaverse and Mementos itself upon his awakening, which
        has been stated to be, and acts as the collective unconscious, being cited
        as being the sea of human hearts/souls, which is stated to be composed of
        archetypes that create concepts from human thought, which there are an infinite
        amount of, which create and encompass all reality, which Ren''s transcendence
        to the Metaverse/Mementos would include him being beyond the concepts of reality
        the archetypes create. Said infinite archetypes are ideal forms that are stated
        to transcend time and space, mirroring those of platonic ideals within the
        verse. Yaldabaoth while disguised as Igor refers to the events and story of
        Persona 5 as a mere work of fiction to the Player, and believes that he will
        bring forth the destruction of everything which would include the Player.)
        | Outerverse Level (Effortlessly one shot God of Control, Yaldabaoth with
        Sinful Shell. Yaldabaoth even stated his power surpassed his own. Is empowered
        by the strength of all 8 Phantom Thieves whom were already comparable to himself
        during the Endgame Arcs, and is empowered by the desires of the masses, the
        latter of which granted Yaldabaoth his godhood and strength in the first place.
        Satanael, Ren''s Ultimate Persona, at this state, is described to be a demon
        lord whose duty is to punish naughty gods, his bullet, Sinful Shell is described
        to be so powerful that it can pierce gods such as the Gods of Control. Even
        before Joker and Satanael took in the power of the masses and the strength
        of the Phantom Thieves, Morgana doubted Satanael was even a Persona due to
        how immensely powerful he was.) | Outerverse Level (Is vastly superior to
        when he was when he fought Yaldabaoth. Can fight and defeat Violet and Berserk
        Cendrillion, who was capable of contending with the Phantom Thieves after
        they fought Yaldabaoth, and strengthened their wills of rebellion. Is able
        to fight Lavenza and Jose, whom can fight the entire Phantom Thieves, even
        after awakening their 3rd Tier Personas. Alongside the other Phantom Thieves,
        can defeat Takuto Maruki and Azathoth, could even defeat his ultimate Persona:
        Adam Kadmon when unfused. All the Phantom Thieves collectively were able to
        match Maruki when fused with Adam Kadmon, using the apex of his power when
