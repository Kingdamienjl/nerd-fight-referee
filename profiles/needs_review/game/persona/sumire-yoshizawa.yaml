- id: claim-powers-and-abilities-f289d951
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Rapiers and Rifles),
    Stealth Mastery, Acrobatics, Regeneration (Mid-Low, speed depends on willpower),
    Summoning (Sumire is capable of summoning items from the Phantom Thieves'' inventory
    for use in battle), Superhuman Charisma (Sumire is capable of assisting Ren Amamiya
    in Shadow Negotiation), Supernatural Willpower, Empowerment, Accelerated Development
    and Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic,
    and Improved Resistances. (Humans are able to get more powerful after defeating
    strong demons or even as they are in the middle of battle, even against opponents
    ontologically superior to them, and are able to grow massively in strength in
    the span of merely a day''s time or less, either through resolve, the threat of
    death, or training, or the bonds they hold dear), Acrobatics and Cognition (Type
    1), Non-Physical Interaction, Durability Negation, Healing Nullification, Immortality
    Negation (Type 2, 3, and 7), and Invulnerability Negation (Capable of interacting
    with Demons, which are invisible beings comprised of data and information, the
    fulcrum of the entire verse proper, a concept synonymous to souls, minds, and
    even concepts. Even entities devoid of time and space, and nonexistent bodies
    such as The White can be struck down. Can completely negate their invulnerability
    to conventional weaponry, and the requirement of needing to be on a specific informational
    frequency to harm, as well as Septentriones, which require spiritual attacks to
    harm, and as well as killing undead beings and regenerative entities, such as
    Nagas and Blobs) Cognitive Physiology, Magic, consisting of Holy and Light Manipulation.
    Limited Fire Manipulation (With Heat Wave), Weapon Creation (With Sword Dance),
    Spatial Manipulation and Durability Negation (With Vorpal Blade), Healing, Statistics
    Amplification (With Physical skills and various support spells), Damage Boost
    (With critical hits), Damage Reduction (With Guard) and Status Effect Inducement,
    which includes Biological Manipulation (Dizziness/Nausea). Limited Invulnerability
    (With Endure skills and/or sufficient willpower), and Limited Precognition (With
    Ali Dance) Through equipping certain accessories, Sumire can possess any of the
    following: Enhanced Regeneration, Statistics Amplification, Attack Reflection,
    Forcefield Creation, Attack Absorption, Limited Precognition, Healing, Purification,
    Fire Manipulation, Electricity Manipulation, Air Manipulation, Radiation Manipulation,
    Explosion Manipulation, Light Manipulation, Holy Manipulation, Darkness Manipulation
    and Curse Manipulation. Invulnerability to Memory Manipulation and Sleep Manipulation.
    Time Manipulation (should be able to move in stopped time, similar to Ren), Cognition
    (the Phantom Thieves'' wills of rebellion serve as protection against the effects
    of Cognition). With Cendrillion Invulnerability to Holy Manipulation, Light Manipulation
    and Light/Holy-based Death Manipulation, BFR, Absolute Zero, Existence Erasure,
    Information Manipulation, Mind Manipulation, Soul Manipulation, Fusionism and
    Memory Manipulation (Simply having the potential to awaken a Persona grants one
    a will firm enough to maintain their own existence and individuality in the unconscious
    world, where the concept of the ego does not exist and all individuality dissolves
    into oneness, with ordinary people being immediately overwhelmed by the nothingness
    and scattered throughout all possible worlds by stepping into it), Fate Manipulation
    and Curse Manipulation (Like the other protagonists, she is likely able to fight
    and defeat White Rider, the abstract embodiment of victory and conquest whose
    crown assures his success in all battles and wars. Unbothered by interactions
    with Pisacas, which fate humans to die in the span of nine months), Disease Manipulation,
    Probability Manipulation, Madness Manipulation and Chaos Manipulation (Unaffected
    by the act of looking into Girimehkala''s eye, which inflicts incurable sickness
    and misfortune into individuals, and by the gaze of Yakkha, which is said to inflict
    disease and madness), Petrification and Poison Manipulation (Can easily do battle
    against Basilisk and Cockatrice, both of whom turn normal people into stone simply
    by being touched or looked at, and have a gaze and breath so poisonous that any
    mortal being near them instantly dies, turning their surroundings into a desert),
    Life and Death Manipulation (Can fight Liches, whose presence drains the life
    of those who see them, and is not affected by Balor''s gaze, which instantly kills
    enemies, and Chatterskull''s laughter, which dooms whoever hears it to death,
    immediately stopping their heart). All previous abilities to a far greater extent.
    Enhanced Regeneration (Mid-Low normally, and High-Godly if killed or erased. As
    a member of the Phantom Thieves, Sumire possesses the same regeneration as Ren
    Amamiya, who can return from conceptual erasure from all of history, simply reappea'
