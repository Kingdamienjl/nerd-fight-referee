        despite being a fully robotic being, Aigis still possesses a human soul and
        consciousness), Supernatural Willpower, Empowerment, and Reactive Power Level
        (In times of dire need, Persona users can massively increase their strength
        to the point to where those who previously stomped them can be overwhelmed
        by their sheer aura. Persona users can manifest new abilities and force their
        Persona''s to evolve mid-fight, and change the tides of battle) With Personas:
        Magic, consisting of: Explosion Manipulation, Power Nullification (with Aegis
        Shield, she can nullify fire, ice, wind, psychokinetic, and nuclear damage),
        Resurrection (with Recarm skills), Summoning (with Agneyastra, Aegis can summon
        meteors), Electricity Manipulation (Palladion''s weapon generates lightning),
        Damage Reduction (with Swordbreaker), Statistics Amplification (with -kaja
        spells), Statistics Reduction (with-unda spells), Healing (with Dia spells),
        Statistics Negation (with Dekunda) Resistances and Affinities: Resistance
        and Invulnerability to Physical Attacks. Base: All previous abilities to a
        greater extent, minus Cyborgization and Inorganic Physiology (Despite physically
        still being an inorganic cyborg, she has lost her synaptic gaps, but still
        functions, with Fuuka describing her as really alive) With Personas: All previous
        abilities to a far greater extent, plus: Fire, Ice, Lightning, Wind, Psychokinetic,
        Energy, Holy, Light, Curse, Darkness and Death Manipulation. Resistance Negation
        (with Break and Almighty skills, which also bypass Invulnerability, Attack
        Reflection, Forcefields, Attack Absorption and Law-based defenses), Healing,
        Purification and Resurrection (with various support spells), Absorption (with
        Life and Spirit Drain), Statistics Amplification and Statistics Reduction
        (with Physical skills and various support spells), Damage Boost (with critical
        hits), Damage Reduction (with Guard), Status Effect Inducement, which includes,
        Empathic Manipulation (Dizziness/Nausea, Confusion, Despair and Rage), Fear
        Manipulation (with Evil Touch and Evil Smile), Memory Manipulation (with Makajama
        and Makajamaon), Sleep Manipulation (with Dormina and Lullaby) and Mind Control
        (with Marin Karin and Brain Jack), Weapon Creation (with skills like Sword
        Dance and God''s Hand), Earth Manipulation (can create powerful earthquakes
        with Gigantomachia), Spatial Manipulation and Durability Negation (with Vorpal
        Blade), Limited Invulnerability (with Endure skills and/or sufficient willpower),
        Enhanced Regeneration (with Regenerate, Invigorate and Fast/Instant-Heal skills),
        Damage Boost (with Boost and Amp skills), Limited Probability Manipulation
        (with Critical-chance buffs, such as Rebel''s Vanguard), Damage Reduction
        (with Elemental Walls and certain Persona Traits), additional Danmaku (with
        skills like Riot Gun), Forcefield Creation and Attack Reflection (with Tetrakarn
        and Makarakarn), Forcefield Negation (with Tetra and Makara Break) and Buff
