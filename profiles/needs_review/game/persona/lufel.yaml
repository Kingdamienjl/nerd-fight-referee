- id: claim-powers-and-abilities-7efb8f01
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts *Weapon Mastery (Tonfas
    and Blowguns) *Stealth Mastery *Acrobatics *Regeneration (Mid-Low. Healing speed
    depends on willpower) *Supernatural Willpower *Empowerment *Accelerated Development
    & Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic, and
    Improved Resistances.(Humans are able to get more powerful after defeating strong
    demons or even as they are in the middle of battle, even against opponents ontologically
    superior to them, and are able to grow massively in strength in the span of merely
    a day''s time or less, either through resolve, the threat of death, or training,
    or the bonds they hold dear) *Non-Physical Interaction *Durability Negation *Cognitive
    Physiology *Magic, consisting of: Fire and Healing * Purification * Statistics
    Amplification & Statistics Reduction (With Talent and various support skills)
    * Damage Boost (With critical hits) * Damage Reduction (With Guard) * Resistance
    to Cognition: Memory Manipulation (Simply having the potential to awaken a Persona
    grants one a will firm enough to maintain their own existence and individuality
    in the unconscious world, where the concept of the ego does not exist and all
    individuality dissolves into oneness, with ordinary people being immediately overwhelmed
    by the nothingness and scattered throughout all possible worlds by stepping into
    it) and Fire. * Curse Manipulation (Like the other Persona Users, he is likely
    able to fight and defeat White Rider, the abstract embodiment of victory and conquest
    whose crown assures his success in all battles and wars. Unbothered by interactions
    with Pisacas, which fate humans to die in the span of nine months) * Madness Manipulation
    & Chaos Manipulation (Unaffected by the act of looking into Girimehkala''s eye,
    which inflicts incurable sickness and misfortune into individuals, and by the
    gaze of Yakkha, which is said to inflict disease and madness) * Petrification
    & Poison Manipulation (Can easily do battle against Basilisk and Cockatrice, both
    of whom turn normal people into stone simply by being touched or looked at, and
    have a gaze and breath so poisonous that any mortal being near them instantly
    dies, turning their surroundings into a desert) * Life & Death Manipulation (Can
    fight Liches, whose presence drains the life of those who see them, and is not
    affected by Balor''s gaze, which instantly kills enemies, and Chatterskull''s
    laughter, which dooms whoever hears it to death, immediately stopping their heart)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
