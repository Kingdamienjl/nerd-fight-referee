    strong demons or even as they are in the middle of battle, even against opponents
    ontologically superior to them, and are able to grow massively in strength in
    the span of merely a day's time or less, either through resolve, the threat of
    death, or training, or the bonds they hold dear), Cognitive Physiology (Persona),
    Superhuman Physical Characteristics, Summoning, Magic, Skilled Bow and Handgun
    user, Healing, Ice Manipulation, Wind Manipulation, Earth Manipulation, Fire Manipulation,
    Electricity Manipulation, Radiation Manipulation, Vibration Manipulation, Gravity
    Manipulation, Holy Manipulation, Light Manipulation, Darkness Manipulation, Death
