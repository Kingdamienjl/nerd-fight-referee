    Freeze, Shock, Blind, Stone, Mute, Sleep, Bind, Paralyze, Happy, Fear, Unlcuky),
    Body Puppetry, Levitation via Liftoma, Teleportation with Outoma and Traesto,
    Attack Reflection and Forcefield Creation with various spells, Can force herself
    or others into a Berserk Rage which restricts the use of certain types of skills,
    Healing and Resurrection of herself and others, Limited Invulnerability, Durability
