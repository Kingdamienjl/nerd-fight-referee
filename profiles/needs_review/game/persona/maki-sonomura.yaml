- id: claim-weaknesses-80b24c05
  section: weaknesses
  axis: weakness
  text: Many of her skills require her to switch to different Personas in order to
    be used. Gains the weaknesses of her currently equipped Persona, though this can
    be mitigated by switching between them to gain a resistance to a former vulnerability.
    Maki is unable to use the skills of Empress Personas in battle, though she may
    still gain their resistances. Likewise, it's impossible for her take on Personas
    of the Moon Arcana at all.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
