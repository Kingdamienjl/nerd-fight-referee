        where those who previously stomped them can be overwhelmed by their sheer
        aura. Persona users can manifest new abilities and force their Persona''s
        to evolve mid-fight, and change the tides of battle), Power Nullification
        and Sealing (The Spear of Destiny can inflict wounds that never heal, either
        naturally or by magic, and take effect instantly, and even degraded copies
        of it can seal away Personas and magical abilities), Invulnerability (Can
        grant himself general invulnerability over a variable amount of time with
        the Holy Grail), Darkness Manipulation, Death Manipulation and possibly Existence
        Erasure (Omega Cluster inflicts instant death on an enemy party, starting
        with its weakest member, and, in his own words, returns them to nothing),
        Electricity Manipulation, Resistance Negation Resistances and Affinities:
        Darkness Manipulation and Light Manipulation, as well as Existence Erasure,
        Information Manipulation, Mind Manipulation, Soul Manipulation, Fusionism
