      value: "None notable Notable Attacks/Techniques: \u25AA Jecht Beam: Jecht fires\
        \ beams of energy from his eyes, petrifying anyone they come in contact with.\
        \ \u25AA Jecht Blade: Jecht charges energy in his sword and slashes at his\
        \ enemy repeatedly, knocking them away from the sheer force of the attack.\
        \ \u25AA Triumphant Grasp: Jecht picks his enemy up in his grip and creates\
        \ an explosion around them while turning them into a zombie, causing them\
        \ to be harmed by healing abilities and items. \u25AA Jecht Bomber: Jecht\
        \ creates a massively powerful gravitational singularity to crush enemies\
