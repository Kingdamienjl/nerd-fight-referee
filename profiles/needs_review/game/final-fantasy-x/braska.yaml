        \ multiple times. \u25AA Meteor Shot: Jecht calls down a meteor and tosses\
        \ it at his enemy. \u25AA Blitz King: Jecht kicks his foe twice before impaling\
        \ them with his sword. He then produces a massive boulder that he fragments\
        \ with a single kick and charges with energy with another. The fragments converge\
        \ on his target and explode in an attack he calls the Ultimate Jecht Shot\
        \ (Not to be confused with his Overdrive). \u25AA Yu Pagoda: Two stone structures\
