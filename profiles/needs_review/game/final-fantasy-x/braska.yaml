      value: "None notable Notable Attacks/Techniques: \u25AA Jecht Beam: Jecht fires\
        \ beams of energy from his eyes, petrifying anyone they come in contact with.\
        \ \u25AA Jecht Blade: Jecht charges energy in his sword and slashes at his\
        \ enemy repeatedly, knocking them away from the sheer force of the attack.\
        \ \u25AA Triumphant Grasp: Jecht picks his enemy up in his grip and creates\
        \ an explosion around them while turning them into a zombie, causing them\
        \ to be harmed by healing abilities and items. \u25AA Jecht Bomber: Jecht\
        \ creates a massively powerful gravitational singularity to crush enemies\
        \ flat. \u25AA Hot Steel: Jecht ignites his sword and slashes at his enemy\
        \ multiple times. \u25AA Meteor Shot: Jecht calls down a meteor and tosses\
        \ it at his enemy. \u25AA Blitz King: Jecht kicks his foe twice before impaling\
        \ them with his sword. He then produces a massive boulder that he fragments\
        \ with a single kick and charges with energy with another. The fragments converge\
        \ on his target and explode in an attack he calls the Ultimate Jecht Shot\
        \ (Not to be confused with his Overdrive). \u25AA Yu Pagoda: Two stone structures\
        \ that accompany Braska's Final Aeon during the final battle at Dream's End.\
        \ While they don't damage enemies, they are able to provide many support abilities,\
        \ and every time they're destroyed they're revived. * Power Wave: The Yu Pagodas\
        \ charge Braska's Final Aeon's Overcharge energy, heal him and clear him of\
        \ negative status effects. * Osmose: Drains one enemy of their magic energy,\
        \ preventing them from using spells. * Curse: Debilitates enemies with several\
        \ negative status effects, nullifying their ability to use techniques and\
        \ magic, poisoning them, blinding them with darkness and putting them to sleep.\
        \ \u25AA Ultimate Jecht Shot: The Overdrive of Braska's Final Aeon. Jecht\
