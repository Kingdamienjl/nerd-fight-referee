        Town level (Can fight and kill the Living Failures, who are capable of this,
        as well as Darkbeast Paarl and the Abhorrent Beast) | Large Island level+
        (Has access to equipment such as A Call Beyond, which is this powerful, the
        Augur of Ebrietas, which summons part of Ebrietas to wield as an attack, the
        Amygdalan Arm, which is the severed still-living arm of a lesser Amygdala,
        and the Kos Parasite, which is able to transform The Hunter into a fully fledged
        Kin. Can fight and defeat Great Ones such as Ebrietas, Rom, Amygdala, and
        the Celestial Emissary, as well as other users of A Call Beyond and Augur
        of Ebrietas such as Yurie, Imposter Iosefka, Micolash, and Forgotten Madman)
        | At least Large Island level+, likely Large Planet level (Can defeat Great
        Ones such as The Orphan of Kos, and Mergo's Wet Nurse, as well as Gehrman,
        the First Hunter and Lady Maria of the Astral Clocktower) | Large Planet level
