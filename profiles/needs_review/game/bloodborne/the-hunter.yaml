      value: Superhuman (Able to take on hordes upon hordes of enemies with little
        to no rest in-between without any signs of exhaustion. Constantly shrugs off
        being stabbed, slashed, crushed, thrown, bitten, shot, poisoned, electrocuted,
        burned, and impaled. Unfazed by injuries as severe as having their eyes gauged
        out, being impaled through the torso, having organs ripped out, and having
        their skull pierced. Can shrug off the effects of Frenzy, which causes those
        affected to have their blood violently erupt out of multiple points on their
        body in solidified spears of Frenzied Coldblood. Can outlast characters such
        as the Amygdala, who can rip its own arms off and use them as weapons and
        not even flinch, and Lady Maria, who can stab herself through the torso twice,
        letting out vast quantities of her own blood in the process, and continue
        fighting as though uninjured. The Hunter also possesses numerous items and
        runes that significantly bolster their stamina)
