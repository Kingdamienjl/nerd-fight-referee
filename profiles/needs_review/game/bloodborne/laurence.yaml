        you. *Lunging Swipe: Lunges forward and swipes a wide frontal arc with his
        left arm, leaving a trail of lingering flames. *Slam Combo: Two slow ground
        punches followed by a downward slam that generates a small explosion of flames.
        *Left Combo A: Four-hit combo with his left arm starting with a ground punch
        followed by two horizontal swipes and a frontal shove. *Left Combo B: Five-hit
        combo with his left arm starting with a ground punch followed by four horizontal
        slashes. The final three slashes are performed leaning forward and have increased
        range. *Right Combo: Opens with a right-handed horizontal slash and alternates
        between left and right for three more horizontal swings. The fourth swing
        will be either a close-range swipe or a mid-range forward dive depending on
        your distance from him. *Variable Combo: Can chain an unlimited number of
        horizontal slashes, ground punches and forward shoves in random order. *Advancing
        Lunge: Extremely quick two-hit forward lunge with almost no warning. Both
        hits generate explosions. Mainly used at short range, but has very long reach.
        *Flying Press: Jumps high into the air and performs a rapid falling body slam.
        Can change direction midair and has strong tracking. *Overhead Claw: Mid-range
        overhead slam with his left arm that creates a small explosion of flames,
        sometimes followed by an upward swing which generates a much larger explosion.
        Preceded by a scream and has a long windup. *Recovery: Surrounds himself in
        a red aura and heals injured limbs. *Lava Launcher: Long-range forward conical
        stream of lava that remains on the ground for several seconds and inflicts
        residual damage. *Rear Lava Gush: Close-range frontal AoE slam while gushing
        a large pool of lava behind him out of his severed abdomen. *Crawling Combo:
        Drags himself forward using up to seven overhead claw slams often ending with
        a left-handed horizontal slash. |} ==Gallery== center|400px ==Notable Matchups==
