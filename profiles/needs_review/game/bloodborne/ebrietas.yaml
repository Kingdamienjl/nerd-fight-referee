      value: 'Edgar is vulnerable to blunt, thrust, and fire-based damage. Notable
        Attacks/Techniques: *Rally: A core mechanic of a hunter''s fighting style,
        the ability to heal for part or all of the damage taken from a recent attack
        by retaliating with their own attacks. This allows a hunter to use an offense-centric,
        high risk/high reward style of combat, giving them the ability to sustain
        themselves by constantly attacking and counterattacking the enemy. However,
