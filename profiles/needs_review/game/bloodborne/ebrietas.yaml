        to a living being they will rapidly devolve into utter madness mentally, while
        physically their blood will begin to violently erupt out of various random
        points on their body as spears of solidified Frenzied Coldblood. *Head Smash:
        Mid-range downward hammer attack with her head. *Forward Charge: Long-range
        linear charge attack. *Tentacle Slam: Forward tentacle slam with long reach.
        *Crushing Grab: Close-range frontal grab attack. *Forward Blood Spit: Inflicts
