    - field: weaknesses
      value: 'Sometimes overconfident Notable Attacks/Techniques: *Magic Blast: Ludwig
        shoots a powerful dark blue blast of magic that homes in on his foes, and
        can be shot in groups of five at a time. When duplicated, Ludwig himself can
        shoot three while his clones can shoot two, making it a total of seven blasts.
        Ludwig can also charge it up and shoot it in the form of an enormous ball
        of energy that can potentially one hit kill his foe. *Fireball Spit: Ludwig
        shoots a fireball from his mouth, which flies at his foe. *Spin Tackle: Ludwig
        spins into his shell and flies forward, slamming into his foe. One of his
        strongest and most versatile attacks. *Zap: Ludwig points, and lightning flies
        from his fingers in the direction he points. *Battle Card: Cards Ludwig can
        summon to turn the tide of battle. Their affects can range from nullifying
        attacks via barrier creation, bypassing conventional durability via magic,
        raising his stats whilst lowering his foe''s, healing himself, etc. A card,
        however, can cost anywhere from one to nine Star Points, and Ludwig has to
        build his up from zero by landing successful attacks on his foes.'
      source_id: character-stats-profiles-ludwig-game
