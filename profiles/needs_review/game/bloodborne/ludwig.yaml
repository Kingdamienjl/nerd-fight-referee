    - field: standard_equipment
      value: '| Holy Moonlight Sword.jpg|Holy Moonlight Sword Guidance 3 - 2.png|Guidance
        *Holy Moonlight Sword: An arcane sword discovered long ago by Ludwig. When
        blue moonlight dances around the sword, and it channels the abyssal cosmos,
        its great blade will hurl a shadowy lightwave. The Holy Moonlight Sword is
        synonymous with Ludwig, the Holy Blade, but few have ever set eyes on the
        great blade, and whatever guidance it has to offer, it seems to be of a very
        private, elusive sort. *Guidance: A Caryll rune discovered by the old hunter
        Ludwig along with the Holy Moonlight Sword. Boosts amount of life recovered
        by rallying. There are three tiers of this Rune, +10%, +20%, and +30%, which
        can stack multiplicatively for a total of +60% when all three Runes are used
        at once. |}'
      source_id: vsbattles-ludwig-bloodborne
