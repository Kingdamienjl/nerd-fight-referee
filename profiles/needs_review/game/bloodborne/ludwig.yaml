    - field: attack_potency
      value: 'Country level (Far superior to that of all of Bowser''s other minions,
        even though they are still comparable to them in terms of strength, as evidenced
        in Mario & Luigi: Superstar Saga + Bowser''s Minions) | Multi-Galaxy level+
        (Weaker than Black Bowser) | Multi-Universe level in Super Mario Bros. 3 (Bowser
        threatened the existence of all Mushroom Worlds even after his entire army
        was demolished and it was just him. With that said, we have one last need:
        the size of those worlds, and whether or not they''re connected. Well, first,
        considering all the worlds and sub-worlds and mini-worlds are all called worlds
        are specifically referenced as things like "this world," we can safely reach
        a conclusion that all worlds--the meta-worlds and even the levels themselves--are
        separate. And before you say they can''t be separate cause you walk to them...
        this scan with the mini-worlds describes the hands as reaching out of nowhere
        and taking you to the mini-world. Therefore, it''s not illogical to say that
        the levels are entered through some sort of portal or rift. Finally, their
        size... first of all, we know they have a star, as World 2''s desert level
        has a Sun. But then we also have the Underworld... which has bottomless pits,
        making them infinite in size. Now, let''s address some arguments against this...
        first of all, "bottomless pits are common in Mario." Actually, no, they''re
        not. The "bottomless" pits in Mario normally are simply fan-dubbed as bottomless
        and have never been given statements justifying them as such. Second, "hyperbole."
        It doesn''t make sense for it to be one, really. Underworlds are quite often
        of actual infinite-size, so it doesn''t seem off for this one to be like that
        as well. With all said and done, all the Koopalings have complete control
        over the worlds they''re in. However, Ludwig''s a special case, as he has
        his own power combined with all the previous Koopalings'' power, making him
        the ultimate Koopaling. Adding up all their universes means he can bust 77
        universes)'
