    - field: weaknesses
      value: 'He''s quite overconfident and loves to show off. Notable Attacks/Techniques:
        *Magic Blast: Ludwig fires a dark blue chaotic blast from his wand. These
        blasts has homing capabilities and he can fire up to five blasts at once.
        Ludwig can also charge and unleash giant magic blasts in form of an enormous
        sphere towards the opponent. *Transmutation: Using magic, Ludwig can turn
        his opponent into a helpless creature. *Teleportation: Ludwig has the ability
        to teleport. *Transformation: Ludwig can use his magic to transform into other
        beings as a form of disguise. *Fire Breath: Breathes a potent fireball out
        of his mouth. He breathes fireballs furiously. *Lightning Manipulation: Ludwig
        can fire lightning from his fingers and teleport in flash of lightning. *Duplication:
        Creates clones of himself. He often uses this move to deceive his opponents
        and overwhelm them. *Battle Cards: Just like Mario, Ludwig has the ability
        to use Battle Cards to give himself an advantage in battle. These cards can
        increase the attack power and speed of him and his allies, heals them from
        the damage taken, nullify any damage taken, shrink his opponents and deal
        direct damage upon his foes. *Stop and Drop: A spell Ludwig utilize to deal
