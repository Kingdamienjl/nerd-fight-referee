    - field: weaknesses
      value: 'As a Beast, Ludwig is vulnerable to fire [This does not apply to Holy
        Blade] Notable Attacks/Techniques: |-|Accursed= *Claw Swipes: Quickstep forward
        through them or sideways in the opposite direction of each swing. *Rear Kick:
        Strikes directly behind him with a swift kick. *Headbutt: Extremely quick
        forward launcher used at close to pointblank range. *Stomp: Strikes in a 360-degree
        radius around his body at extremely close range. *Retreating Slash: Rapid
        frontal 180-degree slash while backstepping. Used if you pressure him too
        much from the front. *Leaping Slam: Rapid short-range jumping slam, usually
        used after other attacks as a follow-up. *High Jump: Slower jump attack with
        very long reach, preceded by a scream. *Bite Combo: Multiple hits with heavy
        forward momentum and minor tracking. *Charging Tackle: Used after his health
        drops below 80%. Preceded by exhaling a puff of yellow gas. *Drop Ambush:
        Used after his health drops below 80%. The blood dripping from the ceiling
        marks his location. *Forward Geyser: Used after his health drops below 80%.
        Rapid long-range blast of water in a straight line, this attack is arcane
        damage type. *Sweeping Geyser: Used after his health drops below 80%. Sweeps
        a geyser of water in a counterclockwise arc, this attack is arcane damage
        type. |-|Holy Blade= *Fast Combo: Preceded by a roar. Raises his sword to
        his left shoulder and performs two quick frontal slashes, a slower overhead
        cut and an upward swing. *Heavy Combo: Frontal arcing counterclockwise slash
        followed by either a single diagonal swing from the opposite direction or
        three overhead chops and an upward cleave. *Run-in Combo: Dashes toward you
        from long distance and performs a horizontal slash followed by either a slower
        diagonal slash or a series of vertical overhead cuts. *Forward Cross: Two
        extremely rapid diagonal slashes which strike directly ahead of him; generally
        used to punish pointblank strafing. *Uppercut Rush: Running uppercut slash
        sometimes followed up with a diagonal cut. Strikes a large forward and backward
        vertical arc on his right side and has long reach. *Moonlight Wave: Slow horizontal
        charge slash followed by a horizontal wave of moonlight. *Double Moonlight
        Wave: Two diagonal slashes in opposite directions which create two waves of
        moonlight at opposite angles. *Moonlight Stab: Performs a forward thrust covered
        in arcane energy. *Moonlight Ring: Charges for about three seconds, then stabs
        his sword into the ground. Creates a small circular burst of energy centered
        on the sword. *Moonlight Onslaught: Slowly raises his sword above his head,
        then creates a massive spherical explosion centered on the sword followed
        after about two seconds by a massive forward blast of energy which lasts another
        three seconds. ==Gallery== center|400px ==Notable Matchups== Victories: Homelander
