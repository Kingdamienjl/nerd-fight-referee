      source_id: vsbattles-messmer-elden-ring
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Is reluctant to remove his eye and turn into his Base Serpent form,
        otherwise none notable. Notable Attacks/Techniques: * Fire Serpent: Messmer
        produces a flame with a serpentine coil that homes in on a traget as a projectile.
        * Spear Throw: Messmer hurls his spear at an enemy, exploding on impact with
        any surace or victim. * Messmer''s Assault: A fierce succession of attacks
        using a flame-coated spear tip. The final move thrusts the spear into the
        ground, causing countless spears to form in the surrounding area. * Messmer''s
        Orb: Messmer creates a giant floating orb of his red and black fire that soars
        toward a foe, crashes into the earth and explodes after a brief delay. * Base
        Serpent''s Fury: Dark liquid pools around Messmer and he releases a burst
        of red energy, calling forth six serpents to strike in front of him. Two of
        them lunge forward, while a third slams downward. The last three strike consecutively
        as Messmer leaps forward and slams his spear down, causing spears to erupt
