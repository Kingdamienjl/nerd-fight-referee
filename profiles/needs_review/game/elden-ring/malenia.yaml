      value: 'Malenia set.png|Malenia armor set Hand of malenia katana weapon elden
        ring wiki guide 200px.png|Hand of Malenia Unalloyed gold needle elden ring
        wiki guide 200px.png|Gold Unalloyed Needle *Prosthetics: Made out of Unalloyed
        Gold, these prosthetics were created by Malenia after her limbs had been consumed
        by Scarlet Rot. *Hand of Malenia: Blade built into Malenia''s prosthetic arm.
        Through consecration it is resistant to rot. Malenia''s war prosthesis symbolized
        her victories. *Gold Unalloyed Needle: Designed by Miquella for Malenia. A
        ritual implement crafted to ward away the meddling of outer gods, it is thought
        capable of forestalling the incurable rotting sickness.'
      source_id: vsbattles-malenia-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Gifted (Malenia is a highly skilled swordswoman and hailed as one of
        the most skilled fighters in the Lands Between, even capable of fighting without
        her eyes and capable of fighting Radahn in combat. Also an effective commander,
        being able to lead an undefeated campaign with her Cleanrot Knights) Standard
        Tactics: Malenia will often come up to the player and use her melee attacks
        on them. | She will always start with using the Scarlet Aeonia attack on the
        player, before utilizing her other attacks.'
      source_id: vsbattles-malenia-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The scarlet rot within her is slowly decaying her body, and there''s
        only so long Malenia can resist the call of the rot without her needle. She
        is weak against hemorrhage and frostbite. Notable Attacks/Techniques: |-|Phase
        1= * Waterfowl Dance: Malenia leaps into the air, after a short pause she
        dives onto the player and slashes around her in an AoE. She then slashes two
        more times, closing the gap with a smaller dash each time. Her final slash
        is then followed with a short AoE that she doesn''t move for. This attack
        also builds up scarlet rot very quickly in phase two. This attack can be blocked.
        * Kick: Malenia will rush the player before she swipes at the player with
        her leg (unparryable), which can then be followed up by one of four attacks.
        A slightly delayed stabbing dash attack, a sword swipe followed up by an overhead
        slam on the ground, or two quick slices followed by another slice. It can
        also be followed up with a grab attack * Thrust: Malenia will slightly jump
        into the air, followed by a very quick thrusting attack, dealing a huge amount
        of pierce damage. This attack usually catches player off-guard. Can be parried
        at melee. * Rapid Prosthesis Slices: Malenia will shorten her blade (indicated
        by a ping sound) then rush the player, do three quick attacks in succession,
        followed by a final horizontal attack that can be delayed. This attack can
        end up quickly healing her along with devastating the player''s health. This
        attack can also occur on its own, in the middle of a combo, or to end a combo
        (usually indicated by her delaying the final sweep). Can be parried. * Uppercut
        + Slam OR Charge + Spin: Malenia will hold her sword back, then do one of
        the two damaging attacks depending on the player''s location: (i) If the player
        is at close range, she will do an uppercut, then leap upwards and slams down.
        (ii) If the player is at long range, she will charge towards the player at
        fast speed, then spin her sword, followed by a slam. * Lunging Grab: Malenia
        will raise her hand in preparation for a grab attack, then lunge in a straight
        line towards the player very quickly. If the grab connects she will toss the
        player into the air and impale them, dealing 2225 base thrusting damage, before
        tossing their body onto the ground. During Phase two, this attack can be immediately
        followed by a flying sweep + thrust attack. This attack cannot be blocked
        or parried. |-|Phase 2= *Scarlet Aeonia: Malenia will dive onto the player
        and summon a giant flower that explodes around her. This leaves a lingering
        mist that applies scarlet rot and a DoT effect in the area. This attack is
        always used as her first attack in phase two. *Scarlet Explosion: Malenia
        will retain its original moves from Phase one, however there is a chance that
        she will do a follow-up on most attacks, where she flies up into the air briefly,
        then slams down her sword, dealing a huge amount of damage and creating on
        the ground a small vortex of rot, which then explodes after a brief delay
        and builds up scarlet rot. The explosion can also occur from the slamming
        attacks from Phase one, which she can follow up and result in a double Scarlet
        Explosion. *Flying Sweep + Thrust: Malenia will fly up into the air, and glides
        down onto the player from the left, followed by a very quick thrust attack.
        This attack can be followed up with the Scarlet Explosion attack. *Counter
        Kick: Sometimes, when the player hit Malenia, she will follow-up by countering
        the player with a kick (different from a regular kick). Although this kick
        doesn''t do a lot of damage, it''ll usually catch the player off guard and
        stagger them greatly. *Phantom Spirits: Phase two only. Malenia will fly into
        the air, creating a pool of scarlet rot on the ground below her, and consecutively
        fire out four phantom versions of herself that will do two horizontal sweeps,
        a vertical slam, a third horizontal sweep followed by a quick thrust, one
        final thrust, before Malenia herself comes down with a high speed flying thrust
        to player, dealing high damage. The first and last phantom will stay longer
        in order to do a single thrust attack each, occurring after the fourth''s
        sweep attack. == Notable Matchups == Victories: Losses: *Ultraman (Ultra Series)
        Ultraman''s Profile (Original Series Ultraman and High 4-C Malenia was used.
        Speed was equalized, Ultraman starts off human sized, while Malenia starts
        off in Base. Battle took place inside the Roots of the Haligtree) Inconclusive:
        == References == {{Reflist}} {{Discussions|Malenia Blade of Miquella|Malenia,
        Blade of Miquella}} Category:Elden Ring Category:Female Characters Category:Martial
        Artists Category:Sword Users Category:Weapon Users Category:Demigods Category:Gods
        Category:Game Characters Category:Video Game Characters Category:Flight Users
        Category:Corruption Users Category:Biology Users Category:Madness Users Category:Acrobats
        Category:Cyborgs Category:Enhanced Senses Users Category:Supernatural Willpower
        Users Category:Durability Negation Users Cate'
      source_id: vsbattles-malenia-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
