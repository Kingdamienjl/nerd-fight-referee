    - field: weaknesses
      value: 'He is weak against Hemorrage. The damage of his Bloodboon Ritual can
        be mitigated by the Purifying Crystal Tear. Notable Attacks/Techniques: *Bloodflame
        Talons: Mohg slashes a claw mark in the air with his left hand, which then
        explodes. May also lunge forward with this attack. *Bloodboon: Mohg reaches
        into the air and tosses out a splash of bloodflame. This also sets some of
        the floor on fire and contributes to haemorrhage buildup if stood in. It can
        come in a wide arc, a narrow cone, or a shower at his area. *Spear Swings:
        Comes in horizontal spear swipes that come in a slow 2- to 3-hit combo. May
        end in an overhand slam. *Thrust: Thrusts his spear into the ground and then
        tugs it out. *Ritual Countdown: Mohg thrusts his spear into the air, generates
        a ring around the player, and then swipes his spear in front of him. He does
        this three times in combat as his HP drops (approx. 10%, 25%, 40%), counting
        down "Tres", "Duo", "Unnus". *Bloodboon Ritual: After reaching half health
        and finishing his Ritual Countdown three times, Mohg thrusts his spear into
        the air three times, chanting "Nihil!" with each thrust. The attack is unavoidable
        and triggers haemorrhage on the player while also healing him. His spear also
        gets coated in bloodflame as his second phase begins. *Airborne Assault: Mohg
        takes to the skies and throws out a splash of bloodflame, before charging
        towards his target. *Blood Tax: Mohg thrusts his spear forward, imbued with
        bloodflame, and twists it. ==Notable Matchups== Victories: Losses: Inconclusive:
