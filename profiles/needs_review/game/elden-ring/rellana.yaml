      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable. Notable Attacks/Techniques: * Glintblade Phalanx: Rellana
        uses Magic to summon glintblades. She uses two variations: With Upper Glintblade,
        she summons three glintblades atop her head, which automatically track the
        enemy after a while. She can still attack while using this skill. With Lower
        Glintblade: a direct attack, she will summon three darker glintblades in front
        of her, which will track the enemy with no delay. * Giant Carian Greatsword:
        Rellana lifts one of her swords, charging up a massive Glintsone Blade. She
        then swipes it down, and after a brief pause, performs a sweep which nearly
        covers the whole area. * Magic Arc: Rellana crouches while holding the sword
        behind her; after a second the sword will start to glow bright, and then fire
        a Magic Arc towards her foe. * Six-Sword Magic: Rellana waves her right arm
        to create 3 Magic Swords, then repeats the same move to create another set
        of Magic Swords. All swords track enemies''s movements. * Sleight of Sword
        - Flame: Using the Fire-imbued Greatsword, Rellana makes a twisting move to
        create a tornado-like flame around her, damaging multiple times to everything
        within the AoE and creates smaller rings of fire in the outer area. * Sleight
        of Sword - Magic: Using the magic-imbued Greatsword, Rellana makes a series
        of slashes in different directions. After about 4 slashes, she raises her
        sword and strikes a heavy attack, and adds an arc projectile that travels
        directly in front of her. * Moon and Fire: Rellana imbues both her swords
        with Glinstone Magic and Messmer''s Flame, respectively. She uses Sleight
        of Sword - Fire when foes are close to her, or Sleight of Sword - Magic when
        afar. * Twin Moons: Rellana''s signature move, which she only does when at
        low health. After raising into the air, she will summon two moons. She then
        smashes them to the ground, before lunging down herself. All three attacks
        create a massive shockwave which will lift enemies into the air and combo.
        == Notable Matchups == Victories: Losses: Inconclusive: {{Discussions|Rellana
        Twin Moon Knight|Rellana, Twin Moon Knight}} Category:Acrobats Category:Adults
        Category:Antagonists Category:Armor Users Category:Creation Users Category:Elden
        Ring Category:Energy Projection Users Category:Female Characters Category:Fire
        Users Category:Game Bosses Category:Game Characters Category:Homing Attack
        Users Category:Knights Category:Light Users Category:Magic Users Category:Martial
        Artists Category:Princesses Category:Royal Characters Category:Sword Users
        Category:Video Game Characters Category:Weapon Creation Users Category:Weapon
        Masters Category:Weapon Users Category:Characters'
      source_id: vsbattles-rellana-elden-ring
      provider_id: vsbattles
