    - field: intelligence
      value: 'Gifted (Thel was one of the youngest to ever achieve his status as Shipmaster,
        let alone Supreme Commander. Halo 2: Anniversary He is a tactical genius,
        with him being responsible for over one billion total casualties and the loss
        of at least seven human planets, including the Fall of Reach while he was
        Supreme Commander. The UNSC has admitted that he had repeatedly been able
        to catch UNSC forces completely by surprise and ONI and UNSC strategic AI
        reported a zero percent confidence that the Navy could stop Thel through traditional
        means. The UNSC considered him as the most dangerous Covenant military asset
        on the field, and they couldn''t predict he would do next and feared he would
        dismantle all remaining UNSC strongholds) *Combat Skill: Thel was trained
        in combat by his house since a young age, meeting all the incredibly high
        expectations of his family. Is an incredibly skilled fighter, being able to
        defeat Sangheili assassins who came to kill him with little issue and without
        injury, with him even expecting more from them. During his time as Supreme
        Commander, he would often go down on ground assaults with groups of elite
        and wipe out Battalions with ease, and is stated to have done this across
        many human systems. As The Arbiter, The Prophets put Thel on missions which
        were considered perilous and suicidal; Thel would suppress a heretic uprising
        and fight through hordes of Flood on two occasions, (and would do this several
        more times against a far more powerful Flood horde with Master Chief) both
        of which he survived and returned from, even with The Prophets'' sanctioned
        genocide against him and his race.'
      source_id: vsbattles-the-arbiter-halo
      provider_id: vsbattles
      authority: high
      confidence: 0.75
