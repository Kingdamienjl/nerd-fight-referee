    - field: powers_and_abilities
      value: "Hibiki=Superhuman Physical Characteristics, Summoning (Can summon Demons\
        \ from his Demon Summoning App), Fusionism (Can fuse several Demons to create\
        \ new and even stronger 1s), Subjective Reality (Holds the Administrative\
        \ Authority, which changes reality to match the user\u2019s wishes), Information\
        \ Analysis (The Demon Summoning App holds a scanning function, which shows\
        \ everything about the target scanned, including their powers, abilities,\
        \ moveset, resistances, immunities, weaknesses and their general info), Forcefield\
        \ Creation, Statistics Amplification, Energy Manipulation, Projection and\
        \ Nullification (Can use The Dragon Stream, which allows him to create forcefields,\
        \ modify the codes of his Demons to make them stronger, seal his opponents\
        \ in a barrier, fire off energy beams or energy projectiles and can nullify\
        \ all attacks with its defensive barriers), Power Absorption (All Demon Tamers\
        \ holds an ability called Skill Crack, which allows them to take the techniques\
        \ of their defeated foes. Later on, the Skill Crack function was modified\
        \ to be able to steal conceptual powers like Canopus' Four Prime Factors),\
        \ Damage Absorption and Power Nullification (The Soul Bind App gives Hibiki\
        \ the ability to absorb the damage that his allies sustain and direct it to\
        \ him, as well as nullify any harmful penalities his allies may sustain, like\
        \ Arcturus' Quaser, which can shift all elemental-baed resistances and neutralities\
        \ to weaknesses), Nonexistence Erasure (Characters far weaker than Hibiki\
        \ can destroy nothingness and nonexistent beings with nothing but normal attacks),\
        \ Magic (The Demon Summoning App gives its user the ability to use Demon Magic),\
        \ Elemental Manipulation (Fire, Ice, Lightning and Force), Curse and Death\
        \ Manipulation (With Curse based spells which can induce instant death), Aliment\
        \ Inducement (Poison, Paralysis, Petrification, Charming/Seduction and Memory\
        \ Erasure), Statistics Reduction (Via Debilitate, which can lower the foes'\
        \ strength, defense and speed), Resistance Negation (Via Pierce, which pierces\
        \ through all resistances and immunities as long as it cannot be reflected),\
        \ Durability Negation (Via Megidolaon, a massive explosive orb of Almighty\
        \ Magic which can bypass all resistances, immunities and shields), Resistance\
        \ to Mind Manipulation, Resistance Negation, Power Nullification, Petrification,\
        \ Durability Negation, Status Effect Inducement, Curse Manipulation, Electricity\
        \ Manipulation, Light Manipulation, Soul Manipulation, Reality Warping, Spatial\
        \ Manipulation, Time Manipulation, Life Manipulation, Death Manipulation,\
        \ Darkness Manipulation, Disease Manipulation, Causality Manipulation, Fate\
        \ Manipulation, Information Manipulation, Probability Manipulation, Law Manipulation,\
