    - field: weaknesses
      value: 'Depends on the chosen allegiance. Warriors of Poseidon are very resistant
        to physical blows but do not like using their physical strength to wrestle
        others and prefer their healing and ice-based abilities, while the Warriors
        of Ares like to wrestle and burn with their fire abilities and do not care
        about the physical damage they receive while doing so. Warriors of Zeus are
        extremely focused on magic attacks and elemental waves and are very likely
        to use these abilities, while still having an average amount of raw strength
        and endurance. The Warriors of Hades''s greatest weakness is their lack of
        usage of defense powers, due to being heavily focused on using their magic
        powers and their raw strength. Notable Attacks/Techniques: * Zeus Magic: Only
        available to those allied with Zeus, it involves the usage of lightning, either
        channeled through one of the many weapons of Zeus available to his warriors
        or done without a weapon, to attack the enemies. This magic can create bubble
        fields that draw enemies in, strike them with real bolts of lightning from
        the skies that paralyze them and nullify their magic abilities, and more,
        such as the creation of shockwaves, etc. * Hades Magic: Only available to
        those allied with Hades. It involves the summoning of souls of the damned
        to attack the enemy or using Hades''s abilities to steal the life and the
        soul out of anyone. Those strong enough can summon vortexes of dark energy
        that curse those in its range or summon Arms of Hades out of Tartarus to grab
        the enemies and turn them into harmless soldiers of the Underworld Army or
        fragilized souls of the damned. * Poseidon Magic: Only available to those
        allied with Poseidon. It involves the usage of energy to create tornados of
        gelid energy that greatly slow down the opponent, or use the same concentrated
        energy to freeze enemies solid and destroying them. This same magic can also
        be used to regenerate wounds. * Ares Magic: Ony available to those allied
        with Ares. It involves the creation of explosions, fire waves that incinerate
        all in the range, jumping high into the sky and landing hard enough to stun
        the opponent, or, the angrier one is, exploding them with your every blow.
        Note: This character is from the Multiplayer Mode of God of War: Ascension,
        which is stated by the developers to be a part of the series''s lore,The Art
        of God of War: Ascension and should thus be considered canon to the main campaign
        of the game and the game''s story, which means it scales from some of the
        game''s storyline feats. ==Notable Matchups== Victories: Losses: Inconclusive:
