    - field: weaknesses
      value: "The Dragon Stream's usage can be extremely exhausting on a human's body,\
        \ and requires preparation and rituals to use it at full capacity. The Skill\
        \ Crack function can copy all but Abstract Existence (But it can steal it\
        \ nevertheless). The Soul Bind app protects Hibiki's allies or those that\
        \ he use said app on at the cost of having all the damage that they receive\
        \ accumulated directly to him. ===Notable Attacks/Techniques=== Dragon Stream:\
        \ A powerful form of energy wielded by the Hotsuin clan. Passed down by blood,\
        \ it is a form of energy used for various purposes in order to protect Japan.\
        \ It is first used to protect humanity from Polaris\u2019 void with a field\
        \ of energy, but can also be used as an offensive countermeasure by boosting\
        \ power, creating powerful energy attacks or even forming a massive dragon\
        \ to destroy foes. However, some of its power is tied to important pieces\
        \ of architecture in Japan and can be weakened or destroyed if they are. Additionally,\
        \ the energy supply for it is limited and can be exhausted. Hibiki later gained\
        \ access to the Dragon Stream after gaining the approval of Shakko. Demon\
        \ Summoning App: Also known as Nicaea, which is downloaded on his phone. While\
        \ it's primary purpose is for summoning demons, it has many other functions,\
        \ such as Demon Fusion and ability analysis. A major ability of it is the\
        \ production of death videos, which show a video of a friend's death before\
        \ it occurs, allowing one to save them. * Skill Crack: An ability of the Demon\
        \ Summoning App. It allows the user to select an ability to copy from a foe\
        \ once they are defeated. Additionally, an upgraded version also exists which\
        \ allows one to steal abilities like those of Canopus' Four Prime Factors\
        \ * Soul Bind: An ability exclusive to Hibiki, which he gained after turning\
        \ Shiki-Ouji into an app on his phone. This app can give Hibiki the ability\
        \ to direct all the damage that is given to all those that he use the app\
        \ on towards himself, as well as nullifying any negative aliments or weaknesses\
        \ induced by an enemy on those whose the app is being used on. The downside\
        \ of it, however, is that Hibiki takes the accumulative damage of all of those\
        \ who are directly having this app being used on. Adminstrator's"
