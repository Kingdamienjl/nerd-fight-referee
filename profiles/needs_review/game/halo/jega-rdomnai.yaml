    - field: standard_equipment
      value: '* MJOLNIR MK VII: Armor Spartans wear in the new Halo trilogy. Titanium
        plating offers great protection against gunfire. It also multiplies his strength,
        speed, and stamina a few times over. Furthermore, it is lighter and further
        enhances physical skills than the GEN 1 MJOLNIR armors that came before this
        one. * M6 Magnum: The UNSC''s trademark pistol. Fires a 12.7x40mm M225 Semi-Armor-Piercing
        High-Explosive bullet at a muzzle velocity of 427 m/s. The kinetic energy
        of the 32-gram bullet would be 2917.3 joules. Street level Attack Potency
        and Supersonic Attack speed. * MA5 Assault Rifle: Rapid fires M118 7.62x51mm
        Full Metal Jacket Armor Piercing bullets at a muzzle velocity of 792 m/s.
        The kinetic energy of the 11-gram bullets would be 3450 joules. Street level
        AP and Supersonic AS. * M90 Shotgun: The UNSC''s trademark Shotgun of the
        UNSC and the most recognized close up weapons used by humans. Fires a 3.5"
        soellkraft 8 Gauge Shell containing 15 9.5 mm diameter lead pellets at a muzzle
        velocity ranging from 300 to 400 m/s. Each of the pellets is 5.103 grams.
        Street level to Wall level AP and Subsonic+ to Supersonic AS. * SRS 99 Anti-Material:
        Sniper Rifle fires 14.5x114 mm Armor Piercing Fin Stabilized Discarding Sabot
        bullet at 1530 m/s. The kinetic energy of the 66.5-gram bullet would be 77834.925
        joules. Wall level AP and Supersonic+ AS. * M41 SPNKr Rocket Launcher: The
        standard rocket launcher of the UNSC. It is designed to destroy Scorpion tanks,
        and KO multiple Spartans, and is the second strongest infantry weapon of the
        UNSC. Building level AP and Subsonic+ AS. * M6 Spartan Laser: Most powerful
        infantry weapons used by the UNSC and the strongest firearm Locke can carry;
        excluding Incineration Cannon. Can one shot KO multiple Spartans in a 2 meter
        blast radius. Building level+ AP and Speed of Light AS. * Drop Shield: Weaker
        version of the Bubble Shield; it has triple protection against projectiles
        as MJOLNIR energy shields do, but no protection against melee attacks. * Deployable
        Cover: Protects from all solid projectiles up to Building level, but no protection
        against plasma and suffers from openings; allowing well placed small projectiles
        to go through. * Invincibility: Grants near invulnerability to various heavy
        weapons including Spartan lasers and Wraith Mortars. It also grants zero additional
        resistance against melee attacks or blunt force trauma. * Bubble Shield: Omni-directional
        field that shields off all projectiles and explosions, including multi-megaton
        bombs. Is passable by all infantry troops and vehicles and grants no protection
        against melee or vehicle impacts. * Hardlight Shield: A monodirectional shield
        that repels all infantry weapons, including the strongest Promethean weapons.
        Does not cover the back side or far well against melee attacks. Additional'
