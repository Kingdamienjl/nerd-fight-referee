    - field: intelligence
      value: Extraordinary Genius He commanded the entire Forerunner military for
        several eons and controlled the Promethean Knights for the duration of his
        return in Halo 4. Each Promethean is also able to control million strong phalanxes
        of fighters such as Phaetons. Was still able to function even after been driven
        insane by The Gravemind, and locked inside a Cryptum for a hundred thousand
        years to dwell in his own madness. Finds human developed AI in the 25th century
        amusingly simple. Has constructed and worked with numerous Forerunner AI's
        that were said to be significantly more advanced than most human developed
        AI. Has demonstrated being a challenge for the likes of Cortana to outperform
        in hacking abilities.
      source_id: vsbattles-didact-halo
      provider_id: vsbattles
      authority: high
      confidence: 0.75
