- id: claim-powers-and-abilities-d83deedb
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Superhuman Physical Characteristics
    **Weapon Mastery (The Lamb uses a bow and is an excellent markswoman). ** Natural
    Weaponry (The Wolf has claws and fangs capable of easily tearing through a human).
    **Enhanced Senses and Extrasensory Perception (The Wolf claimed that he is able
    to smell the "scent of life itself" and other scents that are normally impossible.
    They can also see spirits). **Shapeshifting (The Wolf can modify his body at will,
    creating limbs or transforming into a kind of untouchable mist). ***Darkness Manipulation
    (He can become, create, and expand darkness). **Spirit God Physiology: ***Abstract
    Existence (Type 1) and Conceptual Manipulation (Type 2; The Kindred are Spirit
    Gods and the conceptual embodiment of Death through Runeterra). ****Immortality
    (Types 1, 3, 4, 5, 8 and 9; Being Spirit Gods, the Kindred must possess the same
    kind of immortality as others like them, such as Volibear, Ornn, and Anivia. As
    they are Death itself, the Kindred have never been alive). *****Regeneration (Mid-Godly;
    The Spirit Gods can return to life even after being hurt and seemingly killed
    on a spiritual level, as was the case with Ornn). ****Empowerment and Reactive
    Power level (Passive; Physical Statistics, Abilities; Being a Spirit God, the
    Kindred must gain more power through the collective belief of the inhabitants
    of Runeterra). ****Avatar Creation (The Kindred employ the use of avatars that
    manifest throughout all regions of Runeterra). *****Duplication (Their physical
    avatars can appear numerous enough to fill a concert hall) ****Intangibility and
    Incorporeality (Even their physical forms are capable of passing through all they
    do not wish to interact with). ****Perception Manipulation (The Kindred can modify
    their appearance to resemble whatever the observer interprets as the personification
    of death, and each region of Runeterra views them differently, with the Spirit
    Blossom Kindred skin representing how the inhabitants of Ionia see the Spirit
    of Death. The default in-game skin of the Kindred is the Freljord version). *****
    Invisibility (Their physical forms can be hidden from the sight of those they
    do not wish to see them). ****Omnipresence (The Kindred are everywhere and in
    every era, existing even in the nearly countless timelines that Ekko has traveled,
    altered, or destroyed). ****Likely Nigh-Omniscience (Despite the Wolf seeming
    like an ignorant and primitive being, the Kindred appear to know and see all things
    in their in-game dialogues). ****Dimensional Travel (Can travel between the physical
    and spiritual realms). *Death Manipulation (Because they embody Death, the Kindred
    naturally control this aspect they personify, and their abilities in the game
    reflect this. The Kindred are the reason death, natural or not, happens in the
    first place). **Non-Physical Interaction (Can kill intangible and incorporeal
    beings, as well as nonexistent beings). ***Existence Erasure (The Kindred can
    bring the final death, erasing the target on a spiritual level). *** Durability
    Negation (The Lamb''s arrows seem to bypass armor and shields, piercing through
    them and hitting the target accurately and inevitably). ** Immortality Bestowal
    (Types 2 and 5) and Healing (Through their Ultimate, the Kindred can make other
    characters within a certain area impossible to kill for a period of time, and
    those characters will have a portion of their health restored at the end of the
    skill). **Curse Manipulation (They can mark a target for a future death). * Status
    Effect Inducement (Can cripple and slow a target). Resistance to: * Mind Manipulation,
    Memory Manipulation, Madness Manipulation, Perception Manipulation, Reality Warping,
    Spatial Manipulation, Time Manipulation, Gravity Manipulation, Existence Erasure,
    Biological Manipulation, Corruption (Type 2), Absorption (Life force, matter,
    magic, and information), and Soul Manipulation (Able to resist the full effects
    of The Void)}}'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
