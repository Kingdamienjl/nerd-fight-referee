  text: 'None notable {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- | *Mark of the Kindred: Both Lamb and
    Wolf can mark a target to hunt. While normally Kindred follows the natural/outside
    causes of death, a marked target can be killed without the need of such causes.
    **Lamb: To those who embrace death under their mark, Lamb will deliver a quick
    end to. She will complete the mark with a single, shimmering, ethereal arrow and
    bring the marked target''s life to a swift close. ** Wolf: To those who deny or
    run from them under their mark, Wolf will chase. After the chase, Wolf will appear
    as all things around the target, preventing any hope of escape. Brutally and without
    remorse, he will complete the mark with savage cruelty. *Dance of Arrows: Lamb
    gracefully leaps forward, unleashing a volley of deathly arrows while in the air.
    * Wolf''s Frenzy: Lamb sets Wolf to an area, which he claims as his territory.
    Wolf will end any and all who step into this area. * Mounting Dread: Lamb cripples
    the target, slowing it and preventing escape. She can then direct Wolf to pounce
    on the target. *Lamb''s Respite: Lamb grants all living things inside a selected
    zone a respite from death. For the duration of the respite, death becomes impossible
    for all within the area, even from outside causes. Despite the prevention of death,
    damage can still be done. At the end of the duration, everyone inside the area
    is healed. |} ===Respect Threads=== *The Nature of Kindred ==Notable Matchups==
    Victories: Losses: Inconclusive: {{Discussions}} Category:Characters Category:Game
    Characters Category:Male Characters Category:Female Characters Category:League
    of Legends Category:Neutral Characters Category:Animals Category:Immortals Category:Healers
    Category:Wolves Category:Spirits Category:Bow Users Category:Soul Users Category:Darkness
    Users Category:Intangibility Users Category:Death Users Category:Playable Characters
    Category:Concept Users Category:Abstract Entities Category:Incorporeal Characters
    Category:Non-Physical Interaction Users Category:Status Effect Users Category:Duplication
    Users'
  source_ids: *id003
  decisive: false
  status: unverified
