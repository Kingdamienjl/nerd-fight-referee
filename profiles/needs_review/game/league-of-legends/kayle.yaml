- id: claim-weaknesses-d93c3dd2
  section: weaknesses
  axis: weakness
  text: 'None Notable Notable Attacks/Techniques: *Divine Ascent: **Zealous: Kayle''s
    basic attacks against non-structures grant bonus attack speed, stacking up to
    5 times. At maximum stacks, Kayle becomes Exalted, gaining bonus movement speed
    when moving toward enemies. **Aflame: While Exalted, Kayle''s basic attacks against
    non-structures additionally launch a wave of fire in the target''s direction,
    dealing magic damage to enemies hit. The waves can critically strike for bonus
    magic damage. **Arisen: Kayle becomes a ranged champion. Additionally, Zealous''s
    bonus attack speed is increased per stack. **Transcendent: Zealous is permanently
    set to maximum stacks. Additionally, Aflame''s fiery waves now deal true damage.
    *Radiant Blast: Kayle plants a portal at her initial location that faces the target
    direction, launching a celestial sword. The sword explodes into a cross upon collision
    with an enemy, dealing magic damage and slowing targets struck, while reducing
    their armor and magic resistance. *Celestial Blessing: Kayle and target allied
    champion are healed and gain bonus movement speed. If cast without a valid target,
    or self-cast, Celestial Blessing will automatically target the most wounded ally
    in range. *Starfire Spellblade: Kayle''s next basic attack fires a projectile
    after that deals bonus magic damage but cannot critically strike. After unlocking
    Aflame, the attack explodes, damaging and applying on-hit effects to all enemies
    around the target. Prior to becoming Arisen, Starfire Spellblade also causes Kayle
    to become a Ranged role ranged champion. Kayle''s basic attacks also passively
    deal bonus magic damage. *Divine Judgement: Kayle refreshes Zealous and grants
    the target allied champion or herself invulnerability for a few seconds. Kayle
    also begins Channeling swords around herself and highlights an area around her
    target. At the end of the channel, the swords rain down and deal magic damage
    to all enemies within the area around her target. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Discussions}} Category:Characters Category:Female
    Characters Category:Game Characters Category:League of Legends Category:Immortals
    Category:Sword Users Category:Healers Category:Flight Users Category:Fire Users
    Category:Light Users Category:Heroes Category:Armor Users Category:Magic Users
    Category:Technology Users Category:Science Fantasy Characters Category:Statistics
    Amplification Users Category:Musicians Category:Playable Characters Category:Broadway
    Force Users Category:Statistics Reduction Users Category:Dimensional Travel Users
    Category:Non-Physical Interaction Users Category:Enhanced Senses Users Category:Holy
    Users Category:Portal Users Category:Weapon Creation Users Category:Explosion
    Users Category:Resistance Negation Users Category:Damage Boost Users Category:Invulnerability
    Users Category:Death Users Category:Energy Users Category:Military Characters'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
