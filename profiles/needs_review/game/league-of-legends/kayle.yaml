        up to 5 times. At maximum stacks, Kayle becomes Exalted, gaining bonus movement
        speed when moving toward enemies. **Aflame: While Exalted, Kayle''s basic
        attacks against non-structures additionally launch a wave of fire in the target''s
        direction, dealing magic damage to enemies hit. The waves can critically strike
        for bonus magic damage. **Arisen: Kayle becomes a ranged champion. Additionally,
        Zealous''s bonus attack speed is increased per stack. **Transcendent: Zealous
        is permanently set to maximum stacks. Additionally, Aflame''s fiery waves
        now deal true damage. *Radiant Blast: Kayle plants a portal at her initial
        location that faces the target direction, launching a celestial sword. The
        sword explodes into a cross upon collision with an enemy, dealing magic damage
        and slowing targets struck, while reducing their armor and magic resistance.
        *Celestial Blessing: Kayle and target allied champion are healed and gain
        bonus movement speed. If cast without a valid target, or self-cast, Celestial
        Blessing will automatically target the most wounded ally in range. *Starfire
        Spellblade: Kayle''s next basic attack fires a projectile after that deals
        bonus magic damage but cannot critically strike. After unlocking Aflame, the
        attack explodes, damaging and applying on-hit effects to all enemies around
