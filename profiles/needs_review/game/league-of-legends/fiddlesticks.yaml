- id: claim-weaknesses-f6ac49b3
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *A Harmless Scarecrow: Fiddlesticks
    is able to summon illusory scarecrow effigies that act as wards, granting vision
    of an area as well as revealing and disabling enemy wards near it. *Terrify: Fiddlesticks
    shrieks at the target enemy, dealing magic damage and fearing them. After a few
    seconds out of combat, Fiddlesticks creates an aura of Dread that affects all
    enemy units that do not have vision of it. Fiddlestick''s next damaging ability
    against an enemy affected by Dread will fear them. This effect can trigger against
    multiple enemies for area of effect abilities. *Bountiful Harvest: Fiddlesticks
    tethers itself to all nearby enemies and channels. While channeling, tethered
    enemies are revealed as it siphons their souls, dealing magic damage to them as
    long as the tether persists. Fiddlesticks heals itself for a percentage of the
    damage dealt. If all targets break their tethers by moving out of range, the ability
    ends immediately. *Reap: Fiddlesticks swings with its scythe in a crescent-shaped
    area on the target location, dealing magic damage and slowing enemies hit. Enemies
    hit in the center of the area are silenced. *Crowstorm: After a short channel,
    Fiddlesticks teleports to a target location with a murder of crows flying wildly
    around it, dealing magic damage to nearby enemies. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Discussions}} Category:Characters Category:League
    of Legends Category:Absorption Users Category:Aura Users Category:Demons Category:Evil
    Characters Category:Extrasensory Perception Users Category:Fear Users Category:Game
    Characters Category:Genderless Characters Category:Healers Category:Illusionists
    Category:Madness Users Category:Magic Users Category:Monsters Category:Playable
    Characters Category:Power Nullification Users Category:Science Fantasy Characters
    Category:Scythe Users Category:Soul Users Category:Sound Users Category:Statistics
    Reduction Users Category:Summoners Category:Teleportation Users Category:Doll
    Users Category:Male Characters Category:Scarecrows'
  source_ids: *id005
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
