        \ 1; Lived many centuries without aging.), Soul Manipulation, Curse Manipulation,\
        \ Resurrection (Trapped Angor Rot's soul into the Inferna Copula and cursed\
        \ him. Was able to resurrect Angor Rot while giving him his soul back with\
        \ some part of herself.), Shadow Manipulation, Duplication (Can manipulate\
        \ the shadows around her and made clones of herself), Plant Manipulation (Showed\
        \ some control over plants when she confronts Merlin, Douxie, and Archie in\
        \ the Wild Wood, even stabbing Merlin with a thorn enough to severely injure\
        \ him.), Telekinesis (As show here.), Power Bestowal (Gave Angor Rot powers.\
        \ Accidently shared some of her abilities to Claire.), Magic Absorption, Statistics\
        \ Amplification (Absorbed most of Merlin's magic in the process of her imprisonment\
        \ and later siphoned the power of the Staff of Avalon before he could use\
        \ it against her. Even when Merlin briefly absorbed a little of his magic\
        \ and blast it back at her, she merely reabsorbed it while being thrown back\
        \ just a few feet.), Enhanced Senses, Extrasensory Perception (Sensed Claire's\
        \ presence in the Shadow Realm.), Magic constructs, Summoning, Weapons Creation\
        \ (Create yellow whips out of nothing and conjure knives), Magical Shields\
        \ (Shielded herself from Arthur's Onyx Shards, albeit briefly.), Genius Intelligence,\
        \ Magical blasts projection (Can send bursts, ways or blasts of magical energy.),\
        \ Portal Creation, Dimensional Travel, BFR via Shadow staff (With the Skathe-Hr\xFC\
        n, she can create a portal to the shadow realm and send anyone there.), Corruption,\
        \ Mind Manipulation, Possession (Corrupted and possessed Claire for a brief\
        \ time.), Telepathy (Could send her thoughts to others.), Fire Manipulation\
        \ (Used a fiery twister to create the Eternal Night, and even appearing as\
        \ a fiery humanoid in her spirit form. Did this. She used this to create a\
        \ fake dragon fire breath to fool Galahad and allow Claire to help an injured\
        \ Jim escape Camelot with the rest of the trolls.), Camouflage, Illusion (Took\
        \ on the appearance and voice of Barbara Lake in order to sway Strickler easier.),\
        \ Flight, Astral Projection (Morgana's spirit can appear in many locations\
        \ dedicated to herself and even appeared before Claire while she took control\
        \ of her body.), Weapon Mastery (Wielded the Shadow Staff and the Staff of\
        \ Avalon, rivaling both Arthur and Merlin's swordsmanships. Fought Angor Rot\
        \ with her knives) Resistance to Immense Pain (Did not feel any pain after\
        \ being stabbed through the chest by Jim), Fire Manipulation (Was not affected\
