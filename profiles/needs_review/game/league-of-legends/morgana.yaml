    - field: weaknesses
      value: 'Morgana''s Persona is weak to electrical attacks. He also tends to become
        cocky when a battle is in his favor. Notable Attacks/Techniques: Persona Summoning:
        The ability to utilize Personas, powerful manifestations of the mind and soul.
        Personas can move and attack independently of their users, allowing for double-teaming
        between their user and the equipped Persona. Each Persona has a set of elemental
        affinities, which also apply to their user while the Persona is equipped.
        Zorro: Morgana''s initial Persona. Zorro was a masked swordsman who fought
        against corrupt officials in California during Spanish rule. While equipped,
        Morgana is weak to Electricity and resists Wind. Mercurius: Morgana''s evolved
        Persona, awakened upon forming a blood vow with Ren Amamiya. Mercurius is
        the Roman god of travelers and thieves. While equipped, Morgana is weak to
        Electricity, resists Bless/Light and nullifies Wind. Diego: Morgana''s ultimate
        Persona, based off of Don Diego de la Vega, a fictional Californio nobleman
        of Spanish and Native Californian descent, who lived in Los Angeles during
        the era of Mexican rule. He has an alternate identity known as "Zorro," a
        masked outlaw who defends commoners and the indigenous people of the land
        against tyrannical officials and other villains. *Garu: Light Wind damage
        to 1 foe. *Dia: Slightly restore HP of 1 ally. *Patra: Cure Dizzy/Forget/Sleep/Hunger
        of 1 ally. *Media: Slightly restore HP of party. *Lucky Punch: Minuscule Physical
        damage to 1 foe, high critical rate. *Magaru: Light Wind damage to all foes.
        *Pulinpa: Inflict Confusion 1 foe. *Me Patra: Cure Dizzy/Forget/Sleep/Hunger
        of party. *Diarama: Moderately restore HP of 1 ally. *Garula: Medium Wind
        damage to 1 foe. *Recarm: Revive 1 ally with 50% HP recovered. *Wind Break:
        Suppress innate Wind resistances of all foes. *Mediarama: Moderately restore
        HP of party. *Magarula: Medium Wind damage to all foes. *Miracle Punch: Medium
        Physical damage to 1 foe, high critical rate. *Wind Boost: Strengthen Wind
        attacks by 25%. *Samarecarm: Revive 1 ally with all HP recovered. *Diarahan:
        Fully restore HP of 1 ally. *Garudyne: Heavy Wind damage to 1 foe. *Masukunda:
        Decrease Agility of all foes. *Mediarahan: Fully restore HP of party. *Magarudyne:
        Heavy Wind damage to all foes. *Wind Amp: Strengthen Wind attacks by 50%.
        *Salvation: Fully restore HP of party and cure all non-special ailments. *Evade
        Elec: Triple evasion rate against Electric attacks. *Miracle Rush: Medium
