    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Soul Siphon: Morgana restores
        health equal to a portion of all damage she deals to enemies with her magic.
        *Dark Binding: Morgana releases a sphere of dark magic that travels in a line,
        dealing magic damage to the first enemy hit and rooting them. *Tormented Shadow:
        Morgana infects the target area, causing enemies who stand on the location
        to take magic damage every half second, increased based on target''s missing
        health. *Black Shield: Morgana shields herself or an ally, absorbing magic
        damage and rendering her target immune to all crowd control while the shield
        holds. *Soul Shackles: Morgana latches chains of energy onto nearby enemy
        champions, dealing magic damage. The tethers last 3 seconds, granting true
        sight of affected enemies and slowing them. Additionally, Morgana gains bonus
        movement speed towards tethered enemies. When the tethers end, targets who
        did not leave the tether range are stunned and dealt the same magic damage
