- id: claim-weaknesses-85e2b648
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: *Mortal Will: Pantheon gains a
    stack of Mortal Will when he lands a basic attack on-hit or casts an ability,
    up to a maximum of 5. At 5 stacks, Pantheon''s next basic ability consumes the
    stacks to grant bonus effects. *Comet Spear: Pantheon hurls his spear, dealing
    increased damage against weakened enemies and traveling through all enemies in
    its path. Alternatively, Pantheon can instead thrust his spear, dealing the same
    physical damage to all enemies hit. **Mortal Will: Deals an additional physical
    damage to all enemies hit and slows them. *Shield Vault: Pantheon dashes to the
    target enemy, dealing them physical damage and stunning them. **Mortal Will: Pantheon''s
    next attack strikes his target 3 times. *Aegis Assault: Pantheon braces his shield
    while striking in a cone. For the duration, Pantheon is invulnerable against damage
    dealt by enemies from the direction of his shield, and deals physical damage over
    the duration to all enemies struck. Pantheon then slams with his shield dealing
    physical damage. **Mortal Will: Aegis Assault''s duration is increased and Pantheon
    gains bonus movement speed after slamming his shield. *Grand Starfall: Pantheon
    leaps high into the air, preparing for landing by marking his destination by throwing
    his spear, then crashes down and creates a shockwave alongside him that travels
    toward the target location dealing magic damage. In addition, Pantheon gains passive
    armor penetration. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{discussions|Pantheon}} Category:Characters Category:Male Characters Category:Game
    Characters Category:League of Legends Category:Good Characters Category:Science
    Fantasy Characters Category:Playable Characters Category:Warriors Category:Guardians
    Category:Humans Category:Adults Category:Spear Users Category:Shield Users Category:Weapon
    Masters Category:Thrown Weapon Users Category:Fire Users Category:Magic Users
    Category:Empowerment Users Category:Creation Users Category:Reality Warpers Category:Concept
    Users Category:Supernatural Willpower Users Category:Statistics Reduction Users
    Category:Paralysis Users Category:Invulnerability Users Category:Statistics Amplification
    Users Category:Portal Users Category:Dimensional Travel Users Category:Time Travelers
    Category:Causality Users Category:Extrasensory Perception Users Category:Cosmic
    Awareness Users Category:Precognition Users Category:Existence Erasure Users Category:Energy
    Projection Users Category:Energy Users Category:Space Users Category:Immortals
    Category:Summoners'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
