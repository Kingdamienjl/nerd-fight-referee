    Via Aegis Assault), Statistics Reduction (Speed Reduction Via Comet Spear), Paralysis
    Inducement (Via Shield Vault), Invulnerability (Via Aegis Assault), Resistance
    to Biological Manipulation (Fought Voidborn multiple times and should have a resistance
    comparable to Diana, who resisted being impaled by a Voidborn, which causes physically
    corruption in things they damage), Mind Manipulation, Memory Manipulation, Madness
