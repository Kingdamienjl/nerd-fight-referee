    as base except Supernatural Willpower, plus Immortality (Types 1, 7, and 8 [So
    long as the Black Mist exists, he will be reborn indefinitely]), Summoning (Wraiths)
    |-|Dragonslayer=All abilities as base plus Resistance to Heat Manipulation and
    Fire Manipulation (All Dragonslayers wear armor made from dragon scales, which
    are immune to heat and flame that can turn stone to liquid instantly) |-|Pulsefire=All
