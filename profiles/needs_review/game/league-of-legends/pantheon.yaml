    - field: weaknesses
      value: 'None notable. Notable Attacks/Techniques: *Mortal Will: Pantheon gains
        a stack of Mortal Will when he lands a basic attack on-hit or casts an ability,
        up to a maximum of 5. At 5 stacks, Pantheon''s next basic ability consumes
        the stacks to grant bonus effects. *Comet Spear: Pantheon hurls his spear,
        dealing increased damage against weakened enemies and traveling through all
        enemies in its path. Alternatively, Pantheon can instead thrust his spear,
        dealing the same physical damage to all enemies hit. **Mortal Will: Deals
        an additional physical damage to all enemies hit and slows them. *Shield Vault:
        Pantheon dashes to the target enemy, dealing them physical damage and stunning
        them. **Mortal Will: Pantheon''s next attack strikes his target 3 times. *Aegis
        Assault: Pantheon braces his shield while striking in a cone. For the duration,
        Pantheon is invulnerable against damage dealt by enemies from the direction
        of his shield, and deals physical damage over the duration to all enemies
        struck. Pantheon then slams with his shield dealing physical damage. **Mortal
        Will: Aegis Assault''s duration is increased and Pantheon gains bonus movement
        speed after slamming his shield. *Grand Starfall: Pantheon leaps high into
        the air, preparing for landing by marking his destination by throwing his
        spear, then crashes down and creates a shockwave alongside him that travels
        toward the target location dealing magic damage. In addition, Pantheon gains
