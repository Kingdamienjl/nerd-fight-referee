  text: Base=Superhuman Physical Characteristics, Martial Arts (Master in hand to
    hand combat), Weapon Mastery (Master spear and shield wielder), Magic, Fire Manipulation
    (Able to create Celestial fire), Empowerment, Creation, Reality Warping, Conceptual
    Manipulation ( 5-D Type 1), Supernatural Willpower (Able to empower himself through
    sheer will, as well as will his body to not die to otherwise fatal injuries, will
    his spear and shield to return to him if he is disarmed, create constellations,
    will entire concepts back into existence, and will himself to regain the powers
    of the Celestial of War after Aatrox removed his powers), Non-Physical Interaction
