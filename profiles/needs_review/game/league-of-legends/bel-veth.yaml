    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Abstract Existence (Type 1), Immortality
        (Type 1, 5, 8, and 9: They exist as a true embodiment of death, and thus can
        not be harmed conventionally, and are reliant on Death itself to continue,
        as when Death itself dies, Kindred Dies), Cosmic Awareness, Curse Manipulation
        (Kindred can Mark their targets as a curse for an early death if they choose),
        Darkness Manipulation (Wolf can create, become and manipulate darkness), Death
        Manipulation (Kindred itself is the reason death occurs, if Kindred chooses
        otherwise, then that person can not die by conventional means, even when attacks
        are normally lethal enough to kill it), Duplication (Kindred has several clones
        throughout runeterra, each one being based on the region they''re in, a Spirit
        in Ionia, a Divine Spirit in Demacia, etc etc.), Healing, Intangibility (Kindred''s
        forms are non-corporeal, and thus can go through solid walls alongside anything
        else), Invisibility (Kindred can make themselves invisible for people who
        do not want them noticing), Non-Corporeal (exist as essentially a Spirit throughout
        runeterra). Non-Physical Interaction (Kindred kills beings who are Incorporeal,
        have forms separate from themselves, etc. this goes for demons and Celestials
        as well and non-existent beings), Perception Manipulation (It can disguise
        itself as whatever it needs to when it shows itself to someone), Soul Manipulation,
        Power Nullification, possible Absorption (Kindred''s death is a final one,
        and removes the targets soul completely, and prevents further incarnations
        from beings who can re-incarnate from something else, Leblanc for example),
        Weapon Mastery (Lamb is a master of her bow, up-scaling everyone else who
        uses a bow). | Resistance to Mind Manipulation, Memory Manipulation, Madness
