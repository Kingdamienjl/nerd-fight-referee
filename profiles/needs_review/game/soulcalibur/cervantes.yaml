- id: claim-weaknesses-2148e20b
  section: weaknesses
  axis: weakness
  text: 'Nothing notable Notable Attacks and Techniques: *Tartarus Griet: Cervantes
    slams the opponent to the ground, throws them into the air with his swords, and
    then teleports above them to fire a soul-charged bullet, which sends them hurtling
    down to earth. *Cursed Roman Fire: Cervantes brandishes his pistol sword and shouts
    "Get ready! Now die!" and fires off a powerful blast. Note: Many of Cervantes''
    abilities come from the various weapons he can equip (Minus abilities that are
    Inferno related). As such, in battle the creator should specify what weapon(s)
    he is allowed to have. Note 2: It should be noted that in battle, if the creator
    uses Cervantes wielding Soul Edge, then if defeated Inferno will appear to fight
    the opponent. So the creator should be wary of this when making Cervantes matches
