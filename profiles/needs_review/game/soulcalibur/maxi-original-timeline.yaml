        then leaps in the air and cries out "Rising Dragon of the Zodiac!" and delivers
        a kick to the opponent''s neck or ribs. *Rampaging Dragon: Maxi punches his
        opponent twice, and finishes them with an elbow strike. Note: Many of Maxi''s
