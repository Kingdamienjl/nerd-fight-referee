    - field: weaknesses
      value: 'Slightly overconfident. He loses health each time he attacks with Vajra.
        Notable Attacks/Techniques: *Rising Dragon of the Zodiac: Maxi hits the opponent
        with a barrage nunchaku blows and then thrown airborne by a palm strike. Maxi
        then leaps in the air and cries out "Rising Dragon of the Zodiac!" and delivers
        a kick to the opponent''s neck or ribs. *Rampaging Dragon: Maxi punches his
        opponent twice, and finishes them with an elbow strike. Note: Many of Maxi''s
        abilities come from the various weapons he can equip. As a result in a battle,
        the creator should specify what weapon(s) he is allowed to have. ==Notable
