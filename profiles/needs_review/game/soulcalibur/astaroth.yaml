        them with flames, energy and all other ranged attacks at his disposal, using
        both his mouths to increase the rate of fire. He resorts to physical attacks
        very rarily, and even then, they are limited to occasional claw swipes or
        quick full-body tackles performed if the opponent uncatiously gets too close,
