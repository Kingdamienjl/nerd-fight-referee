    - field: weaknesses
      value: 'Normal human weaknesses. Notable Attacks and Techniques: *Soul Conviction:
        He shouts "Get ready!", then uses his sword to knock the opponent in the air
        and brings them down. He then powers up Soul Calibur by raising it into the
        sky, yelling "Prepare to die!". As the foe stands up, he slashes his blade
        through them vertically, sending crystals everywhere as the opponent drops
        dead, consumed by blue flames. Or Siegfried turns back saying "Taste... My
        blade!", and then he releases a single launcher. There''s a blue shining sphere
        at the end of his sword during the attack. *Legacy Testament: Siegfried raises
        his sword above his head and stabs it into the ground. This causes a trail
        of crystal spikes to appear in the direction of his opponent. *Ashen Blitz:
        That''s a hardly recognizable inverse version of Terror Slap. If Siegfried
        succeeds in delivering the blow, time freezes for a while. This long-range
        horizontal high attack is always followed with a blue-white trace. New Timeline
        *Dark Legacy: When weakened, Siegfried will enter this powered up state. He
        obtains a powerful aura and gains access to a new set of attacks. **Soul Wave:
        Likely due to the remnants of Soul Edge''s power still within him, Siegfried
        has access to Nightmare''s Soul Wave technique in which steals the souls of
        those hit by it. Note: Siegfried only has the abilities of Soul Edge during
        the events of Soul Calibur ll. As such in a match, Siegfried can only have
        Soul Edge if Soul Calibur ll Siegfried is chosen. However, as a result only
        Soul Edge may be used in that situation. ==Notable Matchups== Victories: Losses:
