- id: claim-weaknesses-81c65664
  section: weaknesses
  axis: weakness
  text: 'Guillotine damages Voldo each time he blocks. The Tofana Scissors poison
    Voldo as well. Notable Attacks and Techniques: *Great Gear of Madness: He attaches
    himself to his opponent from behind, whom he sets on fire rolling around. Voldo
    then jumps up and slams the opponent to the ground. *Wheel of Madness: Voldo start
    his Critical Edge with a bow, and then attacks his opponent in a circular shape.
    Note: Many of Voldo''s abilities come from the various weapons he can equip. As
    such, in battle the creator should specify what weapon(s) he is allowed to have.'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
