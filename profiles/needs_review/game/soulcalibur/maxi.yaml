- id: claim-weaknesses-ea50ef28
  section: weaknesses
  axis: weakness
  text: 'Slightly overconfident. He loses health each time he attacks with Vajra.
    Notable Attacks/Techniques: *Rising Dragon of the Zodiac: Maxi hits the opponent
    with a barrage nunchaku blows and then thrown airborne by a palm strike. Maxi
    then leaps in the air and cries out "Rising Dragon of the Zodiac!" and delivers
    a kick to the opponent''s neck or ribs. *Rampaging Dragon: Maxi punches his opponent
    twice, and finishes them with an elbow strike. Note: Many of Maxi''s abilities
    come from the various weapons he can equip. As a result in a battle, the creator
    should specify what weapon(s) he is allowed to have. ==Notable Matchups== Victories:
    Losses: Claude von Riegan (Fire Emblem: Three Houses) Claude''s Profile (7-B versions
    were used. Speed was Equalized) Inconclusive: {{Discussions}} Category:Soul Calibur
    Category:Fighting Game Characters Category:Characters Category:Male Characters
    Category:Nunchaku Users Category:Martial Artists Category:Weapon Masters Category:Fire
    Users Category:Statistics Amplification Users Category:Healers Category:Regeneration
    Users Category:Electricity Users Category:Pirates Category:Good Characters Category:Primary
    Protagonists Category:Adults Category:Sound Users Category:Mind Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-71bcdaa8
  section: abilities
  axis: hax
  text: Original Timeline=Superhuman Physical Characteristics, Nunchaku Mastery, Martial
    Arts, Fire Manipulation, Resistance to Mind Manipulation and Madness Manipulation
    (Trained to be able to resist the mental effects of the shard of Soul Edge in
    his body) |-|New Timeline=All Original Timeline abilities minus weapon abilities,
