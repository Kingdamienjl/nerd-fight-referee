  axis: hax
  text: All previous abilities including those from Irkalla, Soul Manipulation (With
    the power of Soul Edge. Can rob the souls of entire armies at once. Deals Soul
    Damage with each of attacks, stealing the soul of his opponent slowly during combat),
    Mind Manipulation (With the power of Soul Edge. Can manipulate the minds of others.
    If there is a malfested target, Soul Edge feeds off of their sinful actions of
    bloodlust and gains the ability to control them), Dimensional BFR (Can send others
    to Astral Chaos. All Souls taken by Soul Edge are sent to Astral Chaos. Astral
    Chaos warps and corrupts all who enter, mind, body and soul, eventually driving
    them mad and turning them into a form of Malfested), Duplication, Light Manipulation,
    Necromancy, Madness Manipulation (Type 2; Simply being in contact with its power
    is enough to drive one into madness. Can corrupt entire areas making it so that
    anyone who enters the area will be driven mad), Curse Manipulation, Corruption
    (Can turn those who come into contact with it into mindless Monsters, Vampires,
    Malfested, etc. Even sustaining injuries from him or any wielder of Soul Edge
    is enough to drive one insane as shown with Raphael whose body became corrupted
    by his wounds. Coming into contact with a malfested's blood can in fact infect
    another as shown when Amy became malfested by treating Raphael's wounds), Sealing,
    Reality Warping, Can cut through dimensions, Teleportation, Fire Manipulation,
    Ice Manipulation, Passively draws energy into the Abyss as well as always pulling
    his opponents toward him while damaging them, Resistance to Sealing |-
  source_ids: *id003
  decisive: true
  status: unverified
