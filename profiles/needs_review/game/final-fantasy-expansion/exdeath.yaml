    - field: weaknesses
      value: "Must be hard-pressed in order to use his Limit Breaks. After the events\
        \ of Final Fantasy VII, he has become somewhat moody and depressed as he tries\
        \ to piece together his identity from his fractured memories, but his condition\
        \ has improved since the ending of Advent Children. Notable Attacks/Techniques:\
        \ === Limit Breaks === * Braver: Cloud jumps into the air before cleaving\
        \ the opponent in two with a single vertical strike. In Dissidia, Cloud instead\
        \ begins this attack in the air, dashing into the target before slamming them\
        \ into the floor. * Cross-Slash: A single physical attack with three slashes.\
        \ Can inflict paralysis. In AC, with the first Tsurugi, he can split it into\
        \ 2 separate blades and do a cross slash. * Blade Beam: Fires a blue energy\
        \ beam that can be fired multiple times at once. * Climhazzard: Runs an opponent\
        \ through the the Buster Sword before dragging them into the air with an upward\
        \ slash. Cloud uses Climhazzard to defeat Bahamut SIN in Advent Children.\
        \ * Finishing Touch: Hits all enemies with a tornado causing instant death,\
        \ or dealing normal damage for any enemy immune to instant death. In Dissidia,\
        \ he instead spins around the opponent, delivering multiple slashes while\
        \ rising to the air, then slams them into the ground. * Meteorain: Cloud swings\
        \ his sword and fires off 6 meteor-like bolts of energy at his opponent(s).\
        \ * Omnislash: Cloud's original ultimate Limit Break. Cloud rushes towards\
        \ his opponent before unleashing a flurry of fourteen critically damaging\
        \ blows at high speed. Cloud then dramatically leaps into the air and brings\
        \ his sword down for the final slash to finish his opponent. The Dissidia\
        \ version has Cloud fly around his opponent as he dishes out these attacks,\
        \ striking the opponent's back and vitals so quickly that that one is only\
        \ able to see his position after finishing each slash before finishing them\
        \ off with the final downward slice. ** Omnislash Version 5: Cloud separates\
        \ the Fusion Sword into its six component blades that float around his opponent.\
        \ He is then engulfed in an orange aura before dashing past the target at\
        \ incredible speeds that leave foes as fast as Sephiroth unable to react,\
        \ leaving afterimages in his wake as he grabs another blade which he combines\
        \ with the one he has in hand before attacking his opponent again. He repeats\
        \ this motion until he collects all six blades, upon which he finishes his\
        \ target with a single strike from the First Tsurugi. In Dissidia he is also\
        \ able to perform this with the Buster Sword, being a shorter variation of\
        \ Omnislash that has Cloud fly around the opponent multiple times before finishing\
        \ with the downward strike. ** Omnislash Version 6: A longer variation of\
        \ Omnislash Version 5 that only appeared in Advent Children Complete, Cloud\
        \ is engulfed in a blue aura before enacting Omnislash Version 5, only striking\
        \ the target multiple times with each additional sword for a total of thirteen\
        \ devastating blows. This technique finished off Sephiroth with a single use,\
        \ forcing him to dissipate back into the Lifestream. * Cherry Blossom Slash:\
        \ An attack exclusive to his appearance in Final Fantasy Tactics, Cloud unleashes\
        \ a powerful barrage of lightning, ice and fire to devastate an opponent.\
        \ === Magic === * Break: Cloud deals Earth-elemental damage. This attack can\
        \ petrify an opponent, effectively killing them unless they have an ability\
        \ that resists its effects. * Death: Cloud instantly kills the target unless\
        \ they're fortunate enough to dodge it or if they're immune to instant death\
        \ attacks. * Haste: Cloud speeds up time around himself, greatly increasing\
        \ his movement and combat speed. * Slow: Cloud slows down time around his\
        \ target, slowing their movements and combat speed to a crawl. * Toad: Cloud\
        \ transmutes his target into a common toad, leaving them helpless to resist\
        \ his attacks. * Ultima: The ultimate offensive magic, unleashing a burst\
        \ of energy that deals massive non-elemental damage. Sonic Blade (\u30BD\u30CB\
        \u30C3\u30AF\u30EC\u30A4\u30F4 Sonikku Reivu?, lit. \"Sonic Rave\"), translated\
        \ as \"Sonic Rave\" in Kingdom Hearts II, is a technique introduced in Kingdom\
        \ Hearts. It allows the user to execute a number of successive thrusting attacks.\
        \ After the first attack, each successive attack is activated through a prompt\
        \ command. Cross-slash (\u51F6\u65AC\u308A Kyougiri?, lit. \"Bane-slash\"\
        ) is a technique that appears in Kingdom Hearts: Chain of Memories. It allows\
        \ the user to assault the enemy with a three-hit combo. * Cross-slash+ (\u51F6\
        \u65AC\u308A\u30FB\u6539 Kyougiri-kai?, lit. \"Bane-slash Revision\") is a\
        \ variation that allows the user to warp next to an enemy before continuing\
        \ with Cross-slash. Omnislash (\u8D85\u7A76\u6B66\u795E\u8987\u65AC Chouky\u016B\
        \ bushin hazan?, lit. \"Super Ultimate Martial God Supreme Slash\") is a technique\
        \ introduced in Kingdom Hearts. It allows the user to deal many powerful slashes\
        \ to one or more enemies, sometimes flying between them to ensure accuracy."
      source_id: character-stats-profiles-exdeath
