    - field: weaknesses
      value: 'Exdeath is extremely arrogant. Notable Attacks/Techniques: ===Magic===
        *Banish: Exdeath consigns the target to The Void, in which they''re completely
        annihilated if they''re unable to withstand its environment. *Blizzaga: Exdeath
        assails his foes with giant icicles to deal heavy ice-elemental damage. *Death:
        Exdeath instantly kills his foe. *Vacuum Wave: Exdeath attacks the target
        twice and inflicts Sap as a result. *Doom: Exdeath curses the target to die
        after a certain amount of time. *Firaga: Exdeath causes a huge explosion to
        erupt at his foe''s position to deal heavy fire-elemental damage. *Flare:
        Exdeath triggers a non-elemental explosion to obliterate everything in the
        target area. **Dark Flare: A darkness-infused version of Flare that deals
        even more damage and inflicts Sap, rapidly draining the target of their stamina
        and ability to fight. *Silence: Exdeath casts a spell to render the target''s
        powers null. *Dispel: Exdeath removes any and all buffs from his targets,
        rendering them back to their base state. *Graviga: Exdeath rapidly increases
        gravity around his targets to deal massive damage and force them to the ground.
        *Holy: Exdeath smites his foes with a blast of holy light, dealing heavy holy-elemental
        damage. *Hurricane: Exdeath creates a localized hurricane at his position
        to punish those who attempt to fight him in close combat. *Maelstrom: Exdeath
        summons a massive series of twisters and tornadoes to deal heavy wind-elemental
        damage to his foes. *Comet/Meteor: Exdeath summons a barrage of meteors from
        the heavens to crush his foes. *Thundaga: Exdeath strikes his target with
        an array of thunderbolts to deal heavy lightning-elemental damage. ===Other
