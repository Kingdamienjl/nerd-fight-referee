    in the novels to remove concepts and warp space and time itself, like the Devil''s
    road, which the concept of time was lost,Final Fantasy IV Novel 1, chapter 5,
    page 199 and time and space were twisted to the pointFinal Fantasy IV: The After
    Years Novel, chapter 1, page 67 the past, present and futureFinal Fantasy IV:
    The After Years Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The
    After Years Novel, chapter 3, page 147), Law Manipulation (Magic is stated to
    rewrite the natural order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198),
    Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29 in its
    basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting one''s
    innerFinal Fantasy IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal
    Fantasy IV: The After Years, and is powered by intelligence and mental strength),
    Power Modification (Including Duplication, Fusionism, Statistics Amplification,
    Size Manipulation, Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation,
    Magic users across the games have consistently shown the ability to manipulate
    the shape and properties of their own magical abilities, with even higher tiers
    of spells simply being considered stronger versions of the same basic ability),
    Non-Physical Interaction (Magic as a whole is shown to affect a wide variety of
    different beings, from intangible/immaterial beings to non corporeal beings, to
    abstract concepts like Chronodia, who''s the flow of time itself Final Fantasy
    I, to Nonexistent beings like Exdeath and Cloud of Darkness), Regeneration Negation
    (Mid-Godly) and Immortality Negation (Types 1, 2, 3, and 7. Was capable of killing
    God of Magic Kefka, who took the power of the Warring Triad and became the source
    of all magic and Espers, including Gilgamesh), Absorption (via Runic which absorbs
    magical attacks), Fire Manipulation, Ice Manipulation and Matter Manipulation
    (Sub-Atomic; Can use different levels of Fire and Ice magic. Both Fire and Ice
    related abilities are stated to affect the target''s electrons, being able to
    even negate durability in the process), Electricity Manipulation and Pain Manipulation
    (Is able to utilize different levels of Lightning spells, which is capable of
    attacking the nervesFinal Fantasy IV Volume 2 Novel, chapter 7, page 54), Statistics
