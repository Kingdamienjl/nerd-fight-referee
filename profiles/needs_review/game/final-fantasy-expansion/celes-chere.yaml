        Empire, granting her greater expertise than all of her comrades except for
        Terra. A former ranking general in the Gestahlian Military, she is also proficient
        with all sorts of melee weapons, being the only other female character in
        the game to wear heavy armor and wielding several of the most powerful weapons
        in the game, preferring bladed weapons to use with her unique Runic ability.
