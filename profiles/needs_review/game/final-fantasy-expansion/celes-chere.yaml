    weapon, absorbing it and restoring her mana reserves with the energy from the
    attack. *Firaga: Celes ignites her target in a fiery explosion. *Blizzaga: Celes
    fires a giant shard of Ice that can split into smaller shards to home in on their
    target. Alternatively, she can use multiple shards to revolve around herself.
    *Thundaga: Celes calls down contracting Lightning Bolts around her foe. *Holy:
    Celes fires orbs of holy magic at her foe that home in on their location. *Flare:
    Celes induces nuclear fusion in her target''s location, causing a concentrated
    thermal explosion. *Meltdown: Celes releases ultra-hot flame that envelops everything.
    Alternatively, she can fire off an orb of superheated magic. *Poison: Celes poisons
    his target *Bio: Celes fires a cloud of noxious gas to poison her target. *Quake:
    Celes opens up a rift in the earth to swallow up her foes. *Tornado: Celes summons
    multiple tornadoes to assault her foe. *Flood: Celes summons a stream of water
    at her target''s location. *Drain: Celes absorbs her target''s life energy to
    heal herself. *Break: Celes petrifies her target, allowing her to break and shatter
    them at her leisure. *Death: Celes reaps the target''s soul and solidifies their
    blood, killing them instantly. *Graviga: Celes conjures a dome of gravity over
    her foe, crushing them under the gravity and reducing 3/4s of their HP. *Banish:
    Celes banishes her target to the void. *Meteor: Celes hails down meteors that
    ignore defense. *Ultima: Celes conjures the ultimate black magic, causing an expanding
    explosion that ignores defense. *Libra: Celes scans her target to check their
    hp, mp and current weaknesses. *Curaga: Celes heals herself and allies a large
    amount of HP *Rasp: Celes damages the target mp, draining it. *Silence: Celes
