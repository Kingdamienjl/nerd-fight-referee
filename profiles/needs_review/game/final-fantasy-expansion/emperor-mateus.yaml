      value: The Emperor is an amazing tactician and manipulator, easily taking over
        most of the country until Firion and his friends joined the Wild Rose Rebellion.
        Even then he managed to engineer the deaths of most of the major figures of
        the rebellion and even temporarily replaced Princess Hilda with a Lamia. He
        is also implied to be a mechanical genius, having personally designed and
        developed the Dreadnought airship and its weaponry. However, he is very arrogant
        and condescending, which can often cloud his judgment. He is also not used
        to losing or criticism, resulting in desperate actions in the face of repeated
        defeats.
