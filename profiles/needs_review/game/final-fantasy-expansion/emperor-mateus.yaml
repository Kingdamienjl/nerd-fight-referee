    - field: weaknesses
      value: 'He is a misanthrope and extremely arrogant, refusing to fight his foes
        unless they defeat his underlings first. | He is weak to weapons that drain
        the life out of foes such as the Blood Sword. Notable Attacks/Techniques:
        Base: * Summoning: He can summon up creatures from Hell and build up a massive
        army of demons. (Never explained how he did it) * Cyclone: Conjured a massive
        Cyclone to lay waste to the cities of his planet in a last ditch effort to
        pacify the rebellion. * Blink VIII: Creates double images of himself to be
        used as a distraction and evade further attacks. * Barrier VIII: Erects a
        magic barrier to mitigate the damage dealt by elemental attacks. * Thunder
        X: Powerful lightning elemental magic. * Haste VIII: Speeds up the Emperor''s
        time relative to his opponents, increasing his combat speed. * Slow IX: Slows
        down time around his opponents, reducing their combat speed. * Teleportation:
        Showcases the power to do so upon capturing Firion and company with his fake
        tournament at the Coliseum. The Dark Emperor: * Blind XVI: Blinds his opponents.
        * Curse XVI: Inflicts Curse status on the target. The afflicted character''s
        destructive power and durability are drastically reduced. * Dispel XVI: Dispels
        any positive magical buffs cast on target. * Flare XVI: Sets off a fusion
        reaction, generating a large magical explosion. * Slow XVI: Even more potent
        version of Slow IX. * Starfall X: Calls down a meteor from the sky. * Resurrection:
        Implied to have brought himself back to life upon ascending to the throne
        of Hell and claiming its power for himself. * Telekinesis: Lifts the palace
        of Hell, Pandaemonium, up to the surface of Earth from out of Hell. * Hellfire:
        Summons hellfire to attack Firion and company upon ascending out of Hell and
        reclaiming his hold over Firion''s world. * Life Force Absorption: His physical
        attacks leech vitality from those hit by them, restoring his Emperor of Heaven:
        He wields all of the abilities of his Emperor of Hell half as well as: * Blaze
        XVI: Powerful fire elemental magic. * Holy XVI: Despite its name, the attack
        is designated a non-elemental magical explosion, the white magic opposite
        of Flare. * Starfall XVI: A more powerful version of Starfall X. * Soul Manipulation:
        Pulled more than an entire town''s worth of people from out of the afterlife
        and placed them inside the Raqia without their even knowing how they ended
        up getting there. Note: Most of the attacks are based on game mechanics. Not
        to be confused with any other "Emperor" characters. ==Gallery== File:EM_oVT8NY1y4.png|
