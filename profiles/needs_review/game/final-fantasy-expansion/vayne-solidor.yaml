        (Type 2; Nothingness, i.e. Void, has nothing to balance with, implied to be
        independent Yin and Yang) ** Immortality *** Type 1 (Souls are eternal, never
        dying, rather evolving in perpetuity) *** Type 3 *** Type 5 (Visions are storied
        heroes whose dreams transcend death, and since visions are souls and dreams
