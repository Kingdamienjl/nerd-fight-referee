        AoE damage. Standing under a comet, would prevent the AoE and only deal a
        small amount of damage., Clouds & Storms: Cloud of Darkness receives both
        a magical and physical invulnerability buff (although it is possible to break
        this buff if dealt enough damage) and begin sucking in air. At the same time,
        Dark Clouds and Dark Storms will spawn and begin quickly moving towards her.
        Any cloud that reaches her will give her a damage up stack, any storm that
        reaches her will give her 3 damage up stacks. However, the clouds can slow
        down when one person stands in front with the storms requiring three., Flood
