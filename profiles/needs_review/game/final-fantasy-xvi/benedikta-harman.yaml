      value: Harman carries GLIDER, an armor-piercing rifle attached to his wheelchair,
        though other iterations of Harman have been seen carrying a tommy gun. Garcian
        carries a suppressed Sig Sauer P230, fitting of his support role. He also
        holds the rest of the Killer 7's guns in his suitcase, though he never opens
        it. Dan wields a Colt .357 nicknames the HANDSOME DEVIL, an even more powerful
        revolver that can hold 12 shots instead of 6. KAEDE carries CONNECTION, an
        AMT Hardballer equipped with a scope. Kevin has his combat knife, and plenty
        of throwing knives. Coyote's weapon is FREAK SCIENCE, a customized Enfield
        revolver said to violate several international laws. Con holds two small automatic
        pistols called DISARM and MASK two M79 incendiary grenade launchers named
        "DREAM ALL DAY". Garcian also holds the Vision Ring, while anyone in the team
        has access to the Fire Ring, Water Ring, Wind Ring, Stamina Ring, Time Ring
        and Power Ring, though they can only use one at a time. Finally, they're equipped
        with a maximum of 20 vials of thin blood, that they can use to heal themselves
        or use character-specific abilities, which they can use to upgrade their abilities
        in Harman's Room., The Golden Gun, a powerful weapon only he can hold (If
        any of the personae try to take it in the sequence where the Killer 7 are
        killed, the game will say they "cannot handle it")
