    - field: intelligence
      value: Genius for Harman. An immortal who often toys with the entirety of humanity,
        easily steering around nations just for the sake of games with his friend
        and nemesis Kun Lan. Gifted for the rest, the Killer 7 are considered a deadly
        force that rivals a small army and can easily defeat other killers of comparable
        renown. Dan Smith quickly tracked down Badman after the latter betrayed him
        despite his efforts to hide, and not only was Badman terrified of Dan, but
        Dan himself only believed Travis Touchdown, the most famous and powerful assassin
        in the world, to only be the best "aboveground", seemingly considering himself
