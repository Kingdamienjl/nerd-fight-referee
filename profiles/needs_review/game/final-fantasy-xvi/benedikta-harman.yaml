    text: at least Universe level+ likely far higher (Constantly fights the Fal'Cie
      as a means of opposing them. The Fal'Cie are beings whose existence is beyond
      the comprehension of humans meaning that humans find the Fal'Cie incomprehensible
      and incoherent. The same humans who fail to understand the Fal'Cie due to their
      limited comprehension, have enough comprehension to use chaos crystals, which
      exist as crystallized pieces of time itself created by space-time singularities,
      to create Paradox weapons. Paradoxes in Final Fantasy XIII-2 are capable of
      affecting space-time itself, which are 4D manifolds, in a manner of breaking
      it, doubling it and twisting it back on itself which causes past and future
      to be tangled as one. In addition to that, Paradoxes can sustain their effects
      on the spacetime as long as they exist within it and are not eliminated. The
      said humans who fail to comprehend the Fal'Cie ,yet again, have enough comprehension
      to create 4D duplicates of people based on data. Lightning herself is at the
      very least comparable to high tier Fal'Cie such as Barthandelus, Eden and Orphan
      if not superior to them. Eden created the dimension of Orphan's Cradle that
      hovers between reality and dream on Barthandelus's command. Orphan's Cradle
      is a realm of pure data manifested in a physical form and it shelters the infinite
      functions that Orphan oversees to sustain Cocoon's levitation. The said Fal'Cie
      are superior[see note 1 below] to Fal'Cie Adam, an artificial prototype Fal'Cie
      created by mankind in order to re-levitate Cocoon after its fall which was the
      result of Orphan's death. Even as a man-made Fal'Cie with an existence limited
      to human comprehension[see note 1 below], and inferior to the original Fal'Cie
      who are created by gods, it was still capable of creating a space-time, which
      as previously mentioned are 4D manifolds, and sustainsing it. The said space-time
      encompassed past and future the same way The Void Beyond does. | Outerverse
      level+ (Valhala exists as an endless realm devoid of the concept of time, opposes
      all conventions and is beyond space and time as well as imagination, life and
      death. Valhala gives birth to the infinite possibilities of the Fabula Universe,
      the said infinite possibilities manifest as the possible worlds and timelines
      of the Fabula universe creating an infinite quantity of possible worlds and
      all of which are connected to each other and ultimately Valhala through The
      Void Beyond-a plane that encompasses past and future, causing them to intersect,
      as well as Extradimensional spaces known as Temporal rifts- while still existing
      as a part of Valhala and simply nothing but a Shadow of it. In addition to the
      infinite possible worlds, impossible worlds also exist within the Fabula Cosmology
      as the Paradox Scope could cause the creation of impossible worlds by bending
      the laws of the Fabula universe. Also in Valhala, impossible things such as
      fictional beings existing on the same plane as those who r>f transcend them
