      everything about fighting. Whether it be controlling his strength, stacking
      up his power, infiltration, horseback riding, or using some type of weapon,
      he could do it all. When he was younger, he had even gone so far as to have
      his father hire a medical professional so he could learn about the human body,
      its weakness, blind spots, and anatomy, making sure to understand what battle
      is, and the most advanced science involved with it. He was so talented in fact,
      that he surpassed his father by the time he was only seventeen. As he is now,
