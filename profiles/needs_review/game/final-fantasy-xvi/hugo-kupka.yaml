        portal above which has the other portal above the enemy, he sends his scythe
        into the portal and slashes the enemy. ** Remote Trail: Hugo sends his scythes
        flying at the enemy before they slash at them. ** Dark Pit: Hugo turns into
        a shadow and goes underneath his enemy before the shadow reaches out and grabs
        the enemy into the shadow ** Keeper of the Abyss: Hugo takes his enemy to
        his dimension where he appears as a head with two floating hands, he slams
        the enemy into the ground and throws them away before he twirls his scythe
        and creates a vacuum the sucks them into the spinning blade. * Evilities:
        Evilities are passive abilities which give the Hugo new abilities. ** Mind
