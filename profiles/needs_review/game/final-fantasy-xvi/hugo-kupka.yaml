        and, alongside Lycaon, managed to trick Anby, Vivian, and the Proxy, into
        believing said acts of his were true. Stated to be "cunning and unpredictable,"
        Hugo is infamous for his great skills at infiltrating high society gatherings,
        fooling people with disguises. When it comes to combat, Hugo has also proven
