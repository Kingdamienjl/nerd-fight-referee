  intelligence:
    text: 'At least Gifted, likely Genius (As a Phantom Thief and a member of Mockingbird,
      Hugo holds impressive skills in various aspects. He has shown to be good at
      stealth, having been able to break into an auction without being noticed, and
      managing to swap out a copy of "Stars of Lyra" from Hemiola with another, limited-edition
      one without being spotted.Ridu Chronicles: "The Day of Brilliant Wishes" Successfully
      stole the Sacrifice Core without raising any suspiciouns and, alongside Lycaon,
      managed to trick Anby, Vivian, and the Proxy, into believing said acts of his
      were true. Stated to be "cunning and unpredictable," Hugo is infamous for his
      great skills at infiltrating high society gatherings, fooling people with disguises.
      When it comes to combat, Hugo has also proven to be rather skilled, easily maneuvering
      around a Thanatos and defeating it without much issue, as well as keeping up
      against Lycaon in combat, his skills and strength forcing the Thiren in each
      of their confrontations to put serious effort.)'
