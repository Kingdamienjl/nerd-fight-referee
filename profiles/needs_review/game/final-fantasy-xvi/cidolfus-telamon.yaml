    - field: weaknesses
      value: 'Cannot use Swordplay techniques (Judgment Blade, Cleansing Strike, Northswain''s
        Strike, Hallowed Bolt, Divine Ruination, Crush Armor, Crush Helm, Crush Weapon,
        Crush Accessory, Shadowblade, Duskblade) without a sword. Notable Attacks/Techniques:
        *Judgment Blade: An area of effect technique which summons magickal shards
        of holy energy just over the top of the target area that fall down and encase
        everything before shattering and dealing damage with a chance to freeze the
        enemy in time for a short duration. *Cleansing Strike: Single target technique
        that summons a spiritual energy blade at the feet of the target, which flies
        upwards through them doing damage to the target with a chance to apply Doom,
        a status effect that causes a target to instantly be incapacitated and bleeding
        out in a short time (three in game turns). The target is aware of how much
        time is left while Doom ticks down. *Northswain''s Strike: Single target technique
        that summons the tip of a large sword made of energy at the feet of the target,
        which shoots up and pierces them, doing damage and with a chance to instantly
        put the target in an incapacitated, bleeding out state. *Hallowed Bolt: An
        area of effect technique that causes magickal lightning to strike the target
        area, with blades of holy energy erupting from the ground and stabbing upwards
        at places where the magickal lightning strikes the ground. Those struck by
        the blades of holy energy take damage with a chance to apply Silence, a status
        effect that prevents the target from speaking (and thus from using abilities
        that require speech like most forms of magick in the game) for a short time.
        *Divine Ruination: A linear area of effect technique that causes beams of
        holy energy to strike the area from the sky, dealing damage to all affected
        with a chance to inflict Confusion, a status effect which makes the target
        unable to tell friend from foe and make seemingly random actions for a short
        time. *Crush Armor: A single target technique that summons a large blade to
        erupt from the earth and attack the foe, shattering whatever armor or clothing
        the target might be wearing, regardless of enchantments or powers bestowed
        by them. The target is then dealt massive damage at range. *Crush Helm: A
        single target technique that summons a large, multi-edged shuriken from the
        sky to come down and cleave the target, shattering whatever headpiece or helmet
        the target might be wearing, regardless of enchantments or powers bestowed
        by them. The target is then dealt massive damage at range. *Crush Weapon:
        A single target technique that summons a large sword from the ground which
        cleaves upward, destroying whatever weapon the target may be holding, regardless
        of enchantments or powers bestowed by them. The target is then dealt massive
        damage at range. *Crush Accessory: A single target technique that superimposes
        a large glyph onto the target, slicing through whatever accessory the target
        might possess, regardless of its nature or enchantments or powers bestowed
        by them. The target is then dealt massive damage at range. *Shadowblade: A
        single target technique that creates a large blade made out of blood that
        penetrates a syringe-like object, draining a large portion of a target''s
        health and restoring one''s own. *Duskblade: A single target technique that
        creates a large spectral blade from the ground, syphoning a target''s MP and
        restoring one''s own. Swordplay techniques aimed at any target have never
        been shown to miss, be evaded, or be blocked under any circumstance - including
        while the user is blinded or confused. Note: Little canon information is available
        in regards to what jobs the party may or may not have learned or mastered
