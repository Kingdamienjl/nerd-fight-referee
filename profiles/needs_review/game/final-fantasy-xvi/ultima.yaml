        |Augment |Increase Faith. |Triggered when struck by Magick. |- |Swiftness
        |Support |Augment |Shorten charge time. |Reduces the concentration moment
        needed for Magicks. |- |Brawler |Support |Augment |Deliver more powerful unarmed
        attacks, even if not a monk. |Increases damage of unarmed attacks by x1.5.
        |- |Levitate |Movement |Augment |Move while floating a height of 1h above
        the ground. |Ultima can outright fly. |- |Master Teleportation |Movement |Augment
        |Warp instantly to destination tiles. |Ultima actively uses it during combat.
        |- |} |-|Augments & Battle Conditions= {| class="wikitable sortable" |+Augments
