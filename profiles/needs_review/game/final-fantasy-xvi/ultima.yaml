    - field: attack_potency
      value: 'Universe level+ (Although weaker, Ultima is comparable to Zodiark as
        one of the strongest Lucavi, being capable of facing Vaan and his allies in
        combat around the same time they would fight Zodiark and show to be capable
        of commanding him in his mature state. A mature Zodiark was shown to be capable
        of obliterating a realm large enough to contain faraway starsFinal Fantasy
        XII: The Zodiac Age (2017). Combat with his Final Eclipse attack. However,
        said dimension could very well be an universe, as the Lucavi hold power beyond
        the comprehension of mortals, with the strongest of them being absolute existences
        who both transcend and are unruled by the principles and logics of nature,
        having the power to control the laws and rules of the world and reduce everything
        to complete nothingness. Among them, Zodiark stands as the most powerful one,
        possessing the power to shape the laws of the universe, among which are space
        and time, along with an overwhelming might that grants him dominion over all
        aspects of creation, making him capable of bringing annihilation to everything
        in existence), possibly Multiverse level+ (Before facing her, Vaan and his
        team had defeated Multi-Armed Gilgamesh in proper combatFinal Fantasy XII:
        The Zodiac Age (2017). Combat on two separate occasionsFinal Fantasy XII:
        Revenant Wings (2007). Before facing Vaan and his allies, Gilgamesh could
        hold his ownFinal Fantasy V: Pixel Remaster (2021) against Bartz Klauser and
        his fellow Warriors of Light and defeat a powerful foeFinal Fantasy V: Pixel
        Remaster (2021) that was giving them trouble, shortly before they defeated
        Neo-Exdeath and, eventually, Enuo, both who had gained power over the VoidFinal
        Fantasy V: Pixel Remaster (2021).)'
