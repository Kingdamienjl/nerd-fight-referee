    - field: powers_and_abilities
      value: 'Auracite & Lucavi= Auracite: *Reality Warping (Not combat applicable;
        Though their exact nature remains ambiguous, the Auracites, also known as
        the Zodiac Stones, are implied to hold the spirits of the Lucavi or maybe
        their power. Still, their power is stated to be capable of altering the very
        weave of natureFinal Fantasy Tactics: The War of the Lions (2007). Chapter
        2 . It''s also heavily implied that the miracles of Saint Ajora, Ultima''s
        previous host, were actually real and were possible thanks to Ultima''s power
        or the Virgo Auracite. Additionally, the power if the Auracites is of such
        degree that some believe that it can allow to reach a higher planeFinal Fantasy
        Tactics: The War of the Lions (2007). Chapter 4 (Japanese). All that said,
        the nature of these powers has never been explicitly shown, so it remains
        unknow how it could be applicable in combat if at all.) *Blessing, Possession
        and Corruption (Type 2; By using their corresponding Auracite, the Lucavi
        can prey and bring forthFinal Fantasy Tactics: The War of the Lions (2007).
        Chapter 3 the desperation and temptationsFinal Fantasy Tactics: The War of
        the Lions (2007). Chapter 3 inside a person''s heart, to then form a pact
        with them. If they accept, they will surrender their body and soul to the
        Lucavi, becoming their host. This new host will be granted far superior powerFinal
        Fantasy Tactics: The War of the Lions (2007). Chapter 3 than they originally
        had, but their hearts will be heavily influenced by the fiendish nature of
        the LucaviFinal Fantasy Tactics: The War of the Lions (2007). Chapter 3, if
        they manage to keep their personality at all. Eventually, when the Lucavi
        sees fit, they will simply take over completelyFinal Fantasy Tactics: The
        War of the Lions (2007). Chapter 3 the host.) *Transformation (When in possession
        of a host, the Lucavi can completely take them overFinal Fantasy Tactics:
        The War of the Lions (2007). Chapter 3, if they hadn''t already done so, and
        use their Auracite to transform their host body to fully enter the mortal
        worldFinal Fantasy Tactics: The War of the Lions (2007). Chapter 4 from their
        own realm, the netherworld. Normally, Espers and Scions, like the Lucavi,
        can only manifest a small echo of their powerFinal Fantasy Tactics A2: Grimoire
        of the Rift (2008) when summoned through GlyphsFinal Fantasy XII: The Zodiac
        Age (2017). Sage Knowledge or Summon MagickFinal Fantasy Tactics: The War
        of the Lions - Job Description - Japanese Version (2007), but when using a
        host this way, the Lucavi can come forth with their full power.) *Healing
        and Resurrection (The Auraicites possess the power to heal other living beings,
        normally done to their hosts, even if they are on the brink of deathFinal
        Fantasy Tactics: The War of the Lions (2007). Chapter 4. On ocassion, they
        have revived unrelated individualsFinal Fantasy Tactics: The War of the Lions
        (2007). Chapter 3 who have been killed in battle, however, it''s a mystery
        why the Auracite chose to do this, as it''s a mystery why creatures of such
        evil nature would save someone without gaining something.) General Lucavi'
      source_id: vsbattles-ultima-final-fantasy-xvi
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'Universe level+ (Although weaker, Ultima is comparable to Zodiark as
        one of the strongest Lucavi, being capable of facing Vaan and his allies in
        combat around the same time they would fight Zodiark and show to be capable
        of commanding him in his mature state. A mature Zodiark was shown to be capable
        of obliterating a realm large enough to contain faraway starsFinal Fantasy
        XII: The Zodiac Age (2017). Combat with his Final Eclipse attack. However,
        said dimension could very well be an universe, as the Lucavi hold power beyond
        the comprehension of mortals, with the strongest of them being absolute existences
        who both transcend and are unruled by the principles and logics of nature,
        having the power to control the laws and rules of the world and reduce everything
        to complete nothingness. Among them, Zodiark stands as the most powerful one,
        possessing the power to shape the laws of the universe, among which are space
        and time, along with an overwhelming might that grants him dominion over all
        aspects of creation, making him capable of bringing annihilation to everything
        in existence), possibly Multiverse level+ (Before facing her, Vaan and his
        team had defeated Multi-Armed Gilgamesh in proper combatFinal Fantasy XII:
        The Zodiac Age (2017). Combat on two separate occasionsFinal Fantasy XII:
        Revenant Wings (2007). Before facing Vaan and his allies, Gilgamesh could
        hold his ownFinal Fantasy V: Pixel Remaster (2021) against Bartz Klauser and
        his fellow Warriors of Light and defeat a powerful foeFinal Fantasy V: Pixel
        Remaster (2021) that was giving them trouble, shortly before they defeated
        Neo-Exdeath and, eventually, Enuo, both who had gained power over the VoidFinal
        Fantasy V: Pixel Remaster (2021).)'
      source_id: vsbattles-ultima-final-fantasy-xvi
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'Massively FTL+ (Even in a vastly weakened state, Ultima is far more
        powerful than Dark Behemoths, who can use their Magick to move the stars in
        the skyFinal Fantasy Tactics: The War of the Lions (2007). Chapter 4 at these
        speeds with their Almagest spellFinal Fantasy Tactics: The War of the Lions
        (2007). Skill Description - Japanese Version. She is also much stronger than
        Ultima Demons, among who even the weakest members are capable of using Almagest>79,392,212.36cMagick
        does scale to physical parameters, due to being a power that comes from the
        soul and is achieved by controlling Mist, a form of energy found in the environment
        and stored in the body. The soul has a direct relation to a persons''s physical
        and magical strength..)'
      source_id: vsbattles-ultima-final-fantasy-xvi
      provider_id: vsbattles
      authority: high
      confidence: 0.75
