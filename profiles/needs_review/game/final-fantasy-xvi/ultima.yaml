    - field: intelligence
      value: Likely Genius (Though due to her limited appearances it's hard to tell,
        Ultima still has impressive feats that show an impressive intellect. She could
        wage war against the Occuria for thousand years, and despite being defeated,
        the Occuria were a god-like race who were capable of pulling the strings to
        control the history through Ivalice for many years. Furthermore, within the
        Auracites is contained the wisdom of the Lucavi, which is millenia of knowledge
        that completely surpassess human knowledge and can easily overwhelm the human
        host when they first come across it, as seen when Wiegraf first became Belias.
        Additionally, Ultima had the undying loyalty of Hashmall, a Lucavi who had
        been manipulating events through Ivalice for years and manipulated events,
        powers and factions from behind the scenes, kickstarting the bloody civil
        war that came to be known as the War of the Lions.)
      source_id: vsbattles-ultima-final-fantasy-xvi
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'One of Ultima''s few legitimate weaknesses is the Dark element, the
        only one she is not flat out immune to and actually takes additional damage
        from. She also is vulnerable to Blind, however this is mitigated as she can
        simply heal herself from it with Blindna. This latter weakness is gone in
        her Arch Seraph form. Ultima cannot use all her Battle Conditions at once,
        only one, however, she can cycle through them during battle. Notable Attacks/Techniques:
        The following are the abilities Ultima has and has shown in her appearances
        in Final Fantasy Tactics and Final Fantasy XII, as well as the skills used
        by the Ultima Demons serving her: |-|Magick and Technicks= {| class="wikitable
        sortable" |+Magicks and Technicks !Ability !Command !Type !Description !Effect
        |- |Ultima |Arcane Magicks |Offensive |Magick that inflicts damage with pure
        energy. |Deals heavy non-elemental damage over a large area. Her variant is
        far more powerful than the one available to everyone else. |- |Divine Ultima/Eschaton
        |Divine Magicks |Offensive |Magick that inflicts damage with absolute energy.
        |Ultima''s most potent attack, where she either calls forth or flies to space
        to discharge a massive blast of energy. |- |Grand Cross |Chaos |Distruption
        |Inflict various status effects with the interwoven form of earth in nothingness.
        |Inflicts Stone, Blind, Confuse, Silence, Berserk, Toad, Poison, Slow, Sleep.
        |- |Disempower |Divine Providence |Distruption |Magick that neutralizes magick
        power, reducing MP to zero. |Completely drains the targets MP. |- |Dispelja
        |Divine Providence |Distruption |Magick that neutralizes magick power, nullifying
        all status effects. |Removes Float, Reraise, Invisible, Regen, Protect, Shell,
        Haste, Faith, Reflect. |- |Return |Divine Providence |Distruption |Magick
        that warps time, returning the target''s CT to zero. |Turns back time returning
        to the moment before the action. |- |Holyja |White Magicks |Offensive/Distruption
        |None |Inflicts heavy Holy damage and Reverse, causing healing to deal damage
        and vice-versa. |- |Curaja |White Magicks |Healing |None |Restores a very
        large amount of health. |- |Renew |White Magicks |Healing |None |Fully restores
        health. |- |Blindna |White Magicks |Healing |None |Cures Blind. |- |Reflectga
        |Time Magicks |Defensive |None |Grants Reflect, a Magick reflecting field
        that inverts space-time. |- |Redemption |Technick |Offensive |None |Ultima
        calls down a ray of light on an enemy to deal heavy Holy damage. |- |Greater
        Barrier |Technick |Defensive |None |Grants Protect and Shell, halving physical
        and magical damage, as well as the Reduce Damage augment for a further 30%
        reduction. |- |Absorb MP |Reaction |Recovery |Recover MP equal to the amount
