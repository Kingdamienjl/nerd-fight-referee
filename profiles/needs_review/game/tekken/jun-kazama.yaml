      value: Genius (Had teachings of Kazama Style of Self-Defense from Jun Kazama,
        as well as intense training from Heihachi Mishima in Advanced Mishima Style
        Fighting Karate for about four years, a fighting style that was unique and
        originally based around sword use, till he spent the next two years to unlearn
        it in favor of Traditional Karate. Despite this, he was able to use the style
        again when he faced Kazuya for the last time, despite abandoning it, without
        issues, later even using a mix of all his styles. Capable to beat skilled
        fighters like Ogre, a God of Fighting with vast knowledge in martial arts,
        Jinpachi Mishima, regarded as a fighting legend dedicating his life on martial
        arts and Wang Jinrei, an over 100 years old master and various Jack robot
