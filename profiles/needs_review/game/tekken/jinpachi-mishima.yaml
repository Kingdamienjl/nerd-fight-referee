- id: claim-powers-and-abilities-f4691446
  section: abilities
  axis: hax
  text: '*Verse universal abilities (Rage; Ki Charge) *Superhuman Physical Characteristics
    *Acrobatics *Mishima Fighting Karate *Longevity and Self-Sustenance (Type 2. Gained
    after being possessed) *Demon Transformation (to his demon form) *Chi Manipulation
    and Durability Negation (scales from Kazuya, who used his ki to punch Heihachi
    to the chest all the way outside of his back with it, causing his heart to eventually
    stop beating, they can enhance the strength of their attacks) *Automatic Translation
    (all characters in the cast can understand each other speaking their respective
    languages) *Limited Fourth Wall Break (Talked with other characters how to stay
    popular and relevant in the series) *Healing (should be capable of healing himself
    just like the other members of his family can) *Self-Sustenance (Type 1 and 2)
    and Possibly Space Survival (scales from Jin and Kazuya, whom survived in outer
    space as normal humans, after falling from orbit without their devil gene, scales
    from Jin, whom didnt drown when descending down in the ocean and also has survived
    days in the desert, scales from Heihachi, whom was knocked unconscious after the
    Jack ambush till the 5th tournament was over, which was announced around 1-2 months
    ago in-universe) *Fire Manipulation (can create literal fireballs for attacking)
    *Electricity Manipulation (Mishimas can generate electricity, which was used before
    to stun people, they can also nullify energy based attacks like ki as well with
    it, their ability is good enough to control actual lightning from the sky in tandem
    with their own attacks, as shown from others in his family) *Negation (scales
    from Heihachi and Kazuya, whom shown the capability to negate the armor status
    effect of their opponents) *Aura (Mishimas can generate auras out of their body,
    Jinpachi own fiery aura is even capable of overwhelming and eventually burn them
    alive) *Teleportation (can project himself in an astral like manner for short
    distance teleportation) All previous abilities, but to a higher degree, plus:
    *Paralysis Inducement (can paralyze an individual with one of his moves) *Healing
    and Absorption (can regain little of his health by draining out some from his
    opponent) *Soul Absorption (stated he would make Devil Jin power part of him and
    assimilate it) *Weather Manipulation and Magma Manipulation (his transformation
    alone causes storms with tornadoes and changes the weather, as well as causing
    a volcanic like environment with lava) All previous abilities, but to a higher
    degree, plus: *Flight (shown the ability to fly) *Electricity Manipulation (Mishimas
    dont seem to be affected by the electricity they generate or from natural lighting)
    *Soul Absorption (managed to resist Ogre absorbing his soul despite likely taking
    it from other fighters and died, as well as scaling from Jin, for still having
    the devil gene when Ogre tried the same on him and resisted having his Devil Gene
    taken away by Kazuya himself) *Death Manipulation (scales from Heiachi, whom survived
    the raging demon by sheer durability from Akuma, as well as Jin, whom didnt die
    after killing Azazel and destroying his body in order to end him, which brings
    death to others who do so) *Fear Inducement (scales from Lars and Jin, whom were
    being unaffected by Azazel appearance which can overwhelm those who see it and
    has the power to reduce beings to ashes and also shown to be able to frighten
    others with his appearance) *Fire Manipulation (scales from Heihachi, whom was
    able to resist Jinpachi aura for quite a while till it was too much to handle
    it) *Heat Manipulation (can resist heat from lava nearby, scales from Kazuya who''s
    body survived a fall in lava) *Cold Manipulation (Mishimas manage to fight for
    prolonged periods of time during a heavy rain storm) *Wind Manipulation (scales
    from Jin and Kazuya, whom even in an exhausted state, werent flinched by a massive
    tornado coming their way and engulfing them) *Smoke Manipulation (arent bothered
    by the toxic smoke emanated from a volcano) *Radiation Manipulation (has resisted
    a Jack self destructing, as well as scaling from Lars, whom resisted a Jack self
    destructing, with the Jacks running on Plutonium)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
