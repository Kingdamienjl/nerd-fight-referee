    Creation (could generate barriers for protection) *Flight (gained the ability
    to fly) *Body Control (Can move parts of their body unlike a human would be able
    to) *Bodily Weaponry (Artificial; Has a pivot gun integrated to them, which would
    allow for punching with bullets out of their fists if they wish) Gun Jack (Devil
    Within)= All previous abilities to a higher degree plus: *Verse universal abilities
    (Ki Charge) *Energy Projection (Can shoot beams or balls of energy out of their
    canon hands) All previous abilities to a higher degree plus: *Verse universal
    abilities (Rage; Armor; Ki Charge) *Self-Destruction (Able of blowing themselves
    up kamikaze style) All previous abilities to a higher degree plus: *Verse universal
    abilities (Ki Charge) *Technology Manipulation & Healing (Can fix themselves and
    heal their health after being hit by a laser) All previous abilities to a higher
    degree plus: *Verse universal abilities (Rage, Ki Charge) *Elasticity (Able to
    elongate their limbs) *Improved Flight (Uses a jetpack to fly) All previous abilities
    to a higher degree plus: *Verse universal abilities (Rage; Armor; Ki Charge) *Extrasensory
    Perception (Power Reading) (multiple characters can sense through the others fists
    their negative desire and if they have some power or not) *Possibly Non Physical
    Interaction (fighters are capable of interacting with Kazumi like normal despite
    being a ghost) *Limited Power Mimicry (Was capable of copying King moves after
