- id: claim-weaknesses-6ba39f0d
  section: weaknesses
  axis: weakness
  text: 'Prone to rage when provoked about his mother, which can lead to reckless
    actions; lacks formal weaponry training compared to armed foes; emotional ties
    to allies can be exploited. Feats: * Defeated Marshall Law in a wildcard fight
    to enter the Iron Fist Tournament. * Overcame Miguel Rojo in a rage-fueled bout,
    nearly killing him. * Survived an assassination attempt by Nina and Anna Williams.
    * Narrowly defeated Yoshimitsu, countering his ninjutsu and swordplay. * Endured
    brutal attacks from Bryan Fury''s ammunition belt and cyborg-enhanced strength,
    turning the fight around by jumping on him and using his mother''s teachings.
    * Defeated his father Kazuya Mishima in armed combat, dodging and countering dual
    moon axes, sparing his life to end the violence. * Became a symbol of hope, leading
    to salutes from former enemies like the Jackhammers.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
