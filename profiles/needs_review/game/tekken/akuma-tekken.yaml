    are capable of interacting with Kazumi like normal despite being a ghost) *Martial
    Arts *Death and Pain Manipulation (Via Shun Goku Satsu/Raging Demon, a technique
    which forces death upon its victim through the weight of their own sins, and not
    by Akuma''s fist. The eviler the victim is, the more they suffer in death) *Energy
    Manipulation, Fire Manipulation and Electricity Manipulation (can attack with
    ki based projectiles known as gohadokens, even fire based projectiles like shakunetsu
    or generate electric ones in his palms) *Aura (can generate an aura) *Teleportation
    and Intangibility (via Ashura Senku, he can teleport short distances and phase
    through others, like a phantasm) *Transformation (can transform into his Shin
    Akuma form) *Resistances to Heat Manipulation and Smoke Manipulation (can resist
    lava nearby and toxic smoke from a volcano without being bothered) *Healing (can
    heal his own health during a fight) *Limited Power Nullification (via parrying,
    he can nullify any physical blow thrown at him)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
