  section: abilities
  axis: hax
  text: '*Verse universal abilities (Rage; Ki Charge) *Superhuman Physical Characteristics
    *Acrobatics *Chi Manipulation (Can enhance the strength of his attacks) *Automatic
    Translation (All characters in the cast can understand each other speaking their
    respective languages) *Immortality (Type 1; he is stated as ageless in his bio)
    *Flight (Capable of levitation) *Telekinesis (Displayed the ability to crush or
    ragdoll opponents with telekinesis) *Size Manipulation (A rat consuming his blood
    made it become gigantic, also shown himself reaching heights towering over skyscrappers)
    *Portal Creation (Has opened portals to have others like him come out, as well
    as for himself) *Mind Manipulation (he manipulated the mind of Nina to have her
    assassinate Jin) *Soul Absorption (Stated to have soul absorbing powers and that
    he is searching for strong souls) *Skilled Martial Artist (Known as a god of fighting,
    has several moves from other characters incorporated to his style) *Limited Power
    Nullification (can nullify physical blows thrown at him) *Transformation (can
    transform into his other form) *Energy Projection and Homing Attack (Can shoot
    energy blasts which follow the target) *Large Size (Type 0; is as tall as Kuma)
    *Teleportation (Displays the ability of teleporting) *Fire Breath (Breathes fire
    out of his mouth) *Enhanced Senses and Poison Manipulation (His right hand is
    a snake or a bunch of them, which can be used to inject venom via biting the opponent)
    *Damage Reduction (Can make himself invincible for a short duration) *Large Size
    (Type 0; much taller than his previous form) *Limited Air Manipulation (A swipe
    from his hands send powerful gusts of air or create spirals of air akin to tornadoes)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
