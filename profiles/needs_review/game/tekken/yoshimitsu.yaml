    - field: powers_and_abilities
      value: '*Verse universal abilities *Superhuman Physical Characteristics *Acrobatics
        *Chi Manipulation (Can enhance the strength of his attacks) *Automatic Translation
        (All characters in the cast can understand each other speaking their respective
        languages) *Extrasensory Perception (Power Reading) (multiple characters can
        sense through the others fists their negative desire and if they have some
        power or not) *Possibly Non Physical Interaction (fighters are capable of
        interacting with Kazumi like normal despite being a ghost) *Skilled Martial
        Artist and Swordsman (Has learned the advanced manji ninja arts and manji
        style jujitsu) *Animal Manipulation (Can ride a horse) *Pseudo-Flight (Can
        use his sword as a propeller to fly, one of his suits has wings to fly) *Soul
        Absorption and Possession (Can absorb the opponent soul and take possession
        of them with his soul injected inside) *Non Physical Interaction (many of
        his moves are capable of splitting the opponent soul in pieces) *Statistics
        Amplification and Aura (Explosive) (the evil blade gives him an aura around
        the body capable to push incoming opponents upwards when in the middle of
        attacking and buff him to a point he beats an opponent that gave him trouble
        before) *Duplication (Shown to create duplicates of himself) *Invisibility
        (Can turn his body completely invisible) *Self-Healing (Can recover his own
        health with several techniques of his) *Poison Manipulation (Spews poisonous
        gas from his mouth) *Power Mimicry (Able to copy the moves of other characters
        thanks to his sword) *Teleportation (Capability of teleporting away) *Limited
        Power Nullification (Capable of nullifying energy based attacks) *Intangibility
        (Can phase through attacks) *Cyborgization (Partial. His left hand is mechanical)
        *Aura (His sword Yoshimitsu emanates an aura) *Sealing (His sword Fumaken
        can seal the power of his evil blade) *Smoke Manipulation (Has smoke bombs
        and can also disperse himself as haze) *Light Manipulation (Has a bomb that
        flashes a blinding light) *Shown being bulletproof with his armor'
