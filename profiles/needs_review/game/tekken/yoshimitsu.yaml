      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Yoshimitsu''s primary sword is cursed, and without a steady flow of
        villains to slay with it, it will ultimately drive him insane. Notable Attacks/Techniques:
        *Poison Breath: Yoshimitsu releases a poison breath from his mouth, which
        damages the opponent. *Suicide: Yoshimitsu places himself behind the opponent,
        then stabs himself and the opponent in the process. *Soul Siphon: Yoshimitsu
        grabs the opponent head and starts absorbing health in order to replenish
        his own. *Sword Stab: Yoshimitsu raises his sword and stabs the opponent.
        *Supreme Soul Stealer: Yoshimitsu assumes a stance and waits for the opponent
        to attack, then counters with his chi after being hit. *Rage Art: Yoshimitsu
        slashes through the opponent with both swords multiple times before finishing
        the move with a Moonsault Slayer. ==Gallery == File:Yoshimitsu 1.png|Yoshimitsu
