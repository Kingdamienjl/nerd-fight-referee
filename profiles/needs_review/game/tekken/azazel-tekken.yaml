  text: All previous abilities, but to a higher degree *Possession (Were able to overcome
    the Devil Gene from controlling their mind and body) *Soul Absoption (Scales from
    Heihachi, whom managed to resist Ogre absorbing his soul despite likely taking
    it from other fighters and died, as well as scaling from Jin, for still having
    the devil gene when Ogre tried the same on him and resisted having his Devil Gene
    taken away by Kazuya himself) *Death Manipulation (Scales from Heihachi, whom
    survived the raging demon by sheer durability from Akuma, as well as Jin, whom
    didnt die after killing Azazel and destroying his body in order to end him, which
    brings death to others who do so) *Fear Inducement (Scales from Lars and Jin,
    whom were being unaffected by Azazel appearance which can overwhelm those who
    see it and has the power to reduce beings to ashes and also shown to be able to
    frighten others with his appearance) *Fire Manipulation (Scales from Heihachi,
    whom was able to resist Jinpachi aura for quite a while till it was too much to
    handle it) *Heat Manipulation (Can resist heat from lava nearby, his body even
    survived a fall in lava, also scales from Jin, whom is capable of fighting Jinpachi
    in a volcanic like environment) *Smoke Manipulation (Aren't bothered by the toxic
    smoke emanated from a volcano) *Cosmic Radiations (Scales from Jin, who can survive
    in the vacuum of space)
  source_ids: *id003
  decisive: true
