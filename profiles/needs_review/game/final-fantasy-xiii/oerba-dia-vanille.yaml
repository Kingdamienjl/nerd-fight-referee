      value: "None notable Feats: \u2022Fought and defeated High-tier Fal'Cie such\
        \ as Orphan and Barthandelus \u2022Fought Caius Ballad on several occasions\
        \ \u2022Pushed back the Chaos that was devouring the Fabula Cosmology \u2022\
        Fought Bhunivelze and ultimately proved to be superior to him Note: Message\
        \ me on Discord in case you want to discuss anything regarding this page (Vanta\
        \ #2717) [1]: Fal'Cie Adam is a man-made Fal'Cie while the original Fal'Cie\
        \ are made by gods, Lindzei and Pulse. So what difference does it make you\
        \ may wonder as terms such as God, demigod, devil etc have no real value when\
        \ you're scaling the characters. Let's break down this argument into two different\
        \ sections. border|center|frameless|600x600px Section 1: P: \"Imagination\
