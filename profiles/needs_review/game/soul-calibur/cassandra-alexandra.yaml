- id: claim-weaknesses-7a200a45
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: *Final Crush: Cassandra slashes
    her opponent then knocks them over with her butt. She then jumps towards & sits
    on the opponent''s face with clouds of pink hearts appearing. She places her shield
    & sword over her butt before smashing down once more with a pink heart covering
    part of the screen. *Shield Super Nova: Cassandra slams her shield downward and
    kicks her opponent upward. Once her opponent lands, she slashes them upward to
    punch them with her lightning-imbued shield. *Shield Big Bang: Cassandra does
    an extended version of the Shield Super Nova where she slashes and kicks her shield
    as it ricochets back and forth towards her and her opponent, before slashing them
    upward to punch them with her lightning-imbued shield.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-918ee11b
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Sword and Shield Mastery, Adept Hand\
    \ to Hand Combatant, Holy Manipulation via \u03A9 Sword, Statistics Amplification\
    \ via Soul Charge, Resistance to Corruption, Madness Manipulation (Type 2), Soul\
    \ Manipulation and Mind Manipulation (Wears holy garments made to fight against\
    \ Malfested and Soul Edge, giving her some level of protection against its powers).\
    \ All Original Timeline Abilities, Electricity Manipulation. Optional Equipment\
    \ (Original Timeline)= Pierces through defenses, Poison Manipulation and Life\
    \ Manipulation via Dark Blade (Drains Life Force when it damages the foe as well\
    \ as poisons them), Life Manipulation via Katzbalger (Drains the life force of\
    \ opponents to heal the user), Healing and Regeneration (Low) via Red Crystal\
    \ Rod & Red Line Shield, Passive Attack Amplification and Life Manipulation via\
    \ Ivan the Terrible (Drains life force of the opponent to heal the user), Self\
    \ Empathic Manipulation, Holy Manipulation, Passive Durability Amplification and\
    \ Regeneration (Low) via Valkyrie (Increases the user's courage so that they can\
    \ unleash their full potential). Optional Equipment (New Timeline)= Pierces through\
    \ defenses, Poison Manipulation and Life Manipulation via Dark Blade (Drains Life\
    \ Force when it damages the foe as well as poisons them), Self Empathic Manipulation,\
    \ Holy Manipulation, Passive Durability Amplification and Regeneration (Low) via\
    \ Valkyrie (Increases the user's courage so that they can unleash their full potential)."
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
