  axis: hax
  text: Soul Manipulation (Can rob the souls of entire armies at once), Madness Manipulation
    (Type 2; Even so much as contact with Soul Edge's power is enough to turn one
    insane. Turned countless people across the world insane with the release of the
    Evil Seed), Unholy Manipulation, Chaos Manipulation, Curse Manipulation, Corruption
