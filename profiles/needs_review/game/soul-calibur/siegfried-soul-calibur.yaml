- id: claim-weaknesses-deda6180
  section: weaknesses
  axis: weakness
  text: 'Normal human weaknesses. Notable Attacks and Techniques: *Soul Conviction:
    He shouts "Get ready!", then uses his sword to knock the opponent in the air and
    brings them down. He then powers up Soul Calibur by raising it into the sky, yelling
    "Prepare to die!". As the foe stands up, he slashes his blade through them vertically,
    sending crystals everywhere as the opponent drops dead, consumed by blue flames.
    Or Siegfried turns back saying "Taste... My blade!", and then he releases a single
    launcher. There''s a blue shining sphere at the end of his sword during the attack.
    *Legacy Testament: Siegfried raises his sword above his head and stabs it into
    the ground. This causes a trail of crystal spikes to appear in the direction of
    his opponent. *Ashen Blitz: That''s a hardly recognizable inverse version of Terror
    Slap. If Siegfried succeeds in delivering the blow, time freezes for a while.
    This long-range horizontal high attack is always followed with a blue-white trace.
    New Timeline *Dark Legacy: When weakened, Siegfried will enter this powered up
    state. He obtains a powerful aura and gains access to a new set of attacks. **Soul
    Wave: Likely due to the remnants of Soul Edge''s power still within him, Siegfried
    has access to Nightmare''s Soul Wave technique in which steals the souls of those
    hit by it. Note: Siegfried only has the abilities of Soul Edge during the events
    of Soul Calibur ll. As such in a match, Siegfried can only have Soul Edge if Soul
    Calibur ll Siegfried is chosen. However, as a result only Soul Edge may be used
    in that situation.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a925c19a
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Sword Mastery, Enhanced Senses, Extrasensory
    Perception, Energy Manipulation, Electricity Manipulation (Via his father's spirit).
    All previous abilities, Soul Manipulation (Can rob the souls of entire armies
    at once. Deals Soul Damage with each of attacks, stealing the soul of his opponent
    slowly during combat), Fire Manipulation, Chaos Manipulation, Unholy Manipulation,
    Mind Manipulation (Can manipulate the minds of others in order to coerce them
    into taking Soul Edge. If there is a malfested target, Soul Edge feeds off of
    their sinful actions of bloodlust and gains the ability to control them), Weapon
    Mastery, Electricity Manipulation, Creation (Created a mimic of Soul Edge as well
    as Astral Chaos), Dark Magic, Regeneration (Low), Immortality (Types 1 and 6),
    Teleportation, Dimensional BFR (Can send others to Astral Chaos. All Souls taken
    by Soul Edge are sent to Astral Chaos. Astral Chaos warps and corrupts all who
    enter, mind, body and soul, eventually driving them mad and turning them into
    a form of Malfested), Duplication, Light Manipulation, Possession, Reality Warping,
    Spatial Manipulation (Can cut through dimensions), Necromancy, Madness Manipulation
    (Type 2. Simply being in contact with its power is enough to drive one into madness.
    Can corrupt entire areas making it so that anyone who enters the area will be
    driven mad), Illusion Creation, Curse Manipulation, Corruption (Can turn those
    who come into contact with it into mindless Monsters, Vampires, Malfested, etc.
    Even sustaining injuries from him or any wielder of Soul Edge is enough to drive
    one insane as shown with Raphael whose body became corrupted by his wounds. Coming
    into contact with a malfested's blood can in fact infect another as shown when
    Amy became malfested by treating Raphael's wounds), Resistance to Sealing. All
    previous abilities minus Soul Edge abilities, Ice Manipulation, Self-Resurrection
    (Despite being killed in his battle with Nightmare, Soul Calibur sensed his willpower
    and revived him from the dead) with Soul Calibur, Sealing, Holy Manipulation,
    Teleportation, Dimensional Travel, Purification, Resistance to Mind Manipulation,
    Madness Manipulation (Managed to break free and resist Soul Edge's control) and
    Soul Manipulation (Can fight Nightmare and not have his soul stolen by Soul Edge).
    All previous abilities minus Soul Calibur and Soul Edge abilities, Ice Manipulation
    (Despite not having Soul Edge, he can still create ice crystals as attacks) Superhuman
    Physical Characteristics, Fire Manipulation, Electricity Manipulation, Sword Mastery,
    Statistics Amplification with Soul Charge, Soul Manipulation with Soul Wave, Resistance
    to Mind Manipulation, Madness Manipulation, Corruption, Possession (After being
    freed, resisted Soul Edge's attempts to control him. Was able to enter and fight
    within Astral Chaos without being corrupted or going mad) and Soul Manipulation
    (Resisted getting his Soul taken by Soul Edge when Inferno was defeated). Optional
    Equipment (Original Timeline)= Regeneration (Low) with Atlas Sword, Passive Durability
    Amplification with Claymore, Passive Attack Amplification with Gram, All Soul
    Edge and Soul Calibur abilities with Broken Destiny. Optional Equipment (New Timeline)=
    Passive Attack Amplification with Gram.
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
