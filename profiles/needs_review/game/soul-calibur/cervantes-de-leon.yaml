    Illusion Creation, Curse Manipulation (Its curses can turn others into mindless
    Monsters, Vampires and other things), Corruption, Chaos Manipulation, Unholy Manipulation,
    Dimensional BFR (Can send others to Astral Chaos where their minds, souls and
