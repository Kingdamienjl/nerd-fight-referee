- id: claim-weaknesses-759b2538
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: *Seong''s Blazing Heaven''s
    Wheel: In Seong Mi-na''s Critical Finish, she throws her opponent into the air
    using her weapon, twirls them up high with flames then throws them back down and
    pushes her weapon through her opponent''s heart. *Heavenly Crystal Smasher: This
    Weapon Art consists of three different consecutive moves. Seong Mi-na begins with
    her Heaven''s Wheel attack, after which the opponent bounces off the ground, then
    comes her Spring Splash Esoterica, the enemy is thrown even higher in the air,
    and at last, time slows down, as Mi-na spins her sword engulfed by colored flame
    above her head, saying "How''s... this!", and delivers the final blow, that smashes
    the opponent back to the ground and stuns him. If the last strike, which seem
    to be her new move, is landed successfully, it''s accompanied with a tremor and
    explosion of yellow dust. *Seong''s Crushing Long Blade: Mi-na climbs up her sword
    and says "Dodge... this!" and unleashes a successful blow that results in smashing
    the opponent down with a tremor and a yellow dust explosion. *Dance of Binoculars
    Cranes: Seong Mi-na twists her sword vertically, swapping her hands in the attack
    and saying "Now...", then delivers one horizontal attack and right after that
    she says ''It''s over!", before unleashing the last vertical attack, that sends
    the opponent high in the air. Note: Many of Mi-na''s abilities come from the various
    weapons she can equip. As such, in battle the creator should specify what weapon(s)
    she is allowed to have.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
