- id: claim-weaknesses-91440979
  section: weaknesses
  axis: weakness
  text: 'Must keep devouring souls in order to stay alive as he is an empty suit of
    armor with no actual wielder for the sword, he is actually the sword rather than
    the armor that wields it, meaning that breaking the sword will kill him Notable
    Attacks and Techniques: *Soul Wave: Unleashes a burst of red energy the absorbs
    the souls of all those in range by stabbing the ground with Soul Edge. Another
    method shown is that Nightmare bows down, crossing his hands and storing energy,
    as we can see electric bolts gather around him. A stage starts to shake and by
    straightening up and shouting "Hate!" Nightmare releases a crimson energy sphere
    now accompanied with an additional ring of light and explosion sound. *Evil Seed:
    Nightmare exclaims "Watch this!" and punches the opponent with his claw, knocking
    his foe backwards. He uppercuts him/her into the air, then slams his sword point
    first into the ground and a ball of energy erupts around his opponent as they
    scream. This move drains their soul into Soul Edge. *Dark Reconquista: Nightmare
    holds his sword up, calls for it, saying "Soul Edge", and does one heavy vertical
    slash to knock his opponent to the ground while saying "Burn!". *Grim Lord: This
    consists of four hits: the first one is a rather strong middle kick attack, which
    works like a launcher, so that the next attack can catch an enemy in mid-air.
    Then, Nightmare grabs his opponent with his twisted arm and then unleashes the
    most damaging blow with a bursting sound, by emitting dark red energy which surrounds
    him, forming a sphere. *Bloody Invasion: At the beginning he raises his hand and
    then hits it heavily against the ground saying, "Run if you can" and creating
    a tremor. *Death Row: This is a part of a Brave Edge move called Death Lord''s
    Annihilation. There are two hits in this Weapon Art. The first one is a high punch
    which knocks an enemy down and then goes a middle long-range stabbing attack with
    Nightmare whirling his sword in colored flames and saying "Ravage!".'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2e647e3f
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Soul Manipulation (Can rob the souls
    of entire armies at once. Deals Soul Damage with each of attacks, stealing the
    soul of his opponent slowly during combat), Fire Manipulation, Chaos Manipulation,
    Unholy Manipulation, Mind Manipulation (Can manipulate the minds of others in
    order to coerce them into taking Soul Edge. If there is a malfested target, Soul
    Edge feeds off of their sinful actions of bloodlust and gains the ability to control
    them), Weapon Mastery, Electricity Manipulation, Creation (Created a mimic of
    Soul Edge as well as Astral Chaos), Dark Magic, Regeneration (Low), Immortality
    (Types 1 and 6), Teleportation, Dimensional BFR (Can send others to Astral Chaos.
    All Souls taken by Soul Edge are sent to Astral Chaos. Astral Chaos warps and
    corrupts all who enter, mind, body and soul, eventually driving them mad and turning
    them into a form of Malfested), Duplication, Light Manipulation, Possession, Reality
    Warping, Spatial Manipulation (Can cut through dimensions), Necromancy, Madness
    Manipulation (Type 2; Simply being in contact with its power is enough to drive
    one into madness. Can corrupt entire areas making it so that anyone who enters
    the area will be driven mad), Illusion Creation, Curse Manipulation, Corruption
    (Can turn those who come into contact with it into mindless Monsters, Vampires,
    Malfested, etc. Even sustaining injuries from him or any wielder of Soul Edge
    is enough to drive one insane as shown with Raphael whose body became corrupted
    by his wounds. Coming into contact with a malfested's blood can in fact infect
    another as shown when Amy became malfested by treating Raphael's wounds), When
    the host body is defeated, Inferno will appear to fight the opponent or use his
    mental powers to get them to grab the sword, Enhanced Senses, Extrasensory Perception,
    Resistance to Sealing (Taki's seals had no effect on him). All previous abilities
    + Possession (Can possess the living and the dead), Power Mimicry (Can copy the
    fighting style of anyone it sees), Incorporeality (Is the will of Soul Edge).
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
