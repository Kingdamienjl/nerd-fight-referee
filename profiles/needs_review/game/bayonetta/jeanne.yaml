        \ famed demon-smith, Rodin, and crowned with the names Athos, Porthos, Aramis,\
        \ and D'Artagnan. Pushing one's magical powers to their limits, these guns'\
        \ rate of fire and stopping power are incredible. *Garnet Roses: Shotguns\
        \ containing the souls of fairies, known to collect the Garnet Roses that\
        \ only bloom in Inferno. Each shell fired from the guns contains the curse\
