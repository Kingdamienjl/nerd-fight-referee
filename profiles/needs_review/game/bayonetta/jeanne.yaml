  intelligence:
    text: Gifted (Jeanne has several centuries of combat experience on her resume,
      having lived for over 600 years while needing to fight the forces of Paradiso
      on a daily basis in order to fulfill her agreements with the Demons of Inferno.
      Jeanne is also a master of the Bullet Arts, a unique fighting style developed
      by the Umbra Witches which utilizes acrobatic strikes using the hands and feat
      and incorporated aspects of dance, possessing proficiency potentially surpassing
      that of Bayonetta herself. Bullet Arts primarily uses firearms to combine gunfire
      with hand-to-hand combat, but can also be used with other weapons such as swords,
      whips, scythes, hammers, and many more, often wielding 4 weapons at once on
      both the hands and feet. Jeanne notably survived through the witch hunts alone,
      being the only surviving witch aside from Bayonetta, whom she sealed away to
      protect. Her skill also extends to her magic, having mastered difficult techniques
      of the dark arts such as Witch Time and Wicked Weaves. Furthermore, Jeanne is
      a highly skilled operator of vehicles being capable of fighting off a massive
      airborne army of both Infernal Demons and Angels of Paradiso in a fighter jet,
      and making her way up a launching space rocket on a motorcycle while being attacked
      by several angels. Her pact with Madama Styx also grants her great power and
      knowledgeable counsel.)
    source_ids: *id002
    confidence: 0.95
