        witches have, this allows Jeanne to increase her speed and slow down time
        to an extreme degree. To the points where flying rocks seem slow, where water
        drops to turn to ice when touched, and seconds can last an entire boss fight.
        This is the potentially the single most devastating ability in her arsenal,
        making her nearly impossible to hit if she isn''t blitzed first and allowing
        her to pummel targets without retaliation. Wicked Weave: A technique to manipulate
        her hair to increase the strength of her attacks. Her form-fitting catsuit
        is actually formed from her hair; when using her hair for attacks or effects,
        Jeanne is momentarily unclothed with her intimate regions obscured by whirling
        weaves of hair. When she jumps, she can create butterfly-like wings on her
        back to allow her to float for a short time or even fly by the events of the
        second game. Witch Walk: Another ability that all witches have, Jeanne is
        able to ignore gravity''s bonds and walk on any surface. Beast Within: A series
        of transformational techniques that Jeanne can use to shape shift into different
        animals that grant her new abilities. *Lynx Within: Jeanne transforms into
        a red lynx, granting her increased movement speed and longer jumps. *Owl Within:
        Jeanne transforms into a large owl, giving her the ability to fly for a short
        period of time and shoot homing feathers. *Moth Within: A defensive technique
        that, by successfully dodging an attack at the very last second, briefly transforms
        Jeanne into a swarm of moths and push away nearby enemies. Witch Time will
        also activate once Jeanne reforms. *Centipede Within: Jeanne transforms into
        a long centipede that allows her to glide through underwater locations whenever
        this is activated. This form acts as an underwater equivalent to Lynx Within.
        Infernal Kiss: Jeanne blows a kiss, sending a trio of heart-shaped projectiles
        at the target, an otherwise impassible angelic seal. This opens a small portal
        to Inferno that shatters the seal. *Heart Shot: A variation of Infernal Kiss
        that allows Jeanne to shatter barriers by launching several bullets at them
