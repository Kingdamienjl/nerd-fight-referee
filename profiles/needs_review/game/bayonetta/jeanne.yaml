- id: claim-weaknesses-f8a5cc0c
  section: weaknesses
  axis: weakness
  text: 'The Umbran Watch is a vital object to Jeanne''s life force and the source
    to her immortality and if damaged or destroyed could result in significant loss
    of stamina or even death. Notable Attacks/Techniques: Witch Time: A common ability
    and most valuable of Jeanne''s. Witch time is an ability that all witches have,
    this allows Jeanne to increase her speed and slow down time to an extreme degree.
    To the points where flying rocks seem slow, where water drops to turn to ice when
    touched, and seconds can last an entire boss fight. This is the potentially the
    single most devastating ability in her arsenal, making her nearly impossible to
    hit if she isn''t blitzed first and allowing her to pummel targets without retaliation.
    Wicked Weave: A technique to manipulate her hair to increase the strength of her
    attacks. Her form-fitting catsuit is actually formed from her hair; when using
    her hair for attacks or effects, Jeanne is momentarily unclothed with her intimate
    regions obscured by whirling weaves of hair. When she jumps, she can create butterfly-like
    wings on her back to allow her to float for a short time or even fly by the events
    of the second game. Witch Walk: Another ability that all witches have, Jeanne
    is able to ignore gravity''s bonds and walk on any surface. Beast Within: A series
    of transformational techniques that Jeanne can use to shape shift into different
    animals that grant her new abilities. *Lynx Within: Jeanne transforms into a red
    lynx, granting her increased movement speed and longer jumps. *Owl Within: Jeanne
    transforms into a large owl, giving her the ability to fly for a short period
    of time and shoot homing feathers. *Moth Within: A defensive technique that, by
    successfully dodging an attack at the very last second, briefly transforms Jeanne
    into a swarm of moths and push away nearby enemies. Witch Time will also activate
    once Jeanne reforms. *Centipede Within: Jeanne transforms into a long centipede
    that allows her to glide through underwater locations whenever this is activated.
    This form acts as an underwater equivalent to Lynx Within. Infernal Kiss: Jeanne
    blows a kiss, sending a trio of heart-shaped projectiles at the target, an otherwise
    impassible angelic seal. This opens a small portal to Inferno that shatters the
    seal. *Heart Shot: A variation of Infernal Kiss that allows Jeanne to shatter
    barriers by launching several bullets at them in a heart-shaped formation. Torture
    Attacks: Jeanne can summon a variety of torture tools, classical and modern, to
    slaughter her foes in exceedingly gruesome ways. These attacks range from dropping
    10 ton weights, decapitation by guillotine, placing them into a grinder, burning
    them, hanging them, crushing them to death, using the Iron Horse (a contraption
    meant to cut into a victim''s genitalia and eventually tear them half), and pulling
    out a chainsaw to bisect foes. Umbran Climax: A technique that allows every attack
    performed to be powered up and strengthened for a short duration. Climax Attacks
    (Summoning Demons): Jeanne chants a phrase and summons a Demon from Inferno to
    finish off the enemy for good. When a witch reaches high enough level of spiritual
    energy, they can casually summon demons at the snap of the finger. The Infernal
    Demons, also known as Infernals, are the supernatural inhabitants of Inferno that
    can be summoned by the Umbra Witches as part of their role of maintaining the
    darkness. These demons bestow witches with great power and wisdom and are mainly
    used to fight and hunt down the angels. However, this power comes at a high price.
    If a witch does not sacrifice angels every day or she dies/is killed, she is forced
    to fulfill the contract to the demon she made a pact with and her soul is dragged
    down to Inferno for the eternity. *Madama Styx: Also known as the Decider of Ends,
    she is the demoness who Jeanne has made a pact with in order to use her power
    in combat. Queen of the River Styx, the boundary between humanity and Hades, Madama
    Styx is said to be a moth living within the human world. These insects, born from
    the magical power that flows from a woman''s body, are charged with luring the
    souls of sinners into Inferno. By trading their soul to Madama Styx, one is able
    to obtain great power and knowledgeable counsel. *Gomorrah: A monstrous creature
    hailing from the demonic wood, Johnson Forest. Taking the form of a dragon, it
    is incredibly fierce, identifying all that moves as game and devouring its prey.
    Territorial, it is most likely to be found alone. *Malphas: An enigmatic raven-black
    bird shrouded in the mysteries of the sky. Ever curious, Malphas has filled itself
    with all the world''s knowledge and mysteries. However, this same curiosity has
    led to a rather brutal demeanor, causing the bird to tear those it encounters
    to shreds with its sharp beak and razor-like talons. *Hekatoncheir: Also known
    as the Shatterer of the Earth, it is an unseen demon with large, powerful arms
    capable of shattering mountains. Lacking knowledg'
  source_ids: *id003
  decisive: false
