- id: claim-powers-and-abilities-557d2e5b
  section: abilities
  axis: hax
  text: Umbra Witch Physiology, Skilled Hand-to-Hand Combatant, Acrobatics, Skilled
    with a large variety of weapons, Toon Force and Elasticity (Able to recover from
    being crushed flat), Enhanced Senses, Healing (Green Herb Lollipops and Red Hot
    Shot), Deconstruction (Bazillions break down molecular bonds within the target),
    Fire Manipulation (With Kali and Rusalka), Electricity Manipulation (With Kali),
    Ice Manipulation (With Karen and Rusalka), Poison Manipulation (With Samsa), Statistics
    Amplification, (When held by a female, Rasetsu increases the user's power by tenfold;
    Bloody Rose Lollipop increases attack power temporarily), Curse Manipulation (Those
    who can hear the crack of Alruna have Alrune's curse whispered into their ears;
    shells from Garnet Roses contain the curses of trapped fairies), Empathic Manipulation
    (Gaze of Despair makes enemies go berserk), Damage Negation (Via Pulley's Butterfly),
    Attack Reflection (Via Moon of Mahaa-Kalaa), Duplication (Via Surgey's Lover),
    Immortality Negation (Type 4; Those devoured by greed are cut off from the cycle
    of death and rebirth), Disease Manipulation (This summon leaves trails of the
    plague), Resistance to Soul Manipulation (Her soul was left intact despite being
    absorbed over the course of twenty four hours by Alraune), Mind Manipulation/Madness
    Manipulation (Was unaffected by Alraune's insanity inducing poison being injected
    into her soul for almost a full twenty four hours), Time Manipulation, and Curses
    (Unaffected by the curse that her weapon Karen instills upon the user)
  source_ids: *id003
