        \ depths of Inferno, brimming with mystery. One legend states that it is the\
        \ twin sword to Shuraba. It is also said the sword's name comes from the story\
        \ of a witch who loved the sword, and was excommunicated for carrying out\
        \ a futile war against the angels. While the sword did not contain the soul\
        \ of a demon, the Angel Slayer displays incredible power. *Vritra:A possessed\
        \ whip, sealing away the soul of the ancient serpentine demon Vritra. Summoning\
