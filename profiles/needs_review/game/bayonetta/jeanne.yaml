        \ bayonetta render by shardraldevius-d9ivna1.png|Kali Karen.png|Karen ColSlade.png|Col.\
        \ Slade TangLung.png|\u5510\u9F8D -Tang Lung- BloodyMoon.png|Bloody Moon *All\
        \ 4 One: Jeanne's trademark four purple and silver guns. They are based on\
