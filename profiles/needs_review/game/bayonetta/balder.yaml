    - field: standard_equipment
      value: '*The Holy Glaive: The name of Balder''s weapon which he uses in conjunction
        with powerful magic attacks. Wielded as a double bladed staff, the weapon
        can be split into two different blades at the user''s whim. He''s also shown
        the ability to throw it like a boomerang, returning to him should he miss
        his target. *Feather Darts: Feather-like darts that Balder uses in place of
        a gun. They are comparable in power to Bayonetta''s Love is Blue and Scarborough
        Fair handguns. *Satellite: Balder has access to satellite-based weaponry orbiting
        the planet, commandeering them using the power of his mind and either utilizing
        their particle beam cannon, producing a concentrated blast of energy to shoot
        down unsuspecting targets, or having it fall out of orbit landing atop of
        them.'
      source_id: vsbattles-balder-bayonetta
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (Balder is an extremely powerful and cunning Lumen Sage, carrying
        centuries of experience and setting forth the plot of the first game and near
        perfectly manipulating events in his favor. His plot to resurrect Jubileus
        was near successful, having only failed due to Jeanne's unexpected survival
        and saving of Bayonetta. Has advanced knowledge of magic, being able to master
        difficult light arts techniques such as Light Speed. Possesses combat prowess
        proving him to be a difficult opponent for the likes of Bayonetta herself
