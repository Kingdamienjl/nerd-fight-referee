        regenerated from an enhanced bullet lipstick to the head from Bayonetta),
        Mind Manipulation (brainwashed Jeanne), Electricity Manipulation, Fire Manipulation
        and Magma Manipulation, Flight, Forcefield Creation, Summoning, Non-Physical
        Interaction, Extrasensory Perception, Cosmic Awareness (is said to have achieved
        near omniscience), Technopathy, Invisibility and Intangibility (within Purgatorio),
        Portal Creation and Dimensional Travel, Shapeshifting, Telekinesis, Telepathy,
        Self-Sustenance (Type 1 and Type 2) All powers are the same, additionally;
        Weapon Mastery (uses a glaive), Danmaku (can use his feathers to barrage enemies),
        has several abilities through Summoning with the Cardinal Virtues: * Greater
        Fire and Magma Manipulation (with Fortitudo) * Weather and Air Manipulation
        (with Temperantia) * Corrosion Inducement, Poison, Acid, and Plant Manipulation
        (with Iustitia) * Water and Explosion Manipulation (with Sapientia) With the
        Right Eye; Conceptual Manipulation (Aristotelian Universal) and Creation (the
        Eyes of the World granted humanity free will; wielders of the Eyes wield the
        power of creation), Information Analysis and Clairvoyance (wielders of the
        Eyes can see the past, present, and future of anyone they can look at), Extrasensory
        Perception and Cosmic Awareness (can see all existences and happenings of
        the World of Chaos), has Resistance to deception (the Eyes can see through
        lies)'
