    - field: weaknesses
      value: 'If the Eyes of the World are destroyed he will lose his power. If his
        physical body is destroyed his spirit can be sealed inside another person,
        although whoever this happens to will be corrupted by the essence of pure
        evil. Notable Attacks/Techniques: *Young Loptr: In his child form, Loptr has
        the ability to use similar card attacks to his good counterpart, which he
        can use to lethal effect when disposing of Rosa. When he is fought, he summons
        6 arms created out of blue energy and uses them to punch and grab objects
        for his own uses. The reach of these hands can extend all the way into space,
        as shown when Loptr grabs an asteroid to hurl at Bayonetta. Loptr is also
        capable of projecting swaths of harmful energy and beams of light from the
        ground. *Adult Loptr: In his adult form, Loptr retains most of his abilities
        of being able to manipulate his energy into various forms. The main difference
        lies in the greater power and control he holds as he is now able to manipulate
        multiple objects at once, such as being able to form debris into giant weapons
        as well as summon multiple asteroids as opposed to just one. He is also able
        to create an astral projection of himself as means of combating others just
        as he would if he were fighting physically. He is able to summon up to 6 arms
        in a manner similar to his younger self, though he sparingly uses them all
        at once to allocate greater power to his individual strikes. His greatest
        powers are beams of energy that can cause destruction to anything in their
        path, and his chief power that gave him his title as The Prophetic One, the
        ability to use the Remembrance of Time to show the true nature of the past
        to certain individuals. **Remembrance of Time: A supernatural occurrence that
        allows someone to view things from the past as they truly happened, untainted
        by history. Aesir originally created the Remembrances of Time after he felt
        that existence should be preserved despite the unending flow of time. He created
        them from his observations of the human world to try and remember every detail
        of human life. Whilst he kept most of them in the Garden of God, an area beneath
        the town of Noatun which resided near his holy mountain, Aesir eventually
        created so many Remembrances that even he forgot about them as they were scattered
        across the Earth. *Aesir: Aesir is an all-powerful being that has many powers
        including those of Loki and Loptr together, surpassing Jubileus. He is able
        to use the Eyes of the World to unlock great powers of creation, as well as
        use the Remembrance of Time to bring objects from the span of time to the
        present. He can alter his size at will, create giant projections of his arms
        to attack, project blasts of magical energy and summon various technologies
        from across time/space of the human realm. This includes Valkyrie Military
        Transports, the "System 16" Stunparon satellite laser, Gjallarhorn surface-to-air
        missiles, and a O''Neill cylindrical Space Colony. Greatest of all, however,
        is Aesir''s power of "nothingness". He is able to erase anything and everything
        he chooses from the world. ==Notable Matchups== Victories: Losses: Inconclusive:
