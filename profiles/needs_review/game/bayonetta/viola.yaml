    - field: weaknesses
      value: "Standard Devil Fruit user weaknesses. Notable Attacks/Techniques: Giro\
        \ Giro no Mi (Glare Glare Fruit) is a Paramencia-type Devil Fruit that allows\
        \ the user to see through everything and read the minds of others, allowing\
        \ the user to become an Insight Human (\u773C\u529B\u4EBA\u9593, Ganriki Ningen).\
        \ It was eaten by Viola. * Peeping Mind (\u5FC3\u8997\u304D\uFF08\u30D4\u30FC\
        \u30D4\u30F3\u30B0\u30DE\u30A4\u30F3\u30C9\uFF09, P\u012Bpingu Maindo, literally\
        \ meaning \"Heart Peeping\"): After activating her hand glasses, Viola touches\
        \ her head to the head of another person, allowing her to look into the person's\
        \ mind and memories. Viola is also able to use this technique in reverse,\
        \ allowing her to transfer her memories to the person. * Hierro L\xE1grima:\
        \ Mekujira (\u71B1\u9244\u306E\u6D99\uFF08\u30A4\u30A8\u30ED\u30FB\u30E9\u30B0\
        \u30EA\u30DE\uFF09 \u76EE\u9BE8\uFF08\u30E1\u30AF\u30B8\u30E9\uFF09, Iero\
        \ Ragurima: Mekujira, literally meaning \"Hot Iron Tear: Eye Whale\"): Viola\
        \ secretes one teardrop from each of her eyes. The tears then grow into large\
        \ whales that move to attack whomever they are aimed at by the user. Hierro\
        \ L\xE1grima is Spanish for \"Iron Tear\", while Mekujira is Japanese for\
        \ the corner of one's eye, though the specific kanji reads as \"Eye Whale\"\
        , hence the technique's pun. * Senrigan (\u5343\u91CC\u773C, Senrigan, literally\
        \ meaning \"Clairvoyance\"): This aspect of her fruit allows Viola to send\
        \ out her sight in all directions in a 4000 km radius like a bird. The ability\
        \ was first mentioned by Gladius, who noted that it was strange that Viola\
        \ failed to locate the Thousand Sunny as it approached Dressrossa. The extraordinary\
        \ range of the technique allowed Viola to see everything that was going on\
        \ in the country. The kanji for the ability's name together mean \"clairvoyance\"\
        , but separately they can be read as \"thousand ri sight\", where a ri is\
        \ a unit of measurement in Japan equal to 3927.27 meters. Accordingly, a thousand\
        \ ri is almost 4000 km. ==Gallery== Viola aka violet by bodskih-dbugvkw.png\
