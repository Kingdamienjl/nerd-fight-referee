      value: As Paradiso's former second-in-command, Rodin is an ancient and powerful
        being on par with Bayonetta herself, having sparred with her at her best as
        Father Rodin and Rodin, the Infinite One. He relies almost entirely on his
        fists in combat, but is able to extend his effective range with materializations
        of his fists that are similar to the Wicked Weaves of the Umbra Witches. He
        is also a master blacksmith who created almost all of Bayonetta's preferred
        weaponry, all of which bear enough power to allow grossly outnumbered troops
        to overcome armies of Demons with ease. As a result of his age Rodin is also
        knowledgeable about the structure of the verse's cosmology.
      source_id: vsbattles-rodin-bayonetta
