    - field: standard_equipment
      value: Willbreaker= Oryx's weapon of choice, an enormous ascendant sword that
        is used to activate the Dreadnaught's super weapon. Willbreaker's edge is
        sharp enough to cut through quarks and as its name suggests, it can break
        the wills of others. Its blade is not dulled by age. Each death it trades
        for life hones its edge, gives it weight and gravitas and insistence within
        the vortex of its own totality. Willbreaker transcends liminality. It does
        not have to touch you to wound you. And lastly to be taken in Willbreaker's
        grasp is to be simplified; that is, to be reduced to one's most basic level,
        shedding all higher-order thoughts of fear or duty or selfishness; that is,
        to feel only pain. |-|Tablets of Ruin= After slaying Akka, Oryx took from
        the Worm God's remains the secret to call upon the Deep (the Darkness). He
        wrote this secret upon a set of tablets, which he called the Tablets of Ruin.
        From the secrets written upon these tablets, Oryx learned about the power
        to Take. With the Tablets of Ruin he could also commune with the Deep and
        travel to it, when no other Hive could. |-|Dreadnaught= DreadnaughtGrimoire.jpg|The
        Dreadnaught, accompanied by multiple Hive warships DreadnaughtCinematic.jpg|The
        Dreadnaught after its super weapon annihilated the Awoken fleet DreadnaughtSaturn.jpg|The
        Dreadnaught positioned within the hole it blew in Saturn's ring The Dreadnaught
        is Oryx's flagship. It was made from a piece of the Worm God Akka's corpse
        and is enormous in size, dwarfing even Hive warships. Oryx's throne world
        is housed by the Dreadnaught, giving him the advantage of having a mobile
        realm. The ship's hull is so durable that it was completely unaffected by
        the impact of multiple Harbingers, the Awoken's super weapons, which were
        tearing through the Hive fleet prior. Through the power of the Deep and clever
        systems built into the Dreadnaught by his daughters, Oryx can push part of
        his throne world into reality in order to decimate anything within range.
        This is the ship's paracausal super weapon.
      source_id: vsbattles-oryx-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Supergenius (Oryx is the Hive God of navigation and it is in his nature\
        \ to try and understand everything, a nature he has been living up to for\
        \ billions of years. He knows the secrets of the universe. Oryx took the knowledge\
        \ of Akka to travel into the Darkness itself, a feat few beings in existence\
        \ are capable of. From his communion with the Darkness he learned and wrote\
        \ down how to Take.The Lightblade | Memory of Ruin | Witch Queen Taking is\
        \ an ontological weapon that allows one to reform matter in a self-contained\
        \ reality where the creator controls past, present and future, and it involves\
        \ conducting a mathematical operation on the target. Oryx can wage war against\
        \ Xivu Arath, who is the God of War, and engage in a battle of wits with Savath\xFB\
        n, who is the God of Cunning, though he does not surpass his sisters in these\
        \ areas. Is one of the three founding members of the Hive and the most knowledgeable\
        \ alongside Savath\xFBn.Rites of the Deep | Sloane: \"We Still Have to Deal\
        \ With Oryx's Sisters\" | Heresy Even some lesser Wizards hold knowledge that\
        \ is completely incomprehensible for Ghosts. Lesser Hive are also capable\
        \ of constructing an intergalactic library that holds so much information\
        \ it has broken the Bekenstein limit.Destiny: The World's Grave (mission)\
        \ Even basic Hive technology is indistinguishable from magic to futuristic\
        \ civilizationsShredder), Nigh-Omniscient within his Throne World (Oryx's\
        \ throne world, which is an entire universe of its own, is indistinguishable\
        \ from his own mind, allowing him to be aware of practically everything that\
        \ transpires within itThe Ritual | Threadweaver | Witch QueenThe Final Days\
        \ | The Illusion | The Final Shape)"
