    - field: weaknesses
      value: "Failing to live up to his nature of understanding and curiosity as well\
        \ as failing to uphold his tithe of death to his worm will result in his eventual\
        \ consumption. Killing him in his own throne world makes it much harder, though\
        \ not impossible, for him to return. Notable Attacks/Techniques: |-|Material\
        \ Space= *Acolyte Grenade: Oryx conjures a solar magic explosive and throws\
        \ it at the enemy. It explodes upon contact, leaving behind a pool of fire.\
        \ *Darkness Blast: Oryx fires darkness projectiles of the arc element. *Fist\
        \ of Darkness: Oryx punches the ground, creating a large shockwave capable\
        \ of obliterating his enemies. *Cloud of Darkness: Oryx summons a dark cloud\
        \ of poison on top of his enemies. These clouds deal damage over time, blur\
        \ the enemy's senses, and slow them down. *Wall of Darkness: Oryx raises his\
        \ hand and summons a large shield made of shadows that is impervious to harm.\
        \ *Void Blast: Oryx fires powerful blasts of the void element. *Axion Dart:\
        \ Oryx fires off a flurry of void projectiles that aggressively seek out and\
        \ track enemies, detonating with an explosion of void once they reach their\
        \ target. *Retaliation Swarm: Oryx fires off a set of three void projectiles\
        \ that aggressively seek out and track enemies. These projectiles can be fired\
        \ in response to Oryx taking a hit of any kind. *Darkness Bolt: Oryx throws\
        \ a large orb of darkness at the enemy, dealing arc damage, blinding and deafening\
        \ them. *Malificent Eye: Oryx summons Taken constructs that act as long-range\
        \ stationary turrets, bombarding enemies with a stream of arc energy. *Teleportation:\
        \ Oryx teleports to avoid danger or to reposition himself. *Blight Bomb: Oryx\
        \ summons a blight-like bomb over his enemy's head that burns the area below\
        \ it before exploding. *Grasp of the King: Oryx drains Light from a Guardian,\
        \ disabling all abilities. If he isn't staggered immediately, this triggers\
        \ a second ability. *King's Decree: If he remains uninterrupted too long during\
        \ Grasp of the King, causes instant death that cannot be revived from. Likely\
        \ derived from the Deathsongs created by his daughters. Note that Grasp of\
        \ the King is likely not an absolute prerequisite for this ability, but rather\
        \ it is used first to stop the target from resurrecting in any way. *Darkness\
        \ Dimension: Oryx sends the target to a pocket reality of his own design.\
        \ It's surrounded by an impenetrable mist, which Oryx stays behind. Abilities\
        \ are nullified, along with healing, the slowing of movement speed, and the\
        \ ability to double jump. Staying here too long results in death. *Take: Oryx\u2019\
        s favored ability is an ontological weapon, or ontopathogenic to be more precise,\
        \ meaning it infects the very existence of things. It is heavily implied to\
        \ be the inspiration of the Gorgon's Gaze, another ontological weapon. The\
        \ ability to Take involves conducting a mathematical operation on the target\
        \ and reforming matter in a self-contained reality, where the creator defines\
        \ past, present, and future, imposing a singular origin and all decisions\
        \ that follow. When a being has been Taken, their wounds are healed and they\
        \ return to reality possessed and empowered by Darkness, recasted into a fanatically\
        \ loyal servant of Oryx and closer to their perfect 'shape'. While some Taken\
        \ may seem to retain a degree of independence, this is only because Oryx allows\
        \ it in order to keep his legions interesting. Oryx and all Taken passively\
        \ exude the blight, spreading the corruption of the Taken wherever they go.\
        \ The blight erases existence and warps spacetime around them, while also\
        \ inflicting a statistics debuff over an even larger area. While it is usually\
        \ just a consequence of the Taken's existence and as such passive and unfocused,\
        \ Oryx can consciously use its effects to do things like summon legions of\
        \ Taken on a whim, fill areas with blights, empower other Taken, spawn blights\
        \ directly on top of enemies, corrupt the geography of locations and so forth.\
        \ *Shadow Touched: A debuff inflicted by smaller Taken Blights. This debuff\
        \ disables double jump abilities and teleportation, nullifies any regenerative\
        \ effects, and drastically slows down movement speed while applying damage\
        \ over time. |-|Ascendant Plane= *Truth Killing: Like Akka, Oryx can deny\
        \ a truth until it becomes a lie. *Spite of the King: Oryx fires a continous\
        \ volley Arc projectiles from his mouth, which track targets. *Doxology: Oryx\
        \ calls upon the Darkness and unleashes his full power, resulting in the target's\
        \ power being drained before being annihilated, inflicting an irrevocable\
        \ death beyond what anything else in his arsenal is capable of. Note: The\
        \ Hive abide by a concept of Sword Logic, which is basically the concept of\
        \ \"Might makes Right\" as a law of the universe. While an explanation can\
        \ be found in greater detail on the page, it is important to note that even\
        \ the light of Guardians is forced to abide by this Sword Logic, and they\
        \ arguably did not entirely subvert the system as by taking raid gear and\
        \ Touch of Malice, they claim t"
