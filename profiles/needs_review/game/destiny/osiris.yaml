        Saint.PNG|Helm of Saint-14 SaintGrayPigeon.jpg|Satin-14''s Gray Pigeon * Perfect
        Paradox: The Perfect Paradox is a Void rapid-fire shotgun that was created
        by the Guardian and given to Saint-14 inside the Infinite Forest, and was
        at a later date recovered from the body of Saint-14 to be reforged by the
        Guardian, which was then given to Saint-14 when the Guardian travelled into
        the Infinite Forest. The Perfect Paradox fires at 140RPM and has a magazine
        of 7, with each shot firing 12 pellets, as well as a series of adjustable
        barrel, sight, magazine and battery options and the trait ''Rampage'' which
        increases the strength of the Perfect Paradox with the number of enemies killed
        with it for a short period of time (Stacks to a maximum of x3). * Bastion:
        Bastion is an Exotic kinetic-damage fusion rifle gifted to Saint-14 by the
        Speaker, it fires 3 spreads of kinetic slugs, with part of the weapons'' damage
        bypassing shields of enemies. This weapon has a durable ranged barrel, a slow-building
