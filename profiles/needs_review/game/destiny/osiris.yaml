        passed out from the pressure when gambling information on The World. Notable
        Attacks/Techniques: thumb|right|400px|Osiris stealing [[Jean Pierre Polnareff|Polnareff''s
        soul]] Osiris: D''Arby''s Stand, a large, humanoid automatic Stand that complements
        his incredible skill in gambling and cheating. *Soul Gambling: Anyone who
        loses to D''Arby, whether it be in a bet or a game, or who admits defeat within
        their heart will have their soul stolen by Osiris, though they must agree
        to put their soul at stake. Those who play against D''Arby can even bet the
        souls of others in addition to their own. Osiris stores the souls it steals
        as poker chips to be used in games, and these chips can be split into multiple
        copies with a portion of the soul inside of them. If D''Arby himself is defeated,
        all the souls he''s stolen will be released, and if he is killed, they will
        all join him in death. It should be noted that even if someone could potentially
        not have lost due to some technicality, Osiris can still take their soul if
