  range:
    text: At least Interplanetary (Superior to the Lunar Pyramid, which manifested
      Nightmares throughout the Sol System.Regarding the Spread of Nightmares Quickly
      wiped out an interplanetary civilization with its abilities), likely Universal
      (The Witness can induce extremely high energy-dense states of matter that are
      equated to the Grand Unified Theory, which is how the universe was right before
      the Big Bang occurred and our reality was created. The universe's original state
      in the first place at the first time was likely the result of the Darkness.
      According to Clovis Bray, the universe would be doomed if the Darkness were
      to fall into the wrong hands. The Witness's threat eclipsed all other threats
      in the universe and its death left a power vacuum in the universe) and Interdimensional
      (Can create openings into other realms and planes of existence) | At least Multiversal
      and Extradimensional (The Witness's reach covers the entire Acsendant Plane
      and it can reach outside of the Ascendant Plane as well) | At least Multiversal
      and Extradimensional (Same as before. After getting a better grasp on the Traveler's
      Light, the Witness could reach outside of its Pale Heart), High Hyperversal
      with the Final Shape (The Final Shape is everything, it is all encompassing
      and affects the entire infinite universe. Contained within the universe is also
      the infinite-dimensional Hilbert space to which the Pyramidion leads)
    source_ids:
