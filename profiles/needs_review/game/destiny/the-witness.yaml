    field_candidates:
    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Acausality (Type 1), Information\
        \ Analysis, Environmental Adaptation, Regeneration (Low-Mid), Invisibility,\
        \ Enhanced Senses, Immortality (Type 1), Non-Physical Interaction, Cosmic\
        \ Awareness, Teleportation (Meta), Spatial Manipulation, Time Manipulation\
        \ (Passive), Forcefield Creation, Gravity Manipulation, Reality Warping (Localized).\
        \ Narrative Manipulation (Absolute), Omnipresence (Transcendental), Acausality\
        \ (Type 5), Transduality (Type 5), Beyond Dimensional Existence (Type 3),\
        \ Metaphysics Manipulation (Type 3), Ontologically Transcendent Physiology,\
        \ Immaterial Physiology, Logic Manipulation, Existence Erasure, Concept Manipulation\
        \ (Type 1), Law Manipulation, Fate Manipulation, Abstract Existence. The Witness\uFF62\
        \uFF63 \u2013 A parameter of existence that defines Aster as the universe's\
        \ first act of self-awareness. Without this \"witnessing,\" reality lacks\
        \ the logical necessity to exist. This allows Aster to maintain the stability\
        \ of the Fourth Universe simply by being present. Legibility Calibration\uFF62\
        \uFF63 \u2013 A process where Aster compresses his vast, prior existence into\
        \ a form that lower beings can receive without the act of witnessing him destroying\
        \ the receiver. This allows him to interact with \"Tier 2 and 3\" cosmic judges\
        \ while remaining unclassifiable. Editorial Decision\uFF62\uFF63 \u2013 In\
        \ his higher states, Aster does not deliver force or engage in combat. Instead,\
        \ he makes \"editorial decisions\" about whether a target continues to exist\
        \ in its current form. Because he predates the rules of reality, these decisions\
        \ bypass all forms of conventional durability and resistance. The Great Existence\uFF62\
        \uFF63 \u2013 The removal of the translation layer. Aster is not a being within\
        \ the universe; the universe is a feature of him. He is the page, and reality\
        \ is the text. In this state, instruments fail because they are trying to\
        \ measure the very thing they exist inside of. Total Understanding\uFF62\uFF63\
        \ \u2013 An effect projected onto those who witness Aster's true form. They\
        \ receive a complete, unambiguous answer to the nature of existence, filling\
        \ all conceptual voids and rendering further questions or conflict irrelevant.\
        \ The First Atom\uFF62\uFF63 \u2013 Aster remembers the silence before the\
        \ first atom. This ability allows him to revert any object or conceptual entity\
        \ back to the state of \"prior to creation,\" effectively undoing their existence.\
        \ The Persistent One\uFF62\uFF63 \u2013 An anchor ability that prevents the\
        \ Fourth Universe from collapsing like the three prior universes. As long\
        \ as Aster remains, the universe \"wants\" to continue. Margin Note\uFF62\uFF63\
        \ \u2013 Aster exists in the \"margins\" of every event. He can manipulate\
        \ the subtext of any battle or conversation, ensuring he is present but never\
        \ fully targeted unless he chooses to be. The Dead Language\uFF62\uFF63 \u2013\
        \ Using the fragments of ancient, forgotten human languages, Aster can speak\
        \ \"Stars\" and \"Carrying\" into existence, manifesting conceptual objects\
        \ that remain longer than mathematics can hold. Only I Can Kill\uFF62\uFF63\
        \ \u2013 The final revelation. Aster is the only being in existence capable\
        \ of being \"killed\" because he is the only being with the power to withdraw\
        \ his own witnessing. It is an absolute form of self-erasure that ends the\
        \ story itself. Ontological Denial\uFF62\uFF63 \u2013 Due to his status as\
        \ the substrate of reality, Aster has absolute resistance to any influence\
        \ that originates from within the universe's framework. He cannot be erased,\
        \ rewritten, or harmed by powers that rely on the laws of the First, Second,\
        \ Third, or Fourth Universes, as those laws were established after him. Conceptual\
        \ Inaccessibility\uFF62\uFF63 \u2013 Attempts to understand or classify Aster\
        \ fail because he precedes all categories. His mental and physical state are\
        \ unreachable by those who exist inside the system he maintains. == Attributes"
