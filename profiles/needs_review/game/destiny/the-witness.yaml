      \ black sphere\u2014nothing could be simpler\u2014and yet it is unspeakably\
      \ complex, compactly infinite, full of as many things as it could possibly contain.\
      \ Through studying the Traveler and the Veil, the Witness discovered how it\
      \ could achieve the Final Shape and reconfigure the universe, including an infinite-dimensional\
