    - field: intelligence
      value: "Supergenius (The Witness is one of the most intelligent and knowledgeable\
        \ beings in the universe, more so than even the likes of the Daughters of\
        \ Oryx and Savath\xFBn, the Witch Queen. It integrated itself with, and is\
        \ the greatest user of, the Darkness, an ontological force far beyond even\
        \ axioms that govern entire planes of existence. Its Pyramid technology can\
        \ manipulate the Calabi-Yau manifold for various purposes, such as instantaneous\
        \ communication and folding space-time away into the extra six dimensions.\
        \ An artifact of the Black Fleet could not be described by Golden Age researchers\
        \ without diminishing it: a black sphere\u2014nothing could be simpler\u2014\
        and yet it is unspeakably complex, compactly infinite, full of as many things\
        \ as it could possibly contain. Through studying the Traveler and the Veil,\
        \ the Witness discovered how it could achieve the Final Shape and reconfigure\
        \ the universe, including an infinite-dimensional Hilbert space, which requires\
        \ a complete understanding of the universe. Is made from the billions of minds\
        \ of the Precursors, who were an extremely advanced civilizationEntelechy\
        \ - page 7 & 8)"
