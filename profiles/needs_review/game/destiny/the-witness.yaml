  attack_potency:
    text: "At least Large Planet level (The Witness is more powerful than the Traveler.\
      \ A clash between the Traveler's Light and the Witness's Darkness had such a\
      \ high energy density that it created a kugelblitz black hole large enough to\
      \ quickly absorb the Yang Liwei, which is larger than a standard colony ship,\
      \ upon its formation.Exodus Black | O Captain | The Red War Its power is entirely\
      \ beyond that of any other being, other than the Traveler and the Veil.Destiny\
      \ 2: The Witch Queen Implied to have created gamma-ray bursts that could burn\
      \ up entire planetsDestiny Grimoire Anthology, Volume VII - Club Morgue), likely\
      \ Universe level (The Witness can induce extremely high energy-dense states\
      \ of matter that are equated to the Grand Unified Theory, which is how the universe\
      \ was right before the Big Bang occurred and our reality was created. The universe's\
      \ original state in the first place at the first time was likely the result\
      \ of the Darkness.Mysterious Logbook: NOTE\u2014CLARITY According to Clovis\
      \ Bray, the universe would be doomed if the Darkness were to fall into the wrong\
      \ hands.Deep Stone Crypt | Morning Star Orbital Station: \"Made Possible by\
      \ Clarity Control\" | Beyond Light The Witness's threat eclipsed all other threats\
      \ in the universe and its death left a power vacuum in the universeTechnoprotection\
      \ Shell) | At least Low Multiverse level (The Witness is the most powerful entity\
      \ in the universe, making it much more powerful than the likes of Vex Axis Minds\
      \ and Hive Gods.Shattered Realm | Mission Complete: \"Oryx Did Not Invent the\
      \ Taken\" | Season of the Lost It is the most influential being in the Ascendant\
      \ Plane, with the Hive's Throne Worlds having been 'leased' by it) | At least\
      \ Low Multiverse level (The Traveler's Pale Heart is a composite of the outside,\
      \ containing 'everything', with Mara Sov stating that the Traveler contains\
      \ more multitudes than either she or the Guardian could ever comprehend. With\
      \ the Light it has stolen from the Traveler, the Witness is now more powerful\
      \ than ever before), High Hyperverse level with the Final Shape (The Final Shape\
      \ is everything, it is all encompassing and affects the entire infinite universe.Ghost\
      \ Fragment: Clovis BraySolipsismEntry VIII Contained within the universe is\
      \ also the infinite-dimensional Hilbert space to which the Pyramidion leads)"
    source_ids:
    - vsbattles-the-witness-destiny
    confidence: 0.6
    notes: auto_repair source extraction
