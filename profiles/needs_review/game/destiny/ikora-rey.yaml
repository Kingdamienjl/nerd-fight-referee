    - field: intelligence
      value: 'Extraordinary Genius (Ikora is one of the most intelligent Guardians
        in the Last City and the leader of the Warlocks. She has extensive knowledge
        on the enemies of the City such as the Vex and Hive, and she has her spy network
        investigate their weaknesses. She studied under Osiris, who is the most intelligent
        Guardian in history. Her knowledge and expertise is considered necessary by
        her fellow Vanguard members, Cayde and Zavala, and commands respect from other
        Warlocks.Warlock Vanguard She''s an expert in the fields of physics and mathematics,
        metaphysics and ontology, and likely many more.Destiny 2: Witch Queen Collector''s
        Edition: Hidden DossierThe Hidden Dossier Designed a portal that was specifically
        attuned to the Undying Mind, so that its copies could all be summoned from
        different realities and timesVex Invasion | Patternbreaking | Season of the
        UndyingVex Offensive: Final Assault | To Destroy A Mind | Season of the UndyingVex
        Offensive: To Destroy a Mind | The Undying Mind: Introduction | Season of
        the Undying)'
      source_id: vsbattles-ikora-rey-destiny
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Gaurdians lose all of their Light based abilities if their connection
        to the Light is severed. Destroying Ikora''s Ghost will prevent her from being
        able to resurrect or regenerate. Notable Attacks/Techniques: *Blink: Allows
        Ikora to teleport a short distance. *Glide: Warlocks are capable of gliding
        through the air with varying control over their movement, speed, and height.
        *Vortex Grenade: A grenade which continuously damages enemies with Void Light
        that are inside of the area of effect. *Axion Bolt: A grenade which creates
        homing particles of Void Light which seek out enemies. *Scatter Grenade: A
        grenade which creates several smaller explosions for Void Light that covers
        a larger area of effect. *Healing Rift: Creates a rift of Light which heals
        allies and Ikora inside. *Empowering Rift: Creates a rift of Light which greatly
        increases the attack potency of allies and Ikora inside. *Entropic Pull: A
        melee ability which absorbs the target''s life force to recharge Ikora''s
        grenade energy. *Chaos Accelerant: Ikora can draw from her Super energy to
        increase the potency of her grenade abilities. *Bloom: Enemies that Ikora
        kills explode with Void Light. *Cataclysm: Ikora''s Nova Bomb travels slowly
        and seeks out enemies, but she can also detonate the bomb early to create
        several smaller homing projectiles. *Devour: Striking an enemy with this melee
        ability fully restores all of Ikora''s health. *Feel the Void: Ikora is capable
        of consuming her grenade energy to restore her health. While the Devour effect
        is active with this ability, anything Ikora kills will fully restore her health.
        Devour lasts 9 seconds, but it is reset with every kill Ikora gains. *Insatiable:
        Kills Ikora gains while Devour is active recharge her grenade energy. *Vortex:
        When Ikora uses Nova Bomb, it creates a singularity which traps enemies inside
        dealing continuous damage with Void Light. *Void Breach: This melee ability
        can hit at a further range with an explosion of Void Light. *Handheld Supernova:
        Converts grenade energy into a short range Void Light blast. *Dark Matter:
        Health and melee, grenade and class ability energy are gained for each Void
        energy kill. *Nova Bomb: Ikora throws a huge blast of Void Light at her enemy
        which disintegrates the opponent. *Nova Warp: Ikora moves between dimensions
        to teleport and appear in a huge explosion of Void Light. ==Gallery== File:IkoraWallpaper.jpg|Ikora
