- id: claim-weaknesses-0a6bea06
  section: weaknesses
  axis: weakness
  text: 'Gaurdians lose all of their Light based abilities if their connection to
    the Light is severed. Destroying Ikora''s Ghost will prevent her from being able
    to resurrect or regenerate. Notable Attacks/Techniques: *Blink: Allows Ikora to
    teleport a short distance. *Glide: Warlocks are capable of gliding through the
    air with varying control over their movement, speed, and height. *Vortex Grenade:
    A grenade which continuously damages enemies with Void Light that are inside of
    the area of effect. *Axion Bolt: A grenade which creates homing particles of Void
    Light which seek out enemies. *Scatter Grenade: A grenade which creates several
    smaller explosions for Void Light that covers a larger area of effect. *Healing
    Rift: Creates a rift of Light which heals allies and Ikora inside. *Empowering
    Rift: Creates a rift of Light which greatly increases the attack potency of allies
    and Ikora inside. *Entropic Pull: A melee ability which absorbs the target''s
    life force to recharge Ikora''s grenade energy. *Chaos Accelerant: Ikora can draw
    from her Super energy to increase the potency of her grenade abilities. *Bloom:
    Enemies that Ikora kills explode with Void Light. *Cataclysm: Ikora''s Nova Bomb
    travels slowly and seeks out enemies, but she can also detonate the bomb early
    to create several smaller homing projectiles. *Devour: Striking an enemy with
    this melee ability fully restores all of Ikora''s health. *Feel the Void: Ikora
    is capable of consuming her grenade energy to restore her health. While the Devour
    effect is active with this ability, anything Ikora kills will fully restore her
    health. Devour lasts 9 seconds, but it is reset with every kill Ikora gains. *Insatiable:
    Kills Ikora gains while Devour is active recharge her grenade energy. *Vortex:
    When Ikora uses Nova Bomb, it creates a singularity which traps enemies inside
    dealing continuous damage with Void Light. *Void Breach: This melee ability can
    hit at a further range with an explosion of Void Light. *Handheld Supernova: Converts
    grenade energy into a short range Void Light blast. *Dark Matter: Health and melee,
    grenade and class ability energy are gained for each Void energy kill. *Nova Bomb:
    Ikora throws a huge blast of Void Light at her enemy which disintegrates the opponent.
    *Nova Warp: Ikora moves between dimensions to teleport and appear in a huge explosion
    of Void Light. ==Gallery== File:IkoraWallpaper.jpg|Ikora during the Red War File:IkoraConcept.jpg|Concept
    art of Ikora Rey from Destiny 1 File:IkoraThresher.gif|Ikora destroys a Thresher''s
    engine with a Nova Bomb File:IkoraLeads.jpg|Ikora takes the lead of a group of
    Guardians within the Pale Heart ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{Scroll box|content={{Reflist|2}}}} {{Discussions|Ikora Rey|Ikora
    Rey}} Category:Characters Category:Destiny (Verse) Category:Game Characters Category:Female
