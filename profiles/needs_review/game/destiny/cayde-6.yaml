- id: claim-weaknesses-9fbe0ec0
  section: weaknesses
  axis: weakness
  text: 'If Cayde-6''s Ghost is destroyed his next death will be final. Notable Attacks/Techniques:
    *High Jump: Cayde-6 jumps again while airborne to get more altitude. *Stafe Jump:
    Cayde-6 jumps again while airborne with more directional control. *Triple Jump:
    Cayde-6 can perform two jumps while airborne. *Incendiary Grenade: Throws a grenade
    that sets enemies on fire upon explosion. *Swarm Grenade: Grenade that explodes
    on contact, releasing multiple smaller drones that seek enemies. *Tripmine Grenade:
    Throws a grenade that creates a laser sensor that causes an explosion upon contact
    with the sensor. *Solar Grenade: A grenade that periodically damages enemies inside
    its explosion radius. *Fusion Grenade: An explosive grenade that causes bonus
    damage when attached to its target. *Firebolt Grenade: A grenade that unleashes
    bolts of Solar light at nearby enemies. *Thermite Grenade: A grenade that sends
    forth a line of fire, dealing damage and scorching targets in its path. *Healing
    Grenade: A grenade that cures allies on impact and creates Orb of benevolent Solar
    Light granting restoration to allies when picked up. *Marksman''s Dodge: A swift
    dodging maneuver that allows Cayde-6 to quickly reload his weapon. *Gambler''s
    Dodge: A swift dodging maneuver that allows Cayde-6 to recover melee energy more
    often. *Explosive Knife: Cayde-6 throws a knife that explodes on contact. *Knife
    Trick: Cayde-6 throws a fan of knives which catch the enemy on fire upon landing.
    *Blade Barrage: Cayde-6 jumps into the air and unleashes a barrage of explosive
    knives filled with Solar energy. *Golden Gun: Cayde-6 infuses his weapon with
    his Solar Light, firing shots that are capable of instantly killing other Guardians
    by vaporizing them away. ==Gallery== File:CaydeWallpaper.jpg|Cayde-6 during the
    Red War File:CaydeFallenTeam.jpeg|Cayde-6 and a Fallen Baroness fight hordes of
    Hive on Luna File:CaydeCabal.gif|Cayde-6 disintegrating a group of Cabal Legionaries
    with his Golden Gun File:CaydeRally.gif|Cayde-6, a well-beloved Guardian, rallies
    Guardian forces to retake the Last City File:CaydeScorn.gif|Cayde-6 fighting the
    Scorn within the Prison of Elders File:CaydeLastStand.jpg|Last stand of the Gunslinger
    File:GuardianCaydeDead.jpg|The Guardian carries Cayde-6''s body ==Notable Matchups==
