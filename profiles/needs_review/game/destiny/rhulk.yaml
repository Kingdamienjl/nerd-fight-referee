      value: "Genius (Rhulk is a prodigy in combat, able to defeat multiple Lubraean\
        \ soldiers, while unarmed and at a young age. After acquiring a glaive of\
        \ his own, he went on to kill many more soldiers. Was able to manipulate and\
        \ mold a civilization from behind the scenes with only one person ever becoming\
        \ aware of his existence. Appropriated the Lucent Hive's runes, learning their\
        \ magic and using it for his own experiments, successfully merging a Scorn\
        \ and a WormThis Week In Destiny \u2013 05/02/2024)"
      source_id: vsbattles-rhulk-destiny
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Rhulk is very arrogant and will underestimate those he deems as lesser
        than him. Notable Attacks/Techniques: *Resonance: As Darkness is something
        that hums and flows and resonates, Resonance is the basis of all its manifestations.
        A core part of its identity is the manipulation of waves. Resonance can manipulate
        the rules and information of reality through its influence over the protological
        patterns, the common language, that underpins them. Rhulk can apply this power
        in a wide variety of ways. Rhulk has demonstrated numerous uses, including:
        walking on air, creating various force fields, amplifying his attacks, high-speed
        dashes, forming weapons, distorting space-time, creating portals, teleportation,
        manipulating technology, mending broken objects and healing himself. **Suns
        of Lubrae: Rhulk emits beams of light, followed by an oscillating, double
        helix manifesting along each beam. These attacks deal Solar damage and inflict
        the Pervading Darkness debuff. **Savage Strike: Rhulk performs a physical
        strike, imbued with Resonance, capable of killing even the most powerful Guardians
        in one hit. This attack deals Solar damage and inflicts the Pervading Darkness
        debuff. **Pervading Darkness: A debuff that obscures the target''s perception
        with darkness and eventually kills them through Umbral Suffocation, permanently
        snuffing out the Light of even the most powerful Guardians. Rhulk can apply
        this debuff through attacks, by creating Resonant spikes that apply it over
        a large area, or simply as a side-effect of fighting at full power. ==Gallery==
