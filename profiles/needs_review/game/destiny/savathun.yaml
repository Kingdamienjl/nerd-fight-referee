    - field: weaknesses
      value: "Failing to live up to her nature of cunning as well as failing to uphold\
        \ her tithe of death to her Worm will result in her eventual consumption.\
        \ Killing her in her own throne world makes it much harder, though not impossible,\
        \ for her to return. | Same as before. | Lightbearers lose all of their Light-based\
        \ abilities if their connection to the Light is severed. Destroying Savath\xFB\
        n's Ghost will prevent her from being able to resurrect or regenerate, and\
        \ killing her in her own throne world moreover means she dies permanently.\
        \ | Same as before. Notable Attacks/Techniques: *Acolyte Grenade: Savath\xFB\
        n conjures a solar magic explosive and throws it at the enemy. It explodes\
        \ upon contact, leaving behind a pool of fire. *Darkness Blast: Savath\xFB\
        n fires darkness projectiles of the arc element. *Poison Cloud: Savath\xFB\
        n summons a dark cloud of poison on top of her enemies. These clouds deal\
        \ damage over time, blur the enemy's senses, and slow them down. *IMBARU:\
        \ IMBARU is a tribute system, created by Savath\xFBn, an existential economy\
        \ based on the accumulation of secrets and the tribute of failing-to-understand-her.\
        \ Cunning is the use of thought to predict the function of a system. Therefore,\
        \ wherever a being should attempt to understand Savath\xFBn and fail, her\
        \ cunning will have defeated theirs. Wherever a falsehood is repeated about\
        \ her, she will have displayed cunning. Savath\xFBn gathers tribute from every\
        \ false prediction, misguided theory, fearful rumour, and ominous supposition\
        \ which derives from the thought of her. *Savath\xFBn's Song: A viral chant\
        \ that can never be unheard. It can be spread through different mediums, such\
        \ as through binary code. Anyone under its effects is open to further mental\
        \ manipulation by Savath\xFBn. *Deepsight: The ability to see beyond the limitations\
        \ of normal sight. It's a psychic power that allows the user to see psychic\
        \ imprints of past events. Due to the Darkness being bound to the consciousness\
        \ that stretches in webs across space and time, the ability is uniquely useful\
        \ for investigatory processes. With Deepsight one can see through illusions,\
        \ unveil hidden things and manifest things from the past. The latter is useful\
        \ for making objects remember their shape, such as returning a broken glaive\
        \ to a pristine state. *Inquisition of Self: A heretical technique that allows\
        \ one to excise the layers of self and to navigate the dissection of living\
        \ essences. It can be used to exorcise a being from their body, though this\
        \ requires wounds to function as openings, and to transfer the essence and\
        \ consciousness of a being to another body. It can be used to let a living\
        \ essence vanish into the aether or to preserve it as a means of reviving\
        \ them, as is shown with Zulmak. Savath\xFBn can also use it to heal others.\
        \ *Hive Annihilation Ritual: Savath\xFBn casts a Hive ritual that instantly\
        \ kills all targets within a large area. *Ontological Warhead: Savath\xFB\
        n channels her power into a single point and releases an ontological attack\
        \ with a large area of effect. *Summon Void Crystals: Savath\xFBn summons\
        \ multiple Void Crystals and subsequently has them explode through Void Detonation\
        \ if they're not quickly destroyed. *Summon Deceptions: Savath\xFBn creates\
        \ illusions of herself or of others that are capable of affecting reality,\
        \ as they can cast Hive magic. These illusions must be destroyed in order\
        \ to expose the real one. *Incendiary Rune: One of the many Hive runes Savath\xFB\
        n can use. With it, she can fire powerful projectiles of Solar energy. *Blade\
        \ Barrage: Savath\xFBn conjures several blades of Solar Light and launches\
        \ them, manipulating their trajectory in order to strike the target. *Nova\
        \ Bomb: Savath\xFBn launches a dense orb of Void Light that releases a gravitational\
        \ blast upon impact and leaves behind a singularity of Void Light. *Nova Warp:\
        \ Savath\xFBn releases a powerful explosion of Void Light directly from her\
        \ body. *Vicious Light: Savath\xFBn rapid-fires blasts of Arc Light at her\
        \ target. *Stormtrance: Savath\xFBn calls forth multiple outwards travelling\
        \ columns of Arc Light. *Ward of Dawn: Savath\xFBn creates a large barrier\
        \ of Void Light that moves with her at its center. It doesn't stop attacks\
        \ or enemies from passing through, but it does make Savath\xFBn completely\
        \ immune to attacks and abilities that originate from outside of the barrier.\
        \ *Threadbound: Savath\xFBn casts Light-based magic that restricts the target's\
        \ ability to take action. *The Power to Move Worlds: The ability from which\
        \ the power to Take is derived. It involves reforming matter in a self-contained\
        \ reality, where the creator defines past, present, and future. It can transport\
        \ targets to other locations, including other planes of existence, and potentially\
        \ outside of space and time. It can create shifts in reality large enough\
        \ to move entire planets. Note: Savath\xFBn's fourth key is exclusively for\
        \ her feats within her throne world because she has no notable feats outside\
        \ of it. ==Gallery== File:DestinyThreeSisters.jpg|Sathona, Xi Ro and Aurash\
        \ File:Sathona2.jpeg|Sath"
