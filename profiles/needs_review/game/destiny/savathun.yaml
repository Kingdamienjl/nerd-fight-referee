        \ which allowed her to move from an existential economy based on the accumulation\
        \ of violence to an existential economy based on the accumulation of secrets\
        \ and the tribute of failing-to-understand-her. This would be an entire new\
        \ branch of the Sword Logic, which is a metaphysical framework that exists\
        \ across the different planes of reality. She was continuously multiple steps\
        \ ahead of some of the most intelligent minds in the Sol system, such as Mara\
        \ Sov and Ikora Rey.Severing the Worm | Speak to Mara Sov \u2014 \"Fickle\
        \ Things\" | Season of the Lost She was able to trick the Witness. Even some\
        \ lesser Wizards hold knowledge that is completely incomprehensible for Ghosts.\
        \ Lesser Hive are also capable of constructing an intergalactic library that\
        \ holds so much information it has broken the Bekenstein limit.Destiny: The\
        \ World's Grave (mission) Even basic Hive technology is indistinguishable\
        \ from magic to futuristic civilizations.Shredder Savath\xFBn orchestrated\
        \ the genocide of a planetary civilization by using a doomsday cult that she\
        \ had nourished as proxy, not leaving behind a trace of involvement.Resonant\
        \ Fury Robes As Osiris she was able to manipulate Lakshmi-2 with only her\
        \ words and actions, who had been keeping an eye on her and who had been using\
        \ a Vex machine to predict the future.Boots of the Assembler She is so good\
        \ at predicting and manipulating events and people that it seems like prophecyX\
        \ \u2014 Eris Morn \u2014 The Augur Casts Her Bones), Nigh-Omniscient within\
        \ her Throne World (Savath\xFBn's throne world, which is an entire universe\
        \ of its own, is indistinguishable from her own mind, allowing her to be aware\
        \ of practically everything that transpires within itMedusa) Standard Tactics:\
        \ Savath\xFBn avoids direct confrontations whenever she can. She prefers to\
        \ orchestrate and manipulate events from the shadows, and often employs subtler\
        \ methods to get rid of her enemies and to take what she wants. She rarely\
        \ shows herself to anyone, even her allies. Even when she takes a more direct\
        \ approach to a conflict, she will often not be anywhere near it, or even\
        \ in the same reality for that matter. She is however, fully capable of engaging\
        \ in direct combat, as she has fought her siblings for billions of years,\
        \ with one of their fights lasting for 20,000 years. Although she still specializes\
        \ in manipulation, sabotage, subterfuge, etc. Savath\xFBn is less averse to\
        \ direct combat now. She continually and agressively uses powerful attacks\
        \ of Void, Arc and Solar Light to kill her enemies. She can use Threadbound\
        \ in order to temporarily debilitate targets, or set it up to activate when\
        \ they try to attack her Ghost. Savath\xFBn summons Projections of herself\
        \ to aid her in battle. These Projections are capable of using the same Void,\
        \ Arc and Solar Light abilities as Savath\xFBn. She also continuously calls\
        \ upon reinforcements from her brood. When she's fighting at full power, she'll\
        \ deploy her Ward of Dawn, protecting herself against all ranged attacks and\
        \ abilities. She is, however, also likely to let Projections fight in her\
        \ place."
