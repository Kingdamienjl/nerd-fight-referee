      value: 'Hundreds of Meters to Kilometres with guns, at least Kilometres with
        abilities (Superior to the likes of The Stormherd), up to Hundreds of Kilometers
        for the Ghost | Hundreds of Meters to Kilometres with guns, at least Kilometres,
