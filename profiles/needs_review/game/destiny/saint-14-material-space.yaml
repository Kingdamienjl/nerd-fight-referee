    - field: weaknesses
      value: 'Gaurdians lose all of their Light based abilities if their connection
        to the Light is severed. Destroying Saint''s Ghost will prevent him from being
        able to resurrect or regenerate. Feats: *Became famous for his actions at
        the Battle of Six Fronts. *Became the first Vanguard, and helped establish
        the Consensus system that still runs The City in present. *Led crusades against
        the Fallen, resulting in the death of Solkis, Kell of the House of Devils.
        *Fought the Vex for centuries, ending his life with a mutual kill on a mind
        dedicated to the sole purpose of his demise. Notable Attacks/Techniques: *Lift:
        A Titan ability allowing for limited flight. Can be altered to prioritize
        height, control, or giving a strong burst of initial momentum. *Towering Barricade:
        A large barrier that can be used for cover or to seal off dangerous areas
        for a short time. *Rally Barricade: A small barricade that allows one to peek
        over it while aiming down sights and continuously reloads the equipped weapon
        of the user. *Titan Codices: Titan training allows them to select from a vast
        variety of fighting styles that focus on a mixture of recovery, speed and
        toughness. Different codices will focus on one, two or all of the three traits,
        amplifying them in the user depending on which traits the user needs in any
        specific battle. *Sentinel Shield: Summons a shield of Void Light. While Sentinel
        Shield is active, the user can hit opponents with the shield, throw the shield
        while creating a new one in the process, or guard with the shield, greatly
        expanding the radius it covers. Sentinel Shield is incredibly difficult to
        break through even using other Guardian supers and erases things at a touch.
        *Disintegrate: Killing an enemy with this melee ability creates a Force Barrier
        around the user which absorbs incoming damage. This ability can be tweaked
        to also allow every melee kill to have a chance of generating an Orb of Light,
        have the Force Barrier continually recharge or have the reload and ready speed
        of weapons be extremely quick while Force Barrier is active. Extra perks allow
        the user to increases the duration and strength of the shield created by Disintegrate.
        *Magnetic Grenade: A grenade that attaches to enemies and explodes twice.
        Designed to crack the armour of hard targets. *Spike Grenade: A grenade that
        attaches to any surface and emits a torrent of damaging void light. *Suppressor
        Grenade: An explosive grenade that prevents enemies from using abilities for
        a short time. *Voidwall Grenade: A grenade that creates a horizontal wall
        of burning Void Light. *Iron Harvest: Heavy Weapon kills have a chance to
        create Orbs of Light for the users allies. Code of the Protector: *Ward of
        Dawn: The Code of the Protector allows the user to forego summoning the Sentinel
        Shield, and instead shape Void Light into a nigh-indestructible shield-dome
        to protect the user and their allies from harm. Replenishes grenade and melee
        energy on activation. Ward of Dawn can be tweaked to dramatically amplify
        the durability or attack potency of its user and any allies who pass through
        it, with other perks further increasing the potency of the buffs. Extra perks
        allow the user to either increase the Ward of Dawn''s duration as well as
        their own base durability, give the Ward the ability to generate additional
        Orbs of Light when it is under enemy fire or dramatically decrease the cooldown
        time of the Ward of Dawn and give a small boost to the users base durability.
        *Defensive Strike: Killing an enemy with this melee ability to creates an
        overshield around the user and nearby allies. *Rallying Force: Killing an
        enemy in melee restores health for the user and nearby allies. *Turn the Tide:
        The overshield from Defensive Strike lasts longer and increases melee damage
        and reload speed. Code of the Aggressor: *Superior Arsenal: Grenade kills
        recharge grenade energy. *Shield Bash: After sprinting for a short time, using
        this melee ability unleashes a devastating Shield Bash that disorients enemies.
        *In The Trenches: Kills while surrounded by enemies reduce the cooldown of
        Sentinel Shield *Second Shield: Gain an additional Shield Throw charge while
        Sentinel Shield is active. *Hammer of Sol: Forges Light into a raging inferno
        of Solar energy, and allows the user to pull a blazing hammer from the fire.
        The user can then launch their hammers at enemies from afar, releasing a devastating
        eruption of Solar fire on impact. Perks give the user the ability to throw
        more hammers as well as the hammers causing bigger explosions and allow the
        user to hurl themselves forward during Hammer of Sol, causing enemies in their
        path explode, chaining fiery damage to other enemies. Extra perks cause enemies
        that are killed by the Hammer of Sol to explode and chain fiery Solar damage
        to enemies caught in the blast or have the Hammer of Sol track its target.
        *Fleetfire: An extra perk that causes kills with solar abilities to grant
        the user bonus movement and reload speed for a short time. Sta'
