    - field: weaknesses
      value: "Cannot fight in spirit form in lower dimensions, and requires a physical\
        \ vessel to not shatter it. Notable Attacks/Techniques: Authority ( Kenn\u014D\
        ): As a Primordial Goddess, Ishtar possess Divine Authorities, special powers\
        \ distinct from Code Casts, Noble Phantasms, and Skills in that while they\
        \ achieve results based on some logical process or principle, an Authority\
        \ realizes a result simply because the user has the right to do so. Authorities\
        \ are powers on the level of world construction, and can be powers such as\
        \ event shifting, time manipulation, causality manipulation, kingdom-building\
        \ and other powers on that level. The Gods originally used their Authorities\
        \ during the Age of Gods to shape the world, build kingdoms and advance civilization.\
        \ But as time went, humanity advanced to the point that Authorities became\
        \ unnecessary. When summoned as a Servant, Ishtar likely cannot utilize her\
        \ Authorities without harming and straining herself. The derivative version\
        \ of Ishtar from our world possesses a total of seven Divine Authorities,\
        \ and she also can take the Authorities of other Gods and Goddesses, and the\
        \ primordial version of Ishtar should at least possess these as well. ===Noble\
        \ Phantasm=== Edin Shugra Quasar: Royal Crown Shining in the Primeval Universe\
        \ ( Edin Shugura Ku\u0113s\u0101?) Space Ishtar's own Noble Phantasm. She\
        \ begins by summoning the ancient Bel Maanna temple, the \"testimony of the\
        \ goddess\" from the primordial universe, before unleashing the higher-dimensional\
        \ soul that composes it and generating an entire galaxy to turn into energy,\
        \ firing it as a volatile projectile with enough power to obliterate entire\
        \ cosmic domains. The temple, a Baal temple built by Anat, has a horrifying\
        \ shape and offensive form, or so it is said. In the Sumer-Akkad language,\
        \ \"Edin\" refers to the sky, and is said to be the source of the Old Testament's\
        \ Eden. Shugra was the crown found in said Edin, given to Ishtar when she\
        \ entered the domain. Quasar refers to the modern word for interstellar objects,\
        \ a cosmic domain away from the Earth, emitting an extremely strong light\
        \ and being called \"the brightest celestial body\". ===Class Skills=== *Avenger\
        \ ( Fukush\u016B-sha): The signature class skill of Avengers, representing\
        \ the existence of one who gathers the grudges and hatred of others and takes\
        \ it onto themselves. By chance, Ishtar's name of Astarte was corrupted by\
        \ later Europe into the demon Astaroth, turning her from a goddess who was\
        \ worshipped into a monster who was demonized. Filled with anger, pain and\
        \ self-pity, her rank in this skill is an astounding EX. *Independent Action\
        \ ( Tandoku K\u014Dd\u014D): The ability to remain independent and exist in\
        \ the world without the magical energy supplied by a Master, allowing the\
        \ Servant to act autonomously and the Master to save their own magical energy\
        \ for spells. As an individual born as a goddess, raised as a human, and developed\
        \ as a Servant, Ishtar's existence in the world takes virtually no mana, even\
        \ when she's not contracted to a Master. *Magic Resistance ( Tai-Maryoku):\
        \ An innate ability that grants protection against magical effects. Unlike\
        \ the Resistance effect that merely rejects Magical Energy, this ability cancels\
        \ the spells altogether. Ishtar's mediocre C-rank protects her from spells\
        \ with two verses or less, but will be unable to protect her from High-Thaumaturgy\
        \ or Greater Rituals. *Oblivion Correction ( B\u014Dkyaku Hosei): An Avenger\
        \ never forgets, attacking from beyond oblivion with greater strength than\
        \ other Servants, increasing the power of their blows whenever they strike\
        \ an opponent's weak points. No matter how much time passes or how many things\
        \ she's exposed to, Ishtar's own hatred will never lessen. *Self-Replenishment\
        \ (Mana) ( () Jiko Kaifuku (Maryoku)): One of the class skills of the Avenger,\
        \ allowing them to continuously replenish their mana until their task is completed.\
        \ ===Personal Skills=== * Devil's Sugar (\u30C7\u30D3\u30EB\u30BA\u30FB\u30B7\
        \u30E5\u30AC\u30FC Debiruzu Shug\u0101): Even with her status as a demon paining\
        \ her, Ishtar still makes full use of its \"charm and excitement\" with this\
        \ skill. By smiling and blowing a kiss, she can increase her allies' morale\
        \ and allow them to ignore any of their body's limitations to release power\
        \ beyond their normal limits. Her own charm/curse is also capable of nullifying\
        \ an enemy's charm when used on her allies. In a combination of the goddess\
        \ of victory and the one who will destroy humanity, it could be called a devil's\
        \ charisma. *Goddess' Divine Core (\u306E Megami no Kamikaku): A skill that\
        \ denotes Ishtar as a perfected goddess from birth, it preserves the absoluteness\
        \ of her mind and body, repelling all mental interference while preventing\
        \ her body from ageing or changing no matter how many calories she consumes.\
        \ It's a composite skill that also includes divinity allowing her to reduce\
        \ \"Anti-Purge defense\" in proportion to the rank of her Divinity, allowing\
        \ her to break through defensive abilities such as Protection of the Faith\
        \ and Saver's Enlightenment of the Sacred Fig."
