    - field: weaknesses
      value: "None notable Note #1: Saint Alagadda is not just a \u201Ctrue form\u201D\
        \ of the Hanged King or the Ambassador of Alagadda, but is rather portrayed\
        \ as an entirely different entity, stated to be stated to be the city\u2019\
        s namesake and the one guiding the fate of Alagadda\u2019s true unmasked nature,\
        \ described as \u201Cthe city as it was before the corruption of the King\
        \ and its people\u201D and \u201Cthe city as it will be, when the Ambassador\
        \ abdicates, when history ends, when the last note is played\u201D. The Saint\
        \ would scale above these characters anyway, as they would be encompassed\
        \ within the Saint\u2019s creation, however the Trashfire/On Mount Golgotha\
        \ version of the Hanged King wouldn\u2019t scale to the Hanged King from other\
        \ canons due to cosmology differences. Note #2: Saint Alagadda does not scale\
        \ to SCP-3812 in any capacity, as the song mentioned in 3812\u2019s article\
        \ was never implied to have any connection to On Mount Golgotha or the Saint,\
        \ and Djkaktus has stated that 3812\u2019s \u201Csong\u201D is simply a metaphor\
        \ for his own agony. ==Explanations== Saint Alagadda is the supreme being\
        \ of the On Mount Golgotha canon, however unfortunately this doesn\u2019t\
        \ scale anywhere on its own, as this particular canon never elaborates on\
        \ its own cosmology beyond vague details like the existence of the Ways or\
        \ the Kingdom of Alagadda. As such, we have to look to other sources to gain\
        \ additional context. The main author of the Trashfire canon, UraniumEmpire,\
        \ has stated that the On Mount Golgotha canon is the First Hytoth within the\
        \ world of Trashfire. In the same quote, she states that another one her tales,\
        \ Qlippoth and Sefiros is the origin story of Trashfire\u2019s cosmology.\
        \ From this, we can gather that QaS, Trashfire, and On Mount Golgotha all\
        \ share a cosmology. Admittedly this is one-way canonicity, the fact that\
        \ On Mount Golgotha is canon to Trashfire doesn\u2019t automatically make\
        \ Trashfire canon to On Mount Golgotha. However, it\u2019s the best information\
        \ we have, since again, On Mount Golgotha only has a cosmology in the context\
        \ of Trashfire. Technically, we don't know where a \"pure\" On Mount Golgotha\
        \ version of Saint Alagadda would scale, what we're really talking about here\
        \ is the Trashfire version. UraniumEmpire has also stated she doesn\u2019\
        t know who Saint Alagadda is, meaning they weren't part of her \"intent\"\
        \ when writing Trashfire and QaS. However, this doesn\u2019t mean the Saint\
        \ can\u2019t exist in Trashfire, since they exist as an integral part of the\
        \ On Mount Golgotha mythos, which UraniumEmpire incorporated into the Trashfire\
        \ series as the First Hytoth. That is to say, it doesn\u2019t actually if\
        \ the author was specifically thinking about the Saint when writing Trashfire\
        \ and QaS, they\u2019re implicitly part of that mythos anyway by virtue of\
        \ Trashfire\u2019s connection with On Mount Golgotha. While author statements\
        \ can be a considered a secondary source of information, their weight can\
        \ be called into question when they contradict other evidence, as is the case\
        \ here. ==Gallery== Put other pictures of the character here. ==Others== Notable\
        \ Victories: Notable Losses: Inconclusive Matches: Category:Stratovariant"
