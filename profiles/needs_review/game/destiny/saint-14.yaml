  attack_potency:
    text: 'Varies (A Guardian''s capabilities with the Light at any given moment may
      vary), at least Small Building level, likely City Block level physically (Saint-14
      is one of the most powerful Guardians to exist.Quest: Open The Gate, Complete
      An Impossible Task The best among the Guardians are strong simply by holding
      the Light inside them, without the need to let it out.Mantle of Battle Harmony
      A younger and weaker Saint-14 was able to sever the leg of a Fallen Walker,
      which are comparable to the Drake Tank, with a shield throw.3: Burden Part III
      His light eclipsed that of a capable WarlockThe Scholar), higher with abilities,
      up to City Block level with super abilities and weapons (Guardians can take
      out combat vehicles, such as the Goliath Tank, with super abilities and powerful
      weaponryThe DreadnaughtArcus and SagitaVoid, Nowhere ProhibitedSolstice Hood
      (Rekindled)), at most Continent level (Was considered the greatest Titan who
      ever lived.Destiny 2: Season of DawnHelm of Saint-14 Is peers with and fought
      Osiris, who was stated to be the most powerful Guardian by the Ghost of the
      Guardian who defeated a weakened Oryx.Destiny: Fall of Osiris (comic)The Gateway
      This would make him comparable to Inotam, Oblivion''s Triune) | Varies, up to
      Universe level+, possibly Low Multiverse level (His light cut a rift through
      the timelines of the Infinite Forest. Fought the Vex inside the Infinite Forest,
      where they can simulate entire timelines, for centuries and only died to a weapon
      specifically attuned to him.Beyond InfinityGhost Fragment: VertigoLost Memory
      Fragment 3Kairos Function 2A Garden WorldThe Sundial TranscriptSimulation BloomQuest:
      Not Even the Darkness, Legends Lost The Vex were also able to stalemate beings
      such as The Daughters of Oryx, though this was partly because the Hive are weaker
      in Vex space)'
    source_ids:
    - vsbattles-saint-14-destiny
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Varies, at least Subsonic (Even unremarkable Guardians can easily blitz
      humans, even though humans in Destiny have a faster reaction time than humans
      in the real worldLiar's HandshakeKing's Wrath), up to Massively Hypersonic+
      (Comparable if not superior to The Stormherd, who can hook lightning from the
      air mid-dsecend.Cloudstrike On par with the Guardian, who was able to react
      to lightning during their Stormcaller trainingShard of the Traveler (Stormcaller)),
      up to Massively Hypersonic+ attack speed with Arc Light (Arc Light users can
      use lightning attacks and manipulate natural lightning), his attack speed Varies
      with weapons, FTL travel speed with his jumpship (Jumpships can quickly traverse
      the solar system) | Varies, at least Subsonic, up to at least Massively Hypersonic+
      (Should be at least as fast as in material space), up to Massively Hypersonic+
      attack speed with Arc Light, his attack speed Varies with weapons
    source_ids:
