- id: claim-intelligence-55c6ab74
  section: power_scale
  axis: battle_iq
  text: At least Above Average (As the first Vanguard Commander, Saint-14 would need
    an impressive degree of intelligence, as this position requires the user to be
    able to manage almost everything going on in The City and with other Guardians.
    In terms of fighting, Saint-14 has quite an impressive record, with him being
    hailed for his actions at the Battle of Six Fronts, his successful crusades against
    the Fallen, and fighting the Vex for centuries on end, even killing the mind specifically
    designed to kill him. Ghosts are likely around Extraordinary Genius, as they are
    companion supercomputers capable of deciphering information incomprehensible to
    normal minds)
  source_ids: *id005
  decisive: false
