  range:
    text: 'Hundreds of Meters to Kilometres with guns, at least Kilometres with abilities
      (Superior to the likes of The Stormherd), up to Hundreds of Kilometers for the
      Ghost | Hundreds of Meters to Kilometres with guns, at least Kilometres, likely
      higher with abilities (His Light created a rift in time that cut through part
      of the Infinite Forest) {| class="wikitable mw-collapsible mw-collapsed" ! Standard
      Equipment |- | Perfect_Paradox.png|Perfect Paradox Bastion.jpg|Bastion Saint.PNG|Helm
      of Saint-14 SaintGrayPigeon.jpg|Satin-14''s Gray Pigeon * Perfect Paradox: The
      Perfect Paradox is a Void rapid-fire shotgun that was created by the Guardian
      and given to Saint-14 inside the Infinite Forest, and was at a later date recovered
      from the body of Saint-14 to be reforged by the Guardian, which was then given
      to Saint-14 when the Guardian travelled into the Infinite Forest. The Perfect
      Paradox fires at 140RPM and has a magazine of 7, with each shot firing 12 pellets,
      as well as a series of adjustable barrel, sight, magazine and battery options
      and the trait ''Rampage'' which increases the strength of the Perfect Paradox
      with the number of enemies killed with it for a short period of time (Stacks
      to a maximum of x3). * Bastion: Bastion is an Exotic kinetic-damage fusion rifle
      gifted to Saint-14 by the Speaker, it fires 3 spreads of kinetic slugs, with
      part of the weapons'' damage bypassing shields of enemies. This weapon has a
      durable ranged barrel, a slow-building charge to increase the impact of the
      burst and a versatile dual-purpose stock. * Helm of Saint-14: The Helm of Saint-14
      is an Exotic helmet that has the special perk ''Starless Night'', which blinds
      enemies that enter Saint-14''s Ward of Dawn as well as temporarily blinding
      nearby enemies when Saint-14 guards with his Sentinel Shield. * Ghost: For a
      Guardian, their Ghost serves as a companion, scout, librarian, and mechanic,
      able to activate ancient machinery and act as a codebreaker. Ghosts can support
      Guardians by performing certain actions such as illuminating darkened areas,
      repairing technology, scanning for and informing Guardians of incoming hostile
      threats, and providing communications. Most importantly, Ghosts may revive Guardians
      from death. As long as the Ghost survives, and barring special circumstances,
      Guardians are effectively immortal and can be resurrected fully intact from
      any form of death without consequences. The death does not have to be immediate,
      nor do they have to be revived in the same place they died. Ghosts may also
      repair any injury a Guardian suffers in a matter of seconds. *Sparrow: A Sparrow
      is a single-passenger, all-terrain antigrav bike with one purpose: moving from
      objective to objective with unmatched speed. Sparrows are quick, quiet, and
      simple to transmat. *Saint-14''s Gray Pigeon: A one-seat Guardian jumpship,
      Saint-14''s personal aircraft uses a City-standard NLS Drive that bends space
      around the vehicle for almost instantaneous travel between planets. Suitable
      for both vacuum and in-atmosphere operations; can be left in orbit and teleported
      to or from at any time per a Guardian''s need. |}'
    source_ids:
    - vsbattles-saint-14-destiny
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: At least Above Average (As the first Vanguard Commander, Saint-14 would
      need an impressive degree of intelligence, as this position requires the user
      to be able to manage almost everything going on in The City and with other Guardians.
      In terms of fighting, Saint-14 has quite an impressive record, with him being
      hailed for his actions at the Battle of Six Fronts, his successful crusades
      against the Fallen, and fighting the Vex for centuries on end, even killing
      the mind specifically designed to kill him. Ghosts are likely around Extraordinary
      Genius, as they are companion supercomputers capable of deciphering information
      incomprehensible to normal minds)
    source_ids:
    - vsbattles-saint-14-destiny
    confidence: 0.6
    notes: auto_repair source extraction
