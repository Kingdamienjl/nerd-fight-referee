        can cause his powers to change for better or worse. Rarely takes things seriously,
        which usually cause Gabriel to stumble into rather hilarious and unnecessary
        troubles. Because of their ludicrous status, size and importance, the Demiurgic
        Archangels must adhere to the laws implemented in specific parts Creation
        if they want to enter it. In other word, they must limit their powers to enter
