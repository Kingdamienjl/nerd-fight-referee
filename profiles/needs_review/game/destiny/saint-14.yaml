        Gabriel was also unable to use his powers to its full extent when he entered
        Castiel's Universe, which is possibly what allow the Seraph to overcome the
        Godheads' rule. The third Archangel was also powerless when he was tortured
        in a specific region of Hell (created and ruled by Leech) and in that moment,
        he was as powerless as any damned soul there. Luckily, the so-called laws
        the Three Angels have to follow is fickle at best, as Gabriel's powers are
        unchanged and unrestricted in most places in Creation. While staying in Creation,
        all Three Original Angels are also susceptible to, and naturally, adhere to
        all conceptual laws, such as that of the Endless, like all beings (although
