        special perk ''Starless Night'', which blinds enemies that enter Saint-14''s
        Ward of Dawn as well as temporarily blinding nearby enemies when Saint-14
        guards with his Sentinel Shield. * Ghost: For a Guardian, their Ghost serves
        as a companion, scout, librarian, and mechanic, able to activate ancient machinery
        and act as a codebreaker. Ghosts can support Guardians by performing certain
        actions such as illuminating darkened areas, repairing technology, scanning
        for and informing Guardians of incoming hostile threats, and providing communications.
        Most importantly, Ghosts may revive Guardians from death. As long as the Ghost
        survives, and barring special circumstances, Guardians are effectively immortal
        and can be resurrected fully intact from any form of death without consequences.
        The death does not have to be immediate, nor do they have to be revived in
        the same place they died. Ghosts may also repair any injury a Guardian suffers
        in a matter of seconds. *Sparrow: A Sparrow is a single-passenger, all-terrain
        antigrav bike with one purpose: moving from objective to objective with unmatched
        speed. Sparrows are quick, quiet, and simple to transmat. *Saint-14''s Gray
        Pigeon: A one-seat Guardian jumpship, Saint-14''s personal aircraft uses a
        City-standard NLS Drive that bends space around the vehicle for almost instantaneous
        travel between planets. Suitable for both vacuum and in-atmosphere operations;
        can be left in orbit and teleported to or from at any time per a Guardian''s
