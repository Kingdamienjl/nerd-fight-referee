    - field: weaknesses
      value: 'Exposing to The End reel will cause The Cycle to reset, rendering him
        incapacitated. | None notable. | Is commonly prone to play with his food or
        torture them mentally, which led to many intentions of him eventually failed.
        Despite being ubiquitous and overwhemingly powerful, The Ink Demon cannot
        fully escape the restriction of The Cycle and still has to rely on intervention
        from the outside to in order to do so. Note 1: Feats of Bendy gang in the
        comic should be applied for animated entities from the games, as this confirmed
        the existence original toon characters and based on the fact that The Dark
        Puddles can replicate traits of fictional characters. Note 2: The books are
        no longer canon to the mainline series. However, due to the existed relations
        and parallels between these, considering The Cycle is the pathway connecting
        the universes of novelization and games, those statements about The Cycle
        and The Nothingness itself can be counted as bigger cosmology. Note 3: The
        Ink Demon not being able to a door or getting outrun by Henry/Audrey is a
        part of game mechanics. It is stated by Buddy that the Ink Demon likes playing
        with his victims and he even admitted himself that Audrey was always a pawn
        to him, hench any of these moments should be explicitly taken as irrelevant
        to his power. Note 4: The Projectionist capable of "harming" the pre-evolved
        Ink Demon is an outlier, as he got easily defeated by a Keeper in Bendy: Lone
        Wolf. Note 5: A universe in Bendy verse is called a World, as the universe
        outside The Cycle is referred to as "the outside world". Feats: * Can casually
        kill Henry and Audrey in a single blow. * Shattered large metal gates like
        paper cardboards. * Easily defeated Shipahoy Dudley, who is more than twice
        of his size. * Has broken into the North Wing of Civilized World and caused
        the area to lock up, where is filled with signal pylons that can nullify abilities.
        * Has returned to his normal form and regained his prime immediately after
        being awakened by Audrey, despite formerly being stripped of his powers and
        trapped in a different form by signal pylons. * Is responsible for the madness
        of Lost Ones and many other Ink Creatures in the new Cycle. * Is the cause
        of all anomalous phenomenon within The Cycle, including Horror Visions, as
        The Cycle is consistently claimed to be his personal realm. * Created a warped
        version of a floor level, which is located within The Nothingness, that he
        can control and erase at will. * His mere presence causes The Cycle to shutter
        and stop growing. * Cannot be destroyed by The Master''s power, which is capable
        of warping all realities within The MultiverseSpacial Displacements of Unknown
        Elements. * Will eventually cause The Cycle to bleed into The Real World as
        his presence is outside, with The Cycle being emphasized to be endless multiple
