- id: claim-powers-and-abilities-5e3a1ce8
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Weapon Mastery, Vehicular
    Mastery, Flight (via Mounts), Accelerated Development, Acrobatics, Enhanced Senses,
    Preparation, Stealth Mastery, Non-Physical Interaction (Can harm ghosts and beings
    made of Aether. Can damage entities with Nonexistent Physiology such as Neo Exdeath),
    Immortality (Type 4, can be resurrected after death through Aetheryte Crystals),
    Regeneration (Mid-Low. Recovers from deadly wounds by resting), Can use the Echo,
    which grants Automatic Translation (Can communicate with others regardless of
    language, species, and dialect), Psychometry (The Echo can see countless of years
    into the past and read the memories of others. The Warrior of Light''s power has
    grown to the point he can see the past of those he hears about as well as from
    otherworldly scrolls from a different language shown during the Palace of the
    Dead), Precognition (From training in the Hall of the Novice, the Warrior of Light
    learned how to predict other people''s movements through body language. Can predict
    a targets next attack by detecting aether. Has the power to experience the future
    and everything that can and will happen to the point where every failure or defeat
    is reduced to a mere premonition. This power is potent enough to affect Alexander
    who is an Acausal (Type 3) being that can predict every possible timeline past,
    present, and future), Extrasensory Perception (Can, for example, see Moogles who
    are completely undetectable by regular people. Can see Ascians who are "indistinct"
    and cannot be perceived by anyone without the Echo. Can sense evil), Information
    Analysis (Through seeing the flow of Aether, the Warrior of Light can see the
    attack of targets, Lifeforce, and casting times. The resonant, such as Zenos and
    Fordola, can use this to predict and avoid attacks), Statistics Amplification
    (via Brilliant Conviction. Speed increase via Sprint), Reactive Power Level (As
    shown during Omegascape, the Warrior of Light''s power increases in response to
    stress. The stronger his opponent is, the stronger he becomes), Aether Manipulation
    (Capable of controlling Aether, the source of all Life and Reality), BFR (Purged
    Lahabrea from Thancred''s body by sending him to the realm of light), Transformation
    (Can change his Job class at will to gain different powers and abilities), Aura,
    Damage Boost (All of their attacks multiplies their damage based on the ability),
    Light Manipulation (All jobs use Aether to enhance their attacks with various
    auras or other effects. Can unleash the power of light to fight against the darkness),
    Blessed (via Hydaelyn''s Blessing), Forcefield Creation (Can use the Echo to create
    a barrier to protect others from Primal tempering. Hydaelyn will create a barrier
    to protect the Warrior of Light if he is about to die), Power Nullification (During
    the fight against Ultima Weapon, Hydaelyn took away the Primals power from Ultima
    Weapon. The Ascians, who are the forces of darkness, are unable to fully use their
    powers in his presence), Social Influencing, Summoning (Can summon Midgarsomr
    and various other mounts to ride on. Can summon minions to accompany him. With
    the crystal of Azem, can summon Warriors of Light from across dimensions to aid
    him), Teleportation (via Teleport and Return), Dimensional Travel (Can teleport
    across universes), Dimensional Storage, Healing (Can restore health and MP via
    potions), Purification (Can cure blindness, silence, poison and various other
    illnesses using medicine), Poison Manipulation and Status Effect Inducement (via
    Poisons), Resurrection (via Phoenix Down), Dream Manipulation (Imagination is
    strong enough to mentally create stronger versions of enemies he faced and then
    fight them. Can use the echo to alter dream worlds, allowing him to summon allies
    while in another''s dreams), Illusion Creation (Can use glamours to change the
    appearance of their armor and weapons), Absorption (The Warrior of Light partially
    absorbs the essence of every primal he defeats), Empowerment (Empowered by Stress,
    Light, Aether, and his Inner Darkness), Self-Sustenance (Type 1. Can survive in
    the vacuum of space and breathe underwater), Reactive Evolution (Becomes resistant
    to Status Effect Inducement after being inflicted once), Homing Attack (Many of
    their attacks have homing properties) Immortality Negation (via White Auracite),
    limited Gravity Manipulation (Anti-gravity Gimbal allows levitation but cannot
    go back down on its own), Electricity Manipulation (Omega Jammer unleashes a large
    powerful lightning that is effective against machines. Can be used to charge up
    devices) Role Actions: Damage Reduction (Rampart is a shared tank ability that
    reduces the damage the user takes by 20%. Tank Mastery is a passive that reduces
    damage taken by 20%), Paralysis Inducement (Can stun foes using Low Blow), limited
    Empathic Manipulation (Can use Shirk to divert enmity onto allies, and can use
    Provoke to draw enmity. Can use Ultimatum to provoke near'
