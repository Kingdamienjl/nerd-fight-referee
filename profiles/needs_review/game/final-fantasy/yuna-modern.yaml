    - field: intelligence
      value: Average for her age, but Gifted in combat. In the matter of a single
        fight, she mastered everything she needed in order to fight the Vertex with
        the techniques she acquired through the Hero System, which includes several
        martial arts (presumably the same ones as Yuna Takashima). Despite being a
        melee fighter, she's quick enough to counter the individual projectiles of
        a danmaku attack from the Sagittarius Vertex. Yuna is extremely courageous
        and tenacious, fighting against the dread and fear of her post-apocalyptic
        world, standing strong against the Vertex, and never losing hope or spirit.
        She has impressive willpower, always standing up to fight against adversity
        and never giving up, despite having the odds against her. She even went as
        far as to directly confront her best friend Mimori Togo when she tried to
        destroy the world out of desperation. She's also a competent and charismatic
        morale leader, and is very proactive.
      source_id: mediawiki-yuna-modern
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'If she loses the will to go on, Yuna cannot become a Hero. In YuYuShou,
        her immortality has limits. Notable Attacks/Techniques: *Hero Punch: Yuna''s
        first fairy, Gyuki, allows her to condense energy into her gauntlets, and
        lets her release it in a punch she dubs the "Hero Punch". *Hero Kick: Yuna''s
        second fairy, Kasha, allows her to control fiery energy with her greaves,
        and lets her release it in explosive kicks that she dubs the "Hero Kick".
        Immortality/Invulnerability: * Yuna Chapter: Yuuna''s fairies protect her
        from all kinds of damage and death (poisoning, extreme beat-up, suicide, drowning,
        hanging, disembowelment, free fall, etc.), whether she''s in Hero mode or
        not. The fairies themselves are unscratchable, unkillable and will always
        save the Hero no matter what. Even if her organs stop functioning (including
        the heart) or her soul is removed from her body, she won''t die. * Hero Chapter:
        Due to the new Hero system and Shinju''s weakening, the Fairies were nerfed.
        Each Hero only has 1 Fairy (their first) and is equipped with a 5-level gauge.
        Each time the Fairy protects the Hero from a deadly/KOing blow (from any cause,
        just like before), the gauge decreases by one level, and if the gauge is empty,
        the Hero will die from such an attack. If the Hero goes Mankai, the entire
        gauge is used at once, Mankai''s duration lasts depending on how many levels
        were left and the Fairy remains present to protect the Hero for as long as
        Mankai lasts. The gauge automatically replenishes itself during battle. Note:
        Over the course of the series, the Heroes have battled Vertex of varying levels,
        ranging from Large Mountain to Moon level. When focusing on defense, it has
        been shown that Heroes can tank stronger attacks at base, like from the Scorpio
        Vertex, and up to Moon level in Mankai mode. However, on several occasions
        in Mankai mode, Heroes have been knocked out by weaker surprise attacks against
        which they didn''t react in time. The Heroes are however unkillable by anything
        below Universe level, due to the divine protection they receive from Shinju
        via the Fairies. ==Gallery== File:Kasha-and-gyuki.png|Yuna''s fairies, Kasha
        (left) and Gyuki (right) File:Hero-kick.gif|Hero Kick! File:Hero-punch.gif|Hero
        Punch! File:Shinju-Yuna.png|Yuna in Great Mankai mode (as seen in the anime)
        ==Notable Matchups== Victories: Losses: Hibiki Tachibana (Senki Zesshou Symphogear)
        Hibiki Tachibana''s profile (Mankai Yuna and Season 2 Hibiki without X-Drive
        were used. Both in-character and speed was equalized) Walpurgisnacht (Puella
        Magi Verse) Walpurgisnacht''s Profile (Mankai Yuna and True Power Walpurgisnacht
        were used) Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
