      confidence: 0.75
    - field: intelligence
      value: Lulu is one of the most experienced members of the party, having been
        a guardian for two other summoners before becoming Yuna's. She specializes
        heavily in Black Magic, bombarding foes from a distance with a variety of
        powerful spells to prevent them from ever approaching her. In addition, she
        eventually becomes one of the strongest guardians in history, having contributed
        to the defeat of Sin, a feat thought impossible up to that point. However,
        Lulu suffers from the guilt of failing to protect her last two summoners and
        can be emotionally distraught in addition to her preference to stick to the
        traditional ways, leaving her sorely behind on varied and modern trains of
        thought.
      source_id: vsbattles-yuna-modern-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "She has a limited supply of mana, but her Onion Knight doll renders\
        \ this issue virtually non-existent, Lulu is shackled emotionally and spiritually\
        \ by the guilt from her past actions and her preference for traditional methods,\
        \ which she does not get over until the end of the game. Notable Attacks/Techniques:\
        \ |-|Innate= \u25AA Doublecast: Lulu is able to rapidly cast two copies of\
        \ the same spell simultaneously, effectively doubling her casting speed and\
        \ firepower. \u25AA Focus: Lulu increases her allies' magic power and magic\
        \ defense. \u25AA Reflex: Lulu increases her party's evasion, making it easier\
        \ for them to dodge attacks. \u25AA Firaga: Lulu scorches her target with\
        \ a massive fireball to deal heavy fire-elemental damage. \u25AA Blizzaga:\
        \ Lulu freezes her target with huge ice crystals, dealing heavy ice-elemental\
        \ damage. \u25AA Thundaga: Lulu calls down several large lightning bolts to\
        \ smite her enemies, dealing heavy lightning-elemental damage. \u25AA Waterga:\
        \ Lulu generates a spontaneous burst of water that crashes into her opponent\
        \ like a geyser, dealing heavy water-elemental damage. \u25AA Bio: Lulu creates\
        \ a cloud of noxious gas that poisons her enemies. \u25AA Demi: Lulu creates\
        \ a condensed sphere of gravity that crushes enemies under its weight. \u25AA\
        \ Death: Lulu summons a spectral figure, which drags its talons though her\
        \ target's chest and instantly kills them. Ther also works on robotic enemies\
        \ and ghosts unless they explicitly resist instant death. \u25AA Flare: Lulu\
        \ generates a spontaneous nuclear reaction that engulfs the targets in a massive\
        \ non-elemental burst of energy. \u25AA Ultima: The ultimate Black Magic,\
        \ Lulu blasts her foes with an incredible amount of arcane energy, exceeding\
        \ all other spells in her arsenal in terms of raw power. \u25AA Fury: When\
        \ using her Overdrive, Lulu is able to rapidly cast a single spell up to sixteen\
        \ times in an instant for no cost and bypasses any and all anti-magic barriers.\
        \ As a trade-off, she must still spend a significant amount of time to cast\
        \ her spells and each spell used in this manner is greatly weakened in potency.\
        \ |-|Inherited= Contrary to popular belief, the party members are not limited\
        \ to their sections of the Sphere Grid and are capable of branching into the\
        \ sections of other characters. Key Spheres, which are strictly used for this\
        \ purpose, are canonically given out at certain points in the story, and character-exclusive\
        \ abilities like Lulu's Black Magic and Kimahri's Lancet are discussed as\
        \ if they are common abilities and not completely restricted to the characters\
        \ in question. As a result, the party is entirely capable of using each other's\
        \ abilities, as long as they are part of the Sphere Grid. Yuna's Sphere Grid:\
        \ \u25AA Curaga: Lulu significantly heals herself or one of her allies. \u25AA\
        \ NulBlaze: Lulu nullifies all fire damage for herself and her allies for\
        \ one attack. \u25AA NulShock: Lulu nullifies all lightning damage for herself\
        \ and her allies for one attack. \u25AA NulTide: Lulu nullifies all water\
        \ damage for herself and her allies for one attack. \u25AA NulFrost: Lulu\
        \ nullifies all ice damage for herself and her allies for one attack. \u25AA\
        \ Esuna: Lulu removes all negative status effects on herself or one of her\
        \ allies. \u25AA Life: Lulu revives one of her allies if they happen to die,\
        \ though they are nonetheless still significantly injured. \u25AA Full-Life:\
        \ Lulu revives one of her allies at their full strength. \u25AA Shell: Lulu\
        \ enhances an ally's magic defense, halving the damage of all spells directed\
        \ at them. However, there is also inclusive of any healing spells. \u25AA\
        \ Protect: Lulu enhances an ally's physical defense, halving any damage they\
        \ receive from physical attacks. \u25AA Reflect: Lulu creates a barrier around\
        \ herself that automatically reflects any spell back at her enemy. \u25AA\
        \ Dispel: Lulu removes any sort of buffs her enemy has that would increase\
        \ their power. \u25AA Regen: Lulu casts a spell that gradually heals herself\
        \ or one of her allies over a period of time. \u25AA Auto-Life: Lulu casts\
        \ a spell that ensures that, upon death, she will be automatically revived.\
        \ \u25AA Holy: Lulu calls down a massive beam of holy-elemental energy to\
        \ blast her foes. Wakka's Sphere Grid: \u25AA Dark"
