    - field: standard_equipment
      value: 'Red-xiii-portrait.jpg|Nanaki resting alongside Cait Sith Sg-ffvii-red-xiii-header.jpg|Nanaki
        standing alongside the petrified body of his father, Seto. FF7_Mythril_clip.jpg|Artwork
        of the Mithril Clip. FF7_Limited_moon.jpg|Artwork of the Limited Moon. FF7_Ribbon.png|The
        Ribbon''s original design in Final Fantasy VII Nanaki_Materia_Menu.jpg|Nanaki
        Materia Menu Materia Types.jpg|Materia types, including the unique Holy and
        Meteor MateriaAC.JPG.jpg|Cloud''s Materia collection in Advent Children Kadaj-absorbing-a-Materia-FFVIIAC.jpg|Kadaj,
        a remnant of Sephiroth, absorbs Materia directly in his arm *Mithril Clip:
        Nanaki''s initial weapon. A hairclip of mysterious properties that enhances
        Nanaki''s physical power. *Limited Moon A final gift given to Nanaki by Bugenhagen
        in his deathbed under the promise that Nanaki would travel the world and truly
        experience life and it wonders. This special hairband increases Nanaki''s
        physical might the closer his MP is to its maximum. *Ribbon: A red ribbon
        Nanaki keeps tied in his left foreleg, in honor to his fallen friend, Aerith.
        The Ribbon has a mysterious power that protects its wearer from all of the
        game''s Status Ailments. *Materia: Rarely, the Spirit Energy of Lifestream
        may be particularly abundant in an area on the Planet''s surface, and for
        years it can concentrate in that certain spot to then condense and crystalize,
        eventually becoming Materia. In the modern day, the Shinra Electric Power
        Company artificially manufactures Materia through their extraction of Mako,
        the term they''ve given to the Spirit Energy they''ve extracted through reactors.
        Contained in it is the wisdom of the Cetra, an ancient race who were spiritually
        connected to the Planet and knew how to access its powers. Materia allows
        the access to this knowledge to be able to call upon those powers, just like
        the Cetra did, in many different ways, most notably Magic. There are different
        kinds of Materia, represented by different colors: green (Magic), red (Summoning),
        yellow (Commands), blue (Support) and purple (Independent). Materia can be
        equipped in many different ways: Cloud and the party slot them into their
        weapons and armor, Vincent can additionally put them in keychains attached
        to his guns, Zack can carry up to six in his person, while the Remnants of
        Sephiroth, due to their nature, can absorb them directly into their bodies.'
