        eager to learn new things and assimiliate new experiences and become wiser.
        Raised by the Bungah tribe, Nanaki is well informed of the importance of knowledge
        and experiences in the journey of life, which leads him to be a quick learner
        and keen observer of the events around him. In battle he joins right away
        as an adept Materia user and skilled combatant, gaining a wealth of experience
        from travelling with the rest of the party and facing all sort of enemies,
