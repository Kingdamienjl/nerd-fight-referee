        Berserk Mode, Self-Time Acceleration and Offensive Statistics Amplification
        (via Howling Moon); Heat Manipulation, Light Manipulation and Matter Manipulation
        (via Cosmo Memory); Non-Physical Interaction (able to hurt and defeat the
        ghost and souls of the fallen Gi Tribe); Regeneration Negation (Up to Low-High,
        the pieces of Jenova, even cells, destroyed by the party are gone for good
        and can''t be used for the Reunion to rebuild Jenova''s body) and Immortality
        Negation (Types 2, 3, 6, 7 and 8. Can permanently kill Jenova and her pieces,
        who aside from being extremely durable is able to regenerate from single cells,
        as well as survive as long as just her cells remain, through which she can
        enforce her will, even through other people injected with them. Additionally,
        can permanently finish off the souls and spectres of the Gi Tribe). Resistance
        to Banishment (despite entering the Planet''s Core within the Lifestream itself,
        Nanaki was not taken forcefully taken from the living world. Later, his spirit
        followed Sephiroth''s deeper into the Lifestream without being reclaimed);
        Mind Manipulation and Memory Manipulation (his mind has grown strong enough
        to not collapse nor be eroded under the weight of the Spirit Energy of the
        Lifestream); Soul Manipulation, Soul Absorption and Empathic Manipulation
        (his spirit was not forcefully diffused nor reabsorbed by the Lifestream);
        Biological Absorption, Deconstruction and Matter Manipulation (his physical
        body wasn''t absorbed nor was dissolved by the Lifestream to retake his Spirit
        Energy); Corruption (Types 1 and 2, despite immense exposure to Spirit Energy,
