      \ the same level as Minerva, a being stronger than Summons,Crisis Core -Final\
      \ Fantasy VII- (2007) thus above Zirconiade and far more powerful than Bahamut\
      \ ZERO), likely Multiverse level+ (Scales to Cloud, who fought in Ramza Beoulve's\
      \ army during his stay in Ivalice, as an equal to Balthier and Luso Clemens,\
