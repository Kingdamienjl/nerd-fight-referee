      \ a Summon equal to Shiva. Grew stronger since then and earned control of stronger\
      \ Summons like Leviathan and Bahamut), even higher with Limit Breaks (Limit\
      \ Breaks are stated to allow the user to reach power far beyond their usual\
      \ capabilities) | Multi-Solar System level (Can achieve this level of power\
      \ with Stardust Ray. Comparable to Cloud, who survived the energy releasedFinal\
