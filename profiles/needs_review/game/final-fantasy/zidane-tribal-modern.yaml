    - field: weaknesses
      value: "Nanaki must be pressed in battle to use his Limit Breaks, thus most\
        \ of the time he can't use them right away nor repeatedly. Despite his maturity\
        \ and intelligence, Nanaki is still young and rather naive when it comes to\
        \ new experiences and can be emotionally overwhelmed by extreme situations\
        \ he's unprepared for, and while very rare, if angered enough, Nanaki will\
        \ lose himself to rage and his beastly instincts, becoming completely berserk.\
        \ Notable Attacks/Techniques: Limit Breaks are powerful special moves Nanaki\
        \ can perform in battle. All living beings have a portion of the Spirit Energy\
        \ that flows through the Lifestream in themselves, when this energy raises\
        \ to its limit it eventually aligns and overflows allowing to go beyond the\
        \ user's normal capabilities and reach a much greater power, just as their\
        \ name indicate. Limit Breaks are affected by emotions, intense ones such\
        \ as rage can lead to attain the state to use these moves much faster than\
        \ usual. A proof of their power can be seen in Cloud's battle against Bahamut\
        \ SIN: his regular attacks did little more than annoy the Summoned Beast,\
        \ however his Braver Limit Break could scar its face and knock it off the\
        \ air, sending it plummeting to the ground, while Climhazzard could destroy\
        \ Bahamut with a single use. Level 1: *Sled Fang: Nanaki charges at the enemy\
        \ as his body is surrounded by Spirit Energy flowing in a spiral motion for\
        \ a powerful tackle. *Lunatic High: Nanaki howls as a surge of Spirit Energy\
        \ raises from him and his allies, adding Haste to the whole party and increasing\
        \ Nanaki's evasion for each of his companions still standing. Level 2: *Blood\
        \ Fang: Similar to Sled Fang but the Spirit Energy engulfing Nanaki becomes\
        \ red instead. While noticeably weaker, Nanaki absorsb health and energy equal\
        \ to a portion to the damage he dealt. *Stardust Ray: The surroundings turn\
        \ dark and Nanaki howls, as a rain of lights resembling stars falls on enemies\
        \ striking many times. Level 3: *Howling Moon:Nanaki jumps high in the air\
        \ as the image of a full moon appears behind him while he howls. This move\
        \ adds Haste to Nanaki and induces the Berserk state increasing his attack\
        \ by 50% due to the effects of the condition, in addition to giving himself\
        \ a 60% attack boost. However, if Nanaki is wearing his Ribbon or is under\
        \ the Resist spell, the Berserk state won't take effect (which includes its\
        \ boost of 50% to attack). *Earth Rave: Nanaki charges at the enemy and unleashes\
        \ a barrage of five incredibly heavy attacks with enough force to shatter\
        \ the ground below him, in a shockwave of Spirit Energy. Level 4: *Cosmo Memory:\
        \ Nanaki conjures thousands of small lights emulating a starry sky, crystals\
        \ of star energy that surround and form a ball of fire above Nanaki. The energy\
        \ of these miniature stars accumulate and is then released at the enemies\
        \ in the form of a massive blast, creating a huge explosion of heat that makes\
        \ all enemies combust. Accessed through the Green Materia, this allows the\
        \ wielder to access the wisdom of the Ancients, the Cetra, and the connection\
        \ they shared with the Planet to use its powers and manifest all sort of incredible\
        \ powers. These can range from offensive manipulation of the elements, to\
        \ support effects and even powerful healing abilities. While each Magic Materia\
        \ normally allows the use of a specific set of spells (such as Lightning allowing\
        \ to use Bolt, Bolt2 or Bolt 3; or Mystify granting Berserk and Confu, both\
        \ mind affecting spells), there exists the Master Magic Materia, which grants\
        \ the user every spell in existence with the exception of the one of a kind\
        \ Holy and Meteor. Notable spells include: Offensive: *Fire3 (Firaga), Ice3\
        \ (Blizzaga), Bolt3 (Thundaga) and Quake3 (Quaga): Very high-level elemental\
        \ magic that conjures their respective elements for a powerful attack to strike\
        \ a single enemy or a wide area. *Bio3 (Bioga): The user cast large bubbles\
        \ of venomous liquids that drown the enemy to inflict heavy damage and leave\
        \ them poisoned. *Demi3 (Graviga): A powerful gravity well is created to drag\
        \ and crush enemies within it. This spell cannot be reflected. *Comet2 (Cometeor):\
        \ Calls forth several small meteors from outer space to strike the enemy four\
        \ times. This spell cannot be reflected. *Death:A spell that conjures a Grim\
        \ Reaper to instantly kill an opponent. This spell can affect robotic enemies\
        \ and ghosts unless they explicitly resist instant death. *Tornado: A spell\
        \ that creates a powerful twister on an opponent. May inflict confusion. *Freeze:\
        \ A sudden cold surrounds an enemy and then they\u2019re instantly encased\
        \ in ice, freezing its surrounding area as well. May inflict Stop. *Break:\
        \ Rock is materialized around the opponent and proceeds to crush them, turning\
        \ them into stone as well. May inflict Petrification. *Flare: The user causes\
        \ a nuclear reaction by making the atoms of the target collide with each other,\
        \ resulting in a powerful explosion of extreme heat to completely incinerate\
        \ an opponent. *Ultima: The most powerful Black"
