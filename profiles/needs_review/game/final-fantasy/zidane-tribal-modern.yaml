        Power Mimicry and Power Absorption (Limit Breaks are born from the user''s
        Spirit Energy, which shapes their mind and soul, and cannot be copied or imitated,
        the sole exception being Zack who is acknowledged as an unusual case, and
        even then creates a variant of the original move).'
