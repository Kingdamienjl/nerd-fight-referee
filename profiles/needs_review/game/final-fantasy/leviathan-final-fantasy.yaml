- id: claim-weaknesses-cae17a4c
  section: weaknesses
  axis: weakness
  text: 'Due to specializing in the use of the oceans as a medium for his attacks,
    he is especially vulnerable to lightning-based abilities. Notable Attacks and
    Techniques: *Aqua Breath: Breathes out a gust of wind and sea water to blow away
    foes, dealing water and wind-elemental damage to all targets. *Blizzaga: Conjures
    a blizzard to buffet foes with icy winds, dealing heavy Ice-elemental damage *Cyclone:
    Leviathan generates a tornado that deals wind-elemental damage to all foes. *Deluge/Tidal
    Wave/Tsunami: Leviathan raises all the seas into the air, bringing them crashing
    down as a catastrophic tidal wave to crush and drown his foes, dealing massive
    water-elemental damage. *Demon Eye: Leviathan flashes an evil glare at his opponents,
    petrifying them and effectively killing them. *Slowga: Slows down time around
    Leviathan''s foes, heavily reducing their effective combat speed *Spring Water:
    Splashes allies with healing water, instantly restoring their vitality, closing
    wounds, and removing status effects like blindness, paralysis, and other impediments.
    *Summon: Sahagin: His Final Fantasy XIV incarnation is able to summon his followers,
    the Sahagins, from the depths to aid him in combat and disrupt his foes efforts.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
