  intelligence:
    text: Leviathan is one of the oldest and most powerful summons in every one of
      his appearances, his intelligence nevertheless varies between appearances. In
      some cases, he's a wise and ancient ruler, while he's a mindless or destructive
      beast in others. Regardless, what remains constant is the fact that he is ruthless
      in combat and has full mastery over his dominion of water and ice, drowning
      foes mercilessly should they face him unprepared. In Final Fantasy XIV, he will
      parry projectiles with his tough skull, and reflect magic with his tail, showing
      a keen understanding and awareness on how to counter his foes abilities.
    source_ids: *id002
