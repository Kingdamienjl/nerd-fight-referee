        instantly transform into a more aquatic form when needing to traverse through
        water, and then shift back into his humanoid form once he was back on the
        surface. Leviathan could also transform into his Full Demon Form (which was
        also his true form), as well as easily shift back to his normal form. Though
        his full powers were unleashed in his true, monstrous state, Leviathan had
        very rarely used this form in modern times, and very few entities had witnessed
        him in this state, and even fewer have lived to tell about it., Immortality:
        Leviathan was a primordial entity that was ancient enough that no one seems
        to know his true origins. He possessed an infinite lifespan and could live
        indefinitely, as he had shown little signs of aging, despite being a billion
        years old at the very least. Despite his never-ending lifespan, Leviathan
        could still be killed if he is struck with angelic weapons, and he could still
        be erased by immensely powerful entities above his level of power., Nigh-Invulnerability:
        During his time, Leviathan was extremely resilient and invincible to nearly
        all forms of weaponry or harm. His durability was increased exponentially
        in his true form, where the teeth of all trench dwellers were said to break
        upon contact with his nearly indestructible scales, from swords, harpoons,
        and even bullets simply bounced off his hide. His scales were even strong
        enough to repel bullets and arrows of holy properties, as shown during his
        battle with the hotel crew and I.M.P. Regardless, Leviathan could still sustain
        potentially irreversible damage if he was lethally attacked in a vulnerable
        and/or vital area with holy weaponry or divine entities. Indeed, Leviathan
        met his end and was slain when Millie utilized Scorpius'' holy fire ax to
        kill him from the inside., Regeneration: Leviathan could almost instantly
        regenerate from horrific injuries to the extent that he could regenerate his
        entire physical form. However, his powerful regeneration could be nullified
        by divine attacks, This was demonstrated when Scorpius used his holy fire
        ax to cut one of Leviathan''s tentacles from his back, which caused the King
        of Envy great pain'
