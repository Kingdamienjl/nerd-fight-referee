        ===Last Order -Final Fantasy VII-=== right|200px|thumb|Shotgun (Female) and
        [[Two Guns (Male)|Two Guns in Last Order.]] The Last Order -Final Fantasy
        VII- OVA illustrates the events surrounding Zack Fair and Cloud Strife''s
        escape from Nibelheim''s mansion, overlapping with incidents depicted in Final
        Fantasy VII and Before Crisis -Final Fantasy VII-. The OVA covers the Turks''
        role during both the Nibelheim Incident and events leading up to Zack''s Final
        Stand against the Shinra military; addressing the Turks'' pursuit of Zack
        and Cloud through the Mythril Mine and their ill-fated search for the pair
        in the Midgar Wasteland. {{clear}} ===On the Way to a Smile=== While not specified
        by name, many of the Turks who had gone into hiding following the battle against
        Zirconiade reappear during the events of Final Fantasy VII as specified in
        the chapter "Case of Shinra". Following Tseng being attacked by Sephiroth
        in the Temple of the Ancients, Cait Sith appears to stable his condition before
        contacting three of the Turks to bring him to Junon for treatment. Later on,
        while observing the ruins of the Shinra Building following the attack by the
        Diamond Weapon, Reno and Rude recollect the times themselves and the other
        Turks had spent in the now ruined headquarters. During Meteorfall, the Turks
        and Verdot return to assist in the evacuation of Midgar and, following the
        Meteor''s destruction, the Turks leave, returning to the lives of exile, but
        also work to gather intelligence on the current state of the Planet from their
        respective locations sending the information to Verdot who would offer it
        to Tseng when required. ===Final Fantasy Artniks=== right|100px {{Section|Final
