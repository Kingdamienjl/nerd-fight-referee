    - field: attack_potency
      value: 'farming. For durability, Cloud benefits from {{icon|FFVIIR2|materia|steadfast
        block}} and {{icon|FFVIIR2|materia|precision defense focus}} due to how often
        he will be guarding and counterattacking, as both play into his Punisher Mode
        role well. As with all party members, {{icon|FFVIIR2|materia|First Strike}}
        can be useful to provide him a significant boost to ATB right at the start
        of the battle, which allows Cloud to open with Triple Slash for normal battles.
        Cloud can easily stagger enemies through Focused Thrust, which makes him a
        good candidate for the {{icon|FFVIIR2|materia|atb stagger}}. The {{icon|FFVIIR2|materia|skill
        master}} can also benefit him when using a variety of abilities in battle.
        As Cloud is both a good spellcaster and a physical attacker, he can benefit
        from the {{icon|FFVIIR2|materia|gilgamesh}}, which gives a balanced buff to
        both physical and magical attack power, as well as a small buff to HP. ===Limit
        breaks=== Cloud has three Limit Breaks, the third of which is unlocked through
        the skill tree in his folio. His initial Limit Breaks are Cross-Slash and
        Ascension. Both function the same as they do in Remake. Late into the game,
        he can also learn Finishing Touch, where he spawns a tornado to deal immense
        damage to enemies in a wide area. File:Cross-Slash from FFVII Rebirth.png|Cross-Slash
        File:Ascension from FFVII Rebirth.jpg|Ascension File:Finishing Touch from
        FFVII Rebirth.jpg|Finishing Touch ==Quests== Cloud is the main playable character
        for most of the game, with a few portions where he is unavailable, such as
        when crossing the mountains in Corel where Yuffie takes over. The player does
        not need to use him in their battle line-up in battle arena battles, and when
        playing though chapter select, but Cloud is usually the one being controlled
        on the field. Cloud Ex-SOLDIER First Class outfit from FFVII Rebirth render.png|Ex-SOLDIER:
        First Class. Cloud Ocean Chocobo outfit from FFVII Rebirth render.png|Ocean
        Chocobo. Cloud Wild Surf outfit from FFVII Rebirth render.png|Wild Surf. Cloud
        Midgar Infantry outfit from FFVII Rebirth render.png|Midgar Infantry. == Notes
