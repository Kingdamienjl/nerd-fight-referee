    - field: weaknesses
      value: 'Cloud must be pressed in a battle to use his Limit Breaks, so most of
        the time he can''t use them right away or in succession. After the events
        of Final Fantasy VII, he has become moody and depressed over his failure to
        protect Aerith, Zack''s sacrifice to protect him and being unable to help
        Denzel''s fatal condition, Geostigma. Along with this poor disposition, the
        presence of Jenova Cells in his body led him to contract the disease himself
        and his performance in combat suffered noticeably as a result. However, having
        coming to terms with his failures and letting go of his burdens by the end,
        as well as being healed of the Geostigma, his strength and will to fight are
        back and stronger than ever. Feats: Show/Hide ===Strength=== *Went right through
        a very large piece of concrete. *Cut large debris in half from his motocycle.
        *Sliced large part of buildings into pieces. *Attacked Sephiroth hard enough
        to indent the metal they are standing on when he blocks. *Pushed Sephiroth
        through multiple floors of a building. *Threw Sephiroth after being stabbed
        hard enough to break machinery on the wall. *FF7 version *Jumped very far.'
