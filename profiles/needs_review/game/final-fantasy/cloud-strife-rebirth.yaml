  stamina:
    text: Superhuman (Fought entire gauntlets of monsters, for what seem to be hours,
      with no sign of exhaustion. Clashed with powerful enemies under extreme conditions,
      such as fighting off the Remnants of Sephiroth while afflicted with Geostigma,
      a fatal disease whose symptoms include extreme fatigue and bouts of intense
      physical pain; as well as being able to keep going against Sephiroth despite
      sustaining heavy injuries, including being wounded in vital organs)
