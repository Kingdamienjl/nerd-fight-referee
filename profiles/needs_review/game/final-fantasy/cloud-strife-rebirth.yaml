        Moogle Class |{{icon|FFVIIR2|effect|limit level increase}} |} Cloud can perform
        various synergy abilities with each of his party members. Performing a synergy
        command with a party member for the first time improves the pair''s relationship
        scores, used to determine Cloud''s date for chapter 12, "A Golden Key". Cloud''s
        versatility allows him to benefit from synergy abilities in a number of ways.
        United Refocus allows Cloud to build and consume ATB much more quickly. This
        can benefit any of his roles, either as a supporting or attacking party member
        to allow him to perform abilities more quickly. Cloud can increase stagger
        time of opponents with Relentless Rush or Halcyon Descent. His Infinity''s
        End can take advantage of a staggered opponent, but otherwise he is not specifically
        geared to taking advantage of staggered foes anymore than any other party
        member. Cloud''s limit breaks are all physical damage abilities. If Cloud
        is built this way, using Partners in Pain, Firework Blade, Savage Assault,
        Maelstrom Strike, or SOLDIER Moogle Class allows him to unlock stronger limit
        breaks, improving a great source of damage output for him. Cloud''s strong
        magic stats and MP make him an effective spellcaster, both in a supporting
        role or offensive role based on build. However, using Synchro Cyclone or Curiosity''s
        End can grant temporary unlimited MP to allow him to use these spells even
        more freely. Firework Blade from FFVII Rebirth.png|Firework Blade with Aerith.
