      \ the 2nd which effortlessly defeatedBefore Crisis -Final Fantasy VII- (2004)\
      \ 2nd Class SOLDIER members, like Sebastian and Essai,Crisis Core -Final Fantasy\
      \ VII-: The Complete Guide (2007) whom compare to Zack Fair when he took down\
      \ Ifrit, a Summon equal to Shiva. Grew stronger since then and earned control\
      \ of stronger Summons like Leviathan and Bahamut), even higher with Limit Breaks\
      \ (Limit Breaks are stated to allow the user to reach power far beyond their\
      \ usual capabilities) | Multi-Solar System level (Equal to Red XIII. Survived\
      \ the energy releasedFinal Fantasy VII (1997) by the awakening of 5 of the 8\
      \ Weapons at once and defeated the Ultimate, Ruby and Emerald Weapons alongside\
      \ his team, each Weapon being around the same level as Minerva, a being stronger\
      \ than Summons,Crisis Core -Final Fantasy VII- (2007) stronger than Zirconiade,\
      \ thus far above Bahamut ZERO), likely Multiverse level+ (During his stay in\
      \ Ivalice, Cloud fought in Ramza Beoulve's army as an equal to Balthier and\
      \ Luso, the former whom had fought and defeated Gilgamesh twice alongside Vaan,\
      \ and the latter whom had teamed up with Vaan on his own journeys. Though Cloud\
      \ arrived in a very weakened state, he quickly caught up and became much stronger\
      \ upon returning to the Planet and restoring his true self), higher with Limit\
      \ Breaks | Multi-Galaxy level (Controls the Knights of the Round, the only Summon\
      \ who is far stronger than Minerva. Was instrumental in the defeats of Jenova\u2219\
      SYNTHESIS, the strongest she has ever been,Final Fantasy VII: Ultimania Omega\
      \ (2005) and Safer Sephiroth whom had become a being described as godlikeFinal\
      \ Fantasy: Ultimania Archive - Volume 2 (2018) and nearing godhood after absorbing\
      \ knowledge from the Lifestream and completing the Reunion, then winning the\
      \ duelFinal Fantasy VII: 10th Anniversary Ultimania (2007) between their Spirits\
      \ in the Lifestream), likely Multiverse level+ (Far stronger than before), higher\
      \ with Limit Breaks | Multi-Galaxy level, likely Multiverse level+ (Much more\
      \ powerful than before, something Sephiroth acknowledges and is impressed by,Final\
      \ Fantasy VII: 10th Anniversary Ultimania (2007) despite his own superior power.\
      \ Even when suffering from Geostigma,Final Fantasy VII: 10th Anniversary Ultimania\
      \ (2007) Cloud could hold his own against the three Remnants of Sephiroth, among\
      \ whom Kadaj is stated to beFinal Fantasy VII: Advent Children -Reunion Files-\
      \ (2006) as strong as Sephiroth was in the original game. Once cured, Cloud\
      \ could easily defeat Kadaj), far higher with Limit Breaks (Cloud's Limit Breaks\
      \ have become powerful to the point they can one-shot enemies that normally\
      \ are unaffected by his regular attacks, such as Bahamut SIN or Sephiroth, the\
      \ latter whom had easily controlled their duel despite holding back) | Multiverse\
      \ level+ (Draws power from the Gods of the Cycle. Participated in the defeat\
      \ of Shinryu)"
