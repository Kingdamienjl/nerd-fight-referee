    - field: powers_and_abilities
      value: Braver.|thumb|left Cloud's abilities are normally melee attacks from
        his sword, but have some variety. The vast majority of his abilities deal
        physical damage and are based on his attack power. His starting abilities
        are Braver and Triple Slash, both returning from Remake. Braver deals great
        damage to a single target or cluster of enemies, while Triple Slash spreads
        its damage across three enemies, also making Cloud mobile, but each slash
        deals less damage against one target. Cloud has two other straightforward
        melee abilities, both returning from Remake. Focused Thrust, learned early,
        causes Cloud to forward thrust, and will deal minimal damage but will greatly
        increase an opponent's stagger gauge (particularly if pressured). Infinity's
        End however, is a slow ability that costs two ATB charges, but deals immense
        damage against a staggered opponent. This can be in the tens of thousands
        when Cloud has equipped. thumb|Disorder. Many of Cloud's abilities fit his
        playstyle as a counterattacking party member with his Punisher Mode. Disorder
        is a melee attack that will instantly switch modes when used, allowing Cloud
        to shave some animation time if intending to switch. Counterstance causes
        Cloud to guard against an attack, and after receiving one, unleash a significant
        attack of his own. New to Rebirth, Prime Mode costs an ATB charge to grant
        Cloud a more powerful version of Punisher Mode. Cloud's remaining abilities
        are different attacks. Blade Burst deals non-elemental magic damage in a medium
        range in front of him, which can be beneficial if Cloud is built toward magic
        damage. New to Rebirth are Firebolt Blade and Aerial Onslaught. The former
        is a melee attack that deals both and in an attack. The latter is an ability
        Cloud unlocks from his folio, deals several powerful hits but is only usable
        while Cloud is airborne. Focused Thrust from FFVII Rebirth.png|Focused Thrust
        Triple Slash from FFVII Rebirth.png|Triple Slash Firebolt Blade from FFVII
