        spells that are capable of reflecting attacks back. *Bless: The user''s magic
        power recovers at a steady rate. *Phoenix: The user can revive and restore
        other members should they die. *Limit Break: The user breaks their previous
        limits, being capable of dealing damages tens of tim'
