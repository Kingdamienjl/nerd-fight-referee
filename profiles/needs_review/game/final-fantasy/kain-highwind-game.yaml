  intelligence:
    text: Gifted. Kain is calm, collected, and stoic in combat, always focusing on
      the task at hand. As the Commander of the Dragoons, he is Cecil's equal in combat
      and a renowned general and tactician, even putting him on a higher level than
      the Baron knights, who are trained to analyze their targets in a few seconds
      to determine their weaknesses to take them down. He was also one of the first
      to realize that Cecil was being brainwashed by the Maenads during the events
      of the After Years and guided Ceodore to help him overcome his doubts. In combat,
      he's described as a Tactical Striker, utilizing his aerial advantage to come
      down on foes when the time is right and speeding after them to prevent them
      from recovering from his initial assault. He controls the battle with his lance's
      supreme range and versatility for a melee weapon, knocking them into the air,
      smashing them into the ground, or sending them flying away with a thrust. Most
      of all, he's a supreme acrobat and can maneuver in the air almost as easily
      as if he were flying. He uses this to dodge his foe's attacks while striking
      back with the tremendous force he gains while in free fall.
    source_ids:
    - vsbattles-kain-highwind-game-final-fantasy
