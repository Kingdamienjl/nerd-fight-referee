        him a chance to dodge attacks and strike back down with massive damage), Blessed
        (Is blessed by The Crystals, granting him their abilities), Extrasensory Perception
        (Can sense killing intentFinal Fantasy IV Volume 2 Novel, chapter 8, page
        141), Regeneration Negation (Mid-Godly) and Immortality Negation (Types 3,
        4, 6, 7, and 9; Is capable of killing undeads and beings who resurrect in
        Mount Ordeals. Additionally, destroyed Scarmiglione whose true power manifests
        by coming back as an undead after death. Is even capable of permanently killing
        the Leshy creature, which can live on via possessing another corpse.Final
        Fantasy IV Settings Guidebook Is also capable of killing beings who are blessed
        with the Crystals, who grant these immortalities and regeneration abilities),
        Weapon Mastery (Is a master of Axes, Daggers, Spears and Sword), Resistance
        Negation (Can bypass the enemies innate resistance to status ailments and
        being analyzed via the Bestiary itemFinal Fantasy IV and the numerous Lunar
