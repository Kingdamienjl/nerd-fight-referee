    - field: intelligence
      value: Gifted. Kain is calm, collected, and stoic in combat, always focusing
        on the task at hand. As the Commander of the Dragoons, he is Cecil's equal
        in combat and a renowned general and tactician, even putting him on a higher
        level than the Baron knights, who are trained to analyze their targets in
        a few seconds to determine their weaknesses to take them down. He was also
        one of the first to realize that Cecil was being brainwashed by the Maenads
        during the events of the After Years and guided Ceodore to help him overcome
        his doubts. In combat, he's described as a Tactical Striker, utilizing his
        aerial advantage to come down on foes when the time is right and speeding
        after them to prevent them from recovering from his initial assault. He controls
        the battle with his lance's supreme range and versatility for a melee weapon,
        knocking them into the air, smashing them into the ground, or sending them
        flying away with a thrust. Most of all, he's a supreme acrobat and can maneuver
        in the air almost as easily as if he were flying. He uses this to dodge his
        foe's attacks while striking back with the tremendous force he gains while
        in free fall.
      source_id: mediawiki-kain-highwind-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Kain keeps his repressed jealousy towards Cecil locked inside, which
        can manifest as an evil doppleganger known as Dark Kain, but he has gotten
        over this by the time he becomes a Holy Dragoon. Notable Attacks/Techniques:
        *Cyclone: Spins his spear to fire a ball of compressed wind as a projectile.
        *Dragon''s Fang: Kain flings his spear to strike stab the enemy and can even
        strike them at tight angles. *Dragoon''s Pride: His EX Burst in Dissidia,
        Kain launches himself in the air at incredible speeds, gaining altitude before
        reaching the peak of his jump. With the two moons of his world behind him,
        he runs his opponent through with his lance, leaving behind a beam of holy
        light that erupts and engulfs the opponent. *Gungnir: Kain throws his spear
        at his enemy, dragging the opponent all the way across the arena if it hits
        or until they slam into a wall or the ground before recalling the spear. *Jump:
        Kain''s signature ability. As a Dragoon, Kain is able to leap incredible distances
        in the air and freely maneuver through it, allowing him to come down with
        the momentum accumulated from his free fall, greatly amplifying the strength
        of his attacks while rendering him virtually impossible to hit with most attacks.
        While equipped with the Dragoon Gauntlets he gains access to Double Jump,
        allowing him to descend upon his foes with even greater speed and power. *Lancet:
        Kain is able to generate a phantasmal spear that impales his foe from below,
        healing him for an amount equal to the amount of damage his foe takes. *Rising
        Drive: Ascends into the air while spinning, drilling his spear into his opponent''s
        body before sending them flying. *Sky Rave: Descends on an opponent while
        spinning, dealing damage multiple times as he twists his spear into the target''s
        body before sending them crashing into the ground. *Blink: Kain casts a spell
        that causes him or an ally to begin generating afterimages as they move, confusing
        enemies who rely on sight and making it for more difficult to land a hit.
        *Cure: Casts a spell that heals himself of minor injuries. **Cura: A more
        powerful version of cure that heals moderate injuries. *Esuna: Removes negative
        status conditions such as poison, blinding, or paralysis on himself or allies.
        *Haste: Speeds up time around himself or an ally, increasing their effective
        combat speed. *Hold: Kain casts a spell that instantly paralyzes the target,
        forcing them to watch helplessly as Kain attacks them. *Teleport: Warps Kain
        to a place of his choosing, allowing him to evade large-scale attacks. *Item
        Lore: The user is capable of increasing the effectiveness of both healing
        and damaging items. *Counter: The user automatically counter attacks when
