    - field: weaknesses
      value: 'His lack of authority and incredibly high ego feed his irresponsibility,
        which leads to irrational moves. Notable Attacks/Techniques: *Fire Cross:
        The first stage of Seifer''s limit break where he starts by casting a fire
        spell (single/multiple enemies, depending on the skill) and then attacking
        the stunned foe with a sword technique. Though Final Fantasy VIII''s in-game
        information confirms he does not use real magic, but chi-based attacks. *No
        Mercy: Seifer casts a fire spell to all enemies, spins his gunblade around
        and starts focusing power into it, and, in an upward slash-motion, launches
        circular blades of energy at his foe. The blasts fly through the enemies and
