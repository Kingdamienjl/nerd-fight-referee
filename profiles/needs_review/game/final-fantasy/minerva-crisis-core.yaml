- id: claim-standard-equipment-f1c85963
  section: equipment
  axis: equipment
  text: '*Scepter: Minerva''s main weapon in combat. A long scepter she uses more
    like a spear for thrusts and swings in deadly combinations with impressive reach
    and speed. *Shield: A huge round shield Minerva carries in her left arm that reaches
    up to her shoulders. *Armor: Minerva''s massive ornamental armor of gold and white
    colors, with a Greek motif and wing patterns and shapes over it. On her back floats
    a large emblem with wings in a wheel-like shape. *Bow and Arrow: Used for her
    ultimate move, Judgment Arrow. Minerva relinquishes most of her armor, alongside
    her scepter and shield, and the pieces assemble in a huge bow and arrow she aims
    at Zack.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
