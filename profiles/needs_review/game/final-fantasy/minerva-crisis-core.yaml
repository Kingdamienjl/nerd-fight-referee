      value: 'Scepter: Minerva''s main weapon in combat. A long scepter she uses more
        like a spear for thrusts and swings in deadly combinations with impressive
        reach and speed., Shield: A huge round shield Minerva carries in her left
        arm that reaches up to her shoulders., Armor: Minerva''s massive ornamental
        armor of gold and white colors, with a Greek motif and wing patterns and shapes
        over it. On her back floats a large emblem with wings in a wheel-like shape.,
        Bow and Arrow: Used for her ultimate move, Judgment Arrow. Minerva relinquishes
        most of her armor, alongside her scepter and shield, and the pieces assemble
        in a huge bow and arrow she aims at Zack.'
      source_id: mediawiki-272812
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Extraordinary Genius. If she is indeed a manifestation of the Lifestream,
        she likely has access to the knowledge that has accumulated over the history
        of the Planet coming from the lives of billions of creatures of all kinds.
        In her own displays, Minerva shows expertise and skill capable to match Zack
        Fair a SOLDIER with over 300 missions of all kinds under his belt over the
        course of many years, as well as displaying grace and mastery both in weapon
        combat, tactics and magical abilities to pressure Zack in a way no other opponent
