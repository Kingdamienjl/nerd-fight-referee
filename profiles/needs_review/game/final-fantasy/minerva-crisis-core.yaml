- id: claim-powers-and-abilities-1036deef
  section: abilities
  axis: hax
  text: 'General: *Superhuman Physical Characteristics, Weapon Mastery (of spears,
    shields and bows), Levitation, Telekinesis (can control her weapons and armor
    this way), Incorporeality and Non-Physical Interaction (describedCrisis Core -Final
    Fantasy VII-: The Complete Guide (2007) as a being that trascends physical matter),
    Magic (as a being that''s part of the Lifestream, the powers of the Planet are
    inherently Minerva''s thus its properties are also hers) that gives her access
    to: Light Manipulation (via Photon Feather), Fire Manipulation (via Crimson Flare),
    Homing Attack (both Photon Feather and Crimson Flare track enemies), Electricity
    Manipulation (via Thor''s Hammer), Ice Manipulation that likely reaches Absolute
    Zero (as a being superior to Summons and part of the Lifestream itself, Minerva''s
    cold should be superior to Shiva''s who reachesFinal Fantasy Explorers. Japanese
    Website Summon profiles (2014) these temperatures and whose powers come from the
    Lifestream as well) and Holy Manipulation (the Planet itselfFinal Fantasy VII
    (1997) has holy properties, which Minerva can likely grant to her attacks), Healing
    (via Blessing Light), Invulnerability (via Absolute Ward, which makes her immune
    to physical and magical damage, as well as any sort of non-direct offensive Zack
    has for 20 seconds, as well as Anti Material for physical attacks and Anti Magic
    for magical ones) and Energy Projection (via Ultima) Judgment Arrow: *Pocket Reality
    Manipulation (like Summons, Minerva can draw her enemies to an alternate realmCrisis
    Core -Final Fantasy VII-: The Complete Guide (2007) to unleash her most powerful
    attack), Minor Sealing and Danmaku (Judgment Arrow traps the opponent within a
    circle of runes to bombard them with energy arrows before unleashing the main
    attack), Invulnerability Negation, Reflection Negation, Power Nullification, Energy
    Depletion and Magic Depletion (Judgment Arrow bypasses shields and barries, like
    the special moves of other Summons it cannot be reflected and disables all enhancements
    and positives bonuses on the target and fully depletes their magic and stamina
    reserves)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
