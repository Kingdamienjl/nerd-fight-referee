power_scale:
  tier:
    text: 4-A, higher with Spirit Energy
    source_ids: &id002
    - mediawiki-272812
    confidence: 0.8
  attack_potency:
    text: 'Multi-Solar System level (According to Kunsel''s MessageCrisis Core -Final
      Fantasy VII- (2007), Minerva is above the Summons. This includes the ones the
      Shinra Company had information about, among them Zirconiade, whose summoning
      was treated as an unprecedented crisis and threat far above Bahamut Fury, even
      when Zirconiade was nowhere near its full power. Additionally, Zirconiade''s
      eventual destruction at the hands of the Player Turks caused the Planet to send
      the Jade WeaponFinal Fantasy VII: 10th Anniversary Ultimania (2007) to investigate
      the event, proving to be a far greater threat to Zirconiade''s destroyers, meaning
      Minerva would be on par with individual Weapons as well), higher with Spirit
      Energy'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Stronger than all Summons the Shinra Company has information
      about, which includes Bahamut Fury. Could match Zack in combat, who is much
      stronger than said Summon as well. Stronger than Red XIII by the time he first
      learns to use the Stardust Ray Limit Break)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Stellar (Is stronger than Zirconiade, which would make Minerva far superior
      to Typhon)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Multi-Solar System level (Can easily inflict critical injuries on Zack with
      just a few of her physical attacks)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Multi-Solar System level (Far above Bahamut Fury and superior to Zirconiade.
      Can endure Zack's attacks who would take down a prime condition Genesis and
      Angeal, both also above Bahamut Fury. Should be on par with the Weapons, who
      were unaffected by their mutual massive energy release when five of them awakened)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman, possibly Infinite. Mission briefings report that the amount
      of energy coming from Minerva was limitless. Considering Minerva is not a physical
      being, but rather a manifestation of the Lifestream, which in itself is made
      of life energy, her sources may be very well the Planet itself.
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range with her weapons. Tens of Meters with her abilities.
      At least a few Kilometers to dimensional with her energy emanations. Planetary
      with Judgment Arrow.
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Extraordinary Genius. If she is indeed a manifestation of the Lifestream,
      she likely has access to the knowledge that has accumulated over the history
      of the Planet coming from the lives of billions of creatures of all kinds. In
      her own displays, Minerva shows expertise and skill capable to match Zack Fair
      a SOLDIER with over 300 missions of all kinds under his belt over the course
      of many years, as well as displaying grace and mastery both in weapon combat,
      tactics and magical abilities to pressure Zack in a way no other opponent has
      managed to, with the sole exception of Sephiroth.
    source_ids: *id002
    confidence: 0.8
