        armor of gold and white colors, with a Greek motif and wing patterns and shapes
        over it. On her back floats a large emblem with wings in a wheel-like shape.,
        Bow and Arrow: Used for her ultimate move, Judgment Arrow. Minerva relinquishes
        most of her armor, alongside her scepter and shield, and the pieces assemble
        in a huge bow and arrow she aims at Zack.'
      source_id: vsbattles-minerva-crisis-core
      provider_id: vsbattles
      authority: high
      confidence: 0.75
