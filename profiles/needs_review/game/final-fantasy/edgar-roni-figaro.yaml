      advanced nations on Earth, having created many of its state-of-the-art systems
      himself. He is also a skilled actor, successfully acting as a double agent for
      the Returners until Kefka himself decided to set Figaro Castle ablaze. In combat,
      his aptitude for magic is lacking, but he makes up for it with the skillful
      use of his many inventions, allowing him to keep up with even Espers and far
