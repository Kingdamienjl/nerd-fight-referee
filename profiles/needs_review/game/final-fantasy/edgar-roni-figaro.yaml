    of resisting the Fire and Ice spell, which is capable of affecting the target''s
    electrons), Electricity Manipulation and Pain Manipulation (Is able to resist
    the Lightning spells, which is capable of attacking the nerves), Earth Manipulation,
    Air Manipulation, Water Manipulation, Holy Manipulation (via Several armors and
