- id: claim-powers-and-abilities-81f23cba
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery and Martial Arts (Is
    capable of utilizing numerous different weapons to its maximum potential, even
    down to hand to hand combat to where he rivals Monks in terms of skill), Accelerated
    Development (Is capable of increasing his own proficiency in stats, Weapons, and
    magic at a far faster rate than normal through constant use of their capabilities),
    Extrasensory Perception (Mages can do this naturallyFinal Fantasy IV: The After
    Years), Magic, Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1,
    page 29 in its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting
    one''s innerFinal Fantasy IV: The After Years Novel, chapter 2, page 109 mind
    onto realityFinal Fantasy IV: The After Years, and is powered by intelligence
    and mental strength), Non-Physical Interaction (Magic as a whole is shown to affect
    a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal
    Fantasy I, to Nonexistent beings like Exdeath and Cloud of Darkness), Conceptual
    Manipulation (Type 2), and Space-Time Manipulation (Magic is shown in the novels
    to remove concepts and warp space and time itself, like the Devil''s road, which
    the concept of time was lost,Final Fantasy IV Novel 1, chapter 5, page 199 and
    time and space were twisted to the pointFinal Fantasy IV: The After Years Novel,
    chapter 1, page 67 the past, present and futureFinal Fantasy IV: The After Years
    Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The After Years Novel,
    chapter 3, page 147), Law Manipulation (Magic is stated to rewrite the natural
    order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Power Modification
    (Including Duplication, Fusionism, Statistics Amplification, Size Manipulation,
    Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation; Magic users
    across the games have consistently shown the ability to manipulate the shape and
    properties of their own magical abilities, with even higher tiers of spells simply
    being considered stronger versions of the same basic abilityFinal Fantasy IV:
    The After Years Novel, chapter 2 page 114), Energy Manipulation (in the form of
    Ultima), Healing, Barrier Creation, Elemental Manipulation (Can utilize numerous
    different elemental spells for combat), Fire Manipulation, Ice Manipulation and
    Matter Manipulation (Sub-Atomic; Can use different levels of Fire and Ice magic.
    Both Fire and Ice related abilities are stated to affect the target''s electrons,
    being able to even negate durability in the process), Electricity Manipulation
    and Pain Manipulation (via Thunder spells, which are capable of attacking the
    nervesFinal Fantasy IV Volume 2 Novel, chapter 7, page 54), Sleep Manipulation
    and Biological Manipulation (via Sleep, which can affect the target''s cerebral
    cortex), Poison Manipulation, Disease Manipulation, and Corrosion Inducement (Can
    inflict Poison with Poison and Bio, the former is stated to corrode the target,
    and the latter inflicts the target with a disease), Transmutation (via Toad) Darkness
    Manipulation and Perception Manipulation (via Blind spells, which can control
    the darkness and render a foe blindFinal Fantasy V GBA Manual), Holy Manipulation
    (via Holy), Teleportation and BFR (The Teleport/Warp spells are capable of banishing
    targets to the Void, which inflicts the following abilities on the victim: Existence
    Erasure/Void Manipulation, Mind Manipulation (which includes Madness Manipulation
    (Type 3), and Perception Manipulation), Space-Time Manipulation, Time Stop, and
    Corruption (Type 2)), Life and Magic absorption (via Drain and Osmose respectively),
    Explosion Manipulation (via Flare), Status Effect Inducement (via Stun), Statistics
    Reduction (via Curse), Death Manipulation and Blood Manipulation (Can cast the
    Death spell, which is even stated to solidify the victim''s blood,), Soul Manipulation
    (via Death, the Death spell reaps the targets soul; killing themFinal Fantasy
    VI), Rage Power (via Berserk), Statistics Amplification (via Blink, Protect, Shell,
    and Wall), Size Manipulation (via Mini), Power Nullification (via Silence), Durability
    Negation (via Swap), Petrification (via Break), Morality Manipulation and Madness
    Manipulation (Type 2; Can inflict the Confuse status ailment on targets, which
    can drive the target insane to attack anyone, even their allies), Fear Manipulation
    (via Fear), Memory Manipulation (Can inflict Amnesia on the targets via Fog),
    Time Manipulation (in the forms of Haste, Slow, and Stop) Resistant to the following:
    Subjective Reality, Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation
