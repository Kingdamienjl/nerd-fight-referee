    - field: powers_and_abilities
      value: 'Joseph Joestar (Part 2)=Superhuman Physical Characteristics, Limited
        Extrasensory Perception (Due to being a member of the Joestar Bloodline, Joseph
        is able to sense the locations of other members of the Joestar Bloodline in
        a city-wide radius), Martial Arts (Joseph is a master of the Sendo technique,
        the way of the Hermit, a martial arts that specialises in the usage of Hamon),
        Accelerated Development (Training; Has a high amount of innate talent, surpassing
        even those with over a decade of training within just 3 weeks), Vehicular
        Mastery (Joseph is a master at driving a variety of vehicles such as a motorcycle,
        a horse chariot, a war plane, a commercial aeroplane with damaged controls,
        a speedboat, a submarine and a dune buggy), Weapon Mastery (Joseph is a master
        at a variety of weapons such as a tommy gun, grenades, a knife and chain,
        clackers, string from a wool hat, a Warhammer and a crossbow, Explosion Manipulation
        (With Grenades), Joseph has proven to be an expert marksman even with weapons
        that aren''t to be launched as projectiles), Statistics Amplification (By
        using Hamon, Joseph can drastically increase his strength, speed and durability),
        Regeneration (Mid-Low, Has healed a broken arm and a broken neck), Enhanced
        Metabolism (Type 2 & 3, Hamon Warriors are able to last at least sixty-one
        hours and nine minutes without any food, water or sleep), Energy Projection,
        Vibration Manipulation (Through a unique breathing technique, Hamon users
        can draw out vibrations from their blood flow and create energy waves with
        the properties of sunlight, capable of transferring it towards objects and
        people. This can be used to harm any opponent weak to sunlight through contact
        with any living or non-living thing charged with Hamon]), Pain Suppression
        (Hamon can surpress the pain of Jonathan to the point that he can shake off
        his arm being dislocated), Indomitable Will (Was unfazed by having a spinning
        blade cut down to his bone, Has fought in battles with broken bones, Was in
        no pain after Dio froze both his arms and legs and grabbed one of his veins),
        Water Walking (Hamon Warriors can use their Hamon to step and walk on water
        without falling into it), Limited Surface Scaling (Hamon Warriors are able
        to climb up walls if they are coated in a substance that Hamon can conduct
        through like oil), Afterimage Creation (Can move his arms so fast that they
        appear in multiple places at the same time, Scales to Dire who is able to
        move his entire body so fast that he creates afterimages that make him look
        as if he''s in multiple places at the same time), Body Puppetry, Mind Control
        (Hamon can be used to control the bodies of other people, both alive and dead
        and animals such as snakes and pidgeons), Mind Reading (Hamon can be used
        to retrieve memories from the minds of others), Durability Negation (Hamon
        can attack a person''s insides and affect their organs or brain), Clairvoyance
        (Using water with Hamon, Jonathan can make a radar to pinpoint the location
        of his opponent when he has no idea where they are hiding), Life Manipulation
        (Jonathan''s excess Hamon caused a dead tree to come back to life), Water
        Manipulation (Other Hamon Warriors like Lisa Lisa who is able to make entire
        pillars of water by using her Hamon and Caesar Anthonio Zeppeli who is able
        to form bubble projectiles by using his Hamon and Messina and Loggins who
        are able to fully control the water in a glass of water with nothing but their
        Hamon), Attack Reflection, Forcefield Creation (Hamon can be used to create
        a thin shield around the user or to use items like hair to form a forcefield
        to protect them against attacks from attack, These forcefields can be used
        to reflect attacks back at the opponent if the forcefield is made with the
        right materials and in the right shape), Biological Manipulation, Purification
        (Type 3, Managed to restore Bruford''s humanity by using his Hamon), Non-Physical
        Interaction (Hamon is able to effect Stands which are intangible spirits),
        Healing (Hamon was used in the past to heal others of their injuries such
        as a leg that was so ill that it had to be amputated back to full health),
        Limited Regeneration Negation (High-Mid: Hamon can destroy Pillar Men whose
        regeneration is superior to that of normal vampires, like Straizo, who regenerated
        from being blown apart by grenades and in order to cease the life functions
        of Santana, an inferior Pillar Man, the body must be shredded into 1cm squared
        pieces. Possibly Mid-High: Even the dust from their body is alive and can
        reassemble itself), Information Analysis, Analytical Prediction (Joseph is
        able to analyse his opponents and predict what the opponent will do next to
        the point that Joseph can predict what they will say next), Limited Fourth
        Wall Awareness (Made note of how he hasn''t had many cool scenes lately),
        Instinctive Reactions (While near death, Joseph''s body instinctively moved
        in order to use the Red Stone of Aja)'
