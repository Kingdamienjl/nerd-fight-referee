    Asura), Pocket Reality Manipulation (via Lunar Bahamut and Lunar Ramuh since they
    made their own pocket dimensions in their dungeons), Water Manipulation (via Lunar
    Leviathan), Death Manipulation (via Lunar Odin), Radiation Manipulation (via Megaflare,
    which is statedFinal Fantasy IV: The After Years Novel, chapter 5, page 270 numerous
    times to be a nuclear powerFinal Fantasy IV: The After Years Novel, chapter 5,
    page 271), Shapeshifting and Power Mimicry (Lunar Bahamut was able to shapeshift
    into Kain and copy his abilities) Resistant to the Following: Subjective Reality,
    Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation (Characters
    are capable of surviving and resisting magical abilities, Which is shown to project
    one''s inner mind onto reality, and as shown with the creation of the Devil''s
    road, remove entire concepts and warp space and time to where the past, present,
    and future exists as one), Law Manipulation (Resists magic, which can rewrite
    the natural order of things), Gravity Manipulation (Unaffected by the gravitational
