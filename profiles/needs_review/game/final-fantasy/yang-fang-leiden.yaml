    Pressure Points, Durability Negation, Elemental Manipulation, Death Manipulation
    (Knows the Tenketsu technique despite not using it in-game, as Ursula learned
    it by watching him), Energy Manipulation (Can enchant his attacks with energy,
    as shown in Bands), Invulnerability and Attack Reflection (Can nullify any physical
    attacks and reflect magical attacks via the Lunar Curtain), Extrasensory Perception
    (Can sense other beingsFinal Fantasy IV), Weapon Mastery (Is skilled with Clawed
    weapons), Martial Arts (As a Monk, he''s been trained to be one of the best fighters
    in his kingdom, which excels in martial arts), Regeneration Negation (Mid-Godly)
    and Immortality Negation (Types 3, 4, 6, 7, and 9; Is capable of killing undeads
    and beings who resurrect in Mount Ordeals. Additionally, destroyed Scarmiglione
    whose true power manifests by coming back as an undead after death. Is even capable
    of permanently killing the Leshy creature, which can live on via possessing another
    corpse.Final Fantasy IV Settings Guidebook Is also capable of killing beings who
    are blessed with the Crystals, who grant these immortalities and regeneration
    abilities), Fire Manipulation, Ice Manipulation, and Matter Manipulation (Sub-Atomic;
    Has access to different weapons and items powered by Fire and Ice magic, Both
    Fire and Ice related abilities are stated to affect the target''s electrons, being
    able to even negate durability in the process), Resistance Negation (Can bypass
    the enemies innate resistance to status ailments and being analyzed via the Bestiary
    item and the numerous Lunar summons, which can affect Zeromus despite him being
    resistant to these effects), Electricity Manipulation and Pain Manipulation (Lightning
    abilities are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel,
    chapter 7, page 54), Madness Manipulation (Type 2) and Morality Manipulation (Can
    inflict targets with the Confuse status ailment, driving the target insane and
    attack anyone, even their allies), Soul Manipulation (can utilize Ifrit''s hellfire,
    which is stated to burn the soul awayFinal Fantasy IV: The After Years Novel,
    chapter 3, page 160), Poison Manipulation and Corrosion Inducement (Can inflict
    Poison with the Hellish Claws, which is also stated to corrode the target), Sleep
    Manipulation and Biological Manipulation (Can put enemies to sleep with the Cat
    Claws, which can affect the target''s cerebral cortex), Paralysis Inducement (Can
    inflict Paralyze on the target with Tiger Fangs), Holy Manipulation (via Holy
    Claws). Has gained the abilities of the Lunar Summons, which should grant him
    the following: Mind Manipulation and Age Manipulation (via Lunar Mist DragonFinal
    Fantasy IV), Earth Manipulation (via Lunar Titan), Fire Manipulation (via Lunar
    Ifrit), Ice Manipulation and Absolute Zero (via Lunar Shiva), Electricity Manipulation
