        \ |ffbe=true |wotv=true |theatrhythm=true |gallery=true }} {{Quote|This is\
        \ it. This is your story. It all begins here.|Auron to Tidus}} Auron {{IPA|\u02C8\
        \u0254\u02D0.\u0279\u0259n}} is a playable character in Final Fantasy X. He\
        \ is a former warrior monk of Yevon, a guardian of Summoner Braska, and Tidus'\
        \ caretaker. Auron watches over Tidus while concealing his mysterious past\
        \ tying him into the stories of Braska and Tidus' father, Jecht. After Auron\
        \ takes Tidus to Spira, the latter learns that Auron is revered as one of\
        \ the greatest guardians who ever lived due to serving Braska on his successful\
        \ pilgrimage. He becomes a guardian for Yuna, Braska's daughter, on her pilgrimage\
        \ and is, in many ways, the party's mentor, as the others come to him for\
        \ advice or ask for his permission. Auron wields katana and bracers in battle.\
        \ His initial Sphere Grid path boosts his HP and Strength, making him slow\
        \ but hard-hitting while granting him Break abilities, which weaken opponents.\
        \ His Celestial Weapon, the Masamune, deals more damage the lower Auron's\
        \ current HP is. His Overdrive is Bushido and he learns new abilities by collecting\
        \ movie spheres. ==Profile== ===Appearance=== left|150px|thumb|Portrait by\
        \ [[Tetsuya Nomura.]] Auron wears a red haori closed with a black and blue\
        \ strap with two brown belts wrapped around it. Auron tucks his left arm into\
        \ the front of his haori, making it look like his arm is in a sling. He removes\
        \ his left arm from the haori when fighting, but his right arm remains in\
        \ its sleeve. This aspect (along with the jug on his side) is a tradition\
        \ among r\u014Dnin, wandering masterless samurai, and is likely an homage.\
        \ He wears a black armored gauntlet on his right hand and an armor brace on\
        \ his left forearm. Auron wears a brown shoulder pad on his left shoulder\
        \ intricately decorated with tan, green, and blue patterns with a beaded ornament\
        \ dangling from it. He wears black pants and shoes that have brown straps\
        \ and triangular metal plating. Auron wears a black shirt with a high gray\
        \ collar with intersecting brown straps. His hair is black with gray streaks\
        \ held back by a gold ribbon and he has some stubble on his chin. 150px|thumb|Young\
        \ Auron by Tetsuya Nomura. Auron has a scar on the right half of his face\
        \ over his eye, which remains shut as a result. His left eye is amber and\
        \ he wears black sunglasses. On his right hip, Auron carries a jug with the\
        \ word \"Nog\" written on it (in Spiran script), a term used to describe some\
        \ beverages, including rum. The drink is featured in two of his Overdrives:\
        \ when executing Banishing Blade, Auron takes a drink and spits it on the\
        \ blade, and when using Tornado, Auron hurls the jug into the cyclone to ignite\
        \ it. The former is likely a homage to Japanese samurai, who would spit sake\
        \ on their swords to \"feed the spirit of the blade\"; sake has long been\
        \ valued within Shinto and Japanese culture as having mystical and sacred\
        \ properties that connects one with kami. Auron is often depicted wielding\
        \ large, heavy, long-handled swords deemed katana. His most common weapon\
        \ depiction is the model for the \"Blade\" variant, a steel gray shobu-zukuri\
        \ backsword with a grove at the back near the base to holster on one's shoulder\
        \ with a floral gold embossing and a long light green handle wrapping with\
        \ golden fullers and a pommel cap. Though the floral design is decorative,\
        \ the flow and layout of the design appear evocative of the kanji \u9053 (dou,\
        \ \"way, path\") done akin to artistic calligraphy in the sosho or \"grass\"\
        \ cursive style, which can be abstracted of details to evoke artistic quality\
        \ as if \"wind-blown grass\". In Final Fantasy X HD Remaster, Auron's character\
        \ model was remodeled so that his skin would resemble more of a real life\
        \ mid-30s man. His hair was elongated and made more disheveled, his shades\
        \ have better transparency, and the details for his clothing are sharper.\
        \ {{spoiler}} Auron was 25 when he died and became an unsent. While the other\
        \ met unsent appear static, still appearing youthful even after hundreds of\
        \ years, Auron has aged since his transition. Whether this is the pyreflies\
        \ aging him accordingly, or Auron's own choice to appear older, is never explained.\
        \ {{endspoiler}} ===Personality=== {{Quote|Fine, then. Come or don't come.\
