        Enhanced Awareness and Reflexes, Acrobatics, Energy Manipulation (can empower
        his attacks with his Spirit Energy when using Limit Breaks for greater power
        and different effects), Energy Projection (via Blade Beam and Meteorain),
        Attack Boost in the form of raw damage boost (via Limit Breaks, which are
        stated to reach power much greater than the usual capabilities of the user)
        and additional effects: Paralysis Inducement (via Cross Slash), Homing Attack
        (Blade Beam scatters into smaller, weaker beams that home on remaining enemies)
        and Instant Death (via Finishing Touch), Non-Physical Interaction (Able to
        hurt and defeat the ghost and souls of the fallen Gi Tribe), minor Soul Manipulation
        (disembodied souls struck down by Cloud don''t pass away but are destroyed
        instead. Additionally, Cloud''s disembodied spirit can attack and hurt other
        souls) and minor Astral Projection (can send his spirit into astral planes
        such as the Lifestream), Regeneration Negation (Up to Low-High, the pieces
        of Jenova, even cells, destroyed by the party are gone for good and can''t
        be used for the Reunion to rebuild Jenova''s body) and Immortality Negation
        (Types 2, 3, 6, 7 and 8. Can permanently kill Jenova and her pieces, who aside
        from being extremely durable is able to regenerate from single cells, as well
        as survive as long as just her cells remain, through which she can enforce
        her will, even through other people injected with them. Additionally, can
        permanently finish off the souls and spectres of the Gi Tribe), Mind Reading
        (the Jenova Cells in his body can read the memory of other people, however,
        he has no control of this ability therefore is not combat applicable) Resistance=Resistance
        to Banishment (despite entering the Planet''s Core within the Lifestream itself,
        Cloud was not taken forcefully taken from the living world. Later, his spirit
        followed Sephiroth''s deeper into the Lifestream without being reclaimed),
        Mind Manipulation and Memory Manipulation (his mind has grown strong enough
