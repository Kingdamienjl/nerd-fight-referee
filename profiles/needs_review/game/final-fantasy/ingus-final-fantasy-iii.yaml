    Manipulation, Time Stop, and Corruption (Type 2)), Berserk Mode, Size Manipulation,
    Attack Reflection Negation (Several spells pierce through reflect such as Drain,
    Tornado, Ultima and Gravity spells), Madness Manipulation (Can inflict confusion
