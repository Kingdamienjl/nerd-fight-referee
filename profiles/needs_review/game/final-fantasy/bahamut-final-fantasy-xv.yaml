  section: weaknesses
  axis: weakness
  text: Bahamut views mortals as mere pawns and doesn't care about their potential.
    The ultimate spell, Tera Flare, required the Oracle and all the darkness in the
    world as a source of power and took some time to charge, and casting it would
    greatly drain his stamina, but this weakness is conquered by Stranger of Paradise.
    The only way to truly defeat Bahamut was to simultaneously kill him in both the
    physical and spiritual realms.
