power_scale:
  tier:
    text: 2-A | 2-A
    source_ids: &id002
    - mediawiki-3420596
    confidence: 0.95
  attack_potency:
    text: Multiverse level+ (Vastly stronger than all the other Astrals, including
      Ifrit whom he personally killed during the War of the Astrals. Even after being
      drained from casting Tera Flare, he could fight competitively against all other
      Astrals, including Ifrit, who could possibly burn the entire world with his
      flames, Shiva, who killed Ifrit with a kiss, and Noctis as the King of Light,
      in the physical realm. His ultimate attack, Tera Flare, is powerful enough to
      wipe out all life on Eos. Even after the combined efforts of five Astrals greatly
      reduced its impact, Tera Flare's immense heat thawed the ice all over the world,
      transforming frozen tundras into vast wetlands.) | Multiverse level+ (Was able
      to fight Jack Garland's party and keep up alongside him against the likes of
      Gilgamesh, Nil, and Emperor Mateus. His blessing made the Warriors of Light
      considerably stronger in a short amount of time to impress Jack)
    source_ids:
    - mediawiki-3420596
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Can easily keep up with the likes of Noctis and the other
      Astrals like Leviathan or Ifrit, who was able to dodge his attack in Insomnia,
      should not be weaker than his Stranger of Paradise incarnation) | Massively
      FTL+ (Can keep up with Jack Garland)
    source_ids:
    - mediawiki-3420596
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class T (Superior to Titan)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multiverse level+ (Is fully capable of killing all the other Astrals, including
      Ifrit whom he one-shotted with one of his swords and destroyed his physical
      body to protect Regis from Ardyn.) | Multiverse level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multiverse level+ (It took combined efforts of five Astrals and the King
      of Light Noctis to destroy Bahamut's physical form, while Ardyn had to summon
      all the old Kings of the Lucis to kill the Draconian in the Beyond at the cost
      of his existence) | Multiverse level+
    source_ids:
    - mediawiki-3420596
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Only by unleashing Tera Flare, the ultimate spell of destruction,
      may Bahamut be exhausted and fall off slumber for a long time. Loses this restriction
      during Stranger of Paradise and can even launch Exaflare easily)
    source_ids:
    - mediawiki-3420596
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: At least Several Meters to Tens of Meters via sheer size, Planetary with
      powers and Tera Flare., Multiversal+ with magic
    source_ids:
    - mediawiki-3420596
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Bahamut is an excessively cunning being who manipulated all the
      people on Eos to destroy the Starscouge. He tricked Ardyn by giving him the
      ability to absorb demonic energy into his body so he could turn into a demonic
      being and play the role of a sacrificial lamb destined to spread the Starscourge,
      being killed by the True King. He blessed two bloodlines with his powers so
      he could use them to destroy the darkness, thus manipulating the entire conflict
      between the Light and the Darkness on Eos. In Dawn of the Future, he managed
      to manipulate Lunafreya by giving her the same healing powers he gave to Ardyn
      to make her absorb darkness, intending to use it to fuel his Tera Flare and
      wipe out all life on Eos)
    source_ids:
    - mediawiki-3420596
    confidence: 0.6
    notes: auto_repair source extraction
