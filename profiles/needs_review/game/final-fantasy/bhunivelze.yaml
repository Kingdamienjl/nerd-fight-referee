        across the entire Final Fantasy Multiverse and is stated numerous times to
        contain an infinite number of worlds, can banish foes into the Void) At Least
        Multiversal+, likely Far Higher (Unseen Chaos originates from a Higher Dimension
        known as the "Unseen Realm". Where the concepts of Space and Time are nonexistent
        due to outright transcending them, along with the stories, information, and
        memories that makes up the worlds below it, and is completely inaccessible
        to dimensions below it through normal means. Only by Etro opening her "Gate"
        can the Unseen Realm be accessed. The Unseen Realm exists above the world
        of Valhalla. Valhalla itself is a world that is stated numerous times to be
        beyond Space & Time, and is confirmed to be on a different plane of existence,
        where all timelines are able to be viewed from and are referred to as "lower
        worlds", which includes "The Void" which is described as a mere "Shadow" in
        comparison to Valhalla. The void being a structure that is stated multiple
        times to contain and infinite number of universes and harbor "Extradimensional
        Spaces" in relation to those worlds)'
      source_id: vsbattles-bhunivelze-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Extraordinary Genius: Created the Fal''Cie gods, Hallowed Pulse, Etro,
        and Lindzei with his will. Bhunivelze also orchestrated the events of Lightning
        Returns from the beginning, creating the Order of Salvation and playing with
        the emotions of several members of the cast through the use of promises and
        illusions, including Lightning and Hope, for much of the game. He also used
        Hope Estheim, who by that point in the series had become a widely respected
        and a capable leader as well as an expert on the time paradoxes, as his vessel,
        acquiring Hope''s knowledge on manipulating time and space as well as the
        ability to experience emotions to better understand and use them to further
        manipulate his foes to his ends. As the God of Light, he also wields the mightiest
        magics in the universe, including the ultimate elemental spells and the mighty
        Ultima and Heartless Angel in addition to nearly-exclusive abilities like
        the devastating Hypernova and Almagest. He is also aware of all the planes
        in the universe, easily retrieving Lightning from Etro''s throne and taking
        the two into Cosmogenesis for the final battle. As the mightiest of all Fal''Cie
        deities, he is also knowledgeable of all things related to Chaos. Which include
        Space-Time entanglements that have the past and future overlap with one another.
        Causing impossibilities to come into existence that distort and warp reality
        just by existing, a paradox. This effect is pretty directly compared to the
        infamous Schrodinger''s Cat experiment, as well as Graviton Ores which are
        made up of gravitons, which in turn are quantum particles. Also upscales from
        Eden who created "Orphan''s Cradle"'
      source_id: vsbattles-bhunivelze-final-fantasy
