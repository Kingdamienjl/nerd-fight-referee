  attack_potency:
    text: Multiverse level+ (Is stated to be the mightiest of all Fal'Cie which include
      his servant Etro who ruled over the world of Valhalla. A world that operates
      on a different plane of existence where all timelines are able to be seen from
      and are referred to as "Lower Worlds". Valhalla gives birth to, controls, contains,
      and connects multiple different timelines, of which are there are an infinite
      number of, which equate to infinite possibilities via The Historia Crux. This
      includes The Void, which is considered a mere "Shadow" in comparison to Valhalla.
      Able to give The Savior as a completed vessel a close fight in both his first
      and second forms despite losing. Created a new universe while the original was
      being consumed by the Unseen Chaos, which both he and Lightning said would be
      easy for him to destroy; struck down Mwynn, the original creator of the universe)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Able to keep pace with Lightning, his attacks reach this
      speed)
    source_ids: *id002
