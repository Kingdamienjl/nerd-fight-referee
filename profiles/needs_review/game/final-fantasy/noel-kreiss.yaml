  intelligence:
    text: Noel is initially cheerful, cocky, and straightforward. Confident in his
      abilities as a hunter and a fighter, he is excitable and eager to meet new people
      and try new things. However, his cheer should not be mistaken for softness,
      as he is indeed a skilled combatant, deftly switching between the dual swords
      and lance forms of his weapon to assault foes in close combat with a variety
      of attacks. He specializes in physically oriented roles such as Commando and
      Sentinel, withstanding his foes blows before countering with vicious flurries
      of counterattacks. He is also proficient as a Synergist, boosting his abilities
      and that of his allies. While not as proficient as Serah, he can also use a
      variety of elemental magics as a Ravager, targeting his foes' weaknesses with
      his experience as a hunter to deal maximum damage. By the events of Lightning
      Returns he can fight on one-on-one with Lightning, who had been empowered by
      Bhunivelze himself, on even ground. In addition, trauma from the events of the
      previous game along with five hundred years of solitude have left him a much
      colder person who is far more willing to kill his opponents, only upping his
      lethality further.
    source_ids:
    - vsbattles-noel-kreiss-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
