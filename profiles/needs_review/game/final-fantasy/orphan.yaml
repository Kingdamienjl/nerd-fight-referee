      fal'Cie themselves were hyped to be able to destroy Cocoon. Orphan's energy
      in his base form is calculated at 106,823 exatons. Superior to Barthandelus.)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Sub-Relativistic (Capable of fighting and reacting to the party and Incomplete
