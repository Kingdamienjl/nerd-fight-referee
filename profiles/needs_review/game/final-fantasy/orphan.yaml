    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Moon level+ (Comparable to Incomplete Ragnarok)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Moon level+ (Comparable to the party that can survive its Merciless
      Judgment, also implied to have fought and withstood blows from Incomplete Ragnarok
      Which plowed through Orphan's magical barrier in four strikes before Etro decided
      to intervene and revert Fang back to her l'Cie form. The implication existing
      due to the fact that Orphan needed to heal Fang after she was reverted by Etro
      on top of Orphan's disappointment as opposed to shock at an unexplained and
      abrupt reversion, indicating a brief fight went on off screen)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Has perpetually kept Cocoon floating in the sky for over a thousand
      years)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Multiversal+ (With Magic; Magic as a whole is shown to affect omnipresent
      beings such as Exdeath when he's become one with the Void itself, which spans
      across the entire Final Fantasy Multiverse and is stated numerous times to contain
      an infinite number of worlds, can banish foes into the Void) At Least Multiversal+,
      likely Far Higher (Unseen Chaos originates from a Higher Dimension known as
      the "Unseen Realm". Where the concepts of Space and Time are nonexistent due
      to outright transcending them, along with the stories, information, and memories
      that makes up the worlds below it, and is completely inaccessible to dimensions
      below it through normal means. Only by Etro opening her "Gate" can the Unseen
      Realm be accessed. The Unseen Realm exists above the world of Valhalla. Valhalla
      itself is a world that is stated numerous times to be beyond Space & Time, and
      is confirmed to be on a different plane of existence, where all timelines are
      able to be viewed from and are referred to as "lower worlds", which includes
      "The Void" which is described as a mere "Shadow" in comparison to Valhalla.
      The void being a structure that is stated multiple times to contain and infinite
      number of universes and harbor "Extradimensional Spaces" in relation to those
      worlds)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Unknown, but likely Considerably High (Considering how it assimilated Barthandelus
      by the events of the game)
    source_ids: *id002
    confidence: 0.8
