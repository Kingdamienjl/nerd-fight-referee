    - field: intelligence
      value: 'Gifted in general, Genius in Combat (Whilst sometimes being a bit of
        a ditz, Bartz has a natural talent for leadership during times of crisis due
        to his many adventures with his father. As a user of Black Magic, his knowledge
        should have greatly increased due to the nature of the job allowing him gain
        such quickly. Bartz has shown himself to be incredibly talent at combat, being
        trained as a child by his father to the point where his sword skills are "nothing
        to laugh at". His rate of growth allows him to master multiple jobs during
        battle some of which require him to be master in the field. His most powerful
        trait however is his ability to mimic the fighting styles and traits of othersDissidia
        012: Duodecim Final Fantasy - Museum Character Files and combined with his
        growth rate allows him to surpass them in skill. This is seen with Thancred
        as despite having a disadvantage at first, Bartz developed in skill by mimicking
        Thancred''s fighting style and tailoring his own style to defeat his opponent
        perfectly to the point where he thought Thancred was holding back and Thancred
        admitted to having no chance at beating Bartz. Bartz has copied the fighting
        styles of Cecil and Kain who can analyze their targets in a few seconds to
        determine their weaknesses to take them down.)'
      source_id: mediawiki-113326
      provider_id: vsbattles
      authority: high
