    - field: weaknesses
      value: 'Cocky and narcissistic | None notable | None notable | Cocky and narcissistic
        Notable Attacks/Techniques: *Magical Blast: Kamek''s most iconic attack. He
        charges magic within his Wand before cutting it loose in the form of a ball.
        Most of the time, it''s a cluster of a square, triangle and circle contained
        into a sphere. Most versions of this attack fly in a straight line, but some
        can zig-zag or home in on the foe. He can also spread-shot these, or fire
        them out in all directions as a barrage. *Rings: Kamek can materialize a magical
        ring around his foe, before forcing it to shut at an exceedingly fast pace.
        *Split: Kamek clones himself. Many times, these are merely false clones of
        the original that attack similar to him--with magic. Other times, it''s more
        complex, with Kamek empowering said clones. He can make three types. **Red:
        The Red Kamek clone is more powerful than the others, having the highest attack
        potency by far, but the lowest health and speed. ***Swifter Sweeper: Red Kamek
        materializes a titanic broom, which then sweeps across the battlefield, catching
        and batting foes all about. **White: The White Kamek clone has average statistics,
        giving him less weaknesses, but he has the lowest attack potency. ***Heal:
        White Kamek can cast a spell to heal a large chunk of an ally''s health. This
        spell can also revive an ally. **Green: The Green Kamek clone has the highest
        health, making him very resilient, but, overall, has low statistics otherwise.
        ***Rise: Green Kamek casts a spell to raise the attack potency, durability
        or speed of his allies.'
