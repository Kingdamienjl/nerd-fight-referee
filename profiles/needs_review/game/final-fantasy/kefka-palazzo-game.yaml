        "God" Kefka fires a powerful destructive ray of light. It''s range and destructive
        power make it his most powerful attack, strong enough to annihilate entire
        towns and cities and cut continents into pieces (during the last confrontation
        he went on a rampage and unleashed it on the planet''s surface, leaving scars
        upon it) *Trine: Causes blindness and silence, rendering sight-reliant foes
        unable to fight properly while eliminating their ability to use magic. *Blind:
        Blinds his opponents. *Forsaken: One of Kefka''s most powerful and famous
        attacks. It acts as a powerful, non-elemental magic attack with large AoE
        that cannot be blocked and is even more powerful than Ultima. *Vengeance:
        Eliminates opponent''s buffs. *Havoc Wing: Impales the target with his massive
        wings, dealing heavy non-elemental damage. *Heartless Angel: Kefka unleashes
        a burst of energy that leaves his opponents on their last legs regardless
        of their remaining vitality, allowing them to be felled with a single additional
        blow regardless of their durability. *Hyperdrive: A powerful magic spell that
        deals heavy non-elemental damage to a single-target, ignoring all defenses
