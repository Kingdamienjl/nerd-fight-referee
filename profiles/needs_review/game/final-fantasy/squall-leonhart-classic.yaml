    - field: intelligence
      value: 'Lightning has shown to be very quick in adapting to situations and showcased
        tremendous growth throughout the events of the FFXIII trilogy. Gifted: Lightning
        who was able to obtain a high ranking office in the Guardian Corp military,
        and is an expert in regards to machinery. This includes being capable of flying
        an airship, knowing how to work mechs, and is well versed in AMP Technology.
        Which by extension requires knowledge and understanding of phase-space interference.
        Extraordinary Genius: From the very beginning, Lightning has shown to be an
        incredibly skilled combatant, and is consistently shown to be a one woman
        army, capable of taking out multiple opponents by herself. Throughout the
        trilogy, Lightning has shown to evolve and adapt as a combatant throughout
        the trilogy through facing a variety of different opponents. Through these
        experiences she has consistently shown to be able to form strategies on the
        fly, develop counter measures in split second decisions, is capable of mastering
        different weapon types within seconds of acquiring them, and has been able
        to showcase feats that would ordinarily be impossible for one to accomplish.
        Such as being able to dodge attacks from foes who are able to read her mind.
        She has also shown to be able to understand "Paradoxes". Which is a Space-Time
        transcending phenomena that causes the past and future to overlap with one
        another, bringing impossibilities into existence to exist alongside possibilities.
        Which are directly compared to the Schrodinger''s cat experiment.'
      source_id: vsbattles-squall-leonhart-classic-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Lightning doesn''t showcase any real weaknesses. Being considered a
        true "Army of One", she at this point is known to be distrustful of others,
        preferring to work alone and seeing other people as a burden. Over the course
        of the game she does open up to her allies and realizes her own shortcomings
        and arrogance, she inherited the curse of L''Cie''s fate. However, meaning
        that she is no longer in danger of either becoming a Cie''th, or turning into
        crystal. Her "Heart" and "Soul" are formed from Chaos, her only real weaknesses
        come from potential overuse of the "Eyes of Etro". Which causes one to see
        changes in the timeline across the past, the user''s life slowly drains away.
        Lightning Returns: Final Fantasy XIII= Now known as "The Savior", she is no
        longer held back by the weaknesses of humans as "The Savior". Due to the destruction
        of Etro''s "Heart", the "Eyes of Etro" are no longer in effect.'
      source_id: vsbattles-squall-leonhart-classic-final-fantasy
      provider_id: vsbattles
      authority: high
