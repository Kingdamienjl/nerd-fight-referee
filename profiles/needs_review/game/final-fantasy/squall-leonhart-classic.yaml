    - field: intelligence
      value: Gifted (Squall skills as a SeeD, both in operations and especially in
        combat, have been noted to be exemplary since the the very beginning. Not
        only he has displayed full knowledge of the workings of Junction, during the
        field exam to become a SeeD, he proved the extent of his fighting capabilities
        and military strategy on a proper mission. By the end he passed with exceptional
        results, despite dealing with Seifer, a very difficult teammate and leader
        who failed the exam precisely due to a lack of professionalism. Notably, Squall
        is one of the very few people to master a Gunblade, a weapon noted to be so
        difficult to use that most people simply decide to choose a simpler option,
        and, furthermore, Squall was noted by principal, Cid Kramer, to be the very
        first Gunblade specialist to join SeeD in the history of Balamb Garden. This
        is despite the academy's worlwide success as a mercenary contractor. Even
        at his young age and comparatively short career as a SeeD, Squall was chosen
        to become the Commander of Balamb Academy in times of crisis, chosen over
        more experienced members of the force, earning the leadership over even his
        superiors during the war of the Gardens and managing to pull everyone through
        times of crisis. This talent could already be seen in his earlier missions,
        when Squall swiftly took the lead of his team, guiding them and assisting
        their inexperienced clients in dangerous jobs.)
      source_id: vsbattles-squall-leonhart-classic-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Guardian Forces slowly erase memories from earlier on his life. With
        Junction spells can only be allocated to one place, meaning he can't, imbue
        his attacks with ice and protect himself from cold with the Blizzaga spell,
        he has to choose and at best use the inferior Blizzara, in the other slot,
        using the spells in combat with reduce the stock and weaken the empowering
        effect of Junction little by little. Limit Breaks cannot be used freely, the
        user must find themselves in danger in order to access them., Same Junction
        shortcomings as before, after recovering his past and important memories,
        the memory loss effect of Guardian Forces seems to have been stopped., Same
        Junction shortcomings as before. If Squall's belief in the bond with his friends
        and his love for Rinoa falters the anchor protecting him from effects threatening
        his existence will weaken. In particular, Squall's fear of being alone once
        again can affect him heavily in this regard.
      source_id: vsbattles-squall-leonhart-classic-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: 'for details on what Boko, Moomba and MiniMog do., Mog''s Amulet is unique
        in that it doesn''t directly summons MiniMog, rather it teaches an ability
        to a Guardian Force which then a character can then use to call forth MiniMog,
        hence why it''s item type differs from the rest on this section., The "Trial"
        items might have been meant to have some limitation on them, such as a chance
        of missing, Example of an item used to teach a new ability to a GF Items designed
        specifically for Guardian Forces. These come in two kinds: healing items to
        restore their life force or to help them recover if they were defeated in
        battle, and items that can teach them new abilities to later bestow to their
        users, which range from abilities that Guardian Forces can naturally learn
        to unique ones accessible only through said items. There are also a couple
        of items with some extra effects. Must be noted that the healing items do
        have the limitation that they cannot be used mid-battle, unlike regular healing
        items. The selection of items is the following: {, class="fandom-table", +Guardian
        Force Items !Item !Type !Effect, centerG-Potion, Guardian Force Item, Restores
        200 HP to a Guardian Force. Can only be used outside of battle., centerG-Hi-Potion,
        Guardian Force Item, Restores 1000 HP to a Guardian Force. Can only be used
        outside of battle., centerG-Mega-Potion, Guardian Force Item, Restores 1000
        HP to all Guardian Forces. Can only be used outside of battle., centerG-Returner,
        Guardian Force Item, Revives a fallen Guardian Force. Can only be used outside
        of battle., centerRename Card, Guardian Force Item, Changes the name of a
        Guardian Force., centerAmnesia Greens, Guardian Force Item, Makes a Guardian
        Force forget an ability., centerAbility Learning Items, Guardian Force Item,
        There are many items that allow Guardian Forces to learn Abilities for their
        users to employ in battle. Examples would be the Elem Guard to learn the Elem-Def-Jx4
        Junction Ability, the Phoenix Spirit to learn the Revive Command Ability,
        the Accelerator to learn the Auto-Haste Support Ability, among many other
        examples., Regarding the Rename Card, nothing suggests that any sort of power
        or ability is involved in changing the name of the Guardian Force, being a
        simple mundane case of addressing the Summon by a nickname or different name.
        The limitation of being able to change their name with an item is most likely
        a simple mechanic of the game., Ability Learning items were all grouped together
        because they have no effect in a debate, that being the abilities themselves,
        Cottage These items, that resemble camping equipment, cannot be used freely,
        requiring to be used either at Save Points or in the World Map. Their effects
        are entirely meant to emulate the in-game inns, in the sense they have powerful
        recovery effects for the whole party and the Guardian Forces currently at
        disposal. Curiously, unlike most entries of the franchise until the release
        of Final Fantasy VIII, these completely lack an animation when used. There
        are only three types, which are as follows: {, class="fandom-table", +Field
        Items !Item !Type !Effect, centerTent, Fully restores HP and cures abnormal
        status of the party., centerPet House, Fully restores HP of all Guardian Forces.,
        centerCottage, Fully restores HP and cures abnormal status of the party, as
        well as restoring the HP of all Guardian Forces., As mentioned previously,
        Final Fantasy VIII does not use an MP system, reason why Magic isn''t restored
        by any of these items. Rather, Page of Weapons Monthly 1st Issue, Combat King
        5, teaching Zell''s ultimate Limit Break, Pet Pals Vol. 2, The first issue
        of Occult Fan. Hinting at the use of the Steel Pipe item. Other kinds of items
        that can be found through the game which don''t fall in the other categories.
        These items include materials which cannot truly be used and instead must
        be refined through Guardian Force abilities into useable medicines, spells
        or ability items, items with very specific and minor effects, more interestingly,
        magazines, which as a testament of the year the original game was released,
        were still a commonly seen and used form of media and serve various different
        porpuses in the game that can be very useful for the party. These particular
        items can be categorized as: {, class="fandom-table", +Misc. Items !Item !Type
        !Effect, centerVarious Materials'
