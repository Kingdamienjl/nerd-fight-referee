    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average. As a member of the Turks, Rude is well trained in combat,
      espionage, infiltration, gathering information, weapon use and piloting of several
      vehicles. Despite being caught in moments of goofiness due to Reno's upbeat
      and extravagant behaviour, Rude does his best to keep his cool and properly
      analyze the situation at hand, having important insight of the events around
      him, noticing important details and having efficient deductive skills to piece
      together situations he's involved with, with many times his colleagues trying
      to warn him of something he had already figured out beforehand.
    source_ids:
    - mediawiki-4789733
    confidence: 0.6
    notes: auto_repair source extraction
