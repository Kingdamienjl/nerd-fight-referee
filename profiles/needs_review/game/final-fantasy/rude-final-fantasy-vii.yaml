  axis: other
  text: At least Multi-Continent level, likely higher (Can defeat with his attacks
    3rd Version Ravens) | Multi-Solar System level (Can easily destroy enemies who
    can overwhelm the endgame Player Turk with his strength alone) | At least Multi-Continent
    level, likely higher (Has grown weaker, but can still fight and harm the party,
    which were on a similar level to Vincent) | Multi-Solar System level (Regained
    his lost strength and can potentially injure a much stronger party with his physical
    might), likely Multiverse level+ (The party scale to Cloud who during his time
    in Ivalice fought alongside Balthier, who had defeated Gilgamesh twice) | Multi-Solar
    System level, likely Multiverse level+ (Stronger than before. Managed to hold
    his own in a hand-to-hand fight against Yazoo, though the latter was playing around)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-durability-efad2336
  section: power_scale
  axis: durability
  text: At least Multi-Continent level, likely higher (Rude is consistently portrayed
    as Reno's partner and equal, who could fight 3rd Version Ravens, who are far stronger
    than 2nd Class SOLDIER, whom compare to Zack in his earlier days who defeated
    Ifrit putting him also on the level of Shiva) | Multi-Solar System level (Can
    take the attacks of enemies like the Mighty Grunts, who could defeatBefore Crisis
    -Final Fantasy VII- (2004) the endgame Player Turk with number advantage, who
    is comparable to Zirconiade and far above Bahamut ZERO and Bahamut Fury) | At
    least Multi-Continent level, likely higher (Could take the party's attacks, who
    were already comparable to Vincent and could simply walk away from the battle)
    | Multi-Solar System level (Regained his old strength and became even stronger.
    Could fight the party on two ocassions, alongside his partners, and come out not
    worse for wear, when they had become strong enough to take down Weapons), likely
    Multiverse level+ (Cloud had fought alongside Balthier in Ramza's army, whom had
    defeated Gilgamesh, and displayed a similar destructive power) | Multi-Galaxy
    level (Could take repeated beatings from the Remnants of Sephiroth, who compare
    to Kadaj who was as strong as Sephiroth was in the original game, being above
    the main party who controlled Knights of the Round), likely Multiverse level+
    (The Remnants could injure Cloud, whom had become far stronger since his time
    in Ivalice)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-stamina-260717bb
  section: power_scale
  axis: stamina
  text: Superhuman. Rude, as a Turk, has been trained to stay on duty in grueling
    conditions for hours to carry out his missions, this includes being deprived of
    food or sleep, or even being injured, without truly slowing down unless the damage
    is too extreme.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
