- id: claim-standard-equipment-7fbfd742
  section: equipment
  axis: equipment
  text: 'Rude Gloves.jpg|Rude''s Leather Gloves Rude Shades.jpg|Rude''s Sunglasses
    Rude-without-glasses-FFVIIAC.jpg|Rude''s Sunglasses being accidentally crushed
    by Reno Rude Spare Shades.png|Rude''s spare Sunglasses BeforeCrisisRude.jpg|Rude''s
    Materia (though of wrong color as Red is for Summons, which Rude doesn''t have)
    Shinra Helicopter.png|The Shinra Military Helicopter Rude Rocket Launcher.png|Rude
    aiming the Rocket Launcher Rude Staff.png|Rude''s Metal Staff Rude Bomb.png|Reno
    and Rude holding the Makeshift Bombs BCTurkPhone.jpg|Standard Turk''s Cellphone
    Model as seen in Before Crisis *Leather Gloves: Not quite a weapon, but Rude always
    puts on a pair before fighting his opponents as he specializes in hand-to-hand
    combat, especially the use of his fists. *Black Shades: Not a weapon either, nor
    they offer any kind of tactical advantage, however they look very stylish and
    Rude is very adamant on keeping them on to mantain his professional and no-nonsense
    image. *Spare Black Shades: In the unbelieveable case that Rude''s sunglasses
    may be lost during combat, he is savvy enough to carry a spare pair in his person
    so his impecable image is not lost. *Materia: Crystallized Spirit Energy (commonly
    known as Mako) that Shinra artifically produces, though it can be rarely found
    in nature. Materia contains the knowledge of the Cetra, and ancient race that
    was connected to the Planet and could use its powers. With these, Rude can use
    magic. Rude has the Fire, Ice, Lightning, Restore and Barrier Materia to access
    several types of spells. *Cell Phone: Rude, like all Shinra personnel, carries
    a mobile phone to contact his colleagues or his teammates during missions and
    plan properly his next course of action. *Shinra Military Helicopter: The Shinra
    company provides the necessary vehicles to SOLDIER and the Turks for their missions.
    The Turks in particular are commonly seen piloting helicopters when they need
    a means of transport. These come equipped with a gatling machine gun on the front
    and napalm missiles at the sides. *Makeshift Time Bomb (Optional Equipment): A
    surprisingly powerful bomb made by Reno''s lifelong partner, Rude, himself which
    has a timer that upon reaching 0 explodes in a large blast followed by flashy
    fireworks. It must be noted that Reno and Rude, despite surviving, were also knocked
    out by the blast and each of them have only 1 copy of the bomb each. *Metal Staff
    (Optional Equipment): A retractable short metal staff, similar to Reno''s that
    Rude attemped to use against Cloud in Advent Children, however Cloud cornered
    Rude before he could so it remains unknown how he would employ it in combat. After
    that it hasn''t appeared again. *Rocket Launcher (Optional Equipment): A weapon
    Rude used during the chase in the highway after Kadaj. Rude displayed impressive
    accuracy with it, managing to collapse an entire road with a single with it and
    shots from Reno''s helicopter.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-baf1baf3
  section: power_scale
  axis: battle_iq
  text: Above Average. As a member of the Turks, Rude is well trained in combat, espionage,
    infiltration, gathering information, weapon use and piloting of several vehicles.
    Despite being caught in moments of goofiness due to Reno's upbeat and extravagant
    behaviour, Rude does his best to keep his cool and properly analyze the situation
    at hand, having important insight of the events around him, noticing important
    details and having efficient deductive skills to piece together situations he's
    involved with, with many times his colleagues trying to warn him of something
    he had already figured out beforehand.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-1be51053
  section: weaknesses
  axis: weakness
  text: Despite his professionalism and no-nonsense attitude, Rude will hold back
    against people for whom he as a soft spot. This is noticeable regarding his romantic
    interest in Tifa Lockhart, against whom he would only use half-hearted physical
    attacks instead of his stronger moves, despite Tifa going all out. This sort block
    can endanger his missions and combat. Previous to that, Rude dated a girl named
    Chelsea who actually was an AVALANCHE spy. Despite being aware of it, Rude never
    took measures for the issue and willingly accepted any possible outcome, even
    with Reno's warnings. Rude, despite his stoic demeanor, can also get flustered
    when an outcome really takes him off-guard, and while he can keep an outward calm
    image, he needs a moment to regain his composture internally.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-cda12c25
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics, Acrobatics (Hypermobility. Though not
    as acrobatic as Reno, Rude is very agile and dexterous in combat), Weapon Mastery
    (Is shown to be a good shot with the rocket launcher. The Turks in general are
    shown to be trained with weaponry, Rude attempted to use a steel baton against
    Cloud, but was prevented from doing so by him), Vehicular Mastery (The Turks are
    trained in driving several types of vehicles. Rude himself is a skilled helicopter
    pilotFinal Fantasy VII - The Kids Are Alright: A Turks Side Story (2017), which
    are equipped with machine guns and napalm bombsCrisis Core -Final Fantasy VII-:
    Reunion (2022)), Martial Arts and Pressure Points (Rude is an expert in hand-to-hand
    combat, specializing in using his fists, having enough skill to precisely knock
    out someone while avoiding vital spots), Stealth Mastery (All Turks are trained
    in infiltration and espionage), Explosion Manipulation (via the Rocket Launcher),
    Spirit Energy Manipulation (Can control his Spirit Energy to perform different
    techniques), Non-Physical Interaction (Spirit Energy allows to interact with incorporeal
    beings such as Summons, which trascend physical matterCrisis Core -Final Fantasy
    VII-: The Complete Guide (2007) entirely or the Remnants of Sephiroth, who are
    made outFinal Fantasy VII: On the Way to a Smile - Lifestream Black (2009) of
    Negative Lifestream), Vibration Manipulation (via Grand Spark, which creates shockwaves
    on the ground), Magic (Rude has several kind of Materia equipped on his gloves
    for different porpuses), Fire Manipulation (via Fire and Fire2/Fira), Electricity
    Manipulation (via Bolt2/Thundara), Ice Manipulation, Ice Manipulation (via Ice2/Blizzara),
    Healing (via Cure2/Cura) Damage Reduction via Forcefield Creation (via MBarrier/Manaward
    which halves Magical and Spiritual Damage), Absorption (Can absorb fire attacks
    as health) Resistances: *Resistance to Fear Manipulation (Is unaffected by Kadaj''s
    presence which is comparedFinal Fantasy VII - The Kids Are Alright: A Turks Side
    Story (2017) to when death draws near), Death Manipulation (Resists Doom and Death),
    Sleep Manipulation (Resists Sleep), Madness Manipulation, (Type 2. Resists Confusion
    and Berserk), Sense Manipulation (Resists Silence), Time Stop (Resists Stop),
    Transmutation (Resists Frog), Size Manipulation (Resists Small), Petrification
    (Resists Petrify), Paralysis Inducement (Resists Paralyze), Body Puppetry (Resists
    Manipulate), Gravity Manipulation (Takes no damage from Gravity spells), Absolute
    Zero (Can withstand Shiva''s Diamond Dust, whose coldFinal Fantasy Explorers.
    Japanese Website Summon profiles (2014) reaches these temperatures), Matter Manipulation
    and Radiation Manipulation (Can endure the Flare spell and the Bahamut Strain''s
    more powerful variants, such as Megaflare, which are consistently described as
    a nuclear explosions)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
