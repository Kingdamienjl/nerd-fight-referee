  durability:
    text: At least Multi-Continent level, likely higher (Rude is consistently portrayed
      as Reno's partner and equal, who could fight 3rd Version Ravens, who are far
      stronger than 2nd Class SOLDIER, whom compare to Zack in his earlier days who
      defeated Ifrit putting him also on the level of Shiva) | Multi-Solar System
      level (Can take the attacks of enemies like the Mighty Grunts, who could defeatBefore
