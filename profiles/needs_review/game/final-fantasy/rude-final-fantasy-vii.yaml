  attack_potency:
    text: 'At least Multi-Continent level, likely higher (Renowned as the strongestBefore
      Crisis -Final Fantasy VII- (2004) of the Turks, likely referring to his physical
      strength, and is consistently shown as Reno''s partner and equal, who is strong
      enough to defeatBefore Crisis -Final Fantasy VII- (2004) 3rd Version Ravens,
      whom are far strongerBefore Crisis -Final Fantasy VII- (2004) than the 2nd Version
      which easily defeated with one strikeBefore Crisis -Final Fantasy VII- (2004)
      both Sebastian and EssaiCrisis Core -Final Fantasy VII-: The Complete Guide
      (2007), two 2nd Class SOLDIER comparable to Zack Fair when he defeated Ifrit)
      | Multi-Solar System level (Can defeat the Mighty Grunt Techno-SoldiersBefore
      Crisis -Final Fantasy VII- (2004), the latter while statingBefore Crisis -Final
      Fantasy VII- (2004) that it took nowhere near his true strength. In large numbers,
      these enemies could overwhelmBefore Crisis -Final Fantasy VII- (2004) the Player
      Turk, whom shortly after would defeat Zirconiade, a Summon far superior to Bahamut
      ZERO and Fury) | At least Multi-Continent level, likely higher (After the most
      of the Turks went into hiding and the golden era of the department came to an
      end, Rude''s abilities noticeably decayed, though he''s still a powerful fighter.
      Can fight against the main party not long before they were joined by Vincent
      Valentine whom in the past also easily defeatedBefore Crisis -Final Fantasy
      VII- (2004) 3rd Version Ravens) | Multi-Solar System level (Regained his old
      skills and became even strong, being capable of fighting the main party alongside
      Reno, and later Elena, after Cloud and his allies had grown strong enough to
      control Summons such as Bahamut ZERO and among whom Red XIII could already perform
      his Stardust Ray Limit Break. Cloud himself had survived the awakeningFinal
      Fantasy VII (1997) of 5 of the 8 Weapons, when a single one is stronger than
      Zirconiade), likely Multiverse level+ (Cloud fought in Ramza Beoulve''s army
      alongside Balthier and Luso Clemens during his time in Ivalice, the former whom
      had defeated Gilgamesh twice alongside Vaan and the others, and the latter whom
      had allied with Vaan before joining Ramza) | Multi-Galaxy level (Could hold
      a fight against Yazoo and Loz, though they were just playing around. Still,
      both Remnants should be comparable to the other, Kadaj who is statedFinal Fantasy
      VII: Advent Children -Reunion Files- (2006) to be as strong as Sephiroth was
      in the original game, who was stronger than the individual members of the main
      party all whom controlled the Knights of the Round), likely Multiverse level+
      (The Remnants could hold their own against Cloud, who was much stronger than
      when he fought in Ramza Beoulve''s army), higher with Makeshift Bomb (The bomb
      made by Rude was strong enough to temporarily knock out of combat Yazoo and
      Loz, who up to that point were far stronger than Reno and Rude)'
    source_ids:
    - mediawiki-4789733
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Sub-Relativistic+ (Is stronger than 3rd Version Ravens, who are a far superior
      version of the 2nd who blitzedBefore Crisis -Final Fantasy VII- (2004) 2nd Class
      SOLDIER, a Class far stronger the 3rd Class, who could keep up with the main
      party members who can dodge the lasers of Shinra''s security Systems) | Massively
      FTL+ (Is strong enough to fight the same enemies as the Player Turk did before
      facing Zirconiade, a Summon far superior to Bahamut Fury) | Sub-Relativistic+
      (After the decay of his abilities, following the end of the golden era of the
      Turks, Rude''s speed is not the same as before. He''s still fast enough to keep
      up with the party who are on the level of Vincent Valentine, whom also could
      easily defeat 3rd Version Ravens and far stronger when they could dodge lasers
      in Midgar) | Massively FTL+ (Regained his speed and became stronger than ever
      before. Could keep up with the party on two ocassions after they had gained
      control of Summons like Bahamut ZERO and Red XIII could perform his Stardust
      Ray Limit Break) | Massively FTL+ (Though they were toying with him, Rude managed
      to keep up and surprise a bit the Yazoo and Loz, who should be comparable to
