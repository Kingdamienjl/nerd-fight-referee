    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Rude, as a Turk, has been trained to stay on duty in grueling
      conditions for hours to carry out his missions, this includes being deprived
      of food or sleep, or even being injured, without truly slowing down unless the
      damage is too extreme.
    source_ids:
    - mediawiki-4789733
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range. Several Meters with his abilities.
    source_ids:
