      value: Standard Melee Range. Several Meters with his abilities.
      source_id: vsbattles-rude-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'Standard Turk''s Cellphone Model as seen in Before Crisis, Leather Gloves:
        Not quite a weapon, but Rude always puts on a pair before fighting his opponents
        as he specializes in hand-to-hand combat, especially the use of his fists.,
        Black Shades: Not a weapon either, however they look very stylish and Rude
        is very adamant on keeping them on to mantain his professional and no-nonsense
        image., Spare Black Shades: In the unbelieveable case that Rude''s sunglasses
        may be lost during combat, he is savvy enough to carry a spare pair in his
        person so his impecable image is not lost., Materia: Crystallized Spirit Energy
        (commonly known as Mako) that Shinra artifically produces, though it can be
        rarely found in nature. Materia contains the knowledge of the Cetra, and ancient
        race that was connected to the Planet and could use its powers. With these,
        Rude can use magic. Rude has the Fire, Ice, Lightning, Restore and Barrier
        Materia to access several types of spells., Cell Phone: Rude, like all Shinra
        personnel, carries a mobile phone to contact his colleagues or his teammates
        during missions and plan properly his next course of action., Shinra Military
        Helicopter: The Shinra company provides the necessary vehicles to SOLDIER
        and the Turks for their missions. The Turks in particular are commonly seen
        piloting helicopters when they need a means of transport. These come equipped
        with a gatling machine gun on the front and napalm missiles at the sides.,
        Makeshift Time Bomb (Optional Equipment): A surprisingly powerful bomb made
        by Reno''s lifelong partner, himself which has a timer that upon reaching
        0 explodes in a large blast followed by flashy fireworks. It must be noted
        that Reno and Rude, despite surviving, were also knocked out by the blast
        and each of them have only 1 copy of the bomb each., Metal Staff (Optional
        Equipment): A retractable short metal staff, similar to Reno''s that Rude
        attemped to use against Cloud in Advent Children, however Cloud cornered Rude
        before he could so it remains unknown how he would employ it in combat. After
        that it hasn''t appeared again., Rocket Launcher (Optional Equipment): A weapon
        Rude used during the chase in the highway after Kadaj. Rude displayed impressive
        accuracy with it, managing to collapse an entire road with a single with it
        and shots from Reno''s helicopter.'
      source_id: vsbattles-rude-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. As a member of the Turks, Rude is well trained in combat,
        espionage, infiltration, gathering information, weapon use and piloting of
        several vehicles. Despite being caught in moments of goofiness due to Reno's
        upbeat and extravagant behaviour, Rude does his best to keep his cool and
        properly analyze the situation at hand, having important insight of the events
        around him, noticing important details and having efficient deductive skills
        to piece together situations he's involved with, with many times his colleagues
        trying to warn him of something he had already figured out beforehand.
      source_id: vsbattles-rude-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Rude will hold back against people for whom he as a soft spot. This is
        noticeable regarding his romantic interest in Tifa Lockhart, against whom
        he would only use half-hearted physical attacks instead of his stronger moves,
        despite Tifa going all out. This sort block can endanger his missions and
        combat. Previous to that, Rude dated a girl named Chelsea who actually was
        an AVALANCHE spy. Despite being aware of it, Rude never took measures for
        the issue and willingly accepted any possible outcome, even with Reno's warnings.
        Rude, can also get flustered when an outcome really takes him off-guard, and
        while he can keep an outward calm image, he needs a moment to regain his composture
        internally.
      source_id: vsbattles-rude-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
