- id: claim-weaknesses-e993fc22
  section: weaknesses
  axis: weakness
  text: 'Due to his command of the Void, he is quite arrogant. Notable Attacks and
    Techniques: * Grand Cross: A wide reaching attack which defies the laws of the
    universe and inflicts random status conditions on all foes. * Deep Freeze: Deals
    ice-elemental damage before freezing the time of the target and rendering them
    incapable of action. * Drain Touch: Drains life force from the target. This attack
    cannot be reflected. * Meltdown: Deals fire-elemental damage and inflicts Sap,
    rapidly draining the opponent of the their vitality until they succumb. *Meteor:
    Sends down massive meteors upon the target to deal massive amounts of damage.
    *Almagest: Deals massive holy damage on the target and inflicts Sap as a result,
    draining their life force completely. * Aqua Breath: Inflicts water-elemental
    damage on all targets. * Poison/Bio: Inflicts moderate poison-elemental damage
    and inflicts Poison and Sap respectively, rapidly draining the opponent of the
    their vitality until they succumb. * Aeroga: Inflicts heavy wind-elemental damage
    on all targets. * Blizzaga: Inflicts heavy ice-elemental damage on all targets.
    * Firaga: Inflicts heavy fire-elemental damage on all targets. * Thundaga: Inflicts
    heavy lightning-elemental damage on all targets * Holy: Inflicts heavy holy-elemental
    damage on all targets. * Flare: Deals heavy non-elemental damage to all targets.
    ** Giga Flare: Inflicts massive non-elemental damage across a wide area, a vastly
    more powerful version of Flare. *Berserk: Inflicts the Berserk status effect on
    the target, rendering them incapable of doing anything but attack in rage. *Evil
    Eye: Inflicts Petrification on a target. *Graviga: Casts a gravity spell that
    drops the target to a small fraction of their total health regardless of durability.
    *Haste: Casts a spell that makes himself faster. *Osmose: Drains the target of
    their magic and restores his own magic in the process. *Pond''s Chorus: Turns
    the targets into a toad on command. *Protect/Shell: Casts a protective barrier
    to nullify any physical and magical attacks respectively. *Regen: Casts a spell
    that allows for his health to passively heal as he fights. *Slowga: Slows down
    the target immensely, making them easier to hit. *White Hole: Casts a white hole
    that can instantly kill a target and petrify them as well. *Dance Macabre: Turns
    a target into a zombie. *Delta'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a8199549
  section: abilities
  axis: hax
  text: 'Resistant to the Following: Subjective Reality, Magic, Conceptual Manipulation
    (Type 2), and Space-Time Manipulation (Characters are capable of surviving and
    resisting magical abilities, Which is shown to project one''s inner mind onto
    reality, and as shown with the creation of the Devil''s road, remove entire concepts
    and warp space and time to where the past, present, and future exists as one.),
    Time Stop (Unaffected by the Rift''s effects of freezing time), Law Manipulation
    (Resists magic, which can rewrite the natural order of things), Body Puppetry
    (Is unable to be controlled by the party''s Control ability), Soul Manipulation
    (Can withstand Ifrit''s Hellfire, which is stated to burn the soul awayFinal Fantasy
    IV: The After Years Novel, chapter 3, page 160), Absolute Zero (Survived attacks
    from Shiva, including Diamond Dust), Mind Manipulation (which includes Madness
    Manipulation (Type 3), and Perception Manipulation), Space-Time Manipulation,
    Time Stop, and Corruption (Type 2; is unfazed by the effects of the Void), Madness
    Manipulation (Type 2) and Morality Manipulation (Can resist the Confusion status
    effect, which drives the target insane and attack anyone in the viscinity, even
    their allies), Power Nullification (Can resist the Silence status effect), Transmutation
    (can resist the Toad and Pig spell), Size Manipulation (Is able to resist the
    Mini spell), Status Effect Inducement (Is able to resist a wide variety of status
    ailments), Age Manipulation (Can resist the Old status ailment), Death Manipulation
    and Blood Manipulation (Can resist the Death spell, which is even stated to solidify
    the victim''s blood), Electricity Manipulation and Pain Manipulation (Is able
    to resist the Lightning spells, which is capable of attacking the nervesFinal
    Fantasy IV Volume 2 Novel, chapter 7, page 54), Petrification (Can resist the
    Petrification status effect), Poison Manipulation and Corrosion Inducement (Can
    resist the Poison status effect, which is also stated to corrode the target),
    Fire Manipulation, Ice Manipulation, and Matter Manipulation (Sub-Atomic; Is capable
    of the Fire and Ice spell in particular being capable of affecting the target''s
    electrons), Darkness Manipulation and Perception Manipulation (Can resist the
    darkness status ailment via various equipment, which would render the target blind),
    Power Nullification (Can resist the Silence status ailment), and Berserk Mode
    (Can resist the Berserk status effect) The same to a far higher degree, as well
    as Resistance to Void Manipulation/Existence Erasure, Self-Sustenance (Type 3),
    Incorporeality (lacks a physical form once engulfed by the void), Nonexistent
    Physiology (Nature Type 1, Aspect Type 2 and 5; is one with the Void itself, a
    power of nothingness that existed even before the existence of concepts from the
    Crystals, let alone the entire world was a thing, and lacks an history), and Immortality
    (Types 3 and 5)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
