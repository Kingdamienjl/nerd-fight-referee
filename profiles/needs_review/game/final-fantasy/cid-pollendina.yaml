    - field: attack_potency
      value: At least Island level (His magic projecting itself caused the rain to
        stop, and it piercing the sky cleared away the clouds, as if it, the rain
        and lightning weren't even there in the first place.), higher over time (Originally
        his strongest attack, I AM ATOMIC was this powerful, but later even his normal
        spells surpassed the initial I AM ATOMIC. Cid is always training even when
        he is in random classes. At first, the hero Olivier was "dimensions" beyond
        him in power, throwing him around and dominating without effort, with him
        surviving being pure luck, however in barley any time at all he surpassed
        his limits and overpowered her completely, pinning her down to the ground),
        Multi-Continent level with I AM ATOMIC (I AM ATOMIC is Cid's ultimate technique,
        his power at its absolute peak, stated to be comparable to a weapon of mass
        destruction. It is a surge of magic in the form of rays of light that warp
        around him and his sword, that when released breaks through the walls, the
        earth and causes an explosion, vaporizing those in its vicinity. A variation
        of I AM ATOMIC caused an explosion this powerful.), higher over time (As I
        AM ATOMIC is all his magic power being gathered together for a single explosion,
        naturally the stronger he gets, the more powerful his I AM ATOMIC will become.)
      source_id: character-stats-profiles-cid-pollendina-final-fantasy
      provider_id: character_stats_profiles
