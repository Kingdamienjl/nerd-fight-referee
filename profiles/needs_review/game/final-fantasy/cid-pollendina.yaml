        consciousness in the new world, he noticed he had magic and could see the
        magic in others. Can hear things from far away), Body Control, Weapon Creation
        (Cid created for himself and his Shadow Garden slime bodysuits, these bodysuits
        make movement easier and can change form at will, and even if it is destroyed
        will reform itself. The slime bodysuit can form into any weapon such as sword.),
        Power Mimicry, Weapon Mastery (Cid's swordplay is noted to be basic, however
        it is absolutely perfect. Cid defeated the greatest swordsman in the country,
        who even spread a whole new art throughout the nation, and it was noted that
        even he had never seen such beautiful swordplay before. His strategy with
        the sword is stated to be perfect. Anyone who gets a chance to see his swordplay
        will never forget it simply by how phenomenal it is. It is stated by numerous
        characters that his swordplay is perfect to the point of being a new form
        of art. To others it seems like he is trying, when he isn't at all. His swordplay
        is completely natural and basic and beyond perception. He shows no bloodlust,
        hesitation or swagger in his swordplay. Powerful characters have said that
        even if they trained for centuries they would never reach Cid's swordplay,
        simply by how polished it is. It is as if he has kneaded together the best
        parts of countless martial arts and refined them further into a single incomparable
        masterpiece. Is stated numerous times to have the strongest swordplay. Copied
        a high level swordplay just by looking at it.), Supernatural Willpower (Cid's
        willpower is so great that it is given form.), Soul Manipulation (Cid's healing
        heals the soul as well.), Air Manipulation (Controlled wind to kill some enemies.),
        Explosion Manipulation (I AM ATOMIC releases a massive explosion of energy/magic.),
        Fear Manipulation, Illusion Creation (Cid just by looking at Iris, the strongest
        knight in the kingdom, made her experience intense fear, to the point she
        envisioned her arm being cut off, and it felt completely real to her. She
        also envisioned her head getting chopped off simply by him just looking at
        her.), Cid can overload someone with a dangerous amount of magic, Flight (Cid
        can fly.), Instinctive Reaction (Cid has superior instincts than Rex and Epsilon,
        who can react to attacks even when caught off guard by pure instinct.), Healing
        (Cid can release a light that restores energy, magic and heals wounds.), Longevity
        (Cid could use his magic to live up to at least 200 years.), Supernatural
        Luck (A random story he made on the spot about a cult turned out to be completely
        true, down to the most precise detail. Threw a dart at random on a map and
        it landed exactly where his sister had been kidnapped, despite members of
        Shadow Garden, which is filled with geniuses and quick learners being unable
        to find her. Cid had gotten lost and in the eyes of his crew went the wrong
        way, however he randomly ended up running into the enemy. A random situation
        about money he brought up just for fun ended up helping Shadow Garden and
        defeat the enemy, making it look like he planned everything from the start.
        He ran away to another kingdom and somehow ended up messing up an enemies
        plan as if he knew they would be there.), Martial Arts (Cid taught himself
        Boxing and Karate to a high degree. He also became proficient with the sword
        and MMA in general, and he continues training in these every single day, getting
        better and better.), Power Bestowal (Made Rose even stronger and more aware
        than she was before.), Analytical Prediction (Can perceive the smallest of
        detail in battle.), Pressure Points (Can precisely attack pressure points.),
        Regeneration Negation (Scales above Alpha who negated the regeneration of
        a monster who can regenerate from being bisected.), Regeneration (At least
        Low; Can heal wounds and his fingernails.), Stealth (His stealth is greater
        than that of Shadow Garden members who can conceal their presence, and that
        of Alpha who can move without sound or the sense of blood lust. A member of
        Shadow Garden stated that even to her, Cid couldn't be sensed at all, as if
        he was one with the air itself and the embodiment of all creation.) Thread
        Manipulation (Can control lots of threads that follow the enemy in all directions.),
        Lightning Manipulation, Weather Manipulation (Cid gathering magic together
        made the very air quiver, made wind blow strong in every direction, and thunder
        to violently attack the capital), Transmutation (By using a mass amount of
        magic, he turned Alpha from a blob back into her original form.)
