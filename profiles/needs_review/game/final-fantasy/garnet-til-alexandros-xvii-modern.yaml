    - field: weaknesses
      value: 'She has a limited supply of mana that allows her to summon and use magic,
        although this is exaggerated in game. Feats: * Fought Kuja and defeated Necron
        with her party. * Defeated the Water Guardian with Eiko. Notable Attacks/Techniques:
        White Magic: *Cure, Cura and Curaga: Healing spells that cure either herself,
        the party or even the enemy if she so chooses. This also damages undead monsters.
        *Life: Can revive herself as well as one hit kill undead monsters. *Stona:
        Cures petrification. *Panacea: Cures venom and poison. *Shell: Raises her
        defense against magical attacks. *Protect: Raises her defense against physical
        attacks. *Mini: Allows her to transmute an enemy into a minature version of
        themselves, greatly reducing their power. *Reflect: Allows her to reflect
        back magical skills. *Confuse: Allows her to create confusion in an enemy.
        In this confusion, the enemy can attack allies, attack themselves or attack
        their intended target. *Berserk: Allows her to berserk her opponent. In this
        state, the enemy will only use physical attacks, albeit stronger than normal.
        *Silence: Allows her to nullify the powers of one/multiple targets. In this
        state, they cannot cast magic or use activated skills. *Float: Allows her
