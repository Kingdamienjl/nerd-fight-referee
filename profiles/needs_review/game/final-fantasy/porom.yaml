    IV Novel 1, chapter 5, page 234), Magic, Subjective Reality (Magic,Final Fantasy
    IV Novel 1, chapter 1, page 29 in its basest form,Final Fantasy IV Novel 1, chapter
    3, page 107 is projecting one''s innerFinal Fantasy IV: The After Years Novel,
    chapter 2, page 109 mind onto reality,Final Fantasy IV: The After Years and is
    powered by intelligence and mental strength), Non-Physical Interaction (Magic
    as a whole is shown to affect a wide variety of different beings, from intangible/immaterial
    beings to non corporeal beings, to abstract concepts like Chronodia, who''s the
    flow of time itself,Final Fantasy I to Nonexistent beings like Exdeath and Cloud
    of Darkness), Law Manipulation (Magic is stated to rewrite the natural order of
    thingsFinal Fantasy IV Novel 1, chapter 5, page 198),Power Modification (Including
    Duplication, Fusionism, Statistics Amplification, Size Manipulation, Homing Attack,
    Danmaku, Aura, Breath Attack, and Energy Manipulation; Magic users across the
    games have consistently shown the ability to manipulate the shape and properties
    of their own magical abilities, with even higher tiers of spells simply being
    considered stronger versions of the same basic abilityFinal Fantasy IV: The After
    Years Novel, chapter 2 page 114), Conceptual Manipulation (Type 2), and Space-Time
    Manipulation (Magic is shown in the novels to remove concepts and warp space and
    time itself, like the Devil''s road, which the concept of time was lost,Final
    Fantasy IV Novel 1, chapter 5, page 199 and time and space were twisted to the
    pointFinal Fantasy IV: The After Years Novel, chapter 1, page 67 the past, present
    and futureFinal Fantasy IV: The After Years Novel, chapter 1, page 73 existed
    as oneFinal Fantasy IV: The After Years Novel, chapter 3, page 147), Healing,
    Paralysis Inducement and Biological Manipulation (via Hold, which is stated toFinal
    Fantasy IV Settings Guidebook affect the brain''s fundamental functions), Information
    Analysis and Clairvoyance (Can scan enemies for strengths and weakness via Libra.
    The Libra spell is also stated to Clairvoyance), Gravity Manipulation (The Haste
    and Slow spells are stated to control gravity), Invulnerability and Attack Reflection
    (Can nullify any physical attacks and reflect magical attacks via the Lunar Curtain),
    Resurrection (via Raise and Arise), Forcefield Creation (via Protect and Shell),
    Power Nullification (Can render one''s powers null with Silence and remove any
    buffs with Dispel), Purification (Type 3; via Esuna), Berserk Mode (via Berserk),
    Afterimage Creation (via Blink), Madness Manipulation (Type 2) and Morality Manipulation
    (Can inflict targets with the Confuse status ailment, driving the target insane
    and attack anyone, even their allies), Teleportation (via Teleport), BFR (The
    teleport/Warp spells are capable of banishing targets to the Void, which inflicts
