    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: \u25AA Cheer: Tidus enhances\
        \ his party's attack power and durability. \u25AA Hastega: Tidus accelerates\
        \ time for his party, dramatically increasing their speed. \u25AA Slowga:\
        \ Tidus distorts time around his enemies, dramatically decreasing their speed.\
        \ \u25AA Delay Buster: Tidus strikes his enemy with an incredibly powerful\
        \ blow, significantly increasing the time they need to take their next action.\
        \ \u25AA Provoke: Tidus taunts an enemy, encouraging them to attack him over\
        \ his allies. \u25AA Swordplay: Tidus' Overdrive, a collection of sword techniques\
        \ that he gradually develops as he uses this Overdrive repeatedly. * Spiral\
        \ Cut: Tidus performs a series of flips and cartwheels towards his enemy,\
        \ before leaping and slamming his sword down on them. * Slice & Dice: Tidus\
        \ darts back and forth around his enemies, striking them six times. * Energy\
        \ Rain: Tidus jumps off of one enemy into the air, charging energy in his\
        \ sword and throwing it down to explode on enemies. * Blitz Ace: Tidus leaps\
        \ forward and slashes at his enemy eight times, before using the hilt of his\
        \ sword to leap into the air and kicking a Blitzball into his target, which\
        \ explodes on impact. Contrary to popular belief, the party members are not\
        \ limited to their sections of the Sphere Grid and are capable of branching\
        \ into the sections of other characters. Key Spheres, which are strictly used\
        \ for this purpose, are canonically given out at certain points in the story,\
        \ and character-exclusive abilities like Lulu's Black Magic and Kimahri's\
        \ Lancet are discussed as if they are common abilities and not completely\
        \ restricted to the characters in question. As a result, the party is entirely\
        \ capable of using each others' abilities, as long as they are part of the\
        \ Sphere Grid. Yuna's Sphere Grid: \u25AA Curaga: Tidus significantly heals\
        \ himself or one of his allies. \u25AA NulBlaze: Tidus nullifies all fire\
        \ damage for himself and his allies for one attack. \u25AA NulShock: Tidus\
        \ nullifies all lightning damage for himself and his allies for one attack.\
        \ \u25AA NulTide: Tidus nullifies all water damage for himself and his allies\
        \ for one attack. \u25AA NulFrost: Tidus nullifies all ice damage for himself\
        \ and his allies for one attack. \u25AA Esuna: Tidus removes all negative\
        \ status effects on himself or one of his allies. \u25AA Life: Tidus revives\
        \ one of his allies if they happen to die, though they are nonetheless still\
        \ significantly injured. \u25AA Full-Life: Tidus revives one of his allies\
        \ at their full strength. \u25AA Shell: Tidus enhances an ally's magic defense,\
        \ halving the damage of all spells directed at them. However, this is also\
        \ inclusive of any healing spells. \u25AA Protect: Tidus enhances an ally's\
        \ physical defense, halving any damage they receive from physical attacks.\
        \ \u25AA Reflect: Tidus creates a barrier around himself that automatically\
        \ reflects any spell back at his enemy. \u25AA Dispel: Tidus removes any sort\
        \ of buffs his enemy has that would increase their power. \u25AA Regen: Tidus\
        \ casts a spell that gradually heals himself or one of his allies over a period\
        \ of time. \u25AA Auto-Life: Tidus casts a spell that ensures that, upon death,\
        \ he will be automatically revived. Holy: Tidus calls down a massive beam\
        \ of holy-elemental energy to blast his foes. Wakka's Sphere Grid: \u25AA\
        \ Dark"
