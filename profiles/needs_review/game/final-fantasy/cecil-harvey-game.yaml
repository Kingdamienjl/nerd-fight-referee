  range:
    text: Standard Melee Range, Multiversal+ with magic (Magic as a whole is shown
      to affect omnipresent beings such as Exdeath when he's become one with the Void
      itself, which spans across the entire Final Fantasy Multiverse, can even banish
      foes into the Void with the Warp ability)
    source_ids:
    - vsbattles-cecil-harvey-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted, Cecil is known as Baron's finest knight and was a terror on the
      battlefield with his skills of swordsmanship as a Dark Knight, even putting
      him on a higher level than the Baron knights, who are trained to analyze their
      targets in a few seconds to determine their weaknesses to take them down. His
      skills have not dulled as a Paladin, and his skills primarily revolve around
      defending his allies rather than attacking, utilizing a variety of minor White
      Magic and jumping into the line of fire to protect them. By The After Years,
      Cecil has become an effective and well-loved ruler amongst his citizens, showing
      that he is still an effective leader long after being relieved of command. In
      Dissidia he also shows the ability to switch between his forms as a Dark Knight
      and a Paladin to best suit the situation, manipulating light and darkness in
      tandem to overwhelm foes and adapt to changing battle conditions.
    source_ids:
    - vsbattles-cecil-harvey-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
