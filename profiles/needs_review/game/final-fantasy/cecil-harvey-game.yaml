    - field: powers_and_abilities
      value: 'Resistant to the Following: Subjective Reality, Magic, Conceptual Manipulation
        (Type 2), and Space-Time Manipulation (Characters are capable of surviving
        and resisting magical abilities, Which is shown to project one''s inner mind
        onto reality, and as shown with the creation of the Devil''s road, remove
        entire concepts and warp space and time to where the past, present, and future
        exists as one), Law Manipulation (Resists magic, which can rewrite the natural
        order of things), Gravity Manipulation (Unaffected by the gravitational pull
        of the True Moon, which even the Lunar Whale couldn''t escape from), Disease
        Manipulation (Can remain in the Impact Crater for extended periods of time
        despite its presence rotting the landFinal Fantasy IV: The After Years Novel,
        chapter 2, page 83 and making it diseased), Spatial Manipulation, Deconstruction,
        and BFR (Can withstand the attacks of Atomos, who manipulates space, crush
        enemies down to a molecular levelDissidia Final Fantasy, and can warp them
        into another dimension), Life Manipulation, Absorption (Can cross the Devil''s
        Road without their life force being drained), Corruption (Type 1) and Madness
        Manipulation (Type 2; Dark Knights are properly trained to control their darkness
        and use their dark swords, otherwise they will consume their hearts and turn
        them into berserk killers), Extreme Heat (Can fight for extended periods in
        the lava-filled chasms of the underworld), Extreme Cold and Cosmic Radiations
        (Can fight and survive on the moon), Absolute Zero (Can survive Lunar Shiva''s
        ice attacks, including Diamond Dust), Matter Manipulation (Can survive hits
        from Flare, which triggers fission reactions), Hellfire Manipulation (Can
        survive the heat and flames of Ifrit''s hellfire), Age Manipulation (Can withstand
        the effects of the Lunar Mist Dragon''s presence, which is capable of reverting
        Rydia to a child), Resistance Negation (Can resist the status ailments from
        the Lunar Summons, which can affect Zeromus despite him being resistant to
        these effects), Soul Manipulation (Is capable of resisting the ability of
        the Trap Door to being absorbed down to his very soul, on top of surviving
        the Devil''s RoadFinal Fantasy IV Novel 1, chapter 4, page 195 which can rip
        apart one''s soul, and can withstand Ifrit''s Hellfire, which is stated to
        burn the soul awayFinal Fantasy IV: The After Years Novel, chapter 3, page
        160), Possession and Necromancy (Is able to resist the effects of the Leshy''s
        possession ability regardless if he''s dead), Holy Manipulation, Status Effect
        Inducement (which includes Transmutation, and Size Manipulation; Is capable
        of resisting these effects with the Dark Shield), Empathic Manipulation, and
        Madness Manipulation (Type 3; Resistant to the effects of the True Moon, which
        is capable of affecting the hearts and minds of all living beings on the planet),
        Curse Manipulation, Void Manipulation, Mind Manipulation, Biological Manipulation,
        Time Stop, Statistics Reduction, and Corruption (Type 2; Is shown to withstand
        the effects of the Darkness from Final Fantasy III more than once, which is
        shown to have these abilities), Regeneration Negation (High-Godly) and Immortality
        Negation (Type 1, 2, 3, 4, 5, 7, and 8; Is capable of withstanding hits from
        numerous foes blessed by the crystals and is still capable of healing from
        their wounds and not lose his immortality) Same as before, plus Transformation
        and Statistics Modification (Can switch between his Dark Knight and Paladin
        forms through the usage of specific attacks, which changes his statistics
        to match), Holy Manipulation, Light Manipulation (A paladin''s powers are
        the opposite of a dark knight''s, and most of Cecil''s abilities utilize these
        attributes), Illusion Creation (Can create illusions to avoid multiple attacks
        via the Decoy item), Status Effect Inducement, Curse Manipulation and Statistics
        Reduction (Can inflict his foes with the Curse status ailment, lowering their
        stats in the process via the Ancient sword), Life Absorption (Via the Blood
        sword, which is capable of draining the target''s health), Sleep Manipulation
        (via Sleep Blade), Ice Manipulation (via Icebrand), Petrification (via Stoneblade),
        Berserk Mode (Can gain a massive boost in strength via the Avenger), Transmutation
        (via Hog Call), Poison Manipulation (via Poison Axe), Invulnerability and
        Attack Reflection (Can nullify any physical attacks and reflect magical attacks
        via the Lunar Curtain), Perception Manipulation (via the Blinding arrows,
        which can render a foe blindFinal Fantasy V GBA Manual), BFR (The Teleport/Warp
        spells are capable of banishing targets to the Void, which inflicts the following
        abilities on the victim: Existence Erasure/Void Manipulation, Mind Manipulation
        (which includes Madness Manipulation (Type 3), and Perception Manipulation),
        Space-Time Manipulation, Time Stop, and Corruption (Type 2), Power Nullification
        (via the Silencing Arrows and Mage Masher, which prevents the target from
        casting magic), Madness Manipulation'
