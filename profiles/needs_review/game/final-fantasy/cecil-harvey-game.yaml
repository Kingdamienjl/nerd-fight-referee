        him the relative remaining fighting strength and their weaknesses. *Protect:
        Conjures a magical barrier that reduces the damage Cecil and his allies take
        from physical attacks. *Raise: Resuscitates an ally, bringing them back from
        the brink of death. *Shell: Conjures a magical barrier that reduces the damage
