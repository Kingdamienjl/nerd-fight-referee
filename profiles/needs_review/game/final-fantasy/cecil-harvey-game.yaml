  stamina:
    text: Superhuman (He can fight through entire gauntlets of monsters without tiring
      and regularly takes hits for his allies, even against the likes of powerful
      beings like Zeromus. He has also faced the God of Eidolons, Bahamut, gone through
      the Lunar temple to face numerous challenges against the Lunar summons, as well
      taking on an even more powerful version of Zeromus named Zeromus EG)
    source_ids:
