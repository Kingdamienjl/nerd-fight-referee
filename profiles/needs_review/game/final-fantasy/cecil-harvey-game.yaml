    - field: intelligence
      value: Gifted, Cecil is known as Baron's finest knight and was a terror on the
        battlefield with his skills of swordsmanship as a Dark Knight, even putting
        him on a higher level than the Baron knights, who are trained to analyze their
        targets in a few seconds to determine their weaknesses to take them down.
        His skills have not dulled as a Paladin, and his skills primarily revolve
        around defending his allies rather than attacking, utilizing a variety of
        minor White Magic and jumping into the line of fire to protect them. By The
        After Years, Cecil has become an effective and well-loved ruler amongst his
        citizens, showing that he is still an effective leader long after being relieved
        of command. In Dissidia he also shows the ability to switch between his forms
        as a Dark Knight and a Paladin to best suit the situation, manipulating light
        and darkness in tandem to overwhelm foes and adapt to changing battle conditions.
      source_id: vsbattles-cecil-harvey-game-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Some of his Dark Knight abilities require him to drain his health in
        order to use them | None notable Notable Attacks/Techniques: |-|Magic= *Cure:
        Casts a spell that heals himself of minor injuries. **Cura: A more powerful
        version of cure that heals moderate injuries. *Esuna: Removes negative status
        conditions such as poison, blinding, or paralysis on himself or allies. *Libra:
        Casts a spell that allows Cecil to view the status of the target, showing
        him the relative remaining fighting strength and their weaknesses. *Protect:
        Conjures a magical barrier that reduces the damage Cecil and his allies take
        from physical attacks. *Raise: Resuscitates an ally, bringing them back from
        the brink of death. *Shell: Conjures a magical barrier that reduces the damage
        Cecil and his allies take from magical attacks. *Teleport: Warps Cecil to
        a place of his choosing, allowing him to evade large-scale attacks. |-|Dark
        Knight= *Dark Cannon: Fires several orbs of darkness that pierce opponents
        and drag them into Cecil''s melee range. *Darkness/Soul Eater: Cecil sacrifices
        some of his vitality to fire a dark wave that strikes foes for darkness-elemental
        damage or temporarily double his striking strength. In Dissidia, Cecil repeatedly
        stabs his opponent before sending them flying with an orb of darkness. *Dark
        Flame: Stabs the ground to release a wave of dark fire that follows the opponent
        through walls and into the air. *Gravity Ball: Fires an orb of darkness that
        travels downward, sending the opponent into the ground at high speed by rapidly
        increasing gravity should the orb make contact. *Paladin Arts: Blows the opponent
        upward with an orb of darkness before switching to Paladin and using Searchlight.
        *Shadowbringer: Steps forward to slash the opponent with an upward movement,
        followed by a downward slash before sending the enemy skyward with a final
        upward thrust. *Soul Shift: His EX Burst in Dissidia, Cecil strikes his opponent
        as a Paladin before throwing a spear of darkness as a Dark Knight, finishing
        by transforming back into a Paladin and slicing through the target with a
        cross-shaped slash of light, dealing massive damage. |-|Paladin= *Luminous
        Shard: Cecil sends out a wave of light with a swing of his sword, homing in
        on the foe to deal damage on impact. *Paladin Force: Fires a projectile of
        light to stun the foe before dealing several flying slashes, finishing them
        by slamming them into the ground. *Saint''s Fall: Dives towards the opponent
        in a rising arc before slamming them into the floor. *Searchlight: Throws
        a magical seal that locks onto the target and fires magical projectiles. *Soul
        Shift: His EX Burst in Dissidia, Cecil strikes his opponent as a Paladin before
        throwing a spear of darkness as a Dark Knight, finishing by transforming back
