  durability:
    text: Small Country level (Survived Titan's destructive power, which yields this
      much power), far higher with Augments | Multi-Solar System level (Tanked attacks
      from Zeromus, who is the manifested hatred of Zemus, far surpassing Lunarians
      like Golbez and Fusoya, could even tank blows from Bahamut and survive even
      when his guard was lowered), far higher with Augments | Multi-Solar System level,
      likely Low Multiverse level (Tanked attacks from The Creator and Gilgamesh),
      far higher with Augments | Multiverse level+, far higher with Augments, Immortality,
