        entire concepts and warp space and time to where the past, present, and future
        exists as one), Law Manipulation (Resists magic, which can rewrite the natural
        order of things), Gravity Manipulation (Unaffected by the gravitational pull
        of the True Moon, which even the Lunar Whale couldn''t escape from), Disease
        Manipulation (Can remain in the Impact Crater for extended periods of time
        despite its presence rotting the landFinal Fantasy IV: The After Years Novel,
        chapter 2, page 83 and making it diseased), Spatial Manipulation, Deconstruction,
        and BFR (Can withstand the attacks of Atomos, who manipulates space, crush
        enemies down to a molecular levelDissidia Final Fantasy, and can warp them
        into another dimension), Life Manipulation, Absorption (Can cross the Devil''s
        Road without their life force being drained), Corruption (Type 1) and Madness
        Manipulation (Type 2; Dark Knights are properly trained to control their darkness
        and use their dark swords, otherwise they will consume their hearts and turn
        them into berserk killers), Extreme Heat (Can fight for extended periods in
        the lava-filled chasms of the underworld), Extreme Cold and Cosmic Radiations
        (Can fight and survive on the moon), Absolute Zero (Can survive Lunar Shiva''s
        ice attacks, including Diamond Dust), Matter Manipulation (Can survive hits
        from Flare, which triggers fission reactions), Hellfire Manipulation (Can
        survive the heat and flames of Ifrit''s hellfire), Age Manipulation (Can withstand
        the effects of the Lunar Mist Dragon''s presence, which is capable of reverting
        Rydia to a child), Resistance Negation (Can resist the status ailments from
        the Lunar Summons, which can affect Zeromus despite him being resistant to
        these effects), Soul Manipulation (Is capable of resisting the ability of
        the Trap Door to being absorbed down to his very soul, on top of surviving
