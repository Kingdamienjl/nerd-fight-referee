    - field: powers_and_abilities
      value: 'Base (FFVII)= *Superhuman Physical Characteristics (Is physically built
        like someone in SOLDIERFinal Fantasy VII (1997). Members of SOLDIER are injected
        with Jenova cells and large amount of Mako energyFinal Fantasy VII Remake
        (2020)Crisis Core: Final Fantasy VII (2007), which greatly amplify their physical
        capabilitiesFinal Fantasy VII 10th Anniversary Ultimania (2007).) *Spirit
        Energy Manipulation (Beginner during Before Crisis & Crisis Core, Standard
        during Disc 1, Skilled during Disc 2, Perfected during Disc 3) *Acrobatics
        & Limited Surface Scaling (Hypermobility & Enhanced Condition; Can preform
        flips and leaps. SOLDIER members are capable of running up walls using parkourFinal
        Fantasy VII: The First SOLDIER (2021)) *Enhanced Senses (SOLDIER members possess
        amazing reflexes) *Master Swordsman & Marksmanship (Ever since Cloud was younger
        he has displayed a natural talent for swordsmanshipCrisis Core Complete Guide
        (2008), being able to proficiently use the Buster Sword to impale Sephiroth.
        Can skilfully use his firearms, as a Shinra infantryman he is trained in the
        usage various of guns) *Vehicular Mastery (Seen here) *Pressure Point Strikes
        (Via Critical Hits) *Energy Projection & Homing Attack (With his Blade Beam
        Limit Breaks) *Non-Physical Interaction (Can harm ghosts of the Gi-Tribe)
        *Regeneration Negation (Low-High) & Immortality Negation (Type 2, 3, 6 & 7;
        Can permenantly kill fragments of Jenova. Jenova''s body is extremely ressiliant
        allowing it to surive even while being reduced to cellsFinal Fantasy VII:
        Ultimania Omega (2005), furthermore those cells are all controlled by Sephiroth''s
        will and they will come together and form a new body again. Can also kill
        members of the Gi Tribe, warriors that were killed in battle but live on as
