        them in darkness and messing their optical senses. *Analyze: The user is capable
        of analyzing the target to determine their stats, strengths and weaknesses.
        *Upgrade: The user can mix an elemental attack item with their weapons, gaining
        their innate powers in their weapons as a result. *Inferno: The user casts
        a giant fire spell, damaging all foes in the area. *Darkne'
