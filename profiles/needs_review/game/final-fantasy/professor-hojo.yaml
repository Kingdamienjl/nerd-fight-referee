    - field: powers_and_abilities
      value: 'Same as before, plus Mind Manipulation and Possession (can enforce his
        will through those infected with Jenova Cells), Telepathy, Mind Reading, Memory
        Reading and Emotion Perception (Jenova can read the minds and emotions of
        others and Kadaj has been shown to be able to scan the memories of other people,
        an ability Tseng noted is rooted in Jenova herself), Illusion Creation and
        Perception Manipulation (Sephiroth can create very detailed illusions and,
        as seen with Kadaj and described by Ifalna, Jenova could trick a person''s
        perceptions to make herself be seen as a person from their memory), Flight
        and Levitation, Telekinesis, Intangibility, Shapeshifting and Body Control
        (can transform the severed parts of Jenova into large monsters, copies of
        himself, unrelated people or simply use them as extensions), likely Pain Manipulation
        and minor Biological Manipulation (Kadaj can heal wounds and take away pain
        from a person, through physical contact, and give them back whenever he wishes.
        Given Kadaj is an extension of Sephiroth, and Sephiroth himself is the being
        who was inherited Jenova''s abilities the best, it''s possible he also has
        this ability), Large Size (Type 0 as Bizarro and Safer Sephiroth), Weapon
        Creation, Silence Inducement (Apart from magic, could use his powers to silence
        Tifa'' voice at a critical moment), Immortality (Types 2, 3, 6 and 8. As long
        as there are Jenova Cells, Sephiroth can sustain his will through them and
        use them to build a new body) and Regeneration (Low-High, like Jenova, Sephiroth
        can use the Reunion to rebuild his body from fragments, even cells), Adaptation
        (like Jenova, through replication, he can grow and adapt to new threats and
        environments), stronger Energy Manipulation in the form of: Energy Absorption
        (absorbed vast amounts of knowledge and power from the Lifestream) and Energy
        Projection via new attacks with Additional Effects, Poison Manipulation and
        Time Slowdown (via Stigma), Transmutation into Frogs, Size Minimization and
        the Sadness Ailment (via Pale Horse), Healing (via Bizarro Energy), as well
        as stronger Life Manipulation (via Heartless Angel, which now affects several
        enemies who are considerably stronger than Zack Fair), Physical Attack Boost
        in the form of Additional Effects (as Safer Sephiroth, his physical attacks
        inflict Paralysis and Blindness), Statistics Reduction (both the Frog and
        Small status reduce the enemy''s offensive capabilities), Power Nullification
        (via the Silence and Frog status), Sealing (can block off external power streams
        and interferences, such as holding back Holy within the Planet''s Core and
