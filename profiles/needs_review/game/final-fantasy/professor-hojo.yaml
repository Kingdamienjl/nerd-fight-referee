- id: claim-weaknesses-bcb29125
  section: weaknesses
  axis: weakness
  text: Despite his genius, Hojo is arrogant, condescending and narrow-minded, quick
    to disregard any possibility or outcome that doesn't convince him or doesn't fit
    with his theories, which also steems from his constant need to prove his intelligence
    to others, fitting when Sephiroth described him as a "walking mass of complexes".
    Once he injected the Jenova Cells in his body, his sanity quickly degraded, and
    his sociopathic scientific curiosity became a full blown lunacy to answer his
    own questions with little regard for anything. additionally, as seen in Dirge
    of Cerberus, Hojo can easily get drunk with power when in an advantageous position,
    aggravating the issues previously described. Before injecting with Jenova Cells,
    Hojo was just a normal man, vulnerable to any human weakness.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a3914065
  section: abilities
  axis: hax
  text: 'Genius Intelligence | Superhuman Physical Characteristics; Magic; Time Slowdown
    (via Slow); Poison Manipulation (via Combo and Bio Gas); Silence Inducement (via
    Silence and Combo); Power Nullification (via the Silence status); Blindness (via
    Combo); Sleep Inducement (via Sleepel and Combo); Madness Manipulation (via Confu);
    Summoning (a variant via Capsule, to call experiment monsters to aid him in battle):
    Fire Manipulation (via Fire2 with the Poodler Sample) and Blindness (via Evil
    Poison with the Bad Rap Sample); Possession (created a digital copy of his mind
    in the Worldwide Network and used it to possess the body of Weiss the Immaculate.
    However, due to the complicated procedure is not combat applicable); Regeneration
    (Low-Mid, can regenerate lost limbs); Adaptation (one of Jenova''s main abilities
    is the ability to mimic others lifeforms and adapt to new threats and environments,
    which extends to a lesser degree to those carrying her cells). Resistance to Poison
    Manipulation; Silence Inducement; Transmutation; Size Manipulation; Power Nullification;
    Sleep Inducement; Paralysis Inducement; Petrification; Berserk Inducement; Madness
    Manipulation; Time Manipulation; Time Stop; Death Manipulation.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
