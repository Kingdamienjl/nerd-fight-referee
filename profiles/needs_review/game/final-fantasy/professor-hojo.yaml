  intelligence:
    text: Genius (Despite his lack of morals and empathy, Hojo, after the late Professor
      Gast Faremis, is Shinra's most brilliant scientist, having spearheaded the Project
      S branch of the Jenova Project after Gast left, resulting in the successful
      creation of Sephiroth, compared to many other failures from other scientists
      in the Project G branch. In doing so, he began the line of SOLDIERs that would
      later help Shinra take over nations across the world. During the events prior
      and during the game, he successfully deduced the nature of Jenova's regenrative
      abilities and how Sephiroth would manifest again, long before his reappearance,
      thanks to his Reunion theory, putting a long and complex experiment into motion
      that eventually did lead Shinra to both of them. Combat wise, he easily adapted
      to Weiss' body when he possessed him, using effectively all of his techniques
      to easily overwhelm Vincent in their first encounter.)
    source_ids:
    - vsbattles-professor-hojo-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
