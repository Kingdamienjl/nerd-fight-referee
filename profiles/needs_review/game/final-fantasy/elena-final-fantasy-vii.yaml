power_scale:
  tier:
    text: 4-A, likely 2-A | 3-B, likely 2-A
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Multi-Solar System level (Elena is strong enough to fight the main party
      alongside Reno and Rude, after Cloud and his allies had grown strong enough
      to control Summons such as Bahamut ZERO and among whom Red XIII could already
      perform his Stardust Ray Limit Break. Cloud himself had survived the awakeningFinal
      Fantasy VII (1997) of 5 of the 8 Weapons, when a single one is stronger than
      Zirconiade, and the party had defeated Weapons in combat already), likely Multiverse
      level+ (Cloud fought in Ramza Beoulve''s army alongside Balthier and Luso Clemens
      during his time in Ivalice, the former whom had defeated Gilgamesh twice alongside
      Vaan and the others, and the latter whom had allied with Vaan before joining
      Ramza) | Multi-Galaxy level (Surived an encounter with the Remnants of Sephiroth,
      albeit heavily wounded, and it''s implied she was easily defeated despite their
      fight not being shown. Among them Kadaj, the leader is as strong as Sephiroth
      wasFinal Fantasy VII: Advent Children -Reunion Files- (2006) in the original
      game, who was stronger than the individual members of the main party all whom
      controlled the Knights of the Round), likely Multiverse level+ (The Remnants
      could hold their own against Cloud, whom had become far stronger since fighting
      alongside Ramza)'
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Could keep up with the party after they had gained control
      of Summons like Bahamut ZERO and Red XIII could perform his Stardust Ray Limit
      Break) | Massively FTL+ (Should be comparable to his companions Reno and Rude
      who can keep up with the Remnants of Sephiroth, among whom Kadaj is as strong
      as Sephiroth was in the original game)
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Stellar (Comparable to the main party, who are on even ground with Weapons
      which are stronger than Zirconiade, a Summon far superior to Typhon) | Stellar
      (Should compare to Reno and Rude, whom managed to hold their own against the
      Remnants of Sephiroth despite being clearly weaker)
    source_ids: &id002
    - mediawiki-4789734
    confidence: 0.95
  striking_strength:
    text: Multi-Solar System level (Should be able to injure a much stronger party
      with her physical might), likely Multiverse level+ (The party scales to Cloud
      who during his time in Ivalice fought alongside Balthier, who had defeated Gilgamesh
      twice) | Multi-Galaxy level, likely Multiverse level+ (Stronger than before.
      Should compare to Reno and Rude)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-Solar System level (Could fight the party alongside her partners,
      and come out not worse for wear, when they had become strong enough to take
      down Weapons), likely Multiverse level+ (Cloud had fought alongside Balthier
      in Ramza's army, whom had defeated Gilgamesh, and displayed a similar destructive
      power) | Multi- Galaxy level (Surived an encounter with the Remnants of Sephiroth,
      albeit heavily wounded), likely Multiverse level+ (The Remnants could hold their
      own against Cloud, who was stronger than when he fought in Ramza Beoulve's army)
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Turks, as a norm, are trained to stay on duty in grueling conditions
      for hours in order to carry out their missions, this includes being deprived
      of food or sleep, or even being injured, without truly slowing down unless the
      damage is too extreme.
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range. A few meters with her abilities. Tens of Meters with
      her gun.
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average. Just being a Turk is a demonstration of Elena's skill and
      knowledge regarding several areas, such as combat, espionage, gathering information,
      use of different weapons and vehicles, among other abilities. However, the lack
      of experience that comes with Elena's status as a newcomer and her many times
      impulsive approach to her duties, born out of her desire to uphold the Turk's
      name and prestige, leads her to make glaring mistakes such as revealing confidential
      information to enemies, let her guard down around opponents she would have no
      trouble with normally or prevent herself from solving situations for which she
      is skilled enough to handle.
    source_ids:
    - mediawiki-4789734
    confidence: 0.6
    notes: auto_repair source extraction
