    kinds of explosives to attack the party. While the exact nature, design or model
    of these is unknown, the explosives can be used for a localized explosion or to
    cause a carpet bomb effect. *Handgun: While not seen properly in the games, Elena
    is shown to be a proficient shot in the side novel The Kids Are Alright: A Turks
    Side Story written by Kazuhige Nojima, displaying quick and precise aim with her
    firearms. *Cell Phone: Elena, like all Shinra personnel, carries a mobile phone
    to contact his colleagues or his teammates during missions and plan properly his
    next course of action.'
