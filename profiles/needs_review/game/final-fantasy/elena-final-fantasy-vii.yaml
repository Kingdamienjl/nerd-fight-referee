    - field: attack_potency
      value: 'Multi-Solar System level (Elena is strong enough to fight the main party
        alongside Reno and Rude, after Cloud and his allies had grown strong enough
        to control Summons such as Bahamut ZERO and among whom Red XIII could already
        perform his Stardust Ray Limit Break. Cloud himself had survived the awakeningFinal
        Fantasy VII (1997) of 5 of the 8 Weapons, when a single one is stronger than
        Zirconiade, and the party had defeated Weapons in combat already), likely
        Multiverse level+ (Cloud fought in Ramza Beoulve''s army alongside Balthier
        and Luso Clemens during his time in Ivalice, the former whom had defeated
        Gilgamesh twice alongside Vaan and the others, and the latter whom had allied
        with Vaan before joining Ramza) | Multi-Galaxy level (Surived an encounter
        with the Remnants of Sephiroth, albeit heavily wounded, and it''s implied
        she was easily defeated despite their fight not being shown. Among them Kadaj,
        the leader is as strong as Sephiroth wasFinal Fantasy VII: Advent Children
        -Reunion Files- (2006) in the original game, who was stronger than the individual
        members of the main party all whom controlled the Knights of the Round), likely
        Multiverse level+ (The Remnants could hold their own against Cloud, whom had
        become far stronger since fighting alongside Ramza)'
      source_id: mediawiki-4789734
