      value: Gifted. An excellent agent on his own merits, Tseng truly shines when
        it comes to strategic thinking and planning, being the unquestionable figure
        to follow within the Turks after Veld. Trained in all sorts of combat skills,
        espionage, infiltration and information retrieval, Tseng has put to good use
        all of them in years of duty as a Turk. His experience shows, as he has acted
        as the mission control and support for other Turks and SOLDIER operatives,
        including high ranking members such as Zack Fair. Additionally, Tseng is highly
        perceptive of details, which is accompanied by a sharp deductive mind which
        allows him to put together the answer for most riddles that may come up during
        his work.
