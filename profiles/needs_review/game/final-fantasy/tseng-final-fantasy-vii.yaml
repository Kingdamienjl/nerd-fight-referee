- id: claim-powers-and-abilities-83276ffa
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Tseng is a very accomplished
    marksmanCrisis Core -Final Fantasy VII-: Reunion (2022) with his gun, his weapon
    of choice), Martial Arts (Though some members specialize in it more than others,
    all Turks receive training in hand-to-hand combat), Stealth Mastery (Can flawlessly
    disguseBefore Crisis -Final Fantasy VII- (2004) himself as the enemy to infiltrate
