- id: claim-standard-equipment-29217f10
  section: equipment
  axis: equipment
  text: 'Tseng Handgun.png|Tseng aiming his Gun Tseng Cell Phone.png|Tseng talking
    with Zack via phone during their first mission together Tseng Full Cure.png|Veld
    gives Tseng the FullCure Materia *Handgun: Tseng''s weapon of choice is a handgun
    of seeming mundane design, but shown to be one of the many weapons developed by
    Shinra to be able to hurt superhuman enemies. Tseng uses it with quick and well
    aimed shots. *FullCure Materia: A gift from Veld to Tseng after they completed
    their first mission together and Veld passed important lessons to his junior.
    Veld commented that the Materia was a rare sample and the only of its kind in
    possession of the Turks, demonstrating the trust Veld had in Tseng. *Cellphone:
    Tseng, like all Shinra personnel, carries a mobile phone to contact his colleagues
    or his teammates during missions and plan properly his next course of action.'
