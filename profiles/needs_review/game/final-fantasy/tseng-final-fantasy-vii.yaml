        developed by Shinra to be able to hurt superhuman enemies. Tseng uses it with
        quick and well aimed shots., FullCure Materia: A gift from Veld to Tseng after
        they completed their first mission together and Veld passed important lessons
        to his junior. Veld commented that the Materia was a rare sample and the only
        of its kind in possession of the Turks, demonstrating the trust Veld had in
        Tseng., Cellphone: Tseng, like all Shinra personnel, carries a mobile phone
        to contact his colleagues or his teammates during missions and plan properly
