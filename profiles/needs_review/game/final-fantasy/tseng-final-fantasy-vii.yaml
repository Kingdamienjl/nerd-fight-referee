  attack_potency:
    text: At least Multi-Continent level (After the prime era of the Turks was over,
      following their mass desertion, Veld's going into hiding and the deptarment
      being absorbed by public security, the remaining members lost the drive they
      used to have and their abilities greatly suffered as a result. Tseng was almost
      killedFinal Fantasy VII (1997) by a Jenova fragment taking Sephiroth's shape.
      Fragments at that point could put a fight but still would be defeated by the
      main party, all whom controlled Summons superior to Ifrit, Shiva and on the
      scale of Bahamut and could easily defeat 3rd Version Ravens)
    source_ids:
    - mediawiki-4789729
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Sub-Relativistic+ (Shouldn't be weaker than his companions Reno and Rude.
      However, Tseng failed to react to a sudden attack from a Jenova fragment taking
      Sephiroth's shape. At that point, despite being eventually defeated, the fragments
      seen could keep up with the main party)
    source_ids:
    - mediawiki-4789729
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class M, likely higher (Despite his diminished strength, Tseng still should
      compare to Reno and Rude, who held their own against the main party, who in
      turn controlled Titan and even superior Summons)
    source_ids: &id002
    - mediawiki-4789729
    confidence: 0.95
  striking_strength:
    text: At least Multi-Continent level, likely higher (His abilities have decayed,
      but should be on the level of the other Turks and the party by that point)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Multi-Continent level, likely higher (Survived a sudden slashFinal
      Fantasy VII (1997) from a Jenova fragment taking Sephiroth's shape, however
      Tseng was critically wounded and out of commission for a long time. The Jenova
      fragments were capable of fighting the party, who could control Summons on the
      level of Bahamut and could easily defeat 3rd Version Ravens)
    source_ids:
    - mediawiki-4789729
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Tseng has shown to be very resillient to injuries, being able
      to take enormous amounts of punishment before staying down, only falling immediately
      when the wound proved to be almost lethal without immediate first aid. He can
      go on in missions that have lasted what is implied to be hours, far from his
      best condition and seeing it through to the end.
    source_ids:
    - mediawiki-4789729
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range; up to Tens of Meters with his gun
    source_ids:
    - mediawiki-4789729
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted. An excellent agent on his own merits, Tseng truly shines when it
      comes to strategic thinking and planning, being the unquestionable figure to
      follow within the Turks after Veld. Trained in all sorts of combat skills, espionage,
      infiltration and information retrieval, Tseng has put to good use all of them
      in years of duty as a Turk. His experience shows, as he has acted as the mission
      control and support for other Turks and SOLDIER operatives, including high ranking
      members such as Zack Fair. Additionally, Tseng is highly perceptive of details,
      which is accompanied by a sharp deductive mind which allows him to put together
      the answer for most riddles that may come up during his work.
    source_ids:
    - mediawiki-4789729
    confidence: 0.6
    notes: auto_repair source extraction
