      value: Superhuman. Tseng has shown to be very resillient to injuries, being
        able to take enormous amounts of punishment before staying down, only falling
        immediately when the wound proved to be almost lethal without immediate first
        aid. He can go on in missions that have lasted what is implied to be hours,
