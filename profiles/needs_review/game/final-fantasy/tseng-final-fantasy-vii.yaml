    - field: standard_equipment
      value: 'Veld gives Tseng the FullCure Materia, Handgun: Tseng''s weapon of choice
        is a handgun of seeming mundane design, but shown to be one of the many weapons
        developed by Shinra to be able to hurt superhuman enemies. Tseng uses it with
        quick and well aimed shots., FullCure Materia: A gift from Veld to Tseng after
        they completed their first mission together and Veld passed important lessons
        to his junior. Veld commented that the Materia was a rare sample and the only
        of its kind in possession of the Turks, demonstrating the trust Veld had in
        Tseng., Cellphone: Tseng, like all Shinra personnel, carries a mobile phone
        to contact his colleagues or his teammates during missions and plan properly
        his next course of action.'
      source_id: vsbattles-tseng-final-fantasy-vii-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted. An excellent agent on his own merits, Tseng truly shines when
        it comes to strategic thinking and planning, being the unquestionable figure
        to follow within the Turks after Veld. Trained in all sorts of combat skills,
        espionage, infiltration and information retrieval, Tseng has put to good use
        all of them in years of duty as a Turk. His experience shows, as he has acted
        as the mission control and support for other Turks and SOLDIER operatives,
        including high ranking members such as Zack Fair. Additionally, Tseng is highly
        perceptive of details, which is accompanied by a sharp deductive mind which
        allows him to put together the answer for most riddles that may come up during
        his work.
      source_id: vsbattles-tseng-final-fantasy-vii-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
