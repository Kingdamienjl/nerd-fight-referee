    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Super Soldier Physiology, Human
        Physiology, Magic, Summoning, Martial Arts (As seen in Ehrgeiz: Gods Bless
        The Ring), Enhanced Swordsmanship, Weapon Mastery (Is skilled in the use of
        a shotgun and grenades as he used to be a former Shinra infantryman), Multi-Weapon
        Wielding, Weapon Proficiency, Giant Weapon Proficiency, Dual Wielding, Enhanced
        Combat, Mid-Air Combat, Cutting, Combination Attacks, Counter, Indomitable
        Will, Enhanced Strength, Supernatural Strength, Enhanced Agility, Enhanced
        Stamina, Supernatural Survivability, Supernatural Cells, Pain Suppression,
        Power Level Manipulation (Can use Mako to empower his weapon for different
        effects), Limit Break (Can perform powerful Limit Breaks like Braver, Meteorain,
        Cross-Slash, Finishing Touch, Omnislash, Omnislash Version 5, and many more),
        Spiritual Assistance, God Summoning, Mutagen Empowerment, Resistance to Soul
        Attacks, Telekinesis, Mind Control, and Illusions, Elemental Manipulation
        (Of the lightning, ice, wind, fire and earth varieties), Darkness Manipulation,
        Light Manipulation (Began to glow in light during his fight with Sephiroth
        in Kingdom Hearts 2), Healing and Regeneration (Mid-Low), Vortex Creation
        (Via Finishing Touch), Poison Manipulation, Sword Beam Emission (Via Blade
        Beam), Transmutation (In the form of transforming others into toads), Petrification
        (Possible side effect of the Break spell), Meteor Summoning (Via Meteorain),
        Fear Masking, Emotion Empowerment, Anger Empowerment, Wallrunning, Teleportation
        (Can also be used to send targets far away, not to another dimension), Barrier
        Creation, Danmaku, Time Manipulation, Time Reduction and Time Acceleration
        (In the form of slowing his enemies down and speeding his own time up), Energy
        Manipulation and Energy Blast (in the form of Ultima), Death Manipulation
        (Can instantly kill targets with the Death spell), Gadget Usage, Resistance
        to Status Effect Inducement, Sleep Inducement, Paralysis, Silence, Confusion,
        Transmutation, Size Manipulation, Petrification, Mind Manipulation, BFR, Death
        Manipulation, Poison Manipulation, Time Manipulation and Time Stop (By equipping
        one of the Ribbons made by Aerith or by slotting materia into his armor, Cloud
        gains a variety of resistances to the status effects inflicted by various
        magical spells)'
