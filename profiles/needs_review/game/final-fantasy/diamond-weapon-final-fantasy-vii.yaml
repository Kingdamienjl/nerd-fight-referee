      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Solar System level (Capable of fighting Safer-Sephiroth. Has defeated
        Sephiroth with all versions of Omnislash. Notably, at the end of the original
        game, Cloud will briefly surpass Sephiroth's in their battle inside the Lifestream.
        Fought Sora and was implied to be even stronger than him at the time) | Dwarf
        Star level to Unknown (Higher tiered summons like Typhoon or Knights of the
        Round are capable of this level of power) | At least Galaxy level (Traded
        blows with Squall Leonhart, who slew Ultimecia's most powerful Guardians,
        who are able to seal away and junction themselves to the most powerful Guardian
        Forces and are comparable to Seifer in her Castle while all but his normal
        Junction-empowered physical attacks are sealed by their powers) to Universe
        level+, possibly Multiverse level+ (Contended against the Evil Forces led
        by Exdeath, which contained Sephiroth, Cloud of Darkness, and Exdeath himself
        who posed a major threat to all worlds, all dimensions and all of existence
        itself in a reality that is stated to contain infinite universes along with
        infinite versions of everyone, Dissidia confirms that the Final Fantasy reality
        are all connected between one another in one tightly knitted multiverse)
      source_id: character-stats-profiles-diamond-weapon-final-fantasy-vii
