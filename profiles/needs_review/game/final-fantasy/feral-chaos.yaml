    and warp space and time to where the past, present, and future exists as one),
    Law Manipulation (Resists magic, which can rewrite the natural order of things),
    Electricity Manipulation and Pain Manipulation (Is able to resist the Lightning
    spells, which are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel,
    chapter 7, page 54), Fire Manipulation, Ice Manipulation, and Matter Manipulation
    (Sub-Atomic; Is capable of resisting these elements, the Fire and Ice spell in
    particular being capable of affecting theFinal Fantasy IV Series Guidebook target''s
    electrons), Poison Manipulation and Corrosion Inducement (Can resist the Poison
    status effect, which is also stated to corrode the target), Explosion Manipulation
    (Can withstand Bombs attacks), Soul Manipulation (Can resist Zalera, the Death
    Seraph, who was going to absorb the souls of every living being on the planetFinal
    Fantasy 12), Death Manipulation (From Odin''s Zantetsuken), Absolute Zero (Can
    withstand Shiva''s attacks, including Diamond Dust), Water Manipulation (Via Leviahtan),
    Empathic Manipulation, and Madness Manipulation (Type 3; Resistant to the effects
    of the True Moon, which is capable of affecting the hearts and minds of all living
    beings on the planet), Gravity Manipulation (Unaffected by the gravitational pull
    of the True Moon, which even the Lunar Whale couldn''t escape from), Spatial Manipulation,
    Deconstruction, and BFR (Can withstand the attacks of Atomos, who manipulates
    space, crush enemies down to a molecular levelDissidia Final Fantasy, and can
    warp them into another dimension), Extreme Cold and Cosmic Radiations (Can fight
    and survive on the moon) All previous abilities greatly enhanced, the abilities
    of the crystals (The Crystal Core contains the powers of Neo Neo Exdeath and God
    of Magic KefkaDissidia Final Fantasy Opera Omnia), Reality Warping (The crystal
    can rewrite the worldDissidia Final Fantasy Opera Omnia) Corruption and Body Puppetry
    (Ardyn was able to corrupt Caius Ballad and Ultimecia and control their bodies
    Seymour implies that the wielder of the Crystal could directly control the warriors
    of spiritus and drive them to rampage.Dissidia Final Fantasy Opera Omnia), Law
    Manipulation (The Crystal Core maintains the laws of the Land of RespiteDissidia
    Final Fantasy Opera Omnia), Sealing and Power Absorption (The Crystal Core was
    capable of sealing the transformations of the Warriors of Spiritus inside itself,
    which includes Hell Emperor, Neo Exdeath, God of Magic Kefka, Safer Sephiroth,
    Griever Ultimecia, Sin, Seymour Omnis, The Undying, and IncognitusDissidia Final
    Fantasy Opera Omnia), Clairvoyance (Ardyn was capable of using the crystal core
    to see what''s happening in the other worlds.Dissidia Final Fantasy Opera Omnia),
    Immortality (Types 2 and 8, Ardyn was able to prevent all warriors deaths no matter
    how injured they were via the crystalDissidia Final Fantasy Opera Omnia)'
