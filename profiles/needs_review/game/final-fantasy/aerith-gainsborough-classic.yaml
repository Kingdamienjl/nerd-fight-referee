  attack_potency:
    text: Final Fantasy XIII= Moon level+ (Defeated Orphan's initial form with a few
      spells, the entire party combined were capable of defeating Orphan without the
      aid of Ragnarok. Whose energy in his base form comes out to 106,823 exatons)
      |-|Final Fantasy XIII-2= Multiverse level+ (As Etro's Knight, her existence
      was enough to sustain the infinite world of Valhalla. A world that operates
      on a different plane of existence where all timelines are able to be seen from
      and are referred to as "Lower Worlds". Valhalla gives birth to, controls, contains,
      and connects multiple different timelines, of which are there are an infinite
      number of, which equate to infinite possibilities via The Historia Crux. This
      includes The Void, which is considered a mere "Shadow" in comparison to Valhalla.
      With Valhalla being stated numerous times to be beyond Space-Time, and the "paradoxes"
      caused by the Unseen Chaos, which by extension should apply to the Unseen Realm
      itself, is said to completely transcend time. Should be comparable, if not slightly
      below Caius Ballad, and is on par with Serah and Noel, who had previously defeated
      a six-armed Gilgamesh and Omega) |-|Lightning Returns (Incomplete Vessel)= Multiverse
      level+ (Was blessed and molded by Bhunivelze to become the Savior, and was infused
      with his power. The Savior is designed to act as a replacement for Etro herself.
      Making her far superior to her "Knight of Etro" self) |-|Lightning Returns (Complete
      Vessel)= Multiverse Level+ (After gaining the Ultima Weapon and Ultima Shield,
      along with reuniting "Lumina" back into her "Heart", she became far more powerful
      than before, and was able to overpower Bhunivelze in both his first and second
      forms. She was also able to hold back the Chaos that caused the Apocalypse along
      with the black hole that would end up swallowing the dying world of Nova Crysalia,
      which are the remnants of a land where all timelines and dimensions have been
      merged into one) |-|Dissidia= Multiverse level+ (Is comparable to the other
      Warriors of Materia and draws power from the gods of the cycle. Participated
      in the defeat of Shinryu)
    source_ids:
    - vsbattles-aerith-gainsborough-classic-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
