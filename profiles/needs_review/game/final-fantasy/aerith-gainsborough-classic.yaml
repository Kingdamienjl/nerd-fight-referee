        FFVII Battle Model.png|Aerith in-game Battle Model Gaurd Stick Model.png|Guard
        Stick Model in Final Fantasy VII FF7 Guard stick Artwork.jpg|Guard Stick Original
        Artwork Honeyview Princess Guard Model.png|Princess Guard Model in Final Fantasy
