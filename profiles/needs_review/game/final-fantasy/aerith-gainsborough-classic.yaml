        Types.jpg|Materia types, including the unique Holy and Meteor Kadaj-absorbing-a-Materia-FFVIIAC.jpg|Kadaj,
        a remnant of Sephiroth, absorbs Materia directly in his arm Honeyview Aerith
        Appears to Cloud.jpg|Aerith manifests to Cloud in Advent Children Aerith Helps
        Cloud Against Bahamut Sin.jpg|Aerith helps Cloud against Bahamut SIN *Guard
        Stick: Aerith''s initial weapon, a simple metal pole she wields to fight off
        enemies. *Princess Guard: Aerith''s Ultimate Weapon, found in the Temple of
        the Ancients. This ornamental staff has the power to increase its wielder''s
        strength if their allies have fallen in battle. If more allies are defeated
        this boost becomes stronger. *Materia: Rarely, the Spirit Energy of Lifestream
        may be particularly abundant in an area on the Planet''s surface, and for
        years it can concentrate in that certain spot to then condense and crystalize,
        eventually becoming Materia. In the modern day, the Shinra Electric Power
        Company artificially manufactures Materia through their extraction of Mako:
        the term they''ve given to the Spirit Energy they''ve extracted through reactors.
        Contained in it is the wisdom of the Cetra, an ancient race who were spiritually
        connected to the Planet and knew how to access its powers. Materia allows
        the access to this knowledge to be able to call upon those powers, just like
        the Cetra did, in many different ways, most notably Magic. There are different
        kinds of Materia, represented by different colors: green (Magic), red (Summoning),
        yellow (Commands), blue (Support) and purple (Independent). Materia can be
        equipped in many different ways: Cloud and the party slot them into their
        weapons and armor, Vincent can additionally put them in keychains attached
        to his guns, Zack can carry up to six in his person, while the Remnants of
        Sephiroth, due to their nature, can absorb them directly into their bodies.
        *White Materia: A one of a kind Materia, that the Cetra pass down through
        generations and Aerith received as a memento from her mother, Ifalna. This
        Materia is the only possible way to cast Holy, the ultimate White Magic, which
        summons the power of the Planet itself in the form of a gigantic wave to eradicate
        any threats to it. Though initially unaware of its purpose, Aerith eventually
        found out about the true importance of this Materia and resorted to pray to
        the Planet for Holy as a last resort to stop Sephiroth when he revealed his
        plan to summon Meteor, the ultimate Black Magic, to wound the Planet to such
        a scale that it would mean its destruction. As Bugenhagen explains, if the
        prayer for Holy, using the White Materia is answered then its white color
        would turn into a greenish glow, similar to that of the Lifestream, meaning
        the prayer was accepted. It is unknown if the White Materia can be combined
        with Support Materia like other Magic or Summon Materia. *Pink Ribbon: An
        accessory Aerith received as a gift from Zack in their first date as a "first
        date anniversary", which Aerith has held to dearly ever since and worn in
        her hair along with the White Materia. Unlike the Ribbons Cloud and the others
        wear in honor to Aerith after the events of the game, Aerith''s doesn''t seem
        to have special protective properties of any kind.'
