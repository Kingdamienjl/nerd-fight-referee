    - field: weaknesses
      value: "Fought and defeated High-tier Fal'Cie such as Orphan and Barthandelus,\
        \ Fought Caius Ballad on several occasions, Pushed back the Chaos that was\
        \ devouring the Fabula Cosmology, Lindzei and Pulse. So what difference does\
        \ it make you may wonder as terms such as God, devil etc have no real value\
        \ when you're scaling the characters. Let's break down this argument into\
        \ two different sections. border, 600x600px Section 1: P: \"Imagination serves\
        \ as a basis for our creations\" T q: \"We can't imagine things beyond our\
        \ comprehension\" T p \u2227 q: \"We can't create things beyond our comprehension\"\
        \ T For example, it's impossible for us humans to create a new color as a\
        \ \"new\" color is an inconceivable concept to our minds and our brain cannot\
        \ comprehend it as it's not present within our visible spectrum. I'll be using\
        \ the p \u2227 q of the first section as the p of the second section. Section\
        \ 2: p: \"We (humans) can't create things beyond our comprehension\" T q:\
        \ \"Fal'Cie Adam was made by humans\" T p \u2227 q: \"Adam isn't beyond human\
        \ comprehension\" T So when you look at it from a logical perspective, you'd\
        \ realize that it makes sense. Other beings (Gods in this context) may be\
        \ able create beings beyond human comprehension (Gods have created the original\
        \ Fal'Cie, beings whose literal existence is beyond the comprehension of humans)\
        \ but humans themselves cannot create things beyond their own comprehension\
        \ as I've just proven [2]: FFXIII-2 Ultimania Omega Complete translation border"
