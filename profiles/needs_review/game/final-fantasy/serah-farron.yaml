  range:
    text: '*Extended Melee Range (With her sword; Several Meters in Bow mode) *Multiversal+
      (With Magic; Magic as a whole is shown to affect omnipresent beings such as
      Exdeath when he''s become one with the Void itself, which spans across the entire
      Final Fantasy Multiverse and is stated numerous times to contain an infinite
      number of worlds, can banish foes into the Void) At Least Multiversal+, likely
      Far Higher (Unseen Chaos originates from a Higher Dimension known as the "Unseen
      Realm". Where the concepts of Space and Time are nonexistent due to outright
      transcending them, along with the stories, information, and memories that makes
      up the worlds below it, and is completely inaccessible to dimensions below it
      through normal means. Only by Etro opening her "Gate" can the Unseen Realm be
      accessed. The Unseen Realm exists above the world of Valhalla. Valhalla itself
      is a world that is stated numerous times to be beyond Space & Time, and is confirmed
      to be on a different plane of existence, where all timelines are able to be
      viewed from and are referred to as "lower worlds", which includes "The Void"
      which is described as a mere "Shadow" in comparison to Valhalla. The void being
      a structure that is stated multiple times to contain and infinite number of
      universes and harbor "Extradimensional Spaces" in relation to those worlds)'
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Serah is known to be mature, wise, and thoughtful for her age, being a straight
      A student and is always looking out for the well-being of her sister Lightning.
      Despite not having much experience in combat, she quickly becomes an expert
      of the course of her adventures with Noel, being more than capable of keeping
      up with him and the likes of Caius Ballad, a warrior who has been fighting for
      over two thousand years. She is far more magically inclined than Noel, having
      a much high magic stat (reflecting her general intelligence) and learning a
      much greater variety of spells (i.e. Firaga, Thundaga, and Blizzaga). She is
      also accomplished in both melee and ranged combat with her bowsword, taking
      apart her foe's defenses as a Saboteur before laying down the hurt as a Commando
      or Ravager.
    source_ids: *id002
    confidence: 0.8
