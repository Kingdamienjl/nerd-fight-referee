        strengthens them immensely when they fight close together), Homing Attack](Scathach
        can summon spheres that continuously track and fall on her enemies), Additional
        Limbs (Scathach has two additional shadow limbs that she can use to attack,
        which she can increase to eight or so with some attacks, and can also manipulate
