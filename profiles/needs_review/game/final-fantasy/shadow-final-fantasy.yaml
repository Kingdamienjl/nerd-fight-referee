        Development (Passive and Training), Empowerment, Reactive Evolution & Reactive
        Power Level (Conviction, hope, and emotions can massively fuel a fighter,
        to the point they manage to defeat much stronger enemies who view them as
        ants. The Heart is one's spirit, the strength that resides in people, the
        intangible strength of one's soul, an inconstant and immeasurable factor behind
        people's victories against their opponents. The soul is endlessly transforming
        and seeking its own source, formless and ever-changing, meaning it evolves
        and ascends constantly. It gives rise to emotion and intellect), Portal Creation
        & BFR (Diabolos gained from Scathach the ability to spawn a rift that leads
        to a battle against a voidsent, where taking too long gets you killed by the
        enclosing darkness), Large Size (Type 0) Soul Physiology, Beyond-Dimensional
        Physiology (Voidsent can exist in the form of a soul when not occupying a
        vessel. Souls are composed of Chaos, a substance completely devoid of the
        concepts of space, time, and shape. Even the Cloud of Darkness, who is one
        with the Void which is a shadow of Valhalla, transcends all concepts. The
        aetherial, namely incorporeal aether i.e. souls, is unbound by light, distance,
        and dimensions), Invisibility, Non-Corporeal, Large Size (Type 11), Omnipresence,
        Acausality (Type 3 and 5) & Nonexistent Physiology (Type 2; The soul is one
        in number--both all and nothing, meaning it both exists and doesn't exist.
        It is without boundary, existing in all places, at all times), Abstract Existence
        (Type 1; Diabolos refers to Scathach's essence as primordial darkness, an
        infinite well of shadow, and shadow itself. and of course she has the physiology
        of a soul. The soul is the embodiment of one's wishes, dreams, and desires.
        The soul defines existence), Transduality (Type 2; Nothingness, i.e. Void,
        has nothing to balance with, implied to be independent Yin and Yang), Immortality,
        Type 1 (Souls are eternal, never dying, rather evolving in perpetuity), Type
        3, Type 5 (Visions are storied heroes whose dreams transcend death, and since
        visions are souls and dreams themselves, they would transcend death), Type
        9 (Souls exist everywhere, so to defeat a physical vessel of it wouldn't be
        enough to truly annihilate it; a part of it would exist in a higher plane,
        ascending constantly), Regeneration (True-Godly; Souls can regenerate indefinitely
        from their destruction. This is shown in NieR Replicant, where Nier fought
        a group of shades--which are souls--that keep on coming no matter how many
        he destroys and for how long. Rather than there being an arbitrary number
        of shades, there seems to be a certain number of them that continue to recover
        from their destruction. This regenerative property of souls is also hinted
        at in NieR Automata; Fang of the Twins is a weapon possessed by two souls,
        which gave it the unique property of instantly repairing itself whenever it's
        damaged. On top of this, voidsent can regenerate even from death to magic
        thanks to the darkness of the Void, the power of activity that prevents life
        from finding rest. They resurrect endlessly), Adaptation (Almost anyone in
        Final Fantasy XIV can adapt to magic that inflicts status effects until they're
        completely resistant. This includes Paralysis, Poison, Sleep, Slow--a Time
        Mage spell--and Silence), Summoning (Scathach has thousands of voidsent minions
        she can freely summon, including her protege, Connla), Statistics Amplification
