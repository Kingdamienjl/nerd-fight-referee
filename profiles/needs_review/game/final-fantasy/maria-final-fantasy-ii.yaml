- id: claim-weaknesses-0fc912a2
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Fire: Maria casts fire on the target.
    *Blizzard: Maria casts ice on the target. *Thunder: Maria casts lightning on the
    target. *Scourge: Maria poisons her target. *Drain: Maria saps some health from
    the victim and gains some health back. *Osmose: Maria as Drain, except it''s for
    magic instead of health. *Flare: A non-elemental spell that deals damage to the
    target by setting off a fusion reaction. *Sleep: Maria puts her target to sleep.
    *Stun: Maria paralyzes her target. *Stop: Maria freezes her target in place, preventing
    them from moving for a certain amount of time. *Confuse: Maria target goes wild
    and attacks everything they see, including themselves. *Blind: Maria casts darkness
    upon the enemy to prevent them from seeing. *Curse: Maria debuffs her target''s
    attack and defense. *Toad: Maria turns her target into a toad. *Break: Maria petrifies
    her target. *Death: Maria casts a spell that instantly kills the target. *Warp:
    Maria banishes her target into another dimension, or teleports himself away. *Berserk:
    Maria enrages her target, increasing their attack power exponentially. *Haste:
    Maria speeds time around her, making him faster than before. *Aura: Maria makes
    the target very effective against certain types of creatures. *Cure: Maria heals
    her target. *Life: Maria revives her target. *Esuna: Maria cures any status ailments
    on her target. *Barrier: Maria casts a spell on herself to make himself resistant
    to matter, fire, mind, lightning, death, poison, body, and ice magic. *Blink:
    Maria increases the evasion of the target *Protect: Maria increases the defense
    of the target. *Shell: Maria increases the magic defense of the target. *Dispel:
    Maria removes protective barriers from the target. *Mini: Maria shrinks her target
    *Silence: Maria makes the target unable to use magic by silencing them. *Fog:
    Maria inflicts amnesia on the opponent. *Slow: Maria slows time around his opponent,
    making them slower. *Swap: Maria swaps her health and magic with his target. *Fear:
    Maria makes her opponent fearful to the point that they''ll run away from battle.
    *Holy: Maria casts holy magic on the target. *Ultima: Maria casts the ultimate
    magic spell, heavily damaging all enemies. After beating the Arcane Labyrinth
    dungeon, Maria can potentially have access to either Revive or Destroy, the respective
    ultimate magics in the White and Black Magic school, respectively, but she cannot
    possess both. *Revive: Maria casts the ultimate white magic, bringing her enemies
    and allies back to full health, reviving them at the cost of all her magic power.
    *Destroy: Maria casts the ultimate black magic, bringing her enemies and allies
    destruction, eliminating all but the most powerful enemies and herself, at the
    cost of all her magic power.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
