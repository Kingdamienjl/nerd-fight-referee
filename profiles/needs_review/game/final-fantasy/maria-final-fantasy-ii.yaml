    the defense of the target. *Shell: Maria increases the magic defense of the target.
    *Dispel: Maria removes protective barriers from the target. *Mini: Maria shrinks
    her target *Silence: Maria makes the target unable to use magic by silencing them.
    *Fog: Maria inflicts amnesia on the opponent. *Slow: Maria slows time around his
    opponent, making them slower. *Swap: Maria swaps her health and magic with his
    target. *Fear: Maria makes her opponent fearful to the point that they''ll run
    away from battle. *Holy: Maria casts holy magic on the target. *Ultima: Maria
    casts the ultimate magic spell, heavily damaging all enemies. After beating the
    Arcane Labyrinth dungeon, Maria can potentially have access to either Revive or
    Destroy, the respective ultimate magics in the White and Black Magic school, respectively,
    but she cannot possess both. *Revive: Maria casts the ultimate white magic, bringing
    her enemies and allies back to full health, reviving them at the cost of all her
    magic power. *Destroy: Maria casts the ultimate black magic, bringing her enemies
    and allies destruction, eliminating all but the most powerful enemies and herself,
    at the cost of all her magic power.'
