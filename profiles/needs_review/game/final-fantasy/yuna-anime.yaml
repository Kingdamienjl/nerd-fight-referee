power_scale:
  tier:
    text: '{{4-A}}, higher with On The Level and Storm Cannon | {{2-A}}'
    source_ids:
    - vsbattles-yuna-anime-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Multi-Solar System level (Can withstand the gravitational force exerted
      by Sin's Giga Graviton, however a direct impact would instantly kill her. Stated
      by Belgemine to have surpassed her father, Lord Braska. Her Overdrive, Grand
      Summoning, is powerful enough to fully charge her Aeon's Overdrives upon being
      called. During the final battle against Yu Yevon, she along with her Guardians,
      had to defeat all of her Aeons while Yu Yevon, a superior Summoner, was possessing
      them. Without her and her Guardians being able to match the power of her Aeons,
      the party would not have been able to defeat them and Yu Yevon without the help
      of the Fayth continuously resuscitating them from unconsciousness/fatal wounds),
      higher via On The Level and Storm Cannon (On The Level and Storm Cannon multiply
      her AP by 16 and 30 times respectively) | Multiverse level+ (Is comparable to
      the other Warriors of Materia and draws power from the gods of the cycle. Participated
      in the defeat of Shinryu)
    source_ids:
    - vsbattles-yuna-anime-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: FTL+ (Capable of fighting Braska's Final Aeon) | Massively FTL+ (Can keep
