        \ nullifies all water damage for herself and her allies for one attack. NulFrost:\
        \ Yuna nullifies all ice damage for herself and her allies for one attack.\
        \ Esuna: Yuna removes all negative status effects on herself or one of her\
        \ allies. Life: Yuna revives one of her allies if they happen to die, though\
        \ they are nonetheless still significantly injured. Full-Life: Yuna revives\
        \ one of her allies at their full strength. Shell: Yuna enhances an ally's\
        \ magic defense, halving the damage of all spells directed at them. However,\
        \ there is also inclusive of any healing spells. Protect: Yuna enhances an\
        \ ally's physical defense, halving any damage they receive from physical attacks.\
        \ Reflect: Yuna creates a barrier around herself that automatically reflects\
        \ any spell back at her enemy. Dispel: Yuna removes any sort of buffs her\
        \ enemy has that would increase their power. Regen: Yuna casts a spell that\
        \ gradually heals herself or one of her allies over a period of time. Auto-Life:\
        \ Yuna casts a spell that ensures that, upon death, she will be automatically\
        \ revived. Holy: Yuna calls down a massive beam of holy-elemental energy to\
        \ blast her foes. Aeons: Dreams of the Fayth given physical form, Yuna is\
        \ capable partially summoning aeons for a specific ability via their glyph\
        \ or fully summon them to assist her in battle. The Aeons are capable of using\
        \ the abilities of Yuna due to her teachings, sans the Magus Sisters and Yojimbo.\
        \ \u25AAValefor: An aeon given form by the fayth of a young girl, Valefor\
        \ is a flying aeon, capable of launching hails of energy blasts on her opponent.\
        \ * Energy Ray: Valefor charges an energy beam and fires it from her mouth,\
        \ tracing a line on the ground before causing energy to erupt from it. * Energy\
        \ Blast: Valefor flies into the air and continuously hits the enemy with magical\
        \ blasts. * Sonic Wings: Valefor releases a blast of pressurized air at an\
        \ enemy, delaying an enemies next moves. \u25AAIfrit: An aeon given form by\
        \ the fayth of a crusader, Ifrit is an aeon of fire, capable of flame based\
        \ attacks and absorbing flame based attacks, even using them on himself to\
        \ heal. * Meteor Strike: Ifrit can use Meteor Strike to attack for moderate\
        \ non-elemental damage. Its damage is considered neither physical or magical\
