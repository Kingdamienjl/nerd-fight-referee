    than 3rd Version Ravens, who are a far superior version of the 2nd who blitzedBefore
    Crisis -Final Fantasy VII- (2004) 2nd Class SOLDIER, a Class far stronger the
    3rd Class, who could keep up with the main party members who can dodge the lasers
    of Shinra''s security Systems) | Massively FTL+ (Is strong enough to fight the
    same enemies as the Player Turk did before facing Zirconiade, a Summon far superior
    to Bahamut Fury) | Sub-Relativistic+ (After the decay of his abilities, following
    the end of the golden era of the Turks, Reno''s speed is not the same as before.
    He''s still fast enough to keep up with the party who are on the level of Vincent
    Valentine, whom also could easily defeat 3rd Version Ravens and far stronger when
    they could dodge lasers in Midgar) | Massively FTL+ (Regained his speed and became
    stronger than ever before. Could keep up with the party on two ocassions after
    they had gained control of Summons like Bahamut ZERO and Red XIII could perform
    his Stardust Ray Limit Break) | Massively FTL+ (Though they were toying with him,
    Reno managed to keep up and surprise a bit the Yazoo and Loz, who should be comparable
    to Kadaj, the Remnant of Sephiroth who is statedFinal Fantasy VII: Advent Children
    -Reunion Files- (2006) to be as strong as Sephiroth was in the original game,
    which also makes Kadaj superior to the Knights of the Round)'
  source_ids: *id003
  decisive: true
