  axis: other
  text: Class M (Physically superior to 3rd Version Ravens, who are far above 2nd
    Class SOLDIER members, who compare to Zack in his earlier days, when he defeated
    Ifrit putting him on the level of Titan) | Stellar (Comparable to the Player Turk,
    shortly before they faced Zirconiade, a Summon far superior to Typhon) | Class
    M (Though his abilities have decayed enormously, he can still fight the party,
    who commands Titan and Summons above him) | Stellar (Regained his lost strength
    and became even stronger than before) | Stellar (Far stronger than before. Could
    hold his own against the Remnants of Sephiroth for a while, though he was clearly
