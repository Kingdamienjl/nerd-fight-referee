- id: claim-durability-5dcae1ad
  section: power_scale
  axis: durability
  text: At least Multi-Continent level, likely higher (Could fight 3rd Version Ravens,
    who are far stronger than 2nd Class SOLDIER, whom compare to Zack in his earlier
    days who defeated Ifrit putting him also on the level of Shiva) | Multi-Solar
    System level (Can take the attacks of enemies like the Mighty Grunts, who could
    defeatBefore Crisis -Final Fantasy VII- (2004) the endgame Player Turk with number
    advantage, who is comparable to Zirconiade and far above Bahamut ZERO and Bahamut
    Fury) | At least Multi-Continent level, likely higher (Could take the party's
    attacks, who were already comparable to Vincent and could simply walk away from
    the battle) | Multi-Solar System level (Regained his old strength and became even
    stronger. Could fight the party on two ocassions, alongside his partners, and
    come out not worse for wear, when they had become strong enough to take down Weapons),
    likely Multiverse level+ (Cloud had fought alongside Balthier in Ramza's army,
    whom had defeated Gilgamesh, and displayed a similar destructive power) | Multi-Galaxy
    level (Could take repeated beatings from the Remnants of Sephiroth, who compare
    to Kadaj who was as strong as Sephiroth was in the original game, being above
