      confidence: 0.75
    - field: standard_equipment
      value: 'Standard Turk''s Cellphone Model as seen in Before Crisis, Metal Baton:
        Reno''s weapon of choice, a short retractable metal staff provided by the
        company, also strapped to his wrist, he is always seen carrying around, playing
        with and leaning it on his shoulder. In battle Reno uses it in two different
        ways: in quick strikes that he mixes up with kicks and punches to perform
        combos, as raw energy or electricity, to perform his special moves., Cell
        Phone: Reno, like all Shinra personnel, carries a mobile phone to contact
        his colleagues or his teammates during missions and plan properly his next
        course of action., Shinra Military Helicopter: The Shinra company provides
        the necessary vehicles to SOLDIER and the Turks for their missions. The Turks
        in particular are commonly seen piloting helicopters when they need a means
        of transport. These come equipped with a gatling machine gun on the front
        and napalm missiles at the sides., Makeshift Time Bomb (Optional Equipment):
        A surprisingly powerful bomb made by Reno''s lifelong partner, himself which
        has a timer that upon reaching 0 explodes in a large blast followed by flashy
        fireworks. It must be noted that Reno and Rude, despite surviving, were also
        knocked out by the blast and each of them have only 1 copy of the bomb each.'
      source_id: vsbattles-reno-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. As a trained Turk, Reno is skilled in a variety of fields
        like combat, espionage, information gathering, the use of many kinds of weapons
        and vehicles, as well as planning and coordination with his teammates. Having
        been nominated as the second in command after Tseng (and the number 3 while
        Veld was still part of the department), all of which speaks of how efficient
        and accomplished Reno is in the eyes of his comrades and the trust that he
        has earned within Shinra in his many years of service in all sort of missions.
      source_id: vsbattles-reno-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Reno's lackadaisical approach to his work and occasional capricious decisions
        lead to complicating his missions unnecesarily. Examples of this are his refusal
        to fight Cloud and the party in Wutai because he was on vacation or allowing
        Kadaj to run free in the Knowlespole because shooting him would endanger Evan,
        if one can play the correct buttons regarding the Shinra Company, such as
        its reputation or well-being, Reno can be easily tricked or forced into a
        desired situation.
      source_id: vsbattles-reno-final-fantasy-vii
      provider_id: vsbattles
      authority: high
      confidence: 0.75
