  section: power_scale
  axis: range
  text: Extended Melee Range with the Baton; Tens of Meters with special abilities
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-standard-equipment-16defdab
  section: equipment
  axis: equipment
  text: 'Reno3.jpg|Reno typical pose with his staff Shinra Helicopter.png|The Shinra
    Military Helicopter Rude Bomb.png|Reno and Rude holding the Makeshift Bombs BCTurkPhone.jpg|Standard
    Turk''s Cellphone Model as seen in Before Crisis *Metal Baton: Reno''s weapon
    of choice; a short retractable metal staff provided by the company, also strapped
    to his wrist, he is always seen carrying around, playing with and leaning it on
    his shoulder. In battle Reno uses it in two different ways: in quick strikes that
    he mixes up with kicks and punches to perform combos, and channeling his Spirit
    Energy through it, as raw energy or electricity, to perform his special moves.
    *Cell Phone: Reno, like all Shinra personnel, carries a mobile phone to contact
    his colleagues or his teammates during missions and plan properly his next course
    of action. *Shinra Military Helicopter: The Shinra company provides the necessary
    vehicles to SOLDIER and the Turks for their missions. The Turks in particular
    are commonly seen piloting helicopters when they need a means of transport. These
    come equipped with a gatling machine gun on the front and napalm missiles at the
    sides. *Makeshift Time Bomb (Optional Equipment): A surprisingly powerful bomb
    made by Reno''s lifelong partner, Rude, himself which has a timer that upon reaching
    0 explodes in a large blast followed by flashy fireworks. It must be noted that
    Reno and Rude, despite surviving, were also knocked out by the blast and each
    of them have only 1 copy of the bomb each.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-8098b752
  section: power_scale
  axis: battle_iq
  text: Above Average. As a trained Turk, Reno is skilled in a variety of fields like
    combat, espionage, information gathering, the use of many kinds of weapons and
    vehicles, as well as planning and coordination with his teammates. Having been
    nominated as the second in command after Tseng (and the number 3 while Veld was
    still part of the department), all of which speaks of how efficient and accomplished
    Reno is in the eyes of his comrades and the trust that he has earned within Shinra
    in his many years of service in all sort of missions.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-029a612f
  section: weaknesses
  axis: weakness
  text: Despite his skill and loyalties to the Shinra Company, Reno's lackadaisical
    approach to his work and occasional capricious decisions lead to complicating
    his missions unnecesarily. Examples of this are his refusal to fight Cloud and
    the party in Wutai because he was on vacation or allowing Kadaj to run free in
    the Knowlespole because shooting him would endanger Evan, whom he had grown fond
    of. As Evan also confirmed, if one can play the correct buttons regarding the
    Shinra Company, such as its reputation or well-being, Reno can be easily tricked
    or forced into a desired situation.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b0931855
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Acrobatics (Hypermobility. Can perform
    dexterous movements, flips and big jumps in the middle of combat) * Martial Arts
    (All Turks receive proper training in hand-to-hand combat. Reno specializes in
    this area, mixing punches and kicks with his use of the steel baton) * Weapon
    Mastery (Is an expert using the steel baton provided by the company, as his weapon
    of choice, being able to keep up with many other types of weapons, ranging such
    as swords, guns, spears, etc. Reno is also trained in the use of firearms) * Vehicular
    Mastery (Reno displays great skill at piloting helicopters, being capable of flying
    oneFinal Fantasy VII: Advent Children (2005) backwards, inside a tunnel, at high-speeds.
    These are equipped with machine guns and napalm bombsCrisis Core -Final Fantasy
    VII-: Reunion (2022)) * Stealth Mastery (All Turks are trained in infiltration
    and espionage. Though their capability depends on the specific individual, Reno
    at least is capable of following undetectedBefore Crisis -Final Fantasy VII- (2004)
    Rude, another Turk, and Avalanche membersBefore Crisis -Final Fantasy VII- (2004),
    who are also trained warriors) * Spirit Energy Manipulation (Can control his Spirit
    Energy to perform special techniques) * Non-Physical Interaction (Spirit Energy
    allows to interact with incorporeal beings such as Summons, which trascend physical
    matterCrisis Core -Final Fantasy VII-: The Complete Guide (2007) entirely or the
    Remnants of Sephiroth, who are made out ofFinal Fantasy VII: On the Way to a Smile
    - Lifestream Black (2009) Negative Lifestream) * Electricity Manipulation (Can
    casts lightning jolts on his enemies) * Absorption (Can absorb electrical attacks
    as health) * Light Manipulation (Via Turks Light) * Sealing (Via Pyramid) * Madness
    Manipulation (Type 2; Neo Turks Light inflicts Confusion) * Explosion Manipulation
    (With Rude''s makeshift bomb and the Shinra Military Helicopter''s missiles) Resistance
    to: * Fear Manipulation (Is unaffected by Kadaj''s presence which is comparedFinal
    Fantasy VII - The Kids Are Alright: A Turks Side Story (2017) to when death draws
    near) * Death Manipulation (Resists Doom and Death) * Sleep Manipulation (Resists
    Sleep) * Madness Manipulation (Type 2; Resists Confusion and Berserk) * Sense
    Manipulation (Resists Silence) * Time Stop (Resists Stop) * Transmutation (Resists
    Frog) * Size Manipulation (Resists Small) * Petrification (Resists Petrify) *
    Paralysis Inducement (Resists Paralyze) * Body Puppetry (Resists Manipulate) *
    Gravity Manipulation (Takes no damage from gravity based abilities) * Absolute
    Zero (Can withstand Shiva''s Diamond Dust, whose coldFinal Fantasy Explorers.
    Japanese Website Summon profiles (2014) reaches these temperatures) * Matter Manipulation
    and Radiation Manipulation (Can endure the Flare spell and the Bahamut Strain''s
    more powerful variants, such as Megaflare, which are consistently described as
    a nuclear explosions)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
