        massive energy and cells without proper training will experience brain stimulation
        that causes an abnormal spike in their neurotransmitter levels as well as
        transmission rate. As a result, a person''s basic human nature and desires
        emerge. Depending on their personality, the impulse may be strong enough to
        destroy their body. Furthermore, the toll of this energy and cells has been
