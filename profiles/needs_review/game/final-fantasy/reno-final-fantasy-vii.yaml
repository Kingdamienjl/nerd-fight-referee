        company, as his weapon of choice, being able to keep up with many other types
        of weapons, ranging such as swords, guns, spears, etc. Reno is also trained
        in the use of firearms), Vehicular Mastery (Reno displays great skill at piloting
        helicopters, being capable of flying oneFinal Fantasy VII: Advent Children
        (2005) backwards, inside a tunnel, at high-speeds. These are equipped with
        machine guns and napalm bombsCrisis Core -Final Fantasy VII-: Reunion (2022)),
