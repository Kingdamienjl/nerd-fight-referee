    - field: intelligence
      value: Kuja is an incredibly skilled magician, casually wielding powerful spells
        like Flare Star and Holy as well as the ultimate magic, Ultima. Created as
        the Angel of Death, Kuja has no conscience, and is thus incredibly wicked,
        ruthless, and calculating, single-handedly instigating a war to wipe out life
        on Gaia as Garland intended, enslaving the mighty Bahamut with the airship
        Invincible and using it to wipe out Alexandria, only failing due to the intervention
        of the country's patron Eidolon, Alexander, which too was destroyed in the
        end. However, for all his power and brilliance, Kuja is also narcissistic,
        proud, and childish, having never experienced a childhood to develop his emotional
        maturity. As a result, he panics when things go wrong and refuses to improve
        himself since he feels that he has done nothing wrong.
      source_id: vsbattles-kuja-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Arrogant and often takes his opponents lightly, Vain and narcissistic
        and incredibly childish, He''s sensitive about his mortality and is a somewhat
        of a nihilist upon discovering his origin, believing that the world should
        not go on without him, impacting his sanity. Notable Attacks/Techniques: *Trance:
        Upon experiencing a powerful surge of emotions, Kuja achieved the Trance state
        at the end of the game, drastically increasing his already great magical prowess,
        allowing him to lay waste to all of Terra with ease. *Curaga: Heals the caster''s
        wounds instantly upon usage. *Flare: Unleashes a powerful non-elemental explosion
        to deal massive damage. **Flare Star: A stronger version of Flare. *Holy:
        Unleashes a powerful Holy-elemental explosion. *Reflect: Creates a magical
        barrier that can block and reflect magic based attacks back at the original
        caster. *Teleportation: Used on the party at the end of the game with the
        last of his power. The power teleported them out of Memoria/The Hill of Despair''s
        dimension and back on to Gaia thousands of kilometers from where Memoria once
        was. *Thundaga: Unleashes a powerful bolt of electricity, dealing heavy lightning-elemental
        damage. *Ultima: The most powerful expression of offensive magic in the game.
        Unleashes numerous powerful energy blasts that can cover planetary ranges.
        Kuja used this attack upon achieving Trance to destroy Terra. *Final Requiem:
        His EX Burst in Dissidia, Kuja sends his opponent flying before "conducting"
        a series of explosions similar to the Flare spell before engulfing his foe
        in the light of Ultima. ==Notable Matchups== Victories: Losses: Inconclusive:
