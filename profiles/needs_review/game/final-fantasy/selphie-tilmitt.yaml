  section: equipment
  axis: equipment
  text: Her Nunchuku 'Strange Vision'. This weapon has the highest possible accuracy
    stat in the game of 255, making it very unlikely for her enemies to be able to
    dodge her strikes. Various restorative items to remove status effects and heal
    herself and resurrect her allies. Can create a potion called 'Holy War' that makes
    her and her party invulnerable to physical, magic and status effects (including
    beneficial ones) for a short time
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
