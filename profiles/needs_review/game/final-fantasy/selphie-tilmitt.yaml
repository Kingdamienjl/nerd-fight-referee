        spells to use. Selphie must be hard-pressed to use her Limit Break unless
        she has buffed herself with Aura. Her strongest ability "The End" has a little
        chance of appearing as her 'Slot's' limit break (roughly 11.2% chance at best
        and at worst 1/256) she can attempt to get around this weakness by preparing
        with Holy Wars and buffs like Protect, Reflect and Shell until it appears.
        Changing her resistances or Junctioning an ability to her strikes locks it
