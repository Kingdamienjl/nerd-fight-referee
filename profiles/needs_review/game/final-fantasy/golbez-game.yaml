    - field: intelligence
      value: Genius (A powerful thaumaturge, Golbez is the wielder of some of the
        most powerful spells in the game, including all of the highest-tier elemental
        spells along with the mighty Meteor. He is cold, manipulative, and pragmatic,
        turning Kain against Cecil and Rosa through mind control, but is also a charismatic
        leader to those close to him, as the Four Archiends hold him in the utmost
        esteem and Ceodore respects him after his reformation. His abilities are further
        expounded upon in Dissidia, which reveals his ability to summon the CPU and
        its nodes at will to assist him in a variety of attacks, also proving himself
        to be capable in close combat, batting away foes with swift backhands and
        knocking them into his magical attacks for maximum damage)
      source_id: vsbattles-golbez-game-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'He has recurring nightmares from the atrocities he''s committed in the
        past and is thus emotionally vulnerable. His Shadow Dragon is vulnerable to
        Holy-elemental attacks. Lunarians like Golbez seem strangely vulnerable to
        the Meteor spell and its derivatives. Notable Attacks/Techniques: ===Magic===
        *Blizzard/Blizzara/Blizzaga: Conjures a mighty blizzard to deal heavy ice-elemental
        damage. *Bio: Golbez poisons the target with an infectious virus, damaging
        them over time. *Drain: Drains the life force of a target, restoring Golbez''s
        vitality at the cost of his opponent''s. *Fire/Fira/Firaga: Creates a massive
        fireball to deal heavy fire-elemental damage. *Flare: Golbez sets off a spontaneous
        chain fusion reaction to obliterate targets with a massive non-elemental explosion.
        *Meteor: Golbez assails his foes with a barrage of massive meteorites to deal
        massive non-elemental damage. **Twin Meteor: Golbez casts Meteor twice in
        an instant to double the intensity, power, and effective range of the spell
        for an even more devastating attack. *Osmose: Drains magical energy from the
        target, restoring Golbez''s reserves while lowering his opponent''s. *Drain:
        Drains life energy from the target, restoring Golbez''s reserves while lowering
        his opponent''s. *Quake: Golbez triggers a massive earthquake with a thought
        to deal heavy earth-elemental damage. *Thunder/Thundara/Thundaga: Generates
        an intense lightning storm to deal heavy lightning-elemental damage. ===Other
        Attacks=== *Barrier Shift: Golbez renders himself weak to a single element
        of his choice while rendering himself immune to any other elemental attack
        and absorbs the energy from those attacks to replenish his stamina and heal
        his wounds. He can repeatedly change his elemental weakness to suit the situation.
        *Black Fang: Summons the Shadow Dragon to instantly incapacitate or kill foes
        with its powerful breath attack. *Cosmic Ray: Fires beams of electricity to
        paralyze the target and send them flying, dealing heavy damage. He can also
        delay his casting of this attack to take enemies by surprise by teleporting
        directly to them. *Genesis Rock: Summons four rocks to circle Goblez at high
        speeds, buffeting all nearby foes before sending the rocks outwards as powerful,
        high-speed projectiles. Those caught at the beginning of the attack will be
        drawn towards Golbez, rendering them unable to dodge the final strike. *Nightglow:
        Conjures a circle of black lightning to trap the target and launch them upwards
        as Golbez moves his hands downwards, leaving them open to additional melee
        attacks should he be close enough to follow up on this attack. *Pressure:
        Golbez instantly paralyzes his opponent, rendering them completely unable
        to fight back. *Sector Ray: Summons the CPUs attack nodes to track a target
        and fire lasers at them. *Twin Moon: His EX Burst in Dissidia, Golbez crushes
        the opponent between several rocks, trapping them as he summons the Shadow
        Dragon to freeze the opponent solid with Binding Cold, finishing with a devastating
        Twin Meteor attack to annihilate the target. ==Notable Matchups== Victories:
        Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
