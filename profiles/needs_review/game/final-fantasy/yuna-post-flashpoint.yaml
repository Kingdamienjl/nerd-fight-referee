  intelligence:
    text: 'Extraordinary Genius (The Worker has lived for billions of years, building
      and destroying civilizations as he pleases. He is an intelligent strategist
      and tactician as well as a master duelist, being capable of casually outmatching
      Raidriar who is described to be one of the most skilled swordsmen among the
      Deathless who have lived for numerous millennia honing their skill.Infinity
      Blade: Awakening, Chapter 4 He has lived for so long that he is able to separate
      people into specific personality patterns after a few moments with them before
      predicting what they are thinking, what they are about to do, and deduce actions
      they''ve taken in the past despite not having nor being able to gain knowledge
      of those actions through other means beforehand, the accuracy at which he can
      do this borders on retrocognition, clairvoyance, and precognition. He is also
      responsible for creating most, if not all, of the technology seen in the series
      which includes: devices that can alter the QIP of individuals to grant them
      immortality, rings capable of teleporting nonliving matter across astronomical
      distances, manipulating elements or accelerating healing, technology capable
      of giving life to the soulless cloned bodies of a Deathless while retaining
      the memories of the original and altering biology on a genetic level to create
      enhanced bodies or QIP mutants that mesh traits of multiple animals together
      so he is a highly advanced technological and biological engineer, even viewing
      the technology used to turn Jori into a Deathless as being primitiveInfinity
      Blade: Redemption, Deviation Chapter 9)'
    source_ids:
    - mediawiki-yuna-post-flashpoint
    confidence: 0.6
    notes: auto_repair source extraction
