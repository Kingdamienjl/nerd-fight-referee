        is a doubtlessly skilled warrior, having appeared as a fearsome opponent in
        many games throughout the series and wielding multiple weapons at once with
        great proficiency. He has survived countless battles and honed his skills
        with the many melee weapons he's acquired over an immeasurable amount of time.
        Although he is sometimes easily fooled (as shown by the many forgeries he
        wields over the course of his adventures, including the infamously weak Excalipoor),
        he remains a capable combatant who can threaten even the mightiest warriors
