  attack_potency:
    text: Low Multiverse level (Proved a match for Bartz and the party on more than
      one occasion, including Galuf), Higher with more arms (Matched the Endgame party
      in his eight-armed form, and dealt severe damage to Necrophobe, though he ultimately
      had to self-destruct in order to kill him) | Multiverse level+ (Participated
      in the Dissidia Conflicts. Wields a weapon created from Chaos' nail) | Low Multiverse
      level (Fought on par with the Warrior of Light) | Multiverse level+ (Matched
      the Warrior of Light in their rematch, after the former had grown far stronger)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Capable of keeping pace with numerous beings who's shown
      speed feats on these levels) | Massively FTL+ (Comparable to the Warrior of
      Light and other members of Dissidia) | Massively FTL+ (Should be as fast as
      before) | Massively FTL+ (Kept pace with the Warrior of Light)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Superhuman | Immeasurable (Superior to Neo Exdeath and Enuo)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Low Multiverse level, Higher with more arms | Multiverse level+ | Low Multiverse
      level | Multiverse level+
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Low Multiverse level, Higher with more arms (Withstood a sustained barrage
      from Necrophobe while speaking to the party and not even fighting back. Should
      be comparable to Squall in this respect) | Multiverse level+ (Participated in
      the Dissidia Conflicts and survived hits from a Cosmos-empowered Bartz) | Low
      Multiverse level (Fought on par with the Warrior of Light) | Multiverse level+
      (Survived a continuous barrage of attacks from the Warrior of Light during their
      rematch in Stormblood)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range with weapons. Multiverse level+ with magic (Magic as
      a whole is shown to affect omnipresent beings such as Exdeath when he's become
      one with the Void itself, which spans across the entire Final Fantasy Multiverse,
      can even banish foes into the Void with the Warp ability)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Although he is stubborn, fool-hardy, and headstrong to a fault, Gilgamesh
      is a doubtlessly skilled warrior, having appeared as a fearsome opponent in
      many games throughout the series and wielding multiple weapons at once with
      great proficiency. He has survived countless battles and honed his skills with
      the many melee weapons he's acquired over an immeasurable amount of time. Although
      he is sometimes easily fooled (as shown by the many forgeries he wields over
      the course of his adventures, including the infamously weak Excalipoor), he
      remains a capable combatant who can threaten even the mightiest warriors with
      these poorly made imitations, further serving as a testament to his skill in
      battle.
    source_ids: *id002
    confidence: 0.8
