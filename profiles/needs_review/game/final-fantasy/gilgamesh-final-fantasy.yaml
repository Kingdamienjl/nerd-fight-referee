    can possess others), Blessed (Has a Crystal with him, granting him the powers
    of the crystals as a result), Regeneration (Mid-Godly; he is an Esper and has
    reformed his body after all of magic was erased from existence upon Kefka''s death),
    Shapeshifting (Espers are stated to take many shapes), Acausality (Type 2 and
    4; scales from the Demons; who can walk down the devil''s path naturally, where
    the concept of time doesn''t exist, and the past, present and future are merged
    as one in this realm) Breaking the Fourth Wall (Is clearly aware of his nature
    as a video game character and complains about being stuck in digital limbo when
    the player has not bought his DLC), Master Swordsman, Skilled Hand-to-Hand Combatant,
    Magic, Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29
