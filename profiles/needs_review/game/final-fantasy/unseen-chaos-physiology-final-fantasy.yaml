claims:
- id: claim-weaknesses-5d86d87d
  section: weaknesses
  axis: weakness
  text: '[https://imgur.com/a/ltrBGZz Every time someone uses the "Eyes of Etro",
    their lifespan greatly shortens]. [https://youtu.be/KRWZ4_fJCEE?t=869 Lost and
    Fragmented Hearts can cause one to lose their sense of emotion with no recollection
    beyond the memories of them]. |-|Souls/Phantomas= center|500px|Lightning Returns:
    Final Fantasy XIII (2013). The Savior absorbing the Souls of incapacitated soldiers|thumb
    Same as Hearts with the addition of: *Unconventional Immortality (Types 1, 4,
    5, 6, 8 & 9; [https://youtu.be/IpWv-UQMNQw?t=14573 When a human dies, their soul
    turns into crystal energy and returns to the unseen realm], passing through Etro''s
    Gate to [https://youtu.be/IpWv-UQMNQw?t=16236 be reborn anew]. The Unseen Realm
    lies beyond even Valhalla. This is stated by [https://imgur.com/a/yiscnzq WOG
    to exist on a different plane of reality], where the [https://imgur.com/2JFB6vW
    entire Cosmology can be seen], with all timelines and dimensions (4-D) being referred
    to as the [https://imgur.com/HZAz7UQ "Lowerworld"] in nature. [https://imgur.com/a/hxe9Hxj
    The soul is also eternal] and [https://imgur.com/a/mFkemqt can exist as long as
    people in the living remember them], even going as far as to use other bodies
    to house their souls such as Lumina being the vessel for Sarah''s soul, and [https://youtu.be/OWcfLyA_1Os?si=mkBrzZzWccR8Jq4d&t=18499
    Rem and Machina are also able to pass on their phantoma to various members of
    Class Zero]. [https://youtu.be/IpWv-UQMNQw?t=14604 It''s stated that whatever
    Chaos infects loses its life, death, and time].) *Acausality (Types 1, 2, & 4),
    Resistance to: Probability, Causality, Fate & Law Manipulation (Chaos originates
    from The Unseen Realm, which along with the Visible World, Valhalla and Etro''s
    Gate [https://imgur.com/a/iIBdzFS operate on different Concepts of Space-Time
    and Form] ranging from it being Non-Existent to it being ambiguous. It''s also
    an energy source that resides within all humans'' Hearts and Souls, [https://imgur.com/09LATP0
    which can defy the laws of the physical world]. This also extends to the Void
    Beyond which includes the realm of [https://imgur.com/s2cqXi1 Serendipity, a place
    locked in an "Eternal Now", where the past and future do not exist, only the present].
    A "Paradox" is created by [https://imgur.com/a/GJVeK9B having the past and future
    overlap with one another, creating a new present]. Due to this, living beings
    have shown to be capable of preforming extraordinary feats such as Sazh [https://youtu.be/zfclTRVdsYE?si=t4oSVkyDtrMnwloB&t=267
    being able to change the outcome of a coin flip that represented Life and Death,
    into a new possibility of reuniting with his lost pet Chocobo], which was actively
    described as [https://youtu.be/zfclTRVdsYE?si=U7lGp3myjJ4PXok1&t=420 changing
    the rules of Space-Time, and conforming the world to his will]. Another example
    would be Snow Villiers [https://www.youtube.com/watch?v=zgdgW9QvQa0 who continued
    to exist] [https://youtu.be/IpWv-UQMNQw?t=8370 despite being tied to a past that
    was erased from existence]. When either the past or future is re-written, [https://imgur.com/a/paradoxes-pt-2-GJVeK9B
    the other side will be altered to maintain the logic of the timeline]. Lastly
    there is Serah Farron, a woman who despite being branded a L''Cie and not completing
    her focus, was able to turn to crystal of her own free will. Without the influence
    of the Fal''Cie.) *Regeneration (Low-Godly; No longer under Bhunivelze''s control.
    [https://youtu.be/w0xVp1-zII8?si=l8KEUkekWl9nAE1w&t=3084 Various characters were
    able to reform their bodies from their souls in a matter of seconds], the Soul
    is [https://imgur.com/a/dA9N45P confirmed to be the "idea" of fundamental existence]
    that definiens all of existence and makes the worlds'' complete.) *Reactive Evolution,
    Invulnerability Negation & Resistance Negation: [https://youtu.be/OWcfLyA_1Os?si=kO0nxzDJAUUa3-ED&t=18507
    Members of Class Zero who were bestowed with both Rem and Machina''s phantoma,
    which allowed them to come back from death in spite of having their own Phantoma''s
    destroyed.] In this state, this allowed them to damage and kill Cid when Class
    Zero''s power magic proved ineffective against him before. The Savior was also
    able to [https://www.youtube.com/watch?t=3149&v=w0xVp1-zII8&feature=youtu.be draw
    upon and collect the power of everyone''s souls into herself, to unleash for an
    attack which incapacitated Bhunivelze]. Despite his make up as a Fal''Cie [Top
    Tier], where The Crystals don''t affect him.) *Energy Manipulation (Elemental
    Manipulation, Matter Manipulation, Extreme Heat, Healing & White Holes; Via [https://imgur.com/a/phantoma-tVhYmKg
    Peral, Rouge, Moon, Cinnabar], [https://youtu.be/tCptC2eOMeE?si=fVcislaPSRg7ruZH&t=340
    Cerise, Smalt, Jasmine, and Ivy Phantoma].) *Paraconsistent Physiology (Type 1:
    Everything & Nothing; Existence & Nonexistence, Possibilities & Impossibilities,
    Strength & Frailty, Life & Death, Light & Darkness, Dream & Reality; Resistance
    to the abilities of C'
