    - field: weaknesses
      value: 'His lack of authority and incredibly high ego feed his irresponsibility,
        Fire Cross: The first stage of Seifer''s limit break where he starts by casting
        a fire spell (single/multiple enemies, depending on the skill) and then attacking
        the stunned foe with a sword technique. Though Final Fantasy VIII''s in-game
        information confirms he does not use real magic, but chi-based attacks., No
        Mercy: Seifer casts a fire spell to all enemies, spins his gunblade around
        and starts focusing power into it, in an upward slash-motion, launches circular
        blades of energy at his foe. The blasts fly through the enemies and continue
        towards the sky, dealing exploding damage on the opponents., Demon Slice:
        Seifer starts his skill by casting a fire spell on one enemy, takes on a stance
        and starts spinning, forming a whirlwind around himself. His gunblade works
        like a circular saw''s blade as he twirls with a distinctive speed. He approaches
        the enemy as a tempest, slicing the target multiple times, finally lifting
        his enemy in the air and delivering a blow that sends the foe head-first down
        to the ground., Bloodfest: Seifer attacks all of his enemies with fire spells,
        jumps high in the air and swings his gunblade twice, vertically and horizontally,
        forming a fiery cross on the ground beneath his adversaries'' feet. The cross
        explodes, a hole opens up in the field, and the enemies fall into it. They
        keep falling through an underworld-like space before suddenly falling back
        to the ground, heavily damaged.'
