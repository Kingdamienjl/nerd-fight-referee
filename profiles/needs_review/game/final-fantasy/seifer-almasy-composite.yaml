        Manipulation (Via Gunblade trigger), limited Reactive Evolution (Junctioning
        can increase his resistances/change the aspect of his attacks based on what
        his opponent uses), Healing, Power Nullification (Via Dispel), Time Manipulation
        (Via Haste), limited Sealing (Can draw out and Seal enemy summons, gaining
        their power for himself), Statistics Amplification (Via Junctioning magic
