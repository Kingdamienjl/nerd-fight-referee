    - field: weaknesses
      value: 'Both Garland and Chaos are rather overconfident Notable Attacks/Techniques:
        ===Garland:=== *Blaze: Garland splits his sword in two, swinging the two blades
        to release a flurry of fire projectiles that home in on foes. *Cyclone: Garland
        swings his sword to create two enormous tornadoes that follow foes and reflect
        incoming attacks and projectiles. *Earthquake: Garland configures his sword
        into his axe form and slams it into the ground, causing a localized earthquake
        which shifts and fragments the surrounding area into jagged spikes that can
        impale enemies. *Flare: Garland charges his blade with ultimate Black Mage
        spell before rushing at his opponent with a powerful swing that he quickly
        follows up with another attack to send his foe flying. *Tsunami: Garland throws
        his sword at the floor in its whip form, allowing it to snake towards the
        opponent and release explosive plumes of water in its wake. *Soul of Chaos:
        His EX Burst in Dissidia, in which he repeatedly attacks his foe with every
        one of his sword''s special forms in rapid succession, slashing his opponent
        with twin swords, flogging them several times with the chain whip, stabbing
        them several times with the spear, and smashing them with the axe before spinning
        to finish the target with two powerful sword blows. ===Chaos:=== *Blizzara:
        Chaos starts a blizzard in an attempt to damage and freeze them with biting
        winds and jagged hail. *Curaja: Chaos closes his wounds with healing light
        and restores his stamina. *Firaga: Chaos conjures an enormous fireball that
        converts itself into a rain of flaming projectiles to scorch his foes. *Flare:
        Chaos causes a spontaneous fusion reaction to obliterate foes with the light
        and heat released by it, dealing non-elemental damage. *Haste: Chaos speeds
        up time around himself, increasing his effective movement and combat speed.
        *Slowra: Chaos slows down time around one target, reducing their effective
        movement and combat speed. *Thundaga: Chaos causes a series of powerful lightning
        bolts to rain from the sky and electrocute his foes. Note:Not to be confused
        with the similarly named character from Final Fantasy IX. ==Notable Matchups==
