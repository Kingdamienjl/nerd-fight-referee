    - field: tier
      value: '9-A, higher Environmental Destruction Name: Only known as Inque, with
        no other name ever being provided Origin: The DC Animated Universe Gender:
        Female Age: Seemingly at least in her thirties considering her daughter appears
        to be in her twenties (albeit she mentioned she was younger than Deanna when
        she had her), though her pliable nature makes her possibly Immortal Classification:
        Mutated Human'
      source_id: character-stats-profiles-auron-modern
      provider_id: character_stats_profiles
      authority: high
