    - field: powers_and_abilities
      value: '* Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) * Enhanced Senses (Her unique physiology allows
        her to magnify her vision beyond normal human levels) * Superhuman Athleticism
        (Can leap inhuman distances into the air and across great distances) * Elasticity
        (Inque can stretch all parts of her body great distances, and squish into
        a puddle or an even smaller mass to go through small gaps) * Shapeshifting
        (Inque''s physiology allows her to change her shape into all manner of things,
        such as pretending to be a shadow or 2-dimensional art, a piece of modern
        art, a spider-like monster, a seal, and even a convincing facisimile of Batman
        II - even her "human" form is just her shifting her body to resemble a normal
        person) * Size Manipulation (Can shrink to become miniscule and nearly two-dimensional)
        - this enables her to have Small Size should she choose to. * Regeneration
        (Mid-High: Can pull herself back together when her body is dispersed into
        many different pieces, and at her greatest potency could reconstitute herself
        and continue living after being dissolved by a solvent) * Stealth Mastery
