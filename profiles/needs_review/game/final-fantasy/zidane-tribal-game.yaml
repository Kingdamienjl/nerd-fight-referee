        \ Steal: His \u201CSteal\u201D ability allows him to steal items from an enemy.\
        \ The command can be augmented with his other skills such as Flee Gil, Steal\
        \ Gil, Master Thief, Mug, and Bandit. Base \"Skill\": * Flee: Instantly escape\
        \ from the battle at the cost of 10% of the Gil the party would have won from\
        \ it. * Detect: Shows what items the enemy has to Steal, listed from the rarest\
        \ to the most common. * What's That!?: Causes enemies to turn around, resetting\
        \ their ATB bars and allowing the characters to perform a back attack on them.\
        \ * Soul Blade: Inflicts a status ailment on an opponent. The status ailment\
        \ inflicted is the same as whatever status Zidane's current weapon carries.\
        \ 99% accuracy with thief swords, but always misses with daggers. * Annoy:\
        \ Inflict Trouble on an enemy. 50% accuracy. * Sacrifice: Zidane reduces his\
        \ HP and MP to 0 and fully restores the other party members HP and MP. * Lucky\
        \ Seven: If Zidane's current HP ends in 7, it randomly inflicts 7, 77, 777\
        \ or 7777 damage to a single enemy. * Thievery: Inflicts damage to a single\
        \ enemy. Zidane's Thievery skill is directly linked to the number of successful\
        \ steals performed times half of his speed; the player can power it up to\
        \ deal 9,999 damage with enough theft. Steals done by Blank, Marcus, and Cinna\
        \ count. Trance \u201CDyne\u201D: * Free Energy: Five explosive physical attacks\
        \ are inflicted on the target, though without Zidane moving. Each explosion\
        \ is a different symbol, inflicting 50% more damage than a regular attack.\
        \ * Tidal Flame: All enemies are struck by a wave of fire, inflicting heavy\
        \ damage, which is 50% stronger than Zidane\u2019s regular attacks. * Scoop\
        \ Art: Purple beams of energy strike one target. The attack has twice the\
        \ damage output of a regular one. * Shift Break: A swirling vortex forms beneath\
        \ all enemies, dealing damage equal to twice that of Zidane's physical attacks.\
        \ * Stellar Circle 5: A tornado of energy forms, dealing 2.5 times the damage\
        \ of a normal attack. * Meo Twister: All enemies are struck from above by\
        \ multiple blasts of energy, dealing 2.5 times the damage of Zidane's normal\
        \ attacks. * Solution 9: A mass of red runic symbols fly past one enemy, causing\
