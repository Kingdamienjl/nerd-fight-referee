        swords and daggers, as well as magic. He also dueled Gaia and Terra's most
        powerful, including Kuja, who overpowered and enslaved Bahamut, and Garland,
        who attempted to free Terra from its position within Gaia. In addition, he's
        a master of slaying a variety of targets, gaining bonuses went put against
        humans, undead, devils, beasts, bugs, golems, and birds. His prowess as a
        thief also makes him an expert at sabotage, stealth, and other profession-related
        skills.
