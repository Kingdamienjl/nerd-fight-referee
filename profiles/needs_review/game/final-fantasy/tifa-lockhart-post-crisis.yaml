        talked to Aerith through the cell wall, she reminded him that their deal was
        to be her bodyguard in exchange for one date. Tifa seemed upset before changing
        the subject to ask what Aerith knew about the promised land, the legendary
        land of the Ancients. The next day, the group awoke to find that Sephiroth
        had attacked the building and killed President Shinra. When the President's
        son, Rufus Shinra, arrived, Cloud stayed behind to buy the group time to escape,
        though Tifa stayed back to help him. When Cloud escaped, she stole a light
        blue pick-up truck from the Shinra exhibition rooms and escaped the building
        with Aerith in the passenger seat and Barret and Red XIII riding in the back,
        while Cloud supported them from a stolen motorcycle. Leaving Midgar behind,
        Tifa agreed to follow the group's journey to find Sephiroth, remarking that
        she had nowhere else to go.{{cite|FFVII|script=The Nightmare Beginning Anew|name=The
        Nightmare Beginning Anew}} ====Pursuit of Sephiroth==== In "The Tragedy of
        Five Years Ago", in Kalm, Cloud told the group how he was deployed to Nibelheim
        with Sephiroth and how the latter destroyed the town. His version of events
        was faulty, but the confused Tifa did not confront him, doubting her own recollection
        of events and wishing to protect him. Thereafter, the group traveled the world
        tracking Sephiroth, with Tifa supporting the party. They recruited new members,
        including Cait Sith and Yuffie Kisaragi. At the Corel Prison, with Barret
        struggling to deal with his own past, Tifa remarked that the two of them were
        not so different, both being driven towards Avalanche after their hometowns
        were destroyed by Shinra.{{cite|FFVII|script=The Desert Prison|name=The Desert
        Prison}} In "Gongaga, the Village of Sadness", the group met Zack's parents
        in Gongaga, who had not heard from their son in years. Knowing that Zack was
        the member of SOLDIER who had come to Nibelheim with Sephiroth instead of
        Cloud as he had recounted, Tifa was upset, but lied to Cloud when he asked
        if she knew Zack.{{cite|FFVII|script=Gongaga, the Village of Sadness|name=Gongaga,
        the Village of Sadness}} When the group arrived at Nibelheim, they found the
        town rebuilt, populated by Shinra employees hired to cover up the incident,
        who denied that Cloud or Tifa had ever lived there. The group also met Vincent
        Valentine, who joined the group, along with Cid Highwind, who joined them
        later in Rocket Town. When the group stayed in Gold Saucer during "Secret
        Date", Tifa was one of the possible dates for Cloud while the ropeway was
        under repair. During the date, she lamented being insecure with her feelings,
        how "being old friends is hard", and "timing is everything", wishing she could
        tell Cloud something (likely referring either to the inconsistency in his
        memories or to holding romantic feelings for him).{{cite|FFVII|script=Secret
        Date|name=Secret Date}} In "Within the Temple of the Ancients", Sephiroth
        manipulated Cloud into relinquishing the Black Materia, a powerful materia
        from the Temple of the Ancients that would allow Sephiroth to summon Meteor
        to hurt the planet itself. Aerith absconded to the City of the Ancients alone
        and, when Cloud doubted that he should continue on the quest, Tifa and Barret
        pushed him into going, promising to support him. In "Parting with Aeris",
        they witnessed Sephiroth murder Aerith and Tifa knelt by her body before running
        away in tears.{{cite|FFVII|script=Parting with Aeris|name=Parting with Aeris}}
        thumb|Barret with Tifa after Meteor is summoned. When the group tracked Sephiroth
        down to the Whirlwind Maze, he showed Cloud the true events of Nibelheim's
        razing. Sephiroth's manipulations took their toll and Cloud came to believe
        that he was not a real person, but someone made by Professor Hojo of Shinra
        with false memories.{{cite|FFVII|script=That Which Waits in the Northernmost
