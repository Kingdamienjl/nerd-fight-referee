  intelligence:
    text: Gifted (Tifa is an incredibly skilled hand-to-hand combatant who was trained
      by Zangan, a world-renowned martial artist, who even commented on her talent.
      She manages to keep up with 1st Class members of SOLDIER and countless monsters
      with just her fists, faking out her opponent with various feints to create openings
      and deliver brutal combos for the finish. As a member of AVALANCHE, she is trained
      in numerous forms of sabotage, stealth, and guerilla tactics. She is trusted
      enough to single-handedly guard the entrance to its secret headquarters beneath
      her bar, the Seventh Heaven. Also, while she's comparatively less proficient
      in terms of Magical prowess than some of her teammates, she also possesses a
      mastery of various Materia and the many abilities they grant, acquiring numerous
      new powers throughout her adventures with Cloud and the team.)
