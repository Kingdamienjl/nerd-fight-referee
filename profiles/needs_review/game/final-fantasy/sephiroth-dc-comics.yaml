    - field: intelligence
      value: Genius (Despite his lack of morals and empathy, Hojo, after the late
        Professor Gast Faremis, is Shinra's most brilliant scientist, having spearheaded
        the Project S branch of the Jenova Project after Gast left, resulting in the
        successful creation of Sephiroth, compared to many other failures from other
        scientists in the Project G branch. In doing so, he began the line of SOLDIERs
        that would later help Shinra take over nations across the world. During the
        events prior and during the game, he successfully deduced the nature of Jenova's
        regenrative abilities and how Sephiroth would manifest again, long before
        his reappearance, thanks to his Reunion theory, putting a long and complex
        experiment into motion that eventually did lead Shinra to both of them. Combat
        wise, he easily adapted to Weiss' body when he possessed him, using effectively
        all of his techniques to easily overwhelm Vincent in their first encounter.)
      source_id: mediawiki-sephiroth-dc-comics
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Despite his genius, Hojo is arrogant, condescending and narrow-minded,\
        \ quick to disregard any possibility or outcome that doesn't convince him\
        \ or doesn't fit with his theories, which also steems from his constant need\
        \ to prove his intelligence to others, fitting when Sephiroth described him\
        \ as a \"walking mass of complexes\". Once he injected the Jenova Cells in\
        \ his body, his sanity quickly degraded, and his sociopathic scientific curiosity\
        \ became a full blown lunacy to answer his own questions with little regard\
        \ for anything. additionally, as seen in Dirge of Cerberus, Hojo can easily\
        \ get drunk with power when in an advantageous position, aggravating the issues\
        \ previously described. Before injecting with Jenova Cells, Hojo was just\
        \ a normal man, vulnerable to any human weakness. Notable Attacks/Techniques:\
        \ When he injected Jenova Cells in his body, due to the nature of Jenova and\
        \ her ability to copy the skills and properties of other living beings, Hojo\
        \ quickly gained a set of abilities as soon as he mutated. However, given\
        \ the procedure was rushed and Hojo's body didn't properly interwine with\
        \ Jenova's genetic material, he didn't gain her psychic abilities and it led\
        \ to his mind and soul being eroded, as well as horrorific mutations that\
        \ slowly began to stabilize, but he was killed before they could properly\
        \ advance. Among his abilities used are the following: *Magic **Sleepel: A\
        \ spell that instantly puts an enemy to sleep. **Silence: Disables the use\
        \ of the voice, preventing the use of any ability that requires sound, words\
        \ or vocal commands, such as Magic, Summoning, Singing, Prayers, Speechcraft,\
        \ etc. **Slow: This spell halves the speed of the opponent\u2019s time, cutting\
        \ their overall speed altogether by half. **Confu: A spell that interferes\
        \ with the mind of the opponent, leaving it in a chaotic state, only able\
        \ to attempt to fight by using abilities and doing actions at random without\
        \ rhyme or reason. **Fire2: A mid-tier fire elemental spell that conjures\
        \ a small pillar of flames to consume the enemy. Used by the Poodler Sample.\
        \ *Mutation Abilities **Capsule: Hojo releases two of his specimens to fight\
        \ alongside him: Poodler Sample and Bar Rap Sample. If these creatures are\
        \ destroyed, Hojo will simply send out more to fight. **Combo: Hojo charges\
        \ and strikes an enemy repeatedly. Notably, from the second hit onwards, he\
        \ can inflict an ailment to the target first Poison, then Darkness and, finally,\
        \ Sleep. **Evil Poison: Used by Hojo's Bad Rap Sample. A physical attack that\
        \ releases a toxin that blinds the opponent. **Bio Gas: Hojo releases a venomous\
        \ gas that poisons the enemy. ==Notable Matchups== Victories: Losses: Inconclusive:\
