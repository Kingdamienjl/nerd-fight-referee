    \ Savior away forcefully) *Gravity Manipulation (Is unaffected by the gravitation\
    \ pull of a Black Hole created by the Unseen Chaos, which swallowed the dying\
    \ world of Nova Crysalia) Warrior of Light Resistances (Lightning is referred\
