    \ Is also able to move inside of \"The Ark\" where time doesn't flow at all) *Life\
    \ Manipulation (Can nullify the effects of Bhunivelze's \"Heartless Angel\". Which\
    \ reduces an enemies HP to 1) *Space-Time Manipulation, Reality Warping, Vibration\
    \ Manipulation, and Explosion Manipulation (Able to withstand Bhunivelze's Hypernova,\
    \ which causes a colossal explosion that sends shockwaves large enough to destroy\
    \ several planets, dealing heavy non-elemental damage and removing all status\
