  stamina:
    text: 'Lightning''s combat prowess and stamina evolve throughout the trilogy as
      she too evolves from a mere L''Cie to becoming something more than human and
      that of deity herself: Superhuman: She and her allies fought through the city
      of Eden for a better part of the day. Should also be comparable to other L''Cie''s
      such as those in the world of Orience, who are capable of fighting for 6 days
      and 7 nights At least Superhuman, likely Infinite: It is stated that her battle
      with Caius Ballad could last for eternity if there is no clear victor Lightning
      Returns: Final Fantasy XIII= Infinite: By virtue of being the divine savior
      imbued with Bhunivelze''s power, was never shown to be physically tired in spite
      of 13+ days of non-stop stress and combat. Also has three different sources
      of Infinite Energy: Chaos, Magic, and Eradia {| class="wikitable mw-collapsible
      mw-collapsed" !'
    source_ids: *id002
    confidence: 0.8
  range:
    text: '*Extended Melee Range (With the Blazefire Saber and various gunblades;
      Higher with the gunblades in "Gun Mode") *Multiversal+ (With Magic; Magic as
      a whole is shown to affect omnipresent beings such as Exdeath when he''s become
      one with the Void itself, which spans across the entire Final Fantasy Multiverse
      and is stated numerous times to contain an infinite number of worlds, can banish
      foes into the Void) At Least Multiversal+, likely Far Higher (Unseen Chaos originates
      from a Higher Dimension known as the "Unseen Realm". Where the concepts of Space
      and Time are nonexistent due to outright transcending them, along with the stories,
      information, and memories that makes up the worlds below it, and is completely
      inaccessible to dimensions below it through normal means. Only by Etro opening
      her "Gate" can the Unseen Realm be accessed. The Unseen Realm exists above the
      world of Valhalla. Valhalla itself is a world that is stated numerous times
      to be beyond Space & Time, and is confirmed to be on a different plane of existence,
      where all timelines are able to be viewed from and are referred to as "lower
      worlds", which includes "The Void" which is described as a mere "Shadow" in
