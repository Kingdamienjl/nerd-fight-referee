- id: claim-weaknesses-3edffa4b
  section: weaknesses
  axis: weakness
  text: 'Lightning''s character changes and evolves throughout the events of the FFXIII
    Trilogy: File:Lightning_slaps_Fang.gif|thumb|300px|Lightning slapping Fang across
    the face in frustration and anger File:Lightning_promise.webp|thumb|300x|Lightning
    promising to protect Hope after he abandoned his desire for revenge File:Lightning%27s_Hope_in_Snow.gif|thumb|300x|Lightning
    reassuring Snow''s belief that they''ll see Serah again. Abandoning her nihilistic
    way of thinking. As a combatant, Lightning doesn''t showcase any real weaknesses.
    Being considered a true "Army of One", she is able to take out many armed and
    trained soldiers and officers by herself as quickly and efficiently as possible.
    However, she at this point is known to be distrustful of others, preferring to
    work alone and seeing other people as a burden. Over the course of the game she
    does open up to her allies and realizes her own shortcomings and arrogance, and
    works to better herself to protect those around her. Due to becoming a L''Cie
    for the first time, she inherited the curse of L''Cie''s fate. However, she has
    shown to be able to scorch her L''Cie brand white, meaning that she is no longer
    in danger of either becoming a Cie''th, or turning into crystal. Her "Heart" and
    "Soul" are formed from Chaos, which have it''s own benefits and shortcomings which
    can be read about and detailed here. Lightning lost her L''Cie status after the
    events of Final Fantasy XIII. As such, her only real weaknesses come from potential
    overuse of the "Eyes of Etro". Which causes one to see changes in the timeline
    across the past, present, and future. Everytime this occurs, the user''s life
    slowly drains away. Lightning Returns: Final Fantasy XIII= Now known as "The Savior",
    Lightning has evolved from her previous state to be made "more than human" and
    that of a god comparable to Bhunivelze himself. As such, she is no longer held
    back by the weaknesses of humans as "The Savior". Due to the destruction of Etro''s
    "Heart", the "Eyes of Etro" are no longer in effect.'
