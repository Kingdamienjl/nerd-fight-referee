    \ Cross Slash technique. Which paralyzes the target) Schemata Specific Equipment\
    \ *Animal Manipulation (The Moogle Queen Schemata holds control over Moogles,\
    \ fulfilling them with a desire to protect her at all costs) *Unholy Manipulation\
    \ (The Divine Wear Schemata has the Crocea Mors blade and Abyss Gate Shield. Which\
    \ are stated to be artifacts of the Devil infused with evil Miasama) *Attack Negation\
    \ (The Aegis Shield is capable of negating all attacks) *Life Manipulation (The\
    \ Cosmocrator armor is said to be imbued with the life of all creation) *Morality\
    \ Manipulation and possible Conceptual Manipulation (Type 3; Excalibur is the\
    \ sword of God, said to deny all evil and return it to nothingness) *Possible\
    \ Paraconsistent Physiology (Type 1; The Celestial Body Armor is said to make\
    \ it's wearer beyond \"Good and Evil\") Schemata Exclusive Magic *Energy Projection,\
    \ Resistance Negation, Durability Negation, Forcefield Negation, Reflection Negation,\
    \ and Invulnerability Negation (The Ultimatus garb grants access to the spell\
    \ Ultima; which conjures a power magic blast that ignores magic defense and bypasses\
    \ barriers and reflection skills. Ultima also ignores all resistances, and can\
    \ deal damage even if the enemy is immune to magic) The Savior (Complete Vessel)=All\
    \ previous abilities, plus *Awakened Power and Empowerment (Gained a burst of\
    \ power when motivated by her friends. Allowing her to overpower Bhunivelze's\
    \ blast with her allies when she struggled to hold it back before), *Transmutation\
    \ and Sleep Manipulation (Put Bhunivelze into Crystal Stasis and sent him into\
    \ the new Unseen realm. Crystal Stasis is said to be an eternal slumber) *Portal\
    \ Creation, Vibration Manipulation, and Immersion (After reintegrating Lumina\
    \ who was the lost part of Lightning's \"Heart\" back into herself, she should\
    \ inherit Lumina's abilities) Same as before, minus access to Bahamut Resistances=All\
    \ previous resistances, plus *Fal'Cie (Top Tier) Resistances *Age Manipulation\
    \ (By this point in time, the Unseen Chaos had caused the age process to completely\
    \ stop, rendering people biologically immortal) *Power Nullification (Able to\
    \ utilize her powers despite walking through Etro's temple after being shot in\
    \ the chest with a chaos blast. Lumina described this effect as The Savior being\
