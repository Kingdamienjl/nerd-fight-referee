      source_id: mediawiki-sephiroth-modern
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: 'There are two important moments in the story that set apart Sephiroth''s
        endurance, when he was still an individual of flesh and blood and after he
        existed as a spiritual being: Superhuman (Sephiroth has never shown to truly
        exert himself in battle, remaining unfazed even against opponents such as
        Genesis and Zack, who have managed to make Sephiroth fight seriously, and
        despite the two of them showing visible exhaustion and effort. Even detrimetal
        conditions like the seven days he spent researching the Jenova Project in
        the Nibelheim Mansion, without food or sleep, didn''t harm his performance
        in battle in the slightest against an opponent as strong as Zack, who by that
        time was the other uncontested strongest member of SOLDIER. After being impaled
        through the torso with the Buster Sword, despite visibly hurt, Sephiroth could
        still display an overwhelming power to dominate Cloud, when everyone though
        such injury would prove to be disabling to begin with. Following his fall
        into the Lifestream, Sephiroth''s made vast amounts of its knowledge his own
        and gained access to a replenishing pool of Spiritual Energy that would never
        exhaust through use, while making an active effort to rebuild his body and
        control the Jenova fragments through the Planet, all without any strain on
        his end) Infinite (Sephiroth no longer has a physical body, being now a Spirit
        who had ascended to a separate entity from the Lifestream. Spirits are incomparably
        less limited than physical beings, lacking all of the weaknesses of the flesh.
        Managed to fight Cloud for several hours without even needing to catch his
        breath, despite his opponent''s best efforts)'
      source_id: mediawiki-sephiroth-modern
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: 'Two important moments, before Sephiroth fell into the Lifestream and
        after doing so and absorbing the knowledge from the Planet: Extended Melee
        Range (With the Masamune), Hundreds of Meters (With Spiritual Energy techniques
        and Magic) Multiversal+ (His influence can reach the living world from the
        Lifestream, which more than an energy current is another realm with differing
        time and space, originating universes and even reaching places beyond space-time
        altogether. Sephiroth''s Negative Lifestream was causing a very real danger
        of contaminating the entire Lifestream and Jenova had begun merging with it
        to the point the Spirits of the dead would return to her instead to the Planet)'
      source_id: mediawiki-sephiroth-modern
      provider_id: vsbattles
      authority: high
      confidence: 0.75
