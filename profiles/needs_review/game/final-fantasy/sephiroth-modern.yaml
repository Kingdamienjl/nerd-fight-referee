    - field: attack_potency
      value: 'At least Multi-Solar System level (Already during the era before the
        events of the original game, Sephiroth was the strongest in the world and
        there was no conceivable threat that could lead to his defeat.Gamaga Magazine
        Interview: October 30th, 2007 Issue (2007) While it''s unclearCrisis Core
        -Final Fantasy VII- (2007) if he gave his all, Sephiroth seriously fought
        Zack Fair and defeated him in a duel one-sided to the point it was statedFinal
        Fantasy VII: 10th Anniversary Ultimania (2007) it could be easy to forget
        they both were 1st Class SOLDIER. By that point, Zack had already defeated
        Minerva a being superior to Summons,Crisis Core -Final Fantasy VII- (2007)
        stronger than Zirconiade and thus far above Bahamut Fury and ZERO. Sephiroth
        likely compares to original body Jenova, as he was the perfect productCrisis
        Core -Final Fantasy VII-: Ultimania (2007) of the Jenova Project, and his
        Spirit was so strong she couldn''tFinal Fantasy VII: Ultimania Omega (2005)
        overtake him. Jenova was such a threat the Planet created the 8 Weapons to
        eliminate her, each Weapon being around as strong as Minerva>16.883 ExaFoe),
        likely Multiverse level+ (Stronger than the combined 8 Weapons, with each
        Weapon capable of posing a threat to Cloud Strife after he had become far
        stronger since he returned from Ivalice, where he took part in Ramza Beoulve''s
        army and participated in the defeat of a full power Ultima, the Angel of Blood
        and Zodiark, the Keeper of Precepts, beings who at a mere echo of their true
        strength were a great challenge for Vaan and Balthier, who had defeated Gilgamesh
        twice), higher with Spiritual Energy (Spiritual Energy increases the destructive
        power of the user''s techniques. In particular, Limit Breaks are stated to
        reach power far beyond the user''s regular capabilitiesFinal Fantasy VII (1997))'
      source_id: mediawiki-sephiroth-modern
      provider_id: vsbattles
