        \ it eventually aligns and overflows allowing to go beyond the user's standard\
        \ capabilities and reach a much higher power, just as their name indicate.\
        \ Limit Breaks are affected by emotions; intense ones such as rage can lead\
        \ to attaining the state to use these moves much faster than usual. Tifa's\
        \ Limit Breaks are unique in a sense: they aren't a powerful single move like\
        \ those used by most of her teammates. Instead, she performs a string of stronger\
        \ techniques in a single long combo. Comparatively, the increase in power\
        \ gained by each of her Limit Breaks is weaker than the boosts gained by the\
        \ rest of the team; however, she makes up for it with their combined power\
        \ and the possibility of landing a Critical Hit for double damage. Level 1:\
        \ *Beat Rush: Tifa runs up to the enemy and performs a quick and precise,\
