        PremiumHeart-ffvii-tifa.png|Premium Heart in Final Fantasy VII Dissidia-PremiumHeart.png|Premium
        Heart in Dissidia D012-Premium Heart Art.PNG.png|Premium Heart''s concept
        art in Dissidia Dissidia 012 Tifa Alternate 1 EX Mode.png|Tifa with Premium
        Heart in Dissidia Materia Types.jpg|Materia Types Final Fantasy 7 CD2-180215-092654.png|Materia
        Menu MateriaAC.JPG.jpg|Cloud''s Materia Collection Tifa putting his Leather
        Gloves to fight Loz.png|Tifa putting her black Leather Gloves to fight Loz
        Tifa Stance.png|Tifa about to fight Loz with the Leather Gloves on. Her Ribbon
        can be seen tied in her left arm. FF7 Ribbon.png|Ribbon''s original design
        in Final Fantasy VII *Leather Gloves: While not quite a weapon per se, Tifa
        starts with these for her fights before switching them for more powerful gauntlets
        and claws. In Advent Children, Tifa is once again seen carrying them with
        her as a weapon of choice. *Premium Heart: Tifa''s ultimate weapon from the
        original game. These special gauntlets have the power to increase Tifa''s
        destructive might, up to several times, the closer her Spirit Energy raises
        to the point to use her Limit Breaks. Once Limit Breaks are used, this boost
        wears off and must be built up again. The drawback, however, is that if her
        Spirit Energy is too weak, Tifa''s attack will be reduced until it begins
        to overflow again. *Ribbon: A red ribbon Tifa wears in her left arm in honor
        to her fallen friend, Aerith. The Ribbon has a mysterious power that protects
        its wearer from all of the game''s Status Ailments. *Materia: Rarely, the
        Spirit Energy of Lifestream may be particularly abundant in an area on the
        Planet''s surface, and for years it can concentrate in that particular spot
        to then condense and crystalize, eventually becoming Materia. In the modern-day,
        the Shinra Electric Power Company artificially manufactures Materia through
        their extraction of Mako, the term they''ve given to the Spirit Energy they''ve
        extracted through reactors. Contained in it is the wisdom of the Cetra, an
        ancient race who were spiritually connected to the Planet and knew how to
        access its powers. Materia allows the access to this knowledge to be able
        to call upon those powers, just like the Cetra did, in many different ways,
        most notably Magic. There are different kinds of Materia, represented by different
        colors: green (Magic), red (Summoning), yellow (Commands), blue (Support)
        and purple (Independent). Materia can be equipped in many different ways:
        Cloud and the party slot them into their weapons and armor, Vincent can additionally
        put them in keychains attached to his guns, Zack can carry up to six in his
        person, while the Remnants of Sephiroth, due to their nature, can absorb them
        directly into their bodies.'
