    Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The After Years Novel,
    chapter 3, page 147), Law Manipulation (Magic is stated to rewrite the natural
    order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Subjective Reality
    (Magic,Final Fantasy IV Novel 1, chapter 1, page 29 in its basest form,Final Fantasy
    IV Novel 1, chapter 3, page 107 is projecting one''s innerFinal Fantasy IV: The
    After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy IV: The
    After Years, and is powered by intelligence and mental strength), Durability Reduction
    (Magic ignores durability to physical attacks requiring specific resistances to
