    - field: powers_and_abilities
      value: '{Still in Progress} Superhuman Physical Characteristics, Acrobatics,
        Stealth Mastery, Weapon Mastery, Vehicular Mastery, Indomitable Will, Martial
        Arts, Flight (Pseudo), Energy Manipulation, Magic, Subjective Reality, Logic
        Distortion, Vibration Manipulation, Law Manipulation and Prayer Casting (Magic
        is the exceptional power within the FF franchise. Magic, the power that encompasses
        everything within the logical boundaries of thoughts, was stated to be activated
        through uttering certain words that cannot be expressed in words which can
        cause vibrations throughout the atmosphere that stray far from the laws of
        nature. Magicians use these vibrations to twist the logic of all things. Mages
        were constantly said to be able to bring phenomenas, imaginations and thoughts
        into reality. Notably, white magic is cast through certain prayers) Conceptual
        Manipulation (Type 2) and Space-time Manipulation (Magic was shown to be able
        to significantly affect entire concepts and twist space and time) Gravity
        Manipulation and Time Manipulation (The ''Haste'' and ''Slow'' spells were
        stated to be capable of affecting time and gravity) Summoning (Can summon
        her Eidolon) Blood Manipulation and Death Manipulation (The death spell causes
        the blood of organic beings to coagulate resulting in the instant death of
        that being) Poison Manipulation and Corrosion Inducement (The ''Poison'' spell
        generates toxins in an individual''s body and corrodes their body bit by bit)
        Pain Manipulation and Electricity Manipulation (The Thunder spells burn through
        the nerves of the body)Elemental Manipulation, Matter Manipulation and Durability
        Negation (Even the most basic Fire/Blizzard spell can remarkably affect internal
        electrons of the body) Forcefield Creation, Healing, Statistics Amplification,
        Status Effect Inducement and Resurrection (All via several in-game abilities)
        All previous abilities to a far greater extent plus Immortality (Type 1, Possibly
        2 as the goddess of death), Flight, Acausality (Type 1: Retained all of her
        memories of the original events after Chaos rewrite history. Type 2 and possibly
        4: Can exist within Valhala which is devoid of the concept of time and exists
        beyond the conventional space-time of the Fabula Universe. Superior to the
        likes of Serah and Noel who could exist in places where past and future existed
        as one.), Sleep Manipulation, Dream Manipulation, Preognition, Retrocognition,
        Clairvoyance, Limited Invulnerability, Limited Creation, Instinctive Reactions,
        Mind Reading, Information Manipulation (Type 1), possibly Deconstruction,
        Chaos Manipulation, BFR, History Manipulation, Blessed, Chi Manipulation,
        Passive Space-time Manipulation, Holy Manipulation, Possibly Omni-Perception,
        Non-Physical Interaction, Soul Manipulation, Life Manipulation, Absorption,
        Magnestism Manipulation, Fusionism, Emotional Manipulation, Magnestism Manipulation,
        Dimensional Travel, Empowerment, Time Manipulation, Transmutation'
      source_id: character-stats-profiles-barthandelus-final-fantasy
      provider_id: character_stats_profiles
