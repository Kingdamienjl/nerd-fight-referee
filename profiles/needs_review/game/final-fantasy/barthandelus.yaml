    Forcefield Creation (As seen here), Telepathy, Elemental Powers (Of the Fire,
    Ice, Lightning and Water variety), Matter Manipulation (Macro-Quantum; Both Fire
    and Ice related spells are stated to affect the target''s electronsFinal Fantasy
