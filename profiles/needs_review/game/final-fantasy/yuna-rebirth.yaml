  intelligence:
    text: Genius. His intelligence stats is several times higher than that of adults
      and high-ranking adventurers, and almost twice as superior as Lena's intelligence,
      who is called a genius magician. Yuu is so intelligent to learn in a short time
      the writing of the other world, or create magic stones by himself to fuse them
      with his magic and thus grant new skills. He has extensive knowledge in swordsmanship,
      after obtaining the memories of an old user of the sword, in addition to being
      able to handle the shield, spear, and melee combat.
