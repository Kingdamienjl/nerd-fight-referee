    - field: weaknesses
      value: 'Professional Wrestling: Tizoc is a professional wrestler which means
        that his fighting style is centred around large hits that deal significant
        damage and grapples where he uses his strength and body weight to slam an
        opponent into the ground as hard as possible. :, Acrobatics: Despite his size,
        Tizoc is easily able to leap twice his height and even greater, almost as
        if he has the ability to fly. He uses this leaping ability to increase the
        damage of his wrestling moves by slamming an opponent from a far larger height.
        ::, MAX Mode: MAX Mode is a power-up all fighters can access. In exchange
        for their Super Meter depleting quickly over time, the fighter gets enhanced
        strength and durability for a limited amount of time as well as access to
        enhanced versions of their strongest techniques and the ability to use their
        strongest technique. Once their Super Meter is empty, Extra Mode: Extra Mode
        is an advanced version of MAX Mode where after it runs out, all of the advantages
        gained from using MAX Mode are kept for the rest of the fight. ::, Armour
        Mode: Armour Mode is a power-up all fighters can access. In exchange for their
        Super Metre depleting quickly over time, the fighter gets greatly enhanced
        durability. Once their Super Meter is empty, Counter Mode: Counter Mode is
        a power-up all fighters can access. In exchange for their Super Meter depleting
        quickly over time, the fighter gets enhanced strength as well as the ability
        to use Guard Cancels and Guard Escapes as much as they want. Once their Super
        Meter is empty, Critical Counter Mode: Critical Counter Mode is a power-up
        all fighters can access. When a fighter has filled out their Critical Counter
        gauge and lands a counter with a heavy attack, they will enter Critical Counter
        Mode. In Critical Counter Mode, the fighter is able to string together attacks
        and techniques better making them a better fighter, when Critical Counter
        Mode is nearly over, the fighter can choose to end it with an enhanced version
        of their strongest move. Once the Critical Counter gauge is empty, Hyperdrive
        Mode: Hyperdrive Mode is a power-up all fighters can access. In exchange for
        their Super Meter depleting quickly over time, the fighter gets the ability
        to cancel every one of their moves and techniques, allowing them to combo
        all of their moves and techniques together better. Once their Super Meter
        is empty, Griffon Tower: The Griffon Tower is a special technique where Tizoc
        grabs his opponent before flipping them over and performing a brainbuster,
        slamming them to the ground head first. :::, Joudan Yoke Kougeki: The Joudan
        Yoke Kougeki is a special technique where Tizoc dashes forward to peck at
        his opponent with his beak. ::::, Glide Super Kick: The Glide Super Kick is
        a special technique where Tizoc leaps forward and does a powerful double jump
        kick that sends the opponent flying. ::::, Olympus Over: The Olympus Over
        is a special technique where Tizoc leaps high into the air before performing
        an elbow drop on the opponent. Tizoc can cancel out of this move as a feint.
        ::::, Poseidon Wave: The Poseidon Wave is a special technique where Tizoc
        steps forward and swings his arm at the opponent to perform a clothesline.
        ::::, Active Tupon: The Active Tupon is a special technique where Tizoc ::::,
        Icarus Crash: The Icarus Crash is a special technique where Tizoc leaps into
        the air and grabs the opponent before performing a somersault, flipping them
        upside down and slamming them to the ground head first. ::::, Justice Hurricane:
        The Justice Hurricane is a special technique where Tizoc grabs his opponent
        before leaping high into the air while spinning before slamming the opponent
        to the ground head first. ::::'
