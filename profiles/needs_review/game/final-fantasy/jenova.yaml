- id: claim-powers-and-abilities-70544fdc
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Large Size (Type 0), Self-Sustenance
    (Types 1 and likely 3); Immortality (Types 2, 3, 6 and 8. As long as her cells
    remain, Jenova can sustain her will through them and use them to build a new body);
    Regeneration (Low-High, can use the Reunion to rebuild her body from fragments,
    even cells); Space Survival (Has travelled through outer space); Shapeshifting;
    Power Mimicry (Jenova can imitate the appearances and, to an extent, abilities
    of others); Adaptation (Jenova can grow and adapt to the threats of the environment
    around her and the abilities of her enemies); Non-Physical Interaction (Spectral
    enemies aren''t uncommon in the Planet); likely Energy Manipulation (while Jenova
    is not native from the Planet nor is part of its cycle of the Lifestream, Bugenhagen
    explained that said cycle is not limited to just the Planet, rather it extends
    to all living beings in the universe, meaning Jenova may also have Spirit Energy
    of her own); Flight and Levitation; Telekinesis; Teleportation; Invisibility;
    Telepathy; Mind Reading and Memory Reading (Jenova can read the memories and emotions
    of others), Mind Control and Possession (those with her cells will become puppets
    of her will, unless they have a strong enough mind); Illusion Creation and Perception
    Manipulation (as seen with Kadaj, and described by Tseng, Jenova can appear to
    a person as someone from their memory, tricking their senses to be seen, heard
    and overall perceived as said person); Intangibility; Body Control (her disembodied
    parts can function as extensions she can also transform); Pain Manipulation and
    minor Biological Manipulation (as displayed by Kadaj, Jenova has the power to
    heal injuries in a process different from magic and take away the pain from others,
    as well as give them back when she wishes); Corruption (Type 1, can infect with
    a powerful virus, that can cause Insanity in living beings and turn them into
    Monsters); Limited Power Bestowal (with the right procedure, Jenova cells can
    grant the host greatly enhanced physical capabilities and pass down some of her
    abilities). Resistance to Banishment (despite the destruction of her body, Jenova''s
    spirit was not forcefully taken away from the living world by the Lifestream,
    rather small fragments of her soul started to merge with it. By the end of the
    original game, the Lifestream couldn''t forcefully take her physical form anymore);
    Mind Manipulation, Memory Manipulation, Soul Manipulation, Soul Absorption and
    Empathic Manipulation (her alien existence could not be assimilated by the Lifestream,
    nor her will be overwhelmed nor eroded. Hojo commented that instead of becoming
    part of the Lifestream, Jenova was overtaking the Lifestream itself); Corruption
    (Types 1 and 2, Jenova was exposed to constant Spirit Energy yet never suffered
    from mutations like humans becoming Makonoids. Additionally, her biology is made
    to be compatible with her own mutagenic virus); Biological Manipulation and Disease
    Manipulation (as a parasitic entity described as having abnormal resilience, Jenova''s
    biology is conditioned to withstand extreme hazardous conditions so even her cells
    can survive); Fire Manipulation and Heat Manipulation (withstood her entry and
    impact into the Planet in a huge meteorite); Gravity Manipulation; Poison Manipulation;
    Madness Manipulation; Berserk Mode Inducement; Paralysis Inducement; Death Manipulation;
    Transmutation; Size Manipulation. Magic; Water Manipulation (via Aqualung, Blue
    Light and Blue Flame); Heat Manipulation and Wind Manipulation (via Tropic Wind,
    the former also via Red Light); Light Manipulation (via Laser, W-Laser and Tail
    Laser); Attack Reflection (via Reflect); Time Stop (via the Stop spell); Silence
    Inducement (via the Silence Spell); Power Nullification (via the Silence ailment,
    which disables all abilities that require voice, commands or words); Healing (via
    Cure3/Curaga); Poison Manipulation (via Bio2/Biora); Energy Projection (via Ultima);
    Minor Empathic Manipulation (can provoke intense rage and sadness via contact
    with her tentacles). Resistance to: Biological Absorption, Deconstruction and
    Matter Manipulation (the Lifestream''s process of absorbing and diffusing physical
    matter to retake the Spirit Energy of any living being didn''t manage to destroy
    her cells, which remained active for the Reunion. Once her SYNTHESIS body was
    finished in the Planet''s Core, she was unaffected by this process altogether);
    Absolute Zero (evolving her prior resistance to cold, has endured Shiva''s Diamond
    Dust); Earth Manipulation; Water Manipulation; Silence Inducement; Time Manipulation
    and Time Stop; Sleep Inducement and Petrification (thanks to her adaptive abilities,
