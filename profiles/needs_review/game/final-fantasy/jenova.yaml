      value: Gifted (While there's uncertainty on how Jenova's mind exactly operates
        or how similar it is to a human's, in a traditional sense she has been described
        as very intelligent, and has displayed extremely cunning strategy and deception,
        taking full advantage of her ability to read minds and mimic appearances,
        memories and abilities, to blend and attack by surprise the Cetra, who despite
        having access to the powers, magic and knowledge of the Planet, were almost
        defeated and barely avoided extinction during this war. Jenova efficiently
        spreads her influence through hosts to slowly decimate species and take over
        the entire planet, a process that's implied she has successfully carried out
        several times in the past. And while there are many interpretations of their
        exact relationship, if one subscribes to the theory that Jenova at least influences
