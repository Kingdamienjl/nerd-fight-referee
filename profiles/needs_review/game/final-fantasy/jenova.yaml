    - field: stamina
      value: Superhuman (If stories passed down about her are true, Jenova was relentless
        and didn't stop until she was sealed. Notable is that Jenova isn't stopped
        by pain or injury, and even when reduced to pieces she will try to rebuild
        herself. The only ways she was ever stopped were after the Cetra managed to
        seal her after she nearly drove them to extinction, and by the destruction
        of her body at the hands of the party, despite which her will and memetic
        legacy keep existing within the Lifestream alongside Sephiroth) | Nigh-Infinite
