      her menace. Each Weapon is on par with Minerva, an entity stated to beCrisis
      Core -Final Fantasy VII- (2007) more powerful than Summons altogether, by virtue
      of proving to be a greater threat than Zirconiade, a Summon whose comingBefore
      Crisis -Final Fantasy VII- (2004) was considered an apocalyptic event,Before
      Crisis -Final Fantasy VII- (2004) compared to Bahamut Fury's casual defeat,Crisis
      Core -Final Fantasy VII- (2007) as a single Weapon needed the collaborative
      effort from all fugitive Turks to gradually take down, compared to Zirconiade
      who was barely defeated by 4, thus likely even surpassing Zirconiade's full
      power. Though the confrontation was ultimately avoided, as Jenova was sealed
      by the Cetra, the fact that the Planet itself created the Weapons specifically
      to destroy Jenova is a testament of her power. Furthermore, this indicates that
      Minerva herself was not enough to fight Jenova), likely Multiverse level+ (The
      Weapons would eventually fight Cloud and his allies, putting Jenova on that
