    - field: weaknesses
      value: "Tifa must be pressed in the battle to use her Limit Breaks and is not\
        \ as proficient in magic as some of her teammates. In Advent Children, she\
        \ acknowledges she has become weaker after two years of not having fought,\
        \ with Cloud being the only one who could regain his former strength. Notable\
        \ Attacks/Techniques: |-|Limit Breaks= Limit Breaks are powerful special moves\
        \ Tifa can perform in battle. All living beings have a portion of the Spirit\
        \ Energy that flows through the Lifestream in themselves when this energy\
        \ raises to its limit it eventually aligns and overflows allowing to go beyond\
        \ the user's standard capabilities and reach a much higher power, just as\
        \ their name indicate. Limit Breaks are affected by emotions; intense ones\
        \ such as rage can lead to attaining the state to use these moves much faster\
        \ than usual. Tifa's Limit Breaks are unique in a sense: they aren't a powerful\
        \ single move like those used by most of her teammates. Instead, she performs\
        \ a string of stronger techniques in a single long combo. Comparatively, the\
        \ increase in power gained by each of her Limit Breaks is weaker than the\
        \ boosts gained by the rest of the team; however, she makes up for it with\
        \ their combined power and the possibility of landing a Critical Hit for double\
        \ damage. Level 1: *Beat Rush: Tifa runs up to the enemy and performs a quick\
        \ and precise, three-hit, palm strike combo. *Somersault: Tifa sets her left\
        \ foot against an enemy and performs a flash kick. Level 2: *Waterkick: Tifa\
        \ performs a circling sweep kick that creates a small burst of Spirit Energy.\
        \ *Meteordrive: Tifa grabs an enemy and performs a suplex move with enough\
        \ force to create small explosions upon impact with the ground. Level 3: *Dolphin\
        \ Blow: Tifa performs a jumping uppercut that creates a surge of water from\
        \ where a dolphin appears. *Meteor Strike: Tifa picks an enemy and jumps high\
        \ into the air to fling them at the ground, creating a large explosion upon\
        \ impact. Level 4: *Final Heaven: Finally, Tifa finishes the combo string\
        \ by holding her fist forward, she prepares to attack as energy gathers in\
        \ her hand and finally she charges with a powerful punch, going through her\
        \ opponent, transferring the energy and creating a massive explosion from\
        \ within them. |-|Magic= Accessed through the Green Materia, this allows the\
        \ wielder to access the wisdom of the Ancients, the Cetra, and the connection\
        \ they shared with the Planet to use its powers and manifest all sorts of\
        \ incredible skills. These can range from offensive manipulation of the elements,\
        \ to support effects and even powerful healing abilities. While each Magic\
        \ Materia allows typically the use of a specific set of spells (such as Lightning\
        \ allowing to use Bolt, Bolt2 or Bolt 3; or Mystify granting Berserk and Confu,\
        \ both mind-affecting spells), there exists the Master Magic Materia, which\
        \ gives the user every magic in existence except the one of a kind Holy and\
        \ Meteor. Notable spells include: Offensive: *Fire3 (Firaga), Ice3 (Blizzaga),\
        \ Bolt3 (Thundaga) and Quake3 (Quaga): Very high-level elemental magic that\
        \ conjures their respective elements for a powerful attack to strike a single\
        \ enemy or a wide area. *Bio3 (Bioga): The user cast large bubbles of venomous\
        \ liquids that drown the enemy to inflict heavy damage and leave them poisoned.\
        \ *Demi3 (Graviga): A powerful gravity well is created to drag and crush enemies\
        \ within it. This spell cannot be reflected. *Comet2 (Cometeor): Calls forth\
        \ several small meteors from outer space to strike the enemy four times. This\
        \ spell cannot be reflected. *Death:A spell that conjures a Grim Reaper to\
        \ kill an opponent instantly. This spell can affect robotic enemies and ghosts\
        \ unless they explicitly resist instant death. *Tornado: A spell that creates\
        \ a powerful twister on an opponent. May inflict confusion. *Freeze: A sudden\
        \ cold surrounds an enemy and then they\u2019re instantly encased in ice,\
        \ freezing its surrounding area as well. May inflict Stop. *Break: Rock is\
        \ materialized around the opponent and proceeds to crush them, turning them\
        \ into stone as well. May inflict Petrification. *Flare: The user causes a\
        \ nuclear reaction by making the atoms of the target collide with each other,\
        \ resulting in a powerful explosion of extreme heat to incinerate an opponent\
        \ completely. *Ultima: The most powerful Black Magic Spell in the story after\
        \ Meteor itself. A massive energy wave that strikes a wide area for non-elemental\
        \ damage. The spell cannot be reflected. Healing: *Cure3 (Curaga):The user\
        \ can restore a large amount of health to themselves or their whole party.\
        \ *FullCure: An incredibly powerful healing spell that will restore to full\
        \ health the user or one of their allies. It cannot be reflected. *Regen:\
        \ An assist spell that allows the user to recover health over time gradually.\
        \ The speed of the regeneration may vary depending on the speed of the target's\
        \ time; under the Haste status, it's doubled, under Slow it's halved and under\
        \ Stop the regeneration halts until time flows again"
