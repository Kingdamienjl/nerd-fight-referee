  intelligence:
    text: The leader of the Four Archfiends and the Archfiend of Fire, Rubicante possesses
      nearly unparalleled mastery of fire, leading the invasion of the Kingdom of
      Eblan and burning it to the ground before the heroes are able to intervene.
      While he's chivalrous to a fault, healing the party before fighting them, he
      nevertheless proves an incredible challenge to them, with Edge noting that he
      is superior to any of them individually. Effortlessly setting entire battlefields
      ablaze with his signature Inferno attack, he repels his foes with massive blasts
      of fire while defending against magical attacks with his cloak. He is also pragmatic
      enough to take advantage of his cloak's properties, casting spells on it to
      heal himself while simultaneously damaging his foes.
    source_ids:
    - vsbattles-rubicante-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
