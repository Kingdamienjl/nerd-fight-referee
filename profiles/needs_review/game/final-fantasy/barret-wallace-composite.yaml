        from the city of Edge by using Great Gospel) and Immortality Negation (Types
        1, 2, 3, 4, 6, 7, 8 and 9. When he killed Sephiroth, he also put an end to
        Jenova who, despite her previous physical death at the Planet''s Core, lived
