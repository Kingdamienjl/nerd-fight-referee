        rash decisions due to his short temper, he can be a surprisingly thoughtful
        and down-to-earth individual. He efficiently led the second incarnation of
        AVALANCHE in successful missions against Shinra, and the company saw them
        as a genuine threat that required extreme measures to be dealt with. Though
        he initially had trouble working with Materia, Barret would eventually become
        an adept user, with his most powerful weapon even having a mechanism required
        to be well synchronized with them. By the end, he had become an experienced
        warrior that had faced all sorts of enemies, capable of easily defeating the
        1st Class members of Shinra's elite military, SOLDIER, as well as the Planet's
        most fearsome creatures)
