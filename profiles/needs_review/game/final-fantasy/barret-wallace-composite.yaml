        Weapon, mysteriously found in on the Sister Ray cannon during the Midgar Raid.
        This hand-cannon shoots a single explosive blast that draws power from the
        Materia slotted in it, becoming considerably stronger the more they have grown.
        *Ribbon: A red ribbon Barret keeps tied in his left wrist, in honor of his
        fallen friend, Aerith. The Ribbon has a mysterious power that protects its
        wearer from all of the game''s Status Ailments. *Transforming Gatling: A new
        prosthetic arm Barret is seen with in Advent Children, presumably received
        by the same doctor who gave him his first Gatling Gun arm. Unlike his previous
        hand cannons, this weapon can transform between a large and powerful machine
        gun or a dexterous robotic hand that Barret can use for everyday activities.
        *Materia: Rarely, the Spirit Energy of Lifestream may be particularly abundant
        in an area on the Planet''s surface, and for years it can concentrate in that
        particular spot to then condense and crystalize, eventually becoming Materia.
        In the modern-day, the Shinra Electric Power Company artificially manufactures
        Materia through their extraction of Mako, the term they''ve given to the Spirit
        Energy they''ve extracted through reactors. Contained in it is the Cetra''s
        wisdom, an ancient race who were spiritually connected to the Planet and knew
        how to access its powers. Materia allows access to this knowledge to call
        upon those powers, just like the Cetra did, in many different ways, most notably
        magic. There are different kinds of Materia, represented by different colors:
        green (Magic), red (Summoning), yellow (Commands), blue (Support), and purple
        (Independent). Materia can be equipped in many different ways: Cloud and the
        party slot them into their weapons and armor, Vincent can additionally put
        them in keychains attached to his guns, Zack can carry up to six in his person,
        while the Remnants of Sephiroth, due to their nature, can absorb them directly
        into their bodies.'
