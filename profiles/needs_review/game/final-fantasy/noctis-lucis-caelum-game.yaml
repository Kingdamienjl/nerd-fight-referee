    - field: weaknesses
      value: 'Cannot use the Ring of the Lucii''s abilities on a whim, as using it
        severely damages his body and drains his life-force. The Star of the Rogue
        can be used up-close, but doing so hurts Noctis. Some of his weapons also
        decrease his resistance (Example: Katana of the Warrior decreases his resistance
        to darkness). He must be in dangerous situations to summon the Astrals Notable
        Attacks/Techniques: Armiger: Noctis channels the power of the previous kings
        of Lucis, summoning all of their weapons and drastically increasing his power
        and speed, allowing him to decimate his enemies much faster than normal. Also,
        every attack performed activates Noctis'' warp skill, making it very difficult
        to hit him. When used at maximum capacity, it also grants Noctis the ability
        to fly. * Sword of the Wise: The sword wielded by the king who erected the
        mighty walls that protect Insomnia, Noctis utilizes it to warp around his
        foes, attacking their blindspots with devastating warp-strikes. center|thumb|400px|Sword
        of the Wise * Axe of the Conqueror: A heavy axe wielded by a king known for
        his feats of arms, it is designed to wreak havoc with slow and devastating
        blows at the cost of Noctis'' defense. center|thumb|400px|Axe of the Conquerer
        * Bow of the Clever: The bow of a king known for his martial and intellectual
        prowess, it launches a constant supply of piercing arrows that can be easily
        drawn and fired while on the move. center|thumb|400px|Bow of the Clever *
        Swords of the Wanderer: A pair of swords wielded by the king said to be a
        swift as the winds themselves, they allow Noctis to unleash a deadly series
        of quick slashes and can combine for thundering attacks. thumb|center|400px|Swords
        of the Wanderer * Blade of the Mystic: A longsword wielded by the founder
        king who sought to protect the world along with the Oracle, it bolsters Noctis''
        strength while it is in hand. It also increases the wielder''s resistance
        to the powers of darkness. thumb|center|400px|Blade of the Mystic * Star of
        the Rogue: A throwing star wielded by a queen who took to the shadows and
        shunned the public''s watchful eye, it can rapidly strike a single target
        multiple times or bounce between multiple targets, and even create duplicates
        of itself. It also increases Noctis'' resistance to fire, lightning, and ice
        attacks. thumb|center|400px|Star of the Rogue * Greatsword of the Tall: A
        greatsword wielded by a king as well-built as the mountains themselves, it
        resonates in its wielder''s hand, striking its victims multiple times with
        a single swing at the expense of the wielder''s resistance to the elements.
        thumb|center|400px|Greatsword of the Tall * Shield of the Just: A shield that
        protected the queen devoted to peace and love for all, it automatically deflects
        oncoming attacks and allows Noctis to expend magical energy to quickly heal
        himself. It also raises his resistance to fire, ice, lightning, and dark attacks
        at the expense of raw offensive power. thumb|center|400px|Shield of the Just
        * Mace of the Fierce: A mace wielded by a king who was gentle to his people
        but a monster to his foes, it possesses an affinity for causing grievous harm
        to body parts and appendages, crushing them and thus rendering them useless.
        thumb|center|400px|Mace of the Fierce * Scepter of the Pious: A staff wielded
        by a king who ruled according to divine law and worked in tandem with the
        Oracle, it takes upon numerous forms to smite its foes, obliterating them
        with swords of divine light. This staff also greatly increases the wielder''s
        resistance to the powers of darkness. thumb|center|400px|Scepter of the Pious
        * Trident of the Oracle: The weapon wielded by the Oracle, who brought man
        and god together and brought comfort and tranquility to the stars above. It
        can produce holograms and afterimages of the wielder that can also attack
        foes. thumb|center|400px|Trident of the Oracle * Katana of the Warrior: An
        oriental blade wielded by the King whose Queen was taken from him too soon,
