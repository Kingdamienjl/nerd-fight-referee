  tier:
    text: '{{2-A}}, higher with Armiger Arsenal, even higher with Armiger Unleashed
      | {{2-A}}, higher with Armiger Arsenal, even higher with Arminger Unleashed
      | {{2-A}} | {{2-A}}'
    source_ids:
