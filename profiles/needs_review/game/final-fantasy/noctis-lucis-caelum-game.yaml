    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with various weapons, Hundreds of Meters with magic
      and firearms, several Kilometers with warping and Armiger Arsenal | Planetary
      as the King of Light (Eliminated the Starscourge across the entire world of
      Eos)
    source_ids:
    - vsbattles-noctis-lucis-caelum-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Noctis is an expert combatant, wielding a wide variety of different weapons
      with skillful precision, shifting between them on a whim when the situation
      calls for it. In addition, he holds perfect synergy with his three companions,
      performing various combination attacks with them by communicating with naught
      but a few words. He is also a skilled diplomat, convincing the First Secretary
      of Altissia to lend him aid in dealing with Leviathan while also minimizing
      casualties. By the time of his final battle with Ardyn, Noctis managed to defeat
      his ancestor with the full might of the kings of Lucis despite Ardyn's access
      to the Ring of the Lucii's abilities and thousands of years of experience. Lastly,
      Noctis is also proficient in the art of stealth, being able to sneak around
      heavily-guarded Imperial bases, and warp-kill targets while remaining undetected.
    source_ids:
    - vsbattles-noctis-lucis-caelum-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
