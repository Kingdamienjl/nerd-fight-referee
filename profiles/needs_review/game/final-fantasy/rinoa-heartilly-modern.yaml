    - field: weaknesses
      value: 'Artoria lacks her Saber counterpart''s Instinct, along with Avalon.
        Rhongomyniad''s activation is limited by the Thirteen Constraints of the Round
        Table, at least half of which must be released to showcase its full power.
        | The Goddess of Rhongomyniad''s immortality is linked to the spear, so, without
        it, she will eventually vanish. Notable Attacks/Techniques : === Noble Phantasms
        === video|right|400px. Rhongomyniad: The Spear That Shines To The Ends Of
        The Earth: The holy lance of King Arthur, a blessed spear regarded in the
        same light as the holy spear Longinus, that which pierced the Messiah. As
        a weapon, it is incredibly powerful, capable of instantly punching through
        Mordred''s armor to kill her in a single blow, as if there was nothing in
        its way at all. But its true power lies in its activation. The holy spear
        itself is only a shadow of the true Rhongomyniad, a tower of light that fastens
        the outer layer of the World and the Reverse Side of the World beneath it
        in place. Were this anchor to be undone, it would result in "reality" being
        torn from the surface of the World, revealing the Reverse Side of the World
        underneath it and reinstating the Age of Gods. For this reason, Rhongomyniad
        is regarded as the "spear of the end". Much like Excalibur Proto, Rhongomyniad''s
        true power is restricted by the Thirteen Restraints of the Round Table. Its
        true power only shows when half of the seals are released, showcasing the
        brilliance that exists at the Ends of the Earth. Without half of its Restraints
        released, it only showcases a tiny fragment of its true power, but even this
        has great power. The Restraints that are known thus far are: The enemy must
        be more powerful than oneself. The battle must be one-on-one. The enemy must
        not be an Elemental. The battle must be one against evil. The battle must
        not involve personal gain. The battle must not be inhumane. The battle must
        be honorable. The battle must be for the truth. The battle must be to live.
        The battle must be to save the world. === Class Skills === Magic Resistance:
        An innate ability that grants protection against magical effects. Unlike the
        Resistance effect that merely rejects Magical Energy, this ability cancels
        the spells altogether. Due to her class, Artoria''s Magic Resistance is lowered
        from a stellar A-rank to B-rank, though this is still enough to nullify spells
        with a chant below three verses, and makes it difficult for even High-Thaumaturgy
        and Greater Rituals to affect her. Riding: The ability to ride mounts. Artoria''s
        skill and experiences as a knight mean that she has ridden horses throughout
        all of her life, and summoned as a Servant, she rides the Dun Stallion so
        that she can use the full power of Rhongomyniad as a lance. With a rank of
        A, she can ride all vehicles and nearly all other animals with perfect control
        and speed that far surpasses human capabilities, though she cannot ride Phantasmal
        or Divine Beasts. === Personal Skills === Blessings from the End of the World:
        A blessing automatically given to those who wield Rhongomyniad, ranking up
        all their parameters save for Mana and Luck during battle. Charisma: The natural
        talent to command an army, which increases the ability of allies during group
        battles. It is said that a rank of B in this skill is sufficient to lead a
        nation as its King. Having once ruled Britain in a time where it was exposed
        to attacks by foreign enemies and having repelled them in turn, Artoria possesses
        such a high rank in this skill. Mana Burst: A skill that allows for an increase
        in performance by infusing one''s weapons and body with magical energy, for
        both defensive and offensive purposes, effectively recreating the effects
        of a jet burst. As a Lancer, Artoria uses this ability as she did when she
        was a Saber, using it to propel herself across the battlefield at high speeds
        while reinforcing her entire body with magical energy. With A-rank, even a
        stick can become a great weapon.'
