    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Creation (Is at least responsible
        for the creation of human life, if not the rest of the world), Invulnerability,
        Shockwave Creation (Retaliates by releasing a full-screen pulse that pushes
        back and damages all units on the board when attacked), Summoning, Duplication
        and Power Mimicry (Capable of creating clones of the player''s cats during
        this phase, which copy all of their passive abilities and spells. Harder difficulties
        also allow them to equip copies of each cat''s equipped armor and items as
        well), Immortality and Regeneration (At least Mid-Low, likely High; Begins
        regenerating from death as soon as the player leaves. Dr. Beanies states that
        his nuke had to be so strong in order to eradicate the Creator that not even
        a single atom could remain.), Transformation (Transforms into the Destroyer
        once all of the Good Cats have been defeated), Statistics Amplification (His
        Good Cat clones can spawn with Elite Buffs. Elite Buff: Damaging increases
