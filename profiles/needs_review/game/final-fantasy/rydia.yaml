  intelligence:
    text: Gifted. As one of the last remaining summoners, Rydia has mastered the art
      during her time in Feymarch, being able to call upon even the mightiest Eidolons,
      such as Leviathan and Bahamut to aid her in combat. She is also extremely skilled
      in Black Magic, learning every spell in the game short of Twin Meteor and even
      demonstrates some proficiency in White Magic. She is also somewhat proficient
      with knives, daggers, whips, and bows, though she heavily prefers to use magic.
      Is at least comparable to Cecil and Kain, who are superior in combat experience
      than the Baron knights, who are trained to analyze their targets in a few seconds
      to determine their weaknesses to take them down.
    source_ids:
    - vsbattles-rydia-final-fantasy
