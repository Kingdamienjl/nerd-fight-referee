        Eidolons, such as Leviathan and Bahamut to aid her in combat. She is also
        extremely skilled in Black Magic, learning every spell in the game short of
        Twin Meteor and even demonstrates some proficiency in White Magic. She is
        also somewhat proficient with knives, daggers, whips, and bows, though she
        heavily prefers to use magic. Is at least comparable to Cecil and Kain, who
