    - field: standard_equipment
      value: 'Rufus''s coins, Custom Shotgun: Rufus'' main weapon. A custom made shotgun
        which can split into two smaller firearms. This weapon is capable of three
        different kinds of gunfire: in its full form it can alternate between a spread
        shot like a regular shotgun or single bullets like a handgun, while in its
        split form it''s capable of rapid fire similar to a machine-gun. The weapon
        is also incredibly resistant, being capable of blocking Cloud''s sword swings
        and being useable as a melee weapon without sustaining damage nor messing
        with the mechanisms. Additionally, in its full form, Rufus can use it to create
        a small explosion to propel himself in the desired direction., Coins: Rufus
        carries with him several coins which he employs in battle to perform his different
        special moves by combining them with Spirit Energy. The coins in their designFinal
        Fantasy VII Remake: Ultimania (2020) on the front have a symbol of a sword,
        a shield and wings with the words "Shinra Inc., A New Era. Ever Forward. Reign
        Supreme.", while on the back the words "Fierce Pride" with and image of Darkstar
        and a mandragora flowers, which symbolize "fear."'
      source_id: vsbattles-rufus-shinra-remake
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted. Rufus is an very intelligent, cunning and manipulative man, capable
        of not only handling the Shinra company despite his rather young age but also
        scheme brilliantly against it before that. Despite not being a SOLDIER or
        a Turk, Rufus is an extremely skilled and technichal fighter combining precise
        gunplay and close combat to both keep his opponents at distance but also easily
        dance around their close range attacks, managing to be a very hard opponent
        to catch even for opponents with superior raw capabilities, such as Cloud.
        Rufus can flawlessly cooperate with Dark Nation for combinations and taking
        advantage of his partner's support magic, while controlling the pace and distance
        of the fight by taking advantage of his shotgun's different types of gunfire
        and its firepower to propel himself on any direction. Additionally, despite
        his focus on defensive maneuvers and counters, Rufus can be a very aggresive
        fighter if needed, propelling himself at opponents, shooting at close range
        and resorting to close combat if he deems it fitting. | Above average. Despite
        seeming like a feral animal, Dark Nation can work surprisingly well with Rufus
        in combinations and takes a very tactical approach to defend its master, being
        very obedient to commands and knowing when to retreat should Rufus deem it
        necessary.
