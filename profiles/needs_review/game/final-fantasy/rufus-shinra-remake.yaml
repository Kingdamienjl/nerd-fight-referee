- id: claim-standard-equipment-8baac9f5
  section: equipment
  axis: equipment
  text: 'Rufus Shotgun.png|Rufus'' shotgun in his complete form Rufus Two Firearms.png|Rufus
    splitting his shotgun into two firearms Rufus holding Coins.png|Rufus''s coins
    *Custom Shotgun: Rufus'' main weapon. A custom made shotgun which can split into
    two smaller firearms. This weapon is capable of three different kinds of gunfire:
    in its full form it can alternate between a spread shot like a regular shotgun
    or single bullets like a handgun, while in its split form it''s capable of rapid
    fire similar to a machine-gun. The weapon is also incredibly resistant, being
    capable of blocking Cloud''s sword swings and being useable as a melee weapon
    without sustaining damage nor messing with the mechanisms. Additionally, in its
    full form, Rufus can use it to create a small explosion to propel himself in the
    desired direction. *Coins: Rufus carries with him several coins which he employs
    in battle to perform his different special moves by combining them with Spirit
    Energy. The coins in their designFinal Fantasy VII Remake: Ultimania (2020) on
    the front have a symbol of a sword, a shield and wings with the words "Shinra
    Inc., A New Era. Ever Forward. Reign Supreme.", while on the back the words "Fierce
    Pride" with and image of Darkstar and a mandragora flowers, which symbolize "fear."'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
