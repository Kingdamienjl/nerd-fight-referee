  intelligence:
    text: Gifted. Rufus is an very intelligent, cunning and manipulative man, capable
      of not only handling the Shinra company despite his rather young age but also
      scheme brilliantly against it before that. Despite not being a SOLDIER or a
      Turk, Rufus is an extremely skilled and technichal fighter combining precise
      gunplay and close combat to both keep his opponents at distance but also easily
      dance around their close range attacks, managing to be a very hard opponent
      to catch even for opponents with superior raw capabilities, such as Cloud. Rufus
      can flawlessly cooperate with Dark Nation for combinations and taking advantage
      of his partner's support magic, while controlling the pace and distance of the
      fight by taking advantage of his shotgun's different types of gunfire and its
      firepower to propel himself on any direction. Additionally, despite his focus
      on defensive maneuvers and counters, Rufus can be a very aggresive fighter if
      needed, propelling himself at opponents, shooting at close range and resorting
      to close combat if he deems it fitting. | Above average. Despite seeming like
      a feral animal, Dark Nation can work surprisingly well with Rufus in combinations
      and takes a very tactical approach to defend its master, being very obedient
      to commands and knowing when to retreat should Rufus deem it necessary.
    source_ids:
    - vsbattles-rufus-shinra-remake-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
