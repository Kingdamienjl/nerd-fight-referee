    - field: intelligence
      value: 'Sephiroth is an individual of remarkable intellect from the very start.
        However, his fall into the Lifestream would be the turning point in which
        his knowledge would reach a level far above what would normally be possible:
        Genius (Renowned as a brilliant tactician and fighter during his days as a
        1st Class SOLDIER, Sephiroth is an unparalleled swordsman and a legendary
        war hero who ended entire conflicts virtually single-handedly. As SOLDIER''s
        top warrior he has full knowledge of combat strategy and immense amounts of
        experience from fighting all sort of enemies in many different missions, from
        stopping rebel factions, terrotist cells, slaying monsters, field testing
        new war and combat technologies, and reducing enemy armies. His aptitude and
        capabilities is such that Sephiroth could coach SOLDIER''s other ace, Zack
        Fair, and cause such inspiration on people that many aspirants joined solely
        to follow Sephiroth, including another elite of the unit, Genesis Rhapsodos.
        Aside from his military talent, Sephiroth is shown to have noticeable scientific
        intellect, being implied to be well versed in the studies Professor Hojo and
        Gast Faremis, both Shinra''s top scientists and scientific geniuses, later
        stated to be studying their research and managing to understand the entirety
        of the library in the Shinra Mansion in a matter of days, reaching incorrect
        conclusions solely due to the outdated nature of the documents.) Extraordinary
        Genius (After falling into the Lifestream, Sephiroth became a traveler of
        it, gradually absorbing more power, but more importantly, more knowledge.
        This process allowed him to attain the memories and wisdom of every living
        being that had died and returned to the Planet, accumulated within the Lifestream
        through generations since life began. Eventually, Sephiroth obtained the knowledge
        of both the Cetra and even those that came after them, surpassing the Ancient
        race that could use said knowledge to control the powers of the Planet itself,
        and finding the secrets of the life on the Planet and forbidden powers such
        as Meteor and Holy. This newfound wisdom allows Sephiroth to use Magic without
        having to resort to Materia to access the knowledge of the Cetra, even obtaining
        for himself the powers that all Materia could grant, reaching an understanding
        no living being could hope to achieve.)'
      source_id: vsbattles-sephiroth-composite
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Despite his overwhelming strength and brilliant tactics, Sephiroth is
        not invincible. Though renowned as the strongest, he does have important shortcomings
        as a warrior, most of the time that being himself: Normally Sephiroth lacks
        a true weakness as a warrior, being not only powerful without equal, but also
        absolutely pragmatic and no-nonsense, always seeking to quickly take out enemies.
        However, after Sephiroth discovered his origins, following a long episode
        of traumatic events, his worn out mental state collapsed and his ego grew
        completely out of control, developing a superiority complex and level of arrogance
        that wasn''t there before. Rather than quickly winning his battles, Sephiroth
        became more focused on showing his superiority to his opponent, made worse
        given Sephiroth''s status as unmatched in battle: as he has never been pushed
        to the limit in a fight, he has complete confidence in his strength. This
        is such that even when absolutely enraged, Sephiroth will torture and humilliate
        his enemy to try put them in their place rather than dispatching them. None
        notable. Despite implications that some of his actions were a spiteful revenge
        on a specific few, Sephiroth''s utmost priority are carrying out his plans
        of ascension, thus he fights seriously to ensure so, unlike before. Sephiroth''s
        ego and sadism are stronger than ever, spending more time focused on making
        his enemy suffer and feel powerless rather than defeating them, reason why
        he dragged for hours a fight he could have won in moments. That said, this
        behaviour was directed at Cloud, who Sephiroth had a very personal vendetta
        against and whom Sephiroth had used to focus his hatred to strengthen his
        Spirit, so it''s possible that this lack of pragmatism is directed solely
        at that specific person. Notable Attacks/Techniques: Among the cast of Final
        Fantasy VII, Sephiroth is an unique case given the varied amount of power
        sources he has access to. While he began with the same limitations as most
        others, that is having to develop techniques using his Spiritual Energy and
        rely on Materia to use Magic, as the story progressed Sephiroth got access
        to new, unnatural powers in the form of Jenova''s abilities, the knowledge
        he obtained from the Lifestream and his ascension into a baneful and abnormal
        existence within the Planet, thus gaining an unmatched power and capabilities
        nobody in his world has. Sephiroth_Energy_Blade.gif|Zanshin Sephy Thundaga.gif|Thundaga
        SephyOctaslashBetterQuality.gif|Octaslash Abilities used by Sephiroth during
        his days as a SOLDIER operative for Shinra. These are divided into three groups:
        Spiritual Energy techniques Sephiroth developed to complement his swordplay;
