  durability:
    text: 'At least Multi-Solar System level (Withstood Zack''s attacks without visible
      injuryCrisis Core -Final Fantasy VII-: Reunion (2022) or exhaustion, which would
      also include his Summons. Zack had already defeated Minerva a being superior
      to Summons, putting her above Zirconiade and thus making her far more powerful
      than Bahamut Fury and ZERO), likely Multiverse level+ (Can easily brush off
      Zack''s attacks, who is stronger than individual Weapons, with each Weapon being
      a strong opponent for Cloud, who had become far stronger since fighting in Ramza
      Beoulve''s army during his stay in Ivalice, where he could harm a full power
      Ultima, the Angel of Blood and Zodiark, the Keeper of Precepts, beings who at
      an echo of their true strength were a challenge to Balthier and Vaan, after
      they had defeated Gilgamesh) |-|Final Fantasy VII'
    source_ids:
    - vsbattles-sephiroth-composite-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: 'There are two important moments in the story that set apart Sephiroth''s
      endurance, when he was still an individual of flesh and blood and after he existed
      as a spiritual being: |-|Pre-Advent Children= Superhuman (Sephiroth has never
      shown to truly exert himself in battle, remaining unfazed even against opponents
      such as Genesis and Zack, who have managed to make Sephiroth fight seriously,
      and despite the two of them showing visible exhaustion and effort. Even detrimetal
      conditions like the seven days he spent researching the Jenova Project in the
      Nibelheim Mansion, without food or sleep, didn''t harm his performance in battle
      in the slightest against an opponent as strong as Zack, who by that time was
      the other uncontested strongest member of SOLDIER. After being impaled through
      the torso with the Buster Sword, despite visibly hurt, Sephiroth could still
      display an overwhelming power to dominate Cloud, when everyone though such injury
      would prove to be disabling to begin with. Following his fall into the Lifestream,
      Sephiroth''s made vast amounts of its knowledge his own and gained access to
      a replenishing pool of Spiritual Energy that would never exhaust through use,
      while making an active effort to rebuild his body and control the Jenova fragments
      through the Planet, all without any strain on his end) |-|Advent Children= Infinite
      (Sephiroth no longer has a physical body, being now a Spirit who had ascended
      to a separate entity from the Lifestream. Spirits are incomparably less limited
      than physical beings, lacking all of the weaknesses of the flesh. Managed to
      fight Cloud for several hours without even needing to catch his breath, despite
      his opponent''s best efforts)'
    source_ids:
    - vsbattles-sephiroth-composite-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Two important moments, before Sephiroth fell into the Lifestream and after
      doing so and absorbing the knowledge from the Planet: |-|Pre-Final Fantasy VII=Extended
      Melee Range (With the Masamune), Hundreds of Meters (With Spiritual Energy techniques
      and Magic) |-|Final Fantasy VII onwards=Multiversal+ (His influence can reach
      the living world from the Lifestream, which more than an energy current is another
      realm with differing time and space, originating universes and even reaching
      places beyond space-time altogether. Sephiroth''s Negative Lifestream was causing
      a very real danger of contaminating the entire Lifestream and Jenova had begun
      merging with it to the point the Spirits of the dead would return to her instead
      to the Planet)'
    source_ids:
    - vsbattles-sephiroth-composite-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Sephiroth is an individual of remarkable intellect from the very start.
      However, his fall into the Lifestream would be the turning point in which his
      knowledge would reach a level far above what would normally be possible: |-|Crisis
      Core & Before Crisis= Genius (Renowned as a brilliant tactician and fighter
      during his days as a 1st Class SOLDIER, Sephiroth is an unparalleled swordsman
      and a legendary war hero who ended entire conflicts virtually single-handedly.
      As SOLDIER''s top warrior he has full knowledge of combat strategy and immense
      amounts of experience from fighting all sort of enemies in many different missions,
      from stopping rebel factions, terrotist cells, slaying monsters, field testing
      new war and combat technologies, and reducing enemy armies. His aptitude and
      capabilities is such that Sephiroth could coach SOLDIER''s other ace, Zack Fair,
      and cause such inspiration on people that many aspirants joined solely to follow
      Sephiroth, including another elite of the unit, Genesis Rhapsodos. Aside from
      his military talent, Sephiroth is shown to have noticeable scientific intellect,
      being implied to be well versed in the studies Professor Hojo and Gast Faremis,
      both Shinra''s top scientists and scientific geniuses, later stated to be studying
      their research and managing to understand the entirety of the library in the
      Shinra Mansion in a matter of days, reaching incorrect conclusions solely due
      to the outdated nature of the documents.) |-|Final Fantasy VII Onwards=Extraordinary
      Genius (After falling into the Lifestream, Sephiroth became a traveler of it,
      gradually absorbing more power, but more importantly, more knowledge. This process
      allowed him to attain the memories and wisdom of every living being that had
      died and returned to the Planet, accumulated within the Lifestream through generations
      since life began. Eventually, Sephiroth obtained the knowledge of both the Cetra
      and even those that came after them, surpassing the Ancient race that could
      use said knowledge to control the powers of the Planet itself, and finding the
      secrets of the life on the Planet and forbidden powers such as Meteor and Holy.
      This newfound wisdom allows Sephiroth to use Magic without having to resort
      to Materia to access the knowledge of the Cetra, even obtaining for himself
      the powers that all Materia could grant, reaching an understanding no living
      being could hope to achieve.)'
    source_ids:
    - vsbattles-sephiroth-composite-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
