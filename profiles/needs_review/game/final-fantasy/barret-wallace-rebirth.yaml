    field_candidates:
    - field: powers_and_abilities
      value: 'From the start, Barret has two weapon abilities available: Steelskin
        and Maximum Fury. Like all the other party members, Barret can acquire more
        abilities from new weapons gained over the course of the game, as well as
        from folios. * Steelskin temporarily reduces damage taken from all sources,
        and makes it harder for Barret to flinch from enemy attacks. This effect is
        indicated by a glowing effect around his body during gameplay. * Maximum Fury
        is his primary damage-dealing move, and consumes all available ATB for a greater
        effect. Barret unloads a hail of bullets on his target, and will automatically
        switch to a different target if the current one dies. * Focused Shot, much
        like Cloud''s Focused Thrust and Tifa''s Focused Strike, is ideal for pressured
        targets. After a brief charge, Barret shoots a blast that significantly increases
        stagger against pressured foes. It is attained from Barret''s initial weapon
        Gatling Gun * Bonus Round gives Barret''s basic attacks and Overcharge a boost
        to raising stagger, indicated by a blue aura by Barret and a 60-bullet counter
        next to his Attack command. Basic attacks consume several bullets over time
        when the attack button is held down, but Overcharge consumes a bullet for
        each shot in its animation. Bonus Round is the weapon ability of the HI-Caliber
        Rifle. * Lifesaver improves Barret''s tank potential by temporarily raising
        his max health, transferring damage taken by his teammates to him, and healing
        them for that damage. This effect is demonstrated by a glowing red effect
        by his health bar. This ability can save many tough battles, as long as the
        player keeps Barret''s health topped off as they support the other teammates.
        It is tied to the Barrage Blaster. * Charging Uppercut has Barret charge towards
        a target, and release an uppercut that may launch foes into the air. This
        ability also increases Charge, and can restore Overcharge quickly if used
        with Charge normally. It is the ability of the Vulcan Cannon. * Point Blank
        consumes all available ATB for a close-range explosive blast, the recoil sending
        Barret back some. It can be useful for small targets bundled together. The
        ability is tied to Fafnir Rifle. * Smackdown has Barret strike the ground,
        hitting everything grounded in fair radius (about the size of Arcane Ward).
        While ineffective against aerial targets, it will likely interrupt and launch
        small to medium-size targets. It is tied to the Calamitous Bazooka. * Turbulent
        Spirit is Barret''s penultimate ability, and drastically increases his ATB
        charge rate temporarily. While it can only be used once per battle, it can
        save the player from loss, as Barret can quickly gain the ATB to revive and
        heal his teammates, and he has the defensive capabilities to survive on his
        own if alone. The ability is gained from Barret''s final weapon Battle Cry.
        * Lifeblood Cannon is Barret''s ultimate ability, gained from his Folio at
        Party Level 9. Barret consumes his remaining ATB and half of his remaining
        health to release a devastating shot. This ability can do a fair amount of
        damage without any buffs or debuffs applied. The main difference between this
        ability and Maximum Fury is the cost of Barret''s health, which may be detrimental
        in intense battles. Overall, Maximum Fury is better for general use, while
        Lifeblood Cannon should be used with caution.'
