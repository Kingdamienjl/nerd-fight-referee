        \ greatest kings and swordsmen, Artoria possesses unparalleled mastery of\
        \ swordsmanship, battlefield tactics, leadership, and instinctive combat.\
        \ She can overwhelm opponents through skill alone while simultaneously utilizing\
        \ immense magical energy and an extraordinarily broad supernatural arsenal.\
