    - field: weaknesses
      value: "None notable. Notable Attacks/Techniques: Curaga: Yuna significantly\
        \ heals herself or one of her allies. NulBlaze: Yuna nullifies all fire damage\
        \ for herself and her allies for one attack. NulShock: Yuna nullifies all\
        \ lightning damage for herself and her allies for one attack. NulTide: Yuna\
        \ nullifies all water damage for herself and her allies for one attack. NulFrost:\
        \ Yuna nullifies all ice damage for herself and her allies for one attack.\
        \ Esuna: Yuna removes all negative status effects on herself or one of her\
        \ allies. Life: Yuna revives one of her allies if they happen to die, though\
        \ they are nonetheless still significantly injured. Full-Life: Yuna revives\
        \ one of her allies at their full strength. Shell: Yuna enhances an ally's\
        \ magic defense, halving the damage of all spells directed at them. However,\
        \ there is also inclusive of any healing spells. Protect: Yuna enhances an\
        \ ally's physical defense, halving any damage they receive from physical attacks.\
        \ Reflect: Yuna creates a barrier around herself that automatically reflects\
        \ any spell back at her enemy. Dispel: Yuna removes any sort of buffs her\
        \ enemy has that would increase their power. Regen: Yuna casts a spell that\
        \ gradually heals herself or one of her allies over a period of time. Auto-Life:\
        \ Yuna casts a spell that ensures that, upon death, she will be automatically\
        \ revived. Holy: Yuna calls down a massive beam of holy-elemental energy to\
        \ blast her foes. Aeons: Dreams of the Fayth given physical form, Yuna is\
        \ capable partially summoning aeons for a specific ability via their glyph\
        \ or fully summon them to assist her in battle. The Aeons are capable of using\
        \ the abilities of Yuna due to her teachings, sans the Magus Sisters and Yojimbo.\
        \ \u25AAValefor: An aeon given form by the fayth of a young girl, Valefor\
        \ is a flying aeon, capable of launching hails of energy blasts on her opponent.\
        \ * Energy Ray: Valefor charges an energy beam and fires it from her mouth,\
        \ tracing a line on the ground before causing energy to erupt from it. * Energy\
        \ Blast: Valefor flies into the air and continuously hits the enemy with magical\
        \ blasts. * Sonic Wings: Valefor releases a blast of pressurized air at an\
        \ enemy, delaying an enemies next moves. \u25AAIfrit: An aeon given form by\
        \ the fayth of a crusader, Ifrit is an aeon of fire, capable of flame based\
        \ attacks and absorbing flame based attacks, even using them on himself to\
        \ heal. * Meteor Strike: Ifrit can use Meteor Strike to attack for moderate\
        \ non-elemental damage. Its damage is considered neither physical or magical\
        \ and it will be unaffected by Protect or Shell. * Hellfire: Ifrit lobs multiple\
        \ fireballs at an enemy, launching them in the air before throwing a chunk\
        \ of ground at the enemy and finishing them off with an aerial fireball. \u25AA\
        \ Ixion: An aeon given form by the fayth of a seaman, Ixion is an aeon of\
        \ lightning, capable of electric based attacks and absorbing them, even using\
        \ them on himself to heal. * Aerospark: Ixion launches lightning projectiles\
        \ at enemies, damaging them and removing any status enhancements. * Thor's\
        \ Hammer: Ixion creates an electrical field around an enemy, and sends them\
        \ crashing into others. \u25AA Shiva: An aeon given form by the fayth of a\
        \ priestess, Shiva is an aeon of ice, capable of ice based attacks and absorbing\
        \ them, healing her. * Heavenly Strike: Shiva strikes her enemy with a pillar\
        \ of ice, putting fear in their heart. * Diamond Dust: Shiva freezes the surrounding\
        \ area before letting loose an enormous blizzard. \u25AA Bahamut: An aeon\
        \ given form by the fayth of a young boy, Bahamut is an aeon in the form of\
        \ a dragon and representative of the fayth. * Impulse: Bahamut launches a\
        \ barrage of force orbs from his wings to damage and slow that bypasses resistance,\
        \ petrify, delay, reduces their vitality by 3/8ths and lower their statistics.\
        \ * Mega Flare: Bahamut charges a violent blast of nuclear energy, triggering\
        \ nuclear fusion in the target area. \u25AA Anima: An aeon given form by the\
        \ fayth of Seymour's mother, Anima is an aeon related to death and pain. *\
        \ Pain: Anima releases an explosion of energy that damages an enemy and inflicts\
        \ instant death, and bypasses resistances to it. * Oblivion: Anima sends her\
        \ opponent into her personal dimension, revealing her true form and pummeling\
        \ the enemy with a barrage of explosions that delays their next move and removes\
        \ all positive enhancements. \u25AA Yojimbo: An aeon given form by the fayth\
        \ of a crusader and his dog, Yojimbo is a ronin, acting for Yuna of his own\
        \ accord depending on how much she's paid. * Daigoro: Yojimbo sends his dog,\
        \ Daigoro to attack the enemy and inflicts poison and petrification. * Kozuka:\
        \ Yojimbo uses his throwing knives, lowering the enemies' stats, draining\
        \ their magical reserves by 1/4th, poisons them and slowing them in the flow\
        \ of time. * Wakizashi: Yojimbo unleashes a slash that rends the ground and\
        \ sky with his short sword. * Zanmato: Yojimbo summons his katana to release\
        \ a slash that inflicts instant death to all enemies. If it fails to insta"
