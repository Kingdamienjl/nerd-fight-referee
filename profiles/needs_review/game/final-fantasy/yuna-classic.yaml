      value: "\u25AA Nirvana: Yuna's Celestial Weapon, obtained in the Calm Lands\
        \ after escaping Bevelle. It naturally ignores durability, allowing her to\
        \ harm enemies regardless of attempts to increase their durability and manages\
        \ to reduce her mana usage to negligible levels. \u25AA Dresspheres: Spheres\
        \ imbued with powers and the souls of others for Yuna to utilize, these spheres\
        \ are capable to be swapped with instantly allowing for a wide range of versatility."
