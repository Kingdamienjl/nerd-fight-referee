  stamina:
    text: 'Lightning''s combat prowess and stamina evolve throughout the trilogy as
      she too evolves from a mere L''Cie to becoming something more than human and
      that of deity herself: |-|Final Fantasy XIII= Superhuman: She and her allies
      fought through the city of Eden for a better part of the day. Should also be
      comparable to other L''Cie''s such as those in the world of Orience, who are
      capable of fighting for 6 days and 7 nights |-|Final Fantasy XIII-2= At least
