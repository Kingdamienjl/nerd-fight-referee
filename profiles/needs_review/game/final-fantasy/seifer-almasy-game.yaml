      value: 'Superhuman Physical Characteristics, Chi Manipulation (Final Fantasy
        VIII''s in-game information section tells that Seifer attacks with Fire Cross
        using chi), Magic, Regeneration (Low-Mid), Power Mimicry (Via Draw) Summoning
        (Though not shown, he''s clearly Junctioned to something), Master Gunswordsmanship,
        Elemental Manipulation (Of the fire variety), Energy Blasts, Portal Creation
        (Via Bloodfest), Attack Reflection (Via Zanketsuken Reverse), Damage Boost/Explosion
        Manipulation (Via Gunblade trigger), limited Reactive Evolution (Junctioning
        can increase his resistances/change the aspect of his attacks based on what
        his opponent uses), Healing, Power Nullification (Via Dispel), Time Manipulation
        (Via Haste), limited Sealing (Can draw out and Seal enemy summons, gaining
        their power for himself), Statistics Amplification (Via Junctioning magic
        to his stats), Damage Transferal (While summoning, all damage taken is transferred
        to the GF), can use all the magic the main cast can but prefers not to. Via
        Junctioning, Seifer can gain Resistances to Time Manipulation, Time Stop,
        Sleep Manipulation, Elemental Manipulation, Poison Manipulation, Durability
        Negation, Death Manipulation, Petrification, Power Nullification (To his magic
        and limit breaks), Status Effect Inducement, Sense Manipulation (Specifically
        sight), Curse Manipulation, Statistics Reduction (Specifically his Physical/magic
        defence), Necromancy/Transmutation (Able to resist a spell that turns the
        target into a Zombie/Undead), Berserk Inducement, Mind Manipulation, Transmutation,
        and Limited BFR Resistance | Same as before Resistance to Mind Manipulation,
        Soul Manipulation (Via Zalera, the Death Serpah, who was going to absorb the
        souls of every living being on the planet), Empathic Manipulation, and Madness
        Manipulation (Type 3; Resistant to the effects of the True Moon, which is
        capable of affecting the hearts and minds of all living beings on the planetFinal
        Fantasy IV:The After Years), Gravity Manipulation (Unaffected by the gravitational
        pull of the True Moon, which even the Lunar Whale couldn''t escape from),
        Spatial Manipulation, Deconstruction, and BFR (Can withstand the attacks of
        Atomos, who manipulates space, crush enemies down to a molecular levelDissidia
        Final Fantasy, and can warp them into another dimension), Extreme Cold and
        Cosmic Radiations (Can fight and survive on the moon), Absolute Zero (Can
        survive Shiva''s ice attacks, including Diamond Dust), With Eidolons=Hellfire
        Manipulation (Via Ifrit, Phoenix, Rubicante, and Marilith), Ice Manipulation
        and Absolute Zero and Duplication (Via Shiva who''s Ice and aura are stated
        to reach Absolute Zero including her Diamond Dust, Shiva can duplicate herselfDissidia
        Final Fantasy NT), Water Manipulation (via Kraken, Cagnazzo, and Leviathan),
        Necromancy (Via Lich), Spatial Manipulation, Deconstruction, and BFR (via
