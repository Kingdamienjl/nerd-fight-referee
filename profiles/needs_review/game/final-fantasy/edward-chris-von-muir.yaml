- id: claim-powers-and-abilities-689e08c4
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Self-Sustenance (Type 1; He can breathe
    on the moon with no issues), Blessed (Is blessed by The Crystal, which grants
    him the abilities of the Crystal), Weapon Mastery (Is skilled with Daggers, Harps,
    Bows and Arrows), Non-Physical Interaction (Is capable of harming noncorporeal,
    intangible and abstract beings like Zeromus), Sound Manipulation and Empathic
    Manipulation (Can utilize the Harp for offensive capabilities, and the Harp can
    drain the victim''s willpowerFinal Fantasy IV Settings Guidebook), Soul Manipulation
    and BFR (The Requiem Harp can send souls to the afterlife,Final Fantasy IV can
    also utilize Ifrit''s hellfire, which is stated to burn the soul awayFinal Fantasy
    IV: The After Years Novel, chapter 3, page 160), Forcefield Creation (Can use
    the Elven Bow to cast Shell on himself, which protects himself from magical attacks
    via a barrier), Invulnerability and Attack Reflection (Can nullify any physical
    attacks and reflect magical attacks via the Lunar Curtain), Petrification (Can
    petrify foes with the Medusa Arrows), Holy Manipulation (via Holy Arrows), Fire
    Manipulation, Ice Manipulation and Matter Manipulation (Sub-Atomic; Has access
    to different weapons and items powered by Fire and Ice magic, Both Fire and Ice
    related abilities are stated to affect the target''s electrons, being able to
    even negate durability in the process), Resistance Negation (Can bypass the enemies
    innate resistance to status ailments and being analyzed via the Bestiary item
    and the numerous Lunar summons, which can affect Zeromus despite him being resistant
    to these effects), Electricity Manipulation and Pain Manipulation (via lightning
    arrows, which are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel,
    chapter 7, page 54), Darkness Manipulation and Perception Manipulation (via the
    Blinding arrows, which can render a foe blindFinal Fantasy V GBA Manual), Poison
    Manipulation and Corrosion Inducement (Can inflict Poison with the Poison Arrows,
    which is also stated to corrode the target), Power Nullification (Can nullify
    powers with the Silence Arrows), Madness Manipulation (Type 2) and Morality Manipulation
    (Can inflict targets with the Confuse status ailment, driving the target insane
    and attack anyone, even their allies), Death Manipulation and Blood Manipulation
    (The Assassin''s Dagger instantly kills those it strikes, and can solidify the
    target''s blood), Sleep Manipulation and Biological Manipulation (Can put enemies
    to sleep with the Dream Harp, which can affect the target''s cerebral cortex),
    Regeneration Negation (Mid-Godly) and Immortality Negation (Types 3, 4, 6, 7,
    and 9; Is capable of killing undeads and beings who resurrect in Mount Ordeals.
    Additionally, destroyed Scarmiglione whose true power manifests by coming back
    as an undead after death. Is even capable of permanently killing the Leshy creature,
    which can live on via possessing another corpse.Final Fantasy IV Settings Guidebook
    Is also capable of killing beings who are blessed with the Crystals, who grant
    these immortalities and regeneration abilities). Has gained the abilities of the
    Lunar Summons, which should grant him the following: Mind Manipulation and Age
    Manipulation (via Lunar Mist DragonFinal Fantasy IV), Earth Manipulation (via
    Lunar Titan), Fire Manipulation (via Lunar Ifrit), Ice Manipulation and Absolute
    Zero (via Lunar Shiva), Electricity Manipulation (via Lunar Ramuh), Healing, Resurrection,
    and Statistics Amplification (via Lunar Asura), Pocket Reality Manipulation (via
    Lunar Bahamut and Lunar Ramuh since they made their own pocket dimensions in their
    dungeons), Water Manipulation (via Lunar Leviathan), Death Manipulation (via Lunar
    Odin), Radiation Manipulation (via Megaflare, which is statedFinal Fantasy IV:
    The After Years Novel, chapter 5, page 270 numerous times to be a nuclear powerFinal
    Fantasy IV: The After Years Novel, chapter 5, page 271), Shapeshifting and Power
    Mimicry (Lunar Bahamut was able to shapeshift into Kain and copy his abilities)
    Resistant to the Following: Subjective Reality, Magic, Conceptual Manipulation
    (Type 2), and Space-Time Manipulation (Characters are capable of surviving and
    resisting magical abilities, Which is shown to project one''s inner mind onto
    reality, and as shown with the creation of the Devil''s road, remove entire concepts
    and warp space and time to where the past, present, and future exists as one),
    Law Manipulation (Resists magic, which can rewrite the natural order of things),
    Gravity Manipulation (Unaffected by the gravitational pull of the True Moon, which
    even the Lunar Whale couldn''t escape from), Disease Manipulation (Can remain
    in the Impact Crater for extended periods of time despite its presence rotting
    the landFinal Fantasy IV: The After Years Novel, chapter 2, page 83 and making
    it diseased), Spatial Manipulation, Deconstruction, and BFR (Can withstand the
    attacks of Atomos, who manipulates space, crush enemies down to a molecular level'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
