- id: claim-weaknesses-b78917ff
  section: weaknesses
  axis: weakness
  text: Similarly to his leader Weiss, Azul enjoys fighting strong opponents and can
    prolong fights to goad them into giving their all or trying harder instead of
    finishing them off quickly. Additionally, while his Arch Azul form gives him a
    large boost in raw strength and physical defenses, his resistance to magic remains
    the same and has a noticeable loss in speed, and the transformation can be forcefully
    broken if sustaining too much damage.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-37130327
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics; Expert Marksman; Expert in Hand-to-Hand
    Combat; Barrier Creation (Strong enough that he referred Vincent's gun as "toy");
    Energy Manipulation; Shockwave Generation; Explosion Manipulation; Transformation
    (can use a variant of Metamorphize, similar to Vincent's transformations, to become
    Arch Azul). Resistance to Mind Manipulation (despite constant Mako Baths, like
    all soldiers in Deepground, he never suffered Mako Poisoning) and Corruption (Type
    3, he never became a Makonoid even with prolongued exposure to Mako). All previous
    abilities, except for weapon related ones; Large Size (Type 0); Statistics Amplification
    and Statistics Reduction (His physical power and durability are noticeably increased,
    but is also noticeably slower); stronger Energy Manipulation; Crystal Materialization,
    Energy Projection and Homing Attack (can shoot energy crystals from his horns
    that follow his opponent)
  source_ids: *id003
  decisive: true
