power_scale:
  tier:
    text: 4-A to 3-C
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Multi-Solar System level to Galaxy level (Could match Vincent in their fight)
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ attack and reaction speed (while not as agile as his fellow
      Tsviets, still managed to fight Vincent)
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class G, likely higher (Is unfazed by Vincent's physical assaults,
      who is comparable to Tifa Lockhart being able to easily overwhelm him. As Arch
      Azul, Vincent couldn't match him in terms of strength until using Chaos)
    source_ids: &id002
    - mediawiki-3433701
    confidence: 0.95
  striking_strength:
    text: Multi-Solar System level to Galaxy level (Can hurt Vincent with his attacks
      and gunfire)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-Solar System level to Galaxy level (Can endure Weiss' moves while
      he held back, as well as Vincent's attacks)
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Very high. Like his fellow Tsviets, Azul can fight entire squadron of trained,
      and even enhanced, soldiers and monsters with little effort. In his days in
      Deepground, constant conflict was normal for its member, where Azul was one
      of the people unquestionably on the top. During the events of Dirge of Cerberus
      he engaged in fights with Vincent, a conflict between Deepground and the WRO
      and had his final battle, never showing signs of exhaustion. Azul also is very
      resillient to damage, being able to take large amounts of punishments and keep
      going; even after Chaos Vincent impaled him with his giant cannon, Azul lasted
      long enough to give one final speech.
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range with physical attacks, several Hundreds of Meters with
      his cannon and energy projectile.
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average. Azul despite his brutality and savage fighting style, is
      a very experienced warrior who has been on the battlefield for many years, facing
      many kinds of different opponents. He has shown to properly assess situations
      at hand and pick the most viable choice during missions to ensure the better
      result.
    source_ids:
    - vsbattles-azul-the-cerulean-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
