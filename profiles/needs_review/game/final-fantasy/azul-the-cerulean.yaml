      source_id: mediawiki-3433701
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: Very high. Like his fellow Tsviets, Azul can fight entire squadron of
        trained, and even enhanced, soldiers and monsters with little effort. In his
        days in Deepground, constant conflict was normal for its member, where Azul
        was one of the people unquestionably on the top. During the events of Dirge
        of Cerberus he engaged in fights with Vincent, a conflict between Deepground
        and the WRO and had his final battle, never showing signs of exhaustion. Azul
        also is very resillient to damage, being able to take large amounts of punishments
        and keep going; even after Chaos Vincent impaled him with his giant cannon,
        Azul lasted long enough to give one final speech.
      source_id: mediawiki-3433701
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Standard Melee Range with physical attacks, several Hundreds of Meters
        with his cannon and energy projectile.
      source_id: mediawiki-3433701
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'Design of Azul''s Cannon by Tetsuya Nomura, Giant Cannon: Azul''s weapon
        of choice. A massive cannon which can alternate between rapid fire akin to
        a gatling gun or slower, much more powerful shots similar to a cannon proper.
        The greatest downside of this weapon is that Azul, despite being very skilled
        with it, cannot operate as swiftly as his fellow Tsivets can fight with their
        lighter weapons.'
      source_id: mediawiki-3433701
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. Azul despite his brutality and savage fighting style,
        is a very experienced warrior who has been on the battlefield for many years,
        facing many kinds of different opponents. He has shown to properly assess
        situations at hand and pick the most viable choice during missions to ensure
        the better result.
      source_id: mediawiki-3433701
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Similarly to his leader Weiss, Azul enjoys fighting strong opponents
        and can prolong fights to goad them into giving their all or trying harder
        instead of finishing them off quickly. Additionally, resistance to magic remains
