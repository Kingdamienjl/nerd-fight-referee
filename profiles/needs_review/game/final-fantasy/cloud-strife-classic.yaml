    - field: intelligence
      value: Gifted (From the very beginning, even as an infantryman, Cloud displayed
        immense skill and natural talent for swordsmanship and battle. This, furthered
        by his military training and the memories inherited from Zack, led Cloud to
        have full grasp of every aspect of combat and strategy; including Magic, the
        use of Materia, Limit Breaks, and measures for Elemental Attributes and Ailments,
        among many other aspects, to the point, that by very early in the story, he
        could already easily defeat actual SOLDIER members. His knowledge became considerably
        more extensive thanks to his travels and encounters with more dangerous and
        powerful enemies, to the point he eventually branched from emulating Zack's
        fighting style into creating his own with the Fusion Sword, which includes
        expert use, in several different ways, of its various blades of different
        shapes and sizes. This eventually continued even after the events of the original
        game, with his delivery service requiring him to keep facing monsters and
        other dangers during the two years before his battles in Advent Children)
