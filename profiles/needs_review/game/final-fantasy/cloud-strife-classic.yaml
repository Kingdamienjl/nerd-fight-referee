    - field: weaknesses
      value: 'Lightning''s character changes and evolves throughout the events of
        the FFXIII Trilogy: |-|Final Fantasy XIII= File:Lightning_slaps_Fang.gif|thumb|300px|Lightning
        slapping Fang across the face in frustration and anger File:Lightning_promise.webp|thumb|300x|Lightning
        promising to protect Hope after he abandoned his desire for revenge File:Lightning%27s_Hope_in_Snow.gif|thumb|300x|Lightning
        reassuring Snow''s belief that they''ll see Serah again. Abandoning her nihilistic
        way of thinking. As a combatant, Lightning doesn''t showcase any real weaknesses.
        Being considered a true "Army of One", she is able to take out many armed
        and trained soldiers and officers by herself as quickly and efficiently as
        possible. However, she at this point is known to be distrustful of others,
        preferring to work alone and seeing other people as a burden. Over the course
        of the game she does open up to her allies and realizes her own shortcomings
        and arrogance, and works to better herself to protect those around her. Due
        to becoming a L''Cie for the first time, she inherited the curse of L''Cie''s
