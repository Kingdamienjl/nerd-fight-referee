    text: Moon level+ (Able to survive Orphan's Merciless Judgment) | Multiverse level+
      (Tanked Caius' most powerful magic) | Multiverse level+ (Able to withstand attacks
      from the likes of Snow Villers (Pre and Post Cieth Corruption), Noel Kriess,
      and Caius Ballad who are far superior to their XIII-2 selves | Multiverse level+
      (Able to tank attacks from Bhunivelze, including his "Hypernova" attack) | Multiverse
      level+
    source_ids:
