    - field: intelligence
      value: 'Lightning has shown to be very quick in adapting to situations and showcased
        tremendous growth throughout the events of the FFXIII trilogy. Gifted: Lightning
        who was able to obtain a high ranking office in the Guardian Corp military,
        and is an expert in regards to machinery. This includes being capable of flying
        an airship, knowing how to work mechs, and is well versed in AMP Technology.
        Which by extension requires knowledge and understanding of phase-space interference.
        Extraordinary Genius: From the very beginning, Lightning has shown to be an
        incredibly skilled combatant, and is consistently shown to be a one woman
        army, capable of taking out multiple opponents by herself. Throughout the
        trilogy, Lightning has shown to evolve and adapt as a combatant throughout
        the trilogy through facing a variety of different opponents. Through these
        experiences she has consistently shown to be able to form strategies on the
        fly, develop counter measures in split second decisions, is capable of mastering
        different weapon types within seconds of acquiring them, and has been able
        to showcase feats that would ordinarily be impossible for one to accomplish.
        Such as being able to dodge attacks from foes who are able to read her mind.
        She has also shown to be able to understand "Paradoxes". Which is a Space-Time
        transcending phenomena that causes the past and future to overlap with one
        another, bringing impossibilities into existence to exist alongside possibilities.
        Which are directly compared to the Schrodinger''s cat experiment.'
      source_id: mediawiki-cloud-strife-classic
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Lightning''s character changes and evolves throughout the events of
        the FFXIII Trilogy: File:Lightning_slaps_Fang.gif|thumb|300px|Lightning slapping
        Fang across the face in frustration and anger File:Lightning_promise.webp|thumb|300x|Lightning
        promising to protect Hope after he abandoned his desire for revenge File:Lightning%27s_Hope_in_Snow.gif|thumb|300x|Lightning
        reassuring Snow''s belief that they''ll see Serah again. Abandoning her nihilistic
        way of thinking. As a combatant, Lightning doesn''t showcase any real weaknesses.
        Being considered a true "Army of One", she is able to take out many armed
        and trained soldiers and officers by herself as quickly and efficiently as
        possible. However, she at this point is known to be distrustful of others,
        preferring to work alone and seeing other people as a burden. Over the course
        of the game she does open up to her allies and realizes her own shortcomings
        and arrogance, and works to better herself to protect those around her. Due
        to becoming a L''Cie for the first time, she inherited the curse of L''Cie''s
        fate. However, she has shown to be able to scorch her L''Cie brand white,
        meaning that she is no longer in danger of either becoming a Cie''th, or turning
        into crystal. Her "Heart" and "Soul" are formed from Chaos, which have it''s
        own benefits and shortcomings which can be read about and detailed here. Lightning
        lost her L''Cie status after the events of Final Fantasy XIII. As such, her
        only real weaknesses come from potential overuse of the "Eyes of Etro". Which
        causes one to see changes in the timeline across the past, present, and future.
        Everytime this occurs, the user''s life slowly drains away. Lightning Returns:
        Final Fantasy XIII= Now known as "The Savior", Lightning has evolved from
        her previous state to be made "more than human" and that of a god comparable
