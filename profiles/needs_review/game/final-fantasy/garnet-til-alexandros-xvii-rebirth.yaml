    - field: powers_and_abilities
      value: Garnet can use the Support school of Physical skillset up to rarity rank
        2, White Magic abilities up to rarity rank 4 and Summoning abilities up to
        rarity rank 5. Her initial Soul Break is Song of Memories, which at the expense
        of one Soul Gauge segment temporarily raises the party's attack. The staff
        Storm Staff (IX) can grant Garnet access to Judgment Bolt, which at the expense
        of one Soul Gauge segment deals heavy magic lightning damage to multiple targets.
        After Garnet's level cap is increased she automatically gains the Record Materia,
        Blessing of Alexandria, which when equipped grants the user with a one-time
        Regen per battle when the user is low on HP. Her second Record Materia, Healer,
        causes attacks to heal similar to the Support Ability of the same name in
        her original game, though the amount healed is based on the users Mind stat,
        is blocked by Silence, and targets the party member with the lowest health
        by default.
