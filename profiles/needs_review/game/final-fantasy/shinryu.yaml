    which even the Lunar Whale couldn''t escape from), Extreme Cold and Cosmic Radiations
    (Can fight and survive on the moon), Age Manipulation, Time Manipulation, Empathic
    Manipulation, Matter Manipulation (Can survive hits from Flare, which triggers
    fission reactions), Hellfire Manipulation (Can survive the heat and flames of
    Ifrit''s hellfire), Ice Manipulation, Electricity Manipulation and Pain Manipulation,
    Earth Manipulation, Water Manipulation, and Sealing (The 12 weapons are unable
    to affect himFinal Fantasy 5), Existence Erasure, Void Manipulation, Mind Manipulation,
