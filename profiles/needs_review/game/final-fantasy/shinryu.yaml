    is capable of affecting the hearts and minds of all living beings on the planet)
    All previous abilities greatly enhanced, the abilities of the crystals (The Crystal
    Core contains the powers of Neo Exdeath and God of Magic KefkaDissidia Final Fantasy
    Opera Omnia), Reality Warping (The crystal can rewrite the worldDissidia Final
    Fantasy Opera Omnia) Corruption and Body Puppetry (Ardyn was able to corrupt Caius
