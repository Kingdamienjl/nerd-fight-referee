- id: claim-powers-and-abilities-aa7297a0
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Magic, Elemental Manipulation, Poison
    Manipulation (via Bio), Telekinesis, Teleportation, Curse Manipulation, Reality
    Warping, Petrification, Status Effect Inducement, Can use her Two-hour Ability
    to cast spells without using mana for 30 seconds All previous abilities enhanced,
    possibly Immortality (Type 8,reliant on her Crystal which let Cosmos''s group
    return from fading from existence after Cosmos'' death) & Regeneration (Low-Godly),
    Summoning (Can summon various Eidolons from Summonstones and the World of Illusions),
    Willpower Manipulation (a person''s will is power there and enables them to do
    a multitude of things the stronger their willDissidia Final Fantasy Opera Omnia),
    Reactive Power Level (the greater someone''s will, the greater their powerDissidia
    Final Fantasy Opera Omnia), Law Manipulation (Beings with strong wills can overwrite
    the laws of the world and bend them to their willDissidia Final Fantasy Opera
    Omnia), Creation (With a powerful enough will, once can create various things
    such as phone lines, airships and even entire countries and worldsDissidia Final
    Fantasy Opera Omnia), Sealing (Can seal off large areas and people with her will,
    such as Cecil sealing himself in Castle Baron or the cast sealing Kefka inside
    a TorsionDissidia Final Fantasy Opera Omnia), Dimensional Travel (Characters can
    open Torsions, rifts in space-time to travel various dimensionsDissidia Final
    Fantasy Opera Omnia), and Immortality (Type 2) (Due to the crystal core of darkness''s
    influence in the hands of Ardyn, warriors will not die no matter how injured they
    are) Resistance to Mind Manipulation, Soul Manipulation (Via Zalera, the Death
    Serpah, who was going to absorb the souls of every living being on the planet),
    Corruption & Body Puppetry (Due to their light, Warriors of Materia can dispel
    attempts to control them), Empathic Manipulation, and Madness Manipulation (Type
    3; Resistant to the effects of the True Moon, which is capable of affecting the
    hearts and minds of all living beings on the planetFinal Fantasy IV: The After
    Years), Gravity Manipulation (Unaffected by the gravitational pull of the True
    Moon, which even the Lunar Whale couldn''t escape from), Spatial Manipulation,
    Deconstruction, and BFR (Can withstand the attacks of Atomos, who manipulates
    space, crush enemies down to a molecular levelDissidia Final Fantasy, and can
    warp them into another dimension), Extreme Cold and Cosmic Radiations (Can fight
    and survive on the moon), Absolute Zero (Can survive Shiva''s ice attacks, including
    Diamond Dust), Hellfire Manipulation (Via Ifrit, Phoenix, Rubicante, and Marilith),
    Ice Manipulation and Absolute Zero and Duplication (Via Shiva who''s Ice and aura
    are stated to reach Absolute Zero including her Diamond Dust, Shiva can duplicate
    herselfDissidia Final Fantasy NT), Water Manipulation (via Kraken, Cagnazzo, and
    Leviathan), Necromancy (Via Lich), Spatial Manipulation, Deconstruction, and BFR
    (via Atomos, who manipulates space, crush enemies down to a molecular levelDissidia
    Final Fantasy, and can warp them into another dimension), Death Manipulation and
    Space-Time Manipulation (Via Odin, who''s Zantetsuken instantly kills an enemy
    and opens a rift in space time to take their remainsWar of the Visions: Final
    Fantasy Brave Exvius), Matter Manipulation and Radiation Manipulation (via Megaflare,
    which is statedFinal Fantasy IV: The After Years Novel, chapter 5, page 270 numerous
    times to be a nuclear powerFinal Fantasy IV: The After Years Novel, chapter 5,
    page 271), Attack Reflection (via Carbuncle), Poison Manipulation and Corrosion
    Inducement (The Poison status effect, which is also stated to corrode the targetFinal
    Fantasy IV Series Guidebook), Darkness Manipulation and Perception Manipulation
    (The darkness status ailment via various equipment, which would render the target
    blindFinal Fantasy V GBA Manual), Power Nullification (The Silence status, which
    would render the target''s ability to use magic null), and Petrification (Via
    Malboro''s Bad Breath), Resurrection (Phoenix can revive fallen party members),
    Light Manipulation and Holy Manipulation (Via Alexander), Explosion Manipulation
    and Self-Destruction (Via Bomb), Healing (Via Sylph and Asura), Earth Manipulation
    (Via Titan), BFR (via Typhon), Soul Manipulation (Via Zalera, the Death Seraph,
    who was going to abosrb all souls on the planetFinal Fantasy XII)'
  source_ids: *id003
  decisive: true
  status: unverified
