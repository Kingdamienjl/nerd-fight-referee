    - field: standard_equipment
      value: 'Cloud.Strife.full.231922.jpg|Cloud with the Buster Sword |Cloud holding
        the Buster Sword on his back standing before the Shinra HQ |Cloud in-game
        Battle Model Buster sword 2 FF7.png|The Buster Sword in Final Fantasy VII
        Buster Sword Church.jpg|The Buster Sword design in the Compilation FFVII PG
        Ultima Weapon.png|The Ultima Weapon and its abilities UltimaWeapon-ffvii-cloud.png|The
        Ultima Weapon in Final Fantasy VII Dissidia-UltimaWeapon.png|The Ultima Weapon
        in Dissidia Materia Types.jpg|Materia types, including the unique Holy and
        Meteor Cloud Materia Menu.jpg|Cloud''s Materia Menu MateriaAC.JPG.jpg|Cloud''s
        Materia collection in Advent Children Kadaj-absorbing-a-Materia-FFVIIAC.jpg|Kadaj,
        a remnant of Sephiroth, absorbs Materia directly in his arm Complete Fusion
        Sword.jpg|The assembled Fusion Sword Fusion-Swords-Assembly-FFVIIAC.png|The
        separated blades of the Fusion Sword Cloud''s Ribbon.jpg|Cloud''s Ribbon in
        his left arm in Advent Children FF7 Ribbon.png|The Ribbon''s original design
        in Final Fantasy VII Fenrircycle 3.jpg|Fenrir First Tsurugi Fenrir.JPG.jpg|Fenrir''s
        compartments to store the blades of the Fusion Sword *Buster Sword: By far
        Cloud''s most iconic weapon. This massive broadsword with a single edge was
        formerly wielded by Angeal Hewley and then Zack Fair, who passed it to Cloud
        in his final moments, naming Cloud his legacy. *Ultima Weapon: Cloud''s strongest
        sword in the original game, obtained after defeating the Ultimate Weapon.
        This large two-edged blade has the power to increase Cloud''s physical might
        several times when he''s at full health. The effect remains active if Cloud
        sustains damage, but the more he is hurt the weaker the boost will become.
        If Cloud''s health is too low the weapon will hinder his attack instead. *Fusion
        Sword: In Advent Children, Cloud returns the Buster Sword to mark Zack''s
        grave and begins using this weapon: six smaller swords that can combine into
        a large blade resembling his original Buster Sword. Cloud has demonstrated
        excellent use of not only the complete sword but also the smaller and different
        shaped blades, by separating them mid-combat and switching to different fighting
        strategies. *Ribbon: A red ribbon Cloud keeps tied in his left arm, in honor
        to his fallen friend, Aerith. The Ribbon has a mysterious power that protects
        its wearer from all of the game''s Status Ailments. *Fenrir: Cloud''s motorcycle
        from Advent Children onward, given by an unidentified person in exchange for
        free food and drink for life at the Seventh Heaven bar. The vehicle has been
        modified to suit Cloud''s tastes, given an armor to withstand combat and compartments
        at its sides where Cloud can store the separated blades of the Fusion Sword.
        *Materia: Rarely, the Spirit Energy of Lifestream may be particularly abundant
        in an area on the Planet''s surface, and for years it can concentrate in that
        certain spot to then condense and crystalize, eventually becoming Materia.
        In the modern day, the Shinra Electric Power Company artificially manufactures
        Materia through their extraction of Mako, the term they''ve given to the Spirit
        Energy they''ve extracted through reactors. Contained in it is the wisdom
        of the Cetra, an ancient race who were spiritually connected to the Planet
        and knew how to access its powers. Materia allows access to this knowledge
        to be able to call upon those powers, just like the Cetra did, in many different
        ways, most notably Magic. There are different kinds of Materia, represented
        by different colors: green (Magic), red (Summoning), yellow (Commands), blue
        (Support) and purple (Independent). Materia can be equipped in many different
        ways: Cloud and the party slot them into their weapons and armor, Vincent
        can additionally put them in keychains attached to his guns, Zack can carry
        up to six in his person, while the Remnants of Sephiroth, due to their nature,
        can absorb them directly into their bodies.'
