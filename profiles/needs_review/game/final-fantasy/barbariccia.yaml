- id: claim-powers-and-abilities-a146c4c1
  section: abilities
  axis: hax
  text: 'Resistant to the Following: Subjective Reality, Magic, Conceptual Manipulation
    (Type 2), and Space-Time Manipulation (Characters are capable of surviving and
    resisting magical abilities, Which is shown to project one''s inner mind onto
    reality, and as shown with the creation of the Devil''s road, remove entire concepts
    and warp space and time to where the past, present, and future exists as one),
    Law Manipulation (Resists magic, which can rewrite the natural order of things),
    Information Analysis and Clairvoyance (Is unaffected by Libra, which is stated
    in lore to be a thingFinal Fantasy IV), Mind Manipulation, Empathic Manipulation,
    and Madness Manipulation (Type 3; Resistant to the effects of the True Moon, which
    is capable of affecting the hearts and minds of all living beings on the planet),
    Disease Manipulation (Is unfazed by anything from the Moon despite it''s pieces
    being able to rot the landFinal Fantasy IV: The After Years Novel, chapter 2,
    page 83 and make it diseased), Poison Manipulation and Corrosion Inducement (Can
    resist the Poison status effect, which is also stated to corrode the targetFinal
    Fantasy IV Settings Guidebook), Darkness Manipulation and Perception Manipulation
    (Can resist the darkness status ailment via various equipment, which would render
    the target blindFinal Fantasy V GBA Manual), Power Nullification (Can resist the
    Silence status, which would render the target''s ability to use magic null), Berserk
    Mode (resists the effects of the Berserk spell, which drives one to attack any
    enemy in a blinding rage), Petrification (Can resist the petrification status
    effect), Biological Manipulation (Can resist the Sleep and Hold spell, which these
    particular spells are stated to affect the brain''s fundamental functions), Death
    Manipulation and Blood Manipulation (Can resist the Death spell, which is even
    stated to solidify the victim''s blood,), Soul Manipulation/Life Force Absorption
    (Can survive Ifrit''s hellfire, which can burn the soulFinal Fantasy IV: After
    Years Novel, chapter 3, page 160, and resist the death spell, which is capable
    of reaping the souls of its victims,Final Fantasy VI is also capable of crossing
    the Devil''s Road without their life force being drainedFinal Fantasy IV), Status
    Effect Inducement (Is capable of resisting a wide variety of status ailments),
    Morality Manipulation and Madness Manipulation (Type 2; Can resist the Confuse
    status ailment, which can drive the target insane to attack anyone, even their
    allies), Sleep Manipulation (Can resist the Sleep status effect), Paralysis Inducement
    (Can resist the Paralyze status effect), Absolute Zero (Can survive Shiva''s ice
    attacks, including Diamond Dust), Transmutation (can resist the Toad and Pig spell),
    Size Manipulation (Is able to resist the Mini spell), Curse Manipulation (Is capable
    of resisting the Curse ailment) All previous abilities, plus Blessed (Is blessed
    by The Crystal, which grants her the abilities of the Crystals)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
