        she is able to use this attack as a counter move, defending against attacks
        with a magical shield before countering with an x-shaped blade of energy.
        *Firaga: Terra ignites her target in a fiery explosion. *Blizzaga: Terra fires
        a giant shard of Ice that can split into smaller shards to home in on their
        target. Alternatively, she can use multiple shards to revolve around herself.
        *Thundaga: Terra calls down contracting Lightning Bolts around her foe. *Holy:
        Terra fires orbs of holy magic at her foe that home in on their location.
        *Flare: Terra induces nuclear fusion in her target''s location, causing a
        concentrated thermal explosion. *Meltdown: Terra releases ultra-hot flame
        that envelops everything. Alternatively, she can fire off an orb of superheated
        magic. *Poison: Terra poisons his target *Bio: Terra fires a cloud of noxious
        gas to poison her target. *Quake: Terra opens up a rift in the earth to swallow
        up her foes. *Tornado: Terra summons multiple tornadoes to assault her foe.
        *Flood: Terra summons a stream of water at her target''s location. *Drain:
        Terra absorbs her target''s life energy to heal herself. *Break: Terra petrifies
        her target, allowing her to break and shatter them at her leisure. *Death:
        Terra reaps the target''s soul and solidifies their blood, killing them instantly.
        *Graviga: Terra conjures a dome of gravity over her foe, crushing them under
