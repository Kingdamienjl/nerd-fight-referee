    - field: weaknesses
      value: 'None notable Notable Attack/Techniques * Esper Form/Trance: When Terra
        absorbs enough magic from her surroundings, she is able to change into her
        Esper Form, doubling her attack potency and cutting all magical damage taken
        in half. * Riot Blade: Terra''s Desperation Attack and her EX Burst in Dissidia,
        she charges magical energy in her arms before unleashing several blades of
        magical energy that decimate targets struck. In the arcade edition of Dissidia,
        she is able to use this attack as a counter move, defending against attacks
        with a magical shield before countering with an x-shaped blade of energy.
        *Firaga: Terra ignites her target in a fiery explosion. *Blizzaga: Terra fires
        a giant shard of Ice that can split into smaller shards to home in on their
        target. Alternatively, she can use multiple shards to revolve around herself.
        *Thundaga: Terra calls down contracting Lightning Bolts around her foe. *Holy:
        Terra fires orbs of holy magic at her foe that home in on their location.
        *Flare: Terra induces nuclear fusion in her target''s location, causing a
        concentrated thermal explosion. *Meltdown: Terra releases ultra-hot flame
        that envelops everything. Alternatively, she can fire off an orb of superheated
        magic. *Poison: Terra poisons his target *Bio: Terra fires a cloud of noxious
        gas to poison her target. *Quake: Terra opens up a rift in the earth to swallow
        up her foes. *Tornado: Terra summons multiple tornadoes to assault her foe.
        *Flood: Terra summons a stream of water at her target''s location. *Drain:
        Terra absorbs her target''s life energy to heal herself. *Break: Terra petrifies
        her target, allowing her to break and shatter them at her leisure. *Death:
        Terra reaps the target''s soul and solidifies their blood, killing them instantly.
        *Graviga: Terra conjures a dome of gravity over her foe, crushing them under
        the gravity and reducing 3/4s of their HP. *Banish: Terra banishes her target
        to the void. *Meteor: Terra hails down meteors that ignore defense. *Ultima:
        Terra conjures the ultimate black magic, causing an expanding explosion that
        ignores defense. *Libra: Terra scans her target to check their hp, mp and
        current weaknesses. *Curaga: Terra heals herself and allies a large amount
        of HP *Rasp: Terra damages the target mp, draining it. *Silence: Terra silences
        the target preventing them from using abilities. *Protect: Terra raises a
        magical shield around her target that doubles physical defense. *Shell: Terra
        raises a magical shield around her target that doubles magical defense. *Reflect:
        Terra places a barrier around her target that reflects magic back at the caster.
        *Hastega: Terra manipulates time to speed up himself and allies. *Slowga:
        Terra manipulates time to slow down her targets *Imp: Terra transforms her
        target into an imp. *Float: Terra casts a spell that allows her to levitate
        in mid-air. *Vanish: Terra casts a spell that allows her to become invisible.
        *Teleport: Terra casts a spell that enables her to teleport. *Quick: Terra
        stops time for everyone in her range. *Sleep: Terra casts a spell to make
        her target fall asleep. *Confuse: Terra casts a spell on her target that causes
        them to become unable to differentiate friend from foe and attack allies.
        *Berserk: Terra casts a spell that can drive her target berserk. *Dispel:
        Terra cancels out the effects of abilities. *Valor: Terra doubles the damage
        of the next attack of the target. *Silver Spectacles: Silver Rimmed glasses
        that protect against blind *Star Pendant: Star Shaped pendant with a jewel
        in the center that protects against poison. *Jeweled Ring: A ring with a large
        gem that protects against petrify. *Fairy Ring: Ring imbued with a fairy''s
        magic that prevents poison and blind. *Peace Ring: Ring that soothes the user''s
        mind, protecting them from Berserk and Confuse *Amulet: Protective Charm that
        prevents Zombification, Poison, and Blind *White Cape: Flowing white cape
        that protects against Silence and Impification *Safety Bit: A small sphere
        that spins around the user''s hand, that protects against petrification, zombification,
        and death. *Memento Ring: A ring blessed by the love of a passed mother that
        protects against petrification, zombification, and instant death. *Ribbon:
        A silk ribbon that protects against all status ailments, including Sleep and
        Sap. *Protect Ring: A ring that automatically enchants protect on the user.
        *Reflect Ring: A silver ring that automatically enchants Reflect on the user.
        *Angel Wings: Rumored Angel Wings that automatically enchants float on the
        user. *Angel Ring: Ring encrusted with Angel Wings that automatically enchants
        Regen on the user. *Hermes Sandals: Winged Sandals that automatically enchant
        Haste on the user. *Guard Bracelet: Bracelet that automatically enchants the
        user with Protect and Shell. *Miracle Shoes: Marvelous Shoes that enchant
        a bevy of enhancements on the user such as Haste, Protect, Shell and Regen.
        *Soul of Thamasa: A gembox that enables dualcast, allowing the user to cast
        2 separ'
