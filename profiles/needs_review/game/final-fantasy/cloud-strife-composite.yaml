      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Is childish and won''t take many things too seriously. Feats: *Tanked
        the destruction of Bikini Bottom *Destroyed the universe and moved in the
        void left behind Note: Spongebob, while an inconsistent show, only really
        shows inconsistences with his lifting strength, rather than his actual AP.
        As shown when he can''t even lift a stick with marshmallows, yet in other
        instances can unravel the entire universe. Him taking damage from characters
        in Bikini Bottom just means they scale to him, and him taking damage from
        land animals just means those land animals scale to Spongebob, and said animals
        have shown feats beyond what land animals should be capable of. Humans in
        Spongebob also are not like regular humans, as shown with David Hasselhoff,
        Patchy the Pirate and other notable human characters. Note 2: The canon of
        Spongebob is difficult to pinpoint with some writers believing there is no
        one canon, however, future episodes make numerous references to past episodes,
        as well as references to the video games to which BFBB and Cosmic Shake are
        "canon" to each other, with certain episodes of the show and movies clearly
        being events in different timelines (Sponge On The Run movie), as there are
        infinite timelines in Spongebob. It has been recently confirmed that certain
        movies and spin offs like Sponge on the Run and The Patrick Star Show are
        in fact in different timelines. For simplicities sake, and for the sake of
        arguments, this is a (mostly) composite profile on Spongebob, though most
        of the stuff is from accepted canonical variations of the show (The TV show
        and the comic books).'
      source_id: character-stats-profiles-cloud-strife-composite-final-fantasy
      provider_id: character_stats_profiles
      authority: high
