  intelligence:
    text: At least Gifted (Chaos is an extremely skilled physical combatant and magic
      user, being able to fend off all of the Warriors of Cosmos at once (all of whom
      are skilled fighters in their own right) and would have done so with ease had
      it not been for their Crystals (evident in the twelfth cycle by his casual defeat
      of Cloud). In addition, he is a capable strategist, having won several cycles
      against Cosmos despite the fact that his warriors had been plotting against
      him all the while. While Cosmos never confronted the enemy personally with the
      exception of the twelfth cycle, Chaos was more than willing to confront Cosmos
      personally and kill her to preemptively end the conflict, an act that none of
      the Warriors of Cosmos anticipated)
