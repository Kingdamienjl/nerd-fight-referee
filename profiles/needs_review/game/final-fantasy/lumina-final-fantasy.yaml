        ultimately Valhala through The Void Beyond-a plane that encompasses past and
        future, causing them to intersect, as well as Extradimensional spaces known
        as Temporal rifts- while still existing as a part of Valhala and simply nothing
        but a Shadow of it. In addition to the infinite possible worlds, impossible
        worlds also exist within the Fabula Cosmology as the Paradox Scope could cause
        the creation of impossible worlds by bending the laws of the Fabula universe.
        Also in Valhala, impossible things such as fictional beings existing on the
