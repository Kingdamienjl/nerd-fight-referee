        of her resistances, although they can be changed when she wants them to. Changing
        her resistances or Junctioning an ability to her strikes locks it out from
        being used elsewhere (Can''t have Death junctioned to his attacks and resistances
        at the same time as an example) Notable Attacks/Techniques: *Draw and Stock/Cast:
