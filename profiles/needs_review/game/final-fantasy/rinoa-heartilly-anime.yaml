    - field: weaknesses
      value: 'Junctioning Guardian Forces causes memory loss, has a limited stock
        of spells to use. Rinoa must be hard-pressed to use her Limit Breaks unless
        she has buffed herself with Aura. She has to manually decide between some
        of her resistances, although they can be changed when she wants them to. Changing
        her resistances or Junctioning an ability to her strikes locks it out from
        being used elsewhere (Can''t have Death junctioned to his attacks and resistances
        at the same time as an example) Notable Attacks/Techniques: *Draw and Stock/Cast:
        Rinoa can absorb the energy from an opponent to recreate their magical powers.
        She can use this absorbed energy offensively to use the same ability on an
        opponent, or She can Junction it to become resistant/immune/strengthened by
        it. *Junction: Able to increase her statistics via absorbing Guardian forces/Summons.
        Can grant herself resistance/immunity to effects of magic and energy she has
        absorbed from her enemies. *Guardian Forces (GFs): Guardian Forces are mystical
        entities that claim dominion over the elements. Rinoa''s superhuman abilities
        are a direct result of being junctioned to multiple Guardian Forces, which
        she can temporarily manifest in a battle to assist her in combat. - Sorcery'
