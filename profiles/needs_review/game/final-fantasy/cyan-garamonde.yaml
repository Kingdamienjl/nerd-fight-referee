- id: claim-powers-and-abilities-0706bc74
  section: abilities
  axis: hax
  text: 'Resistance to Absorption (Can harm Kefka with magic after he absorbs the
    goddess statue which is stated and shown to absorb magicFinal Fantasy 6), Subjective
    Reality, Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation
    (Characters are capable of surviving and resisting magical abilities, Which is
    shown to project one''s inner mind onto reality, and as shown with the creation
    of the Devil''s road, remove entire concepts and warp space and time to where
    the past, present, and future exists as one), Law Manipulation (Resists magic,
    which can rewrite the natural order of things), Dream Manipulation and Soul Manipulation
    (Is unfazed by the dream stooges ability to go into dreams and take their soulsFinal
    Fantasy 6), Hellfire Manipulation (Via Ifrit), and Absolute Zero (Via Shiva. Her
    ice and aura are stated to reach absolute zero including Diamond Dust), Power
    Mimicry (His Desperation Attacks cannot be copied by Mimics) Resistant to the
    Following: Status Effect Inducement (can resist a wide variety of status ailments
    in the game), Darkness Manipulation and Perception Manipulation (Can resist the
    darkness status ailment via various equipment, which would render the target blindFinal
    Fantasy V GBA Manual), Poison Manipulation, Disease Manipulation and Corrosion
    Inducement (Can resist the Poison and bio spell, which is stated to corrode the
    target, and inflict the target with a disease respectively), Berserk Mode (Can
    resist the Berserk status effect), Death Manipulation and Blood Manipulation (Can
    resist the Death spell, which is even stated to solidify the victim''s blood,),
    Necromancy (Can resist the Zombification status effect), Transmutation (Can resist
    the Imp status effect), Power Nullification (Can resist the Silence status effect,
    which render one''s abilities null), Madness Manipulation (Type 2) and Morality
    Manipulation (Can resist the Confuse status ailment, which drives the target insane
    and attack anyone, even their allies), Sleep Manipulation and Biological Manipulation
    (Can resist the Sleep spell, which can affect the target''s cerebral cortex),
    Life Manipulation (Can resist the Sap status effect) Resistant to the Following:
    Fire Manipulation, Ice Manipulation, and Matter Manipulation (Sub-Atomic; Is capable
    of resisting the Fire and Ice spell, which is capable of affecting the target''s
    electrons), Electricity Manipulation and Pain Manipulation (Is able to resist
    the Lightning spells, which is capable of attacking the nerves), Earth Manipulation,
    Air Manipulation, Water Manipulation, Holy Manipulation (via Several armors and
    shields) Summoning (Can summon Espers to aid her), Electricity Manipulation, Fire
    Manipulation, Ice Manipulation, (Several Espers teach magic of the Fire, Ice,
    and Thunder variety), Intangibility (Ifrit can become smoke or flameWar of the
    Visions: Final Fantasy Brave Exvius), Water Manipulation, Transmutation (Ragnarok
    turns enemies into items and imp spell turns enemies into imps), Resurrection
    (Via Phoenix), Hellfire Manipulation (Via Ifrit) Holy Manipulation (Via Alexander),
    Air Manipulation, Earth Manipulation, Absorption, Invisibility, Afterimage Creation
    (Via Fenrir''s Howling Moon), Healing'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
