    confidence: 0.8
  attack_potency:
    text: Varies between Below Average Human Level to Human Level (Yuels physically
      are average girls that are fated to die at a young age due to their nature as
      a Seeress, which cause them to utilize the "Eyes of Etro" more than anyone else,
      with each time slowly draining their life away. Depending on the incarnation,
      the Yuels can range from functioning normally to having a limp when doing basic
      tasks such as walking and running), Multiverse Level+ with the Unseen Chaos
      (As a now embodiment of the Unseen Chaos itself, she holds a high command over
      it, which originates from the Unseen Realm. The highest of dimensions where
      the concepts of Space-Time and Form are non-existent due to transcending them,
      along with the space-time, concepts, information, memories, and stories that
      make up "lower worlds", completely inaccessible with the exception of Etro opening
      her gate to let souls pass through, which are confirmed to be one's concept.
      This extends to Valhalla. A infinite world that is stated numerous times to
      exist beyond space-time and operates on a different plane of existence. Valhalla
      gives births to infinite possibilities which are manifested as timelines contained
      within the Historia Crux. From Valhalla you can view every timeline contained
      within the Historia Crux and are referred to as a mere "Shadow". The Historia
      Crux is a structure called a "Nowhere Space", that contains and connects three
      structures of infinite multiverses Including the Void, which harbors Extradimensional
      spaces The Spiral which contains countless worlds, and FFXIII's infinite number
      of timelines formulated by possibilities)
