    - field: weaknesses
      value: 'She has limited control over the game at first, only being capable of
        slightly affecting beings, though by the end of the game she can manipulate
        and even destroy the script at will. Note: Contrary to popular belief, the
        fictionality of the DDLC world doesn''t make it only as big as it normally
        showed to be (akin to a theater only having the locations it showed to the
        audience but not more than what''s shown, and with the things shown being
        fake), it has been referenced a few times that the DDLC characters exist in
        a universe/reality, this one showed to have space with dozens of stars in
        it and its own flow of time, things unrelated to the fake stage play-like
        dynamic the game was supposed to provide without Monika''s interventions.
        The space with stars in it and the flow of time are shown and referenced in-game,
        but not as something that was meant to be explored in regular circumstances
        in the game as a date simulator, thus implying that there is no reason for
        the reality in DDLC has to be lesser than a normal universe (the fake aspects
        of it come from how the beings in it were programed and how events and things
        were constructed to organize a date simulator, without the reality in which
        everything is in being lesser for it). Notable Attacks/Techniques: * Script:
        She can edit the "script" of the game at will, therefore deciding every event
        that happens within the game. At her maximum potential, she could accidentally
        force the Player to stay inside the classroom and next to Yuri''s corpse for
        two days straight, and she could drastically alter the behavior and personality
        of her friends. She can even completely erase the script, leaving the world
        as a timeless place where nothing can happen against her will. * Erasure:
        She can "erase" the file of anyone, which results in their erasure of the
        entire history of the world, leaving it to adapt to their absence. However,
        Monika herself is unaffected and can still remember their existence and bring
        them back at will. * Non-Corporeal: Through unknown means, Monika managed
        to keep her conscience and ability to affect reality even after having her
        file (and thus, her entire existence) was deleted. Though not demonstrated
        directly in-game (due to her accepting her fate), she can likely bring her
        file back to existence as she did with her friends, as long as she keeps a
        "back up" of her file. == Others == Notable Victories: Notable Losses: Inconclusive
        Matches: Category:Instinct44 Category:Tier 2'
