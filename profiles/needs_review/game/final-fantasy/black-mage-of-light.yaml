      value: At least Multi-Solar System level (Holds control of Naraku, the greatest
        and most difficult dungeon to ever exist, eclipsing even Dagas, a 5-floor
        dungeon where each floor contains a sun at the day and a sky with countless
        stars at night. Dungeon Cores are also stated to absorb their energy from
        the stars and Mana. Garou stated that Light alone would be able to destroy
        1 3rd, if not 1/2 of the world all by himself. Though this was a rough estimation
        considering the fact that Garou did not witness the full potential of Light
        given the fact that all of his feats thus far was performed in an extremely
        casual manner. It was specifically stated that if left alone, the Master could
        destroy the world). Multiverse level with Gungnir Shinto Burial 1st Seal Removal
        (Gungnir Shinto Burial is stated to be a spear that can bury gods and angels
        alike. This would also include the Goddess of Light, who created the entire
        world, as well as the Evil God, who created countless dungeons throughout
        the entire world, where each world presumably contains suns and starry skies).
        Unknown with Infinite Gacha (Infinite Gacha produces cards of various strengths
        and effects that not even Light can predict anything about it)
