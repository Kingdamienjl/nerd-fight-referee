- id: claim-powers-and-abilities-d0c1bedf
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Magic (Especially Dark Magic), Fire Manipulation,
    Lightning Manipulation, Weather Manipulation (Can conjure storm clouds and large
    thunderstorms. Her D-Link has the Thunderchaser technique which can summon a small
    thunderstorm cloud that fires powerful bolts of lightning at enemies below), Plant
    Manipulation (Can control and conjure thorns), KH Darkness (Has highly developed
    control over the power of Darkness), Telekinesis (Mentally moved her platform
    during her fight with Sora and his friends. Telekinetically moved Data-Sora's
    Keyblade), Forcefield Creation (Erected a large wall of green flame to block access
    to the Forbidden Mountains in her homeworld. Conjured a forcefield to protect
    her platform in the first game), Curse Manipulation, Death Manipulation & Sleep
    Manipulation (Via the Sleeping Curse and her spells. Can inflict curses that can
    instantly kill or knock her opponents unconscious for indefinite periods of time),
    Limited Fate Manipulation (Her curse on Aurora guaranteed that she would prick
    her hand on the needle no matter what she would do), Creation (Conjured a spinning
    wheel), Resurrection (Brought Oogie Boogie back from the dead), Light Manipulation
    (Used the light from the orb at the top of her scepter to hypnotize Aurora), Invisibility
    (Turned invisible to hypnotize Aurora), Transformation & Intangibility (Can turn
    into an orb of green fire, making her intangible. can also turn into a disc of
    energy), Life Absorption (Her D-Link (Her power summoned by someone else) has
    the Drain ability which allows the user to absorb health from enemies with their
    attacks), Paralysis Inducement (Her D-Link has the Binding Strike technique which
    binds some enemies in place), Status Effect Inducement (Her D-Link has the Blackout
    spell which blinds enemies), Power Bestowal (Granted the power to control the
    Heartless to Riku), BFR (Banished Aqua to her dungeons), Regeneration (Low-Godly;
    can restore her physical form over time as long as someone remembers her), Non-Physical
    Interaction (Can harm Nobodies and Heartless), Immortality Negation (Type 5; Can
    destroy the skeletal forms of the pirates despite them being neither alive nor
    dead), Animal Manipulation (Can command her raven Diablo), Precognition & Illusion
    Creation (Showed Prince Philip visions of an old, decrepit future version of him),
    Clairvoyance (Used Magic to allow herself and the Council of Villains to watch
    over Sora and his friends's progress from Hollow Bastion), Astral Projection (Used
    her powers to check on the progress of her takeover of Disney Castle), Flight
    (By turning into a disc of energy and an orb of green fire), Teleportation (Can
    teleport through green fire and Darkness), Dimensional Travel (Can travel between
    worlds with the Corridors of Darkness and also by herself), Time Travel by giving
    up her body Superhuman Physical Characteristics, Bodily Weaponry (Claws, fangs
    and tail), Shockwave Inducement (Can generate powerful shockwaves by slamming
    the ground with her limbs or her whole body), Breath Attack (Can breath green
    fire), Fire Manipulation, Homing Attack (Can spew floating orbs of fire that home
    in on her enemies in battle), Flight (With her wings), Large Size (Type 1) Resistance
    to Absorption & Death Manipulation (Unaffected by Heartless, which passively kill
    and absorb things around them), Data Manipulation (Ansem The Wise stated that
    the "heart" cannot be contained by data, and that the process itself would be
    incalculable), Existence Erasure (Can take hits from Heartless, which can do this
    with any attack), Darkness Manipulation, Cosmic Radiations, and Corruption (Type
    2) (Unaffected by the corrupting effects of the darkness of the Dark Corridors)
  source_ids: *id003
