  speed:
    text: Infinite (Able to keep up with Ventus, who is regarded as one of the fastest
      characters in the series, comparable to others that can travel across the worlds
      with a Keyblade Glider, which has been shown to also relate to direct physical
      movements and is comparable to the Gummi Ship based on Aqua and Ventus getting
      to the Keyblade Graveyard within a day just like it while also including the
      threat of Gummi Heartless, not far behind Sora, who reacted to a Keyblade beam
      from Xehanort of a similar nature as this one)
