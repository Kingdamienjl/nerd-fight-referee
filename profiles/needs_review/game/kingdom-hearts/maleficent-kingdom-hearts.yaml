  range:
    text: Standard Melee Range with staff. Extended Melee Range as a dragon. Planetary
      with magic. Low Multiversal with the Corridors of Darkness.
    source_ids:
    - mediawiki-247288
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted. Maleficent is a conniving schemer who manipulated many of the events
      of the first game, easily swaying Riku to her side while convincing him that
      she cared about helping him find Kairi and serving as an obstacle to Sora at
      every turn through her actions or by getting the other Disney Villains to attack
      him for her. In combat she is easily one of the most powerful magic wielders
      in the entire series, quickly casting powerful spells like Meteor and is only
      rivaled by the likes of Aqua and Xehanort in this regard. Also, despite not
      being a physical combattant and relying entirely on her dark Magic to fight
      in her base form, she still displays enough skills at using her staff to repel
      and block attacks from foes, including powerful Keyblade wielders such as Lauriam.
      However, she suffers from an incredible superiority complex, always looking
      down upon her foes and underestimating their power and potential, which has
      led to her defeat on numerous occasions.
    source_ids:
    - mediawiki-247288
    confidence: 0.6
    notes: auto_repair source extraction
