    text: Goofy, despite his name and reputation, is surprisingly perceptive and intelligent,
      deducing Mulan's gender when it had eluded both Sora and Donald and placing
      his trust in Pluto while searching for Sora when Donald blew the dog off. He
      also displays greater common sense and holds his composure together more easily
      than his compatriots, urging them to look before they leap when they pounced
