        which uses ice and can potentially freeze enemies), Damage Reduction (Via
        Damage Control which halves the damage he takes if he's at low health, Via
        the Majestic Mushroom shield and the Ultimate Mushroom shield which have the
        Protect and Protectga abilities that reduce the damage their user takes, His
        D-Link has the Protect ability which reduces damage from physical attacks
        by 50%), Status Effect Inducement (His D-Link has the Stun Boost ability which
        increases the chance of stunning opponents with attacks, His D-Link has the
        Confusion Strike technique which has a chance of confusing enemies), Is able
