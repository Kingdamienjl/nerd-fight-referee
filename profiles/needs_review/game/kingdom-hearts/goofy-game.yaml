    - field: intelligence
      value: Goofy, despite his name and reputation, is surprisingly perceptive and
        intelligent, deducing Mulan's gender when it had eluded both Sora and Donald
        and placing his trust in Pluto while searching for Sora when Donald blew the
        dog off. He also displays greater common sense and holds his composure together
        more easily than his compatriots, urging them to look before they leap when
        they pounced upon Mushu. Despite this, he is rather clumsy and often gets
        into bad situations due to stumbling or pressing the wrong button at the wrong
        time
      source_id: vsbattles-goofy-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Most of his abilities are geared towards supporting his allies rather
        than direct fighting. Is somewhat of a pacifist and prefers the peaceful solution
        to a problem rather than engaging in combat. Does not have much to go by other
        than physical combat via his shield since his magic is much more limited in
        usability than other characters. One of his limit attacks requires Sora to
        be with him to use in battle Notable Attacks/Techniques: *Rocket: Goofy leaps
        at an airborne enemy and attacks with his shield. *Charge: Goofy charges his
        attack and unleashes it by bashing his shield at the target. *Tornado: Uses
        a spinning attack that inflicts multiple hits at the enemy. *Goofy Bash: Throws
        his shield as a projectile that hits a target from afar. *Goofy Turbo: Goofy
        rides on his shield and proceeds to slide across the field while dealing damage
        to enemies. *MP Gift: Transfers his mana to another person or teammate. *Evolution:
        In exchange for sacrificing all his mana, Goofy can restore all of the health
        of the team back up. *Tornado Fusion: One of Goofy''s limit attacks, where
        he and Sora attack enemies by spinning rapidly. *Teamwork: Another of Goofy''s
        limit attacks. He and Sora first start by throwing their weapons at the enemies,
        then the attack ends with Sora shooting him like a rocket. In 358/2 days,
        Goofy is shown being able to propel himself without Sora''s aid. Here he shoots
        at short distances around the field, dealing heavy damage to enemies that
        get in his way. ==Gallery== {{Scroll box|content= Goofy TR KHII.png|Timeless
