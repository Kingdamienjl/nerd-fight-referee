    - field: standard_equipment
      value: 'Various recovery items such as Potions, Ethers, and Elixirs, Keychains
        that allow him to modify his Keyblade *Keyblade: Through channeling one''s
        strength of heart, the user can summon a Keyblade to use in battle. Ven''s
        Keyblade is the Wayward Wind, a weapon from the realm of light. Through use
        of the Keyblade, the user is granted increased strength, speed, durability,
        and increased magical power. Like his friends Aqua and Terra, Ventus is able
        to turn his Keyblade into a Keyblade Glider, taking the form of a hoverboard
        that he can use to cross distances at high speeds and assault foes by performing
        various tricks such as spinning the board around. His personal Keyblade, the
        Wayward Wind is somewhat lacking in reach, but makes up for it with a slight
        increase to strength and magic. He later obtains the Lost Memory after regaining
        his memories of his time as Xehanort''s apprentice. It is a Keyblade with
        much longer reach and greatly improved physical and magical boosts in addition
        to being optimized to score more critically damaging blows on enemies. * Keyblade
        Armor: Normally kept as a simple shoulder plate when not in use, Ventus can
        activate it at any time by placing his hand on it, covering him from head
        to toe in a futuristic suit of armor with silver, olive, and gold highlights.
        This suit of armor protects Ventus from the Darkness and attacks that would
        directly target the Heart (soul) in addition to letting him survive the vacuum
        of space. However, it is not an absolute defense, as it was eventually corrupted
        by Xehanort''s darkness while protecting Sora and is later destroyed by Riku.'
      source_id: vsbattles-ventus-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Like Sora, Ventus is naive, cheerful, and overly-friendly at times. As
        a result, he is somewhat easy to manipulate by those willing to prey on his
        sheer kindness. However, his kindness belies his prodigious use of the Keyblade,
        with Eraqus noting that his age is his sole barrier to being declared a Keyblade
        Master. Wielding his Keyblade in a unique reverse-grip, Ventus compensates
        for his relatively weak physical and magical prowess by unleashing aggressive
        flurries of swift strikes and conducting various acrobatic maneuvers to throw
        foes off guard. True to his name, he specializes in the use of wind and light,
        with the latter being a direct result of his purity of heart, controlling
        the battlefield with wide-reaching tornadoes and decimating foes with powerful
        blasts of light. However, for all his skill, he remains inexperienced, as
        a result, more experienced fighters can read his moves and catch him off guard,
        as Xehanort did during their battle at the Keyblade Graveyard
      source_id: vsbattles-ventus-game-kingdom-hearts
