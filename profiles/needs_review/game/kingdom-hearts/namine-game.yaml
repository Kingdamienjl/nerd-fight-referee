    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Demyx is easily the most laid-back, slothful, cowardly, and self-centered
      member of the Organization. Blowing off missions whenever possible, he has very
      little actual combat experience compared to members such as Lexaeus, Axel, or
      Roxas. Nevertheless, he remains formidable in combat, specializing in stalling
      tactics that prevent the opponent from ever reaching him during their fights,
      constantly knocking back foes with torrents of water and absorbing incoming
      attacks with Water Forms. In addition, he is shown to have some skill in melee
      combat, stunning foes by bludgeoning them with his Sitar, but this more of a
      last resort than anything. In addition, Axel's comments indicate that Demyx
      is reconnaissance specialist, implying that he's skilled at tracking, studying,
      and following opponents without being seen, but the validity of this is somewhat
      questionable due to Saix's complaints about his terrible mission reports.
    source_ids:
    - vsbattles-namine-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
