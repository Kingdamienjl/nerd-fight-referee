    - field: intelligence
      value: Luxord is arguably the most genteel member of Organization XIII. He proved
        himself to be level-headed and pragmatic in combat, facing Sora one-on-one
        by teleporting his friends away with his cards and turning Sora into a defenseless
        die at the very start of the fight. While he tends to treat life as if it
        were a game (even calling himself a mere pawn in the Organization's plan),
        he is possesses a sharp mind and a keen eye for strategy, stalling out Sora
        with various minigames that force the latter to take massive risks to even
        land a hit on him. True to his epithet, Luxord is also an exceedingly skilled
        card game player, with Xigbar noting that Roxas would be "eaten alive" in
        a game of strip poker, utilizing this trait in combat to make his various
        stall tactics even more difficult. In addition to his gambling prowess, he
        is also proficient in direct combat, shooting energy projectiles from giant
        versions of his cards and using the cards themselves as projectiles and as
        melee weapons
      source_id: mediawiki-namine-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'His obsession with playing games can backfire on him, his "timed battle"
        mechanic also works on himself as well as his enemy, Luxord needs to be hard
        pressed to use his Final Limit Notable Attacks and Techniques: BeginGame.gif|Begin
        Game BeginGameEX.gif|Begin Game Part II *Timed Battles: The central mechanic
        behind Luxord''s battles. Luxord manipulates time so that he does not take
        damage from attacks and instead the damage is directed to a "Time Gauge",
        referring to his own time. He does the same for his opponent, except for the
        fact that they will take damage from Luxord''s attacks. The Time Gauges whittle
        down over time, much like a timer or an hourglass. If Luxord is struck, his
        time is depleted, while the same rules apply to his opponent. Running out
        of time will cause the victim to instantly "lose", draining them of all their
        stamina and rendering them virtually helpless, leaving them open to being
        finished by their opponent''s next attack. *Begin Game: Luxord challenges
        his foe to what amounts to a game of slots, forcing them to snatch just the
        right card from him (an "O") from a set that includes three duds ("X"s). If
        they succeed, Luxord will be temporarily left wide open to follow up attacks.
        However, failing this game will temporarily transform his target into a card
        or a die, sealing all of their abilities and hindering their movement temporarily.
        When hard-pressed he will instead trap his opponent in a stack of his giant
        cards, forcing them to seize four correct cards lest they be transformed into
        a die in additional to draining large portion of their Time Gauge in order
        to restore Luxord''s own. However, winning the battle here instead will allow
        his targets to restore their Time Gauge by draining Luxord''s, leaving him
        next to no time left in his. *Card Shield: Luxord constantly protects himself
        from incoming attacks with giant versions of his normal cards. They can be
        destroyed with sufficiently powerful attacks or by simply flipping them around.
        Luxord is fully aware of this, and thus booby-trapped several of his cards
        with fireball sigils to set them to detonate should they be flipped around.
        His opponent is thus forced to choose whether or not they''re willing to whittle
        down his cards and take projectile attacks from him or close in for the kill
        by trying to flip his cards over. In addition, he can send these cards out
        as projectiles to attack and spin them around to knock away approaching enemies.
        *Card Shuffle: Luxord transforms himself into a card that he shuffles amongst
        the other cards. The cards are virtually indestructible, forcing the opponent
        to watch carefully and flip up the card Luxord is hiding in to bring him back
        to a state where he can be damaged in addition to stunning him. Flipping the
        wrong one will trigger a booby trap that explodes in the opponent''s face
        to deal damage. Luxord becomes warier if he''s continually found, summoning
        more trap cards to hide among and making it more difficult for his opponent
        to find him. *Sleight of Hand: Luxord covers the area with cards and hiding
        among them similarly to his Card Shuffle technique. He then goes on the offensive,
        appearing from various locations and throwing giant cards at his opponents
        and flipping nearby cards around to knock his opponents into the air. *Jackpot:
        Luxord''s Limit Break in which he is the one gambling, being forced to snatch
        a rapidly shifting card to achieve the best effects. Should he happen to select
        the wrong one, the card simply detonates as Luxord winces. However, should
        he choose the right one (which he frequently does), the cards fire off several
        powerful energy projectiles at his targets. **Final Jackpot: Luxord''s Final
        Limit, he ups the ante by including, even more, cards to sift through and
        requiring that he snatch two of the right card at the right time. Selecting
        just one correct card will cause the other to detonate while replicating the
        effects of his regular Jackpot. Selecting two correct cards will fire off
        two powerful energy blasts before unleashing a mighty burst that dwarfs his
        regular attacks in power. Note: Despite his power over time, it is unknown
        if Luxord is able to control or manipulate other aspects of time itself other
        than making "timed battles". ==Gallery== Fair Game KHII.png|Fair Game|link=http://www.khwiki.com/Fair_Game
        Jackpot KHD.gif|Jackpot|link=http://www.khwiki.com/Jackpot_(Limit_Break) Sleight
        of Hand.gif|Sleight of Hand ==Notable Matchups== Victories: Losses: Inconclusive:
        {{discussions}} Category:Characters Category:Male Characters Category:Game
        Characters Category:Kingdom Hearts Category:Antagonists Category:Villains
        Category:Evil Characters Category:Organization XIII Category:Magic Users Category:Time
        Users Category:Summoners Category:Darkness Users Category:Teleportation Users
        Category:Matter Users Category:Card Users Category:Telekinesis Users Category:Transmutation
        Users Category:Resurrection Users Category:Dimensional Travel Users Category:Energy
        Users Category:Por'
      source_id: mediawiki-namine-game
