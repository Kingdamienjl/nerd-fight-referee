        \ attacks], using Demyx's clones [https://youtu.be/j0cD4VjKqY0?t=2040 against\
        \ them], and stealing Roxas' Keyblades, notably [https://youtu.be/j0cD4VjKqY0?t=1851\
        \ triple-wielding Keyblades] in the process. Sora has also shown a solid capability\
        \ of teamwork, being able to consistently combine his strength with that of\
        \ allies like Tron, Simba, Auron and Riku, most notably [https://youtu.be/CDpm5aaritQ?t=924\
        \ deflecting countless lasers at once from all directions] alongside Riku.\
        \ Sora could also keep up with Lingering Will, who had power directly comparable\
        \ to Keyblade Masters and could defeat Braig, who had several generations\
        \ of experience as formerly Luxu, and is stated to [https://www.khwiki.com/Lingering_Wi"
      source_id: vsbattles-namine-game-kingdom-hearts
