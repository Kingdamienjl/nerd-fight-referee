    - field: intelligence
      value: Demyx is easily the most laid-back, slothful, cowardly, and self-centered
        member of the Organization. Blowing off missions whenever possible, he has
        very little actual combat experience compared to members such as Lexaeus,
        Axel, or Roxas. Nevertheless, he remains formidable in combat, specializing
        in stalling tactics that prevent the opponent from ever reaching him during
        their fights, constantly knocking back foes with torrents of water and absorbing
        incoming attacks with Water Forms. In addition, he is shown to have some skill
        in melee combat, stunning foes by bludgeoning them with his Sitar, but this
        more of a last resort than anything. In addition, Axel's comments indicate
        that Demyx is reconnaissance specialist, implying that he's skilled at tracking,
        studying, and following opponents without being seen, but the validity of
        this is somewhat questionable due to Saix's complaints about his terrible
        mission reports.
      source_id: vsbattles-namine-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Cowardly and generally unwilling to fight directly, relying more on
        the use of his water clones to fight for him instead, His water constructs
        are vulnerable to intense heat and fire attacks, Savvy opponents can wipe
        out entire scores of Water Forms by snatching the music-note shaped Forms
        to bludgeon the others with, Must be hard-pressed to use his Limit Break Notable
        Attacks/Techniques: *Bubble Blaster: Demyx fires a stream of bubbles from
        his sitar as projectiles that deliver heavy knockback. **Bubble Drop: A variation
        of the above, having bubbles descend on targets to knocks targets backward.
        *Form Creation: Demyx summons water clones of himself (referred to as Water
        Forms) that float and dance around. While fragile, they can slow down enemies
        and absorb projectile attacks. *Geyser Trail: Demyx fires off a line of water
        eruptions that chase the opponent, knocking them into the air should it connect.
        *Show Stealer: Demyx angrily whips the butt of his Sitar into the face of
        anyone who attempts to interrupt his playing, sending them flying. *Water
        Dash: Dashes forward leaving pillars of water behind and ending with a circle
        of pillars around him. *Water Wall: Demyx saunters around while strumming
        his Sitar, causing pillars of water to shoot up and knock aside any foolish
        enough to approach him. *Wave Dance: After yelling, "Come on, keep to the
        beat!", Demyx twirls around while approaching his foe, striking them with
        his Sitar a couple times. He then sends out pillars to knock them into the
        air before ending with a collective barrage of water pillars. *Wave Gigs:
        Demyx''s Limit Break. Demyx''s furiously plays his Sitar, unleashing columns
        of water to erupt from the ground that deal water damage to enemies at random
        intervals. ** Final Gig: Demyx''s Final Limit. His attacks are powered up
        in this state, releasing large balls of water that explode and knock enemies
        away. ==Gallery== Arpeggio.png|Arpeggio|link=http://www.khwiki.com/Arpeggio
