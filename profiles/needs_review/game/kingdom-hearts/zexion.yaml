  intelligence:
    text: As one of the higher-ranking members of the Organization, Zexion is a surprisingly
      formidable opponent despite his unimposing stature. True to his title, he prefers
      to fight indirectly, disguising himself as Sora to disorient Riku as he attacks
      before trapping Riku in "light" to break his spirit and get him to fade away.
      He remains competent in direct combat as well, specializing in tricking his
      opponents through a variety of mindgames and by using their own attacks against
      them. Due to these tactics, Zexion managed to fight Riku on even ground even
      after receiving a severe wound from failed ruse. However, while he's normally
      calm and collected, this aspect of him collapses in the face of failure or death,
      and he becomes hysterical when his plans fail and is begging for his life when
      confronted by Axel and the Riku Replica
    source_ids:
    - vsbattles-zexion-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
