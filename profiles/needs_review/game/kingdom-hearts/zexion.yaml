        title, he prefers to fight indirectly, disguising himself as Sora to disorient
        Riku as he attacks before trapping Riku in "light" to break his spirit and
        get him to fade away. He remains competent in direct combat as well, specializing
        in tricking his opponents through a variety of mindgames and by using their
        own attacks against them. Due to these tactics, Zexion managed to fight Riku
        on even ground even after receiving a severe wound from failed ruse. However,
        while he's normally calm and collected, this aspect of him collapses in the
