power_scale:
  tier:
    text: 1-C
    source_ids: &id002
    - mediawiki-686362
    confidence: 0.8
  attack_potency:
    text: Complex Multiverse level (Clashed with all five Foretellers in rapid succession
      during the Keyblade War, managing to impress them in the process, but was ultimately
      keeling over from exertion by the end as they left with only minor wounds. Broke
      up a fight between two other Keyblade Wielders by deflecting both of their attacks
      with a single movement. Can take on powerful Heartless like Darksides alongside
      their friends. Defeated a Darkside single-handedly and was none the worse for
      wear afterward. Medals allow Player to inherit power from multiple other characters
      in the series, including KHIII Sora)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Infinite (Was able to keep up with the Foretellers, who should be at least
      as fast as other Keyblade Master-level fighters like KHIII Sora and Riku)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class M
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Complex Multiverse level (Engaged other Keyblade Masters in one-on-one combat)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Complex Multiverse level (Withstood blows from the Foretellers, albeit while
      they were holding back)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Very High (Regularly fights waves of Heartless without much effort, but
      was keeling over from exhaustion after facing Keyblade Masters like the Foretellers)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range with his/her Keyblade; Planetary via magic.
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: The Player is a particularly promising young Keyblade Wielder, managing
      to impress the Foretellers, the mightiest Keyblade Wielders of their time, after
      clashing with them in combat. Thoughtful and introspective, they refuse to join
      the Dandelions at first due to their bonds with their fellow Union members,
      and was among the first to learn about the secrets the Foretellers were keeping
      from their Union members. Despite this, they are somewhat naive, briefly trusting
      the likes of Hades after he offered to teach them how to use the power of darkness
      (though it should be noted in this instance, its implied they only accepted
      Hades offer to search the Underworld for Cloud without Hades getting in their
      way).
    source_ids: *id002
    confidence: 0.8
