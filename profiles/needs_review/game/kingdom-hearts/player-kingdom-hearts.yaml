        to his normal form after being turned into a card/die when fighting Luxord
        or the Gambler Nobodies), Has a number of transformations to use that increase
        his stats in a variety of ways, Keyblade Master-level fighter, Power Mimicry
        (When battling either Xigbar or the Sniper Nobodies, Sora appears to warp
        through space when redirecting their shots and frequently duels and beats
        the Nobodies with their own powers, raised his own "Power Level" to be above
        Lexaeus'' during their fight), May have the power to "bring back those that
        have been lost or no longer exist", Status Effect Inducement (Capable of inducing
        fear in his enemies, scramble their motor controls, blind them, put them to
        sleep, and shrink them down to miniscule sizes), Flowmotion (Allows Sora to
        blanket his body in a purple Aura that grants him easier mobility on traversing
        his surroundings in a variety of ways), Is able to hold on in a fight after
        taking massive damage or being comboed via Second Chance and Once More, Can
        restore his own mana by taking damage, Power Nullification (Undid Larxene''s
        duplication, circumvented Xaldin''s wind barrier, rose the doom counter against
        Marluxia and broke out of Zexion''s pocket dimension), Warp (Warp is described
        as erasing his enemies from existence), Resistance to: Ice Manipulation, Fire
        Manipulation, Light Manipulation, Darkness Manipulation and Electricity Manipulation.
        High Resistance to Time Manipulation (In the variety of Time Slow or Time
        Stop), Sleep Manipulation, Poison Manipulation, Size Manipulation and Mind
        Manipulation.'
