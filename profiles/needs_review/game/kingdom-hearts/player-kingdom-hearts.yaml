- id: claim-standard-equipment-cb40c9da
  section: equipment
  axis: equipment
  text: 'thumb|250px|Starlight *Keyblade: Through channeling one''s strength of heart,
    the user can summon a Keyblade to use in battle. Through use of the Keyblade,
    the user is granted increased strength, speed, durability, and increased magical
    power. The Player''s signature Keyblade is Starlight, the default Keyblade acquired
    by every Keyblade Wielder in Daybreak Town. It is well-rounded for melee, dexterous,
    and magic-based attacks, but is not particularly specialized in any specific category.
    The Player can also swap out their Keyblade''s keychain to modify its properties.
    For instance, the Fenrir keyblade is extremely powerful for melee combat, but
    offers few bonuses to their magical abilities. Conversely, the Moogle O''Glory
    is strong for both melee and magical combat, but is less suited for speedier,
    dextrous attacks. *Power Bangle: A special bracelet given to the Player by a disguised
    Nightmare Chirithy, it collects the darkness, hatred, guilt, and regrets of those
    Player defeats, channeling it into their attacks to bolster their power. *Bangle
    of Light: A bracelet filled with condensed light that protects its wearer from
    the corroding and corrupting effects of realms like the Corridor of Darkness.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
