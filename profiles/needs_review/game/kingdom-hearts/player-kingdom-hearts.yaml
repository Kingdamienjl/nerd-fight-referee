    - field: standard_equipment
      value: 'thumb, 250px, Keyblade: Through channeling one''s strength of heart,
        the user can summon a Keyblade to use in battle. Through use of the Keyblade,
        the user is granted increased strength, speed, durability, and increased magical
        power. The Player''s signature Keyblade is Starlight, the default Keyblade
        acquired by every Keyblade Wielder in Daybreak Town. It is well-rounded for
        melee, dexterous, but is not particularly specialized in any specific category.
        The Player can also swap out their Keyblade''s keychain to modify its properties.
        For instance, the Fenrir keyblade is extremely powerful for melee combat,
        but offers few bonuses to their magical abilities. Conversely, the Moogle
        O''Glory is strong for both melee and magical combat, dextrous attacks., Power
        Bangle: A special bracelet given to the Player by a disguised Nightmare Chirithy,
        it collects the darkness, hatred, guilt, channeling it into their attacks
        to bolster their power., Bangle of Light: A bracelet filled with condensed
        light that protects its wearer from the corroding and corrupting effects of
        realms like the Corridor of Darkness.'
      source_id: vsbattles-player-kingdom-hearts-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: The Player is a particularly promising young Keyblade Wielder, managing
        to impress the Foretellers, the mightiest Keyblade Wielders of their time,
        after clashing with them in combat. Thoughtful and introspective, they refuse
        to join the Dandelions at first due to their bonds with their fellow Union
        members, and was among the first to learn about the secrets the Foretellers
        were keeping from their Union members. Despite this, they are somewhat naive,
        briefly trusting the likes of Hades after he offered to teach them how to
        use the power of darkness (though it should be noted in this instance, its
        implied they only accepted Hades offer to search the Underworld for Cloud
        without Hades getting in their way).
      source_id: vsbattles-player-kingdom-hearts-kingdom-hearts
