- id: claim-powers-and-abilities-d4308df7
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Standard Keyblade powers, Heart Physiology\
    \ (As any other existent being in the series, Player has their own heart), Statistics\
    \ Amplification (Can boost his/her attack and defense considerably), Status Effect\
    \ Inducement, Flight (Can fly), Fire Manipulation, Electricity Manipulation, Air\
    \ Manipulation, Ice Manipulation, KH Darkness Manipulation, Healing (Via several\
    \ techniques like Curaga), Self-Sustenance (Type 1. Can breathe in space), Empowerment\
    \ (Can become more powerful by defeating Heartless and collecting the power of\
    \ darkness, in the form of the negative emotions of defeated foes), Statistics\
    \ Amplification and Statistics Reduction (Most of Player's moves raise their own\
    \ stats and hinder the ones of the opponent), Damage Boost (Can do more damage\
    \ to aerial or grounded enemies depending on the move), Water Manipulation (Via\
    \ moves such as Aqua Splash and Geyser Blast), Plant Manipulation (Via moves such\
    \ as Blossom Bloom), Statistics Amplification Negation (Moves like Dark Glory\
    \ can ignore defensive amplifications while dealing damage), Energy Projection\
    \ (Via moves like Blooming Shine and Umbrella Beam), Attack Reflection (Curious\
    \ Cubes reflects back magical attacks a while after use), Resistance Negation\
    \ (Moves like Eternal Session and Icicle Storm ignore the target's attributes\
    \ while dealing damage), Gravity Manipulation (Via Dark Gravity), Purification\
    \ (Via moves like Esuna, which removes the status ailments on the user), Forcefield\
    \ Creation (Via Force Field), Homing Attack (Via moves like Homing Darkness),\
    \ Explosion Manipulation (Via moves like Pumpkin Pummel and Rising Wonder), Void\
    \ Manipulation and Durability Negation (Via moves such as Ragnarok and Dual Blades,\
    \ which have the Nil element, whose characteristic is ignoring defenses while\
    \ dealing damage), Portal Creation (Via moves like Zone Slinger and Ultimate Shot),\
    \ Berserk Mode (Via Berserk), Earth Manipulation (Via Earthen Fury), Teleportation\
    \ (Via moves like Final Judgment), Duplication (Via Foxtrot), Power Mimicry (Medals\
    \ are the inherited powers from characters in the futureKingdom Hearts Union \u03C7\
    , 2015, Theather Mode Scene \"The Foretellers\", Mirror allows to copy the positive\
    \ stat boosts of the target), Summoning (Can summon an ally with a Friend Medal)\
    \ Ice Manipulation, Time Stop (Can move inside of the Realm of Darkness (Which\
    \ is timeless in nature), and the Keyblade grants additional Resistance to Magic-based\
    \ Time Stop), Absorption, Death Manipulation, KH Darkness Manipulation (Unaffected\
    \ by Heartless, which passively kill and absorb things around them with darkness),\
    \ Cosmic Radiations"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
