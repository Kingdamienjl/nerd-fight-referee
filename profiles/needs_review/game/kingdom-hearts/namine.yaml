        that he was able to get Vexen to fight Sora by using his fear of Xemnas against
        him; he can also be very cunning as he was able to trick Sora into thinking
        that Axel was going to cut down Namine, who he summoned to use as a shield
        beforehand, to get to him; In addition he is also a skilled combatant, as
        he is able to fight Sora and Axel on equal ground (though while it was his
        duplicate that fought them, it did show that Marluxia can be, again, a powerful
        combatant in battle should the need to fight arises)
