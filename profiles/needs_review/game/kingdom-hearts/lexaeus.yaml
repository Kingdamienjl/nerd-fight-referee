  tier:
    text: 2-B
    source_ids: &id002
    - mediawiki-237300
    confidence: 0.95
  attack_potency:
    text: Multiverse level (Capable of knocking out KHCoM Riku even when exhausted
      due to their previous battle, is stated by Tetsuya Nomura to be the third most
      powerful in Organization XIII along with Xaldin, making him stronger than the
      likes of Axel, Marluxia, Luxord, and even Saix)
    source_ids:
    - vsbattles-lexaeus-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Despite Nomura stating that he has "slow movement", he is able
      to keep pace with Riku as well as Sora during his Absent Silhouette and Data
      Battles, comparable to others that can travel across the worlds with a Keyblade
      Glider, which has been shown to also relate to direct physical movements and
      is comparable to the Gummi Ship based on Aqua and Ventus getting to the Keyblade
      Graveyard within a day just like it while also including the threat of Gummi
      Heartless, comparable to Xemnas, who reacted to Roxas going from Radiant Garden
      to the Keyblade Graveyard in seconds, not far behind Sora, who reacted to a
      Keyblade beam from Xehanort of a similar nature as this one)
    source_ids:
    - vsbattles-lexaeus-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class M, potentially higher (Singled out by Nomura himself as having
      "very high attack power", his Skysplitter is incredibly heavy, as Axel was barely
      able to lift it with both hands while Lexaeus can effortlessly lift it with
      one, the largest and most physically strong member of the Organization)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multiverse level
    source_ids: *id002
    confidence: 0.95
  durability:
