    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with Skysplitter. Tens of Meters with Earth Manipulation.
      Low Multiversal with the Corridors of Darkness
    source_ids:
    - vsbattles-lexaeus-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Despite his brutish appearance, Lexaeus is rather patient and tactical,
      preferring to bide his time and plan things accordingly rather than simply attack,
      taking the time to increase his power level and study his opponents' attacks
      before finally finishing them with a fierce onslaught of slow but crushingly
      powerful blows. He supplements his swordplay/axe use with his powers of earth,
      manipulating giant amounts of rock to limit his foe's ability to escape. Lexaeus
      is also skilled in grappling maneuvers, grabbing and tossing his opponents to
      leave them open to further attacks. As the the Rank V of the Organization, he
      is one of its highest-ranked members and is the third-strongest member next
      to Xaldin. In addition, he was able to overpower Riku, Sora's equal, in single-combat
      until the former unleashed the power of Ansem, Seeker of Darkness, proving his
      skill in close combat. He is also rather savvy, being distrustful of the other
      members of the Organization due to their duplicitous natures and being especially
      suspicious of Axel. Lexaeus also prefers practical and straight-forward approaches
      to solving problems, simply striking Roxas to pressure him into learning how
      to use his Limit Break rather than attempt to explain to him
    source_ids:
    - vsbattles-lexaeus-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
