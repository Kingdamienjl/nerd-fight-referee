  intelligence:
    text: Luxord is arguably the most genteel member of Organization XIII. He proved
      himself to be level-headed and pragmatic in combat, facing Sora one-on-one by
      teleporting his friends away with his cards and turning Sora into a defenseless
      die at the very start of the fight. While he tends to treat life as if it were
      a game (even calling himself a mere pawn in the Organization's plan), he is
      possesses a sharp mind and a keen eye for strategy, stalling out Sora with various
      minigames that force the latter to take massive risks to even land a hit on
      him. True to his epithet, Luxord is also an exceedingly skilled card game player,
      with Xigbar noting that Roxas would be "eaten alive" in a game of strip poker,
      utilizing this trait in combat to make his various stall tactics even more difficult.
      In addition to his gambling prowess, he is also proficient in direct combat,
      shooting energy projectiles from giant versions of his cards and using the cards
      themselves as projectiles and as melee weapons
    source_ids:
    - vsbattles-luxord-kingdom-hearts
    confidence: 0.6
