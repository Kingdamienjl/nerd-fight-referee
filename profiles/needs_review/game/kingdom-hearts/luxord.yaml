- id: claim-weaknesses-09b481c7
  section: weaknesses
  axis: weakness
  text: 'His obsession with playing games can backfire on him, his "timed battle"
    mechanic also works on himself as well as his enemy, Luxord needs to be hard pressed
    to use his Final Limit Notable Attacks and Techniques: BeginGame.gif|Begin Game
    BeginGameEX.gif|Begin Game Part II *Timed Battles: The central mechanic behind
    Luxord''s battles. Luxord manipulates time so that he does not take damage from
    attacks and instead the damage is directed to a "Time Gauge", referring to his
    own time. He does the same for his opponent, except for the fact that they will
    take damage from Luxord''s attacks. The Time Gauges whittle down over time, much
    like a timer or an hourglass. If Luxord is struck, his time is depleted, while
    the same rules apply to his opponent. Running out of time will cause the victim
    to instantly "lose", draining them of all their stamina and rendering them virtually
    helpless, leaving them open to being finished by their opponent''s next attack.
    *Begin Game: Luxord challenges his foe to what amounts to a game of slots, forcing
    them to snatch just the right card from him (an "O") from a set that includes
    three duds ("X"s). If they succeed, Luxord will be temporarily left wide open
    to follow up attacks. However, failing this game will temporarily transform his
    target into a card or a die, sealing all of their abilities and hindering their
    movement temporarily. When hard-pressed he will instead trap his opponent in a
    stack of his giant cards, forcing them to seize four correct cards lest they be
    transformed into a die in additional to draining large portion of their Time Gauge
    in order to restore Luxord''s own. However, winning the battle here instead will
    allow his targets to restore their Time Gauge by draining Luxord''s, leaving him
    next to no time left in his. *Card Shield: Luxord constantly protects himself
    from incoming attacks with giant versions of his normal cards. They can be destroyed
    with sufficiently powerful attacks or by simply flipping them around. Luxord is
    fully aware of this, and thus booby-trapped several of his cards with fireball
    sigils to set them to detonate should they be flipped around. His opponent is
    thus forced to choose whether or not they''re willing to whittle down his cards
    and take projectile attacks from him or close in for the kill by trying to flip
    his cards over. In addition, he can send these cards out as projectiles to attack
    and spin them around to knock away approaching enemies. *Card Shuffle: Luxord
    transforms himself into a card that he shuffles amongst the other cards. The cards
    are virtually indestructible, forcing the opponent to watch carefully and flip
    up the card Luxord is hiding in to bring him back to a state where he can be damaged
    in addition to stunning him. Flipping the wrong one will trigger a booby trap
    that explodes in the opponent''s face to deal damage. Luxord becomes warier if
    he''s continually found, summoning more trap cards to hide among and making it
    more difficult for his opponent to find him. *Sleight of Hand: Luxord covers the
    area with cards and hiding among them similarly to his Card Shuffle technique.
    He then goes on the offensive, appearing from various locations and throwing giant
    cards at his opponents and flipping nearby cards around to knock his opponents
    into the air. *Jackpot: Luxord''s Limit Break in which he is the one gambling,
    being forced to snatch a rapidly shifting card to achieve the best effects. Should
    he happen to select the wrong one, the card simply detonates as Luxord winces.
    However, should he choose the right one (which he frequently does), the cards
    fire off several powerful energy projectiles at his targets. **Final Jackpot:
    Luxord''s Final Limit, he ups the ante by including, even more, cards to sift
    through and requiring that he snatch two of the right card at the right time.
    Selecting just one correct card will cause the other to detonate while replicating
    the effects of his regular Jackpot. Selecting two correct cards will fire off
    two powerful energy blasts before unleashing a mighty burst that dwarfs his regular
    attacks in power. Note: Despite his power over time, it is unknown if Luxord is
    able to control or manipulate other aspects of time itself other than making "timed
    battles".'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-db81140b
  section: abilities
  axis: hax
  text: Nobody Physiology, Summoning (Can summon his main weapon. Can summon hordes
    Nobodies of and Heartless. The Nobodies specifically commanded by him hold standard
    Nobody Physiology plus Summoning, Telekinesis, Transmutation and Elasticity. His
    Heartless hold standard Heartless Physiology), Immortality Negation (Type 5, Can
    destroy the skeletal forms of the pirates despite them being neither alive nor
    dead), Self-Sustenance (Type 1. Can breathe in space), Magic, Law Manipulation
    (When Luxord initiates his game, Sora immediately has to follow the "rules" of
    it, such as the timer for the fight, having to stop and pick the right command,
    getting turned into a die or card, etc), Time Manipulation (Uses this to make
    "timed battles", is able to steal some of his opponent's "time gauge" through
    the use of card games), Statistics Reduction (Can rewind someone's defenses back
    to 1), Telekinesis, Transmutation (Capable of transforming beings into cards and
    dice as well as turn himself into a card to hide among his other cards), Darkness
    Manipulation, Teleportation, Reality Warping (Littered the field with his cards
    as well several other effects), Energy Blasts, Forcefield Creation (Can create
    defensive barriers via his cards), BFR, Sealing (Can seal people into his cards)
    Ice Manipulation, Cosmic Radiations, Darkness Manipulation, Corruption (Type 2)
    (His Black Coat protects him from the corrupting influence of the darkness of
    the lanes between and the Realm of Darkness), Time Stop (Can move inside of the
    Realm of Darkness), Information Manipulation (Should scale to his fellow Nobodies
    who were unaffected by Namine's powers), Madness Manipulation (Type 3), Mind Manipulation,
    Memory Manipulation, Soul Manipulation, Willpower Manipulation (The Realm of Darkness
    has been stated to eradicate existence itself within it, and anyone who's traveled
    there have never returned. Ansem the Wise by being in the Realm of Darkness was
    losing his sense of self and memories, having to give into his hatred to survive.
    Aqua not long after being in the Realm of Darkness lost the will to continue,
    and needed to stay true to her friends to fight it), Time Manipulation, Statistics
    Reduction, BFR, Transmutation, Sealing (Unaffected by his own power), Possible
    Resistances to Void Manipulation, Attack Nullification, Power Nullification, Perception
    Manipulation, Attack Reflection (Via Nothing to Fear), Spatial Manipulation, Gravity
    Manipulation (Via Space in Its Place), Wind Manipulation, Paralysis Inducement
