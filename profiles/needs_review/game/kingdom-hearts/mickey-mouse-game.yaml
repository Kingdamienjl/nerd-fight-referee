    - field: intelligence
      value: 'At least Genius (Mickey is a master in a variety of fields in sports,
        craftmanship and holds a mastery over a variety of conventional and unconventional
        musical instruments, and is an amazing dancer. He was able to learn flight
        in secondsPlane Crazy (1928) and created a plane by repurposing a car, and
        is a capable chemist as he was able to create the Courage Builder potion.
        Mickey is a gifted thinker and is always managing to improvise under tight
        circumstances. For example, under the pressure of going on a date with Minnie
        in exactly an hour, he was able to construct a plane within that time period
        without any instructions.House of Mouse S3E9: Donald Wants To Fly After his
        hands are tied and he cannot play the piano, he is gifted enough to play the
        piano with his feet instead.House of Mouse S3E26: Mickey and the Culture Clash
        He can translate morse code. After completely jumping into a hockey game unprompted,
        he managed to beat multiple professional hockey players with his own ears
        and scored a goal.Mickey Mouse S1E9: Bad Ear Day He has predicted the actions
        of robbers and devised a clever trap for them. He prevented an ambush without
