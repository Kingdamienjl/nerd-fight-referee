        \ that just maybe he was not a corporeal human entity at all. Perhaps the\
        \ sequence of scenes involving them made players feel like they were being\
        \ left behind, but I'd like you to think of that as a representation of a\
        \ light and darkness that Sora, and thus you as players, cannot intervene\
        \ in. --Nomura Tifa As a symbol of light, like Sephiroth, it's possible that\
        \ she too was incorporeal. That last scene where she goes off to search for\
        \ Cloud, you could say, is a metaphor for how Cloud's light still hasn't lost\
        \ him, even though he's disappeared off with his darkness, and it is trying\
        \ to shine on him again\u2026 I'm pretty sure I didn't manage to get all that\
        \ across very well. --Nomura ), Master Swordsmanship, Magic, Flight, Teleportation,\
        \ Energy Manipulation, Summoning (Can summon meteors from the sky to rain\
        \ down on his enemies), Fire Manipulation, Darkness Manipulation, Absorption\
