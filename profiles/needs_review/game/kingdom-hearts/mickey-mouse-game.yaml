        with a wide draw (in a more pronounced turn) in a small hop, then leaps back
        a distance. Tends to be used alongside the first slash, throwing off his opponents
        block-timing as the move comes out a bit slower than the other slash. *Flash:
        The area darkens and Sephiroth says "That''s enough." before dashing past
        his opponent, who is then hit by a total of thirteen more hits in quick succession
        should the first move connect. *Cut Combo: Sephiroth charges forward, unleashing
        several quick damaging slash attacks. *Aerial Cut Combo: Sephiroth only uses
        this move when his enemy is in the air and attacks them multiple times, after
        which he teleports. *Upward Slash: Sephiroth teleports behind his enemy and
        attacks, knocking them high into the air. *Teleportation: Sephiroth can instantly
        teleport from one point to another. *Firaga Wall: Sephiroth draws a vacuum
        effect that drags the target towards him and conjures many flame pillars around
        himself. *Heartless Angel: Sephiroth''s trademark attack. He instantly depletes
        all of his enemy''s magic and reduces their health to a near zero. The attack
        can be interrupted, but it cannot be blocked or dodged and penetrates forcefields.
        *Wild Dance: Sephiroth does a frenzy of standing and leaping blows in mid-flight,
        then leaps up and does a finisher that sends a perpendicular blast of four
        shockwaves at once, much like the current version of the Omnislash from his
        home series. *Shadow Flare: Sephiroth conjures dozens of dark orbs to surround
        his target, then he suddenly sends at them to damage the target. *Flight:
        Sephiroth can fly with the use of his wing. *Spin'
