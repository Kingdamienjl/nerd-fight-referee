      value: 'Light magic or anything related to the light energy (was destroyed by
        the light of Kingdom Hearts, was also unable to control Riku in KH:CoM due
        to King Mickey''s light), to travel through time he has to give up his body.
        Notable Attacks/Techniques: ===Base=== *Dark Blow: Ansem sends Dark Figure
        to attack the target with a dark-charged fist attack. *Dark Rush: Ansem surrounds
        himself and Dark Figure in a dark aura, then proceeds to rush at the target
        five times. *Racing Shockwaves: Generates shockwaves along the ground that
        can damage his enemies. *Shock Slash: Has Dark Figure hurl razor-sharp discs
        of energy at the target. *Possession: Ansem sends Dark Figure at the target
        where it lashes out two hits. If they get caught by one of them, Dark Figure
        will possess them. Here Dark Figure does two things: it either paralyzes the
        possessed target briefly for Ansem to attack them with an energy barrier or
        damages the target from inside. After a short while, Dark Figure then returns
        to Ansem''s side. **Energy Barrier'
