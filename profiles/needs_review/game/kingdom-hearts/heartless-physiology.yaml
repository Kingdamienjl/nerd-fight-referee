        bug that was preventing Jiminy''s diary from returning to its original form.
        Initially, the data of Sora''s Heartless was born in "KH1", but it grew with
        the "Heartless Will" that Data Sora unleashed during his adventure, and the
        Heartless''s instinct to return everything to darkness led it to erase all
        of the data in Jiminy''s diary. ---- (Second section) First one: Riku, who
        fought Sora, was knocked unconscious after being affected by the bug. Sora
        enters the data in order to save Riku, neutralizes the bug, and defeats Maleficent,
        he regains the path to the real world. But just as everything seems to have
        settled, a powerful bug hiding in the roots of the data sets out to erase
        the data world. Arrow (Left side page): When the debugging is completed and
