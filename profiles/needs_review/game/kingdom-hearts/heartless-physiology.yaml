    - field: powers_and_abilities
      value: "Same abilities as a standard Shadow, Heartless Physiology, Duplication\
        \ (Can clone itself into three, defeating all three is required to \"defeat\"\
        \ it), Data Manipulation (Threatened to erase the Datascape, a universe made\
        \ of data, passively distorts several parts of it), Flight, Weapon Control\
        \ (Seen here), Weapon Mastery, Magic, Homing Attack, Transformation (Can go\
        \ as either its Neo Darkside form, its Shadow form, or its true form, Anti-Sora),\
        \ Danmaku (Can make a rain of homing Keyblades or lasers), Large Size (Type\
        \ 0, as Neo Darkside), BFR (Sent Maleficent and Pete to a rift of data), Portal\
        \ Creation (Can make portals to move around), Energy Projection (Can fire\
        \ lasers), Ice Manipulation (Seen here), Vibration Manipulation (Can make\
        \ shockwaves with several of its attacks that increase their range), Fire\
        \ Manipulation (Seen here), Power Nullification (Can passively distort the\
        \ Datascape so beings can't use most of their abilities), Spatial Manipulation\
        \ (Superior to other bugs that can render beings as \"flat\" passively in\
        \ certain parts of the Datascape, restricting movement, a while after doing\
        \ it, Maleficent describes that darkness allows to do this, and so should\
        \ theoretically be able to do the same), Telepathy (Can speak in this manner\
        \ Kingdom Hearts Re:Coded Novel, Chapter 8 ---- Sora hopped backward and swung\
        \ his Keyblade down on its arm. Neo Darkside appeared to pause for a moment,\
        \ but then it thrust both arms toward the heavens and sent a wave of light\
        \ from its body. Sora deflected it with his Keyblade, then charged straight\
        \ into the Heartless\u2019s chest and hammered it with a series of blows until\
        \ it fell still. \u201CIs it over?!\u201D Just as he struck a victory pose,\
        \ that voice sounded in his head again. RAGE\u2026 HATRED\u2026 GLITCHES TO\
        \ FEED MY DARKNESS\u2026 AND SOON, HEARTS TO SATE MY HUNGER! \u201CWhat is\
        \ it? It\u2019s changing again?! No\u2026 It\u2019s evolving!\u201D ), Reactive\
        \ Power Level (Is constantly noted to become stronger across the battle)"
