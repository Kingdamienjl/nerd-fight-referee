      data of Sora''s Heartless was born in "KH1", but it grew with the "Heartless
      Will" that Data Sora unleashed during his adventure, and the Heartless''s instinct
      to return everything to darkness led it to erase all of the data in Jiminy''s
      diary. ---- (Second section) First one: Riku, who fought Sora, was knocked unconscious
