    \ attacks that increase their range), Fire Manipulation (Seen here), Power Nullification\
    \ (Can passively distort the Datascape so beings can't use most of their abilities),\
    \ Spatial Manipulation (Superior to other bugs that can render beings as \"flat\"\
    \ passively in certain parts of the Datascape, restricting movement, a while after\
    \ doing it, Maleficent describes that darkness allows to do this, and so should\
    \ theoretically be able to do the same), Telepathy (Can speak in this manner Kingdom\
    \ Hearts Re:Coded Novel, Chapter 8 ---- Sora hopped backward and swung his Keyblade\
    \ down on its arm. Neo Darkside appeared to pause for a moment, but then it thrust\
    \ both arms toward the heavens and sent a wave of light from its body. Sora deflected\
    \ it with his Keyblade, then charged straight into the Heartless\u2019s chest\
    \ and hammered it with a series of blows until it fell still. \u201CIs it over?!\u201D\
    \ Just as he struck a victory pose, that voice sounded in his head again. RAGE\u2026\
    \ HATRED\u2026 GLITCHES TO FEED MY DARKNESS\u2026 AND SOON, HEARTS TO SATE MY\
    \ HUNGER! \u201CWhat is it? It\u2019s changing again?! No\u2026 It\u2019s evolving!\u201D\
    \ ), Reactive Power Level (Is constantly noted to become stronger across the battle)"
