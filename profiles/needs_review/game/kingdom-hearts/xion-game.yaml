    - field: standard_equipment
      value: '* Keyblade (Kingdom Key): Through channeling one''s strength of heart,
        the user can summon a Keyblade to use in battle. Through the use of the Keyblade,
        the user is granted increased strength, speed, durability, and increased magical
        power, as well as access to special abilities. Xion wields the basic Kingdom
        Key in combat, offering no real merits over other Keyblades but is balanced
        and easy to use. However, she discards the Keyblade in her fight with Sora,
        opting for a magical sword or set of magical swords that change in shape depending
        on where she is fighting. * Black Coat: A magically enchanted coat that allows
        the wearer to pass through the Corridors of Darkness safely, warding off corrupting
        influences and preventing the power of Darkness from encroaching one''s mind
        and soul. It is also useful for stealth, as the hood completely obscures one''s
        face and blends in the with the shadows created by the Corridors.'
