    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with Keyblade strikes. Planetary with magic via power-scaling
      from Sora
    source_ids:
    - vsbattles-xion-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Due to inheriting Sora's memories and combat skill along with Roxas, Xion
      is skilled combatant able to go toe-to-toe with even the strongest of Heartless.
      She manages to give Axel and Roxas incredibly difficult fights in their attempts
      to bring her back to the Organization, bringing the former to point of unconsciousness.
      She fights in almost the same manner as Sora, inheriting his most powerful techniques,
      particularly the Limits he lost during his time in Castle Oblivion
    source_ids:
    - vsbattles-xion-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
