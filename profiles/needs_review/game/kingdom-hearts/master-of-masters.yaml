  intelligence:
    text: Despite being known for his incredibly eccentric demeanor, the Master is
      also known for his incredible abilities as a Keyblade Master, being revered
      with awe by his apprentices, who are all incredibly powerful Keyblade Masters
      in their own rights. He has a keen understanding of both Light and Darkness,
      creating the Chirithys from Darkness and wearing the Black Coat that would later
      be utilized by many other characters in the series. His eye also allows him
      to see the future, allowing him to maintain an advantage against his opponent
      if he so chooses
    source_ids: *id002
