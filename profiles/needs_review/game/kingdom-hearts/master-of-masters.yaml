- id: claim-standard-equipment-9bd33de6
  section: equipment
  axis: equipment
  text: '*Keyblade: Through channeling one''s strength of heart, the user can summon
    a Keyblade to use in battle. Through the use of the Keyblade, the user is granted
    increased strength, speed, durability, and increased magical power, as well as
    access to special abilities, such as turning his Keyblade into a Keyblade Glider.
    The Master of Masters possesses what is now Master Xehanort''s Keyblade, which
    is noted to be incredibly ancient and has the Master''s eye inlaid in the tip,
    allowing him to see the future through it. *Black Coat: A magically enchanted
    coat that allows the wearer to pass through the Corridors of Darkness safely,
    warding off corrupting influences and preventing the power of Darkness from encroaching
    one''s mind and soul. It is also useful for stealth, as the hood completely obscures
    one''s face and blends in the with the shadows created by the Corridors of Darkness.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-169fa879
  section: power_scale
  axis: battle_iq
  text: Despite being known for his incredibly eccentric demeanor, the Master is also
    known for his incredible abilities as a Keyblade Master, being revered with awe
    by his apprentices, who are all incredibly powerful Keyblade Masters in their
    own rights. He has a keen understanding of both Light and Darkness, creating the
    Chirithys from Darkness and wearing the Black Coat that would later be utilized
    by many other characters in the series. His eye also allows him to see the future,
    allowing him to maintain an advantage against his opponent if he so chooses
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-8d9e91f5
  section: weaknesses
  axis: weakness
  text: The Master has a fatalistic outlook on the future and doesn't believe it can
    be changed
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6de51ae5
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Keyblade Master powers, Darkness Manipulation
    (Dream Eaters are described as being made of darkness), Healing (Via Curaga),
    Creation (Can create Keyblades by himself, using his knowledge of the X-Blade
    to draw them out from the hearts of other people, can create Dream Eaters), Precognition
    (Can see the future through his eye, which is inlaid in the future incarnations
    of his Keyblade), Self-Sustenance (Type 1. Can breathe in space and underwater),
    Information Manipulation (Created the Enchanted Dominion replica with the Book
    of Prophecies) Time Stop (Can move inside of the Realm of Darkness (Which is timeless
    in nature), and the Keyblade grants additional Resistance to Magic-based Time
    Stop), Darkness Manipulation, Absorption, Death Manipulation (Unaffected by Heartless,
    which passively kill and absorb things around them), Data Manipulation (Ansem
    The Wise stated that the "heart" cannot be contained by data, and that the process
    itself would be incalculable), Existence Erasure (Can take hits from Heartless,
    which can do this with any attack), Cosmic Radiations, and Corruption (Black Coats
    protect their wearers from the corrupting effects of the darkness of the Dark
    Corridors and the Realm of Darkness), Madness Manipulation (Type 3), Mind Manipulation,
    Memory Manipulation, Soul Manipulation, Empathic Manipulation (The Realm of Darkness
    has been stated to eradicate existence itself within it, and anyone who's traveled
    there have never returned. Ansem by being in the Realm of Darkness was losing
    his sense of self and memories, having to give into his hatred to survive. Aqua
    not long after being in the Realm of Darkness lost the will to continue, and needed
    to stay true to her friends to fight it)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
