  intelligence:
    text: Genius. Xehanort is arguably the most intelligent and cunning character
      in the entire series, having orchestrated the events of the entire series from
      the beginning, from Ventus's arrival in the Land of Departure, the creation
      of Vanitas, the creation of Organization XIII, among other critical points in
      the storyline. He has shown immense foresight and can easily read his foes and
      how they'd react, predicting that Yen Sid would put Sora and Riku through the
      Mark of Mastery exam well over a decade in advance and hijacked it to make Sora
      one of his vessels, nearly succeeding in the process. In addition, he has contingency
      plans should his original goals fail, such as his aforementioned attempt to
      make Sora one of his vessels when he realizes that his previous vessels, Ansem,
      Xigbar, and Xemnas had all been defeated by the young Keyblade Wielder. He is
      also an extraordinarily powerful Keyblade Master, being extremely proficient
      in both Keyblade and Magic combat and easily fighting Ventus, Aqua, and Terra
      at the same time and having the nearly exclusive ability to control hundreds
      of Keyblades telekinetically, allowing him to overwhelm foes with a storm of
      raining Keyblades.
    source_ids:
    - vsbattles-master-xehanort-game-kingdom-hearts
    confidence: 0.6
