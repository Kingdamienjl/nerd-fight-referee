      value: Complex Multiverse level (One of the most powerful beings in the series.
        Struck down Master Eraqus and fought on par with Terra, who is one of the
        most physically powerful characters in the series. Effortlessly froze Ventus
        solid. His magical prowess is equal or superior to Aqua, a Keyblade Master
        specializing in magic. He should also be on par with Eraqus in this matter.
        Destroyed the majority of the Land of Departure with a pseudo black hole spell
        leaving everything in a complete wreck) | Complex Multiverse level (Capable
        of contending with Aqua, who had previously defeated Ventus-Vanitas, albeit
        was being held back by Terra's heart fighting against his own. Fought Lingering
        Will) | Complex Multiverse level (Effortlessly decimated several of the Guardians
        of Light in the initial battle, one-shotting Ventus, and easily holding back
