    - field: standard_equipment
      value: 'Note: Pre-Keyblade, Sora only holds as Standard Equipment his wood sword,
        Potions and the Protect Chain accessory, KHIII Sora also has the X-Blade as
        Standard Equipment. |-|Keyblade=right|100px (Kingdom Key): Through channeling
        one''s strength of heart, the user can summon a Keyblade to use in battle.
        Sora''s Keyblade is the Kingdom Key, a weapon from the realm of light. Through
        the use of the Keyblade, the user is granted increased strength, speed, durability,
        and increased magical power, as well as access to special abilities, like
        turning your Keyblade into a bike or whip. Thus far, Sora has not demonstrated
        such special abilities as of KHII but has finally obtained such in KHIII,
        implying his mastery of the ability after training under Yen Sid. |-|Keychains=right|100px
        Found among all Keyblades, Keychains allow the user''s Keyblade to change
        shape and abilities, which vary a lot depending on the user and the Keychain
        itself. Sora can quickly change the Keychain of his Keyblade by resummoning
        his own Keyblade with another Keychain, which is by default in its true form,
        the Kingdom Key. The following are all the forms Sora''s Keyblade can take
        from the respective Keychain: KHI KHII KH3D KHIII |-|Potion=right|100px A
        one-use item that allows to recover health by a decent amount quickly by casting
        it on himself or an ally. |-|Hi-Potion=right|100px A one-use item that allows
        to recover health by a noticeable amount quickly by casting it on himself
        or an ally. |-|Mega Potion=right|100px A one-use item that allows Sora and
        allies to recover health by a decent amount quickly by casting it on himself
        and allies. |-|Ether=right|100px A one-use item that allows to recover magic
        by a noticeable amount quickly by casting it on himself or an ally. |-|Hi-Ether=right|100px
        A one-use item that allows to recover magic back to peak quickly by casting
        it on himself or an ally. |-|Mega Ether=right|100px A one-use item that allows
        Sora and allies to recover magic back to peak quickly by casting it on himself
        and allies. |-|Refocuser=right|100px A one-use item that allows Sora to refill
        his focus a noticeable amount to be able to use Shotlocks by casting it on
        himself. |-|Hi-Refocuser=right|100px A one-use item that allows Sora to refill
        his focus back to peak to be able to use Shotlocks by casting it on himself.
        |-|Elixir=right|100px A one-use item that allows to recover health and magic
        back to peak quickly by casting it on himself or an ally, also rendering the
        one cast to with a resistance to multiple status effects for a while. |-|Megalixir=right|100px
        A one-use item that allows Sora and allies to recover health and magic back
        to peak quickly by casting it on himself and allies, also rendering the ones
