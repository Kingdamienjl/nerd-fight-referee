        Vanity: Xemnas''s Limit Break. Creates an electric barrier around himself
        that can damage anybody that touches it. While this is active, Xemnas is virtually
        invincible. **Final Vanity: Xemnas''s Final Limit, where he shoots two giant
        damaging lasers at his enemies from long range while his electric barrier
        is still active. In Kingdom Hearts Final Mix, he is able to fire an even greater
        number of beams all at once. *Ethereal Blades: Xemnas mainly use his power
        of "Nothingness" to create his signature and main weapon, The Interdiction.
        These are solid blades of red energy that are extended from the palms of his
        hands with no handle or hilt for him to wield them on. They appear to have
        no cutting-edge ability, only being used as a sort of bashing weapons akin
        to that of a club. **Blade Slice Combo: A simple, two hit attack move where
        Xemnas attacks his target with his ethereal blades, dealing damage and knocking
        them back. ***Rosea Arcanum: One of his desperation moves. Xemnas unleashes
        his ethereal blades and attacks the target multiple times with a long series
        of slashing and kicking attacks. **Ethereal Projectiles: In addition to using
        them as melee weapons, Xemnas is able to utilize them as make-shift projectiles
        to shoot at his target. He can do this either by shooting them directly from
        his hands or suspend them in mid-air (either with just a few of them, making
        a ring of red blades around the target, or a ring of blue orbs that shoot
        blue lasers) and then command them to fire at the target. *Expansive Energy
        Balls: Xemnas is capable of shooting off pairs of energy balls that after
        traveling a certain distance then explode into orb-like, damaging forcefields.
        This way, it both damages any nearby target as well as block any attacks that
        would have harmed Xemnas or disrupts the targets attack onto him. *Intangibility:
        Xemnas is able to become intangible either by dematerializing into a dark
        cloud/fog or shroud himself in an orb of darkness. While in this state, Xemnas
        cannot attack the target but is immune to any conventional attack as they
        will just pass right through him. He is also able to quickly traverse the
        battleground while in this state or teleport around his target to take them
        off guard. *Invitation to Nothingness: Xemnas ensnares his opponent in an
        array of crystals that slowly drains their life force, eventually killing
        them if given enough time. *Telekinesis: As seen in his final fight with Sora
        and his friends during Kingdom Hearts ll and Dream Drop Distance, Xemnas has
        shown the ability to pick up and use any inanimate objects (ex. buildings
        of various sizes) as weapons to throw at his targets. *Thunder Guard: Xemnas
        creates a large, rectangular energy shield in front of him that can block
        attacks and also damages and knocks back the enemy if they come into contact
        with it. Xemnas can also use this to mask his next attacks (such as performing
        a slice combo right after erecting the guard barrier) or make several of these
        to trap the target from all sides like a cage, where he can proceed to shoot
        ethereal blade projectiles at them from outside. Twilight Form *Duplication:
        One of the new abilities he gained after merging with his Kingdom Hearts.
        Xemnas is able to create a single solid clone in battle, which he uses to
        assist him in several ways such as distraction and confusion (uses the clone
        to appear alongside him in order to confuse the target), attack alongside
        him, or to protect him while he deals with another target. The duplicate is
        also shown able to use all of Xemnas''s base abilities. *Energy Tendrils:
        Another attack Xemnas gains from his merging with Kingdom Hearts. An attack
        similar to the Twilight Thorn, Xemnas summons and shoots out tendrils of dark
        energy that greatly damage anyone who gets in its way. The threads of energy
        will also follow the target should they attempt to dodge them. *Ethereal Blade
        Barrage: Xemnas surrounds his opponent in a dome of darkness containing countless
        floating Ethereal Blades before having them descend on his opponent at high
        speeds from all directions, leaving no opportunities for escape. *Invitation
        to Nothingness: An improved version of his original ability, Xemnas ensnares
        his opponent in a sphere of dark energy that slowly drains their life force
