        Spellweaver KHBBS.gif|Spellweaver''s Finisher|link=http://www.khwiki.com/Spellweaver
        ===Shotlocks=== Prism Rain KHBBS.gif|Prism Rain|link=http://www.khwiki.com/Prism_Rain
        Lightbloom KHBBS.gif|Lightbloom|link=http://www.khwiki.com/Lightbloom ===Finishers
