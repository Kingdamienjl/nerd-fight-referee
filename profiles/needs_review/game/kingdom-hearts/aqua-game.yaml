    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Claw Swipes: The Dark Hide
        quickly swipes at the enemy with its claws. *Tail Whip: The Dark Hide spins
        around, attempting to hit the enemy with its tail. *Buzz Saw: The Dark Hide
        does a damaging mid-air flip. *Flame Charge: The Dark Hide charges at the
        enemy, leaving a trail of flames in its wake. *Shadow Bomb: Shoots a dark
        orb of energy that sucks in the target. After a few seconds, the orb detonates
        and expands to cover a wide blast radius. *Mega Flare: The Dark Hide shoots
        a large fireball that detonates in a large explosion. *Illusion Charge: The
        Dark Hide sends out an afterimage which performs Flame Charge, followed by
        the other afterimages and the original in rapid succession. *Illusion Claw:
        Each of the Dark Hide''s afterimages strikes the enemy with their claws. *Illusion
        Spin: The Dark Hide spins at high speeds, using its four afterimages to charge
        at its opponent, before pouncing from above, creating a massive shockwave.
