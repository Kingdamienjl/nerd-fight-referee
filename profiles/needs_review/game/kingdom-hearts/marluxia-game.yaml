  durability:
    text: Multiverse level (Took hits from Sora and Roxas, able to block an attack
      from Marluxia, survived all of his fights until using the last of his energy
      to help Sora save Kairi) | Complex Multiverse level
    source_ids:
    - vsbattles-marluxia-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Managed to survive multiple fights with fellow members of the
      Organization and managed to incapacitate Xion, who had obtained most of Roxas's
      power, before passing out from continual fatigue after back-to-back missions)
    source_ids:
    - vsbattles-marluxia-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range normally. Tens of Meters with thrown weapons and flame
      attacks. Low Multiversal with the Corridors of Darkness
    source_ids:
    - vsbattles-marluxia-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Genius (As he was able to scheme his way through Castle Oblivion by manipulating
      Sora and assassinating his fellow Organization members who are all rather intelligent
      in their own right. He was also able to incapacitate Xion on two occasions despite
      the fact that she contained most of Roxas's power at the time and fights evenly
      with Saix, one of the more powerful members of the Organization and dares to
      threaten Marluxia himself who is rather powerful in his own right. Axel is pragmatic
      when it comes to achieving his goals, threatening to kill Namine if it meant
      eliminating Marluxia. As commander of the Assassin Nobodies, Axel is also particularly
      skilled at remaining hidden, hiding his thoughts, and generally keeping his
      foes guessing. After becoming whole again as Lea, he has also spent a year's
      worth of time training on how to summon and use his Keyblade, but lacked proficiency
      and even had trouble getting it to appear. By the third game, and an unknown
      period of training, he appears to be very proficient with the use of a Keyblade,
      even being able to swap between it and the Eternal Flames in combat)
    source_ids:
    - vsbattles-marluxia-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
