  attack_potency:
    text: Multiverse level (Traded blows with Marluxia, although Marluxia was unlikely
      to be going all-out; was sent to Castle Oblivion by Xemnas with the intent of
      killing the rogue Organization XIII members; fought KHCoM Sora a few times,
      went up against Roxas after he regained his powers; was able to fight and defeat
      Xion who had much of Roxas's power at the time, and so should be above KHI Sora)
      | Complex Multiverse level (Should be comparable to Kairi)
    source_ids:
    - vsbattles-marluxia-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Outpaced and intercepted an attack from Master Xehanort, comparable
      to others that can travel across the worlds with a Keyblade Glider, which has
      been shown to also relate to direct physical movements and is comparable to
      the Gummi Ship based on Aqua and Ventus getting to the Keyblade Graveyard within
      a day just like it while also including the threat of Gummi Heartless, comparable
      to Xemnas, who reacted to Roxas going from Radiant Garden to the Keyblade Graveyard
      in seconds, not far behind Sora, who reacted to a Keyblade beam from Xehanort
      of a similar nature as this one)
    source_ids:
    - vsbattles-marluxia-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
