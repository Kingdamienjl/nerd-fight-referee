    - field: weaknesses
      value: 'He can only use his Final Limit when he''s hard-pressed, and stunning
        him with Light Magic will temporarily extinguish the flames that cover the
        floor of the ring he creates Notable Attacks/Techniques: *Explosion: Axel''s
        Limit Break, he engulfs his Chakrams in flames before throwing them at the
        enemy, generating a small explosion to deal heavy damage on impact. *Great
        Explosion: As his Final Limit, Axel is able to combine his chakrams to form
        a larger Chakram many times larger than his normal ones, allowing him to ignite
        it before sending it careening at an enemy to annihilate them with a massive
        burst of fire. *Ring of Flame: Axel is able to generate a ring of flame that
        acts as a physical wall for his foes, preventing their escape. The wall is
        completely opaque and virtually indestructible, only allowing Axel to pass
        through when he wills it. In doing so, Axel can make quick attacks and phase
        back through the flames, keeping his foes on their toes as they can never
        be sure where he''s going to come from. In addition, the ring of flames will
        also ignite the floor, continually burning Axel''s foes to ebb away their
        stamina. However, using Light Magic and throwing Axel to the floor to stun
        him will temporarily disperse some of the flames, giving Axel''s target more
        breathing room. ==Gallery== Eternal Flames KHII.png|Eternal Flames|link=http://www.khwiki.com/Eternal_Flames
