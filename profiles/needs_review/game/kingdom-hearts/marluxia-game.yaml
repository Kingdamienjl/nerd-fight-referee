    - field: weaknesses
      value: 'Can be very overconfident. Must be hard pressed to use his limit break.
        It takes a while for him to bring down his opponent''s "doom counter", Fire
        Manipulation Notable Attacks/Techniques: *Cresent Shockwave: Marluxia attacks
        the target with multiple strikes from his scythe. In Chain of Memories, Marluxia
        sends a single shockwave towards them. In Kingdom Hearts 2: Final Mix, Marluxia
        does the exact same thing as he did in the Final Mix version of Chain of Memories,
        except now he also does this with more hits should he be hard-pressed enough
        in battle. *Phantom Saber: Attacks from far away by creating shockwaves from
        his scythe. In Chain of Memories, Marluxia lunges at the target with a powerful
        slash from his scythe. In Kingdom Hearts ll: Final Mix, this move was likely
        redone to where Marluxia warps around the target and ferociously attacks them
        with his scythe, dealing over a dozen hits to them as a result. *Circle Reject:
        Marluxia creates three petal whirlwinds that spread out around the area in
        a circular motion. If the target is caught in one, he receives extensive damage.
        Then, while said target is trapped, Marluxia will strike with his scythe.
        In Chain of Memories, Marluxia taps the ground with his scythe and causes
        a circular shockwave behind him. The move later comes back and is redone in
        Kingdom Hearts ll: Final Mix, where Marluxia summons three energy pools of
        darkness that damage the target if they get caught in them. *Deathscythe:
        Marluxia slashes at the enemy three times with his scythe, causing fissures
        to appear in the ground in the wake of his scythe. In Kingdom Hearts: Chain
        of Memories, he simply swings his scythe downward unleashing a large vertical
        crescent wave on top of Sora. In Kingdom Hearts 2: Final Mix, Marluxia dives
        into the ground and wheels around the field swinging his scythe around, becoming
        something akin to a buzzsaw. *Blossom Shower: Marluxia warps to his enemies
        location several times, attacking. He then finishes the attack by creating
        a massive shockwave, causing several Flower-attributed lasers to rush at the
        target. In Kingdom Hearts: Chain of Memories, Marluxia merely bombards the
        target with a petal storm. In Kingdom Hearts ll: Final Mix, this move was
        likely redone as Marluxia''s desperation move. Marluxia rises up in the air
        and is surrounded by a pink aura, then teleports behind his target as dozens
        of dark energy pillars risen from the ground that try to barrage the target
        with. After the energy pillars are done, Marluxia then hurls his scythe at
        the target which hits several times before warping and dropping from above
        for one final hit. *Drop Shot: Marluxia leaps high into the air and lands,
        creating a web of fractures. *Bloom Out: Marluxia''s Limit Break. It allows
        him to charge attacks that cause him to swing his scythe multiple times across
        a large area, marked by a black ring. **Final Bloom: Marluxia''s Final Limit.
        While doing his Limit Break, Marluxia''s swings are faster, cover a larger
        area, and are followed by the release of a large, crescent-shaped projectile.
        *Doom Counter: An ability used by his Absent Silhouette. Marluxia curses his
        target by whispering something in their ear, where a sigil is formed over
        them and a "counter" appears over their head. During this time, the counter
        goes down by 1 every time Marluxia attacks the target with his scythe (which
        works differently from the normal Doom which brings down the counter by itself).
        Much like the normal Doom curse effect, however, the target is instantly finished
        should Marluxia succeed in bringing their counter down to 0. *Whirlwind of
        the Void: Marluxia summons a whirlwind around him to drag in his target before
        leaping at them with surprising speed and dealing several slashes with his
        scythe. *Aura of Thorns: Marluxia summons energy wisps of thorns around the
        target, where it then proceeds to explode on them after a short while. ==Notable
