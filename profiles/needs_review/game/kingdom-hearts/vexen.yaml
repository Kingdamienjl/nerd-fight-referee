  intelligence:
    text: 'Genius. True to his title, Vexen is the Organization''s foremost researcher,
      being one of its highest-ranked members and conducting experiments involving
      Sora and his memories for Vexen. This is best exemplified in his most well-known
      invention: Replicas, artificial Nobodies that are copies of other beings, demonstrating
      their abilities and combat prowess and can even develop personalities and gain
      hearts like normal Nobodies. He approaches life as if it were a grand experiment,
      formulating hypotheses and putting them to the test in a logical manner. However,
      he is arguably the least competent member of the Organization in combat, being
      the first among them to fall to Sora (but was finished off by Axel) and is reduced
      to begging for his life in the end. Nevertheless, he is far from incompetent
      in this regard, giving Sora a number of hard fights with his endless ice projectiles,
      replica creations, and some skill in melee combat. On the other hand he is frequently
      blinded by hubris, believing his rank to be a sign of authority and power within
      the Organization, not realizing that he was sent away to be done away with along
      with the rest and constantly taunting Sora until his demise'
    source_ids:
    - vsbattles-vexen-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
