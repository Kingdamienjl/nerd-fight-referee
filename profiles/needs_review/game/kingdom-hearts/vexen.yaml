  axis: hax
  text: Nobody Physiology, Genius Intelligence, Summoning (Can summon his main weapon.
    Can summon hordes Nobodies of and Heartless. His Nobodies have access to standard
    Nobody Physiology. His Heartless have access to standard Heartless Physiology),
    Power Nullification (Can break cards with the card break system by using cards
    with equal or higher values, which includes attacks and Resistances), Immortality
    Negation (Type 5, Can destroy the skeletal forms of the pirates despite them being
    neither alive nor dead), Data Manipulation, Information Analysis/Manipulation,
    Duplication, and Power Mimicry (Created a duplicate of Sora through absorbing
    data), Self-Sustenance (Type 1. Can breathe in space), Flight, Darkness Manipulation,
    Teleportation, Magic, Air Manipulation, Ice Manipulation, Memory Manipulation,
    Expert Shieldbearer Cosmic Radiations, Darkness Manipulation, Corruption (Type
    2) (His Black Coat protects him from the corrupting influence of the darkness
    of the lanes between and the Realm of Darkness), Time Stop (Can move inside of
    the Realm of Darkness), Information Manipulation (Unaffected by Namine's powers
    while in Castle Oblivion), Power Nullification (Can keep up with the Power Nullification
    of others in Castle Oblivion with his cards), Madness Manipulation (Type 3), Mind
    Manipulation, Memory Manipulation, Soul Manipulation, Willpower Manipulation (The
    Realm of Darkness has been stated to eradicate existence itself within it, and
    anyone who's traveled there have never returned. Ansem the Wise by being in the
    Realm of Darkness was losing his sense of self and memories, having to give into
    his hatred to survive. Aqua not long after being in the Realm of Darkness lost
    the will to continue, and needed to stay true to her friends to fight it), Ice
    Manipulation, (Unaffected by his own power), Possible Resistances to Void Manipulation,
    Attack Nullification, Power Nullification, Perception Manipulation, Attack Reflection
    (Via Nothing to Fear), Spatial Manipulation, Gravity Manipulation (Via Space in
    Its Place), Wind Manipulation, Paralysis Inducement (Via Flagging Winds), Earth
    Manipulation (Via Down to Earth), Mind Manipulation/ Illusion Creation, Pocket
    Reality Manipulation, Sealing, BFR, Power Mimicry, (Via Lose Your Illusion), Power
    Nullification (Via Sighing of the Moon), Fire Manipulation (Via Tears of Flame),
    Water Manipulation, Life Manipulation (Via Parting of Waters), Time Manipulation,
    Transmutation (Via Test of Time), Blindness, Death Manipulation, Curse Manipulation
    (Via Flowers Athirst), Electricity Manipulation (Via Stolen Thunder), Light Manipulation
    (Via Dying of the Light), and Resistances to all of the above via Master's Circle
  source_ids: *id003
  decisive: true
  status: unverified
