    the Underworld even to a Keyblade due to its curse), Fire Manipulation, Smoke
    Manipulation, Intangibility (Can turn into smoke), Necromancy, Soul Manipulation
    (Holds absolute control over the souls of the Underworld and is implied to control
    the lost souls of every world in the Kingdom Hearts universe. Can trap a person's
    soul in a statue to control them), Resurrection (Resurrected Auron and can resurrect
    the dead as he wishes), Darkness Manipulation, Telekinesis, Flight, Summoning
    (Both Heartless and Underworld's creatures like Cerberus), Animal Manipulation
    (Holds power over monsters and Underworld's creatures like Cerberus or the Hydra),
    Divine Magic, Body Puppetry (Took control of Zack Fair's body to force him to
    fight Terra), Creation (Created Auron's statue), Power Bestowal, Self-Sustenance
    (All types), Teleportation, Dimensional Travel, Non-Physical Interaction (Can
    harm Nobodies, which have Nonexistent Physiology), Resistance to Heat Manipulation
    (Unaffected by the Ice Titan's attack against Sora in KH III), Fate Manipulation/Life
    Manipulation and Death Manipulation (As a god, Hades can't be killed by the Sisters
    of Fate), Absorption, Death Manipulation (Unaffected by Heartless, which passively
    kill and absorb things around them), Data Manipulation (Ansem The Wise stated
    that the "heart" cannot be contained by data, and that the process itself would
    be incalculable), Existence Erasure (Can take hits from Heartless, which can do
    this with any attack)
  source_ids: *id003
  decisive: true
  status: unverified
