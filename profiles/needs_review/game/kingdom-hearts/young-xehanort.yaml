    with, and co-exists in the present with his future self), Flight/Levitation (Seen
    with Extreme Arcana), Energy Manipulation, Magic, Fire Manipulation (Via techniques
    such as Fire), Ice Manipulation (Via techniques like Blizzard), Electricity Manipulation
    (Via techniques like Thunder), Air Manipulation (Via techniques like Rapid Storm),
    Healing (Via techniques like Cure), Purification (Type 3, can cure poisoning with
    Poisona), KH Darkness Manipulation (Via Dark Break), Poison Manipulation (Via
    Poison), Status Effect Inducement (Can potentially inflict paralysis with Spinning
    Shadows), Statistics Amplification (Via techiques such as Strength Boost), Statistics
    Reduction (Can reduce magical defense of a target with Magic DEF Sap), Explosion
    Manipulation (Via Pumpkin Pummel), Resurrection (Via Charms) Existence Erasure
    (Can take hits from Heartless, which can do this with any attack), Absorption,
    Death Manipulation (Unaffected by Heartless, which passively kill and absorb things
    around them), KH Darkness Manipulation (Keyblade Armor protects their wearers
    from the corrupting effects of the darknessKingdom Hearts Dark Road, 2020 - The
    Worlds Outside) All previous, Aura, Time Manipulation (Able to stop time, slow
    down his enemies via time, travel through different time periods, and reverse
    the flow of time to either regain health or restart a battle from the very beginning),
    Magnetism Manipulation (Via Collision Magnet), Afterimage Creation, Sleep Manipulation,
    Dream Manipulation, Statistics Reduction, Power Nullification (Put Sora in a sleep
    so bad, that it entirely destroyed his powers, and induced a nightmare in the
    form of the Armored Ventus Nightmare), Summoning (Can summon his main weapons.
    Can summon hordes of Nobodies and Heartless. His Nobodies have access to standard
    Nobody Physiology. His Heartless have access to standard Heartless Physiology),
    Keyblade Master-level Fighter and Proficient Whip User, Curse and Death Manipulation
    via Doom (Casts a curse on enemies that starts a countdown from 6 seconds that
    when reaching zero, kills them), Explosion Manipulation (Via Mega Flare), Teleportation,
    Dimensional Travel, Spatial Manipulation, Healing and Forcefield Creation (Can
    create a barrier that also heals him if one attempts to hit him), Portal Creation
    (Can open Corridors of Darkness), Transformation (Can transform his Keyblade into
    a whip), Duplication (Can create solid clones that are as powerful and fast as
    him and can also use all of his abilities), Invisibility, Telekinesis, Immersion
    (Sent Sora through a screen and into the Verum Rex video game), Pocket Reality
    Manipulation (Made a copy of the Toy Box universe, plus the dimension in which
    the King of Toys appears, created an area in which to fight and take Riku there),
    Reality Warping (Stated to have "split" the Toy Story world into two worlds, one
    of the original and another that is as identical as the former. However, this
    is likely not combat-applicable), Self-Sustenance (Type 1. Can breathe in space
    and underwater) All previous, Time Stop (Still capable of moving even after Mickey
    cast Stopza. Can move inside of the Realm of Darkness, and the Keyblade allows
    the user to resist Magic-based Time Stop), KH Darkness Manipulation (Black Coats
    protect their wearers from the corrupting effects of the darkness of the Dark
    Corridors and the Realm of Darkness)
  source_ids: *id003
  decisive: true
  status: unverified
