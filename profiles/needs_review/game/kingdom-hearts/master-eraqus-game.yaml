    - field: intelligence
      value: As a Keyblade Master and and mentor of Ventus (Kingdom Hearts), Aqua,
        and Terra, Eraqus is a Keyblade Wielder of the highest caliber. Having taught
        the trio all he knows, he is able to utilize all of their specialties and
        more. He fails to show his full capabilities in his fight with Terra, but
        his battle data in the Mirage Arena shows that he is even able to mimic their
        Command Styles, modifying his scales to match the particular student he's
        fighting. However, he's staunch, bigoted, and single-minded in his quest to
        destroy the darkness, and like his student Terra, he's blind to Xehanort's
        machination until it's too late
      source_id: vsbattles-master-eraqus-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
