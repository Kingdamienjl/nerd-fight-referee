    - field: weaknesses
      value: 'His blind devotion to the light made him unaware of his fall to Darkness
        from his sheer hatred and prejudice, Too trusting of Xehanort until the end
        Notable Attacks/Techniques: ===Keyblade Techniques=== *Air Dive: A skill based
        on Ventus''s arsenal, Eraqus spirals through the air to strike the opponent.
        *Critical Impact: An attack based on Terra''s Command Style, Eraqus unleashes
        several downward slashes that generate earthquakes on impact with the ground.
        *Fever Pitch: An attack based on Ventus''s Command Style, Eraqus sends the
        target flying into the air with a rapid series of flying slashes. *Guren (Crimson):
        Eraqus generates three blades of light that hammer the ground, releasing a
        powerful eruption of flame from the spots he drove his swords into. *Issen
        (One Flash): Eraqus teleports to his target before slashing them three times
        in an instant. He may also perform this as an iaido-style attack, being much
        faster than the normal version and snaring the target on contact to prevent
        them from running away. *Kagerou (Heat Haze): Eraqus raises his Keyblade in
        the air, causing a pillar of light to erupt from the ground to damage the
        target. *Kasumi (Haze): Eraqus generates eight blades of light that follow
        the opponent, attempting to chop them to pieces. After a certain amount of
        time, Eraqus releases them all in a powerful burst, following the target in
        a parabolic arc. *Oboro (Hazy): Eraqus shines with light as he fires several
        light-based projectiles at his targets. *Nichirin (Sun): Eraqus generates
        eight blades of light and has them attacking his foes with a chopping motion
        before converting them into powerful beams to mow down his surroundings. He
        can also generate a powerful ring of lasers that oscillate up and down to
        make them harder to dodge. *Renzoku Kiri (Continuous Slash): Slashes a target
        eight times in an instant. *Reversal Slash: Upon being attacked from behind,
        Eraqus flips over his opponent to dodge the attack before countering with
        an attack of his own. *Tosshin Kiri (Rushing Slash): Similarly to Sonic Blade,
        Eraqus pauses for a moment before rushing at his target at high speed, thrusting
        his blade through them and stunning them, leaving them open to a Renzoku Kiri.
        *Zantetsuken: Eraqus dashes forward in an iaido-style attack, dealing massive
        damage as he attempts to bisect the target with a single powerful slash that
        seems to hit multiple times. ===Magic === *Barrier Surge: A skill based on
        Aqua''s arsenal, Eraqus rushes forth while protected by a barrier, ramming
        foes and deflecting incoming projectiles. *Chains of Light: Eraqus can ensnare
        targets with powerful chains of light, ensnaring them and allowing Eraqus
        to change his fighting style to match his opponent''s. *Meteor: Another attack
        based on Terra''s specialties, Eraqus ensnares the target and tears out huge
        chunk of the earth with his chains of light before blasting the chunk of earth,
        crushing and blasting the opponent with the resulting shrapnel and energy
        burst. This can only be dodged if one manage''s to break out of the chains
        and dodge at the exact moment. *Rainbow Shower: A skill based on Aqua''s Shotlock,
        Eraqus fires multiple multi-colored bursts of light that deal heavy damage
        and inflict various status conditions. *Spellweaver: An attack based on Aqua''s
        Command Style, Eraqus generates a barrier as he delivers several spiraling
        slashes before firing a slow-moving bubble at the opponent. *Tornado: A skill
        based on Ventus'' arsenal, Eraqus flies into the air, unleashing two slow-moving
        but powerful tornadoes to tear apart the foe. ==Notable Matchups== Victories
