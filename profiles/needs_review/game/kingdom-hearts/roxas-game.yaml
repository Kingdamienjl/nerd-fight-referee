    - field: standard_equipment
      value: '* Keyblade (Kingdom Key/Oathkeeper and Oblivion): Through channeling
        one''s strength of heart, the user can summon a Keyblade to use in battle.
        Through the use of the Keyblade, the user is granted increased strength, speed,
        durability, and increased magical power, as well as access to special abilities.
        Roxas'' personal Keyblades are Oathkeeper and Oblivion, two weapons that represent
        Sora''s memories of Kairi and Riku respectively (though his weapon at first
        was the Kingdom Key, the same weapon that Sora currently wields). He is able
        to wield them simultaneously due to the unique circumstances of his creation,
        unleashing torrents of light and darkness with each swing. * Black Coat: A
        magically enchanted coat that allows the wearer to pass through the Corridors
        of Darkness safely, warding off corrupting influences and preventing the power
        of Darkness from encroaching one''s mind and soul. It is also useful for stealth,
        as the hood completely obscures one''s face and blends in the with the shadows
        created by the Corridors of Darkness.'
      source_id: vsbattles-roxas-game-kingdom-hearts
      provider_id: vsbattles
