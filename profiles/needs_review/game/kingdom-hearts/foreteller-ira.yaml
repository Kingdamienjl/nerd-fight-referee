- id: claim-powers-and-abilities-224bd33d
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Standard Keyblade powers, Transformation
    (Can transform his Keyblade into a Keyblade Glider which allows for Flight and
    travel between worlds), Vehicular Mastery, Fire Manipulation, Electricity Manipulation,
    Air Manipulation, and Ice Manipulation, Healing (Via Curaga), Master Keyblade
    Wielder, Precognition (Can consult the Book of Prophecies to learn the future),
    Reality Warping via The Book of Prophecies (The Book of Prophecies can create
    accurate replications of the worlds recorded within it and can completely reshape
    entire worlds, being used to restore Daybreak Town after the Keyblade War), Self-Sustenance
    (Type 1. Can breathe in space) Ice Manipulation, Time Stop (Can move inside of
    the Realm of Darkness (Which is timeless in nature), and the Keyblade grants additional
    Resistance to Magic-based Time Stop), Absorption, Death Manipulation (Unaffected
    by Heartless, which passively kill and absorb things around them), Data Manipulation
    (Ansem The Wise stated that the "heart" cannot be contained by data, and that
    the process itself would be incalculable), Existence Erasure (Can take hits from
    Heartless, which can do this with any attack), and Cosmic Radiations, Corruption,
    Madness Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Empathic Manipulation (The Realm of Darkness has been stated to eradicate existence
    itself within it, and anyone who's traveled there have never returned. Ansem by
    being in the Realm of Darkness was losing his sense of self and memories, having
    to give into his hatred to survive. Aqua not long after being in the Realm of
    Darkness lost the will to continue, and needed to stay true to her friends to
    fight it)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
