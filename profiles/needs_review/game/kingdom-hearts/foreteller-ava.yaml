    the user is granted increased strength, speed, durability, and increased magical
    power, as well as access to special abilities, such as turning her keyblade into
    a Keyblade Glider.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-f77ed20d
  section: power_scale
  axis: battle_iq
  text: As a Keyblade Master, Ava is an expert in the use of the Keyblade and Magic.
    To this end, she is able to dispatch waves of Heartless on her own and dispatch
    Darksides with a single blow. In addition, her access to the Book of Prophecies
    allows her to obtain a great deal of information about the future and is a competent
    leader of thousands of Keyblade wielders as one of the Union Leaders. Unlike her
    fellow leaders, she recognized the inevitability of the Keyblade War after her
    numerous attempts to quell the infighting amongst the Unions, creating the Dandelions
    without the knowledge of the other Union Leaders, showing a great deal of guile
    and foresight when compared to her peers
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-ebebb718
  section: weaknesses
  axis: weakness
  text: Ava has a limited supply of magic and must take the time to recharge before
    using it again, Since she only has a portion of the Book of Prophecies, some of
    the information about the future, may be incomplete or missing, Is more vulnerable
    without her Keyblade, but this is mitigated by the fact that she can still cast
    magic and teleport her Keyblade back to her hand
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-556e2dfd
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Standard Keyblade powers, Fire Manipulation,
    Electricity Manipulation, Air Manipulation, Ice Manipulation, Healing (Via Curaga),
    Master Keyblade Wielder, Illusion Creation (Can disguise herself as any of the
    Foretellers with her magic and can even simulate entire rooms, their furniture,
    and other objects despite the actual surroundings being completely different),
    Precognition (Can consult the Book of Prophecies to learn the future), Memory
    Manipulation (Erased the Dandelions' memories of the Keyblade War), Reality Warping
    via the Book of Prophecies (The Book of Prophecies can create accurate replications
    of the worlds recorded within it and can completely reshape entire worlds, being
    used to restore Daybreak Town after the Keyblade War), Self-Sustenance (Type 1.
    Can breathe in space) Ice Manipulation, Time Stop (Can move inside of the Realm
    of Darkness (Which is timeless in nature), and the Keyblade grants additional
    Resistance to Magic-based Time Stop), Absorption, Death Manipulation (Unaffected
    by Heartless, which passively kill and absorb things around them), Data Manipulation
    (Ansem The Wise stated that the "heart" cannot be contained by data, and that
    the process itself would be incalculable), Existence Erasure (Can take hits from
    Heartless, which can do this with any attack), Cosmic Radiations, Corruption,
    Madness Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Empathic Manipulation (The Realm of Darkness has been stated to eradicate existence
    itself within it, and anyone who's traveled there have never returned. Ansem by
    being in the Realm of Darkness was losing his sense of self and memories, having
    to give into his hatred to survive. Aqua not long after being in the Realm of
    Darkness lost the will to continue, and needed to stay true to her friends to
    fight it)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
