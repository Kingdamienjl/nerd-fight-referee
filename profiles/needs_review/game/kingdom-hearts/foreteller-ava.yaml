  intelligence:
    text: As a Keyblade Master, Ava is an expert in the use of the Keyblade and Magic.
      To this end, she is able to dispatch waves of Heartless on her own and dispatch
      Darksides with a single blow. In addition, her access to the Book of Prophecies
      allows her to obtain a great deal of information about the future and is a competent
      leader of thousands of Keyblade wielders as one of the Union Leaders. Unlike
      her fellow leaders, she recognized the inevitability of the Keyblade War after
      her numerous attempts to quell the infighting amongst the Unions, creating the
      Dandelions without the knowledge of the other Union Leaders, showing a great
      deal of guile and foresight when compared to her peers
    source_ids: *id002
    confidence: 0.8
