        causing him to pass out. Notable Attacks/Techniques: *Donald Fire: Unleashes
        a firestorm at a target. *Donald Blizzard: Shoots a barrage of ice that can
        potentially hit multiple enemies. *Donald Thunder: Casts thunder from the
        sky. Very useful to hit multiple enemies from a distance. *Donald Cure: Healing
        spell. Restores most if not all of Donald''s health back. It also uses this
        to heal or revive his teammates. *Aeroga: Creates a wind barrier that halves
        any damage taken while active. Can also inflict damage to any enemies that
        get near the user. *Graviga: Donald creates a miniature event-horizon that
        crushes the target via gravity and can potentially render them temporarily
        defenseless. *Stopga: Stops time around the target for several seconds. Can
        also catch multiple targets if they are near the one that was cast on. *Fantasia:
        One of Donald''s limit attacks. He unleashes a barrage of fireworks to attack
        his enemies with. Useful when dealing with large groups of them. *Flare Force:
        Another one of Donald''s limit attacks. Donald unleashes a barrage of rockets
        at the targets (much like with Fantasia). *Zettaflare: Donald''s strongest
        attack in which unleashes a gigantic burst of fire at the opponent. Donald
        is incapacitated when this attack is used and is thus a desperation attack.
