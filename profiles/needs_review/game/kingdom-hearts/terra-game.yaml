        | As first, although seems to have less of the emotional/darkness related
        weaknesses shown in BbS Notable Attacks/Techniques: Command Styles Command
        Styles are special forms that Terra and his friends can use by repeatedly
        using specific types of attacks. Once activated, they provide a dramatic boost
        to their combat abilities and often imbue their attacks with elemental properties.
        *Critical Impact: Terra enters this form by executing several melee combos
        in a row, raising the power of his physical attacks even further. *Dark Impulse:
        By accepting the Darkness in his heart, Terra becomes enveloped in a jet black
        aura, enhancing his stats and gaining new attacks. The boost offered by this
        transformation was substantial enough for him to overwhelm a Keyblade Master
        like Eraqus in moments. *Rockbreaker: A Command Style specializing in the
        manipulation of earth, Terra tears up the ground with every swing, sending
        pillars of rock and large boulders at his targets to crush his foe. Shotlocks
        Shotlocks are powerful abilities that allow Terra to lock on to multiple targets
        or focus on a single target before unleashing a powerful barrage of attacks
        on all of them, dealing massive damage in the process. *Dark Volley: Terra
        shoots a large volley of dark energy blasts at the opponent. *Sonic Shadow:
        Terra jets around at high speed while cloaked in darkness, piercing throw
        enemies with his Keyblade. *Ultima Cannon: Terra''s ultimate Shotlock. It
        transforms his Keyblade into a cannon which shoots a large energy sphere at
        the opponent and explodes on contact, dealing phenomenal amounts of damage.
