    - field: standard_equipment
      value: 'Various recovery items, such as Potions, Ethers, and Elixirs *Keyblade:
        By channeling one''s strength of heart, the user can summon a Keyblade to
        use in battle. Through the use of the Keyblade, the user is granted increased
        strength, speed, durability, and increased magical power, as well as access
        to special abilities, like turning the Keyblade into a bike or whip. Terra
        is a complete master of the Keyblade, evident by the fact that he can morph
        his Keyblade into several different forms, including a whip, a bike, a bow,
        and a laser cannon among all other forms. Terra''s personal Keyblade is the
        Earthshaker, which is later upgraded into the more powerful Ends of the Earth.
        It has an average reach and offers an emphasis on physical attacks over magic
        and serves as the basis for almost all of his attacks. *Keyblade Armor: Normally
        kept as a simple shoulder plate when not in use, Terra can activate it at
        any time by placing his hand on it, covering him from head to toe in a futuristic
        suit of armor with bronze, black, and gold highlights. This suit of armor
        protects Terra from the Darkness and attacks that would directly target the
        Heart (soul) in addition to letting him survive the vacuum of space. However,
        since Terra already had darkness in his heart, it failed to save him from
        Xehanort''s attempt to possess him. Instead, his mind reanimated his Keyblade
        Armor and took up his Keyblade, becoming Lingering Will and beating Xehanort
        senseless to the point that the latter had trouble remembering his identity
        for several years.'
      source_id: vsbattles-terra-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Terra is a Keyblade Master-level combatant on par with his friends Ventus
        (Kingdom Hearts) and Aqua. Favoring slow, powerful attacks over Ventus's swift
        barrages and Aqua's magic, he crushes foes with the largest repertoire of
        attacks in the game, including the powerful Ars Solum and Zantetsuken attacks.
        While not as proficient as Aqua, Terra also has access to powerful and wide-reaching
        magic such as Quake and Meteor. In addition, much like Riku, his connection
        to the Darkness has given him access to dark-based attacks that his peers
        do not, such as Dark Haze and Chaos Blade. However, this boon also proves
        to be a weakness, as it renders Terra's heart vulnerable to possession. In
        addition, he has proven to be easy to manipulate as a result of his overly
        trusting nature and his fear of losing, becoming a pawn in Xehanort's game
        and eventually losing his body in the process. After becoming Lingering Will,
        Terra has become even more skilled, furiously attacking opponents with much
        faster and more precise combos and showcasing powerful energy and magical
        attacks alongside his new physical prowess
      source_id: vsbattles-terra-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The darkness in his heart constantly threatens to overwhelm him, he
        is somewhat easily manipulated, his attacks are comparably slow and his large
        frame makes it more difficult to dodge | The blast from his Ultima Cannon
        can be deflected back towards him and causing it to take damage instead, Lingering
        Will''s hold on the seals on his target can be nullified if he is continuously
        hit by the target. He seems to be somewhat detached from his surroundings,
        as he was unable to distinguish Sora from Xehanort until after their fight
        | As first, although seems to have less of the emotional/darkness related
        weaknesses shown in BbS Notable Attacks/Techniques: Command Styles Command
        Styles are special forms that Terra and his friends can use by repeatedly
        using specific types of attacks. Once activated, they provide a dramatic boost
        to their combat abilities and often imbue their attacks with elemental properties.
        *Critical Impact: Terra enters this form by executing several melee combos
        in a row, raising the power of his physical attacks even further. *Dark Impulse:
        By accepting the Darkness in his heart, Terra becomes enveloped in a jet black
        aura, enhancing his stats and gaining new attacks. The boost offered by this
        transformation was substantial enough for him to overwhelm a Keyblade Master
        like Eraqus in moments. *Rockbreaker: A Command Style specializing in the
        manipulation of earth, Terra tears up the ground with every swing, sending
        pillars of rock and large boulders at his targets to crush his foe. Shotlocks
        Shotlocks are powerful abilities that allow Terra to lock on to multiple targets
        or focus on a single target before unleashing a powerful barrage of attacks
        on all of them, dealing massive damage in the process. *Dark Volley: Terra
        shoots a large volley of dark energy blasts at the opponent. *Sonic Shadow:
        Terra jets around at high speed while cloaked in darkness, piercing throw
        enemies with his Keyblade. *Ultima Cannon: Terra''s ultimate Shotlock. It
        transforms his Keyblade into a cannon which shoots a large energy sphere at
        the opponent and explodes on contact, dealing phenomenal amounts of damage.
        Finishers and Exclusive Attacks *Ars Solum: Terra channels his strength of
        heart and his body is enveloped in a soft glow. Using a combination of fast
        and slow attacks, Terra hacks away at the enemy. *Chaos Blade: Terra uses
        the power of darkness to repeatedly teleport and slash an enemy, the speed
        of the warps leaving them unable to counterattack. *Dark Haze: Terra pauses
        for a moment before rushing through a group of enemies with a powerful darkness-infused
        strike with a small chance of instantly killing the target. *Demolition: Terra''s
        ultimate attack, he calls down numerous meteors to crash into the battlefield,
        dealing massive damage to all foes in range and has a 50% chance of stunning
        the target on impact. *Geo Impact: Terra leaps down from the air with his
        Keyblade, causing large boulders to come out of the ground and deal additional
        physical damage to enemies. *Meteor: Terra drops a meteorite on the battlefield
        that explodes on impact. *Quake: Terra triggers a localized earthquake and
        causes pillars of rock to erupt from the ground, dealing heavy earth-elemental
        damage across a wide area. *Warp: Terra warps his targets away from the battlefield,
        removing them permanently. *Zantetsuken: Terra executes a single, impossibly
        fast Keyblade strike, dealing a devastating amount of damage. Lingering Will
        *Ability Sealing: Lingering Will is able to temporarily seal his opponent''s
        abilities with a special magic formation, preventing the opponent from using
        physical attacks or magical attacks/or other special skills depending on whether
