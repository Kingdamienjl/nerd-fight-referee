    - field: standard_equipment
      value: 'Various recovery items, such as Potions, Ethers, and Elixirs *Keyblade:
        By channeling one''s strength of heart, the user can summon a Keyblade to
        use in battle. Through the use of the Keyblade, the user is granted increased
        strength, speed, durability, and increased magical power, as well as access
        to special abilities, like turning the Keyblade into a bike or whip. Terra
        is a complete master of the Keyblade, evident by the fact that he can morph
        his Keyblade into several different forms, including a whip, a bike, a bow,
        and a laser cannon among all other forms. Terra''s personal Keyblade is the
        Earthshaker, which is later upgraded into the more powerful Ends of the Earth.
        It has an average reach and offers an emphasis on physical attacks over magic
        and serves as the basis for almost all of his attacks. *Keyblade Armor: Normally
        kept as a simple shoulder plate when not in use, Terra can activate it at
        any time by placing his hand on it, covering him from head to toe in a futuristic
        suit of armor with bronze, black, and gold highlights. This suit of armor
        protects Terra from the Darkness and attacks that would directly target the
        Heart (soul) in addition to letting him survive the vacuum of space. However,
        since Terra already had darkness in his heart, it failed to save him from
        Xehanort''s attempt to possess him. Instead, his mind reanimated his Keyblade
        Armor and took up his Keyblade, becoming Lingering Will and beating Xehanort
        senseless to the point that the latter had trouble remembering his identity
        for several years.'
      source_id: vsbattles-terra-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Terra is a Keyblade Master-level combatant on par with his friends Ventus
        (Kingdom Hearts) and Aqua. Favoring slow, powerful attacks over Ventus's swift
        barrages and Aqua's magic, he crushes foes with the largest repertoire of
        attacks in the game, including the powerful Ars Solum and Zantetsuken attacks.
        While not as proficient as Aqua, Terra also has access to powerful and wide-reaching
        magic such as Quake and Meteor. In addition, much like Riku, his connection
        to the Darkness has given him access to dark-based attacks that his peers
        do not, such as Dark Haze and Chaos Blade. However, this boon also proves
        to be a weakness, as it renders Terra's heart vulnerable to possession. In
        addition, he has proven to be easy to manipulate as a result of his overly
        trusting nature and his fear of losing, becoming a pawn in Xehanort's game
        and eventually losing his body in the process. After becoming Lingering Will,
        Terra has become even more skilled, furiously attacking opponents with much
        faster and more precise combos and showcasing powerful energy and magical
        attacks alongside his new physical prowess
      source_id: vsbattles-terra-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
