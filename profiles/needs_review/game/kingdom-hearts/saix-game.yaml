    - field: intelligence
      value: "Sa\xEFx was an important and extremely competent retainer of Xemnas,\
        \ handling most of the day-to-day affairs of the Organization and generally\
        \ ordering the other members around. He is an extremely skilled manipulator,\
        \ claiming to know how to injure a heart despite not having one and sending\
        \ away the useless and traitorous members of the Organization to Castle Oblivion\
        \ to be eliminated by Sora or Axel. In combat, he trades this intelligence\
        \ for sheer brute force, becoming a berserker that tears apart his targets\
        \ with reckless abandon. However, this proves to be his downfall, as he is\
        \ blinded by rage while in this form, allowing Sora to seize his duplicate\
        \ Claymores and counter Sa\xEFx with his own attacks."
      source_id: vsbattles-saix-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "While it makes him stronger and faster, his berserk state appears to\
        \ leave him incredibly aggressive and makes him lose most of his rational\
        \ processes. Using his weapon against him can take Sa\xEFx out of his Berserker\
        \ state, making him go back to normal and temporarily weakens him, requiring\
        \ him to absorb more power back from KH. Must be hardpressed to use his Limit\
        \ Break. Notable Attacks and Techniques: Lunatic_KHD.png|Lunatic All Shall\
        \ Be Lost To You!.gif|All Shall Be Lost To You! Begone!.gif|Begone! Berserk_KHD.gif|Berserk\
        \ Claymore Drop.gif|Claymore Drop Move Aside.gif|Move Aside! * Berserker Mode:\
        \ Sa\xEFx's special ability is to absorb power from the Moon (ex. Kingdom\
        \ Hearts) and enter a \"Berserker\" state like the Nobodies he commands; the\
        \ transformation alone releases a powerful shockwave burst that deals damage\
        \ to anyone near him. In addition to the boosted strength and speed, his durability\
        \ is also increased to the point of being invulnerable to Sora's attacks.\
        \ However, he is vulnerable to his own weapon while in this state, and it\
        \ is only temporary, requiring him to absorb more power from the Moon to reactivate\
        \ it. ** Lunar Divination: Sa\xEFx raises his arms into the air and absorbs\
        \ power from the Moon and Kingdom Hearts, generating the energy necessary\
        \ to enter his Berserker Mode if given enough time. In addition, an aura surrounds\
        \ Sa\xEFx that prevents him being interrupted unless hit with a particularly\
        \ powerful or stunning blow and he is unable to attack during this period.\
        \ * All Shall Be Lost to You!: While in Berserker Mode, Sa\xEFx flies around\
        \ his surroundings and rapidly thrashes the surrounding area, leaving circles\
        \ of blue flames in his wake that quickly dissipate and jumping periodically\
        \ to slam the ground even harder to release larger shockwaves. He finishes\
        \ this by dashing at the opponent at high speed, unleashing waves of flame\
        \ similar to Begone! In addition, this attack is known as Berserk in 358/2\
        \ Days, acting as Sa\xEFx's Limit Break, showing that he can forcibly enter\
        \ Berserker Mode when in dire straits. * Begone!: While in Berserker Mode,\
        \ Sa\xEFx repeatedly shouts and slams the tips of his Claymore into the ground,\
        \ sending out waves of fire in a fan-like pattern before tossing his Claymore\
        \ at the opponent, resulting in an additional eruption of flame. * Claymore\
        \ Drop: Sa\xEFx jumps into the air and throws his Claymore at the floor, generating\
        \ a wide and powerful shockwave that tosses foes into the air. * Move Aside!:\
        \ Sa\xEFx tosses his Claymore at the enemy to deal great damage and send them\
        \ skyward from the force behind it. ==Notable Matchups== Victories: Losses:\
