        Kick djkick.gif|Air Knee, Air Kick Juggle Axel''s fighting style is a modified,
        superhumanly acrobatic and superpowered version of Kung-Fu that also incorporates
        various other combat styles such as karate, boxing and kickboxing, which he
        has refined for over a decade. Originally the all-rounder of the Streets of
        Rage 1 trio, with his only weakness being relatively poor air combat, Axel
        evolves through the series to become a powerhouse, gaining many fire-based
        moves which he can use to great effect as both crowd control and single-target
        damage. He is not afraid to fight dirty against crime, with his move-set including
