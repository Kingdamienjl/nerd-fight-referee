    - field: weaknesses
      value: 'Somewhat weak in the air in Streets of Rage 1, special moves consume
        some health when used too frequently. Notable Attacks/Techniques: |-|Normal
        Attacks= sorjab.gif|Jab Sorlmao.gif|Flurry, Vault, Backdrop nthrow.gif|Grab
        Neutral Attack bthrow.gif|Grab Back Attack njkick.gif|Air Kick Neutral fjkick.gif|Air
        Kick djkick.gif|Air Knee, Air Kick Juggle Axel''s fighting style is a modified,
        superhumanly acrobatic and superpowered version of Kung-Fu that also incorporates
        various other combat styles such as karate, boxing and kickboxing, which he
        has refined for over a decade. Originally the all-rounder of the Streets of
        Rage 1 trio, with his only weakness being relatively poor air combat, Axel
        evolves through the series to become a powerhouse, gaining many fire-based
        moves which he can use to great effect as both crowd control and single-target
        damage. He is not afraid to fight dirty against crime, with his move-set including
        knee strikes, headbutts and the usage of any weapon he can find on the streets.
        (Note that the moves tagged with the acronym of any game in the series are
        only accessible to Axel from that point in the series) *Jab (Punch, Punch
        2, Right Punch, Mid Kick, High Kick): Axel throws two jabs, one straight,
        a middle kick and finishes with a strong high kick. **Charged'
