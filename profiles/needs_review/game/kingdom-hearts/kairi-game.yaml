    - field: weaknesses
      value: "Has somewhat poor combat experience | Has yet to be fully capable of\
        \ wielding her Keyblade, does not have much combat experience other than taking\
        \ out some low level Heartless | None notable Notable Attacks/Techniques:\
        \ *Flower Shoot: Kairi fires a ball of light at the target. *Seven Wishes:\
        \ Kairi cover herself in a light aura and then charges, slashing the enemy\
        \ with her Keyblade at various angels. *Barrier: Kairi briefly creates a spherical\
        \ forcefield of light around herself. *Starcracker: A counterattack Kairi\
        \ uses while being attacked during her Barrier technique. She shatters the\
        \ barrier, unleashing a blast of light that repel and damages foes. *Heart\
        \ of a Princess: Kairi will summon multiple explosive orbs of light from above\
        \ to rain her opponent down. *Firaga: Kairi shoots out a ball of fire that\
        \ sets her enemies ablaze. *Blizzaga: A powerful ice spell that fires a shard\
        \ of ice that pierces foes, fragmenting like shrapnel and dealing several\
        \ ticks of damage to foes it passes through. *Thundaga: Kairi will summon\
        \ lightning bolts from the sky to strike her foes *Aeroga: Kairi create a\
        \ wind vortex that blows away her enemies while dealing damage in the process\
        \ *Curaga: A healing spell that brings Kairi and nearby allies back to full\
        \ health, reviving them if they had recently fallen to enemy attacks Powers\
        \ as a Princess of Heart: Because Kairi is a Princess of Heart, her heart\
        \ possesses no darkness within it, leading to the unique birth of Namin\xE9\
        \ when she accidentally gives it to Sora, who later sacrificed himself to\
        \ restore her heart. Should her heart be lost, her body will remain in a dormant\
        \ state until it returns, as revealed in the first game when her heart was\
        \ lost. *Like the other princesses, she has the power to open the Final Keyhole\
        \ to Kingdom Hearts in Hollow Bastion once she is gathered with the rest of\
        \ the princesses. This could be considered as the princesses' main power.\
        \ *Kairi also appears to have some kind of latent magical ability, as seen\
        \ when she manages to restore Sora's humanity after he becomes a Heartless.\
        \ However, it could imply that she is only able to restore him because they\
        \ share the strongest connection. *Since the other Princesses of Heart possess\
        \ the abilities to hold back the darkness and upgrade other people's powers,\
        \ it is no doubt that Kairi can do so as well. *Aqua cast a charm on Kairi\
        \ in Birth by Sleep so that if she was ever captured by darkness, her light\
        \ would lead her to the light of another. In an interview, Tetsuya Nomura\
        \ stated it was this charm that led Kairi to Destiny Islands. *She additionally\
        \ has the ability to sense darkness, as the other Princesses of Heart are\
        \ able to tell Sora of great darkness nearby. It may also imply to why she\
        \ was looking ill when Destiny Islands was devoured by the darkness before\
        \ she disappeared. *In the manga, according to Axel, Kairi is able to travel\
        \ through the Corridor of Darkness without any negative effects because she\
        \ is a Princess of Heart. Keyblade Wielding: Kairi is able to wield a Keyblade\
        \ due to her having touched Aqua's Keyblade many years prior to the events\
        \ of Kingdom Hearts. Kairi's abilities in combat are limited. Kairi cannot\
        \ do much when she is in danger\u2014she has to depend on Sora or Riku to\
        \ come to her aid, and as such, she is fairly easily captured. This is seen\
        \ when Axel merely grabbed Kairi by the wrist and effortlessly dragged her\
        \ along with him; though, in the manga, she is shown to be more aggressive\
        \ and tries to put up a fight, throwing punches at Nobodies and biting Axel's\
        \ hand. During the events that take place in The World That Never Was, Riku\
        \ hands her Destiny's Embrace, allowing Kairi to protect herself without any\
        \ help. She is shown to be fairly competent with it and was shown to take\
        \ out two Heartless on her own in one cutscene. Her potential is recognized\
        \ by Yen Sid, who has Riku bring her to him to begin training with the Keyblade\
        \ to become stronger. ==Notable Matchups== Victories: Losses: Inconclusive:\
