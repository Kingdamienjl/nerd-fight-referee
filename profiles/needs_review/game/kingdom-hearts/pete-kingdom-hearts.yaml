    Negation (Type 5; Can destroy the skeletal forms of the pirates despite them being
    neither alive nor dead), Resistance to Darkness Manipulation, Absorption, Death
    Manipulation (Unaffected by Heartless, which passively kill and absorb things
    around them), Data Manipulation (Ansem The Wise stated that the "heart" cannot
