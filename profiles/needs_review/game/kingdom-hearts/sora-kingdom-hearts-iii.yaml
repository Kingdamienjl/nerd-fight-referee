    - field: intelligence
      value: "Pre-Keyblade= Average, while Sora has played with a wood sword to pass\
        \ time with his friends for a while, he's still remarked on mainly swinging\
        \ it like a toy, and lacks experience in general, but has still been able\
        \ to keep pace with Riku (both in combat and on a race), somebody slightly\
        \ older, at the time, and three kids of his age at once. Besides combat, while\
        \ Sora has only been in Destiny Islands, and so is quite unaware of much else,\
        \ the fact Kairi was confirmed to go to school a bit after the start of KHII\
        \ implies Sora was subject to an educative system previously, Sora was also\
        \ clever enough to find the items Kairi requested for the trip in the raft\
        \ they were going to have, notably including swimming for fish and pushing\
        \ a boulder for a mushroom. |-|KHI= {{#tag:tabber|{{!}}-{{!}}Combat= Gifted,\
        \ Sora has taught himself a variety of Keyblade techniques, magical spells,\
        \ and supporting abilities that have served him well on his journeys in just\
        \ a few months, even being compared to Keyblade Masters, which when trained\
        \ formally normally take years to even be considered as such, while also having\
        \ fought countless foes on a wide variety of environments such as while airbone,\
        \ grounded and underwater, even having fought as a merman on the last one\
        \ without much issue, and could make the most of his own abilities to counteract\
        \ the Phantom's intangibility. {{!}}-{{!}}Everything else= Above Average,\
        \ likely Gifted, Sora could also eventually grasp how to drive the Gummi Ship,\
        \ an inter-universal travel device to travel between the Worlds in the Ocean\
        \ Between, while also dodging hostile ships and attacking back with proper\
        \ aim of his own. Sora has also traveled across several Worlds alongside Donald\
        \ Duck and Goofy, and so is experienced with several kinds of cultures and\
        \ ways to blend in them without disrupting their order, although he forgets\
        \ to do so at times regardless, and has a good memory on patterns as he can\
