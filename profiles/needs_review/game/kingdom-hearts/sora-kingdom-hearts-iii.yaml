        unable to revert back to his normal form unless the Drive Guage runs out,
        Sora''s Resurrection takes place within the Final World until he time travels,
        rendering him vulnerable to those that can follow him to the Final World Notable
        Attacks/Techniques: |-|Keyblade Techniques= {{#tag:tabber|{{!}}-{{!}}KHI=
