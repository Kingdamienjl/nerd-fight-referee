    - field: weaknesses
      value: 'Sora''s supply of mana is not infinite, forcing Sora to use his supply
        of magic sparingly and thoughtfully (but it can recharge over time, or Sora
        can either use a mana potion, summon Bambi, get himself hit that can recharge
        it, or by using a drive form). Has not shown any skill in unarmed combat.
        Could be defenseless if one manages to disarm him (but this weakness is mitigated
        by the fact that Sora could either summon back his keyblade to his hand right
        away, use his Anti-Form, Flowmotion, or his magic spells to fight). Feats:
        *Became the Kingdom Key''s chosen wielder. *Took on and defeated Sephiroth
        twice. *Fought Xemnas along with Donald, Goofy, and The Beast in KH: Final
        Mix when he only had half a heart (This means that, from a story and power
        standpoint, he was incomplete when he didn''t have Roxas with him, meaning
        Sora was "half as powerful" at the time of said fight) *Overpowered a giant,
        solid stone heartless while nerfed as a small lion (Lifting Strength) *Fought
        and taken several god-like beings such as Genie Jafer, Hades, Sephiroth, Ansem,
        Xemnas, etc. *Responsible for the destruction of most of the Original Organization
        XIII. *Along with Riku, defeated Xemnas who had absorbed an incomplete Kingdom
        Hearts. A complete one being capable of restoring hundreds of worlds to normal.
        *Contended with and defeated/stalemated the Lingering Will, a being with power
        and mastery over the Keyblade far above that of Sora and even Terra himself
        (even though the Lingering Will is a suit of armor that contains Terra''s
        mind within). *Took on an army of 1,000 Heartless by himself and without rest.
        *Has traveled to many worlds doing nothing but primarily fighting.'
