- id: claim-powers-and-abilities-6195d032
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Standard Keyblade powers plus the Power
    of Waking, Small Size (Type 0), Vehicular Mastery (Capable of using the Gummi
    Ship), Magic (Time Stop (Via Stopga), Flight, Energy Manipulation, Magnetism Manipulation,
    Gravity Manipulation, Light Manipulation (Can use several light based attacks
    as a warrior of light), Darkness Manipulation, Teleportation, Healing (Via Curaga
    and Hi-Potion), Forcefield Creation (Via Reflega), Information Analysis (Via Scan
    which allows him to view his opponent's health), Homing Attack (Via Holy and Pearl),
    Damage Reduction (Via Damage Control which halves the damage he takes if he's
    at low health), Forcefield Creation, Master Keyblade Wielder, Size Manipulation
    (Minimizes enemies with Mini), Status Effect Inducement (Has a chance of stunning
    enemies with Holy, His D-Link (His power summoned by someone else) has the Sign
    of Faith technique which stuns enemies), Paralysis Inducement (His D-Link has
    the Binding Strike technique which binds some enemies in place), Self-Sustenance
    (Type 1. Can breathe in space, rescued Ventus and Aqua from the Lanes Between
    without any sort of armor for protection) Light Manipulation (By being affiliated
    with the element of light, he naturally resists it), Ice Manipulation, Darkness
    Manipulation, Time Stop (Can move in the Realm of Darkness, and the Keyblade grants
    a Resistance to Magic-based Time Stop), Cosmic Radiations, Corruption (His KH3
    clothing and Black Coat protects him from the corrupting effects of the darkness
    of the lanes between and the Realm of Darkness), Existence Erasure (Can take hits
    from Heartless, which can do this with any attack), Absorption, Death Manipulation
    (Unaffected by Heartless, which passively kill and absorb things around them),
    Data Manipulation (Ansem The Wise stated that the "heart" cannot be contained
    by data, and that the process itself would be incalculable), Madness Manipulation
    (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation, Empathic
    Manipulation (The Realm of Darkness has been stated to eradicate existence itself
    within it, and anyone who's traveled there have never returned. Ansem the Wise
    by being in the Realm of Darkness was losing his sense of self and memories, having
    to give into his hatred to survive. Aqua not long after being in the Realm of
    Darkness lost the will to continue, and needed to stay true to her friends to
    fight it)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
