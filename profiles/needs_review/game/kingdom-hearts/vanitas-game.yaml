    - field: intelligence
      value: Vanitas is an exceedingly skilled Keyblade Wielder and Magic user, being
        able to fight Keyblade Master-level opponents like Aqua and Mickey on even
        ground. Like his other half, Ventus (Kingdom Hearts), he is exceedingly quick
        and aggressive in combat, assaulting foes with high-speed attacks and creating
        afterimages as he moves to confuse opponents and weaving in powerful magic
        like Blizzaga into his swordplay. He is also able to perform incredible acrobatics
        maneuvers to disorient foes such as riding waves of Keyblades and using them
        as battering rams. However, due to embodying all of Ventus's dark emotions,
        he displays a certain degree of pride and overconfidence, repeatedly underestimating
        Ventus's power which leads to Vanitas's ultimate defeat
