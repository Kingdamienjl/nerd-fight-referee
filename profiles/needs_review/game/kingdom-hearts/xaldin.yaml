    - field: weaknesses
      value: 'Xaldin relies on his lances for attack as well as defense, so he''s
        left wide open should his initial assault be deflected, Xaldin is something
        of a pessimist but is also a sadist in combat, must be hardpressed to use
        his Limit Break Notable Attacks and Techniques:, Aero: Xaldin is extremely
        accomplished in the use of this magic, utilizing it for sustained flight and
        firing powerful blasts of compressed wind as projectiles. In addition, greatly
        reducing the damage he takes for as long as this barrier remains active.,
        Air Bullets: Xaldin rapidly spins his spears in front of him in a circle,
        deflecting incoming attacks and firing homing bursts of compressed air as
        projectiles. However, these bullets are rather slow and easily blocked., Dragon''s
        Breath: One of Xaldin''s desperation attacks, he shapes his lances into the
        shape of a dragon which "breathes" a powerful blast of wind that sweeps across
        the battlefield., Dragoon''s Storm: Xaldin''s Limit Break in which he viciously
        whips his lances around his surroundings, deterring incoming melee attackers
        and tearing apart those foolish enough to approach him before he brings his
        weapons down to impale his foes., Jump: Xaldin quickly ascends out of sight
        before coming down on his opponent at high speeds to impale them. Even if
        the opponent manages to dodge the attack, the resulting shockwave will blow
        them backward and leave them open to additional attacks., Sweeping Spears:
        Xaldin swings his lances in front of him to brush aside foes who attempt to
        close the distance between them.'
