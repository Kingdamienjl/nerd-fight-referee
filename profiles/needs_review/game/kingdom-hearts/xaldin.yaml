- id: claim-intelligence-77883124
  section: power_scale
  axis: battle_iq
  text: Xaldin, as the third most powerful member of the Organization alongside Lexaeus,
    is a force to be reckoned with in combat. He relies on telekinetic and wind attacks
    for furious and powerful chains of attacks, never giving his opponents a chance
    to breathe. As a Dragoon, he specializes in aerial attacks, coming down on his
    foes from above with powerful dives and keeping himself cloaked in Aero magic
    to grant himself constant flight. In addition to his fearsome combat prowess,
    he is also skilled in psychological exploitation, constantly taunting and demeaning
    his foes to get to slip up and give in to their inner darkness, being charged
    by Xemnas himself to turn Beast into a Heartless.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-cfdfcfd2
  section: weaknesses
  axis: weakness
  text: 'Xaldin relies on his lances for attack as well as defense, so he''s left
    wide open should his initial assault be deflected, Xaldin is something of a pessimist
    but is also a sadist in combat, must be hardpressed to use his Limit Break Notable
    Attacks and Techniques: * Aero: Xaldin is extremely accomplished in the use of
    this magic, utilizing it for sustained flight and firing powerful blasts of compressed
    wind as projectiles. In addition, he is able to create a barrier of wind to deflect
    all incoming attacks, greatly reducing the damage he takes for as long as this
    barrier remains active. * Air Bullets: Xaldin rapidly spins his spears in front
    of him in a circle, deflecting incoming attacks and firing homing bursts of compressed
    air as projectiles. However, these bullets are rather slow and easily blocked.
    * Dragon''s Breath: One of Xaldin''s desperation attacks, he shapes his lances
    into the shape of a dragon which "breathes" a powerful blast of wind that sweeps
    across the battlefield. * Dragoon''s Storm: Xaldin''s Limit Break in which he
    viciously whips his lances around his surroundings, deterring incoming melee attackers
    and tearing apart those foolish enough to approach him before he brings his weapons
    down to impale his foes. * Jump: Xaldin quickly ascends out of sight before coming
    down on his opponent at high speeds to impale them. Even if the opponent manages
    to dodge the attack, the resulting shockwave will blow them backward and leave
    them open to additional attacks. * Sweeping Spears: Xaldin swings his lances in
    front of him to brush aside foes who attempt to close the distance between them.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-cc33e80a
  section: abilities
  axis: hax
  text: Nobody Physiology, Summoning (Can summon his main weapon. Can summon hordes
    Nobodies of and Heartless. The Nobodies specifically commanded by him have access
    to standard Nobody Physiology plus Expert Spearmanship, Flight, Shockwave Generation
    and Elasticity. His Heartless have access to standard Heartless Physiology), Immortality
    Negation (Type 5, Can destroy the skeletal forms of the pirates despite them being
    neither alive nor dead), Self-Sustenance (Type 1. Can breathe in space), Air Manipulation,
    Paralysis Inducement (Can create gusts of winds to immobilize foes), Darkness
    Manipulation, Flight, Teleportation, Forcefield Creation (Created a barrier to
    shield Beast's enchanted rose), Expert Lancer, Telekinesis, Social Influencing
    (Manipulated Beast into mistrusting and acting antagonistic against Belle, Sora,
    Donald and Goofy), Transformation (Can give his spears the shape of a dragon),
    Homing Attack (Can shoot homing bursts of compressed air) Ice Manipulation, Cosmic
    Radiations, Darkness Manipulation, Corruption (His Black Coat protects him from
    the corrupting influence of the Darkness of the lanes between and the Realm of
    Darkness), Time Stop (Can move inside of the Realm of Darkness), Information Manipulation
    (Should scale to his fellow Nobodies who were unaffected by Namine's powers),
    Madness Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Willpower Manipulation (The Realm of Darkness has been stated to eradicate existence
    itself within it, and anyone who's traveled there have never returned. Ansem the
    Wise by being in the Realm of Darkness was losing his sense of self and memories,
    having to give into his hatred to survive. Aqua not long after being in the Realm
    of Darkness lost the will to continue, and needed to stay true to her friends
    to fight it), Air Manipulation, Paralysis Inducement (Unaffected by his own power),
    Possible Resistances to Void Manipulation, Attack Nullification, Power Nullification,
    Perception Manipulation, Attack Reflection (Via Nothing to Fear), Spatial Manipulation,
    Gravity Manipulation (Via Space in Its Place), Ice Manipulation (Via Ice Breaker),
    Earth Manipulation (Via Down to Earth), Mind Manipulation/ Illusion Creation,
    Pocket Reality Manipulation, Sealing, BFR, Power Mimicry, (Via Lose Your Illusion),
    Power Nullification (Via Sighing of the Moon), Fire Manipulation (Via Tears of
    Flame), Water Manipulation, Life Manipulation (Via Parting of Waters), Time Manipulation,
    Transmutation (Via Test of Time), Blindness, Death Manipulation, Curse Manipulation
    (Via Flowers Athirst), Electricity Manipulation (Via Stolen Thunder), Light Manipulation
    (Via Dying of the Light), and Resistances to all of the above via Master's Circle
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
