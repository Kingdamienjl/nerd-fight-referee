    text: Xaldin, as the third most powerful member of the Organization alongside
      Lexaeus, is a force to be reckoned with in combat. He relies on telekinetic
      and wind attacks for furious and powerful chains of attacks, never giving his
      opponents a chance to breathe. As a Dragoon, he specializes in aerial attacks,
      coming down on his foes from above with powerful dives and keeping himself cloaked
      in Aero magic to grant himself constant flight. In addition to his fearsome
      combat prowess, he is also skilled in psychological exploitation, constantly
      taunting and demeaning his foes to get to slip up and give in to their inner
      darkness, being charged by Xemnas himself to turn Beast into a Heartless.
