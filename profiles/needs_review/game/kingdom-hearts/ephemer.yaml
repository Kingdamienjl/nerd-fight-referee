  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Standard Keyblade powers, Statistics
    Amplification (Can boost his attack and defense considerably), Status Effect Inducement,
    Flight, Magic, Elemental Manipulation (Of the Fire, Lightning, Wind, Ice, Darkness,
    and Light variety), Healing (Via Curaga), Expert Keyblade Wielder, Self-Sustenance
    Ice Manipulation, Time Stop (Can move inside of the Realm of Darkness (Which is
    timeless in nature), and the Keyblade grants additional Resistance to Magic-based
    Time Stop), Absorption, Death Manipulation (Unaffected by Heartless, which passively
    kill and absorb things around them), Data Manipulation (Ansem The Wise stated
    that the "heart" cannot be contained by data, and that the process itself would
    be incalculable), Existence Erasure (Can take hits from Heartless, which can do
    this with any attack), Cosmic Radiations, Darkness Manipulation, Corruption, Madness
    Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Empathic Manipulation (The Realm of Darkness has been stated to eradicate existence
    itself within it, and anyone who's traveled there have never returned. Ansem the
    Wise by being in the Realm of Darkness was losing his sense of self and memories,
    having to give into his hatred to survive. Aqua not long after being in the Realm
    of Darkness lost the will to continue, and needed to stay true to her friends
    to fight it)
  source_ids: *id003
  decisive: true
  status: unverified
