    - field: intelligence
      value: Larxene is an exceptionally capable combatant, easily dominating Sora
        and the Riku Replica in their first fight, jabbing and kicking at them faster
        than they can react and knocking them into a wall before they retaliate. She
        specializes in close-range melee combat, utilizing her speed to overwhelm
        foes with flurries of jabs and kicks, their effectiveness increased by her
        usage of knives. She is also prone to swarm tactics, generating duplicates
        to attack foes from multiple directions at once and to break through persistent
        defenses. She is also incredibly skilled in the use of magic, particularly
        lightning magic, being Roxas' tutor in the art (albeit unwillingly). She utilizes
        this to full effect in her fights, constantly assailing foes with nearly endless
        downpours of lightning bolts and charging herself with lightning to unleash
        even more powerful and swift attacks. Larxene is also a sadist, reading Marquis
        de Sades' works with glee and dragging out her foes' pain and preying on their
        mental weaknesses by consistently taunting them for their failures. As a result,
        she is able to strike fear into nearly any opponent, even the Riku Replica,
        which claimed to feel no fear. However, this also means that while she specializes
        in speed-blitzing her foes, she sometimes fails to get serious enough or drags
        out the fight to enjoy it more
      source_id: vsbattles-larxene-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Larxene is somewhat arrogant and is a complete sadist, Her duplicates
        can be nullified by tossing them into each other and the original to forcibly
        merge them back into one, temporarily negating Larxene''s ability to create
        more duplicates and leaving her weakened and vulnerable, Needs to be hard-pressed
        to use her Limit Break Notable Attacks/Techniques: *Blitz: Larxene generates
        four duplicates before they all teleport around the opponent in a star formation,
        rushing the opponent from all sides with their knives. *Lightning Barrage:
        Larxene constantly rains powerful lightning bolts on her foes, in various
        patterns, such as in a ring around her to repel attackers or directly on top
        of her foes and climbing with them as they shoot their victim into the sky.
        *Lightning Cage: Larxene and four duplicates press the assault on her foes
        with a flurry of kicks and knife swipes before teleporting again, quickly
        reappearing while moving in a circle round her foe to trap them before descending
        on them with a number of lightning bolts. *Lightning Dive: Larxene and her
        duplicates teleport before descending on her opponents while charged with
        electricity. *Rush: Larxene creates two duplicates that speed towards the
        opponent to pierce them with their knives before jumping back and teleporting
        again in preparation for another attack. *Savage Carousel: After charging
        herself with lightning, Larxene levitates in the air before emitting long
        chains formed of spheres made from condensed lightning from her hands, rotating
        to attack fleeing opponents who try to dodge, dealing massive damage. *Voltic
        Rush: Her Limit Break, in which she savagely attacks her foes with a veritable
        downpour of melee attacks, teleporting after them to prevent their escape.
        **Final Voltic Rush: Her Final Limit, in which she charges herself with lightning
        before performing Voltic Rush, further increasing her speed and power. ==Gallery==
