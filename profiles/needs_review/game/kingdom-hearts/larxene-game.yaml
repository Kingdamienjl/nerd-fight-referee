    - field: weaknesses
      value: 'Sora''s supply of magic is not infinite, forcing Sora to use his supply
        sparingly and thoughtfully (But it can recharge over time, he can also use
        an Ether or Elixir-family item to immediately refill it, summon Bambi (KHI),
        get himself hit so that it is recharged (KHII, KHIII), or by using a Drive
        Form (KHII)). Has not shown any skill in unarmed combat. Could be defenseless
        if one manages to disarm him (But this weakness is mitigated by the fact that
        Sora could either summon back his Keyblade to his hand right away, use his
        Anti-Form (KHII), or using his magic spells to fight (Possibly, Sora could
        only perform defensive actions to Yozora when he absorbed his Keyblade)).
        It''s to be noted that magical spells do use the magic supply, while moves
        that are just magical in nature (Such as Ripple Drive and Stun Impact (KHI),
        Explosion and Magnet Burst (KHII), Magic Flash and Last Charge (KHIII)) don''t,
        and so those can be used indefinitely just like regular physical techniques
        regardless of if there''s enough magical supply or not, Sora''s Resurrection
        takes place within the Final World until he time travels, rendering him vulnerable
        to those that can trace him to such place Feats: Show/Hide *Became the Kingdom
        Key''s chosen wielder. *Took on and defeated Sephiroth twice. *Fought Xemnas
        along with Donald, Goofy, and The Beast in KH: Final Mix when he only had
        half a heart (This means that, from a story and power standpoint, he was incomplete
        when he didn''t have Roxas with him, meaning Sora was "half as powerful" at
        the time of said fight) *Overpowered a giant, solid stone heartless while
        nerfed as a small lion (Lifting Strength) *Fought and taken several god-like
        beings such as Genie Jafar, Hades, Sephiroth, Ansem, Xemnas, etc. *Responsible
        for the destruction of most of the Original Organization XIII. *Along with
        Riku, defeated Xemnas who had absorbed an incomplete Kingdom Hearts. A complete
        one being capable of restoring hundreds of worlds to normal. *Contended with
        and defeated/stalemated the Lingering Will, a being with power and mastery
        over the Keyblade far above that of Sora and even Terra himself (even though
        the Lingering Will is a suit of armor that contains Terra''s mind within).
        *Took on an army of 1,000 Heartless by himself and without rest. *Has traveled
        to many worlds doing nothing but primarily fighting. Notable Attacks/Techniques:
        |-|Keyblade Techniques= {{#tag:tabber|-KHI= Note: For Trinity Limit, see the
        "Limits and Team Attacks" section. *Block: Sora puts the Keyblade in front
        of himself, blocking frontal attacks. *Ars Arcanum: One of his most powerful
        attacks, Sora charges the Keyblade with energy before unleashing a powerful
        flurry of up to thirteen strikes. He opens with Arcanum, stunning the target
        in preparation for Bash, two sets of five blows that are quickly chained into
        each other. He finishes the target with Finis, two overhead swings that knock
        the target away. *Sonic Blade/Rave: Sora unleashes seven powerful thrust attacks
        at the enemy, with the final attack being more powerful and damaging. *Ragnarok:
        Alternatively called Infinity. After finishing an aerial combo, Sora can charge
        energy in his Keyblade to unleash a powerful fusillade of homing beams of
        light, the number and power of it is directly proportional to the amount of
        time he spends charging. *Strike Raid: Also translated as Strike Judgement
        in KHII. Sora throws his Keyblade at the enemy four times, with a fifth and
        final throw being more powerful to the point of sending the target flying
        into the air. *Ripple Drive: A powerful finisher attacks that envelop Sora''s
        surroundings with a pink lattice that deals damage to all foes nearby. *Stun
        Impact: Sora quickly gathers energy and then emits it from himself at all
        directions, forming a sphere that stuns foes caught in it. *Zantetsuken: A
        combo finisher that has Sora bring back his blade before dashing past his
        foes for an impossibly fast thrust, dealing massive damage to all unfortunate
        to be caught in the line of fire. *Sliding Dash: Sora quickly slides to attack
        a grounded target and follow up with other moves. *Blitz: A combo finisher
        in which Sora slams his keyblade downwards. *Hurricane Blast: An aerial combo
        finisher where Sora performs three moonsaults with his Keyblade while quickly
        falling downwards, striking enemies below him as well as his target. *Aerial
        Swing: If there''s a target above Sora, he jumps and spins with the Keyblade.
        *Vortex: Sora performs a large horizontal swing with the Keyblade, can be
        done on the ground and on the air. *Gravity Break: Sora enhances his Keyblade
        with Gravity magic and slams it at the opponent multiple times. *Slapshot:
        Sora performs a quick uppercut with the Keyblade, generally used if the target
        is right next to him. -KHCoM= Note: Moves not mentioned from the previous
        list haven''t changed at all, however, the following are the moves no longer
        available: Slapshot, Gravity Break, Aerial Sweep, Ripple Drive and Hurricane
        Blast. *Sliding'
