  speed:
    text: Infinite (Her combat style places a specific emphasis on her speed and agility,
      allowing her to literally run circles around Sora in their battles and appear
      to move in a blur, is one of the most agile among the original Organization
      and likely of the whole series, comparable to others that can travel across
      the worlds with a Keyblade Glider, which has been shown to also relate to direct
      physical movements and is comparable to the Gummi Ship based on Aqua and Ventus
      getting to the Keyblade Graveyard within a day just like it while also including
      the threat of Gummi Heartless, comparable to Xemnas, who reacted to Roxas going
      from Radiant Garden to the Keyblade Graveyard in seconds, not far behind Sora,
      who reacted to a Keyblade beam from Xehanort of a similar nature as this one)
      | Infinite (Appears as a blur to Mickey and Sora)
    source_ids:
    - vsbattles-larxene-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
