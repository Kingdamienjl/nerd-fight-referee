        \ (All Pok\xE9mon have the ability to shrink themselves to fit inside Pok\xE9\
        balls), Non-Physical Interaction (Pok\xE9mon are able to interact with and\
        \ harm Gastly, who is 5% deceased spirit and 95% poisonous gas, and Spiritomb,\
