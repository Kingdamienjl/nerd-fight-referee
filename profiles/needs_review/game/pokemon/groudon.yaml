        \ Summons harsh sunlight when it starts to battle. The harsh sunlight can\
        \ strengthen any Fire-type attacks while also weakening any Water-type attacks\
        \ in the battle; it can also allow the move Solar Beam to be used instantly.\
        \ *Desolate Land: Primal Groudon only. Affects weather in the same way as\
        \ Drought. However, the heat is now so intense that it completely nullifies\
        \ Water-type moves. *Hot Blooded: One of a series of Abilities that appeared\
        \ in Pok\xE9mon Conquest. It allows Groudon to passively restore health while\
        \ standing on lava/magma, soil, or sand. *Eruption: Groudon launches multiple\
        \ fiery rocks up into the air from its mouth that rain down on the opponent.\
        \ *Precipice Blades: Groudon's signature move. Groudon manipulates the earth,\
        \ causing multiple spears of earth to stab the opponent that explode upon\
        \ contact. *Thunder: Groudon fires off a massive bolt of electricity from\
        \ its body that can cause paralysis. Its accuracy is increased under rain\
        \ but decreased under sunny conditions. *Hyper Beam: Groudon charges a black\
        \ and purple orb of energy in its mouth which it then fires off as a beam.\
        \ Unlike most Pok\xE9mon Groudon does not appear to need to recharge afterwards.\
        \ *Solar Beam: Groudon charges up and fires a green beam of solar energy from\
        \ its mouth. Even under cloudy conditions Groudon can still charge up the\
        \ attack rather quickly. *Flamethrower: Groudon fires off a destructive jet\
        \ of flames from its mouth that can cause burns. *Fissure: Groudon opens up\
        \ a fissure in the ground to BFR the opponent. *Mud Shot: Groudon fires off\
        \ a stream of mud from its mouth that also reduces the opponent's speed. *Rock\
        \ Tomb: Groudon throws a series of rocks at the opponent which also reduces\
        \ their speed. *Bulk Up: Groudon tenses its muscles to bulk up its body raising\
        \ its attack and defense. *Rest: Groudon falls asleep and heals back up to\
