      value: "Machamp is weak to Flying, Psychic, and Fairy-Type moves, and has terrible\
        \ dexterity Notable Attacks/Techniques: * Karate Chop: Machamp attacks the\
        \ foe with a sharp chop. This attack has a high critical-hit ratio * Low Kick:\
        \ Machamp preforms a powerful low kick that makes the target fall over. This\
        \ attack inflicts greater damage on heavier foes * Leer: Machamp gives the\
        \ opponent an intimidating leer with sharp eyes. This lower's the opponent's\
        \ defense by 1 stage * Focus Energy: Machamp takes a deep breath and focuses\
        \ to raise its critical-hit ratio by 2 stages * Seismic Toss: Machamp throws\
        \ the target using the power of gravity with enough force to flip the world\
        \ upside down. This attack inflicts damage equal to the user's level * Submission:\
        \ Machamp grabs the target and recklessly dives for the ground, slamming the\
        \ target. Machamp is also slammed into the ground, inflicting it damage equal\
        \ to 1/4 of the damage it dealt to the opponent in recoil * Foresight: Machamp\
        \ looks at the target closely, focusing on it with sharp eyes. This neutralizes\
        \ the foe's evasiveness and enables a Ghost-Type target to be hit by Normal\
        \ and Fighting-Type attacks * Vital Throw: Machamp allows the opponent to\
        \ attack 1st, allowing it to grab them while they're up close and their guard\
        \ is down, and then proceeds to throw them. This attack never misses *Cross\
        \ Chop: Machamp delivers a double chop with its forearms crossed. This attack\
        \ has a high critical-hit ratio *Scary Face: Machamp frightens the opponent\
        \ with a scary face. This lowers the opponent's Speed stat by 2 stages *Revenge:\
        \ Machamp preforms an attack move that inflicts double the damage if it's\
        \ has been hurt by the opponent in the same turn *Dynamic Punch: Machamp punches\
        \ the target with it's full, concentrated power. This attack confuses the\
        \ target if it hits *Wake-Up Slap: Machamp slaps the opponent across the face.\
        \ This attack inflicts twice as much damage on a sleeping target. However,\
        \ this also wakes the target up *Wide Guard: Machamp creates a force-field\
        \ that protects itself and it's allies from wide-ranging attacks for one turn.\
        \ If this move is used in succession, it's chances of failing rises *Low Sweep:\
        \ Machamp makes a swift kick attack on the target's legs, which lowers their\
        \ Speed stat by 1 stage *Knock Off: Machamp slaps down the target's held item,\
        \ preventing that item from being used in the battle. If this attack is used\
        \ on a Pok\xE9mon that is holding an item that can be knocked off, it's base\
        \ power will be boosted by 50% *Dual Chop: Machamp attacks the target by hitting\
        \ it with brutal strikes. The target is hit twice in a row *Bulk Up: Machamp\
        \ tenses its muscles to bulk up its body, raising both its Attack and Defense\
        \ stats by 1 stage each *Strength: Machamp sluggs the target with a punch\
        \ thrown at maximum power *Double Edge: Machamp rushes the target with a reckless,\
        \ life-risking tackle. Machamp also sustains damage equal to 1/3 of the damage\
        \ it dealt to the opponent in recoil *Tackle: A physical attack in which Magikarp\
        \ charges and slams into the target with its whole body **Guts: One of Machamp's\
        \ possible special abilities. Machamp is so gutsy that being inflicted with\
        \ a status condition boosts it's Attack stat. Additionally, Machamp does not\
        \ lose Attack due to burn **No Guard: The other of Machamp's possible special\
        \ abilities. Machamp employs no-guard tactics to ensure that both it's and\
        \ it's opponent's attacks against it always land **Steadfast: Machamp's hidden\
        \ ability. Machamp's determination boosts it's Speed stat by 1 stage each\
        \ time it flinches"
