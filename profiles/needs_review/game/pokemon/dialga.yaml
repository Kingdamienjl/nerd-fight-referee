    \ destroy a whole dimension in its fight against Palkia. Notable Attacks/Techniques:\
    \ *Roar of Time: Dialga can fire a blue beam from its mouth that is powerful enough\
    \ to distort time itself. *Metal Burst: The user retaliates with much greater\
    \ force against the opponent that last inflicted damage on it. *Tenacity: Contact\
    \ with Dialga causes the attacker to flinch. *Hyper Beam: A powerful energy ball\
    \ that Dialga can shoot with extreme force as a large beam. *Aura Sphere: Dialga\
    \ can draw from its own Aura and fire a powerful energy sphere. *Draco Meteor:\
    \ Dialga can create a shadow-like aura on its forehead that summons meteors to\
    \ hit its opponents. *Protect: Dialga can project a virtually impenetrable force\
