    \ Users Category:Heroes Category:Antagonists Category:Gods Category:Cosmic Entities\
    \ Category:Power Nullification Users Category:Higher-Dimensional Beings Category:Immortals\
    \ Category:Water Users Category:Pocket Reality Users Category:Sealing Users Category:Healers\
    \ Category:Self-Sustenance Users Category:Avatar Creation Users Category:Large\
    \ Sized Characters Category:Cosmic Awareness Users Category:Dimensional Travel\
    \ Users Category:Void Users Category:Non-Physical Interaction Users Category:Subjective\
    \ Reality Users Category:Breath Attack Users Category:Light Users Category:Nigh-Omniscient\
    \ Beings Category:Concept Users Category:Abstract Entities Category:Incorporeal\
    \ Characters Category:Status Effect Users Category:Statistics Amplification Users\
    \ Category:Transmutation Users Category:Creation Users Category:Invisibility Users\
    \ Category:BFR Users Category:Enhanced Senses Users Category:Forcefield Users\
    \ Category:Resurrection Users Category:Nigh-Omnipresent Beings Category:Movie\
    \ Characters Category:Manga Characters"
