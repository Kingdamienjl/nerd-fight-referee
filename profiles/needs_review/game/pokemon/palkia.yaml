- id: claim-weaknesses-f27896d6
  section: weaknesses
  axis: weakness
  text: "Dragon and Fairy-based attacks Feats: (Part 1), (Part 2), (Final Part). *Palkia\
    \ and Dialga were creating a new universe and destroying the old one in the process.\
    \ *Fought Dialga in torn space-time. *Can stabilize space with a mere breath.\
    \ *Was about to destroy a whole dimension in its fight against Dialga. Notable\
    \ Attacks/Techniques: *Spacial Rend: Palkia can launch a pink crescent blade of\
    \ energy from its forearm, powerful enough to warp space. *Hyper Beam: A powerful\
    \ energy ball that Palkia can shoot with extreme force as a beam. *Aura Sphere:\
    \ Palkia can draw from its Aura to fire an energy sphere from its hands. *Protect:\
    \ Palkia can project a force field. *Spatial Warp: Being the Legendary Pok\xE9\
    mon that rules over all of space, Palkia can warp space. Examples include teleporting\
    \ things across dimensions, repairing the fabric of space in an area, and trapping\
    \ its opponent in a pocket dimension. Also capable of wiping things from space-time\
    \ with this ability. ==Gallery== center|335px ==Notable Matchups== Victories:\
    \ Losses: Inconclusive: {{discussions}} Category:Characters Category:Pok\xE9mon\
    \ Category:Anime Characters Category:Game Characters Category:Genderless Characters\
    \ Category:Reality Warpers Category:Legendary Pok\xE9mon Category:Dragons Category:Space\
