- id: claim-weaknesses-ab0a4a63
  section: weaknesses
  axis: weakness
  text: "Weak to Ground, Psychic, Ice and Dragon-type moves | As before, plus if Eternatus\
    \ receives enough damage, he will wear out and be left temporarily unable to move.\
    \ Notable Attacks/Techniques: *Pressure: A passive ability that forces opponents\
    \ to take twice as much stamina from virtually every move against its user, out\
    \ of the sheer pressure. *Poison Tail: The user hits the target with its tail\
    \ which can also poison them. *Recover: Restoring its own cells, the user heals\
    \ by a noticeable amount. *Flamethrower: The target is scorched with an intense\
    \ blast of fire. This may also leave the target with a burn. *Dragon Tail: Hits\
    \ the opponent with its tail hard enought to send it flying away. *Confuse Ray:\
    \ The target is exposed to a sinister ray that triggers confusion. *Cross Poison:\
    \ Eternatus crosses it\u2019s \u201Carms\u201D, which start to glow purple. A\
    \ purple 'X' then appears in front of its crossed arms and it fires the 'X' at\
    \ the opponent. it has a high critical hit ratio and it can poison the target.\
    \ *Agility: The user relaxes and lightens its body to move faster. This sharply\
    \ raises the Speed of the user. *Dragon Dance: The user vigorously performs a\
    \ mystic, powerful dance that raises its physical Attack Potency and Speed. *Dragon\
    \ Pulse: Eternatus releases a shockwave of explosive draconic aura from its mouth,\
    \ doing massive damage. *Cosmic Power: The user absorbs a mystical power from\
    \ space to raise its Durability. *Draco Meteor: Eternatus fires an orange sphere\
    \ of energy into the sky. The orb then explodes into meteors of energy that come\
    \ crashing down onto the opponent. *Meteor Beam: Eternatus gathers space power\
    \ to increase his Special Attack, then fires the energy as a massive orange laser\
    \ towards his opponent. *Toxic: A move that leaves the target badly poisoned.\
    \ Its poison damage worsens every turn. *Venoshock: The user drenches the target\
    \ in a special poisonous liquid. This move's power is doubled if the target is\
    \ poisoned. *Hyper Beam: Eternatus fires a powerful laser at the opponent. He\
    \ must recharge for a short time after using the move, however. *Dynamax Cannon:\
    \ Eternatus' signature move, which unleashes a strong beam from its core, deals\
    \ twice the damage if the target is Dynamaxed. *Eternabeam: Another signature\
    \ move of Eternatus, unleashes a powerful beam at the opponent. This move takes\
    \ a noticeable amount of stamina from the user, however, leaving it vulnerable\
    \ after its use. *Max Wyrmwind: Eternamax Eternatus surrounds an opponent in a\
    \ tornado of dragon energy, which lowers the Attack Potency of all enemies at\
    \ once. *Max Flare: Eternamax Eternatus throws a bit of fire at the opponent,\
    \ which explodes in a giant plume. This turns the sunlight harsh for a little\
    \ while. *Max Ooze: Eternamax Eternatus creates a massive, sopping pool of pure\
    \ poison underneath its body. Eventually, the pressure gets to be so much that\
    \ geysers of poison start to erupt throughout the battlefield, the biggest one\
    \ appearing right under the opponent, soaking them completely. This increases\
    \ Eternatus's Special Attack. ==Gallery== Eternatus anime.png Eternatus Eternamax_anime.png\
    \ Darkest Day Galar.png Eternabeam VIII.png HOME890 s.png|Shiny Eternatus HOME890E\
    \ s.png|Shiny Eternamax Eternatus ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ {{Discussions}} Category:Characters Category:Pok\xE9mon Category:Legendary Pok\xE9\
    mon Category:Large Sized Characters Category:Self-Sustenance Users Category:Weather\
    \ Users Category:Madness Users Category:Power Bestowal Users Category:Empathic\
    \ Manipulation Users Category:Bodily Weaponry Users Category:Technology Users\
    \ Category:Transformation Users Category:Non-Physical Interaction Users Category:Poison\
    \ Users Category:Status Effect Users Category:BFR Users Category:Immortals Category:Statistics\
    \ Amplification Users Category:Healers Category:Energy Projection Users Category:Energy\
    \ Users Category:Fire Users Category:Damage Boost Users Category:Dynamax Users\
    \ Category:Aura Users Category:Power Nullification Users Category:Space Users\
    \ Category:Time Users Category:Purification Users Category:Anime Characters Category:Video\
    \ Game Characters Category:Aliens"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-59ad8f99
  section: abilities
  axis: hax
  text: "Eternatus=Superhuman Physical Characteristics, Flight, Large Size (Type 1),\
    \ Self-Sustenance (Types 1 and 3), Immortality (Type 1), Weather Manipulation,\
    \ Madness Manipulation (Type 2) and Power Bestowal (Its body leaks Galar Particles,\
    \ the substance which allows other Pok\xE9mon to Dynamax. Was the one behind the\
    \ Darkest Day, an event which generated intense storms and Galar Particles across\
    \ all the Galar Region, making the Pok\xE9mon Dynamaxed from such an event rage\
    \ uncontrollably. Galar Particles are shown to uncontrollably increase both the\
    \ power and rage of Zacian/Zamazenta if applied to them as well, even if they\
    \ can't Dynamax), Energy Manipulation (Can generate Galar Particles), Absorption\
    \ (Can absorb energy and the Galar Particles in the surrounding area, preventing\
    \ the other Pok\xE9mon from Dynamaxing, can absorb many mystical forces via Cosmic\
    \ Power and Meteor Beam), Natural Weaponry, Technology Manipulation (Caused interferences\
    \ to a plane, making it short circuit), Transformation, Non-Physical Interaction,\
    \ Poison Manipulation, Status Effect Inducement, BFR, Statistics Amplification,\
    \ Energy Projection, Fire Manipulation, Earth Manipulation (via Meteor Beam),\
    \ Mind Manipulation (via Confuse Ray), Self-Healing, Damage Boost (Dynamax Cannon\
    \ doubles the damage against any kind of Dynamaxed Pok\xE9mon), Resistance to\
    \ Madness Manipulation (Type 2. Unaffected by its own Galar Particles), Fighting,\
    \ Poison, Bug, Fire, Water and Electric-type moves and higher Resistance to Grass-type\
    \ moves |-|Eternamax Eternatus=Same as before, including all the powers and abilities\
    \ of Dynamax and Gigantamax (Due of Eternamax being the strongest variant of Dynamax,\
    \ superior to even Gigantamax), Large Size (Type 2), Passive Aura, Power Nullification\
    \ (Has an aura which passively prevents the other Pok\xE9mon from using their\
    \ moves. Can also release a shockwave which negates the current effects of the\
    \ opponents' abilities and cures itself from damage and status conditions) and\
    \ Space-Time Manipulation (Was warping the space-time around it with its mere\
    \ presence), Resistance to Damage Boost (Immune to the added effects of Behemoth\
    \ Blade and Behemoth Bash, which deal double damage against Dynamaxed Pokemon\
    \ of any kind)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
