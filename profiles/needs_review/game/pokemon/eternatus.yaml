    - field: weaknesses
      value: "Weak to Ground, Psychic, Ice and Dragon-type moves | As before, plus\
        \ if Eternatus receives enough damage, he will wear out and be left temporarily\
        \ unable to move. Notable Attacks/Techniques: *Pressure: A passive ability\
        \ that forces opponents to take twice as much stamina from virtually every\
        \ move against its user, out of the sheer pressure. *Poison Tail: The user\
        \ hits the target with its tail which can also poison them. *Recover: Restoring\
        \ its own cells, the user heals by a noticeable amount. *Flamethrower: The\
        \ target is scorched with an intense blast of fire. This may also leave the\
        \ target with a burn. *Dragon Tail: Hits the opponent with its tail hard enought\
        \ to send it flying away. *Confuse Ray: The target is exposed to a sinister\
        \ ray that triggers confusion. *Cross Poison: Eternatus crosses it\u2019s\
        \ \u201Carms\u201D, which start to glow purple. A purple 'X' then appears\
        \ in front of its crossed arms and it fires the 'X' at the opponent. it has\
        \ a high critical hit ratio and it can poison the target. *Agility: The user\
        \ relaxes and lightens its body to move faster. This sharply raises the Speed\
        \ of the user. *Dragon Dance: The user vigorously performs a mystic, powerful\
        \ dance that raises its physical Attack Potency and Speed. *Dragon Pulse:\
        \ Eternatus releases a shockwave of explosive draconic aura from its mouth,\
        \ doing massive damage. *Cosmic Power: The user absorbs a mystical power from\
        \ space to raise its Durability. *Draco Meteor: Eternatus fires an orange\
        \ sphere of energy into the sky. The orb then explodes into meteors of energy\
        \ that come crashing down onto the opponent. *Meteor Beam: Eternatus gathers\
        \ space power to increase his Special Attack, then fires the energy as a massive\
        \ orange laser towards his opponent. *Toxic: A move that leaves the target\
        \ badly poisoned. Its poison damage worsens every turn. *Venoshock: The user\
        \ drenches the target in a special poisonous liquid. This move's power is\
        \ doubled if the target is poisoned. *Hyper Beam: Eternatus fires a powerful\
        \ laser at the opponent. He must recharge for a short time after using the\
        \ move, however. *Dynamax Cannon: Eternatus' signature move, which unleashes\
        \ a strong beam from its core, deals twice the damage if the target is Dynamaxed.\
        \ *Eternabeam: Another signature move of Eternatus, unleashes a powerful beam\
        \ at the opponent. This move takes a noticeable amount of stamina from the\
        \ user, however, leaving it vulnerable after its use. *Max Wyrmwind: Eternamax\
        \ Eternatus surrounds an opponent in a tornado of dragon energy, which lowers\
        \ the Attack Potency of all enemies at once. *Max Flare: Eternamax Eternatus\
        \ throws a bit of fire at the opponent, which explodes in a giant plume. This\
        \ turns the sunlight harsh for a little while. *Max Ooze: Eternamax Eternatus\
        \ creates a massive, sopping pool of pure poison underneath its body. Eventually,\
        \ the pressure gets to be so much that geysers of poison start to erupt throughout\
        \ the battlefield, the biggest one appearing right under the opponent, soaking\
        \ them completely. This increases Eternatus's Special Attack. ==Gallery==\
