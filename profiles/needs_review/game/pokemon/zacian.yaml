    \ fog which puts the foes to sleep), Transformation, Forcefield Creation, Non-Physical\
    \ Interaction, Martial Arts, Statistics Reduction, Resistance to Fighting, Dark\
    \ and Bug Type moves and Immunity (within reason) to Dragon Type moves |-|Crowned\
    \ Sword Zacian=Same as before minus Resistance to Fighting Type moves, but including\
    \ Power Nullification (It was able to counter Eternamax Eternatus' aura that prevented\
    \ Pok\xE9mon from using their moves), Damage Boost (Behemoth Blade doubles the\
    \ damage against any kind of Dynamaxed Pok\xE9mon), Resistance to Power Nullification\
    \ (It was able to able to act despite Eternamax Eternatus' aura preventing Pok\xE9\
    mon from using their moves), Petrification, Flying, Rock, Grass, Ice, Fairy, and\
    \ Psychic (includes Mind Manipulation, Telepathy, Energy Manipulation, Sleep Manipulation\
    \ and Telekinesis) Type moves, higher Resistance to Bug Type moves and Immunity\
    \ (within reason) to Poison Type moves"
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
