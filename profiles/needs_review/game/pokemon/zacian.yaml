    don''t affect this attack''s damage. *Quick Guard: The user created a barrier
    which protects itself and its allies from priority moves. *Metal Claw: The user
    attacks with metallic claws. It may rise the user''s attack. *Howl: The user howls
    loudly to raise its spirit, which raises its Attack. *Bite: The target is bitten
    with viciously sharp fangs. This may also make the target flinch. *Quick'
