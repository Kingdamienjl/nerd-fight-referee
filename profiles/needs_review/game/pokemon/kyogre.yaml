- id: claim-weaknesses-c5212c99
  section: weaknesses
  axis: weakness
  text: "Kyogre is weak to Electric and Grass Type moves. Drizzle can't activate when\
    \ there's the harsh sunlight of Desolate Land or the mysterious air current of\
    \ Delta Stream enters the battle. The Water Gem is single use Notable Attacks/Techniques:\
    \ *Drizzle: Summons rain when it starts to battle. The rain strengthens Water\
    \ Type attacks while also weakening Fire Type attacks during battle; it can also\
    \ make the moves Hurricane and Thunder more accurate towards the opponent. *Primordial\
    \ Sea: Primal only. Affects weather in the same way as Drizzle only the rain is\
    \ now so intense that it completely nullifies any Fire Type moves. *Water Spout:\
    \ Kyogre launches pillars of highly pressurized water at the opponent. *Origin\
    \ Pulse: Kyogre's signature move. Kyogre jumps into the air and multiple blue\
    \ orbs appear all around it. It then fires a beam of blue energy from each orb\
    \ at the opponent. This attack can hit multiple opponents at once. *Hydro Pump:\
    \ Kyogre fires a powerful highly pressurized stream of water from its mouth at\
    \ the opponent. *Hyper Beam: Kyogre fires a destructive beam of energy from its\
    \ mouth at the opponent. Unlike most Pok\xE9mon Kyogre lacks the need to recharge\
    \ afterwards. *Sheer Cold: Kyogre generates a blue field of freezing energy that\
    \ then expands outwards freezing anything in its path. Ice Types are immune. *Ice\
    \ Beam: Kyogre fires an icy blue beam of energy from its mouth at the opponent.\
    \ This can also be used to create ice in general and freeze water. *Calm Mind:\
    \ Kyogre calms its mind boosting its special attack and special defense. *Aqua\
    \ Ring: Kyogre forms rings of water around itself that slowly heals it over time.\
    \ *Ancient Power: Kyogre manipulates nearby rocks with an ancient power and hurls\
    \ them at the opponent. This may also raise all of Kyogre's stats. *Rest: Kyogre\
    \ falls asleep and heals itself back up to peak condition. This leaves Kyogre\
    \ asleep for bit however. *Double-Edge: Kyogre rams into the opponent harshly.\
    \ This causes recoil damage to Kyogre however. *Body Slam: Kyogre body slams the\
    \ opponent, possibly paralyzing them. *Aqua Tail: Kyogre envelops its tail in\
    \ a torrent of water and swings it at the opponent. *Water Pulse: Kyogre fires\
    \ off a sphere of water that may confuse the opponent. *Muddy Water: Kyogre sends\
    \ a wave of murky and muddy water at the opponent, possibly lowering their accuracy.\
    \ This attack can hit multiple opponents at once. *Scary Face: Kyogre makes a\
    \ scary face at the opponent, lowering their speed. *Thunder: Kyogre fires a massive\
    \ bolt of electricity from its body at the opponent. Its accuracy is heavily increased\
    \ under rain and it is capable of causing paralysis. *Surf: Kyogre sends a huge\
    \ wave of water at the opponent to deal damage. It can hit multiple targets, including\
    \ Kyogre's own allies. ==Gallery== Pok\xE9mon-Omega-Ruby-Alpha-Sapphire-Concept-Art-Battle-Primal-Groudon-Kyogre-72.jpg\
    \ Primal-Kyogre-International-Challenge-June-Cover.jpg Primal-Kyogre-GIF-pokemon-37275539-400-225.gif\
    \ source.gif 33e075e0d2b149781d168784b640d26c3d6420a7 hq.gif 1tpgLpohdrzsXLXywpEn.gif\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: {{Scroll box|content=}}\
    \ {{discussions}} Category:Characters Category:Pok\xE9mon Category:Game Characters\
    \ Category:Genderless Characters Category:Anime Characters Category:Manga Characters\
    \ Category:Legendary Pok\xE9mon Category:Sea Monsters Category:Cetaceans Category:Weather\
    \ Users Category:Water Users Category:Ice Users Category:Monsters Category:Earth\
    \ Users Category:Electricity Users Category:Flight Users Category:Statistics Amplification\
    \ Users Category:Movie Characters Category:Energy Users Category:Transformation\
    \ Users Category:Healers Category:Status Effect Users Category:Statistics Reduction\
    \ Users Category:Enhanced Senses Users Category:Paralysis Users Category:Absolute\
    \ Zero Users Category:Fear Users Category:Teleportation Users Category:Underwater\
    \ Breathing Users Category:Longevity Users"
  source_ids: *id003
