- id: claim-powers-and-abilities-4b286df1
  section: abilities
  axis: hax
  text: "Base= *Superhuman Physical Characteristics *Longevity (Has lived for thousands\
    \ of years) *Flight (True flight: Can fly freely through the air) *Non-Physical\
    \ Interaction (All Pok\xE9mon can affect ghosts with a vast majority of their\
    \ attacks) *Underwater Breathing (Type 2) *Water Manipulation and Weather Manipulation\
    \ (Kyogre is said to be the personification of the sea itselfPok\xE9mon Ruby/Sapphire/Emerald/Omega\
    \ Ruby/Alpha Sapphire who expanded the seas with torrential rains and great tsunamisPok\xE9\
    mon Legends: Arceus. Can create massiveOmega Ruby/Alpha Sapphire powerful storms\
    \ in an instant. Capable of manipulating sea currents and making large tidal waves)\
    \ **Danmaku & Light Manipulation (Directional and Omnidirectional; Origin Pulse\
    \ attacks foes with countless beams of light. Kyogre can fire these beams in severalPok\xE9\
    mon Sword and Shield different directionsPok\xE9mon Legends: Z-A) *Electricity\
    \ Manipulation (Can call down bolts of electricityPok\xE9mon Legends: Z-A with\
    \ Thunder) *Ice Manipulation, Absolute Zero, & Durability Negation (Sheer Cold\
    \ hits the target with a blast of absolute-zero cold. The target faints instantly\
    \ if this attack hits. Kyogre can use Sheer Cold to freeze large bodies of water.\
    \ Ice Beam fires a icy-cold beam of energy which has a chance to freeze the target\
    \ solid. Blizzard summons a howling blizzard to strike opposing Pok\xE9mon) *Self-Healing\
    \ and Purification (Type 3: Rest allows to user to fully restore it's HP and heal\
    \ any status problem. Aqua Ring has the user surround itself with a veil of water,\
    \ allowing it to restore 1/16 of its maximum HP each turn) *Enhanced Senses (Enhanced\
    \ Awareness: Could feel splashing on the oceans surface while asleep and hear\
    \ others while deep underwaterPok\xE9mon Pokopia) *Statistics Amplification (Ancient\
    \ Power has a 10% chance of raising the user's stats. Calm Mind has the user quietly\
    \ focuses its mind and calms its spirit to boost its Sp. Atk and Sp. Def stats.\
    \ *Status Effect Inducement (Body Slam has a 30% chance of paralyzing the target.\
    \ Sheer Cold and Ice Beam have a chance to Freeze the target) *Primal Reversion\
    \ and Absorption (Kyogre can transform into their original Primal form by absorbing\
    \ natural primal energy or with a Trainer using the Blue Orb) Resistance to; Steel,\
    \ Fire, Water Manipulation, and Ice Manipulation (Takes 1/2 damage from Steel,\
    \ Fire, Water, and Ice type moves) |-|Primal Kyogre= Same as base but to a greater\
    \ degree; *Greater Weather Manipulation (With Primal Reversion, Kyogre can summon\
    \ even more powerful stormsPok\xE9mon Generations Episode 8: The Cavern) **Unconventional\
    \ Power Nullification (Primal Kyogre's ability Primordial Sea summons heavy rain\
    \ and prevents fire attacks from being used. Primordial Sea also causes any attempts\
    \ to use other weather-modifying moves to fail)"
