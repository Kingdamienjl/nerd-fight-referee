        \ power. This also has a 10% chance to raise Physical and Special Attack and\
        \ Defense and Speed stats all at once by 1 stage each * Body Slam: Kyogre\
        \ attacks by dropping onto the target with it's full body weight. This attack\
        \ also has a 30% chance to leave the target with paralysis * Calm Mind: Kyogre\
        \ quietly focuses its mind and calms its spirit to raise its Special Attack\
        \ and Special Defense stats by 1 stage each * Ice Beam: Kyogre blasts the\
        \ target with an icy-cold beam of energy. This also has a 10% chance to freeze\
        \ the target solid * Hydro Pump: Kyogre blasts the target with a huge volume\
        \ of water launched under great pressure * Rest: Kyogre goes to sleep for\
        \ 2 turns. This fully restores Kygore's HP and cures any status conditions\
        \ it's been inflicted with * Sheer Cold: Kyogre attacks the target with a\
        \ blast of absolute-zero cold. The target faints instantly if this attack\
        \ hits * Double-Edge: Kyogre rushes the target with a reckless, life-risking\
        \ tackle. Kyogre also sustains damage equal to 1/3 of the damage it dealt\
        \ to the opponent in recoil * Water Spout: Kyogre spouts water like a geyser\
        \ to shower the opposing team with powerful water, damaging them. The higher\
        \ Kyogre's HP, the higher the move's power, but the lower Kyogre's HP, the\
        \ lower the move's power * Muddy Water: Kyogre attacks by shooting muddy water\
        \ at the opposing team. This also has a 30% chance to lower their accuracy\
        \ by 1 stage * Aqua Ring: Kyogre surrounds itself with a veil made of water,\
        \ allowing it to restore 1/16 of its maximum HP at the end of every turn *\
        \ Aqua Tail: Kyogre attacks by swinging its tail as if it were a vicious wave\
        \ in a raging storm * Origin Pulse: Kyogre's signature move. Kyogre attacks\
        \ opposing Pok\xE9mon with countless beams of light that glow a deep and brilliant\
        \ blue ** Drizzle: Kyogre's Special Ability. Whenever Kyogre enters the battle,\
        \ it summons rain that lasts for 5 turns ** Primordial Sea: Primal Kyogre's\
        \ Signature Ability. This Ability is a stronger version of Drizzle that summons\
        \ heavy rain until Primal Kyogre leaves the field. The rain is so strong,\
        \ that all weather changing moves and abilities will fail to work, and all\
        \ Fire-Type moves will be instantly extinguished. This ability can only be\
        \ countered by Primal Groudon's Desolate Land or Mega Rayquaza's Delta Stream"
