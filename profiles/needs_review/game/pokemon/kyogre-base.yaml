    - field: weaknesses
      value: "Kyogre is weak to Electric and Grass Type moves. Drizzle can't activate\
        \ when there's the harsh sunlight of Desolate Land or the mysterious air current\
        \ of Delta Stream enters the battle. The Water Gem is single use Notable Attacks/Techniques:\
        \ *Drizzle: Summons rain when it starts to battle. The rain strengthens Water\
        \ Type attacks while also weakening Fire Type attacks during battle; it can\
        \ also make the moves Hurricane and Thunder more accurate towards the opponent.\
        \ *Primordial Sea: Primal only. Affects weather in the same way as Drizzle\
        \ only the rain is now so intense that it completely nullifies any Fire Type\
        \ moves. *Water Spout: Kyogre launches pillars of highly pressurized water\
        \ at the opponent. *Origin Pulse: Kyogre's signature move. Kyogre jumps into\
        \ the air and multiple blue orbs appear all around it. It then fires a beam\
        \ of blue energy from each orb at the opponent. This attack can hit multiple\
        \ opponents at once. *Hydro Pump: Kyogre fires a powerful highly pressurized\
        \ stream of water from its mouth at the opponent. *Hyper Beam: Kyogre fires\
        \ a destructive beam of energy from its mouth at the opponent. Unlike most\
        \ Pok\xE9mon Kyogre lacks the need to recharge afterwards. *Sheer Cold: Kyogre\
        \ generates a blue field of freezing energy that then expands outwards freezing\
        \ anything in its path. Ice Types are immune. *Ice Beam: Kyogre fires an icy\
        \ blue beam of energy from its mouth at the opponent. This can also be used\
        \ to create ice in general and freeze water. *Calm Mind: Kyogre calms its\
        \ mind boosting its special attack and special defense. *Aqua Ring: Kyogre\
        \ forms rings of water around itself that slowly heals it over time. *Ancient\
        \ Power: Kyogre manipulates nearby rocks with an ancient power and hurls them\
        \ at the opponent. This may also raise all of Kyogre's stats. *Rest: Kyogre\
        \ falls asleep and heals itself back up to peak condition. This leaves Kyogre\
        \ asleep for bit however. *Double-Edge: Kyogre rams into the opponent harshly.\
        \ This causes recoil damage to Kyogre however. *Body Slam: Kyogre body slams\
        \ the opponent, possibly paralyzing them. *Aqua Tail: Kyogre envelops its\
        \ tail in a torrent of water and swings it at the opponent. *Water Pulse:\
        \ Kyogre fires off a sphere of water that may confuse the opponent. *Muddy\
        \ Water: Kyogre sends a wave of murky and muddy water at the opponent, possibly\
        \ lowering their accuracy. This attack can hit multiple opponents at once.\
        \ *Scary Face: Kyogre makes a scary face at the opponent, lowering their speed.\
        \ *Thunder: Kyogre fires a massive bolt of electricity from its body at the\
        \ opponent. Its accuracy is heavily increased under rain and it is capable\
        \ of causing paralysis. *Surf: Kyogre sends a huge wave of water at the opponent\
        \ to deal damage. It can hit multiple targets, including Kyogre's own allies.\
