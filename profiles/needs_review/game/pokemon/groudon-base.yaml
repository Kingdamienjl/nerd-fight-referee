        \ Notable Attacks/Techniques: * Mud Shot: Groudon attacks by hurling a blob\
        \ of mud at the target. This also lowers the target's Speed stat by 1 stage\
        \ * Scary Face: Groudon frightens the opponent with a scary face. This lowers\
        \ the opponent's Speed stat by 2 stages * Ancient Power: Groudon attacks with\
        \ a prehistoric power. This also has a 10% chance to raise Physical and Special\
        \ Attack and Defense and Speed stats all at once by 1 stage each * Slash:\
        \ Groudon slashes the opponent with it's claws. This attack has a high critical-hit\
        \ ratio * Bulk Up: Groudon tenses its muscles to bulk up its body, raising\
        \ both its Attack and Defense stats by 1 stage each * Earthquake: Groudon\
        \ sets off an earthquake that strikes every Pok\xE9mon around it. If a Pok\xE9\
        mon has burrowed underground due to using Dig, the damage it will take from\
        \ this move is doubled. This move is useless against Pok\xE9mon that can stay\
        \ in the air and off the ground, such as Flying-Type Pok\xE9mon * Fire Blast:\
        \ Groudon scorches the target with an intense, \u5927-shaped blast of all-consuming\
        \ fire. This also has a 10% chance to leave the target with a burn * Rest:\
        \ Groudon goes to sleep for 2 turns. This fully restores Groudon's HP and\
        \ cures any status conditions it's been inflicted with * Fissure: Groudon\
        \ opens up a fissure in the ground and drops the target in. The target instantly\
        \ faints if this attack hits * Solar Beam: A 2-turn attack. Groudon gathers\
        \ sunlight on the 1st turn, and then blasts a bundled beam of it on the 2nd\
        \ turn. Groudon can use this move immediately during harsh sunlight, but the\
        \ move's power will be cut in half during rain, hail, fog, snow, or when a\
        \ sandstorm is raging * Eruption: Groudon causes a volcanic eruption with\
        \ explosive fury, causing the opposing Pok\xE9mon to get showered with volcanic\
        \ rocks. The higher Groudon's HP, the higher the move's power, but the lower\
        \ Groudon's HP, the lower the move's power * Lava Plume: Groudon torches everything\
        \ around it in an inferno of scarlet flames. This also has a 30% chance to\
        \ leave those it hits with a burn * Hammer Arm: Groudon swings its strong,\
        \ heavy fist at the target to inflict damage. This also lowers Groudon's Speed\
        \ stat by 1 stage, however * Fire Blast: Groudon scorches the target with\
        \ an intense, \u5927-shaped blast of all-consuming fire. This also has a 10%\
        \ chance to leave the target with a burn * Earth Power: Groudon makes the\
        \ ground under the target erupt with power. This also has a 10% chance to\
        \ lower the target's Special Defense stat by 1 stage * Precipice Blades: Groudon's\
        \ signature move. Groudon attacks opposing Pok\xE9mon by manifesting the power\
        \ of the land in fearsome blades of stone ** Drought: Groudon's Special Ability.\
        \ Whenever Groudon enters the battle, it turns the sunlight harsh for 5 turns\
        \ ** Desolate Land: Primal Groudon's Signature Ability. This Ability is a\
        \ stronger version of Drought that summons extremely harsh sunlight until\
