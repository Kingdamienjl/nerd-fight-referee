    - field: intelligence
      value: "Gifted, Despite his frivolous and lighthearted exterior, Ardyn is wickedly\
        \ intelligent. Being the Chancellor of Niflheim, Ardyn is incredibly skilled\
        \ in the arts of negotiation and deception, effectively ruling the empire\
        \ despite his lack of royal title, convincing Lucis to sign a false peace\
        \ treaty with Niflheim, and tricking the entire party into believing that\
        \ he was simply an ordinary traveler, never realizing his true identity until\
        \ Ardyn told them himself. He also invented the process for converting humans\
        \ into completely inorganic Magitek Infantry, a deed that fueled his rise\
        \ to his position as Chancellor and paved the way for the rest of his plans.\
        \ In combat, Ardyn fights almost identically to his descendant, Noctis, summoning\
        \ a wide variety of different weapons in battle and swapping between them\
        \ on a whim. To this end, his long life has granted him thousands of years\
        \ of experience dealing with Daemons and any other enemies in his path, allowing\
        \ him to evenly duel Noctis despite the latter\u2019s awakening as the King\
        \ of Light."
      source_id: vsbattles-sojourn-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Ardyn is somewhat arrogant and likes to taunt his enemies. He can be
        killed permanently by destroying his soul in the spirit world with the Ring
        of Lucii''s power. | If he is cut off from the Crystal Core, he cannot use
        its power Notable Attacks/Techniques: Armiger Arsenal: Much like his descendant,
        Ardyn is capable of channeling the power of the previous Kings of Lucis and
        manifest their weapons around him, granting him flight and far higher power
        and speed. *Sword of the Wise: The same blade wielded by his descendants Noctis
        and Regis, Ardyn utilizes it to warp around his foes, attacking their blindspots
        with devastating warp-strikes. center|thumb|400px|Sword of the Wise *Axe of
        the Conqueror: A heavy axe wielded by a king known for his feats of arms.
        It is designed to wreak havoc with slow and devastating blows at the cost
        of Ardyn''s defense. center|thumb|400px|Axe of the Conquerer *Bow of the Clever:
        The bow of a king known for his martial and intellectual prowess, it launches
        a constant supply of piercing arrows that can be quickly drawn and fired while
        on the move. center|thumb|400px|Bow of the Clever *Swords of the Wanderer:
        A pair of swords wielded by the king said to be a swift as the winds themselves,
        they allow Ardyn to unleash a deadly series of quick slashes and can combine
        for thundering attacks. thumb|center|400px|Swords of the Wanderer *Blade of
        the Mystic: A longsword wielded by the king who sought to protect the world
        along with the Oracle, it bolsters Ardyn''s strength while it is in hand.
        It also increases the wielder''s resistance to the powers of darkness. thumb|center|400px|Blade
        of the Mystic *Star of the Rogue: A throwing star wielded by a queen who took
        to the shadows and shunned the public''s watchful eye, it can rapidly strike
        a single target multiple times or bounce between various targets. It also
        increases Ardyn''s resistance to fire, lightning, and ice attacks. thumb|center|400px|Star
        of the Rogue *Sword of the Tall: A greatsword wielded by a king as well-built
        as the mountains themselves, it resonates in its wielder''s hand, striking
        its victims multiple times with a single swing at the expense of the wielder''s
        resistance to the elements. thumb|center|400px|Greatsword of the Tall * Shield
        of the Just: A shield that protected the queen devoted to peace and love for
        all, it automatically deflects oncoming attacks and allows Ardyn to expend
        magical energy to quickly heal himself. It also raises his resistance to fire,
        ice, lightning, and dark attacks at the expense of raw offensive power. thumb|center|400px|Shield
        of the Just *Mace of the Fierce: A mace wielded by a king who was gentle to
        his people but a monster to his foes, it possesses an affinity for causing
        grievous harm to body parts and appendages, crushing them and thus rendering
        them useless. thumb|center|400px|Mace of the Fierce * Scepter of the Pious:
        A staff wielded by a king who ruled according to divine law and worked in
        tandem with the Oracle, it takes upon numerous forms to smite its foes, obliterating
        them with swords of divine light. This staff also dramatically increases the
        wielder''s resistance to the powers of darkness. thumb|center|400px|Scepter
        of the Pious *Trident of the Oracle: The weapon wielded by the Oracle, who
        brought man and god together and brought comfort and tranquility to the stars
        above. It can produce holograms and afterimages of the wielder that can also
        attack foes. thumb|center|400px|Trident of the Oracle *Katana of the Warrior:
        An oriental blade wielded by the King whose Queen was taken from him too soon,
        it can be drawn and strike in a single heartbeat and crushes foes relentlessly
        with a cascade of blows. It also increases the wielder''s resistance to fire,
        ice, and lightning, but lowers their resistance to darkness. thumb|center|400px|Katana
        of the Warrior *Sword of the Father: The sword wielded by King Regis, father
        of the True King, it is a mighty sword designed that nurtures the light and
        increases the power of one''s finishing blows. thumb|center|400px|Sword of
        the Father *Astrals: Manifestations of the power of the stars, Astrals function
        as the creatures Ardyn can summon after he forges a pact with them. Unlike
        Noctis, Ardyn only has one Astral available to him: **Ifrit, the Infernian:
        An Astral with an intense dislike for humanity, Ifrit appears as an immensely
        tall man with red skin and horns, resembling more typical interpretations
        of the demonic figure known as Satan. True to his title, Ifrit specializes
        in fire attacks, his entire body wreathed in flames to cause harm to all who
        touch him. He also can turn himself into a fire to evade enemy attacks. In
        addition to his command over fire, Ifrit has proven himself to a remarkably
        agile and skilled combatant, as even his mindless, reanimated corpse was able
        to dodge the entirety of Bahamut''s Ultima Sword with a series of acrobatic
        maneuvers. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
