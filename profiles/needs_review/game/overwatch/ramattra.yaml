    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Large Building level (All R-7000 Ravagers were designed to be elite units\
      \ superior in power to Bastion unitsOverwatch 2: Ramattra\u2019s Beginnings\
      \ | Developer Update and even after the Crisis ended, the Bastion and OR-14\
      \ units from the Crisis were considered outdated and obsolete compared to him.Ramattra:\
      \ Reflections Ravagers have fought Junker Queen, who is this strong, in the\
      \ past.Ramattra Voice Lines & Hero Interactions - Ramattra: I hear you like\
      \ to prey on omnics. Try me! Junker Queen: Nah, thanks. Fought a buncha you\
      \ before. You're a bit... gimmicky. No offense. Ramattra: \"Gimmicky\"? Junker\
      \ Queen: I said, no offense! As an Omnic designed for warfare and combat he\
      \ should be significantly stronger than Zenyatta), higher in Nemesis Form (Described\
      \ as an upgrade of his normal physical powerOverwatch 2 Art Director Dion Rogers\
      \ Talks About The Design Principles Behind The Dual Modes For Ramattra In Interview\
      \ and is stated by Ramattra himself as utilizing more brute force than precision),Overwatch\
      \ 2 - All Ramattra Interactions + Unique Kill Quotes - Junkrat: How come you\
      \ don't stay a big bloke all the time? Ramattra: I prefer tactical precision\
      \ over brute force. Junkrat: Oh, likewise, likewise. Some of my favorite bombs\
      \ are extraordinarily precise! up to Small Town level level with Preparation\
      \ (Able to access the full arsenal of Null Sector if given proper time to prepare,\
      \ including a Titan Omnic, which when Ramattra deployed it, was capable of tanking\
      \ several 1.75 Kiloton shots while only being staggered,Overwatch 2: Ironclad\
      \ requiring a 7 Kiloton shot to destroy it, with the weaponry of Titan Omnics\
      \ being able to harm themselvesOverwatch 2 CinematicEach cell used by Torbj\xF6\
      rn at his workshop has the stated energy of a Volcanic Eruption, thus, dividing\
      \ the Mount St Helens eruption's 7 Megaton explosion by 1000 to change it from\
      \ a 5 on the Volanic Explosion Index to a 2 on the Volcanic Explosion Index,\
      \ this making the cells each equivalent to 7 Kilotons, and for each shot the\
      \ small turrets can do, and Titans can tank, is equivalent to 1.75 Kilotons\
      \ of TNT)"
    source_ids:
    - vsbattles-ramattra-overwatch
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
