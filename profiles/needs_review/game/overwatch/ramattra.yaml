  intelligence:
    text: 'Genius (All omnics possess mental processors that are far beyond what normal
      humans are capable of, to the point that even their written language, Omnic
      Script is so complex that even genius humans like Efi Oladele can only comprehend
      a handful of words.The Hero of Numbani - Overwatch Novel #1 Ramattra in particular
      was designed with an enhanced processor meant to excel in combat and tactical
      assessment due to Ravager units being made as commanders, guiding units into
      combat and adapting various strategic protocols to battlefield condition changes
      in real time.Ramattra Ramattra is also a genius engineer, having personally
      designed and upgraded himself to achieve his Nemesis FormBuilding a Revolutionary
      as well as designing the new forces of Null Sector using the outdated models
      from the previous uprising as a template and leading them in a global assault
      on humanity)'
    source_ids:
