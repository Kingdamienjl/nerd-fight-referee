      value: Genius. A brilliant tactician and leader who nearly succeeded in his
        battle against the Maverick Hunters on numerous occasions. He was hailed as
        the greatest Reploid before his fall due to his keen mind and was the leader
        of the Maverick Hunters. However, his continual destruction took a toll on
        his psyche and he becomes increasingly insane and unstable (Best exemplified
        by his slurred speech in his sixth body)
      source_id: mediawiki-4460564
