    - field: intelligence
      value: Extraordinary Genius (Despite having severe psychological damage as a
        result of his mind being fragmented due to temporary exposure to a black hole,
        Sigma is a brilliant scientist, widely considered a pioneer in the field of
        astrophysics due to his groundbreaking research. Having spent his entire life
        devising a way to harness the power of gravity he developed an experimental
        method to control the power of a black hole, though this failed due to an
        unforeseen error. Even after this though his brilliance was recognized by
        Talon as a means of weaponizing his abilities and intelligence to further
        their plans. Under Talon his mind was allowed to expand freely, giving him
        the opportunity to not only gain control over his gravitational abilities
        but use them to develop his research even further in hopes of unlocking the
        secrets of the universeSigma Origin Story)
      source_id: vsbattles-sigma-overwatch
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'His fractured mental state makes him unstable at times Notable Attacks/Techniques:
        *Hyperspheres: Sigma''s primary weapon, a pair of gravitational charges which
        bounce off walls and implode after a short duration, damaging enemies within
        a sizable radius. Sigma is able to create an indefinite number of these at
        will. *Experimental Barrier: Sigma propels a floating barrier to a location
        of his choosing. He can retrieve the barrier at any time. *Kinetic Grasp:
        Sigma freezes incoming projectiles in midair, converting them into shields.
        *Accretion: Sigma gathers a mass of debris and flings it at an enemy to knock
        them down. *Gravitic Flux: Unleashing his full powers, Sigma takes flight,
        lifts enemies in a targeted area, and launches them into the sky before slamming
        them back down *Hyper Strike: Sigma punches the enemy, which levitates and
        knocks away enemies. *Levitation: Sigma briefly levitates up to 5 meter height.
