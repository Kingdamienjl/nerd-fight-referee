      confidence: 0.75
    - field: weaknesses
      value: 'Sigma loves to monologue and does so deliberately. He is more interested
        in unlocking and observing X''s full potential as the Father of Reploids and
        its future than actually winning at times, possibly wishing to replicate it
        for himself or other Reploids. He becomes increasingly insane and unstable
        as time goes by, especially in his sixth form, where he acts like a mindless
        beast, Intangibility can be bypassed by weapons tuned to his virus matrix
        (Which is constantly mutating and changing, making this difficult to exploit)
        {{scroll box|content=}} Notable Attacks/Techniques: *Possession: After merging
        with the Maverick Virus, Sigma exists as an incorporeal being that uses physical
        bodies to interact with the world directly (But can still fire energy and
        virus blasts to damage foes). As a result, he''s nearly impossible to kill
        without a weapon specifically designed for eradicating the Maverick Virus
        and even then those weapons couldn''t put him down permanently. Even more
        fearsome is the fact that he is able to influence the minds of anyone on Planet
        Earth, even humans despite his nature as a computer virus. He is able to do
        this on a planetary scale, ensuring that he would not be put down until the
        advent of the Mother Elf. ==Gallery== {{Scroll box|content= Wolf Sigma.png|Wolf
