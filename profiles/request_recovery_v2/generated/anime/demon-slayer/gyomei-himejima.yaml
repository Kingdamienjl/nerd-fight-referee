power_scale:
  tier:
    text: '{{7-C}}, higher with the Demon Slayer Mark, even higher with Bright Red Nichirin Spike Flail
      and Axe Name: Gyomei Himejima Origin: Demon Slayer: Kimetsu No Yaiba Gender: Male Age: 27 Classification:
      Human, Demon Slayer, Hashira, Stone Hashira'
    source_ids: &id002
    - mediawiki-3953954
    confidence: 0.95
  attack_potency:
    text: "Town level (Gyomei is the strongest hashira of his generation. Is considered a prodigy like\
      \ Muichiro, being able to climb up to the rank of a Hashira within two weeks after picking up a\
      \ sword. Praised to have an incredible physique by Kokushibo, described as \"refined to its upmost\
      \ limits\", one that hasn't been seen in 300 years. Decapitated Muzan and parried his Black Blood\
      \ Brambles. Comparable, if not superior to Sanemi. Kokushibo considered him and Sanemi to be highly\
      \ skilled even among the Hashira and that by killing them, the remaining slayers should be easy\
      \ to defeat. Also considered as the strongest in the slayer\u2019s corps by Tanjiro, Inosuke, Mitsuri\
      \ and Muichiro6.645 Kilotons of TNT), higher with the Demon Slayer Mark (Blew a chunk out of serious\
      \ Kokushibo's chest. Blew chunks off of Muzan's arms and whips, something that most of the Hashiras\
      \ aren't capable of doing), even higher with Bright Red Nichirin Chained Spiked Flail and Axe (Smashed\
      \ Kokushibo's head, albeit with help. Blew chunks off of Muzan)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+ (Could keep up and dodge many attacks from Kokushibo who later praised
      his speed and reflexes. Should be significantly faster than Unmarked Mitsuri who could dodge lightning
      from Zohakuten and Tengen who could do this Mach 2274), far higher with the Demon Slayer Mark (The
      Demon Slayer Mark significantly enhances the user's speed. Blocked an angry Kokushibo's attempt
      at blitzing him and avoided his crescent moons. Kept up with a serious Kokushibo and avoided numerous
      danmaku crescent moons. Changed the trajectory of his chains last second to protect Sanemi from
      Kokushibo's sudden transformationMach 2274), even higher with Transparent World (Kept up with serious
      Kokushibo's extreme danmaku crescent moon and even threw a juzu bead at him without him noticing.
      Changed his trajectory mid leap and avoided Kokushibo's crescent moon that caught Marked Transparent
      World Muichiro off guard despite having no swinging motion. Kokushibo was unable to land a hit on
      him)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 50 (Able to push a giant boulder across town), higher with Demon Slayer Mark
      (Restrained Muzan with his chains)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Town level (Decapitated Muzan), higher with the Demon Slayer Mark (Blew a chunk out of serious
      Kokushibo's chest. Blew chunks off of Muzan's arms and whips), even higher with Bright Red Nichirin
      Spike Flail and Axe (Smashed Kokushibo's head, albeit with help. Blew chunks off of Muzan)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Town level (Withstood hits from a casual Kokushibo), higher with the Demon Slayer Mark (Comparable
      to Marked Sanemi. Withstood hits from a serious Kokushibo)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Superior to Tanjiro who endured extremely taxing training for seven days non-stop
      with no food, no sleep, and only a small amount of water from rain, later drained for even greater
      stamina, was also getting injured frequently during the training session. Far superior to Inosuke
      who can hunt for 3 days. Hashira can train for months through training that almost puts them on
      the verge of death. Fought Lower Rank-level demons in the Infinity Castle for nearly 5 hours on
      top of fighting Kokushibo. Didn't seem tired at the end of his long fight with Kokushibo)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Several Meters with his Chained spiked flail and axe and Breathing Styles.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (When fighting against Kokushibo, he realised that the Upper Rank was overpowering him
      in a way that was supernatural but still could be obtained or countered somehow. When he gained
      access to the Transparent World, he surmised that his eyes gave him the ability to access this special
      world as well and instinctively learned how to use this to his advantage, even going as far as to
      manipulating his own blood flow and breathing to disrupt Kokushibo's attacks. Upon seeing Muzan's
      special constitution, he immediately deduced that he needed to attack all twelve of his vital organs
      simultaneously to deal significant damage to him)
    source_ids: *id002
    confidence: 0.95
