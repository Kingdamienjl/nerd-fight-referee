    confidence: 0.95
  intelligence:
    text: At least Genius, likely Extraordinary Genius (Became a preternatural expert of pharmacology,
      medicine and poisons by age 18. Even as a young child independently learned to prepare medicines.
      Needed only a single look to prepare a complete cure for a supernatural poison that transformed
      people into spiders using only early 20th century technology. Could rapidly mix and adjust new poisons
      mid-battle to counter Doma's adaptive resistance to them. Invented her own Breathing Style to compensate
      for her lack of arm strength centered around her own custom weapon and use of poisons. Possesses
      an impressive level of knowledge about the anatomy of human and demon bodies. Successfully planned
      a strategy to defeat both Doma and Muzan Kibutsuji despite their far superior power. Helped the
      over 500 year old medical expert Tamayo successfully complete the supernatural anti-Muzan multi-stage
      drug in a mere few weeks of collaboration after Tamayo had been stuck working on it for roughly
      a year)
    source_ids: *id002
