      Trio of Victory\")"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+Mach 2,274 (Faster than Base Giyu), higher, possibly far higher with Rage
      Amp (Outpaced Doma several times, who repeatedly called her fast despite frost damaging her lungs
      and impeding her breathing. Doma thought she might be the fastest Hashira he had ever encountered,
      and might have beaten him with her speed if she had the strength to decapitate him), even higher
