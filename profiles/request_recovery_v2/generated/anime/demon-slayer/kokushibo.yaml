power_scale:
  tier:
    text: 'At least {{7-C}}, likely far higher Name: Kokushibo, Michikatsu Tsugikuni Origin: Demon Slayer:
      Kimetsu No Yaiba Gender: Male Age: 17-24 (Human); at least over 480 years old chronologically Classification:
      Human (Formerly), Demon Slayer (Formerly), Demon, Twelve Kizuki member, Upper Rank One'
    source_ids: &id002
    - mediawiki-3954695
    confidence: 0.95
  attack_potency:
    text: At least Town level, likely far higher (As the holder of the Upper Rank 1 position, he is the
      strongest of the Twelve Kizuki, and is second only to Muzan in the hierarchy, making him far superior
      to the likes of Gyutaro, who demolished the entire Entertainment District with his Blood Blades.
      Stated by Doma to be superior to Akaza and has defeated and absorbed three other demons who challenged
      his rank before. Easily defeated Marked Muichiro, severing his arm in a single swipe before pinning
      him to a column using his own Nichirin Sword. Kept up with Sanemi in multiple clashes, ultimately
      overwhelming him and leaving his torso slashed open, requiring stitches. Kept up with Gyomei and
      forced him to activate his Demon Slayer Mark. Stood his ground against Marked Gyomei and Sanemi
      together without resorting to using his Shichishito Blade and has cut the latter's fingers off,
      and would have slashed both of his arms off if Gyomei didn't intervene and divert the attack. Slashed
      Marked Muichiro and Demon-Transformed Genya in half, while pushing Gyomei and Sanemi away, and freeing
      himself from Genya's paralyzing Blood Demon Art>6.45 Kilotons of TNT), possibly higher in Monster
      Form
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Massively Hypersonic+, likely far higher (Blitzed base Akaza and slashed off his arm
      without him noticing. Blitzed Marked Muichiro, slashing his arm off in a single swipe and pinning
      him to a pillar column before he can even react, with Muichiro considering the speed to be "in another
      dimension" compared to his own, which should make him faster than Hashira like Mitsuri who dodged
      lightning and Tengen who could cut numerous bombs at once before they even explode.> Mach 2274),
      higher attack speed with Shichishito Blade Form (Blitzed Marked Sanemi and Marked Gyomei from far
      away, with both of them crediting his speed, and Sanemi admitting he would've lost his arms if not
      for Gyomei diverting the attack and has kept both them whom were Marked at bay, with them only being
      able to get close due to Genya's Blood Demon Art restraining him), even higher with Monster Form
      (Completely blitzed both Marked Sanemi and Gyomei.)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class K (Should be physically comparable, if not superior to Marked Gyomei. Capable
      of swinging a flesh sword that is significantly larger than his own body at incredibly high speeds.
      Able to break out of Genya's paralyzing Blood Demon Art, which restrained him to the ground, and
      had roots going through his entire body>399.7 Tons)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Town level, likely higher (Comparable to his AP)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Varies (The durability of demons fluctuates depending on what parts of their body they reinforce,
      with their necks most often prioritized), up to at most Town level+ (It required the combined efforts
      of Marked Sanemi and Gyomei using Bright Red Nichirin blades to decapitate himKimetsu no Yaiba,
      Chapter 175: "Respect for Future Generations"), likely higher (Demons can reinforce a part of their
      body above the extent of their own Blood Demon ArtKimetsu no Yaiba: Anime, Episode 19: "Hinokami"Kimetsu
      no Yaiba, Chapter 40: "Hinokami"), Regeneration makes him difficult to kill'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite (Demons don't tire)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range; Tens of Meters with his Blood Demon Art; possibly Hundreds of Meters with
      Fourteenth
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (As a talented swordsman who has existed for over four centuries, Kokushibo has experienced
      countless battle situations and threats which he has learnt to overcome and circumvent. This was
      displayed during his battle with three Hashira and Genya, where he was able to adapt to their special
      and unique fighting styles and tactics nigh instantaneously after witnessing it. For example, after
      Muichiro unleashed his first attack against the Upper Rank, he was able to determine he was a user
      of Mist Breathing, a talented one at that. This was further accentuated through Kokushibo being
      able to take on Sanemi and Gyomei simultaneously despite both of them being marked and being users
      of different Breathing Styles, meaning he'd have to deal with 2 vastly different opponents at once,
      which he did so successfully, even overwhelming them multiple times.)
    source_ids: *id002
    confidence: 0.95
