- id: claim-standard-equipment-b7ee3b1e
  section: equipment
  axis: equipment
  text: Flesh Katana (Kokushibo carries a fleshy and demonically modified version of a Nichirin katana
    he used when he was a Demon Slayer. As suggested by its appearance, the katana is created from the
    flesh and blood of Kokushibo himself and due to his body's immense durability and hardness, his katana
    is as sharp, if not more, than a regular Nichirin Sword. His sword is fleshy red in color, akin to
    the color of blood, with veins and his eyes all around the blade and even the hilt. However, it is
    unknown whether those eyes can be used to extend his vision. His katana's hilt is circular shaped
    with 4 slight indentations, a center with 3 eyes and several black veins and a golden border. He also
    carries a sword sheath at his waist that has the same fleshy appearance as his katana)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
