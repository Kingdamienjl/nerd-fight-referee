power_scale:
  tier:
    text: "{{High 8-C}}, higher with Awakened Form, even higher with Gyutaro's Eye Name: {{Nihongo|Daki|\u5815\
      \u59EB}}, {{Nihongo|Ume|\u6885}} (Human Name), {{Nihongo|Shiraume|\u767D\u6885}} (Human Nickname),\
      \ {{Nihongo|Warabihime|\u8568\u59EB}} (Oiran Alias), {{Nihongo|Yatamahime|\u5C4B\u73E0\u59EB}} (Former\
      \ Oiran Alias) Origin: Demon Slayer: Kimetsu No Yaiba Gender: Female Age: Unknown, at least over\
      \ 126 years old Classification: Human (Formerly), Demon, Oiran, Twelve Kizuki member, Upper Rank\
      \ Six"
    source_ids: &id002
    - mediawiki-4657086
    confidence: 0.95
  attack_potency:
    text: Large Building level (She is capable of fighting and hurting Nezuko Kamado, Tanjiro Kamado,
      Zenitsu Agatsuma and Inosuke Hashibira), higher with Awakened Form (Was able to fight Tanjiro Kamado,
      while he was using the Hinokami Kagura, and Nezuko Kamado in her Evolved Demon Form), even higher
      with Gyutaro's Eye
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Likely Massively Hypersonic (Blitzed Base Post-Rehabilitation Training Tanjiro, and isn't much
      slower than her Awakened Form), Massively Hypersonic with Awakened Form (Outpaced Tengen's explosions
      and competed with Demon Form Nezuko), higher with Gyutaro's Eye (Kept up with Post-Rehabilitation
      Training Inosuke and Zenitsu, obstructed a distracted Tengen)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 25 (Should be far superior to Lower Ranks like Rui and Enmu)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Building level, higher with Awakened Form, even higher with Gyutaro's Eye
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Varies (The durability of demons fluctuates depending on what parts of their body they reinforce,
      with their necks most often prioritized), at most Large Building level (Blocked Zenitsu's sixfold.
      Withstood an onslaught from Evolved Nezuko), likely higher (Demons can reinforce a part of their
      body above the extent of their own Blood Demon Art), higher with Awakened Form (Tanjiro Kamado was
      unable to cut her neck while using his Hinokami Kagura), even higher with Gyutaro's Eye
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite (Demons don't tire)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Tens of Meters with Obi
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (Lured and trapped people for over a century. Worked for over a century as a highly
      successful oiran [oirans are distinguished by their skills in the traditional arts]. Recognized
      that a disguised Zenitsu was a Demon Slayer after only hitting him once)
    source_ids: *id002
    confidence: 0.95
