- id: claim-weaknesses-eb625634
  section: weaknesses
  axis: weakness
  text: "Standard Demon Weaknesses. She has pyrophobia ever since she nearly was killed by being set on\
    \ fire, and will freeze up from the trauma of remembering it. Notable Attack/Techniques: Daki unleashes\
    \ a long-ranged Obi attack.gif|Unnamed Long-Ranged Obi Technique Daki delivers an indiscriminate long-ranged\
    \ attack.png Daki uses her Eight-Layered Obi Slash technique.gif|Eight Layered Obi Slash *Unnamed\
    \ Long-Ranged Obi Technique: Daki unleashes several Obi sashes from afar, causing massive destruction\
    \ over a long distance. *{{Nihongo|Eight Layered Obi Slash|{{Ruby|\u516B|\u3084}}{{Ruby|\u91CD|\u3048\
    }}{{Ruby|\u5E2F|\u304A\u3073}}{{Ruby|\u65AC|\u304E}}\u308A|Yae Obigiri}}: Daki creates eight long\
    \ ranged Obi sashes to cut down her opponents from afar. Daki noted that this interweaving attack\
    \ has no blind spots, thus making it extremely difficult to evade or counterattack. ==Notable Matchups==\
    \ Victories: Losses: Obanai & Tengen (Demon Slayer: Kimetsu No Yaiba) Obanai & Tengen's Profile (All\
    \ combatants are In-Character, Obanai's Demon Slayer Mark & Bright Red Nichirin Sword are restricted,\
    \ Daki starts without Gyutaro but can summon him at any time, Obanai & Tengen start one hundred meters\
    \ away from Daki, Tengen has Class 25 Lifting Strength, Prior Knowledge of the location is afforded\
    \ to the combatants that would canonically have Prior Knowledge about Yoshiwara; Speed Unequalized)\
    \ Inconclusive: {{Discussions}} Category:Characters Category:Demon Slayer: Kimetsu No Yaiba Category:Acrobats\
    \ Category:Adults Category:Anime Characters Category:Antagonists Category:Aura Users Category:BFR\
    \ Users Category:Bodily Weaponry Users Category:Body Control Users Category:Chi Users Category:Demons\
    \ Category:Elasticity Users Category:Enhanced Senses Users Category:Evil Characters Category:Extrasensory\
    \ Perception Users Category:Fear Users Category:Female Characters Category:Flight Users Category:Hair\
    \ Users Category:Immortals Category:Information Analysis Users Category:Monsters Category:Manga Characters\
    \ Category:Paralysis Users Category:Regeneration Users Category:Sealing Users Category:Self-Sustenance\
    \ Users Category:Sleep Users Category:Statistics Amplification Users Category:Stealth Masters Category:Telepaths\
    \ Category:Tragic Characters Category:Transformation Users"
  source_ids: *id003
  decisive: false
