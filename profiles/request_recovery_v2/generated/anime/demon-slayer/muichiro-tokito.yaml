power_scale:
  tier:
    text: '{{7-C}}, higher with the Demon Slayer Mark, even higher with Bright Red Nichirin Blade Name:
      Muichiro Tokito Origin: Demon Slayer: Kimetsu No Yaiba Gender: Male Age: 14 Classification: Human,
      Demon Slayer, Hashira, Mist Hashira'
    source_ids: &id002
    - mediawiki-3942923
    confidence: 0.95
  attack_potency:
    text: Town level (Superior to Post-Type Zero training Tanjiro, as Tanjiro hadn't reached the level
      of a Hashira until after his Hashira training, who could match Hantengu's emotion clones. Should
      be comparable to the other Hashira, as he is a prodigy who reached the Hashira rank within two months
      after picking up a sword, earning him the praise of Tengen. Matched Obanai and Sanemi in a sparring
      match with wooden swords during the Hashira Training Arc), higher with Demon Slayer Mark (Should
      be comparable to Marked Mitsuri Kanroji who could compete with Upper Moon 4 level demons. Had little
      difficulty defeating Gyokko, even in his Molting Transformation and while under the influence of
      a paralyzing poison, when his base form previously got overwhelmed, claiming he wasn't serious until
      the end), far higher with Bright Red Nichirin Sword and Death Amp (Turned his sword red with one
      arm despite being slashed in half, burning Kokushibo's insides and making him stiff with a searing
      pain, contributing to him screaming in agony)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+ (Should be comparable to other Hashira such as Unmarked Mitsuri who could
      dodge lightning and Tengen who could do this. During the Pillar Training he was in charge of quick
      movement training. Outsped Sanemi and Obanai in a 1 Vs 2), far higher with the Demon Slayer Mark
      (Casually cut through Gyokko's attack "Ten Thousand Gliding Clayfish", and casually blitzed Gyokko
      himself), far higher with Transparent World (Dodged many of Kokushibo's serious attacks which blitzed
      him in his casual state and even landed a hit on him), even higher with Death Amp
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 25 (Superior to Shinobu and Obanai in arm-wrestling, Should be comparable to
      Post-Type Zero Tanjiro), Class K with Demon Slayer Mark (Should be comparable to Post-Hashira Marked
      Tanjiro), even higher with Death Amp (Turned his sword red using one arm with pure gripping strength)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Town level (Decapitated the fake Hantengu), higher with the Demon Slayer Mark (Casually decapitated
      True Form Gyokko), far higher with Bright Red Nichirin Sword and Death Amp (Pierced Kokushibo and
      burnt his insides, making him scream in agony)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Town level (Should be comparable to Mitsuri, Tengen and Rengoku), higher with the Demon Slayer
      Mark (Should be comparable to Marked Mitsuri)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Went through training so intense that it made him cough blood and put him on the
      verge of death. Comparable to Gyomei Himejima and Sanemi Shinazugawa who fought Lower Rank-level
      Demons in the Infinity Castle for nearly 5 hours on top of fighting Upper Rank 1, Kokushibo. Remained
      conscious and kept fighting despite having his lower half sliced off)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range, Several Meters with Breathing Techniques
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (Is an incredibly talented and skilled Demon Slayer who became a Hashira after 2 months
      of training and even then trained through extreme training)
    source_ids: *id002
    confidence: 0.95
