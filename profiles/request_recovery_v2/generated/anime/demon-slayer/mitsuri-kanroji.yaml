    beings and invisible attacks. Can let blind people see as well) |-|Resistances= Resistance to: *Fire
    Manipulation, Water Manipulation & Heat Manipulation (Demon Slayer Corps Uniforms protect against
    fire, water and cold) *Poison Manipulation (Total Concentration Breathing grant resistance to poison
    and the ability to slow its circulation) *Biological Manipulation (Breathing Users are resistant to
    Muzan''s blood which can immediately transform normal humans into demons with a scratch, leading them
    to require a few days to willingly transform. Can resist Muzan''s injected blood which rapidly attacks
    and destroys cells leading to quick melting and vaporization) *Pain Manipulation (Was willing to continue
    fighting after suffering crippling injures and having her ear severed) *Enhanced Fear Manipulation
