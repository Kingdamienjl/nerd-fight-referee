    and Upper Rank like Rui. Rui''s aura was implied to be similar to Shinobu''s, which caused intense
    shuddering and lack of air. Immune to Muzan Kibutsuji''s aura that made Akaza bleed and paralyzed
    him in fear) *Air Manipulation (Comparable to Tanjiro who was unbothered by the Swamp Demon''s pocket
    dimension that has almost no air) *Resistance to Enhanced Smell, Clairvoyance & Extrasensory Perception
    with Yushiro''s talisman (Can mask their own bloodlust, malicious intent, presence, location, strength,
    and scent from Tanjiro and even Muzan himself)'
