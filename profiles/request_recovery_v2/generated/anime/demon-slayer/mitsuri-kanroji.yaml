      be comparable to the other Hashira such as Tengen, who could match Gyutaro and survive his final
      attack. Could easily slash through and block Zohakuten's attacks. Showed afterwards that she managed
      to make a shallow cut in Zohakuten's neck, which should be the toughest part of his body), higher
