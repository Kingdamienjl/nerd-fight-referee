    presence of others and malicious intent, this can be used to differentiate humans and demons, determine
    how strong someone is to a certain extent or detect an enemy in the vicinity, Muzan stated that the
    Hashira could detect an Upper Rank in the Entertainment District right away) *Master Swordswoman **Sunlight
    Absorption (The ore of her katana (Scarlet Crimson Ore) absorbs sunlight) **Non-Physical Interaction
    with Nichirin Sword (Nichirin Swords can cut through Zohakuten''s lightning) **Statistics Amplification
    (Total Concentration Breathing can make the user become much stronger and faster. Her Demon Slayer
    Mark further increases her power and speed) **Perception Manipulation (Can create seemingly elemental
