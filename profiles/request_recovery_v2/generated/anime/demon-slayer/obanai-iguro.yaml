- id: claim-standard-equipment-c76d1b8a
  section: equipment
  axis: equipment
  text: "Twisted Nichirin Katana (A blade made from metals that absorbed the light of the sun, they cause\
    \ demons to completely disintegrate if they are decapitated with them, as they are weak to sunlight,\
    \ which in the case of demons which have assumed a form where they don't have a neck or head in the\
    \ traditional sense can be done by slicing something that's equivalent enough to the neck, demon limbs\
    \ that are sliced off and constructs created through Blood Demon Arts that are bisected through a\
    \ Nichirin sword are also subject to the disintegration, stabs and slashes with a Nichirin sword can\
    \ dispel the effects of Blood Demon Arts and can temporarily weaken a demon's power and abilities\
    \ if directed at the neck), Demon Slayer Corps Garbs (Protects from the claws and slashing attacks\
    \ from weaker demons, and resistance against fire, water and cold), and his serpent friend, {{Nihongo|Kaburamaru|{{Ruby|\u93D1\
    |\u304B\u3076\u3089}}{{Ruby|\u4E38|\u307E\u308B}}|Kaburamaru}} (Obanai, having always been partially\
    \ blind in his right eye, developed a combat technique utilizing his pet snake Kaburamaru. Kaburamaru\
    \ possesses a unique ability which allows him to read and predict a target's attacks and then relay\
    \ that information to Obanai. The full extent of this technique is demonstrated when Obanai is completely\
    \ blinded by Muzan, but he is still able to continue fighting effectively. Kaburamaru also seems to\
    \ be capable of understanding human speech and emotions, as he understood Tanjiro's instructions to\
    \ grab Yushiro's paper talisman and later shed tears when watching Obanai and Mitsuri pass away. Kanao\
    \ herself stated that Kaburamaru was exceptionally clever)"
