  durability:
    text: Building level (Survived being at the epicenter of an explosion that destroyed the roof of a
      building.) | At least Town level, likely higher (Has survived multiple attacks from a suppressed
      Akaza.)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Hashira can train for several months on end. Superior to Tanjiro who endured extremely
      taxing training for seven days non-stop with no food, no sleep, and only a small amount of water
      from rain, later drained for even greater stamina, was also getting injured frequently during the
      training session. Far superior to Inosuke who can hunt for three days. Comparable to fellow Hashira
      who fought Lower Rank-level demons in the Dimensional Infinity Fortress for nearly 5 hours on top
      of fighting Upper Ranks. In his Special One-Shot, Kyojuro ruptured his eardrums, yet didn't flinch
      in the slightest, ignoring the pain and continuing to fight and win. In Kyojuro Rengoku's Story,
      he suffered dozens of severe wounds and injuries from gunshots and explosions coming from the former
      Lower Rank 2, Hairo, but continued to stall enough time for all the bombs he planted to be disarmed
      without showing any signs of pain or fatigue, which shocked Hairo, who questioned himself on whether
      the person he met in the past was really the same person he was fighting now. Furthermore, his battle
      against Enmu when he fused with an entire train, he was able to keep him at bay in 5 different train
      carts without tiring. Lastly, he managed to keep up with Akaza, one of the strongest demons in existence
      despite physically and mentally exert himself beyond his limit and sustaining multiple irreparable
      and fatal wounds, like a smashed eye, shattered ribs and damaged internal organs. Most impressively,
      he managed to keep Akaza at bay despite having his vital spot, his Solar Plexus, pierced by the
      Upper Rank's arm and bleeding out. Despite all of his fatal wounds and injuries, he never once flinched
      or showed signs of pain or agony)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with Nichirin Sword, Several Meters with Breathing Styles
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (As a swordsman who came from a lineage of Flame Hashira, Kyojuro had access to generations
      of combat knowledge and tactics as well as training from previous Flame Hashira, like his father,
      Shinjuro Rengoku. Kyojuro could also master the entire Breath of Flames style just from reading
      3 volumes of a book on it. During the battle against Akaza, he displayed keen judgement like after
      being attacked by Akaza''s Destructive Death: Air Type, he realizes that he must fight at close
      range with he wanted to increase the chances of cutting of his head. Even when the usually deductive
      and sagacious Tanjiro Kamado was at a loss of how to kill Enmu, Kyojuro instinctively knew that,
      no matter what form a demon takes, it will always have a weak spot. He also possesses great knowledge
      in the use of the Total Concentration Breathing, knowing how to plug minor wounds and hemorrhaging
      and saved Tanjiro from dying of blood loss. As another testament to his tactical intellect, Kyojuro
      could instantly read his allies'' sign language at indicating the Flute Demon''s abilities despite
      being unable to fully control their movements and execute a countermeasure before the demon''s Blood
      Demon Art befell him)'
    source_ids: *id002
    confidence: 0.95
