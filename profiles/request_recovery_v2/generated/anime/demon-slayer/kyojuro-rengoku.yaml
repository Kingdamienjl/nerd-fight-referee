      no Yaiba: The Movie, Mugen Train>6.645 Kilotons of TNT), far higher with Death Amp (When enraged
      and facing imminent death, he stopped Akaza''s fist and slashed halfway through his neck even on
      the verge of death, when Akaza was serious and actively trying to escape his grip who compares him
      to Marked Tanjiro and Giyu.)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Supersonic+ (Can keep up with Hairo, who should be inferior to Enmu, but comparable to Rui
      who as a member of the Twelve Kizuki should be significantly faster than the lesser Slasher Demon
      who could run across an entire railroad track in seconds.) | Massively Hypersonic+ (Should at least
      be comparable to Unmarked Mitsuri Kanroji who could dodge lightning and Tengen who can cut numerous
      bombs before they even explode.Kimetsu no Yaiba, Chapter 122: "A Passing Moment of Excitement"Kimetsu
      no Yaiba, Chapter 86: "Gyutaro" Post-Rehabilitation Tanjiro can''t follow his movements, while Inosuke
      considered him being in a whole different dimension.) likely far higher with Death Amp (Caught a
      panicked Akaza''s fist who was desperately trying to get away and escape from the rising sun.)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 25 (Superior to Rui and comparable to Post-Rehabilitation Tanjiro and Inosuke)
      | At least Class 25, at most Class 50 (Stronger than Tanjiro but weaker than Gyomei), Class K with
