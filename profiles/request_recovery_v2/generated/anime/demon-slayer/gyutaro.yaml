power_scale:
  tier:
    text: '{{7-C}} Name: Gyutaro Origin: Demon Slayer: Kimetsu No Yaiba Gender: Male Age: Unknown, at
      least over 126 years old Classification: Human (formerly), Debt Collector, Demon, Twelve Kizuki
      member, Upper Rank Six'
    source_ids: &id002
    - mediawiki-4721303
    confidence: 0.95
  attack_potency:
    text: 'Town level (He is the true Holder of the Position of Upper Rank Six and much stronger than
      his sister. Managed to fight Tengen and Post-Rehabilitation Tanjiro KamadoKimetsu no Yaiba, Chapter
      88: "How to Defeat Them" at the same time and overwhelm them. Tanjiro needed a hundred times more
      than his usual strength, and awaken his Demon Slayer Mark, to cut his neck off. Despite the fact
      that he was decapitated, Gyutaro was still capable of creating long-ranged tornados of razor sharp
      blood that decimated the surroundings with ease, severely injuring and maiming Tengen,Kimetsu no
      Yaiba: Anime, Episode 43: "Never Give Up"Kimetsu no Yaiba, Chapter 94: "Do Something" Tanjiro and
      Inosuke, and would have likely killed them if it wasn''t for Nezuko''s own unique Blood Demon Art:
      Exploding Blood saving them all. Muzan said that Daki was holding Gyutaro backKimetsu no Yaiba,
      Chapter 95: "Final Moments"Kimetsu no Yaiba, Chapter 98: "The Upper Ranks Gather" and that Gyutaro
      would''ve killed Tengen, Tanjiro, Nezuko, Zenitsu and Inosuke all by himself if he had been the
      one fighting from the beginning.6.645 Kilotons of TNT)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+ (Casually dodged a direct fatal attack while saving his sister Daki from
      Tengen Uzui, who can cut numerous bombs at once before they even explode. All of this happened when
      Gyutaro was transforming out of Daki's body. Tengen considered Gyutaro to be fast. Can keep up with
      Tengen and Post-Rehabilitation Tanjiro at the same time, outpacing Tengen and blitzing Tanjiro during
      the fight. Is so fast that he appears to teleport, appearing in front of Tanjiro without him noticing
      at first, and then vanishing in front of Tengen and appearing on top of a building.Mach 1762)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'At least Class 25 (Should be superior to Enmu. Has stopped one of Tengen''s attacksKimetsu
      no Yaiba, Chapter 91: "A Change of Strategy" with his teeth and has stopped the attacks of Tanjiro
      and Tengen at the same time and started absorbing them with his sickles.>16.327 Metric Tons)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Town level (Managed to fight Tengen and Tanjiro at the same time and overwhelm them. Cut Tengen's
      arm off and slashed the left side of his face, resulting in the loss of Tengen's left eye. Stabbed
      Tanjiro through the jaw with his sickle.)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Varies (The durability of demons fluctuates depending on what parts of their body they reinforce,
      with their necks most often prioritized), at most Town level (When Tengen and Tanjiro both used
      their Nichirin Swords to attack Gyutaro''s Kama made from his own flesh, it was to no avail as they
      couldn''t even slice through it. When Tanjiro landed a surprise attack on Gyutaro''s neck, his blade
      failed to make a dent in the Upper Rank''s body. Tanjiro only managed to lob off his head when he
      "summoned a hundred times" the strength in his body, awakening his Mark in the process, to successfully
      cut through his neck.), likely higher (Demons can reinforce a part of their body above the extent
      of their own Blood Demon Art.Kimetsu no Yaiba: Anime, Episode 19: "Hinokami"Kimetsu no Yaiba, Chapter
      40: "Hinokami")'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite (Demons don't tire)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically, Hundreds of Meters with his Blood Demon Art
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (Gyutaro displays incredible tactical foresight and intelligence. He is able to
      use the information he gathered from Daki to coordinate their attacks against his opponents and
      was able to figure out and avoid Tengen's usage of bombs. Gyutaro was also able to use his Blood
      Demon Art tactically to create inescapable attacks. After seeing Hinatsuru fire a barrage of kunai,
      Gyutaro correctly surmised that mounting an attack that would normally be easily mitigated by his
      regeneration had an underlying motive and chose to deflect the attack rather than taking it head
      on. He is also shown to use his flesh manipulation ability in creative ways, such as trapping Tengen's
      and Tanjiro's blade in his flesh Kama to keep them from moving. Lastly, Gyutaro figured out Tanjiro's
      strategy which was to disguise the scent of the wisteria-laced kunai with a prostitute's incense
      bag in order to land a surprise attack on him)
    source_ids: *id002
    confidence: 0.95
