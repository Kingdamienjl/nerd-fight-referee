  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Extrasensory Perception (Can see ghosts and souls among some
    other supernatural forces that are normally otherwise invisible), Accelerated Development (After a
    single battle, his Stand's capabilities noticeably improved, increasing even further as the Part progresses),
    Aura and Summoning (Of his Stand). Heaven's Door has Incorporeality (Stands are the incorporeal manifestations
    of one's vital energy, and can only be harmed by other Stands), Non-Physical Interaction (Stands can
    interact with ghosts and other Stands), Information Manipulation, Transmutation (Heaven's Door turns
    people, mythological beasts, food, etc. into living books with all of the information about them written
    on its pages; Can remove pages or write new information that can control or alter the person's [future]
    actions completely), Biological Manipulation (Turning others into books manipulates the biology in
    many ways such as separating many parts of the body and elasticizing them. Removing memory pages causes
    a significant decrease in body mass), Status Effect Inducement via Mind Manipulation, Mind Control
    (Can control his targets with a write-in command), Morality Manipulation, Memory Manipulation, Information
    Analysis (Of past and future events), Sense Manipulation (Can remove and bestow senses such as the
    ability to see), Fate Manipulation (Heavily implied to have sent Cheap Trick to hell by writing that
    he will go there when he was taken by the ghostly hands)
