- id: claim-weaknesses-22fbab55
  section: weaknesses
  axis: weakness
  text: "Any damage taken by Heaven's Door is reflected back onto Rohan. Rohan is incapable of reading\
    \ his own memories, nor can he perceive memories shared with a target. He cannot heal with Heaven's\
    \ Door, and by his own admission he also cannot use Heaven's Door to change the biological makeup\
    \ of something.Thus Spoke Rohan Kishibe Episode 8: \"D.N.A.\" Notable Attacks/Techniques: Heaven's\
    \ Door: Heaven's Door is a small, white-and-gold humanoid Stand with a hat consisting of mostly outlines.\
    \ Sometimes, Heaven's Door's body is entirely composed of outlines. Heaven's Door acts when Rohan's\
    \ target sees it or an image of it drawn by him, which he can make in mid-air, with a pen or with\
    \ his finger. It can also affect multiple targets with its abilities. Heaven's Door Activation.gif\
    \ Rohan meets Reimi.gif JJBA-Rohan meets Masazo Kinoto.gif *Book Transmutation: Heaven's Door's basic\
    \ ability is to incapacitate and turn people into books with pages revealing detailed and absolutely\
    \ true facts on everything the person knows, from memories to their body measurements, secrets, and\
    \ their abilities. Heaven's Door is also effective on animals, ghosts, and the undead, but dying targets\
    \ seem to gradually lose their pages. *Write-In Command: Rohan writes into the pages of people to\
    \ create artificial memories, or make highly effective commands. Rohan's target will always obey the\
    \ commands written, whether them being against their will or humanly impossible. Rohan can write commands\
    \ for himself despite not being able to read them. He can also add capabilities to a person (for instance,\
    \ \"is fluent in Italian\") and has claimed that he could destroy a person's Stand by writing the\
    \ proper command in them. Due to his experience with artistry and making tight deadlines, Rohan can\
    \ write the command with remarkable speed. *It has been shown before that Rohan does not need to physically\
    \ write in commands or touch a person to activate these abilities. In Thus Spoke Kishibe Rohan Episode\
    \ 7: Monday Sunshower, he could rewrite two separate minds while people were gathering in train tracks.\
    \ *Memory Removal: Removing pages causes his target to lose any memories detailed there, along with\
    \ a proportionate quantity of body mass. If too many pages are removed, they can die from the ill\
    \ effects. Note: Rohan at the beginning of DiU is restricted to using images of his Stand to induce\
    \ his book transmutation ability. By the end, Rohan is able to manifest his Stand in mid-air whilst\
    \ also allowing him to induce the same ability with just a point of his fingers. Later in his one-shots,\
    \ Rohan is seen using his Stand ability through thought alone. Thus, one must specify what point in\
    \ time Rohan is when using him. ==Notable Matchups== Victories: Ungalo (JoJo's Bizarre Adventure)\
    \ Ungalo\u2019s Profile (Speed was equalized) Magane Chikujoin (Re:Creators) Magane's Profile (Speed\
    \ was equalized) Enrico Pucci (JoJo's Bizarre Adventure) Pucci's Profile (Speed equal, Made In Heaven\
    \ can amplify its speed) Hitoshi Shinso (My Hero Academia) Shinso's Profile (Speed was equalized)\
    \ Boa Hancock (One Piece) Hancock's Profile (Speed was equalized) Amnesio (Lilo & Stitch) Amnesio's\
    \ Profile (Speed was equalized) Weather Report (JoJo's Bizarre Adventure) Weather Report's Profile\
    \ (Speed was equalized) Diavolo (JoJo's Bizarre Adventure) Diavolo's Profile Hazard (Arrowverse (CW))\
    \ Hazard's Profile (Speed was equalized and both started 4 meters away from each other) Four (Battle\
    \ for Dream Island) Four's Profile (Middle of DiU Rohan and base Four was used, both were 25 feet\
    \ apart and speed was equalized) Samara Morgan (The Ring) Samara's Profile (End of DiU Rohan was used\
    \ and speed equalized) Losses: Inconclusive: Abra Stone (Doctor Sleep (Film)) Abra's Profile (Speed\
    \ was Equal, No Prep, 5 Meters Apart, Both Bloodlusted) God of Light (RWBY) God of Light's Profile\
    \ (End of DIU Rohan was used, and speed was equalized) Ainz Ooal Gown (Overlord) Ainz's Profile (Speed\
    \ was equalized, both had limited intel) ==References== {{Reflist}} {{Discussions}} Category:Characters\
    \ Category:JoJo's Bizarre Adventure Category:Accelerated Development Users Category:Adults Category:Anime\
    \ Characters Category:Antiheroes Category:Fate Users Category:Game Characters Category:Humans Category:Incorporeal\
    \ Characters Category:Information Analysis Users Category:Information Users Category:Male Characters\
    \ Category:Manga Characters Category:Memory Users Category:Mind Users Category:Morality Users Category:Neutral\
    \ Characters Category:Non-Physical Interaction Users Category:Paper Users Category:Playable Characters\
    \ Category:Power Nullification Users Category:Primary Protagonists Category:Protagonists Category:Stand\
    \ Users Category:Status Effect Users Category:Stone Walls Category:Transmutation Users Category:Antagonists\
    \ Category:Narcissists Category:Book Users Category:Writers"
  source_ids: *id003
