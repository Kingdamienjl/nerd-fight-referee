  intelligence:
    text: Gifted. Graduated from university, shown to be aware of a multitude of subjects, especially
      given the time period, extremely well versed in anatomy and medicine specifically which he began
      learning and studying at the age of 9 and eventually became a very skilled doctor that can perform
      even life-threatening surgery and mending such things like optic nerves under optimal conditions,
      along with studying the aforementioned skills, he trained from a young age to become an executioner
      under direct orders from the king of Naples and under the tutelage of his father, inheriting over
      380 years of skills and techniques, of which he learned and mastered before the age 13, proven to
      be adept at landing lethal blows and incapacitating his opponents due to his knowledge of the body.
      Master of the Spin, showing excellent utilization of the ability and quick thinking skills, using
      it in a multitude of situations including very obtuse ways or scenarios that the Spin may not initially
      seem useful in, turning the tables on his opponents and constantly showcases his mastery as well
      as intelligence via utilizing technique in new ways in many situations, even out of battle. Is also
      a genius jockey and survivalist, participated in the cross-continental Steel Ball Race with him
      being a champion candidate.
