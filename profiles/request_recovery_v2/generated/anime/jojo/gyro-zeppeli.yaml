- id: claim-weaknesses-9edac338
  section: weaknesses
  axis: weakness
  text: 'He needs to be on his horse to perform the Super Spin. His Steel Balls lose power after 20-30
    meters. Notable Attacks/Techniques: Gyro asb gif 1.gif|Gyro throwing his Steel Balls Gyro asb gif
    2.gif|Utilizing the Spin to create a gust of air Gyro asb gif 4.gif|Ball Breaker *Spin: Zeppeli family''s
    signature technique. By manipulating the properties of a spinning steel ball via the Magnus Effect
    (a spinning object curving away from its original flight path), anything that comes into contact with
    the steel balls will be able to change properties or movements within the objects touched, examples
    include causing muscles to be twitched, manually moving muscles and locking them into place, disabling
    muscles preventing movementinducing paralysis and can even calmothers through the Spin, numbing of
    the skin, moving body parts against the target''s will (or lack thereof) such as forcing one to shoot
    others or themselves (showcased a multitude of times), flattening bodies granting elasticity to avoid
    attacks or fit into and through small spaces, draining water from a body, manipulating substances
    such as mud and liquids like causing champagne to explode or generating spinning water orbs similar
    to the steel balls, manipulating damage waves thus transferring damage from one part of the body to
    another, hardening of the skin and muscles of himself and presumably others, draw out habits in an
    explosive manner, creating sensory gusts of air, sonar, creating X-Ray''s upon reflective surfaces,
    launching rocks like projectiles, carving trees into ropes, digging holes, sensing movements with
    staggering accuracy from over 10km away, utilizing vibrations to sense objects and cast illusions
    through dust, vaporize water through friction, manipulate air and light thus casting illusions, etc.
    The effects of the Spin can transfer and pass through other solid objects, though the objects it passes
    through may not show signs of being affected. There is virtually an infinite amount of possibilities
    and ways the Spin can be used and/or impact the objects it comes into contact with. The Spin can be
    used with objects other than the Steel Balls such as bullets, rocks, needles, etc but the Steel Balls
    hold the highest proficiency with the technique, in some cases Gyro can use the Spin without any medium
    but its usability is severely limited, when destroyed Gyro can make another set of Steel Balls through
    various methods, like scrapping iron from a train track via the Spin. **Super Spin (Infinite Rotation):
    The Super Spin is obtained in conjunction with a consistently moving object and the aid of the Golden
    Rectangle. In Gyro''s case, Valkyrie creates a Golden Rectangle with its natural running speed, further
    enforced with Gyro''s legs inside of the stirrups of the saddle. This results in a more enhanced version
    of the Spin, in which the energy it produces is nigh-limitless, or "infinite". *Scan: After obtaining
    the Right Eye of the Corpse and embedding it into his own body, Gyro''s steel balls obtain a new appearance
    where one ball looks like it has an eye in the center. This variation of the Steel Ball is only used
    while Gyro was carrying the Right Eye. **Enhanced Vision: The eye inside of the steel balls acts as
    a third eye for Gyro allowing him to see through the steel ball itself and see his surroundings like
    a camera. Once thrown, the eye can give Gyro a vision of his surroundings and every exact detail displayed
    through an X-Ray-like screen as well as sonar, granting Gyro the ability to see through obstacles
    and inside others. This also gives Gyro better calculations for his use of the Spin and steel balls.
    *Ball Breaker: Ball Breaker is a small, green-and-pink humanoid Stand with large ears similar to Mickey
    Mouse. The Stand itself is a visualization of the energy given off by the Spin in Gyro''s steel balls.
    **Energy Acceleration: In conjunction with the Super Spin, energy is gathered by Ball Breaker when
    a steel ball is thrown. It manipulates the energy uses as it is thrown, accelerating the activity
    of objects on a cellular level. For a human, this means excessive aging at a rapid rate. This also
    gives Ball Breaker the ability to bypass a likely infinite quantity of dimensions with its acceleration.
    Note: Contrary to misinformed sources, Scan is not a Stand. Given that Gyro uses the same ability
    as Johnny (though it''s not as effective as chasing someone across parallel worlds), he should at
    least receive the same tier as what he got. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:JoJo''s Bizarre Adventure Category:Age Users Category:Air
    Users Category:Anime Characters Category:Biology Users Category:Body Puppetry Users Category:Damage
    Transferal Users Category:Doctors Category:Durability Negation Users Category:Earth Users Category:Elasticity
    Users Category:Empathic Manipulation Users Category:Energy Users Category:Enhanced Senses Users Category:Extrasensory
    Perception Users Category:Eye'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
