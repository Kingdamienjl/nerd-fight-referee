- id: claim-weaknesses-8dc222a3
  section: weaknesses
  axis: weakness
  text: "Wamuu will be turned to stone by overexposure to sunlight and is vulnerable to light-based attacks,\
    \ which circumvent his regeneration. His Wind Suit can only be used for ten seconds at a time, and\
    \ his Final Mode damages him when he uses it. Notable Attacks/Techniques: Pillar Man: Wamuu is one\
    \ of the four remaining Pillar Men, the ancient and extremely powerful beings who once ruled the Earth\
    \ and created vampires, for use as a food source. While humanoid in appearance, the Pillar Men have\
    \ incredibly unusual biologies, with the most obvious sign of their inhuman nature being their horns.\
    \ They can control their bodies with exceptional versatility, such as transforming their skeletal\
    \ structure for combat purposes and flattening themselves and their organs. Like the vampires he created,\
    \ Wamuu is an immortal being, but he is also weak to sunlight, which will turn him to stone, as well\
    \ as to the Hamon, which can be used to destroy his body completely. *Absorption: Each of a Pillar\
    \ Man's cells produces a highly caustic digestive acid that can quickly break down a victim on a cellular\
    \ level on contact, making even the slightest touch potentially fatal. Esidisi was able to utilize\
    \ this ability to replace an arm destroyed by the Hamon. This is not effective on Hamon users, however,\
    \ as Wamuu's cells instinctively avoid the danger this presents. *Biological Possession: Even if reduced\
    \ to merely a nervous system, a Pillar Man can invade the body of an opponent and take control of\
    \ them. *Regeneration: The Pillar Men have regenerative capabilities superior to the already exceptional\
    \ regeneration of vampires, which Straizo utilized to pull his body back together after he was blown\
    \ apart by grenades. Jojo b24.jpg|Divine Sandstorm Atmospheric rift by water frez-dawaf8c.png|Atmospheric\
    \ Rift Wind Suit.png|Wind Suit *Wind Mode: Wamuu's \"mode\" granted by the usage of the Stone Mask\
    \ to unlock his own heightened capabilities. This allows him to emit razor-sharp winds from his own\
    \ body and control them freely. **Fighting Technique: Divine Sandstorm: Wamuu spins his forearms around\
    \ from the elbow joints, the right arm moving to the left and the left arm moving to the right. This\
    \ spinning creates a violent windstorm that can easily shred through stone and flesh. **Final Mode:\
    \ Atmospheric Rift: Wamuu uses the makeshift tubes that are part of his body to gather and compress\
    \ huge amounts of air. He releases this air through a slit on his horn, sharpening it like a blade\
    \ before he whips it around with enough force to slice apart stone. However, this takes a toll on\
    \ Wamuu's body, tearing him apart. **Wind Suit: Wamuu covers himself in a whirlwind of steam released\
    \ from his lungs, which can reflect sunlight, making up for his weakness to light and even making\
    \ him invisible. He can only use it for about ten seconds, however. ==Notable Matchups== Victories:\
    \ Jonathan Joestar (JoJo\u2019s Bizarre Adventure) Jonathan\u2019s Profile (Post-Deep Pass Overdrive\
    \ Jonathan was used. Speed was equalized) Losses: Inconclusive: Jotaro Kujo (JoJo's Bizarre Adventure)\
    \ Jotaro's Profile (Speed was equalized) {{Discussions}} Category:Characters Category:JoJo's Bizarre\
    \ Adventure Category:Absorption Users Category:Acid Users Category:Air Users Category:Anime Characters\
    \ Category:Antagonists Category:Anti-villains Category:Body Control Users Category:Bone Users Category:Enhanced\
    \ Senses Users Category:Geniuses Category:Honorable Characters Category:Immortals Category:Invisibility\
    \ Users Category:Male Characters Category:Manga Characters Category:Possession Users Category:Primary\
    \ Antagonists Category:Regeneration Users Category:Vampires Category:Villains Category:Neutral Characters\
    \ Category:Biology Users Category:Self-Sustenance Users Category:Bone Users Category:Bodily Weaponry\
    \ Users Category:Elasticity Users Category:Mask Users Category:Misanthropes Category:Devourers Category:Orphans\
    \ Category:Survivors Category:Humanoid Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2300e7e7
  section: abilities
  axis: hax
  text: Genius Intelligence, Superhuman Physical Characteristics, Afterimage Creation (Shown here), Enhanced
    Senses, Biological Manipulation, Acid Manipulation (Wamuu's cells release a digestive acid that quickly
    dissolves victims on a cellular level on contact, allowing him to absorb other lifeforms), Air Manipulation
    (Wamuu can blow razor-sharp winds from his own body and control these winds in a variety of ways),
    Body Control (Like vampires, the Pillar Men can easily control their physiology; Santana, a weaker
    and less evolved Pillar Man, was capable of controlling his own skeletal structure and control even
    tiny pieces of his body separately), Elasticity (Pillar Men can stretch their bodies and contort them
    beyond recognition), Bone Manipulation (Capable of manipulating his skeletal structure and horn),
    Natural Weaponry (Has a drill horn), Invisibility (Wamuu can become invisible by covering himself
    in wind, which reflects light), Possession (Pillar Men are able to invade bodies and control them.
    When reduced to a nervous system, Esidisi was able to invade Suzi Q's body and control her), Immortality
    (Types 1, 2, 3 and 6; Pillar Man can survive after being reduced to just a nervous system by Hamon
    and still be able to possess other bodies while reduced to this state), Self-Sustenance (Type 1; Pillar
    Men should be capable of surviving without oxygen like Stone Mask Vampires. Can survive for millennia
    encased within stone and as just a brain), Regeneration (High-Mid; A Pillar Man's regeneration is
    superior to that of normal vampires, like Straizo, who regenerated from being blown apart by grenades
    and in order to cease the life functions of Santana, an inferior Pillar Man, the body must be shredded
    into 1cm squared pieces. Possibly Mid-High; Even the dust from their body is alive and can reassemble
    itself, though whether this is the true limit of their healing ability or something that can only
    be done if sufficient body mass is already present is unknown), Pain Resistance (Can endure damage
    and injury which would normally cause tremendous pain with little, if any, issue)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
