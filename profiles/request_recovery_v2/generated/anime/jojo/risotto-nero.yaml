- id: claim-weaknesses-6eb3db2b
  section: weaknesses
  axis: weakness
  text: "Any damage taken by Metallica will be reflected onto Risotto. Because of Metallica, he naturally\
    \ attracts metals, offsetting his camouflage. He seemingly needs to take damage to take control of\
    \ other Stands using Metallica Notable Attacks/Techniques: Metallica: Risotto's Stand, a colony of\
    \ small metallic beings that reside within his bloodstream. *Iron Manipulation: Through magnetism,\
    \ Metallica can control iron within a 5 to 10 meter circle around Risotto. He can draw iron from any\
    \ source within this range, such as the earth or an opponent's blood, transforming it into a variety\
    \ of weapons or other iron objects. **Active Camouflage: By coating himself in fine iron particles,\
    \ Risotto can render himself effectively invisible, as these particles reflect light. **Blood Manipulation:\
    \ Risotto's go-to source of iron is the blood of his own opponents, which he can transform into various\
    \ weapons, which burst from their skin, causing severe internal damage. While this can quickly kill\
    \ an opponent, it also diminishes the iron in their blood, preventing it from properly circulating\
    \ oxygen, so even if a opponent survives his initial onslaught, they may suffocate not long after.\
    \ Risotto can also use this ability on his blood, controlling his own severed body parts and reattaching\
    \ them by making staples out of his own blood. ***For reference, the amount of iron a normal adult\
    \ men would have is 8 milligrams, and an adult women 18 milligrams, which would realistically made\
    \ an object much smaller than any singular one Risotto has ever made. *Stand Invasion: If necessary,\
    \ Metallica can leave Risotto's body to invade another Stand, embedding itself into the Stand and\
    \ granting Risotto control over that Stand. However, he only used this ability as a last resort, after\
    \ being lethally injured, implying that he must be injured in order for Metallica to leave his body,\
    \ or that he only uses it when desperate. ==Gallery== {{Scroll box|content= Mt6.jpg Mt4.jpg Mt5.jpg\
    \ Golden Wind OST Vol.3 - Risotto Nero Theme }} ==Notable Matchups== Victories: Yoshikage Kira (JoJo's\
    \ Bizarre Adventure) Kira\u2019s Profile (Pre-Kosaku Yoshikage Kira key was used) Skarlet (Mortal\
    \ Kombat) Skarlet's Profile (Speed was equalized and the fight took place in a Roman Colliseum) Dio\
    \ Brando (JoJo's Bizarre Adventure) Dio's Profile (Part 1 Dio was used) Losses: Inconclusive: ==References==\
    \ {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:JoJo's Bizarre\
    \ Adventure Category:Adults Category:Air Users Category:Anime Characters Category:Antagonists Category:Anti-villains\
    \ Category:Assassins Category:Blood Users Category:Body Control Users Category:Body Puppetry Users\
    \ Category:Earth Users Category:Humans Category:Invisibility Users Category:Knife Users Category:Leaders\
    \ Category:Light Users Category:Magnetism Users Category:Male Characters Category:Manga Characters\
    \ Category:Metal Users Category:Incorporeal Characters Category:Non-Physical Interaction Users Category:Soul\
    \ Users Category:Stand Users Category:La Squadra Esecuzioni Category:Extrasensory Perception Users\
    \ Category:Summoners Category:Aura Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-33ba4ffe
  section: abilities
  axis: hax
  text: Extrasensory Perception (Capable of seeing ghosts and souls among some other supernatural forces
    that are normally otherwise invisible), Aura, and Summoning (Of his Stand). Metallica has Magnetism
    Manipulation (Specifically affects iron, but can draw it from any source, such as blood and the earth,
    transforming it into weapons; using his opponent's blood stops them from properly circulating oxygen),
    Body Control (Risotto can control his own severed limbs and reattach them using Metallica), Body Puppetry
    (By embedding itself in other Stands, Metallica can control Stands), Invisibility (By coating himself
    in light-reflecting iron particles, Risotto can blend into his surroundings; Metallica itself can
    only be seen by other Stand users), Limited Danmaku (Can send several knives to attack with Metallica),
    Incorporeality (Stands are the incorporeal manifestations of one's vital energy, and can only be harmed
    by other Stands), Non-Physical Interaction (Stands can interact with ghosts and other Stands), Selective
    Intangibility, Aura
  source_ids: *id003
  decisive: true
