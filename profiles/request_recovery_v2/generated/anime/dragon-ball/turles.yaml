    physiology of a Saiyan, an aggressive warrior race of conquerors. Saiyans have the natural ability
    to control ki and to fly. In addition, while his lifespan is comparable to that of a human, Turles
    will remain at his peak strength for much longer. One of the most powerful abilities of a Saiyan is
    their ability to grow stronger and stronger through combat, allowing Turles to constantly push his
    own limits during a fight and rise to higher and higher peaks in power. This ability grants a substantial
    boost in power when Turles is badly injured, allowing him to reach a whole new level of power once
    he recovers. *Great Ape: When exposed to the light of the full moon, as long as he still has his tail,
