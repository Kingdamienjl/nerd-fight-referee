- id: claim-powers-and-abilities-b0055357
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Janemba={{Border|Scroll=Yes|Visible=No|Content=
    *Superhuman Physical Characteristics **Transformation (Can transform into Super Janemba) **Enhanced
    Senses (Awareness) **Large Size (Type 0) **Self-Sustenance (Type 2; As an amalgamation of souls, Janemba
    doesn''t need to eat) * Abstract Existence (Type 2 [Ideas, Intents, Thoughts]; Is stated to be the
    crystallization of Evil Intent and the embodiment of Evil Ideas that is a part of the entire Afterlife.
    Is also stated to be a being made from evil ideas released from the Soul Cleansing Machine) *Immortality
    & Regeneration (Types 1, 3. 8 & Low-Godly; Janemba is incapable of aging, due to being an amalgamation
    of souls. He can regenerate and mutate his body, and should be able to restore himself to the same
    extent dead beings can, due to being an amalgamation of souls, and be restored as long as evil exists
    in the world. It is stated that the Afterlife is a part of him after filling it with his Evil, and
    Gogeta had to purify Janemba of all his evil in order to kill him) *Ki Manipulation (Master Level)
    **Extrasensory Perception (Can locate others by reading their ki, sensed Goku''s strength) **Flight
    **Aura **Danmaku (Created several energy attacks to launch at Goku) *Martial Arts (Could surprise
    and push around Goku with his attacks. After transforming, he overwhelmed Goku in direct combat, forcing
    him to flee. He later went on to casually stomp Vegeta and toy with Pikkon. Janemba likely has the
    combined combat expertise of every evil soul collected in the Soul Cleansing Machine) *Precognition
    (Analytical Prediction; Janemba can predict your moves) *Possession (Possessed the Saike Demon, turning
    the latter''s body into his own) *Ice Manipulation (Can generate ice and freeze souls) *Duplication
    & Power Mimicry (Of himself or the opponent along with his technique) *Sealing (Sealed King Yemma
    and the Check-In Station away on his magical barrier) *Absorption (Energy; His magical crystals and
    barriers passively absorb the energy of an attack) *Reactive Evolution (Janemba evolved into a 2nd
    more powerful form, due to his battle experience and grudge towards Goku) *Fusionism (Janemba''s evil
    filled the entire Afterlife, which was stated to be already part of him, meaning Janemba''s evil takes
    control of the universe he is born in) *Crystal Manipulation (Janemba can crystallize the afterlife
    and can control gems with telekinesis) *Reality Warping & Law Manipulation (His birth and magic were
    messing with and reversing the laws of reality governing the Other World and the Universe, leading
    to the dead rising from their graves and other supernatural and physical phenomena outside of the
    norm) **Power Nullification (Passively stripped King Yemma off of his powers to judge and manipulate
    the souls venturing into the Other World) **Spatial Manipulation & Portal Creation (He can warp space
    to create portals that punch enemies from afar) Resistance to: *Soul Manipulation (He is the amalgamation
    of the countless evil souls that resisted the Soul Cleansing Machine) *Reality Warping & Power Nullification
    (Shenron has stated that he wouldn''t be able to reverse the effects caused by Janemba''s evil energy,
    such as the dead coming back to life. Should be able to resist the effects of his own evil energy)
    }} |-|Super Janemba=All previous abilities except Large Size, plus: *Acrobatics (Hypermobility) *Breath
    Attack *Elasticity (Can stretch his limbs up to hundreds of meters) *Weapon Mastery (Was using sword
    incredibly well against Goku. Was likely amalgamated with the souls of those that were skilled with
    a sword) **Weapon Control (Turned a small club into the Dimension Sword) *Bodily Weaponry (Conventional;
    Used his tail to attack Goku) *Teleportation & Body Control (Can make his body turn into small particles
    and then rebuild it in a different place) *Matter Manipulation & Transmutation (Reconstructed a stone
    spike into a growing in length spear-like object) *Spatial Manipulation & Durability Negation (Can
    slice through space with his Dimension Sword cutting right through foes as well as any objects, even
    those capable of absorbing and dispersing energy such as the magic crystals created by himself) Resistance
    to: *Fire Manipulation (Smiled off a fiery explosion) }}'
