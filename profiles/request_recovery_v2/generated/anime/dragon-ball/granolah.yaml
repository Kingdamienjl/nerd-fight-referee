- id: claim-standard-equipment-d0a30c2f
  section: equipment
  axis: equipment
  text: '*Goggles: A lens that Granolah wears on his right eye, enhancing his sniping abilities. They
    also allow him to stay in contact with his assistant Oatmeal, who can aid him in battle. *Stun Gun:
    A non-lethal weapon used to paralyze the opponents. The efficacy of this weapon is enhanced by Granolah''s
    skill in sniping. GranoStun.jpg GranoStun2.jpg *Scarf: A long piece of fabric with no special properties.
    However, Granolah is able to use it for a variety of purposes, such as cover his face during stealth
    maneuvers or even turn it into a weapon, binding the hands of the opponent and slamming them onto
    the ground. GranoScarf2.jpeg GranoScarf3.jpeg'
