- id: claim-weaknesses-12d54fab
  section: weaknesses
  axis: weakness
  text: 'Obsessed with revenge towards the Saiyan race and Frieza, which causes him to make hasty decisions
    and lose his cool when hearing their names | Same as before, his lifespan is reduced to only three
    more years. Due to the lack of training after wishing to become the strongest warrior in the universe,
    Granolah isn''t used to his new power yet and is inexperienced in battle, as pointed out by Vegeta.
    The more clones he makes, the more power he splits from himself and any damage the clones take, his
    real self takes the damage as well. Notable Attacks/Techniques: *Finger Beam: Granolah fires a beam
    from the tips of his middle and index fingers. He can use this technique with great precision and
    hit many targets in quick succession and even from afar. *Planet Life-Energy Manipulation: After wishing
    to become the greatest warrior in the Universe, Granolah gained an ability similar to Moro''s magic
    **Fire and Flames: Granolah is able to manipulate the life energy of the planet he is on for offensive
    and defense usage, such usage appears as a flaming pillar. He is possibly capable of doing this until
    the planet he is utilizing runs out of energy similar to Moro. *Cloning: After wishing to become the
    greatest warrior in the Universe, Granolah gains the ability to make clones of himself, as it is revealed
    after his fight with Goku that the latter fought his clone the whole time. *Full Power: Pushed to
    his limit and in a life or death situation, Granolah finally succeeds in drawing out the greatest
    power in the universe, unlocking the power to transform his left eye into an evolved red eye, improving
    his abilities even further than before. This state is not a permanent change however, and Granolah
    will drop out of it eventually, though it can be taken on at will once attained. GranoBeam.jpg GranoBeam2.jpg
    ==Notable Matchups== Victories: Losses: *Vegeta (DBS Manga) Vegeta''s Profile (Post-Wish Granolah
    and Granolah Arc Vegeta were used. Fight took place on a random planet and both started in their strongest
    forms) Inconclusive: *Moro (Dragon Ball) Moro''s Profile (Post-Wish Granolah and Moro With Merus''
    Power were used. Fight took place on an indestructible planet. Moro could fuse with the Earth) ==References==
