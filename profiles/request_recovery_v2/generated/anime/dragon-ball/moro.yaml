- id: claim-weaknesses-28b5d9db
  section: weaknesses
  axis: weakness
  text: 'Moro must continue to absorb the life force from planets in order to stay alive, and should his
    energy gets forcibly taken he will revert to his old age | Same | Needs to make physical contact with
    his targets to steal their abilities, his regeneration is stamina based and he cannot regenerate if
    his brain is destroyed and after having his three orbs broken and sealed by Merus, he''s unable to
    steal any further abilities | Moro''s body can''t contain the power of an Angel due to a lack of proper
    training, so he needed to turn the Earth into his body in order to keep the upper hand in his fight
    with Goku | Despite fusing with Earth, the power of an Angel is still too much for him to contain,
    and will drive him insane and eventually explode, wiping out the entire galaxy Notable Attacks & Techniques:
    Ki Manipulation: Moro can manipulate his own ki for offensive, defensive and supplementary purposes.
    *Flight: Moro can manipulate his ki to allow him to fly and levitate at will. *Mouth Energy Wave:
    Moro can unleash a blast of ki energy from his mouth, which can be done to take an opponent by surprise.
    *Ki Signature Hiding: Moro can hide his own ki signature, preventing opponents from locating him through
    sensing energy. Magic: Moro is an experienced and knowledgeable wizard with a variety of magical abilities.
    *Planet Life-Energy Manipulation: Moro can manipulate the energy of the planet he stands on to create
    flaming walls, waves of magma and blasts of electricity. Since the energy doesn''t come from Moro
    himself, he can freely use the planet''s energy to attack until the planet is drained of energy with
    no effect on Moro''s own reserves of energy. *Clone Illusion: Unlike regular afterimages, this clones
    are Illusions that have a Ki signature, are able to move freely and attack, but only from distance,
    as they disapear upon being hit. *Barrier: After regaining his full magic power, Moro can create a
    barrier around his body capable of blocking the Grand Supreme Kai''s punch. *Memory Reading: After
    regaining his full magic power, Moro can examine and review memories of his opponents in order to
    gain an advantage by looking into their past. *Fusionism: Moro can use his magic to even fuse with
    an entire planet Absorption: Moro encases his target in energy and forcefully eats them, absorbing
    them and allowing Moro to use their power and abilities. ==Gallery== 46 by 876216505-dcyi6q3.jpg|Moro
    after absorbing energy from Goku and Vegeta. 47 by 876216505-dcyi6q3.png|Moro after having his youth
    restored. EarthMoro.png|Moro after fusing with the Earth ==Notable Matchups== Victories: Jiren (DBS
    Manga) (Dragon Ball) Jiren''s Profile (Original Power Moro was used) Super 17 (Dragon Ball) Super
    17''s Profile (Base Super 17 and Weakened Moro were used, and speed was equalized) Losses: Inconclusive:
    Fusion Zamasu (DBS Manga) (Dragon Ball) Zamasu''s Profile (Original Power Moro was used. Starting
    distance was 10 meters) Granolah (Dragon Ball) Granolah''s Profile (Moro With Merus'' Power and Post-Wish
    Granolah were used. Fight took place on an indestructible planet. Moro could fuse with the Earth)
    ==References== {{Scroll box|content={{Reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}}
    {{Scroll box|content=Note: It should be recognized that Ultra Instinct, also known as ''Angel Power'',
    is extremely powerful and hard to control thanks to its Accelerated Development properties; which
    also means characters capable of Power Mimicry could face consequences copying this Power/Technique.
    If the character in question is capable of copying this power, they will ultimately be defeated and
    destroyed by this very same power if said character hasn''t honed their body to withstand Ultra Instinct''s
