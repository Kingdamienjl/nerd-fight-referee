    (Can form invisible barriers) *Resurrection (Resurrected Nuova Shenron with his negative energy) *Immortality
    (Types 1 & 3) *Regeneration (Low-High; Regenerated from chunks of slime after being blown apart by
    Goku''s Dragon Fist and can reform from the Dragon Balls when he fires them into someone''s body)
    *Attack Reflection *Body Control & Shapeshifting *Illusion Creation & Afterimage Creation *Air Manipulation
    *Energy Manipulation (He can control Negative Energy) **Deconstruction, Corrosion Inducement & Corruption
    (Type 2; Negative Energy can passively lay waste to the entire universe, decaying anything in its
    vicinity. Alongside creating calamity and natural disasters, it can corrode the world itself) **Chaos
    Manipulation & Reality Warping (Negative Energy can passively distort the surroundings, cause chaos,
