- id: claim-weaknesses-4ef9520c
  section: weaknesses
  axis: weakness
  text: 'Super 17 is vulnerable to physical attacks while he is absorbing energy Notable Attacks/Techniques:
    Android / Machine Mutant Physiology: Super 17 is a fusion of Android 17 and Hell Fighter 17, and is
    therefore a hybrid of the two, an extremely powerful cybernetic android (or "Artificial Human") instilled
    with an infinite amount of energy and immense power. * Android Barrier: The Red Ribbon Android version
    of the regular energy shield, an energy-based forcefield used to block attacks. Super 17 has his own
    spin on the technique, the Absorption Barrier, which he uses to absorb energy attacks utilized by
    his opponent, converting them into his own power and greatly booting his strength. However, this leaves
    him vulnerable to physical attacks while he is absorbing energy. * Electro Eclipse Bomb: Super 17''s
    most powerful attack, performed by extending both of his arms and creating a grey energy sphere with
    a black center, which he then fires at his target, causing a massive explosion on impact. * Flash
    Bomber: Super 17 extends both of his arms and fires several hundred energy blasts at his target. *
    Hell''s Storm: Super 17 removes one of his forearms to reveal a machinegun that fires a barrage of
    high-power bullets at high speeds. * Ultra Sensitivity: Super 17 has highly honed senses that allow
    him to instantly detect even the slightest changes in his surroundings, taking note of any differences
    in the air, sound, and vibrations. Thanks to this, he can locate even the stealthiest opponents. ==Notable
    Matchups== Victories: Losses: Moro (Dragon Ball) Moro''s Profile (Base Super 17 and Weakened Moro
    were used, and speed was equalized) Inconclusive: {{discussions}} Category:Characters Category:Dragon
    Ball GT Category:Dragon Ball Category:Absorption Users Category:Acrobats Category:Androids Category:Anime
    Characters Category:Antagonists Category:Aura Users Category:Chi Users Category:Cyborgs Category:Danmaku
    Users Category:Dimensional Travel Users Category:Energy Users Category:Enhanced Senses Users Category:Evil
    Characters Category:Flight Users Category:Forcefield Users Category:Fusions Category:Homing Attack
    Users Category:Male Characters Category:Martial Artists Category:Non-Canon Characters Category:Portal
    Users Category:Primary Antagonists Category:Self-Sustenance Users Category:Telekinesis Users Category:Telepaths
    Category:Vibration Users Category:Villains Category:Dragon Ball (Toei) Category:Red Ribbon Army'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e92c8c20
  section: abilities
  axis: hax
  text: Longevity, Skilled Martial Artist, Superhuman Physical Characteristics, Self-Sustenance (Types
    2 & 3), Acrobatics, Afterimage Creation, Forcefield Creation, Telekinesis, Telepathy, Enhanced Senses
    (His senses are so great that he automatically detects even the slightest changes in the air, notifying
