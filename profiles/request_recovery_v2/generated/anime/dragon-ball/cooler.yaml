      Final Form, even higher with Supernova'
    source_ids: &id002
    - mediawiki-2464
    confidence: 0.95
  attack_potency:
    text: Galaxy level (Superior to 100% Frieza. Far stronger than his Armored Squad, who were confident
      they could kill post-Namek Saga Goku despite knowing he possesses enough power to kill Frieza, although
      this is likely just overconfidence, however, they could fight with base Goku, and deflect and block
      his attacks. Cooler himself could harm base Goku and knock away his energy attack without difficulty,
      and later one-shot post Namek Saga Piccolo with a single attack. Even after Goku was healed by a
      Senzu Bean from his injuries that left him unable to move, Cooler could stop his punches>10.8076
      ZettaFoe), far higher in his Final Form (After transforming, he began beating base Goku with ease
      then casually stomped a Kaioken x20 Goku>216.152 ZettaFoe), even higher with Supernova (His Supernova
      nearly overpowered Super Saiyan Goku, who before that had been dominating Fifth Form Cooler and
      was unfazed by his previous attacks) | Galaxy level (His core was able to overpower and throttle
      a weakened Super Saiyan Goku), higher for Meta-Cooler (Traded blows with Android Saga base Goku
      without issue and easily beat him while he was using Kaioken x20, and later contended with Super
      Saiyan Goku although was eventually overwhelmed at first), far higher with Reactive Evolution (After
      being repaired and becoming stronger thanks to the Big Gete Star, he overwhelmed Super Saiyan Goku
      and would have crushed his throat had Vegeta not stepped in. He then proceeded to overpower Android
      Saga Super Saiyan Vegeta and Super Saiyan Goku without much trouble and later effortlessly overpower
      Android Saga Piccolo) even higher with Supernova (His Supernova should be the same as it was previously,
      it's power was shown to be greater than his standard attack) | High Universe level (Managed to somewhat
      compete with Cell Saga Full Power Super Saiyan Goku, who is capable of fighting and harming Restrained
      Super Saiyan Broly in his base form), far higher in his Final Form (Stronger than his previous form),
      even higher with Supernova (His Supernova should be the same as it was previously, it's power was
      shown to be greater than his standard attack)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL+ (Could keep up with post-Namek Saga base Goku and dodge his attacks), far higher
      in his Final Form (Blitzed Kaioken x20 Goku, and is superior to 100% Frieza, who is faster than
      Goku's spaceship) | Massively FTL+ (Tagged a weakened Super Saiyan Goku, and the Big Gete Star can
      travel vast distances through space over an unknown timeframe), Massively FTL+ for Meta-Cooler (Easily
