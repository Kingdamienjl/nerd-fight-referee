    confidence: 0.95
  attack_potency:
    text: "At least Multi-Continent level (As an Elite Sternritter, Pernida's power is considered immeasurableBleach,\
      \ TYBW Episode 24: \"Too Early to Win, Too Late to Know\" and Liltotto believes Pernida to be unrivaledBleach\
      \ CFYOW Chapter 3, which would imply she views herself as inferior19.4724 Petatons), higher with\
      \ Blut Arterie (Blut provides a Bankai level increaseBleach, TYBW Episode 7: \"Born in the Dark\"\
      , which is 10x for users of Vollst\xE4ndig and Sklaverei, as they are far more talented in Quincy\
      \ abilities and Blut Arterie amplifies attack powerBleach, TYBW Episode 4: \"Kill the Shadow\"194.7239\
      \ Petatons), at least Multi-Continent level with Vollst\xE4ndig (Stronger than Vollst\xE4ndig Liltotto),\
      \ higher with Vollst\xE4ndig and Blut Arterie (Blut Arterie is a Bankai level offensive increase1.9472\
      \ Exatons), at least Multi-Continent level with Sklaverei (Pernida can use Sklaverei to further\
      \ amplify its powersBleach, TYBW Episode 21: \"The Headless Star\", and since Vollst\xE4ndig is\
      \ superior to Letzt StilBleach, TYBW Episode 3: \"March of the StarCross\", it's ability to amplify\
      \ one's power via Reishi subjugation would be superior to Letz Stile which can amplify one's power\
      \ 3xBleach, Chapter 125: \"Insanity & Genius\"584.1718 Petatons), higher with Sklaverei and Blut\
      \ Arterie (10x more powerful5.8417 Exatons) | At least Multi-Continent level (Ausw\xE4hlen powered\
      \ him upBleach, TYBW Episode 25: \"The Master\"), higher with Blut Arterie (Stronger than before),\
      \ at least Multi-Continent level with Vollst\xE4ndig (Stronger than before), higher with Vollst\xE4\
      ndig and Blut Arterie (Stronger than before), at least Multi-Continent level with Sklaverei (Stronger\
      \ than before), higher with Sklaverei and Blut Arterie (Stronger than before), Varies, likely up\
      \ to Multi-Continent level+, possibly Multi-Solar System level with The Compulsorary (Pernida is\
      \ able to increase its power through evolution by analyzing data from people his nerves touch, and\
