- id: claim-standard-equipment-8afc087d
  section: equipment
  axis: equipment
  text: "His Sword; the Hoffnung, Shield, Cape *{{Nihongo|Medallion|\u30E1\u30C0\u30EA\u30AA\u30F3|Medarion}}:\
    \ A device possessed by select members of the Wandenreich military, including all Sternritter which\
    \ allows one to steal a Shinigami's Bankai or any power that is fundamentally similar to a Shinigami's\
    \ Bankai. *{{Nihongo|Hoffnung|{{Ruby|\u5E0C\u671B\u306E\u5263|\u30DB\u30FC\u30D5\u30CC\u30F3\u30B0\
    }}|H\u014Dfunungu}}: Gerard's favored weapon manifests in the form of a black, double-edged sword\
    \ with a black hilt. Its guard is V-shaped and has a star in the center. Gerard commonly stores it\
    \ in his shield when he is not using it. It is powerful enough to easily shatter Senjumaru Shutara's\
    \ needle and dent Kirio Hikifune's Cage of Life, and is durable enough to withstand a direct clash\
    \ with Kenpachi Zaraki's Nozarashi while only sustaining a small nick in the blade. **Damage Reflection:\
    \ According to Gerard, thanks to his The Miracle, Hoffnung is the \"hopes of people bundled together\"\
    . Damaging \"hope\" causes \"despair\" and so, if Hoffnung is damaged in any way, the combatant who\
    \ damaged it will suffer injuries in return. For example, a small nick in the blade will result in\
    \ a disproportionately large cut in the opponent's body. However, T\u014Dshir\u014D Hitsugaya manages\
    \ to disable this effect by freezing Hoffnung completely solid, ceasing its functions."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
