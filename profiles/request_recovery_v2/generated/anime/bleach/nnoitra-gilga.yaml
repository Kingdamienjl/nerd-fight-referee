- id: claim-powers-and-abilities-8aceed52
  section: abilities
  axis: hax
  text: "*Soul Physiology & Hollow Physiology (Soul: High-Tier/Hollow: High-Tier Arrancar) **Master Swordsman\
    \ (As the Quinto Espada, Nnoitora is an extremely skilled and experienced swordsman, its directly\
    \ stated that Nnoitora is the best swordsman within the EspadaBleach: Official Character Book 3 UNMASKED,\
    \ putting him above other master swordsman like Ulquiorra Cifer and Coyote Starrk, with this level\
    \ of experienced and skill Nnoitora can easily rely only on his skill to fight against opponents who\
    \ are equal towards him in physical strength like in his fight against Kenpachi Zaraki, another master\
    \ swordsman and one of the best swordsman within the entirety of Soul Society) **Breath Attack (Nnoitora\
    \ can shoot out Ceros from his tongueBleach: Chapter 308) *Santa Teresa: **Regeneration (Limited Low-Mid\
    \ while in Resurrecci\xF3n - Nnoitora can regenerate his lost arms from their stumpsBleach: Chapter\
    \ 310, this only extends to his arms) **Weapon Creation & Additional Limbs (Santa Teresa completely\
    \ transforms his physical appearance while greatly increasing his physical stats, while in this transformation\
    \ Nnoitora gains a total of six arms, with two of those arms hiding directly inside Nnoitora, which\
    \ can be brought out any moment, usually doing this when he's holding an opponent or stuck in a physical\
    \ clash with them to deal normally fatal damage through piecing them with these hands when they least\
    \ expect it, Nnoitora also has the helpful ability to can create scythes from his wrist, allowing\
    \ him to have a nigh-infinite supply of weaponsBleach: Chapter 311) *Indice Radar: **Information Analysis\
    \ (Nnoitora can measure the power-level of his opponent through placing his finger onto the ground\
    \ and having a beam of Reiryoku to travel to his opponentBleach: Chapter 298) Resistance to: *Extrasensory\
    \ Perception ( 2 Layers; Using Son\xEDdo allows the user to bypass Extrasensory PerceptionCan't Fear\
    \ Your Own World: Vol 1: Chapter 9 of even captain level opponents) *High Temperatures (Resisted the\
    \ heat created by Nelliel's Cero DobleBleach: Chapter 292)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
