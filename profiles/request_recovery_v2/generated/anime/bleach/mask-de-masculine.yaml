- id: claim-weaknesses-84ecfd69
  section: weaknesses
  axis: weakness
  text: "Blut Vene and Blut Arterie use two different reishi systems, so they cannot be used at the same\
    \ time. When using medallion, its user needs to be suficiente powerful to wield it and the power stolen\
    \ by medallion is weaker than the original unless the Quincy in question takes the time and effort\
    \ to master it. Quincy are unable to activate their Vollst\xE4ndig after they stole power with medallion.\
    \ Notable Attacks/Techniques: The Superstar: S - The Superstar is Mask De Masculine's Schrift. It\
    \ allows him to gain might from the cheers of a crowd, and alongside his partner James, he has an\
    \ undying source of unending cheers that will continually empower him. Mask's physicals are amped,\
    \ healing is boosted, and it enables him to achieve his most powerful form after hearing enough cheering.\
    \ In addition to this, Mask and his partner James are one and so long as Mask is alive, James will\
    \ eventually be reborn. * Star Flash: Putting his index and middle fingers to the points of the star\
    \ on his mask, which fires a star shaped beam a moment later. * Star Satsujin Punch: When Mask is\
    \ enraged, a star mark manifests on the back of his fist. While he has this mark, his punches become\
    \ ten times more powerful than usual, releasing star-shaped bursts of energy on impact. Mask refers\
    \ to it as the \"hammer of justice\". * Star Lariat: Upon transforming due to James' empowering cheers,\
    \ Mask can use this technique, which he claims can punch an opponent one mile away, which he can use\
    \ in rapid succession to overwhelm his opponents. File:Star Flash Anime.gif|Star Flash File:Star Satsujin\
    \ Punch Anime.gif|Star Satsujin Punch File:Star Lariat Anime.gif|Star Lariat Star Eagle Kick: Mask\
    \ delivers a devastating knee kick to his opponent. Star Headbutt: Grabbing his opponent's head, Mask\
    \ rams his forehead into theirs. Star Rocket Headbutt: Mask propels himself towards his opponent and\
    \ rams into them headfirst. The impact carries enough force to create a massive explosion. Star Dropkick:\
    \ Mask dropkicks his opponent with enough force to knock them through several buildings. File:Star\
    \ Eagle Kick Anime.gif|Star Eagle Kick File:Star Headbutt Anime.gif|Star Headbutt File:Star Rocket\
    \ Headbutt.png|Star Rocket Headbutt File:Star Drop Kick Anime.gif|Star Dropkick Hirenkyaku: Essentially\
    \ the Quincy version of the Shinigami Shunpo and Arrancar Sonido. The Quincy creates platforms of\
    \ Reishi under their feet to swiftly move around the battlefield. Blut: An advanced Quincy technique\
    \ which grants one inhuman defensive and offensive capabilities, however it can't boost both offensive\
    \ and defensive simultaneously. * Blut Vene: The defensive form of Blut, which grants the user a boost\
    \ in defense by strengthening their skin in a similar fashion to an Arrancar's Hierro. Additionally,\
    \ Blut Vene can be used to stop blood loss due to injury. * Blut Arterie: The offensive form of Blut\
    \ which grants the user inhuman attack power. This technique is the only thing capable of ensuring\
    \ a Quincy's attacks can significantly damage a Bankai-wielding Shinigami. Sklaveri: Vollst\xE4ndig's\
    \ basic Reishi Absorption ability pushed to the absolute limit. This allows the user to absorb the\
    \ Reishi that composes spiritual and living beings, an absolute subordination of Reishi. Destroying\
    \ the Stern Ritter's Halo is the only way to stop it. Rans\u014Dtengai: An advanced Quincy technique\
    \ created for injured/old Quincy in order to control their limbs with strings of Reishi like a puppet.\
    \ Broken bones and severed tendons mean nothing to this as the strings will control the limbs until\
    \ the body/limb is entirely destroyed. Shadow: A teleportation ability used by members of the Wandenreich,\
    \ this technique can be used by manifesting the user's shadows in front of them, creating a portal\
    \ that acts as a gate between the Schatten Bereich and other dimensions. The size of these portals\
    \ can be extended to allow many others to pass through. Medallion: A device possessed by select members\
    \ of the Wandenreich military, including all Sternritter which allows one to steal a Shinigami's Bankai\
    \ or any power that is fundamentally similar to a Shinigami's Bankai. Vollst\xE4ndig: The Wandenreich's\
    \ improvement on the Letzt Stile, with all the advancements and none of the drawbacks. It allows the\
    \ user to absorb Reishi from their environment at a rate beyond their limits. This can be used for\
    \ more powerful attacks, wings for faster flight, enhancing the effects of Schrift (including access\
    \ to Schrift abilities) and a near endless supply of fuel for abilities like Blut, Hirenkyaku and\
    \ Heilig Pfeil. In this state, Mask can be able to fly. Star Flash: Super Nova: Mask flies high into\
    \ the sky and traces out a giant pentagram shape using the Reishi trail from his wings. Mask then\
    \ flies above the pentagram and calls out the name of the attack, after which a massive star-shaped\
    \ blast of energy crashes into the ground, creating an immense explosion upon impact. File:Star Flash\
    \ Super Nova Anime.gif|Star Flash: Super Nova ==Notable Matchu"
