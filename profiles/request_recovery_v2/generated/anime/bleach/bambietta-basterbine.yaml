power_scale:
  tier:
    text: "{{High 6-A}}, {{5-C}} with Blut Arterie and Kokuj\u014D Tengen My\u014D'\u014D, at least {{5-C}}\
      \ with Vollst\xE4ndig, higher with Vollst\xE4ndig and Blut Arterie, at least {{5-C}} with Sklaverei,\
      \ {{Low 5-B}} with Sklaverei and Blut Arterie | {{6-B}}, higher with Vollst\xE4ndig, {{High 6-B}}\
      \ with Sklaverei"
    source_ids: &id002
    - mediawiki-34479
    confidence: 0.95
  attack_potency:
    text: "Alive=Multi-Continent level (Bambi clashes with KomamuraBleach TYBW Episode 4, and had overwhelmed\
      \ him prior to Komamura being revitalized by Yamamoto's Spiritual PressureBleach TYBW Episode 43.8945\
      \ Exatons), Moon level with Blut Arterie and Kokuj\u014D Tengen My\u014D'\u014D (Blut provides a\
      \ Bankai level increaseBleach TYBW Episode 7, which is 10x for users of Vollst\xE4ndig and Sklaverei,\
      \ as they are far more talented in Quincy abilities and Blut Arterie amplifies attack power. Yhwach\
      \ states that comparable power is required to steal BankaiBleach TYBW Episode 6, which is consistent\
      \ with the Sternritter being opponents that cannot be combatted without BankaiBleach TYBW Episode\
      \ 4, so Bambi should scale to Sajin's Bankai with at least her own Bankai level amplification in\
      \ Blut ArterieBleach TYBW Episode 438.9448 Exatons), at least Moon level with Vollst\xE4ndig (Vollst\xE4\
      ndig operate using the same mechanism for Quincy as the stolen BankaiBleach TYBW Episode 16, and\
      \ Yhwach implies that the Sternritter are more lethal with their Vollst\xE4ndig than the Bankai\
      \ they stoleBleach TYBW Episode 16. Giselle believes Bambi is extraordinarily powerful with her\
      \ Vollst\xE4ndigBleach TYBW Episode 17, her bombs one shot Shinji and blow holes in Kokuj\u014D\
      \ Tengen My\u014D'\u014D Dangai J\u014DeBleach TYBW Episode 1738.9448 Exatons), Moon level+ with\
      \ Vollst\xE4ndig and Blut Arterie (Blut Arterie is a 10x increase, and is primarily defeated by\
      \ her own explosionsBleach TYBW Episode 17389.4479 Exatons), at least Moon level with Sklaverei\
      \ (All Sternritter can use Sklaverei to enhance their Vollst\xE4ndig, and since Vollst\xE4ndig is\
      \ superior to Letzt StilBleach TYBW Episode 3, it's ability to amplify one's power via reishi subjugation\
      \ would be superior to Letzt Stil which can amplify one's power 3xBleach Chapter 125116.8344 Exatons),\
      \ Small Planet level with Sklaverei and Blut Arterie (10x more powerful1.1683 Zettatons), The Explode\
      \ can ignore conventional durability (Bambi explains her reishi can turn her opponents into bombsBleach\
      \ TYBW Episode 17, which Yumichika confirmsBleach TYBW Episode 22) |-|Zombie=Country level (Bambi\
      \ was turned into a zombie after having already diedBleach TYBW Episode 22, making her less capable\
      \ than when she was aliveBleach TYBW Episode 23, but she's still strong enough to blow away Yumichika\
      \ and IkkakuBleach TYBW Episode 2238.9448 Teratons), higher with Vollst\xE4ndig, Large Country level\
      \ with Sklaverei (All Sternritter can use Sklaverei to enhance their Vollst\xE4ndig, and since Vollst\xE4\
      ndig is superior to Letzt StilBleach TYBW Episode 3, it's ability to amplify one's power via reishi\
      \ subjugation would be superior to Letzt Stil which can amplify one's power 3xBleach Chapter 125116.8344\
      \ Teratons), The Explode can ignore conventional durability"
    source_ids: *id002
    confidence: 0.95
