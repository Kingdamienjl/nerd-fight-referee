- id: claim-weaknesses-574de8fc
  section: weaknesses
  axis: weakness
  text: "Blut Vene and Blut Arterie use two different reishi systems, so they cannot be used at the same\
    \ time. Nianzol cannot counter any attacks that are swift enough to escape his notice. When using\
    \ medallion, its user need to be suficiente powerful to wield it and the power stolen by medallion\
    \ is weaker than the original unless the Quincy in question takes the time and effort to master it.\
    \ Notable Attacks/Techniques: thumb|250px|Nianzol using The Wind The Wind: W - The Wind is Nianzol's\
    \ Schrift and is most easily explained as being able to physically bend away the space of any attack\
    \ he perceives to be as coming from an opponent. This means that it is impossible to assault him directly,\
    \ even with sneak attacks. Hirenkyaku: Essentially the Quincy version of the Shinigami Shunpo and\
    \ Arrancar Sonido. The Quincy creates platforms of Reishi under their feet to swiftly move around\
    \ the battlefield. Sklaveri: Vollst\xE4ndig's basic Reishi Absorption ability pushed to the absolute\
    \ limit. This allows the user to absorb the Reishi that composes spiritual and living beings, an absolute\
    \ subordination of Reishi. Destroying the Stern Ritter's Halo is the only way to stop it. Rans\u014D\
    tengai: An advanced Quincy technique created for injured/old Quincy in order to control their limbs\
    \ with strings of Reishi like a puppet. Broken bones and severed tendons mean nothing to this as the\
    \ strings will control the limbs until the body/limb is entirely destroyed. Shadow: A teleportation\
    \ ability used by members of the Wandenreich, this technique can be used by manifesting the user's\
    \ shadows in front of them, creating a portal that acts as a gate between the Schatten Bereich and\
    \ other dimensions. The size of these portals can be extended to allow many others to pass through.\
    \ Medallion: A device possessed by select members of the Wandenreich military, including all Sternritter\
    \ which allows one to steal a Shinigami's Bankai or any power that is fundamentally similar to a Shinigami's\
    \ Bankai.Chapter 552 ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll\
    \ box|content={{reflist|2}}}} ==Notes/Explanations== {{scroll box|content=}} {{Discussions}} Category:Characters\
    \ Category:Bleach Category:Manga Characters Category:Male Characters Category:Quincies Category:Sternritter\
    \ Category:Humans Category:Antagonists Category:Villains Category:Flight Users Category:Chi Users\
    \ Category:Enhanced Senses Users Category:Soul Users Category:Matter Users Category:Absorption Users\
    \ Category:Space Users Category:Blood Users Category:Statistics Amplification Users Category:Invisibility\
    \ Users Category:Non-Physical Interaction Users Category:Energy Users Category:Extrasensory Perception\
    \ Users Category:Weapon Creation Users Category:Dimensional Travel Users Category:Power Absorption\
    \ Users"
  source_ids: *id003
