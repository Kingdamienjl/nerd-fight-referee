power_scale:
  tier:
    text: "At least {{6-B}}, higher with Gran Rey Cero, at least {{High 6-B}} with Resurrecci\xF3n, higher\
      \ with Cero Oscuras, far higher with Gran Rey Cero Name: Szayelaporro Granz Origin: Bleach Age:\
      \ Unknown Gender: Male Classification: Arrancar, Octava Espada"
    source_ids: &id002
    - mediawiki-68189
    confidence: 0.95
  attack_potency:
    text: "At least Country level (As an Espada, Szayelaporro would be stronger than the Privaron Espada,\
      \ such as Dordoni and GantenbainneBleach, Chapter 250: \"Five Ways To Three Figures\"Bleach, Chapter\
      \ 251: \"Barons' Lecture 1st Period\"Bleach, Chapter 254: \"Leave the Chocolate Here\"Bleach, Official\
      \ Character Book 2: \"Masked\", since Nnoitora claims the current Espada are stronger than the previous,Bleach,\
      \ Chapter 292: \"Rupture my Replica\" which is supported by the databooks which claim the Espada\
      \ are above all other Arrancar, and the power of the Espada make the Fracci\xF3n's pale in comparison;Bleach,\
      \ Chapter 209: \"Lift the Limit\" additionally, the Espada are ranked according to their power,\
      \ making Szayelaporro stronger than Aaroniero.Bleach, Official Character Book 3: \"Unmasked\" Broke\
      \ the Shikai of Renji and is far superior than Ilfordt38.9448 Teratons), higher with Gran Rey Cero\
      \ (Gran Rey Cero is the most powerful enhanced version of the Cero, making it a greater amplification\
      \ than Cero Oscuras), at least Large Country level with Resurrecci\xF3n (Masked states that Szayelaporro\
      \ was toying with Renji and Uryu and Szayelaporro should be stronger than Gantenbainne194.7239 Teratons),\
      \ higher with Cero Oscuras (All Espada can use this technique in their release formsBleach, Chapter\
      \ 346: \"The Wrath\" which is far stronger compared to a regular Cero), far higher with Gran Rey\
      \ Cero (It is the ultimate Cero)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "High Hypersonic (Should be faster than the Privaron Espada), higher with Resurrecci\xF3n (Faster\
      \ than before)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: "Class 10 (Effortlessly stopped Renji's attack), higher with Resurrecci\xF3n (Stronger than\
      \ before)"
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: "At least Country level (Comparable to his Attack Potency, as he used a kick to snap Renji's\
      \ Shikai), at least Large Country level with Resurrecci\xF3n (Likely stronger than before)"
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "At least Country level (Blocked attacks from Renji's ShikaiBleach, Chapter 275: \"The United\
      \ Front 2 (Red & White)\"), at least Large Country level with Resurrecci\xF3n (Comparable to his\
      \ Attack Potency, Szayelaporro can also summon his Fracci\xF3n to block attacks from Bankai Renji\
      \ and Uryu)"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Lesser characters can fight for days at a time, and Szayelaporro can continue fighting
