    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range; Varies from Hundreds of Meters to Kilometers with his abilities
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Extraordinary Genius (Szayelaporro is a brilliant man, the top researcher and weapons developer
      of the Espada. Sadistic and incredibly intelligent, Szayelaporro has explored and developed a number
      of inventions for his own use, creating devices that can control Reiatsu and many advanced traps.
      He prepares for combat by carefully analyzing his opponents and their abilities beforehand, creating
      counters and failsafes and often even countering their abilities as they use them and he sees them,
      as he quickly sees through the techniques to discern their weaknesses. He is, however, somewhat
      unskilled in close combat for an Espada on top of being arrogant and convinced that he has reached
      "perfection")
    source_ids: *id002
    confidence: 0.95
