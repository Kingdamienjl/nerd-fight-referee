- id: claim-powers-and-abilities-c5aae3ab
  section: abilities
  axis: hax
  text: "*Soul Physiology & Quincy Physiology (Soul: High-Tier/Quincy: Sternritter-Tier) *Expert Archery,\
    \ Staff Wielder & Martial Arts (Askin as a Sternritter and member of the Schutzstaffel is a trained\
    \ archer and soldier. Askin uses marital arts in conjunction with his Schrift as displayed in his\
    \ fight with Yoruichi ShihoinBleach Chapter 662. Askin's Vollst\xE4ndig grants him access to a staff\
    \ he can wield to combat skilled swordsman and genius fighters like Kisuke UraharaBleach Chapter 664)\
    \ *Limited Immortality (Type 2; Askin was able to survive after having his heart ripped out for a\
    \ short periodBleach Chapter 665) *The Death-Dealing: **Poison Manipulation, Durability Negation &\
    \ Limited Transmutation (Askin can control the 'Lethal Doses' of any substance he is exposed to within\
    \ his range, effectively allowing him to turn anything into a deadly poisonBleach Chapter 602. Even\
    \ oxygenBleach Chapter 662, hydrogenBleach Chapter 662, bloodBleach Chapter 602, and ReishiBleach\
    \ Chapter 656 can be affected by The Death-Dealing) **Information Analysis (Askin is able to calculate\
    \ the letal dosage of a given substance through The Death-DealingBleach Chapter 602) **Resistance\
    \ Negation, Enhanced Poison Manipulation & Enhanced Paralysis Inducement (Gift Bad creates a \"pool\"\
    \ of poison that lowers it's victims resistance to a selected substance, effectively making that substance\
    \ extremely poisonous to them. For example, Askin can lower your resistance to Reishi, which causes\
    \ it to posion you. Askin can use this to poison someone to the point of paralysisBleach Chapter 656)\
    \ **Further Enhanced Poison Manipulation, Sleep Manipulation & Energy Projection (Gift Ball creates\
    \ a small ball of moving Poison that can instantly knock out it's victims on contactBleach Chapter\
    \ 662) **Matter Manipulation (Atomic - Askin can infuse his Gift Ball with Oxygen, Nitrogen and ReishiBleach\
    \ Chapter 662) **Power Modification (Askin can modify the lethal dosage in his opponents attackBleach\
    \ Chapter 657) **Passive Reactive Evolution & Limited Invulnerability (Askin can manipulate Lethal\
    \ Dosage's to gain an immunity to any attack or Reiatsu he has been subjected toBleach Chapter 658.\
    \ This immunity is so comprehensive that the attack is not able to even harm himBleach Chapter 658.\
    \ Askin's body reflexively analyzes an attack and his opponent and begins to grant him immunity towards\
    \ them. Askin can gain immunity to his opponent and their attack in a single minuteBleach Chapter\
    \ 664) ***Limited Regeneration (Mid-Low; Askin can heal wounds dealt by an attack due to his gained\
    \ immunity. For example, Askin regenerated from the severe burns he had sustained priorBleach Chapter\
    \ 658) *Vollst\xE4ndig, Hasshein: **Enhanced Passive Reactive Evolution & Enhanced Information Analysis\
    \ (Askin's Vollst\xE4ndig, HassheinBleach Chapter 663 Askin will automatically adapt to changes in\
    \ \"poison;\" as long as the base of the poison remains the same, any surface layer changes will cause\
    \ Askin's immunity to adjust in turn, rendering the poison ineffective, even if one attempts to change\
    \ itBleach Chapter 664) **Enhanced Energy Projection & Pain Manipulation (Askin can create a Gift\
    \ Ball large enough to surround the battlefield with Gift Ball DeluxeBleach Chapter 663. Askin can\
    \ manipulate the Lethal Dose of the air within Gift Ball Deluxe to torment his opponentBleach Chapter\
    \ 665. Upon Askin's death, the Gift Ball Deluxe is signifcantly amplified in potencyBleach Chapter\
    \ 666) **Sealing (Gift Bereich seals the borders of the Gift Ball Deluxe to make it inescapable. Though\
    \ people with Dimensional Travel can escape just they can enterBleach Chapter 664) **Limited Size\
    \ Manipulation, Teleportation & Death Manipulation (Askin can manipulate the size of his Gift Rings.\
    \ When thrown, these rings disappear and reappear wherever Askin chooses on his target's body. These\
    \ rings force an instant death of whatever body part they pierceBleach Chapter 664) Resistance to:\
    \ *Absolute Zero (Far superior to \xC4s N\xF6dt who resisted Rukia's Shikai) *Paralysis Inducement\
    \ (Ranso Tengai allows Quincy to freely manipulate their bodies using spirit energy if their bodies\
    \ would be inflicted with great physical harm or paralysis)"
