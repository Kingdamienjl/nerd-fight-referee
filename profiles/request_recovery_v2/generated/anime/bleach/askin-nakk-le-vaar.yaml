  intelligence:
    text: "Askin is a perceptive and calculating combatant. When \u014Cetsu Nimaiya attacked the Schutzstaffel\
      \ with Sayafushi, Askin was the only one who attempted to outmaneuver him because he had figured\
      \ out the blade movements of Sayafushi to the point where he could move backward at the same speed\
      \ as Nimaiya's swing, which Nimaiya himself noted and was impressed by despite seeing through the\
      \ attempt and successfully attacking him. When facing the restructuring power of Kisuke Urahara's\
      \ Bankai and having his arm torn open, Askin quickly deduced that the Bankai had a limited range\
      \ in which it could restructure objects and moved outside of that range to let his arm repair itself,\
      \ which Urahara himself praised as being a far more cool-headed reaction than others who simply\
      \ panicked and cut off their arm."
