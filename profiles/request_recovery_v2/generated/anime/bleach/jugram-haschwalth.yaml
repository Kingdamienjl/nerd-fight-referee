- id: claim-powers-and-abilities-ea312a6a
  section: abilities
  axis: hax
  text: "*Soul Physiology & Quincy Physiology (Soul: High-Tier/Quincy: Sternritter-Tier) **Passive Power\
    \ Bestowal (Jugram's existence passively increases the development of other Quincies around himBleach\
    \ Chapter 633) *Expert Swordsman, Marksman & Archer (Jugram is a highly experienced and trained leader\
    \ and soldier. He has been a member of the Sternritter and their Grandmaster since the first Quincy\
    \ War. Jugram trained himself for years since childhood in archery and swordsmanship to become a part\
    \ of Yhwach's armyBleach Chapter 631-634) **Energy Projection (Jugram can fire a slash of energy from\
    \ his broadswordBleach Chapter 672) *The Balance: **Probability Manipulation, Damage Transferal, Limited\
    \ Causality Manipulation & Durability Negation (The Balance is Haschwalth's Schrift that allows him\
    \ to manipulate the fortune and misfortune that occurs within his sphere of influence, all good fortune\
    \ experienced by the opponent in causing injury to him will be directed back to them as misfortune\
    \ of the same magnitude. Jugram can additionally absorb misfortune into his Freund Schild to amplify\
    \ the misfortune he controls and amplifies it when redirecting it to his opponentBleach Chapter 679.\
    \ This ability can be used to kill people the user could not even harm beforeBleach Chapter 559) *The\
    \ Almighty: **Precognition & Darkness Manipulation (At night, Yhwach and Jugram switch SchriftsBleach\
    \ Chapter 635, granting Yhwach The Balance and Jugram The Almighty due to the fact they are both one\
    \ side of a balanced scaleBleach Chapter 661. Despite not being as proficent with it as YhwachBleach\
    \ Chapter 661-675, Jugram can still utilize The AlmightyBleach Chapter 660 to see into the futureBleach\
    \ Chapter 635. While having The Almighty, Jugram can create streams of darknessBleach Chapter 661)\
    \ Resistance to: *High Temperatures (Resisted Yamamoto's Bankai heatBleach Chapter 508, should also\
    \ be superior to Royd Lloyd's Blut Vene who survived standing in close proximity to Yamamoto.) *Absolute\
    \ Zero (Far superior to \xC4s N\xF6dt who resisted Rukia's Shikai with Blut Vene) *Paralysis Inducement\
    \ (Ranso Tengai allows Quincy to freely manipulate their bodies using spirit energy if their bodies\
    \ would be inflicted with great physical harm or paralysis)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
