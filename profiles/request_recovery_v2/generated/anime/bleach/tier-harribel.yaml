- id: claim-powers-and-abilities-c99d9907
  section: abilities
  axis: hax
  text: "*Soul Physiology & Hollow Physiology (Soul: High-Tier/Hollow: High-Tier Arrancar) *Expert Swordswomen\
    \ (As the Tres Espada and the current Queen of Hueco Mundo, Tier is an extremely skilled and experienced\
    \ swordswomen, having spent centuries fighting against and killing hollows, with this level of skill\
    \ and experience she's able to fight on par with and outskill the likes of Toshiro Hitsugaya who's\
    \ considered a prodigy by the Gotei 13Bleach: Chapter 339) *Resurrecci\xF3n: Tibur\xF3n **Water Manipulation,\
    \ Limited Heat Manipulation & Limited Size Manipulation (Tibur\xF3n grants Tier the ability to generate\
    \ and manipulate waterBleach: Chapter 355, doing so to create large water-based attacksBleach: Chapter\
    \ 357, given this control over water she can do things like reduce ice back into its liquid form,\
    \ control the temperature of water, turning it scalding hot and even take control over the water attacks\
    \ of her opponent, allowing her to freely control the movement and size of it) Resistance to: *Extrasensory\
    \ Perception ( 2 Layers; Using Son\xEDdo allows the user to bypass Extrasensory PerceptionCan't Fear\
    \ Your Own World: Vol 1: Chapter 9 of even captain level opponents) *Cold Temperatures (Tier completely\
    \ resisted the coldness of Toshiro Hitsugaya's iceBleach: Chapter 358)"
  source_ids: *id003
  decisive: true
