    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: "At least Continent level (Comparable to her Attack Potency, as she physically overwhelms Toshiro),\
      \ higher with Resurrecci\xF3n (Comparable to her Attack Potency, as she was able to physical clash\
      \ with Toshiro, Lisa, and Hiyori) | Multi-Continent level"
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "At least Continent level (Comparable to her Attack Potency, as she can withstand the force\
      \ of her own strikes), higher with Resurrecci\xF3n (Capable of blocking attacks from Bankai ToshiroBleach\
      \ Chapter 357Bleach Chapter 358, is unharmed by Toshiro's strongest attackBleach Chapter 359, and\
      \ casually blocks a strike from LisaBleach Chapter 368) | Multi-Continent level, higher with Resurrecci\xF3\
      n"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Lesser characters can fight for days, and Harribel can fight even when affected
      by injuries that would be lethal for humans.)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range, Hundreds of Meters to Kilometers with her abilities
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Though she may be quiet, Harribel is a highly intelligent, intuitive fighter who can discern
      her opponent's thoughts by judging their demeanor. During the battle between Ichigo and Grimmjow,
      she noted their similarities when it comes to Reiatsu, and while fighting Hitsugaya, she was able
      to see through his personality and skillfully hold her own, using his own techniques against him.
    source_ids: *id002
    confidence: 0.95
