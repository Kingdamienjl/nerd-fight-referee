power_scale:
  tier:
    text: "At least {{6-A}}, higher with Gran Rey Cero, far higher with Resurrecci\xF3n, even higher with\
      \ Cero Oscuras, even higher with Gran Rey Cero | {{High 6-A}}, higher with Resurrecci\xF3n, even\
      \ higher with certain techniques"
    source_ids: &id002
    - mediawiki-2648
    confidence: 0.95
  attack_potency:
    text: "At least Continent level (As an Espada, Harribel would be stronger than the Privaron Espada,\
      \ such as DordoniBleach Chapter 250Bleach Chapter 251Bleach Chapter 254Bleach Official Character\
      \ Book 2 Masked, since Nnoitora claims the current Espada are stronger than the previousBleach Chapter\
      \ 292, Making Harribel stronger than adult Nelliel, which is supported by the databooks which claim\
      \ the Espada are above all other ArrancarBleach Official Character Book 2 Masked, and the power\
      \ of the Espada make the Fraccion's pale in comparisonBleach Chapter 209; additionally, the Espada\
      \ are ranked according to their power, making Harribel stronger than UlquiorraBleach Official Character\
      \ Book 2 MaskedBleach Official Character Book 3 Unmasked. Once she gets serious, Harribel overpowered\
      \ Bankai ToshiroBleach Chapter 339, and harm himBleach Chapter 3541.9472 Petatons), higher with\
      \ Gran Rey Cero (Gran Rey Cero is the most powerful enhanced version of the CeroBleach Official\
      \ Character Book 2 Masked, making it a greater amplification than Cero OscurasBleach Official Character\
      \ Book 3 Unmasked), far higher with Resurrecci\xF3n (Stronger than Resurrecci\xF3n Ulquiorra, and\
      \ was capable of simultaneously fighting Bankai Toshiro, Hollow Mask Lisa, and Hollow Mask HiyoriBleach\
      \ Chapter 375. The releases of Espada numbered 4 are up are considered stronger than their Cero\
      \ Oscuras and at least as strong as their Gran Rey CeroBleach Chapter 3451.9472 Petatons), even\
      \ higher with Cero Oscuras (All Espada can use this technique in their release formsBleach Chapter\
      \ 346), even higher with Gran Rey Cero (It is the ultimate Cero) | Multi-Continent level (Fought\
      \ against Hikone with the rest of the Espada and also fought Ikomikidomoe), higher with Resurrecci\xF3\
      n, even higher with certain techniques (Cero Oscuras and Gran Rey Cero amplify her attack power)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Massively Hypersonic (Superior or at least comparable to Nnoitora), higher with Resurrecci\xF3\
      n (Superior or at least comparable to Resurrecci\xF3n Nnoitora) | Massively Hypersonic+ (Kept up\
      \ with the other Espada)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: "Class M (Far stronger than Abirama), higher with Resurrecci\xF3n (Stronger than before) | Class\
