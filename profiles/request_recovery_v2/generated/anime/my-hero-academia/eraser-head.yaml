- id: claim-weaknesses-f96ee211
  section: weaknesses
  axis: weakness
  text: "His Quirk wears off if he closes his eyes or if his eyes are obstructed from his target. If he\
    \ uses his ability for a long period of time, his eyes start to dry out, forcing him to shut his eyes.\
    \ He cannot nullify Mutation-Class Quirks, powers that affect body physiology, nor affect the opponent's\
    \ natural strength and speed. Due to the aftereffects of his injuries sustained at the U.S.J. facility,\
    \ when Eraser Head activates and deactivates his Quirk, there is now an interval where his ability\
    \ must recharge before he can use it again. After losing an eye in the All-Out War, he has now almost\
    \ completely lost the ability to use his Quirk. Notable Attacks/Techniques: Erasure: This Quirk allows\
    \ the user to cancel the special powers and abilities of their target by looking at them. However,\
    \ this only works on Emitter and Transformation-Type Quirks, such as Electrification and Shapeshifting.\
    \ It will not work on Mutation-Type abilities that are more innate in nature, such as super strength\
    \ or super durability. ==Gallery== Shota Aizawa One's Justice Design.png|Eraser Head in My Hero One's\
    \ Justice Shota Aizawa One's Justice 2 Design.png|Eraser Head in My Hero One's Justice 2 ==Notable\
    \ Matchups== Victories: *Y\u016B Otosaka (Charlotte) Y\u016B's Profile (U.A. Beginning Saga Eraser\
    \ Head and One-Eyed Reaper Y\u016B were used. Speed was equalized) *Lemillion (My Hero Academia) Lemillion's\
    \ Profile (U.A. Beginning Saga Eraser Head and Shie Hassaikai Arc Lemillion were used. Speed was equalized)\
    \ Losses: Inconclusive: {{Discussions|Shota Aizawa|Eraser Head}} Category:Characters Category:My Hero\
    \ Academia Category:Male Characters Category:Manga Characters Category:Anime Characters Category:Good\
    \ Characters Category:Humans Category:Adults Category:Teachers Category:Heroes Category:Superheroes\
    \ Category:Martial Artists Category:Weapon Masters Category:Knife Users Category:Acrobats Category:Power\
    \ Nullification Users Category:Eye Users Category:Supernatural Willpower Users Category:Wire Users\
    \ Category:Caltrop Users Category:Cloth Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
