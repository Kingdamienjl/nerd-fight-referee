- id: claim-weaknesses-02168fce
  section: weaknesses
  axis: weakness
  text: "Her body is not as strong or as durable as her legs. Notable Attacks/Techniques: {{Nihongo|Rabbit|{{Ruby|\u514E\
    |\u3046\u3055\u304E}}|Usagi}}: Mirko's Quirk is a Mutant-Type Quirk which grants her the anatomy and\
    \ abilities of a rabbit. These include rabbit ears, a tail, and tremendously powerful legs. Her legs\
    \ are strong enough to enable her to leap long distances and kick with extreme force. With this ability,\
    \ she has enough power to blow away Dabi's flames and injure even the strongest types of Nomu. *{{Nihongo|Luna\
    \ Ring|{{Ruby|\u8E35\u6708\u8F2A|\u30EB\u30CA \u30EA\u30F3\u30B0}}|Runa Ringu}}: Mirko performs a\
    \ cartwheel in the air with her legs to kick multiple targets simultaneously. She used this technique\
    \ to free herself from the Quirk of a High-End Nomu. *{{Nihongo|Luna Fall|{{Ruby|\u6708\u589C\u8E74\
    |\u30EB\u30CA \u30D5\u30A9\u30FC\u30EB}}|Runa F\u014Dru}}: Mirko delivers a downward kick in the air\
    \ to her opponent's head, sending them straight to the ground. *{{Nihongo|Luna Tijeras|{{Ruby|\u6708\
    \u982D\u92CF|\u30EB\u30CA \u30C6\u30A3\u30D8\u30E9}}|Runa Tihera}}: Mirko grips her opponent's head\
    \ with her legs before rotating her body, using her superhuman strength to rip their head off and\
    \ smash it into the ground. She only uses this technique against dangerous enemies she knows cannot\
    \ be restrained. *{{Nihongo|Luna Arc|{{Ruby|\u8E35\u534A\u6708\u8F2A|\u30EB\u30CA \u30A2\u30FC\u30AF\
    }}|Runa \u0100ku}}: Mirko raises her leg and delivers a mighty front-facing axe kick to her opponent.\
