- id: claim-weaknesses-9e04019d
  section: weaknesses
  axis: weakness
  text: 'Being at his smallest size possible drains his life away and will eventually kill him if he stays
    like that for too long. Notable Attacks/Techniques: Foldabody: Edgeshot''s Quirk allows him to make
    his body and limbs extremely thin and long, effectively allowing him to transform himself into a razor-sharp
    string. He is able to transform faster than the speed of sound. He can use his Quirk to move around
    quickly, slip through tight spaces, and pierce targets by folding himself into sharp shapes. *Fishhook
    Snag: Edgeshot flattens and twists himself into a pointed string and then sends his arm to retrieve
    the enemy. *Spiral Spear Hand: Edgeshot flattens and twists himself into a pointed string and then
    pierces his opponent with his arm to halt their movement. *Substitution Jutsu: Using his ninjutsu
    techniques, the instant before he is hit by an enemy attack, Edgeshot immediately switches places
    with a log, avoiding being struck by the attack. *Thousand Sheet Pierce: Edgeshot flattens and twists
    himself into a pointed string and then pierces his opponent before cutting off their blood flow and
    knocking them unconscious. ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==
    {{Scroll box|content=}} {{Discussions|Edgeshot|Edgeshot}} Category:Characters Category:My Hero Academia
