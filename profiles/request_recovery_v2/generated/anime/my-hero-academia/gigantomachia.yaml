- id: claim-weaknesses-0067c41c
  section: weaknesses
  axis: weakness
  text: 'Hearing All For One and presumably Shigaraki''s voice calms him down, even if he''s in the middle
    of a rampage. Requires an order before he can act, even in a life-or-death situation. Notable Attacks/Techniques:
    Quirks: Gigantomachia has been modified with multiple Quirks that allow him to act as the perfect
    bodyguard. These Quirks include: *Endurance: Gigantomachia''s original Quirk allows him to convert
    his morale into physical energy and stamina. *Pain Blocker: A Quirk that makes Gigantomachia unable
    to feel pain, which allows him to fight while ignoring any damage he may take. *Gigantification: This
    Quirk gives Gigantomachia the ability to increase his size to gigantic levels the more agitated or
    excited he gets. He can grow to be at least 25 meters in height. *Dog: This Quirk gives Gigantomachia
    enhanced senses such as sight, hearing, and smell, similar to that of a dog''s. *Energy Saver: This
    Quirk allows Gigantomachia''s body to conserve nutrients and water, further increasing his stamina
    and reducing the amount of sleep he needs. *Fierce Gains: This Quirk allows Gigantomachia to harden
    his muscles to exceptionally tough and thick levels. *Mole: This Quirk allows Gigantomachia to grow
    mole-like claws on his fingers to tear through obstacles with ease and dig through the ground. This
    also gives him a visor to defend his eyes from dirt particles and spikes on his back to slide underground.
    All For One gave him this Quirk to hide underground. ==Notable Matchups== Victories: Losses: *Tsukuyomi
    (My Hero Academia) Tsukuyomi''s Profile (Final War Arc Tsukuyomi was used. Both were at their strongest.
    Speed was equalized) *Kat (Gravity Rush) Kat''s Profile (7-C Gigantomachia and Base Kat were used.
    Kat''s Panther Mode was restricted. Speed was equalized) Inconclusive: ==Notes/Explanations== {{Scroll
    box|content=}} {{Discussions}} Category:Characters Category:My Hero Academia Category:Male Characters
    Category:Manga Characters Category:Anime Characters Category:Antagonists Category:Villains Category:Evil
    Characters Category:Humans Category:Supernatural Willpower Users Category:Large Sized Characters Category:Size
    Users Category:Air Users Category:Enhanced Senses Users Category:Breath Attack Users Category:Energy
    Users Category:Body Control Users Category:Bone Users Category:Bodily Weaponry Users Category:Underground
    Mobility Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-9bcd0573
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Supernatural Willpower (Gigantomachia will do whatever it
    takes to fulfill his master's wishes), Large Size (Type 1), Size Manipulation (Can increase his size),
    Air Manipulation (Can create enormous shock waves with his attacks), Enhanced Senses (His senses of
    hearing and smell are incredibly developed. Capable of tracking Shigaraki from around 300 kilometers
    away, and can even detect someone if they try to attack him while he is sleeping), Breath Attack (His
    breath is strong enough to blow people away and cause damage to a forest), Energy Manipulation (Can
    convert his morale into physical energy), Body Control, Bone Manipulation, Bodily Weaponry, Underground
    Mobility (Able to dig and move through the underground faster than he can run in the surface), Resistance
    to Pain (One of his Quirks makes him unable to feel any pain), Heat (Endured and ate Dabi's blue flames
    as if they were nothing), Sleep (Is capable of staying awake after drinking a powerful sedative),
    and Mind Manipulation (Has displayed resistance to Nighthide's Brainwashing Quirk)
  source_ids: *id003
  decisive: true
  status: unverified
