  intelligence:
    text: 'Genius (Creati is ranked to have S-class intelligence.My Hero Academia: Ultra Archive: The
      Official Character Guide Her analytical skills are strong, easily devising strategies and plans
      in battle and urgent situations, which she has no trouble putting in motion due to her Quirk''s
      versatility. Academically speaking, Creati is highly efficient, having been ranked 1st place in
      the mid-terms of her class,My Hero Academia Volume 7 Chapter 60 and understanding the composition
      of anything she wishes to create using her Quirk. The latter is a complicated task for even the
      simplest materials. Regardless, Creati commonly uses the objects from her Quirk to provide auxiliary
      support for her allies, as well as blindside her opponents, making her a very crafty individual,
      and reliable comrade. What she lacks in raw strength and destructive power, she makes up for with
      her ingenuity. When she was paired with Shoto against Eraser Head in the Final Exams, she realized
      that the Pro Hero''s Erasure Quirk has a smaller time limit due to the injury he received from the
      U.S.J. Nomu, and capitalized on that small interval to blindside him, and secure the victory for
      her and Shoto)'
    source_ids: *id002
    confidence: 0.95
