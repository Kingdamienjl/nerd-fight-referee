- id: claim-weaknesses-f93d8492
  section: weaknesses
  axis: weakness
  text: "The larger the object created from her Quirk, the more exposed her body is. If she runs out of\
    \ lipids in her body, she will be unable to create any more objects. She can overthink how weak she\
    \ is compared to classmates stronger than her, though after the Final Exam arc, this no longer applies.\
    \ Notable Attacks/Techniques: Creation: Creati's Quirk allows her to produce different objects, such\
    \ as weapons and other objects, from any exposed part of her body. Apart from living things, Creati\
    \ can create virtually any object. All she needs is an understanding of the object's atomic configuration\
    \ in order to do so. Creati's body breaks down fat at a molecular level, which will then be reused\
    \ as material for her to shape into objects with her Quirk, requiring a certain amount of consumption\
    \ of food based on how she\u2019ll use it.My Hero Academia Volume 9 Chapter 72 ==Notable Matchups==\
    \ Victories: *Uravity (My Hero Academia) Uravity's Profile (Final War Arc Creati and Final War Arc\
