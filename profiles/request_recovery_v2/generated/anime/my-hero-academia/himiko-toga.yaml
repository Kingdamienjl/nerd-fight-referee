- id: claim-weaknesses-38e46b40
  section: weaknesses
  axis: weakness
  text: 'Toga needs a certain amount of blood to transform for extended periods of time, as one cup of
    a person''s blood ingested equals to that of a full day''s usage. | Same as before. Toga can only
    use another person''s Quirk if she is fascinated by that person and holds them close to her heart,
    and she must have sufficient information on their power. Using someone else''s Quirk leaves her in
    a large amount of pain after her transformation ends. Only has 30 to 40 minutes worth of Twice''s
    blood. Even though she could copy Twice''s Quirk, her doubles of others were unable to use their own
    Quirks and seemed to lack their physical abilities. This is implied to be due to her heart being filled
    with bloodlust and not love, though it''s unknown if this is true or not. Notable Attacks/Techniques:
    Trans'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-db4697f7
  section: abilities
  axis: hax
  text: 'U.A. Beginnings Saga= Superhuman Physical Characteristics, Expert Hand-to-Hand Combatant (Is
