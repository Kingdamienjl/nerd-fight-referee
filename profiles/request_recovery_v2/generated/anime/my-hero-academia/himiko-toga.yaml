    and her thoughts, she can blend into her surroundings and erase her presence), Shapeshifting (By ingesting
    her target''s blood, she can transform into them. Can maintain many different disguises and switch
    between them on a whim) |-|Final War Arc= All previous abilities, plus: Power Mimicry (After her Quirk
