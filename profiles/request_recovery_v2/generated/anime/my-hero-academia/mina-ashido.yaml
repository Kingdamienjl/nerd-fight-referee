- id: claim-weaknesses-b23c026a
  section: weaknesses
  axis: weakness
  text: 'She risks damaging her own skin with her acid if she loses control of it. Using Acidman: Alma
    heavily tires her out, enough to make her pass out just a few seconds later, although she had been
    fighting against multiple villains for an unknown amount of time. Her maximum acid is powerful enough
    to hurt herself, despite her resistance. Notable Attacks/Techniques: Acid: Pinky''s Quirk gives her
    the ability to shoot out a corrosive liquid from within her body and can control the degree of viscosity,
    as well as its solubility. She can use it offensively but has shown utility as well such as melting
    handholds for herself to use while climbing. She also often slides around by secreting acid from her
    feet. *Acid Veil: Pinky generates a gelatinous acid wall which blocks incoming projectiles. Pinky''s
    Acid Veil was strong enough to block hardened spheres (which were stronger than concrete) with ease.
    *Acid Shot: Pinky shoots a rain of acid projectiles over a widespread area to shower down on to her
    opponents.My Hero Academia Volume 23 Chapter 214 *Acid Layback: Pinky creates acid from her shoes
    to dissolve the surface of the ground beneath her and make it easier to spin on the spot. With the
    enhanced momentum of her super-fast spin, she can throw projectiles with massively increased force.
    *Acidman: After rising the viscosity of her Quirk, Pinky generates a great quantity of acid that takes
    an anthropomorphic form that covers her entire body. This technique has defensive properties, since
    every attack against Pinky will be dissolved by the powerful acid that protects her.My Hero Academia
    Volume 26 Chapter 256 **Alma: After increasing the acidity of her Quirk to the maximum and compressing
    it into a single point, Mina launches her Acidman at her opponent at high speed. The potency of her
    maximum acid is capable of instantly melting through Gigantomachia''s claws. ==Notable Matchups==
    Victories: Losses: *Lizardy (My Hero Academia) Lizardy''s Profile (Joint Training Arc Pinky was used)
    Inconclusive: ==References== {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll
    box|content=}} {{Discussions|Mina Ashido|Pinky}} Category:Characters Category:My Hero Academia Category:Acid
    Users Category:Acrobats Category:Anime Characters Category:Brawlers Category:Dancers Category:Female
    Characters Category:Heroes Category:Humans Category:Manga Characters Category:Mutants Category:Protagonists
    Category:Schoolgirls Category:Students Category:Superheroes Category:Teenagers'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
