- id: claim-weaknesses-8806e1be
  section: weaknesses
  axis: weakness
  text: 'Twice requires sufficient details about the object he wants to clone such as height, chest, foot
    measurement etc. in case of humans; in order to copy it perfectly. The clones he creates have less
    endurance than the originals, and will dissolve after taking enough damage. Twice has no direct control
    over the clones he creates as they retain the original person''s personality. Feats: During the battle
    against Meta Liberation Army, who had 116,510 warriors on their side, Twice was able to make more
    than enough clones to combat them. Claimed to be able to make 20,000 clones of Dabi but held off due
    to not wanting to crush the Meta Liberation Army before Gigantomachia arrived. Notable Attacks/Techniques:
    Double: Twice''s Quirk grants him the ability to create an exact duplicate of anything, living or
    not. In order to duplicate something, he needs to know the exact measurements and characteristics.
    He is limited to only two duplications at a time. Creating doubles of himself allow him to bypass
    his two duplicate limit, since a duplicate of a person possess the same Quirk as the original. He
    was initially unwilling to duplicate himself due to traumatic experiences involving his own clones,
    though he eventually overcame this. *Sad Man''s Parade: Twice creates clones of himself, then the
    clones create clones of themselves, then those clones create clones of themselves. This cycle of exponential
    growth continues, resulting in thousands of clones of him. Twice uses this technique to overwhelm
    the Metal Liberation Army. With this Ultimate Move, he can easily overwhelm the enemy forces through
    sheer weight of numbers and proceeds to spread out like an ever-growing army of ants. It is almost
    impossible to stop because if a clone is destroyed, they quickly create a new one to replace itself.
    Individuals that Twice has shown the ability to duplicate besides himself are: *Tomura Shigaraki *Dabi
    *Himiko Toga *Mr. Compress *Kendo Rappa ==Gallery== The Man Known as Twice!! Moments (Part 1-2)|Twice
    backstory Twice Explains his Quirk (DUB)|Twice explains his powers TwiceClones.gif|Thousands of Twice
    clones ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions|Twice|Twice}} Category:Characters
    Category:My Hero Academia Category:Male Characters Category:Manga Characters Category:Anime Characters
    Category:Comedy Characters Category:Evil Characters Category:Antagonists Category:Humans Category:Villains
    Category:Duplication Users Category:Weapon Users Category:Tape Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
