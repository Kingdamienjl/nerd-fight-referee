- id: claim-weaknesses-53eb11d6
  section: weaknesses
  axis: weakness
  text: "He was born with his mother's genes that grant him high resistance to freezing temperatures,\
    \ but not to heat, which prevents him from using the full power of his flames for too long without\
    \ burning himself. His somatic nervous system is impaired, causing him to lose sensation in his body\
    \ and render himself completely numb. Using Phosphor causes the heat in his body to build up until\
    \ it cannot be contained anymore, this heat will eventually be released in a high pressure explosion\
    \ that'll destroy everything within five kilometers. Feats: Even at a young age his flames were already\
    \ superior to Endeavor's and burned at over 2000 degrees Celsius. His flames are hot enough to instantly\
    \ melt the ground beneath him and melt the statue of All Might in Kamino. His flames are hot enough\
    \ to burn both Endeavor and Shoto, who have resistance to fire. Notable Attacks/Techniques: Blueflame\
    \ ({{Ruby|\u84BC|\u305D\u3046}}{{Ruby|\u708E|\u3048\u3093}} S\u014Den): Dabi's Quirk allows him to\
    \ release very hot and destructive blue flames from any part of his body at will, but it burns him\
    \ if he uses it for a while. He can use it to unleash fireballs, flamethrowers, or walls of flames\
    \ at the opponent, enough to cause a forest fire or surround entire buildings with giant walls of\
    \ flames. He can even fly for a short time by projecting fire from the soles of his feet. He inherited\
    \ this Quirk from Endeavor, and was stated to possess the potential to be even stronger than his father's\
    \ flames. However, he also inherited his mother, Rei Todoroki's, tolerance to freezing temperatures,\
    \ which comes with the drawback of him being vulnerable to his own Quirk. After nearly dying in the\
    \ second battle against Shoto, Blueflame's power increased, causing itself to manifest the ice from\
    \ his mother's Quirk, Frost, within itself. This power-up is described as something \"different\"\
    \ to a Quirk Awakening and makes Blueflame similar in composition to Shoto's Half-Cold Half-Hot Quirk.\
    \ Dabi Quirk.png|Blueflame Dabi Ice Quirk.png|Dabi's using ice *Flashfire Fist: Endeavor's signature\
    \ technique, later passed down to Dabi himself. Dabi raises the temperature to its highest level and\
    \ maximizes his power. Doing so, Dabi can unleash devastating flame attacks or increase his speed\
    \ dramatically. Dabi Flashfire Fist.png|Dabi's Flashfire Fist *Jet Burn: Dabi shoots fire from the\
    \ palm of his hand, releasing a devastating attack. He was able to defeat Shoto using this technique.\
    \ Dabi can also use this technique to enhance the power of his punches and directly hit hit opponents.\
    \ Dabi Jet Burn.png|Jet Burn *Hell Spider: Dabi creates multiple spears of fire on each of his fingers.\
    \ He can use these spears to cut through enemies, or use it as a form of smokescreen to distract his\
    \ opponents. It has been stated that Dabi's Hell Spider is much thicker and dangerous than Endeavor's.\
    \ Dabi Hell Spider.png|Hell Spider *Hell Minefield: Dabi uses his Blueflame to push his flames underground,\
    \ causing pillars of flame to surge out of the ground all around him, burning anything in the way.\
    \ Dabi Hell Mindfield.png|Hell Minefield *Prominence Burn: This technique consists of using the full\
    \ might of his flames to emit a concentrated beam of heat from his body. Dabi was first going to use\
    \ this move against Endeavor before being interrupted by Best Jeanist. *Phosphor: Dabi copied this\
    \ technique from his brother Shoto. It was originally designed to counter his quirk. He was able to\
    \ use this technique to reinvigorate his body and cancel Shoto's ice. This boost the power of his\
    \ flames even more, allowing him to produce attacks far stronger than he could previously. Staying\
    \ in this state for a long enough time will release all of the heat he's compressing as a high pressure\
    \ explosion that'd destroyed everything within five kilometers of him. Dabi Phosphor.png|Phosphor\
    \ *Vanishing Fist: Dabi creates a giant fist of fire and then launches it at an opponent. Dabi lost\
    \ his right arm to perform this Ultimate Move while in his Phosphor state. Dabi Vanishing Fist.png|Vanishing\
    \ Fist ==Notable Matchups== Victories: *Scaramouche (Genshin Impact) Wanderer (Scaramouche) (Final\
    \ War Arc Toya and Shouki no Kami were used, Speed was equalized) Losses: Inconclusive: *Katsuki Bakugo\
    \ (My Hero Academia) Dynamight's Profile (Final War Arc Toya and Final War Arc Dynamight were used)\
    \ ==References== {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}}\
    \ {{Discussions}} Category:Characters Category:My Hero Academia Category:Male Characters Category:Anime\
    \ Characters Category:Manga Characters Category:Evil Characters Category:Antagonists Category:Villains\
    \ Category:Tragic Characters Category:Humans Category:Adults Category:Supernatural Willpower Users\
    \ Category:Fire Users Category:Rage Users Category:Flight Users Category:Danmaku Users Category:Ice\
    \ Users Category:Power Mimicry Users Category:Self-Destruction Users Category:Supervillains"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e99e05a0
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Supernatural Willpower (His sheer need for revenge is what\
    \ has kept him alive for more than 8 years against all odds, despite being estimated to have no more\
    \ time than a month), Immortality (Type 2, Toya was able to survive for years on his own after being\
    \ burnt in a fire caused by his own flames that are over 2000 \xB0C, with multiple of his organs failing,\
    \ and being estimated to not have more than a month to live.) Fire Manipulation, Rage Power (The power\
    \ of his fire is linked to his emotional state), Flight (Can propel himself through the air using\
    \ fire), Danmaku (Able to perform the technique Hell Spider similar to Endeavor, but in a more crude\
    \ way), Limited Power Mimicry (Was able to copy Endeavor's Flashfire Fist techniques just by seeing\
    \ them on TV. Was able to copy and use Shoto's Phosphor technique after seeing it in action two times),\
    \ Limited Ice Manipulation (Capable of generating ice on his body, though he only did this unconsciously),\
    \ Self-Destruction (After enough thermal energy builds up inside of him, he'll annihilate himself\
    \ and unleash a high-pressure blast that'll burn everything off the map within 5 kilometers), Resistance\
    \ to: Heat (His body has some resistance to fire, and can further increase this resistance by generating\
    \ ice on his body), Cold (Inherited his mother's genes that make his body resistant to cold temperatures),\
    \ and Pain (Due to his damaged nervous system, he cannot feel any pain)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
