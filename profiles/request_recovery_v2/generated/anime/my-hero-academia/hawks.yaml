- id: claim-weaknesses-c0684c72
  section: weaknesses
  axis: weakness
  text: "Hawks possesses a limited number of feathers, and it takes two days for them to regrow if he\
    \ uses them all. The more feathers he uses, the smaller his wings become, reducing his flight capability.\
    \ He stated that even his Fierce Wings can burn, though it\u2019s unclear whether this is an actual\
    \ weakness or if he was simply implying that they are otherwise difficult to destroy. The injuries\
    \ he sustained from Dabi's flames have weakened him, and he now requires prosthetics to reach his\
    \ former speeds. Notable Attacks/Techniques: Fierce Wings: Hawks' Quirk grants him massive, bright\
    \ red wings. He can telekinetically control the movement of each individual feather with ease, enabling\
    \ him to fly and shoot them as projectiles. He can also sense vibrations in the air through his feathers,\
    \ allowing him to detect people's locations. The feathers are immensely strong, capable of carrying\
    \ medium-sized objects such as rocks or human beings with just a single feather for each, or multiple\
    \ feathers for larger objects. As he sheds more feathers, his wings gradually shrink, impairing his\
    \ flight ability. Hawks mentions that he doesn't have enough feathers at the time to hold up a collapsing\
    \ building, implying that with more feathers, he would be able to support it. *Feather Blades: Hawks\
    \ plucks two long feathers from each wing and uses them as swords to cut through his targets. They\
    \ are strong enough to slice through two White Nomu summoned by Hood. *Vocal Espionage: Hawks can\
    \ use his feathers to detect minute changes in the air, allowing him to decode conversations and vocal\
    \ information by sensing vibrations. This technique makes him a highly effective spy. ==Notable Matchups==\
    \ Victories: *Nejire Chan (My Hero Academia) Nejire's Profile (Final War Arc Nejire Chan was used)\
    \ Losses: *Lady Nagant (My Hero Academia) Lady Nagant's Profile Inconclusive: ==Notes/Explanations==\
    \ {{Scroll box|content=}} {{Discussions|Hawks|Hawks}} Category:Characters Category:My Hero Academia\
    \ Category:Manga Characters Category:Anime Characters Category:Male Characters Category:Good Characters\
    \ Category:Heroes Category:Superheroes Category:Humans Category:Adults Category:Tragic Characters\
    \ Category:Sword Users Category:Weapon Masters Category:Wing Users Category:Body Control Users Category:Telekinesis\
    \ Users Category:Flight Users Category:Enhanced Senses Users Category:Danmaku Users Category:Feather\
    \ Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
