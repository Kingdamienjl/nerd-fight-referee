- id: claim-weaknesses-69226253
  section: weaknesses
  axis: weakness
  text: "Dark Shadow has an energy limit and when it runs out, Dark Shadow will retract back into Tsukuyomi.\
    \ It is also sensitive to light and luminous attacks will make it weaken and reduce in size. Dark\
    \ Shadow becomes feral and violent when influenced by the darkness, to the point that he can actually\
    \ take control of Tsukuyomi's body and move against his will.My Hero Academia Vol. 9 Chapter 78 This\
    \ weakness has completely vanished by the time of the All-Out War.My Hero Academia Vol. 27 Chapter\
    \ 265 Notable Attacks/Techniques: Dark Shadow: This Quirk allows Tsukuyomi to host a shadow-like monster\
    \ within his body called Dark Shadow.My Hero Academia Vol. 3 Chapter 25 Tsukuyomi can use Dark Shadow\
    \ for a number of purposes, such as attack, defense, and support. Dark Shadow has shown to be sentient\
    \ and capable of speech. The personality, power, and control of Dark Shadow depend on darkness and\
    \ light. In darker environments, Dark Shadow becomes much stronger and can sense even the smallest\
    \ of movements easily.My Hero Academia Vol. 9 Chapter 79 *Black Ankh: Tsukuyomi's special move, where\
    \ he equips Dark Shadow onto himself as if he were a suit of armor. This move apparently mitigates\
    \ his physical weaknesses and gives him characteristics comparable to that of Dark Shadow.My Hero\
    \ Academia Vol. 12 Chapter 101 Dark Shadow Black Ankh Manga.png|Black Ankh *Piercing Twilight Claws:\
    \ Dark shadow shoots his extendable claw out to attack his opponents.My Hero Academia Vol. 12 Chapter\
    \ 104 DS Piercing Twilight Claws.png|Piercing Twilight Claws *Covert Black-Ops Arms: Dark Shadow shoots\
    \ out both of his arms and enlarges them to subdue his targets.My Hero Academia Vol. 12 Chapter 108\
    \ DS Covert Black Ops Arms.png|Covert Black-Ops Arms *Sabbath: While moving through the air at high\
    \ speeds with Black Fallen Angel, Tsukuyomi equips Black Ankh and uses two shadow claws to quickly\
    \ strike down his opponents.My Hero Academia Vol. 22 Chapter 201 DS Ankh Sabbath.png|Sabbath *Black\
    \ Fallen Angel: Tsukuyomi wraps himself in the arms of Dark Shadow and lets himself be carried away\
    \ by him, using Dark Shadow's natural ability to float to move freely in the air. DS Black Fallen\
    \ Angel.png|Black Fallen Angel *Ragnar\xF6k: Tsukuyomi summons the Dark Shadow while in a dark area,\
    \ making him grow to an enormous size, and then sends him forward, destroying any obstacles on his\
    \ way. Tsukuyomi first used this ability to make a path to the underground facilities of the Paranormal\
    \ Liberation Front. DS Ragnarok Initial.png|Tsukuyomi's first usage of Ragnar\xF6k in battle *Ragnar\xF6\
    k Womb: Tsukuyomi summons his Dark Shadow at full power towards an opponent, which then wraps around\
    \ the target, preventing them from escaping. This technique was first used to immobilize Deku. Tsukuyomi\
    \ said the move was inspired by Deku's defense strategy during the Cavalry Battle.My Hero Academia\
    \ Vol. 33 Chapter 320 DS Ragnarok Womb.png|Ragnar\xF6k Womb being used against Deku *Ragnar\xF6k Fleeting\
    \ Blow: Using Black Ankh to cover his body with his Dark Shadow, Fumikage channels the power of Ragnar\xF6\
    k in his fist and hits his opponent with a massive claw attack.My Hero Academia Vol. 36 Chapter 356\
    \ DS Ragnarok Fleeting Blow.png|Fleeting Blow being used against All For One Total Release: Tsukuyomi\
    \ charges Dark Shadow using several sources of darkness, then unleashes its full power against his\
    \ opponents. *Light of Baldur: Tsukuyomi uses his Total Release and Black Ankh to unleash a powerful\
    \ punch against an opponent. This attack was powerful enough to overpower All For One, with a small\
    \ amount of help from Gale Force. Light of Baldur.png|Light of Baldur crushing All For One ==Notable\
    \ Matchups== Victories: *Gigantomachia (My Hero Academia) Gigantomachia's Profile (Final War Arc Tsukuyomi\
    \ was used. Both were at their strongest. Speed was equalized) Losses: Inconclusive: ==References==\
    \ {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}} {{Discussions|Fumikage\
    \ Tokoyami|Tsukuyomi}} Category:Characters Category:My Hero Academia Category:Acrobats Category:Anime\
