- id: claim-weaknesses-6dc40fd9
  section: weaknesses
  axis: weakness
  text: 'The continued use of Flashfire Fist raises his body temperature, causing him to weaken, so he
    refrains from overusing to use his most powerful attacks recklessly. This weakness seems to have been
    mitigated at the time of the Paranormal Liberation War Arc, as he was able to continuously use his
    strongest attacks without getting weaker. Using Prominence Burn instantly raises his body temperature
    to its maximum, making it a technique he cannot use carelessly. Feats: Can endure the immense heat
    of his own flames, which he states builds up inside of him after every serious attack he uses. Flames
    on par with his own are capable of melting Real Steel,My Hero Academia Vol. 22 Chapter 205 who trained
    his steel to be more resistant to heat than normal.My Hero Academia Vol. 22 Chapter 204 Can vaporize
    the majority of Hood''s body with his Prominence Burn, and would have killed him had he not thrown
    his head away. Star and Stripe compared the heat of her United Laser Keraunos to Endeavor''s, stating
    that if this had been enough to defeat Shigaraki, Endeavor would have been able to finish the job.
    Notable Attacks/Techniques: Hellflame: This Quirk grants Endeavor pyrokinetic abilities, allowing
    him to create and control fire at will, as well as shape his flames into various forms. He can also
    regulate his flames'' temperature, meaning their damage output can increase or decrease depending
    on his intent. Although he is often seen covered in flames, Hellflame is activation-based and can
    be deactivated. Endeavor can hover in mid-air by firing flames from his feet, shape his flames into
    weapons such as spears, arrows, or giant fists, and can even emit fire from his eyes. Endeavor Not
    Falling.png|Flying with Hellflame Ignited Arrow.png|Arrow of Fire Endeavor Heat Vision.png|Heat Vision
    *Karmic Raze - Hellfire Storm: Endeavor creates a massive tornado of fire that surround the enemies
    within the area and burn them.My Hero Academia: Vigilantes Vol. 10 Chapter 79 Endeavor Hellfire Storm.png|Hellfire
    Storm *Raging Assault - Hell Minefield: Endeavor breaks the ground with his fist and ignites his flames,
    sending a wave of fire towards his opponent. He then sends a second eruption of flames underneath,
    creating a massive explosion.My Hero Academia: Vigilantes Vol. 11 Chapter 83 Endeavor Hell Minefield.png|Hell
    Minefield *Ignited Arrow: With this technique, Endeavor creates a giant arrow made of fire and throws
    it at his opponents. Endeavor Ignited Arrow.gif|Ignited Arrow Flashfire Fist: Flashfire Fist is Endeavor''s
    signature technique. Flashfire Fist condenses Endeavor''s flames into a white-hot point allowing him
    to unleash devastating flame attacks or increase his speed dramatically. Endeavor can perform several
    variations of his Flashfire Fist move, each with a different form of attack. Endeavor Flashfire Fist.gif|Flashfire
    Fist *Flashfire Fist - Jet Burn: With Jet Burn, Endeavor shoots flames from his wrist to increase
    the momentum of his arm, and hits the enemy with a devastating fire punch. Endeavor Jet Burn.gif|Jet
    Burn *Flashfire Fist - Hell Spider: With Hell Spider, Endeavor creates a spear of fire on each of
    his fingers. Endeavor can use these spears to cut through enemies, and he has even cut the upper part
    of a building into small pieces. Endeavor Hell Spider.gif|Hell Spider *Flashfire Fist - Hell''s Curtain:
    Endeavor moves both fists back while concentrating all his fire on a single point. He then throws
    his arms forward, releasing a large blanket of fire over his opponent. Endeavor Hell Curtain.png|Hell''s
    Curtain *Vanishing Fist: Endeavor shapes his flames into a large fist around his arm and delivers
    a powerful punch with explosive impact, can use this technique with both hands to unleash a barrage
    of punches. This technique was first used against Shigaraki during the Paranormal Liberation War Arc.My
    Hero Academia Vol. 29 Chapter 277 After losing his right arm, Endeavor can use this technique to create
    a arm of fire from his stump to attack.My Hero Academia Vol. 36 Chapter 356 Vanishing Fist Anime.gif|Vanishing
    Fist Anime Endeavor Vanishing Fist.png|Vanishing Fist Manga Endeavor Vanishing Fist Barrage.png|Vanishing
    Fist Barrage *Vanishing Jet Burn: A combination of Jet Burn and Vanishing Fist, Endeavor forms a giant
    fist using his flames and blasts his opponent away with great force. Endeavor Vanishing Jet Burn.png
    *Prominence Burn: A move that allows Endeavor to launch a massive, concentrated beam of bright fire
    from his entire body that can vaporize any target, overwhelming opponents even with Super Regeneration.
    This technique is his most powerful attack, and is a super move he cannot use carelessly. Endeavor
    Prominence Burn.gif|Prominence Burn Plus Ultra Prominence Burn.gif|Plus Ultra Prominence Burn ==Gallery==
    Endeavor''s Hero Card.png|Hero Card ==Notable Matchups== Victories: *Superalloy Darkshine (One-Punch
    Man) Darkshine''s Profile (Speed was equalized) Losses: Inconclusive: ==References== {{Scroll box|content={{re'
