  tier:
    text: '{{8-A}}, higher with Permeation | {{7-C}}, higher with Permeation'
    source_ids: &id002
    - mediawiki-576229
    confidence: 0.95
  attack_potency:
    text: 'Multi-City Block level+ (Can incapacitate 8% Deku and the rest of Class 1-A with a single punch
      to the stomach711.97 Tons of TNT), higher with Permeation (Can propel himself from walls at impressive
      velocities to increase the strength of his attacks) | Town level (Has not stopped training since
      he lost his Quirk, so he should be much stronger than before.My Hero Academia: School Briefs VI
      Chapter 4 Capable of knocking Mr. Compress out during Paranormal Liberation War.My Hero Academia
      Vol. 30 Chapter 295 Word of God considers him to be the strongest student when not using their Quirk,My
      Hero Academia: Vol. World Heroes making him stronger than Uravity10.08 Kilotons of TNT), higher
      with Permeation (Can push back the Near High-Ends while in the air,My Hero Academia Vol. 30 Chapter
      292 and was strong enough to stagger the Nomus by hitting them in the eyesMy Hero Academia Vol.
      30 Chapter 294)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'High Hypersonic reactions and combat speed (Comparable to Sir Nighteye, who could defeat a
      clone of Rappa,My Hero Academia Vol. 17 Chapter 148 whose Quirk is just as quick as OverclockMy
      Hero Academia: Vigilantes Vol. 11 Chapter 87Mach 25.76), High Hypersonic with Permeation (Able to
      launch himself from surfaces at high speeds, which allowed him to outpace the majority of Class
      1-A in 6 seconds,My Hero Academia Vol. 14 Chapter 123 including 8% Deku and Ingenium) | Relativistic+
      reactions and combat speed (Managed to keep pace with Complete Shigaraki,My Hero Academia Vol. 36
      Chapter 361 whose speed is comparable to All Might in his heyday.My Hero Academia Vol. 35 Chapter
      3460.77c Shigaraki was unable to land a direct strike on him, and found it easier to ignore Lemillion
      insteadMy Hero Academia Vol. 37 Chapter 366), Relativistic+ with Permeation'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class K (As the strongest student at U.A. with no Quirks, he should be much stronger than Anima394
      Metric Tons) | Class K (Stronger than before)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level+ | Town level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level+ (Can survive the recoil of his own attacks. Is the most trained student
      in U.A. High) | Town level (Vastly more durable than before. Able to punch and kick the Near High-Ends
      without breaking his limbs)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Superior to most Pro Heroes and heroes in training, who could fight for 8 hours
      on end.My Hero Academia Vol. 8 Chapter 70 Can battle Overhaul and avoid his spikes while protecting
