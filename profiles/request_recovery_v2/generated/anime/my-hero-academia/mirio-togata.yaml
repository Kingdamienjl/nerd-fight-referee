    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (A third-year student at the prestigious U.A. High School, Lemillion has demonstrated
      incredibly mastery over his hard to use Quirk, easily defeating all of Class 1-A during a training
      exercise while compensating for many of his Quirk's downsides. Known for his exceptional work ethic,
      he is well-acquainted with the ins and outs of hero work, being declared the best candidate to reaching
      the rank of number one hero. In addition, he can be exceptionally level-headed despite his normally
      goofy demeanor, restraining Deku from confronting Overhaul as per the instructions given to him
      by Nighteye despite his desire to save Eri. Due to his Quirk effectively blinding him while active,
      he has trained his prediction skills to the point of being able to accurately foresee where he is
      going to be launched while overlapping an object)
    source_ids: *id002
    confidence: 0.95
