- id: claim-weaknesses-fd74753c
  section: weaknesses
  axis: weakness
  text: 'Once he goes intangible his clothes will slip off him, leaving him naked, unless he''s wearing
    clothes made from parts of his body. Absolutely all of his senses except the sensation of falling
    are disabled while fully intangible and he cannot breathe while in this state. Notable Attacks/Techniques
    Permeation: Lemillion''s Quirk allows him to phase his entire body, or part of it, through anything,
    including the ground. When he deactivates his Quirk while overlapping a solid object, he gets catapulted
    out it at high speed. If he adjusts his body in the middle of falling and then deactivates his Quirk,
    he can influence where he emerges from the ground to launch a sneak attack. *Blinder Touch: Eyeball
    Crush: Lemillion pretends to poke an opponent in the eye while his arm is intangible, distracting
    them long enough to deliver an actual blow to their stomach. *Killing Move: Phantom Menace: Lemillion
    consecutively launches himself in and out of his target''s surroundings at high speeds with all of
    his brute force, striking from all directions in a near instantaneous combo. ==Notable Matchups==
    Victories: Losses: *Eraser Head (My Hero Academia) Eraser Head''s Profile (Shie Hassaikai Arc Lemillion
    and U.A. Beginning Saga Eraser Head were used. Speed was equalized) Inconclusive: *Toji Fushiguro
    (Jujutsu Kaisen) Toji''s Profile (Shie Hassaikai Arc Lemillion was used. Speed was equalized) ==References==
    {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}} {{Discussions|Mirio
    Togata|Lemillion}} Category:Characters Category:My Hero Academia Category:Male Characters Category:Manga
    Characters Category:Anime Characters Category:Good Characters Category:Humans Category:Teenagers Category:Students
    Category:Heroes Category:Superheroes Category:Supernatural Willpower Users Category:Brawlers Category:Martial
    Artists Category:Acrobats Category:Precognition Users Category:Intangibility Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-edf208f2
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Supernatural Willpower (Able to keep fighting Overhaul for
    5 minutes and while suffering severe injuries. He gave up his Quirk and his dreams of becoming a Pro
    Hero just to save one personMy Hero Academia Vol. 17 Chapter 152), Expert Hand-to-Hand Combatant,
    Acrobatics (Capable of shooting out of walls and bouncing around with complex movementsMy Hero Academia
    Vol. 17 Chapter 150), Analytical Prediction (Possesses analytical skills that allow him to make accurate
