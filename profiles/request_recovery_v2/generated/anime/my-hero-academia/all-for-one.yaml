- id: claim-weaknesses-a00d44fd
  section: weaknesses
  axis: weakness
  text: 'He must make physical contact with a target to steal their Quirk. He can only take and give Quirks,
    and he cannot destroy any Quirks within his body, even if they are damaging to him. Each of his stolen
    Quirks has its own limitations and weaknesses. He is a sadist who prefers to crush his opponents emotionally
    before killing them. All For One is blind and is therefore forced to rely on his Infrared Ray Quirk
    and his other senses to fight effectively. The injuries inflicted by All Might severely weakened him,
    and he requires his support mask to function. Due to possessing an inferior copy of his original Quirk,
    his authority over the Quirks he has stolen has diminished. As a result, the Quirks within him can
    rebel if they are inspired to stand against him, causing him to slow down or even freeze in place,
    although he can quickly regain control. | Same as before. The weaknesses caused by his injuries no
    longer affect him after taking the Rewind Drug; however, the drug''s effects are irreversible, and
    will eventually erase him from existence. Taking damage accelerates the rewind effect, bringing him
    closer to his eventual erasure. Quirks that cause permanent changes to his body cannot be used while
    rewinding, such as Hawks'' Fierce Wings, as those changes are erased by Rewind. Notable Attacks/Techniques:
    All For One: All For One''s Quirk allows him to instantly steal other people''s Quirks through the
    holes in the palms of his hands, leaving the previous user completely powerless. This Quirk can also
    be used to transfer and grant Quirks previously stolen by All For One to other individuals. He can
    even combine multiple stolen Quirks to create powerful and devastating attacks. The theft is permanent
    and cannot be reversed without his consent. All For One has stolen a wide variety of Quirks using
    this ability, including but not limited to: |-|Hideout Raid Arc= *Search: All For One stole this Quirk
    from Ragdoll. It allows him to monitor up to 100 individuals simultaneously, including their locations
    and weak points. *Warping: All For One produces a black, viscous liquid from another person''s mouth,
    which envelops their body and functions as a warping portal. The target vanishes and reappears at
    a different location. He can create multiple portals at once to warp several people simultaneously.
    Unlike Kurogiri''s Warp Gate, this Quirk uses specific individuals as destinations rather than coordinates.
    *Air Cannon: This Quirk allows All For One to fire massive blasts of compressed air powerful enough
    to devastate multiple city blocks. He can further enhance its power by stacking unnamed strength-amplifying
    and impact-based Quirks. *Springlike Limbs: All For One can compress his muscles like springs to dramatically
    increase the force of his physical attacks and certain Quirks. *Kinetic Booster: This Quirk increases
    the amount of kinetic energy All For One can generate and release. He possessed four copies of this
    Quirk. *Strength Enhancer: This Quirk enhances All For One''s physical strength. He possessed three
    copies of this Quirk. *Rivet Stab: This Quirk allows All For One to generate vein-like appendages
    from his body, which can be used offensively and in combination with Forced Quirk Activation. *Forced
    Quirk Activation: This Quirk allows All For One to forcibly activate another person''s Quirk against
    their will, regardless of their consciousness. He used it to activate the unconscious Kurogiri''s
    Warp Gate and force him to create a portal. *Impact Recoil: This Quirk allows All For One to reverse
    the force of an incoming attack, causing the opponent to suffer the impact instead. *Infrared Ray:
    This Quirk allows All For One to perceive a limited portion of the infrared spectrum, partially compensating
    for his blindness. *Air Walk: This Quirk allows All For One to levitate and move freely through the
    air. *Multiplier: This Quirk allows All For One to generate additional arms. *Hypertrophy: This Quirk
    allows All For One to greatly enlarge his arm. *Rivet: This Quirk allows All For One to grow durable,
    rivet-like protrusions along his arm. *Spearlike Bones: All For One stole this Quirk from his deceased
    mother. This Quirk allows him to generate drill-like bone protrusions from his arm. *Life Force: This
    Quirk grants All For One unnatural longevity. *Radio Waves: This Quirk allows All For One to generate
    and disrupt radio waves, causing machines and communication devices to malfunction. *Unnamed Vibration
    Detection Quirk: This Quirk enhances All For One''s perception of his surroundings. When used alongside
    Infrared Ray, it compensates for his lack of sight and hearing while granting him exceptional spatial
    awareness. *Unnamed Lie Detection Quirk: This Quirk allows All For One to detect when someone is lying
    to him. *Unnamed Telekinesis Quirk: This Quirk allows All For One to levitate objects using his hand.
    He used it to manipulate his medical device after escaping Tartarus. *Unnamed Mind Control Quirk:
