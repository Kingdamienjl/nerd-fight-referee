  intelligence:
    text: Gifted to Genius (All For One possesses an outstanding level of intellect, likely stemming from
      his advanced age and extensive life experience, which is said to exceed a hundred years. He is the
      true mastermind behind the League of Villains, having been the one pulling the strings, coordinating
      multiple plans simultaneously, and placing contingencies well in advance, outwitting the heroes
      on numerous occasions. This is evident when he uncovered two of U.A.'s secret training facilities,
      the U.S.J. and the Beast's Forest, and had the Vanguard Action Squad under Shigaraki's command attack
      the latter to abduct Dynamight and sow discord within hero society. Through a coordinated assault
      involving his original body, Tomura/All For One, and his army of Nomu, he was able to free himself
      from Tartarus, a prison believed to be virtually impenetrable. He then orchestrated attacks on multiple
      other prisons to spread further chaos and make himself harder to track. He is highly manipulative
      and a master of exploitation, as shown when he brought Nana Shimura's grandson under his control,
      with the latter virtually worshipping him despite All For One being responsible for his grandmother's
      death. He also appears to possess a near-impeccable memory, effortlessly recalling all of the Quirks
      he has stolen and using them in tandem, making him a formidable adversary that All Might was only
      barely able to defeat in their final confrontation)
    source_ids: *id002
