- id: claim-weaknesses-f9b2cc30
  section: weaknesses
  axis: weakness
  text: 'The parts of his body that are hardened have limited range of movement and he can only maintain
    a fully hardened state for ten minutes before stopping to take a breath.My Hero Academia Volume 15
    Chapter 135 His Hardening wears off more quickly if subject to sufficiently powerful blows. He can
    only maintain Red Riot Unbreakable for periods of thirty to forty seconds and using it tires him considerably.
    Feats: Capable of jumping straight into Dabi''s flames. Real Steel stated that unlike him, Red Riot''s
    Hardened body doesn''t burn. Notable Attacks/Techniques: Hardening: Red Riot''s Quirk gives him the
    power to harden any part of his body. The ability not only protects him from physical attacks, but
    also from heat and shock waves. This Quirk also sharpens any pointed surfaces on his body, allowing
    him to slice opponents with his fingernails and hair. The drawback to his Quirk is that there is a
    limit to how much damage the hardened skin can withstand before wearing it off. *Red Gun Turret: Red
    Riot delivers a straightforward, powerful punch to his opponent. *Red Counter: While hardened, Red
    Riot endures a close-range attack with his skin, and then counters with a punch. *Red Riot Unbreakable:
    Red Riot takes the time to harden his body even further, leaving him with virtually no weak spots,
    as even his eyes become harder than steel blades. A side effect of Hardening his body to this extent
    is that his Quirk''s natural sharpness increases even further, allowing him to easily smash and cut
    through objects that are durable and sharp enough to harm him normally. However, he can only maintain
    this form for 30 to 40 seconds and doing so tires him considerably. **Killing Move: Red Gauntlet:
    Red Riot smashes through his foes'' attacks while under the effects of Red Riot Unbreakable to deliver
    a swift and decisive punch. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll
    box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}} {{Discussions|Eijirou Kirishima|Red
