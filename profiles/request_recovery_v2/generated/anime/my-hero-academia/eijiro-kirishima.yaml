- id: claim-standard-equipment-46a3c2b9
  section: equipment
  axis: equipment
  text: 'His Hero Costume, which consists of: *Chivalrous Headgear: Made to protect the nose and chin
    during head-on assaults. *Chivalrous Shoulder Guards: Emphasizes Red Riot''s intensity. It was made
    to move around easier than in previous versions. *Chivalrous Arm Covers: Red Riot worries about accidentally
    hurting people with his bare skin when holding or carrying them, so these new arm covers were made
    with polyurethane to avoid hurting civilians. *Chivalrous Cloth: Whatever Red Riot wears is bound
    to get destroyed anyway, so he opted for ragged cloth from the start. Torn-up clothing like this is
    a badge of honor for manly men.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
