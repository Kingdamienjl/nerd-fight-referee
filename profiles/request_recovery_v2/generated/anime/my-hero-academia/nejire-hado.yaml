- id: claim-weaknesses-e621521c
  section: weaknesses
  axis: weakness
  text: 'Her wave attacks tend to corkscrew, making them slow. Notable Attacks/Techniques: Wave Motion:
    Nejire Chan''s Quirk grants her the ability to convert her vitality into energy, which she can then
    expel in the form of damaging shockwaves. Nejire Wave Motion.gif|Wave Motion Quirk *Nejire Wave: Nejire
    Chan focuses enough vitality to create a powerful blastwave with only 30% of her power output. This
    wave was strong enough to take down two villains with Gigantification Quirks with one blast. Nejire
    Wave Attack.png|Nejire Wave at 30% taking down two giant villains *Nejire Flood: Nejire attacks her
    opponent with a huge blast of energy using 100% of her power output. This move was first used in a
    combination with Shoto''s Flashfire to take down a severely weakened All For One Shigaraki. Flashfire
    Fist - Jet Kindling.png|Nejire using her technique against Shigaraki *Nejire Pike: Nejire channels
    her Nejire Wave into a point, with the intention of piercing her opponent. She can also redirect it
    mid-attack. Nejire Wave Pike.png|Nejire using Pike against Shigaraki Nejire Redirects Attack.png|Redirecting
    her attack after Shigaraki used Dynamight as a shield ==Gallery== Nejire Hado Hero Costume Anime Action.png
    ==Notable Matchups== Victories: *Geten (My Hero Academia) Geten''s Profile (Final War Arc Nejire Chan
    was used. Speed was equalized) *Suneater (My Hero Academia) Suneater''s Profile (Final War Arc Nejire
    Chan and Final War Arc Suneater were used) Losses: *Hawks (My Hero Academia) Hawks'' Profile (Final
    War Arc Nejire Chan was used) Inconclusive: ==Notes/Explanations== {{Scroll box|content=}} {{Discussions|Nejire
    Hado|Nejire Chan}} Category:Characters Category:My Hero Academia Category:Female Characters Category:Manga
    Characters Category:Anime Characters Category:Good Characters Category:Humans Category:Teenagers Category:Students
    Category:Schoolgirls Category:Heroes Category:Superheroes Category:Energy Users Category:Flight Users
    Category:Vibration Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
