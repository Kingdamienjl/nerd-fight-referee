  range:
    text: Standard Melee Range
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (Having inherited his Quirk from a long line of well-known heroes, Ingenium is
      already experienced with the ins and outs of his Quirk and thus has full control over it. He is
      also responsible and extremely attentive to the point of comedy, cleaning every speck of dust from
      the training ground to prevent Uravity from using her Quirk against him.My Hero Academia Vol. 2
      Chapter 10 These traits allowed him to reach 6th place in U.A. Practical Entrance ExamMy Hero Academia
      Vol. 1 Chapter 5 and 4th in Eraser Head's Quirk Apprehension Test.My Hero Academia Vol. 1 Chapter
      7 Furthermore, he has the second highest grades in his class in a school renowned for its rigorous
      coursework.My Hero Academia Vol. 7 Chapter 60 However, his seriousness can sometimes lead to tunnel
      vision and poor judgment, as his grudge against Stain led him to abandon his post and go after the
      Hero Killer, resulting in his own captureMy Hero Academia Vol. 6 Chapter 51)
    source_ids: *id002
    confidence: 0.95
