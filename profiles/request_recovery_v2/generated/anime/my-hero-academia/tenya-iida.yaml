      with Recipro Turbo
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level+ (Able to withstand the force of his own attacks) | Multi-City Block
      level+ (Can withstand the power of Spiral's Quirk, which can hurt Tailman's tail. Withstood being
