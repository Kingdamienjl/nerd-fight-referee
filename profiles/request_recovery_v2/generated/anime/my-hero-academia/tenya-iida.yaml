- id: claim-weaknesses-8f912da0
  section: weaknesses
  axis: weakness
  text: 'After using Recipro Burst his Engine stalls for a short period of time, greatly reducing his
    effective movement speed during this time.My Hero Academia Vol. 4 Chapter 29 His engines will stall
    if he drinks carbonated sodasMy Hero Academia Vol. 2 Chapter 12 or if the mufflers are jammed.My Hero
    Academia Vol. 5 Chapter 41 Can suffer from tunnel vision during matters of great personal importance
    to him. Notable Attacks/Techniques: Engine: Ingenium''s Quirk turns his legs into engines that allow
    him to sprint at incredible speeds. He is able to shift through numerous "gears" as he picks up speed,
    only being able to reach his third gear during a fifty-meter dash. However, they also have the same
    limitations as actual engines, and will thus begin to stall if he lacks sufficient fuel (a daily allowance
    of orange juice) or if the exhaust pipes on the back of his legs are jammed. Recently, Ingenium was
    able to remove the mufflers from his legs so that he could grow new ones that would allow him to endure
    his training. After finishing his training, his Recipro Burst now lasts 10 minutes instead of 10 seconds.
    *Recipro Burst: Ingenium overclocks his engines to give himself greatly enhanced speed for ten minutes
    (which was previously ten seconds). However, after this period of increased speed ends, his engines
    will stall, thus disabling his Quirk for a significant amount of time while his engines cool down.
    This ability allowed him to take both Deku and Shoto by surprise, allowing him to steal the former''s
    headband in an instant before he was able to react. *Recipro Extend: After Ingenium manages to recover
    from the effects of Recipro Burst, he will be able to gain even more speed in another massive burst,
    allowing him to take Stain completely by surprise. *Recipro Turbo: This technique has been passed
    down from the Iida family for generations. By removing the mufflers from his legs, Ingenium is able
    to grow new mufflers capable of bearing the burden of Recipro for a longer period of time and move
    even faster than before. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll
    box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}} {{Discussions|Tenya Iida|Ingenium}}
    Category:Characters Category:My Hero Academia Category:Acrobats Category:Anime Characters Category:Brawlers
    Category:Good Characters Category:Heroes Category:Humans Category:Kick-based Fighters Category:Male
    Characters Category:Martial Artists Category:Manga Characters Category:Movie Characters Category:Mutants
    Category:Primary Protagonists Category:Protagonists Category:Students Category:Superheroes Category:Teenagers'
