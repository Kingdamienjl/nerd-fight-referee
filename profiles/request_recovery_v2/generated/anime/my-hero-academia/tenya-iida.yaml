  attack_potency:
    text: 'Multi-City Block level (Was considered physically stronger than Base DekuMy Hero Academia Vol.
      12 Chapter 102237.32 Tons of TNT), Multi-City Block level+ with Recipro Burst/Extend (Broke Stain''s
      katana with Recipro Burst, and made his hand bleed with a kick.My Hero Academia Vol. 7 Chapter 54
      Managed to break Stain''s ribs using Recipro ExtendMy Hero Academia Vol. 7 Chapter 55711.97 Tons
      of TNT) | Multi-City Block level+ (Able to cause Chimera to flinch with a kick, forcing him to release
      TentacoleMy Hero Academia: Heroes: Rising), higher with Recipro Turbo (An enhanced version of his
      Recipro Burst/Extent) | Multi-City Block level+ (Much stronger than before), higher with Recipro
      Turbo (Assisted Lemillion in repelling the Near High-Ends, although they couldn''t hurt themMy Hero
      Academia Vol. 30 Chapter 293)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman (Finished a 50-meter race in 3.04 seconds, and implied that he could have done it
      even faster if he had more time to accelerate) with Hypersonic reactions and combat speed (Can react
      to his own Recipro BurstMy Hero Academia Vol. 5 Chapter 41Mach 8.58), Hypersonic with Recipro Burst/Extend
      (Saved Shoto from a sword strike by Stain) | Supersonic with Hypersonic+ reactions and combat speed
      (Superior to Base Deku in the Joint Training Exercise, who can move at these speeds and block Nine's
      attacksMach 16.34), Hypersonic+ movement speed with Recipro Turbo (Much faster than before) | Supersonic
      with Relativistic+ reactions and combat speed (Can react to the speed of his Recipro Turbo), Relativistic+
      with Recipro Turbo (Can keep up and avoid attacks from Near High-Ends alongside Lemillion and Nejire
      Chan0.77c)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 100 (Stronger than Base Deku, who can swing a metal plate with this much forceMy Hero
      Academia Vol. 3 Chapter 2584.94 Metric Tons) | Class K (Stronger than before. Was able to briefly
      hold Chimera's strong tail100 Metric Tons) | Class K (Stronger than before)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level with Engine, Multi-City Block level+ with Recipro Burst/Extend | Multi-City
