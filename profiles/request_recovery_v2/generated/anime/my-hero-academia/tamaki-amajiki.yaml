- id: claim-weaknesses-43451862
  section: weaknesses
  axis: weakness
  text: 'Low self-esteem and suffers from anxiety issues, he is only able to manifest items he currently
    has in his system, so he must eat his repertoire every day. Notable Attacks/Techniques Manifest: This
    Quirk allows Suneater to manifest the characteristics of the things he eats. Over the 2 and a half
    years he''s been at U.A., he has trained his Quirk to incredible degrees. The training allowed him
    for size variation, concurrent manifestations, feature selection, and mixed conflagration. He seems
    to be able to make all these alterations from anywhere on his body simultaneously and generate parts
    that he hasn''t specifically eaten (such as wings and feathers from chicken or poison from eating
    takoyaki). He has also been shown to manifest things that aren''t food (such as crystals), so long
    as he''s able to consume it somehow. Suneater Quirk.png|Suneater''s Manifest Quirk *Crab Pincer/Crab
    Tentacle Hand: Suneater can transform his hand into a crab pincer strong enough to effortlessly crush
    a few guns and a sword. He later combines it with the strength of his tentacle fingers to make a stronger
    version that he uses to hold enemies back in hand-to-hand combat. *Octopus Neurotoxin: Suneater can
    generate the naturally occurring neurotoxin found in an octopus'' saliva, and can adjust the toxicity
    to avoid killing his opponent. *Clam Hand/Clam Shield: Transforming his hand into a clam''s shell,
    he uses it to deliver hardened strikes to an enemy. Later, he shows a more powerful version by generating
    a giant clamshell from his back to protect his entire body. He can do it fast enough that he does
    in mid-air as he jumps, closing the shell in a way to precisely clamp multiple enemy weapons. *Chimera
    Kraken: Suneater generates several giant tentacles and covers parts of them and his body with crab
    armor as well as giving each tentacle crab pincers, combining the muscular strength of the tentacles
    and the crab''s toughness to easily swoop enemies around in a large area. MHA VHCK.png|Chimera Kraken
    *Crystal Chicken Talon: Suneater transforms part of his legs into tentacle muscles to give them superior
    strength and reach, while also transforming his foot into a giant chicken talon covered in hard sharp
    crystals, then using it to deliver a powerful frontal kick. *Chimera Centaur: Suneater uses his Quirk
    to transform into a centaur and charge into the enemy ranks while using his arms to summon different
    types of fruit and knock out his opponents in an instant. *Octopus Mirage: Suneater replicates the
    cloaking abilities of octopuses to mask his presence with the surroundings so he can attack his target
    by surprise. *Scorpius Toxin: Suneater manifests scorpion tails on his body with which to attack his
    opponent and inject venom into them. MHA SE OC.png|Octopus Mirage + Scorpius Toxin *Plasma Cannon:
    Suneater transforms his arm into a monstrous form with the attributes of multiple manifestations,
    which when combined with Nejire''s energy, can produce a giant laser blast. Elements that make up
    this combination include but are not limited to, zebra tarantula, dragonfruit, spider crab, sika deer,
    American alligator, green sea turtle, locust, red sea urchin, soft shell turtle, watermelon, and moso
    bamboo. Suneater Plasma Cannon.png|Suneater''s Plasma Cannon charging up Suneater PC Fired.png|Suneater
    using Plasma Cannon against Shigaraki ==Notable Matchups== Victories: Losses: *Nejire Chan (My Hero
    Academia) Nejire''s Profile (Final War Arc Suneater and Final War Nejire Chan were used) Inconclusive:
    ==References== {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{Scroll box|content=}}
    {{Discussions}} Category:Characters Category:My Hero Academia Category:Anime Characters Category:Good
    Characters Category:Heroes Category:Humans Category:Male Characters Category:Manga Characters Category:Poison
    Users Category:Power Mimicry Users Category:Superheroes Category:Teenagers Category:Transformation
    Users Category:Food Users Category:Empowerment Users Category:Students Category:Devourers'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-bee8664e
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Content= |-|Base= {{Border|Scroll=Yes|Visible=No|Content= *Superhuman
    Physical Characteristics *Enhanced Senses (Was able to recognize and dodge an attack that came from
    behind himMy Hero Academia: Team-Up Missions Vol 1) *Transformation (Can manifest the parts and capabilities
    of whatever he eatsMy Hero Academia: Chapter 132) *Statistics Amplification (Can increase his physical
    abilities by manifesting certain animal parts) *Fusionism (Can fuse multiple traits of whatever he
    eats to manifest hybrid forms) *Limited Power Mimicry (Copied and manifested a villain''s Quirk by
    eating parts of his bodyMy Hero Academia: Chapter 141)}} |-|Manifest= {{Border|Scroll=Yes|Visible=No|Content=
    *Body Control (He can generate and control the characteristics of the things he has eaten, being able
    to use them simultaneously without problems) *Bodily Weaponry (Can generate many types of animal parts
    depending on what he has eaten, like a bird''s talonsMy Hero Academia: Chapter 132 or a crab''s pincersMy
    Hero Academia Chapter 140) *Additional Limbs (Can spawn additional limbs such as the tentacles of
    an octopusMy Hero Academia: Chapter 132 or the legs of a horseMy Hero Academia: Chapter 265) *Poison
    Manipulation (Can manifest the neurotoxin of an octopus, which he can use to paralyze an opponent.
    Can also produce the venom of a scorpionMy Hero Academia: Chapter 360) *Crystal Generation (After
    consuming a crystal created by a villain''s quirk, he was able to generate those same crystals) *Flight
    (Can grow wings that allow him to fly after eating certain types of birds, such as quail eggsMy Hero
    Academia: School Briefs IV) *Camouflage (Can use the camouflage ability of an octopus to enhance his
    stealth) *Energy Projection (Can use the energy projection ability of Nejire Chan''s Wave Motion for
    his Plasma CannonMy Hero Academia: Chapter 362)}} }}'
  source_ids: *id003
  decisive: true
  status: unverified
