- id: claim-weaknesses-aa5ce71f
  section: weaknesses
  axis: weakness
  text: 'His Quirk is only usable through his hands and becomes powerless if they are restrained or destroyed.
    He must disassemble himself in order to recover. He also suffers from severe mysophobia, the fear
    of germs. Feats: *Killed Magne by disassembling her with his power. *Splattered Mr. Compress'' arm.
    *Held his own against Deku who had Eri''s Quirk on his side. *Mortally wounded Sir Nighteye with his
    spikes. Notable Attacks/Techniques Overhaul: This Quirk gives him the ability to instantly disassemble
    anything he touches with his hands, allowing him to instantly turn Magne''s upper body and Mr. Compress''
    arm into a blood splatter with the lightest touch. He can also reassemble things he has destroyed
    if he so wishes, rendering the Reservoir Dogs completely healthy after destroying them, repeatedly
    disassembling and reassembling Eri in order to continually extract her blood for use in creating Quirk-Destroying
    Bullets, and healing his own injuries by disassembling and reassembling himself in an instant. In
    addition, he can modify the things he reassembles, allowing him to turn the floor he shattered into
    rows upon rows of jagged stone pillars to impale others with. Perhaps the most monstrous use of this
    ability is his ability to fuse two disassembled objects together to combine their traits, doing this
    to his own henchmen, Nemoto and Katsukame, on two separate occasions in order to become a massive
    monstrosity with access to their Quirks. ==Gallery== Overhaulquickgif.gif|Using disassemble to kill
    Magne SpikesMHA.gif|Using reassemble to make spikes Kai Chisaki One''s Justice 2 Design.png|Overhaul
    in My Hero One''s Justice 2 Chisaki Ver.2.png|Overhaul (Nemoto Fusion) in My Hero One''s justice 2
    ==Notable Matchups== Victories: *Nine (My Hero Academia) Nine''s Profile (Base Overhaul and Restrained
    Nine were used) *Ken Kaneki (Tokyo Ghoul) Kaneki''s Profile (Nemoto Fusion Overhaul and Part 1 Kaneki
    were used. Speed was equalized) Losses: *Ken Kaneki (Tokyo Ghoul) Kaneki''s Profile (Nemoto Fusion
    Overhaul and Post-Rose Kaneki were used. Speed was equalized) *Ken Kaneki (Tokyo Ghoul) Kaneki''s
    Profile (Nemoto Fusion Overhaul and Part 1 Kaneki were used, and Kaneki had prior knowledge. Speed
    was equalized) Inconclusive: ==References== {{Scroll box|content={{reflist|2}}}} ==Notes/Explanations==
    {{Scroll box|content=}} {{Discussions|Kai Chisaki|Overhaul}} Category:Characters Category:My Hero
    Academia Category:Manga Characters Category:Anime Characters Category:Male Characters Category:Evil
    Characters Category:Antagonists Category:Villains Category:Humans Category:Adults Category:Leaders
    Category:Earth Users Category:Resurrection Users Category:Healers Category:Biology Users Category:Bodily
    Weaponry Users Category:Fusionism Users Category:Deconstruction Users Category:Matter Users Category:Power
    Nullification Users Category:Fusions Category:Additional Limbs Users Category:Body Control Users Category:Mind
    Users Category:Absorption Users Category:Life Users Category:Statistics Amplification Users Category:Size
    Users Category:Statistics Reduction Users Category:Large Sized Characters Category:Stone Walls'
  source_ids: *id003
  decisive: false
