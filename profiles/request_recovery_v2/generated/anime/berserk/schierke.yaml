- id: claim-weaknesses-4ceed246
  section: weaknesses
  axis: weakness
  text: 'Some of her stronger spells take time to cast, and is very exhausted afterwards if she uses her
    strongest spells. Her physical body is vulnerable when she''s in her astral state. If her alignment
    with a spirit is too strong, she will not be able to end her spell. Notable Attacks/Techniques: Elemental
    Magic: Schierke''s most used ability is to summon elementals, usually fire manipulating ones (Salamanders).
    She can also summon elementals of wind (Sylphs), elementals of water (Undines), elementals of earth
    (Gnomes) and elementals of weight (Barytes). Summoning entities: Schierke is also capable of summoning
    numerous powerful entities, by contacting them at astral plane. It depends on the entity if they agree
    to help. Can summon them all at the same time, though it''s unknown if she can do so in the physical
    world, as it took place in Casca''s mind. *Wheel of Flame: The Wheel of Flame is a great flame spirit
    which resides in battlefields. It is "the scorching blaze that drives hell fire and burns away the
    battlefield", as it declares when it is in possession of Schierke''s body which she lent in return
    of its help. *Rotting Root Lord: The Rooting Rood Lord is an unknown entity being able to decay hundreds
    of opponents on the battlefield to nothingness. *Lady of the Deep Water: Lady of the Deep Water is
    an entity that can manipulate water on a large scale, such as when she sent a large flood on the Enoch
    village. Note: Her spells of summoning entities are likely limited to the locations she''s in, as
    she needs to contact them at specific place in the astral plane. ==Notable Matchups== Victories: Losses:
    Setsuna Tokage (My Hero Academia) Lizardy''s Profile (Speed was equalized, starting distance was 15
    meters with no line of sight and both had prior knowledge) Inconclusive: {{Discussions}} Category:Berserk
    Category:Female Characters Category:Characters Category:Good Characters Category:Magic Users Category:Deconstruction
    Users Category:Fire Users Category:Air Users Category:Summoners Category:Sealing Users Category:Witches
    Category:Mind Users Category:Telepaths Category:Light Users Category:Darkness Users Category:Forcefield
    Users Category:Paralysis Users Category:Element Users Category:Earth Users Category:Staff Users Category:Hair
    Users Category:Non-Physical Interaction Users Category:Gravity Users Category:Plant Users Category:Extrasensory
    Perception Users Category:Memory Users Category:Astral Projection Users Category:Adventurers Category:Healers
    Category:Empowerment Users Category:Danmaku Users Category:Humans Category:Protagonists Category:Teenagers
    Category:Dream Users Category:Hat Users Category:Animal Communicators Category:Fantasy Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a0ef3e09
  section: abilities
  axis: hax
  text: Magic, Extrasensory Perception (Schierke is in tune with the surrounding life-force around her,
    and can sense someone's life force, allowing her to track beings and interact with them. Can see souls),
    Non-Physical Interaction (Can interact with spirits), Elemental Manipulation (Can manipulate all four
    elements with the help of elementals), Water Manipulation (Could summon a massive flood over the town
    of Enoch using the help of Lady of the Deep Water, and can manipulate liquids with the help of water
    elementals Undines), Fire Manipulation (With Salamanders, the fire elementals. Can manipulate flames
    in various ways, such as summoning little fire elementals by turning her hair into them or summoning
    the Wheel of Fire spirit), Earth Manipulation (With Gnomes, the earth elementals), Air Manipulation
    (With Sylphs, the air elementals. Can summon large winds and air slashes), Mind Control (Can manipulate
    person's "od" [life-force] to confuse them and change their attentions. She can also hypnotize them
    or change their behaviour. Should also be able to summon Barytes, that can produce depression and
    obsession in a target), Summoning (Can summon various elementals and spirits. Summoned many dirt golems
    that can regenerate unless their weak points are destroyed), Danmaku and Hair Manipulation (Can use
    hair as a catalyst to project the power of fire elementals and can send it as multiple projectiles),
    Memory Manipulation (Could erase one of Guts' memories), Minor Dream Manipulation (Stated that she
    could dispel Guts' nightmares), Empowerment (Her magic is most powerful during full moon), Deconstruction
    (With the help of Rotting Root Lord, which can instantly decay any opponent. However, it is not combat
    applicable without prep, as she needs to visit him in the astral plane and ask him for help), Healing
    (Up to Low-Mid with Elf Dust made by her elf companion Ivalera), Paralysis Inducement (Could paralyze
    a man by tapping her wand on his forehead), Limited Plant Manipulation (Can make plants grow. Could
    tie Isidro with vines), Light Manipulation (Can generate light from her wand), Darkness Manipulation
    (Could engulf another witch in darkness to blind her), Telepathy (Can telepathically communicate with
    people over long distances. Can see someone's point of view. Can also read someone's memories and
    talk to animals, which allows her to give them orders), Astral Projection (Can separate her astral
    form from physical body), Limited Sealing (Over curses. Could weaken Casca's and Guts' Brands of Sacrifice
    with a seal), Forcefield Creation (Can create astral barriers that incinerate opponents upon contact,
    and can cast Formation of the Four like Farnese, however it's only fully effective against astral
    beings and only half as effective against physical beings), possibly Gravity Manipulation (Should
    be able to summon Barytes, elementals of weight, that can make objects heavy and make the sky dark)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
