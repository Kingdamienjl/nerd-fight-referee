    that allows Serpico to control the small wind spirits.Berserk - Chapter 203 It can cut and tear up
    enemies by sending the wind and it can even send more than one wave to dispose of many enemies at
    once. The wind can also be used to blow away enemy defenses. The full moon increases the power of
    the Sylph sword and cloak''s magic. Serpicosylphsword.png|Serpico using the Sylph Sword *Sylph Cloak:
    Inhabited by the same magic wind spirits as the Sylph Sword, it makes his body more buoyant like laundry
    dancing on the wind, thus increasing his jumping height, granting flight and allowing air maneuverability.
