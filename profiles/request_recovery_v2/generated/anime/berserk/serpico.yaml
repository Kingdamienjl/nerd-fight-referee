  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= |-|Base= *Superhuman Physical Characteristics
    *Weapon Mastery (Serpico is a skilled fencer, displaying insane accuracy such as stabbing through
    four falling leaves at once.Berserk - Chapter 186 In their first duel, Serpico was able to stop Guts
    from drawing his sword and crossbow. Guts then stated that he was unable to read his attacks and that
    he is an incredible swordsman and a skilled fighter.Berserk - Chapter 149Berserk - Chapter 150 Could
    easily take down three Kushan bandits at onceBerserk - Chapter 174) **Acrobatics (Is immensely agile
    in combat, being able to jump across vertical pillars,Berserk - Chapter 257 jump over Guts'' sword,Berserk
    - Chapter 125 swing himself around a cliffBerserk - Chapter 150 and pull himself up to thrustBerserk
    - Chapter 149 or dodgeBerserk - Chapter 257) **Analytical Prediction (Anticipated that Guts would
    thrust his sword at him and that he would collapse the arcs on top of him, thing which he intended
    to use to finish himBerserk - Chapter 257) *Preparation (Information Preparation; In both of his duels
    against Guts, Serpico used the information he had of him to confront him in spaces which greatly hinder
    him. In their first duel he fought Guts across a cliff, which hindered his movement and allowed Serpico
    to prevent him from drawing his sword,Berserk - Chapter 149 on top of that, Serpico also positioned
    himself with the sun and wall to his favor.Berserk - Chapter 150 In their second duel Serpico fought
    Guts in a room filled with pillars which limited the power and speed Guts could achieve with his sword,
    these pillars were also greatly helpful to Serpico in evading attacks and moving around. Serpico could
    also predict that Guts would end up collapsing the arcs and intended to use this for his finishing
    moveBerserk - Chapter 256Berserk - Chapter 257) *Accelerated Development (Abilities; Learnt how to
    use the wind elementals of the Sylph Cloak and Sword in a short period of time.Berserk - Chapter 211
    Was able to use Guts'' miniature bomb after only seeing it onceBerserk - Chapter 150) *Social Influencing
    (Deception; Usually hides his skill and strength as a swordsman as to catch opponents off-guard or
    avoid conflictBerserk - Chapter 174Berserk - Chapter 125 Lied to Guts in order to provoke himBerserk
    - Chapter 150) *Pick-Pocketing (Could pick Guts'' pocket and steal a miniature bomb in the middle
    of their fightBerserk - Chapter 150) *Enhanced Senses (Can perceive Puck, which is imperceptible to
    normal peopleBerserk - Chapter 123) |-|Sylph Cloak & Sword={{Border|Scroll=No|Visible=No|Padding=Yes|Content=All
    previous abilities plus: *Air Manipulation & Magic (Serpico can manipulate the wind elementals to
    send ranged slashes that cut upBerserk - Chapter 212Berserk - Chapter 213 and tear apart enemies,Berserk
    - Chapter 314 on top of this he can also blow away enemy defenses.Berserk - Chapter 212 Defensively,
    he can blow away threats or create a wall of windBerserk - Chapter 212) **Flight (Can flyBerserk -
    Chapter 239) **Enhanced Acrobatics (With support from the wind, Serpico can leap great distancesBerserk
    - Chapter 209 and not take damage from fallingBerserk - Chapter 211) **Forcefield Creation (Can create
    walls of wind that block and deflect attacks.Berserk - Chapter 212 Serpico can also apply this to
    his sword in order to block attacks with itBerserk - Chapter 274) *Empowerment (His sword and cloak
    become stronger during a full moonBerserk - Chapter 314) }} }}'
