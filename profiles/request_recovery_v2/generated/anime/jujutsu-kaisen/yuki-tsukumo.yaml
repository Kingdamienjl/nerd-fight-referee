  attack_potency:
    text: At least Large Town level (Yuki is among the elite as one of only four special grade sorcerers,
      wielding unconventional abilities that remain largely mysterious to Jujutsu Headquarters. Being
      a special grade puts her at around the same output as other special grades382.57 Kilotons. Despite
      severe injuries, including a broken arm, she maintains a formidable offense, pressuring Kenjaku
      with improvised attacks. Maki suggests Yuta and Yuki share a similar level of power, while Tengen
      implies their capabilities are interchangeable), higher with Garuda (Garuda is a shikigami capable
      of using Yuki's cursed technique to transform itself into a cursed tool. She can wield Garuda like
      a whip and transform into a ball to strike down her enemies. With Garuda she can casually block
      attacks from formidable opponents like Uraume and has demonstrated incredible strength by destroying
      Ganesha, a Special Grade Curse from an Asian god, with a single hit), Large Planet level with Black
