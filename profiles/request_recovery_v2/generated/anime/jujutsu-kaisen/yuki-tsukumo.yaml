  intelligence:
    text: Gifted (Yuki is an enigmatic and exceptionally powerful fighter, one of only four Special Grade
      Sorcerers, with unorthodox abilities that Jujutsu Headquarters knows little about. Despite her secretive
      nature, Yuki possesses elite combat instincts and proficiency in jujutsu, including barrier techniques
      and domain expansion. She also excels at mentoring students, as evidenced by her role in introducing
      and guiding Aoi Todo to become an exceptional Grade 1 sorcerer. Despite not officially being a teacher
      at Jujutsu High, Yuki's influence on fostering elite talent is undeniable. She also researched souls,
      and her goal was to rid the world of cursed spirits. She traveled around the world searching for
      ways to achieve that. Yuki demonstrates exceptional combat analysis skills, meticulously observing
      her opponents' techniques and devising countermeasures on the fly. She can identify cursed spirits
      from foreign origins with just a glance, showcasing her deep understanding of jujutsu. Yuki rapidly
      grasps the mechanics of complex jujutsu techniques, such as Kenjaku's manipulation of gravity, including
      its range and activation intervals, with minimal exposure. She collaborates with others, like Tengen,
      to formulate intricate plans to confront powerful adversaries like Kenjaku, demonstrating strategic
      foresight and adaptability)
    source_ids: *id002
    confidence: 0.95
