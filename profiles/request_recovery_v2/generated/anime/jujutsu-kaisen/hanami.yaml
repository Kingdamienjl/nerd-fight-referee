- id: claim-weaknesses-c8b2856b
  section: weaknesses
  axis: weakness
  text: "The branches on Hanami's head are their weak point, and thus not as durable as the rest of their\
    \ body. Their large tree attacks sacrifice power and speed in exchange for wide range. Notable Attacks\
    \ and Techniques: *Disaster Plants: Hanami's technique allows them to manifest the illusions of cursed\
    \ plants into reality. While the appears to be manipulating its cursed energy, they're actually creating\
    \ the cursed plants they control with cursed energy. Any plant or wood attack can be erased from reality\
    \ just as quickly as it is manifested. **Roots (\u306E Kinone?): Hanami can create roots that emerge\
    \ from the ground. When they limit the reach and numbers of roots, their power and speed increase.\
    \ Vice versa, they can greatly expand the number of roots and their range by sacrificing speed and\
    \ destructive power. **{{Nihongo|Wooden Ball|{{Ruby|\u6728|\u304D}}\u306E{{Ruby|\u6BEC|\u307E\u308A\
    }}|Kinomari}}: Hanami can create a single or multiple wooden balls from cursed energy. The balls propel\
    \ one or two sharp branches attack and skewer their target and then disintegrate. Hanami can also\
    \ use these to suspend themself in midair. **{{Nihongo|Cursed Bud|{{Ruby|\u546A|\u306E\u308D}}\u3044\
    \u306E{{Ruby|\u7A2E|\u3057\u3085}}{{Ruby|\u5B50|\u3057}}|Noroi no Shushi}}: Hanami can launch buds\
    \ that feed on the cursed energy of whoever it attaches to. The more techniques the person uses, the\
    \ deeper its roots will extend into their bodies. Hanami can also create a giant flower that spawns\
    \ a barrage of cursed buds. **{{Nihongo|Flower Field|\u304A{{Ruby|\u82B1|\u306F\u306A}}{{Ruby|\u7551\
    |\u3070\u305F\u3051}}|Ohanabatake}}: Hanami can create a circle of flowers around their opponents\
    \ that distracts them with a curse that takes away their desire to fight. Hanami can launch a long\
    \ range projectile that can activate this ability as well. Flower Field can be weakened depending\
    \ on Hanami's injuries and Aoi considered it to be one of the curse's weaker moves. *{{Nihongo|Domain\
    \ Expansion: Shining Sea of Growing Branches|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF|\u3044\
    \u304D}}{{Ruby|\u5C55|\u3066\u3093}}{{Ruby|\u958B|\u304B\u3044}}\u300C{{Ruby|\u6736|\u3060}}{{Ruby|\u9824\
    |\u3044}}{{Ruby|\u5149|\u3053\u3046}}{{Ruby|\u6094|\u304B\u3044}}\u300D|Ry\u014Diki Tenkai: Dai K\u014D\
    kai}}: Hanami possess the ability to cast Domain Expansion. The cannot-miss ability of the domain\
    \ is the beam that is charged with Hanami's left arm. Hanami attempted to expand their domain during\
    \ their fight against Aoi and Yuji after they charged the flower on they shoulder with cursed energy\
    \ to prevent them from avoiding their technique. However, this was interrupted when the Curtain keeping\
    \ out Gojo was dispelled. *{{Nihongo|Domain Amplification|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF\
    |\u3044\u304D}}{{Ruby|\u5C55|\u3066\u3093}}{{Ruby|\u5EF6|\u3048\u3093}}|Ry\u014Diki Ten'en}}: By expanding\
    \ their Domain thinly over themself without imbuing the space with their Cursed Technique, Hanami\
    \ can draw in and neutralize other Cursed Techniques at the cost of being unable to use their own.\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll box|content={{Reflist|2}}}}\
    \ {{discussions|Hanami}} Category:Characters Category:Antagonists Category:Spirits Category:Martial\
    \ Artists Category:Immortals Category:Regeneration Users Category:Incorporeal Characters Category:Abstract\
    \ Entities Category:Non-Physical Interaction Users Category:Energy Users Category:Energy Projection\
    \ Users Category:Plant Users Category:Wood Users Category:Stealth Masters Category:Mind Users Category:Power\
    \ Absorption Users Category:Absorption Users Category:Pocket Reality Users Category:Homing Attack\
    \ Users Category:Power Nullification Users Category:Anime Characters Category:Manga Characters Category:Jujutsu\
    \ Kaisen Category:Misanthropes Category:Murderers Category:Evil Characters Category:Leaf Users"
  source_ids: *id003
