power_scale:
  tier:
    text: '{{8-B}}, higher with Shapeshifting and Self Embodiment of Perfection | {{8-B}}, higher with
      Shapeshifting, Polymorphic Soul Isomer and Self Embodiment of Perfection, far higher with Black
      Flash, {{8-A}} with Instant Spirit Body Of Distorted Killing'
    source_ids: &id002
    - mediawiki-4651171
    confidence: 0.95
  attack_potency:
    text: 'City Block level (Is a Special Grade Cursed Spirit, making him superior to Semi-Grade 1 Sorcerers
      and below as a sorcerer must be at least Grade 1 to defeat a Special Grade Curse. Could contest
      Nanami), higher with Shapeshifting (Can morph his body into sharper shapes capable of easily piercing
      Yuji''s hands and torso) and Self Embodiment of Perfection (Domain Expansion boosts the stats of
      the userJujutsu Kaisen, Chapter 15: "Domain") | City Block level+, higher with Shapeshifting (Cut
      into Yuji''s face and could''ve split his skullJujutsu Kaisen, Chapter 121: "The Shibuya Incident,
      Part 39"), Polymorphic Soul Isomer (Burns through multiple souls at once to deliver powerful blows
      capable of staggering and bruising TodoJujutsu Kaisen, Chapter 129: "The Shibuya Incident, Part
      46") and Self Embodiment of Perfection, far higher with Black Flash (Launched Yuji off his feet
      and caused him to cough out blood. Bruised Todo''s torso and made him bleed profusely out of his
      mouth, taking him out of the fight, despite Todo concentrating all his Cursed Energy to his stomach
      to minimize the damage), Multi-City Block level with Instant Spirit Body Of Distorted Killing (Is
      200% stronger than before, a binding vow imposed on himself to not transfigure his body except from
      his blades further increases his strength.Jujutsu Kaisen, Chapter 132, Volume 15 Extras Would have
      torn Yuji to shreds if he hadn''t been hit by his Black Flash. Created a hole in the ground by slamming
      Yuji into it)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic (Comparable to the likes of Yuji and Nanami) | At least Subsonic (He is using 120%
      of their full potency)
    source_ids: *id002
