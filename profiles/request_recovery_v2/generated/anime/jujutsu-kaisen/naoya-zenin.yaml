  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Sorcerer= *Genius Intelligence *Cursed
    Energy Manipulation (Advanced Sorcerer) **Vector Manipulation (Projection Sorcery allows the user
    to trace a predetermined set of movements to move themselves in combatJujutsu Kaisen Chapter 111)
    ***Statistics Amplification (Maintaining Projection Sorcery allows the user to continuously build
    speed which also increases the force behind their attacks) ***Limited Enhanced Senses, Analytical
    Prediction (Projection SorceryJujutsu Kaisen: Chapter 111 requires the user trace 24 predetermined
    movements over tens of meters in their field of view. And due to the repercussion of freezing if those
    movements aren''t followed, this requires the users to predict their opponents movements throughout
    those 24 movements. Additionally, Naoya will also anticipate counterattacks as well within his movements)
    ***Limited Sealing (Anything touched by Naoya''s palm must abide by the 1/24 FPS rule when moving,
    failure to do so causes instability in their movement and results in staying frozen for one second
    in a frame. This can be applied to liquids too) ***Afterimage Creation (Projection Sorcery has shown
    to create afterimages for brief momentsJujutsu Kaisen Chapter 141) **Possibly Unconventional Instinctive
    Action (Falling Blossom Emotion is an Anti-Domain technique that coats the user in Cursed Energy that
    automatically counterattacks when the guaranteed hit of a Domain Expansion makes contact with themJujutsu
    Kaisen Chapter 108) *Martial Arts Limited Resistance to: *Paralysis Inducement (Projection Sorcery
    ignores being in a bind and still allows the user to move regardlessJujutsu Kaisen Chapter 142) |-|Vengeful
    Cursed Spirit= *Cursed Spirit Abilities *Body Control & Additional Limbs (Has numerous tendrils that
    can be shaped and controlled) *Improved Sealing, Explosion Manipulation & Non-Physical Interaction
    (Naoya''s previous application of Projection Sorcery allows him to freeze people in place for 1 second
    and then he is able to attack them unguarded, while in his cursed spirit form he showcases the ability
    to freeze air itself and not only that but can now freeze several meters ahead of him creating multiple
    frames of frozen air which he can punch causing them to explodeJujutsu Kaisen Chapter 193) *Flight
    *Domain Expansion (Type 1) **Durability Negation (Cellular; Shoots out reels into those within the
    domain as the guaranteed hit, after these are implanted into the target Naoya''s curse technique is
    activated and operates similar to how Projection Sorcery works but within the domain it targets the
    individual cells of the person making them also have to abide by the 1/24 rule or else their cells
    will get out of whack causing damage to the person''s bodyJujutsu Kaisen Chapter 198) }}'
