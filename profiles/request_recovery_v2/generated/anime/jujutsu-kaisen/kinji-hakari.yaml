- id: claim-weaknesses-de5a8118
  section: weaknesses
  axis: weakness
  text: "During the Jackpot state, Hakari can only use his unlimited energy for 4 minutes 11 seconds,\
    \ losing the effect as soon as it ends. At other times, this count gets shorter, depending on his\
    \ luck. Notable Attacks and Techniques: *{{Nihongo|Binding Vow|{{Ruby|\u7E1B|\u3057\u3070}}\u308A\
    |Shibari}} Binding Vows are contracts created through cursed energy that an individual can make with\
    \ one's self or another person. The act of abiding by the rules and restrictions agreed upon in these\
    \ contracts can result in a greater power or the achievement of a goal, but breaking a binding vow\
    \ has uncanny repercussions. He survived an Explosion thanks to a binding vow to sacrifice his left\
    \ arm so the rest of him would be unharmed. *Rough Cursed Energy: Hakari's cursed energy is apparently\
    \ has a much rougher texture to it than others. He was told by Satoru Gojo that his cursed energy\
    \ has an \"edge\", giving his blunt attacks a sharp cutting effect. Regardless of how much or how\
    \ little force Hakari puts behind a blow, his opponent will be struck with a sharp pain regardless.\
    \ Yuji compares it to being hit with a serrated bat and Charles likened it to sandpaper. *Private\
    \ Pure Love Train: A pachinko-themed technique that is primarily applied through domain expansion.\
    \ The cursed technique imbued into the domain manifests Private Pure Love Train, a pachinko game inspired\
    \ by the eponymously named romance manga series. However, Kinji can summon the visual effect indicators\
    \ of the game such as the shutter doors outside of his domain. **{{Nihongo|Domain Expansion: Idle\
    \ Death Gamble|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF|\u3044\u304D}}{{Ruby|\u5C55|\u3066\u3093\
    }}{{Ruby|\u958B|\u304B\u3044}}\u300C{{Ruby|\u5750|\u3056}}{{Ruby|\u6BBA|\u3055\u3064}}{{Ruby|\u535A\
    |\u3070\u304F}}{{Ruby|\u5F92|\u3068}}\u300D|Ry\u014Diki Tenkai\u30FBZasatsu Bakuto}}: A pachinko-themed\
    \ domain expansion that creates an environment resembling a train station that hosts a game of chance.\
    \ Kinji's primary goal is to line up three of the same numbers to hit a jackpot with only a 1/239\
    \ chance of doing so the user's goal is to hit the jackpot by lining up three of the same symbols\
    \ decorated with the characters of Private Pure Love Train. The jackpot bonus grants the user unlimited\
    \ cursed energy and a fully automatic Reverse Cursed Technique for four minutes and eleven seconds,\
    \ the duration of the Private Pure Love Train theme song, \"Admiring You\". The user must participate\
    \ in the flow of the game in order to hit the aforementioned jackpot, with only a one in two-hundred\
    \ and thirty-nine chance of doing so. All the rules of the game are transferred into the opponent's\
    \ brain through the domain's sure-hit effect. This process is harmless, and as a trade-off, the construction\
    \ and cursed technique infusion of this domain are extremely fast, activating in less than 0.2 seconds.\
    \ This also makes Idle Death Gamble very effective in a clash of domains. **One Consecutive Effect\
    \ Sequence: Hakari can redo one consecutive effect sequence. For Private Pure Love Train, the probability\
    \ of hitting the jackpot is over 20% on the first activation so it's a visual effect with high chances.\
    \ for that reason, the risk of drawing a dud is greater during normal times. So he usually doesn't\
    \ use it unless he has increased probability. **Unkillable Mode: Hitting the jackpot of Idle Death\
    \ Gamble grants Kinji a bonus of unlimited cursed energy for four minutes and eleven seconds, the\
    \ exact duration of the Private Pure Love Train theme song \"Admiring You\", which plays throughout\
    \ the round. The limitless cursed energy causes Kinji's body to reflectively use reverse curse technique\
    \ to automatically heal any injury, making him temporarily unkillable after hitting a jackpot. ==Gallery==\
    \ File:Kinji Hakari (Anime).png|Anime render ==Notable Matchups== Victories: Losses: *Yuki Tsukumo\
    \ (Jujutsu Kaisen) Yuki's Profile (SBA was assumed, no equal speed) Inconclusive: ==References== {{scroll\
    \ box|content={{Reflist|2}}}} {{discussions|Kinji Hakari}} Category:Characters Category:Jujutsu Kaisen\
    \ Category:Anime Characters Category:Manga Characters Category:Teenagers Category:Telekinesis Users\
    \ Category:Summoners Category:Martial Artists Category:Sorcerers Category:Supernatural Luck Users\
    \ Category:Regeneration Users Category:Statistics Amplification Users Category:Supernatural Willpower\
    \ Users Category:Pain Users Category:Pocket Reality Users Category:Law Users Category:Information\
    \ Users Category:Data Users Category:Causality Users Category:Immortals Category:Instinctive Action\
    \ Users Category:Purification Users Category:Adults Category:Male Characters Category:Gamblers Category:Humans\
    \ Category:Acrobats Category:Vector Manipulation Users Category:Power Nullification Users Category:Homing\
    \ Attack Users Category:Teleportation Users Category:Dimensional Travel Users Category:Subjective\
    \ Reality Users Category:Non-Physical Interaction Users Category:Energy Users Category:Invisibility\
    \ Users Category:Information Analysis Users Category:Biology Users Category:Enhanced Senses Users\
    \ Category:Accelerated Development Users Category:Aura Users Category:Rage Users Category:Empowerment"
