- id: claim-powers-and-abilities-0578e830
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= |-|Culling Game Arc= *Cursed Energy Manipulation
    (Advanced Sorcerer) *Genius Intelligence & Accelerated Development (Training & Battle - Abilities;
    Reached the level of a Grade 1 Sorcerer in just twelve days after awakening his Cursed Technique by
    learning the basics of Barrier Techniques thanks to his Domain and then working backward to get a
    grasp on Cursed Energy Reinforcement and Control.Jujutsu Kaisen, Chapter 165 Later during his fight
    with Sukuna, his talent was said to be equal to Gojo''s when he learned how to use Domain Amplification
    after becoming a sorcerer less than two months ago.Jujutsu Kaisen, Chapter 247 He then learned Reverse
    Cursed Technique on the spot after Sukuna severed his arms) *Summoning (Of his gavelJujutsu Kaisen,
    Chapter 163 and his Shikigami "Judgeman"Jujutsu Kaisen, Chapter 164) **Weapon Mastery (Can effectively
    wield his gavel and the Executioner''s Sword in combat) **Weapon Control (Can alter the shape and
    size of his gavel, allowing him to use it like a hammer, mallet, staff or hook, he can also freely
    de-summon and summon it back into either of his hands) *Domain Expansion (Type 1 minus Homing Attack;
    Deadly Sentencing is a Non-Lethal Domain that embeds the rules of Higuruma''s Cursed Technique into
    its barrier. It has the appearance of a court and functions as such with Higuruma acting as the prosecuter,
    outlining the procedings, whilst his opponent is the defendant) which grants: **Retrocognition & Clairvoyance
    (Judgeman knows everything about everyone inside the Domain, this information is not shared with Higuruma,
    and uses this knowledge to put Higuruma''s opponent on trial for a crime they have committed in the
    past) **Limited Creation (Judgeman submits a piece of evidence of the crime to Higuruma which materializes
    in an envelope) **Limited Law Manipulation & Limited Teleportation (The Domain forbids violence, preventing
    attacks from landing and teleporting those who try attacking back to their original spot) **Sealing
    & Limited Statistics Reduction (A guilty verdict results in the penalty of confiscation which makes
    the defendant''s Cursed Technique temporarily unusable, if they don''t have a technique then their
    Cursed Energy will be confiscated instead. If the defendant was carrying a Cursed Tool when they were
    convicted then that will be confiscated above all else.Jujutsu Kaisen, Chapter 245 Removing a sorcerer''s
    ability to use their Cursed Technique also weakens their foundational control of Cursed EnergyJujutsu
    Kaisen, Chapter 165) **Weapon Creation & Death Manipulation (Getting the death penalty allows Higuruma
    to turn his gavel into the Executioner''s SwordJujutsu Kaisen, Chapter 166 which will kill the one
    sentenced to death without exception if it cuts them. This ability can distinguish between souls inhabiting
    the same bodyJujutsu Kaisen, Chapter 246) |-|Shinjuku Showdown Arc=All previous abilities enhanced
    plus: *Power Nullification (Can use Domain Amplification to neutralize Cursed Techniques) *Reverse
    Cursed Technique (Used Reverse Cursed Technique to grow back his severed arm) }}'
