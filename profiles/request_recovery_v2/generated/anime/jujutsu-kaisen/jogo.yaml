    \ Category:Enhanced Senses Users Category:Explosion Users Category:Fear Users Category:Fire Users\
    \ Category:Homing Attack Users Category:Immortals Category:Incorporeal Characters Category:Invisibility\
    \ Users Category:Lava Users Category:Male Characters Category:Manga Characters Category:Martial Artists\
    \ Category:Non-Physical Interaction Users Category:Paralysis Users Category:Pocket Reality Users Category:Power\
    \ Nullification Users Category:Regeneration Users Category:Spirits Category:Temperature Users Category:Misanthropes\
    \ Category:Evil Characters Category:Murderers"
