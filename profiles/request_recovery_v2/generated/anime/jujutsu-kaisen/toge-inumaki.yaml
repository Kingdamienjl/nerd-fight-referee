  text: Gifted (As a member of the Inumaki clan who has inherited cursed speech, Toge is a respected and
    highly capable semi-grade 1 sorcerer. He was ranked grade 2 as a first year student and was the only
    one among his peers who could take on solo missions. At that time, Geto also believed Toge was blessed
    with great potential. His skills have only grown since then and while not currently on the level of
    Yuta, Hakari, or Todo, Toge is still among the most skilled students at Jujutsu High. Toge is highly
    intelligent and very capable in battle, displayed by his strong grasp over the strengths and weaknesses
    of cursed speech and how to effectively apply it in every situation. During the Goodwill Event, the
    rival Kyoto team considered Toge to be one of their biggest threats during the competition. While
    they were aware of how to counter cursed speech, the uncertainty of when Toge could show up and use
    it made it difficult for some of the Kyoto students to focus on their own battles. Megumi and Noritoshi
    only survived a drawn-out chase with Hanami because Toge was the only one with an ability that could
    immobilize the special grade. In Shibuya, Toge was tasked with saving civilians and eliminating transfigured
    humans. He saved numerous non-sorcerers and cleared out the entire Dogenzaka district during the middle
    stages of the incident.)
