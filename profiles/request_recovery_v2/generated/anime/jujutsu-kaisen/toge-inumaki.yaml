  name: though it avoids fatal damage. *"Get Crushed" causes the target to implode until they're flattened
    out. Toge used this t
  description: "though it avoids fatal damage. *\"Get Crushed\" causes the target to implode until they're\
    \ flattened out. Toge used this to finish off the aforementioned Grade 2. *\"Crumble Away\" or \"\
    Plummet\" creates a small field of intensely heavy gravity that crushes the target until they're violently\
    \ sent underground. Toge used this in an attempt to kill Suguru Geto. *\"Don't Move\" or \"Stop\"\
    \ completely immobilizes Toge's target or any of their attacks. He first used \"Don't Move\" to stop\
    \ Aoi Todo and then repeatedly commanded Hanami to stop in their fight. *\"Sleep\" instantly sends\
    \ whoever hears the command into a deep sleep. Toge used this to incapacitate Kasumi Miwa over the\
    \ phone. *\"Return\" can forcibly dispel a Shikigami. He used this command to return Megumi's Divine\
    \ Dog after using it for tracking purposes. *\"Run Away\" forces Inumaki's target to flee the area.\
    \ He used this to command his allies to run away from Hanami's approach. *\"Blast Away\" is a powerful\
    \ command that creates an explosive impact of great concussive force strong enough to send a special\
    \ grade curse crashing up the side of a temple. *\u201CDie\u201D is a powerful command which steals\
    \ the life of the target ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll\
    \ box"
