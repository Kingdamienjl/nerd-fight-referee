- id: claim-weaknesses-6dfedc84
  section: weaknesses
  axis: weakness
  text: 'Somewhat less enthusiastic at work Notable Attacks/Techniques: Lightning Release: Black Panther:
    center|300px *After generating black lightning from their body, which takes the form of a panther,
    the user can manipulate it to affect multiple victims at once by electrocuting them. Like various
    other Lightning Release techniques, the potency of this ability can be increased through the application
    of water. Storm Release: Laser Circus: center|300px *This technique creates several beams and shoots
    them at the enemy. First, a halo of bright energy spreads around the user''s hands as this technique
    is activated, then it encircles the user''s hand, and from that, the beams are shot out towards the
    enemy. The user can alter the beam''s direction after being shot, making it possible to strike multiple
    enemies with pinpoint accuracy, even bypassing hostages held close. The user can also increase the
    number of beams to a great amount to pin down an enemy. Water Release: Water Formation Wall: center|300px
    *This defensive technique creates a wall of water around the user. Enemy attacks are completely intercepted
    by a fence of water blown out from the mouth and is raised from below with tremendous might. The water
    is blown out in the form of a circle around the user and creates a defense without openings. It is
    also possible for the user to control the amount of water and duration at will. The wall''s strength
    and resistance change following the quantity of chakra poured down into the water, so a skillful shinobi
    will be able to build a sturdy one. * Furthermore, because the field of vision is maintained even
    while defending, one can easily go on to the next move, which is a great advantage. The wall can also
    be formed from a pre-existing water source. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{scroll box|content=}}
    {{Discussions}} Category:Ninjas Category:Leaders Category:Naruto Category:Manga Characters Category:Anime
    Characters Category:Characters Category:Kages Category:Electricity Users Category:Water Users Category:Air
    Users Category:Duplication Users Category:Chi Users Category:Weapon Masters Category:Martial Artists
    Category:Breath Attack Users Category:Acrobats Category:Surface Scalers Category:Vibration Users Category:Paralysis
    Users Category:Free Movement Users Category:Shapeshifters Category:Illusionists Category:Adults Category:Sword
    Users Category:Statistics Amplification Users Category:Boruto Category:Energy UsersCategory:Extrasensory
    Perception UsersCategory:Knife Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
