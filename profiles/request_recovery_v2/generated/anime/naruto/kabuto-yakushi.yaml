  axis: weakness
  text: "Kabuto can be arrogant and overconfident | He is vulnerable to lightning-based techniques in\
    \ his water form. Notable Attacks/Techniques: Medical Ninjutsu (\u533B\u7642\u5FCD\u8853, Iry\u014D\
    \ Ninjutsu): *It is is a branch of ninjutsu associated with healing, as well as the manipulation of\
    \ their own, or another body, practiced by shinobi categorized as \"medical-nin\". *Yin Healing 'Wound\
    \ Destruction: A medical ninjutsu where one anticipates the spot the enemy will attack and preemptively\
    \ applies medical treatment to it, reducing damage to a minimum. The user concentrates chakra on that\
    \ area and begins the cell recreation process even before the targeted area becomes damaged. Using\
    \ the opponent's facial expression and movements, the technique's speed and power, the user analyses\
    \ everything in an instant and accurately deduce where the attack will land. Even more than accurately\
    \ predicting the attack or instantly gauging the situation, high resilience is necessary, so one might\
    \ say this technique is exclusive to Kabuto. *Chakra Scalpe"
