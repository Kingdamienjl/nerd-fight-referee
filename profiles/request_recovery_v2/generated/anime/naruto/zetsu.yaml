- id: claim-weaknesses-bbb44765
  section: weaknesses
  axis: weakness
  text: "Usually requires a host body. Notable Attacks and Techniques: *{{Nihongo|Mayfly|{{Ruby|\u8709\
    |\u304B\u3052}}{{Ruby|\u8763|\u308D\u3046}}|Kager\u014D}} This is an infiltration technique, which\
    \ is a signature characteristic of White Zetsu and its clone siblings, due to being infused with the\
    \ cells of Hashirama Senju. It allows him to merge his body with the ground and flora and travel at\
    \ very high speeds. His insectivorous plant-like shell has the ability to merge with the ground, because\
    \ it is tinged with his chakra. Then, using the underground network of organic matter, consisting\
    \ of things like plant roots and water veins, he can travel everywhere with high speed. Using this\
    \ technique he can conceal himself in such things as trees and even sand. Once merged, his presence\
    \ is completely concealed, making it impossible to detect him, even for sensory type ninja. *Body\
    \ Coating: This is a unique ability possessed by Black Zetsu, which allows it to take advantage of\
    \ its malleable body to coat itself over a target. This technique is mainly used to restrict the movement\
    \ of the target by coating a target's body, and forcibly make them do its bidding by directly channeling\
    \ its will through them. In possession of the target's body, Black Zetsu is also able to use target's\
    \ techniques, kekkei genkai, as well as any other ability they may possess. By using this technique\
    \ Black Zetsu is capable of performing a variety of feats including controlling the target, and even\
    \ stabilizing their life-force allowing them to live following a mortally-taxing event. *Event Recording:\
    \ This is an unnamed ability possessed by Black Zetsu that allows it to record events that it has\
    \ personally witnessed. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll\
    \ box |content={{Reflist|2}} }} ==Notes/Explanations== {{Scroll box |content= }} {{Discussions}} Category:Characters\
    \ Category:Naruto Category:Absorption Users Category:Air Users Category:Akatsuki Members Category:Anime\
    \ Characters Category:Antagonists Category:Body Control Users Category:Chi Users Category:Duplication\
    \ Users Category:Earth Users Category:Elasticity Users Category:Electricity Users Category:Fire Users\
    \ Category:Free Movement Users Category:Geniuses Category:Illusionists Category:Manga Characters Category:Paralysis\
    \ Users Category:Plant Users Category:Possession Users Category:Self-Sustenance Users Category:Shapeshifters\
    \ Category:Surface Scalers Category:Telepaths Category:Water Users Category:Genderless Characters\
    \ Category:Energy UsersCategory:Extrasensory Perception Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d5a78820
  section: abilities
  axis: hax
  text: "Black Zetsu= *Superhuman Physical Characteristics **Longevity (He's been alive for over 1000\
    \ years) **Social Influencing (Deception - He secretly modified the Uchiha stone tablet to manipulate\
    \ their beliefs and patiently waited for the perfect moment to act. Pretending to be Madara's creation\
    \ and loyal servant, he orchestrated the Fourth Great Ninja War and everything that followed, all\
    \ to activate the Infinite Tsukuyomi and resurrect Kaguya \u014Ctsutsuki) **Likely Immortality (Type\
    \ 1) **Likely Self-Sustenance (Type 2) **Inorganic Physiology (Type 1) **Body Control (Can alter its\
    \ form and shape, being able to form itself into a humanoid shape) ***Elasticity (Can stretch to great\
    \ lengths) *Chakra Manipulation **Statistics Amplification (Shinobi are capable of enhancing their\
    \ physical capabilities with the use of chakra. The Teleportation Jutsu allows Shinobi to greatly\
    \ enhance their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto\
    \ Chapter 71) **Surface Scaling & Water Walking (By focusing chakra at the soles of their feet, Shinobi\
    \ can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter\
    \ 90) **Minor Illusion Creation & Duplication (With the Clone JutsuRin no Sho, Page 220, Shinobi can\
    \ create illusionary duplicates of themselves that have no physical substance) **Energy Absorption\
    \ (Can absorb and distribute chakra through physical contact) **Extrasensory Perception (Being a sensor,\
    \ it could sense individuals, many kilometers away, and distinguish between distinct chakra signatures,\
    \ being able to locate Asura and Indra's reincarnations) **Paralysis Inducement (With the Temporary\
    \ Paralysis JutsuRin no Sho, Page 176, Shinobi can completely paralyze their targets from close to\
    \ mid range) **Shapeshifting (With the Transformation JutsuRin no Sho, Page 220, Shinobi can transform\
    \ themselves into other people, animals, plants, and even inanimate objects, such as weapons) **Nature\
    \ Transformation: ***Earth Manipulation (Can use Earth Release ***Wind Manipulation (Can use Wind\
    \ Release) ***Fire Manipulation (Can use Fire Release) ***Lightning Manipulation (Can use Lightning\
    \ Release) ***Water Manipulation (Can use Water Release) *Telepathy (Capable of telepathically communicating\
    \ with Madara) *Possession (Can attach itself to others and even take control of them, gaining access\
    \ to their abilities in the process) *Plant Manipulation *Information Analysis (Was analysing Sasuke's\
    \ Kirin and his fight with Itachi) Resistance to: *Illusion Creation, Perception Manipulation & Mind\
    \ Manipulation (Completely unaffected by the Infinite Tsukuyomi) |-|White Zetsu=All previous abilities\
    \ plus: *Wood Manipulation & Plant Manipulation (Can use Wood Release and Organic Plants) *Fusionism\
    \ (Can fuse with various objects or large areas of land, which allows them to merge with the ground\
    \ to quickly travel to a new location) *Self-Sustenance (Type 2; can live without food and water)\
    \ Resistance to: *Heat Manipulation (Was unaffected by Mei's Boil Release) *Extrasensory Perception\
    \ (can't be detected by sensor shinobis)"
  source_ids: *id003
  decisive: true
  status: unverified
