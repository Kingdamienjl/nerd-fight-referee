- id: claim-weaknesses-06d536eb
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit users weaknesses. Voodoo doll supply is limited to ten dolls. Any damage\
    \ done to the Straw Man figure from the sword created by the Card of Pursuit is transferred to Hawkins\
    \ himself. The damage dealt to Hawkins needs a respective exit on someone else's body, so if the damage\
    \ has nowhere to go, it goes straight to Hawkins. If you kill Hawkins' other lives directly, he loses\
    \ a doll.. Notable Attacks/Techniques: Haki: There are normally two types of Haki regular people can\
    \ tap into: the Kenbunshoku Haki which allows individuals to sense the presence of others, and Busoshoku\
    \ Haki which allows individuals to create an invisible armor around them. There is however, a third\
    \ type of Haki, Haoshoku Haki, that only a few individuals can use. Hawkins is not one of these people.\
    \ *Kenbunshoku Haki (Color of Observation or Mantra): Hawkins used this power in Wano when he collided\
    \ with Trafalgar Law. He used the power to identify Law's strength level even with the latter being\
    \ disguised. Cards: Hawkins has the ability to draw cards, affecting the outcome of an event or fight.\
    \ These cards increase in risk or success depending on what Hawkins drew before. If he makes a bad\
    \ draw, his next card will be successful on his part. *The Fool: Causes internal discord for the opponent's\
    \ side. **Reversed: Causes internal discord for the user's side. Hawkins has caused his allies to\
    \ attack each other with this card. *The Hierophant: This is a support card. Hawkins causes his opponent\
    \ to receive support from an outside source, an example being a mistress that was saved by Zoro, aiding\
    \ them in their escape from Hawkins. **Reversed: Noted as causing retribution. This ability seemingly\
    \ allows Hawkins to land an attack on his opponent. Ware-Ware no mi (Straw-Straw Fruit): Basil Hawkins\
    \ has the ability to manipulate and generate straws from his body. He can create straw dolls to fight\
    \ for him, seemingly create dolls that are linked to individuals that can divert damage inflicted\
    \ onto him towards those selected individuals. right|300px *Life Minus: Hawkins can carry up to 10\
    \ dolls, each linked to a single living subordinate. Damage that is inflicted onto him is removed\
    \ from his body, and immediately applied to whoever is linked to one of his 10 dolls. With this power,\
    \ he can effectively negate any attack on his body as long as he has dolls. He can negate death, so\
    \ long as he possesses these dolls. **With this power, he can summon a Straw effigy linked to the\
    \ lives of his subordinates, and himself. *Goma no So (\u964D\u9B54\u306E\u76F8, G\u014Dma no S\u014D\
    , literally meaning \"Devil Conquering Phase\"): Hawkins transforms into a giant scarecrow-like entity.\
    \ He also resembles a voodoo doll seemingly made from straw, with metal nails functioning as claws/fingernails.\
    \ According to Kizaru, his Devil Fruit is not a Logia, so he is still as vulnerable to damage as he\
    \ is in human form, just with greater offensive capabilities. This was first seen used in the battle\
    \ against Admiral Kizaru. This is called Demon Face in the Viz Manga and Funimation dub and Demon\
    \ Conquering Phase in the Funimation subs.centre|thumb|360x360px *Warabide Sword: By channeling his\
    \ Devil Fruit powers through his sword, Hawkins can morph the shape of its blade, making it resemble\
    \ a whip made of straw, but retaining enough sharpness to pierce other beings. **Straw Man: Hawkins\
    \ makes a amount of straw from his sword to create a figure that he is able to control remotely. The\
    \ Straw Man is able to use nails as projectile he shoots from his mouth. The Straw Man seems to be\
    \ connected to Hawkins' life essence since if it's attacked the damage will reflect to Hawkins' body\
    \ unless he has a doll to avoid it. File:Straw_Man.png File:Straw_Man_power.png Note: This profile\
    \ covers only the feats done until the Wano arc, skipping the Pre-Timeskip events due to the lack\
    \ of feats Hawkins had at the time. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ {{scroll box|content={{reflist|2}}}} ==Notes and Explanations== {{Discussions}} Category:Characters\
    \ Category:One Piece Category:Adults Category:Anime Characters Category:Attack Reflection Users Category:Captains\
    \ Category:Card Users Category:Dolls Category:Extrasensory Perception Users Category:Fate Users Category:Haki\
    \ Users Category:Humans Category:Male Characters Category:Manga Characters Category:Mind Users Category:Organic\
    \ Users Category:Pirates Category:Sailors Category:Scarecrows Category:Statistics Amplification Users\
    \ Category:Sword Users Category:Voodoo Users Category:Weapon Masters"
  source_ids: *id003
  decisive: false
  status: unverified
