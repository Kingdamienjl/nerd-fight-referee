  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Expert Swordsman, Haki (Intermediate Kenbunshoku, Busoshoku),
    Fortune Teller and limited Fate Manipulation (With Cards, also capable of manipulating the actions
    of others), Straw Manipulation, Weapon Creation (Can create nails to use as weapons), Breath Attack
    (His Straw Man spit out nails as a form of an attack), Life Manipulation with Straw Man (He places
    the essence of others into his dolls. He has a limit of 10 dolls at a time), Attack Reflection and
