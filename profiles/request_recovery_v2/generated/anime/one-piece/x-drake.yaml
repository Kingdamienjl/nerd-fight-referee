- id: claim-weaknesses-891d2774
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit users weaknesses. Will become faint at the sight of a naked woman. Notable\
    \ Attacks/Techniques: *Dragon-Dragon Fruit Model Allosaurus: He possesses what is referred to as a\
    \ \"rare, Ancient Zoan Devil Fruit \", giving Drake the ability to transform into an Allosaurus. He\
    \ can also transform into a half-human and half-Allosaurus Hybrid form that allows him to retain all\
    \ the power of his Allosaurus form but also keep his humanoid shape and thus still use his axe and\
    \ rapier. *Haki: There are normally two types of Haki standard people can tap into: the Kenbunshoku\
    \ Haki which allows individuals to sense the presence of others, and Bus\u014Dshoku Haki which allows\
    \ individuals to create an invisible armor around them. There is however, a third type of Haki, Ha\u014D\
    shoku Haki, that only a few individuals can use. X Drake is not one of these people. **Bus\u014Dshoku\
    \ Haki (Color of Armaments): A form of Haki that allows the user to create an \"invisible armor\"\
    \ around themselves. With that, they can protect himself from attacks, and if trained well, can use\
    \ it to deliver stronger attacks. Besides the increase of strength, it is the only form of attack\
    \ that doesn't involve Kairouseki that can hit any Devil Fruit user, being able to hit the user's\
    \ original body even if it's a logia user. It can also be used in weapons. Drake used this Haki to\
    \ easily defeat and capture the logia user known as Caribou during his time serving Kaido. ==Notable\
    \ Matchups== Victories: Jack (One Piece) Jack's Profile Losses: Killer (One Piece) Killer's profile\
    \ Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} ==Notes and Explanations== {{Discussions}}\
    \ Category:Characters Category:One Piece Category:Manga Characters Category:Anime Characters Category:Male\
    \ Characters Category:Military Characters Category:Pirates Category:Sailors Category:Transformation\
    \ Users Category:Weapon Masters Category:Sword Users Category:Axe Users Category:Captains Category:Leaders\
    \ Category:Dinosaurs Category:Bodily Weaponry Users Category:Regeneration Users Category:Haki Users\
    \ Category:Adults"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7195a13c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Adept Swordsman and Axeman, Transformation (Can transform
    fully or partially into an Allosaurus), Natural Weaponry, Regeneration (Mid-Low), Minor Resistance
    to Cold Temperatures, Resistance to Animal Manipulation (Zoans are immune to Tama's Kibi Dangos),
    Resistance to Madness Manipulation, Mind Manipulation and Soul Manipulation via Willpower (Through
    sheer willpower they can resist losing their mind when absorbing shadows through the Kage Kage no
    Mi. Shadows belonging to strong willed people are difficult to control, allowing them to rebel against
