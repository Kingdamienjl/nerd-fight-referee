    Characters Category:Transformation Users Category:Weapon Masters Category:Hybrids Category:Enhanced
    Senses Users Category:Underwater Breathing Users Category:Bodily Weaponry Users Category:Haki Users
    Category:Regeneration Users Category:Adults'
  source_ids: *id003
  decisive: false
  status: unverified
