- id: claim-weaknesses-f52b8e0c
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: |-|Haki= There are normally two types of Haki regular
    people can tap into: the Kenbunshoku Haki which allows individuals to sense the presence of others,
    and Busoshoku Haki which allows individuals to create an invisible armor around them. There is however,
    a third type of Haki, Haoshoku Haki, that only a few individuals can use. Koby is not one of these
    people. *Kenbunshoku Haki (Color of Observation or Mantra): Koby has no control over this power by
    the end of the pre time-skip. He can sense and emphasize with the emotions and intent of the living
    presence around him, but can''t keep it in check, which takes a toll on his mentality by some degree.
    |-|Rokushiki= A special, superhuman martial arts style used primarily by members of Cipher Pol #9.
    It consists of six special techniques, Kami-e, Geppou, Rankyaku, Shigan, Soru, Tekkai. Pre-Timeskip
    Koby has only displayed the use of Soru, but as of Post-Timeskip, he is confirmed to have mastered
    all 6 forms. {{#tag:tabber| {{!}}-{{!}}Soru= Allows the users to move at extremely high speeds in
    order to avoid attacks, as well as to attack at higher speeds and with greater power. It was revealed
    that the principle of this move was to kick off the ground at least ten times in the blink of an eye.
    Koby_Soru.gif|Soru {{!}}-{{!}}Geppou= Allows the users to actually jump off the air itself, allowing
    them to stay in the air for much longer than usual. {{!}}-{{!}}Shigan= A close-quarter combat technique,
    in which the user pushes their finger into a certain target at a very high speed, leaving a wound
    similar to a bullet wound. It''s very similar to a piercing attack, given that it applies all the
    pressure of the user''s attack to a single point. {{!}}-{{!}}Tekkai= This ability hardens the users''
    muscles to the level of iron, in order to nullify damage taken from attacks. However, it can be broken
    by strong enough forces. {{!}}-{{!}}Kami-e= Allows the users'' body to go limp in order to avoid any
    attacks, and float like a piece of paper. They even seem to possess the properties of paper and make
    their body flat. {{!}}-{{!}}Rankyaku= A powerful projectile technique, in which the users start by
    kicking at very high speeds and strength, sending out a sharp compressed air blade that can slice
    objects and greatly damage a human body. }} ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:One Piece Category:Male Characters Category:Manga Characters
    Category:Anime Characters Category:Humans Category:Teenagers Category:Good Characters Category:Soldiers
    Category:Military Characters Category:Chi Users Category:Heroes Category:Martial Artists Category:Precognition
    Users Category:Captains Category:Sailors Category:Haki Users Category:Philanthropes Category:Protagonists
    Category:Weapon Masters Category:Weapon Users Category:Sword Users Category:Blade Users Category:Statistics
    Amplification Users Category:Flight Users Category:Body Control Users Category:Damage Reduction Users
    Category:Air Users Category:Supernatural Willpower Users'
