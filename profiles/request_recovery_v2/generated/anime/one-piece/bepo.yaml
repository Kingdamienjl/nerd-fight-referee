- id: claim-powers-and-abilities-16754d79
  section: abilities
  axis: hax
  text: 'Base= * Superhuman Physical Characteristics * Enhanced Senses (Shown hereOne Piece Chapter 1064.
    Bepo has exceptional hearing which allows him to predict attacks and alert his allies) * Martial Arts
    (Minks are natural born warriorsOne Piece Chapter 808. Bepo himself has proven to be a formidable
    combatantOne Piece Chapter 505) * Electricity Generation (As even baby minks can use ElectroOne Piece
    Chapter 804One Piece Chapter 805, Bepo should also be able to) * Stealth Mastery (Explained here)
    * Transformation (Bepo can transform into a Sulong, either through looking at the full moonOne Piece
    Chapter 888 or taking a special drugOne Piece Chapter 1081) * Acrobatics (Can preform agile flips
    across large distancesOne Piece Chapter 506) Resistance to: * Madness Manipulation, Mind Manipulation
    and Soul Manipulation via Willpower (Through sheer willpower they can resist losing their mind when
    absorbing shadows through the Kage Kage no Mi. Shadows belonging to strong-willed people are difficult
    to control, allowing them to rebel against Moria''s pact which usually immediately submits a shadow
    to his supremacy and orders; Can also control his Sulong form, which makes Minks mentally insane and
    out of control. Spiritual energy is contained within one''s soul/life; this energy is represented
    by the fighting power or the Haki itself. Those with strong souls, which are homologous to shadows,
    resist the effects of Brook''s soul manipulation) |-|Sulong= Same as before and: * Awakened Power
    (Through looking at the moon, or taking a special drug Bepo can transform into his Sulong form, which
    grants him a boost in statistics) * Large Size (Type 0; Larger than Blackbeard) * Electrical Aura
    (Sulongs are constantly surrounded by sparks of Electro. Imbuing the properties of Electro into all
    of their attacks) * Bodily Weaponry (Bepo has large claws and fangs which can pierce and cut his opponents)'
  source_ids: *id003
  decisive: true
  status: unverified
