- id: claim-weaknesses-73c26866
  section: weaknesses
  axis: weakness
  text: 'General Devil Fruit weaknesses. Certain non-organic materials, such as Mr. 3''s wax, are a little
    bit resistant to most of the poisons he produces. If he consumes it, he gets diarrhea that usually
    has him confined to the bathroom for most of the day Notable Attacks/Techniques: Doku Doku no Mi (Venom-Venom
    Fruit): A Paramecia-type Devil Fruit that grants the user an ability to produce and control different
    types of poison, which can be as simple as breathing out minor poison gas, or as complex as being
    concentrated and corrosive indigo-colored liquid produced directly out of their own body, as well
    has grant immunity to all forms of poison. The user appears to have full control of any poison they
    release, whether it be in liquid or gaseous form. center|375px *Hydra (Poison Dragon): Magellan''s
    signature technique. After producing vast amounts of liquid poison from his body, Magellan is able
    to manipulate it in the form of a three-headed dragon. It seems that it can even separate itself from
    Magellan to pursue escaping foes. Alternatively, he would produce a dragon head of liquid poison from
    his arm which would extend to attack a single opponent. With this creature, Magellan is able to engulf
    any opponent in deadly poison. The level of toxicity is so overwhelming that it actually causes the
    unfortunate victim to dissolve. The poison acts on the nervous system, paralyzing the victim and making
    them suffer excruciating pain until they die. This technique seems to be very infamous within the
    walls of Impel Down, as the prisoners all know and fear its name and properties. Fire seems to neutralize
    the liquid the Hydra is made of and prevents it a bit from completely reforming. Should one of its
    heads be burned, it does not completely recover even when Magellan retracts the creature back into
    his body. center|300px *Chloro Ball (Poison Gas Bullet): After chewing and blowing up some of his
    poison like bubble gum, Magellan spits the bubble at high speed towards an enemy. Upon impact, the
    bubble explodes and releases a cloud of poison gas. The gas acts like tear gas and causes severe sneezing
    and immobilizes the enemy and anyone else near the vicinity. center|300px *Venom Road (Poisonous Path):
    While producing his Hydra, Magellan completely engulfs himself in the liquid poison. While engulfed,
    Magellan quickly travels within one of his Hydra''s necks and out of its mouth to where he would want
    to go. Magellan has also used this for vertical travel as well. center|300px *Doku Fugu (Poison Blowfish):
    Taking a deep breath, Magellan inflates his body slightly in order to withstand a physical blow. This
    is apparently strong enough to withstand a Gear Second attack. While in this stance, Magellan can
    blow poisonous liquid bubbles with similar properties to the Hydra. *Doku Gumo (Poison Cloud): Breathing
    out large amounts of his poisonous breath, Magellan creates a fog-like cover in an area. This poisonous
    fog not only blurs the sight of any opponent caught within it, but also slowly weakens them as well,
    by gradually robbing away their strength, eyesight, and hearing. *Venom Demon: Jigoku no Shinpan (Giant
    Soldier: Hell''s Judgement): Magellan''s ultimate attack. He produces an enormous amount of liquid
    poison, and, from it, he forms into a massive devil-like entity that mimics his every movement, with
    its head and hands resemble those of Magellan''s. The color of this poison liquid is crimson-colored
    and releases a noxious smoke to go along with it. The poison made from Hell''s Judgment is so toxic
    that it affects even non-organic objects, with the poison spreading like a disease over everything
    that makes contact with it, even if not directly, and seems to kill the afflicted victims right away
    once the infection spreads all the way throughout the body (which seems to be at a very rapid rate).
    Magellan claimed that this technique is potent enough to destroy all of Impel Down.center|360px ==Gallery
    == Magellan.png ==Notable Matchups== Victories: Losses: Inconclusive: ====Notes==== {{scroll box|content=}}
