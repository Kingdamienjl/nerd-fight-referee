- id: claim-weaknesses-dcd33be8
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit user weaknesses. His plants (especially those making up his body) are susceptible\
    \ to fire, though Aramaki has trained up his plants' resistance to being burned. Notable Attacks/Techniques:\
    \ |-|Devil Fruit= Mori Mori no Mi (Woods-Woods Fruit): A Devil Fruit of the Logia family, which made\
    \ Ryokugyu a \"Forest Human\" who can create, control, and transform into assorted plants. The Admiral\
    \ has claimed that his ability is the very essence of \"Logia\" (Nature) itself, with the forest representing\
    \ a source a life rivalling the seas and effectively making him able to create life from nothing,\
    \ as the only known Logia user whose created element is a category of living/organic matter. It should\
    \ be noted that (similar to Kuzan's ice powers) Ryokugyu's ability pertains to a solid element, so\
    \ he is more easily hit with attacks than those Logia users who have more \"fluid\" bodies, though\
    \ he is still invulnerable to all but those attacks that involve Haki or exploit his natural weakness\
    \ (fire). His favored means of attack involves the manifestation of wooden roots/tendrils from the\
    \ ground or his body, either to ensnare or skewer opposition, sapping away their nutrients/body water\
    \ and leaving them as shriveled-up husks. It is shown that he can bring forth entire forests with\
    \ his power, and he can use his plants in highly unorthodox ways, like growing a flower on his back\
    \ that spins like a propellor, allowing him to fly. Ryokugyu flower.png|Flight via a propeller-like\
    \ flower. Ryokugyu vs. Beast Pirates.png|Wooden tendrils to pierce/suck enemies dry. Ryokugyu sapling\
    \ regen.png|Regeneration from a sapling. *Kinniku Mori Mori ({{Ruby|\u7981|\u304D\u3093}}{{Ruby|\u618E\
    |\u306B\u304F}}{{Ruby|\u68EE|\u3082\u308A}}{{Ruby|\u3005|\u3082\u308A}}, Kinniku Mori Mori, meaning\
    \ \"Forbidden Hate Forests\"): A technique whereby Ryokugyu creates multiple large trees from the\
    \ ground, including two massive wooden fists, before ultimately morphing himself into a giant tree\
    \ golem that dwarfs even the full dragon form of an adult Mononosuke (itself comparable to Kaidou's\
    \ dragon form). He can then attack multiple enemies using his go-to offense: wooden roots/tendrils\
    \ to ensnare/skewer enemies' bodies. The attack name is a pun on kinniku ({{Ruby|\u7B4B|\u304D\u3093\
    }}{{Ruby|\u8089|\u306B\u304F}}, \"muscle\") and morimori (\u3082\u308A\u3082\u308A), a Japanese onomatopoeia\
    \ for bulging muscles (i.e., flexing one's muscles in order to communicate strength). The Viz manga\
    \ calls the technique Groves of Wrath. *Bokarin ({{Ruby|\u9632|\u307C\u3046}}{{Ruby|\u706B|\u304B\
    }}{{Ruby|\u6797|\u308A\u3093}}, B\u014Dkarin, meaning \"Fireproof Forest\"): A technique to up the\
    \ resistance of Ryokugyu's plant body against fire attacks, called Firebreak Forest in the Viz manga.\
    \ Ryokugyu Kinniku Morimori.png|Kinniku Mori Mori. Ryokugyu Mori Mori no Mi.png|Ryokugyu transformed,\
    \ using Haki infusion on a root. Ryokugyu Bokarin.png|Ryokugyu using Bokarin to shrug off a fire-based\
    \ attack. |-|Haki= Haki: There are normally two Haki types that regular people can tap into: Kenbunshoku\
    \ Haki which, broadly speaking, allows individuals to sense the presence of others, and Busoshoku\
    \ Haki which allows individuals to project an invisible, spiritual armor around their body to enhance\
    \ their power/defense/bypass Devil Fruit defenses. There is, however, a third type of Haki, Haoshoku\
    \ Haki, that only a few individuals can use; Ryokugyu can be assumed to hold at least expert-level\
    \ skill with Busoshoku and Kenbunshoku Haki. *Busoshoku Haki (Color of Armament): Ryokugyu can be\
    \ assumed to hold at least expert-level skill with this Haki type. He can imbue root-like appendages\
    \ connected to his body with Haki to increase their hardness/piercing power. *Kenbunshoku Haki (Color\
    \ of Observation): Ryokugyu can be assumed to hold at least expert-level skill with this Haki type.\
    \ ==Notable Matchups== Victories: Losses: Sanji (One Piece) Sanji's Profile (Post Vinsmoke Awakening\
    \ Sanji was used) Inconclusive: ==References== {{Reflist|2}} ==Notes and Explanations== {{Discussions|Aramaki\
    \ Ryokugyu|Aramaki (Ryokugyu)}} Category:Characters Category:One Piece Category:Absorption Users Category:Adults\
    \ Category:Anime Characters Category:Antagonists Category:Aura Users Category:Body Control Users Category:Chi\
    \ Users Category:Elemental Intangibility Users Category:Enhanced Senses Users Category:Evil Characters\
    \ Category:Extrasensory Perception Users Category:Flight Users Category:Haki Users Category:Humans\
    \ Category:Leaders Category:Male Characters Category:Manga Characters Category:Military Characters\
    \ Category:Organic Users Category:Plant Users Category:Precognition Users Category:Regeneration Users\
    \ Category:Sailors Category:Soldiers Category:Statistics Amplification Users Category:Sword Users\
    \ Category:Telepaths Category:Transformation Users Category:Villains Category:Wood Users"
  source_ids: *id003
  decisive: false
  status: unverified
