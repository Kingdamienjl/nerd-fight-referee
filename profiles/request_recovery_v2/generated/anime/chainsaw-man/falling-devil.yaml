- id: claim-powers-and-abilities-1fafe5ae
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **General Devil Physiology (Primal-Fear) **Immortality &
    Regeneration (Types 2, 3 & 9, At least Mid-High; Her head is disconnected from her body, and she is
    capable of speaking while reduced to a pile of flesh. Regenerated quickly after being shot to pieces,
    and she claims that humanity currently possesses no means of killing her. Allowed Denji to eat her
    entire body, after which she immediately regenerated, bursting out of his stomach. Falling Devil''s
    true body exists in Hell, and her appearance on earth is merely several human corpses that she has
    possessed.Chainsaw Man Chapter 122Chainsaw Man Chapter 125Chainsaw Man Chapter 126Chainsaw Man Chapter
    131) *Fusionism, Possession & Biological Manipulation (She can possess corpses, altering their shape
    and fusing them together to create a body for herself.Chainsaw Man Chapter 123) *Empathic Manipulation
    & Memory Manipulation (Her powers cause people to feel negative and depressed, usually to a suicidal
    degree, and can cause them to have traumatic flashbacks. She can directly force someone to relive
    traumatic memories by telling them to "Fall", causing her powers to affect them instantly.Chainsaw
    Man Chapter 124) **Gravity Manipulation (Those affected by her mental attacks have their gravity reversed,
    with the effect proportional to how depressed they feel. Her mere presence caused gravity to fluctuate
    all over the world, causing many disasters.Chainsaw Man Chapter 132) *Additional Limbs & Natural Weaponry
    (Possesses 8 limbs, 2 of which are scythe-like and sprout from her back.) *Cloth Manipulation (Created
    a chef''s outfit for herself from nothing.) *Flight (As shown here.) *Enhanced Senses & Information
    Analysis (Through merely the scent of her sweat and movement of her muscles, she could tell that Asa
    Mitaka had a weak attachment to life and that she was only scared of the physical sensation of falling.Chainsaw
    Man Chapter 127) *Telekinesis (Tore out human eyes & ears telekinetically, moved Asa Mitaka by pointing,
    and tossed a building with a flick of her finger.Chainsaw Man Chapter 130) *Portal Creation, Dimensional
    Travel & BFR (She can create doors to Hell. Those who fall high enough due to her ability will be
    transported through a door to Hell.Chainsaw Man Chapter 128) *Energy Projection (Upon being offended
    by the Justice Devil spitting out the meal she prepared, she killed it with some sort of energy blast.)
    |-|True'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
