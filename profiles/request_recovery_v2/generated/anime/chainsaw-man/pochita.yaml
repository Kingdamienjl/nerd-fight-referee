- id: claim-powers-and-abilities-97cbaeb4
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *General Devil Physiology **Enhanced Regeneration (Up to\
    \ High-Mid; While Pochita is capable of regenerating through blood consumption like all other devils,Chainsaw\
    \ Man Chapter 1 he possesses far greater regenerative abilities than normal devils when awakened;\
    \ being able to fully regenerate from just a heart without any external blood consumptionChainsaw\
    \ Man Chapter 88) *Additional Limbs (Has 4 arms) *Enhanced Senses (Was able to hear a small whisper\
    \ for help from a long distance awayChainsaw Man Chapter 85 as well as sense being spied on by Makima\
    \ from far away. Moreover, his eyesight is perceptive enough to observe Kobeni dancing from a great\
    \ distance away as wellChainsaw Man Chapter 86. Able to quickly sense the Aging Devil's location through\
    \ unknown means despite them being at a faraway locationChainsaw Man Chapter 185) *Body Control (Able\
    \ to use his own intestine like another appendage as well as like a scarf . Also able to widen his\
    \ mouth and digestive system to an inhuman extent; wide enough to swallow both the Aging Devil and\
    \ Tadashi Hasegawa wholeChainsaw Man Chapter 189) *Cyborgization, Bodily Weaponry & Chainsaw Creation\
    \ (Partial, Unconventional; Is partly made out of literal chainsaws. Able to manifest chainsaws out\
    \ of his arms and legsChainsaw Man Chapter 94) **Chain Control & Acrobatics (Hypermobility & Surface\
    \ Running; Skilled enough to perform a complete 360 kick even while stabbed through the chest.Chainsaw\
    \ Man Chapter 94 By disconnecting the chains off his chainsaws, Pochita is able to use them like grappling\
    \ hooks to swing between buildings.Chainsaw Man Chapter 49 Likewise, Pochita has also shown to be\
    \ able to slingshot himself with his chainsChainsaw Man Chapter 94 as well as use his chains like\
    \ lassos; reeling his opponents in to be sliced upChainsaw Man Chapter 88 or burrow them underground\
    \ for surprise attacksChainsaw Man Chapter 94) *Existence Erasure, Conceptual Manipulation & Sealing\
    \ (Type 2; Capable of erasing beings, devils and the concepts they embody from existence across the\
    \ past, present and from everyone's memories by consuming them into his stomach.Chainsaw Man Chapter\
    \ 84 It's shown that Pochita needs to at least consume their head in order for the erasure to take\
    \ action) **Statistics Reduction (Able to weaken other devils by eating from part of their bodiesChainsaw\
    \ Man Chapter 104) *Unconventional Extrasensory Perception (Shown to be able to perceive the outside\
    \ world even while it's host body is completely unconsciousChainsaw Man Chapter 156) *Limited Duplication\
    \ (Able to create a full \"clone\" of himself by removing his heart and forming a new body around\
    \ thatChainsaw Man Chapter 88) *Limited Telepathy (Was able to communicate with Power while she was\
    \ just small ounces of blood in Denji's bloodstreamChainsaw Man Chapter 90) *Immortality (Enhanced\
    \ Type 4; Stated by Yoru and Makima to be able to always rise back up, no matter how many times he\
    \ is killedChainsaw Man Chapter 84Chainsaw Man Chapter 104) *Nullification of Devil Contracts (Was\
    \ able to break the Hell Devil's contract to send Makima to Hell and have it send him there insteadChainsaw\
    \ Man Chapter 84) *Possesses all abilities possessed by Denji but to a much greater extent |-|Resistances=\
    \ *General Devil Resistances *Extreme Heat/Fire Manipulation (Even after being greatly weakened could\
    \ still endure the Flamethrower Hybrid's flames like it was nothing.Chainsaw Man Chapter 94 Was also\
    \ able to withstand the heat from re-entering Earth's atmosphere, which can reach temperatures up\
    \ to 3871\xB0C/7000\xB0F and aboveChainsaw Man Chapter 88) *Possesses all resistances possessed by\
    \ Denji |-|Part 1"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
