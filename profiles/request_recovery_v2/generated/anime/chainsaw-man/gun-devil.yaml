  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *General Devil Physiology *Enhanced Regeneration (Up to
    High-Mid; While capable of regenerating through blood consumption like all other devils,Chainsaw Man
    Chapter 30 unlike regular devils, he is able to passively regenerate if its body parts are separated
    from its body.Chainsaw Man Chapter 13) *Flight (As shown here.Chainsaw Man Chapter 75Chainsaw Man
    Chapter 76) *Large Size (Type 3; Is this large.Chainsaw Man Chapter 76) *Additional Limbs & Natural
    Weaponry (Possesses multiple large and oversized guns on his body.Chainsaw Man Chapter 75) *Weapon
    Mastery (The Gun Devil possesses perfect aim even from immense distances.Chainsaw Man Chapter 76)
    *Limited Magnetism Manipulation (Can make part of its body to reattach, its flesh behaving like magnets,
    with a piece big enough being used to locate the gun devil itself, who was far away in other countries)
    *Homing Attack & Danmaku (Has dozens of guns for hands, that are able to track and kill people based
    on certain conditions as well as shooting an incredible amount of bullets in a short timeframe.Chainsaw
    Man Chapter 76) |-|20% Gun Devil'
