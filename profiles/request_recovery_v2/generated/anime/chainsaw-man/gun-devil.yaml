- id: claim-weaknesses-61124ac7
  section: weaknesses
  axis: weakness
  text: 'The Gun Devil''s ability activation can''t kill all living things born in April, July, or October
    | None notable. Notable Attacks/Techniques : *Bullet Projection: The Gun Devil is able to fire bullets
    using the several guns which are parts of its body with great precision and speed. It is able to fire
    a bullet through the head of every adult male within approximately 1 kilometer of it, fire a bullet
    through the head of every child up to 12 years old within approximately 1500 metersChainsaw Man Chapter
    75 and fire a bullet through the heart of every living thing born in January, February, March, May,
    June, August, September, November, or December in approximately 1000 meters of himself.Chainsaw Man
    Chapter 76 File:Gun Devil 1.mp4.gif|The Gun Devils city wide destruction. ==Gallery== {{Scroll box|content=
