      and abilities that he used to satisfy his own hunger and slay otherwise who would keep him from
      sating it. He is able to use the highly secretive and difficult Force Sever technique to cut off
      the connection of a Force-sensitive as powerful as Traya and skilled enough in telekinesis to lift
      and toss around entire starships. In addition, he is able to use a variety of other Sith abilities,
