- id: claim-intelligence-c0ba72d7
  section: power_scale
  axis: battle_iq
  text: As a Dark Lord of the Sith, Nihilus is skilled in many of the greatest teachings of the Sith Order,
    being skilled in both an aggressive, one-handed style of lightsaber combat to match Meetra Surik,
    who was personally trained by Nihlius' old master. He was also well-versed in many dark rituals and
    abilities that he used to satisfy his own hunger and slay otherwise who would keep him from sating
    it. He is able to use the highly secretive and difficult Force Sever technique to cut off the connection
    of a Force-sensitive as powerful as Traya and skilled enough in telekinesis to lift and toss around
    entire starships. In addition, he is able to use a variety of other Sith abilities, such as Farsight,
    Dark Rage, and Force Lightning, while his own connection to the Force was so profound that he could
    bring death, insanity, and confusion with his mere presence and send worlds full of inhabitants and
    Force-sensitives into a mad frenzy with a mere thought or spoken word.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-dba81736
  section: weaknesses
  axis: weakness
  text: "Nihilus is almost completely consumed by his hunger, and will constantly attempt to satiate it.\
    \ If he does not feed for an extended period of time, or try to consume Force Voids like him (such\
    \ as Meetra), he will be weakened. Notable Attacks/Techniques: *Force Draining: This Sith power which\
    \ resembles a Force Drain and Force Sever combined severs life from the Force, and Darth Nihilus then\
    \ feeds on the death it causes. Seems to be linked to his voice. Darth Nihilus\u2019 control over\
    \ this power is such he can cleanse the life from entire planets by speaking, and doing also had the\
    \ side effect of causing volcanic eruptions, cities tumbling from earthquakes, and other cataclysms.\
    \ What is also interesting to note is that his mere presence and voice, even when not exerting this\
    \ power, has some of the effects on weaker beings. *Force Lightning: An offensive Force technique\
    \ that uses Force energy to produce electricity with one or two hands that stream outwards from the\
    \ fingertips, its speed is usually great enough to catch an opponent off-guard even when prepared,\
    \ and can be used either in bursts, or simply torrent out in an a gush of agony on its victim. *Force\
    \ Scream: Nihilus unleashes a force enhanced scream. *Sever Force: Cuts a Force User off from the\
    \ Force, used to strip his former master, Darth Traya, of the Force. It should be noted that Traya\
    \ was powerful enough that even Nihilus required the aid of Darth Sion to accomplish this particular\
    \ feat. *Telekinesis: Lifted his flagship and his entire fleet from a Gravity Well on Malachor IV.\
    \ Also uses it to keep his flagship, the Ravager, from falling apart at all times with no seeming\
    \ concentration or effort *Telepathy: Can control the minds of everyone in his flagship while simultaneously\
    \ holding his ship together and draining planets. Even being in his presence can cause a \u201Cdeadening\u201D\
    \ even kilometers away on his flagship due to Nihilus being a Wound in the Force ==Notable Matchups==\
    \ Victories: Losses: Revan (Star Wars) Revan's Profile (Galactic War Revan was used) Inconclusive:\
    \ Golden King (Ourai no Gahkthun) Golden King's Profile (Both were at their strongest) {{Discussions}}\
    \ Category:Characters Category:Star Wars (Legends) Category:Game Characters Category:Male Characters\
    \ Category:Humans Category:Sword Users Category:Electricity Users Category:Telepaths Category:Telekinesis\
    \ Users Category:Matter Users Category:Science Fantasy Characters Category:Healers Category:Pain Users\
    \ Category:Rage Users Category:Morality Users Category:Precognition Users Category:Soul Users Category:Enhanced\
    \ Senses Users Category:Clairvoyance Users Category:Mind Users Category:Memory Users Category:Absorption\
    \ Users Category:Death Users Category:Incorporeal Characters Category:Aura Users Category:Non-Canon\
    \ Characters Category:Sith Category:Evil Characters Category:Villains Category:Devourers"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-16caa04f
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Precognition, Force-enhanced reflexes/reactions, Clairvoyance,\
    \ Telepathy, Telekinesis, Mind Manipulation (Should be considerably superior to Joruus C'baoth, who\
    \ mind controlled all of Wayland, a planet with a population of 28 million), Memory Manipulation,\
    \ Dark Healing, Absorption via Force Drain, Electricity Manipulation via Force Lightning, Force Scream,\
    \ Sever Force, Ritual of Transfer Essence (Had transferred his soul into his armor/mask prior to the\
    \ events of KOTOR II), Matter Manipulation on a sub-atomic scale (Creating a Holocron requires one\
    \ to make numerous precision alterations to it on a subatomic scale), Death Manipulation (Nihilus'\
    \ speech causes people to spontaneously die), Incorporeality (Is simply a disembodied spirit contained\
    \ within his armor), Soul Manipulation (On a planetary scale. Absorbed the souls of all living beings\
    \ on Katarr), Aura (Simply being near Nihilus causes one\u2019s life force and soul to be absorbed\
    \ into him, in addition to instilling immediate and utter mindless devotion. They are also bombarded\
    \ with visions of utter emptiness that, when used on Visas Marr, made her convinced that all life\
    \ must die), Force Rage, Morality Manipulation, Pain Manipulation"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
