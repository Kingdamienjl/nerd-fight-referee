power_scale:
  tier:
    text: '{{9-C}} physically. {{9-A}} with vibroknife and Force pikes. {{9-A}} with blasters Name: Wilhuff
      Tarkin Origin: Star Wars Gender: Male Age: 64 at time of death Classification: Human, Captain in
      the Outland Regions Security Force (formerly), Captain in the Republic Navy (formerly), Admiral
      in the Republic Navy (formerly), Moff of the Galactic Empire (formerly), Grand Moff of the Galactic
      Empire'
    source_ids: &id002
    - mediawiki-841500
    confidence: 0.95
  attack_potency:
    text: Street level physically (His years on the Carrion Plateau and training under his grand-uncle
      Jova Tarkin forged him into a peak human specimen. Even in his late 50s and early 60s, he was physically
      far more fit than trained soldiers less than half his age and capable of effortlessly overpowering
      them). Small Building level with vibroknife and Force pikes (They can easily cut through armor with
      this level of durability. They also ignore conventional durability to an extent). Small Building
      level with blasters (Wielded a DC-17 heavy blaster pistol during his days with the Republic Navy.
      Likely wielded an SE-14r light repeating blaster during his service with the Galactic Empire. Has
      also made use of military grade blaster carbines when needed)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Peak Human (Trained soldiers half his age find it difficult to keep up with him. Has proven\
      \ himself to be almost as fit and fast as the Grand Army of the Republic\u2019s Clone Troopers),\
      \ Relativistic+0.9c to Speed of Light attack speed with blaster weaponry (Most energy weapons, including\
      \ Blasters, Laser Cannons and Turbolasers, direct invisible beams at lightspeed. The bolt seen when\
      \ a weapon is fired is actually a pulse of plasma traveling along the beam at less than lightspeed\"\
      Naval Weapons and Equipment\". Star Wars Encyclopedia. De Agostini Publishing, 2021)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Likely Athletic Human, possibly Peak Human
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Street level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Street level by himself (Uninjured by a few metre fall onto solid rock; something which can
      leave even trained and fit soldiers far younger than him with sprained or broken ankles). Likely
      Small Building level against blasters (As a high ranking individual of the Tarkin initiative, he
      likely wears a composite plastoid vest underneath his uniform for protection. This kind of vest
      allowed Director Orson Callan Krennic to survive one shot to the chest from a heavy blaster pistol)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Peak Human (Was not sweating and was quite active after making a trek which left a well trained
      and far younger human soldier short of breath)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range with vibroknife, Extended Melee Range with Force pike, Tens of Meters with
      blaster pistols, Hundreds of Meters with blaster carbines
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Genius (Very well trained and highly skilled combatant. Is also an excellent pilot, with his\
      \ piloting skills actually managing to impress Darth Vader (himself one of the greatest pilots in\
      \ the galaxy). Was a top ranking student at the academies he attended. Was designing starfighters\
      \ and light freighters in his mid teens. At the age of merely 18, he managed to outwit and capture\
      \ a notorious pirate gang who had given far older and more experienced officers a difficult time.\
      \ Has consistently proven himself to be a masterful strategist and tactician and also a competent\
      \ detective/investigator. Darth Sidious and Darth Vader hold him in high esteem; with the former\
      \ even going out of his way just to make plans to save Tarkin\u2019s life as men of his intellect\
      \ and talents were absolutely vital to the Galactic Empire)"
    source_ids: *id002
    confidence: 0.95
