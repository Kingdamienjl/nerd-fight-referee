- id: claim-weaknesses-3679f7ce
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Force Sense: Force sense is among the most basic of
    Force abilities. It can be used to feel another being''s feelings, the future, ripples in the Force
    caused by momentous or traumatic events, impending danger and the presence of the dark side. **Force
    Empathy: Force Empathy is a Force power related to Force Sense which involves picking up impressions
    of an individual''s feelings and general emotional state. *Force Sight: Force Sight, also known as
    Force Seeing or Combat Sense, is a basic Force ability. It enhances the bearer''s visual and spatial
    perception even in the dark or behind walls. **Farsight: Farsight, also called clairvoyance or farseeing,
    is the ability to gain vague impressions of events happening in other places or times using the Force.
    These visions focus on strong imagery and emotions. Jedi and Sith skilled in this technique were capable
    of detecting when friends and apprentices were in danger, examining details of past events, and predicting
    the probable outcome of a stated course of action. Farsight can also be applied to combat, allowing
    the practitioner to glimpse moves their opponent may make, as well as outside forces that might affect
    the battle. **Precognition: Precognition, also known as danger sense, is a universal Force power that
    manifests in the form of Force visions of future events, guiding premonitions or warnings, and an
    inflow of prescience that helped the user predict their opponent''s movements. **Psychometry: Psychometry
    is a Force power that is a mental technique of picking up impressions and traces of information about
    the object touched and the events that have surrounded it. *Force Stealth: Force stealth, also referred
    to as Force Concealment or Buried Presence, is a power that was used by highly skilled Force-sensitives
    to mask their Force alignment (Light or Dark), their ability to use the Force, or even their entire
    presence from other Force-sensitives. *Mind Manipulation: Mind Manipulation, also known as Mind Tricks
    or Mind Control, refers to a spectrum of Force powers which influence the thoughts of sentient creatures,
    most commonly used to coerce into agreement by suggestion or to cause one to reveal information. This
    allows its practitioners to resolve matters in a non-violent way. It can also be used to appeal to
    a sensory impression for distraction or cause friendly fire among enemies. **Drain Knowledge: Drain
    Knowledge is a dark side ability used to extract knowledge out of a sentient without his or her consent.
    Beyond simple reading of thoughts, the Drain Knowledge ability disrupts the Force to steal deep memories
    and information in a violent and merciless way, potentially leaving the subject psychologically damaged
    as a result. Pall used this to steal the knowledge of Sith Sorcery from the Sith people on Korriban.
    **Force Fear: Force fear is a dark-side Force power with which the wielder strikes directly at the
    deepest parts of the target''s mind, forcing them to see their worst fears. Through pure force of
    will alone, a user can cause them to lose their courage completely, and if left undefended, the effects
    can be severe, rapidly demoralizing the enemy with a feeling of hopelessness and regret. Depending
    on the victim, it can cause them to either cower defenselessly or flee from their opponent outright.
    ***Force Horror: A more advanced application of Force Fear, Fore Horror enables the Force user to
    cause multiple enemies to enter into a catatonic state of panic that was more severe and more difficult
    to defend than the basic Force fear. *Telekinesis: Telekinesis is a neutral ability that most Force-sensitives
    had which allows them to move and otherwise manipulate physical matter in a variety of ways, all with
    the power of the Force. The ability is virtually ubiquitous among Force sensitive individuals and
    organizations, though the techniques can differ greatly. It has a tremendous number of applications,
    both combative and utilitarian. **Force Push: Force push is a telekinetic ability of the Force that
    is used in an offensive or defensive manner. It can be used to varying degrees, from simply nudging
    or softly moving targets away from the user, to shoving and knocking them back, to sending them flying
    through the air, potentially causing serious injury or even death. ***Force Whirlwind: A more advanced
    form of Force Push, this technique allows the user to alter the air currents around an opponent, turning
    it into a maelstrom. This swirling force can lift an opponent into the air, spin them around, and
    leave them incapable of moving out of it, allowing the user to attack without resistance. **Force
    Barrier: Force Barrier is both an offensive and defensive Force power, aligned neither with the light
    or dark sides of the Force, that creates a barrier or wall of Force energy around the intended target,
    be it self, friend, or foe. *Tutaminis: Tutaminis is a set of Force abilities related to energy absorption.
    Designate'
  source_ids: *id003
