- id: claim-weaknesses-b32360fb
  section: weaknesses
  axis: weakness
  text: 'Standard ghost weaknesses. While he is still capable of speech, he sometimes acts like a dog.
    Notable Attacks/Techniques: Claws: Wulf has razor-sharp retractable claws from his fingers that can
    break through even anti-ghost shields, tear open portals to the Ghost Zone and other universes, tear
    ghosts from human bodies they are possessing, and more. While spinning at high speed, he can turn
    himself into a living drill that pierces the ground and tunnel through it. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Scroll box|Content={{Reflist|2}}}} ==Notes/Explanations== {{Scroll
    box|content=}} {{Scroll box|content=The form of Esperanto that Wulf speaks is not in any way grammatically
    correct and is in fact in almost all of his lines a direct word for word substitution from English
    equivalent words. For instance, The quote of him saying "Li estas al meti via amiko ena maliberejo!"
    is trying to say "He is going to put your friend in prison!" However, this is impossible to parse
    per Esperanto grammar, as it treating the prepositing ''al'' as the infinitive particle, and neglects
    to place ''via amiko'' and ''maliberejo'' in the accusative case. A possible correct form is "Li tuj
    enigos vian amikon en la malliberejon!"}} {{Discussions}} Category:Characters Category:Danny Phantom
    Category:Cartoon Characters Category:Good Characters Category:Male Characters Category:Ghosts Category:Criminals
    Category:Animals Category:Werewolves Category:Flight Users Category:Surface Scalers Category:Self-Sustenance
    Users Category:Ectoplasm Users Category:Non-Physical Interaction Users Category:Durability Negation
    Users Category:Incorporeal Characters Category:Intangibility Users Category:Invisibility Users Category:Possession
    Users Category:Data Users Category:Dream Users Category:Soul Users Category:Body Control Users Category:Regeneration
    Users Category:Immortals Category:Bodily Weaponry Users Category:Portal Users Category:Space Users
    Category:Enhanced Senses Users Category:Time Travelers Category:Prisoners'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
