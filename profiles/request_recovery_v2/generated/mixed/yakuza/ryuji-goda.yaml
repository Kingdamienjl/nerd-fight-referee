- id: claim-weaknesses-8ccbefe4
  section: weaknesses
  axis: weakness
  text: "Standard human weaknesses. Will put himself in harms' way to protect his loved ones and innocents,\
    \ and will still push himself to the limits, having no regards for his own life. Deeply cares for\
    \ Kaoru and his mother. Incredibly chivalrous and will refuse to take advantage of situations via\
    \ unfair means, and will not fight people unless they are at their peak. Seeks strong opponents and\
    \ will allow them to reach their full power for the sake of his honor. Notable Attacks/Techniques:\
    \ Unlike Kiryu, who has balanced style, Ryuji puts attack power above speed in his fighting style.\
    \ He uses a somewhat sloppy but very effective street fighting style, which could easily send Kiryu\
    \ flying several meters. He uses an array of haymakers, wild punches and fairly technical kicks to\
    \ attack. When he's using a katana, he doesn't swing it with much technique and accuracy, but combines\
    \ it with his normal physical attacks to deal large damage. ==Gallery== Ryu_no_kansai.jpg|Ryuji's\
    \ tattoo \u9F8D\u304C\u5982\u304F \u69752 OST - \u6563\u308B\u306F\u6C38\u9060\u306E\u5239\u90A3 -\
