- id: claim-powers-and-abilities-fe9a3d22
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Afterimage Creation (Can create faint afterimages of himself
    while dodging like other protagonists), Master Martial Artist (Akiyama claims that his fighting style
    isn't based on any particular pre-existing martial arts style despite it having heavy visual cues
    and similarities to that of taekwondo), Heat (General Abilities), Healing (With Staminan, Toughness
    et cetera), Expert Acrobat and Pseudo-Flight (Can keep kicking long enough to remain suspended in
    mid-air as he keeps chaining his combos. Can also gracefully perform various flips and rolling over
    enemies without breaking a sweat. Can easily leap large distances), Accelerated Development (Like
    other protagonists, can quickly learn new moves just after few repetitions), Weapon Mastery (Able
    to use a variety of weapons to great effect), Stealth Mastery (Managed to hide from the Triads for
    over 3 years up until Kiryu's return), Power Mimicry (Possesses the same ability as Kiryu to invent
    new fighting moves just by looking at them. Later used the IF-7R to learn the abilities of Kiryu,
    Tanimura, Majima and Saejima), Limited Subjective Reality (Akiyama can create a mental image of Hana
    by reminiscing about her, allowing him to complete the substories, noting that she had already left
    Sky Finance at this point and only returns at the end of Yakuza 4)
