    source_ids: &id002
    - mediawiki-633539
    confidence: 0.95
  attack_potency:
    text: Building level (Can fight Kiryu while teaming up with Tanimura, and can also fight the former
      on his lonesome. Fought against the Amon brothers, who gave Taiga Saejima a hard time, and can also
      fight the latter in the Coliseum tournaments, specifically in the Victory Road Finals in Yakuza
      5. Even went so far as to use Minamida's IF-7R fighting machine which further enhances one's ability
      to copy entire powersets, fighting against a simulation of Goro Majima, himself and various other
      foes of Kiryu and Saejima. Also held his own against Kazuya Amon twice and won), higher with Heat
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic movement speed (Can run and turn fast enough to leave blurs behind. Is also capable
      of kicking fast enough to keep his enemies suspended in mid-air. Easily kept up with his mentor
      Daijiro Saigo in two races, who claims to have outran a Cheetah once in a race to catch a zebra.
      His quicksteps are so fast that he can easily cross an entire bull-ring's worth of distance within
      a second) with Hypersonic+ combat speed and reflexes (Kept up with Kiryu in combat. Much like Kiryu
      and Majima, he too was trained to dodge bullets from submachine guns and pistols at close range
      by Daijiro Saigo, his mentor. His attacks are fast enough to leave afterimages and look like blurs.
      Also kept up with a simulation of Majima in the IF-7R, and easily kept up with Kazuya Amon), higher
      with Heat (Can casually move so fast that one moment he's standing in front of his enemy and on
      the other he's already above him via Meteor Strike)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'right|200px {{Quote|I suppose a guy in my line of work is probably biased, but... whether it''s
      family or the one you love, it''s tough to make anyone happy without money. Us men tend to take
      the responsibility pretty seriously. That''s why we''re all desperate to claw our way up to someplace
      stable. At least that''s my theory.|Shun Akiyama to Yasuko Saejima, Yakuza 4}} |-|Yakuza 5=right|350px
      {{Quote|You see, dreams get passed on from person to person. So I''m sorry, but there''s not a chance
      in hell I''m letting you get in Haruka-chan''s way.|Akiyama to Kanai about Mirei Park and Haruka
      Sawamura''s dream of becoming Japan''s top idol, Yakuza 5}} |-|Yakuza 6=right|360px {{Quote|Man...
      I just can''t bring myself to fight you for real. Got my ass kicked for nothing.|Akiyama to Kiryu,
      Yakuza 6: The Song of Life}} |-|Infinite Wealth=right|250px {{quote|You must really think I''m stupid!
      Both of you! For all the secrecy, it was pretty obvious. No way in hell you''d die that easy. And
      sure enough, right when the Tojo and Omi disbanded, I got word that ol'' six-feet-under Kiryu made
      a surprise visit. I figured, for sure, things must have cooled down by then. But nope. That was
      all she wrote. Kazuma Kiryu''s glorious return fizzled out like some urban legend. Not even a word
      my way, either. I guess I didn''t matter since I''m not part of your little gang.|Akiyama''s less-than-pleasant
      reunion with Kiryu and Date, Like a Dragon: Infinite Wealth}} ==Summary== Shun Akiyama is one of
      the newcomers of the series to be introduced in Yakuza 4, and in 5 as a returning character. A successful
      entrepreneur called the "Lifeline of Kamurocho", he runs Sky Finance, a loan agency that offers
      loans not based on a customer''s credit rating, but based on their commitment to get that loan.
      When the skeletons of the past come out of the closet, Akiyama becomes the first witness of an old
      grudge between the law and the families of the Tojo and Ueno Seiwa. ==Powers and Stats'
