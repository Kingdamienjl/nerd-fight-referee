  text: '{{Border|Visible=No|Content= |-|Yakuza 0= {{Border|Visible=No|Content= Superhuman Physical Characteristics,
    Afterimage Creation (Can easily create afterimages in all his appearances with all of his fighting
    styles, especially with Mad Dog style''s Shadow Trail ability), Master Martial Artist (Mad Dog of
    Shimano; a knife fighting style that makes use of quick knife slashes as a well as a mixture of punches
    and kicks. Also has other fighting styles like Thugger, Breaker and Slugger, and can match Kiryu in
    martial art skill with his aggresive fighting prowess), Pressure Point Strikes (Can deliver a brutal
    strike to the brainstem as a counter-attack), Weapon Mastery (Able to use a variety of weapons to
    great effect, most notably when using his knife and baseball bat), Heat (General Abilities), Berserk
    Mode (With Mad Dog of Shimano style and as seen when he has fought with the Dojima Family), Enhanced
    Senses (Capable of fighting while having his eyesight hindered completely, can parry bullets from
    point blank range without his one eye and casually dodge them from behind by hearing the slightest
    click of the trigger. Can also see what weapons the enemy has with them with "Keen Eye"), Superhuman
    Precision (Able to precisely catch a katana with his teeth and strike it at the hilt to launch it
    toward targets. Can throw a knife upward from behind his back and kick it at foes, and can even do
    so while trading blows with others. Is also able to punch his knife, bouncing it off walls and thin
    poles back into his hand, and easily deflect a barrage of bullets aimed at him and his allies), Stealth
    Mastery (Was able to get to the location while having Makoto with him and searched by the Yakuza.
    Capable of constantly sneaking up on Kiryu even when the latter has his guard up. Is also an expert
    in disguises. Faked his own death to stay under the radar to stop Kurosawa''s mad tyrannical grab
    for power), Talented Cabaret performer and singer, Power Mimicry (Mimicked his Breaker and Slugger
    style just by looking at few moves), Accelerated Development (Can create new techniques by spending
    money on himself in Yakuza 0), Healing (With Staminan and various other items, including a special
    Slugger ability that allows him to regain health so long as he has over two Heat bars full. Can also
    heal using his Heat), Acrobatics (With Breaker Style and Mad Dog of Shimano style. Can run down skyscrapers
    and take no damage from the fall and control his movements mid-air/jump from walls), Perception Manipulation
    (Just like Kiryu he can slow down his perception of time when he changes his battle style), Regeneration
    (Low - Heals from deep stab wounds and bullets with minimal medical aid and doesn''t have any scars
    on his body remaining. Doesn''t have any scars from his one year torture), Limited Physics Manipulation
    (Capable of removing the repelling force coming from his bat when he hits objects he can''t destroy
    while in Slugger Style), Extreme Resistance to Pain Manipulation (Survived in a chamber where he is
    tortured in the most painful way a human can ever dish out for a year straight and still wanted his
    boss to reinstate him as a yakuza), Resistance to Electricity Manipulation & Paralysis Inducement
