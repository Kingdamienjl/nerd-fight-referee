  attack_potency:
    text: Building level (Has repeatedly gone toe-to-toe with Kazuma Kiryu and punched him into a floor
      so hard that the entire hotel they were in violently shook and the floor beneath them crumbled to
      dust due to the punch's shockwave, doing all of this while having barely recovered from a gunshot
      he had received hours prior, and Kiryu would later tank this explosion merely a few days later with
      no damage at all. Also repeatedly fought against Saejima, who can hit this hard while having previously
      suffered from prison abuse and malnourishment, in many battles. Easily defeated a 12-year-old Ryuji
      Goda. Once fought against Jo Amon in Yakuza 0. Has repeatedly traded blows with the Legendary Musketeers,
      a group of land sharks who can easily destroy construction equipment with their bare hands), higher
      with Heat
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic movement speed (Can run and dodge bullets at the same time after the bullet has been
      fired, as seen in his fight with Kei Ibuchi. His Shadow Trail dodging maneuver via Mad Dog style
