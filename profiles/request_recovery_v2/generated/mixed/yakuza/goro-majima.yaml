  intelligence:
    text: Gifted (Highly skilled fighter. Managed to duke it out with Lao Gui, Asia's best hitman, and
      against Jo Amon, who is repeatedly noted in the series to be a master of almost all known forms
      of martial arts and to be one of the best fighters on the entire planet, having trained with various
      masters around the world and having killed countless warriors and having absorbed all their skills.
      Also took on the Coliseum and all of its fighters hailing from different parts of the world and
      remained the champion for one year straight after the events of Kiwami right until Kiryu takes back
      the title in Kiwami 2, and then again during the 2-year-period during 2007-2009 in Yakuza 3. Is
      also the head of his own family and has a knack for making massive profits on the fly despite having
      little discipline in such work environments. Has also managed a construction business all on his
      own by literally searching about it on the internet and is an incredibly talented performer and
      singer, and once managed two cabaret clubs at once. Is very fluent in the use of weaponry, ranging
      from his signature demonfire dagger, to wielding a katana, a baseball bat, and so on. He is usually
      shown to be capable in social situations in his substories in Yakuza 0 and can usually escape them
      with his tricks)
