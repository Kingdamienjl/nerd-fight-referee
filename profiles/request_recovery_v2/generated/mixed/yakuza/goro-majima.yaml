- id: claim-weaknesses-7c950fae
  section: weaknesses
  axis: weakness
  text: "Easy to anger and becomes abusive if irritated, and though he is capable of maintaining a level-headed\
    \ composure when necessary, the Mad Dog of Shimano combat style unleashes it in its full potential,\
    \ causing him to become severely unhinged and erratically insane, which leaves him vulnerable to losing\
    \ control of his own body to his own insanity and rage, though he overcomes this by the events of\
    \ Yakuza Kiwami 2 (It might also be that he maintains this persona of insanity in order to honor Nishitani's\
    \ memory). Selfless and loyal - will do anything to protect his friends, Kiryu, Makoto Makimura and\
    \ oath-brother Saejima, even if it means throwing away his own life. A bit hesitant to kill people\
    \ at times and relies completely on instinct when it comes to stress-inducing tasks like defusing\
    \ bombs. Notable Attacks/Techniques: ===Fighting Styles=== *Thug Style: Majima's canonical style throughout\
    \ Yakuza 0. A basic yet powerful style relying on rough martial arts and street fighting. Majima's\
    \ fighting ability is more refined in comparison to Kiryu's, using agile punches and kicks to take\
    \ down enemies, and later in the game, string together very long combos with the \"Combo Boost\" set\
    \ of abilities. This style has a wide variety of hidden tricks and underhanded abilities and represents\
    \ Majima's elegant and professional yet brutal handling of foes as Sotenbori's Lord of the Night.\
    \ It's a balanced style that bears blue Heat. *Slugger Style: The second fighting style that Majima\
    \ learns in the game: A Power style that focuses on brute strength and is marked by Majima's use of\
    \ a bat. Slow but powerful, Majima emphasizes his skill with a variety of weapons in combination with\
    \ his simple yet effective metal bat to create an entirely new form of martial arts said to be more\
    \ dangerous than anything he could achieve with a sword. Many attacks can be charged for maximum damage\
    \ and the ability to attack through enemies' guards. This style's Heat color is orange. *Breaker Style:\
    \ The third fighting style that Majima learns in the game: A capoeira-like style that combines martial\
    \ arts and breakdancing. The Breaker style is best known for its ability to quickly stun enemies with\
    \ a flurry of dance moves, landing hits a very rapid rate with many spinning techniques, as well as\
    \ its emphasis on Majima's agility and unconventional means of fighting. This style's Heat color is\
    \ light purple. *Mad Dog of Shimano: A style whose move set is based off Majima's attacks as a boss\
    \ throughout the series, the Mad Dog style is very elegant yet deadly. In combat, Majima relies on\
    \ his signature \"Demonfire Dagger\", utilizing slick and acrobatic fighting techniques. The best\
    \ of Majima's other styles, such as the weapon expertise of Slugger, the unconventional if not nonsensical\
    \ movements of Breaker, and the underhandedness of Thug meld into what is Majima's one-and-only signature\
    \ fighting style. This style's Heat color is dark purple. *Sea Dog: Sea Dog is a fighting style that\
    \ Majima uses while as Captain of the Goro Pirates: it utilizes pirate-themed weapons and tools to\
    \ take down rival pirates. It inculdes a wire hook to grab opponets, a Charge Gun which increases\
    \ in power the longer the button is held, and a pair of Cutlasses for close quarters combat and can\
    \ even be thrown like boomerangs. While progressing through the Legend of the Goro Pirates story,\
    \ Majima gains access to cursed instruments that summon manifistations of dark gods, he can only use\
    \ these instruments when his Madness Gauge is full. Notes: Not to be confused with Goro, Goro (Dark\
    \ Cloud), Goro Akechi or Gor\u014D J\u014Dizumi ==Gallery== File:MAJIMA TATTOO FULL.png|Majima's hannya\
    \ tattoo Majima dance.gif|Majima dancing to distract the civilians in Yakuza 0 VeneratedSnappyIbizanhound-size\
    \ restricted.gif|Majima doing the Hustle, Yakuza 0 File:Yakuza PS2 Majima render.jpg|Majima as he\
    \ appears in the original PS2 release of the first Yakuza game (2005) ClumsyEvenLacewing-size restricted.gif|Zombie\
    \ Majima doing the Hustle, Yakuza Kiwami Goromi profile.png|Goromi Majima Police.gif|Police Majima\
    \ surprising Kiryu Hannya man.jpg|Hannya-Man File:Majima dancing.gif|Majima dancing behind Kiryu to\
    \ irritate him Goro Majima Yakuza 2.png|Majima as he appears in the original PS2 release of Yakuza\
    \ 2 (2006) PXZ2-Goro.png|Majima as he appears in Project X-Zone 2 Majima dead souls.png|Majima's appearance\
    \ in Yakuza: Dead Souls Gor\u014D Majima (Yakuza 6) 02.jpg|Majima as he appears in Yakuza 6 ==Notable\
    \ Matchups== Victories: *Green Goblin (Raimi Spider Man Trilogy) Green Goblin's Profile (Both were\
    \ 20 metres apart, High 8-C missiles were restricted and speed was equal) Losses: *Tokai Teio (Umamusume:\
    \ Pretty Derby) Teio's Profile (This is a race. Majima\u2019s on his Y3 pink truck. The race starts\
    \ on a medium distance course, with Majima drives and crashes in right after the gates open) Inconclusive:\
    \ {{discussions}} Category:Like a Dragon Category:Characters Category:Male Characters Category:Game\
    \ Characters Category:Game Bosses"
