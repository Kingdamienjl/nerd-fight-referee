power_scale:
  tier:
    text: '{{8-C}} Name: Taiga Saejima, Tiger of Tojo, Eighteen Count Saejima Origin: Like a Dragon Gender:
      Male Age: 20 (at the time of his imprisonment in 1985), 45 (Yakuza 4), 47 (Yakuza 5), 51-52 (Yakuza
      6), 54-55 (Yakuza: Like a Dragon, Like a Dragon Gaiden: The Man Who Erased His Name), 58-59 (Like
      a Dragon: Infinite Wealth), 59-60 (Like a Dragon: Pirate Yakuza in Hawaii) Classification: Human,
      Yakuza, former member of the Sasai Family, Patriarch of the Saejima family, Teacher at Sodachi Dojo'
    source_ids: &id002
    - mediawiki-640321
    confidence: 0.95
  attack_potency:
    text: Building level (Effortlessly broke massive granite rocks with a single punch without even trying
      while severely weakened from malnutrition, having suffered a brutal prison torture session for days
      at an end and having to swim to Kiryu's orphanage. On par with Kiryu, won against Majima twice,
      with Majima being able to smash through building floors and even shake entire building complexes
      with his punches. Can also fight against himself and used the IF-7R to copy the abilities of Akiyama,
      Tanimura and Kiryu, including those of his foes. Easily defeated Jiro Amon twice), higher with Heat
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic movement speed (Easily kidnapped Kitakata, the local yakuza patriarch in Sapporo, within
      a few seconds while being inside a manhole, without anyone noticing anything in front of them. Can
      create blurs just by performing basic combat maneuvers. Can easily keep up with Majima in terms
      of movement) with Hypersonic+ combat speed and reactions (Easily kept up with Kiryu while malnourished
      and badly beaten from his abuse at prison, also had no problems keeping up with Majima in the same
      state, and can perform the same exact speed feats as them, as well as fight against Jiro Amon),
      higher with Heat
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 5 (Comparable to Kiryu and can replicate the same feats as him. Can also rip out electric
      boxes, street sign poles and swing them around with ease, and can also toss around motorbikes much
      like Beast Mode Kiryu. Easily overpowered Yama-Oroshi, a bear that destroyed entire houses with
      its tackles and was noted to be well over 2 meters in length and towering over the 1.9 meter tall
      Saejima by a massive margin. Ripped apart a gigantic metal pipe, later swinging it around like a
      club. Lifted a big metal prison bed and threw it several meters. Can casually send human beings
      flying several tens of meters. Completely stopped a car charging at him at top speed without even
      trying and while being caught off-guard and briefly managed to keep it from accelerating further
      before letting go. Should be comparable in strength to Jiro Amon and his brothers, who can casually
      swing around sledgehammers and wield demi-cannons with their bare hands), higher with Heat
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Building level, higher with Heat
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Building level (Unharmed by punching massive rocks and can take hits from himself, and also
      survived said rocks smashing into him at top speed, all while being malnourished and having suffered
      from a vicious prison beating days prior. Can take hits from Kiryu, Majima and other people of comparable
      power, like Jiro Amon), higher with Heat (With Herculean Spirit, attacks that would generally knock
      him off balance or stagger him, stop having an effect on him completely, making him nigh-unstoppable)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Survived being brutally assaulted and tortured in prison for years at a time, including
      a torture session that was supposed to kill him in the end, and not long after his escape, he managed
      to survive getting washed ashore to Okinawa and dueling it out with Kiryu and almost stalemating
      him, while being severely wounded and malnourished. Completely unfazed by bullets. Fought and defeated
      bare-handed severals yakuza members at once without tiring. On par with the likes of Kiryu and Majima
      in terms of endurance)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Several Meters with shockwaves (Unarmed), Extended Melee Range to Several
      Meters (With various weapons, from baseball bats to large telephone poles), Tens of Meters with
      a tornado.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted combat-wise (Can replicate techniques after seeing them just once. Taught multiple students
      to master-level fighting at Sodachi Dojo while very rusty. Kept up with Kiryu in terms of skill
      while rusty, wounded and malnourished. Highly skilled fighter and wooden sculptor), Above Average
      otherwise (Had it not been for poverty, he would have chosen to become a schoolteacher within a
      year or two after finishing school)
    source_ids: *id002
    confidence: 0.95
