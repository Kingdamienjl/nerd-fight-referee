- id: claim-powers-and-abilities-76b06cf4
  section: abilities
  axis: hax
  text: '{{Border|Visible=Yes|Content= *Superhuman Physical Characteristics *Afterimage Creation (Can
    make brief blurs of himself while dodging like many other characters) *Expert Martial Artist (Primarily
    Pro Wrestling, also briefly managed a dojo alongside Sodachi) *Heat (General Abilities) *Regeneration
    (Low - Comparable to other characters. Healed from frostbite. Heals from regular tortures over the
    course of few weeks) *Weapon Mastery (Able to use a variety of weapons to great effect) *Shockwave
    Inducement (Via Tiger Essence of Shockwave) *Air Manipulation (Created a large tornado in Yakuza 7)
    *Acrobatics (Is proficient at rolling. Can jump this high) *Healing (With Staminan Royale and others)
    *Accelerated Development (Can learn new techniques after battles and quickly regained his old strength
    after escaping prison) *Power Mimicry (Via Revelations, can copy techniques after seeing them just
    once) *Pressure Points (With Tiger Dragon Drop, Saejima counters the opponent''s move by headbutting
    them in their solar plexus, inducing stun) *Stealth Mastery (Silently kidnapped a yakuza patriarch
    in front of an entire crowd without them noticing. Could hide from policemen while they were searching
    for him in entire Kamurocho) *Limited Fear Manipulation (His aura was overpowering enough to be felt
    by Tianyou Zhao, Ichiban Kasuga, and Yu Nanba, who was fearful and noted that something was "off"
    about him and Majima) *Limited Subjective Reality (Along with Himura, Saejima can create an imaginary
    recreation of Sapporo. Activities done there can also have permanent, tangible effects on the real
    world, such as him becoming stronger after beating up thugs or having his karaoke high score saved,
    just like when doing activities in the actual cities) *Incredibly-Skilled Sculptor (Can make highly-detailed
    statues of his combat moves in a heartbeat) *Resistance to Extreme Cold (Rapidly recovered from the
    effects of frostbite without any damage to his tissues and went back into the cold) }}'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
