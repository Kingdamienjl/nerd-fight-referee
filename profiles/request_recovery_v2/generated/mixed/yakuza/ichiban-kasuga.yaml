- id: claim-powers-and-abilities-2c54ffa2
  section: abilities
  axis: hax
  text: "{{Border|Visible=Yes|Scroll=Yes|Content= *Superhuman Physical Characteristics *Heat (General\
    \ Abilities) *Extrasensory Perception (Despite being claimed as \"imaginary\", Ichiban\u2019s perception\
    \ has been shown to affect the real world to some extent, as it is \"infectious\" to Kiryu. Despite\
    \ lacking Ichiban\u2019s JRPG mindset and is clearly not delusional, he still explicitly experiences\
    \ combat through this same kind of vision, describing it as \"seeing what a hero would see\") **Status\
    \ Effect Inducement (Burn, Cold, Paralyze, Stun, Poison, Drunk, Bleed, Sleep, Fear, Charm, Brainwash,\
    \ Rage, Silence, Blind and CurseList of Status Effects) **Summoning, Healing, Statistics Amplification,\
    \ Statistics Reduction & Energy Projection via smartphone (Can summon Poundmates to assist in battle\
    \ by healing, recovering MP, buffing party members, or attacking and debuffing enemies. Can also summon\
    \ a satellite to fire a destructive energy beam) *Likely Afterimage Creation (Comparable to all other\
    \ characters that can create afterimages with sheer speed, can himself create afterimages with certain\
    \ martial arts) *Power Mimicry *Healing (Via Staminan, Tauriner, Toughness, and other abilities) *Social\
    \ Influencing (Ichiban is highly charismatic and his optimism is borderline contagious. Can boost\
    \ his team member's morale when they become demotivated) *Master Martial Artist and Skilled Dancer\
    \ (His fighting style depends on what job he chooses, of which there are many and all of which he\
    \ can switch between on the fly when not in combat) *Acrobatics (Via Dancer style, which is very similar\
    \ to Goro Majima's Breaker Style) *Weapon Mastery (Can wield weapons like baseball bats and swords\
    \ proficiently) *Vehicular Mastery (As seen for example here) *Vibration Manipulation (With massagers)\
    \ *Shockwave Generation (Using Heat he can make his attacks ranged), Explosion Inducement (With rocket\
    \ launchers), Elemental Manipulation (Can manipulate electricity with the Legendary Hero Bat and manipulate\
    \ lightning and with some of his swords, can also manipulate fire-based items) }}"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
