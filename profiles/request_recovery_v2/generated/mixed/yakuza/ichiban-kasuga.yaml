power_scale:
  tier:
    text: 'At most {{8-C}}, higher with Heat Mode and items, even higher with satellite Name: Ichiban
      Kasuga, Ichi, the Hero of Yokohama, the Rock Bottom Dragon Origin: Like a Dragon Gender: Male Age:
      42 (Yakuza 7: Like a Dragon), 46 (Like a Dragon 8: Infinite Wealth) Classification: Human, ex-Yakuza,
      ex-CEO of Ichiban Holdings, ex-real estate agent, Hello Work employee'
    source_ids: &id002
    - mediawiki-3941071
    confidence: 0.95
  attack_potency:
    text: At most Building level (Fought against an excavator alongside his friends. Also fights against
      and defeats a wrecking ball. Also fights against and defeats 3 circus animals- a bear, a tiger and
      a chimpanzee operating an excavator. Later with the help of his party, fights against both Goro
      Majima and Taiga Saejima and defeats them, leaving them somewhat battered and surprised, though
      the latter two eventually revealed that they were yet to fight at their true potential. Also goes
      toe-to-toe with the legendary Kazuma Kiryu, though Kiryu was immensely holding back, and though
      Kiryu still ultimately defeated him and his entire party after a lengthy fight, he commended Ichiban
      to actually be a decent fighter, stating that he would have fared better if he wasn't clouded by
      anger at that time, even going so far as to tell Ichiban that he was worthy enough to be the "real
      deal" in the near future. Later also fights against and defeats Shin Amon, with the latter even
      commending Ichiban to be worthy to succeed Kiryu as the next "legendary dragon"), higher with Heat
      and items, even higher with satellite (Can split the clouds and create massive craters into the
      ground)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic with Hypersonic+ combat speed and reactions (Can easily keep up with the likes of Han
      Joon-gi, Kiryu, Majima, and Saejima and can perform the same feats as them, like perfectly parrying
      bullets after they are fired right before they hit or even outright dodging them, as seen in Shin
      Amon's second rematch in the True Final Millennium Tower, his fellow party members can replicate
      said bullet-parrying feats), higher with Heat, Massively Hypersonic+ attack speed with Essence of
      Lightning Rod (Can summon cloud-to-ground lightning bolts from the sky when having the Bodyguard
      Job equipped, in order to electrocute his enemies, though this will harm him as well)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 5 (Easily restrained Han Joon-gi and can replicate the same feats as the rest of the Yakuza
      protagonists, like holding his own against a tiger, and then even going so far as to fight against
      the old protagonists, as seen in his fight against Saejima and Majima. Somewhat comparable to, but
      weaker than his friend and party member Koichi Adachi. Held his own against Beast Mode Kiryu for
      extended periods), higher with Heat and items
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At most Building level, higher with Heat and items
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At most Building level (Can take hits from the likes of Han Joon-gi, Kiryu, Majima, and Saejima,
      and can withstand their combined hits with minimal health loss. Withstood hits from excavators and
      wrecking balls without much effort), higher with armors and even higher with Heat
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman. Capable of withstanding brutal beatdowns from yakuza legends like Majima and Saejima
      and still hold enough energy to mow down the combined forces of both half the Omi Alliance and the
      Tojo Clan. Can increase his stamina with various food summons and items like Staminan, Tauriner,
      and Toughness.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, can increase his range with Heat; Tens of Meters to Hundreds of Meters
      with firearms; Hundreds of Kilometers to Thousands of Kilometers via satellites after he completes
      the Real Estate Business side-mission
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (Shown to be a highly-capable businessman, race-car driver, and entertainer, and is also
      shown to be academically capable despite being a high-school dropout, being able to pass exams of
      varied fields at Ounabara Vocational School. Can quickly adapt to his new jobs and quickly adapted
      to the more technologically advanced world despite spending 18 years in prison. He is also a very
      capable and charismatic leader of his party, and can form surprisingly clever plans to get the drop
      on his enemies)
    source_ids: *id002
    confidence: 0.95
