- id: claim-weaknesses-100e28ea
  section: weaknesses
  axis: weakness
  text: 'Somewhat addicted to RPG games, which causes him to see the world in an RPG form, and is usually
    laid-back. Can only shift between fighting styles when not in combat, and can at times let anger get
    the best of him. Summoning some of his attacks can turn out to be a double-edged sword, as they will
    damage him as well. ==Gallery== Ichibantat.png|Ichiban''s tattoo, a dragon-koi, which signifies his
