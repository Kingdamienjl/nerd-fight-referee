  intelligence:
    text: Above Average. A capable fighter, Aguilar could handle himself against multiple enemies in both
      armed and unarmed combat, wielding a range of weapons including swords and spears with great skill.
      Additionally, he proved to be proficient at archery, using a bow and arrow to deadly effect in both
      long and close range combat. Like many Assassins, Aguilar was also trained in freerunning, being
      able to move across the rooftops of Seville quickly and creatively, ducking in and out of buildings
      and dashing across ropes in an effort to lose his pursuers. He also mastered the Leap of Faith,
      using it on two separate occasions to escape from his enemies. Eventually, he was able to rise to
      the rank of Master Assassin in his later years and eventually, as Mentor of the Spanish Brotherhood.
    source_ids: *id002
