- id: claim-weaknesses-3b4e646a
  section: weaknesses
  axis: weakness
  text: 'Standard human weaknesses, but has survived situations which would kill most peak-level humans.
    As he was tortured relelentlessly and brought up by the Cult of Kosmos''s barbaric methods, Alexios
    could easily lose his composure and kill all those who stood in his way regardless of their alleigance
    due to his severely damaged psyche, and could also lose his temper. Suffers continuous conflict over
    his decision to lead the Cult of Kosmos and his willingness to do good, and as a result, loses his
    will to live. Notable Attacks/Techniques: Thanks in part to his bloodline, and the Isu sword he possessed,
    Deimos displayed powerful feats in combat. He is able to thrust his sword into the ground to release
    blasts of energy and can even project beams of energy from the tip of his sword. His combat prowess
    was so vast, that was even able to brutally massacre Brasidas, a highly skilled and experienced Spartan
    warrior within a few seconds as well as going toe-to-toe with Kassandra and her Spear. Note: Alexios
    is one of two selectable protagonists in Assassin''s Creed: Odyssey, alongside Kassandra. Regardless
    of who the player chooses, the two protagonists share the same story, and thus, the same feats, so
    both of them are interchangeable. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
