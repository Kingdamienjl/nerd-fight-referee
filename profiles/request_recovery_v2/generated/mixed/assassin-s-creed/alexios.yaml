- id: claim-powers-and-abilities-90f1c0dd
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Peak Human Conditioning (Can hold his breath longer than
    most normal people), Extreme Pain Tolerance, Enhanced Senses, Extrasensory Perception, Analytical
    Prediction, Retrocognition, Psychometry, Information Analysis and Clairvoyance (via Athena's Sight),
    Master Fighter, Pressure Point Strikes, Weapon Mastery (throwing daggers, swords, spears, bow etc.),
    Aura Generation, Highly skilled acrobat, Stealth Mastery, Regeneration (Mid-Low, can survive being
    repeatedly stabbed and heal from such injuries. Fully healed after getting shot in the back with an
    arrow), Extreme Pain Tolerance, Can create illusions and bend minds to the user's will (via Pieces
    of Eden), Forcefield Creation, Healing and life absorption (Can heal himself by attacking enemies
    via certain weapons), Technology Manipulation (As an Isu-Hybrid, Alexios is capable of interacting
    with and using First Civilization technology without suffering from any detrimental effects.), Poison
    Manipulation (Some of his weapons have the ability to poison enemies, can also do this via poison
    darts, including his Spear), Statistics Amplification (via several abilities and Rush Attacks), Fire
    Manipulation and Explosion Manipulation (via many other weapons, and arrows), Sleep Inducement (via
    sleep darts), Empathic Manipulation (Can turn a foe against his/her enemies), Smoke Manipulation (via
    smokescreen), expert user of poisoned knives and daggers. Stealth Mastery and Rage Empowerment, Time
    Slow with Sixth Sense, Archery Master, Slow Time and Defensive Maneuvers Skills, Energy Manipulation
    (via Sword of Damokles), Shockwave Inducement (via Sword of Damokles), Status Effect Inducement (Can
    put people to sleep with some of his weapons or even stagger them). Possesses all of Kassandra's abilities
    and skillsets if he is chosen as the protagonist |-|Resistances=Resistance to Illusion Creation, Mind
    Control, Mind Manipulation, Madness Manipulation (Types 1 and 2), Sleep Manipulation, Empathic Manipulation,
    Fear Manipulation, Death Manipulation, Perception Manipulation, Sense Manipulation, Status Effect
    Inducement, Paralysis Inducement, Transmutation, Disease Manipulation, Life Absorption (He should
    naturally possess these abilities due to being an Isu-Hybrid, who lack the neurotransmitters required
    for the Pieces to control the general human populace. Should possess the same resistances as other
    Isu-Hybrids and his sister), Telekinesis, Poison Manipulation (Repeated bites from venomous snakes
    seem to have no effect on him. Can brush off Kassandra's poison arrows), Disease Manipulation and
    Extreme Temperatures (Can survive being burned for extended periods of time and can easily climb high-altitude
    mountains in sub-zero conditions without breaking a sweat)
  source_ids: *id003
  decisive: true
  status: unverified
