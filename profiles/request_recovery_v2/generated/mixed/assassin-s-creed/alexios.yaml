  attack_potency:
    text: At least Small Building level+ (Is a direct descendant of Leonidas I, himself an Isu-Hybrid
      containing high concentrations of Isu DNA due to being a direct descendant of theirs, and thus should
      be superior to most other Isu-Hybrids. Traded blows with his sister Kassandra and is equal to her,
      and is essentially capable of replicating the same feats as her. Brutally massacred Brasidas, a
      highly skilled and experienced Spartan warrior, himself being on par with Kassandra, within a few
      seconds. Was repeatedly stated and confirmed to be so powerful and ruthless that even the combined
      might of the armies of the Delian League and Sparta would be wittled down to pieces of meat before
      him, regardless of their skill level, with basic Greek soldiers being able to somewhat hold their
      own against the Minotaur and against the likes of Darius), higher with Rage Mode and the Sword of
      Damokles (It is actually a Sword of Eden. Clashed against Kassandra's Spear of Leonidas)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Supersonic+ (Easily fought against a Spear-amped Kassandra with his Sword of Damokles,
      and could easily overwhelm her even if she had used her time-slow abilities, and can replicate the
      same feats as her. Can move fast enough to leave behind blurs and jump several meters quite quickly),
      higher with Rage Mode, Bull Rush. Sixth Sense, Slow Time, Defensive Maneuvers and Archery Master
      Skills
    source_ids: *id002
    confidence: 0.95
