  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Abilities \u25BE= {{#tag:tabber| {{!}}-{{!}}Physically=\
    \ {{Border|Scroll=No|Visible=No|Content= *Superhuman Physical Characteristics *Regeneration (Low)\
    \ *Longevity (Several other comparable clones were noted to be modified to live far longer than the\
    \ average person, with 47 himself having been noted to be the same case) *Enhanced Senses (Was able\
    \ to overhear a conversation between two targets from an alley on the other side of the street. It's\
    \ implied he could hear Soders and Diana's conversation outside the interrogation room. Diana noted\
    \ that he had unusually acute senses in the tutorial level, which allows him to single out his targets\
    \ among crowds and through walls over hundreds of meters. In a comic, this is shown to be not just\
    \ a gameplay mechanic, as 47 can canonically simply visualize people through walls from a kilometer\
    \ away. This also allows him to see landmines hidden in smoke and sense their trigger radius, and\
    \ he can see through smoke in general. His absurd spatial awareness is further shown in a comic, where\
    \ 47 is able to headshot a man on a speeding train by triggering an explosive set next to a pipe,\
    \ triggering it at just the right moment to send it flying at the man) *Perception Manipulation (With\
    \ Instinct: Possesses Instinct, which allows him to pinpoint objects and locations of interest, pinpoint\
    \ weak-spots, gain information from objects, people and whatnot, identify targets, allows him to be\
    \ disguised in sticky situations, locate hidden traps, see in pitch-black conditions etc. His other\
    \ senses also greatly help in utilizing Instinct to his maximum potential. Can even slow down time\
    \ to a crawl, although this doesn't work on enemies who are comparable to him in speed *Indomitable\
    \ Will (No matter the situation, 47 will never give up on his tasks nor back away from it, and will\
    \ always find a solution to whatever problems he faces in his path. As a result, he is emotionless\
    \ in most of his missions, but has constantly regarded himself to take no joy in killing his targets\
    \ either) *Several More Abilities... (As he was designed to be the perfect assassin, he is capable\
    \ of doing anything humans have ever done)}} {{!}}-{{!}}Skill= {{Border|Scroll=No|Visible=No|Content=\
    \ *Extraordinary Genius Intelligence (Master tactician and strategist, Master survivalist, Master\
    \ hunter, Multi-Lingualist) **Master Martial Artist (Highly skilled in several martial arts, 47 favors\
    \ a brutal, economic, and efficient style for quick takedowns, showing a mastery of Krav Maga, Aikido,\
    \ Muay Thai, Judo, Wing Chun, Dirty Boxing, Ninjutsu, and likely many, many more styles since 47 is\
    \ implied to spend his free time constantly training his mind and body for the next mission. As such,\
    \ 47 is shown to dominate almost any opponent he comes across, even casually outmatching a professional\
    \ MMA fighter based on a real life champion. Even Victoria, an inferior genetically engineered clone,\
    \ was shown slaughtering several armed mercenaries instinctually. Fellow clone Lucas Grey states he\
    \ is by far the greatest assassin in the world, redefining the art with his career) **Photographic\
    \ Memory (As shown in Hitman: Contracts, which takes place inside 47's head while he's bleeding out\
    \ from a gunshot wound, 47 can perfectly recall his memories) **Pressure Point Strikes (Has innate\
    \ knowledge on human anatomy and can easily strike at his enemies' pressure points to knock them out\
    \ or even kill them) **Social Influencing (Social Position, Reputation, Instigating Fear, Deception,\
    \ Coercion & Charisma; Among those who know of his existence, 47 is widely renowned and feared as\
    \ the world's greatest assassin by far. In fact, in Hokkaido, Soders will die from fear should he\
    \ see 47. On missions, one of 47's go-to tactics is disguising himself as staff, guards, or important\
    \ people to do things he could otherwise not do. Nonetheless, 47 is quite charismatic on his own if\
    \ he feels like it. Several women have shown attraction to him throughout the series, and he acquired\
    \ a girlfriend as part of a mission prior to Absolution) **Expert Acrobat (While he may not look like\
    \ much, 47 is capable of quickly climbing up buildings, latching onto pipes and performing several\
    \ more feats of acrobatic strength) **Weapon Mastery (47 is a monster with anything that can be held\
    \ by human hands. In terms of conventional weaponry, he's a professional marksman able to casually\
    \ land precise shots and gun down groups of heavily armored and heavily armed foes, with perhaps his\
    \ most absurd feat being landing a ricochet headshot on Silvio Caruso from hundreds of meters away\
    \ with a snipe rifle through the opening of an observatory telescope. In Sniper missions, 47 is shown\
    \ to be able to apply his brilliant mind creatively even from afar, hiding bodies, creating electrical\
    \ traps, and luring targets and civilians with his bullets while accounting for ballistic factors.\
    \ Most famous, however, is his mastery of unconventional weapons, as a"
