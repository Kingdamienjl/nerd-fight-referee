- id: claim-standard-equipment-bafbd724
  section: equipment
  axis: equipment
  text: 'His signature Silverballers (custom AMT Hardballers which are essentially stainless steel M1911s,
    can be fitted with a suppressor and other attachments to aid accuracy), an FN F2000, the Walther WA2000
    sniper rifle (His signature sniper rifle, can be customized similarly to his Silverballers) or a custom
    Sako TRG (This was his signature sniper rifle in Hitman: Absolution), his signature black suit with
    a white shirt and red tie paired with his black gloves (Can also wear a white counterpart), Fiber-wire,
    sometimes Anaesthetic, Poison/Sedative Syringes and remote bombs, may also carry a full-body coat
    with him at times. Whatever weapon or household item he can get his hands on in the middle of any
    mission.'
  source_ids: *id003
