power_scale:
  tier:
    text: '{{9-B}} physically, higher with melee weapons, firearms and even higher with normal explosives,
      at least {{9-A}} to at least {{8-C}} with C4 and his strongest weapons generally, even higher with
      preparations Name: None, only known by various nicknames, such as Agent 47, The Ghost, Silent Assassin
      or the Hitman, typically uses the alias "Tobias Rieper" Origin: Hitman Franchise Gender: Male Age:
      55 years old (however, IO Interactive stated that he was ageless) Classification: Genetically-engineered
      clone, assassin'
    source_ids: &id002
    - mediawiki-383150
    confidence: 0.95
  attack_potency:
    text: 'Wall level physically (Able to fight, disarm, knock out and kill trained soldiers with full
      body armor and even multiple such foes at once bare-handed, and can even stab through kevlar and
      plated armor. Can casually break bones and snap grown men''s necks, and has done this to comparable
      foes numerous times. Can easily trade blows with those who can harm him. Can also contend with and
      defeat other genetically engineered superhuman assassins that are far superior to Pablo Ochoa, who
      himself can casually brush off multiple barrages of minigun rounds and is outright immune to weaker
      guns, and comparable to 47 in durability, like when he easily took on and wiped out hordes of Agent
      48s, and the Agent 48s themselves were immune to weaker guns, much like Ochoa. Easily and vastly
      superior to Sergei Zavorotko, who casually bolted through a thick wooden platform while heavily
      wounded, and could still survive multiple headshots from high-power sniper rifles. Effortlessly
      stomped Sanchez, a 200 kg man who was enhanced with various serums and had double the muscle capacity,
      and casually snapped his neck. Can throw household items at people so hard he can actually kill
      them on the spot, forcing him to hold back, and he can even do this to helmeted characters. Can
      even throw snowballs hard enough to knock people out. In the first mission of Hitman: Blood Money,
      he slammed a guard against the gates so hard that it took 47 only one hit to kill him, and 47 was
      on the other side of the gate, even forcing open the locked gate in the process. Capable of shattering
      security glass with a casual elbow. Is second only to his best friend Lucas Grey), higher with melee
      weapons, firearms (Has no problems one-shotting large animals like jaguars and hippopotamuses with
      just one bullet from his Silverballers, regardless of where he shoots them. Can easily penetrate
      walls, high-tech kevlar armor and even thick armored plating. Also makes use of anti-materiel rifles
      and armor-piercing ammo, as seen in Hitman: Blood Money) and even higher with normal explosives
      (Can easily blow up gigantic metal gates), at least Small Building level to at least Building level
      with C4 and his strongest weapons generally (Created a massive avalanche with a sonic device. Has
      blown up buildings, submarines, gas stations, wrecked racecars in Miami, and much more with the
      help of his creativity. His explosives can create explosions with fireballs several stories tall),
      even higher with preparation (Could launch nuclear weapons if he wishes to, as seen in Hitman: Codename
      47)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Superhuman (Genetically engineered peak human specimen designed to trump over even the best
      of peak athletes. Easily managed to outmaneuver a jaguar during his mission to kill Pablo Ochoa.
      Not even high-tech security cameras can keep track of a casually-jogging 47) with Supersonic+ combat
      speed and reactions (Shot four men who were already locking on him before they could react. Capable
      of easily blitzing multiple clones comparable to him. Can draw his guns and fire faster than those
      who are already pulling the trigger. In Hitman: Damnation, 47 easily gunned down two bodyguards
      with a Glock before the man 47 previously shot could even register the fact that he was shot, taking
      only 2.3 seconds to finish the whole ordeal. Later on during an attempted snipe, 47 perceives the
      entire world as frozen for a very long time from his perspective. Has also been shown to dodge bullets
      at point-blank range multiple times, his fight with Mark Parchezzi III being a notable example,
      and has also fought against foes who can do the same, like Masahiro Hayamoto and his ninjas, who
      can dodge rounds from the M4 Carbine rifle at barrel-length), Subsonic+ (Makes use of M1911s) to
      Supersonic+ attack speed with firearms and sniper rifles (Uses M4 Carbines and the Barrett M95,
      which is equals with the M82), even higher with preparation'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 1 (Capable of overpowering comparable genetically-enhanced assassins and Sanchez,
      a supersoldier weighing in at over 200 kg enhanced with steroids possessing twice the muscle capacity,
      with just one arm. Capable of easily lifting, flipping and slamming such overweight foes with just
      his garrote, like Tzun. Can effortlessly snap necks with minimal leverage which would require forces
      exceeding 1000 lbs. Capable of breaking bones and crushing necks with just grip strength alone.
      Capable of easily ripping handcuffs apart. Capable of hanging fully-grown men with just his garrote
      and then stealthily lifting them up without making a noise. Can casually wield a two-handed sword
      without any problems and easily skewer through skulls one-handed. Has no problems holding his own
      against fierce winds from fans that can easily send humans flying into the horizon. Can casually
      do this. Pushed a boat into the ocean all by himself at the end of the first mission of HITMAN 2.
      Casually flipped a large table all by himself)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level (He is capable of harming himself and foes like Ochoa, Agent 48s and Zavorotko with
      his own blows. Even an inexperienced 47 was measured to have stats, reflexes, and skill "off the
      charts" by the ICA, showing his massive superiority to every other assassin in the agency and scaring
      Director Soders into considering him too dangerous to use altogether)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Wall level normally (Easily survived an explosion initiated by Mark Parchezzi III and was only
      briefly knocked back. A few months before the start of Hitman: Absolution, 47 tanked an avalanche
      with minor injuries, though the whole ordeal took him 14 weeks to recover from due to the immense
      back pain resulting in being stuck inside a crevice due to said avalanche. Fell into turbulent ocean
      waters from an altitude of over 1000 feet and survived, and remained unconscious for seven hours
      in the cold and violent waters without issue. Survived being hurled through a door by Sanchez. Tanked
      a massive RPG-7 explosion while staying at a motel, which destroyed the room he was residing in
      and caused significant damage to the whole motel overall. Survives similarly powerful explosions
      on a regular basis. Can easily withstand blows from enemies like Agent 48s and Zavorotko with little
      to no damage. Can take multiple high-caliber rounds at point-blank and still keep on with his mission
      as if nothing happened to him. Far superior to his handler, Diana Burnwood, who, as a child, survived
      47''s car bomb that killed her parents, which sent her flying back hard enough to crack stone. Superior
      to Ort-Meyer''s guards, who could tank a grenade that blew a hole in the floor]), higher with body
      armors'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Has rarely shown signs of tiring even when heavily wounded with high-caliber bullets
      designed to blow up armored personnel. In some cases the pain means absolutely nothing to him. Can
      go on for weeks without food or water and still be in peak shape)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Extended Melee Range with melee weapons, Several Meters with thrown weapons.
      Hundreds of Meters with firearms, Kilometers with sniper rifles (Has been renowned of having an
      accuracy that trumps even the best of marksmen), higher with high-yield explosives and sound-based
      weapons. Hundreds of Kilometers with nuclear bombs, should he wish to use them.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Extraordinary Genius |-|Cognition= *Has photographic memory *47 notes that for every mission\
      \ he carefully studies and memorizes guard routes, personalities, camera and light positions and\
      \ angles, and many more details. *Can process information extremely quickly, allowing him to slow\
      \ his perception of time when focused via instinct. This also extends to his reading speed in the\
      \ WoA trilogy, being able to read documents and scan files in seconds *Owing to his enhanced senses,\
      \ 47 can accurately visualize and track dozens of people through walls, showcasing his exceptional\
      \ memory, as ordinary humans working memory is at 7 \xB1 2, and visual spatial ability. *In the\
      \ same mission, 47 can solve a chess puzzle resembling Fischer vs Spassky 1972 by moving Queen to\
      \ G3, recreating Fischer's move with almost certainly no prior experience. *Implied to be fluent\
      \ in several languages, which at minimum include: English, French, Spanish, Mandarin, Japanese,\
      \ Siamese, Hindi, German, Romanian, Cantonese, Hungarian, Dutch, Italian, Malay, Dari, Pashto, Arabic,\
      \ and Russian. *When playing against Le Chiffre, 47 is able to mentally calculate his chances of\
      \ winning mid-game in seconds *Noted as being extremely adaptable by Ort-Meyer due to his ability\
      \ to master new weapons in seconds *Generally, 47's ability to rapidly master skills and acquire\
      \ sufficient knowledge to pose convincingly as members of professions, some of whom would need to\
      \ undergo years of training, shows his extremely high fluid intelligence and rate of learning |-|Knowledge/Skil"
    source_ids: *id002
    confidence: 0.95
