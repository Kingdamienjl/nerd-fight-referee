- id: claim-weaknesses-666b4ca6
  section: weaknesses
  axis: weakness
  text: "Despite his perfection as an assassin, he still has the same biological needs as any other normal\
    \ human, though he can go weeks without supplies or rest and maintain optimal capacity. His emotionless\
    \ demeanor and apparent lack of empathy frequently make it difficult for people to connect with him.\
    \ He has a soft spot for children, particularly Victoria, which frequently comes into conflict with\
    \ his ruthless nature (but if he is motivated enough, he will not hesitate to kill innocents or even\
    \ small animals like birds). He will put himself in danger to protect those he loves. He rarely expresses\
    \ his emotions to anyone, believing that doing so would jeopardize his mission. His Instinct cannot\
    \ slow his perception of opponents who are as fast as he is, and his precognition is only useful for\
    \ trail location. He can be pretty stubborn at times and will not abandon his mission at any cost,\
    \ even disobeying orders and taking matters into his own hands. Prior to Hitman: Absolution, he was\
    \ briefly addicted to painkillers. As a result of being brainwashed as a child, the majority of his\
    \ prior memories of Providence have been erased, though he has been gradually regaining them, and\
    \ they do not actually impair his abilities. The Walther WA2000 sniper rifle requires constant maintenance\
    \ to maintain its accuracy. Notable Attacks/Techniques: *Silent Assassin: Agent 47 is well-known within\
    \ the ICA due to his method of untraceable assassination, which has led some to question his very\
    \ existence. He has been known to infiltrate a location, eliminate only his designated target, and\
    \ then vanish without firing a single bullet. Additionally, he is an expert at disguising himself.\
    \ *Athletic ability: Agent 47 has been shown to be able to suspend himself, walk on ledges, and scale\
    \ gutters with ease. He can also drag and lift a fully grown man. *Master Martial Artist: Although\
    \ Agent 47 rarely engages in close combat, he is capable of defeating many trained guards and much\
    \ larger adversaries such as Sanchez and Tzun. He also possesses knowledge of every martial technique\
    \ known to man, courtesy to Ort-Meyer's training and experiments bordering on torture and reformation.\
    \ His martial arts prowess was showcased when he defeated \"The Disruptor\", a game variant of Conor\
    \ McGregor. *Master Marksman: Agent 47 has used a variety of firearms on various missions without\
    \ difficulty or loss of accuracy. With just ordinary handguns, he can headshot a person from hundreds\
    \ of meters away. Knives, axes, swords, and even common household items can be thrown with deadly\
    \ accuracy. *Instinct: Agent 47 is capable of sensing and predicting the movements of anyone in his\
    \ vicinity, even those hiding behind walls. He accomplishes all of this without making eye contact\
    \ or requiring any external assistance. He can theoretically shoot as many people as he wants with\
    \ Instinct, as long as he has enough bullets. He can also discern objects of interest, identify weak\
    \ points, and possibly see past events. *Mentally trained: Agent 47's calm and focus never wavers,\
    \ no matter what the situation. ==Notable Matchups== Victories: *Frank West (Dead Rising) Frank\u2019\
    s Profile (Speed was Equalized) *Loid Forger (Spy x Family) Loid's Profile (Speed was equalized, both\
    \ had one weeks worth of prior information and both had access to all their equipment.) *Chisato Nishikigi\
    \ (Lycoris Recoil) Chisato\u2019s Profile (Battle took place inside Berlin's Club H\xF6lle, speed\
    \ was equalized and starting distance was 30 meters) Losses: *Spider-Man Noir (Marvel Comics) Noir's\
    \ Profile (Speed was equalized) *T-800 (Terminator) T-800's Profile (47 had equipment up to 9-B, T-800\
    \ key was used) *Rainbow Dash (Human World) (My Little Pony) Rainbow Dash's Profile (Base Rainbow\
    \ Dash used, Agent 47 had 2 weeks of preparation time, starting distance was 100 meters with no line\
    \ of sight) Inconclusive: ==References== {{Reflist|2}} {{Discussions}} Category:Characters Category:Hitman\
    \ (Games) Category:Male Characters Category:Game Characters Category:Protagonists Category:Primary\
    \ Protagonists Category:Martial Artists Category:Gun Users Category:Weapon Masters Category:Stealth\
