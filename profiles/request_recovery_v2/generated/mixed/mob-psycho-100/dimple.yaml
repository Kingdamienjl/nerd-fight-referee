- id: claim-weaknesses-b653d9c5
  section: weaknesses
  axis: weakness
  text: 'Initially overconfident. Possessing a body means he''s subjected to the limits of that body such
    as physical injury and stamina. Depends on the Divine Tree for much of his powers in his God Form,
    which turned on him after he abandoned it Notable Attacks/Techniques: Dimplepossess.gif|Possession
    Dimpletransform.gif|Transformation/Regeneration Dimplewraither.gif|Wraither Beam Dimpleoverrun.gif|Overrun
    Wraither Beam Dimplesmoke.gif|Smokescreen *Normal Dimple: Dimple is a notably powerful spirit among
    the series, although rarely shows his full potential due to initially being nearly obliterated by
    100% Mob. He has the standard abilities of spirits, being a non-corporeal creature that can phase
    through objects, is invisible to the naked eye, and can fly alongside enter and possess bodies. **Possession/Hypnosis:
    Dimple has the ability to take over the bodies of humans. The possessed individual will appear to
    have Dimple''s signature red cheeks and older voice. When possessing someone Dimple can use his host''s
    body to its fullest potential, and is a skilled martial artist. However, if he is hit hard enough,
    be it physical or psychic power, Dimple can be forcibly knocked out of the host''s body. When powered
    up he can also remotely influence or hypnotize a large amount of people at once. **Transformation:
    When powered up, Dimple is able to manipulate the shape of his body at will. This includes regenerating
    damage or transforming his body into weapons such as claws or blades. **Wraither Beam: When powered
    up, Dimple can fire a massive laser beam from his mouth that requires a short charging time. It was
    a devastating attack but proved useless against Mob at 100% Rage. ***Overrun Wraither Beam: A sub-technique
    of the Wraither Beam where the beam is split into smaller projectiles that explode on impact. It appeared
    to be one of his most powerful moves, though it did little against a powerful esper like Keiji Mogami.
    **Smokescreen: When powered up, Dimple can deploy a thick cloud of black smoke from within his body
    to conceal his location. This makes it ideal for surprise attacks. *God Dimple: When accessing the
    energy of the Divine Tree, the Broccoli Mob created with the energy of Toichiro''s 100% explosion,
    Dimple amassed far more power than he had ever done before, brainwashing the entirety of Spice City
    into his cultists through the influence of the plant. He also gained a new body and combat capabilities,
    with a number of hastily-named moves. **God Punch: A powerful straight punch that sent Mob flying.
    **God Dash: A high-speed dash. **God Slam: Dimple slams the target''s face into the ground. **God
    To'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-280244e6
  section: abilities
  axis: hax
  text: Dimple= Superhuman Physical Characteristics, Immortality (Type 1, 3, and 6), Self-Sustenance (Types
    1, 2 and 3), Regeneration (High-Mid in combat, High over time, regenerated from being reduced to microscopic
    shreds and particles), Flight, Possession, Invisibility, Incorporeality, Mind Manipulation (Can hypnotise
    crowds of people and change their emotional state), Shapeshifting, Transformation, Energy Projection,
    Smoke Manipulation, Explosion Manipulation, Danmaku, Resistance to Soul Manipulation (As his body
    is already spiritual in nature) |-|God Dimple= All abilities enhanced to a far greater degree, Forcefield
    Creation, Through manipulating the Divine Tree/Psycho Helmet he can gain Plant Manipulation, Avatar
    Creation, Corruption (Type 1. People who touch or consume the Divine Tree are hypnotised into being
    his cultists), Energy Absorption (Drained Mob and Teru's energy while they were in the Divine Tree)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
