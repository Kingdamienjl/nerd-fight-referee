    aura) *Afterimage Creation (Dodged around Yuri Chakovsky at blitzing speeds, leaving an afterimage)
    *Analytical Prediction (Predicts and intercepts a bird's movements to prevent it from flying and predicted
    a Judo master's fake-out) *Information Analysis (While fighting a Judo master who was attempting to
    hide his fighting style, Baki was able to instantly tell he was a Judo master, that he was trying
    to conceal this fact, and what course of action he was about to attempt) *Instinctive Action (Fought
    Gaia without thinking, dodged a sword faster than he could see on instinct, defeated several opponents
    on instinct alone, dodged Hanayama's attack by accident) *Willpower Projection (After dying, Baki
    projected his willpower to bring himself back to life. Baki also replicated this ability again during
    his fight with his father) *Resistance to Pain (Has always had an extremely high pain tolerance throughout
    the series, by the climax of Son of Ogre, Baki believes himself to be nearly immune to conventional
    pain such as muscle fatigue and normal attacks) *Resistance to Telepathy via Instinctive Action (Gaia,
    who can read people's minds due to Rumination, cannot read Baki's attacks because he is fighting without
    thinking) |-|Beginning of series to New Grappler Baki= Same as before but including *Power Mimicry
    (Baki has copied and adopted countless techniques, including but not limited to the Mach Punch, Aiki,
    Kiai, and even the personal fighting style of someone who doesn't know martial arts, having achieved
    a "Black Belt" in it in mere moments and surpassing the original fighter by the end of the fight.
    He has even stated that he can replicate all of the techniques he's seen/fought, though this remains
    to be seen) *Minor Fear Manipulation (When preparing for his fight against Yujiro, Baki's presences
    while walking around Tokyo caused a storm of hundreds of rats to run from him without him even knowing,
    when his life was threatened by delinquents with a knife, they felt as though the knife was tiny and
    they were in a life or death situation, when unconscious in a classroom, his entire class and teacher
