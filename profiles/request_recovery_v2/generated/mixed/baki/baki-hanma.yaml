- id: claim-weaknesses-6e37ce95
  section: weaknesses
  axis: weakness
  text: 'Will sacrifice victory if he cannot achieve it with his own raw power. Notable Attacks/Techniques:
    *Endorphin: The skill is a special ability to increase endorphin levels in order to boost one''s durability
    and pain resistance. The user can activate endorphin production within their bodies to inhibit the
    transmission of pain signals. Baki Hanma has the ability to release more endorphins in his body by
    twisting his right ear. For the first time, he felt that experience when he was doing murderous training
    before fighting Yasha-Zaru the first series. He is the only one character in series that uses the
    endorphins. *Death Concentration: The skill is a special ability to boost body reflexes and speed.
    In the manga, Yujiro Hanma described the skill in this way: "that moment only comes when you are about
    to meet death, but if you are able to control every moment, you will be able to control death, and
    that is where true strength hides". Thanks to this ability, Baki Hanma is able to boost his body reflexes.
    For the first time, he felt that experience when he threw himself off a cliff in the first series.
    And soon afterwards he used it during his fight with Yasha-Zaru. *Ippon Ken: Ippon Ken is a karate
    striking technique that uses the extended knuckle of the middle finger (or index finger) in order
    to strike a target. The technique is very effective when a fighter wants to attack a specific point
    of the opponent''s body. Baki Hanma used this technique in his fight against Kaoru Hanayama, when
    he was about 13 years old. *Rear Naked Choke: The Rear Naked Choke is a chokehold in martial arts
    applied from an opponent''s back. The word "naked" in this context was suggests that, unlike other
    strangulation techniques found in grappling martial arts, this hold does not require the use of a
    training uniform. If properly done, it will restrict blood flow to the brain via the carotid arteries,
    leaving the opponent unconscious. It is very used in Judo, Jujutsu and the mixed martial arts, being
    the most used strangling technique. Baki used it against Yujiro Hanma. *Roll Kick: It consists of
    taking a leap to stand on the enemy, then the body is turned to drop a strong spin kick against the
    opponent. *Bow and Arrow: Bow and Arrow is a pro wrestling fighting move. Baki Hanma used it once
    against Atsushi Suedo during the Shinshinkai Karate tournament. *Seiken: The Seiken is a karate practitioner''s
    straight punch, shot from waist. Punching techniques in the karate are called tsuki or zuki. Seiken
    is a punch with the first two knuckles. The Seiken punch is a typical technique for all karate fighters
    in Baki series. It is one of the most versatile and powerful weapons of Okinawan karate. To make a
    proper fist, the fighter has to start by extending all four fingers and pressing them tightly together.
    The Seiken is such a useful technique that it can be even a finishing blow. For example, the user
    can perform it with a rapid succession in a barrage-like attack. *Armlock: At first, the user grabs
    the opponent''s arm, and then he slams him into the ground. The fighter puts his right leg on the
    opponent''s neck, and he keeps a balance with the other leg. With this move, the user can easily break
    his opponent''s arm. Baki Hanma used this technique during a battle with Kosho Shinogi for the first
    time. Then he used this move against Mount Toba, but he failed. Baki also made an improved and stronger
    version of this move. That improved version is called King Tiger. *Kinteki Geri: The Crotch Kick is
    a powerful blow from the Vale Tudo which is intended to damage man''s most vulnerable and sensitive
    vital organ: the testicles. The Crotch Kick can be performed in different ways. For example, the user
    can have his back to the opponent. Following this, the user must tilt the upper body forward while
    lifting the leg up, causing the blow to pick up speed and power. Finally, the user of the technique
    will strike with the sole of the foot and the heel on the genitals of his opponent. The blow serves
    to expose the opponent to a next attack or to escape from a grip, in cases in which the user of the
    technique has great speed and strength as Baki Hanma, one of the rival''s testicles may break. *Suplex:
    The user grabs his opponent with both arms from behind. Then he throws him backward and slams him
    to the ground. The move is generally used by wrestlers and mixed martial artists. *Goutaijutsu: To
    perform it, a fighter has to stiffen his body to its utmost limits on the moment of impact. When fighter
    uses it at the right moment during a seiken punch, all of his joints will be fixed. It''s very difficult
    to do, but if he succeeds, his fist will strike with the weight of his whole body. At the first time,
    Baki used the Gotaijutsu against Kureha Shinogi during their fight at the Tokyo Dome Underground Arena.
    He almost killed Kureha with this technique. He used it also when he fought Biscuit Oliva during the
    Prison Battle Saga. Oliva used his Ball technique, then Baki st'
