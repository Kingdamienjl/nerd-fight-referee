- id: claim-weaknesses-d874eb80
  section: weaknesses
  axis: weakness
  text: 'While a martial arts genius, Doppo relies too much on his karate and is more often than not too
    deluded to the point he sees karate as the "purest and most supreme form of fighting there is". Notable
    Attacks/Techniques: *Seiken *Kotsukake *Nukite *Axe Kick *Maeba Stance *Sangan *Sanchin *Kokoken *Fumasatsu
