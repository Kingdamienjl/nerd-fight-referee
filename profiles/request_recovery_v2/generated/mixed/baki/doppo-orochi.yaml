- id: claim-powers-and-abilities-a7e7fecd
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts, Extrasensory Perception (can sense his opponent's
    Seikuuken, can see Musashi's Absent Blade and parry it), Limited Attack Reflection (Via Mawashi Uke),
    Body Control and Statistics Amplification (Via Sangan and Sachin), Limited Instinctive Reaction (can
    attack unconsciously or move his body on it's own after repeated or prolonged exposure to a stimuli),
    Information Analysis (is able to figure out Toba's plan after observing his basic stance, is able
    to diagnose all of his injuries immediately after receiving them), Pressure Points and very Limited
    Durability Negation (knows the Jinchuu, strikes the Endou point with Kokoken, dislocates Yuu-Amanai's
    jaw with the Fumasatsu, uses the Roppa Gaeshi, an edge control technique using the "edges" beyond
    the wrists/ankles to inflict damage, to strike the opponent's Tendo points, undoing the suturing of
    their skull), Status Effect Inducement via Kokoken (blinds and stuns the opponent by striking the
    Endou point, a pressure point on the bridge of the nose between the eyes, with the wedge of his hand
    between the thumb and index finger), Analytical Prediction (Was able to analyze and predict Dorian
    Kaioh's movements so well that, despite being under the effects of a hypnosis that makes you hallucinate
    a weaker illusion of your opponent, he was able to accurately predict everything the real Dorian was
    doing), Enhanced Senses (Was able to tell that a man had a weapon on him by sensing his bloodlust,
    smelling metal specifically from his center of gravity on the right side, smelling the ink from the
    newspaper it was wrapped in and the length of it by observing his walking pattern from several meters
    away after walking past him) and Stealth Mastery (Was able to hide from and stay right next to Rikigouzan
    for minutes until he revealed himself, snuck onto and hid in a secure military base), Resistance to
    Extrasensory Perception via Bodhisattva Fist (the move silences his mind and bloodlust, making it
    impossible to detect his intentions or read his mind)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
