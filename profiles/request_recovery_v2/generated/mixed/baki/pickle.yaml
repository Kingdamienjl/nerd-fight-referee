- id: claim-weaknesses-146a63c5
  section: weaknesses
  axis: weakness
  text: 'While he is capable of learning, Pickle is still in fact, mostly primitive. Due to living the
    majority of his life amongst an era of nothing but brute force, speed and size, Pickle''s biggest
    weakness is his lack of skill. Experienced martial artists, even if physically inferior to him, have
    managed to give Pickle quite a hard time, exactly due to this flaw. Notable Attacks/Techniques: *Bite
    *Leaning Forwards Stance *Tackle *Aiki ==Gallery== Pickletransformed.png|Pickle''s transformed state,
    with scars left by his ancient rival, the T-Rex 7909b7dc86cd8c2a808f232fa1a36098.jpg|Pickle victoriously
    dances in front of Baki, mocking him File:3335b2d3037ff8b022db6e14243c9ca28e14b991 hq.jpg|Pickle''s
    Skeleton ==Notable Matchups== Victories: Losses: * Odo (LIVE A LIVE) Odo''s Profile (Speed was equalized,
    Fight took place in a grassland, Starting distance was 100 meters) Inconclusive: {{Discussions}} Category:Characters
    Category:Baki the Grappler Category:Antagonists Category:Attack Reflection Users Category:Berserkers
    Category:Body Control Users Category:Cavemen Category:Chi Users Category:Devourers Category:Enhanced
    Senses Users Category:Extrasensory Perception Users Category:Humanoid Characters Category:Illusionists
    Category:Male Characters Category:Manga Characters Category:Martial Artists Category:Neutral Characters
    Category:Regeneration Users Category:Power Mimicry Users Category:Sound Users Category:Statistics
    Amplification Users Category:Transformation Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8a51d804
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Martial Arts *Enhanced Senses (Telescopic Vision & Smell;\
    \ Watched Baki and Yujiro's fight from 8 miles away, and smelled cooked T-Rex from another room while\
    \ unconscious) **Extrasensory Perception (can sense danger, sensed when Katsumi was about to use the\
    \ Hitless Blow, could sense Musashi's might, can sense strong fighters without even having seen them,\
    \ can sense Baki's imaginary auras) *Transformation & Statistics Amplification (puts all of his power\
    \ into an explosive charge that allows him to move faster and hit harder than normal) *Minor Power\
    \ Mimicry *Limited Chi Manipulation & Attack Reflection via Aiki (Utilized the very basics of Aiki\
    \ without even knowing it) *Sound Manipulation (Screamed loud enough to be heard from several stories\
    \ away) *Regeneration (Low; Regenerated from all the cuts made by Musashi, but not his scar from the\
    \ T-Rex) *Berserk Mode (Becomes extremely more violent and mindless in this state) **Body Control\
    \ (In this state, Pickle\u2019s joints shift and his muscles become much harder and nearly impossible\
    \ to cut through, due to his unique caveman physiology, he is incredibly difficult to concuss) *Minor\
    \ Illusion Creation (Can imagine felled opponents for mental strength) Resistance to: *Extrasensory\
    \ Perception (Despite Baki's powerful ability to gauge his opponent's strength and project their aura,\
    \ he could not manage this against Pickle)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
