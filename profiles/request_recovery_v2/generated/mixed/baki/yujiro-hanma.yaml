- id: claim-weaknesses-372dd43a
  section: weaknesses
  axis: weakness
  text: 'Yujiro is very arrogant and is thrilled by the thought of a good fight, but this doesn''t make
    him foolhardy. He tends to not counter with the opponent''s mastered arts because he considers it
    to be rude. Notable Attacks/Techniques: *Axe Kick: The user raises their leg higher than the opponent''s
    head and pulls it down quickly. It is mainly used to strike the enemy''s head, shoulders and also
    the nose. This technique requires a lot of flexibility for stretching the leg at a high level. Yujiro
    Hanma is known to use the Axe Kick a lot more than other fighters, being very flexible (he''s often
    lifting his leg with a calm stance). *Roll Kick: It consists of taking a leap to stand on the enemy,
    then the body is turned to drop a strong spin kick against the opponent. *Death Concentration: The
    skill is a special ability to boost body reflexes and speed. In the manga, Yujiro Hanma described
    the skill in this way: "that moment only comes when you are about to meet death, but if you are able
    to control every moment, you will be able to control death, and that is where true strength hides".
    In a flashback of the Childhood Saga, Yujiro taught little Baki about this ability, which means he
    also achieved the Death Concentration skill. During the battle between Yujiro and Doppo Orochi in
    the Underground Arena Saga, it turns out that Yujiro also once jumped off a huge cliff, which may
    indicate that he was also trying to achieve this ability in the same way as Baki did. *Udonde: The
    Udonde is a secret fighting move passed down only to the eldest sons of the Ryukyu Royal Family. At
    first, the user makes a stance that looks very open for attack, then he starts to walk toward his
    opponent. By the time the opponent performs an attack, the user uses his reflexes to instantly attack
    his opponent. However, performing this technique is difficult as it can only be done by someone with
    exceptionally good reflexes, such as Yujiro Hanma. So far, Yujiro is the only character in series
    that has utilized the Udonde technique in battle, during his fight with Doppo Orochi in the first
    series of the manga. *Finger-Grab: The user grabs one of the opponent''s finger and throws him. Yujiro
    Hanma used this move to counter Doppo''s attack, and broke his pinky. *Demon Back: The Demon Back
    is a "technique" in which the user very forcefully flexes the back muscles to form the face of a demon.
    The user becomes many times stronger to their level prior to activation in every aspect, experiencing
    an increase in physical strength, speed, endurance, stamina, etc. The user can virtually absorb any
    hit, such as when Yujiro Hanma ceased taking damage from Kaku Kaioh''s Offensive Shaori strikes, which
    normally produce enough force to shatter walls. Additionally, the user can dish out massive amounts
    of damage in return. In truth, the Demon Back is not so much a technique as it is a predetermined
    advantage such as height or muscle-building capacity, since it is a gift depending on genetics and
    bloodline. However, it can be treated as a technique since it is only activated when the user decides
    to use it. *Bite: The user uses his teeth to tear a flesh and skin of the opponent''s body. The bite
    is also the antithesis of the technique named Aiki, since the force to attack is 0, the user of Aiki
    cannot redirect it. *Crotch Kick: The Crotch Kick is a powerful blow from the Vale Tudo which is intended
    to damage man''s most vulnerable and sensitive vital organ: the testicles. The Crotch Kick can be
    performed in different ways. For example, the user can have his back to the opponent. Following this,
    the user must tilt the upper body forward while lifting the leg up, causing the blow to pick up speed
    and power. Finally, the user of the technique will strike with the sole of the foot and the heel on
    the genitals of his opponent. The blow serves to expose the opponent to a next attack or to escape
    from a grip, in cases in which the user of the technique has great speed and strength as Yujiro Hanma,
    one of the rival''s testicles may break. * Front Neck-Lock: By getting the opponent in a Guillotine
    Lock while standing in front of them, the user can pull their arms up and lean back, restricting the
    opponent''s airway and blocking blood flow to the brain, causing the opponent to eventually lose consciousness.
    *Nukite: The fighter uses his hand (excluding their thumbs) which the user then thrust into the opponent''s
    body like a spear. Yujiro Hanma has also been seen using the Nukite to bleed dry a deer as seen in
    one of Baki''s flashbacks in the manga series. *Vietnam Whip: By wrapping his arm underneath and around
    one of the arms of his opponent, Yujiro can flip the opponent on their head and smash them downward,
    causing significant damage to the skull or neck, even possibly resulting in a concussion or spinal
    break. * Defensive Xiao-Lee: Defensive Shaori is a form of bodily control that allows the user to
    present zero resistance to oncoming blows. This makes the user''s body featherlike.'
