- id: claim-powers-and-abilities-938f18f4
  section: abilities
  axis: hax
  text: "Passive *Superhuman Physical Characteristics **Enhanced Senses (Smell, Vision [X-Ray] & Extra\
    \ Senses [Energy]; Yujiro can smell strong men. Can see through the bodies of anybody who comes into\
    \ his sight with precision greater than that of a high-quality X-ray machine. Could sense the danger\
    \ of Kaku's punch) **Longevity (Kaku believes that Yujiro will still be alive in 100 years, is stated\
    \ as being \"stronger than time\") **Accelerated Development (Training & Battle; Physical Stats &\
    \ Abilities - Stated to constantly be improving at an alarming rate, also stated specifically to always\
    \ be improving in terms of martial arts) *Genius Intelligence **Master Martial Artist ** Information\
    \ Analysis (Can detect the physical conditions and weaknesses of a person with 100% accuracy by glancing\
    \ at them) **Power Mimicry (Can mimic any martial arts technique after seeing it once) **Analytical\
    \ Prediction (Can predict the entire outcome of a fight just by looking at a fighting stance, blocked\
    \ an attack he specifically says he couldn't see, predicts Baki's win over Li Kaioh despite Baki's\
    \ poisoned state) **Stealth Mastery (Invaded many places monitored by US soldiers without being noticed,\
    \ sometimes even going as far as perfectly walking in their shadows and avoiding their field of view,\
    \ sneaked up on highly trained, elite soldier Captain Strydum despite Strydum waiting for his arrival)\
    \ *Acrobatics *Instinctive Action (Is able to instinctively counter attempts to touch him, even while\
    \ asleep) *Extrasensory Perception (can sense someone's Seikuuken, can sense Baki's fighting spirit\
    \ from ~8,000 miles away, and can sense/feel fighting spirits, Yujiro can sense a strong opponent\
    \ while asleep) *Aura (Physical force and intimidation) **Fear Manipulation (Yujiro's aura incites\
    \ fear at the cellular level, can passively incite fear in even a hardened veteran soldier, can make\
    \ fighters feel as though they're being stabbed) **Minor Madness Manipulation (Caused three soldiers\
    \ to indulge in madness with his aura; the human body instinctively detects Yujiro as a threat) Activated\
    \ *Pressure Points **Paralysis Inducement *Pain Manipulation & Limited Durability Negation (Via Whip\
    \ Strike) *Chi Manipulation & Attack Reflection (Via Aiki) *Body Control & Damage Reduction (Can make\
    \ his body completely limp and flow like a blade of grass in a storm to reduce damage with Xiao Lee)\
    \ *Energy Manipulation & Attack Reflection via Offensive Shaori/Xiao-Lee (Absorbs the energy from\
    \ his opponent's attack, adding it to his own to create the \u201Cultimate strike\u201D) *Statistics\
    \ Amplification (Via Demon Back, Cockroach Tackle, Death Concentration, Sangan, Stomp, and many other\
    \ moves. Kiai Technique is a technique to increase normal speed and attack speed) *Limited Illusion\
    \ Creation (Saw Baki's triceratops and created his own beast, one he believed to be even stronger,\
    \ the fighting spirit of Yujiro Hanma) **Limited Sense Manipulation (Could make people perceive sounds,\
    \ smells, lights, and even impacts with his illusions) *Vibration Manipulation (Yujiro's anger alone\
    \ can vibrate skyscrapers) *Limited Light Manipulation (Yujiro can form halos of light when activating\
    \ his Demon Back) *Status Effect Inducement (Yujiro knows a Yiquan/Taiki-Ken conceptual technique\
    \ that leaves someone unable to breathe properly and causes tears and blood to obscure someone's vision)\
    \ *Air Manipulation (Can punch so hard the pressure from his fists rips apart the air) |-|Resistances=\
    \ Resistance to *Electricity (Tanked being hit by lightning) *Poison (Due to his physiology and skeleton\
    \ structure he's resistant to both) *Disease (Baki believes him to be immune to cancer and AIDS, stated\
    \ as being \"stronger than viruses and bacteria\") *Information Analysis (Similarly to Pickle, when\
    \ Baki attempted to shadowbox against an imaginary Yujiro based on his analysis of him that was stronger\
    \ than the original, Baki could not even imagine a version of Yujiro as strong as the real one) *Temperature\
    \ Manipulation (Withstood the full heat of a lightning stroke for an extended period of time) *Limited\
    \ Resistance to Pain Manipulation (Can tense all the muscles in his body to negate the pain of a Whip\
    \ Strike)"
