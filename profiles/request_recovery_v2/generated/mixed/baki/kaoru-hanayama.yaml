- id: claim-powers-and-abilities-d8eaffc7
  section: abilities
  axis: hax
  text: 'Kizudzura/Delinquent= *Superhuman Physical Characteristics *Accelerated Development (Passive
    and Physical Statistics - Hanayama passively gets stronger without training as time passes, even as
    a 10 year old he could already crumple metal door knobs, crumple soda cans and tear through thick
    magazinesBaki The Grappler 120. Baki could tell he had gotten stronger, so much stronger since they
    fought each otherBaki The Grappler 239. Battle: Durability - is stated to get "tougher" as the fight
    continuesBaki The Grappler 119. *Incredibly Versatile Street Fighter (Even as early as 15 he was stated
    to be a master of barehanded fighting) *Acrobatics (Hypermobility - Despite his large burly frame,
    Hanayama can perform acrobatic leaping/flipping kicksBaki The Grappler 238. Can also perform Kip-Up''s
    and attack while doing themBaki The Grappler 240) *Social Influencing **Reputation: A delinquent in
    a suit store stated Hanayama sat at the top of the delinquent world at 15 years old and when he appeared
    made him change his entire wardrobe to match Hanayama. For him to attend high school a detective from
    the Tokyo Metropolitan Police Department made the principal sign a legal permit due to him being as
    dangerous as a lion or tiger. Made goons who tried to extort him bow and shiver in terror after it
    was revealed who he was. Already stated to be the strongest delinquent at 15 years old. Even after
    he offered gun, swords, knives and grendes to Imori Kouchi to aid him in a fight that Imori picked,
    he was too terrified to use them against him. **Deception: Tricked his classmates into believing an
    assassin he just defeated was a ventriloquist dummyKizudzura 5. Also made them think he lost a sumo
    match. He then overpowers Naniwa Oyakata and makes his classmates believe he performed an athletic
    summersault by clapping afterwards to deceive themKizudzura 8. Baki after analyzing him still didn''t
    expect Hanayama to be as skilled and as fast as he wasBaki The Grappler 120. **Instigating Fear: Made
    an entire delinquent biker gang shut off their motorcycles and quietly pass him in fear. The same
    happened when he went into a rowdy restaurant known for violenceKizudzura 7. Made a wannabe gangster
    tell him everything he knew about BakiBaki The Grappler 90. **Charisma: Has an unusual fighting style
    that seems to always charm and catch his opponents off guard, which leads to them dropping focus a
    lot of times and being hit by the punch. Even fighters as disciplined as Musashi MiyamotoBaki-Dou
    160. *Afterimage Creation (Shown here. Also shown here) *Pressure Points (Broke a man''s jaw with
    a punch, then stabbed his fingers in his eyes. Crushes Spec''s throatNew Grappler Baki 37. *Supernatural
    Willpower (Takes an extended beating from Baki, and just stands back up. A list of all the damage
    Hanayama had taken, he still wished to continue fighting. Hanayama''s legs are completely shattered
    by Yujiro and he continues trying to stand upBaki The Grappler 114. After being hit with multiple
    Mach Punch, he was still coming for more until he was eventually unconscious but still standing, replicating
    his "Standing Man" tattooBaki The Grappler 245. was severely stomped, beaten with a baton, until it
    deformed, shot in both kneecaps, repeatedly stomped again and still found enough strength to stand
    and fight after a hallucination of Yujiro Hanma appearedNew Grappler Baki 37. Later gets shot by several
    high powered rifles at the same time and stays standing even after being shot in the head stands for
    a few seconds. Had severe enough injuries that doctors stated it was a miracle he was even alive and
    he would be disabled for the rest of his life even if he lived, but by that point he had already woken
    up and walked out of the hospital on his own) *Aura (Overwhelming - It was a overwhelming fierceness
    in his silence that overwhelmed the adult he was talking toBaki the Grappler 83. Baki was intimidated
    by his aura shifting in their fight) *Minor Damage Reduction (Wears a Sarashi which are used to reduce
    the damage sword slashes. Musashi stated this himselfBaki-Dou 168) |-|Maximum Tournament to New Grappler
    Baki= Same as before but far enhanced including *Technique Mimicry ([Copied Spec''s Tameshi Wari in
