    enough air for the "Invisible Squash"), Breath Attack (Can fire compressed blasts of air from his
    mouth to blind opponents), Pressure Points (can strike pressure points with both fingers and toes,
    KO'd a comparable opponent with a single strike) | All previous, Weapon Mastery (even Kaku Kaioh considers
    him to be a good weapons user), Information Analysis (Detected the weakness in a boxer's block, knew
    Jyaku's entire plan since the fight began), Stealth Mastery (By using a technique called "Second Shadow",
    Retsu can match his pace and breathing to a person's and walk directly behind them, evading detection
    from even a trained soldier), Extrasensory Perception (Can gauge an opponent's strength at a glance,
    can sense an opponent's presence and aura), Instinctive Reaction (can fight on autopilot when not
    holding back, his body forces him to use Kung-Fu, can take a stance and "throw a punch" while unconscious,
    but cannot actually fight), and Damage Reduction (Via Defensive Shaori/Xiao-Lee)
