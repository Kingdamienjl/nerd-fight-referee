  intelligence:
    text: Kaku Kaioh, due to his more than a century-long years of experience and learning, as well as
      perfecting the weaknesses of his abilities, has a vast variety of knowledge, especially over martial
      arts. He is a perceptive character who can very easily see through the mentality of another person,
      how they prefer to fight, their level of power, etc. He's very clever, as he escaped a certain death
      by the hands of Yujiro Hanma through very deceptive tactics. He draws his inspiration from his own
      past misguidance, as well as life all around him.
