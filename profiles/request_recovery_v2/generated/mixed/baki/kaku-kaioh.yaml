- id: claim-powers-and-abilities-fa825240
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics | Body Control (Can effortlessly switch from Defensive Shaori/Xiao-Lee\
    \ to Offensive Shaori/Xiao-Lee. The Shaori/Xiao-Lee is a technique even characters like Retsu Kaioh\
    \ and Ryu Kaioh haven't mastered fully. He even managed to fake his own death by stopping his heart\
    \ and then restarting it moments later), Martial Arts (Has over 100 Years of knowledge about different\
    \ techniques and skills), Damage Reduction (Via Defensive Shaori/Xiao-Lee), Limited Energy Manipulation\
    \ and Attack Reflection via Offensive Shaori/Xiao-Lee (Absorbs energy from the opponents attacks and\
    \ combines it with his own to create \u201Cthe ultimate strike\u201D), Longevity (Is 146 years old),\
    \ Biological Manipulation (can use this in tandem with his Body Control to fake perfect clinical death),\
    \ Resurrection (can bring himself back to life after using Body Control and Biological Manipulation\
    \ to fake perfect clinical death), Weapon Mastery (Can utilize a sword in each hand. Should be as\
    \ skilled as Retsu Kaioh when it comes to weaponry usage), Stealth Mastery (Snuck up on Retsu and\
    \ Katsumi and stood next to them for several pages unnoticed, sneak attacked Motobe), Statistics Amplification\
    \ (can perform the Hitless Blow), Information Analysis (Can identify the martial art characters use\
    \ just by looking at them)"
  source_ids: *id003
  decisive: true
