- id: claim-weaknesses-0a36826f
  section: weaknesses
  axis: weakness
  text: 'None notable | Lacks a physical form, making him unable to interact with the physical realm and
    is far weaker then when he has a physical body Feats: *Created the multiverse by his hand, and claimed
    he would destroy everything he created by his hand as well.Doom Eternal - Final Boss *He transformed
    Jekkad into Hell. Even after Davoth was reduced to a Life Orb, Hell''s battles with the Doom Slayer
    were causing the multiverse to implode inward on itself.The Art Of Doom Eternal - Chapter 5 - Demon
    VS. Slayer Notes: *Davoth''s Essence would power his attacks much like the demonic minions he created.History
    of the Sentinels - Part VI *According to the Maykr God-mind, there are infinite timelines in the multiverse.
    *According to Vega, the multiverse contains countless universes. *To explain why some of the scans
    say The Father while in reference to Davoth. It is revealed in The Ancient Gods Part II that he actually
    was the maker of all existence while The Father was just a servant. The Maykrs falsely recorded the
    history of creation, swapping the positions of The Father and Davoth. So given that, the feats and
    statements of The Father would actually apply to Davoth instead. *The "Demon Abilities" tab is a list
    of possible powers from the demons of Hell. He might be capable of doing them as well or at least
    produce something similar since they use his energy for said abilities. ==Notable Matchups== Victories:
