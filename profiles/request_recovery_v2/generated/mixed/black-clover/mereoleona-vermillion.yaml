- id: claim-powers-and-abilities-b142ee0e
  section: abilities
  axis: hax
  text: "Elf Arc= *Superhuman Physical Characteristics *Acrobatics *Aura: (As a Royal, Mereoleona is among\
    \ the humans with the largest amount of Magic Power. Mages with large of Magic Power can induce an\
    \ intense pressure in their surroundings) *Danmaku with Calidos Brachium: Barrage: (Can fire several\
    \ dozen of projectiles from every direction in an extremely short amount of time) *Enhanced Senses\
    \ *Extrasensory Perception: (People with Magic can sense the flow of Mana in their surroundings as\
    \ well as other people's Magic Power) *Flame Magic: (Can manipulate flames, she can use Mana Zone\
    \ to multiply her attacks to the opponent and leaving no chance for them to escape), *Forcefield Creation:\
    \ (Mages with a large amount of Magic Power have a forcefield of Mana that naturally protects them\
    \ from incoming attacks) *Heat Manipulation: (While holding back, her flames burned the flames of\
    \ the flames of the Fire Spirit Salamander, which is stated to be able to dry the ocean in a single\
    \ attack. Severely burned 5 elves despite them using Mana Skin. Vaporized Princia steel made equipments\
    \ like her sword and her countless steel pawns) *Magic: (Attribute: Flame Magic) *Non-Physical Interaction:\
    \ (Can burn several intangible elements such as darkness, light, water and fire itself) *Platform\
    \ Creation with Mana Zone: (Mana Zone allows Mereoleona to freely walk in mid-air) *Power Nullification:\
    \ (Can burn any magic and nullify them, she especially burned Raia's Dark Magic, Light Magic and several\
    \ others magics replicated by him) *Spatial Manipulation: (via Mana Zone) *Damage Boost: (Can charge\
    \ up attacks in combat) *Statistics Amplification: (Mereoleona uses the Reinforcement Magic to increase\
    \ her physical abilities. Reignition 2\xD7 should potentially double her power) |-|Spade Saga= Same\
    \ abilities as before *Intangibility: (Her body was stated to have almost become mana itself. Mana\
    \ is something fundamental that exists everywhere within people, nature and the world itself. Mana\
    \ is said to be the origin of souls, with the soul being the source of life, spirit and magic) *Enhanced\
    \ Heat Manipulation: *Reactive Power Level: (Her attacks gets exponentially stronger and hotter as\
    \ the fight goes on, as shown when her attacks went from being uneffective to the Ancient Demon, to\
    \ slightly burning it, with her very next attack being able to completely vaporize its head) *Possible\
    \ Resistance Negation (with Hellfire Incarnate; Hurt the Ancient Demon - which resists all magic in\
    \ existence) |-|Judgement Day Arc= *Inorganic Physiology (With Ultimate Magic; Overcame the world's\
    \ natural laws and transcended physical form. Became a being purely made of Mana, a fundamental energy\
    \ that is both described as the origin of the soul and its ideal shape) *Enhanced Intangibility (Completely\
    \ became Mana itself, not even Morris' Modification Magic could interact with Mereoleona) *Necromancy\
    \ (Mereoleona is able to resurrect souls to battle alongside her as Mana/soul entities) *Regeneration\
    \ (At least Low-Mid, possibly higher; Regenerated her lost limb from Mana) |-|Resistances= *Resistance\
    \ to Absolute Zero: (Superior to the Black Bulls who could withstand temperatures below Absolute Zero)\
    \ *Resistance to Fire Manipulation: (Unaffected by magma, lava and her own flames. Should be further\
    \ enhanced with Mana Skin and even further with Mana Zone) *Resistance to Heat Manipulation: (Unaffected\
    \ by the temperature of the Yultim Volcano, a Grand Magic Region which can reduce a human into ashes.\
    \ Should be further enhanced with Mana Skin and even further with Mana Zone. Bathed in Lava. Superior\
    \ to Vetto who is capable of easily withstanding lightning magic attacks from Luck, mid-air. Unaffected\
    \ by her own ) *Resistance to Power Nullification with Mana Skin: (Mana Skin allowed Noelle to cast\
    \ Sea Dragon's Roar under the presence of an elf, should be further enhanced with Mana Zone) *Resistance\
    \ to Sleep Manipulation with Mana Skin: (Leopold was able to overcome the effects of Fragil's Snow\
    \ Magic, which reduces the reactions of her opponents and puts them to sleep. Should be further enhanced\
    \ with Mana Zone)"
  source_ids: *id003
