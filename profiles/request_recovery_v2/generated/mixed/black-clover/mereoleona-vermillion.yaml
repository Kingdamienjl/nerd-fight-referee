  attack_potency:
    text: "Island level (Completely overpowered Evil Eye Raia numerous times and easily defeated him.\
      \ Fought against Elf Raia alongside an entire elf squad), higher with Reignition (\"Reignition:\
      \ \xD72\" condenses all Mereoleona's Magic Power into a single, yet extremely powerful punch capable\
      \ of knocking Elf Vetto out despite being comparable to her), far higher with Mana Zone: Full Release\
      \ (Heavily damaged a group of five elves despite being severely injured, including Reincarnated\
      \ Raia) | Country level+ (Stronger than when she fought Post-Elves Invasion Yami, who could damage\
      \ Zagred), up to Multi-Continent level with Hellfire Incarnate (Fought and matched the Spade Kingdom's\
      \ Ancient Demon, which should be comparable to Demon Licht, when first using Hellfire Incarnate.\
      \ Got stronger as she continued to fight with it, becoming comparable to Post-Second Grimoire Spirit\
      \ Dive Yuno), far higher with Mana Zone: Full Release (Far stronger than her normal attacks. Burned\
      \ down the Spade Kingdom's Ancient Demon) | At least Country level+, up to Multi-Continent level\
      \ with Hellfire Incarnate (Could keep up with Archangel Morris and even supposedly damage him, as\
      \ he was constantly regenerating), far higher with Ultimate Magic (Transcended human's natural limits\
      \ and became Mana itself. Overwhelmed Morris)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic (Blitzed Evil Eye Raia on numerous occasions) | Relativistic+ (Faster than when
      she tagged Yami and was too fast for him to track her with ki), far higher with Hellfire Incarnate
      (Faster than her base form when first using Hellfire Incarnate. Got faster as she continued to fight
      with it, becoming comparable to Post-Second Grimoire Spirit Dive Yuno) | At least Relativistic+
      (Faster than before), far higher with Hellfire Incarnate, even higher with Ultimate Magic
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class K (Physically clashed with Vetto. Has 5/5 in physical strength, which makes her comparable
      to the latter, Asta and Yami), Class G with Reinforcement Magic (Reinforcement Magic was stated
      by Tabata to increase the physical capabilities of the user even without much in the way of muscle.
      Should be comparable to Yami as their physical strength is comparable and the latter having less
      magic power than she has to reinforce his physical abilities) | Class G (comparable to Fuegoleon.
      Was able to remain standing and attack under an incomplete Lucifero's gravity which is this strong)
      up to Class Z with Hellfire Incarnate (Later became able to fight under Half-Manifested Lucifero's
