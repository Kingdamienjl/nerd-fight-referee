- id: claim-weaknesses-ddb1cebe
  section: weaknesses
  axis: weakness
  text: 'None notable | Extended use of Hellfire Incarnate causes her body to fall apart due to her coming
    too close to mana itself | None notable Notable Attacks/Techniques: *Reinforcement Magic: Reinforcement
    Magic is a know ability in the Clover country, it''s a form of magic that allows the users to increase
    their physical abilities, this magic can also be used form increase durability by enveloping the body
    with Mana. Mereoleona uses this form of magic to increase her physical abilities Mereoleona fire paws.png
    Flame Magic: Mereoleona can manipulate the elements of fire, by using it, she can burn instantaneously
    the opponent, it can be used to burn away magic attack and completely cancel it, usually, she use
    Hand to hand movements alongside her fire ability to burn entierly the opponents simply by contact,
    with Mana zone, she can increse the AOE of her attacks and even produce continuously attacks to prevent
    the opponent to reacts and even heal. *Fire Paw: It a spell used by Mereoleona for making the peoples
    she want unable to act freely and making them docile. *Calidous Brachium: Mereoleona surrounds her
    fist with a fiery aura and punches the opponent, engulfing them in flames Mereoleona Calidus Brachium.png
    Mana Zone: Offensively, the mana could be funneled into spells to increase their size and number.
    It could also be used to launch attacks from all-around, within, or behind a target. Defensively,
    the mana could be used to augment Mana Skin and other Reinforcement Magic spells, allowing for the
    prediction of enemies'' attacks and for moving in mid-air *Calidus Brachium Barrage: After taking
    control of the surrounding mana, Mereoleona pummels the target with fiery blasts from multiple directions.
    The continuous stream of attacks from every direction makes it difficult to escape from or defending
    against this spell Calidus Brachium Barrage.png *Calidus Brachium Purgatory: After taking control
    of the surrounding mana, Mereoleona pours all of their strength into a stream of punches that engulfs
    the entire area with flames. The fire is strong enough to incinerate blocks of stone. The physical
    strain of this spell could worsen any injuries she has, and the magical exhaustion could leave her
    defenseless. Mereoleona Calidus Brachium Purgatory.png * Flame Magic: Hellfire Incarnate: Mereoleona
    assimilates a large amount of Fire Magic into her body, which begins to glow and takes on a fire-like
    appearance, almost as if it has become Fire Magic itself. Mereoleona''s strength is greatly enhanced.
    File:Mereoleona Hellfire Incarnate.png *Mana Zone Full Release: Fire Magic: Calidus Brachium Purgatory:
    Abyss After assimilating a large amount of Fire Magic into her body and taking control of the surrounding
    mana, Mereoleona unleashes a stream of punches that pummels her target and engulfs them with flames.
    Mereoleona pummels giant demon.png ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}}
