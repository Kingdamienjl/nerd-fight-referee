- id: claim-weaknesses-dfc0b3ea
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: Luck Thunderclap Crumbling Orb.png|Thunderclap Crumbling\
    \ Orb Thunder Fiend.png|Thunder Fiend Luck's Thunder God's Gloves.png|Thunder God's Gloves Luck's\
    \ Thunder God's Boots.png|Thunder God's Boots Luck Voltia Thunder God Armor Black Clover.png|Thunder\
    \ God Armor Black Clover- Luck Voltia and Magna Swing's Flame Lightning Explosive Cannon by yuikines\
    \ dcu0rjv.jpg|Flame Lightning Explosive Cannon *Lightning Magic: This magic attribute allows Luck\
    \ to generate and manipulate electricity at will. Without the use of a grimoire, he is still able\
    \ to use this magic. However, to use it to its full potential, specific spells are required, which\
    \ are stored within Grimoires. Lightning Magic users are known for their high speed their attack power\
    \ and their great Mana sensing. **Thunderbolt Destruction: With an open grimoire and Thunder God's\
    \ Gloves, Luck focuses his Lightning Magic to the tip of his fingers to create a concentrated orb\
    \ of lightning, which is then launched towards the target. The sphere explodes upon contact, shocking\
    \ and burning the opponent. Additionally, Luck can launch multiple orbs from both hands and create\
    \ a continuous attack from them. (Used for Danmaku) **Thunder Fiend: With an open grimoire, Luck clads\
    \ himself in electricity and uses his increased speed to blitz a target, ricocheting around an area.\
    \ Luck's momentum also increases the strength of his strikes. (Used for Statistics Amplification)\
    \ **Thunder God's Gloves: With his Grimoire opened, Luck forms a pair of gloves out of lightning.\
    \ These clawed gloves extend up to his elbows. The gloves' primary capability is enhancing Luck's\
    \ attacks in hand-to-hand combat, cutting and burning with the claws and increasing reach. The gloves\
    \ are also useful in concentrating magic power for longer range spells. (Used for Strength, Attack\
    \ Speed and Range Amplification) **Thunder God's Boots: With his Grimoire opened, Luck forms a pair\
    \ of boots out of lightning. The boots have a rough surface design rather than a smooth surface. Additionally,\
    \ the tip of the boots are pointed and the shaft goes up to his knees. The collars are much wider\
    \ in circumference than the rest of the shaft, and the front seams are lower than the rear seams.\
    \ The front seams also have a V-shaped design at the center. Furthermore, Luck can alter the design\
    \ of the boots, such as adding claws to increase the offensive nature of it. (Used for Strength and\
    \ Speed Amplification) **Thunder God Armor: With his Grimoire opened, Luck forms an enhanced version\
    \ of the Thunder God's Gloves and Thunder God's Boots to the point of creating a suit or an armor\
    \ out of lightning. With this, Luck's Strength and Speed are increased to another level, allowing\
    \ him to blitz and kill in one hit opponents who were previously on par with him. Thunder God Armor\
    \ also has a second form, created by electricity other than Luck's, amplifying even more his strength\
    \ and speed. *Compound Magic: **Flame Lightning Explosive Cannon: The spell is activated when two\
    \ users combine fire and lightning magic spells. The fire mage gathers Fire Magic in their right hand\
    \ while the lightning mage gathers Lightning Magic in their left hand. The two mages then thrust their\
    \ hands with the magic towards their target. Mana Method: An advanced Mana manipulation technique\
    \ that allows mages to fuel their spells with Mana to enhance the properties of them by creating runes\
    \ out of Mana and forming an array. The runes and the array allows Mana Method users to give an order\
    \ to their spells such as , or . Skilled Mana Method users are able to cast spells virtually indefinitely\
    \ as they use Mana, which exists everywhere in nature. Luck uses rune arrays to create platforms in\
    \ mid-air, where each platform makes him faster with the command . During his battle against Svenkin,\
    \ Luck became so fast that he outsped his skin detection. (Used for Statistics Amplification and Platform\
    \ Creation) * True Lightning Magic: At its peak, Mana Method focuses the mana of nature and generates\
    \ True Magic. With the Heart Kingdom's magic technique, Luck can cast True Lightning Magic by using\
    \ runes to channel mana into a spell and to create a vastly more powerful spell. ** True Lightning\
    \ Magic: Ceranos: By creating five rune arrays below his feet, Luck generates a spell that turns him\
    \ into lightning and strike the opponent. This spells is so powerful that Luck punched through Svenkin's\
    \ body despite the latter being resistant to blunt attacks and able to toughen his skin and cancel\
    \ base Luck's attacks. (Used for Elemental Intangibility) Ultimate Magic \u300C\u7A76\u6975\u9B54\u6CD5\
    \ Ky\u016Bkyoku Mah\u014D\u300D: A secret magic technique of the Elf Tribe that embodies all of the\
    \ magic of its user and creates an unique, powerful spell. ==Gallery== Luck Voltia With Thunder God's\
    \ Gloves and Boots Black Clover.jpg|Luck with Thunder God's Gloves and Boots Luck Voltia's Second\
    \ Personality Black Clover.png|Luck's split personality Black Clover Luck Voltia overflowing with\
    \ mana.png|Luck"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-eeb397c3
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Skilled Hand-to-Hand Combatant * Accelerated Development
    (Frequently surpasses his own limits, and is able to gain power ups by doing so) * Acrobatics * Aura
    * Creation (Luck''s magic and fighting style is specialized in equipment spells. With Creation Magic,
    he is able to create gloves, boots or even an armor made of lightning) * Danmaku * Electricity Manipulation
    * Energy Projection * Enhanced Senses * Extrasensory Perception (Luck is known to have an extremely
    good Magic Sensing due to his magic being a derivative of Wind Magic, as such he can sense Magic from
    dozen of kilometers away) ** Enhanced Sight (People with Magic Power can sense the flow of Mana in
    their surroundings as well as other people''s Magic Power) ** Power Reading (Luck is able to gauge
    the power of others) * Flight (True Flight using Lightning Magic) * Information Analysis (Due to having
    a magic attribute derivated from Wind Magic, Luck has a spectacular sensing ability, to the point
    that he can tell the enemy''s magic attribute, gauge their power and even determine their number from
    miles away) * Magic (Attribute: Lightning Magic) * Paralysis Inducement (Can paralyze his opponents
    with his lightning) * Reactive Power Level (Adapted to Vetto''s strength, speed and fighting style
    after taking a blow from him. He also has adapted to Asta''s speed to the point of overwhelming him)
    * Rage Power and Statistics Amplification (With Reinforcement Magic, Thunder God''s Gloves and Thunder
    God''s Boots) |-|Elf'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
