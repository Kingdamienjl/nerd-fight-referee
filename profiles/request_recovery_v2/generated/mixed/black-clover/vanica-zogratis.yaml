- id: claim-powers-and-abilities-f4ab97af
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Acrobatics, Aura (Mages with a large amount of Magic Power
    can induce an intense pressure in their surroundings), Blood Manipulation, Blood Magic, Creation,
    Curse Warding Magic, Enhanced Senses, Extrasensory Perception (People with Magic Power can sense the
    flow of Mana in their surroundings as well as other people''s Magic Power), Flight (True Flight with
    Devil Power), Forcefield Creation (Mages with a large amount of Magic Power have a forcefield of Mana
    that naturally protects them from incoming attacks), Magic (Attributes: Blood Magic and Curse Warding
    Magic), Multiple Selves (Type 1; Vanica shares half of her body with Megicula), Power Nullification
    (Magic Power superior to the elves who can prevent spells from being casted in their presence), Statistics
    Amplification (with Reinforcement Magic and Devil Power), Danmaku, Unholy Manipulation (Vanica lets
    the power of a demon flow within her to transform and gain a huge power boost), Pain Tolerance (Remained
    unfazed despite having her torso pierced by Noelle) and Resistance to Heat Manipulation with Mana
    Skin (Mana Skin allows even the average Magic Knights to run across the Yultim Volcano, a Grand Magic
    Region which can reduce a human into ashes), Power Nullification with Mana Skin (Mana Skin allowed
    Noelle to cast Sea Dragon''s Roar under the presence of an elf) and Sleep Manipulation with Mana Skin
    (Leopold was able to overcome the effects of Fragil''s Snow Magic, which puts her opponents to sleep)
    With Curse Warding Magic, Vanica gains the following: Age Manipulation, and Life-Force Absorption
    (All curses'' spells originate from Megicula. Catherine was able to extract the Mana and Life-Force
    of the Capital''s inhabitants), Corrosion Inducement (Gordon''s Poison Curse Magic can erode bodies),
    Death Manipulation (Cursed Acier Silva to death and detonated the lives of her Dark Disciples), Durability
    Negation, Pain Manipulation (Approaching the people she cursed makes the curse react, inducing intense
    pain to the cursed), Power Bestowal (Granted Immortality and Regeneration to her Dark Disciples),
    Paralysis/Status Inducement (Catherine''s curse Magic destroyed all five of Yuno''s senses), Soul
    Manipulation (Forbidden Magic can affect the soul), Statistics Reduction (Reduced Loropechika''s powers);
    can reduce the effects of spells affecting her'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
