- id: claim-weaknesses-090b3af3
  section: weaknesses
  axis: weakness
  text: "None Notable. Notable Attacks/Techniques: Blood Magic\u300C\u8840\u6DB2\u9B54\u6CD5 Ketsueki\
    \ Mah\u014D\u300D: Vanica uses this magic attribute to generate and manipulate blood. *Blood Magic:\
    \ Red Beast\u300C\u8840\u6DB2\u9B54\u6CD5\u300E\u7D05\u3044\u30B1\u30C0\u30E2\u30CE\u300F Ketsueki\
    \ Mah\u014D \"Akai Kedamono\"\u300D: Vanica expels a large amount of blood and shapes it into the\
    \ upper body of a large creature with clawed hands, a gaping mouth, and no eyes. It is dense enough\
    \ to withstand powerful offensive spells, and its claws are sharp enough to tear apart defensive spells\
    \ and humans. Several threads of blood keep the user tethered to the beast, so the user has to remain\
    \ near the beast when attacking. The attachments can be moved to different parts of the beast, such\
    \ as the back, which allows the user to ride the beast through the air. Vanica Black Clover - Red\
    \ Beast.png|Red Beast Devil-Possessed: As a member of the Dark Triad, Vanica is host to one of the\
    \ highest-ranking devils, Megicula, who grants her immense power. She can use up to 70% of the devil's\
    \ power. Megicula has magic power superior to that of Zagred, who is stronger than the Clover Kingdom's\
    \ captains and the Elf Tribe's apostles. When using 50% of Megicula's power, Vanica sprouts a pair\
    \ of curved horns from the top of her head and bat-like wings from her back. A marking expands out\
    \ from under her eyepatch, and her right canine teeth elongate. A dark-colored magic covers half of\
    \ her body, including the right horn and wing. When she reaches 70%, more of her body is covered,\
    \ and a light-colored symbol appears on her chest. She grows a tail, and its tip has a similar shape\
    \ to the symbol on her chest. When the Tree of Qliphoth is activated, Vanica becomes able to use 100%\
    \ of Megicula's power. Megicula Black Clover.png|Vanica's Devil: Megicula Megicula curse on Loropechika\
    \ - Black Clover.png|Vanica's Devil: Megicula Megicula Decaying World.png|Megicula corrupts Secre's\
    \ arrays Vanica curse on her Dark Disciples - Black Clover.png|Unnamed resurrection curse Vanica Exploding\
    \ Life.png|Exploding Life Vanica Cursed Shining Generals.png|Unnamed power-boosting curse Curse-Warding\
    \ Magic \u300C\u546A\u7B26\u9B54\u6CD5 Jufu Mah\u014D\u300D: Like the standard Curse Magic, Vanica\
    \ uses this form of magic to include additional lasting effects to spells, but on top of that, Curse-Warding\
    \ Magic allows her to create powerful curses and mark themselves and even others. The effect of the\
    \ curse varies depending on what Vanica wants, she can make curses with negative effects like intense\
    \ pain, power reduction and even death, but also \"positive\" effects such as cursing her Dark Disciples\
    \ to resurrect and regenerate continually. *Curse-Warding Magic: Decaying World \u300C\u546A\u7B26\
    \u9B54\u6CD5\u300E\u8870\u3048\u308B\u4E16\u754C\u300F Jufu Mah\u014D \"Otoroeru Sekai\"\u300D: While\
    \ active, this spell weakens the effects of any magic spell that are applied to her. It can even weaken\
    \ Arcane Magic spells such as Secre's sealing magic, which was strong enough to seal Zagred, who needed\
    \ to resurrect himself to be free again. This spell is automatically active when Vanica uses 70% of\
    \ her Devil's power. *Curse-Warding Magic: Exploding Life \u300C\u546A\u7B26\u9B54\u6CD5\u300E\u66B4\
    \u767A\u3059\u308B\u547D\u300F Jufu Mah\u014D \"B\u014Dhatsusuru Inochi\"\u300D: Vanica detonates\
    \ the devil power that have been bestowed in the target. Two magic circles appear around a dark mass\
    \ in the target's stomach, meanwhile the target's body swells as their magic power builds up inside\
    \ of them. The target begins to shine right before they become a massive explosion. Reinforcement\
    \ Magic: Vanica uses this magic to increase her physical abilities, such as speed, defense and strength.\
    \ *Mana Skin: The user increases her own durability by coating her body with mana. ==Notable Matchups==\
    \ Victories: Losses: Inconclusive: {{Discussions}} Category:Demons Category:Possessed/Brainwashed\
    \ Characters Category:Antagonists Category:Primary Antagonists Category:Black Clover Category:Characters\
    \ Category:Manga Characters Category:Unholy Users Category:Blood Users Category:Curse Users Category:Evil\
    \ Characters Category:Leaders Category:Female Characters Category:Military Characters Category:Murderers\
    \ Category:Queens Category:Magic Users Category:Aura Users Category:Extrasensory Perception Users\
    \ Category:Enhanced Senses Users Category:Acrobats Category:Statistics Amplification Users Category:Transformation\
    \ Users Category:Humans Category:Adults Category:Creation Users Category:Wing Users Category:Brawlers\
    \ Category:Flight Users Category:Traitors Category:Criminals Category:Energy Users Category:Villains\
    \ Category:Power Bestowal Users Category:Pain Users Category:Explosion Users Category:Claw Users Category:Berserkers\
    \ Category:Soul Users Category:Death Users Category:Age Users Category:Absorption Users Category:Life\
    \ Users Category:Statistics Reduction Users Category:Status Effect Users Category:Paralysis Users\
    \ Category:Corrosion Users Category:Anime Characters Category:Rulers Category:Power Nullification\
    \ Users Category:Durability Negation Users Category:Sadists Category:Psychopaths Category:Body Puppetry\
    \ Users Category:Necromancers Category:Energy Projection Users Category:Corruption Users Category:Immortal"
