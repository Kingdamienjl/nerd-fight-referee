    \ tangles of bones that offer no openings to evade and like sharp spears that can be used to brutally\
    \ skewer opposition. He can also boost these bones regeneration for defensive purposes, repairing\
    \ them faster than they can be destroyed. Furthermore, he is seen shaping a single bone into a full,\
    \ hilted sword. *Bone Magic: Eternal Fangs \u300C\u9AA8\u9B54\u6CD5\u300E\u7121\u9593\u9AA8\u7259\u300F\
    \ Hone Mah\u014D \"Mugen Kotsuga\"\u300D: Zenon protrudes countless bones out of their body. These\
    \ bones are sharp and strong enough to pierce through dense sand and still puncture the target. Zenon\
    \ Eternal Fangs.png|Eternal Fangs Spatial Magic \u300C\u7A7A\u9593\u9B54\u6CD5 K\u016Bkan Mah\u014D\
    \u300D: Zenon uses this rare magic attribute to manipulate space. He often uses it to create cubes\
    \ that dominate and negate the mana trapped within them. Zenon kidnaps Yami.png|Unnamed Spatial Magic\
    \ *Spatial Magic: Spatial Mana Domination \u300C\u7A7A\u9593\u9B54\u6CD5\u300E\u7A7A\u9B54\u638C\u63E1\
    \u300F K\u016Bkan Mah\u014D \"K\u016Bma Sh\u014Daku\"\u300D: Zenon creates a cube of Spatial Magic\
    \ around his target and takes control of the mana within the cube, including in any spells. This control\
    \ allows Zenon to negate an enemy's attacks and defenses, as well as to spawn attacks from multiple\
    \ angles, similar to Mana Zone. The cubes can vary in size and number, from encapsulating individual\
    \ attacks to dominating whole rooms. Zenon dominates whole room.png|Spatial Mana Domination Zenon\
    \ creates multiple cubes.jpg|Zenon creates multiple cubes Devil's Power: Since he is the vessel of\
    \ a Devil, just like Asta, he is able to use up to 80% its Devil's Power. This changes to 100% if\
    \ the Tree of Qliphoth is activated. Zenon's devil profile.png|Zenon's Devil Reinforcement Magic:\
    \ Zenon uses this magic to increase his physical abilities, such as speed, defense and strength. *Mana\
