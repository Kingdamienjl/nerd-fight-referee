    user.), BFR (Can send his target to another dimension) and Resistance to Heat Manipulation with Mana
    Skin (Mana Skin allows even the average Magic Knights to run across the Yultim Volcano, a Grand Magic
    Region which can reduce a human into ashes), Power Nullification with Mana Skin (Mana Skin allowed
    Noelle to cast Sea Dragon's Roar under the presence of an elf) and Sleep Manipulation with Mana Skin
    (Leopold was able to overcome the effects of Fragil's Snow Magic, which puts her opponents to sleep)
