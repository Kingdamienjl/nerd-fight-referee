  section: abilities
  axis: hax
  text: Pre-Devil's Bargain= Superhuman Physical Characteristics, Magic, Extrasensory Perception, Aura,
    Acrobatics, True Flight, Enhanced Senses, Bone Manipulation, Danmaku, Weapon Creation (Can create
    a bone sword), Creation (Can create a bone wing), Unholy Manipulation (Zenon lets the power of a demon
    flow within him to transform into one), Statistics Amplification (with Reinforcement Magic and Demon
