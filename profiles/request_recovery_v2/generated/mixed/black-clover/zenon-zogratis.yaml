- id: claim-weaknesses-b9434543
  section: weaknesses
  axis: weakness
  text: "None Notable. Notable Attacks/Techniques: Bone Magic \u300C\u9AA8\u9B54\u6CD5 Hone Mah\u014D\u300D\
