    \ Amplification Users Category:Regeneration Users Category:Healers Category:Flight Users Category:Magic\
    \ Users Category:Extrasensory Perception Users Category:Aura Users Category:Enhanced Senses Users\
    \ Category:Unholy Users Category:Transformation Users Category:Evil Characters Category:Villains Category:Wing\
