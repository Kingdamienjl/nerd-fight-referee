- id: claim-standard-equipment-3953168e
  section: equipment
  axis: equipment
  text: '*Grimoire: Magna wields a grimoire that he used with his fire magic. The grimoire has a black
    cover with a skull ornament in the center of its front cover and solid line borders with a fire insignia
    at each of the corners of the covers. A red clover can also be seen in the right eye of the skull
    design. *Crazy Cyclone: Magna possesses a broom with a bull''s skull as its front set and a spine
    and ribs as its frame. Magna Swing''s Grimoire Black Clover.png|Magna''s Grimoire Magna Swing Crazy
    Cyclone Black Clover.png|Crazy Cyclone'
  source_ids: *id003
  decisive: false
