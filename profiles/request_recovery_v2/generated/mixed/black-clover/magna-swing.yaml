- id: claim-weaknesses-5607a96b
  section: weaknesses
  axis: weakness
  text: 'None notable | Soul Chain Deathmatch takes an incredibly long time to prepare, and once it''s
    ready, it can only be used once. Notable Attacks/Techniques: Magna Exploding Fireball.png|Exploding
    Fireball Magna Swing Exploding Buckshot Black Clover.png|Exploding Buckshot Magna Swing Prison Death
    Buckshot Black Clover.png|Prison Kill Buckshot Magna Swing Annihilation Massacre Fireball Black Clover.png|Extreme
    Killing Vanishing Fireball Magna Swing Explosive Annihilation Scattershot Black Clover.png|Explosive
    Vanishing Scattershot Magna Swing Time Bomb Explosive Scattershot Black Clover.png|Time Bomb Explosive
    Scattershot Magna Swing Gargantuan Exploding Fireball Black Clover.png|Maximum Exploding Fireball
    Magna Swing Flame Bondage Formation Black Clover.png|Flame Rope Solid Binding Formation Magna Swing
    Grand Slam Black Clover.png|Grand Slam Soulchain Deathmatch.jpg|Soul Chain Deathmatch Flame Magic:
    Magna uses this magic attribute to generate and manipulate fire. He primarily forms fireballs that
    he throws at his opponents. *Exploding Fireball: Magna creates a fireball in the palm of his hand
    to throw it as a projectile weapon towards the target. Upon contact, the fireball explodes and generates
    extensive damage on the target. Furthermore, the user can generate more fireballs and create a continuous
    attack. *Exploding Buckshot: Magna creates multiple fireballs at once and throws them as a barrage
    of attacks on a wide area. Upon contact, the fireballs generate massive, continuous explosions that
    can clear the area from any threats. **Prison Kill Buckshot: Magna creates multiple fireballs at once
    and throws those fireballs as a barrage of attacks on a wide area. Upon contact, the fireballs generate
    explosions and deliver extensive damage to the target. Additionally, the fire from this spell will
    not vanish or wane, which could be used as an extension for other spells. *Extreme Killing Vanishing
    Fireball: Magna creates a fireball in the palm of his hand and throws it as a projectile weapon towards
    the target. When the fireball nears the target, it disappears and then reappears, striking the target
    from another angle. Although the fireball disappears visually, its mana can still be felt, so mages
    with high sensing abilities could track the movement. **Explosive Vanishing Scattershot: Magna creates
    multiple Explosive Vanishing Scattershot''s at once and throws them as a barrage of attacks on a wide
    area. These fireballs explode on contact and deliver extensive damage to the target. *Timed Explosive
    Scattershot: Magna creates multiple fireballs at once and throws them as a barrage of attacks on a
    wide area. These fireballs explode after a set period of time and deliver extensive damage to the
    target. *Maximum Exploding Fireball: Magna creates a large Exploding Fireball in the palm of his hand
    and slams it into the opponent. The fireball''s explosion generates extensive damage on the target.
    Additionally, the explosive force could be used to crush the target against a surface, increasing
    the damage dealt. The fireball could also be thrown at the target. *Flame Rope Solid Binding Formation:
    Magna creates a rope composed of fire which wraps around the target. The spell makes use of fire sources
    from the surrounding area, so it is commonly used after activating other fire-based spells. *Grand
    Slam: Magna creates a Baseball bat from swirling flames. It could be used to knock fireballs toward
    an opponent or as a melee weapon. *Soul Chain Deathmatch: A Secret Flame Magic technique which Magna
    created and perfected during the six-month timeskip. Magna creates a chain of fire from his chest
    and attaches it to his opponent''s by throwing a weak, inconspicuous fireball at them, linking them
    together. While linked, the chain adds the power of both fighters and then divides it equally between
    them, allowing Magna to gain a major boost in power against opponents much stronger than him while
    simultaneously reducing their own power. Reinforcement Magic: Magna uses this form of magic to increase
    his physical capabilities. Base Run Gamble Black Clover.png|Base Run Gamble Compound Magic: Magna
    combines his Flame Magic with Luck''s Lightning Magic. *Flame Lightning Explosive Cannon: The spell
    is activated when two users combine Flame and Lightning magic spells. The Flame mage gathers Flame
    Magic in their right hand while the Lightning mage gathers Lightning Magic in their left hand. The
    two mages then thrust their hands with the magic towards their target. Black Clover- Luck Voltia and
    Magna Swing''s Flame Lightning Explosive Cannon by yuikines dcu0rjv.jpg|Flame Lightning Explosive
    Cannon ==Gallery== Black Clover- Black Bulls stop Langris.png|Black Bulls stopping Langris Black Clover
    Opening 4 v2- Luck Voltia and Magna Swing Compound Magic Spell.jpg|Flame Lightning Explosive Cannon
    Black Clover Black Bulls barge into courthouse.png|Black Bulls barging into the Courthouse ==Notable
    Matchups== Victories: Losses: Inconclusive: {{discussions}}'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ce65a7ba
  section: abilities
  axis: hax
  text: 'BoS=Superhuman Physical Characteristics, Aura, Creation, Danmaku, Energy Projection, Enhanced
    Senses, Explosion Manipulation (with Exploding Fireball), Extrasensory Perception (People with Magic
    Power can sense the flow of Mana in their surroundings as well as other people''s Magic Power), Flame
    Magic, Flight (Limited Flight with Crazy Cyclone), Invisible Attacks (with Annihilation Massacre Fireball),
    Magic (Attribute: Flame Magic), Magic Nullification and Sealing with Binding Magic (Binding Magic
    prevents the opponent from casting spells and exerting their Magic Power. Heath Grice said he couldn''t
    use his Magic because Magna''s binding sealed it), Statistics Amplification (With Reinforcement Magic),
    Weapon Creation (Can create a baseball bat made out of flames) |-|Elves'' Invasion Arc=Same as before.
    Resistance to Heat Manipulation with Mana Skin (Mana Skin allows even the average Magic Knights to
    run across the Yultim Volcano, a Grand Magic Region which can reduce a human into ashes by heat alone),
    Power Nullification with Mana Skin (Mana Skin allowed Noelle to cast Sea Dragon''s Roar under the
    presence of an elf), and Sleep Manipulation with Mana Skin (Leopold was able to overcome the effects
    of Fragil''s Snow Magic, which puts her opponents to sleep) |-|Spade War Arc=Same as before, Power
    Absorption (With Soul Chain Deathmatch; adds his and his opponent''s power and divides it equally,
    letting him absorb his opponent''s power and reduce their own), Skilled Hand-to-Hand Combatant (Spent
    several months training and managed to overwhelm Dante in hand-to-hand combat), Soul Manipulation,
    and Madness Manipulation (Soul Chain Deathmatch connects the user and target''s souls themselves,
    and breaking the chain will cause the one who did so to go insane)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
