      Power. Even a 1% increase of Devil Power could give Vanica phenomenal boost in power), far higher
      with Sacred Power (Claimed this power to be humanity's true form, putting it beyond his Devil Power.
      Sacred Power is also purified Devil Power, and therefore should not be inferior to Devil Power.
      Sliced open Devil Union Asta's chest without difficulty. Should be superior to his Paladins, who
      can damage the Ryuzen 7, and much more than the 5-Headed Dragon could)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least FTL (Should be faster than Julius and comparable to Complete Lucifero. Kept up with
