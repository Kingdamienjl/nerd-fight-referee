  attack_potency:
    text: At least Multi-Continent level (Ate Lucifero's heart and gained his power), up to Moon level+
      with Devil Power (As the best Devil Host of the history of his family, his Devil Power increase
      should be greater than that of his siblings, being at least 100x stronger than his base form at
