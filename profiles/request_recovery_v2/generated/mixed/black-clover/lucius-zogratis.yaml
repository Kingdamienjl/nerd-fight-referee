    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class Z (Comparable to Lucifero, as he ate his heart and gained his power), far higher
      with Sacred Power (Having True Lucifero's physical strength and magic power on top of his Devil
      Power and Sacred Power, Lucius should be far superior to him), even higher with Reinforcement Magic
      (Reinforcement Magic was stated by Tabata to increase the physical capabilities of the user even
      without much in the way of muscle)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Multi-Continent level (Engaged Partial Union Asta in hand-to-hand combat, forcing him
      to dodge Lucius' strikes), up to Moon level+ with Devil Power far higher with Sacred Power (Far
