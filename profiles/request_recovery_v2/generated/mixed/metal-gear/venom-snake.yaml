- id: claim-weaknesses-c78f0855
  section: weaknesses
  axis: weakness
  text: 'The Ground Zeroes incident left him with metallic shards attached near his heart and brain. The
    fragment on his forehead may cause permanent brain damage if moved. He suffered enough brain damage
    that he forgot how to speak Russian and has hallucinations due to the shard pressing on his optic
    nerve, which also causes him to suffer from color blindness from time to time. Notable Attacks/Techniques:
    *CQC: Unique and highly effective melee combat skill that provides a soldier with various options
    without prohibiting weapons use. The user assumes a stance with a knife and a handgun, allowing them
    to grab/throw opponents in a melee, threaten/execute people with the knife, or shoot down opponents
    out of range. CQC focuses primarily on grabs, throws, and other disarming techniques, allowing one
    to incapacitate enemies or use them as a human shield. Skilled practitioners can even "chain" throws,
    swiftly neutralizing multiple armed combatants. As a former MSF soldier, Big Boss personally instructed
    Venom to use the technique. After undergoing hypnotherapy, he obtained the memories and combat experience
    of Big Boss, making him just as skilled as the man himself. PvZCQC.gif|Punished "Venom" Snake performing
    CQC *Fire Support: Snake can request a variety of airstrikes for multiple strategic purposes. **Bombardment:
    Drops heavy explosives on predetermined targets. **Smoke dispersal: Drops multiple smoke bombs on
    predetermined locations to hinder enemies'' vision and conceal his movements. **Sleep gas dispersal:
    Drops sleeping gas on predetermined targets to take them out non-lethally. **Chaff dispersal: Disperses
    metal strips across a large area that temporarily jam radio frequencies and disable electronic devices.
    *Weather Modification: Snake can request that the local weather be modified for strategic purposes.
    **Clear Sky: Current weather is dispersed. **Rain: Causes heavy rainfall and thunder, works even in
    arid regions. **Sandstorm: Kicks up a sandstorm. ==Gallery== Metal Gear Solid V - The Phantom Pain
    Nuclear ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
