- id: claim-standard-equipment-9aac7d86
  section: equipment
  axis: equipment
  text: 'Cardboard box, combat knife, thermal and NV goggles, a wide variety of lethal and non-lethal
    weaponry in the form of handguns, assault rifles, sniper rifles, light machine guns, submachine guns,
    shotguns, grenade launchers, rocket launchers, grenades, mines, and explosives *iDroid: Holographic
    interface device that provides Snake with live info on the terrain, weather, and position of objectives
    and marked targets. It also serves as a communication device that keeps Snake in touch with Diamond
    Dogs'' staff and allows him to manage Mother Base''s development from afar. This will also enable
    Snake to request airstrikes, chopper support, airdrops to change or re-supply his current equipment
    and dispatch military vehicles and buddies for assistance. *Int-Scope: Binoculars used to recon remote
    areas. Integrated with a directional microphone feature and analyzer that allows Venom to listen to
    sounds from hundreds of meters away and analyze the skills and abilities of soldiers he focuses on.
    *Fulton Recovery System: Surface-to-air recovery system allows Snake to extract supplies, weaponry,
    vehicles, animals, and people from the area and transport them to Mother Base. At the maximum level,
    the device is replaced by a wormhole generator that allows indoor extraction and eliminates the chance
    of failed recoveries due to weather conditions. *Bionic Arm: Myoelectric prosthesis for Snake that
    enhances his natural abilities by providing him with increased mobility, speed, and precision. The
    basic model enables echolocation to locate enemies, prisoners, and animals within 100 meters. The
    sonar is activated by punching the ground. **Stun Arm: Delivers a 1.2 megavolt electric shock capable
    of incapacitating enemies. The battery is charged by kinetic energy generated by the wearer''s natural
    motions, supplemented by solar power. It releases multiple air-to-ground lightning strikes when reaching
    maximum charge, incapacitating all targets within a 40-meter radius. It can penetrate through ceilings
    and covers. **Hand of Jehuty: It releases a detachable "Wisp" weapon forward, capturing and pulling
    a target towards the user. **Rocket Arm: Allows Snake to launch his arm like a missile, guided by
    a mounted camera that allows him to control its flight path. **Blast Arm: A lethal variant of the
    Rocket Arm that explodes on contact with the target can also perform deadly explosive strikes in close
    quarters. *Sneaking Suit: A specialized military garment comprised of an aramid fabric with exceptional
    resistance to damage. It adheres firmly to specific body parts, accelerating the healing process and
    enhancing the user''s endurance. As with previous models, it provides insulation that shields the
    body from harmful substances and enables the user to work in harsh climates and damp conditions. It
    also features noise-dampening soles that allow the wearer to move around more quietly. *Parasite Suit:
    Special prototype combat suit based on the Skulls'' parasite technology. Used with cartridges containing
    parasites to activate the same special abilities as the Skulls. **Parasite Mist: Covers the entire
    battlefield with mist, significantly reducing visibility. **Parasite Camouflage: Turns the user completely
    invisible. **Parasite Armor: Makes the user invulnerable to damage by covering its body in a layer
    of metallic archaea.'
