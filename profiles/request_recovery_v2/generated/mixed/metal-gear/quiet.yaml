  intelligence:
    text: Gifted (Unlike most Parasite Units, Quiet's Parasite did not alter her mind, allowing her to
      combine her already lethal skills as an assassin with an array of supernatural abilities. Even before
      she had been given her Parasite, she was a deadly assassin, able to infiltrate a hospital and kill
      a doctor and nurse without even alerting them beforehand. After receiving her Parasite, she became
      more dangerous; her stealth improving to the point that she could fake escaping by turning invisible
      inside the helicopter and remaining hidden for several hours without Venom Snake ever noticing until
      she actively revealed herself. Her Parasite also granted her vastly improved accuracy and perception,
      able to spot individual blades on a helicopter when they were at full speed, which could combine
      with her speed to allow her to shoot in between them. This feat impressed even Revolver Ocelot,
      saying that both of her eyes were "master eyes" in terms of focusing on a target or multiple targets.
      She has also accurately shot an unguided bullet with pinpoint accuracy to kill a fighter jet pilot
      at a great distance, compensating for bullet drop and wind speed while both the jet and the helicopter
      she was in were moving at Mach speed. She also shoots mid-air grenades to make them ricochet without
      making them detonate and guide a helicopter through a zero-visibility sandstorm by reading their
      flight path and predicting the slight adjustments altogether. Quiet is also highly skilled in hand
      to hand combat, able to quickly kill a group of Russian Soldiers while her hands were bound, she
      was mostly clothed, and she had just regained consciousness from drowning)
    source_ids: *id002
    confidence: 0.95
