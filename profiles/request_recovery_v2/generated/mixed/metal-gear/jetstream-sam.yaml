    enhancement, he defeated Raiden in their first encounter, severed Armstrong's arm during their duel
    and defeated Blade Wolf, a super computer with 90 Billion optical IQ and brain's processing speed
    of 60 megabytes/minute with no cybernetics whatsoever. Sam was skilled enough to kill ten armed mobsters
    with only his sword before receiving any enhancements years prior. Aside from his combat prowess,
    he also possesses a sharp wit and a remarkably sarcastic sense of humor, making accurate inferences
    about Raiden's past and hidden personality as Jack the Ripper and taunting his opponents into charging
    him recklessly before executing them)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
