- id: claim-standard-equipment-ebebf049
  section: equipment
  axis: equipment
  text: '*High-Frequency Murasama: A 16th-century katana that had been passed down through the Rodrigues
    family for generations and was later upgraded with High-Frequency technology. Thanks to the exceptional
    quality of the original weapon, the High-Frequency Murasama boasts durability and cutting power far
    beyond that of standard HF blades. Its sheath also has a rifle mechanism and trigger that can be used
    to unsheathe the blade at high speeds for rapid attacks. *Jam Grenade: An electronic attack device
    that deploys countless metal strips along with an active jammer to temporarily disable radio communications
    and electronic equipment such as cameras, radar, missile guidance, and lock-on systems as well as
    stun AI controlled weapons and early model Cyborgs. *Red Phosphorus Grenade: A smoke grenade that
    burns phosphorous pentoxide and other additives to create a screen that impairs standard infrared
    sensors. *Electro-Magnetic Grenade: A disposable electronic attack device that emits electromagnetic
    pulses for a limited time, disabling any UGs and Cyborgs in the area. Because recent-model UGs and
    Cyborgs immediately shut down all circuitry when an electrical surge is detected, no permanent damage
    is done. *Repair Nanopaste Substance UGs and Cyborgs use to recover from sustained injuries, akin
    to how an average human regenerates from wounds but at a much faster rate. It can be used to restore
    Sam''s Life Gauge immediately. *Electrolyte Pack: A container of molten carbonate electrolytes used
    to power military cyborgs'' fuel cells. It can be used to restore Sam''s Fuel Cell Gauge immediately.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-45bb29c8
  section: power_scale
  axis: battle_iq
  text: Gifted generally, Genius Combatant (Sam is a highly versatile fighter thanks to his mastery of
    "Rodrigues New Shadow School," a unique Brazilian-Japanese fighting style that includes ruthless efficiency
