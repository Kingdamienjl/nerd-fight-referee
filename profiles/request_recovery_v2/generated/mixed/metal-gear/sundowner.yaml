- id: claim-powers-and-abilities-13b304cb
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Cyborgization (Full; Has a completely cybernetic body.
    The only biological part is the brain, and it is unknown to what extent it''s been modified) **Self-Sustenance
    (All Types; Cyborgs can operate for short periods of time without breathing, but in case they are
    unable to breathe for whatever reason, they are equipped with a supply of liquid oxygen in their bloodstream
    to keep them going. Their nanomachines should be completely superior to those of Solid Snake) **Immortality
    (Type 2; As a member of the Winds of Destruction, he should scale vastly above two common cyborgs
    such as the Gemini, who survived after being sliced into pieces and decapitated, Doktor states that
    the Winds of Destruction are capable of surviving complete physical destruction and their brain can
    be transferred to another body if need be. Their consciousness stays active for a few minutes after
    this, and they can communicate even after their brain has been turned into paste) **Nanotechnology
    **Acrobatics (Hypermobility & Self-Momentum) *Martial Arts Mastery *Weapon Mastery *Enhanced Senses
    *Durability Negation, Vibration Manipulation & Matter Manipulation with High-Frequency blades (HF
    weapons vibrate extremely fast, allowing them to disrupt atoms with ease by shrinking their electron
    clouds. HF weapons can also cause changes to their blades particles at a quantum level, as well as
    cause quantum decoherence in the plank scale) *Explosion Manipulation (Can generate explosive blasts
    by blocking the attacks with his shields *Heat Manipulation (Can heat his twin pincer-blades making
    them much more deadly and effective) *Summoning (Can call cyborg grunts and helicopters to assist
    him in battle) *Shockwave Creation Resistance to: *Matter Manipulation & Vibration Manipulation (Can
    resist the effects of HF Blades due to having a body made of carbon nanotube fiber) *Empathic and
    Pain Manipulation (Nanomachines can suppress hormones in order to suppress emotions, along with neutralizing
    pain. Sam stated that nanomachines grant resistance to fear and other strong emotions, and that while
    they still feel them deep inside their mind, cyborgs are unaffected by them physically and are still
    fully capable of fighting) *Radiation Manipulation & Extreme Heat (Should scale to Raiden, as all
    cyborgs use the same systems Raiden uses)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
