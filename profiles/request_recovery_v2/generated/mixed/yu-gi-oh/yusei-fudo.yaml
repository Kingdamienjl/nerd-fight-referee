  intelligence:
    text: "Genius (Yusei is shown to be highly technical when it comes to computers and machines, able\
      \ to build and program seemingly anything as he was to build his own Duel Runner from scrap parts,\
      \ twice, and how he jammed Rally\u2019s criminal mark. Along with the ability to construct one,\
      \ he is also shown to be an expert at riding a Duel Runner, pulling off extremely dangerous maneuvers\
      \ on a regular basis. He was even able to reverse-engineer a Duel Board simply from a detailed drawing.\
      \ Yusei is also an adept teacher as shown when he was helping Akiza get her Turbo Dueling License.\
      \ He is a skilled fighter, as evident from how effortlessly he knocked out two of Goodwin's security\
      \ guards, and is street smart enough to consistently evade capture Sector Security, He\u2019s also\
      \ an expert in physics, eventually over his parents' job as head of overseeing the completion of\
      \ the Ener-D Reactor and even building the Fortune program to prevent the Meklord Emperor Genocide.\
      \ As the captain of Team 5Ds, Yusei showed to be a very capable strategist and tactician, able to\
      \ see through his opponent's plans and devising plans for his own team)"
    source_ids: *id002
    confidence: 0.95
