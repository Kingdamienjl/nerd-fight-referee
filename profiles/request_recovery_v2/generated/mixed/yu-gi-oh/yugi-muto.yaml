- id: claim-weaknesses-b9051819
  section: weaknesses
  axis: weakness
  text: 'Dark Yugi cannot come out if Yugi is not wearing or does not have physical contact with the Millennium
    Puzzle (but can take it off once he has taken over). If Yugi''s soul is erased or dies, Dark Yugi
    will no longer exist. | Atem cannot summon the Egyptian Gods or ka without the Millennium Pendant.
    If Atem runs out of Ba, he will die. Notable Attacks/Techniques: *Shadow Games: Shadow Games can be
    taken in the form of generally any game that can be created or made out of already existing games,
    such as tabletop RPGs. These Shadow Games have numerous levels of depth, Stage One merely reflecting
    costs and disadvantages to the player''s physical body, and Stage Three prohibiting cheating and creating
    an instant loss if done. A Shadow Game can be established either in the beginning or the middle of
    the game itself. An offering or bet can be made on these Shadow Games, with the loser having whatever
    they''ve bet destroyed or given ownership to the winner. *Penalty Game: Can be issued when a participant
    in a Shadow Game loses. The Penalty Game can vary in severity depending on what was bet or what the
    winner decides to do. These are usually in the form of temporary illusions, mind manipulation, or
    in worse cases, death. **Sensation of Death: A temporary illusion that causes one to be terrorized
    and have a feeling similar to dying. For those with weak hearts or easily afraid, this could potentially
    be lethal. **Mind Crush: A permanent attack on the mind where it''s figuratively split into several
    pieces. This is not lethal but leaves the victim in a comatose state until their soul is capable of
    piecing back together their "broken heart". The point of this Penalty Game is to remove the evil in
    oneself. Note 1: Ba represents one''s life force or life energy, while a ka represents one''s spirit
    of a monster being controlled by another via their Ba. Damage to a ka will also damage their Ba, and
    if all of their Ba (or life energy) is depleted, then they will die. If a ka is summoned through other
    means, it will not cause the summoner''s death if it is killed. Note 2: This page covers the original
    manga incarnation of this character. If you are looking for the anime version of this character, check
    Yugi Muto (NAS) to avoid confusion. ==Notable Matchups== Victories: John Kramer (Saw) John Kramer''s
    Profile (John was in his prime. The shadow game was Jenga) Daniel J. D''Arby (JoJo''s Bizarre Adventure)
    D''Arby''s Profile (The game played was Blackjack, Yugi''s Egyptian God Cards were restricted, and
    speed was equalized) Losses: Inconclusive: {{Discussions}} Category:Characters Category:Yu-Gi-Oh!
    Category:Anime Characters Category:Card Users Category:Clairvoyance Users Category:Duelist Category:Empathic
    Manipulation Users Category:Geniuses Category:Ghosts Category:Good Characters Category:Heroes Category:Humans
    Category:Illusionists Category:Kings Category:Male Characters Category:Manga Characters Category:Mind
    Users Category:Movie Characters Category:Multiple Selves Users Category:Pocket Reality Users Category:Primary
    Protagonists Category:Protagonists Category:Revived Characters Category:Sealing Users Category:Spirits
    Category:Summoners Category:Teenagers Category:Hat Users Category:Supernatural Willpower Users Category:Students
    Category:Spray Paint Users Category:Game Users'
