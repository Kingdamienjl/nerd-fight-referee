- id: claim-weaknesses-d7437682
  section: weaknesses
  axis: weakness
  text: 'Weak to Fire (Though his armor helps mitigate this weakness) and Unholy attacks, Stormdrake is
    weak to Lightning and Ice | Weak to Fire (Though his armor helps reduce this weakness) and Unholy
    attacks Notable Attacks/Techniques: *Aerial Fire Breath: Flies straight up into the air and spews
    fire straight down in a large area. *Lightning Storm: The King slowly pulls out his weapon, creating
    a lightning strike on the enemy''s location. *Expanding Lightning: The King creates a Sunlight Spear,
    and strikes it into the ground. After a short while, smaller lightning bolts fire out from that location,
    traveling by the floor. *Spear-Sword Stab: The King prepares a large stab, rushing towards his enemy
    with high speed. If it lands, the enemy is lifted upwards and struck by lightning. ==Gallery== King_of_the_Storm.jpg
    Nameless_King.jpg ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Reflist|2}}
    ==Notes/Explanations== {{Scroll box|content=}} {{Discussions}} Category:Characters Category:Dark Souls
    Category:Male Characters Category:Game Characters Category:Game Bosses Category:Antagonists Category:Weapon
    Masters Category:Animal Users Category:Electricity Users Category:Fire Users Category:Flight Users
    Category:Soul Users Category:Immortals Category:Fantasy Characters Category:Duos Category:Armor Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-95f24324
  section: abilities
  axis: hax
  text: 'Base= Superhuman Physical Characteristics, Electricity Manipulation and Holy Manipulation (The
    King is the heir of Gwyn''s Lightning and can cast Lightning Miracles. Lightning damage is heavily
    associated with the gods), Soul Manipulation and Power Absorption (Absorbed Stormdrake''s soul and
    absorbed its power), Immortality (Types 1; Has been alive for thousands of years), Spear-Sword Mastery,
    Statistics Amplification and Damage Reduction (Should have access to Sacred Oath), Resistance to Electricity
    Manipulation, Ice Manipulation, Poison Manipulation, Bleeding, Mind Manipulation (Despite being in
    a hollowed state his mind isn''t affected and also he isn''t affected by Rapport) and Soul Manipulation
    (Can resist soul-based attacks), Lesser Resistance to Curse Manipulation, Petrification and Magic.
    The Stormdrake possesses: Superhuman Physical Characteristics, Flight,Fire Manipulation, Air Manipulation,
    Weather Manipulation, Resistance to Fire Manipulation, Poison Manipulation and Bleeding |-|After absorbing
    Stormdrake=Same as before on a higher level minus the Stormdrake''s abilities'
  source_ids: *id003
  decisive: true
