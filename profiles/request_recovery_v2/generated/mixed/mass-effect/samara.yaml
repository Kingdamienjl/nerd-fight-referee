- id: claim-weaknesses-4ff3603e
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extreme
    temperature, toxins, or radiation. Notable Attacks/Techniques: *Throw: Tosses an enemy through the
    air with a biotic blast. *Pull: Yanks an opponent off the ground, making them float helplessly in
    the air. *Reave: Drains a target''s health and disrupts their resistances, receiving increased damage
    protection while this power is in effect. *Warp: Rips an enemy apart at a molecular level and stops
    the targeted enemy from regenerating health. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{Scroll box| {{reflist|2}}}} {{discussions}} Category:Characters Category:Female Characters
