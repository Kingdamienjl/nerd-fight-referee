    Artists Category:Weapon Masters Category:Energy Users Category:Density Users Category:Energy Projection
    Users Category:Absorption Users Category:Power Nullification Users Category:Science Fiction Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
