- id: claim-weaknesses-8ea68621
  section: weaknesses
  axis: weakness
  text: 'Its kinetic barriers are not infinitely powerful; the full might of an organic fleet can destroy
    it, and the destruction of its possession avatar can cause a feedback loop that disables it. Notable
    Attacks/Techniques: Indoctrination: Indoctrination is an attempt at controlling the opponents mind.
    It happens just by being near a Reaper or a Reaper artefact whether it''s dead or not. The opponent
    begins to go insane and eventually is convinced that the Reapers should be obeyed. Strong willed people
    can resist the effects but eventually will be turned over time. ==Notable Matchups== Victories: Losses:
    Inconclusive: {{Discussions}} Category:Mass Effect Category:Primary Antagonists Category:Robots Category:Spaceships
