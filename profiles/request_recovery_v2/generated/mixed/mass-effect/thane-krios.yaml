- id: claim-weaknesses-8593f11d
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extremes
    of temperature, toxins, or radiation. He''s also terminally ill with a rare disease that affects his
    lungs. Notable Attacks/Techniques: *Throw: Tosses an enemy through the air with this biotic blast.
    *Warp: Throws a blast of biotic energy that rips an enemy apart at a molecular level. It also prevents
    the targeted enemy from regenerating health. *Shredder Ammo: Enhances his weapons with ammo that''s
    specilzed in attacking flesh targets. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Scroll box| {{reflist|2}}}} {{discussions}} Category:Characters Category:Male Characters Category:Game
