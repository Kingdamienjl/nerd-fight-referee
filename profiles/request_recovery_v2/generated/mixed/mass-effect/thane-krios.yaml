    Users Category:Photographic Memory Users Category:Martial Artists Category:Pressure Point Users Category:Stealth
    Masters Category:Energy Users Category:Density Users Category:Energy Projection Users Category:Power
    Nullification Users Category:Science Fiction Characters'
  source_ids: *id003
  decisive: false
  status: unverified
