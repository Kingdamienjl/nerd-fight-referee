- id: claim-powers-and-abilities-215fa628
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Enhanced Senses (Can locate enemy positioning from hearing
    and detect the presence of close-by artifacts), Limited Air Manipulation and Clairvoyance (Can summon
    wind that blows toward a desired objective, possibly due to the wind being a manifestation of the
    soul of Jin''s father. Wind gusts are summoned to damage enemies with the Charm of Distraction), Perception
    Amplification (Can slow his perception of time while using a ranged weapon using concentration), Weapon
    Mastery (The best swordsman in Tsushima and a master of archery. Can simultaneously throw five kunai
    toward his enemies), Regeneration (Low. Can heal himself and recover from mortal wounds through sheer
    resolve and iron will), Animal Manipulation (Rides a trained samurai horse that can be summoned with
    a whistle. Can quickly tame enemy war dogs to fight for him with the Charm of Canine Recruitment.
    Foxes lead him to shrines of Inari possibly due to the goddess Inari being Jin''s guardian spirit.
    Golden birds lead him to points of interest possibly due to the birds being a manifestation of the
    soul of Jin''s mother. Fireflies can guide to the location of artifacts. A swarm of Hornets is summoned
    to damage enemies with the Charm of Distraction), Information Analysis and Martial Arts (Can create
    fighting styles that counters his enemies after observing them. Utilizes parries and dodges for powerful
    counterattacks), Power Mimicry (Can replicate sword techniques after observing them), Acrobatics (Skilled
    at climbing terrain and buildings. Can run on tightropes and utilizes a grappling hook), Stealth Mastery,
    Pressure Points (Can efficiently kill enemies with a quick stab from his tanto dagger), Smoke Manipulation
    (With smoke bomb. Can create fog with his Weather Manipulation), Light Manipulation (With blinding
    dust which he includes in his smoke grenades), Healing (Carries healing incense which he includes
    as healing fumes in his smoke grenades), Sound Manipulation (Uses wind chimes and fire crackers as
    distractions), Explosion Manipulation (With bombs), Fire Manipulation (With Way of the Flame and fire
    arrows. His bombs can set enemies on fire. With the Charm of Blazing Flame, Jin''s Way of the Flame
    slashes ignites enemies around him), Poison Manipulation (Uses poison darts and poison vapors within
    his wind chimes that causes humans to vomit blood and die within seconds), Biological Madness Manipulation
    and Perception Manipulation (Uses hallucination darts which causes enemies to attack their allies),
    Weather Manipulation (By playing certain songs with his flute, he can change the weather to be clear,
    stormy, foggy or rainy), Electricity Manipulation (With the Charm of Heavenly Rebuke, using the Heavenly
    Strike technique can result in a lightning bolt striking a nearby enemy), Preparation, Social Influencing
    (Uses tactics that maximizes fear among his enemies and convinces them that he is not a mere human.
    Considered a charismatic leader among the populace with authority that rivals the shogunate), Resistance
    to: Pain Manipulation (Can fight through the pain with his resolve), Poison Manipulation (Can survive
    poison that would kill other humans within seconds) and Fire Manipulation (Can withstand being set
    on fire)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
