- id: claim-weaknesses-58e71b16
  section: weaknesses
  axis: weakness
  text: 'Willing to accept challenges to honorable sword duels, even from ronin who killed hundreds of
    innocents. Notable Attacks/Techniques: Stances: *Stone Stance: Traditional stance that uses fast and
    powerful strikes and stabs. Effective against swordsmen. *Water Stance: A one-handed stance that uses
    fluid and flowing flurry of strikes to overwhelm the enemy. Effective against shieldmen. *Wind Stance:
    A stance that utilizes spinning vertical strikes and powerful kicks, and allows easy parrying of spear
    attacks. Effective against spearmen. *Moon Stance: A stance that mixes powerful strikes, kicks, and
    fast continuous spinning strikes. Effective against brutes. Heavenly Strike -.gif Dance of Wrath.gif
    Way of the Flame.gif Explosive Arrow.gif Mythic Techniques: *Heavenly Strike: A quick attack that
    is widely considered unblockable due to its speed. Using it can lead to a nearby opponent getting
    hit by a lightning bolt with the Charm of Heavenly Rebuke. *Dance of Wrath: Three quick strikes starting
    with the sword sheathed, the strikes can be preceded by fast dashes. *Way of the Flame: Sets the blade
    on fire by rubbing it with special meteorite ore. Strong sword strikes spreads the flame to nearby
    enemies around Jin with the Charm of Blazing Flame. *Explosive Arrow: Shoots an explosive arrow from
    a bow. ==Gallery== Jin Sakai w.png Jin sakai p.png Jin sakai m.jpg ==Notable Matchups== Victories:
    Losses: Musashi Miyamoto (Vagabond) Musashi''s Profile (Both were 9-B, Jin had his entire arsenal)
    Scorpion (Mortal Kombat) Scorpion''s Profile (Both characters had 3 days of preparation, all equipment
    was allowed, and speed was equalized) Inconclusive: {{discussions}} Category:Characters Category:Ghost
    of Tsushima Category:Acrobats Category:Adults Category:Air Users Category:Animal Users Category:Blade
    Users Category:Bomb Users Category:Bow Users Category:Brawlers Category:Clairvoyance Users Category:Dart
    Users Category:Electricity Users Category:Enhanced Senses Users Category:Explosion Users Category:Fire
    Users Category:Flute Users Category:Game Characters Category:Good Characters Category:Grappling Users
    Category:Healers Category:Heroes Category:Honorable Characters Category:Hook Users Category:Humans
    Category:Information Analysis Users Category:Knife Users Category:Leaders Category:Light Users Category:Madness
    Users Category:Male Characters Category:Martial Artists Category:Ninjas Category:Perception Users
    Category:Poison Users Category:Power Mimicry Users Category:Preparation Users Category:Pressure Point
    Users Category:Primary Protagonists Category:Protagonists Category:Regeneration Users Category:Samurai
    Category:Smoke Users Category:Social Influencers Category:Sound Users Category:Stealth Masters Category:Supernatural
    Willpower Users Category:Sword Users Category:Thrown Weapon Users Category:Video Game Characters Category:Warriors
    Category:Weapon Masters Category:Weapon Users Category:Weather Users Category:Armor Users Category:Tragic
    Characters Category:Survivors Category:Prisoners Category:Antiheroes'
  source_ids: *id003
