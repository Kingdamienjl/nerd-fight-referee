      par with Kakine and protecting the bystanders.Toaru Majutsu no Index Volume 15 Chapter 5 Part 4
      Unknown with Platinum wings. Likely has tremendous amount of knowledge about the occult to an exponential
      degree via the third tree. Has access to all of Academy City's resources and databases with the
