  intelligence:
    text: Extraordinary Genius (His intellect exceeds a hundred supercomputers. Accelerator's esper ability
      has been shown to require complex calculations to function, with him being skilled enough in this
      field to come up with a new application on the fly during his battle against Touma. He also appears
      to have a very good memory, as he memorized the codes for Last Order's default mind state and was
      able to remotely return her to that condition, thus erasing the virus planted into her by Amai Ao.
      Later, he also starts to display well-thought out strategies in battle, like when he was able to
      take out the Hound Dogs using guns, which he utilized for the first time against them, along with
      exploiting his immediate environment and psychological tactics to his advantage, without using his
      esper ability. Even with less than half of his calculation ability,Toaru Majutsu no Index Volume
      8 Between the Lines 4 it is great enough to allow Accelerator to calculate and analyze all the 25,000
