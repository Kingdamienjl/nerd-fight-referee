- id: claim-powers-and-abilities-d9a0f004
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Teleportation, Electricity Manipulation, Levitation, Soul
    Manipulation, Telekinesis, Immortality (Types 6 and 7), Can swap bodies with others, Passive Durability
