    Category:Fighting Game Characters Category:Adults Category:Statistics Amplification Users Category:Regeneration
    Users Category:Durability Negation Users Category:Absorption Users Category:Ice Users Category:Temperature
    Users Category:Mind Users Category:Madness Users Category:Illusionists Category:Curse Users Category:Corruption
    Users Category:BFR Users Category:Space Users Category:Power Nullification Users Category:Unholy Users
    Category:Chaos Users Category:Blade Users Category:Weapon Users Category:Parents Category:Traitors
    Category:Murderers Category:Antagonists Category:Video Game Characters Category:Playable Characters
    Category:Game Bosses'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
