- id: claim-weaknesses-28c17eec
  section: weaknesses
  axis: weakness
  text: 'None Notable Notable Attacks/Techniques: *Divine Palladium: Sophitia slashes her opponent with
    her sword on their chest and then she jumps on them. Using them to launch herself spinning into the
    air, she swings her sword at her opponent, stunning them. She then gets into a praying position causing
    a flash of thunder to strike the opponent. *Jupiter Storm: Sophitia lowers her sword for a second
    and says "I cannot lose". Then she slowly raises her shield and sword, saying "Ah... Gods". Suddenly
    the opponent is hit twelve times by an invisible light force. There are some white sparkles and the
    fade rainbow light around Sophitia, and when she starts attacking she emits large circles of light.
    The enemy is surrounded by the light as well. Note: Many of Sophitia''s abilities comes from her various
    weapons. When used in battles, the creator should specify what weapon(s) she has access to during
    the fight. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Soul Calibur
    Category:Characters Category:Fighting Game Characters Category:Female Characters Category:Protagonists
    Category:Sword Users Category:Shield Users Category:Primary Protagonists Category:Tragic Characters
    Category:Warriors Category:Clairvoyance Users Category:Light Users Category:Holy Users Category:Electricity
    Users Category:Curse Users Category:Healers Category:Statistics Amplification Users Category:Fire
    Users Category:Durability Negation Users Category:Precognition Users Category:Regeneration Users Category:Weapon
    Masters Category:Soul Users Category:Weapon Users Category:Blade Users Category:Adults Category:Good
    Characters Category:Game Characters Category:Playable Characters Category:Heroes Category:Humans Category:Parents
    Category:Married Characters Category:Fantasy Characters Category:Video Game Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
