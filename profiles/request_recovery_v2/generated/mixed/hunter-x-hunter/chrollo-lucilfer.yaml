    a knife skillfully enough to tag Silva Zoldyck) *Social Influencing (Charisma & Deception - Chrollo
    is extraordinarily charismatic, and has the undying loyalty of Troupe members. Easily charmed Neon
    Nostrade. Is a highly skilled actor, successfully convincing the mafia that Neon had fallen unconscious
    for no reason) *Poison Manipulation (Chrollo claims his Ben's Knife contains poison so potent that
    0.1 mg is enough to paralyze a whale) *Preparation (Chrollo improves drastically if he prepares to
    his fights, like in his battle with Hisoka) *Power Absorption (Skill Hunter allows Chrollo to steal
    Nen abilities, while the victim is no longer able to use the stolen skill. Additionally, Double Face
    will enable Chrollo to use two Nen abilities simultaneously as he can close a page and still utilize
    the said ability. However, he must fulfill multiple difficult conditions making this unlikely to be
    usable in an unanticipated fight, especially against opponents of comparable or superior skill such
    as Hisoka or Zeno Zoldyck) |-|Stolen
