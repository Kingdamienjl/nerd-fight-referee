  tier:
    text: '{{8-A}}, up to {{Low 7-C}} with Ryu and Ko, possibly higher with some of the stolen Hatsu Name:
      Chrollo Lucilfer, ''Boss'' or ''Chief'' by the Phantom Troupe Origin: Hunter X Hunter Gender: Male
      Age: 26 (Debut) 28 (Currently) Classifications: Leader of the Phantom Troupe, Bandit, Nen User,
      Heaven''s Arena Floor Master, Human'
    source_ids: &id002
    - mediawiki-11300
    confidence: 0.95
  attack_potency:
    text: Multi-City Block level (He is the most powerful member of the Phantom Troupe. Defeated and nearly
      killed Hisoka in a fight, albeit Chrollo had an overwhelming advantage. Is capable of fighting both
      Zeno and Silva, and stalemated Silva in the past), up to Small Town level with Ryu and Ko, possibly
      higher with some of the stolen Hatsu (Much like his less powerful members, some of Chrollo's power-based
      Hatsu should be stronger than his Nen applications)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic+ with High Hypersonic reactions (Kept up with and dodged attacks from Zeno and Silva
      Zoldyck.HxH Chapter 98-99 Comparable to Hisoka in their duel and managed to dodge his max speed
      Bungee GumHxH Chapter 351)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 50 (Ranks 7th in arm-wrestling in the Troupe. Impressive since a Specialist has the lowest
      affinity for Enhancer qualities. Can throw adult males several meters with one arm)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level (His chop is capable of decapitating an average person. Killed highly
      skilled Nen users with a pen), up to Small Town level with Ryu and Ko, possibly higher with specific
      Hatsu
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level (Can block attacks from Zeno Zoldyck, survived an explosion created by
      Silva Zoldyck, and tanked a hit from Hisoka, who is much stronger than him physically), up to Small
      Town level with Ryu and Ko
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Chrollo's stamina is far, far superior to those who take the Hunter Exam, which
      involved strenuous and rigorous physical activities such as running 80 kilometers across different
      terrains. Was able to keep pace with Zeno and Silva, two of the deadliest assassins in the world,
      and fought and defeated Hisoka after an intense match)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range normally, Hundreds of Meters with Nen techniques
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius (Chrollo is extremely intelligent, resourceful, and charismatic. When he was young, he
      managed to learn 3 languages by himself as well as having the talent to dub different characters
      in a cartoon, much to the admiration of his peers and the meteor city elders. He is also natural-born
      leader, as most Troupe members are incredibly loyal to him and follow his orders without question.
      His plans usually go smoothly, and he has shown to be both knowledgeable and intuitive. He was able
      to trick the whole Yorknew City's mafia into thinking that he had died along with his comrades.
      He managed to predict part of the "Chain user's" strategy of vengeance, though Kurapika and Hisoka
      outsmarted him. He has complete dominion over his emotions, as demonstrated when captured by Kurapika,
      with Melody claiming that Chrollo had no fear of his demise and that he lived alongside death every
      day. In the fight against the Zoldycks, he focused on stealing Zeno's ability amid combat and leaving
      no openings to Silva to exploit, proving himself to be an efficient multitasker, which has brought
      the praise of both Silva and Zeno. Chrollo also plans ahead; he hires the remaining Zoldyck assassins
      to kill the people who paid Zeno and Silva to call off their mission, knowing he stands little to
      no chance if the two greatest assassins gang up on him)
    source_ids: *id002
    confidence: 0.95
