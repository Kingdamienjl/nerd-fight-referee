- id: claim-weaknesses-11552d87
  section: weaknesses
  axis: weakness
  text: 'Can be impulsive and reckless. | Same as before, Zetsu involves keeping one''s aura exclusively
    in the body; it makes a Nen user more vulnerable to physical and Nen attacks because one doesn''t
    have any aura on the outside of one''s body to protect oneself. Notable Attacks/Techniques: Nen: Leorio
    seems to be a proficient Nen User who was commended by Ging, one of the world''s most excellent Nen
    users. He should at least be able to use the four basic techniques. *Remote Punch: After striking
    an object in his vicinity, Leorio emits his aura in a line that travels along a surface from the point
    of impact to the desired location. A wormhole-like circle is generated from which a fist emerges to
    uppercut the target, stretching far beyond the length of an average arm. Ging mimicked this technique
    and showed that multiple punches could be emitted by striking a surface many times. However, it is
    unknown if Leorio can do the same. *Ultrasound: Through palpation, which means using one''s hands
    to examine the body, and tapping, Leorio can release his aura in pulses around an area like an ultrasound
    to detect other organisms within it or abnormalities in the human body. Ging praised this technique,
    as it is harder to identify than regular En. ==Gallery== Leorio_Design.jpg|Leorio''s design in the
    2011 anime adaptation. Leorio_Zoldyck_arc.jpg Leorio_and_Kurapika_-_Pride_of_the_clan.png|Leorio and
    Kurapika during the first phase of the Hunter Exam. "Leorio Punches Ging in the Face" ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== {{Reflist|2}} {{Discussions}} Category:Characters
    Category:Hunter X Hunter Category:Hunters Category:Male Characters Category:Protagonists Category:Chi
    Users Category:Knife Users Category:Teenagers Category:Manga Characters Category:Anime Characters
    Category:Good Characters Category:Humans Category:Aura Users Category:Fear Users Category:Paralysis
    Users Category:Death Users Category:Statistics Amplification Users Category:Invisibility Users Category:Stealth
    Masters Category:Body Control Users Category:Psychometry Users Category:Enhanced Senses Users Category:Intangibility
    Users Category:Longevity Users Category:Incorporeal Characters Category:Madness UsersCategory:Energy
    Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-493abe4f
  section: abilities
  axis: hax
  text: Base (Pre-Nen Training)=Superhuman Physical Characteristics, Proficient Hand-to-Hand Combatant
    (His combat skill exceeds that of Bodoro, a martial arts specialist, according to Netero), Weapon
    Mastery (Proficient Switchblade User), Accelerated Development (Leorio went from peak human to being
    able to push the first testing gate which weighs two tons for each door in barely two weeks, faster
    than both Gon and Kurapika. In 20 days, he managed to get through the second gate, which weighed four
    tons for each door. Leorio also learned some aspects of Nen in a short time, despite postponing his
    learning to attend medical school. Ging states Leorio has huge potential), Social Influencing (Leorio
    is a proficient haggler being able to save hundreds of thousands of jenny on buying the latest model
    of a mobile phone, drawing a crowd and earning applause. He was almost able to become the Chairman
    of the Hunter Association by wearing his heart on his sleeve even though he explicitly told the Hunters
    that he would use the organisation for his own purposes) |-|Base (Post-Nen Training)=Same as before
    on a far higher level, Nen Manipulation (Emitter; it is unknown if Leorio is fully trained in Nen,
    but since he has developed a unique Hatsu, with Ging stating he may have multiple, Leorio should at
    least know the four basic principles), Information Analysis and Extrasensory Perception (He can to
    produce an effect similar to ultrasound to analyse a patients body to discern what illness they have),
    Portal Creation (Leorio can emit his attacks to travel several metres and emerge from a wormhole-like
    black circle)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
