- id: claim-weaknesses-51571d19
  section: weaknesses
  axis: weakness
  text: "Zeno doesn't like collateral damage and becomes solemn if he harms or kills civilians. Zetsu\
    \ involves keeping one's aura exclusively in the body, it makes a Nen user more vulnerable to physical\
    \ and Nen attacks, because one doesn't have any aura on the outside of one's body to protect oneself.\
    \ Notable Attacks/Techniques: Nen: Zeno is one of the strongest human Nen users seen in the series,\
    \ and is able to use all the basic and advanced techniques. He is very proficient in Transmutation\
    \ and seems to be highly skilled in Enhancement being able to bear the brunt of Silva's Hatsu. Silva\
    \ also has high proficiency in Emission, because his aura constructs remain in existence several kilometers\
    \ away from him. He can also easily increase his En to 300 meters- in comparison, someone who can\
    \ do 50 meters is considered an En master. *Aura Blast: Zeno can fire a blast of aura from his open\
    \ palm powerful enough to knock back and lightly injure Chrollo Lucilfer while also breaking the ground\
    \ under his feet. *Dragon Head (\u9F8D\u982D\u622F\u753B\u30C9\u30E9\u30B4\u30F3\u30D8\u30C3\u30C9\
    \ Dragon-Head Caricature): Zeno can transmute his aura in the form of a dragon. The quantity of aura\
    \ poured into this technique is enormous. It can inflict light damage on a masterful Nen user, and\
    \ his dragon can continue to exist for an unspecified amount of time even after detaching from his\
    \ body, as demonstrated when he employed it to transport Netero and Meruem a great distance from the\
    \ palace. *Dragon Lance (\u7259\u7A81\u30C9\u30E9\u30B4\u30F3\u30E9\u30F3\u30B9 Abrupt Fang): A straight\
    \ shot of aura in the shape of a dragon. The dragon is connected to Zeno, who can control its movement\
    \ through precise motions of his hands. Due to the power of this technique and its flexibility, it\
    \ is perfect for attacking and keeping the opponent away at the same time. *Dragon Dive (\u9F8D\u661F\
    \u7FA4\u30C9\u30E9\u30B4\u30F3\u30C0\u30A4\u30D6 Wyvern Meteor Storm): Zeno shatters his Dragon Lance\
    \ in hundreds of smaller aura dragons that rain down from the sky. This technique can cover a vast\
    \ area more than three kilometres of damage, and each dragon can pierce through several layers of\
    \ rock and concrete before dispersing. Killua and the others theorised the attack could kill Knuckle\
    \ and Meleoron. ==Gallery== Zeno Zoldyck 2011 Design.jpg|Zeno's anime design 52 - Chrollo vs Zeno.gif|Zeno\
    \ fighting Chrollo File:Zeno beam - episode 52.png|Aura Blast DragonHead.png|Dragon Head DragonLance.png|Dragon\
    \ Lance Dragon Dive.png|Dragon Dive ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ {{Reflist}} {{discussions}} Category:Characters Category:Hunter X Hunter Category:Assassins Category:Male\
    \ Characters Category:Chi Users Category:Martial Artists Category:Anime Characters Category:Manga\
    \ Characters Category:Humans Category:Energy Users Category:Zoldyck Family Members Category:Parents\
    \ Category:Fear Users Category:Paralysis Users Category:Death Users Category:Body Control Users Category:Stealth\
    \ Masters Category:Invisibility Users Category:Statistics Amplification Users Category:Longevity Users\
    \ Category:Psychometry Users Category:Enhanced Senses Users Category:Madness Users Category:Non-Physical\
    \ Interaction Users Category:Intangibility Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
