- id: claim-powers-and-abilities-8f25b1f2
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Nen Manipulation (Manipulator; As a Royal Guard, Pouf''s
    aura output is one of the highest in the series. Colt believes Pouf''s raw power exceeds Isaac Netero''s.
    He can use all the basic and advanced techniques), Limited Immortality (Type 2, Chimera Ants can survive
    for a day after being decapitated), Flight, Proficient Hand-to-Hand Combatant, Enhanced Fear Manipulation
    and Madness Manipulation (Type 3; While in a neutral state of mind, Pouf''s En caused Knov to suffer
    a mental breakdown even though Knov hadn''t touched it; in another case Pouf''s mere approach was
    enough to cause Palm to go insane), Power Modification and Power Bestowal (Pouf can personally prepare
    an individual with a Nen ability that matches their talents and teach the individual how to use it.
    He did this for various Squadron Leaders: Leol, Cheetu, Welfin, Bloster and also to the Hunter Palm.
    He does this by enveloping the target in a cocoon. He planned on doing this to at least 50,000 soldiers),
    Biological Manipulation (The cocoon turns humans into Chimera Ant hybrids), Mind Manipulation, Empathic
    Manipulation, Limited Telepathy and Limited Death Manipulation (Pouf can read his opponents emotions,
    hypnotise them, and completely suppress their willpower. Pouf was seemingly able to read Pitou''s
    mind. He is also able to control millions of people. 46,613 people died within 24 hours of waking
    from Pouf''s hypnosis from bodily failure) with Spiritual Massage, Duplication and Size Manipulation
    (Pouf can split his body into miniature segments, and he can vary the size of each clone. At their
    smallest the clones are atomic size and he can split up into one hundred trillion clones) Regeneration
    (High-Mid for the Core. Shaiapouf''s core which is the size of a Bee must be destroyed to kill him.
    High for his Clones; Pouf''s clones must be destroyed at the atomic level otherwise they will be able
    to reform continuously), Small Size (Type 2 for the Core which can shrink to the size of a Bee; Type
    5 for his Clones which can split up to be nano-size) with Beelzebub, Shapeshifting (Pouf can alter
    his face, physique, and even his voice) with Body Reconstruction, Resistance to Poison Manipulation
    (Resisted the effects of the Poor Man''s Rose for a time but ultimately succumbed)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
