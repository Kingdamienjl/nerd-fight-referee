- id: claim-weaknesses-754b584d
  section: weaknesses
  axis: weakness
  text: "His judgement is clouded by his love for the King, and is highly prone to overthinking. Spiritual\
    \ Massage can be countered with a strong enough air current. For Beelzebub, any clone smaller than\
    \ a fly loses their sight, the clones are far less durable, and their regeneration can be negated\
    \ by targeting their cells. If Shaiapouf's clones are killed then he permanently loses power. Notable\
    \ Attacks/Techniques: Nen: As a Royal Guard, Shaiapouf is one of the most powerful Manipulators in\
    \ the series being able to manipulate millions of people at a time. He can use all the basic and advanced\
    \ techniques. He is also proficient in various Nen categories. *Cocoon: Shaiapouf has the faculty\
    \ to bestow Nen abilities on others. He does so by enveloping them in a cocoon in which they lie,\
    \ unconscious, until the process is complete. Leol obtained his ability in three days due to being\
    \ a \"slow learner\", and claimed it is possible to learn one in only 24 hours. Subjects with intact\
    \ memories regenerate from the cocoons more quickly. Shaiapouf was capable of creating more than 5,000\
    \ cocoons for the survivors of the selection, although he was originally expected to generate ten\
    \ times as many, with the twofold purpose of increasing the quality of Meruem's food and creating\
    \ a loyal army of Nen users. When used on humans, the cocoon has the additional effect of turning\
    \ them into human-Chimera Ant hybrids, creating a whole new species. With Neferpitou's assistance,\
    \ Palm was made into an experimental soldier with all her memories, but no emotions associated to\
    \ them, due to the emotional charge of recollections affecting the process of learning Nen in unpredictable\
    \ ways. This would have allowed the Royal Guard to insert Nen-using hybrids into human society to\
    \ erode it from within, although the experiment was eventually deemed a failure. *Spiritual Message\
    \ (\u9C57\u7C89\u4E43\u611B\u6CC9 Butterfly Scales Love Spring): Shaiapouf's ability, Spiritual Message,\
    \ allows him to use his scales as a specialized En. Through their dispersal, he can read his opponent's\
    \ emotions through the fluctuations in their aura. Shaiapouf used Spiritual Message in order to determine\
    \ the best Nen abilities suited to Squadron Leader Chimera Ants, thereafter teaching them how to develop\
    \ their own Hatsu. His scales also have a hypnotic effect to those exposed to it. The extent of hypnosis\
    \ is not fully demonstrated. However, it is effective enough to make average citizens lose their will.\
    \ *Beelzebub (\u8805\u306E\u738B King of the Flies): Shaiapouf's second ability allows him to break\
    \ his body into multiple miniature forms of himself. He can vary the size of each body; the smaller\
    \ they are, the more he creates. Pouf can control them through his main form, which can only be reduced\
    \ to about the size of a bee. Since he has control over every single cell in his body, he can easily\
    \ recreate his clones if they are destroyed; however, if the cells themselves are damaged, he is powerless\
    \ to restore them, resulting in damage to his body when the ability is disengaged. Shaiapouf can also\
    \ create a normal-sized clone with enough cells, although it is unable to spread the hypnotic scales\
    \ and its overall power is much lower than that of the original. *Body Reconstruction: Shaiapouf can\
    \ split his body at cellular level making it possible for him to reconstruct his body to look like\
    \ someone else. He can reconstruct his face, physique and even his voice. This ability can also be\
    \ used for healing purposes: by feeding someone else his own cells, he can heal their injuries, even\
    \ potentially lethal ones. However, it is unclear if it would work on someone without special assimilation\
    \ abilities. ==Gallery== Hunter-X-Hunter---91---Large-152.jpg|Shaiapouf with his opened wings. Shaiapouf's\
    \ strength.gif|Shaiapouf's strength SpiritualMessage.png|Spiritual Message 125 - Shaiapouf Beelzebub.png|Beelzebub\
    \ 130 - Shaiapouf as Komugi.png|Body Reconstruction 114 - Shaiapouf cocoon.png|Pouf in his cocoon\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}} Category:Characters Category:Hunter\
    \ X Hunter Category:Manga Characters Category:Anime Characters Category:Male Characters Category:Loyal\
    \ Characters Category:Musicians Category:Antagonists Category:Hybrids Category:Monsters Category:Chimera\
    \ Ants Category:Chi Users Category:Extrasensory Perception Users Category:Martial Artists Category:Mind\
    \ Users Category:Shapeshifters Category:Size Users Category:Duplication Users Category:Aura Users\
    \ Category:Fear Users Category:Paralysis Users Category:Death Users Category:Body Control Users Category:Stealth\
    \ Masters Category:Invisibility Users Category:Longevity Users Category:Psychometry Users Category:Non-Physical\
    \ Interaction Users Category:Madness Users Category:Intangibility UsersCategory:Energy Users Category:Evil\
    \ Characters Category:Supervillains Category:Villains Category:Murderers"
