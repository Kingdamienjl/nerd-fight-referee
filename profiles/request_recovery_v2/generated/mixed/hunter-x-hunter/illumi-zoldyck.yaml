- id: claim-powers-and-abilities-60fd1020
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulation (Manipulator; Illumi is regarded as an extraordinary
    Nen user and Manipulator with a sinister aura which can be felt from several hundred metres away.
    Should a victim survive having Illumi's aura injected into them they will instantly be crippled for
    life), Master Hand-to-Hand Combatant (His fighting skills are comparable to Hisoka's, and as a member
    of the infamous Zoldyck family he is one of the greatest assassins in the world), Expert Marksman
    (Illumi can throw his multiple needles with high accuracy), Stealth Mastery (As a Zoldyck Assassin
    he is a master at stealth even without Zetsu), Afterimage Creation (Should know Rhythm Echo), Acupuncture
    and Pain Manipulation (Illumi's primary weapon are his needles which he uses to kill or distort ones
    features causing intense, agonizing pain), Body Control (Illumi can force his body to sleep for five
    days straight) and Shapeshifting (Illumi can change his appearance for five or more hours, indefinitely
    by putting needles in his head), Mind Manipulation (Illumi can embed a special needle into a person's
    head. The needle forces targets to obey his commands and conditioning immediately should the victim
    attempt to go against Illumi's order. His other needles can completely control a person. The victims
    lose all sentience and will follow Illumi's rule until death. Should a Needleman survive, they are
    instantly crippled for life), Body Puppetry (Illumi can control corpses with his needles. The victims
    can perform complex actions such as speaking and driving but have no sentience), Immense Pain Tolerance
    (Did not flinch when Gon broke his arm and showed no signs of distress afterwards. Was likely through
    the same kind of torture as Killua. He also shows no signs of distress from having his needles in
    his face although he does state it causes him pain as well), Resistance to Electricity Manipulation
    and Poison Manipulation (Due to his rigorous and brutal training, he should exhibit the same resistance
    to electricity and poison like his brother Killua)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
