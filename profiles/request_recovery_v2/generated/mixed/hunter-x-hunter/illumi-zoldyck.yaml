- id: claim-weaknesses-c290e059
  section: weaknesses
  axis: weakness
  text: "Overly possessive of Killua, he is highly dedicated to protecting and controlling his beloved\
    \ younger brother. Zetsu involves keeping one's aura exclusively in the body. It makes a nen user\
    \ more vulnerable to physical, and nen attacks because one doesn't have any aura on the outside of\
    \ one's body to protect oneself. Notable Attacks/Techniques: Nen: Illumi is a powerful Nen user and\
    \ should be able to use all the basic and advanced techniques *Disguise: Illumi uses large, round\
    \ head needles to alter the shape of his own body and skin color. Removing the needles will cause\
    \ him to revert to his original appearance. According to him, the transformation is quite painful.\
    \ He can also change his appearance without needles, but in this case, he can maintain the disguise\
    \ for around five hours, and his eyes remain the same. He can use this ability to infiltrate into\
    \ places where his targets may reside, as shown when he fooled the Phantom Troupe into thinking he\
    \ was Hisoka after switching places with him in the Phantom Troupe's hideout. *Hypnotic Spell: By\
    \ placing a needle into the target's brain, Illumi can hypnotize them into following his orders as\
    \ long as the needle remains embedded. The ability automatically activates every time the victim intends\
    \ to do something against Illumi\u2019s rules. In Killua\u2019s case, the activation triggered a crushing\
    \ fear, which he associated with Illumi, and varying degrees of paralysis depending on the level of\
    \ opposition. Though powerful, the ability is also subtle, leading the victim to think that the commands\
    \ they receive are their own ideas or a result of their habits. Willpower alone is not sufficient\
    \ to break free from the hypnosis; however, through resisting it, the victim suffers headaches that\
    \ grow increasingly localized, making it possible to detect, locate, and remove the needle. Not even\
    \ Isaac Netero, who used to be considered the best Nen user in the world, was able to detect the effect\
    \ of the needle in Killua's head. *Corpse Control: By piercing their head with multiple needles, Illumi\
    \ can manipulate many targets, including the deceased, to an unknown extent. As corpses, the victims\
    \ have no will or reflexes of their own. With this ability, Illumi manipulated one of the Ten Dons\
    \ to lead the mafia community into thinking the boss of the Phantom Troupe had been killed. *Needlemen\
    \ (\u91DD\u4EBA\u9593 Hariningen): Illumi throws special needles imbued with his aura into the skulls\
    \ of a person to manipulate their actions. Whoever is pierced with Illumi's needles becomes one of\
    \ his Needlemen and loses all sentience--following orders until death. Even if Needlemen survives,\
    \ they will be permanently disabled. ==Gallery== Illumi Zoldyck 2011 Design 1.jpg|Illumi's anime design\
    \ 15 - Gittarackur transformation.gif|Body Alteration Illumi Disguised As Hisoka.png|Illumi disguised\
    \ as Hisoka Illumi's entry as his Gittarackur disguise.png|Disguise IllumiHypnoticSpell.jpg|Hypnotic\
    \ Spell Ep. 53 (2011) - Corpse control.png|Corpse Control Illumi and Needlemen.png|Needlemen ==Notable\
    \ Matchups== Victories: Losses: Hisoka Morow (Hunter x Hunter) Hisoka\u2019s Profile Inconclusive:\
    \ {{Discussions}} Category:Characters Category:Hunter X Hunter Category:Male Characters Category:Chi\
    \ Users Category:Assassins Category:Energy Users Category:Hunters Category:Manga Characters Category:Anime\
    \ Characters Category:Martial Artists Category:Mind Users Category:Humans Category:Zoldyck Family\
    \ Members Category:Phantom Troupe Members Category:Needle Users Category:Adults Category:Fear Users\
    \ Category:Death Users Category:Psychometry Users Category:Paralysis Users Category:Invisibility Users\
    \ Category:Stealth Masters Category:Body Control Users Category:Statistics Amplification Users Category:Longevity\
    \ Users Category:Madness Users Category:Non-Physical Interaction Users Category:Intangibility Users\
    \ Category:Antagonists Category:Evil Characters Category:Murderers Category:Thieves Category:Terrorists\
    \ Category:Villains Category:Serial Killers Category:Supervillains"
  source_ids: *id003
