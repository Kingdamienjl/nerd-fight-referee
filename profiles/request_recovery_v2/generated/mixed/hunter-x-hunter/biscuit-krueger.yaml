- id: claim-weaknesses-43c0d609
  section: weaknesses
  axis: weakness
  text: "Biscuit's transformed form is much weaker and slower than her original form. Zetsu involves keeping\
    \ one's aura exclusively in the body, it makes a Nen user more vulnerable to physical and Nen attacks,\
    \ because one doesn't have any aura on the outside of one's body to protect oneself. Notable Attacks/Techniques:\
    \ Nen: Biscuit is a very skilled Nen User being able to use all the basic and advanced techniques\
    \ *Magical Esthetician (\u9B54\u6CD5\u7F8E\u5BB9\u5E2B\u30DE\u30B8\u30AB\u30EB\u30A8\u30B9\u30C6 Magical\
    \ Beautician): Biscuit summons a masseuse she calls Cookie (\u30AF\u30C3\u30AD\u30FC, Kukkii) which\
    \ uses different massaging techniques and a Nen-transmuted lotion to relieve fatigue and restore vitality\
    \ to anyone it massages. It can also burn off excess fat and cure arthritis, muscle tension and locked\
    \ joints. It is particularly useful for training/recovery purposes and to treat aging ailments. This\
    \ ability is a mixture of Emission, Manipulation, and Transmutation. Although only one massage has\
    \ been shown so far, according to Biscuit, there are a lot more, some of which are cartilage massage,\
    \ head massage, and roll massage. **Piano Massage (\u6843\u8272\u30D4\u30A2\u30CE\u5410\u606F\u30DE\
    \u30C3\u30B5\u30FC\u30B8 Peachy Relief): With this, 30 minutes of sleep will be equivalent to eight\
    \ hours. Cookie emits aura from her hands while massaging. *Body Transmutation - Biscuit is capable\
    \ of changing her appearance to look younger and less rippled. She can switch back to her original\
    \ form at will, restoring great height, weight, and reach advantages over her opponents. Although\
    \ this also makes her a larger target, so far, she has been able to overpower her enemies without\
    \ suffering any injury. ==Gallery== Bisky G.I Design (2011 Anime).png|Biscuit's anime design Biscuit\
    \ Nen 2011.png|Magical Esthetician Biscuit Piano Massage.png|Piano Massage Biscuit ko 2011.png|Biscuit\
    \ demonstrating Ko ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}} Category:Fear\
    \ Users Category:Paralysis Users Category:Death Users Category:Stealth Masters Category:Body Control\
    \ Users Category:Psychometry Users Category:Enhanced Senses Users Category:Aura Users Category:Statistics\
    \ Amplification Users Category:Hunter X Hunter Category:Hunters Category:Characters Category:Female\
    \ Characters Category:Protagonists Category:Humans Category:Manga Characters Category:Anime Characters\
    \ Category:Brawlers Category:Transformation Users Category:Summoners Category:Chi Users Category:Longevity\
    \ Users Category:Energy Users Category:Madness Users Category:Non-Physical Interaction Users Category:Intangibility\
    \ Users Category:Medicine Users Category:Adults"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
