power_scale:
  tier:
    text: At least {{8-B}}, up to {{8-A}} with Ryu and Ko | {{8-A}}, up to {{Low 7-C}} with Ryu and Ko
    source_ids: &id002
    - mediawiki-513082
    confidence: 0.95
  attack_potency:
    text: At least City Block level (Even in this vastly weakened form, Biscuit is capable of throwing
      a ball with enough force that Razor's Nen beast was incapable of catching it. Killua acknowledges
      and fears her strength), up to Multi-City Block level with Ryu and Ko (While a regular punch from
      a Nen User uses about 10% of one's aura, Ko uses 100%, thus, being 10 times more potent. With Ryu,
      one can adjust the amount of aura your attacks carry, keeping the rest to the body itself) | Multi-City
      Block level (Is one of the strongest Hunters in the entire association, and should be superior to
      the likes of Morel Mackernasey and Kite), up to Small Town level with Ryu and Ko
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Supersonic+ (Far superior to Gon and Killua, and slapped the latter so fast that he did not
      notice he was slapped until he felt pain. Dodged a throw from Razor, only being disqualified because
      of her large clothing) | Hypersonic with Hypersonic+ reactions (Should be faster than before)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 25 (Her physical strength is superior to Killua Zoldyck's) | Class 100 (Far stronger
      in this form, has 5/5 physical stats in the official databook, and is one of the most powerful hunters
      in the association)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least City Block level, up to Multi-City Block level with Ryu and Ko (A single strike to
      Binolt's back caused him to vomit large amounts of blood and Biscuit stated she wasn't using Nen)
      | Multi-City Block level (One-shot Bara and crushed his face), up to Small Town level with Ryu and
      Ko
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least City Block level (Unaffected by a hit from Bara), up to Multi-City Block level with
      Ryu and Ko | Multi-City Block level (Should be far more durable in this form, and comparable to
      her attack potency), up to Small Town level with Ryu and Ko
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Biscuit watched over Gon and Killua for weeks straight without sleeping. She was
      able to run 70&nbsp;km in 3 hours and, after a brief pause, that same distance in 2 hours and a
      half without breaking a sweat, whereas Gon and Killua were both winded after the second trip)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius (Biscuit is highly intelligent, analytic and knowledgeable, especially regarding Nen.
      As a Double-Star Hunter, Biscuit must have made significant breakthroughs in her field of study,
      and in the Hunter's Association, is held in high esteem. A consummate liar, she has developed the
      ability to tell when someone is hiding something, even if that person is Hisoka, and she uses her
      youthful appearances to trick her opponents into underestimating her. She has an unwavering strength
      of mind and confidence, which allows her to never hesitate during a fight. She was capable of easily
      deducing the weaknesses of the beasts of Greed Island. Thanks also to her experience, she is a praiseworthy
      tactician, her predictions often proving accurate. Biscuit is also an excellent teacher, as Gon
      and Killua grew in strength and Nen abilities tremendously and in a short time thanks to her training.
      She can devise tailored training methods depending on the receiver, the environment and the resources
      at hand. Hisoka acknowledged her abilities in this field. According to herself, Biscuit can double
      or triple the physical strength of a talented beginner within one month)
    source_ids: *id002
    confidence: 0.95
