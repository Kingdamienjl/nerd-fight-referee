- id: claim-weaknesses-1fc1a091
  section: weaknesses
  axis: weakness
  text: "Feitan rarely fights at full strength. Pain Packer requires damage to be dealt to Feitan. Zetsu\
    \ involves keeping one's aura exclusively in the body, it makes a Nen user more vulnerable to physical\
    \ and Nen attacks, because one doesn't have any aura on the outside of one's body to protect oneself.\
    \ Notable Attacks/Techniques: Nen: Feitan is a powerful Nen User being able to use all the basic and\
    \ advanced techniques *Pain Packer (\u8A31\u3055\u308C\u3056\u308B\u8005\u30D1\u30A4\u30F3\u30D1\u30C3\
    \u30AB\u30FC Unforgiven): Activated by Feitan's rage; he seemingly only uses it when angered. Phinks\
    \ implies that there are numerous forms of Pain Packer. Feitan uses his aura to conjure a protective\
    \ armor around himself. This armor can completely protect him from the effects of the following technique.\
    \ tumblr mtjgsnGW5B1rmpk94o2 400.gif b166aefd627724071f4068408ed8ec9927f44c4a hq.gif *Rising Sun (\u592A\
    \u967D\u306B\u707C\u304B\u308C\u3066\u30E9\u30A4\u30B8\u30F3\u30B0\u30B5\u30F3 Burnt by the Sun):\
    \ Feitan transmutes his aura into scorching heat, its power depending on the pain and injuries inflicted\
    \ to him in battle. The ability is manifested through emitting a ball of aura into the air, which\
    \ then transforms into a miniature sun that burns the victim to death; the more damage received, the\
    \ hotter the fire, and the longer it will burn. 9172827f50000366909347a8914af8cdf77146a4 hq.gif Feitan's\
    \ rising sun.gif ==Gallery== Genei fei.jpg|Anime design. PainpackeR.png|Pain Packer armor Feitan vs\
    \ Zazan.gif|Feitan fighting Zazan Feitan aura.jpg|Feitan unleashing his aura Feitan Pain Packer-1.jpg|Pain\
    \ Packer (Unnamed form) Rising Sun-1.jpg|Rising Sun ==Notable Matchups== Victories: Losses: Gruntilda\
    \ (Banjo-Kazooie) Gruntilda's Profile (Both were 8-A and speed was equalized. Both had prior knowledge\
    \ of each other and anything above 8-A was restricted) Inconclusive: {{Discussions}} Category:Characters\
    \ Category:Hunter X Hunter Category:Manga Characters Category:Anime Characters Category:Fire Users\
    \ Category:Chi Users Category:Energy Users Category:Male Characters Category:Sadists Category:Sword\
    \ Users Category:Thieves Category:Leaders Category:Weapon Masters Category:Humans Category:Aura Users\
    \ Category:Martial Artists Category:Gun Users Category:Adults Category:Psychopaths Category:Afterimage\
    \ Users Category:Phantom Troupe Members Category:Parasol Users Category:Fear Users Category:Paralysis\
    \ Users Category:Death Users Category:Stealth Masters Category:Body Control Users Category:Invisibility\
    \ Users Category:Statistics Amplification Users Category:Psychometry Users Category:Enhanced Senses\
    \ Users Category:Longevity Users Category:Madness Users Category:Non-Physical Interaction Users Category:Intangibility\
    \ Users Category:Evil Characters Category:Murderers Category:Terrorists Category:Villains Category:Serial\
    \ Killers Category:Supervillains"
  source_ids: *id003
  decisive: false
