- id: claim-powers-and-abilities-82743566
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Nen Manipulation (Transmuter;Exhibition: Togashi Yoshihiro
    -Puzzle- As a Royal Guard, Youpi was born with the ability to use Nen, and is one of the strongest
    Nen users in the series), Empowerment (Youpi''s Hatsu revolves around manipulating his immense rage.
    As he becomes angrier his power grows), Proficient Hand-to-Hand Combatant (Defeated members of the
    Extermination Squad, all of whom are highly skilled Nen users and fighters), Flight (Youpi can grow
    wings), Limited Immortality (Type 2, Chimera Ants can survive for a day after being decapitated),
    Transformation, Shapeshifting, Body Control, Additional Limbs and Weapon Creation (Youpi''s primary
    ability is to freely control any part of his body. He can change his shape at will, ranging from growing
    multiple eyes and arms to becoming a centaur-like creature, he can create various weapons out of himself),
    Berserk Mode (Under extreme stress, Youpi will enter a state where his body is engorged with rage),
    Rage Power (Youpi''s body grows as his rage grows) and Self-Destruction (As his anger reaches its
    peak, Youpi ultimately releases an explosion powerful enough to leave gigantic craters), Enhanced
    Madness Manipulation (Type 3; As a Royal Guard, his aura should be comparable to Neferpitou and Shaiapouf,
    and both have caused mental breakdowns with aura alone) and Fear Manipulation (His show of Ren should
    yield the same effects as Neferpitou''s Ren), Resistance to Magma Manipulation (Walked into the crater
    left by the Poor Man''s Rose and was completely unharmed), Electricity Manipulation (While stunned,
    Killua''s attacks in Kanmuru dealt no damage) and Poison Manipulation (Resisted the effects of the
    Poor Man''s Rose for a time but ultimately succumbed)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
