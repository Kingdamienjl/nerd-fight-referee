- id: claim-weaknesses-0891a772
  section: weaknesses
  axis: weakness
  text: 'He is easily provoked and is easy to outwit. Is fiercely loyal to Meruem and is willing to die
    for him. After donating most of his cells to Meruem, he is forced into a much smaller form and is
    vastly weakened in this state. Zetsu involves keeping one''s aura exclusively in the body, it makes
    a nen user more vulnerable to physical, and nen attacks, because one doesn''t have any aura on the
    outside of one''s body to protect oneself. Notable Attacks/Techniques: Nen: As a Royal Guard, Youpi
    is one of the most powerful Nen Users in the series having more raw aura than a Rusty Isaac Netero.
    He can use all the basic and advanced techniques. *Metamorphosis: Menthuthuyoupi''s primary ability
    allows him to shapeshift into anything he desires, using his enormous amount of aura. Through this,
    Youpi can give himself wings, extra eyes, and limbs, transmute his body parts into blade-like tendrils
    and even recompose his entire body structure. *Rage Blast: Under extreme mental stress during the
    Extermination Team''s raid, Menthuthuyoupi discovers this ability. Youpi''s body and En are engorged
    with his furious rage until unleashed with an incredibly destructive explosion. The ability results
    in great pleasure for Youpi, followed by empty despair. He realizes that, through controlling his
    emotions, he can control the timing and release of the explosion. *Rage Incarnate: Youpi can also
    transform his entire body into a grotesque, centaur-like creature by unleashing his fury calmly and
    manifesting that energy throughout his body. This form bears a helm-like extension on his head, a
    powerful scythe on his right arm, and a sizeable amoebic sac in place of his left arm that contains
    his rage. ==Gallery== Youpi -113.png|Close-up of Youpi Metamorphosis 2011.png|Metamorphosis Rage Blast
    animated.png|Rage Blast Youpi Rage Incarnate.png|Rage Incarnate Menthuthuyoupi''s strength.gif|Youpi''s
    immense strength ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Reflist}}
    {{Discussions}} Category:Characters Category:Hunter X Hunter Category:Male Characters Category:Manga
    Characters Category:Anime Characters Category:Antagonists Category:Hybrids Category:Monsters Category:Chi
    Users Category:Martial Artists Category:Fire Users Category:Energy Users Category:Transformation Users
    Category:Berserkers Category:Loyal Characters Category:Chimera Ants Category:Self-Destruction Users
    Category:Fear Users Category:Paralysis Users Category:Death Users Category:Body Control Users Category:Stealth
    Masters Category:Invisibility Users Category:Statistics Amplification Users Category:Psychometry Users
    Category:Longevity Users Category:Non-Physical Interaction Users Category:Aura Users Category:Intangibility
    Users Category:Madness Users Category:Additional Limbs Users Category:Evil Characters Category:Supervillains
    Category:Villains Category:Murderers'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
