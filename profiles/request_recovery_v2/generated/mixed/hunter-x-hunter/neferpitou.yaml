    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range, Kilometers with Nen Techniques, higher with Intuition
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Likely Genius (Neferpitou is very good at analysing people and reading their feelings, and can
