- id: claim-weaknesses-17e8a84b
  section: weaknesses
  axis: weakness
  text: "Pitou can only use Ten while Doctor Blythe is active as it requires a lot of Nen, and they cannot\
    \ move beyond twenty meters as it's connected to their tail. Their puppets are not very strong and\
    \ are easily predictable. Is fiercely loyal to Meruem and is willing to die for him. Zetsu involves\
    \ keeping one's aura exclusively in the body, it makes a Nen user more vulnerable to physical, and\
    \ Nen attacks, because one doesn't have any aura on the outside of one's body to protect oneself.\
    \ Notable Attacks/Techniques: Nen: As a Royal Guard, Pitou is one of the most powerful Nen Users in\
    \ the series, having more aura than a Rusty Isaac Netero. Pitou can use all the basic and advanced\
    \ techniques and is also a Specialist. Pitou could create Hatsu on a whim when desired. Pitou's Hatsu\
    \ are based around puppets. *Terpsichora (\u9ED2\u5B50\u821E\u60F3\u30C6\u30EC\u30D7\u30B7\u30B3\u30FC\
    \u30E9 Puppet Master's Serenity): Terpsichora is a puppeteer conjured by Neferpitou (and hidden using\
    \ In) to manipulate their own body. With this all their stats are increased, flexibility, agility,\
    \ enhancing, speed, and automatic reflexes. Even after death, Neferpitou can keep fighting with this\
    \ ability and in fact, is stronger. It also takes less than 0.1 secondsHunter x Hunter: Chapter 264\
    \ after activation to attack. *Doctor Blythe (\u73A9\u5177\u4FEE\u7406\u8005\u30C9\u30AF\u30BF\u30FC\
    \u30D6\u30E9\u30A4\u30B9 Toy Repair): A giant doll conjured by Neferpitou, used only to heal himself\
    \ for any damaged areas of the body. It cannot move from the position which is initially summoned\
    \ and is connected to Pitou's tail, limiting their radius of movement to 20 meters while the ability\
    \ is active, thanks to this limit it can stop being pushed away from attacks. *Puppeteering: Neferpitou\
    \ can simultaneously control large numbers of bodies and give it simple directives. Those puppets\
    \ are hidden with In, and if one being manipulated can use Nen, then those abilities can be ordered\
    \ to be used as well. ==Gallery== Neferpitou appearence 2011.jpg|Neferpitou's anime design Neferpitou's\
    \ aura.gif|Neferpitou's terrorizing aura Neferpitou's agility.gif|Neferpitou's immense agility Pitou\
    \ EN.png|Pitou's En Neferpitou Terpsichora.gif|Activating Terpsichora against Isaac Netero Terpsichora2011.png|Terpsichora\
    \ Doctor Blythe 2011.png|Doctor Blythe Puppeteering 2011.png|Puppeteering 131 - Pitou attacks Gon.png|Pitou's\
    \ corpse mutilating Gon ==Notable Matchups== Victories: Losses: Inconclusive ==References== {{reflist}}\
    \ {{discussions}} Category:Characters Category:Hunter X Hunter Category:Anime Characters Category:Antagonists\
    \ Category:Aura Users Category:Body Control Users Category:Body Puppetry Users Category:Cats Category:Chi\
    \ Users Category:Chimera Ants Category:Death Users Category:Doll Users Category:Enhanced Senses Users\
    \ Category:Evil Characters Category:Extrasensory Perception Users Category:Fear Users Category:Healers\
    \ Category:Hybrids Category:Immortals Category:Intangibility Users Category:Invisibility Users Category:Loyal\
    \ Characters Category:Madness Users Category:Manga Characters Category:Martial Artists Category:Mind\
    \ Users Category:Monsters Category:Non-Physical Interaction Users Category:Paralysis Users Category:Psychometry\
    \ Users Category:Statistics Amplification Users Category:Stealth Masters Category:Honorable CharactersCategory:Energy\
    \ Users Category:Murderers Category:Supervillains Category:Villains"
  source_ids: *id003
