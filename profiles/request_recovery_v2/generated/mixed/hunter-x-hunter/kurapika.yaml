  intelligence:
    text: At least Gifted, likely Genius (Kurapika is one of the most brilliant characters in the series.
      Because of this, he was appointed the leader of Neon's bodyguards after the demise of Dalzollene.
      He outsmarted Chrollo with carefully planned strategies, and his predictions have rarely turned
      out to be wrong. He also has immense knowledge about many topics, ranging from psychology to other
      cultures, from history to forensic. This quality surprised even adults when he was only a child.
      Due to his longing for new notions, he is a fast learner with a remarkable memory. Kurapika's analytical
      skills are so outstanding that they have led to the rumor that he can read minds. When searching
      for Halkenburg on the Kakin bodyguard registration, he used the vaguest of clues to choose whom
      he felt to be Halkenburg, something praised by Oito. Kurapika can formulate flawless plans even
      in combat to exploit his opponent's weaknesses to the fullest. His logical thinking and meticulous
      preparations match his intuition. Although he can retain his calm in desperate situations, he can
      barely stick to his plan when it concerns the Phantom Troupe, to the extent he might even snap and
      endanger not only himself but his friends as well. On the Black Whale, he exhibited better composure
      than before and has performed his greatest strategic feat yet, becoming the lynchpin of a stalemate,
      or at least an impediment, of the succession contest with an endless series of ad hoc tactics, mixing
      truth and lies, secrets and deliberately disclosed information. His disclosure of the existence
      of Nen on the very first day of voyage constituted the biggest game-changer of the succession contest,
      ruining the plans of several camps, delaying murders, and increasing the chances of the lower-ranked
      princes to reach an impasse)
    source_ids: *id002
    confidence: 0.95
