    contest with an endless series of ad hoc tactics, mixing truth and lies, secrets and deliberately
    disclosed information. His disclosure of the existence of Nen on the very first day of voyage constituted
    the biggest game-changer of the succession contest, ruining the plans of several camps, delaying murders,
    and increasing the chances of the lower-ranked princes to reach an impasse)
