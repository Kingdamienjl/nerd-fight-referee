- id: claim-weaknesses-03486c58
  section: weaknesses
  axis: weakness
  text: "Chain Jail, one of Kurapika's two most notable and potent techniques, is only effective against\
    \ Phantom Troupe members. If used on another person, he will die. The other one, Judgment Chain, can\
    \ be used only when his eyes are scarlet. His Scarlet Eyes may have a negative impact on his health.\
    \ Perhaps his greatest flaw is that every second he remains in Scarlet Eyes state, he loses an hour\
    \ of his lifespan. Additionally, he became incapacitated and feverish for more than a day, despite\
    \ Melody's Nen ability successfully lowering his body temperature. Zetsu involves keeping one's aura\
    \ exclusively in the body; it makes a Nen user more vulnerable to physical and Nen attacks, because\
    \ one doesn't have any aura on the outside of one's body to protect oneself. Notable Attacks/Techniques:\
    \ Nen: Kurapika is a Conjurer, a Nen user that can create objects out of thin air according to his\
    \ imagination, but he becomes Specialist when his eyes turn red. Kurapika is also proficient in all\
    \ the other branches on Nen. *{{Nihongo|Emperor Time|{{Ruby|\u7D76\u5BFE\u6642\u9593|\u30A8\u30F3\u30DA\
    \u30E9\u30FC\u30BF\u30A4\u30E0}}|Absolute Time}}: When Kurapika's eyes shift into scarlet, he changes\
    \ from a Conjurer to a Specialist: **During Emperor Time, Kurapika can utilize all the types of Nen\
    \ to 100% efficiency (for a Conjurer); he explains this using the terms \"Level, Force, and Accuracy\"\
    \ \u2014 his \"Levels\" in the various Nen categories remain the same, but his \"Force\" and \"Accuracy\"\
    \ for every category are raised to 100%. Thus, if Kurapika's Level in Conjuration were 10, his Level\
    \ in Emission (the polar opposite aura type) would be 4. During Emperor Time, he would be evenly matched\
    \ against a Level 4 Emitter at 100%. Outside of Emperor Time, his Force and Accuracy in Emission would,\
    \ at most, only be 40%. *Conjured Chains: A unique set conjured weapons \u2014 five chains that extend\
    \ from each finger on his right hand. Since the chains are materialized, they can be lengthened and\
    \ swelled to a certain degree. Each chain has its unique function: healing, binding, or more. **{{Nihongo|Holy\
    \ Chain|{{Ruby|\u7652\u3059\u89AA\u6307\u306E\u9396|\u30DB\u30FC\u30EA\u30FC\u30C1\u30A7\u30FC\u30F3\
    }}|The Healing Thumb Chain}}: Shaped like a cross, it cures wounds by drawing from Enhancement abilities.\
    \ When Kurapika is in his Specialist state, it can heal serious injuries, such as a fractured arm\
    \ in seconds. **{{Nihongo|Chain Jail|{{Ruby|\u675F\u7E1B\u3059\u308B\u4E2D\u6307\u306E\u9396|\u30C1\
    \u30A7\u30FC\u30F3\u30B8\u30A7\u30A4\u30EB}}|The Restraining Middle Finger Chain}}: Shaped like a\
    \ hook, it wraps around Spiders and restricts their movement. It also forcefully causes its prisoners\
    \ to enter Zetsu, shutting off their aura and preventing the use of Nen abilities. It is only possible\
    \ to escape from the Chain Jail through brute force. Kurapika imposed a Limitation onto this chain\
    \ so that it can only be used to deal with members of the Phantom Troupe. If this condition is violated,\
    \ Kurapika will die. This Limitation was needed to increase the strength of the ability. The chain\
    \ is so sturdy that Uvogin, the strongest in physical strength amongst the troupe, couldn't break\
    \ free. **{{Nihongo|Dowsing Chain|{{Ruby|\u5C0E\u304F\u85AC\u6307\u306E\u9396|\u30C0\u30A6\u30B8\u30F3\
    \u30B0\u30C1\u30A7\u30FC\u30F3}}|The Guiding Ring Finger Chain}}: Shaped like a ball and chain, Kurapika\
    \ frequently employs this in typical situations, both defensively and offensively. It is also useful\
    \ for other investigative tasks, such as locating missing persons. He also uses this chain to determine\
    \ whether or not someone is telling the truth. It has a small ball-like weight at the end, which moves\
    \ in the direction of whatever he is dowsing for. **{{Nihongo|Judgment Chain|{{Ruby|\u5F8B\u3059\u308B\
    \u5C0F\u6307\u306E\u9396|\u30B8\u30E3\u30C3\u30B8\u30E1\u30F3\u30C8\u30C1\u30A7\u30FC\u30F3}}|The\
    \ Arbiter Little Finger Chain}}: The Stake of Retribution, a blade on the end of the Judgment Chain,\
    \ enters the victim's body and wraps around the heart. Kurapika sets two conditions, and if the victim\
    \ violates either one, the chain crushes their heart, killing them. It can only be used while Kurapika's\
    \ eyes are scarlet. Kurapika himself has a blade wrapped around his heart, which he used to set the\
    \ Limitations to use Chain Jail's ability. **{{Nihongo|Steal Chain|{{Ruby|\u596A\u3046\u4EBA\u5DEE\
    \u3057\u6307\u306E\u9396|\u30B9\u30C1\u30FC\u30EB\u30C1\u30A7\u30FC\u30F3}}|The Thieving Index Finger\
    \ Chain}}: Shaped like a syringe, upon piercing the body of the target this chain drains their aura.\
    \ If the draining continues, Kurapika can force them into a state similar to Zetsu. The process appears\
    \ to be very painful for the target. Kurapika steals the Hatsu of the victim and stores it inside\
    \ the chain. The victim cannot use said ability until it is returned to them. ***{{Nihongo|Stealth\
    \ Dolphin|{{Ruby|\u4EBA\u5DEE\u3057\u6307\u306E\u7D76\u5BFE\u6642\u9593|\u30B9\u30C6\u30EB\u30B9\u30C9\
    \u30EB\u30D5\u30A3\u30F3}}|The Index Finger's Emperor Time}}: By activating Emperor Time, Kurapika\
    \ can summon a dolphin-like construct with a syringe on each pectoral fin. This construct can \"equip\"\
    \ and analyze the stolen ability, informing Kurapika of its name, general mechanics, and underlying\
    \ conditions. Kurapika can then use the stolen skill for himself once, after which it is returned\
    \ to the original user. As a downside, Emperor Time will remain active as long as the ability is not\
    \ used. The dolphin will regularly notify Kurapika of how long Emperor Time has been"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3e76acc1
  section: abilities
  axis: hax
  text: Base= Superhuman Physical Characteristics, Genius Intelligence, Nen Manipulation (Conjurer; Kurapika
    is a powerful Nen User who has mastered all the basic and advanced techniques. Perhaps his most notable
    ability is to use Self-Imposed Limitations to enhance his capabilities greatly), Subjective Reality
    (As a Conjurer he can create things according to his imagination. He can conjure chains made out of
    Nen and other weapons and equipment he wishes. He can control the size and length of whatever he conjures),
    Enhanced Senses (Kurapika has unnaturally good hearing. He can also tell if someone is lying by looking
    in their eyes), Skilled Hand-to-Hand Combatant (Was able to fight against Uvogin), Acrobatics, Preparation,
    Chain Manipulation (Kurapika's primary weaponry are five modifiable conjured chains with different
    functions), Weapon Mastery (Is highly proficient with bokken swords, nunchakus, shurikens, firearms,
    and chains), Healing (With Holy Chain; but to a lesser extent than in Emperor Time), Clairvoyance
    (Knows if somebody is lying with Dowsing Chains and can locate missing people using a map), Immense
    Pain Tolerance (Didn't flinch after Uvogin shattered the bones in his arm and continued to fight afterward),
    Possibly Spatial Manipulation and Law Manipulation (He has extensive knowledge on Conjuration and
    stated it is a forte of Conjurers to create a space with certain rules) |-|Scarlet Eyes= All previous
    abilities enhanced greatly, Nen Manipulation (Specialist; When Kurapika's eyes become scarlet, he
    becomes a Specialist. It increases his aura capacity and output, allowing him to create unique abilities.
    For example, Emperor Time, which grants him 100% mastery in all categories making him extremely powerful),
    Statistics Amplification (Scarlet Eyes, greatly increases Kurapika's physical and Nen abilities. Emperor
    Time does so even further), Healing (Mid-Low. With Holy Chain, Kurapika was able to heal a shattered
    arm instantly), Advanced Clairvoyance (Dowsing Chain increases in potency being able to discern if
    one is lying through video recordings), Power Nullification (With Chain Jail, Kurapika can force his
    targets into a state of Zetsu. With Steal Chain, Kurapika can force targets into a Zetsu-like state),
    Law Manipulation (With Judgment Chain, Kurapika sets a rule, which, if violated, results in the Stake
    of Retribution piercing the victim's heart, killing them), Power Absorption (With Steal Chain, Kurapika
    drains an enemies' aura and steals one of their Nen abilities. While their aura is being consumed,
    the target is forced into a state similar to Zetsu), Summoning, Information Analysis and Power Bestowal
    (Kurapika can summon a dolphin-like Nen to construct that can analyze and equip Nen abilities. Kurapika
    can also bestow Nen abilities to others, even those who cannot use Nen and awaken them to Nen as a
    result) |-|Stolen
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
