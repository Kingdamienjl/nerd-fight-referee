- id: claim-weaknesses-559cfd49
  section: weaknesses
  axis: weakness
  text: "Generally brash and reckless.One Punch Man: Chapter 59 - Giant Insect Fighting Spirit deactivates\
    \ once exiting a battle, and if he has sustained severe injuries, he will be incapacitated until he\
    \ recovers. Fighting Spirit may hasten his recovery, but it will take time. There is a limit to how\
    \ much damage he can endure in combat before passing out, even with Fighting Spirit. Despite his brash\
    \ exterior and short fuse, he has a soft spot for his little sister and pet cat, whom he cares deeply\
    \ about. Notable Attacks/Techniques: Bat.gif|Metal Bat's strength automatically increases throughout\
    \ the fight due to his willpower. Bad1.gif|Metal Bat hitting himself to resist Mind Control. Bad2.gif|Dragon\
    \ Pummelin GarouFacingMetalBat'sSavageTornado.jpg|Brutal Tornado {{Quote|When the intensity of Metal\
    \ Bat's anger reaches its maximum, his power approaches infinity.}} Evergrowing Strength: Metal Bat\
    \ possesses immense physical strength and has taken out many powerful monsters and villains with a\
    \ single swing of his bat, including two demon-level monsters simultaneously, including Senior Centipede\
    \ whose carapace can withstand Genos' Incinerate without being damaged. Even without fighting spirit,\
    \ he has shown to be able to kill demon-level foes with one swing. While unable to kill the Elder\
    \ Centipede with one hit, he pushed it down and completely stopped it in its tracks. It's noted that\
    \ his fighting spirit heightens his strength. Garou observed that the longer the fight drags on, the\
    \ more powerful Metal Bat becomes, to the point that he can easily destroy buildings and tear the\
    \ ground apart, causing powerful shock waves. Garou even complimented him, stating that he would have\
    \ lost the fight if he had received even a single strike from the bat. The power of his swing has\
    \ impressed the likes of Superalloy Darkshine and Bang. Psychic Resistance: Metal Bat's indomitable\
    \ will granted him the ability to withstand certain psychic forces and very resistant to others due\
    \ to his incredible willpower known as the Fighting Spirit. Increased Healing Factor: Metal Bat possesses\
    \ the ability to recover from minor blood loss and fractured bones in a matter of days just by resting.\
    \ *{{Nihongo|Killer Move|{{Ruby|\u5FC5|\u3072\u3063}}{{Ruby|\u6BBA|\u3055\u3064}}|Hissatsu}}: Metal\
    \ Bat usually fights by bashing his opponents into submission or death with his bat, not unlike a\
    \ typical delinquent. However, if there are opponents who can either withstand them or evade them,\
    \ he swings his bat at different intervals and in unorthodox ways to be able to strike them down.\
    \ Among his array of moves, he also has ones made and used to finish off his opponents. Garou judges\
    \ Metal Bat's overall fighting style as the one of an amateur. **{{Nihongo|Dragon Pummelin|{{Ruby|\u6012\
    |\u30C9}}{{Ruby|\u7F85|\u30E9}}{{Ruby|\u53B3|\u30B4\u30F3}}\u30B7\u30D0\u30AD|Doragon Shibaki}}: Metal\
    \ Bat unleashes a barrage of smacks with his bat at the same spot from multiple angles. This attack\
    \ was first seen used against Elder Centipede. The strike was powerful enough to cause Elder Centipede\
    \ to shout in pain. **{{Nihongo|Brutal Tornado|{{Ruby|\u91CE|\u3084}}{{Ruby|\u86EE|\u3070\u3093}}\u30C8\
    \u30EB\u30CD\u30FC\u30C9|Yaban Torun\u0113do}}: Metal Bat wildly spins with his trademark weapon strong\
    \ enough to create a small tornado. The attack was powerful enough to cause slight damage to Garou\
    \ even when the latter was repelling the strikes. In their battle, Garou commented that had the bat\
    \ managed to hit him even a single time, it would have been the end for him. ***{{Nihongo|Brutal Hurricane|{{Ruby|\u91CE\
    |\u3084}}{{Ruby|\u86EE|\u3070\u3093}}\u30CF\u30EA\u30B1\u30FC\u30F3|Yaban Harik\u0113n}}: A more powerful\
    \ version of Brutal Tornado. Metal Bat first employs this technique against Sage Centipede. **{{Nihongo|Overkill\
    \ Spiral|{{Ruby|\u4ECF|\u3076\u3064}}{{Ruby|\u6065|\u3061}}{{Ruby|\u7FA9|\u304E}}{{Ruby|\u7406|\u308A\
    }}\u30B9\u30D1\u30A4\u30E9\u30EB|Butsuchigiri Supairaru}}: Metal Bat spins himself vertically with\
    \ enough speed and strength to create a spiral. This attack was powerful enough to sever Sage Centipede's\
    \ antennas. *{{Nihongo|Fighting Spirit|{{Ruby|\u6C17|\u304D}}{{Ruby|\u5408|\u3042}}\u3044|Kiai}}:\
    \ Metal Bat can get stronger through his damage intake and anger build-up. This is because of his\
    \ will to continue to fight regardless of what happens. Instead of succumbing to the damage he receives,\
    \ Metal Bat gets an increase in his physical attributes. This ability is mainly shown during his fight\
    \ with Garou, wherein he became more durable and stronger as the battle continued. However, his Fighting\
    \ Spirit lowers quite fast when he is out of conflict, and exhaustion can quickly set in. **Mental\
    \ Resistance: Metal Bat, due to his indomitable will, cannot be completely controlled by mind control\
    \ abilities. He was able to somewhat resist Rafflesidon's gases, and by hitting himself with his bat,\
    \ Metal Bat could entirely escape the influences of Rafflesidon's gases. *Keen Perception: Contrary\
    \ to his brash exterior, Metal Bat is quite perceptive, as he was the first to discover Melzalgald's\
    \ weakness. Also, he deduced that Elder Centipede's unprotected face was the weak spot from observing\
    \ its behavior. Metal Bat was also born with an impressive dynamic vision. Note:"
  source_ids: *id003
