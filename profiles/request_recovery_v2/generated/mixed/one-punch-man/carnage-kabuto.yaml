- id: claim-powers-and-abilities-b6555517
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence (Was created to be the next step of
    human evolution and superior to "old humanity" in terms of strength and intelligence) *Large Size
    (Type 0; 3.5 meters tall normally, and 8.5 meters tall in Carnage Mode) *Enhanced Senses (He possesses
    an enhanced dynamic vision) *Limited Precognition and Instinctive Action (Through his instincts, he
    was able to sense that Saitama would''ve killed him had he attacked) *Skilled Hand-to-Hand Combatant
    (Matched Superalloy Darkshine in a battle, who is considered to be at the pinnacle of physical combatOne-Punch
    Man: Chapter 126 - Psykos) *Bodily Weaponry (Has a giant horn. Gains sharp teeth in his Carnage Mode)
    *Afterimage Creation (Punched so fast that he left multiple afterimages) *Acrobatics (Crossed a large
    distance by jumping) *Super-Breath and Limited Attack Reflection (His breath is so powerful that it
    sent Genos'' Incineration Cannon back to himOne-Punch Man: Chapter 10 - Modern Art) *Transformation,
    Berserk Mode and Statistics Amplification (Can enter his Carnage Mode to greatly grow in muscle mass
    and change his appearance increasing his statsOne-Punch Man: Chapter 11 - The Key To His Power) *Limited
    Underground Mobility (Burst out of the ground to attack Saitama) *Resistance to Fire and Heat Manipulation
    (Was completely unfazed by Genos'' Incineration Cannon, which is capable of melting ironOne-Punch
    Man: Hero Encyclopedia Page 042 - 043)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
