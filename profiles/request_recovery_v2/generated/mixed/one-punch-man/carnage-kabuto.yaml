    Characters Category:Manga Characters Category:Monsters Category:Mutants Category:Precognition Users
    Category:Statistics Amplification Users Category:Stone Walls Category:Transformation Users Category:Villains
    Category:Webcomic Characters Category:Humanoid Characters'
  source_ids: *id003
