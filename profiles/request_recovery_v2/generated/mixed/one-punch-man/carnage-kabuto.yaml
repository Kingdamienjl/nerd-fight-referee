    and changing his appearance. This mode causes him to go into an uncontrollable berserk rage for a
    whole week. ==Gallery== Carnagemode.gif|Carnage Kabuto Transforming Carnage Kabuto Colored.png|Carnage
    Kabuto''s Manga Coloration ==Notable Matchups== Victories: Losses: *Megatron (Dreamwave Unicron Trilogy)
    (Transformers (Dreamwave Unicron Trilogy)) Megatron''s Profile (Megatron power-linked with Leader-1
    is used against base Carnage Kabuto, speed is equalized, they start 10 meters apart and Carnage Mode
    is restricted) Inconclusive: ==References== {{scroll box|content={{Reflist|2}}}} ==Notes/Explanations==
    {{Scroll box|content=}} {{Discussions}} Category:Characters Category:One-Punch Man Category:Air Users
