- id: claim-weaknesses-a6b0b578
  section: weaknesses
  axis: weakness
  text: "The Deep Sea King will be weakened without adequate hydration Notable Attacks/Techniques: Skilled\
    \ Hand-to-Hand Combatant: The Deep Sea King was an expert combatant capable of defeating two S-Class\
    \ Heroes and seemed to have lots of fighting experience, as seen when he lectured Pri-Pri-Prisoner\
    \ on how to fight properly, by putting much more effort into attacking an opponent with killing intent.\
    \ He also seemed to prefer combo attacks, attacking his opponents mostly with a barrage of punches.\
    \ *{{Nihongo|True Form|{{Ruby|\u771F|\u3057\u3093}}\u306E{{Ruby|\u59FF|\u3059\u304C\u305F}}|Shin No\
    \ Sugata}}: He returns to his original form once his body has been sufficiently hydrated. In this\
    \ form, he is significantly larger and more monstrous. He also has increased strength and speed in\
    \ this state, allowing him to crash through buildings and keep up with Sonic. However, sufficiently\
    \ powerful strikes or extended periods without water will force him to exit this form. True Form-0.png|True\
    \ Form *{{Nihongo|Moray|{{Ruby|\u4F53|\u305F\u3044}}{{Ruby|\u5185|\u306A\u3044}}\u30A6\u30C4\u30DC\
    |Tainai Utsubo}}: He can release a long eel-like creature from his mouth that he can use to bite and\
    \ tear into opponents. *{{Nihongo|Acid Spit|{{Ruby|\u6EB6|\u3088\u3046}}{{Ruby|\u89E3|\u304B\u3044\
    }}{{Ruby|\u6DB2|\u3048\u304D}}|Y\u014Dkai-eki}}: Sea King has the ability to spit extremely acidic\
    \ spit from his mouth. *{{Nihongo|Chain Punch|{{Ruby|\u9023|\u308C\u3093}}{{Ruby|\u6253|\u3060}}|Renda}}:\
    \ Sea King launches a relentless flurry of punches at his opponent, all delivered with the intent\
    \ to kill. Chain Punch.png|Chain Punch ==Gallery== fe6862cfecbbcc2731711a49cc4ee162a94e0ddd1522207ce3be6cc5cfbcebfa.png|Deep\
    \ Sea King as he appears in the anime Dsk4.png Wetdsk.png ==Notable Matchups== Victories: Speed-o'-Sound\
    \ Sonic (One-Punch Man) Sonic's Profile (Hydrated Sea King and Pre-Training Sonic were used. Sonic\
    \ had access to his standard equipment) Losses: Yuji Itadori and Yuta Okkotsu (Jujutsu Kaisen) Yuji\
    \ and Yuta\u2019s profiles (Yuji and Yuta both were in their Shinjuku Showdown keys, Deep Sea King\
    \ was Dry but rain would fall 20 minutes after the battle started) Inconclusive: ==References== {{Reflist}}\
    \ ==Notes/Explanations== {{Scroll box|content=}} {{Discussions}} Category:Characters Category:One-Punch\
    \ Man Category:Anime Characters Category:Manga Characters Category:Monsters Category:Sea Monsters\
    \ Category:Male Characters Category:Kings Category:Evil Characters Category:Villains Category:Antagonists\
    \ Category:Regeneration Users Category:Transformation Users Category:Enhanced Senses Users Category:Martial\
    \ Artists Category:Poison Users Category:Webcomic Characters Category:Royal Characters Category:Underwater\
    \ Breathing Users Category:Large Sized Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
