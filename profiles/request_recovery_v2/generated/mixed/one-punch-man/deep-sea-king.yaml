    \ and fangs) * Acid * Spit * Underwater Breathing (Type 2) * Transformation * Regeneration (High-Low;\
    \ Quickly regenerated a hole in his face{{Nihongo|\"Glimmer of Hope\"|{{Ruby|\u4E0D|\u3075}} {{Ruby|\u5B89\
