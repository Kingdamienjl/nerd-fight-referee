    ONE about this is old and outdated, and both characters have since gained very different levels of
    feats in terms of both speed and strength. *Tatsumaki''s Relativistic+ attack speed can only be used
    in versus threads if she has access to objects that won''t burn up at that speed. ==Gallery== DatabookTats.webp|
