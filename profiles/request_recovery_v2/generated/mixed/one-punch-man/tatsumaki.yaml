- id: claim-powers-and-abilities-fd200f61
  section: abilities
  axis: hax
  text: "*Psychokinesis *Superhuman Physical Characteristics (With psychic powers) *Supernatural Willpower\
    \ (As an esper, she draws psychic energy from her mind, which requires a strong willpower to manipulate)\
    \ *Social Influencing (Reputation and Instilling Fear; As the Class Rank 2 hero, she is respected\
    \ by the public and has many fans around the world. Monsters fear her due to her overwhelming power\
    \ and brutality on the battlefield) *Aura (Possesses a green psychic aura around her body,One-Punch\
    \ Man: Chapter 110 - Right Here objects manipulated by her are also engulfed in this aura) *Enhanced\
    \ Senses (Heard the conversation the heroes were having at the ground from far away.One-Punch Man:\
    \ Chapter 141 - Rejuvenated Offence, pg. 12 Saw King from the top of Monster Association baseOne-Punch\
    \ Man: Chapter 133 - Glorious Being, pg. 4) *Extrasensory Perception (Tracked the location of the\
    \ rest of the heroes communicators inside the Monster Association base.One-Punch Man: Chapter 130\
    \ - Tatsumaki Full Power, pg. 13 Able to sense Psykos and Drive Knight's presence and pinpoint their\
    \ whereabouts even while both of them were underground.One-Punch Man: Chapter 137 - Resonance, pg.\
    \ 29 Can sense spatial distortions and dimensional travel.One-Punch Man: Chapter 141 - Rejuvenated\
    \ Offence, pg. 12 Can sense the wavelength of telekinetic signalsOne-Punch Man: Chapter 177 - The\
    \ Supernatural & Risks, pg. 19, 20 & 21) *Limited Power Mimicry (Can copy the wavelength of telekinetic\
    \ signalsOne-Punch Man: Chapter 177 - The Supernatural & Risks, pg. 21) *Telepathy (Spoke to Fubuki\
    \ through telepathy) *Healing (Low with psychic powers; instantly recovered from having her body twisted\
    \ by telekinesis that caused her joints to crackOne-Punch Man: Chapter 177 - The Supernatural & Risks,\
    \ pg. 11 & 19) *Flight (Uses her powers to float and fly) *Forcefield Creation (Can create barriers\
    \ around herself and others,One-Punch Man: Chapter 94 - I SeeOne-Punch Man: Chapter 129 - Turn Over!One-Punch\
    \ Man: Chapter 130 - Tatsumaki's Full Power the size of them can vary with the biggest one she made\
    \ being shown to be able to cover a great section of Z-City. During her fight with Psykos she figured\
    \ out a way to counter her \"barrier reversal\" by double layering and reinforcing her barriersOne-Punch\
    \ Man: Chapter 128 - Invasive TouchOne-Punch Man: Chapter 134 - Twist) *Air Manipulation (As her hero\
    \ name implies she can create large psychic tornados using her powers) *Weather Manipulation (Can\
    \ create thunderstorms) *Weapon Creation (Created a spear out of the remains of the Monster Association\
    \ base.One-Punch Man: Chapter 138 - Into the Abyss, pg. 36 & 37 Shaped a pill and its contents into\
    \ a tiny needleOne-Punch Man: Chapter 177 - The Supernatural & Risks, pg. 19, 20 & 21) *Danmaku and\
    \ Attack Reflection (Lifted a large number of rocks and hurled them at Psykorochi.One-Punch Man: Chapter\
    \ 133 - Glorious Being, pg. 6 & 7 Redirected the bombardment from Lord Boros' spaceshipOne-Punch Man:\
    \ Chapter 34 - Are You Stupid) *Technology Manipulation (Controlled her TV using her psychic powersOne-Punch\
    \ Man: Bonus Chapter 55.6 - Tatsumaki's Day Off, pg. 7) *Underground Mobility (Can travel underground)\
    \ *Camouflage (Camouflaged herself as energy being absorbed through Psykos's roots, allowing her to\
    \ infiltrate Psykos's body unnoticed) *Limited Light Manipulation (Illuminated a giant spear with\
    \ her green aura) *Limited Power Nullification with barriers (Durability Negation; Despite having\
    \ both her own psychic power turned against her and Psykos\u2019s output added on top of it, she wasn\u2019\
    t instantly crushed thanks to her barrier. Her barriers typically negate psychokinesis from weaker\
    \ espers, which can bypass conventional durability) *Limited Durability Negation (Tatsumaki's telekinesis\
    \ inflicts overwhelming pressure, which causes internal bleeding and has been shown to also affect\
    \ muscles.One-Punch Man: Chapter 178 - Do it Outside, pg. 14 Was able to directly target and manipulate\
    \ the contents of a pill inside Fubuki's body,One-Punch Man: Chapter 177 - The Supernatural & Risks,\
    \ pg. 19 & 20 meaning she should be able to target the internal organs of her opponents if she wished\
    \ to do so) *BFR (Can send others into outer spaceOne-Punch Man: Chapter 180 - Unknown Quantity, pg.\
    \ 11) *Resistance to Gravity Manipulation (Treated Gyoro Gyoro's 300x Gravity like a complete jokeOne-Punch\
    \ Man: Chapter 111 - Powerful Enemy, pg. 8 & 9)"
