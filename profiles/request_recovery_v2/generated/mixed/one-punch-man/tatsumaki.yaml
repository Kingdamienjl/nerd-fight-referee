  intelligence:
    text: Gifted. Tatsumaki is exceptionally gifted in combat, showcasing an innate and remarkable mastery
      of her psychic abilities. This is most evident in her adeptness at manipulating energy signals with
      finesse and precision. Notably, she possesses the unique ability to give inanimate objects energy
      signatures that mirror her own in order to create decoys that confuse opponents and divert their
      attention. Equally impressive is her ability to weaken her own energy signal to a level of subtlety
      so that renders it virtually indistinguishable from the ambient energy signatures emitted by ordinary
      humans. Tatsumaki's prowess was further demonstrated when she skillfully combined these two techniques,
      allowing her to circumvent Psykos' barrier by infiltrating her body and dismantling her from within.
      Tatsumaki is also exceptionally skilled at multitasking and rapid decision making; as she was battling
      with Psykorochi and doing all of the above she noticed an oncoming Tsunami heading towards City
      Z and raised the coastline to intercept it, preventing widespread destruction. On top of that she
      was at the same time focusing on protecting the Strike Team using psychic barriers while relocating
      them away from the Monster Association base, with her ability to outmaneuver and outwit Psykos remaining
      undiminished. Tatsumaki has demonstrated remarkable adaptability. Immediately after raising the
      coastline to halt an incoming tsunami, Tatsumaki promptly incorporated the elevated rocks into her
      arsenal, launching them with precision towards Psykos. Showcasing her adaptability even further,
      Tatsumaki pulled off a clever move by creating a new type of barrier. This barrier was tailor-made
      to counter the flipping of the standard barriers that Psykos had previously used to trap and almost
      defeat Tatsumaki.
    source_ids: *id002
    confidence: 0.95
