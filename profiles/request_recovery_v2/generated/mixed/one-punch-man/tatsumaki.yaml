      on the fight, she dissipated one of Psykos'' beams and effortlessly overpowered her, twisting all
      of Z-City in the process and obliterating her on the cellular level. She believed she could have
      killed Saitama by increasing her psychic output by just a touch, even after using power on par with
      what she used to overpower Psykorochi. Having already reached her limits against Saitama, she forced
      her power even higher, convinced she could launch him into outer spaceUpscales to 231.3 Exatons)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Sub-Relativistic (Usually considered to be faster than most S-Classes. Reacted to Psykorochi's
      beams, casually dodging several at once while not fully focused on them. Swifter than Psykorochi
      and evaded her sight, replaced herself with a rock dummy and got inside of her body before she realized
      what happened0.01c), possibly Relativistic+ attack speed (In an interview, Murata stated that Tatsumaki
