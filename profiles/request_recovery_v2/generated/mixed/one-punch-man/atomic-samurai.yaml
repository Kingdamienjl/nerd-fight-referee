- id: claim-weaknesses-71171382
  section: weaknesses
  axis: weakness
  text: "As demonstrated during the fight against Melzargard, his expertise in sword fighting has made\
    \ him unwilling to try new methods to defeat his enemies, relying solely on slicing. He is very arrogant\
    \ and often judges someone just by appearance. Using the Sun Sword significantly drains his energy.\
    \ Atomic Samurai Fighting.gif|Atomic Samurai's Swordsmanship AtomicSlash.gif|Atomic Slash Notable\
    \ Attacks and Techniques: Master Swordsman: Atomic Samurai has shown to be a formidable swordsman.\
    \ Legend says he can cut down over 100 enemies with each strike. His sword attacks are so fast and\
    \ strong that the enemies are slashed into many pieces in an instant without even being able to react.\
    \ He was able to cut a monster to bits using a mere toothpick. His slashes were even capable of dispersing\
    \ Orochi's beams. *{{Nihongo|Atomic Slash|\u30A2\u30C8\u30DF\u30C3\u30AF{{Ruby|\u65AC|\u3056\u3093\
    }}|Atomikku Zan}}: Atomic Samurai's signature attack. He performs over 100 quick sword slashes within\
    \ a second, leaving his opponents in pieces. He primarily uses this technique while dashing past the\
    \ opponent, but has also shown a stationary version in which he slashes everything around himself.\
    \ Atomic Samurai is the only swordsman in the world capable of performing this technique. This is\
    \ one of the most powerful techniques in the series, with only Dragon-level monsters with Regeneration\
    \ or Duplication powers able to survive it. *{{Nihongo|Air Blade:|{{Ruby|\u98DB|\u3072}}{{Ruby|\u7A7A\
    |\u304F\u3046}}{{Ruby|\u5263|\u3051\u3093}}|Hik\u016Bken}}: Kamikaze slashes with his sword and sends\
    \ a blade of compressed air at his opponents. He can perform the attack upon drawing his sword, blocking\
    \ an attack and finishing with the air blade in one motion. He taught this technique to Okamaitachi.\
    \ Master Teacher: Atomic Samurai is shown to be very skilled at instructing and raising disciples\
    \ in the art of the sword. This is demonstrated by his three disciples, who are all at the top of\
    \ the A-Class rank of the Hero Association, right underneath Sweet Mask himself. According to Fubuki,\
    \ all of Atomic Samurai's disciples would have already been in S-Class, if it weren't for Sweet Mask's\
    \ gate-keeping. ==Gallery== Kamikaze atomic samurai manga full appearance.png|Manga Appearance Img\
    \ character a 07 01.png|Game Appearance Atomic Samurai with the Sun Blade.jpg|With the Sun Blade Atomic\
    \ Samurai from Volume 13.jpg Atomic slaughters an army of monsters.webp AS kills more multiple fodder\
    \ monsters.webp Kamikaze slashes.webp Atomic Samurai slashing Black Sperm copies.webp Atomic Samurai\
    \ slashing G5's armour into pieces.webp ==Notable Matchups== Victories: Black Sperm (One-Punch Man)\
    \ Black Sperm's Profile (Atomic Samurai with the Sun Blade and Golden Sperm were used) Losses: Inconclusive:\
    \ ==References== {{scroll box|content={{reflist|2}}}} ==Notes and Explanations== {{Discussions|Atomic\
    \ Samurai|Kamikaze (Atomic Samurai)}} Category:Characters Category:One-Punch Man Category:Adults Category:Anime\
    \ Characters Category:Good Characters Category:Heroes Category:Male Characters Category:Manga Characters\
    \ Category:Samurai Category:Sword Users Category:Teachers Category:Weapon Masters Category:Webcomic\
    \ Characters Category:Sleight of Hand Users"
  source_ids: *id003
  decisive: false
  status: unverified
