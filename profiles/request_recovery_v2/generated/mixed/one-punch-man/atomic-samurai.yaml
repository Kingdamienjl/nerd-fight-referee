- id: claim-standard-equipment-b1b224d5
  section: equipment
  axis: equipment
  text: "*Katana: Atomic Samurai carries two swords: a katana and a wakizashi. His primary blade has a\
    \ black hilt with a cross-guard that resembles the Rutherford atom model. His primary sword is a custom-made\
    \ sword, supposedly crafted by a famous blacksmith. *Wakizashi: Atomic Samurai carries a wakizashi.\
    \ He uses it to deflect one of G5's lasers and then launch a counterattack with an Air Blade. The\
    \ weapon signifies that he is a samurai. *Stick: Atomic can use the stick he normally chews on as\
    \ a weapon. *{{Nihongo|Sun Blade|{{Ruby|\u65E5|\u306B\u3061}}{{Ruby|\u8F2A|\u308A\u3093}}|Nichirin}}:\
    \ After Nichirin lost his legs, Atomic Samurai was given the Sun Blade, which he uses during his fight\
    \ with Homeless Emperor and Golden Sperm."
  source_ids: *id003
  decisive: false
  status: unverified
