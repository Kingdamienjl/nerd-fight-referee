- id: claim-weaknesses-b3ce0c9b
  section: weaknesses
  axis: weakness
  text: 'If she is fighting a powerful opponent her resources will quickly deplete leaving her with only
    her spear. Her spear takes a few seconds before it can hack something again. She can be hot-headed
    at times. Notable Attacks/Techniques: *Sylens Lance: A spear which shocks their target upon contact.
    Due to Aloy''s hacking module, she can hack machines to use her to them to her heart''s desire. *Hunter
    Bow: Allows the use of basic arrows, fire arrows and tear arrows. *War Bow: Allows the use of ice,
    shock and corruption arrows. *Sharpshot Bow: Allows the use of precision, tearblast and harvest arrows
    *Rattler: Shots extremely fast bolts in quick succession. It shots metal, ice and shock bolts. *Ropecaster:
    Shots a hook attached to a rope used for tieing down enemies. *Sling: Allows the use of fire, ice
    and shock bombs. *Blastsling: Allows the use of regular, blast and proximity bombs. *Tearblaster:
    Rips any fragile part off machines until their down to their exoskeleton. *Tripcaster: Creates a rope
    on the ground that if tripped, explodes. It allows for the use of regular, fire and shock explosions.
    *Mount Call: Aloy can call any previously hacked machine to help her in combat. *Focus: A device that
    allows the storage of any previously recorded information and the ability to see anything within the
    near vicinity, whether it be human or machine. *Enhanced Senses: Aloy can track a person by smell
    for miles ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Horizon Zero
    Dawn Category:Characters Category:Humans Category:Female Characters Category:Protagonists Category:Game
    Characters Category:Teenagers Category:Playable Characters Category:Primary Protagonists Category:Bow
    Users Category:Good Characters Category:Video Game Characters Category:Heroes Category:Slingshot Users
    Category:Spear Users Category:Fire Users Category:Ice Users Category:Hackers Category:Weapon Masters
    Category:Summoners Category:Forcefield Users Category:Healers Category:Statistics Amplification Users
    Category:Status Effect Users Category:Trap Users Category:Explosion Users Category:Prisoners Category:Clones
    Category:Orphans Category:Tragic Characters Category:Adventurers Category:Survivors Category:Sling
    Users Category:Armor Users Category:Lance Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
