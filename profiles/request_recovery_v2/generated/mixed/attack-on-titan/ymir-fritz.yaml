- id: claim-powers-and-abilities-0fd01db0
  section: abilities
  axis: hax
  text: "Human= *Regeneration (Mid) *Transformation (Into a Titan) *Mind Manipulation (The Founding Titan\
    \ can control all the Subjects of Ymir, and as stated by Karl Fritz, all users of the Founding Titan\
    \ can control all the Wall Titans to flatten the earth. This is proven true when Eren does so with\
    \ the Founder's power) *Biological Manipulation (Scales to Zeke, who can turn any Eldian who has ingested\
    \ his spinal fluid into Pure Titan through his scream) *Precognition (With Attack Titan's power, Ymir\
    \ can peer through the memories of the future) *Power Bestowal (The Founding Titan\u2019s powers can\u2019\
    t be used if the Titan\u2019s inheritor lacks royal blood, but can still be used if they touch someone\
    \ with it. Can allow Eren or any non-royal inheritor of the Founding Titan to tap into said power)\
    \ *Immortality (Types 3 and 7. Is capable of regeneration, continued to exist as a spiritual entity\
    \ after her death) *Telepathy (Scales to Eren, who has a psychic link with all of the Attack Titan's\
    \ inheritors, as stated by Zeke. And used this ability to send Kruger memories of Mikasa and Armin,\
    \ and showed Grisha the bits of his memories that would serve as convenient for his plan, manipulating\
    \ his father to take the Founder through them) *Memory Manipulation (Users of the Founding Titan have\
    \ displayed the ability to modify and even wipe out memories of the Subjects of Ymir, as did Karl\
    \ Fritz and Frieda Reiss) |-|Founding Titan= *Superhuman Physical Characteristics (As a Titan) **Large\
    \ Size (Type 2) - (Ymir titan will be at least higher than the Colossus Titan) **Immortality (Types\
    \ 3 and 7) **Regeneration (Mid-High; Scales to the War Hammer Titan) **Biological Manipulation (Same\
    \ as before and with the Founding Titan's power, she can change the composition of the bodies of Eldians,\
    \ making them immune to diseases or even sterilizing them) **Body Control (Can harden parts of her\
    \ skin, which can be used to make more powerful attacks and her skin more durable) **Telepathy (Scales\
    \ to Eren, who telepathically communicated with every Subject of Ymir through the Paths) **Creation\
    \ (Can create millions of colossal titans with mere hand waves) **Empathic Manipulation (With Female\
    \ Titan's power, Ymir can attract other titans with her shouts) **Heat Manipulation and Steam Manipulation\
    \ (With Colossal Titan's power, Ymir can emit steam which is usually as hot as boiling water. Colossal\
    \ Titan can also create a large heat blast which is hot enough to vaporize naval ships and human bodies\
    \ completely) **Weapon Creation (With War Hammer Titan's power, Ymir can encase parts of the environment\
    \ and create weapons out of hardened Titan skin) **Memory Manipulation (Same as before) **Summoning\
    \ and Necromancy (Can summon previous and deceased Titan Shifters) **Mind Manipulation (Same as before,\
    \ and scales to Zeke, whose Beast Titan is able to direct the actions of Pure Titans and can command\
    \ them to move, resist the urge to eat humans, and stay in place. Titans under Zeke's control are\
    \ even able to function using only moonlight without falling into fatigue) **Limited Fire Breath (Non-combat\
    \ applicable; With Armored Titan's power, Ymir can breath fire from its mouth but only when it overheats,\
    \ as seen after it broke through the inner gate of Shiganshina) **Limited Curse Manipulation (Every\
    \ Titan shifter dies after 13 years of receiving said power, appearing to age at an accelerated rate\
    \ in the preceding few years. This is known as the \"Curse of Ymir\") *Resistance to Heat Manipulation\
    \ (Scales to Armored Titan, which is completely unaffected by Colossal Titan's steam. It also survived\
    \ Bertolt's heat blast without any scratch and also was stated by Pieck to be able to survive Armin's\
    \ heat blast as well)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
