power_scale:
  tier:
    text: '{{9-A}}, at least {{8-C}} with Swords, {{8-B}}, possibly {{8-A}} with Swords boosted with ODM
      gear | {{8-B}}, possibly at least {{8-A}} with Hardening'
    source_ids: &id002
    - mediawiki-19511
    confidence: 0.95
  attack_potency:
    text: Small Building level (Able to harm other members of the Survey Corps who are as durable as herself.
      Kicked a brick so hard that it broke), at least Building level with Swords (Superior to Reiner who
      cut off three fingers of the Female Titan), City Block level+, possibly Multi-City Block level with
      Swords boosted with ODM gear (Comparable to Eren and Hange, who both cut open The Colossal Titan)
      | City Block level+ (Though comparatively weaker, she can harm Eren's Titan. Her transformation
      alone is this powerful), far higher, possibly at least Multi-City Block level with Hardening (Should
      be stronger than Reiner's armor. Sliced Titan Eren's head in half with a single kick. Sliced through
      the armor of a past Armored Titan's neck with a kick)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Peak Human, Subsonic with 3D Maneuver Gear (101 m/s), with Supersonic combat speed and reactions
      (Comparable to Eren) | Subsonic (Can easily outpace horses. Comparable to Eren's Titan) with Supersonic
      reaction and combat speed (Comparable to Eren's Titan, and was able to slice his head in half with
      a kick before the latter had time to avoid it)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 1 (Would need to be able to lift this much to be able to handle the force exerted on her
      body by the 3D gear) | Class M (Broke out of the Titan Eren's grip)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level | City Block level+, far higher, possibly Multi-City Block level with Hardening
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level (Can survive the energy exerted on her body by the impact of landing at
      high speeds on solid surfaces with the 3D Maneuver Gear) | At least Building level (Barely managed
      to stop a punch from the Eren's Titan. Survived being punched hard enough to destroy part of a church
      with little damage), at least City Block level+, possibly Multi-City Block level with Hardening
      (Makes the parts of her body that she hardens durable enough to be undamaged by attacks from Levi
      and Eren's Titan. Should be stronger than Reiner's armor), far higher with crystallization (Annie's
      crystal should be comparable to that of Lara Tybur, which was completely impervious to Mikasa's
      Thunder Spear, with Eren resorting to using the Jaw Titan's jaw to destroy it rather than using
      his own hardening)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Was able to transform into the Female Titan shortly after her body was destroyed
      without the extended recovery period usually required for Titan Shifters) | Superhuman (Has a notably
      high endurance relative to other Titan Shifters, being able to run long distances and fight entire
      squadrons of soldiers as well as Eren's Titan without tiring, whereas other Titan Shifters would
      tire to the point of collapsing after doing the same. Was able to run all the way from the border
      of Paradis to Wall Maria in her titan form for hours on-end, though she collapsed shortly afterward)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range. Extended Melee Range with blades, Tens of Meters with Vertical Maneuvering
      Equipment | Several Meters by virtue of sheer size, Hundreds of Meters with Titan Summoning
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (Out of the 104th Training Corps members, Annie is one of the strongest fighters
      alongside Mikasa and Eren. Annie possesses a great amount of skill at controlling the vertical maneuvering
      equipment, able to effortlessly kill Titans using only the equipment's blades and even kill veteran
      Survey Corps members such as Gunther Schultz even after being considerably exhausted by using her
      Titan abilities. Annie is also highly skilled in combat, using a unique fighting style with a strong
      focus on minimizing the advantages of larger, stronger opponents through kicks, throws, and holds)
      | Above Average (Due to retains a large amount of her intelligence in her Titan form as well as
      having been trained in using her powers by the military of Marley and her father, Annie is one of
      the more skilled of the Nine Titans. The Female Titan is able to easily overpower veteran Survey
      Corps members, and wipe out several squads in Erwin's specialized scouting formations. She has a
      great deal of control over her abilities, using her controlled regeneration to allow for sneak attacks,
      using her crystallization ability for both offensive and defensive purposes in combination with
      her retained fighting skill, and using her Titan controlling abilities to gather large groups of
      Titans to attack human settlements and squadrons of soldiers as well as to free herself should she
      be captured)
    source_ids: *id002
    confidence: 0.95
