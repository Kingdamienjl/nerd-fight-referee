- id: claim-weaknesses-07e3b19a
  section: weaknesses
  axis: weakness
  text: 'Cannot transform into the Female Titan while unconscious while already healing after a previous
    transformation | Can be killed if the one meter long and 10 centimeters wide area of her nape where
    her body is cut, and the transformation can only be maintained for so long. Eventually loses her Titan
    Shifter abilities via Eren''s death and subsequent erasure of titans from the world Notable Attacks/Techniques:
    *Regeneration: In her Titan form, Annie is capable of healing any injuries and even regenerating any
    parts of her body that were possibly lost in a battle. She is also able to focus this ability on certain
    parts of her body, healing the chosen injuries at a much faster pace as opposed to the automatic,
    simultaneous regeneration of all the damaged parts. *Hardening: Annie has the ability to harden parts
    of her skin at will. However, unlike the Armored Titan, Annie''s hardened skin cannot be maintained
    for prolonged periods, as it will chip if struck. The armor is hard enough to shatter blades of ultrahard
    steel upon contact, allowing Annie to effectively defend herself against attacks, even those coming
    from Eren in his Titan form. Besides its defensive properties, Annie''s hardening gives her melee
    attacks significantly stronger power, with a single well-placed blow being capable of dismembering
    or even decapitating an enemy Titan. She is also able to harden her fingers and toes into claws sharp
    enough to penetrate stone. *Titan Control: The Female Titan is able to exercise some influence over
    Pure Titans through a scream-based ability, allowing her to attract them to her position over a wide
    area *High mobility and endurance: As the female titan, Annie has high mobility and endurance, unlike
    most titan shifters, who are less fast than her and tire out to the point of collapsing. During the
    57th expedition, she was able to run long distances while fighting against many soldiers and Eren''s
    Titan. Also, after escaping the Survey Corps'' trap, she was able to transform for a second time without
    an extended recovery period. *Adaptation: As the Female Titan, Annie is able to take in parts of other
    Titans and manifest their abilities easily. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{discussions|Annie Leonhart|Annie Leonhart}} Category:Characters Category:Attack on Titan Category:Adults
    Category:Anime Characters Category:Antagonists Category:Anti-villains Category:Body Control Users
    Category:Clairvoyance Users Category:Dual Wielders Category:Empathic Manipulation Users Category:Female
    Characters Category:Flight Users Category:Giants Category:Grappling Users Category:Humans Category:Large
    Sized Characters Category:Manga Characters Category:Martial Artists Category:Military Characters Category:Regeneration
    Users Category:Statistics Amplification Users Category:Sword Users Category:Teenagers Category:Transformation
    Users Category:Emotionless Characters Category:Misanthropes'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
