- id: claim-weaknesses-81e401fd
  section: weaknesses
  axis: weakness
  text: 'Has low self-esteem. Regeneration takes longer and is less efficient in human form | Can be killed
    if the one meter long and 10 centimeters wide area of his nape where his body is is cut, and the transformation
    can only be maintained for so long. His steam generation also drains muscle mass and renders Bertolt
    unable to move from his current position. If exiting the Colossal Titan, Bertolt is in danger from
    falling 60 meters, though this weakness can be circumvented by using the vertical maneuver gear. Notable
    Attacks/Techniques: *Regeneration: Bertolt, like all other Titans, had the power to automatically
    regenerate any wounds sustained and even entire parts of his body that were lost. This power also
    extended to his human form, as shown in the fight against Mikasa on top of Wall Rose with Bertolt
    losing part of his arm and suffering a critical slash to his neck. He also received a deep cut in
    the chest at hands of Erwin Smith, but he regenerated anyway. *Steam Generation: Bertolt possessed
    a powerful defense mechanism that involved him releasing large amounts of extremely hot and pressurized
    steam from his body. The steam had enough force to deflect any cables shot from the vertical equipment
    and burn away or repel close-range fighters. It was shown that Bertolt could sustain the effort of
    producing large quantities of steam for a timed/limited duration. He was capable of channeling massive
    amounts of heat into very fine points and weaponizing it. The super-heated air released from its head
    area was enough to sear the flesh from Armin Arlert''s muscles within moments and fuse his vertical
    equipment straps to his legs. Using his steam generation power, Bertolt possessed the ability to completely
    disperse his Titan body entirely instantly. ==Gallery== Attack on Titan S3P2 - Official Clip - Colossal
    Nuke|Colossal Titan transformation nuke Heat manip.gif|Colossal Titan Heat manipulation Colossal titan
    eating humans.gif|Colossal Titan eating humans Bertholdt Vs Mikasa and Bertholdt Transformation -
    Attack On Titan Season 3 Part 2|Bertolt in a combat match vs Mikasa ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Discussions}} Category:Characters Category:Attack on Titan
    Category:Male Characters Category:Manga Characters Category:Anime Characters Category:Antagonists
    Category:Primary Antagonists Category:Sword Users Category:Humans Category:Monsters Category:Teenagers
    Category:Giants Category:Regeneration Users Category:Transformation Users Category:Large Sized Characters
    Category:Clairvoyance Users Category:Flight Users Category:Steam Users Category:Temperature Users
    Category:Grappling Users Category:Dual Wielders'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-075e9b04
