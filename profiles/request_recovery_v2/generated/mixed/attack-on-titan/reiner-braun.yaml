- id: claim-weaknesses-8bb75b21
  section: weaknesses
  axis: weakness
  text: 'Suffers from dissociative identity disorder. In post-timeskip he suffers from depression and
    PTSD | Can be killed if the one meter long and 10 centimeters wide area of his nape where his body
    is cut, and the transformation can only be maintained for so long. Armoring his entire body considerably
    reduces his mobility and movement speed. Eventually lost his Titan Shifter abilities via Eren''s death
    and subsequent erasure of titans from the world. Notable Attacks/Techniques: *Regeneration: Reiner,
    like all other Titans and humans with the Titan powers alike, has the ability to automatically regenerate
    any wounds sustained and even entire limbs. This also applies to his human form, and he possesses
    the ability to consciously control his regenerative ability, slowing down or speeding up his regeneration
    at will. *Armor Hardening: Reiner''s body automatically produces a hardened, armor-like skin that
    covers most of his body, save for areas such as his joints at the back of his legs. The Armored Titan
    can choose to harden or not to harden joints at will, sacrificing speed and combat ability for protection.
    However, this is his only remarkable weak spot: similar to a medieval armor, his body needs gaps around
    the joints in order to move with necessary speed. This makes him vulnerable in just a few spots, like
    the inner part of his knees and his elbows. Additionally, he can harden his fingertips and toes into
    points in order to grip and climb flat, vertical surfaces like the Walls. *Brain Function Transfer:
    Reiner is able to prevent his certain death by after transferring the functions of his brain into
    the rest of his body. With this ability he can survive a direct strike to his spinal cord and even
    maintain some control over his Titan form after his brain and the top half of his head was destroyed
    by a Thunder Spear by using his Armored Titan''s brain as a backup. However, this ability is incredibly
    difficult to successfully carry out and is only used as a last resort. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==Notes/Explanations== {{Scroll box|content=}} {{discussions}} Category:Characters
    Category:Attack on Titan Category:Adults Category:Anime Characters Category:Antagonists Category:Anti-villains
    Category:Body Control Users Category:Clairvoyance Users Category:Dual Wielders Category:Fire Users
    Category:Flight Users Category:Giants Category:Grappling Users Category:Humans Category:Immortals
    Category:Large Sized Characters Category:Male Characters Category:Manga Characters Category:Martial
    Artists Category:Primary Antagonists Category:Regeneration Users Category:Statistics Amplification
    Users Category:Stone Walls Category:Sword Users Category:Teenagers Category:Tragic Characters Category:Transformation
    Users Category:Traitors'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
