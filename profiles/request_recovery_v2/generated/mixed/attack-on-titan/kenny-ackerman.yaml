  intelligence:
    text: Gifted (Kenny was a Serial Killer who was so good at killing that he was able to kill over a
      hundred members of the Military Police without getting caught. On top of that, he was the leader
      of the First Interior Squad, showing high-leadership skills. Levi mentioned that he learnt quite
      a bit from him concerning how to out-maneuver his targets, suggesting that Kenny was highly intelligent
      and a strategic thinker. He's also very analytical, even outmaneuvering and tricking Humanity's
      best soldier into walking into a trap. When Levi faced Kenny, he stated that Kenny can read every
      move of him. The fact that he was able to teach an individual as skilled as Levi suggests that he
