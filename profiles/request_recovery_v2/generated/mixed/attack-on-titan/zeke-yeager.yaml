- id: claim-weaknesses-7d49ffd6
  section: weaknesses
  axis: weakness
  text: 'Somewhat overconfident; the control over his Titans is imperfect, and some can disobey him |
    Can be killed if the one meter long and 10 centimeters wide area of his nape where his body is is
    cut, and the transformation can only be maintained for so long. His Beast Titan is suited for long
    range combat which makes it weak in close combat. Notable Attacks/Techniques: *Titan Creation and
    Control: Zeke possesses the ability to transform Subjects of Ymir into Titans. In order to do this
    he must inject them with his own spinal fluid, followed by him using his scream on them, resulting
    in them turning into Titans. These Titans, unlike the regular Titans encountered, are capable of functioning
    at night. In his Titan form Zeke is capable of talking to other Titans and even giving them orders
    which they follow blindly, though this is limited to Titans that he created with injections directly
    from his own spinal fluid. He also appears to have the ability to repel Titans as the Titans never
    attack him like they would other human-controlled Titans. His spinal fluid can also be ingested orally
    if mixed with a drink such as wine, and Zeke is able to use his scream even in human form. *Hardening:
    Zeke is able to harden his Titan body at will to protect himself from attacks. *Pitching Assault:
    The Beast Titan possesses a devastating ability to throw objects with great power, speed, and accuracy,
    allowing it to perform the role of heavy artillery, launching projectiles capable of wiping out an
    entire fleet of soldiers with one attack. ==Notable Matchups== Victories: Kong (Monsterverse) Kong''s
    Profile (Beast Titan and Adolescent Kong were used. Starting Distance was 1 kilometer. Speed was equalized)
    Losses: Inconclusive: {{Discussions}} Category:Characters Category:Attack on Titan Category:Male Characters
    Category:Manga Characters Category:Anime Characters Category:Antagonists Category:Military Characters
    Category:Leaders Category:Soldiers Category:Giants Category:Anti-villains Category:Transformation
    Users Category:Brawlers Category:Regeneration Users Category:Large Sized Characters Category:Monsters
    Category:Biology Users Category:Mind Users Category:Power Bestowal Users Category:Clairvoyance Users
    Category:Body Control Users Category:Statistics Amplification Users Category:Martial Artists Category:Geniuses'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-4183c35d
  section: abilities
  axis: hax
  text: "Human=Superhuman Physical Characteristics, Genius Intelligence, Expert Hand-to-Hand Combatant,\
    \ Regeneration (Low-Mid), Transformation (Into a Titan), Biological Manipulation (Any Eldian who ingests\
    \ Zeke\u2019s spinal fluid can be turned into a Pure Titan through his scream He can also alter them,\
    \ as Levi realized that all the Pure Titans Zeke transformed through his spinal fluid were fast),\
    \ Mind Manipulation (Zeke can command Pure Titans. He commands them to kill Levi, twice), Power Bestowal\
    \ (Can allow Eren or any non-royal inheritor of the Founding Titan to tap into said power. The Founding\
    \ Titan\u2019s powers can\u2019t be used if the Titan\u2019s inheritor lacks royal blood, but can\
    \ still be used if they touch someone with it), Clairvoyance (Like all inheritors of the Nine Titans,\
    \ its power allows the current user to view the memories of the previous holders. Can move back and\
    \ forth freely through memories, as he traveled through his father's memories) |-|Beast Titan=Superhuman\
    \ Physical Characteristics, Large Size (Type 1. Beast Titan is 17 meters tall), Regeneration (High-Mid),\
    \ Body Control (Can harden parts of his skin which can be used to make more powerful attacks and make\
    \ his skin more durable), Mind Manipulation (Zeke's Beast Titan is able to exercise some control over\
    \ Pure Titans that he created through his screams. The Beast Titan is able to direct the actions of\
    \ Pure Titans and can command them to move, resist the urge to eat humans, and stay in place. Titans\
    \ under Zeke's control are even able to function using only moonlight without falling into fatigue),\
    \ Biological Manipulation (Same as before)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
