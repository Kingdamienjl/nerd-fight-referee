- id: claim-weaknesses-ce0b4873
  section: weaknesses
  axis: weakness
  text: 'His core will be left vulnerable after taking a significant amount of damage. Feats: *Should
    be superior to the dozens of Master Hands he controls, and has one-shotted various Crazy Hands. Notable
    Attacks/Techniques: For a list of all the abilities Spirits can grant Galeem''s puppet fighters see
    here. *Time Bomb: Cross-Type: Galeem creates three to six small objects that explode in plus-shaped
    beams of light like X Bombs. These can be destroyed before their detonation to stop the attack. After
    he loses half his HP, he often creates more. Despite their appearance, they inflict aura damage. *Penetrate:
    Galeem''s wings unravel into two to five drill-like objects which slam through the ground. At low
    health, it will up to six drills instead (enough to fully cover the stage when combined) and perform
    the attack twice in a row. This attack is a meteor smash to aerial characters. *Massive Laser: A crisscrossing
    mass of small purple lines appear on the screen, marking the position of powerful laser beams that
    fire a second later. The beams deal heavy damage but can be avoided with careful positioning to stay
    in the gaps between the beams or with dodging. When Galeem is at low health, more beams are created
    and the attack is done twice in a row. *Exploding Straight Shot: Galeem produces a large blue sphere
    of light, which breaks apart into three to six smaller spheres that attempt to home in on the player.
    When Galeem is at low health, twice as many orbs will appear and will re-aim partway through their
    attack. *Stationary Turret: Galeem''s core splits into three yellow spheres of light, which fire a
    barrage of smaller projectiles. The projectiles can be reflected or absorbed. *Intimidation: Galeem
    releases two to four orbs that produce powerful, slow-moving shockwaves that resemble Tabuu''s Off
    Waves. Like the Off Waves, these cannot be shielded against, and despite not being an OHKO, they require
    careful dodging to avoid taking significant damage and knockback. This is only used in his second
    phase in his second battle only. *Torrent of Light: Galeem covers two sides of the screen with waves
    of light that provide a small, ever-shifting gap of safety between them. At higher difficulties, the
    waves will move erratically at the horizontal axis, and on hard difficilty the waves will move erratically
    on all directions to a point. The attack cannot be shielded against and deals damage every 3 frames
    while the player is in it. If Dharkon is present, each will contribute one wave to the attack. If
    Dharkon is stunned, only one part of the screen is covered. *Energy Bullet: Galeem fires a single
    projectile that strongly homes in on the player, eventually detonating in a large explosion if it
    hits the player, the ground, or stays in the air for too long. *Light Fighter: Galeem vanishes and
    his wings expand, producing two (three on higher difficulties) light false characters to support him.
    These eventually self-destruct after a period of time and their explosion, while not terribly powerful,
    has wide range. If dark false characters are present, they will fight each other. ==Notable Matchups
