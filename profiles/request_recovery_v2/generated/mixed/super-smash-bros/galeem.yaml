- id: claim-powers-and-abilities-90fefe8b
  section: abilities
  axis: hax
  text: Galeem= *Superhuman Physical Characteristics **Space Survival (Can fight without issue in space)
    **Flight (His core naturally levitates off the ground, can quickly fly away as a beam of light) **Possibly
    Enhanced Senses (Galleem and Dharkon noticed the Smashers despite them being very far away) **Large
    Size (Type 1) *Light Manipulation (His core constantly produces light and can release a burst of light.
    Can cover the stage with waves of light. Can shoot many large lasers. Can release two to four orbs
    that produce powerful, slow-moving shockwaves which cannot be shielded against. Possibly finished
    off a weakened Dharkon with his light completely destroying his body) *Electricity Manipulation (Can
    create a large blue sphere of light, which breaks apart into three to six smaller spheres that attempt
    to home in on the player) *Deconstruction, Biological Manipulation & Absorption (Deconstructed and
    absorbed the internal energy of dozens of Master Hands) **Spatial Manipulation (Warped space, creating
    what appears to be a black hole) **Energy Projection/Manipulation, Homing Attack & Danmaku (Shot dozens
    of rays of light that followed their targets.) ***Attack Reflection Negation & Forcefield Negation
    (The rays of light themselves are capable of resisting Attack Reflection due to Zelda, Mewtwo and
    Palutena's reflective moves all failing to work on them.) *Pseudo-Soul Manipulation (Caused multiple
    beings to lose their bodies and become spirits, although these aren't real souls as multiple individuals
    can share the same spirit, ghosts and soulless robots can have spirits too, etc. They are hundreds
    of spirits separated from their bodies and Galeem can manipulate them) *Power Mimicry & Creation (Copied
    the Smash fighters appearance and powers in empty puppets. Eventually did the same to Kirby despite
    not having him captured. Implied to have copied pieces of the fighters' home universes) *Morality
    Manipulation (Forced the spirits to take control of the bodies he made to do his bidding while they
    still keep most of the fighting style of the original owners of the bodies. Controlled dozens of Master
    Hands) *Fire Manipulation & Summoning (Can spit fireballs with enemies to battle inside) *Forcefield
    Creation (Remained in a protective shield that was slowly weakened by the defeat of his minions until
    it disappeared) *Teleportation (Can teleport around the battlefield leaving and emerging in a small
    burst of light) *Body Control & Bodily Weaponry (Can manipulate his body offensively, detaching and
    reincorporating his wings in many ways) *Duplication (Can divide his core in 3. Able to create duplicates
    of the Smash fighters in combat to assist him) *Explosion Manipulation (Can make X Bomb like explosives)
    *BFR (He and Dharkon sent the Smash fighters to battle all the bosses in the game. Can send them to
    battle to boss if they hit a projectile meant to do that) |-|Spirits= While possessing Galeem's Puppet
    Fighters Spirits can grant theses
