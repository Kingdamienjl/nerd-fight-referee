- id: claim-weaknesses-b9b94e57
  section: weaknesses
  axis: weakness
  text: 'His wings can be broken, causing a delay in his most powerful attacks. Furthermore, Tabuu''s
    Off Waves will become weaker should his wings ever be broken. Most of his moves are rather predictable
    and some can even leave him open for attacks. Cannot leave Subspace Feats: *Controlled and casually
    defeated Master Hand. *Turned many of the game''s fighters (except for Sonic who came very late into
    the story mode) into trophies in one hit. Notable Attacks/Techniques: thumb|400px|Tabuu subduing Master
    Hand *Shark Blade: He transforms into an energy blade and rams into his opponent. *Golden Bracket:
    Transforms into 2 brackets, grabbing his opponent and slamming them down with great force. *Diving
    Slash: Tabuu teleports high up into the air, then changes his arm into a blade and slashes down on
    the target. *Chain of Light: Subdues his opponent with chains of light. This technique was used to
    control Master Hand and manipulate characters such as Ganondorf. Though the control over the target
    ignores durability Tabuu had to first physically perforate his chains into Master Hand''s body, leaving
    wounds on the latter when he got free. *Electrical Shield: The sphere inside Tabuu''s chest comes
    off from his chest and splits into several fragments, emitting electricity while flying around him.
    *Rapid Chops: Chops at the target multiple times, leaving a series of visible purples slashes behind.
    *Ghost Projection: Tabuu splits himself in half and shoots out many ghost images of himself in all
    directions that explode after reaching a certain distance. *Bullet Rain: Teleports to a random area
    and fires a barrage of small bullets at the target, ending the move with a huge energy sphere. *Pinpoint
    Explosions: Points his finger at a single location, causing a deadly explosion. *Dragon Laser: Creates
    a cannon in the shape of a dragon''s maw, using it to fire a powerful laser. *Shuriken Boomerang:
    Throws an enormous energy shuriken which will return to him after being thrown. *Eye Laser: Grows
    to colossal proportions before firing lethal beams from his eyes. *Off Waves: Sprouts an ornate pair
    of wings, briefly charging up energy before releasing an attack capable of scouring the area clean
    of life. Tabuu''s wings play a large roll in this attack, as the destruction of his wings will cause
    the attack to emit weaker waves, albeit ones still capable of one-shotting his opponents. ==Notable
    Matchups== Victories: Losses: Inconclusive: {{discussions}} Category:Characters Category:Super Smash
    Bros Category:Afterimage Users Category:Antagonists Category:Body Puppetry Users Category:Chain Users
    Category:Crossover Characters Category:Duplication Users Category:Durability Negation Users Category:Energy
    Weapon Users Category:Fighting Game Characters Category:Final Bosses Category:Flight Users Category:Forcefield
    Users Category:Game Bosses Category:Game Characters Category:Magic Users Category:Primary Antagonists
    Category:Reality Warpers Category:Resurrection Users Category:Teleportation Users Category:Temperature
    Users Category:Villains Category:Weapon Masters Category:Weapon Users Category:Light Users Category:Evil
    Characters Category:Sadists Category:Misanthropes Category:Silent Characters Category:Video Game Characters
    Category:Toys Category:Blade Users Category:Boomerang Users Category:Shuriken Users Category:Thrown
    Weapon Users Category:Eye Users Category:Wing Users Category:Humanoid Characters'
