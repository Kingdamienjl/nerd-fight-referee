    side of the planet, explicitly incomparable to his AP by the end of itNote that the destruction seen
    inside Popstar continues offscreen before reaching the other side of the planet, only visually reaching
    earth with some magma in it. The measure that goes up to "999.99" both doesn't stand for anything
    and is just a point of reference for the game rather than distance, as its highest value unevenly
    reaches a much higher distance than anything lower.). Higher physical range with some Boost Orbs (If
    they increase the range of his attacks), Tens of Meters with Scope Shot gun, Interdimensional via
    Dimensional Travel (Via Warp Star [See its Feats]) | As before, Hundreds of Kilometers via Extrasensory
    Perception (Around 2000 kilometers; Can sense King Dedede and Meta Knight's presences with an ominous
    power somewhat different than what they had before from outside the Buddy Fighters Tower, which surpassed
    orbit and had the latter two on top of it)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-standard-equipment-f11724e9
  section: equipment
  axis: equipment
  text: '{{#tag:tabber|{{!}}-{{!}}Pre-Star Allies= As before, *Healing (Various food items & Maxim Tomato)
    *Statistics Amplification (Invincible Candy, Boost Orbs. Enhanced thievery with Cashgrabber Boost
    Orb; Increases the number of things he can steal from enemies) *Invulnerability (Invincible Candy)
    *Explosion Manipulation (Balloon Bomb & Cracker) *Forcefield Creation (Prism Shield & parasol) *Invisibility
    (Invisibility Stone, Invisibility Boost Orb) *Intangibility (Invisibility Stone) *Dimensional Travel
    and Time Travel (Warp Star) *Likely Self-Resurrection (Reviving Tomato; Only works once. Has shown
    that he can be in possession of a Reviving Tomato which he gives to Kirby,Kirby: Triple Deluxe''Kirby:
    Planet Robobot or in non-canon side content to King Dedede, however Bandana Dee never demonstrated
    to use it) *Minor Water Manipulation (With his parasol) *Fire Manipulation (Superspicy Curry Boost
    Orb) *Limited Instinctive Action (Deflector Boost Orb) *Berserk Mode (Berserk Boost Orb) *Resistances
    to **Life Manipulation (Invincible Candy; While under its effects, he''s invulnerable to being one-shotted
    by Dethskullks, who "suck the life force out of anyone they touch" & are careful to not use that power
    on each other.Kirby and the Rainbow Curse Characters in Ghost form can''t absorb a little bit of life
    from targets using an Invincible Candy) **Sound Manipulation (Invincible Candy; Makes him invulnerable
    to attacks from Kirbys using the Bell Copy Ability and characters using the Mike item) {{!}}-{{!}}Post-Star
    Allies= As before *Statistics Amplification (Power-Up Hearts, which increase strength, health or speed
    of all allies at once) *Healing (Power-Up Hearts) *Summoning (Can summon Helpers by directly throwing
    Friend Hearts to Copy Essences. Can summon a Dream Friend using the Dream Rod) *Homing Attack (Star
    Allies Sparkler) *Further Limited Instinctive Action (Auto-Guards Story Items; Let''s him Guard automatically
    every so often) *Statistics Amplification (Cheer Pom-Poms, many Story Items) *Curse Manipulation (Some
    Story Items work due to being cursed) *Power Nullification & Soul Manipulation (Cursed Anti-Ghost
    Ring; Stops enemies, himself and an ally from becoming ghosts, which they otherwise do after getting
    knocked out/dying to keep fighting and try to revive themselves) *Resistance to **Explosion Manipulation
    (Anti-Explosion Charm) **Sound Manipulation (Anti-Mike Charm) }}'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-00eb5356
  section: power_scale
  axis: battle_iq
  text: 'Below Average in general, vast combat skills. Portrayed as slightly submissive, emotional, and
    with an unreasonably low regard for his own abilities, Bandana Dee has childish goals and reactions
    to things, but works around what he aims to do with the competence of a young teenager. He''s humble
    and will act heroic when needed to. Like other Kirby characters, his intelligence in combat is another
    story entirely; A master spear wielder and an experienced combatant who has gone toe to toe alongside
    Kirby on multiple occasions. Possesses vast combat skills due to being able to contend with, and defeat,
    foes with either some notable edge in power, competent combat skills, experience, complex attack patterns
    that require coordination to dodge, use abilities that give them a reasonable advantage mid-combat,
    or a combination of those factors, those being: Metal General, Landia EX, Magolor EX, Magolor Soul
    (In canon and in side content against the stronger, more complext Magolor Soul of the updated The
    True Arena), Galacta Knight (Side content), Crowned Doomer (Side content), the Master Crown possessing
    the Red Fruit (Side content), many Kirby clones as good as the original, Meta Knight | As before.
    Adding to that list of foes: The Three Mage-Sisters, Hyness, Void Termina (In canon, and the stronger
    version in side content), Parallel Meta Knight, Morpho Knight (Galacta Knight-absorbed regular and
    EX form in side content, Soul Forgo-absorbed in canon), many Kirbys, Bandana Waddle Dees, Magolors
    of a magic tower, Shadow Kirby, Meta Knight & Dedede (As a team), the real Kirby (In side content),
    Phantom Meta Knight, Fecto Elfilis & Chaos Elfilis'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-c8d26fee
  section: weaknesses
  axis: weakness
  text: 'None notable Note: Scans were presented stating Super Star Ultra Bandana Dee to be "A very weak
    enemy character" and having "gone to great lengths to become a mid-boss," which supports Helpers being
    on his level and him having trained further from the crack in Popstar he could already do earlier
    that game & in Super Star. However, the source of these scans is currently unknown, and so they can''t
    be used until the name of the Japanese guide they come from can be provided. == Notable Attacks/Techniques==
    Note that there is no distinction between his keys in this section. |-|Unique'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8bbd0f39
  section: abilities
  axis: hax
  text: By himself= {{#tag:tabber|{{!}}-{{!}}Pre-Return to Dream Land= *Superhuman Physical Characteristics
    *Longevity *Small Size (Type 1. Comparable to Kirby, whose 20 cm/"8 inches" tall. Added to his flexibility,
    he can dodge certain attacks by crouching if judged convenient) *Toon ForceSee the "Notable Attacks/Techniques"
    section below for evidence and/or clarifications. **Immortality (Type 3) & Regeneration (Mid. As a
    Waddle Dee, his own feats being shown as a Star Ally) **Elasticity (Waddle Dees can collide into something
    and briefly warp their bodies like a plastic ball. Can survive being flattened and immediately restore
    his shape) **Extrasensory Perception & Automatic Translation (Senses what fellow Waddle Dees say,
    who talk as per onomatopoeia) *Self-Sustenance (Type 1Kirby's Return to Dream Land & Kirby's Return
    to Dream Land Deluxe) *Non-Physical Interaction (Waddle Dees can affect souls, which Bandana Dee later
    shows doing on Wapods and characters in their Ghost formsKirby Fighters 2) *Flight (Should be able
    to use the Infinity Jump, as random Parasol Waddle Dees and enemies turned Helped have it, and Bandana
    Dee later shows having it) *Resistance to cosmic radiation (Can survive in space, as shown later in
    his life) {{!}}-{{!}}Pre-Star Allies= {{#tag:tabber| {{!}}-{{!}}
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
