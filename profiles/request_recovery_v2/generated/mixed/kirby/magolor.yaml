power_scale:
  tier:
    text: '{{Unknown}} himself and with the Lor Starcutter | {{4-A}}, {{4-A}} for the Lor Starcutter |
      {{2-C}} | {{2-C}}'
    source_ids: &id002
    - mediawiki-91529
    confidence: 0.95
  attack_potency:
    text: Unknown physically (Didn't display many feats of power or scaling until losing the crown, afterwards
      having reasons to have gotten more powerful) and with the Lor Starcutter (Used it to fight Landia
      off-screen, losing that battle. The Lor's power varies to reflect the heart/mind of its user; It
      was stated that perhaps Lor "hid its true power" wanting to be stopped, which may be around this
      time. At best, it's possible the Lor may use a higher power when not used in service to Magolor's
      goal of getting the crown, but this is unknown)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Unknown travel speed, Massively FTL+ reactions & combat speed himself (Piloted the Lor Starcutter
      to quickly cover interstellar distances through obstacles in the way, twice. Can perform actions
      at around the same speed as Kirby, Meta Knight, King Dedede, Bandana Waddle Dee, Grand Doomer, Metal
      General, and Landia. Can perform actions inside inter-dimensional rift areas and teleport out before
      being reached by Dimension Walls, which move in tandem with a flying Landia & the Lor Starcutter),
      Massively FTL+ with the Lor Starcutter (As mentioned before. It's hiding its true power [See AP],
      so it doesn't scale to speed feats shown later on)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Below Average Human (Struggles to lift the likes of Kirby or King Dedede)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Unknown
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "Unknown physically, Multi-Solar System level for the Lor Starcutter (Fought and lost against\
      \ Landia off-screen, escaping as its pieces were blown away and the ship because dysfunctional;\
      \ Later, when repaired, took two attacks from Landia \u2014 damaged but still functional)"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Bellow Average (Struggles to lift the likes of Kirby or King Dedede, if he can do so as many
      times as they fall into a pit)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Below Standard Melee Range physically, Interdimensional via Dimensional Travel & Enhanced Senses
      for Magolor (From Kirby's universe or the dimension where the main Halcandra is, he can appear anywhere
      in Kirby & co.'s quest, including dimensions inside Another Dimension, teleporting in rather than
      using the available dimensional rifts/portals. Somehow knows when to do so to save Kirby & co. from
      falling into pits, appearing instantly), Thousands of Kilometers via Enhanced Senses (As before,
      being on his ship in the "center" of Planet Popstar, joining Kirby & co. near the edges of the planet),
      Unknown physically, Interdimensional via portals for the Lor Starcutter (It has a bigger size than
      Magolor, but its abilities may be less powerful than how they would be shown to be later) |-|Phase
      1 & Magolor EX
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius. A genius engineer, as well as an educated magicial, competent combatant, skilled liar,
      knowledgeable in the multiverse & ancient history, and with ambitions to conquer the universe. |-|As
      an engineer= See here. Mixes magic with his technological achievements, invalidating an unknown
      amount of the engineering skills he would need to apply. Repeatedly repaired a futuristic sci-fi
      vehicle. Repeatedly created pocket realms of various sizes within small structures, and made a couple
      of theme park with those gimmicks. Potentially built a number of stat-increasing items, many of
      them having absurd powers. Built Merry Magoland, which serves as "the best theme park in the whole
      universe," being able to receive beings from all over the universe and even other realities, housing
      and entertaining them in an apparently impossible manner, given their diverse body structures. |-|General
      cunning and knowledge= See here. Known as a deceiver and a trickster by the narrative, Magolor is
      a very smooth talker who is talented at using others to achieve his goals. That said, while skilled,
      he is not a genius in that specific regard. Magolor wants to conquer the universe, a goal he can
      succeed in doing if given the chance; The sheer amount of beings and the differences between them
      in the main Kirby universe are those of a vast sci-fi setting, necessitating Magolor to be an immensely
      capable individual to be their overlord. Although his activities as a ruler would have been unknown.
      He knew about Kirby from the beginning, knows about Kirby's universe, Another Dimenion (a complex
      series of many realities), has traveled to many realities, and knows about the ancients. Runned
      a Shoppe in a medieval setting, making it "number one in the whole Dream Kingdom" on a short amount
      of time. Skilled magician, with some unclear knowledge over his own magical capabilities and the
      supernatural. |-|As a fighter= See here. A crafty combatant by himself, Magolor holds a great combat
      performance against the most capable warriors of the series, whose characteristics range from impressive
      to legendary.
    source_ids: *id002
    confidence: 0.95
