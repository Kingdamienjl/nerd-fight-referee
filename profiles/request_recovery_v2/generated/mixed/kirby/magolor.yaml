  text: "{{#tag:tabber|{{!}}-{{!}}Pre-Master Crown= As in base, access to Gordos (To throw aroundNinja\
    \ Dojo on higher levels when played in the Lor \xB7 Kirby's Return to Dream Land Deluxe) {{!}}-{{!}}Post-Magolor\
    \ Epilogue= As before, *Statistics Amplification (Fruit Fragments, Power-Up Hearts [which increase\
    \ strength, health or speed of all allies at once], Cheer Pom-Poms, many Story Items) *Invulnerability\
    \ (Invincibility Candy) *Healing (Various food items, Gem Apples, Power-Up Hearts) *Self-Resurrection\
    \ (Fruit Fragments [partially], Gem Apples [3 carried Gem Apples can be used to revive and fully heal\
    \ their user & his allies, Magolor should be able to utilize this function of them. As a seller who\
    \ gains them as currency in a well-known Shoppe, he should have more than a member of Team Kirby,\
    \ who can own hundreds of them during & at the end of their adventures. 1 Kirby would end up paying\
    \ him hundreds of Gem Apples by buying all his merchandises) *Summoning (Can summon Helpers by directly\
    \ throwing Friend Hearts to Copy Essences. Can summon a Dream Friend using the Dream Rod) *Homing\
    \ Attack (Star Allies Sparkler) *Limited Instinctive Action (Auto-Guard; Let's him Guard automatically\
    \ every so often) *Curse Manipulation (Some Story Items work due to being cursed) *Power Nullification\
    \ & Soul Manipulation (Cursed Anti-Ghost Ring; Stops enemies, himself and an ally from becoming ghosts,\
    \ which they otherwise do after getting knocked out/dying to keep fighting and try to revive themselves)\
    \ Resistances to: *Life Manipulation (Invincible Candy; Other users of it show being invulnerable\
    \ to being one-shotted by Dethskullks, who \"suck the life force out of anyone they touch\" & are\
    \ careful to not use that power on each other.Gameplay & Dethskullk's figurine \xB7 Kirby and the\
    \ Rainbow Curse Characters in Ghost formFor example Kirby, Bandana Waddle Dee or Meta Knight can't\
    \ absorb a little bit of life from targets using an Invincible Candy) *Sound Manipulation (Invincible\
    \ Candy [Users are invulnerable to attacks from Kirbys using the Bell Copy Ability and characters\
    \ using the Mike item], Anti-Mike Charm) *Explosion Manipulation (Anti-Explosion Charm) }} |-|Pre-Master\
    \ Crown"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-e1415089
  section: power_scale
  axis: battle_iq
  text: Genius. A genius engineer, as well as an educated magicial, competent combatant, skilled liar,
    knowledgeable in the multiverse & ancient history, and with ambitions to conquer the universe. |-|As
    an engineer= See here. Mixes magic with his technological achievements, invalidating an unknown amount
    of the engineering skills he would need to apply. Repeatedly repaired a futuristic sci-fi vehicle.
    Repeatedly created pocket realms of various sizes within small structures, and made a couple of theme
    park with those gimmicks. Potentially built a number of stat-increasing items, many of them having
    absurd powers. Built Merry Magoland, which serves as "the best theme park in the whole universe,"
    being able to receive beings from all over the universe and even other realities, housing and entertaining
    them in an apparently impossible manner, given their diverse body structures. |-|General cunning and
    knowledge= See here. Known as a deceiver and a trickster by the narrative, Magolor is a very smooth
    talker who is talented at using others to achieve his goals. That said, while skilled, he is not a
    genius in that specific regard. Magolor wants to conquer the universe, a goal he can succeed in doing
    if given the chance; The sheer amount of beings and the differences between them in the main Kirby
    universe are those of a vast sci-fi setting, necessitating Magolor to be an immensely capable individual
    to be their overlord. Although his activities as a ruler would have been unknown. He knew about Kirby
    from the beginning, knows about Kirby's universe, Another Dimenion (a complex series of many realities),
    has traveled to many realities, and knows about the ancients. Runned a Shoppe in a medieval setting,
    making it "number one in the whole Dream Kingdom" on a short amount of time. Skilled magician, with
    some unclear knowledge over his own magical capabilities and the supernatural. |-|As a fighter= See
    here. A crafty combatant by himself, Magolor holds a great combat performance against the most capable
    warriors of the series, whose characteristics range from impressive to legendary.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-23e6dbd7
  section: weaknesses
  axis: weakness
  text: None notable | Would theoretically lose his powers without the Master Crown, or at least be greatly
    weakened (Although it doesn't fall off in combat, even after the crown was hit by a giant sword) |
    He's being possessed by the Master Crown | None notable ==Notable Attacks/Techniques== ===In base===
    This state has been referred to as "regular form" in-universe. |-|Unique
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ea034390
  section: abilities
  axis: hax
  text: "Base= {{#tag:tabber|{{!}}-{{!}}Pre-Master Crown= *Superhuman Speed *Non-Physical Interaction\
    \ (Can physically & magically affect Void SoulAs later shown from Kirby Star Allies onwards and characters\
    \ in their Ghost formAs later shown in Kirby Fighters 2) *Genius Intelligence *Small Size (Type 1.\
    \ Comparable to Kirby, whose 20 cm/\"8 inches\" tall. Added to his flexibility, he can dodge certain\
    \ attacks by crouching if judged convenientAs shown from \"Magolor Epilogue\" (Kirby's Return to Dream\
    \ Land Deluxe) onwards) *Toon Force **Limited Transmutation (Can turn a katana into a mini Lor StarcutterSamurai\
    \ Kirby when played in the Lor \xB7 Kirby's Return to Dream Land Deluxe) **Dimensional Storage (Can\
    \ collect Fruit Fragments into himself. Star Allies collected the Heart Spears into themselves) **Elasticity\
    \ (Can survive being flattened and immediately restore his shape) *Self-Sustenance (Type 1) *Enhanced\
    \ Senses (Unexplored; somehow knows exactly when & where to teleport in to save Kirby & co. if they\
    \ fall on pits during their quest while himself busy inside his shipHelper Magolor mode, Story Mode\
    \ \xB7 Kirby's Return to Dream Land Deluxe) *Vehicular Mastery (Used the Lor Starcutter to quickly\
    \ cross Another Dimension's Road\"Let Me Explain Everything\" cutscene \xB7 Kirby's Return to Dream\
    \ Land & Kirby's Return to Dream Land Deluxe twice,\"Halcandra: A New Enemy\" cutscene \xB7 Kirby's\
    \ Return to Dream Land & Kirby's Return to Dream Land Deluxe when that road has obstacles in it.Level\
    \ 8: Another Dimension \xB7 Kirby's Return to Dream Land & Kirby's Return to Dream Land Deluxe He\
    \ drove his ship to do this, before knowing it was sentientMagolor's 1\xBA 120 Energy Spheres dialogue,\
    \ before the battle against Landia, Jpn. version, Story Mode \u2022 Kirby's Return to Dream Land Deluxe)\
    \ *Magic (A wizard, most of his abilities either require or are greatly powered by magic) **Flight\
    \ (Slightly hovers normally as he stands still, walks or runs, and can fly higher in the sky or space)\
    \ **Teleportation (Can instantly teleport across Planet Popstar) ***Dimensional Travel (Went from\
    \ the reality where the Dream Kingdom is located to the dimension where the main Halcandra is by unknown\
    \ means, before having the Lor. Can appear anywhere in Kirby & co.'s quest, including the dimension\
    \ where Grand Doomer is fought, and the inter-dimensional rift areas, teleporting in to do so) ***Time\
    \ Travel (The latter areas occur in the future after Magolor's defeat) **Energy Manipulation & Projection\
    \ (Via Magic Sphere and Team Attack. Can move around energy) ***Absorption (After losing most of his\
    \ power, he could still absorb hundreds of Magic Points, and defeated foes got their Magic Points\
    \ attracted into Magolor) **Electricity Manipulation (Via Magic Sphere) **Limited Transmutation (Can\
    \ briefly turn others into energy to move them around) *Intangibility, Transformation & Transmutation\
    \ (Can turn into a small ball of intangible energy via Space Jump, any carried item is transformed\
    \ too) *Resistance to extreme cold and cosmic radiations (Shown to survive fine in outer space) With\
    \ Preparation time: *Statistics Amplification (Has medicine that doubles Kirby's health) *Space Creation\
    \ & Pocket Reality Manipulation (Made many mani-games with massive rooms, worlds, or interstellar-sized\
    \ realities inside his Lor Starcutter. Had all kinds of self-propelling games in them, from objects\
    \ moving on their own to the realities changing colors) **Those games make use of all kinds of enemies,\
    \ robots, and weapons {{!}}-{{!}}Post-Magolor Epilogue"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
