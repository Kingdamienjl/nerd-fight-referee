  intelligence:
    text: "Average. An egocentric, silly, comedically short-sighted \"king\" in a world with lower standards\
      \ than in reality. Capable of competent decisions and learning skills. Very skilled in combat. {{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content=\
      \ |-|General= {{#tag:tabber| {{!}}-{{!}}Pre-Star Allies= *Being repeatedly stated to be a self-proclaimed\
      \ king, his rulership and all such benefits came from a dishonest portrayal of himself, fooling\
      \ the silly creatures of Dream Land. Given his character, Dedede most likely didn't aim to improve\
      \ his life or expand his influence, rather, he was likely so proud, he genuinely crowned himself\
      \ king or believed himself to be the king. *Regularly responsible for the adventures Kirby has to\
      \ go through across some titles, organizing games to play with & to beat up Kirby, or doing frivolous\
      \ crimes with some level of resistance for Kirby to overcome before reaching Dedede. While this\
      \ was more common in early games of the series, it's implied that the daily life of the characters\
      \ still includes doing things like this off-screen, with Dedede misbehaving, having many battles\
      \ with Kirby, and Kirby needing to punish him.Nintendo Dream issue of May, 2023 **Implied toRevenge\
      \ of The King in-game description \xB7 Kirby Super Star Ultra be casualMasked Dedede's Jpn. pause\
      \ description \xB7 Kirby: Triple Deluxe during many confrontations with Kirby and with challenges\
      \ he gives to him, those being akin to pranks and games for his part that his opposition overcomes\
      \ rather easily. When serious, his challenges are portrayed as difficult to Kirby, the latter needing\
      \ to be careful with them. **Dedede has been stated and portrayed as the one laying traps along\
      \ the way of levels Kirby goes throughKirby's Dream Course Instruction Booklet page 5Nintendo Power\
      \ volume 48 page 85, on occasion. *After the first game Dedede trained remarkably to copy Kirby's\
      \ way to flight\u300C20th Anniversary \u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u30D7\u30D7\u30D7\u5927\
      \u5168\u300D(\"20th Anniversary Kirby of the Stars Pupupu Encyclopedia\"), page 16\u300C20th Anniversary\
      \ \u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u30D7\u30D7\u30D7\u5927\u5168\u300D(\"20th Anniversary Kirby\
      \ of the Stars Pupupu Encyclopedia\"), page 119, becoming able to fly by the second game. *Somehow\
      \ noticed Nightmare's ambition of controlling Dream Land with nightmares\u661F\u306E\u30AB\u30FC\
      \u30D3\u30A3 \u5922\u306E\u6CC9\u306E\u7269\u8A9E \u5FC5\u52DD\u653B\u7565\u6CD5 (\"Kirby of the\
      \ Stars: The Story of the Fountain of Dreams - Sure-Win Strategy Guide\"), page 127; This was back\
      \ when Nightmare was an actual nightmare, before being made real, Nightmare being inside the Fountain\
      \ of Dreams, with Dedede understanding that removing the Star Rod would cut him off. The Star Rod\
      \ is what powers the Fountain of Dreams, which is what allows the beings in Dream Land to be able\
      \ to dream in the first place\u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u5922\u306E\u6CC9\u306E\u7269\
      \u8A9E \u53D6\u6271\u8AAC\u660E\u66F8 (\"Kirby of the Stars: The Story of the Fountain of Dreams\
      \ instruction manual\"), page 3. Dedede then split the Star Rod into 7 pieces and entrusted them\
      \ to his minions\u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u5922\u306E\u6CC9\u306E\u7269\u8A9E \u53D6\
      \u6271\u8AAC\u660E\u66F8 (\"Kirby of the Stars: The Story of the Fountain of Dreams instruction\
      \ manual\"), page 5, succeeding at stopping Nightmare at the cost of everyone on Dream Land not\
      \ being able to dream anymore. Dedede neglected to explain the situation to a dream-deprived Kirby,\
      \ leading to the hero eventually undoing his work. {{!}}-{{!}}Post-Star Allies= *Got unwillingly\
      \ transported into another reality, a world with no civilizations to rely on, only ruins & enemy\
      \ beasts that could attack; Dedede managed to survive for \"several months\"Nintendo Dream magazine,\
      \ issue of June, 2022 on his own, displaying survival skills. *Gave Kirby a blueprint for a mechanic\
      \ to further evolve Kirby's Hammer ability into a version using Dedede's hammers, a mask he used\
      \ to have, and with new superpowers. }} |-|Leadership and influence= Rules over parts of Dream Land,\
      \ commanding everyone willing to follow him; Dream Land is filled with silly creatures, unintelligent\
      \ in an uneven way, forming a relatively normal society. Dedede is never shown doing any traditional\
      \ kingly duties though. Note that enemies such as Waddle Dees \"have no intention to fight, they\
      \ always get involved in trouble, like being inhaled by Kirby just by walking around\". In other\
      \ words, regular enemies and mid-bosses on-screen in Kirby don't always work for the main villain\
      \ to battle Kirby & co., unless specified. *In the story of the first game, Dedede commands many\
      \ underlings and attacks Dream Land\u661F\u306E\u30AB\u30FC\u30D3\u30A3\u30B9\u30FC\u30D1\u30FC\u30C7\
      \u30E9\u30C3\u30AF\u30B9100%\u653B\u7565book (\"Kirby of the Stars Super Deluxe 100% Strategy Book\"\
      ), unknown page, it's stated that his underlings are coming to challenge Kirby\u661F\u306E\u30AB\
      \u30FC\u30D3\u30A3 \u30A6\u30EB\u30C8\u30E9\u30B9\u30FC\u30D1\u30FC\u30C7\u30E9\u30C3\u30AF\u30B9\
      \ \u30B6\u30FB\u30B3\u30F3\u30D7\u30EA\u30FC\u30C8\u30AC\u30A4\u30C9 (\"Kirby of the Stars Ultra\
      \ Super Deluxe The Complete Guide\"), unknown page. This proves the regular enemies and mid-bosses\
      \ Kirby faces across the levels to be working for Dedede. *Dedede organized a similar amount of\
      \ more powerful enemies over Dream Land during Revenge of the King. Commanded several mid-bosses\
      \ to battle Kirby (& a Helper) in his castle. *The enemies on his castles all across the series\
      \ are implied to work there. **Their defenses and fire power are portrayed as und"
    source_ids: *id002
