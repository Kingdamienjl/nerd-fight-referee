- id: claim-stamina-ce0dd7ef
  section: power_scale
  axis: stamina
  text: "Superhuman. On par with Kirby and Meta Knight. Seemingly unaltered without being able to dream,\
    \ which made everyone in Dream Land feel restless and irritable, even by the time Kirby completed\
    \ most of his adventure and fought DededeKirby's Adventure. Fought Kirby from the night until the\
    \ sunset in the story of the first gameSpring Breeze \xB7 Kirby Super Star Ultra, then the same happened\
    \ some time later, if Kirby had to first spend some time in Dedede's castle as a level, with the windows\
    \ showing it was still night when he reached Dedede. Capable of defeating Queen Sectonia, Shadow Dedede,\
    \ and Dark Meta Knight in a gauntlet style fight | Superhuman. As before. Along other Star Allies,\
    \ he can chase the Jamba Heart pieces several times across the Story Mode, covering some parts of\
    \ several planets and moons, if they chased the pieces via a Warp Star while over Planet Popstar (Level\
    \ 2 map) and between celestial bodies (Level 4 map). 4 of any Star Ally can complete an adventure\
    \ of several levels and bosses without any notable rest, ultimately defeating Zan Partizanne, Hyness\
    \ (2 phases), and Void Termina (4 phases) one after another"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-range-d1b4549e
  section: power_scale
  axis: range
  text: "Below Standard Melee Range physically (A little more than twice as big as Kirby, who is 20cm\
    \ tall), Standard Melee Range to Extended Melee Range with limited forms of Energy Projection and\
    \ throwable weapons that doesn't extend much from his body, Kilometers or Tens of Kilometers via spitting\
    \ (8 to 14.5 kilometers; Spat Kirby into Planet Popstar's atmosphere), up to Planetary length in destructive\
    \ capacity (A fully changed & prepared strike can create a thin crack going from one side of Planet\
    \ Popstar to the opposite side of the planet, explicitly incomparable to his AP by the end of itCrackity\
    \ Hack \xB7 Kirby's Return to Dream Land DeluxeNote that the destruction seen inside Popstar continues\
    \ offscreen before reaching the other side of the planet, only visually reaching earth with some magma\
    \ in it. The measure that goes up to \"999.99\" both doesn't stand for anything and is just a point\
    \ of reference for the game rather than distance, as its highest value unevenly reaches a much higher\
    \ distance than anything lower.. Higher physical range with some Boost Orbs (If they increase the\
    \ range of his attacks), Interdimensional via Dimensional Travel (Via Warp Stars [See their feats]),\
    \ Tens of Meters with Scope Shot gunKirby's Return Dream Land"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-standard-equipment-40db359e
  section: equipment
  axis: equipment
  text: '{{#tag:tabber|{{!}}-{{!}}Pre-Star Allies= As before, *Healing (Sparkling Stars, Maxim Tomato,
    various food items) *Statistics Amplification (Invincible Candy, Boost Orbs. Enhanced thievery with
    Cashgrabber Boost Orb; Increases the number of things he can steal from enemies) *Invulnerability
    (Invincible Candy) *Explosion Manipulation (Balloon Bomb & Cracker) *Forcefield Creation (Prism Shield)
    *Invisibility (Invisibility Stone, Invisibility Boost Orb) *Intangibility (Invisibility Stone) *Further
    Teleportation (Ninja Dojo equipment) *Dimensional Travel and Time Travel (Warp Star) *Self-Resurrection
    (Reviving Tomato) *Self-Size Manipulation (Sparkling Star, which can make him around 20 times larger
    than KirbyKirby JP Twitter, post of Jul 12, 2017) *Enhanced Air Manipulation (Big Air Bullet Boost
    Orb) *Limited Instinctive Action (Deflector Boost Orb) *Berserk Mode (Berserk Boost Orb) *Resistance
    to Life Manipulation (Invincible Candy; Other users of it show being invulnerable to being one-shotted
    by Dethskullks, who "suck the life force out of anyone they touch" & are careful to not use that power
    on each other. Characters in Ghost formFor example Kirby, Bandana Waddle Dee or Meta Knight can''t
    absorb a little bit of life from targets using an Invincible Candy) *Sound Manipulation (Invincible
    Candy; Users are invulnerable to attacks from Kirbys using the Bell Copy Ability and characters using
    the Mike item) {{!}}-{{!}}Post-Star Allies= As before, *Summoning (Can summon Helpers by directly
    throwing Friend Hearts to Copy Essences. Can summon a Dream Friend using the Dream Rod) *Statistics
    Amplification (Power-Up Hearts, Cheer Pom-Poms) *Further Healing (Power-Up Hearts) *Homing Attack
    (With Star Allies Sparkler) }} |-|Dededestroyer Z= Same as by himself, but he''s now driving a robot
    with the following'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-b5413b58
  section: power_scale
  axis: battle_iq
  text: "Average. An egocentric, silly, comedically short-sighted \"king\" in a world with lower standards\
    \ than in reality. Capable of competent decisions and learning skills. Very skilled in combat. {{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content=\
    \ |-|General= {{#tag:tabber| {{!}}-{{!}}Pre-Star Allies= *Being repeatedly stated to be a self-proclaimed\
    \ king, his rulership and all such benefits came from a dishonest portrayal of himself, fooling the\
    \ silly creatures of Dream Land. Given his character, Dedede most likely didn't aim to improve his\
    \ life or expand his influence, rather, he was likely so proud, he genuinely crowned himself king\
    \ or believed himself to be the king. *Regularly responsible for the adventures Kirby has to go through\
    \ across some titles, organizing games to play with & to beat up Kirby, or doing frivolous crimes\
    \ with some level of resistance for Kirby to overcome before reaching Dedede. While this was more\
    \ common in early games of the series, it's implied that the daily life of the characters still includes\
    \ doing things like this off-screen, with Dedede misbehaving, having many battles with Kirby, and\
    \ Kirby needing to punish him.Nintendo Dream issue of May, 2023 **Implied toRevenge of The King in-game\
    \ description \xB7 Kirby Super Star Ultra be casualMasked Dedede's Jpn. pause description \xB7 Kirby:\
    \ Triple Deluxe during many confrontations with Kirby and with challenges he gives to him, those being\
    \ akin to pranks and games for his part that his opposition overcomes rather easily. When serious,\
    \ his challenges are portrayed as difficult to Kirby, the latter needing to be careful with them.\
    \ **Dedede has been stated and portrayed as the one laying traps along the way of levels Kirby goes\
    \ throughKirby's Dream Course Instruction Booklet page 5Nintendo Power volume 48 page 85, on occasion.\
    \ *After the first game Dedede trained remarkably to copy Kirby's way to flight\u300C20th Anniversary\
    \ \u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u30D7\u30D7\u30D7\u5927\u5168\u300D(\"20th Anniversary Kirby\
    \ of the Stars Pupupu Encyclopedia\"), page 16\u300C20th Anniversary \u661F\u306E\u30AB\u30FC\u30D3\
    \u30A3 \u30D7\u30D7\u30D7\u5927\u5168\u300D(\"20th Anniversary Kirby of the Stars Pupupu Encyclopedia\"\
    ), page 119, becoming able to fly by the second game. *Somehow noticed Nightmare's ambition of controlling\
    \ Dream Land with nightmares\u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u5922\u306E\u6CC9\u306E\u7269\u8A9E\
    \ \u5FC5\u52DD\u653B\u7565\u6CD5 (\"Kirby of the Stars: The Story of the Fountain of Dreams - Sure-Win\
    \ Strategy Guide\"), page 127; This was back when Nightmare was an actual nightmare, before being\
    \ made real, Nightmare being inside the Fountain of Dreams, with Dedede understanding that removing\
    \ the Star Rod would cut him off. The Star Rod is what powers the Fountain of Dreams, which is what\
    \ allows the beings in Dream Land to be able to dream in the first place\u661F\u306E\u30AB\u30FC\u30D3\
    \u30A3 \u5922\u306E\u6CC9\u306E\u7269\u8A9E \u53D6\u6271\u8AAC\u660E\u66F8 (\"Kirby of the Stars:\
    \ The Story of the Fountain of Dreams instruction manual\"), page 3. Dedede then split the Star Rod\
    \ into 7 pieces and entrusted them to his minions\u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u5922\u306E\
    \u6CC9\u306E\u7269\u8A9E \u53D6\u6271\u8AAC\u660E\u66F8 (\"Kirby of the Stars: The Story of the Fountain\
    \ of Dreams instruction manual\"), page 5, succeeding at stopping Nightmare at the cost of everyone\
    \ on Dream Land not being able to dream anymore. Dedede neglected to explain the situation to a dream-deprived\
    \ Kirby, leading to the hero eventually undoing his work. {{!}}-{{!}}Post-Star Allies= *Got unwillingly\
    \ transported into another reality, a world with no civilizations to rely on, only ruins & enemy beasts\
    \ that could attack; Dedede managed to survive for \"several months\"Nintendo Dream magazine, issue\
    \ of June, 2022 on his own, displaying survival skills. *Gave Kirby a blueprint for a mechanic to\
    \ further evolve Kirby's Hammer ability into a version using Dedede's hammers, a mask he used to have,\
    \ and with new superpowers. }} |-|Leadership and influence= Rules over parts of Dream Land, commanding\
    \ everyone willing to follow him; Dream Land is filled with silly creatures, unintelligent in an uneven\
    \ way, forming a relatively normal society. Dedede is never shown doing any traditional kingly duties\
    \ though. Note that enemies such as Waddle Dees \"have no intention to fight, they always get involved\
    \ in trouble, like being inhaled by Kirby just by walking around\". In other words, regular enemies\
    \ and mid-bosses on-screen in Kirby don't always work for the main villain to battle Kirby & co.,\
    \ unless specified. *In the story of the first game, Dedede commands many underlings and attacks Dream\
    \ Land\u661F\u306E\u30AB\u30FC\u30D3\u30A3\u30B9\u30FC\u30D1\u30FC\u30C7\u30E9\u30C3\u30AF\u30B9100%\u653B\
    \u7565book (\"Kirby of the Stars Super Deluxe 100% Strategy Book\"), unknown page, it's stated that\
    \ his underlings are coming to challenge Kirby\u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u30A6\u30EB\u30C8\
    \u30E9\u30B9\u30FC\u30D1\u30FC\u30C7\u30E9\u30C3\u30AF\u30B9 \u30B6\u30FB\u30B3\u30F3\u30D7\u30EA\u30FC\
    \u30C8\u30AC\u30A4\u30C9 (\"Kirby of the Stars Ultra Super Deluxe The Complete Guide\"), unknown page.\
    \ This proves the regular enemies and mid-bosses Kirby faces across the levels to be working for Dedede.\
    \ *Dedede organized a similar amount of more powerful enemies over Dream Land during Revenge of the\
    \ King. Commanded several mid-bosses to battle Kirby (& a Helper) in his castle. *The enemies on his\
    \ castles all across the series are implied to work there. **Their defenses and fire power are portrayed\
    \ as und"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-945eaf26
  section: weaknesses
  axis: weakness
  text: "Clumsy & goofy, even when serious (Though to a lesser extent, and it doesn't stop him from fighting\
    \ evenly & defeating foes Kirby may struggle with). Considers his own power, abilities & intelligence\
    \ on a greater regard than those of many others, including people that may match or exceed him in\
    \ those categories. Views his own chances of success as higher than what should be reasonable, all\
    \ while slightly pleasing myself on his own superiority, getting shocked when things don't go his\
    \ way, easily leading to emotional responses such as anger, or sadness when fully defeatedRevenge\
    \ of the King \xB7 Kirby Super Star Ultra'Kirby Battle Royale. May lack long-term thinking and understanding\
    \ of what his actions do beyond the immediate benefit they bring him (Once stole all the food from\
    \ Dream Land for himself & the population's means to get more food, presumably not understanding how\
    \ this would starve them. Scattered Mr. Star's pieces and aimed to own them as prank, presumably not\
    \ understanding the full harm this would cause Mr. Star in an intentionally malicious way). Bullies\
    \ hisPlay Nintendo, King Dedede's description own servantsKirby's Epic Yarn & Kirby's Extra Epic Yarn\
    \ for no reason, if he actually cares about them. While Dedede has many extraordinary features, his\
    \ ability to lead seems to rely mostly on a mix of his subjects' low standards, their attachment or\
    \ friendship to Dedede, and Dedede's ability to pay them off, rather than true leadership and charisma.\
    \ Notes: *Dedede is sometimes shown using mechs, weapons, and technology; As far as we know, and contrary\
    \ to popular belief, he's not the one creating any of them, and WoG has talked about his power-amplifying\
    \ mask only to immediately remark that \"nobody knows where he got it...\" *Dedede being stated to\
    \ rule over all of Dream Land from his castleKirby Squeak Squad Instruction Booklet, page 4 is a mistranslation.\
    \ Dedede is repeatedly stated to be a self-proclaimed king, it's unknown how much of Dream Land he\
    \ actually rules. ==Notable Attacks/Techniques== Note that there is no distinction between his keys\
    \ in this section. ===Without Items=== |-|Unique"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
