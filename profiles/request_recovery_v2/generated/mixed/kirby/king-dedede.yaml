  axis: durability
  text: Low Multiverse level (Can take hits from anyone he can defeat. Often portrayed with higher health
    than his peers in gameplay, a characteristic associated with DededeKirby and the Rainbow Curse) |
    Low Multiverse level (As before. Can take blows from Void Termina in all his forms; The Star Allies
