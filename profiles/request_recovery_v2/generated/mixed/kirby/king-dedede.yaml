- id: claim-lifting-strength-4a5a854e
  section: power_scale
  axis: other
  text: "Multi-Stellar (Can withstand outrunning & outflying near Extra Mode Magolor Soul's Black Hole,\
    \ which quickly rolls the space in the setting shown, including the stars in the background of it,\
    \ and can survive getting sucked in itMagolor Soul battle \xB7 Kirby's Return to Dream Land. His Inhale\
    \ either makes Kirby focus to resist not getting attracted by running away, or simply sucks him in\
    \ right away if he's close) | Multi-Stellar, possibly Universal (As before. Can withstand harmed Black\
    \ Hole attacks from Post-Magolor Epilogue MagolorIf Void Termina or Morpho Knight mind-control Star\
    \ Allies (Like Dedede), Magolor can attack them with his Black Hole move, which they survive defeated.\
    \ \xB7 Kirby Star Allies)"
  source_ids: *id003
  decisive: false
