- id: claim-powers-and-abilities-b43a72cf
  section: abilities
  axis: hax
  text: 'Base= {{#tag:tabber| {{!}}-{{!}}Pre-Star Allies= *Superhuman Physical Characteristics *Longevity
    *Small Size (Type 1: Comparable to Kirby, whose 20 cm/"8 inches" tall. Added to his flexibility, he
    can dodge certain attacks by crouching if judged convenient) *Non-Physical Interaction (Can affect
    Void Soul) *Self-Sustenance (Type 1) *Acrobatics (Can easily do flips) *Social Influencing (Got the
    moon and sun, who are sentient, into a continuous fight. While initially friendly, he convinced Kirby
    to do a quest to stop said fight. It resulted in a wish being granted to Kirby, which Marx stole in
    the last moment, briefly leaving Kirby floating in space) *Flight (Can fly in the air or outer space
