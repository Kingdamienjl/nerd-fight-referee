- id: claim-standard-equipment-f9a071fe
  section: equipment
  axis: equipment
  text: 'As his Post-Star Allies self, on top of the following: *Statistics Amplification (With Power-Up
    Hearts, which increase strength, health or speed of all allies at once) *Healing (With various food
    items and health Power-Up Hearts, which heals all vitality) *Invulnerability (Invincibility Candy)
    *Summoning (Can summon Helpers by directly throwing Friend Hearts to Copy Essences. Can summon a Dream
    Friend using the Dream Rod) *Homing Attack (With Star Allies Sparkler) *Resistances to: **Life Manipulation
    (Invincible Candy; Other users of it show being invulnerable to being one-shotted by Dethskullks,
    who "suck the life force out of anyone they touch" & are careful to not use that power on each other.
    Characters in Ghost formFor example Kirby, Bandana Waddle Dee or Meta Knight can''t absorb a little
    bit of life from targets using an Invincible Candy) **Sound Manipulation (Invincible Candy; Users
    are invulnerable to attacks from Kirbys using the Bell Copy Ability and characters using the Mike
    item)'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
