power_scale:
  tier:
    text: '{{5-A}} | {{4-A}} | {{2-C}}'
    source_ids: &id002
    - mediawiki-57309
    confidence: 0.95
  attack_potency:
    text: "Large Planet level (Fought evenly with Kirby back in Super Star as the final boss of a canon\
      \ minigameMilky Way Wishes \xB7 Kirby Super Star & Kirby Super Star Ultra and of the gameThe Arena\
      \ \xB7 Kirby Super Star & Kirby Super Star Ultra), can ignore durability in some ways | Multi-Solar\
      \ System level (Absorbed the power of NovaMarx Soul's Jpn. pause description \xB7 Kirby Super Star\
      \ Ultra and became significantly stronger than before. Is the final boss of Super Star Ultra [2008],The\
      \ True Arena \xB7 Kirby Super Star Ultra after the defeat of Drawcia [2005]), can ignore durability\
      \ in many ways | Low Multiverse level (Continues from his first Key. Can assist Kirby & two fellow\
      \ Star Ally in the canon defeats of Void Termina15 or 16 universes, Corrupt Hyness, the Retaliators\
      \ Three Mage-Sisters [at once]. Can defeat Morpho Knight EX and the stronger incarnations of Void\
      \ Termina on side content. Can confront Kirby & three Star Allies), can ignore durability in some\
      \ ways"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL+ (Fought Kirby. Can keep up with fellow Star Allies such as Meta Knight, King
      Dedede, Bandana Waddle Dee, Ribbon and the Three Mage-Sisters, and they are comparable to Morpho
      Knight and Void Termina, with whom they can fight. Along with other Star Allies, he can chase and
      keep up with the Jamba Hearts several times, which were suddenly scattered across the galaxy. Can
      fight against four Star Allies alone)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Unknown | Unknown | Multi-Stellar (Can survive harmed Black Holes from Magolor in the same way
      that Kirby, Meta Knight, King Dedede and Bandana Waddle Dee do, who can withstand outrunning and
      outflying near a black hole that quickly rolled the space in the setting shown, including the stars
      in the background of it, and survive getting suck in it), possibly Universal (If Post-Magolor Epilogue
      Magolor is correct about the potency of his Black Hole)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Planet level (Briefly incapacitated Kirby with a kick. Can harm comparable beings by colliding
      onto them) | Multi-Solar System level (Same methodology) | Low Multiverse level (Same methodology,
      able to grab things and kick them at comparable foes as an attack)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Planet level (Took many hits Kirby before being defeated. Then, he survived his defeat
      until his body took a part of Nova's explosion, which destroyed it to small pieces, Nova being a
      planet-sized machine that survived traveling at relativistic speeds [4.63 Ronnatons]. Side content
      portrays that Marx died from this, but his body was not destroyed, and he somehow remained active
      enough to absorb things and power around. In the main timeline, he survived these events without
      being explicitly shown to have died from them) | Multi-Solar System level, regeneration makes him
      difficult to kill | Low Multiverse level (Can take attacks from Void Termina in all his forms; The
      Star Allies Sparkler doesn't cover the bodies of its drivers. Can take attacks from Post-Magolor
      Epilogue Magolor)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman. Comparable to Kirby in combat. After being defeated by Kirby, taking a part of Nova's
      explosion, being left motionless, and having his body with turned off colors, he somehow attracted
      some of Nova's pieces into himself, absorbing Nova's power to revive himself | As before. Could
      still scream rather loud after being bisected in half, without making safe use of his body control,
      moments before dying | Superhuman. As the first key. 4 of any Star Ally can complete an adventure
      of several levels and bosses without any notable rest, ultimately defeating Zan Partizanne, Hyness
      (2 phases), and Void Termina (4 phases) one after another
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically, higher with projectiles | As before, Galactic via teleportation
      (Scaling from Nova) | As his first Key, Interstellar, likely Galactic via Extrasensory Perception
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Average in general, higher in combat (Influenced the sun and moon, sentient celestial bodies,
      to fight against each other for a prolonged amount of time. While initially friendly, he convinced
      Kirby to do a quest to stop said fight: It resulted in a wish being granted to Kirby, which Marx
      stole for himself in the last moment to control Planet Popstar, briefly leaving Kirby floating in
      space. Considering his words, Marx didn''t seem to know Kirby would have the means to come back
      from space. Can keep up in combat with a Kirby using any Copy Ability) | Average, higher in combat
      (Kept in combat with a Kirby who defeated Galacta Knight | Average in general, with vast combat
      skills. Continues from the first Key. Portrayed as displeased at others planning something behind
      his back, with it being left vauge if this refers to the heroes or villains of the story. Then he
      led a small group to defeat those villains (His comment may be aimed at the heroes, for forming
      a group without including him. Or it may be aimed at the villains, with Marx preferring to be added
      to their evil plot, then seeing them as a threat when deciding to oppose them). On a similar double
      meaning, Marx may claim to be bent on taking over the galaxy. His combat skills are able to contend
      with, and defeat, foes with either some notable edge in power, competent combat skills, experience,
      complex attack patterns that require coordination to dodge, use abilities that give them a reasonable
      advantage mid-combat, or a combination of those factors, those being: Meta Knight, the Three Mage-Sisters,
      Hyness, Void Termina, Morpho Knight, Parallel Meta Knight as well as Kirby & 3 of any other Star
      Ally in a 1v4 fight)'
    source_ids: *id002
    confidence: 0.95
