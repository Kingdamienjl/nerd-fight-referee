- id: claim-weaknesses-a717d964
  section: weaknesses
  axis: weakness
  text: 'Somewhat weak to electrical attacks. Notable Attacks/Techniques: *Frenzy: A status effect that
    is the result of a target being forced to process information incomprehensible to humans, such as
    information about the Great Ones, Eldritch Truth, or Cosmos. This effect is a twofold form of damage,
    as when this occurs to a living being they will rapidly devolve into utter madness mentally, while
    physically their blood will begin to violently erupt out of various random points on their body as
    spears of solidified Frenzied Coldblood. *Overhead Whip: A fast forward overhead whip attack. *Spinning
    Whip: A two-hit 360-degree spin attack used when the opponent is behind it, followed by a leap away
    to reposition iself. *Jumping Slam: A long-range jump attack. *Charging Combo: A forward dash combo
    with heavy momentum. *Desperation Combo: A forward running attack with flailing arms. *Regeneration:
    The Moon Presence holds its head and emits white particles of energy. Repairs head and limb damage.
    *Doom Gaze: The Moon Presence holds its head and releases a flash of light that instantly reduces
    the opponent''s HP to 1 regardless of range. Cannot be dodged or blocked. *Numbing Shower: A frontal
    spherical area attack which rains blood that temporarily blocks the opponent''s ability to heal if
    any of it touches them. *Numbing Cloudburst: Summons small clouds from the ground which explode in
    showers of blood. Temporarily blocks the opponent''s ability to heal if it connects. ==Gallery== center|400px
    ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll box|content={{Reflist|2}}}}
    ==Notes/Explanations== {{Scroll box|content=}} {{Discussions}} Category:Characters Category:Bloodborne
    Category:Antagonists Category:Blood Users Category:Bodily Weaponry Users Category:Claw Users Category:Curse
    Users Category:Eldritch Horrors Category:Energy Users Category:Final Bosses Category:Flight Users
    Category:Game Bosses Category:Game Characters Category:Healers Category:Immortals Category:Invisibility
    Users Category:Monsters Category:Large Sized Characters Category:Light Users Category:Madness Users
    Category:Magic Users Category:Mind Users Category:Pocket Reality Users Category:Power Bestowal Users
    Category:Power Nullification Users Category:Primary Antagonists Category:Reality Warpers Category:Telekinesis
    Users Category:Teleportation Users Category:Video Game Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3cfa1749
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Immortality (Types 1 & 2; [Able to function unimpeded
    after receiving injuries as severe as being impaled through the skull and torso and having organs
    ripped outVisceral Attacks], 7 & 9; Great Ones exist on higher, transcendental planes of thoughtIsz
    Root Chalice - According to the Choir, the land of Izs lies in contact with the cosmos, which allowed
    the Great Ones to function on transcendental planes of thought.Eye Rune - Eyes symbolize the truth
    Master Willem sought in his research. Disillusioned by the limits of human intellect, Master Willem
    looked to beings from higher planes for guidance, and sought to line his brain with eyes in order
    to elevate his thoughts. and are able to exist as disembodied spirits even after their physical bodies
    have died) **Large Size (Type 0) **Bodily Weaponry (Conventional; Claws) *Magic *Light Manipulation
    *Energy Projection *Teleportation *Limited Power Nullification (Can prevent the opponent from healing)
    *Blood Manipulation *Telekinesis *Reality Warping (All Great Ones possess the ability to warp reality
    both actively and passively with their mere presence, turning everything around them into twisted
    nightmares) **True Flight **Pocket Reality Manipulation (Possesses full domain over The Hunter''s
    Dream and can warp and change it at will) **Madness Manipulation (Type 3; Merely looking at Great
    Ones or hearing their incomprehensible voices causes one to go insane) **Curse Manipulation (Curses
    are the result of inciting the anger of Great OnesDefiled Chalice - A chalice that breaks a labyrinth
    seal. Only, this defiled chalice is cursed. Curses are caused by inciting the anger of the Great Ones,
    and used to hex others.. Even after the death of her physical body, Kos was able to maintain a perpetual
    curse over The Hunter''s NightmareFishing Hamlet Priest - Byrgenwerth... Byrgenwerth... Blasphemous
    murderers... Blood-crazed fiends... Atonement for the wretches... By the wrath of Mother Kos... Mercy
    for the poor, wizened child... Mercy, oh please... Atonement for the wretches... Lay the curse of
    blood upon them, and their children, and their children''s children, for evermore. Each wretched birth
    will plunge each child into a lifetime of misery. Mercy for the poor, wizened child... Let the pungence
    of Kos cling, like a mother''s devotion... Curse here, curse there. A curse for he, and she, why care.
    A bottomless curse, a bottomless sea, source of all greatness, all things that be. Listen for the
    baneful chants. Weep with them, as one in trance. And weep with us, oh, weep with us...].) **Self-Healing
    (At least Low-Mid; Able to heal wounds as severe as having its skull pierced and limbs broken) **Invisibility
    (Great Ones and Kin are completely invisible to those lacking Insight, or knowledge of their existence)
    **Power Bestowal (Great Ones are capable of granting mortals an array of supernatural powers, up to
    and including ascending them into Kin) **Mind Manipulation (Great Ones can impact human thoughts and
    actions without the humans'' knowledgeBloodborne: The Old Hunters Guidebook page 184) Resistance to:
    *Madness Manipulation (Type 3; Completely unaffected by the incomprehensible knowledge of the Eldritch
    Truth) *Poison Manipulation (Possesses an innate resistance to Slow and Rapid Poison) *Fire Manipulation,
    Temperature Manipulation, Magma Manipulation & Explosion Manipulation (Possesses an innate resistance
    to Fire-based attacks) *Electricity Manipulation (Possesses an innate resistance to electricity [bolt])
    *Magic (Possesses an innate resistance to Arcane damage) *Curse Manipulation & Blood Manipulation
    (Possesses an innate resistance to blood-based attacks.) *Mind Manipulation, Sense Manipulation &
    Morality Manipulation (Unaffected by the Shaman Bone Blade)'
