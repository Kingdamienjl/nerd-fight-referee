- id: claim-standard-equipment-a6040c5f
  section: equipment
  axis: equipment
  text: '| Blade of Mercy.jpg|Blade of Mercy Hunter Pistol.jpg|Hunter Pistol BloodVial.png|Blood Vial
    ThrowingKnife.png|Throwing Knife 65. Hunter Oath.png|Hunter 54. Beak Mask.png|Beak Mask 55. Crowfeather
    Garb.png|Crowfeather Garb 56. Crowfeather Manchettes.png|Crowfeather Manchettes 57. Crowfeather Trousers.png|Crowfeather
    Trousers *Blade of Mercy: A special trick weapon passed down among hunters of hunters. One of the
    oldest weapons of the workshop, it splits into two when activated. The weapon''s warped blades are
    forged with siderite, a rare mineral of the heavens. Most effective in swift attacks, such as after
    a quick-stepping. *Hunter Pistol: A pistol made at the workshop, for hunters stalking beasts. Hunter
    firearms are specially crafted to employ Quicksilver Bullets fused with the wielder''s own blood,
    boosting damage against beasts. The pistol is a quicker draw than the blunderbuss, allowing for speedier
    responses to attacks. *Blood Vial: Special blood used in ministration. Restores HP. *Throwing Knife:
    Throwing knife with a finely serrated blade. One of of the old hunter Henryk''s favorite weapons.
    Does not cause a great deal of damage to beasts, but with deft use, can distract attackers and keep
    them at bay. *Hunter: A Caryll Rune that transcribes inhuman sounds. This red-smudged rune means "Hunter,"
    and has been adopted by those who have taken the Hunter of Hunters oath. These watchmen admonish those
    who have become addled with blood. Be they men or beasts, anyone who has threatened the pledgers of
    the "Hunter" oath surely has an issue with blood. The Hunter Oath increases The Hunter''s stamina
    regeneration rate. *Crowfeather Set: Attire worn by Eileen the Crow, Hunter of Hunters, known in particular
    for her crowfeather cape. The beak of the mask contains incense to mask scents of blood and beast.
    Hunters of Hunters dress as crows to suggest sky burial. This set boasts high Blunt and Blood damage
    resistance, and the Beak Mask possesses the highest Frenzy resistance of any head attire. |}'
