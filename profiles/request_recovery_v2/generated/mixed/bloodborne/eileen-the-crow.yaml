- id: claim-powers-and-abilities-553aea54
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Immortality (Type 2 [Able to function unimpeded after receiving\
    \ injuries as severe as being impaled through the skull and torso and having organs ripped outVisceral\
    \ Attacks]) *Blood Manipulation/Absorption (Able to turn their own blood into ammunition and fuelBlood\
    \ Bullets as well as absorb the blood of defeated enemiesBlood Echoes) *Weapon Mastery (Skilled knife\
    \ wielder, swordsman, and marksman) *Martial Arts (Skilled in hand-to-hand combat) *Acrobatics *Empowerment/Statistics\
    \ Amplification (All Hunters are physically empowered by The Old Blood, and are able to further amplify\
    \ their strength through larger and larger amounts of Old Blood, though they cannot do so in combat)\
    \ *Damage Boost (Able to charge their physical attacks as well as attacks with their Right Hand Weapons\
    \ in order to deal increased damage) *Non-Physical Interaction (As The Hunter can harm Intangible/Incorporeal\
    \ beings and Ghosts with his weapons, The Bloody Crow should be likewise capable of killing creatures\
    \ like Mergo\u2019s Wet Nurse, the Bound Widow, and the Evil Labyrinth Spirit, who are merely disembodied\
    \ spirits, as well as the spirit of the Orphan of Kos) *Empowerment (Able to empower the Logarius\
    \ Wheel with the manifested rage of the Vilebloods) *Self-Healing (Low-Mid Via RallyRally and Blood\
    \ Vials. Blood Vials can instantly heal wounds as severe as being impaled through the torso, having\
    \ the skull pierced, or being Visceral Attacked by an enemy Hunter.) *Statistics Amplification (All\
    \ Attire grants the wearer varying degrees of increased physical durability) *Damage Reduction (All\
    \ Attire grants the wearer varying degrees of damage reduction against blunt and bladed/piercing attacks)\
    \ *Resistance to Poison Manipulation, Fire Manipulation, Temperature Manipulation, Magma Manipulation,\
    \ Explosion Manipulation, Electricity Manipulation, Magic, Curse Manipulation, and Blood Manipulation\
    \ (Possesses an innate resistance to both Slow and Rapid Poison, fire, electricity [Bolt], Arcane\
    \ damage, and blood-based attacks, which is further enhanced by his Attire.) *Resistance to Sleep\
    \ Manipulation (All hunters can resist the effects of the Blue Elixir which completely numbs the brainBlue\
    \ Elixir - Dubious liquid medicine used in strange experiments conducted by high ministers of the\
    \ Healing Church. A type of anesthetic that numbs the brain. Hunters, able to retain consciousness\
    \ by force of will, make use of a secondary effect of the medicine, which dilutes their presence while\
    \ standing still..) *Resistance to Mind Manipulation/Sense Manipulation/Morality Manipulation (Unaffected\
    \ by the Shaman Bone Blade)"
  source_ids: *id003
  decisive: true
