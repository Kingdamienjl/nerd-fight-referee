- id: claim-weaknesses-0a9f8416
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Rally: A core mechanic of a hunter''s fighting style,
    the ability to heal for part or all of the damage taken from a recent attack by retaliating with their
    own attacks. This allows a hunter to use an offense-centric, high risk/high reward style of combat,
    giving them the ability to sustain themselves by constantly attacking and counterattacking the enemy.
    However, this ability requires the opponent to be biological in some manner, as it is done in part
    by ''bathing in the opponent''s blood'' and does not work on inanimate targets or spirits. *Visceral'
  source_ids: *id003
