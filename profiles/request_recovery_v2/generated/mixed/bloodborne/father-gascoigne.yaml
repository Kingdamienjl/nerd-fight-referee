    \ their strength through larger and larger amounts of Old Blood, though they cannot do so in combat)\
    \ *Damage Boost (Able to charge their physical attacks as well as attacks with their Right Hand Weapons\
    \ in order to deal increased damage) *Non-Physical Interaction (As The Hunter can harm Intangible/Incorporeal\
    \ beings and Ghosts with his weapons, The Bloody Crow should be likewise capable of killing creatures\
