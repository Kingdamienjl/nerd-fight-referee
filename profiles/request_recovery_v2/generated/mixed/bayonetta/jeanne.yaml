    Attack Reflection (Via Moon of Mahaa-Kalaa), Duplication (Via Surgey's Lover), Immortality Negation
    (Type 4; Those devoured by greed are cut off from the cycle of death and rebirth), Disease Manipulation
    (This summon leaves trails of the plague), Resistance to Soul Manipulation (Her soul was left intact
    despite being absorbed over the course of twenty four hours by Alraune), Mind Manipulation/Madness
    Manipulation (Was unaffected by Alraune's insanity inducing poison being injected into her soul for
    almost a full twenty four hours), Time Manipulation, and Curses (Unaffected by the curse that her
    weapon Karen instills upon the user)
