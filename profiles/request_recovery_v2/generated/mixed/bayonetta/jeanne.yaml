- id: claim-standard-equipment-327f23e8
  section: equipment
  axis: equipment
  text: "| |-|Weapons From the First Game= All4OneNew.png|All 4 One OnyxRoses.png|Garnet Roses Angel Slayer\
    \ Transparent.png|Angel Slayer Vritra.png|Vritra Durga bayonetta render by shardraldevius-d9ivna1.png|Kali\
    \ Karen.png|Karen ColSlade.png|Col. Slade TangLung.png|\u5510\u9F8D -Tang Lung- BloodyMoon.png|Bloody\
    \ Moon *All 4 One: Jeanne's trademark four purple and silver guns. They are based on a Parabellum\
    \ pistol in design, though the barrel has been heavily modified to accommodate melee-based combat.\
    \ Four powerful handguns, crafted by the famed demon-smith, Rodin, and crowned with the names Athos,\
    \ Porthos, Aramis, and D'Artagnan. Pushing one's magical powers to their limits, these guns' rate\
    \ of fire and stopping power are incredible. *Garnet Roses: Shotguns containing the souls of fairies,\
    \ known to collect the Garnet Roses that only bloom in Inferno. Each shell fired from the guns contains\
    \ the curse of the fairies trapped souls. *Angel Slayer: A katana born in the unknown depths of Inferno,\
    \ brimming with mystery. One legend states that it is the twin sword to Shuraba. It is also said the\
    \ sword's name comes from the story of a witch who loved the sword, and was excommunicated for carrying\
    \ out a futile war against the angels. While the sword did not contain the soul of a demon, the Angel\
    \ Slayer displays incredible power. *Vritra:A possessed whip, sealing away the soul of the ancient\
    \ serpentine demon Vritra. Summoning the power of the demon from a portal on the weapon's hilt, it\
    \ can be used in the same manner as a normal whip. *Kali:The soul of Kali, said to be a demon with\
    \ a thousand arms, is imprisoned within these razor sharp claws. From the portal at its hilt, the\
    \ weapon can summon two types of arms, fire and lighting, to bear against enemies. *Karen:Cursed to\
    \ dance endlessly, Karen, banished to the icy hell of Cocytus, now finds her soul sealed within Rodin's\
    \ handiwork. The blades of these skates are able to release incredible cold, giving those skilled\
    \ in leg techniques frightening power; however, those without the power to fight the curse will find\
    \ themselves losing control of the skates and dancing endlessly until their death. *Col. Slade:A grenade\
    \ launcher containing the soul of Col. Slade, a man who traded his eyesight to a demon to save his\
    \ troops, only to be deceived by the hellish denizen and himself consigned to Inferno. Each shot fired\
    \ from the launcher's tube is filled with Col. Slade's endless malice. *\u5510\u9F8D -Tang Lung-:A\
    \ set of revolver-like guns linked together by what appears to be a small chain. Possessed by the\
    \ soul of the fastest bird demon in all of Inferno, Tang Lung, these nunchaku spin at blazing speed.\
    \ *Bloody Moon:An enigmatic weapon crafted by the Umbra Witches, this weapon is the pinnacle of their\
    \ moon-driven technology and can emit various colored blades depending on the demon held within. |-|Weapons\
    \ From the Second Game= Rasetsu.png|Rasetsu AlrunaRender.png|Alruna Rusalka.png|Rusalka Samsa.png|Samsa\
    \ Inferno Slayer.png|Inferno Slayer Yagyu.png|Yagyu Agni.png|Agni *Rasetsu: A mesmerizing, sharp-edged\
    \ pair of swords that seal the goddess of destruction and ruin, Rasetsu. When a female has these weapons\
    \ in her hands, demonic energy causes her power to increase tenfold and can send lost souls away from\
    \ this world to where they belong. *Alruna: A whip containing the soul of a demon who shares the same\
    \ name as a flower that blooms in Inferno. Laced with thorns, it slithers as if it were alive. Those\
    \ who can hear the crack of the whip can feel Alraune whisper its curse in their ears. *Rusalka: An\
    \ infernal weapon containing the souls of lonely water spirits, known as Rusalka, who failed to become\
    \ brides. The screams of their souls as they escape the machine are at times horrible flames of destruction,\
    \ or blizzards of the coldest temperatures. *Samsa: A bow containing the soul of a man who was transformed\
    \ into a poisonous insect, disowned by his family and cast into the depths of Inferno. The bugs decorated\
    \ across this bow are all alive, and constantly producing deadly toxins. Those struck by arrows from\
    \ this bow will be susceptible to sicknesses of all kinds. *Inferno Slayer: A scythe used by a sage\
    \ to hunt demons who wandered into human villages. His merciless killing of demon after demon earned\
    \ him the name Inferno Slayer by the villagers. Eventually, Rodin heard rumor that a demon in Inferno\
    \ possessed it; the weaponsmith claimed the scythe for himself, along with the soul of the demon.\
    \ The scythe was then given the name of its previous owner, and became an instrument for slaying demons\
    \ and angels alike. *Yagyu: True to its name, which means 'wild bull', this enormous hammer houses\
    \ a charm by the raging bull god Gozu. Some time ago, Rodin used this hammer during a fight to save\
    \ a certain planet in crisis. Despite Rodin's fine work, Bayonetta turned down the weapon, not finding\
    \ the name to her liking. Rodin felt he had no choice but to join the battle himself and put on a\
    \ personal display of its power. Rodi"
