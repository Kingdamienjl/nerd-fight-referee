  axis: hax
  text: '* Superhuman Physical Characteristics * Stealth Mastery, Martial Arts and Weapon Mastery (Has
    some decent knowledge in self-defence and marksmanship) * Regeneration and Healing (Mid-Low; Can regenerate
    from lacerations. Low-Mid with First Aid Med; Can reattach severed limbs and able to regenerate his
    heart) * Enhanced Senses (Via Psychostimulants) * Fire Manipulation (Via Burner and Flame Rounds)
    * Explosion Manipulation (Via Remote Bomb, Mine, Explosive Rounds and Rocket Pistol) * Poison Manipulation
    (Via Neuro Rounds) * Light Manipulation (Via Flashbang and LZ Answerer) * Durability Negation, Damage
    Boost, Damage Reduction and Life Manipulation (The LZ Answerer can change into different colours which
    give different abilities; Red gives more damage, Blue increases defence, Green can heal Ethan) * Limited
    Power Nullification (Via RAMROD ammo, they are able to inhibit a B.O.W''s regeneration capabilities)
    * High Pain Tolerance'
