- id: claim-weaknesses-82561ecd
  section: weaknesses
  axis: weakness
  text: 'Completely insane, highly overconfident in his regeneration. | Has seemingly lost his regenerative
    powers, dying from Joe Baker smashing his head. Notable Attacks/Techniques: *Mold: As a side effect
    of his infection by the Mold, Jack possesses superhuman strength far beyond what a man of his age
    and build should be capable of. He also possesses a regeneration factor, though he is on a whole different
    level as compared to the rest of the Baker family. He is nigh-invulnerable to conventional means of
    attacks, and attacks of greater power will only slow him down, such as getting shot in the head, blowing
    a hole through the right portion of his skull, being lit on fire, and engulfed in a fiery car explosion.
    He still comes back even when his upper body explodes following a fight with Ethan Winters, causing
    him to regenerate into a monstrous entity covered in Eveline''s contamination. ==Notable Matchups==
    Victories: Losses: Inconclusive: {{Discussions}} Category:Characters Category:Male Characters Category:Game
    Characters Category:Resident Evil Category:Regeneration Users Category:Parents Category:Possessed/Brainwashed
    Characters Category:Antagonists Category:Murderers Category:Monsters Category:Axe Users Category:Chainsaw
    Users Category:Weapon Masters Category:Transformation Users Category:Military Characters Category:Horror
    Characters Category:Martial Artists Category:Underwater Breathing Users Category:Tragic Characters
    Category:Game Bosses Category:Mutants'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
