    metal and an entire human body. Can create a wall of acidic mist that functions as a shield), Invisibility
    (Can enter several states of invisibility, the highest state completely cloaks him without reflecting
    light), Perception Manipulation (Basilisk appears to boost his perception, making his opponent appear
    slower while being faster than them), Aura (Can emit a noxious cloud of poison gas that intoxicates
    anyone too close to him)
  source_ids: *id003
  decisive: true
