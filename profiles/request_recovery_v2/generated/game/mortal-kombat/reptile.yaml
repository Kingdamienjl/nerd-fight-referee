    them, etc.), Can interact with his past self, but will share with it irreparable damage and death
    (As shown throughout MK11, but he should scale due to not existing outside the normal laws of time),
    Adhesive Manipulation (Can generate slime from his body, turning it into a projectile or as a propellant
    when sliding on it), Acid Manipulation (Can spit acid in varying amounts, from a small globule to
