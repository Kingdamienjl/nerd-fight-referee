- id: claim-powers-and-abilities-a8fc274d
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Uses a retractable arm blade), Extrasensory
    Perception (Can sense emotions such as anxiety), Flight (True flight. Can fly even in deep space),
    Immortality (Types 1 and 2), Acausality (Type 1. As an immortal, she exists outside the normal laws
    of time. In practice, this is the reason why Fire God Liu Kang was unaffected by his past self''s
    injuries and why Dark Raiden was erased when his past self was brought forth into the timeline), Self-Sustenance
    (Types 1 and 2), Preparation (Planned most of the events in the MK verse to benefit her, such as crafting
    Shang Tsung''s destiny to be a collector of souls, which Kronika plans to steal his collection in
    case she needs it), Social Influencing (Armed with enough knowledge on someone''s life, she can bribe
    others to be her ally by promising them a better life with her powers over time), Sand Manipulation
    (Can create sandstorms, blast others with sand, and manipulate the Sands of Time), Time Manipulation
    (Can slow down and reverse time on a local scale. Can stop time with a thought or with her projectiles,
    on a local scale), Intangibility (Elemental, Types 1 and 8, Can transform into energy or sand, allowing
    her to teleport), BFR (Transported Liu Kang to her Keep. Banished Shang Tsung, Fujin, and Nightwolf
    to the Void), Telekinesis (Can lift objects and destroy them without contact), Energy Projection (Can
    fire beams that can rewind and stop others in time. Can fire time projectiles that home in on targets.
    Can make explosive energy orbs), Creation (Can manifest a small hourglass), Portal Creation (Can summon
    portals to teleport herself and others through space), Soul Manipulation (Can absorb souls to increase
    her strength. From these souls are a great source of temporal energy. The amount of energy in a soul
    can vary depending on the soul''s lifespan when it was alive, usually measured in units of time),
    Animal Manipulation (Can call upon a T-Rex to fight for her), Aura, Healing (Can conjure a field that
    heals her when she stands on it), Forcefield Creation (Offensive/defensive type, can create a field
    that heals her and damages enemies), Earth Manipulation (Can create rocks and glass), Power Absorption
    (Absorbed Cetrion and her powers), Transmutation (Turned Frost into a cyborg), Power Bestowal (Gave
    Frost enhanced ice powers), Statistics Amplification (Can increase her strength from absorbing souls.
    Made Geras stronger than before after his first defeat. Made Revenant Jade, Kung Lao and Kitana strong
    enough to fight and temporarily defeat Fire God Liu), Cloth Manipulation (Changed the design of the
    Revenant''s clothes and Jax''s arms into her own design: white and gold), Resurrection (Can resurrect
    others by rewinding time on them, only to kill them again in a never ending loop), Resistance to Fire
    Manipulation (Tanked Fire God Liu''s flames which is capable of melting metal), Can also use the Hourglass
    and its powers'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
