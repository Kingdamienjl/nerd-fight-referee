- id: claim-weaknesses-9be05f22
  section: weaknesses
  axis: weakness
  text: 'Can be too confident in her design, causing her to overlook certain flaws that lead to her failure.
    Some non-canon endings imply that Kronika has gone mad over her futile attempts at achieving cosmic
    balance. Notable Attacks/Techniques: |-|Special Moves= *Ability 1: Kronika unleashes an explosion
    that releases two projectiles. The projectiles can wildly rewind opponents in time before stopping
    in place. *Ability 2: Kronika summons three orbs of sand that float around her. Nearby opponents will
    be struck down by these orbs. *Ability 3: Kronika creates a forcefield in her place or the opponent''s.
    The field will shield and heal Kronika if she is standing in it or harm her opponent if they are in
    it. *Ability 4: Kronika hurls three sand orbs that hit the opponent in quick succession. *Ability
    5: Kronika pulls a mysterious blue orb from the ground that shoots four energy blasts. *Ability 6:
    Kronika pulls a mysterious blue orb from the ground that fires a beam with the same effects as her
    first ability. *Ability 7: Kronika teleports away from sight and summons a massive Tyrannosaurus rex
    that tramples the opponent. *Ability 8: Kronika teleports behind, in front, or away from the opponent.
    *Ability 9: Kronika teleports and damages opponents in her destination. |-|Fatalities= *Boss Fatality:
    Kronika lifts the opponent with telekinesis and leaves them suspended. She proceeds to snap them in
    half at the waist before rewinding time, reviving them. Second, she rips them in half again but in
    a vertical way before rewinding time to revive them. Lastly, she flays them of their skin and rewinds
    time again. Kronika then repeats all three actions in an endless loop. ==Gallery== kronika keep.jpg|Kronika''s
    Keep and her Hourglass in the center. ==Notable Matchups== Victories: Losses: Inconclusive: ==Statistics
    Values== {{Discussions}} Category:Characters Category:Game Characters Category:Mortal Kombat Category:Gods
    Category:Primary Antagonists Category:Antagonists Category:Evil Characters Category:Female Characters
    Category:Fighting Game Characters Category:Game Bosses Category:Final Bosses Category:Sociopaths Category:Murderers
    Category:Leaders Category:Tricksters Category:Parents Category:Thieves Category:Flight Users Category:Sand
    Users Category:Time Users Category:Intangibility Users Category:Elemental Intangibility Users Category:BFR
    Users Category:Teleportation Users Category:Telekinesis Users Category:Energy Users Category:Homing
    Attack Users Category:Summoners Category:Creation Users Category:Portal Users Category:Explosion Users
    Category:Soul Users Category:Absorption Users Category:Enhanced Senses Users Category:Animal Users
    Category:Aura Users Category:Healers Category:Forcefield Users Category:Earth Users Category:Transmutation
    Users Category:Power Bestowal Users Category:Statistics Amplification Users Category:Immortals Category:Self-Sustenance
    Users Category:Cloth Users Category:Preparation Users Category:Social Influencers Category:Resurrection
    Users'
  source_ids: *id003
  decisive: false
