- id: claim-powers-and-abilities-5c7eb164
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts (Doesn''t practice a specific fighting style,
    but she does use several martial art techniques), Extrasensory Perception (Can sense emotions), Flight,
    Immortality (Types 1 and 2), Acausality (Type 1. As an immortal, she exists outside the normal laws
    of time In practice, this is the reason why the likes of Fire God Liu Kang was unaffected by his past
    self''s injuries and why Dark Raiden was erased when his past self was brought forth into the timeline),
    Self-Sustenance (Types 1 and 2), Elemental Manipulation (Cetrion represents and can control the elements
    of nature: including Fire Manipulation, Magma Manipulation, Explosion Manipulation, Water Manipulation,
    Ice Manipulation, Air Manipulation, Weather Manipulation, Earth Manipulation, Plant Manipulation,
    Metal Manipulation, Vibration Manipulation, etc.), Telekinesis (Can manipulate opponents and objects
    from a short distance), Body Control (Her "living tendrils" are a part of her body, which she can
    extend and use as weapons), Life Manipulation (Her presence can give life to plants and animals),
    Light Manipulation (Not combat applicable, but she can emit a blinding light from herself), Energy
    Projection (Can fire a powerful energy beam from her hands), Forcefield Creation (Some of her elemental
    fields can provide her protection, like a field that throws rocks at anyone attacking her and a field
    that pushes opponents away with wind), Teleportation (Can teleport herself by turning into water and
    reforming somewhere else), Clairvoyance (Intro dialogues suggests that she knows about Sub-Zero''s
    dream of being in the Injustice universe, as well as knowing that it wasn''t a dream), Likely possesses
    Avatar Creation, Possession, and Healing (In MK9''s climax, The Elder Gods appeared as dragons who
    possessed Raiden and restored his badly beaten body. They then used his body as a catalyst for their
    power to destroy Shao Kahn It is unknown if this is still canon, as the Elder Gods were treated as
    a group of beings with the same powers rather than individuals like Cetrion who was not yet conceived
    in MK9''s story), Resistance to Fire Manipulation (Took hits from Fire God Liu Kang''s flames, which
    is capable of melting through metal)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
