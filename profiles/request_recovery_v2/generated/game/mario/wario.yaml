- id: claim-standard-equipment-27e6260b
  section: equipment
  axis: equipment
  text: 'Several Transformations and items grant him abilities such as: *Flight *Shapeshifting & Power
    Mimicry (With Mario and Luigi caps) *Statistics Amplification *Invisibility *Fire Manipulation *Invulnerability
    *Creation *Weather Manipulation *Enhanced Senses (Sight; As Genius Wario, he can see invisible doors,
    blocks, and platforms with his goggles) |-|Power Stars= All abilities of his Base enhanced. *Statistics
    Amplification (Power Star users are stated to grow stronger the more stars they collect) *Healing
    (Power Stars can heal accumulated damage done to the user) *Purification (Type 2; Defeating Bowser
    and his troops brought peace back to the world, shown to be due to power stars. Toad also states that
    life is returning to the castle thanks to the power of the Stars) *Dimensional Travel (Powers Stars
    allowed him to return from the paintings he entered inside Peach''s castle) *Sealing Negation (Power
    Stars can remove the seals placed on the castle doors by Bowser) *Black Hole Creation (Power Stars
    have been shown to be capable in creating and containing black holes) *Existence Erasure (Power Stars
    are composed of Mini Stars, which are capable of erasing the physical bodies of opponents)'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-7c32b329
  section: power_scale
  axis: battle_iq
  text: Extraordinary Genius. While he's often portrayed as simple-minded, Wario can create inventions
    in a brief period of time, such as an inter-dimensional travel device in order to enter a TV show's
    reality. Although not having previous software experience, Wario started Wario Ware, Inc. and his
    first minigame release was a huge financial success. Wario's shown to be a skilled pilot, being able
    to operate spaceships, fighter jets, biplanes, motorcycles, go-karts, attack submarines, and mechas.
    Furthermore, Wario was able to conquer Mario's realm by hypnotizing all of its people and even potential
    players through a magic spell into turning against their hero.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-8a31146e
  section: weaknesses
  axis: weakness
  text: 'Wario is extremely greedy and sometimes lets his nature overtake him, causing him to go out of
    control occasionally, even going as far as to double-cross his friends. Wario-Man''s strength and
    speed randomly change every time he transforms, and he can even be weaker than his normal self, to
    a point where he unable to break a toaster with his bare hands. Because of his hot-headed and clumsy
    personality, Wario doesn''t consistently use his intelligence to the fullest as he''s been easily
    tricked and hardly ever uses strategy. Notable Attacks/Techniques: *Dash'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3abce1dd
  section: abilities
  axis: hax
  text: 'Base= *Superhuman Physical Characteristics *Underwater Breathing (Type 2) *Self-Sustenance (Type
    1) *Fourth Wall Awareness *Vehicular Mastery *Acrobatics *Explosion Manipulation (Can create explosions
    by farting) *Earth Manipulation (Can create small earthquakes with his Ground Pound) **Vibration Manipulation
    (Can generate shockwaves by simply by punching the ground) *Non-Physical Interaction (On occasion,
    he''s able to harm ghosts) *Genius Intelligence *Duplication (Can create a clone himself) *Immortality
    (Type 3; It has been stated that he is immortalThe Wario Land II manual) *Regeneration (High-Mid;
    Capable of instantly regenerating from just his eyes after being incinerated in the WarioLand games)
    *Sleep Manipulation (Can induce sleepiness with hypnosis) *Mind Control *Electricity Manipulation
    *Energy Manipulation & Projection *Self-Perception Manipulation (via Zone Speed) **Afterimage Creation
    (Can leave behind afterimages with Zone Speed) *Telekinesis *BFR (Via Inhale) *Power Absorption (Most
    of his enemies'' attacks end up giving him his forms) *Resistance to: *Diseases, High Heat & Extreme
    Cold (Has travelled in areas such as The Toxic Landfil, Fiery Cavern and 40 Below Fridge without problems)
    *Cosmic Radiations *Black Holes'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
