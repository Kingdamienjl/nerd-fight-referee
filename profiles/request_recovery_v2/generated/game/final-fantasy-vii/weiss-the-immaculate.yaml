- id: claim-standard-equipment-01c1bef3
  section: equipment
  axis: equipment
  text: 'Weiss Swords Artwork.png|Design of Heaven and Earth by Tetsuya Nomura 7doc-omega-o.jpg|The Omega
    Weapon DC Omega Weiss 1.jpg|Design of Omega Weiss Doc Omega Artwork.png|Design of Omega DC Omega Weiss
    Head 1.jpg|Details of Omega Weiss *Heaven and Earth: Weiss dual katana model Gunblades, build for
    him by a fellow Deepground member called Argento. Weiss mostly uses them for powerful attacks and
    swift combos, but they are also capable of gunfire and combining with Weiss'' Spirit Energy for special
    moves. *Omega Weapon: One of the Weapons, guardians of the world created of the Planet itself as a
    countermeasure to fight off Jenova and other threats. The Omega Weapon is unique in that it would
    activate only when the Planet is on the verge of death, and has the mission of taking the Lifestream
    itself and leaving the Planet itself behind to search for a new suitable world and preserve the life.
    Hojo, by possessing Weiss'' body, managed to force the awakening of Omega, and thanks to Weiss'' body
    lacking Jenova Cells and his incredible strength, he made a perfect host. However, as Nero''s spirit
    merged with Weiss this purity was tainted and Hojo was purged from his body. Weiss still managed to
    control and merge with Omega, which can take the form of a large dark colored armor armed with large
    limbs and many projectiles. Weiss can also detach himself from Omega to attack directly before having
    to restore the connection.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-dc10e032
  section: power_scale
  axis: battle_iq
  text: Genius. As a former SOLIER and the leader of Deepground, Weiss is an extremely experienced combatant,
    having been in battle pretty much his entire life and displaying fearsome skill in all of his fights.
    Beyond direct conflict, Deepground also involved missions including espionage, reconnaissance and
    intelligence, all of which Weiss could perform effectively. Weiss is also shown to be a capable and
    charismatic leader, having orchestrated along with his fellow Tsviets the rebellion to overthrow the
    Restrictors' tyrannical rule and seize control of Deepground, which not only involved fighting, but
    also manipulation and espionage, as well as sharing Shelke's ability of using the Synaptic Net Dive
    and competent use of digital technology and information gathering. Additionally, despite having little
    familiarity with it, he could effectively control the Omega Weapon and its powers to confront Vincent
    in their final battle, despite being defeated
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-b52bb5f7
  section: weaknesses
  axis: weakness
  text: 'As his not undeserved title of "The Immaculate Emperor" suggests, Weiss is a fearsome warrior,
    which leads him to be rather arrogant and boisterous during battle. Not helping is that he gets genuine
    enjoyment of a good fight, which leads to sometimes prolonging encounters simply because he''s having
    fun. Notable Attacks/Techniques: |-|Weiss the Immaculate= *Flash Step: Due to his overwhelming physical
    capabilities, Weiss can move so fast it appears he is teleporting around when in reality he is just
    too fast for the eyes of even warriors like Vincent to follow. *Doppelganger: Like Nero, Weiss is
    able to create duplicates of himself which can attack his enemies. *Streaking Swords: With a swing
    of each of his blades, Weiss sends two energy beams through the ground to his opponent. *Homing Energy
    Blast: Using his Spirit Energy, Weiss can shoot energy projectiles from his blades that home on his
    enemies. *Grand Shockwave: Weiss slams the ground creating a massive shockwave and several smaller
    explosions following it. *Synaptic Net Dive: Using a properly adapted device, Weiss, like Shelke the
    Transparent can project his consciousness in the digital currents of the Worldwide Network. While
    the ability has more elaborate uses, such as entering and gathering the memories of other people,
    projecting one''s own as images into other people''s minds, manipulating the perception and creating
    and implanting false memories, Weiss only known instance of using this ability was to gather information
    from the Worldwide Network to find information on how to cure the virus implanted in him. This led
    to the digital spirit of Hojo be able to find his body and eventually make his way into it. |-|Omega
    Wei'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-9ad280b8
  section: abilities
  axis: hax
  text: 'Weiss the Immaculate=Superhuman Physical Characteristics; Master Swordsman; Expert Martial Artist;
    Acrobatics; Enhanced Reflexes; Energy Manipulation to achieve different effects: Energy Projection,
    Homing Attack and Shockwave Generation; Duplication; Digital Projection, Information Manipulation,
    Sense Manipulation and Memory Manipulation (like Shelke the Transparent, Weiss can use the Synaptic
    Net Dive to project his mind into digital planes and the minds of others, alter and create fake memories,
    and make them see images and memories from different people, however, it requires a specially adapted
    machine and needs to focus on its operation to do so, making it not combat applicable). Resistance
    to Mind Manipulation and Corruption (Type 2) (Despite constant contact with Mako, he never suffered
    Mako Poisoning nor did he become a Makonoid from exposure); Electricity Manipulation (was kept imprisoned
    with chains and a high-voltage current, yet he was never hurt by it) |-|Omega Wei'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
