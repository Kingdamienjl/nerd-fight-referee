    Menat performs a cartwheel and hits the opponent with two kicks. *Judgement of Anubis: Menat performs
    a split, sliding towards the opponent and strikes them with the tip of her foot. *Khamun Kick: Menat
    jumps in the air, stops her momentum and delivers a kick while descending in a corkscrew-like motion.
    |-|Throws= OverflowingNile.gif|Overflowing Nile PyramidHopscotch.gif|Pyramid Hopscotch *Overflowing
    Nile: Menat pushes the opponent back with her crystal ball, then leaps and strikes the ball with a
    dropkick, driving it onto their face. If the crystal ball isn''t available to her, Menat will use
    her telekinesis to push the opponent and hit them with the same dropkick. *Pyramid Hopscotch: Menat
    grabs the opponent and places her hands on the back of their head, then uses both arms to push herself
    upwards and deliver a knee strike to her crystal ball, which is driven on their nose. She follows
    up by landing on the opponent and stomping their face, causing them to fall down while she smoothly
    returns on the ground. If the crystal ball isn''t available, Menat''s knee strike hits the opponent
    directly, while the rest of the throw remains unchanged. |-|Special Attacks= SoulSphere.gif|Soul Sphere
    SoulSphereEX.gif|Soul Sphere EX SoulSphereEX2.gif|Soul Sphere EX II SoulSphereEX3.gif|Soul Sphere
    EX III SoulSphereAnkh.gif|Ankh GuardianOfTheSun.gif|Guardian of the Sun GuardianSunEX.gif|Guardian
    of the Sun EX SoulSparkMenat.gif|Soul Spark *Soul Sphere: Menat charges up her crystal ball with Soul
    Power, then shoots it at the opponent. She can also choose at which direction firing it. The first
    EX version features Menat shooting the ball towards the opponent''s feet, catching one of them with
    it and causing them to lose balance; after that, the ball is brought behind their back and used to
    push them towards Menat, leaving them open to further attacks and combos. The second EX versions consists
    in the crystal orb being fired at the opponent''s chest and then attached to it through telekinetic
    force; Menat calls back her crystal ball, bringing along the opponent, who is then striken on the
    midsection by the same ball once they stop. The third EX version is an anti-air attack, as Menat fires
    her orb towards an airborne opponent, who gets hit in the stomach and then driven down onto the ground,
    with the crystal ball still below their body. **Ankh: If the crystal ball is left lingering around
    after performing Soul Sphere, Menat can imbue it with Soul Power from distance and call it back to
    her, damaging the opponent while travelling. *Guardian of the Sun: Menats leaps and grabs an airborne
    opponent, bringing them down with her while holding them over her crystal ball. She then imbues the
    ball with Soul Power and tosses away the opponent. The EX version sees Menat charging the ball with
    even more Soul Power and dealing more damage. *Soul Spark: If the crystal ball is left around the
    battlefield, Menat can charge it with Soul Power and generate a small energy explosion, before calling
    the ball back to her. |-|Super Attacks= *The Nefertem: Menat imbues her crystal ball with Soul Power
    and sends it towards the opponent. If it connects, Menat enters a cat-like stance and starts performing
    a belly dance while surrounded by a Soul Power aura. While she dances, her crystal ball flies around
    and repeteadly strikes the opponent from multiple directions, until Menat bends her body backwards
    and stretches her leg upwards, causing the orb to strik the opponent''s chin, for a final hit that
    sends them flying. center|335px |-|V-Techniques= LEotL.gif|Left Eye of the Lion SistrumV.gif|Sistrum
    of Fortune Kamal.gif|Soul Reflect - Kamal SoulStella.gif|Soul Reflect - Stella SoulReflectAbsorb.gif|Soul
    Reflect MenatReflect.gif|Soul Reflect MenatSoulSpiral.gif|Soul Spiral WisdomOfThoth.gif|Wisdom of
    Thoth WoT2.gif|Wisdom of Thoth II ProphecyOfThoth.gif|Prophecy of Thoth *Left Eye of the Lion: After
    blocking an attack, Menat curls on herself and teleports behind the opponent, regardless of the distance
    between them. *Sistrum of Fortune: Menat quickly dashes backwards to dodge an incoming attack and
    replies with a quick, powerful donkey kick that strikes the opponent before they are able to react,
    knocking them down. *Soul Reflect: Menat creates a forcefield, which can either absorb projectiles
    (if Menat doesn''t have her crystal ball at hand) or reflect them (if the crystal ball is available).
    **Kamal: The standard type of forcefield, created when Menat is standing up. **Stella: A'
