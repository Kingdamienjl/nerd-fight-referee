    toward his opponent with wind covering his body *Eagle Spike: Rashid does a small jump and propels
    himself toward his opponent with a flying kick *Whirlwind Shot: Rashid spins and kicks, seinding a
    small twister that spirals upwards a small distance in front of him |-|Super Attacks= *Altair: Rashid
