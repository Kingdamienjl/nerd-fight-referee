- id: claim-weaknesses-b1c29260
  section: weaknesses
  axis: weakness
  text: 'Relies on her seismic sense to know her surroundings, can''t swim, and is blind without her bending.
    Notable Attacks/Techniques: *Sandbending: Using her Seismic Sense, Toph is also capable of bending
    sand, using it for both offensive and defensive purposes as she would use earth. Although initially
    described as loose and hard to bend, Toph has gained proficiency in bending sand to a degree as well
    as her regular Earthbending. She can also condense the sand for easier bending. *Metalbending: Using
    her Seismic Sense, Toph is able to detect the earth particles within metals, and can, therefore, bend
    metal for her own use. Most Earthbending techniques are available in Metalbending. During her time
    with the Metalbending Police Force, she also used the metal as a method of transport in the form of
    a grappling hook. However, Toph cannot bend highly refined materials, such as platinum. *Seismic Sense:
    is a sub-skill of earthbending that constitutes for physical sense. This skill enables Toph and earthbenders
    to detect vibrations in the ground to perceive objects, people, and other aspects of their environment,
    essentially acting as sonar, but through earth and metal. *Earth and Stone Levitation: The most common
    attack involves levitating nearby pieces of earth and stone of numerous sizes (more powerful benders
    can move larger masses) and propelling them at foes with punching or kicking motions. *Earth Block:
    Earthbenders can bring up blocks of earth and launch them at their enemies. The Dai Li used this technique
    against Team Avatar during the Day of Black Sun. *Earth Column: A more powerful version of rock projectiles,
    involving forcing columns of rock out of the ground. Using a similar principle, an earthbender can
    shoot a stream of small ruts and protrusions from underground at their opponent. This can also be
    used to enhance the benders'' jumps. It is, however, limited to the ground and does not have the same
    range as a rock projectile. *Earth Compression: It is possible for earthbenders to compress large
    chunks of rock into smaller, denser chunks, or to compress several smaller chunks into one big piece
    of rock. Haru and his father, Tyro, used this technique, compressing several small pieces of coal
    into one big coal boulder. The fact that two earthbenders were required to perform it suggests that
    this technique is quite difficult. *Earth Gauntlet: A much less advanced version of earth armor that
    can be used to throw back opponents with hard solid force. Aang used this technique when fighting
    against Azula on the drill. The technique is useful in that it grants some level of the protection
    of earth armor but allows the rest of the body to remain flexible. *Earth Hand/Mannequin: An earthbender
    with a decent grasp of sculpting can craft replicas of human appendages or bodies from any rock source
    and move them from place to place. While playing King of the Hill, Toph made a large hand to grab
    and toss Aang to the side. When Toph was pretending to be Fire Lord Ozai as part of a training exercise,
    she used this technique to simulate the Fire Lord''s bodyguards. *Earth Launch: While earthbenders
    like being rooted to the ground, with some like Toph being unable to see in the air, they can quickly
    move rock beneath them and launch them several tens of feet into the air, whether to catch airborne
    opponents or to travel faster. Toph and Bumi did this during the battle at Wulong Forest and the liberation
    of Ba Sing Se, respectively. Bolin has shown to be able to launch himself into the air with Earthbending,
    as was seen when he escaped the Earth Queen''s palace. *Earth Line: As an offensive attack, earthbenders
    can create a line of twisted columns and propel it forward. *Earth Material Manipulation: Earthbending
    is not limited to rock or soil alone. An earthbender can also manipulate coal, gems, crystals, and
    other earth-based materials, like meteorites and jennamite. *Earth Shelter: This can be used by earthbenders
    to create a shelter or dome which can provide an instant shelter in the wilderness. Toph often created
    shelters like these to sleep in while the Team Avatar was traveling and used it to create a safe place
    where a pregnant woman could give birth.It can also be used to trap enemies, but this application
    would not work against an earthbending opponent, who would be able to cancel out the technique. *Earth
    Sinking: More advanced earthbenders, such as The Boulder, Master Yu,and General Fong, can forcibly
    sink their opponents into the ground, imprisoning them or even suffocating them in earth. This technique
    was used by General Fong to subdue Katara. *Earth Smash: Earthbenders can easily destroy rocks and
    boulders with punches and kicks, even if they have a small amount of muscle mass. This technique is
    useful when facing other earthbenders, as it allows the earthbender to destroy any earthen projectiles
    sent at them and break out of imprisoning techniques. However, it does not seem to affect objects
    not made of earth'
  source_ids: *id003
