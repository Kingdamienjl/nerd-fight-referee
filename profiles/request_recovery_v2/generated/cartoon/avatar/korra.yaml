- id: claim-powers-and-abilities-45be8f5a
  section: abilities
  axis: hax
  text: 'Base and Avatar State= Superhuman Physical Characteristics, Immortality (Type 4), Chi Manipulation
    (Chi is the source of a user''s bending), Airbending, Flight, Waterbending (With any phase of water),
    Healing, Earthbending (With any phase of earth), Lavabending (After losing access to her past lives,
    she may no longer know this technique), Surface Scaling, Magnetism Manipulation, Metalbending, Firebending,
    Lightning Redirection (She is likely to have lost this technique after losing access to her past lives),
    Energybending (Can manipulate another person''s life energy to impart them with knowledge instantly,
    remove one''s bending completely, or restore it), Empowerment (Enhanced firebending from Sozin''s
    Comet), Underwater Breathing (Type 2 in the avatar state, Type 4 in baseline and the avatar state),
    Extrasensory Perception (Could see her dark spirit self when no other human could; can lock onto people''s
    spiritual presence through spirit vines), Statistics Amplification (With the Avatar State), Forcefield
    Creation, Limited Sound Manipulation, Light Manipulation, Astral Projection (Able to go to the Spirit
    World in this state), Intangibility and Invisibility during astral projection in the physical world,
    Regeneration (Only for her disembodied spirit in the Spirit World), Spiritbending (She learned Unalaq''s
    signature Waterbending technique, which can purify, cleanse and destroy spirits. Using Spiritbending,
    she cleansed and killed Unalaq merged with Vaatu. Energybending reaches into the soul of the target),
    Purification and Chaos Manipulation with Spiritbending, Limited Matter Manipulation with Spiritbending
    and Energybending, Paralysis Inducement with Spiritbending, Limited Reality Warping while in the Spirit
    World, Possible Clairvoyance (Should be capable of witnessing events in the future like her past lives
    could, similarly to how Roku informed Aang about the return of Sozin''s comet, but it''s unknown if
    Korra maintains this skill after losing the link to her past lives), Summoning while in the Spirit
    World (The Dragon Bird spirit knows where she is and can sense when she''s in trouble), Non-Physical
    Interaction (Can interact with spirits), Self-Sustenance Type 2 and Type 3, Dimensional Travel (She
    can meditate into the Spirit World from any location), Limited Space-Time Manipulation (used energy
    bending to bend the energy of Kuvira''s Colossus''s spirit energy cannon to create a new spirit portal
    between the physical and spiritual worlds) and resistance to it (Korra and Kuvira were at the epicenter
    of the spirit energy cannon''s explosion, which created a new spirit portal and blasted them into
    the spirit world in the process, and she protected herself and Kuvira without being effected by it),
    Sealing and Forcefield Creation (She can combine all 4 elements together into an elemental sphere,
    creating a barrier from it, and was used originally to seal Vaatu away in the Tree of Time The Legend
    of Korra Book 2: Spirits - Beginnings, Part 2; The Avatar also naturally has the ability to seal entrances
    shut without being able to be accessed, as seen hereATLA Book One: Water - Winter Solstice, Part 2:
    Avatar Roku), Power Nullification and Power Bestowal with energybending, Durability Negation, Attack
    Reflection, Divine Union (Able to unite with spirits), Teleportation while in the Spirit World, Resistance
    to Memory Manipulation, Mind Manipulation, Madness Manipulation, Illusion Creation, Fear Manipulation,
    and Soul Manipulation due to past lives and Raava (4 layers of soul resistance until she loses her
    past lives, after which the resistance is baseline. By the time of Avatar Yangchen, the Avatar is
    unaffected by the effects of the Fog of Lost Souls. Broke out of Hundun''s illusions after becoming
    Spirit Korra), Resistance to Bloodbending and Body Puppetry (Baseline in base; to an unknown degree
    in the avatar state. Aang was able to resist bloodbending on Yakone''s level), Limited Resistance
    to Poison (In the avatar state), Resistance to Temperature Manipulation (Airbenders can use their
    breathing to resist cold temperatures), Resistance to Power Nullification with the avatar state, Multiple
    Selves (The Avatars were all described to be part of a single flameThe Shadow of Kyoshi; Chapter 26),
    Possible Death Manipulation with energybending (Once the process of energybending is successful, the
    avatar has multiple options available to them, including possibly killing the target), Conceptual
    Manipulation with Energybending. (By the end of the series, Raava has informed Korra that she can
    control all spiritual energy. Light and darkness are regarded as a form of spiritual energy; Jinora
    gathering the remaining light was able to make Raava interactable by Korra) |-|Cosmic'
