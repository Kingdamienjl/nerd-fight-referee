- id: claim-powers-and-abilities-5c7da603
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics (Nimbly evaded Team AvatarATLA Book Three: Fire\
    \ - The Day of Black Sun, Part 2: The Eclipse), Expert Martial Artist and Combatant (Can outfight\
    \ Suki in close combat.ATLA Book Two: Earth - Appa's Lost Days Fought off Season 2 Aang and Zuko simultaneously.\
    \ Kept up with Suki and Ty Lee at the same timeSmoke and Shadow, Part 3), Chi Manipulation (Chi is\
    \ the source of a user's bending), Firebending (Azula is notably able to create blue flames, which\
    \ are more intense than the standard flames used by most other firebendersAvatar: The Last Airbender\u2014\
    The Art of the Animated Series, page 87.), Heat Manipulation (Superior to Season 1 Zuko who melted\
    \ through an ice binding created by Katara.ATLA Book One: Water - The Siege of the North, Part 1 As\
    \ a \u201CFirebending prodigy\u201DATLA Book One: Water - The Siege of the North, Part 2 able to generate\
    \ blue fire she should be superior to Kiyi who melted a hole in a steel door, with Kiyi being a small\
    \ child with no formal training), Breath Attack (Can breathe fireATLA Book Three: Fire - Sozin's Comet,\
    \ Part 4: Avatar Aang), Forcefield Creation (Can enclose herself with a barrier of fire), Lightning\
    \ Manipulation (Can create and discharge deadly lightning bolts. Can also generate lightning in different\
    \ manners, such as spheresThe Search, Part 1 and multiple bolts at once. Can channel and redirect\
    \ lightning), Limited Flight (Can propel herself through midair with her flamesATLA Book Three: Fire\
    \ - The Boiling Rock, Part 2), Explosion Manipulation (Her fire attacks can induce explosions), Non-Physical\
    \ Interaction (Bending can interact with spirits), limited Attack Reflection, Weapon Creation (Can\
    \ create weapons out of fire such as daggers), Smoke Manipulation (Creates a smokescreen), Stealth\
    \ Mastery (Able to make stealthy disappearances while using smoke to disorient foes), Social Influencing\
    \ (Was able to successfully seize control the Dai Li from Long Feng and convince them to pledge loyalty\
    \ to her through sheer intimidation, despite Long Feng being the most feared man in Ba Sing Se and\
    \ the Head of the Dai Li at the time), Empowerment (Enhanced Firebending from Sozin's Comet), Resistance\
    \ to Heat (Created a fiery explosion in a clash with Zuko and emerged unscathed. Can withstand attacks\
    \ from other Firebenders), Resistance to Blood Manipulation and Body Puppetry (Every human has a chi\
    \ field that makes taking control of their body difficult to accomplish)."
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
