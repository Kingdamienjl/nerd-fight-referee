    \ Morality & Biological Manipulation ([https://imgur.com/Ok314Hm Tentacles passively\
    \ distort emotions and body parts, either of which amplifies the other even further,\
    \ causing them to become maddened monsters of destruction;] [https://imgur.com/DDFORaz\
    \ destabilizes the mind; reduces mental and physical capacity by 10\u201330%;]\
    \ [https://imgur.com/YDG8Snt and forces them to] [https://imgur.com/69JBDdw become\
