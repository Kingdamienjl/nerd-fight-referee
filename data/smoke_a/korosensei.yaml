- id: claim-weaknesses-5d269908
  section: weaknesses
  axis: weakness
  text: "The Reaper (Pre-experiments)= None notable. Korosensei (Post-experiments)=\
    \ He has many weaknesses, but not all of them are combat applicable. For a full\
    \ list, see here * He is easily distracted by breasts.Assassination Classroom;\
    \ Volume 2; Chapter 8 * His body is incredibly absorbant, especially with water.\
    \ If he gets wet, his body swells up and he becomes much slower.Assassination\
    \ Classroom; Volume 6; Chapter 44 This is why he can't swim without a protective\
    \ suit.Assassination Classroom; Volume 6; Chapter 45 Extremely high humidity causes\
    \ a similar effect.Assassination Classroom; Volume 3; Chapter 23 * Whenever he\
    \ uses molting or regeneration it consumes a lot of his stamina making him slower.Assassination\
    \ Classroom; Volume 4; Chapter 31 * If his heart, hidden underneath his neck tie,\
    \ is completely destroyed, he will die immediately.Assassination Classroom; Volume\
    \ 15; Chapter 132 * He doesn\u2019t have much brute strength, so if all of his\
    \ tentacles are grabbed at once, he would be unable to escape.Assassination Classroom;\
    \ Volume 15; Chapter 126 * When exposed to certain frequency of light his body\
    \ goes rigid making him unable to move for several seconds.Assassination Classroom;\
    \ Volume 4; Chapter 30 * Once he assumes Absolute Defense Form, he cannot move\
    \ for 24 hours.Assassination Classroom; Volume 7; Chapter 60 Vulnerable to anti-sensei\
    \ weapons. None otherwise. {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
    \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
    2\" style=\"text-align: left; |Notable Attacks/Techniques: |- | The Reaper (Pre-experiments)=\
    \ File:Clap-stunner (The practical version).gif Clap-Stunner: A typical stun clap\
    \ has three conditions that must be met for it to be used effectively: # The user\
    \ must have more than one weapon. # The opponent must be skilled at combat. #\
    \ The opponent must have experienced the feeling of facing death at some point\
    \ in the past.Assassination Classroom; Volume 9; Chapter 71 However, The Reaper,\
    \ being the world's most skillful assassin ever lived, does not need to fulfill\
    \ any of the conditions. Without even needing his two hands, he can use the clap\
    \ stunner to his liking. According to data books: A loud enough yell of his or\
    \ hammering a concrete surface with a shoe are also enough for him to use this\
    \ skill of his. File:Scythe 1.png File:Scythe 2.png The Invisible Scythe of The\
    \ Reaper: The 'Invisible Scythe' is the Reaper's unique secret weapon, which he\
    \ usually uses to the surprise of his target. Using both his understanding of\
    \ the human body and his kinetic vision to see the gap between muscle and boneAssassination\
    \ Classroom; Volume 13; Chapter 109 on the target in motion from far away,Assassination\
    \ Classroom; Volume 16; Chapter 139 he fires minuscule projectile that cannot\
    \ kill under normal circumstances through said gap, ripping the target's aorta,\
    \ causing excessive bleeding from the target's heart.Assassination Classroom;\
    \ Volume 13; Chapter 109 His prot\xE9g\xE9 modified his body and inserted a small\
    \ gun into his fingertip to replicate this skill, but the original Reaper is capable\
    \ of using grains of sand he picked from the ground to use this skill of his.Assassination\
    \ Classroom; Volume 16; Chapter 139 Human Reading=File:People Reading-Discernment.gif\
    \ People Reading/Discernment: The ability to read people's expressions and intentions\
    \ with ease. There are also a use of detecting if a person is lyingAssassination\
    \ Classroom; Volume 6; Chapter 47 or not being entirely truthful.Assassination\
    \ Classroom; Volume 6; Chapter 46 This ability allows its user to analyze a person's\
    \ state of mind simply by looking at them, reading their breathing, line of sight,\
    \ facial expression, body language, and more on a subconscious level, and illustrating\
    \ it as \"wavelengths\" or \"wavelengths of consciousness\" in front of their\
    \ eyes. Allowing its user to find a person's \"color in consciousness,Assassination\
    \ Classroom; Volume 13; Chapter 112\" or their next move, whether or not it will\
    \ be safe for him to assault the target, \"gaps in consciousness,Assassination\
    \ Classroom; Volume 13; Chapter 112\" or openings in their guard, as well as their\
    \ \"peak in consciousness,Assassination Classroom; Volume 12; Chapter 103\" or\
    \ the state of mind in which a person is highly susceptible to outside stimuli,\
    \ such as the Clap Stunner. Korosensei (Post-experiments)= Absolute Defense"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
