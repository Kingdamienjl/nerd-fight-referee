    \ a week. Unable to trust anyone but himself, he used anything and anyone to polish\
    \ and expand his own potential, be it intelligence to beat the strong, power to\
    \ beat intelligence, or humanly charm to disarm both. There is no escape for his\
    \ target unless he is surpassed in every way. He is a person who believes in very\
    \ few things, and death is one of the most genuine of them. To give death, which\
    \ he believes in, he honed his skills to an inhumane extent. His sheer precision\
    \ is at the level where he can deal with billions to trillions of minuscule projectiles\
    \ at once, being capable of catchingAssassination Classroom; Volume 20; Chapter\
    \ 175 or dodgingAssassination Classroom; Volume 3; Chapter 23 them; despite the\
    \ fact that in both situations he was severely handicapped, and each of his skills\
    \ is so sophisticated that even after years and years of training under him, his\
    \ prot\xE9g\xE9 still could not reach the heights of his predecessor, resorting\
    \ to cheap imitationsAssassination Classroom; Volume 13; Chapter 109 of the originalAssassination\
    \ Classroom; Volume 16; Chapter 139, and it is canonically noted he wouldn't reach\
    \ that height for another 10 years.Assassinatio"
  source_ids: *id003
  decisive: false
