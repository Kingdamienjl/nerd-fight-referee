  intelligence:
    text: Gifted. Despite his brutish appearance, Franklin is surprisingly mature, calm and well-spoken.
      He is easily one of the most mature members in the Troupe, rarely getting into heated debates such
      as Phinks or Uvogin. Thanks to his ability to maintain his cool in dire situations, Franklin has
      proven to be a reliable decision-maker and counselor for his fellow Spiders. His calm allowed him
      to pacify the group during Chrollo's absence, exposing the flaws in Shalnark's reasoning to show
      how much the Troupe relied on their leader. Franklin is also a no-nonsense individual, and prefers
      not to waste effort, explaining to Ittoku why he was simply waiting instead of looking for Hisoka,
      reasoning that since Hisoka was looking to kill them all he would simply need to wait for him. Additionally,
      as a Troupe member, Franklin is a world-class Nen user who should exhibit far greater mastery than
      most people in his Nen type should, as he can effortlessly slaughter other highly skilled Emitters
      like Shachmono Tocino, and as a founding member of the Troupe, should have years of experience in
      combat.
