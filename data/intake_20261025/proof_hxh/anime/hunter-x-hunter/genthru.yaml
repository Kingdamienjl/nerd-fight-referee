- id: claim-weaknesses-1b2bf999
  section: weaknesses
  axis: weakness
  text: Underestimates his opponents who are physically weaker and inexperienced, needs to touch opponent
    to use Little Flower and needs to use Gyo to cover his hands when using explosions, which can give
    away whether he will use Little Flower or not in a particular instance to those that know of this.
    He must touch the target and say "Bomber" as a condition to activate Countdown. Genthru must explain
    his ability Countdown as a condition for activation. Victims can disable Countdown by making physical
    contact with Genthru and saying the phrase "I caught the bomber." Zetsu involves keeping one's aura
    exclusively in the body, it makes a Nen User more vulnerable to physical and Nen attacks, because
    one doesn't have any aura on the outside of one's body to protect oneself.
  source_ids: *id003
