- id: claim-weaknesses-a37fe2d9
  section: weaknesses
  axis: weakness
  text: The more dolls he produces, the weaker they get. Physical contact is enough to distinguish the
    smoke puppets from real bodies. As he emits his aura for his smoke puppets, Morel is unable to fight
    at full strength if he has any smoke constructs in use. Should Morel lose his tobacco pipe, he will
    lose most of his abilities as he requires smoke for his Nen ability. Zetsu involves keeping one's
    aura exclusively in the body, it makes a nen user more vulnerable to physical and Nen attacks, because
    one doesn't have any aura on the outside of one's body to protect oneself.
