      thought patterns efficiently. He can devise effective strategies in a matter of instants, always
      exploiting his or his students' capabilities to the fullest. According to Shaiapouf, his determination,
      unshakeable will, and confidence in himself bolster his defensive powers greatly. Also, Morel's
      years of experience can unconsciously lead him to pick the best option. He can keep his cold blood
      in extremely dangerous situations.
