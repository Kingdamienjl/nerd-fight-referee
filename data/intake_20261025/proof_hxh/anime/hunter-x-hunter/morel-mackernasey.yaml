- id: claim-powers-and-abilities-684dd6ce
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulation (Manipulator; Morel has a huge mass of aura
    which according to Knuckle is 70,000 which is over 3x that of a neutral Gon), Master Hand-to-Hand
    Combatant (Is a veteran Nen user and is the master of Knuckle Bine and Shoot McMahon), Weapon Mastery
    (Morel can use his pipe as a melee weapon to great effect), Smoke Manipulation (Morels primary Hatsu
    is to manipulate smoke which he can shape into innumerable different constructs), Duplication and
    Transmutation with Deep Purple (Morel is able to transmute his aura into smoke. Morel can shape the
    smoke into any object, such as rope, grass, hoses, rafts, rabbits and dolls. Morel is also able to
    create convincing replicas of himself and others capable of speech and combat. The maximum amount
    of dolls he can create is 216, and by sacrificing quantity for quality, the dolls can become stronger.
    Since no combustion is involved, he can produce smoke even underwater), Forcefield Creation (Morel
    can create a barrier made of smoke, which is seemingly indestructible), Limited Poison Manipulation
    (Morel can exhale vast amounts of carbon dioxide, which will gradually poison an enemy), Limited Invisibility
    (Morel is capable of changing the colour of his smoke to blend into his surrounding), Statistics Amplification
    (Morel is able to make his smoke constructs virtually indestructible by modifying their durability),
    Enhanced Psychometry (His smoke functions as En, which is how Morel isn't blinded by the smokescreen)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
