- id: claim-weaknesses-c33c2709
  section: weaknesses
  axis: weakness
  text: Zetsu involves keeping one's aura exclusively in the body, it makes a Nen user more vulnerable
    to physical and Nen attacks, because one doesn't have any aura on the outside of one's body to protect
    oneself. Meleoron's Nen ability will not protect him from any physical harm. Even if the enemy can't
    detect him, an accidental attack could wound or even kill Meleoron without the enemy even realizing
    it. Since he is a heavy smoker, he has been detected by scent but is adept at concealing it when it's
    necessary. He is a pacifist, and does not enjoy fighting.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
