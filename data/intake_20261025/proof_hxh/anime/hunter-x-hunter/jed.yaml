- id: claim-powers-and-abilities-cc58c931
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Type 4; His grudge was so powerful it was able
    to resurrect his soul and physical body despite it being destroyed by Netero, however, this is non-combat
    applicable because he didn't resurrect until his disciples called for him which implies he must be
    "awoken"), Master Martial Artist (His martial prowess was comparable to that of Netero), Body Control
    (Jed can control the size and age of his body), Blood Manipulation (Jed can control his blood and
    bestows his power through it. If one so much as touches his blood then they lose their abilities to
    use Nen and must either embrace On and make a contract with Jed or die), Biological Manipulation (Touching
    Jed's blood causes one's eyes to completely change and their veins become purple), Corruption (Type
    1; Through his blood Jed can completely strip people who cannot resist of their willpower), Power
    Nullification (Touching his blood makes you unable to use Nen at all), Mind Manipulation and Body
    Puppetry (Through On, Jed was able to manipulate all the Floor Masters barring Zushi into attacking
    Gon and Killua), On Manipulation (On is the more powerful counterpart to Nen and is treated as the
    "death energy" whilst Nen is "life energy". A user of On is able to use all Nen categories at 100%
    proficiency including Specialisation), Power Bestowal (He can grant On to others through his blood;
    the stronger the contract you form with Jed, the more power you gain), Law Manipulation and Death
    Manipulation (Jed imposed restrictions and a contract upon his disciples. For instance he set the
    restriction that if one of his followers lose to a Hunter they die), Creation and Energy Manipulation
    (Similar to Netero's Hatsu, Jed's Rakshaso is a conjured Nen construct), Aura and Energy Projection
    (Jed can project his On which effortlessly blew back Gon and Killua, his flair of aura was enormous
    and shook the whole Heaven's Arena building), Weather Manipulation (Jed's On influenced the weather
    causing thunderstorms and lightning)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
