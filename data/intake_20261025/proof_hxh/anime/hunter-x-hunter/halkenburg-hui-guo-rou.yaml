  intelligence:
    text: Genius. Halkenburg is repeatedly shown as one of the most intelligent princes in his entire
      family. He attended the most prestigious university in the world at the age of 15, showcasing his
      extreme academic skills, and should have given him considerable knowledge in physics. He was commended
      by Kurapika for his brilliant academic achievements even among his siblings, which would make his
      intellect comparable to Tserriednich Hui Guo Rou. He is a physician and was able to come up with
      theories to discern how his Guardian Nen Beasts abilities work after just discovering Nen. He is
      presumably one of the best archers in the world, winning a silver medal in the world championships.
      Halkenburg has also shown many traits that define a good King, as he is extremely charismatic and
      has many supporters, and has also proven himself to be brilliant at both strategy and analysis.
      Additionally, his Guardian Spirit also appears to be the most intelligent Spirit shown, as it can
      recognize Nen users who are able to perceive it and can instantly tell which ones harbor ill will
      towards its host.
    source_ids: *id002
    confidence: 0.95
