- id: claim-intelligence-f4fc5f14
  section: power_scale
  axis: battle_iq
  text: Genius. Halkenburg is repeatedly shown as one of the most intelligent princes in his entire family.
    He attended the most prestigious university in the world at the age of 15, showcasing his extreme
    academic skills, and should have given him considerable knowledge in physics. He was commended by
    Kurapika for his brilliant academic achievements even among his siblings, which would make his intellect
    comparable to Tserriednich Hui Guo Rou. He is a physician and was able to come up with theories to
    discern how his Guardian Nen Beasts abilities work after just discovering Nen. He is presumably one
    of the best archers in the world, winning a silver medal in the world championships. Halkenburg has
    also shown many traits that define a good King, as he is extremely charismatic and has many supporters,
    and has also proven himself to be brilliant at both strategy and analysis. Additionally, his Guardian
    Spirit also appears to be the most intelligent Spirit shown, as it can recognize Nen users who are
    able to perceive it and can instantly tell which ones harbor ill will towards its host.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-5d40cc61
  section: weaknesses
  axis: weakness
  text: He was a pacifist who didn't want to participate in the Succession War however he has since then
    hardened his resolve and is now aiming to the next King. As a parasitic-type, Halkenburg is unable
    to perceive his Guardian Spirit and the Spirit cannot directly attack another Spirit or the host of
    one.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-57308d02
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Social Influencing (His Nen abilties
    are based on his extreme charisma which can cause people to stake their lives for him), Master Marksmanship
    (Is one of the best Archers in the world and is proficient with handguns), Limited Nen Manipulation
    (Unknown; Likely a Manipulator due to how he influenced his Guardian Spirit Beast. Has shown great
    proficiency with Enhancement, Transmutation, Emission and Manipulation. He can at least use the four
    basic techniques), Forcefield Creation (Halkenburg is able to harness the aura of his subordinates
    wearing the Guardian Spirit Beast''s mark and turn it into unmatched armor to protect himself), Weapon
    Creation, and Transmutation with "Possession Arrow" (Halkenburg is able to harness the aura of his
    subordinates wearing the Guardian Spirit Beast''s mark and turn it into an arrow), Durability Negation
    (He can then fire an arrow capable of piercing any and all defenses), Resistance Negation (The arrow
    can pierce through anything including Nen abilities that would ordinarily be able to stop an enemy
    ability, until it makes contact with the target), Possession and Soul Manipulation (The arrow injects
    the consciousness of his soldiers into the body) Superhuman Physical Characteristics, Nen Manipulation
    (Enhancer; Halkenburg''s personality influenced the Guardian Spirit Beast and it also has proficient
    Manipulator abilities), Natural Weaponry (It can shoot its feathers as projectiles), Sleep Manipulation
    (Everyone who receives the conjured mark is knocked unconscious), Memory Manipulation (And upon awakening,
    will have their memories modified so they forget passing out, with the exception of the Prince), Power
    Bestowal and Statistics Amplification (Bearers of the crest are half-awakened to Nen: they possess
    a greater amount of aura than normal, but are unable to see it. The more of them gather around the
    prince, the more their aura can grow; when everyone in the group shares the same will, the force released
    rises to the top tier of all Nen abilities), Law Manipulation (Places restrictions upon whoever it
    marks), Intangibility, Incorporeality and Invisibility (All Guardian Spirit Beasts are invisible to
    the host and any non-Nen users)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
