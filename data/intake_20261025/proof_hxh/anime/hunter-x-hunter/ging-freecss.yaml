- id: claim-powers-and-abilities-60dd8298
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Analytical Prediction, Master Hand-to-Hand
    Combatant (Ging used to spar with Isaac Netero and can cause hallucinations with his fist alone),
    Nen Manipulation (Unknown Category; Ging is one of the top five Nen users in the world according to
    Netero therefore he should have mastery of all the basic and advanced techniques and high proficiency
    most if not all Nen categories), Limited Power Mimicry and Power Modification (Copied Leorio's Remote
    Punch perfectly after seeing it once. He claims that he generally can mimic other peoples striking
    abilities as long as he has been hit with it. He derived multiple other abilities from Leorio's Remote
    Punch), Enhanced Extrasensory Perception (Ging is capable of releasing his aura in pulses and achieves
    similar effects to ultrasound, though it is harder to detect than En; Ging was able to sense Nanika
    heal Gon whilst all the other hunters barring the Zodiacs couldn't sense it), Transmutation (Transmuted
    his aura into bubbles), Technology Manipulation (By emitting aura into a tape recorder, Ging made
    it so that the message automatically deletes itself upon hearing it), Metal Manipulation (Manipulated
    steel plates into forming an indestructible box that could only be opened with Nen), Limited Adaptation
    (Was unaffected by the low oxygen levels and cold temperatures on top of the World Tree), Energy Projection
    and Durability Negation (Ging is able to shoot projectiles of aura, which have selective intangibility
    being able to travel through objects without damaging it. It can attack within the body without damaging
    the outside, derived from Leorio's Remote Punch and ideas behind his Hatsu, which Ging mused), Limited
    Law Manipulation (As a Game Master of Greed Island, it can be presumed Ging and various others made
    use of limitations and conditions to create the game)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
