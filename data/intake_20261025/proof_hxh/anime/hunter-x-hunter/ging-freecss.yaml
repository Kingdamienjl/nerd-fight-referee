  intelligence:
    text: Genius. One of the smartest characters ever featured in the series, Ging is a polymath with
      extensive knowledge in various fields of academic studies. He is a Double-Star Hunter who is qualified
      for a Triple-Star ranking, which is only reserved for people who have made significant breakthroughs
      or revolutionized certain fields of study. He has foreseen most of Gon's choices and actions since
      leaving home, including his participation in the Hunter Exam, his journey to Greed Island and his
      meeting with Kite. He also guessed correctly what the process to decide the rules of the election
      would be and ensured his own would win, outmaneuvering the rest of the Zodiacs. His predictions
      regarding the election for the new chairman of the Hunter Association were accurate and even Cheadle,
      despite disliking him and being extremely smart herself, asked him for advice. He manipulated Leorio,
      a person he knew nothing of, so that he could become a hindrance to Pariston's victory, which he
      did. Furthermore, when Ging got rid of the Nen users from Muherr's party at the underground level
      and was going back up to the castle, he pointed out to Pariston that if he wants to see his abilities
      he has to come at him rather than building up badly designed self-serving scenarios, showing his
      superiority as a battle analyst even in times of conflict. It can be affirmed that Ging's preeminent
      mental skills are his deductive intelligence, quickness of mind and versatility.
    source_ids: *id002
    confidence: 0.95
