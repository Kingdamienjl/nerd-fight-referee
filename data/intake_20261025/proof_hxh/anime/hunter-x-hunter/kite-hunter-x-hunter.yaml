  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulation (Conjurer; Kite is a powerful Nen user.
    He can use all the basic and advanced techniques), Master Hand-to-Hand Combatant, Afterimage Creation,
    Weapon Mastery (Kite can use blunt weapons, firearms, scythes, and swords), Limited Animal Manipulation
    (Like Gon, Kite is good with animals), Subjective Reality and Summoning (Kite's can conjure a clown
    called Crazy Slots, which conjures a random weapon from 1-9), Limited Smoke Manipulation with Scythe
    (When conjured, his Scythe produces smoke), Resurrection (Ging stated that Crazy Slots was how Kite
