- id: claim-weaknesses-912f3aa1
  section: weaknesses
  axis: weakness
  text: Kite cannot dispel a weapon given by Crazy Slot unless he uses the weapon. The weapon generate
    is completely random and Kite has no say on what he gets. With his scythe, he can only use one move,
    Silent Waltz. Zetsu involves keeping one's aura exclusively in the body, it makes a Nen user more
    vulnerable to physical and Nen attacks, because one doesn't have any aura on the outside of one's
    body to protect oneself.
  source_ids: *id003
  decisive: false
  status: unverified
