    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) * Hand-to-Hand Combat Mastery (Is a trained killer,
        and frequently competes with Batman in combat) *Empowerment (Venom enhances
        Bane''s strength and durability) *Size Manipulation (Using Venom increases
        his size) *Stealth Mastery (Got the drop on Dick Grayson, who is trained in
        detection) *Preparation (Exhaustively studied Batman and his fighting style
        to formulate a surefire method of defeating him) In his second key, he has
        showcased all his prior abilities, as well as: * Superhuman Athleticism (Leapt
        inhumanly high during Rise of Sin Tzu) * Shockwave Creation (During Rise of
        Sin Tzu, one of his boss battle attacks is slamming the ground so hard it
        creates a shockwave and jars loose small stalactites from the ceiling of the
        Batcave)'
      source_id: character-stats-profiles-bane-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Small Building Level normally (Scaling to 0.095 Tons - As per the multipliers
        outlined here, should scale to about 1/4 of his TNBA self's maximum output,
        and is likely equal to his TNBA self considering his base form isn't noted
        to have grown stronger in the timespan between B:TAS and TNBA. Put his fist
        through the stone wall of a sewer even prior to administering Venom), and
        Small Building Level+ while using Venom (0.19 Tons - Bashed apart several
        large stone walls, which was calculated here. Warped the Batmobile's armored
        exterior with his bare hands. Is the most powerful adversary that B:TAS Batman
        had ever fought, which includes the likes of Clayface. Fought Killer Croc,
        one-sidedly beating him down and hospitalizing him. Overtly stronger than
        Batman, knocking him around during their battle. Knocked out Dick Grayson
        with a hold. As a Peak Human enhanced by Venom, he should be at least comparable
        to the (relatively) normal people who amped themselves with Venom patches
        in Batman Beyond - said people, when amped by the patches, were strong enough
        to harm Batman II, as shown in these three examples) | Small Building Level
        normally (Scaling to 0.095 Tons - During his boss fight in Rise of Sin Tzu,
        his attacks harm Batman even prior to him administering Venom, and he similarly
        harms the Dark Knight during Mystery of the Batwoman before he is shown to
        administer Venom. Is many times stronger than an average man, and with a single
        punch tore a large metal punching bag off the chain holding it up, sending
        it flying across a large room into pipes hard enough to rupture them. Burst
        through the side of a huge wooden crate), and Building Level with Venom (0.38
        Tons - Is twice as strong due to refining his Venom formula. Regarded, by
        the official strategy guide for Rise of Sin Tzu, as the strongest boss thus
        far in the game - that would include TNBA Clayface. During Rise of Sin Tzu,
        one of his post-Venom boss battle attacks is slamming the ground so hard it
        creates a shockwave and jars loose small stalactites from the ceiling of the
        Batcave. Smashed through a wall)
      source_id: character-stats-profiles-bane-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Hypersonic (Scaling to Mach 8.7), possibly Relativistic+ (Scaling to
        0.53c) reactions and combat speed (Has tagged both Batman and Killer Croc.
        Reacted to and caught a punch from Dick Grayson. Caught Batman's thrown Batarang
        out of the air) - this applies to both keys, as Bane is never referenced as
        having become faster by enhancing his Venom.
      source_id: character-stats-profiles-bane-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Small Building Level without Venom (Scaling to his AP as per Newton's
        Third Law), Small Building Level+ with Venom (0.19 Tons - Should be capable
        of withstanding the force of his own blows. Can tank a kick from Batman. Should
        be just as, if not more durable than a Venom-patch-enhanced Jackson Chappell,
        who could take hits from Batman II with little trouble. As a Peak Human with
        enhanced durability, should be more durable than Amanda Waller (who was unhurt
        by this explosion) and 13-year-old Tim Drake, who shook off a hit from incomplete
        Clayface, whose kicks could shatter a stone bench) | Small Building Level
        normally (Scaling to 0.095 Tons - Can keep fighting after blows from Batman),
        and Building Level with Venom (0.38 Tons - Since Venom enhances durability
        along with strength, it stands to reason his refined venom doubled his durability
