      source_id: character-stats-profiles-bane-rebirth-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Removing his "Venom tubes" will lessen his strength - that, and it is
        possible to trigger an overdose on his Venom, which could kill him. Otherwise,
        normal human weaknesses. Note: Bruce Timm has stated that the original DCAU
        tie-in comics are not canon, with the only tie in comics that have statements
        to the contrary (other than Batman: The Adventures Continue, which has so
        many continuity issues that it''s essentially impossible to argue it''s canon)
        being Justice League Infinity, the Batman and Harley Quinn tie in comics,
        and specifically the first annual of Batman Adventures. Ergo, I only consider
        those three comics canon. Category:Tier 9 Category:Goulden1998 Category:Tier
        8'
      source_id: character-stats-profiles-bane-rebirth-dc
