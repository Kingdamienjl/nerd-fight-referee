    - field: weaknesses
      value: "Because Captain Atom is afraid of the powers he has and the bad things\
        \ he can do, he has installed a series of barriers in his own mind that prevent\
        \ him from accessing his powers. Notable Attacks/Techniques * Hold back: Captain\
        \ Atom holds back for a variety of reasons, be it his internal conflict, or\
        \ his fear of becoming a God again. In addition, if he doesn't hold back,\
        \ he could bring about the death of countless people. * Matter and energy\
        \ over fists: Captain Atom rarely ever fights physically, as he has no need\
        \ for it. Instead, he fights by using his energy and matter-related powers\
        \ as they do the job much better. * Absorption: When faced with attacks, Captain\
        \ Atom will try to absorb as much as of it as he can, so the damage to the\
        \ people and environment around him is minimized. In addition, he can draw\
        \ upon those powers to enhance his own abilities. ** BFR: As Monarch, sometimes\
        \ he would simply remove his enemies from the battlefield rather than waste\
        \ time on them. ** Quantum Field: By manipulating the Quantum Field, Captain\
        \ Atom is able to control time, space, energy, and matter at will. His energy\
        \ absorption is potent enough to overcome foes significantly more powerful\
        \ than himself, such as Nekron. ** Big Bang: Captain Atom is also able to\
        \ control incredible amounts of energy, being able to catalyze another Big\
        \ Bang if he so wished. *** Energy over matter: Captain Atom's primary method\
        \ of attack is energy manipulation. He has more control over its output compared\
        \ to his other destructive abilities. Even when battling in melee combat,\
        \ he prefers to employ energy in any way he can. Category:Ya\u015FarPrime\
        \ Category:Tier 2 Category:Tier 1 Category:Unknown Tier"
