    - field: weaknesses
      value: 'Teleportation: Dracula''s favored strategy, used to confuse his enemy
        while he casts a myriad of offensive spells. Some versions of his teleporting
        has him blending to black lights, others turns him into many bats, but the
        function and strategy is one and the same., Hellfire: Fires a wall of fireballs
        from his cape. Another version causes flames to erupt from the floor., Power
        of Dominance: Dracula''s primary ability allows him to absorb defeated monster''s
        souls and enslave them. This power was the one that Soma Cruz, Dracula''s
        incarnation, inherited along with Dracula''s soul. While Soma can only summon
        monsters for a short amount of time due to his low magical power, Dracula
        can fully utilize this ability with infinite power from the stream of Chaos
        he commands., Dark Inferno: Fires magma fireballs from his cape. Unlike Hellfire,
        the meteors produced by this spell cannot be destroyed., Dark Metamorphosis:
        Boosts Dracula''s Blood draining ability. He can bite an enemy or grasp them
        and drain their life. He rarely does the latter though, Soul Steal: : A spell
        that many fear. Soul Steal is used by Dracula and to kill and absorb their
        energy for Dracula''s use. The one version of the spell has an area of effect
        around the caster. It can effect multiple victims multiple times in one cast.
        Another version drains the life out of Dracula''s victims by a mere touch,
        which is why many fear this spell. It is also referred to as Life Steal.,
        Blood Storm: Perhaps as a way of mocking of the Belmonts'' powers, could make
        it rain blood, Meteors: During the events in Circle of The Moon, Dracula displayed
        various powerful magic spells, one of which summons a barrage of flaming meteors
        to rain down from the sky onto his enemy., Dominus Hatred / Fatal Ray: Dracula
        summons seven green rays of dark energy that fly upward from his body. After
        a moment, the rays fall, covering the entire area although leaving some spaces
        between where the player can dodge them. He uses this attack in various games,
        including Castlevania Chronicles and Castlevania: Portrait of Ruin, although
        its most prominent appearance is in Castlevania: Order of Ecclesia., Destruction
        Ray: A dire version of the Fatal Ray. Dracula summons seven purple rays of
        dark energy that fly upward from his body, but this time they fall following
        the player''s movement., Dark Void: Dracula''s favored move. He teleports
        becoming a black mist and many bats appearing anywhere he desires. Its best
        to do multiple Dark Voids to confuse enemies., Demonic Meggido: Dracula''s
        ultimate dark spell. Two version of this attack are in existence. The first,
        and more common version has a shorter charging time and allows Dracula to
        charge demonic runes that become a giant black fireball. Dracula can throw
        it to his victim and will incinerate his victims with demonic fire. The second
        version is a gigantic explosion, with Dracula as its nucleus. The explosion
        radiates from him, dealing heavy damage with high likelihood of killing his
        opponent. However, the second version requires a longer time to charge, giving
        enough time to either escape or defeat him before he can use it while draining
        Dracula''s health. On Order of Ecclesia it is shown that Dracula can sustain
        it for as long as desires, while in Harmony of Despair its effect is shown
        to cease, with locations such as Brauner''s paintings appearing in the animated
        series and are treated as alternative worlds'
