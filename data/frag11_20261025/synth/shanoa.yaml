    - field: weaknesses
      value: 'Dominus Agony can take him over, Max Shot, Agartha: Albus main way of
        attacking and using his various Glyphs are through his gun Agartha. It can
        shoot rapidly and indefinitely as long as Albus has enough magic to support
        it, it doesn''t need bullets or projectiles as it is mainly powered through
        Magic. Albus can also combine his Glyphs and shoot them out from Agartha,
        though this is not limited by the gun as he can use Glyphs independently from
        it, Glyph Mastery: Albus can fire a variety of Glyphs from Agartha the same
        way as Shanoa fires her Glyph from her arms, though Albus prefers Acerbatus,
        Torpor: Agartha can fire a Torpor Glyph that incapacitates its victim in a
        crystal cage. It has the longest cooldown in Albus''s arsenal. It is an Ice
        based Glyph., Optical Shot: Agartha can also fire a magic wave of black and
        white. The light wave will spiral into where Agartha marks before released
        as an outward spiral in an opposite direction. The black and white light waves
        do either light or dark damage, depending on the opponent. Along with Max
        Shot, it has the second longest cooldown. It is also called Vertical Shot.,
        Max Shot: A powerful Glyph. Agartha can fire an Acerbatus Glyph that curses
        the victim, shocks with electrical damage, and consumes the enemy in darkness.
        Albus inserts the Acerbatus Glyph into Agartha''s barrel, launching a large
        black ball of darkness with yellowish skulls. Along with Optical Shot, it
        has the second longest cooldown. It is also called Casper Shot. While battling
        him, he says " Glyph in Bullet!", Quad Ignis: Albus also masters a spinning
        flame kick which does a ton of damage and is easily one of his strongest attacks,
        though it is entirely melee based and has almost no horizontal range., Warp:
